    <script>
        const WORKER_URL = "https://bhashya-audio-worker.anantachaitanya108.workers.dev";
        const BUCKET_NAME = "prakarana";

        const manifest = [{"id": "B_000000", "originalText": "श्रीमच्छङ्करभगवत्पूज्यपादविरचितम्\n\nहस्तामलकीयभाष्यम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_000000.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000001", "originalText": "यस्मिन्ज्ञाते भवेत्सर्वं विज्ञातं परमात्मनि। तं वन्दे नित्यविज्ञानमानन्दमजमव्ययम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_000001.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000002", "originalText": "यदज्ञानादभूद्द्वैतं ज्ञाते यस्मिन्निवर्तते। रज्जुसर्पवदत्यन्तं तं वन्दे पुरुषोत्तमम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_000002.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000003", "originalText": "यस्योपदेशदीधित्या चिदात्मा नः प्रकाशते। नमः सद्गुरवे तस्मै स्वाविद्याध्वान्तभानवे॥", "padacchedaText": "", "audioFile": "PB_hear2read_000003.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000004", "originalText": "इह हि सर्वस्य जन्तोः सुखं मे भूयाद्दुःखं मे मा भूयात् इति स्वरसत एव सुखोपादित्सादुःखजिहासे भवतः।", "padacchedaText": "", "audioFile": "PB_hear2read_000004.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000005", "originalText": "तत्र यः कश्चित् पुण्यातिशयशाली अवश्यंभाविदुःखाविनाभूतत्वादनित्यत्वाच्च विषयजं सुखं दुःखमेवेति ज्ञात्वा यत्नेन ससाधनात्संसारात्त्यक्तासक्तिरत्यन्तं विरज्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000005.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000006", "originalText": "विरक्तश्च संसारहानौ यतते।", "padacchedaText": "", "audioFile": "PB_hear2read_000006.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000007", "originalText": "संसारस्य च आत्मस्वरूपापरिज्ञानकृतत्वात् आत्मज्ञानान्निवृत्तिरिति तं प्रत्यात्मज्ञानमाचार्य उपदिशति—\nनिमित्तं मनश्चक्षुरादिप्रवृत्तौ\nनिरस्ताखिलोपाधिराकाशकल्पः।", "padacchedaText": "", "audioFile": "PB_hear2read_000007.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000008", "originalText": "रविर्लोकचेष्टानिमित्तं यथा यः\nस नित्योपलब्धिस्वरूपोऽहमात्मा॥ १॥", "padacchedaText": "", "audioFile": "PB_hear2read_000008.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000009", "originalText": "ननु सर्वत्र ग्रन्थादौ शिष्टानामिष्टदेवतास्तुतिनमस्कारपूर्विका प्रवृत्तिरुपलब्धा, अयं च विना स्तुतिनमस्कारौ प्रवर्तमानोऽशिष्टत्वात् अनादरणीयवचनः प्रसज्येतेति चेत्— न, स्तुतिनमस्कारयोस्त्रैविध्यात्, त्रिविधौ हि स्तुतिनमस्कारौ— कायिकौ वाचिकौ मानसिकौ चेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000009.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000010", "originalText": "तत्र कायिकवाचिकयोरभावेऽपि परमशिष्टत्वादाचार्यस्य ग्रन्थस्य अविघ्नेन परिसमाप्तेश्च मानसिकौ स्तुतिनमस्कारावकरोदयमाचार्य इत्यवगम्यते, यत्किञ्चिदेतत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000010.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000011", "originalText": "प्रकृतमनुसरामः— मनश्च चक्षुश्च मनश्चक्षुषी, ते आदिर्येषां तानि मनश्चक्षुरादीनि, आदिशब्दः प्रत्येकमभिसम्बध्यते, ततश्च अयमर्थो भवति— मनआदीनां मनोऽहङ्कारबुद्धिचित्तानां चतुर्णामन्तःकरणानाम्, तथा चक्षुरादीनां चक्षुस्त्वक्श्रोत्रजिह्वाघ्राणानां पञ्चबुद्धीन्द्रियाणाम्, एवं वाक्पाणिपादपायूपस्थानां पञ्चकर्मेन्द्रियाणाम्, प्रवृत्तौ स्वस्वव्यापारे, निमित्तं हेतुः यः, सोऽहमात्मेति सम्बन्धः।", "padacchedaText": "", "audioFile": "PB_hear2read_000011.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000012", "originalText": "स कीदृश इत्याकाङ्क्षायामाह— नित्योपलब्धिरिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000012.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000013", "originalText": "नित्या च असावुपलब्धिश्चेति नित्योपलब्धिः, सा स्वरूपं यस्य स तथोक्तः।", "padacchedaText": "", "audioFile": "PB_hear2read_000013.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000014", "originalText": "रविः आदित्यः यथा येन प्रकारेण प्रकाशकत्वेन लोकानां चेष्टायां स्पन्दने निमित्तं हेतुः, तथैव अधिष्ठातृत्वेन यो निमित्तं सोऽहमात्मेत्यर्थः— इति इयं दृष्टिः आत्मज्ञानोपायत्वेन दर्शिता।", "padacchedaText": "", "audioFile": "PB_hear2read_000014.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000015", "originalText": "परमार्थतस्तु निरस्ताः निराकृताः अखिलाः निरवशेषाः उपाधयो बुद्ध्यादिलक्षणाः यस्य स तथोक्तः। निरस्ताखिलोपाधित्वादेव अयमाकाशकल्पः आकाशवद्विशुद्ध इत्यर्थः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000015.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000016", "originalText": "ननु मनश्चक्षुरादिप्रवृत्तौ किमर्थमधिष्ठाता इष्यते? स्वयमेव कस्मान्न प्रवर्तन्ते? कथं च नित्योपलब्धिस्वरूपत्वम् अधिष्ठातुरिष्यते? इत्यत आह—\nयमग्न्युष्णवन्नित्यबोधस्वरूपं\nमनश्चक्षुरादीन्यबोधात्मकानि।", "padacchedaText": "", "audioFile": "PB_hear2read_000016.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000017", "originalText": "प्रवर्तन्त आश्रित्य निष्कम्पमेकं\nस नित्योपलब्धिस्वरूपोऽहमात्मा॥ २॥", "padacchedaText": "", "audioFile": "PB_hear2read_000017.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000018", "originalText": "यं नित्यबोधस्वरूपमात्मानम् आश्रित्य मनश्चक्षुरादीनि प्रवर्तन्ते, सोऽहमात्मेति सम्बन्धः।", "padacchedaText": "", "audioFile": "PB_hear2read_000018.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000019", "originalText": "ननु कथं बोधस्य नित्यत्वम्? बोधो हि नाम ज्ञानम्, तच्च इन्द्रियार्थसंनिकर्षादिना जायते समुत्पद्यते, उत्पन्नं च ज्ञानं स्वकार्येण संस्कारेण विरोधिना ज्ञानान्तरेण वा विनश्यति, अतः उत्पत्तिनाशधर्मवत्त्वात् न नित्यं भवितुमर्हति, नापि बोधस्वरूपत्वमात्मन उपपद्यते, नित्यत्वादात्मनः, अनित्यत्वाच्च बोधस्य, न हि नित्यानित्ययोरेकस्वभावत्वम्, विरोधात् इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000019.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000020", "originalText": "अत्रोच्यते— बोधो हि नाम चैतन्यमभिप्रेतम्, न च ज्ञानं चैतन्यम्, जन्यज्ञानस्य ज्ञेयत्वेन घटादिवज्जडत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000020.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000021", "originalText": "ज्ञेयं हि ज्ञानम्, घटज्ञानं मे जातं पटज्ञानं मे जातमिति साक्षादनुभूयमानत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000021.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000022", "originalText": "अतः तस्य अनित्यत्वेन अनात्मस्वरूपत्वेऽपि, नित्यबोधस्वरूपत्वम् आत्मन उपपद्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000022.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000023", "originalText": "ननु आत्मनः चेतनत्वे किं प्रमाणमिति चेत्, जगत्प्रकाश इति ब्रूमः।", "padacchedaText": "", "audioFile": "PB_hear2read_000023.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000024", "originalText": "जगत् प्रकाशत इति सर्वजनसिद्धम्, तत्र ज्ञानादीनां ज्ञेयत्वेन जडत्वात्, आत्मप्रकाशेनैव जगत् प्रकाशत इति निश्चितं भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_000024.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000025", "originalText": "आत्मा च स्वपरप्रकाशवान् सवितृप्रकाशवत्— यथा सविता स्वयं प्रकाशमानो जगदपि प्रकाशयति, तथा आत्मापीति। अस्तु तर्हि चिद्धर्मा पुरुषः, कथमयं चित्स्वभाव इति, न, धर्मधर्मिभावस्य अनुपपत्तेः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000025.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000026", "originalText": "तथा हि— आत्मनश्चैतन्यं भिन्नम्, अभिन्नं वा, भिन्नाभिन्नं वा।", "padacchedaText": "", "audioFile": "PB_hear2read_000026.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000027", "originalText": "तत्र न तावद्भिन्नम्, भिन्नं चेत्, घटवदात्मधर्मत्वानुपपत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000027.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000028", "originalText": "ननु घटः असम्बन्धात् आत्मधर्मो न भवति, चैतन्यं तु आत्मसम्बन्धीति युक्तमात्मधर्मत्वम् इत्यपि न सम्बन्धानुपपत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000028.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000029", "originalText": "सम्बन्धो हि तावत् संयोगो वा समवायो वा स्यात्, सम्बन्धान्तरस्य अत्र असम्भवात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000029.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000030", "originalText": "न तावत्संयोगः, तस्य द्रव्यमात्रधर्मत्वात्, अद्रव्यत्वाच्चैतन्यस्य।", "padacchedaText": "", "audioFile": "PB_hear2read_000030.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000031", "originalText": "नापि समवायः, अनवस्थापातात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000031.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000032", "originalText": "समवायो हि सम्बद्धः समवायिनौ सम्बध्नाति, असम्बद्धो वा? न तावदसम्बद्धः, घटादिवदकिञ्चित्करत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000032.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000033", "originalText": "सम्बद्धश्चेत्, संयोगादेरभावेन समवायस्यापि समवायान्तरमभ्युपगन्तव्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000033.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000034", "originalText": "एवं परम्परापेक्षायाम् अनवस्थापात इति यत्किञ्चिदेतत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000034.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000035", "originalText": "तस्माद्भिन्नत्वपक्षे धर्मधर्मिभावः सर्वथा नोपपद्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000035.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000036", "originalText": "अभिन्नत्वपक्षे तु बोधस्य आत्मरूपत्वेन सुतरां धर्मधर्मिभावो नास्त्येव।", "padacchedaText": "", "audioFile": "PB_hear2read_000036.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000037", "originalText": "न हि तस्य तदेव धर्मो भवति, न हि शुक्लं शुक्लस्य धर्मो भवतीति।", "padacchedaText": "", "audioFile": "PB_hear2read_000037.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000038", "originalText": "तस्मात् भिन्नाभिन्नत्वपक्ष एव अवशिष्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000038.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000039", "originalText": "स च विरोधान्न युज्यते— न ह्येकमेवैकस्मात् भिन्नमभिन्नं च भवितुमर्हति, विरोधात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000039.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000040", "originalText": "अथोच्यते— प्रत्यक्षसिद्धत्वात् भेदाभेदौ अविरुद्धौ।", "padacchedaText": "", "audioFile": "PB_hear2read_000040.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000041", "originalText": "तथा हि— गौरियमिति पिण्डाव्यतिरेकेण गोत्वं प्रतीयते, तदेव पिण्डान्तरे प्रत्यभिज्ञायमानत्वात् भेदेनावगम्यते, अतः प्रत्यक्षेणैव भेदाभेदयोः प्रतीयमानत्वात् अविरोध इति— नैतत्साधु मन्यामहे, प्रत्यक्षस्य अन्यथासिद्धत्वात्— भिन्नमपि हि वस्तु प्रत्यक्षेण अत्यन्तसंनिधानादिदोषात् अभिन्नवत्प्रतीयते— यथा दीपज्वाला भिन्नापि कुतश्चित्कारणादभिन्नवत्प्रतिभासन्ते, तथा अभिन्नमपि वस्तु भिन्नमिव प्रतिभासते— यथा एकस्माच्चन्द्राद्वितीयश्चन्द्र इति— अतः प्रत्यक्षस्य अन्यथासिद्धत्वात् न तेन प्रत्यक्षेण प्रमाणसिद्धस्य भेदाभेदविरोधस्य प्रतिक्षेपो युक्त इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000041.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000042", "originalText": "अथैवमुच्यते— चैतन्यस्य द्वे रूपे स्तः, आत्मस्वरूपता चैतन्यस्वरूपता चेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000042.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000043", "originalText": "तत्र आत्मस्वरूपतया आत्मनो न भिद्यते, भिद्यते च चैतन्यस्वरूपतया।", "padacchedaText": "", "audioFile": "PB_hear2read_000043.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000044", "originalText": "अतः उभयरूपाभ्यां भिन्नाभिन्नत्वमविरुद्धमिति— तदपि न, धर्मधर्मित्वाभावात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000044.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000045", "originalText": "तथा हि— येन रूपेण तदभिन्नं न तेन रूपेण धर्मत्वम् अभिन्नत्वादवोचाम।", "padacchedaText": "", "audioFile": "PB_hear2read_000045.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000046", "originalText": "येन रूपेण भिन्नम्, तेनापि न धर्मः, भिन्नत्वाद्घटादिवदित्युक्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000046.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000047", "originalText": "यच्चोक्तम् उभयरूपाभ्यां भिन्नाभिन्नत्वमिति, तदपि विचारं न सहते।", "padacchedaText": "", "audioFile": "PB_hear2read_000047.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000048", "originalText": "ते रूपे किं चैतन्याद्भिन्ने, अभिन्ने, भिन्नाभिन्ने वा।", "padacchedaText": "", "audioFile": "PB_hear2read_000048.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000049", "originalText": "तत्र न तावद्भिन्ने, भिन्नत्वे घटादिवदकिञ्चित्करणत्वात्, अभिन्नत्वे चैतन्यमात्रमेवेति न ताभ्यां भिन्नाभिन्नत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000049.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000050", "originalText": "भिन्नाभिन्नत्वं च विरोधादेव न युक्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000050.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000051", "originalText": "तयोरपि रूपान्तराभ्यां भिन्नभिन्नत्वाभ्युपगमे अनवस्थापात इत्यलमतिविस्तरेण।", "padacchedaText": "", "audioFile": "PB_hear2read_000051.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000052", "originalText": "तस्मान्नात्मा सर्वथा चिद्धर्मा, किं तर्हि? चित्स्वरूप एवेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000052.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000053", "originalText": "एतेन सदानन्दयोरपि आत्मस्वरूपत्वं व्याख्यातम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000053.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000054", "originalText": "नित्यश्च आत्मा, सदकारणवत्त्वात् परमाणुवत्, सन् आत्मा, अहमस्मीति प्रतीतेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000054.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000055", "originalText": "अकारणवांश्च, न हि अस्य कारणं वस्तु प्रत्यक्षादिभिरुपलभ्यते, नापि श्रूयते, किं तु त्रैलोक्यैककारणता हि आत्मनः श्रूयते ‘तस्माद्वा एतस्मादात्मन आकाशः सम्भूतः’ इत्यादिश्रुतिभ्यः।", "padacchedaText": "", "audioFile": "PB_hear2read_000055.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000056", "originalText": "न त्वात्मनोऽपि कारणान्तरम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000056.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000057", "originalText": "अतः सदकारणवत्त्वात् नित्य आत्मेति सिद्धम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000057.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000058", "originalText": "तस्मात् साधूक्तं नित्यबोधस्वरूपमिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000058.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000059", "originalText": "तत्रैव दृष्टान्तमाह— अग्न्युष्णवदिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000059.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000060", "originalText": "यथा उष्णत्वमग्नेर्न व्यतिरिच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000060.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000061", "originalText": "व्यतिरेके हि कदाचिदग्नेरन्यत्राप्युपलभ्येत— यथा पुरुषाद्दण्डादि, न चैवमस्ति, तस्मादग्निस्वरूपमेव अग्नेरुष्णत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000061.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000062", "originalText": "एवमात्मनोऽपि चैतन्यं स्वरूपमेवेत्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000062.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000063", "originalText": "तथा च उक्तम्— ‘निरंशत्वाद्विभुत्वाच्च तथानश्वरभावतः।", "padacchedaText": "", "audioFile": "PB_hear2read_000063.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000064", "originalText": "ब्रह्मव्योम्नोर्न भेदोऽस्ति चैतन्यं ब्रह्मणोऽधिकम्’ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000064.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000065", "originalText": "यच्चोक्तं मनश्चक्षुरादीनां प्रवृत्तौ किमर्थमधिष्ठाता इष्यते, स्वयमेव कस्मान्न प्रवर्तन्ते इति, तत्राह— अबोधात्मकानीति।", "padacchedaText": "", "audioFile": "PB_hear2read_000065.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000066", "originalText": "हेतुगर्भमिदं विशेषणम्, अतश्च अयमर्थः सेत्स्यति— अबोधात्मकत्वात् अचेतनत्वाच्च घटादिवच्चेतनमधिष्ठातारमाश्रित्यैव प्रवर्तन्त इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000066.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000067", "originalText": "तदचेतनत्वं चैषां तज्ज्ञेयत्वात् घटादिवदिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000067.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000068", "originalText": "श्रुतिरपि ‘नान्योऽतोऽस्ति द्रष्टा’ इत्यादिना आत्मव्यतिरिक्तस्य चेतनत्वं प्रतिषेधति।", "padacchedaText": "", "audioFile": "PB_hear2read_000068.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000069", "originalText": "अतो युक्तमुक्तं चेतनमात्मानमाश्रित्य प्रवर्तन्त इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000069.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000070", "originalText": "निष्कम्पं निस्तरङ्गं निःसंशयमित्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000070.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000071", "originalText": "तथा च श्रुतिः ‘भिद्यते हृदयग्रन्थिश्च्छिद्यन्ते सर्वसंशयाः क्षीयन्ते चास्य कर्माणि तस्मिन्दृष्टे परावरे’ इति। एकम् अद्वितीयं देवतिर्यङ्मनुष्यादिशरीरेषु एकम्, न तु साङ्ख्यादिपरिकल्पितवत् नानाभूतमित्यर्थः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000071.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000072", "originalText": "ननु आत्मन एकत्वे सुखदुःखादिव्यवस्था न स्यात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000072.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000073", "originalText": "तथा हि— सर्वशरीरेषु यदि एक आत्मा भवेत् तदा एकस्मिन् सुखिनि सर्व एव सुखिनः प्रसज्येरन्, सर्वस्य अविशेषात्, एकमेकस्मिन् दुःखिनि सर्व एव दुःखिनो भवेयुः, एवमेकस्मिञ्जानति सर्व एव जानीयुः, तथैव एकस्मिञ्जायमाने म्रियमाणे वा सर्व एव जायेरन् म्रियेरन्, एवमेकस्मिन्बद्धे मुक्ते वा सर्व एव बद्ध्येरन् मुच्येरन् इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000073.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000074", "originalText": "न चैवमस्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000074.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000075", "originalText": "तस्मादेकत्वमात्मनो न भवितुमर्हति इत्यत आह—\nमुखाभासको दर्पणे दृश्यमानो\nमुखत्वात्पृथक्त्वेन नैवास्ति वस्तु। चिदाभासको धीषु जीवोऽपि तद्व—\nत्स नित्योपलब्धिस्वरूपोऽहमात्मा॥ ३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000075.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000076", "originalText": "मुखाभासकः मुखप्रतिबिम्बः दर्पणादौ नानाकारेषु दर्पणेषु इति यावत् दृश्यमानः मुखत्वात् परमार्थतः मुखस्वरूपत्वात् पृथक्त्वेन भेदेन न विद्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000076.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000077", "originalText": "यद्यपि मुखाभासको नाम वस्तु नास्त्येव, तथापि उपाधिभेदात् परमार्थसतो मुखात् परस्परं च ते मुखाभासका भिन्नाः प्रतीयन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000077.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000078", "originalText": "तथा च उपाधिगतमलिनत्वादिधर्मैः मलिनत्वादिधर्मकाः प्रतीयन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000078.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000079", "originalText": "तद्वत् मुखाभासकवत् चिदाभासकः आत्मनः प्रतिबिम्बो धीषु बुद्धिषु दृश्यमानो जीव इत्युच्यते यः, सोऽहमात्मा जीवास्ते उपाधिभेदात् भिन्नाः प्रतिभासन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000079.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000080", "originalText": "उपाधिगतसुखदुःखादिभिश्च सुखदुःखादिमन्तश्च प्रतिभासन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000080.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000081", "originalText": "उपाधयश्च व्यवस्थितरूपा एवेति सुखदुःखादीनामैकात्म्यपक्षे व्यवस्था युक्तैवेति नायमात्मभेदः शक्यो व्यवस्थापयितुम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000081.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000082", "originalText": "श्रुतिश्चैकात्म्यमेव प्रतिपादयति— ‘एकमेवाद्वितीयं ब्रह्म’ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000082.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000083", "originalText": "आत्मभेदपक्षं तु इयं सुखदुःखादिव्यवस्था नोपपद्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000083.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000084", "originalText": "तथा हि— प्रतिशरीरम् आत्मानो भिन्नाः ते च सर्वे प्रत्येकं सर्वगता इति आत्मभेदवादिनो मन्यन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000084.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000085", "originalText": "तत्र सर्वेषां सर्वगतत्वात् सर्वसंनिधौ सुखादिकमुत्पद्यमानं विशेषहेतोरभावात् कथमेकस्यैव तत् सुखादिकम्, न सर्वेषाम् इत्यवधारयितुं शक्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000085.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000086", "originalText": "अथ यत्सम्बन्धिना कार्यकरणसङ्घातेन सुखादिकं जन्यते, तस्यैव तदित्यभिधीयते इति, तन्न, कार्यकरणसङ्घातस्यापि सर्वात्मसंनिधावुत्पद्यमानस्य विशेषहेतोरभावादेव कथमेकात्मसम्बन्धित्वमिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000086.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000087", "originalText": "अथ यत्कर्मवशात्कार्यकरणसङ्घातस्योत्पत्तिः, तस्यैव असौ कार्यकरणसङ्घात इति विशेषहेतुरिति चेत्, न, कर्मणोऽपि सर्वात्मसंनिधावुत्पद्यमानस्य सर्वात्मसम्बन्धित्वेन तज्जनितकार्यकरणसङ्घातस्यापि सर्वात्मसम्बन्धित्वात् तज्जनितस्य सुखदुःखादेरपि सर्वात्मसम्बन्धित्वमिति सुखादिकस्य नानात्मपक्ष एव न व्यवस्थितिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000087.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000088", "originalText": "पूर्वपुर्वकार्यकरणसङ्घातस्य कर्मापेक्षायां च अनवस्थादोषः।", "padacchedaText": "", "audioFile": "PB_hear2read_000088.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000089", "originalText": "अनादित्वेन अनवस्थादोषपरिहारश्च अन्धपरम्परेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000089.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000090", "originalText": "श्रुतिरपि नानात्मपक्षं प्रतिषेधति— ‘नेह नानास्ति किञ्चन’ इति। अतः साधूक्तम् एकमिति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000090.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000091", "originalText": "नन्वेवं सति आत्मनः सुखदुःखादिसम्बन्धाभावात् बन्धो नास्ति, बन्धाभावाच्च मोक्षाभावः, बद्धो हि मुच्यते नाबद्ध इति, तथा चिदाभासस्यापि बन्धमोक्षौ न विद्येते, अवस्तुत्वात्, तस्य बुद्धेरपि विनाशित्वात् बन्धमोक्षयोरभावः, ततश्च मोक्षशास्त्रमनर्थकमापन्नम् इत्यत आह—\nयथा दर्पणाभाव आभासहानौ\nमुखं विद्यते कल्पनाहीनमेकम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000091.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000092", "originalText": "तथा धीवियोगे निराभासको यः\nस नित्योपलब्धिस्वरूपोऽहमात्मा॥ ४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000092.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000093", "originalText": "यथा दर्पणाभावे सति आभासस्य मुखप्रतिबिम्बस्य हानौ सत्यां मुखं परमार्थसत् कल्पनाहीनं मिथ्याज्ञानरहितम् एकमेव परं नापरं विद्यते, तथा तेनैव प्रकारेण धीवियोगे बुद्धेरभावे निराभासको अप्रतिबिम्बः परमार्थतः सन् एक एव यः, सोऽहमात्मेति योजना।", "padacchedaText": "", "audioFile": "PB_hear2read_000093.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000094", "originalText": "अयमभिप्रायः आत्माज्ञानकृतोऽयं बुद्ध्यादिप्रपञ्चः।", "padacchedaText": "", "audioFile": "PB_hear2read_000094.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000095", "originalText": "तत्र बुद्ध्यादौ प्रतिबिम्बरूपेण आत्मानमध्यस्य तद्गतसुखदुःखादिकम् आत्मन्यध्यस्यति।", "padacchedaText": "", "audioFile": "PB_hear2read_000095.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000096", "originalText": "सोऽयमध्यासो बन्धः।", "padacchedaText": "", "audioFile": "PB_hear2read_000096.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000097", "originalText": "आत्मज्ञानेन अज्ञाननिवृत्त्या बुद्ध्यादिप्रपञ्चनिवृत्तौ अध्यासनिवृत्तिर्मोक्षः। न पुनः पारमार्थिकौ बन्धमोक्षौ अस्य विद्येते इति सर्वं समञ्जसमिति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000097.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000098", "originalText": "केचित् बुद्ध्यादीनामात्मत्वं मन्यन्ते, तान्प्रत्याह—\nमनश्चक्षुरादेर्वियुक्तः स्वयं यो\nमनश्चक्षुरादेर्मनश्चक्षुरादिः। मनश्चक्षुरादेरगम्यस्वरूपः\nस नित्योपलब्धिस्वरूपोऽहमात्मा॥ ५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000098.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000099", "originalText": "मनश्चक्षुरादेः मनआदेः चक्षुरादेश्च वियुक्तः पृथग्भूतः यः सोऽहमात्मेति सम्बन्धः।", "padacchedaText": "", "audioFile": "PB_hear2read_000099.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000100", "originalText": "मनश्चक्षुराद्युपादानेन तदन्तर्गतत्वात् शरीरमपि उपात्तं द्रष्टव्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000100.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000101", "originalText": "एतेन शरीरादपि वियुक्त इति लक्ष्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000101.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000102", "originalText": "तथा च गुरुः— ‘बुद्धीन्द्रियशरीरेभ्यो भिन्न आत्मा विभुर्ध्रुवः।", "padacchedaText": "", "audioFile": "PB_hear2read_000102.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000103", "originalText": "नानारूपः प्रतिक्षेत्रमात्मा वृत्तिषु भासते’ इति कथं मनश्चक्षुरादिकस्य प्रकाशकस्य उपरि अयमात्मा प्रकाशकः, मनआदेः चक्षुरादेः कथं वियुक्तः इत्यत आह— स्वयमिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000103.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000104", "originalText": "स्वयं य आत्मा मनश्चक्षुरादेः मनश्चक्षुरादिः मनश्चक्षुरादिकस्य प्रकाशकस्य मनश्चक्षुरादिः प्रकाशकः, प्रकाशकत्वगुणयोगात्, अयमर्थः— यथा बाह्यस्य घटादेः प्रकाशको मनश्चक्षुरादिः ततो व्यतिरिच्यते, तथा, आन्तरस्यापि मनश्चक्षुरादेः प्रकाशकः आत्मा ततो व्यतिरिच्यत इति निश्चीयते।", "padacchedaText": "", "audioFile": "PB_hear2read_000104.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000105", "originalText": "अत एव मनश्चक्षुरादीनाम् अनात्मत्वमिति सिद्धं ज्ञेयादन्यो ज्ञाता भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_000105.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000106", "originalText": "ननु आत्मनोऽपि ज्ञेयत्वात् अनात्मत्वं प्रसज्यते इत्यत आह— मनश्चक्षुरादेरगम्यस्वरूपः प्रकाशस्वभावः। तथा च श्रुतिः— ‘यतो वाचो निवर्तन्ते अप्राप्य मनसा सह’ इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000106.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000107", "originalText": "ननु यद्यात्मा मनश्चक्षुरादेरगम्यः कथं तर्हि अस्य सिद्धिः? घटपटादयो हि मनश्चक्षुराद्यधीनसिद्धयो दृष्टाः।", "padacchedaText": "", "audioFile": "PB_hear2read_000107.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000108", "originalText": "ततः आत्मनोऽपि तदधीनसिद्धिर्युक्ता।", "padacchedaText": "", "audioFile": "PB_hear2read_000108.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000109", "originalText": "यदा तस्य तदधीना सिद्धिर्न भवति, तदा अस्य सिद्धिरेव न स्यात् शशविषाणवत् इत्यत आह—\nय एको विभाति स्वतः शुद्धचेताः\nप्रकाशस्वरूपोऽपि नानेव धीषु। शरावोदकस्थो यथा भानुरेकः\nस नित्योपलब्धिस्वरूपोऽहमात्मा॥ ६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000109.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000110", "originalText": "य इति स्वतःसिद्धतामाह।", "padacchedaText": "", "audioFile": "PB_hear2read_000110.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000111", "originalText": "एकः अद्वितीयः विभाति विशेषेण प्रकाशते स्वतः स्वयमेव न परतः शुद्धं निर्मलं चेतो मनो यस्य सः स्वतःशुद्धचेताः, शुद्धचित्तस्य हि आत्मा स्वयमेव स्फुरतीत्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000111.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000112", "originalText": "अत एव सत्त्वशुद्ध्यर्थं वेदेऽपि वेदानुवचनादयो विहिताः— ‘तमेतं वेदानुवचनेन ब्राह्मणा विविदिषन्ति यज्ञेन दानेन तपसानाशकेन’ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000112.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000113", "originalText": "घटपटादयश्च जडत्वात् प्रकाशान्तरापेक्षत्वाच्च न प्रकाशन्त इति युक्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000113.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000114", "originalText": "आत्मा तु प्रकाशस्वरूपत्वात् प्रकाशान्तरानपेक्षः प्रकाशते सवितृवत्— यथा सविता स्वप्रकाशः प्रकाशान्तरं नापेक्षते अथ च प्रकाशते, तद्वदात्मापीति भावः।", "padacchedaText": "", "audioFile": "PB_hear2read_000114.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000115", "originalText": "एवमुत्पन्नात्मज्ञानो अद्वयो जीवन्मुक्तः स्वयं प्रकाशरूपोऽपि परमार्थतो नानाविधासु धीषु उपाधिषु नानेव भाति यः, सोऽहमात्मेति सम्बन्धः।", "padacchedaText": "", "audioFile": "PB_hear2read_000115.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000116", "originalText": "शरावोदकेषु उपाधिषु अवस्थितो भानुः आदित्यः प्रकाशस्वरूपोऽपि एक एव सन् नानेव भाति, तद्वदात्मापीति भावः।", "padacchedaText": "", "audioFile": "PB_hear2read_000116.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000117", "originalText": "ननु कथं जीवन्मुक्तः? देहवांस्तावत् जीवन्नित्युच्यते, तस्य जीवतोऽपि यदि देहाभावो मुक्तिरभिप्रेयते, नासावुपपद्यते, विरोधात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000117.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000118", "originalText": "न हि जीवतो देहाभावः सम्भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_000118.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000119", "originalText": "अथ सत्यपि देहे भोगविच्छेदो मुक्तिरिति, तदपि च चतुरश्रम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000119.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000120", "originalText": "सकलभोगकारणेन्द्रियसम्पत्तौ भोगविच्छेदस्य असम्भावितत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000120.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000121", "originalText": "मिथ्याज्ञाननिबन्धनो हि भोगः, तस्य च संयग्ज्ञानेन निवृत्तत्वात् भोगविच्छेद इति चेत्, न, बाधितस्यापि मिथ्याज्ञानस्य द्विचन्द्रादिज्ञानवत् अनुवृत्त्यभ्युपगमात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000121.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000122", "originalText": "अन्यथा देहवानेव न स्यात् अत एव विदुषां जनकादीनां राज्यादिकं श्रूयते।", "padacchedaText": "", "audioFile": "PB_hear2read_000122.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000123", "originalText": "श्रुतिरपि देहवतो भोगविच्छेदं प्रतिषेधति— ‘न ह वै सशरीरस्य सतः प्रियाप्रिययोरपहतिरस्ति’ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000123.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000124", "originalText": "तस्मादयुक्ता जीवन्मुक्तिरिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000124.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000125", "originalText": "अत्रोच्यते— जीवतस्तावत् तत्त्वज्ञानमुत्पद्यते न तु मृतस्य, शमदमादेः श्रवणमननादेश्च ज्ञानहेतोः मृतस्यासम्भवात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000125.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000126", "originalText": "अत एव हि विदुषां याज्ञवल्क्यादीनां संन्यासः श्रूयते।", "padacchedaText": "", "audioFile": "PB_hear2read_000126.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000127", "originalText": "न च मृतस्य संन्यासः श्रूयते सम्भवति वा।", "padacchedaText": "", "audioFile": "PB_hear2read_000127.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000128", "originalText": "तस्मात् जीवतस्तत्त्वज्ञानमुत्पद्यत इति सिद्धम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000128.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000129", "originalText": "आत्मज्ञानादेव मुक्तिरिति सिद्धा जीवन्मुक्तिः ‘स यो ह वै तत्परमं ब्रह्म वेद ब्रह्मैव भवति’ ‘ब्रह्मविदाप्नोति परम्’ इत्यादिश्रुतिभ्यः।", "padacchedaText": "", "audioFile": "PB_hear2read_000129.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000130", "originalText": "ननु ज्ञानस्य मोक्षफलकत्वे श्रुतिषु सहकार्यन्तरं प्रतीयते इति चेत्, न, ज्ञानमात्रस्य श्रवणात्— ‘भिद्यते हृदयग्रन्थिः’ इति, ‘नान्यः पन्था विद्यतेऽयनाय’ इति सहकार्यन्तरप्रतिषेधाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000130.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000131", "originalText": "ननु श्रुतिरेव मरणसहकारिणो ज्ञानान्मोक्षं दर्शयति ‘तस्य तावदेव चिरं यावन्न विमोक्ष्ये अथ सम्पत्स्ये’ इति, न, पूर्वोत्पन्नस्य ज्ञानस्य चिरप्रवृत्तत्वात् मरणकाले तस्य संनिधापयितुमशक्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000131.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000132", "originalText": "तत्कालमेवोत्पन्नात् ज्ञानान्तरान्मुक्तिरिति चेत्, न, ‘यदेव भगवान्वेद तदेव मे ब्रूहि’ इति ‘आचार्यवान्पुरुषो वेद’ इत्यादिश्रुतिपर्यालोचनया प्रथमज्ञानादेव मुक्तेः श्रूयमाणत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000132.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000133", "originalText": "एतेन वचनान्तरमनुगृहीतं भवति— जीवन्नेव हि विद्वान् हर्षमर्षाभ्यां विमुच्यते इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000133.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000134", "originalText": "न च ‘न ह वै सशरीरस्य सतः प्रियाप्रिययोरपहतिरस्ति’ इति श्रुत्यन्तरविरोधो वाच्यः, श्रुत्यन्तरस्य सामान्यविषयत्वात्, अत्र ‘विद्वान्’ इति विशेषनिर्देशात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000134.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000135", "originalText": "‘तस्य तावदेव चिरम्’ इति श्रुतिस्त्यक्ता स्यादिति चेत्, न, व्यवस्थया उपपत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000135.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000136", "originalText": "तथा हि— मुक्तिः खलु स्वाभाविकी सर्वेषाम्, न सा ज्ञानेन जन्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000136.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000137", "originalText": "किं तर्हि? अविद्यातिमिरतिरोहिताया मुक्तेः तिमिरमात्रं निराक्रियते।", "padacchedaText": "", "audioFile": "PB_hear2read_000137.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000138", "originalText": "तच्च प्रथमज्ञानेनैव निराकृतम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000138.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000139", "originalText": "तथापि अविद्याकार्यस्य देहस्य अविनाशात् पुनःपुनः महान्धकारवदुत्सारितमपि तिरस्करोति।", "padacchedaText": "", "audioFile": "PB_hear2read_000139.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000140", "originalText": "तस्य तिरस्कारप्रतिभासस्य देहविच्छेदाद्विच्छेदो भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_000140.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000141", "originalText": "एवं च सति प्राचीनमेव महान्धकारोत्सारणं ज्ञानमात्रनिबन्धनमवतिष्ठते— यथा सूर्योदयेन महातिमिरोत्सारणे कृतेऽपि छत्रादिकृतस्य तिमिराभासस्य छत्रादिविगमे विगमः।", "padacchedaText": "", "audioFile": "PB_hear2read_000141.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000142", "originalText": "ततश्च प्राचीनमेव महातिमिरोत्सारणं सूर्योदयमात्रनिबन्धनमवतिष्ठत इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000142.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000143", "originalText": "तस्मात् न ज्ञानान्तरान्मुक्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000143.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000144", "originalText": "अपि तु पूर्वोत्पन्नज्ञानादेव मुक्तिरिति सिद्धम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000144.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000145", "originalText": "ननु यदि पारमार्थिकम् अद्वैतं मिथ्याज्ञानविजृम्भितश्च प्रपञ्च इति श्रुत्यर्थो अवधारितः, तत्कथं सत्यपि बाधके प्रपञ्चानुवृत्तिः, न हि सत्येव शुक्तिकाज्ञाने रजतादिप्रपञ्चो अनुर्तते, उच्यते— ‘नेति नेति न ह्येतस्मादिति नेत्यन्यत्परमस्ति’ ‘नेह नानास्ति किञ्चन’ इत्यादिवाक्यसहितात् तत्त्वमस्यादिवाक्यात् प्रपञ्चविलयद्वारेण असन्दिग्धमबाधितं च अद्वैतज्ञानं तावदुत्पद्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000145.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000146", "originalText": "न च तत् प्रपञ्चप्रत्ययेन बाध्यत इति युक्तम्, तत्प्रविलयेनैव उत्पत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000146.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000147", "originalText": "यत्पुनरुक्तं कथं प्रपञ्चप्रत्ययानुवृत्तिरिति, अत्रोच्यते— द्विविधं हि बाधकं भवति— यथा सत्येव मिथ्याज्ञानहेतुभूते पित्तादौ जाग्रत्येव पीतः शङ्खः इति ज्ञाने निमित्तान्तरात् नायं पीत इति मिथ्याज्ञानकारणापगमे, वा यथा मन्दालोकप्रभवस्य शुक्तिकारजतज्ञानस्य महत्यालोके नेदं रजतमिति ज्ञानम्, तद्वदिहापि पीतः शङ्ख इति ज्ञानबाधकवत् सत्येव मिथ्याज्ञाने हेतुभूते शरीरे प्रपञ्चप्रत्ययस्य बाधकमद्वैतज्ञानमुत्पद्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000147.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000148", "originalText": "अत एव स्वकारणाद्बाधितमपि प्रपञ्चज्ञानं पीतशङ्खज्ञानवत् पुनः पुनः जायत इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000148.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000149", "originalText": "ननु देहस्यापि प्रपञ्चान्तर्गतत्वात् उच्छित्तिरेव प्रसज्यते इति चेत्, न, प्रारब्धकर्मवशात् अनुवृत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000149.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000150", "originalText": "कर्मणश्च कुलालचक्रभ्रमणवत्संस्कारादनुवृत्तिरिति सिद्धा जीवन्मुक्तिरिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000150.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000151", "originalText": "कर्मसंस्कारक्षयश्च देहपाते सति सर्वस्यैव प्रपञ्चप्रत्ययस्यापि प्रविलयः।", "padacchedaText": "", "audioFile": "PB_hear2read_000151.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000152", "originalText": "कर्मान्तराणां च ज्ञानेन क्षपितत्वात् देहान्तरानुत्पत्तिरिति परममुक्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000152.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000153", "originalText": "एवं च सति ज्ञानमात्रान्मुक्तिरिति प्रतिपादनादेव कर्मणो मुक्तिहेतुत्वमपास्तं वेदितव्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000153.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000154", "originalText": "तथा हि— न तावत्केवलात्कर्मणो मुक्तिश्रवणात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000154.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000155", "originalText": "नापि तत एव ज्ञानसहितात्, अश्रुतेरेव।", "padacchedaText": "", "audioFile": "PB_hear2read_000155.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000156", "originalText": "ननु ‘तं विद्याकर्मणी समन्वारभेते पूर्वप्रज्ञा च’ इति विद्याकर्मणोः सहभावः श्रूयते, सत्यम्, संसारविषयं तच्छ्रवणं न मुक्तिविषयम् इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000156.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000157", "originalText": "‘यावज्जीवमग्निहोत्रं जुहोति’ इत्यादिचोदनाप्राप्तानां नित्यनैमित्तिककर्मणां ज्ञानस्य च अर्थात्समुच्चय इति चेत्, न, विनियोजकप्रमाणाभावात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000157.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000158", "originalText": "‘तमेतं वेदानुवचनेन ब्राह्मणा विविदिषन्ति यज्ञेन दानेन तपसानाशकेन’ इत्यत्र तृतीयाश्रुतिः विनियोजिका इति चेत्, न, विविदिषासम्बन्धात् कर्मणां ज्ञानार्थत्वप्रतीतेः मोक्षार्थत्वं नावगम्यते इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000158.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000159", "originalText": "किं च, न हि ज्ञानम् अज्ञाननिवृत्तौ उपकारकमपेक्षते, उत्पन्नादेव तस्मात् अज्ञाननिवृत्तेरवश्यम्भावात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000159.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000160", "originalText": "तथा च श्रुतिः— ‘तमेव विदित्वातिमृत्युमेति नान्यः पन्था विद्यतेऽयनाय’ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000160.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000161", "originalText": "अपि च यदि कर्मफलं मोक्षो भवेत्, तदा अनित्यत्वं प्रसज्यते घटादिवत्स्वर्गादिवच्चेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000161.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000162", "originalText": "अमुमेवार्थं श्रुतिरप्याह— तद्यथेह कर्मचितो लोकः क्षीयते एवमेवामुत्र पुण्यचितो लोकः क्षीयते’ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000162.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000163", "originalText": "‘अग्निहोत्रादि तु तत्कार्यायैव’ इति सूत्रकारेण परम्परया कर्मणां मुक्तिहेतुत्वमभिहितं प्रयाजादिवत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000163.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000164", "originalText": "अतः ज्ञानार्थत्वेन कर्मणामुपयोगोऽस्त्येव। ज्ञानोत्पत्तेस्तु परं कर्मणामुपयोगाभावेऽपि लोकसङ्ग्रहार्थमनुष्ठानं कर्तव्यमेवेति सर्वं समञ्जसम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_000164.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000165", "originalText": "ननु कथम् एक एव आत्मा युगपत् अनेकां बुद्धिम् अधितिष्ठति? न ह्येक एव अश्वसादी युगपदनेकानश्वानधितिष्ठन्नुपलभ्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000165.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000166", "originalText": "क्रमेण त्वधिष्ठानं युक्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000166.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000167", "originalText": "तच्चेह नास्ति, युगपदेव सर्वबुद्धीनां स्वव्यापारे प्रवृत्तिदर्शनात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000167.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000168", "originalText": "अनधिष्ठितानां च प्रवृत्त्यसम्भवाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000168.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000169", "originalText": "अतः नैक आत्मा इत्यत आह—\nयथानेकचक्षुःप्रकाशो रविर्न\nक्रमेण प्रकाशीकरोति प्रकाश्यम्। अनेका धियो यस्तथैकप्रबोधः\nस नित्योपलब्धिस्वरूपोऽहमात्मा॥ ७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000169.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000170", "originalText": "यथा येन प्रकाशकत्वप्रकारेण रविः आदित्यः एक एव अनेकेषां चक्षुषां प्रकाशको युगपदेव अनेकानि चक्षूंषि अधितिष्ठति न च क्रमेण एकैकस्मै चक्षुषे प्रकाश्यं प्रकाशीकरोति, तथा तेनैव प्रकारेण एकश्चासौ प्रबोधश्च एकप्रबोधः सः अधिष्ठाता अनेका धियो बुद्धीः युगपदधितिष्ठति न क्रमेणैकैकस्यै धियै प्रकाश्यं प्रकाशीकरोति यः सोऽहमात्मेति सम्बन्धः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000170.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000171", "originalText": "नन्वस्तु तर्हि रविरेव बुद्धीनां प्रेरकः अधिष्ठाता, किमात्माभ्युपगमेन? तथा च श्रुतिः— ‘धियो यो नः प्रचोदयात्’ इति, अत आह—\nविवस्वत्प्रभातं यथारूपमक्षं\nप्रगृह्णाति नाभातमेवं विवस्वान्।", "padacchedaText": "", "audioFile": "PB_hear2read_000171.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000172", "originalText": "यदाभात आभासयत्यक्षमेकः\nस नित्योपलब्धिस्वरूपोऽहमात्मा॥ ८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000172.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000173", "originalText": "विवस्वता सूर्येण प्रभातं प्रकाशितं रूपं यथा येन प्रकारेण अक्षं चक्षुः प्रगृह्णाति प्रकर्षेण जानाति, नाभातं न अप्रकाशितम्, अन्धकारे घटाद्यनुपलम्भात् एवं विवस्वानपि एकः तथा तेनैव प्रकारेण यदाभातः येनाधितिष्ठितः सन् आभासयति अधितिष्ठति अक्षं यथा विवस्वान् अधिष्ठाता, तथा विवस्वतोऽप्यधिष्ठाता यः, सोऽहमात्मेति सम्बन्धः।", "padacchedaText": "", "audioFile": "PB_hear2read_000173.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000174", "originalText": "स चाहम्बुद्धीनामधिष्ठाता, श्रुत्या तु चक्षुरधिष्ठातृत्वमभिप्रेत्य विवस्वतो बुद्धिप्रेरकत्वमभिहितम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000174.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000175", "originalText": "यस्माद्विवस्वदधिष्ठितं चक्षुः बुद्धिवृद्धिमुत्पादयति, अधिष्ठातुरात्मनो वा स्वरूपमभिप्रेत्योक्तः, तथा च 'सूर्य आत्मा जगतस्तस्थुषश्च’ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000175.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000176", "originalText": "नन्वपि तर्हि प्रकाशान्तरेणैव अधिष्ठातव्यम्, न, तस्य स्वप्रकाशत्वात्। ‘नान्यदतोऽस्ति द्रष्टा’ इति च श्रुत्या तदितरप्रतिषेधाच्च॥", "padacchedaText": "", "audioFile": "PB_hear2read_000176.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000177", "originalText": "किं च—\nयथा सूर्य एकोऽप्स्वनेकश्चलासु\nस्थिरास्वप्यनन्वग्विभाव्यस्वरूपः। चलासु प्रभिन्नासु धीष्वेवमेकः\nस नित्योपलब्धिस्वरूपोऽहमात्मा॥ ९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000177.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000178", "originalText": "यथा येन प्रकारेण आदित्यः एकः अप्सु वारिषु चलासु स्थिरासु च अनेकोऽपि नानापि एकः सन् प्रतिभासते अनन्वग्विभाव्यस्वरूपः अनु पश्चात् अञ्चति गच्छतीति अन्वक् न अन्वक् अनन्वक् अननुगत इति यावत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000178.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000179", "originalText": "यद्वा अनन्वक्त्वेन विभाव्यं स्वरूपं यस्य स तथोक्तः।", "padacchedaText": "", "audioFile": "PB_hear2read_000179.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000180", "originalText": "एवं बहुव्रीहिसमासं कृत्वा पश्चात् नञ्समासः।", "padacchedaText": "", "audioFile": "PB_hear2read_000180.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000181", "originalText": "ततश्चायमर्थो भवति— न वारिषु रविरनुगतो भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_000181.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000182", "originalText": "किं तर्हि तथैव नभसि देदीप्यमानो भ्रान्त्या वारिषु दृश्यत इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000182.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000183", "originalText": "एवं एक आत्मा चलासु प्रभिन्नासु नानाभूतासु धीषु बुद्धिषु अनेकः सन् अनन्वग्विभाव्यस्वरूपो न बुद्धीरनुगतो भवति। किं तर्हि, पृथगेव देदीप्यते यः सोऽहमात्मेत्यर्थः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000183.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000184", "originalText": "किं च—\nघनच्छन्नदृष्टिर्घनच्छन्नमर्कं\nयथा निष्प्रभं मन्यते चातिमूढः। तथा बद्धवद्भाति यो मूढदृष्टेः\nस नित्योपलब्धिस्वरूपोऽहमात्मा॥ १०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000184.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000185", "originalText": "घनेन मेघेन छन्ना तिरोहिता दृष्टिः दर्शनं यस्य सः घनच्छन्नदृष्टिः पुरुषः घनच्छन्नम् अर्कम् आदित्यं यथा येन घनच्छन्नत्वप्रकारेण मन्यते जानाति निष्प्रभं प्रभारहितम् अप्रकाशस्वभावमिति यावत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000185.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000186", "originalText": "मूढो मन्यते घनच्छन्नदृष्टित्वात् प्रकाशस्वभावमपि रविम् अप्रकाशं पश्यतीत्याह— अतिमूढ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000186.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000187", "originalText": "अतिमूर्खत्वात् स्वात्मनो दृष्टिविघातमगणयन् सूर्यमेव अप्रकाशं मन्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000187.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000188", "originalText": "पादपूरणे चकारः। तथा तेन प्रकारेण अविद्याच्छन्नदृष्टिः बुद्धिमात्मत्वेन गृहीत्वा तद्गतदुःखादिकम् आत्मन्यध्यारोप्य बद्ध इव आभाति यः मूढदृष्टेः सोऽहमात्मेति सम्बन्धः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000188.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000189", "originalText": "किं च—\nसमस्तेषु वस्तुष्वनुस्यूतमेकं\nसमस्तानि वस्तूनि यं न स्पृशन्ति। वियद्वत्सदा शुद्धमच्छस्वरूपं\nस नित्योपलब्धिस्वरूपोऽहमात्मा॥ ११॥", "padacchedaText": "", "audioFile": "PB_hear2read_000189.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000190", "originalText": "समस्तेषु निरवशेषेषु प्रपञ्चात्मकेषु सदात्मना अनुस्यूतम् अनुगतं व्याप्तम् एवं हि नाना समस्तानि वस्तूनि प्रपञ्चात्मकानि यं सद्रूपं न स्पृशन्ति। कुतः? वियद्वत् आकाशमिव सदा सर्वदा शुद्धं निर्मलं रागादिदोषरहितम् अच्छस्वरूपम् अमृतरूपं यत् परं ब्रह्म सोऽहमात्मेति सम्बन्धः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000190.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000191", "originalText": "व्युत्पादितमर्थमुपसंहरति—\nउपाधौ यथा भेदता सन्मणीनां\nतथा भेदता बुद्धिभेदेषु तेऽपि। यथा चन्द्रिकाणां जले चञ्चलत्वं\nतथा चञ्चलत्वं तवापीह विष्णो॥ १२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000191.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000192", "originalText": "उपाधौ सति उपाधिभेदसम्बन्धे सति यथा भेदता भेद एव भेदता, स्वार्थे तल्, सन्मणीनां विशुद्धमणीनां स्फटिकादीनां लोहितकृष्णादिभेदेन भेदता भेदः।", "padacchedaText": "", "audioFile": "PB_hear2read_000192.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000193", "originalText": "तथा बुद्धिभेदेषु नानाबुद्धिषु ते तवापि नानात्वं हे विष्णो परमार्थतस्तु तव भेदो नास्त्येव बुद्ध्युपाधिकृतस्तु विद्यत इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000193.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000194", "originalText": "यथा चन्द्रिकाणां चन्द्रा एव चन्द्रिकाः, स्वार्थे कप्रत्ययः, निर्मलितानां जले प्रतिबिम्बितस्वरूपेण दृश्यमानानां जलस्य चञ्चलत्वात् चञ्चलत्वम् औपाधिकं न पारमार्थिकम्, तथा बुद्धीनां चञ्चलत्वात् तवापि चञ्चलत्वमौपाधिकं न पारमार्थिकमित्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000194.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000195", "originalText": "इह बुद्धिषु हे विष्णो व्यापनशील॥", "padacchedaText": "", "audioFile": "PB_hear2read_000195.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}, {"id": "B_000196", "originalText": "इति श्रीमत्परमहंसपरिव्राजकाचार्यस्य\nश्रीगोविन्दभगवत्पूज्यपादशिष्यस्य\nश्रीमच्छङ्करभगवतः कृतौ\nहस्तामलकीयभाष्यं सम्पूर्णम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_000196.mp3", "zipFile": "HastamalakiyaBhashyam.zip"}];
        const contentDiv = document.getElementById('content');
        
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let currentSource = null;
        let isPlaying = false;
        
        const speedSlider = document.getElementById('speed-slider');
        const speedDisplay = document.getElementById('speed-display');
        speedSlider.oninput = function() {
            if (currentSource) {
                currentSource.playbackRate.value = this.value;
            }
            speedDisplay.innerText = parseFloat(this.value).toFixed(1);
        };
        
        const playPauseBtn = document.getElementById('play-pause-btn');
        playPauseBtn.onclick = async () => {
            if (isPlaying) {
                if (currentSource) {
                    currentSource.onended = null;
                    currentSource.stop();
                    currentSource = null;
                }
                isPlaying = false;
                playPauseBtn.innerText = "Resume";
            } else {
                if (currentIndex >= 0) {
                    playAudio(currentIndex);
                } else {
                    playAudio(0);
                }
                playPauseBtn.innerText = "Stop";
            }
        };
        
        let currentIndex = -1;

        manifest.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'sentence';
            div.id = 'sentence-' + index;
            
            const idSpan = document.createElement('span');
            idSpan.className = 'sentence-id';
            idSpan.innerText = '[' + item.id + ']';
            
            const textSpan = document.createElement('span');
            textSpan.innerText = item.originalText;
            
            div.appendChild(idSpan);
            div.appendChild(textSpan);
            
            div.onclick = () => {
                playPauseBtn.innerText = "Stop";
                playAudio(index);
            };
            contentDiv.appendChild(div);
        });
        
        // --- Web Audio API Prefetching Logic ---
        const PREFETCH_BUFFER_SIZE = 3;
        let prefetchQueue = new Map(); // index -> AudioBuffer

        function getAudioUrl(index) {
            if (index < 0 || index >= manifest.length) return null;
            const item = manifest[index];
            const zipToUse = item.zipFile || ZIP_NAME;
            return WORKER_URL + '/' + BUCKET_NAME + '/' + zipToUse + '/' + item.audioFile;
        }

        async function fetchAndDecode(url) {
            const response = await fetch(url);
            if (!response.ok) throw new Error("HTTP " + response.status);
            const arrayBuffer = await response.arrayBuffer();
            return await audioCtx.decodeAudioData(arrayBuffer);
        }

        async function prefetchNext(fromIndex) {
            for (let i = fromIndex + 1; i <= fromIndex + PREFETCH_BUFFER_SIZE; i++) {
                if (i >= manifest.length) break;
                if (!prefetchQueue.has(i)) {
                    prefetchQueue.set(i, 'fetching');
                    const url = getAudioUrl(i);
                    try {
                        const audioBuffer = await fetchAndDecode(url);
                        if (prefetchQueue.get(i) === 'fetching') {
                            prefetchQueue.set(i, audioBuffer);
                        }
                    } catch (err) {
                        console.error("Prefetch failed for index", i, err);
                        prefetchQueue.delete(i);
                    }
                }
            }
            // Cleanup old buffers to free memory
            for (let [key, val] of prefetchQueue.entries()) {
                if (key < fromIndex) {
                    prefetchQueue.delete(key);
                }
            }
        }
        // ------------------------

        async function playAudio(index) {
            if (index < 0 || index >= manifest.length) {
                isPlaying = false;
                playPauseBtn.innerText = "Start Reading";
                return;
            }
            
            if (currentSource) {
                currentSource.onended = null;
                currentSource.stop();
                currentSource = null;
            }
            
            if (currentIndex >= 0) {
                const prevDiv = document.getElementById('sentence-' + currentIndex);
                if (prevDiv) prevDiv.classList.remove('active');
            }
            
            currentIndex = index;
            const item = manifest[currentIndex];
            
            const currentDiv = document.getElementById('sentence-' + currentIndex);
            if (currentDiv) {
                currentDiv.classList.add('active');
                currentDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            
            // Resume AudioContext if it was suspended (browser autoplay policy)
            if (audioCtx.state === 'suspended') {
                await audioCtx.resume();
            }
            
            try {
                let audioBuffer;
                if (prefetchQueue.has(index) && prefetchQueue.get(index) !== 'fetching') {
                    audioBuffer = prefetchQueue.get(index);
                } else {
                    const sourceUrl = getAudioUrl(index);
                    audioBuffer = await fetchAndDecode(sourceUrl);
                }
                
                currentSource = audioCtx.createBufferSource();
                currentSource.buffer = audioBuffer;
                currentSource.playbackRate.value = document.getElementById('speed-slider').value;
                currentSource.connect(audioCtx.destination);
                
                currentSource.onended = () => { playAudio(currentIndex + 1); };
                currentSource.start(0);
                isPlaying = true;
                
            } catch (e) {
                console.error("Audio play error:", e);
                // Fallback to next track if error
                setTimeout(() => playAudio(currentIndex + 1), 500);
            }
            
            // Trigger prefetch for upcoming sentences
            prefetchNext(index);
        }
    </script>
