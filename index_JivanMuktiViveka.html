 "JivanMuktiViveka.zip"}, {"id": "B_001105", "originalText": "तत्ते शिथिलतां यान्ति सर्वाधिव्याधयः क्षणात्। — (योगवासिष्ठे रामायणे उपशमप्रकरणे ९२.९)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001105.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001106", "originalText": "``पौरुषेण प्रयत्नेन बलात्सन्त्यज्य वासनाः। स्थितिं बध्नासि चेत्तर्हि पदमासादयस्यलम्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001106.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001107", "originalText": "— (तत्रैव ९२.३—४) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001107.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001108", "originalText": "नन्वत्र पौरुषः प्रयत्नो नाम पूर्वोक्तो विषयदोषविवेकः।", "padacchedaText": "", "audioFile": "PB_hear2read_001108.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001109", "originalText": "स च पुनः पुनः क्रियमाणोऽपि प्रबलेन्द्रियव्यवहारेणाभिभूयते।", "padacchedaText": "", "audioFile": "PB_hear2read_001109.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001110", "originalText": "तदुक्तं भगवता——\n``यततो ह्यपि कौन्तेय पुरुषस्य विपश्चितः। इन्द्रियाणि प्रमाथीनि हरन्ति प्रसभं मनः॥", "padacchedaText": "", "audioFile": "PB_hear2read_001110.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001111", "originalText": "— (भगवद्गीतायां २.६०)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001111.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001112", "originalText": "``इन्द्रियाणां हि चरतां यन्मनोऽनुविधीयते। तदस्य हरति प्रज्ञां वायुर्नावमिवाम्भसि''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001112.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001113", "originalText": "— (तत्रैव २.६७) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001113.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001114", "originalText": "एवं तर्ह्यत्पन्नविवेकरक्षार्थमिन्द्रियाणि निरोद्धव्यानि।", "padacchedaText": "", "audioFile": "PB_hear2read_001114.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001115", "originalText": "तदपि तत्रैवोत्तरश्लोकाभ्यां दर्शितम्—\n``तानि सर्वाणि संयम्य युक्त आसीत मत्परः।", "padacchedaText": "", "audioFile": "PB_hear2read_001115.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001116", "originalText": "वशे हि यस्येन्द्रियाणि तस्य प्रज्ञा प्रतिष्ठिता। — (तत्रैव २.६१)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001116.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001117", "originalText": "``तस्माद्यस्य महाबाहो निगृहीतानि सर्वशः।", "padacchedaText": "", "audioFile": "PB_hear2read_001117.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001118", "originalText": "इन्द्रियाणीन्द्रियार्थेभ्यस्तस्य प्रज्ञा प्रतिष्ठिता। ''— (तत्रैव २.६८) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001118.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001119", "originalText": "स्मृत्यन्तरेऽपि—\n``न पाणिपादचपलो न नेत्रचपलो यतिः। न च वाक्चपलश्चैवमिति शिष्टस्य लक्षणम्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001119.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001120", "originalText": "इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001120.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001121", "originalText": "एतदेवान्यत्र सङ्ग्रहविवरणाभ्यां स्पष्टीकृतम्—\n``अजिह्वः षण्डकः पङ्गुरन्धो बधिर एव च। मुग्धश्च मुच्यते भिक्षुः षड्भिरेतैर्न संशयः॥", "padacchedaText": "", "audioFile": "PB_hear2read_001121.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001122", "originalText": "— (नारदपरिव्राजकोपनिषदि ३.६२)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001122.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001123", "originalText": "(** न पाणिपादचपलो न नेत्रचपलो भवेत्। न चाङ्गचपलो विप्र (न च वागङ्गचपल) इति शिष्टस्य गोचरः॥", "padacchedaText": "", "audioFile": "PB_hear2read_001123.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001124", "originalText": "(वसिष्ठस्मृत्यां ६.३९)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001124.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001125", "originalText": "न पाणिपादचपलो न नेत्रचपलो मुनिः। न च वागङ्गचपल इति शिष्टस्य गोचरः॥", "padacchedaText": "", "audioFile": "PB_hear2read_001125.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001126", "originalText": "(महाभारते १४.४५.१८)\nन पाणिपादचपलो न नेत्रचपलोऽनृजुः। न च वागङ्गचपलो न चाशिष्टस्य गोचरः॥", "padacchedaText": "", "audioFile": "PB_hear2read_001126.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001127", "originalText": "(स्कन्दपुराणे माहेश्वरखण्डे ४१.१३९—४०)\n``इमिष्टमिदं नेति योऽश्नन्नपि न सज्जते। हितं सत्यं मितं वक्ति तमजिह्वं प्रचक्षते''॥ ३.६३॥", "padacchedaText": "", "audioFile": "PB_hear2read_001127.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001128", "originalText": "``अद्य जातां यथा नारीं तथा षोडशवार्षिकीम्। शतवर्षां च यो दृष्ट्वा निर्विकारः स षण्डकः''॥ ३.६४॥", "padacchedaText": "", "audioFile": "PB_hear2read_001128.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001129", "originalText": "``भिक्षार्थमटनं यस्य विण्मूत्रकरणाय च। योजनान्न परं याति सर्वथा पङ्गुरेव सः''॥ ३.६५॥", "padacchedaText": "", "audioFile": "PB_hear2read_001129.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001130", "originalText": "``तिष्ठतो व्रजतो वापि यस्य चक्षुर्न दूरगम्। चतुर्युगां भुवं त्यक्त्वा परिव्राट् सोऽन्ध उच्यते''॥ ३.६६॥", "padacchedaText": "", "audioFile": "PB_hear2read_001130.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001131", "originalText": "``हितं मितं मनोरम्यं वचः शोकापहं च यत्। श्रुत्वा यो न श‍ृणोतीव बधिरः स प्रकीर्तितः''॥ ३.६७॥", "padacchedaText": "", "audioFile": "PB_hear2read_001131.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001132", "originalText": "``सन्निधौ विषयाणां च समर्थोऽविकलेन्द्रियः। सुप्तवद्वर्तते नित्यं भिक्षुर्मुग्धः स उच्यते''॥ ३.६८॥", "padacchedaText": "", "audioFile": "PB_hear2read_001132.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001133", "originalText": "``न निन्दां न स्तुतिं कुर्यान्न कञ्चिन्मर्मणि स्पृशेत्। नातिवादी भवेत् तद्वत्सर्वत्रैव समो भवेत्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001133.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001134", "originalText": "``न सम्भाषेत्स्त्रियं काञ्चित्पूर्वदृष्टां न च स्मरेत्। कथां च वर्जयेत् तस्या न पश्येल्लिखितामपि''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001134.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001135", "originalText": "— (नारदपरि० उप० ४.३)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001135.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001136", "originalText": "यथा कश्चिद् व्रती नक्तैकभुक्तोपवासमौनादिव्रतं सङ्कल्प्य सावधानो भ्रंशमकृत्वा सम्यक्पालयति, तथैवाजिह्वत्वादिव्रते स्थितः सावधानो विवेकं पालयेत्।", "padacchedaText": "", "audioFile": "PB_hear2read_001136.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001137", "originalText": "तदेवं विवेकेन्द्रियनिरोधाभ्यां दीर्घकालनैरन्तर्यसत्कारसेविताभ्यां मैत्र्यादिभावनासु प्रतिष्ठितास्वासुरसम्पद्रूपा मलिनवासनाः क्षीयन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_001137.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001138", "originalText": "ततो निःश्वासोच्छ्वासवन्निमेषोन्मेषवच्च पुरुषप्रयत्नमन्तरेण प्रवर्तमानाभिर्मैत्र्यादिवासनाभिर्लोके व्यवहरन्नपि तदीयसाकल्यवैकल्यानुसन्धानं चित्ते परित्यज्य निद्रातन्द्रामनोराज्यादिरूपाः समस्तचेष्टाः प्रयत्नेन शान्ताः कृत्वा चिन्मात्रवासनामभ्यस्येत्।", "padacchedaText": "", "audioFile": "PB_hear2read_001138.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001139", "originalText": "स्वतस्तावदिदं जगच्चिज्जडोभयात्मकं भासते, यद्यपि\nशब्दस्पर्शादिजडवस्तुभासनायैवेन्द्रियाणि सृष्टानि ``पराञ्चि खानि व्यतृणत् स्वयम्भूः'' (कठ. उप०.२.१.१) इति श्रुतेः, तथापि चैतन्यस्योपादानतया वर्जयितुमशक्यत्वाच्चैतन्यपूर्वकमेव जडं जगद्भासते, ``तमेव भान्तमनु भाति सर्वं तस्य भासा सर्वमिदं विभाति'' (कठ. उप०.२.२.१५) इति श्रुतेः, तथा सति पश्चाद्भासमानस्य जडस्य प्रथमतो भासमानमेव चैतन्यं वास्तवं रूपमिति निश्चित्य जडमुपेक्ष्य चिन्मात्रं चित्ते वासयेत्।", "padacchedaText": "", "audioFile": "PB_hear2read_001139.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001140", "originalText": "एतच्च बलिशुक्रयोः प्रश्नोत्तराभ्यां विस्पष्टमवगम्यते—\n``किमिहास्तीह किम्मात्रमिदं किम्मयमेव च। कस्त्वं कोऽहं क एते वा लोका इति वदाशु मे''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001140.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001141", "originalText": "— (लघुयोगवासिष्ठे २१.५०)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001141.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001142", "originalText": "``चिदिहास्तीह चिन्मात्रमिदं चिन्मयमेव च। चित्त्वं चिदहमेते च लोकाश्चिदिति सङ्ग्रहः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001142.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001143", "originalText": "— (तत्रैव २१.५२) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001143.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001144", "originalText": "यथा सुवर्णकामः कटकं क्रीणन्नपि वलयाकारस्य गुणदोषावुपेक्ष्य गुरुत्ववर्णयोरेव मनः प्रणिधित्सति, तथा चिन्मात्रे मनः प्रणिधातव्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001144.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001145", "originalText": "यावता कालेन जडं सर्वथैवोपेक्ष्य चिन्मात्र मनसः प्रवृत्तिर्निःश्वासादिवत्स्वाभाविकी सम्पद्यते, तावन्तं कालं चिन्मात्र वासनायां प्रयतेत।", "padacchedaText": "", "audioFile": "PB_hear2read_001145.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001146", "originalText": "नन्वादावेव चिन्मात्रवासनास्तु, तयैव मलिनवासनानिवृत्तेः, किमनेनान्तर्गडुना मैत्र्याद्यभ्यासेनेति चेत्,\nन, चिद्वासनाया अप्रतिष्ठितत्वप्रसङ्गात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001146.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001147", "originalText": "यथा कुट्टिमदार्ढ्यव्यतिरेकेन क्रियमाणमपि स्तम्भकुड्यात्मकं गृहं न प्रतितिष्ठति, यथा वा विरेचनेन प्रबलदोषमनिःसार्य सेवितमप्यौषधं नारोग्यकरं तद्वत्।", "padacchedaText": "", "audioFile": "PB_hear2read_001147.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001148", "originalText": "ननु ``तामप्यथ परित्यजेत्'' (योगवासिष्ठे स्थिति.५७.२०) इति चिन्मात्रवासनायापि परित्यागोऽवगम्यते, तदप्ययुक्तं चिन्मात्रं परित्यज्यान्यस्य कस्यचिदुपादेयस्याभावात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001148.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001149", "originalText": "नायं दोषः।", "padacchedaText": "", "audioFile": "PB_hear2read_001149.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001150", "originalText": "द्विविधा चिन्मात्रवासना— मनोबुद्धिसमन्विता तद्रहिता चेति।", "padacchedaText": "", "audioFile": "PB_hear2read_001150.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001151", "originalText": "करणं मनः, कर्तृत्वोपाधिर्बुद्धिः।", "padacchedaText": "", "audioFile": "PB_hear2read_001151.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001152", "originalText": "तथा च सत्यप्रमत्तोऽहमेकाग्रेण मनसा चिन्मात्रं भावयिष्यामीत्येतादृशेन कर्तृकरणानुसन्धानेन समन्विता प्राथमिकी या चिन्मात्रवासना ध्यानशब्दाभिधेया तां परित्यजेत्।", "padacchedaText": "", "audioFile": "PB_hear2read_001152.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001153", "originalText": "या त्वभ्यासपाटवेन कर्तृत्वाद्यनुसन्धानव्यवधानरहिता समाधिशब्दाभिधेया तामुपाददीत।", "padacchedaText": "", "audioFile": "PB_hear2read_001153.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001154", "originalText": "ध्यानसमाध्योस्तु लक्षणं पतञ्जलिः सूत्रयामास—\n``तत्र प्रत्ययैकतानता ध्यानम्'' (३.२)।", "padacchedaText": "", "audioFile": "PB_hear2read_001154.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001155", "originalText": "``तदेवार्थमात्रनिर्भासं स्वरूपशून्यमिव समाधिः'' (३.३) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001155.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001156", "originalText": "तादृशे समाधौ दीर्घकालनैरन्तर्यसत्कारैः सेविते स्थैर्यं लब्ध्वा पश्चात्कर्तृकरणानुसन्धानपरित्यागार्थो यः प्रयत्नस्तमपि परित्यजेत्।", "padacchedaText": "", "audioFile": "PB_hear2read_001156.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001157", "originalText": "मैवम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001157.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001158", "originalText": "कतकरजोन्यायेन स्वपरनिवर्तकत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001158.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001159", "originalText": "यथा कलुषिते जले प्रक्षिप्तं कतकरज इतररजसा सह स्वात्मानमपि निवर्तयति तथा त्यागार्थः प्रयत्नः कर्तृकरणानुसन्धानं निवर्तयन्स्वात्मानमपि निवर्तयिष्यति।", "padacchedaText": "", "audioFile": "PB_hear2read_001159.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001160", "originalText": "निवृत्ते च तस्मिन्मलिनवासनावच्छुद्धवासनानामपि क्षीणत्वान्निर्वासनं मनोऽवतिष्ठते।", "padacchedaText": "", "audioFile": "PB_hear2read_001160.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001161", "originalText": "एतदेवाभिप्रेत्य वसिष्ठ आह—\n``तस्माद्वासनया बद्धं मुक्तं निर्वासनं मनः।", "padacchedaText": "", "audioFile": "PB_hear2read_001161.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001162", "originalText": "राम निर्वासनीभावमाहराशु विवेकतः। — (लघुयोगवासिष्ठे १६.४५)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001162.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001163", "originalText": "``सम्यगालोचनात्सत्याद्वासना प्रविलीयते। वासनाविलये चेतः शाम्यत्यस्नेहदीपवत्॥", "padacchedaText": "", "audioFile": "PB_hear2read_001163.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001164", "originalText": "``— (तत्रैव १६.४६) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001164.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001165", "originalText": "``यो जागर्ति सुषुप्तिस्थो यस्य जाग्रन्न विद्यते। यस्य निर्वासनो बोधः स जीवन्मुक्त उच्यते॥", "padacchedaText": "", "audioFile": "PB_hear2read_001165.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001166", "originalText": "— (तत्रैव ५.९२) इति च॥", "padacchedaText": "", "audioFile": "PB_hear2read_001166.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001167", "originalText": "``सुषुप्तवत्प्रशमितभाववृत्तिना\nस्थितं सदा जाग्रति यस्य चेतसा। कलान्वितो विधुरिव यः सदा बुधै—\nर्निषेव्यते मुक्त इतीह स स्मृतः॥", "padacchedaText": "", "audioFile": "PB_hear2read_001167.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001168", "originalText": "— (तत्रैव २०.३६) इति च॥", "padacchedaText": "", "audioFile": "PB_hear2read_001168.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001169", "originalText": "``हृदयात् सम्परित्यज्य सर्वमेव महामतिः। यस्तिष्ठति गतव्यग्रः स मुक्तः परमेश्वरः॥", "padacchedaText": "", "audioFile": "PB_hear2read_001169.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001170", "originalText": "— (तत्रैव १८.२६)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001170.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001171", "originalText": "``समाधिमथ कर्माणि मा करोतु करोतु वा। हृदयेनास्तसर्वाशो मुक्त एवोत्तमाशयः॥", "padacchedaText": "", "audioFile": "PB_hear2read_001171.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001172", "originalText": "— (तत्रैव १८.२७)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001172.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001173", "originalText": "``नैष्कम्र्येण न तस्यार्थस्तस्यार्थोऽस्ति न कर्मभिः। न समाधानजप्याभ्यां यस्य निर्वासनं मनः॥", "padacchedaText": "", "audioFile": "PB_hear2read_001173.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001174", "originalText": "— (तत्रैव १८.२८)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001174.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001175", "originalText": "``विचारितमलं शास्त्रं चिरमुद्ग्राहितं मिथः। सन्त्यक्तवासनान्मौनादृते नास्त्युत्तमं पदम्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001175.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001176", "originalText": "— (तत्रैव १८.२९) इति च॥", "padacchedaText": "", "audioFile": "PB_hear2read_001176.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001177", "originalText": "न च निर्वासनमनस्कस्य जीवनहेतुर्व्यवहारो लुप्येतेति शङ्कनीयम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001177.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001178", "originalText": "किं चक्षुरादिव्यवहारस्य लोपः किं वा मानसव्यवहारस्य? तत्राद्यमुद्दालको निराचष्टे—\n``वासनाहीनमप्येतच्चक्षुरादीन्द्रियं स्वतः। प्रवर्तते बहिः स्वार्थे वासना नात्र कारणम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_001178.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001179", "originalText": "— (योगवासिष्ठे ५.५२.५९, लघुयोगवासिष्ठे २४.७०) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001179.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001180", "originalText": "द्वितीयं वसिष्ठो निराचष्टे—\n``अयत्नोपनतेष्वक्षि दिग्द्रव्येषु यथा पुनः। नीरागमेव पतति तद्वत्कार्येषु धीरधीः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001180.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001181", "originalText": "— (योगवासिष्ठे ४.२३.४४, लघुयोगवासिष्ठे १५.१३) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001181.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001182", "originalText": "तादृश्या धिया प्रारब्धभोगं स एवोपपादयति—\n``परिज्ञायोपभुक्तो हि भोगो भवति तुष्टये। विज्ञाय सेवितश्चोरो मैत्रीमेति न चोरताम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_001182.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001183", "originalText": "अशङ्कितोपसम्प्राप्ता ग्रामयात्रा यथाध्वगैः। प्रेक्ष्यते तद्वदेव ज्ञैर्भोगश्रीरवलोक्यते''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001183.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001184", "originalText": "— (लघुयोगवासिष्ठे १५.१४, १५) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001184.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001185", "originalText": "भोगकालेऽपि सवासनेभ्यो निर्वासनानां विशेषमाह—\n``नापदि ग्लानिमायान्ति हेमपद्मं यथा निशि। नेहन्ते प्रकृतादन्यद्रमन्ते शिष्टवर्त्मनि॥", "padacchedaText": "", "audioFile": "PB_hear2read_001185.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001186", "originalText": "— (तत्रैव १८.४२)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001186.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001187", "originalText": "``नित्यमापूर्णतामन्तरक्षुब्धामिन्दुसुन्दरीम्। आपद्यपि न मुञ्चन्ति शशिनः शीततामिव॥", "padacchedaText": "", "audioFile": "PB_hear2read_001187.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001188", "originalText": "— (तत्रैव १.४३)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001188.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001189", "originalText": "``अब्धिवद्घृतमर्यादा भवन्ति वितताशयाः। नियतिं न विमुञ्चन्ति महान्तो भास्करा इव''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001189.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001190", "originalText": "(तत्रैव १.४५) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001190.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001191", "originalText": "जनकस्यापि समाधिव्युत्थिस्येदृशमेवाचरणं पठ्यते—\n``तूष्णीमथ चिरं स्थित्वा जनको जनजीवितम्। व्युत्थितश्चिन्तयामास मनसा शमशालिना॥ ६०॥", "padacchedaText": "", "audioFile": "PB_hear2read_001191.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001192", "originalText": "किमुपादेयमस्तीह यत्नात्संसाधयामि किम्। स्वतः स्थितस्य शुद्धस्य चितः का मेऽस्ति कल्पना॥ ६९॥", "padacchedaText": "", "audioFile": "PB_hear2read_001192.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001193", "originalText": "नाभिवाञ्छाम्यसम्प्राप्तं सम्प्राप्तं न त्यजाम्यहम्। स्वस्थ आत्मनि तिष्ठामि यन्ममास्ति तदस्तु मे॥ ६२॥", "padacchedaText": "", "audioFile": "PB_hear2read_001193.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001194", "originalText": "इति सञ्चिन्त्य जनको यथाप्राप्तक्रियामसौ। असक्तः कर्तुमुत्तस्थौ दिनं दिनपतिर्यथा॥ ६३॥", "padacchedaText": "", "audioFile": "PB_hear2read_001194.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001195", "originalText": "भविष्यन्नानुसन्धत्ते नातीतं चिन्तयत्यसौ। वर्तमाननिमेषं तु हसन्नेवानुवर्तते''॥ ६४॥", "padacchedaText": "", "audioFile": "PB_hear2read_001195.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001196", "originalText": "— (तत्रैव १९.६०—६४) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001196.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001197", "originalText": "तदेवं यथोक्तेन वासनाक्षयेण यथोक्ता जीवन्मुक्तिर्भविष्यतीति सुस्थितम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_001197.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001198", "originalText": "इति श्रीमद्विद्यारण्यप्रणीते जीवन्मुक्तिविवेके वासनाक्षयनिरूपणं नाम द्वितीयं प्रकरणम्॥ २॥", "padacchedaText": "", "audioFile": "PB_hear2read_001198.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001199", "originalText": "३. मनोनाशनिरूपणं नाम तृतीयं प्रकरणम्\n\nअथ जीवन्मुक्तिसाधनं मनोनाशं निरूपयामः।", "padacchedaText": "", "audioFile": "PB_hear2read_001199.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001200", "originalText": "यद्यप्यशेषवासनाक्षये सति अर्थान्मनो नश्यत्येव, तथापि स्वातन्त्र्येण मनोनाशे सम्यगभ्यस्ते सति वासनाक्षयो रक्षितो भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_001200.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001201", "originalText": "न चाजिह्वत्वषण्डकत्वाद्यभ्यासेनैव तद्रक्षा सिद्धेति वाच्यम्,\nनष्टे मनस्यजिह्वत्वादीनामर्थसिद्धत्वेनाभ्यासप्रयासाभावात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001201.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001202", "originalText": "ननु मनोनाशाभ्यासप्रयासस्तत्राप्यस्तीति चेत्।", "padacchedaText": "", "audioFile": "PB_hear2read_001202.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001203", "originalText": "अस्तु नाम, तस्यावश्यिकत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001203.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001204", "originalText": "अन्तरेण मनोनाशमभ्यस्ता अप्यजिह्वत्वादयो न स्थिरा भवन्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_001204.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001205", "originalText": "अत एव मनसो नाशनीयत्वं जनक आह—\n``सहस्राङ्कुरशाखात्मफलपल्लवशालिनः। अस्य संसारवृक्षस्य मनो मूलमिति स्थितम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_001205.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001206", "originalText": "— (लघुयोगवासिष्ठे १९.५३) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001206.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001207", "originalText": "``सङ्कल्पमेव तन्मन्ये सङ्कल्पोपशमेन तत्। शोषयामि यथा शोषमेति संसारपादपः॥", "padacchedaText": "", "audioFile": "PB_hear2read_001207.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001208", "originalText": "— (तत्रैव १९.५४)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001208.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001209", "originalText": "``प्रबुद्धोऽस्मि प्रबुद्धोऽस्मि दृष्टश्चोरो मयात्मनः। मनोनामेह हन्म्येनं मनसास्मि चिरं हतः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001209.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001210", "originalText": "— (तत्रैव १९.५५) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001210.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001211", "originalText": "वसिष्ठोऽप्याह—\n``अस्य संसारवृक्षस्य सर्वोपद्रवदायिनः। उपाय एक एवास्ति मनसः स्वस्य निग्रहः॥", "padacchedaText": "", "audioFile": "PB_hear2read_001211.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001212", "originalText": "— (तत्रैव १७.१)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001212.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001213", "originalText": "``मनसोऽभ्युदयो नाशो मनोनाशो महोदयः। ज्ञमनो नाशमभ्येति मनोऽज्ञस्य हि श‍ृङ्खला॥", "padacchedaText": "", "audioFile": "PB_hear2read_001213.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001214", "originalText": "— (तत्रैव १७.५)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001214.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001215", "originalText": "``तावन्निशीथवेताला वल्गन्ति हृदि वासनाः। एकतत्त्वदृढाभ्यासाद्यावन्न विजितं मनः॥", "padacchedaText": "", "audioFile": "PB_hear2read_001215.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001216", "originalText": "— (तत्रैव १५.२३)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001216.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001217", "originalText": "``प्रक्षीणचित्तदर्पस्य निगृहीतेन्द्रियद्विषः। पद्मिन्य इव हेमन्ते क्षीयन्ते भोगवासनाः॥", "padacchedaText": "", "audioFile": "PB_hear2read_001217.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001218", "originalText": "— (तत्रैव १५.२२)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001218.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001219", "originalText": "``हस्तं हस्तेन सम्पीड्यदन्तैर्दन्तान् विचूर्ण्य च। अङ्गान्यङ्गैः समाक्रम्य जयेदादौ स्वकं मनः॥", "padacchedaText": "", "audioFile": "PB_hear2read_001219.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001220", "originalText": "— (तत्रैव १५.१८)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001220.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001221", "originalText": "``एतावति धरणितले सुभगास्ते साधुचेतसः पुरुषाः। पुरुषकथासु च गण्या न जिता ये चेतसा स्वेन॥", "padacchedaText": "", "audioFile": "PB_hear2read_001221.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001222", "originalText": "— (तत्रैव १५.१९)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001222.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001223", "originalText": "``हृदयबिले कृतकुण्डल उल्बणकलनाविषो मनोभुजगः। यस्योपशान्तिमगमच्चन्द्रवदुदितं तमव्ययं वन्दे॥", "padacchedaText": "", "audioFile": "PB_hear2read_001223.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001224", "originalText": "— (तत्रैव १५.२०)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001224.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001225", "originalText": "``चित्तं नाभिः किलास्येदं मायाचक्रस्य सर्वतः। स्थीयते चेत्तदाक्रम्य तन्न किञ्चित्प्रबाधते''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001225.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001226", "originalText": "— (तत्रैव २३.९२) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001226.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001227", "originalText": "गौडपादाचार्यैरप्युक्तम्—\n``मनसो निग्रहायत्तमभयं सर्वयोगिनाम्। दुःखक्षयः प्रबोधश्चाप्यक्षया शान्तिरेव च''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001227.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001228", "originalText": "— (माण्डूककारिकायां ३.४०) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001228.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001229", "originalText": "यत्त्वर्जुनेनोक्तम्—\n``चञ्चलं हि मनः कृष्ण प्रमाथि बलवद्दृढम्। तस्याहं निग्रहं मन्ये वायोरिव सुदुष्करम्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001229.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001230", "originalText": "— (भगवद्गीतायां ६.३४) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001230.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001231", "originalText": "तद्वचनं हठयोगविषयम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001231.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001232", "originalText": "अत एव वाल्मीकिराह—\n``उपविश्योपविश्यैकचित्तकेन मुहुर्मुहुः। न शक्यते मनो जेतुं विना युक्तिमनिन्दिताम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_001232.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001233", "originalText": "— (लघुयोगवासिष्ठे २८.१२६)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001233.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001234", "originalText": "``अङ्कुशेन विना मत्तो यथा दुष्टमतङ्गजः। विजेतुं शक्यते नैव तथा युक्त्या विना मनः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001234.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001235", "originalText": "— (तत्रैव २८.१२७)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001235.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001236", "originalText": "``मनोविलय हेतूनां युक्तीनां सम्यगीरणम्। वसिष्ठेन कृतं तावत् तन्निष्ठस्य वशे मनः॥", "padacchedaText": "", "audioFile": "PB_hear2read_001236.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001237", "originalText": "``हठतो युक्तितश्चापि द्विविधो निग्रहो मतः। निग्रहो धीक्रियाक्षाणां हठो गोलकनिग्रहात्॥", "padacchedaText": "", "audioFile": "PB_hear2read_001237.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001238", "originalText": "कदाचिज्जायते कश्चिन्मनस्तेन विलीयते। ``अध्यात्मविद्याधिगमः साधुसङ्गम एव च॥", "padacchedaText": "", "audioFile": "PB_hear2read_001238.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001239", "originalText": "वासनासम्परित्यागः प्राणस्पन्दनिरोधनम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_001239.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001240", "originalText": "एतास्तु युक्तयः पुष्टाः सन्ति चित्तजये किल॥", "padacchedaText": "", "audioFile": "PB_hear2read_001240.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001241", "originalText": "— (लघुयोगवासिष्ठे २८.१२८, १२९)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001241.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001242", "originalText": "``सतीषु युक्तिष्वेतासु हठान्नियमयन्ति ये। चेतस्ते दीपमुत्सृज्य विनिघ्नन्ति तमोऽञ्जनैः॥", "padacchedaText": "", "audioFile": "PB_hear2read_001242.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001243", "originalText": "— (तत्रैव २८.१३०)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001243.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001244", "originalText": "``विमूढ़ाः कर्तुमुद्युक्ता ये हठाच्चेतसो जयम्। निबध्नन्ति नागेन्द्रमुन्मत्तं बिसतन्तुभिः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001244.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001245", "originalText": "— (तत्रैव २८.१३१)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001245.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001246", "originalText": "निग्रहो द्विविधः, हठनिग्रहः क्रमनिग्रहश्चेति।", "padacchedaText": "", "audioFile": "PB_hear2read_001246.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001247", "originalText": "तत्र चक्षुःश्रोत्रादिज्ञानेन्द्रियाणि वाक्पाण्यादिकर्मेन्द्रियाणि च तत्तद्गोलकोपरोधमात्रेण हठान्निगृह्यन्ते, तद्दृष्टान्तेन मनोऽपि तथा निग्रहीष्यामीति मूढस्य भ्रान्तिर्भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_001247.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001248", "originalText": "न तु तन्निग्रहीतुं शक्यते, तद्गोलकस्य हृदयकमलस्य निरोद्धुमशक्यत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001248.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001249", "originalText": "अतः क्रमनिग्रह एव योग्यः।", "padacchedaText": "", "audioFile": "PB_hear2read_001249.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001250", "originalText": "क्रमनिग्रहे चाध्यात्मविद्याप्राप्त्यादय एवोपायाः।", "padacchedaText": "", "audioFile": "PB_hear2read_001250.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001251", "originalText": "सा च विद्या दृश्यमिथ्यात्वं दृग्वस्तुनः स्वप्रकाशत्वं च बोधयति।", "padacchedaText": "", "audioFile": "PB_hear2read_001251.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001252", "originalText": "तथा च सत्येतन्मनः स्वगोचरेषु दृश्येषु प्रयोजनाभावं प्रयोजनवति दृग्वस्तुन्यगोचरत्वं च बुद्ध्वा निरिन्धनाग्निवत्स्वयमेवोपशाम्यति।", "padacchedaText": "", "audioFile": "PB_hear2read_001252.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001253", "originalText": "तथा च श्रूयते—\n``यथा निरिन्धनो वह्निः स्वयोनावुपशाम्यति। तथा वृत्तिक्षयाच्चित्तं स्वयोनावुपशाम्यति''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001253.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001254", "originalText": "— (मैत्रायणि उप०.४.१, पञ्चदश्यां ११.१११)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001254.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001255", "originalText": "योनिरात्मा।", "padacchedaText": "", "audioFile": "PB_hear2read_001255.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001256", "originalText": "यस्तु बोधितमपि तत्त्वं न सम्यग्बुध्यते, यश्च विस्मरति, तयोरुभयोः साधुसङ्गम एवोपायः।", "padacchedaText": "", "audioFile": "PB_hear2read_001256.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001257", "originalText": "साधवो हि पुनः पुनर्बोधयन्ति स्मारयन्ति च।", "padacchedaText": "", "audioFile": "PB_hear2read_001257.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001258", "originalText": "यस्तु विद्यामदादिदुर्वासनया पीड्यमानो न साधूननुवर्तितुमुत्सहते, तस्य पूर्वोक्तविवेकेन वासनापरित्याग उपायः।", "padacchedaText": "", "audioFile": "PB_hear2read_001258.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001259", "originalText": "वासनानां प्राबल्येन त्यक्तुमशक्यत्वे प्राणस्पन्दनिरोधनमुपायः।", "padacchedaText": "", "audioFile": "PB_hear2read_001259.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001260", "originalText": "प्राणस्पन्दवासनयोश्चित्तप्रेरकत्त्वात्तयोर्निरोधे चित्तशान्तिरुपपद्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001260.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001261", "originalText": "प्रेरकत्वं च वसिष्ठ आह—\n``द्वे बीजे चित्तवृक्षस्य वृत्तिव्रततिधारिणः। एकं प्राणपरिस्पन्दो द्वितीयं दृढवासना॥", "padacchedaText": "", "audioFile": "PB_hear2read_001261.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001262", "originalText": "— (लघुयोगवासिष्ठे २८.३८)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001262.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001263", "originalText": "``सती सर्वगता संवित्प्राणस्पन्देन बोध्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001263.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001264", "originalText": "संवेदनादनन्तानि ततो दुःखानि चेतसः''। — (लघुयोगवासिष्ठे २८.४०—४१)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001264.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001265", "originalText": "यथा भस्मच्छन्नमग्निं लोहकारा दृतिभ्यां धमन्ति, तत्र च दृत्युत्पन्नेन वायुना सोऽग्निर्ज्वलति, तथा चित्तोपादानेन काष्ठस्थानीयेनाज्ञानेनावृता संवित्प्राणस्पन्देन चित्तवृत्तिरूपेण प्रज्वलति।", "padacchedaText": "", "audioFile": "PB_hear2read_001265.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001266", "originalText": "तस्माच्चित्तवृत्तिनामकात् संविज्ज्वालारूपात् संवेदनाद् दुःखान्युत्पद्यन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_001266.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001267", "originalText": "सेयं प्राणस्पन्देन प्रेरिता चित्तोत्पत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_001267.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001268", "originalText": "अन्यां च स एवाह—\n``भावसंवित्प्रकटितामनुभूतां च राघव। चित्तस्योत्पत्तिमपरां वासनाजनितां श‍ृणु॥", "padacchedaText": "", "audioFile": "PB_hear2read_001268.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001269", "originalText": "— (योगवासिष्ठे ५.९१.२८)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001269.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001270", "originalText": "``दृढाभ्यस्तपदार्थैकभावनादतिचञ्चलम्। चित्तं सञ्जायते जन्मजरामरणकारणम्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001270.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001271", "originalText": "इति। — (योगवासिष्ठे ५.९१.३५)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001271.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001272", "originalText": "न केवलं प्राणवासनयोश्चित्तप्रेरकत्वम्, किं तु परस्परप्रेरकत्वमप्यस्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_001272.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001273", "originalText": "तदाह वसिष्ठः—\n``वासनावशतः प्राणस्पन्दस्तेन च वासना। जायते चित्तवृक्षस्य तेन बीजाङ्कुरक्रमः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001273.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001274", "originalText": "इति। — (लघुयोगवासिष्ठे २८.६५)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001274.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001275", "originalText": "अत एवान्यतरनाशेनोभयनाशमप्याह—\n``द्वे बीजे चित्तवृक्षस्य प्राणस्पन्दनवासने। एकस्मिंश्च तयोः क्षीणे क्षिप्रं द्वे अपि नश्यतः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001275.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001276", "originalText": "— (लघुयोगवासिष्ठे २८.६४) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001276.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001277", "originalText": "तयोर्नाशोपायं नाशफलं चाह—\n``प्राणायामदृढाभ्यासैर्युक्त्या च गुरुदत्तया। आसनाशनयोगेन प्राणस्पन्दो निरुध्यते॥", "padacchedaText": "", "audioFile": "PB_hear2read_001277.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001278", "originalText": "— (लघुयोगवासिष्ठे २८.१२२)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001278.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001279", "originalText": "``असङ्गव्यवहारित्वाद्भवभावनवर्जनात्। शरीरनाशदर्शित्वाद्वासना न प्रवर्तते''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001279.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001280", "originalText": "— (अन्नपूर्णोपनिषदि ४.८८, लघुयोगवासिष्ठे २८.१२३)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001280.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001281", "originalText": "``वासनासम्परित्यागाच्चित्तं गच्छत्यचित्तताम्। प्राणस्पन्दनिरोधाच्च यथेच्छसि तथा कुरु॥", "padacchedaText": "", "audioFile": "PB_hear2read_001281.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001282", "originalText": "— (अन्नपूर्णोपनिषदि ४.८६, लघुयोगवासिष्ठे २८.१२१)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001282.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001283", "originalText": "``एतावन्मात्रकं मन्ये रूपं चित्तस्य राघव। यद्भावनं वस्तुनोऽन्तर्वस्तुत्वेन रसेन च॥", "padacchedaText": "", "audioFile": "PB_hear2read_001283.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001284", "originalText": "— (लघुयोगवासिष्ठे २८.५७)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001284.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001285", "originalText": "``यदा न भाव्यते किञ्चिद्धेयोपादेयरूपि यत्। स्थीयते सकलं त्यक्त्वा तदा चित्तं न जायते॥", "padacchedaText": "", "audioFile": "PB_hear2read_001285.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001286", "originalText": "— (तत्रैव २८.५४)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001286.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001287", "originalText": "``अवासनत्वात्सततं यदा न मनुते मनः। अमनस्ता तदोदेति परमोपशमप्रदा''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001287.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001288", "originalText": "— (लघुयोगवासिष्ठे २८.५५) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001288.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001289", "originalText": "अमनस्तानुदये शान्त्यभावमाह—\n``चित्तयक्षदृढाक्रान्तं न मित्राणि न बान्धवाः। शक्नुवन्ति परित्रातुं गुरवो न च मानवाः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001289.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001290", "originalText": "— (लघुयोगवासिष्ठे ३०.१८) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001290.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001291", "originalText": "आसनाशनयोगेनेति यदुक्तं तत्रासनस्य लक्षणमुपायं फलं च त्रिभिः सूत्रैः पतञ्जलिः सूत्रयामास—``स्थिरसुखमासनं'' (२.४६), ``प्रयत्नशैथिल्यानन्तसमापत्तिभ्यां'' (२.४७), ``ततो द्वन्द्वानभिधातः'' (२.४८) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001291.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001292", "originalText": "पद्मकस्वस्तिकादिना यादृशेन देहस्थापनरूपेण यस्य पुरुषस्यावयवव्यथानुत्पत्तिलक्षणं सुखं स्वदेहचलनराहित्यलक्षणं स्थैर्यं च सम्पद्यते, तस्य तदेव सुखमासनम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001292.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001293", "originalText": "तस्य च प्रयत्नशैथिल्यं लौकिक उपायः।", "padacchedaText": "", "audioFile": "PB_hear2read_001293.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001294", "originalText": "गमनगृहकृत्यतीर्थयात्रास्नानहोमादिविषयो यः प्रयत्नो मानस उत्साहस्तस्य शैथिल्यं कर्तव्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001294.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001295", "originalText": "अन्यथा स उत्साहो बलाद्देहमुत्थाप्य यत्र क्वापि प्रेरयति।", "padacchedaText": "", "audioFile": "PB_hear2read_001295.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001296", "originalText": "अलौकिकोपायश्च ``फणासहस्रेण धरणीं धारयित्वा स्थैर्येणावतिष्ठते योऽयमनन्तः स एवाहमस्मि'' इति ध्यानं चित्तस्यानन्तसमापत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_001296.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001297", "originalText": "तया यथोक्तासनसम्पादकमदृष्टं निष्पद्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001297.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001298", "originalText": "सिद्धे चासने शीतोष्णसुखदुःखमानावमानादिद्वन्द्वैर्यथापूर्वं नाभिहन्यते। तथाविधस्य चासनस्य योग्यो देशः श्रूयते—\nविविक्तदेशे च सुखासनस्थः\nशुचिः समग्रीवशिरः शरीरः॥", "padacchedaText": "", "audioFile": "PB_hear2read_001298.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001299", "originalText": "— (कैवल्योपनिषदि ४) इति,\n\nसमे शुचौ शर्करवह्निवालुका—\nविवर्जिते शब्दजलाशयादिभिः। मनोनुकूले न तु चक्षुपीडने\nगुहानिवाताश्रयणे प्रयोजयेत्॥", "padacchedaText": "", "audioFile": "PB_hear2read_001299.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001300", "originalText": "— (श्वेताश्वतरोपनिषदि २.१०) इति च॥", "padacchedaText": "", "audioFile": "PB_hear2read_001300.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001301", "originalText": "सोऽयमासनयोगः।", "padacchedaText": "", "audioFile": "PB_hear2read_001301.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001302", "originalText": "अशनयोगस्तु मिताहारत्वम्,\n``अत्याहारमनाहारं नित्यं योगी विवर्जयेत्''। — (अमृतबिन्दूपनिषदि २७) इति श्रुतेः॥", "padacchedaText": "", "audioFile": "PB_hear2read_001302.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001303", "originalText": "भगवताप्युक्तम्——\n``नात्यश्नतस्तु योगोऽस्ति न चैकान्तमनश्नतः। न चातिस्वप्नशीलस्य जाग्रतो नैव चार्जुन॥", "padacchedaText": "", "audioFile": "PB_hear2read_001303.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001304", "originalText": "युक्ताहारविहारस्य युक्तचेष्टस्य कर्मसु।", "padacchedaText": "", "audioFile": "PB_hear2read_001304.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001305", "originalText": "युक्तस्वप्नावबोधस्य योगो भवति दुःखहा''। — (भगवद्गीतायां ६.१६, १७) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001305.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001306", "originalText": "जितासनस्य प्राणायामेन मनोविनाशः श्वेताश्वतरैराम्नायते——\n``त्रिरुन्नतं स्थाप्य समं शरीरं\nहृदीन्द्रियाणि मनसा सन्निवेश्य।", "padacchedaText": "", "audioFile": "PB_hear2read_001306.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001307", "originalText": "ब्रह्मोडुपेन प्रतरेत विद्वान्। स्रोतांसि सर्वाणि भयावहानि॥", "padacchedaText": "", "audioFile": "PB_hear2read_001307.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001308", "originalText": "प्राणान्प्रपीड्येह स युक्तचेष्टः\nक्षीणे प्राणे नासिकयोच्छ्वसीत। दुष्टाश्वयुक्तमिव वाहमेनं\nविद्वान्मनो धारयेताप्रमत्तः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001308.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001309", "originalText": "— (श्वेताश्वतरोपनिषदि २.८, ९) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001309.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001310", "originalText": "योगी द्विविधः, विद्यामदाद्यासुरसम्पद्रहितस्तत्सहितश्चेति।", "padacchedaText": "", "audioFile": "PB_hear2read_001310.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001311", "originalText": "तयोराद्यस्य ब्रह्मध्यानेन मनसि निरुद्धे सति, तन्नान्तरीयकतया प्राणो निरुध्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001311.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001312", "originalText": "तं प्रति ``त्रिरुन्नतं—'' (श्वे० उप० २.८) इति मन्त्रः पठितः।", "padacchedaText": "", "audioFile": "PB_hear2read_001312.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001313", "originalText": "द्वितीयस्याभ्यासेन प्राणे निरुद्धे, तन्नान्तरीयकतया मनो निरुध्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001313.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001314", "originalText": "तं प्रति ``प्राणान्प्रपीड्य—'' (श्वे० उप० २.९) इति मन्त्रः प्रवृत्तः।", "padacchedaText": "", "audioFile": "PB_hear2read_001314.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001315", "originalText": "प्राणपीडनप्रकारो वक्ष्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001315.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001316", "originalText": "तेन च पीडनेन युक्तचेष्टो भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_001316.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001317", "originalText": "मनश्चेष्टा विद्यामदादयो निरुध्यन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_001317.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001318", "originalText": "प्राणनिरोधेन चित्तदोषनिरोधे दृष्टान्तोऽन्यत्र श्रूयते—\n``यथा पर्वतधातूनां दह्यन्ते धमनान्मलाः। तथेन्द्रियकृता दोषा दह्यन्ते प्राणनिग्रहात्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001318.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001319", "originalText": "— (अमृतनादोपनिषदि ७) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001319.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001320", "originalText": "अत्रोपपत्तिर्वसिष्ठेन दर्शिता—\n``यः प्राणपवनस्पन्दश्चित्तस्पन्दः स एव हि। प्राणस्पन्दक्षये यत्नः कर्तव्यो धीमतोच्चकैः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001320.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001321", "originalText": "— (लघुयोगवासिष्ठे २८.१२५) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001321.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001322", "originalText": "मनोवाक्चक्षुरादीन्द्रियदेवताः स्वस्वव्यापारं निरन्तरं करिष्याम इति व्रतं धृत्वा श्रमरूपेण मृत्युना ग्रस्ताः।", "padacchedaText": "", "audioFile": "PB_hear2read_001322.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001323", "originalText": "स च मृत्युः प्राणं नाप्नोत्।", "padacchedaText": "", "audioFile": "PB_hear2read_001323.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001324", "originalText": "ततो निरन्तरमुच्छ्वासनिःश्वासौ कुर्वन्नप्ययं प्राणो न श्राम्यति।", "padacchedaText": "", "audioFile": "PB_hear2read_001324.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001325", "originalText": "तदा विचार्य देवताः प्राणरूपं प्राविशन्।", "padacchedaText": "", "audioFile": "PB_hear2read_001325.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001326", "originalText": "सोऽयमर्थो वाजसनेयिभिराम्नायते—\n``अयं वै नः श्रेष्ठ यः सञ्चरंश्चासञ्चरंश्च न व्यथते अथो न रिष्यति हन्तास्यैव सर्वे रूपमसामेति।", "padacchedaText": "", "audioFile": "PB_hear2read_001326.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001327", "originalText": "त एतस्यैव सर्वे रूपमभवंस्तस्मादेत एतेनाख्यायन्ते प्राणा इति'' (बृ० उप० १.५.२१)।", "padacchedaText": "", "audioFile": "PB_hear2read_001327.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001328", "originalText": "अत इन्द्रियाणां प्राणरूपत्वं नाम प्राणाधीनचेष्टावत्त्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001328.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001329", "originalText": "तच्चान्तर्यामिब्राह्मणे सूत्रात्मप्रस्तावे श्रूयते—\n``वायुर्वै गौतम तत्सूत्रं वायुना वै गौतम सूत्रेणायं च लोकः परश्च लोकः सर्वाणि च भूतानि सन्दृब्धानि भवन्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_001329.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001330", "originalText": "तस्माद्वै गौतम पुरुषं प्रेतमाहुर्व्यस्रंसिषतास्यानानीति।", "padacchedaText": "", "audioFile": "PB_hear2read_001330.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001331", "originalText": "वायुना हि गौतम सूत्रेण सन्दृब्धानि भवन्ति'' (बृ० उ० ३.७.२) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001331.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001332", "originalText": "अतः प्राणमनःस्पन्दयोः सहभावित्वात् प्राणनिग्रहे मनो निगृह्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001332.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001333", "originalText": "ननु सहस्पन्दो न युक्तः, सुषुप्तौ चेष्टमानेऽपि प्राणे मनसोऽचेष्टमानत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001333.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001334", "originalText": "न, विलीनत्वेन तदानीं मनसः सत्त्वाभावात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001334.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001335", "originalText": "ननु क्षीणे प्राणे नासिकयोच्छ्वसीतेति व्याहतम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001335.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001336", "originalText": "न हि क्षीणप्राणस्य मृतस्य श्वासं क्वचित्पश्यामः।", "padacchedaText": "", "audioFile": "PB_hear2read_001336.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001337", "originalText": "नापि श्वसतो जीवतः प्राणक्षयोऽस्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_001337.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001338", "originalText": "मैवम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001338.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001339", "originalText": "अनुल्बणत्वस्य क्षयत्वेनात्र विवक्षितत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001339.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001340", "originalText": "यथा खननच्छेदनादिषु व्याप्रियमाणस्य पर्वतमारोहतः शीघ्रं धावतो वा श्वासवेगो यावान्भवति, न तावान्स्थितस्यासीनस्य निद्रितस्य वा विद्यते, तथा प्राणायामपाटवोपेतस्येतरस्मादल्पः श्वासो भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_001340.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001341", "originalText": "एतदेवाभिप्रेत्य श्रूयते—\n``भूत्वा तत्रायतप्राणः शनैरेव समुच्छ्वसेत्''। — (क्षुरिकोपनिषदि ५) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001341.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001342", "originalText": "यथा दुष्टैरश्वैरुपेतो रथो मार्गं त्यक्त्वा यत्र क्वापि नीयते, स च सारथिना दृढमश्वं रज्जुष्वाकृष्य सुखमार्गे पुनर्धार्यते, तथेन्द्रियैर्वासनादिभिरितस्ततो नीयमानं चित्तं प्राणरज्जौ दृढं धृतायां धार्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001342.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001343", "originalText": "``प्राणान्प्रपीड्य—'' (श्वे० उप० २.९) इति यदुक्तं तत्र प्राणपीडनप्रकारोऽन्यत्र श्रूयते—\n``सव्याहृतिं सप्रणवां गायत्री शिरसा सह। त्रिः पठेदायतप्राणः प्राणायामः स उच्यते''॥ ११॥", "padacchedaText": "", "audioFile": "PB_hear2read_001343.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001344", "originalText": "— (अमृतनादोपनिषदि ११)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001344.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001345", "originalText": "प्राणायामास्त्रयः प्रोक्ता रेचकपूरककुम्भकाः॥ १०॥", "padacchedaText": "", "audioFile": "PB_hear2read_001345.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001346", "originalText": "उत्क्षिप्य वायुमाकाशं शून्यं कृत्वा निरात्मकम्। शून्यभावेन युञ्जीत रेचकस्येति लक्षणम्॥ १२॥", "padacchedaText": "", "audioFile": "PB_hear2read_001346.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001347", "originalText": "— (अमृतनादोप० १०, १२)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001347.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001348", "originalText": "``वक्त्रेणोत्पलनालेन तोयमाकर्षयेन्नरः। एवं वायुर्ग्रहीतव्यः पूरकस्येति लक्षणम्''॥ १३॥", "padacchedaText": "", "audioFile": "PB_hear2read_001348.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001349", "originalText": "— (अमृतनादोप० १३)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001349.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001350", "originalText": "नोच्छ्रवसेन्निःश्वसेन्नैव नैव गात्राणि चालयेत्। एवं तावन्नियुञ्जीत कुम्भकस्येति लक्षणम्''॥ १४॥", "padacchedaText": "", "audioFile": "PB_hear2read_001350.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001351", "originalText": "— (अमृतनादोप० १४) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001351.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001352", "originalText": "अत्र शरीरान्तर्गतं वायुं बहिर्निःसारयितुमुत्क्षिप्य शारीरमाकाशं शून्यं निरात्मकं वायुरहितं कृत्वा स्वल्पमपि वायुमप्रवेश्य शून्यभावेनैव नियमयेत्।", "padacchedaText": "", "audioFile": "PB_hear2read_001352.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001353", "originalText": "सोऽयं रेचको भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_001353.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001354", "originalText": "कुम्भको द्विविधः, आन्तरो बाह्यश्चेति।", "padacchedaText": "", "audioFile": "PB_hear2read_001354.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001355", "originalText": "तदुभयं च वसिष्ठ आह—\n``अपानेऽस्तं गते प्राणो यावन्नाभ्युदितो हृदि। तावत्सा कुम्भकावस्था योगिभिर्यानुभूयते''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001355.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001356", "originalText": "— (लघुयोगवासिष्ठे २९.२११)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001356.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001357", "originalText": "``बहिरस्तं गते प्राणे यावन्नापान उद्गतः। तावत्पूर्णसमावस्थां बहिःष्ठं कुम्भकं विदुः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001357.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001358", "originalText": "— (तत्रैव २९.२१६)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001358.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001359", "originalText": "तत्रोच्छ्वास आन्तरकुम्भकविरोधी, निःश्वासो बाह्यकुम्भकविरोधी, गात्रचालनमुभयविरोधि, तस्मिन्सति निःश्वासोच्छ्वासयोरन्यतरस्यावश्यम्भावित्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001359.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001360", "originalText": "पतञ्जलिरप्यासनान्तरभाविनं प्राणायामं सूत्रयामास—\n``तस्मिन्सति निःश्वासोच्छ्वासयोर्गतिविच्छेदः प्राणायामः'' (२.४९) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001360.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001361", "originalText": "ननु कुम्भके गत्यभावेऽपि रेचकपूरकयोरुच्छ्वासनिःश्वासगती विद्येते इति चेत्\nन, अधिकमात्राभ्यासेन स्वभावसिद्धायाः समप्राणगतेर्विच्छेदात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001361.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001362", "originalText": "तमेवाभ्यासं\nसूत्रयति—\n``बाह्याभ्यन्तरस्तम्भवृत्तिर्देशकालसङ्ख्याभिः परिदृष्टो दीर्घः सूक्ष्मः'' (२.५०) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001362.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001363", "originalText": "रेचको बाह्यवृत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_001363.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001364", "originalText": "पूरक आभ्यन्तरवृत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_001364.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001365", "originalText": "कुम्भकः स्तम्भवृत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_001365.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001366", "originalText": "तत्रैकैको देशादिभिः परीक्षणीयः।", "padacchedaText": "", "audioFile": "PB_hear2read_001366.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001367", "originalText": "तद्यथा—स्वभावसिद्धे रेचके हृदयान्निर्गत्य नासाग्रसम्मुखे द्वादशाङ्गुलपर्यन्ते श्वासः समाप्यते, अभ्यासेन तु क्रमेण नाभेराधाराद्वा वायुर्निर्गच्छति, चतुर्विंशत्यङ्गुलपर्यन्ते षट्त्रिंशदङ्गुलपर्यन्ते वा समाप्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_001367.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001368", "originalText": "अत्र\nरेचके प्रयत्नातिशये सति नाभ्यादिप्रदेशक्षोभेणान्तर्निश्चेतुं शक्यम्, बहिश्च सूक्ष्मं तूलं धृत्वा तच्चानेन निश्चेतव्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001368.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001369", "originalText": "सेयं देशपरीक्षा।", "padacchedaText": "", "audioFile": "PB_hear2read_001369.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001370", "originalText": "रेचककाले प्रणवस्यावृत्तयो दश विंशतिस्त्रिंशदित्यादिभिः कालपरीक्षा।", "padacchedaText": "", "audioFile": "PB_hear2read_001370.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001371", "originalText": "अस्मिन्मासे प्रतिदिनं दश रेचकाः उत्तरमासे त्रिंशदित्यादिभिः सङ्ख्या परीक्षा।", "padacchedaText": "", "audioFile": "PB_hear2read_001371.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001372", "originalText": "यथोक्तदेशकालविशिष्टाः प्राणायामा एकस्मिन्दिने दश विंशतिस्त्रिंशदित्यादिभिः सङ्ख्यापरीक्षा।", "padacchedaText": "", "audioFile": "PB_hear2read_001372.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001373", "originalText": "पूरकेऽप्येवं योजनीयम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001373.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001374", "originalText": "यद्यपि कुम्भके देशव्याप्तिविशेषो नावगम्यते, तथापि कालसङ्ख्याव्याप्तिरवगम्यत एव।", "padacchedaText": "", "audioFile": "PB_hear2read_001374.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001375", "originalText": "यथा घनीभूतस्तूलपिण्डः प्रसार्यमाणो दीर्घो विरलतया सूक्ष्मश्च भवति, तथा प्राणोऽपि देशकालसङ्ख्याधिक्येनाभ्यस्यमानो दीर्घो दुर्लक्ष्यतया सूक्ष्मश्च सम्भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_001375.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001376", "originalText": "रेचकादिभ्यस्त्रिभ्योऽन्यं प्रकारं सूत्रयति—\n``बाह्याभ्यन्तरविषयानपेक्षी चतुर्थः'' (२.५१) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001376.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001377", "originalText": "यथाशक्ति सर्वं वायुं विरेच्यानन्तरं क्रियमाणो बहिष्कुम्भकः यथाशक्ति वायुमापूर्यानन्तरं क्रियमाणोऽन्तः कुम्भकः इति, रेचकपूरकावनादृत्य केवलः कुम्भकोऽभ्यस्यमानः पूर्वत्रयापेक्षया चतुर्थो भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_001377.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001378", "originalText": "निद्रातन्द्रादिप्रबलदोषयुक्तानां रेचकादित्रयम्, दोषरहितानां चतुर्थ इति विवेकः।", "padacchedaText": "", "audioFile": "PB_hear2read_001378.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001379", "originalText": "प्राणायामफलं सूत्रयति—\n``ततः क्षीयते प्रकाशावरणं'' (२.५२) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001379.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001380", "originalText": "प्रकाशस्य सत्त्वस्यावरणं तमो निद्रालस्यादिहेतुः, तस्य क्षयो भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_001380.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001381", "originalText": "क्षये सति फलान्तरं सूत्रयति—\n``धारणासु च योग्यता मनसः'' (२.५३) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001381.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001382", "originalText": "आधारनाभिचक्रहृदयभ्रूमध्यब्रह्मरन्ध्रादिदेशविशेषे विकृष्य चित्तस्य स्थापनं धारणा, ``देशबन्धश्चित्तस्य धारणा'' (३.१) इति सूत्रणात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001382.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001383", "originalText": "श्रुतिश्च—\n``मनः सङ्कल्पकं ध्यात्वा सङ्क्षिप्यात्मनि बुद्धिमान्। धारयित्वा तथात्मानं धारणा परिकीर्तिता''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001383.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001384", "originalText": "— (अमृतनादोपनिषदि १६) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001384.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001385", "originalText": "प्राणायामेन रजोगुणकार्याच्चाञ्चल्यात्तमोगुणकार्यादालस्यादेश्च निवारितं मनस्तस्यां धारणायां योग्यं भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_001385.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001386", "originalText": "``प्राणायामदृढाभ्यासैर्युक्त्या च गुरुदत्तया''।", "padacchedaText": "", "audioFile": "PB_hear2read_001386.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001387", "originalText": "(लघुयोगवासिष्ठे २८.१२२) इत्यत्रत्येन युक्तिशब्देन योगिजनप्रसिद्धं शिरोरूपमेरुचालनम्, जिह्वाग्रेण घण्टिकाभ्रमणम्, नाभिचक्रे हृदये च ज्योतिर्ध्यानम्, विस्मृतिप्रदौषधसेवा चेत्येवमादिकं गृह्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001387.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001388", "originalText": "तदेवमध्यात्मविद्यासाधुसङ्गमवासनाक्षयप्राणनिरोधाश्चित्तनाशोपाया दर्शिताः।", "padacchedaText": "", "audioFile": "PB_hear2read_001388.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001389", "originalText": "अथ तदुपायभूतं समाधिं वक्ष्यामः।", "padacchedaText": "", "audioFile": "PB_hear2read_001389.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001390", "originalText": "पञ्चभूम्युपेतस्य चित्तस्य भूमित्रयत्यागेनावशिष्टं भूमिद्वयं समाधिः।", "padacchedaText": "", "audioFile": "PB_hear2read_001390.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001391", "originalText": "भूमयश्च योगभाष्यकृता दर्शिताः—\n``क्षिप्तं मूढं विक्षिप्तमेकाग्रं निरुद्धमिति चित्तस्य भूमयः'' (योगसूत्रभाष्ये १.१) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001391.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001392", "originalText": "आसुरसम्पल्लोकशास्त्रदेहवासनासु वर्तमानं चित्तं क्षिप्तं, निद्रातन्द्रादिग्रस्तं मूढम्, कादाचित्कध्यानयुक्तं क्षिप्ताद्विशिष्टतया विक्षिप्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001392.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001393", "originalText": "तत्र क्षिप्तमूढयोः समाधिशङ्कैव नास्ति। ``विक्षिप्ते तु चेतसि विक्षेपोपसर्जनीभूतः समाधिर्योगपक्षे न वर्तते'' (तत्रैव)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001393.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001394", "originalText": "विक्षेपान्तर्गततया दहनान्तर्गतबीजवत्स सद्य एव विनश्यति।", "padacchedaText": "", "audioFile": "PB_hear2read_001394.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001395", "originalText": "``यस्त्वेकाग्रेचेतसि सम्भूतमर्थं द्योतयति, क्षिणोति च क्लेशान्, कर्मबन्धनानि श्लथयति, निरोधमभिमुखीकरोति, स सम्प्रज्ञातयोग इत्याख्यायते''। (तत्रैव)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001395.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001396", "originalText": "``सर्ववृत्तिनिरोधे त्वसम्प्रज्ञातसमाधिः''। (तत्रैव)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001396.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001397", "originalText": "तत्र सम्प्रज्ञातसमाधिभूमिमेकाग्रतां सूत्रयति—\n``शान्तोदितौ तुल्यप्रत्ययौ चित्तस्यैकाग्रतापरिणामः'' (३.१२) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001397.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001398", "originalText": "शान्तोऽतीतः।", "padacchedaText": "", "audioFile": "PB_hear2read_001398.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001399", "originalText": "उदितो वर्तमानः।", "padacchedaText": "", "audioFile": "PB_hear2read_001399.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001400", "originalText": "प्रत्ययश्चित्तवृत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_001400.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001401", "originalText": "अतीतः प्रत्ययो यं पदार्थं गृह्णाति तमेव चेदुदितो गृह्णीयात्तदा तावुभौ तुल्यौ भवतः।", "padacchedaText": "", "audioFile": "PB_hear2read_001401.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001402", "originalText": "तादृशश्चित्तस्य परिणाम एकाग्रतेत्युच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001402.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001403", "originalText": "एकाग्रताभिवृद्धिलक्षणं समाधिं सूत्रयति—\n``सर्वार्थतैकाग्रतयोः क्षयोदयौ चित्तस्य समाधिपरिणामः'' (३.११) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001403.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001404", "originalText": "रजोगुणेन चाल्यमानं चित्तं क्रमेण सर्वान्पदार्थान्गृह्णाति।", "padacchedaText": "", "audioFile": "PB_hear2read_001404.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001405", "originalText": "तस्य रजोगुणस्य निरोधाय क्रियमाणेन योगिनः प्रयत्नविशेषेण दिने दिने सर्वार्थता क्षीयते, एकाग्रता चोदेति, तादृशश्चित्तस्य परिणामः समाधिरित्युच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001405.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001406", "originalText": "तस्य समाधेरष्टस्वङ्गेषु यमनियमासनप्राणायामप्रत्याहाराः पञ्च बहिरङ्गानि।", "padacchedaText": "", "audioFile": "PB_hear2read_001406.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001407", "originalText": "तत्र यमान्सूत्रयति—\n``अहिंसासत्यास्तेयब्रह्मचर्यापरिग्रहा यमाः'' (२.३०) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001407.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001408", "originalText": "हिंसादिभ्यो निषिद्धधर्मेभ्यो योगिनं यमयन्तीति यमाः।", "padacchedaText": "", "audioFile": "PB_hear2read_001408.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001409", "originalText": "नियमान्सूत्रयति—\n``शौचसन्तोषतपःस्वाध्यायेश्वरप्रणिधानानि नियमाः'' (२.३२) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001409.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001410", "originalText": "जन्महेतोः काम्यधर्मान्निवर्त्य मोक्षहेतौ निष्कामधर्मे नियमयन्ति प्रेरयन्तीति नियमाः।", "padacchedaText": "", "audioFile": "PB_hear2read_001410.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001411", "originalText": "यमनियमयोरनुष्ठानवैलक्षण्यं स्मर्यते—\n``यमान्कुर्वीत सततं न कुर्यान्नियमान्बुधः। यमान्पतत्यकुर्वाणो नियमान्केवलान्भजन्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001411.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001412", "originalText": "— (मनुसंहितायां ४.२०४)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001412.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001413", "originalText": "``पतति नियमवान्यमेष्वसक्तो\nन तु यमवान्नियमालसोऽवसीदेत्। इति यमनियमौ समीक्ष्य बुद्ध्या\nयमबहुष्वनुसन्धीत बुद्धिम्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001413.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001414", "originalText": "इति। यमनियमफलानि सूत्रयति—\n(अहिंसाप्रतिष्ठायां) ``तत्सन्निधौ वैरत्यागः'' (योगसूत्रेषु २.३५)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001414.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001415", "originalText": "(सत्यप्रतिष्ठायां) ``क्रियाफलाश्रयत्वम्'' (यो० सू०.२.३६)।", "padacchedaText": "", "audioFile": "PB_hear2read_001415.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001416", "originalText": "(अस्तेयप्रतिष्ठायां) ``सर्वरत्नोपस्थानम्''। (यो० सू०.२.३७)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001416.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001417", "originalText": "(ब्रह्मचर्यप्रतिष्ठायां) ``वीर्यलाभः''।", "padacchedaText": "", "audioFile": "PB_hear2read_001417.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001418", "originalText": "(यो० सू०.२.३८)।", "padacchedaText": "", "audioFile": "PB_hear2read_001418.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001419", "originalText": "(अपरिग्रहस्थैर्ये) ``जन्मकथन्तासम्बोधः''। (यो० सू०.२.३९)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001419.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001420", "originalText": "जननादिभयाभावः।", "padacchedaText": "", "audioFile": "PB_hear2read_001420.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001421", "originalText": "``शौचात्स्वाङ्गजुगुप्सा परैरसंसर्गः। '' (यो० सू०.२.४०)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001421.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001422", "originalText": "``सत्त्वशुद्धिसौमनस्यैकाग्य्रेन्द्रियजयात्मदर्शनयोग्यत्वानि च'' (यो० सू०.२.४१) सम्भवन्ति। ``सन्तोषादनुत्तमः सुखलाभः'' (यो० सू०.२.४२)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001422.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001423", "originalText": "``कायेन्द्रियसिद्धिरशुद्धिक्षयात्तपसः'' (यो० सू०.२.४३)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001423.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001424", "originalText": "``स्वाध्यायादिष्टदेवतासम्प्रयोगः''।", "padacchedaText": "", "audioFile": "PB_hear2read_001424.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001425", "originalText": "(यो० सू०.२.४४)।", "padacchedaText": "", "audioFile": "PB_hear2read_001425.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001426", "originalText": "``समाधिसिद्धिरीश्वरप्रणिधानात्'' (यो० सू०.२.४५) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001426.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001427", "originalText": "आसनप्राणायामौ व्याख्यातौ।", "padacchedaText": "", "audioFile": "PB_hear2read_001427.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001428", "originalText": "प्रत्याहारं सूत्रयति—\n``स्वविषयासम्प्रयोगे चित्तस्वरूपानुकार इवेन्द्रियाणां प्रत्याहारः'' (यो० सू०.२.५४) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001428.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001429", "originalText": "शब्दस्पर्शरूपरसगन्धा विषयाः, तेभ्यो निवर्तिताः श्रोत्रादयश्चित्तस्वरूपमनुकुर्वन्त इवातिष्ठते।", "padacchedaText": "", "audioFile": "PB_hear2read_001429.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001430", "originalText": "श्रुतिश्च भवति—\n``शब्दादिविषयान्पञ्च मनश्चैवातिचञ्चलम्। चिन्तयेदात्मनो रश्मीन् प्रत्याहारः स उच्यते''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001430.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001431", "originalText": "— (अमृतनादोपनिषदि ५)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001431.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001432", "originalText": "शब्दादयो विषया येषां श्रोत्रादीनां ते श्रोत्रादयः पञ्च, मनः षष्ठानामेतेषामनात्मरूपेभ्यः शब्दादिभ्यो निवर्तनमात्मरश्मित्वेन चिन्तनम्, प्रत्याहारः स इत्यर्थ।", "padacchedaText": "", "audioFile": "PB_hear2read_001432.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001433", "originalText": "प्रत्याहारफलं सूत्रयति—\n``ततः परमा वश्यतेन्द्रियाणाम्'' (यो० सू०.२.५५) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001433.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001434", "originalText": "धारणाध्यानसमाधीन्सूत्रैस्त्रिभिः सूत्रयति—\n``देशबन्धश्चित्तस्य धारणा'' (यो० सू०.३.१),\n``तत्र प्रत्ययैकतानता ध्यानम्'' (यो० सू०.३.२),\n``तदेवार्थमात्रनिर्भासं स्वरूपशून्यमिव समाधिः'' (यो० सू०.३.३) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001434.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001435", "originalText": "आधारादिदेशाः पूर्वमुक्ताः।", "padacchedaText": "", "audioFile": "PB_hear2read_001435.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001436", "originalText": "देशान्तरं श्रूयते—\n``मनः सङ्कल्पकं ध्यात्वा सङ्क्षिप्यात्मनि बुद्धिमान्। धारयित्वा तथात्मानं धारणा परिकीर्तिता''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001436.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001437", "originalText": "— (अमृतनादोपनिषदि १६) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001437.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001438", "originalText": "``यत्सर्ववस्तुसङ्कल्पकं मनः, तदात्मानमेव सङ्कल्पयतु न त्वन्यत्'' इत्येवंविधः प्रयत्न आत्मनि सङ्क्षेपः।", "padacchedaText": "", "audioFile": "PB_hear2read_001438.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001439", "originalText": "प्रत्ययस्यैकतानता तत्त्वैकविषयः प्रवाहः।", "padacchedaText": "", "audioFile": "PB_hear2read_001439.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001440", "originalText": "स च द्विविधः विच्छिद्य विच्छिद्य जायमानः, सन्ततश्चेति।", "padacchedaText": "", "audioFile": "PB_hear2read_001440.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001441", "originalText": "तावुभौ क्रमेण ध्यानसमाधी भवतः।", "padacchedaText": "", "audioFile": "PB_hear2read_001441.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001442", "originalText": "तदुभयं सर्वानुभवयोगिना दर्शितम्—\n``चित्तैकाग्र्याद्यतो ज्ञानमुक्तं समुपजायते। तत्साधनमतो ध्यानं यथावदुपदिश्यते''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001442.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001443", "originalText": "— (मुक्तिकोपनिषदि २.४९)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001443.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001444", "originalText": "``विलाप्य विकृतिं कृत्स्नां सम्भवव्यत्ययक्रमात्। परिशिष्टं च सन्मात्रं चिदानन्दं विचिन्तयेत्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001444.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001445", "originalText": "इति। — (मुक्तिकोपनिषदि २.५०)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001445.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001446", "originalText": "``ब्रह्माकारमनोवृत्तिप्रवाहोऽहङ्कृतिं विना। सम्प्रज्ञातसमाधिः स्याद्ध्यानाभ्यासप्रकर्षजः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001446.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001447", "originalText": "— (मुक्तिकोपनिषदि २.५३) इति च॥", "padacchedaText": "", "audioFile": "PB_hear2read_001447.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001448", "originalText": "तं च भगवत्पादा उदाजह्रुः\n``दृशिस्वरूपं गगनोपमं परं\nसकृद्विभातं त्वमेकमक्षरम्। अलेपकं सर्वगतं यदद्वयं\nतदेव चाहं सततं विमुक्त ओम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_001448.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001449", "originalText": "— (उपदेशसाहस्र्यां १०.१)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001449.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001450", "originalText": "``दृशिस्तु शुद्धोऽहमविक्रियात्मको\nन मेऽस्ति कश्चिद्विषयः स्वभावतः। पुरस्तिरश्चोर्ध्वमधश्च सर्वतः\nसम्पूर्णभूमा त्वज आत्मनि स्थितः॥", "padacchedaText": "", "audioFile": "PB_hear2read_001450.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001451", "originalText": "— (तत्रैव १०.२) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001451.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001452", "originalText": "``अजोऽमरश्चैव तथाजरोऽमृतः स्वयम्प्रभः सर्वगतोऽहमद्वयः। न कारणं कार्यमतीव निर्मलः सदैकतृप्तश्च ततो विमुक्त ओम्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001452.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001453", "originalText": "— (तत्रैव १०.३) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001453.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001454", "originalText": "ननु सम्प्रज्ञातसमाधिरङ्गी, स कथं ध्यानानन्तरभाविनोऽष्टमाङ्गस्य समाधेः स्थान उदाह्रियते?\nनायं दोषः, अत्यन्तभेदाभावात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001454.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001455", "originalText": "यथा वेदमधीयानो माणवकः पदे पदे स्खलन्पुनः पुनः समादधाति, अधीतवेदस्तु सावधानो न स्खलति, अध्यापको निरवधानस्तन्द्रां कुर्वन्नपि न स्खलति, तथा परिपाकतारतम्येन ध्यानसमाधिसम्प्रज्ञातानामवान्तरभेदोऽवगन्तव्यः।", "padacchedaText": "", "audioFile": "PB_hear2read_001455.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001456", "originalText": "धारणादित्रयं मनोविषयत्वात् सम्प्रज्ञातसमाधेरन्तरङ्गम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001456.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001457", "originalText": "यमादिपञ्चकं तु बहिरङ्गम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001457.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001458", "originalText": "तदेतत्सूत्रयति—\n``त्रयमन्तरङ्गं पूर्वेभ्यः'' (यो० सू०.३.७) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001458.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001459", "originalText": "ततः केनापि पुण्येनान्तरङ्गे प्रथमं लब्धे बहिरङ्गलाभाय नातिप्रयासः कर्तव्यः।", "padacchedaText": "", "audioFile": "PB_hear2read_001459.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001460", "originalText": "यद्यपि पतञ्जलिना भौतिकभूततन्मात्रेन्द्रियाहङ्कारादिविषयाः सम्प्रज्ञातसविकल्पसमाधयो बहुधा प्रपञ्चिताः, तथापि तेषामन्तर्धानादिसिद्धिहेतुतया मुक्तिहेतुसमाधिविरोधित्वान्नास्माभिस्तत्रादरः क्रियते।", "padacchedaText": "", "audioFile": "PB_hear2read_001460.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001461", "originalText": "तथा च सूत्रितम्—\n``ते समाधावुपसर्गा व्युत्थाने सिद्धयः'' (यो० सू०.३.३८) इति,\n``स्थान्युपनिमन्त्रणे सङ्गस्मयाकरणं पुनरनिष्टप्रसङ्गात्'' (यो० सू०.३.५२) इति च।", "padacchedaText": "", "audioFile": "PB_hear2read_001461.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001462", "originalText": "स्थानिनो देवाः।", "padacchedaText": "", "audioFile": "PB_hear2read_001462.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001463", "originalText": "उद्दालको देवैरामन्त्रितोऽप्यवज्ञाय तान्देवान्निर्विकल्पसमाधिमेव चकारेत्युपाख्यायते।", "padacchedaText": "", "audioFile": "PB_hear2read_001463.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001464", "originalText": "प्रश्नोत्तराभ्यामप्येवमेवावगम्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001464.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001465", "originalText": "श्रीरामः—\n``जीवन्मुक्तशरीराणां कथमात्मविदां वर। शक्तो नेह दृश्यन्त आकाशगमनादिकाः॥", "padacchedaText": "", "audioFile": "PB_hear2read_001465.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001466", "originalText": "— (लघुयोगवासिष्ठे २८.१)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001466.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001467", "originalText": "वसिष्ठः—\n``अनात्मविदमुक्तोऽपि नभोविहरणादिकम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001467.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001468", "originalText": "द्रव्यमन्त्रक्रियाकालशक्त्याप्नोत्येव राघव''। (तत्रैव २८.२)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001468.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001469", "originalText": "``नात्मज्ञस्यैष विषय आत्मज्ञो ह्यात्ममात्रदृक्। आत्मनात्मनि सन्तृप्तौ नाविद्यामनुधावति''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001469.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001470", "originalText": "— (तत्रैव २८.३)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001470.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001471", "originalText": "``ये केचन जगद्भावास्तानविद्यामयान्विदुः। कथं तेषु किलात्मज्ञस्त्यक्ताविद्यो निमज्जति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001471.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001472", "originalText": "— (तत्रैव २८.५)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001472.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001473", "originalText": "``द्रव्यमन्त्रक्रियाकालशक्तयः साधु सिद्धिदाः। परमात्मपदप्राप्तौ नोपकुर्वन्ति काश्चन॥", "padacchedaText": "", "audioFile": "PB_hear2read_001473.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001474", "originalText": "— (तत्रैव २८.७)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001474.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001475", "originalText": "``सर्वेच्छाजालसंशान्तावात्मलाभोदयो हि यः। स कथं सिद्धिवाञ्छायां मग्नचित्तेन लभ्यते॥", "padacchedaText": "", "audioFile": "PB_hear2read_001475.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001476", "originalText": "— (तत्रैव २८.९)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001476.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001477", "originalText": "``न केचन जगद्भावास्तत्त्वज्ञं रञ्जयन्त्यमी। नागरं नागरीकान्तं कुग्रामललना इव॥", "padacchedaText": "", "audioFile": "PB_hear2read_001477.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001478", "originalText": "इति। — (ल. वा.१८.३४)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001478.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001479", "originalText": "``अपि शीतरुचावर्के सुतीक्ष्णेऽपीन्दुमण्डले। अप्यधः प्रसरत्यग्नौ जीवन्मुक्तो न विस्मयी॥", "padacchedaText": "", "audioFile": "PB_hear2read_001479.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001480", "originalText": "— (तत्रैव २७.६६)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001480.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001481", "originalText": "``चिदात्मन इमा इत्थं प्रस्फुरन्तीह शक्तयः। इत्यस्याश्चर्यजालेषु नाभ्युदेति कुतूहलम्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001481.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001482", "originalText": "— (तत्रैव २७.६७)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001482.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001483", "originalText": "``यस्तु वा भावितात्मापि सिद्धिजालानि वाञ्छति। स सिद्धिसाधकैर्द्रव्यैस्तानि साधयति क्रमात्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001483.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001484", "originalText": "इति च। — (तत्रैव २८.६, योगवासिष्ठे ८९.२३)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001484.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001485", "originalText": "आत्मविषयस्तु सम्प्रज्ञातसमाधिर्वासनाक्षयस्य निरोधसमाधेश्च हेतुः।", "padacchedaText": "", "audioFile": "PB_hear2read_001485.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"
