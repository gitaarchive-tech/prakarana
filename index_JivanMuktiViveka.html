च्छादनं चरति परमहंसः ``(परम० उप०.१—२) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_002224.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002225", "originalText": "न शिखमिति छान्दसो लिङ्गव्यत्ययोऽनुसन्धेयः।", "padacchedaText": "", "audioFile": "PB_hear2read_002225.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002226", "originalText": "यथा विविदिषुः परमहंसः शिखायज्ञोपवीताभ्यां रहितो मुख्यस्तथा योगी दण्डाच्छादनाभ्यां रहितः सन्मुख्यो भवति, दण्डस्य वैणवत्त्वादिलक्षणमाच्छादनस्य कन्थात्वादिलक्षणं च परीक्षितुं दण्डादिकं सम्पादयितुं रक्षितुं च चित्ते व्यापृते सति चित्तवृत्तिनिरोधलक्षणो योगो न सिध्येदिति।", "padacchedaText": "", "audioFile": "PB_hear2read_002226.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002227", "originalText": "तच्च न युक्तम्, ``न हि वरविघाताय कन्योद्वाहः'' इति न्यायात्।", "padacchedaText": "", "audioFile": "PB_hear2read_002227.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002228", "originalText": "आच्छादनाद्यभावे शीतादिबाधायाः कः प्रतीकार इत्याशङ्क्याह—\n``न शीतं न चोष्णं न सुखं न दुःखं न मानावमानौ च षडूर्मिवर्जम्'' (परम० उप०.२) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_002228.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002229", "originalText": "निरुद्धाशेषचित्तवृत्तेर्योगिनः शीतं नास्ति, तत्प्रतीत्यभावात्।", "padacchedaText": "", "audioFile": "PB_hear2read_002229.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002230", "originalText": "यथा लीलायामासक्तस्य बालस्याच्छादनादिरहितस्यापि हेमन्तशिशिरयोः प्रातःकालेऽपि शीतं नास्ति, तथा परमात्मन्यासक्तस्य योगिनः शीताभावः।", "padacchedaText": "", "audioFile": "PB_hear2read_002230.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002231", "originalText": "घर्मकाल उष्णाभावश्च तथैवावगन्तव्यः।", "padacchedaText": "", "audioFile": "PB_hear2read_002231.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002232", "originalText": "वर्षासु तदभावसमुच्चयार्थश्चकारः।", "padacchedaText": "", "audioFile": "PB_hear2read_002232.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002233", "originalText": "शीतोष्णयोरप्रतीतौ तज्जन्ययोः सुखदुःखयोरभाव उपपन्नः।", "padacchedaText": "", "audioFile": "PB_hear2read_002233.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002234", "originalText": "निदाघे शीतं सुखजनकं हेमन्ते दुःखजनकम्।", "padacchedaText": "", "audioFile": "PB_hear2read_002234.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002235", "originalText": "उक्तविपर्यय उष्णे द्रष्टव्यः।", "padacchedaText": "", "audioFile": "PB_hear2read_002235.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002236", "originalText": "मानः पुरुषान्तरेण सम्पादितः सत्कारः।", "padacchedaText": "", "audioFile": "PB_hear2read_002236.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002237", "originalText": "अवमानस्तिरस्कारः।", "padacchedaText": "", "audioFile": "PB_hear2read_002237.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002238", "originalText": "यदा योगिनः स्वात्मव्यतिरिक्तं पुरुषान्तरमेव न प्रतीयते तदा मानावमानौ दूरादपेतौ।", "padacchedaText": "", "audioFile": "PB_hear2read_002238.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002239", "originalText": "चकारः शत्रुमित्ररागद्वेषादिद्वन्द्वाभावं समुच्चिनोति।", "padacchedaText": "", "audioFile": "PB_hear2read_002239.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002240", "originalText": "षडूर्मयः— क्षुत्पिपासे शोकमोहौ जरामरणे च।", "padacchedaText": "", "audioFile": "PB_hear2read_002240.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002241", "originalText": "तेषां त्रयाणां द्वन्द्वानां क्रमेण प्राणमनोदेहधर्मत्वादात्मतत्त्वाभिमुखस्य योगिनस्तद्वर्जनं युज्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_002241.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002242", "originalText": "नन्वस्त्वेवं समाधिदशायां शीताद्यभाव, व्युत्थानदशायां तु निन्दादिक्लेशः संसारिणमिवैनं बाधेतैवेत्याशङ्क्याह— ``निन्दागर्वमत्सरदभ्भदर्पेच्छाद्वेषसुखदुःखकामक्रोधलोभमोहहर्षासूयाहङ्कारा—दींश्च हित्वा'' (परम० उप०.२) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_002242.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002243", "originalText": "विविधैः पुरुषैः स्वस्मिन्नापादिता दोषोक्तिर्निन्दा।", "padacchedaText": "", "audioFile": "PB_hear2read_002243.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002244", "originalText": "अन्येभ्योऽधिकोऽहमिति चित्तवृत्तिर्गर्वः।", "padacchedaText": "", "audioFile": "PB_hear2read_002244.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002245", "originalText": "विद्याधनादिभिरन्यसदृशो भवामीति बुद्धिर्मत्सरः।", "padacchedaText": "", "audioFile": "PB_hear2read_002245.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002246", "originalText": "परेषामग्रे जपध्यानादिप्रकटनं दम्भः।", "padacchedaText": "", "audioFile": "PB_hear2read_002246.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002247", "originalText": "भर्त्सनादिषु दृढबुद्धिर्दर्पः।", "padacchedaText": "", "audioFile": "PB_hear2read_002247.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002248", "originalText": "धनाद्यभिलाष इच्छा।", "padacchedaText": "", "audioFile": "PB_hear2read_002248.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002249", "originalText": "शत्रुवधादिषु बुद्धिर्द्वेषः।", "padacchedaText": "", "audioFile": "PB_hear2read_002249.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002250", "originalText": "अनुकूलद्रव्यादिलाभेन बुद्धिस्वास्थ्यं सुखम्।", "padacchedaText": "", "audioFile": "PB_hear2read_002250.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002251", "originalText": "तद्विपर्ययो दुःखम्।", "padacchedaText": "", "audioFile": "PB_hear2read_002251.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002252", "originalText": "योषिदाद्यभिलाषः कामः।", "padacchedaText": "", "audioFile": "PB_hear2read_002252.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002253", "originalText": "कामितार्थविघातजन्यो बुद्धिक्षोभः क्रोधः।", "padacchedaText": "", "audioFile": "PB_hear2read_002253.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002254", "originalText": "लब्धस्य धनस्य त्यागासहिष्णुत्वं लोभः।", "padacchedaText": "", "audioFile": "PB_hear2read_002254.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002255", "originalText": "हितेष्वहितबुद्धिरहितेषु च हितबुद्धिर्मोहः।", "padacchedaText": "", "audioFile": "PB_hear2read_002255.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002256", "originalText": "चित्तगतसुखाभिव्यञ्जिका मुखविकासादिहेतुर्धीवृत्तिर्हर्षः।", "padacchedaText": "", "audioFile": "PB_hear2read_002256.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002257", "originalText": "परकीयगुणेषु दोषत्वारोपणमसूया।", "padacchedaText": "", "audioFile": "PB_hear2read_002257.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002258", "originalText": "देहेन्द्रियादिसङ्घातेष्वात्मभ्रमोऽहङ्कारः।", "padacchedaText": "", "audioFile": "PB_hear2read_002258.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002259", "originalText": "आदिशब्देन भोग्यवस्तुषु ममकारसमीचीनत्वादिबुद्धयो गृह्यन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_002259.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002260", "originalText": "चकारो यथोक्तनिन्दादिविपरीतं स्तुत्यादिकं समुच्चिनोति।", "padacchedaText": "", "audioFile": "PB_hear2read_002260.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002261", "originalText": "एतान् सर्वान् निन्दादीन् हित्वा पूर्वोक्तवासनाक्षयाभ्यासेन परित्यज्यावतिष्ठेतेति शेषः।", "padacchedaText": "", "audioFile": "PB_hear2read_002261.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002262", "originalText": "ननु विद्यमाने स्वदेहे तत्परित्यागो न सम्भवतीत्याशङ्क्याह—``स्ववपुः कुणपमिव दृश्यते यतस्तद्वपुरपध्वस्तम्'' (परम० उप०.२) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_002262.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002263", "originalText": "पूर्वं यत्स्वकीयं वपुस्तदिदानीं योगिना स्वात्मचैतन्यात्पृथग्भूतत्वेन कुणपमिवावलोक्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_002263.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002264", "originalText": "यथा श्रद्धालुः स्पर्शनभीत्या शवदेहं दूरे स्थितोऽवलोकयति, तथाऽयं योगी तादात्म्यभ्रान्त्युदयभीत्या सावधानो देहं चिदात्मनः सकाशान्निरन्तरं विविनक्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_002264.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002265", "originalText": "यतः कारणात् तद्वपुराचार्योपदेशागमानुभवैरपध्वस्तं चिदात्मनः\nसकाशान्निराकृतम्।", "padacchedaText": "", "audioFile": "PB_hear2read_002265.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002266", "originalText": "ततश्चैतन्यवियुक्तस्य देहस्य शवतुल्यतया दृश्यमानत्वात् सत्यपि देहे निन्दादित्यागो घटत इत्यभिप्रायः।", "padacchedaText": "", "audioFile": "PB_hear2read_002266.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002267", "originalText": "ननूत्पन्नो दिग्भ्रमः सूर्योदयदर्शनेन विनष्टोऽपि यथा कदाचिदनुवर्तते, तथा कदाचिदात्मनि देहात्मसंशयाद्यनुवृत्तौ निन्दादिक्लेशः पुनः पुनः प्रसज्येते— त्याशङ्क्याह—\n``संशयविपरीतमिथ्याज्ञानानां यो हेतुस्तेन नित्यनिवृत्तः'' (प० उप० २) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_002267.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002268", "originalText": "आत्मा कर्तृत्वादिधर्मोपेतस्तद्रहितो वेत्यादिकं संशयज्ञानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_002268.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002269", "originalText": "देहादिरूप एवात्मेति विपरीतज्ञानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_002269.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002270", "originalText": "एतदुभयं भोक्तृविषयम्।", "padacchedaText": "", "audioFile": "PB_hear2read_002270.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002271", "originalText": "मिथ्याज्ञानं तु भोग्यविषयमत्र विवक्षितम्।", "padacchedaText": "", "audioFile": "PB_hear2read_002271.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002272", "originalText": "तच्चानेकविधम्—``सङ्कल्पप्रभवान्कामान्'' (भगवद्गीतायां ६.२४) इत्यत्र स्पष्टीकृतम्।", "padacchedaText": "", "audioFile": "PB_hear2read_002272.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002273", "originalText": "तद्धेतुश्चतुर्विधः, ``अनित्याशुचिदुःखानात्मसु नित्यशुचिसुखात्मख्यातिरविद्या'' (योगसूत्रेषु २.५) इति सूत्रणात्।", "padacchedaText": "", "audioFile": "PB_hear2read_002273.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002274", "originalText": "अनित्ये गिरिनदीसमुद्रादौ नित्यत्वभ्रान्तिरेका।", "padacchedaText": "", "audioFile": "PB_hear2read_002274.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002275", "originalText": "अशुचौ पुत्रभार्यादिशरीरे शुचित्वभ्रान्तिर्द्वितीया।", "padacchedaText": "", "audioFile": "PB_hear2read_002275.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002276", "originalText": "दुःखे कृषिवाणिज्यादौ सुखत्वभ्रान्तिस्तृतीया।", "padacchedaText": "", "audioFile": "PB_hear2read_002276.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002277", "originalText": "गौणमिथ्यात्मनि पुत्रभार्यादावन्नमयादिके चानात्मनि मुख्यात्मत्वभ्रान्तिश्चतुर्थी।", "padacchedaText": "", "audioFile": "PB_hear2read_002277.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002278", "originalText": "एतेषां संशयादीनां हेतुरद्वितीयब्रह्मात्मतत्त्वावरकमज्ञानं तद्वासना च।", "padacchedaText": "", "audioFile": "PB_hear2read_002278.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002279", "originalText": "तच्चाज्ञानं योगिनः परमहंसस्य महावाक्यार्थबोधेन निवृत्तम्, वासना तु योगाभ्यासेन निवृत्ता।", "padacchedaText": "", "audioFile": "PB_hear2read_002279.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002280", "originalText": "उदाहृतायां\nदिग्भ्रान्तावज्ञाने निवृत्तेऽपि वासनायाः सद्भावाद्यथापूर्वं भ्रान्तिव्यवहारः।", "padacchedaText": "", "audioFile": "PB_hear2read_002280.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002281", "originalText": "योगिनस्तु भ्रान्तिहेतुद्वयराहित्यात्कुतः संशयादीन्यनुवर्तेरन्? तमेनमनुवृत्त्यभावमभिप्रेत्य तेन हेतुद्वयेन योगी नित्यनिवृत्त इत्युक्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_002281.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002282", "originalText": "सत्यामप्यज्ञानतद्वासनानिवृत्तौ तस्या निवृत्तेर्विनाशाभावान्नित्यत्वं द्रष्टव्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_002282.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002283", "originalText": "तन्नित्यत्वे हेतुमाह—\n``तन्नित्यबोधः'' (परम० उप० २)।", "padacchedaText": "", "audioFile": "PB_hear2read_002283.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002284", "originalText": "सर्वनामत्वात्प्रसिद्धार्थवाची तच्छब्दोऽत्र सर्ववेदान्तप्रसिद्धं परमात्मानमाचष्टे।", "padacchedaText": "", "audioFile": "PB_hear2read_002284.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002285", "originalText": "तस्मिन्परमात्मनि नित्यो बोधो यस्य योगिनः सोऽयं तन्नित्यबोधः।", "padacchedaText": "", "audioFile": "PB_hear2read_002285.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002286", "originalText": "योगी हि ``तमेव धीरो विज्ञाय प्रज्ञां कुर्वीत ब्राह्मणः'' (बृहदारण्यकोपनिषदि ४.४.२१) इति श्रुतिमनुसृत्य चित्तविक्षेपान्योगेन परिहृत्य नैरन्तर्येण परमात्मविषयामेव प्रज्ञां करोति।", "padacchedaText": "", "audioFile": "PB_hear2read_002286.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002287", "originalText": "अतो बोधस्य नित्यत्वाद्द्द्बोधविनाश्ययोरज्ञानतद्वासनयोर्निवृत्ति—र्नित्येत्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_002287.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002288", "originalText": "बुध्यमानस्य परमात्मनस्तार्किकेश्वरवत्तटस्थत्वशङ्कां वारयति—\n``तत्स्वयमेवावस्थितिः'' (परम० उप०.२) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_002288.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002289", "originalText": "यद्वेदान्तवेद्यं परं ब्रह्मास्ति तत्स्वयमेव न तु स्वस्मादन्यदित्येवं निश्चित्य योगिनोऽवस्थितिर्भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_002289.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002290", "originalText": "तस्य योगिनो ब्रह्मानुभवप्रकारं दर्शयति—\n``तं शान्तमचलमद्वयानन्दविज्ञानघन एवास्मि तदेव मम परमं धाम'' (परम० उप०.२) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_002290.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002291", "originalText": "तमित्यादिपदत्रये द्वितीया प्रथमार्थे द्रष्टव्या।", "padacchedaText": "", "audioFile": "PB_hear2read_002291.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002292", "originalText": "यः परमात्मा शान्तः क्रोधादिविक्षेपरहितः, अचलो गमनादिक्रियारहितः, स्वगतसजातीयविजातीयभेदशून्यः सच्चिदानन्दैकरसोऽस्ति स एवाहमस्मि।", "padacchedaText": "", "audioFile": "PB_hear2read_002292.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002293", "originalText": "तदेव ब्रह्मतत्त्वं मम योगिनः परमं धाम वास्तवं स्वरूपम्, न त्वेतत्कर्तृत्वभोक्तृत्वादियुक्तम्, एतस्य मायाकल्पितत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_002293.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002294", "originalText": "नन्वात्मनः परब्रह्मत्व आनन्दावाप्तिरिदानीं कुतो नेत्यत्रानन्दावाप्तिः सदृष्टान्तमुक्ताभियुक्तैः—\n``गवां सर्पिः शरीरस्थं न करोत्यङ्गपोषणम्। तदेव कर्मरचितं पुनस्तस्यैव भेषजम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_002294.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002295", "originalText": "एवं सर्वशरीरस्थः सर्पिवत्परमेश्वरः।", "padacchedaText": "", "audioFile": "PB_hear2read_002295.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002296", "originalText": "विना चोपासनां देवो न करोति हितं नृषु। ''— (बृहद्योगीयाज्ञवल्क्यस्मृतौ ९.३०—३१) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_002296.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002297", "originalText": "(**यथा सर्पिः शरीरस्थं गवां न कुरुते बलम्। निर्गतं कर्मसंयुक्त दत्तं तासां महाबलम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_002297.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002298", "originalText": "तथा विष्णुः शरीरस्थो न करोति हितं नृणाम्। विनाराधनया देवः सर्वगः परमेश्वरः॥", "padacchedaText": "", "audioFile": "PB_hear2read_002298.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002299", "originalText": "— (गरुडपुराणे २२७.२,३)॥", "padacchedaText": "", "audioFile": "PB_hear2read_002299.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002300", "originalText": "यदि योगिनः पूर्वाश्रमप्रसिद्धा आचार्यपितृभ्रात्रादयः कर्मिणः श्रद्धाजडाः शिखायज्ञोपवीतसन्ध्या—वन्दनादिराहित्येन पाषण्डित्वमारोप्य व्यामोहयेयुस्तदा व्यामोहानुत्पत्तये योगिनो वर्तमानं निश्चयं दर्शयति—\n``तदेव च शिखा तदेवोपवीतं च परमात्मात्मनोरेकत्वज्ञानेन तयोर्भेद एव विभग्नः सा सन्ध्या'' (परम० उप०.२) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_002300.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002301", "originalText": "यद्वेदान्तवेद्यस्य परब्रह्मणो ज्ञानं तदेव कर्माङ्गभूतबाह्यशिखायज्ञोपवीतस्थानीयम्।", "padacchedaText": "", "audioFile": "PB_hear2read_002301.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002302", "originalText": "अन्ये च मन्त्रद्रव्यलक्षणे कर्माङ्गभूते चकाराभ्यां समुच्चीयेते।", "padacchedaText": "", "audioFile": "PB_hear2read_002302.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002303", "originalText": "शिखाद्यङ्गसाध्यैः कर्मभिरुत्पन्नं यत्स्वर्गादिसुखं तत्सर्वं ब्रह्मज्ञानेनैव लभ्यते, विषयानन्दस्य सर्वस्य ब्रह्मानन्दलेशत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_002303.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002304", "originalText": "``एतस्यैवानन्दस्यान्यानि भूतानि मात्रामुपजीवन्ति'' (बृ. उप०.४.३.३२) इति श्रुतिः।", "padacchedaText": "", "audioFile": "PB_hear2read_002304.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002305", "originalText": "एतदेवाभिप्रेत्याथर्वणिका ब्रह्मोपनिषद्यामनन्ति—\n``सशिखं वपनं कृत्वा बहिःसूत्रं त्यजेद्बुधः। यदक्षरं परं ब्रह्म तत्सूत्रमिति धारयेत्॥", "padacchedaText": "", "audioFile": "PB_hear2read_002305.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002306", "originalText": "(ब्रह्मोपनिषदि ६)॥", "padacchedaText": "", "audioFile": "PB_hear2read_002306.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002307", "originalText": "``सूचनात्सूत्रमित्याहुः सूत्रं नाम परं पदम्। तत्सूत्रं विदितं येन स विप्रो वेदपारगः॥", "padacchedaText": "", "audioFile": "PB_hear2read_002307.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002308", "originalText": "(तत्रैव ७)॥", "padacchedaText": "", "audioFile": "PB_hear2read_002308.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002309", "originalText": "``येन सर्वमिदं प्रोतं सूत्रे मणिगणा इव। तत्सूत्रं धारयेद्योगी योगवित्तत्त्वदर्शिवान्॥", "padacchedaText": "", "audioFile": "PB_hear2read_002309.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002310", "originalText": "(तत्रैव ८)॥", "padacchedaText": "", "audioFile": "PB_hear2read_002310.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002311", "originalText": "``बहिःसूत्रं त्यजेद्विद्वान् योगमुत्तममास्थितः।", "padacchedaText": "", "audioFile": "PB_hear2read_002311.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002312", "originalText": "ब्रह्मभावमिदं सूत्रं धारयेद्यः स चेतनः। धारणात्तस्य सूत्रस्य नोच्छिष्टो नाशुचिर्भवेत्॥", "padacchedaText": "", "audioFile": "PB_hear2read_002312.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002313", "originalText": "(तत्रैव ९)॥", "padacchedaText": "", "audioFile": "PB_hear2read_002313.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002314", "originalText": "``सूत्रमन्तर्गतं येषां ज्ञानयज्ञोपवीतिनाम्। ते वै सूत्रविदो लोके ते च यज्ञोपवीतिनः॥", "padacchedaText": "", "audioFile": "PB_hear2read_002314.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002315", "originalText": "(तत्रैव १०)॥", "padacchedaText": "", "audioFile": "PB_hear2read_002315.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002316", "originalText": "``ज्ञानशिखा ज्ञाननिष्ठा ज्ञानयज्ञोपवीतिनः। ज्ञानमेव परं तेषां पवित्रं ज्ञानमुच्यते॥", "padacchedaText": "", "audioFile": "PB_hear2read_002316.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002317", "originalText": "(तत्रैव ११)॥", "padacchedaText": "", "audioFile": "PB_hear2read_002317.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002318", "originalText": "``अग्नेरिव शिखा नान्या यस्य ज्ञानमयी शिखा। स शिखीत्युच्यते विद्वान् नेतरे केशधारिणः॥", "padacchedaText": "", "audioFile": "PB_hear2read_002318.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002319", "originalText": "(तत्रैव १२)॥", "padacchedaText": "", "audioFile": "PB_hear2read_002319.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002320", "originalText": "``कर्मण्यधिकृता ये तु वैदिके ब्राह्मणादयः। तैर्विधार्यमिदं सूत्रं कर्माङ्गं तद्धि वै स्मृतम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_002320.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002321", "originalText": "(तत्रैव १३)॥", "padacchedaText": "", "audioFile": "PB_hear2read_002321.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002322", "originalText": "``शिखा ज्ञानमयी यस्योपवीतं चापि तन्मयम्। ब्राह्मण्यं सकलं तस्य इति ब्रह्मविदो विदुः॥", "padacchedaText": "", "audioFile": "PB_hear2read_002322.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002323", "originalText": "(तत्रैव १४)॥", "padacchedaText": "", "audioFile": "PB_hear2read_002323.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002324", "originalText": "``इदं यज्ञोपवीतं च परमं यत्परायणम्। विद्वान्यज्ञोपवीती स्यात्तज्ज्ञास्तं यज्विनं विदुः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_002324.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002325", "originalText": "(तत्रैव १५) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_002325.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002326", "originalText": "तस्माद्योगिनः शिखायज्ञोपवीते यथा विद्येते तथैव सन्ध्यापि विद्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_002326.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002327", "originalText": "यः शास्त्रगम्यः परमात्मा यश्चाहम्प्रत्ययगम्यो जीवात्मा, तयोरेकत्वज्ञानेन महावाक्यजन्येन भ्रान्तिप्रतीतो भेदो विशेषेण भग्न एव।", "padacchedaText": "", "audioFile": "PB_hear2read_002327.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002328", "originalText": "पुनर्भ्रान्त्यनुदयो भङ्गस्य विशेषः।", "padacchedaText": "", "audioFile": "PB_hear2read_002328.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002329", "originalText": "येयमेकत्वबुद्धिः सेयमुभयोरात्मनोः सन्धौ जायमानत्वात् सन्ध्येत्युच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_002329.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002330", "originalText": "अहोरात्रयोः सन्धावनुष्ठेया क्रिया यथा सन्ध्या तद्वत्।", "padacchedaText": "", "audioFile": "PB_hear2read_002330.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002331", "originalText": "एवं च सति योगी श्रद्धाजडैर्न व्यामोहयितुं शक्यः।", "padacchedaText": "", "audioFile": "PB_hear2read_002331.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002332", "originalText": "``कोऽयं मार्गः? ``इति प्रश्नस्य ``असौ स्वपुत्र'' (परम० उप०. १) इत्यादिनोत्तरमुक्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_002332.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002333", "originalText": "``का स्थितिः''? इत्येतस्य ``महापुरुष—'' इत्यादिना सङ्क्षिप्योत्तरमुक्त्वा ``संशयविपरीत—'' इत्यादिना तदेव प्रपञ्च्येदानी—\nमुपसंहरति— ``सर्वान्कामान्परित्यज्य अद्वैते परमा स्थितिः''।", "padacchedaText": "", "audioFile": "PB_hear2read_002333.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002334", "originalText": "(परम. उप०.३) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_002334.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002335", "originalText": "क्रोधलोभादीनां कामपूर्वकत्वात् कामपरित्यागेन चित्तदोषाः सर्वेऽपि परित्यज्यन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_002335.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002336", "originalText": "एतदेवाभिप्रेत्य वाजसनेयिभिराम्नातं— ``अथो खल्वाहुः काममय एवायं पुरुषः'' (बृहदारण्यकोपनिषदि ४.४.५) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_002336.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002337", "originalText": "अतो निष्कामस्य योगिचित्तस्याद्वैते निर्विघ्ना स्थितिरुपपद्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_002337.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002338", "originalText": "ननु दण्डग्रहणविधिवासनयोपेता विविदिषासंन्यासिनो योगिनं दण्डरहितं परमहंसं नाभ्युपगच्छन्तीत्याशङ्क्याह—\n``ज्ञानदण्डो धृतो येन एकदण्डी स उच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_002338.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002339", "originalText": "काष्ठदण्डो धृतो येन सर्वाशी ज्ञानवर्जितः। स याति नरकान्घोरान्महारौरवसंज्ञकान्॥", "padacchedaText": "", "audioFile": "PB_hear2read_002339.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002340", "originalText": "तितिक्षाज्ञानवैराग्यशमादिगुणवर्जितः। भिक्षामात्रेण यो जीवेत्स पापी यतिवृत्तिहा॥", "padacchedaText": "", "audioFile": "PB_hear2read_002340.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002341", "originalText": "इदमन्तरं ज्ञात्वा स परमहंसः'' (परम० उप०.३.३) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_002341.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002342", "originalText": "परमहंसस्य योऽयमेकदण्डः स द्विविधः— ज्ञानदण्डः काष्ठदण्डश्चेति।", "padacchedaText": "", "audioFile": "PB_hear2read_002342.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002343", "originalText": "यथा त्रिदण्डिनो वाग्दण्डो मनोदण्डः कर्मदण्डश्चेति (``कायदण्डश्चेति'' इति वा पाठः) त्रैविध्यं तद्वत्।", "padacchedaText": "", "audioFile": "PB_hear2read_002343.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002344", "originalText": "वाग्दण्डादयो मनुना स्मर्यन्ते—\n``वाग्दण्डोऽथ मनोदण्डः कर्मदण्डस्तथैव च। यस्यैते नियता बुद्धौ स त्रिदण्डीति चोच्यते॥", "padacchedaText": "", "audioFile": "PB_hear2read_002344.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002345", "originalText": "त्रिदण्डमेतन्निक्षिप्य सर्वभूतेषु मानवः। कामक्रोधौ तु संयम्य ततः सिद्धिं निगच्छति''॥", "padacchedaText": "", "audioFile": "PB_hear2read_002345.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002346", "originalText": "— (मनु.१२.१०, ११) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_002346.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002347", "originalText": "तेषां स्वरूपं दक्षः स्मरति—\n``वाग्दण्डोऽथ मनोदण्डः कर्मदण्डस्तथैव च।", "padacchedaText": "", "audioFile": "PB_hear2read_002347.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002348", "originalText": "यस्यै नियता दण्डास्त्रिदण्डीति स उच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_002348.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002349", "originalText": "वाग्दण्डे मौनमातिष्ठेत् कर्मदण्डे त्वनीहताम्। मानसस्य तु दण्डस्य प्राणायामो विधीयते''॥", "padacchedaText": "", "audioFile": "PB_hear2read_002349.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002350", "originalText": "इति।", "padacchedaText": "", "audioFile": "PB_hear2read_002350.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002351", "originalText": "``कर्मदण्डोऽल्पभोजनम्'' इति स्मृत्यन्तरपाठः।", "padacchedaText": "", "audioFile": "PB_hear2read_002351.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002352", "originalText": "ईदृशं त्रिदण्डित्वं परमहंसस्याप्यस्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_002352.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002353", "originalText": "तदेतदभिप्रेत्य पितामहः स्मरति—\n``यतिः परमहंसस्तु तुर्याख्यः श्रुतिचोदितः। मैच नियमैर्युक्त विष्णुरूपी त्रिदण्डभृत्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_002353.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002354", "originalText": "इति।", "padacchedaText": "", "audioFile": "PB_hear2read_002354.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002355", "originalText": "एवं सति मौनादीनां वागादिदमनहेतुत्वाद्यथा दण्डत्वं तथैवाज्ञानतत्कार्यदमनहेतोर्ज्ञानस्य दण्डत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_002355.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002356", "originalText": "अयं ज्ञानदण्डो येन परमहंसेन धृतः स एव मुख्य एकदण्डीत्युच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_002356.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002357", "originalText": "मानसस्य ज्ञानदण्डस्य कदाचिच्चित्तविक्षेपेण विस्मृतिः प्रसज्येतेति तन्निवारणार्थं स्मारकः काष्ठदण्डो ध्रियते।", "padacchedaText": "", "audioFile": "PB_hear2read_002357.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002358", "originalText": "तदेतच्छास्त्रार्थर—\nहस्यमबुद्ध्वा वेषमात्रेण पुरुषार्थसिद्धिमभिप्रेत्य काष्ठदण्डो येन परमहंसेन धृतः स पुरुषो बहुविधयातनोपेतत्वाद्घोरान्महारौरवसंज्ञकान्नरकानाप्नोति।", "padacchedaText": "", "audioFile": "PB_hear2read_002358.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002359", "originalText": "तत्र हेतुरच्यते??— परमहंसवेषं दृष्ट्वा ज्ञानित्वभ्रान्त्या सर्वे जनाः स्वस्वगृहे तं भोजयन्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_002359.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002360", "originalText": "अयं च जिह्वालम्पटो वर्ज्यावर्ज्यविवेकमकृत्वा सर्वमन्नमश्नाति।", "padacchedaText": "", "audioFile": "PB_hear2read_002360.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002361", "originalText": "तेन प्रत्यवायं प्राप्नोति।", "padacchedaText": "", "audioFile": "PB_hear2read_002361.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002362", "originalText": "यानि तु ``नान्नदोषेण मस्करी'' (संन्यासोपनिषदि ७२), ``चातुर्वर्ण्यं चरेद्भैक्षम्'' इत्यादिस्मृतिवचनानि तानि ज्ञानिविषयाणि।", "padacchedaText": "", "audioFile": "PB_hear2read_002362.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002363", "originalText": "अयं च ज्ञानवर्जित इति युक्तोऽस्य नरकः।", "padacchedaText": "", "audioFile": "PB_hear2read_002363.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002364", "originalText": "अत एव ज्ञानहीनस्य यतेर्भिक्षानियममाह मनुः—\n``न चोत्पातनिमित्ताभ्यां न नक्षत्राङ्गविद्यया। नानुशासनवादाभ्यां भिक्षां लिप्सेत कर्हिचित्॥ ५०॥", "padacchedaText": "", "audioFile": "PB_hear2read_002364.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002365", "originalText": "एककालं चरेद्भैक्षं न प्रसज्येत विस्तरे॥", "padacchedaText": "", "audioFile": "PB_hear2read_002365.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002366", "originalText": "भैक्षे प्रसक्तो हि यतिर्विषयेष्वपि सज्जति''॥ ५५॥", "padacchedaText": "", "audioFile": "PB_hear2read_002366.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002367", "originalText": "— (मनु० ६.५०, ५५)॥", "padacchedaText": "", "audioFile": "PB_hear2read_002367.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002368", "originalText": "ज्ञानाभ्यासिनं प्रति त्वेवं स्मर्यते—\n``एकवारं द्विवारं वा भुञ्जीत परहंसकः। येन केन प्रकारेण ज्ञानाभ्यासी भवेत्सदा''॥", "padacchedaText": "", "audioFile": "PB_hear2read_002368.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002369", "originalText": "इति।", "padacchedaText": "", "audioFile": "PB_hear2read_002369.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002370", "originalText": "एवं च सति ज्ञानदण्डकाष्ठदण्डयोर्यदन्तरमुत्तमत्वाधमत्वरूपं तदिदमवगत्योत्तमं ज्ञानदण्डं यो धारयति स एव मुख्यः परमहंस इत्यभ्युपगन्तव्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_002370.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002371", "originalText": "नन्वस्त्वभिज्ञस्य परमहंसस्य ज्ञानदण्डो माभूत्वकाष्ठदण्डनिर्बन्धः, इतरा तु चर्या सर्वा कीदृशीत्याशङ्क्याह—\n``आशाम्बरो न नमस्कारो न स्वधाकारो न निन्दा न स्तुतिर्यादृच्छिको भवेद् भिक्षुर्नावाहनं न विसर्जनं न मन्त्रं न ध्यानं नोपासनं न लक्ष्यं नालक्ष्यं न पृथङ्नापृथङ् न चाहं न त्वं न च सर्वं न चानिकेतस्थितिरेव स भिक्षुः सौवर्णादीन्नैव परिग्रहेन्न लोकं नावलोकं च'' (परम० उप०.४) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_002371.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002372", "originalText": "आशा दिशः, ता एवाम्बरं वस्त्रमाच्छादनं यस्यासावाशाम्बरः।", "padacchedaText": "", "audioFile": "PB_hear2read_002372.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002373", "originalText": "यत्तु स्मृतिवचनम्—\n``जान्वोरूर्ध्वमधो नाभेः परिधायैकमम्बरम्। द्वितीयमुत्तरं वासः परिधाय गृहानटेत्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_002373.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002374", "originalText": "इति, तदिदमयोगिविषयम्।", "padacchedaText": "", "audioFile": "PB_hear2read_002374.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002375", "originalText": "अत एव पूर्वं ``तच्च न मुख्योऽस्ति'' इत्युक्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_002375.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002376", "originalText": "यद्यपि स्मृत्यन्तरं—\n``यो भवेत्पूर्वसंन्यासी तुल्यो वै धर्मतो यदि। तस्मै प्रणामः कर्तव्यो नेतराय कदाचन''॥", "padacchedaText": "", "audioFile": "PB_hear2read_002376.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002377", "originalText": "इति, तथापि तस्यायोगिविषयत्वान्नास्य नमस्कारः कर्तव्योऽस्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_002377.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002378", "originalText": "अत एव ब्राह्मणलक्षणे ``निर्नमस्कारमस्तुतिम्'' (महाभारते शान्तिपर्वणि मोक्षधर्मे २३७.२४) इत्युदाहृतम्।", "padacchedaText": "", "audioFile": "PB_hear2read_002378.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002379", "originalText": "गयाप्रयागादितीर्थेषु श्रद्धाजाड्यात्प्राप्तः स्वधाकारो निषिध्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_002379.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002380", "originalText": "पूर्वत्र ``निन्दागर्व—'' (परम० उप०.२) इत्यादिवाक्येनपरकृतया स्वनिन्दया क्लेशो निवारितः, अत्र तु स्वकर्तृके अन्यविषये निन्दास्तुती निषिध्येते।", "padacchedaText": "", "audioFile": "PB_hear2read_002380.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002381", "originalText": "यादृच्छिकत्वं निर्बन्धराहित्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_002381.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002382", "originalText": "न क्वचिदपि व्यवहारे निर्बन्धं कुर्यात्।", "padacchedaText": "", "audioFile": "PB_hear2read_002382.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002383", "originalText": "यस्तु देवपूजायां निर्बन्धः स्मर्यते—\n``भिक्षाटनं जपः शौचं स्नानं ध्यानं सुरार्चनम्। कर्तव्यानि षडेतानि सर्वथा नृपदण्डवत्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_002383.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002384", "originalText": "इति, तस्याप्ययोगिविषयत्वमभिप्रेत्य नावाहनमित्याद्याम्नातम्।", "padacchedaText": "", "audioFile": "PB_hear2read_002384.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002385", "originalText": "सकृत्स्मरणं ध्यानम्, नैरन्तर्येणानुस्मरणमुपासनमिति तयोर्भेदः।", "padacchedaText": "", "audioFile": "PB_hear2read_002385.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002386", "originalText": "यथा योगिनः स्तुतिनिन्दादि—लौकिकव्यवहाराभावः, यथा वा देवपूजादिधर्मशास्त्रव्यवहाराभावः, तथा लक्ष्यत्वालक्ष्यत्वादि—ज्ञानशास्त्रव्यवहारोऽपि नास्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_002386.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002387", "originalText": "``यत्साक्षिचैतन्यमस्ति तदिदं तत्त्वमसीति वाक्ये त्वम्पदेन लक्ष्यम्, देहादिविशिष्टं चैतन्यं लक्ष्यं न भवति, किं तु वाच्यम्, तच्च वाच्यं तत्पदार्थात्पृथक्, लक्ष्यं त्वपृथक्, स्वदेहनिष्ठो वाच्योऽर्थोऽहमिति व्यवहारार्हः, परदेहनिष्ठस्त्वमिति व्यवहारार्हः।", "padacchedaText": "", "audioFile": "PB_hear2read_002387.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002388", "originalText": "लक्ष्यं वाच्यमित्युभयविधं चैतन्योपेतम्, अन्यज्जडं जगत्सर्वमिति व्यवहारार्हम्'' इत्येतादृशो विकल्पो न कोऽपि योगिनोऽस्ति, तदीयचित्तस्य ब्रह्मणि विश्रान्तत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_002388.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002389", "originalText": "अत एव स भिक्षुरनिकेतस्थितिरेव।", "padacchedaText": "", "audioFile": "PB_hear2read_002389.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002390", "originalText": "यदि नियतनिवासार्थं कञ्चिन्मठं सम्पादयेत्, तदानीं तस्मिन्ममत्वे सति तदीयहानिवृद्धयोश्चित्तं विक्षिप्येत। एतत्सर्वमभिप्रेत्य गौडपादाचार्या आहुः—\n``निःस्तुतिर्निर्नमस्कारो निःस्वधाकार एव च\nचलाचलनिकेतश्च यतिर्यादृच्छिको भवेत्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_002390.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002391", "originalText": "— (माण्डूक्यकारिकायां २.३७) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_002391.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002392", "originalText": "यथा मठो न परिग्रहीतव्यस्तथा सौवर्णराजतादीनां भिक्षाचमनादिपात्राणामेकमपि न गृह्णीयात्।", "padacchedaText": "", "audioFile": "PB_hear2read_002392.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002393", "originalText": "तदाह यमः—\n``हिरण्मयानि पात्राणि कार्ष्णायसमयानि च। यतीनां तान्यपात्राणि वर्जयेत्तानि भिक्षुकः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_002393.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002394", "originalText": "इति\nमनुरपि—\n``अतैजसानि पात्राणि तस्य स्युर्निर्व्रणानि च। तेषामद्भिः स्मृतं शौचं चमसानामिवाध्वरे॥", "padacchedaText": "", "audioFile": "PB_hear2read_002394.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002395", "originalText": "अलाबुदारुपात्रं वा मृन्मयं वैणवं तथा। एतानि यतिपात्राणि मनुः स्वायम्भुवोऽब्रवीत्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_002395.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002396", "originalText": "— (मनु ६.५३, ५४) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_002396.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002397", "originalText": "बोधयनोपि—\n``स्वयमाहृतपर्णेषु स्वयं शीर्णेषु वा पुनः। भुञ्जीत न वटाश्वत्थकरञ्जानां च पर्णके॥", "padacchedaText": "", "audioFile": "PB_hear2read_002397.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002398", "originalText": "आपद्यपि न कांस्येषु मलाशी कांस्यभोजनः। सौवर्णे राजते ताम्रे मृन्मये त्रपुसीसयोः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_002398.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002399", "originalText": "इति।", "padacchedaText": "", "audioFile": "PB_hear2read_002399.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002400", "originalText": "तथा लोकं जनं शिष्यवर्गं न गृह्णीयात्।", "padacchedaText": "", "audioFile": "PB_hear2read_002400.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002401", "originalText": "तदाह मनुः—\n``एक एव चरेन्नित्यं सिद्ध्यर्थमसहायकः। सिद्धिमेकस्य पश्यन्हि तज्जहाति न हीयते''॥", "padacchedaText": "", "audioFile": "PB_hear2read_002401.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002402", "originalText": "— (मनु ६.४२) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_002402.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002403", "originalText": "मेधातिथिरपि—\n``आसनं पात्रलोपश्च सञ्चयः शिष्यसङ्ग्रहः। दिवास्वापो वृथालापो यतेर्बन्धकराणि षट्॥", "padacchedaText": "", "audioFile": "PB_hear2read_002403.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002404", "originalText": "``एकाहात्परतो ग्रामे पञ्चाहात्परतः पुरे। वर्षाभ्योन्यत्र यत्स्थानमासनं तदुदाहृतम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_002404.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002405", "originalText": "``उक्तालाब्वादिपात्राणामेकस्यापि न सङ्ग्रहः। भिक्षोर्भैक्षभुजश्चापि पात्रलोपः स उच्यते॥", "padacchedaText": "", "audioFile": "PB_hear2read_002405.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002406", "originalText": "``गृहीतस्य तु दण्डादेर्द्वितीयस्य परिग्रहः। कालान्तरोपभोगार्थं सञ्चयः परिकीर्तितः॥", "padacchedaText": "", "audioFile": "PB_hear2read_002406.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002407", "originalText": "``शुश्रूषालाभपूजार्थं यशोऽर्थं वा परिग्रहः।", "padacchedaText": "", "audioFile": "PB_hear2read_002407.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002408", "originalText": "शिष्याणां न तु कारुण्यात्स ज्ञेयः शिष्यसङ्ग्रहः।", "padacchedaText": "", "audioFile": "PB_hear2read_002408.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002409", "originalText": "``विद्या दिनं प्रकाशत्वादविद्या रात्रिरुच्यते। विद्याभ्यासे प्रमादो यः स दिवास्वाप उच्यते॥", "padacchedaText": "", "audioFile": "PB_hear2read_002409.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002410", "originalText": "``आध्यात्मिकीं कथां मुक्त्वा भैक्षचर्यां सुरस्तुतिम्। अनुग्रहः पथिप्रश्नो वृथालापः स उच्यते''॥", "padacchedaText": "", "audioFile": "PB_hear2read_002410.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002411", "originalText": "लोकं शिष्यजनरूपं न गृह्णीयादित्येतावदेव न भवति, किं तु तस्य लोकस्यावलोकं दर्शनमपि न कुर्यात्, तस्य बन्धहेतुत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_002411.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002412", "originalText": "न चेत्यनेनान्यदपि स्मृतिनिषिद्धं न कुर्यादित्यभिप्रेतम्।", "padacchedaText": "", "audioFile": "PB_hear2read_002412.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002413", "originalText": "तच्च निषिद्धं मेधातिथिर्दर्शयति—\n``स्थावरं जङ्गमं बीजं तैजसं विषमायुधम्। षडेतानि न गृह्णीयाद्यतिर्मूत्रपुरीषवत्॥", "padacchedaText": "", "audioFile": "PB_hear2read_002413.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002414", "originalText": "रसायनं क्रियावादं ज्योतिषं क्रयविक्रयम्। विविधानि च शिल्पानि वर्जयेत्परदारवत्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_002414.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002415", "originalText": "इति।", "padacchedaText": "", "audioFile": "PB_hear2read_002415.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002416", "originalText": "योगिनो लौकिकवैदिकव्यवहारगतानि यानि बाधकानि सन्ति तेषां वर्जनमभिहितम्।", "padacchedaText": "", "audioFile": "PB_hear2read_002416.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002417", "originalText": "अथ प्रश्नोत्तराभ्यामत्यन्तबाधकं प्रदर्श्य तद्वर्जनमाह—\n``आबाधकः क इति चेदाबाधकोस्त्येव।", "padacchedaText": "", "audioFile": "PB_hear2read_002417.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002418", "originalText": "यस्माद्भिक्षुर्हिरण्यं रसेन दृष्टं चेत्स ब्रह्महा भवेत्।", "padacchedaText": "", "audioFile": "PB_hear2read_002418.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002419", "originalText": "यस्माद्भिक्षुर्हिरण्यं रसेन स्पृष्टं चेत्स पौल्कसो भवेत्।", "padacchedaText": "", "audioFile": "PB_hear2read_002419.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002420", "originalText": "यस्माद्भिक्षुर्हिरण्यं रसेन ग्राह्यं चेत्स आत्महा भवेत्।", "padacchedaText": "", "audioFile": "PB_hear2read_002420.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002421", "originalText": "तस्माद्भिक्षुर्हिरण्यं रसेन न दृष्टं च न स्पृष्टं च न ग्राह्यं च'' (परम० उप०.४) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_002421.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002422", "originalText": "आकारोऽभिव्याप्त्यर्थः, ``आङीषदर्थेभिव्याप्तौ'' इत्यभिहितत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_002422.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002423", "originalText": "अभिव्याप्तौ बाधकोऽत्यन्तबाधकस्तस्य सद्भावं प्रतिज्ञाय हिरण्यस्य तथाविधबाधकत्वमुच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_002423.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002424", "originalText": "रसेनाभिलाषयुक्तेनादरेण हिरण्यं यदि दृष्टं स्यात्तदानीं स द्रष्टा भिक्षुर्ब्रह्महा भवेत्।", "padacchedaText": "", "audioFile": "PB_hear2read_002424.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002425", "originalText": "हिरण्यासक्त्या तत्सम्पादनरक्षणयोः सर्वदा प्रयतमानस्तद्वैयर्थ्यपरिहाराय प्रपञ्चमिथ्यात्वप्रतिपादकान् वेदान्तान्दूषयित्वा तत्सत्यत्वमवलम्बते।", "padacchedaText": "", "audioFile": "PB_hear2read_002425.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002426", "originalText": "ततः शास्त्रसिद्धमद्वितीयं ब्रह्म तेन भिक्षुणा हतमेव भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_002426.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002427", "originalText": "तस्मादसौ ब्रह्महा भवेत्।", "padacchedaText": "", "audioFile": "PB_hear2read_002427.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002428", "originalText": "तथा च स्मर्यते—\n``ब्रह्म नास्तीति यो ब्रूयाद्द्वेष्टि ब्रह्मविदं च यः।", "padacchedaText": "", "audioFile": "PB_hear2read_002428.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002429", "originalText": "अभूतब्रह्मवादी च त्रयस्ते ब्रह्मघातकाः।", "padacchedaText": "", "audioFile": "PB_hear2read_002429.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002430", "originalText": "'' इति।", "padacchedaText": "", "audioFile": "PB_hear2read_002430.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002431", "originalText": "``ब्रह्महा स तु विज्ञेयः सर्वधर्मबहिष्कृतः।", "padacchedaText": "", "audioFile": "PB_hear2read_002431.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002432", "originalText": "'' इति च।", "padacchedaText": "", "audioFile": "PB_hear2read_002432.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002433", "originalText": "अभिलाषपूर्वकं हिरण्यं स्पृष्टं चेत्तदा तत्स्पृष्टा भिक्षुः पतितत्वात् पौल्कसो म्लेच्छसदृशो भवेत्।", "padacchedaText": "", "audioFile": "PB_hear2read_002433.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002434", "originalText": "पातित्यं च स्मर्यते—\n``पतत्यसौ ध्रुवं भिक्षुर्यस्य भिक्षोर्द्वयं भवेत्। धीपूर्वं रेत उत्सर्गो द्रव्यसङ्ग्रह एव च''॥", "padacchedaText": "", "audioFile": "PB_hear2read_002434.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002435", "originalText": "इति।", "padacchedaText": "", "audioFile": "PB_hear2read_002435.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002436", "originalText": "अभिलाषपुरःसरं हिरण्यं न ग्राह्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_002436.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002437", "originalText": "गृहीतं चेत्तदा स भिक्षुर्देहेन्द्रियादिसाक्षिणमसङ्गं चिदात्मानं हतवान्भवेत्, असङ्गत्वमपोह्य स्वात्मनो हिरण्यादिद्रव्यं प्रति भोक्तृत्वेन प्रतिपन्नत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_002437.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002438", "originalText": "तस्याश्चान्यथाप्रतिपत्तेः सर्वपापरूपत्वं स्मर्यते—\n``योऽन्यथा सन्तमात्मानमन्यथा प्रतिपद्यते। किं तेन न कृतं पापं चोरेणात्मापहारिणा''॥", "padacchedaText": "", "audioFile": "PB_hear2read_002438.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002439", "originalText": "— (महाभारते १.६८.२६) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_002439.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002440", "originalText": "किं चात्मघातिनः सुखलेशेनापि रहिता बहुविधदुःखेनावृत्ता लोकाः श्रूयन्ते—\n``असुर्या नाम ते लोका अन्धेन तमसावृताः।", "padacchedaText": "", "audioFile": "PB_hear2read_002440.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002441", "originalText": "तांस्ते प्रेत्याभिगच्छन्ति ये के चात्महनो जनाः। ''— (ईशोपनिषदि ३) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_002441.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002442", "originalText": "दृष्टं चेत्यनेन चकारेण श्रुतं च समुच्चीयते।", "padacchedaText": "", "audioFile": "PB_hear2read_002442.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002443", "originalText": "स्पृष्टं चेत्यनेन कथितस्य समुच्चयः।", "padacchedaText": "", "audioFile": "PB_hear2read_002443.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002444", "originalText": "ग्राह्यं चेत्यनेन व्यवहृतं चेति समुच्चीयते।", "padacchedaText": "", "audioFile": "PB_hear2read_002444.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002445", "originalText": "दर्शनस्पर्शनग्रहणवदभिलाषपूर्वका हिरण्यवृत्तान्तश्रवणतद्गुणकथन—तदीयक्रयादिव्यवहारा अपि प्रत्यवायहेतव यस्मात्साभिलाषहिरण्यदर्शनादयो दोषकारिणस्तस्माद्भिक्षुणा\nहिरण्यदर्शनादयो वर्जनीया इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_002445.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002446", "originalText": "हिरण्यवर्जनस्य फलमाह—\n``सर्वे कामा मनोगता व्यावर्तन्ते दुःखे नोद्विग्नः सुखे निःस्पृहस्त्यागो रागे सर्वत्र शुभाशुभयोरनभिस्नेहो न द्वेष्टि न मोदते च सर्वेषामिन्द्रियाणां गतिरुपरमति य आत्मन्येवावतिष्ठते'' (परम० उप०.४) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_002446.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002447", "originalText": "पुत्रभार्यागृहक्षेत्रादिकामानां सर्वेषां हिरण्यमूलत्वाद्धिरण्ये परित्यक्ते सति ते कामा मनोगता मनस्यवस्थानाद्व्यावर्तन्ते व्यावृत्ता भवन्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_002447.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002448", "originalText": "कामनिवृत्तौ सत्यां कर्मप्राप्तयोर्दुःखसुखयोरुद्वेगस्पृहे न भवतः।", "padacchedaText": "", "audioFile": "PB_hear2read_002448.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002449", "originalText": "एतच्च स्थितप्रज्ञप्रस्तावे प्रपञ्चितम्।", "padacchedaText": "", "audioFile": "PB_hear2read_002449.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002450", "originalText": "ऐहिकयोः सुखदुःखयोर्विक्षेपकत्वेनामुष्मिकविषयरागेपि त्यागो भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_002450.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002451", "originalText": "ऐहिक सुखस्पृहायुक्तो हि तद्दृष्टान्तेनानुमित आमुष्मिके सुखे रागवान्भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_002451.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002452", "originalText": "तस्मादैहिके निष्पृहस्यामुष्मिके रागाभावो युज्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_002452.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002453", "originalText": "एवं सति सर्वत्र लोकद्वयेपि यौ शुभाशुभावनुकूलप्रतिकूलविषयौ तयोरनभिस्नेहः।", "padacchedaText": "", "audioFile": "PB_hear2read_002453.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002454", "originalText": "एतच्च द्वेषराहित्यस्याप्युपलक्षणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_002454.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002455", "originalText": "तादृशो विद्वानशुभकारिणं कञ्चिदपि पुरुषं न द्वेष्टि।", "padacchedaText": "", "audioFile": "PB_hear2read_002455.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002456", "originalText": "शुभकारिणं दृष्ट्वा न च मोदं प्राप्नोति।", "padacchedaText": "", "audioFile": "PB_hear2read_002456.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002457", "originalText": "द्वेषमोदरहितो यः पुमानात्मन्येव सर्वदावतिष्ठते तस्य सर्वेषामिन्द्रियाणां गतिः प्रवृत्तिरुपरमति।", "padacchedaText": "", "audioFile": "PB_hear2read_002457.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002458", "originalText": "इन्दियोपरतौ न कदाचिदपि निर्विकल्पसमाधेर्विघ्नो भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_002458.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002459", "originalText": "``तेषां का स्थितिः?'' इति प्रश्नस्य सङ्क्षेपविस्तराभ्यामुत्तरं पूर्वमुक्तम्, तदेवात्र पुनरपि हिरण्यनिषेधप्रसङ्गेन स्पष्टीकृतम्।", "padacchedaText": "", "audioFile": "PB_hear2read_002459.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002460", "originalText": "अथ विद्वत्संन्यासमुपसंहरति—\n``यत्पूर्णानन्दैकबोधस्तद्ब्रह्माहमस्मीति कृतकृत्यो भवति कृतकृत्यो भवति'' (परम० उप०.४) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_002460.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002461", "originalText": "यद्ब्रह्म वेदान्तेषु पूर्णानन्दैकबोधः परमात्मेति निरूपितं तद्ब्रह्माहमस्मीत्येवं सर्वदानुभवन्नयं योगी परमहंसः कृतकृत्यो भवतीति।", "padacchedaText": "", "audioFile": "PB_hear2read_002461.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002462", "originalText": "यथा च स्मर्यते———\n``ज्ञानामृतेन तृप्तस्य कृतकृत्यस्य योगिनः। नैवास्ति किञ्चित्कर्तव्यमस्ति चेन्न स तत्त्ववित्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_002462.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002463", "originalText": "इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_002463.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002464", "originalText": "जीवन्मुक्तिविवेकेन तमो हार्दं निवारयन्। पुमर्थमखिलं देयाद्विद्यातीर्थमहेश्वरः॥ १॥", "padacchedaText": "", "audioFile": "PB_hear2read_002464.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002465", "originalText": "इति श्रीमद्विद्यारण्यप्रणीते जीवन्मुक्तिविवेके विद्वत्संन्यासनिरूपणं नाम पञ्चमं प्रकरणम्॥ ५॥", "padacchedaText": "", "audioFile": "PB_hear2read_002465.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002466", "originalText": "सम्पूर्णोऽयं श्रीमद्विद्यारण्यप्रणीतो जीवन्मुक्तिविवेकः।", "padacchedaText": "", "audioFile": "PB_hear2read_002466.mp3", "zipFile": "JivanMuktiViveka.zip"}];
        const contentDiv = document.getElementById('content');
        
        let currentIndex = -1;
        let isPlaying = false;
        
        // Use standard HTML5 audio to preserve pitch on speed changes
        const audioEl = new Audio();
        audioEl.preservesPitch = true;
        
        const speedSlider = document.getElementById('speed-slider');
        const speedDisplay = document.getElementById('speed-display');
        speedSlider.oninput = function() {
            audioEl.playbackRate = this.value;
            speedDisplay.innerText = parseFloat(this.value).toFixed(1);
        };
        
        let currentScript = 'devanagari';
        const scriptSelect = document.getElementById('script-select');
        scriptSelect.onchange = function() {
            currentScript = this.value;
            document.querySelectorAll('.sentence-text').forEach((span, index) => {
                let origText = manifest[index].originalText;
                if (currentScript === 'devanagari') {
                    span.innerText = origText;
                } else {
                    span.innerText = Sanscript.t(origText, 'devanagari', currentScript);
                }
            });
        };
        
        const playPauseBtn = document.getElementById('play-pause-btn');
        playPauseBtn.onclick = () => {
            if (isPlaying) {
                audioEl.pause();
                isPlaying = false;
                playPauseBtn.innerText = "Resume";
            } else {
                playAudio(Math.max(0, currentIndex));
                playPauseBtn.innerText = "Stop";
            }
        };
        
        manifest.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'sentence';
            div.id = 'sentence-' + index;
            
            const idSpan = document.createElement('span');
            idSpan.className = 'sentence-id';
            idSpan.innerText = '[' + item.id + ']';
            
            const textSpan = document.createElement('span');
            textSpan.className = 'sentence-text';
            textSpan.innerText = item.originalText;
            
            div.appendChild(idSpan);
            div.appendChild(textSpan);
            
            div.onclick = () => {
                playPauseBtn.innerText = "Stop";
                playAudio(index);
            };
            contentDiv.appendChild(div);
        });
        
        // --- HTML5 Audio Prefetching Logic (via Blob URLs) ---
        const PREFETCH_BUFFER_SIZE = 3;
        let prefetchQueue = new Map(); // index -> Blob URL

        function getAudioUrl(index) {
            if (index < 0 || index >= manifest.length) return null;
            const item = manifest[index];
            const zipToUse = item.zipFile || ZIP_NAME;
            return WORKER_URL + '/' + BUCKET_NAME + '/' + zipToUse + '/' + item.audioFile;
        }

        async function fetchBlobUrl(url) {
            const response = await fetch(url);
            if (!response.ok) throw new Error("HTTP " + response.status);
            const blob = await response.blob();
            return URL.createObjectURL(blob);
        }

        async function prefetchNext(fromIndex) {
            for (let i = fromIndex + 1; i <= fromIndex + PREFETCH_BUFFER_SIZE; i++) {
                if (i >= manifest.length) break;
                if (!prefetchQueue.has(i)) {
                    prefetchQueue.set(i, 'fetching');
                    const url = getAudioUrl(i);
                    try {
                        const blobUrl = await fetchBlobUrl(url);
                        if (prefetchQueue.get(i) === 'fetching') {
                            prefetchQueue.set(i, blobUrl);
                        } else {
                            URL.revokeObjectURL(blobUrl);
                        }
                    } catch (err) {
                        console.error("Prefetch failed for index", i, err);
                        prefetchQueue.delete(i);
                    }
                }
            }
            // Cleanup old blobs to free memory
            for (let [key, val] of prefetchQueue.entries()) {
                if (key < fromIndex) {
                    if (typeof val === 'string' && val.startsWith('blob:')) {
                        URL.revokeObjectURL(val);
                    }
                    prefetchQueue.delete(key);
                }
            }
        }
        // ------------------------

        async function playAudio(index) {
            if (index < 0 || index >= manifest.length) {
                isPlaying = false;
                playPauseBtn.innerText = "Start Reading";
                return;
            }
            
            if (currentIndex >= 0) {
                const prevDiv = document.getElementById('sentence-' + currentIndex);
                if (prevDiv) prevDiv.classList.remove('active');
            }
            
            currentIndex = index;
            
            const currentDiv = document.getElementById('sentence-' + currentIndex);
            if (currentDiv) {
                currentDiv.classList.add('active');
                currentDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            
            audioEl.pause();
            
            try {
                let audioUrl;
                if (prefetchQueue.has(index) && prefetchQueue.get(index) !== 'fetching') {
                    audioUrl = prefetchQueue.get(index);
                } else {
                    const sourceUrl = getAudioUrl(index);
                    audioUrl = await fetchBlobUrl(sourceUrl);
                }
                
                audioEl.src = audioUrl;
                audioEl.playbackRate = speedSlider.value;
                audioEl.onended = () => { playAudio(currentIndex + 1); };
                
                await audioEl.play();
                isPlaying = true;
                
            } catch (e) {
                console.error("Audio play error:", e);
                // Fallback to next track if error
                setTimeout(() => playAudio(currentIndex + 1), 500);
            }
            
            // Trigger prefetch for upcoming sentences
            prefetchNext(index);
        }
    </script>
