        const manifest = [{"id": "B_000000", "originalText": "श्रीविद्यारण्यमुनिकृतः\nजीवन्मुक्तिविवेकः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000000.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000001", "originalText": "१. जीवन्मुक्तिप्रमाणप्रकरणं प्रथमम्\n\nयस्य निःश्वसितं वेदा यो वेदेभ्योऽखिलं जगत्। निर्ममे तमहं वन्दे विद्यातीर्थमहेश्वरम्॥ १॥", "padacchedaText": "", "audioFile": "PB_hear2read_000001.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000002", "originalText": "वक्ष्ये विविदिषान्यासं विद्वन्न्यासं च भेदतः। हेतू विदेहमुक्तेश्च जीवन्मुक्तेश्च तौ क्रमात्॥ २॥", "padacchedaText": "", "audioFile": "PB_hear2read_000002.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000003", "originalText": "सन्न्यासहेतुर्वैराग्यं यदहर्विरजेत् तदा। प्रव्रजेदिति वेदोक्तेस्तद्भेदस्तु पुराणगः॥ ३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000003.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000004", "originalText": "विरक्तिर्द्विविधा प्रोक्ता तीव्रा तीव्रतरेति च। सत्यमेव तु तीव्रायां न्यस्येद् योगी कुटीचके॥ ४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000004.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000005", "originalText": "शक्तो बहूदके तीव्रतरायां हंससंज्ञिते। मुमुक्षुः परमे हंसे साक्षाद् विज्ञानसाधने॥ ५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000005.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000006", "originalText": "पुत्रदारधनादीनां नाशे तात्कालिकी मतिः। धिक् संसारमितीदृक् स्याद् विरक्तेर्मन्दता हि सा॥ ६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000006.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000007", "originalText": "अस्मिन् जन्मनि मा भूवन् पुत्रदारादयो मम। इति या सुस्थिरा बुद्धिः सा वैराग्यस्य तीव्रता॥ ७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000007.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000008", "originalText": "पुनरावृत्तिसहितो लोको मे मास्तु कश्चन। इति तीव्रतरत्वं स्यान्मन्दे न्यासो न कोऽपि हि॥ ८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000008.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000009", "originalText": "यात्राद्यशक्तिशक्तिभ्यां तीव्रे न्यासद्वयं भवेत्। कुटीचको बहूदश्चेत्युभावेतौ त्रिदण्डिनौ॥ ९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000009.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000010", "originalText": "द्वयं तीव्रतरे ब्रह्मलोकमोक्षविभेदतः। तल्लोके तत्त्वविद्धंसो लोकेऽस्मिन् परहंसकः॥ १०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000010.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000011", "originalText": "एतेषां तु समाचाराः प्रोक्ताः पाराशरस्मृतौ। व्याख्यानेऽस्माभिरत्रायं परहंसो विविच्यते॥ ११॥", "padacchedaText": "", "audioFile": "PB_hear2read_000011.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000012", "originalText": "जिज्ञासुर्ज्ञानवांश्चेति परहंसो द्विधा मतः। प्राहुर्ज्ञानाय जिज्ञासोर्न्यासं वाजसनेयिनः॥ १२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000012.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000013", "originalText": "``प्रव्राजिनो लोकमेतमिच्छन्तः प्रव्रजन्ति हि''। एतस्यार्थस्तु गद्येन वक्ष्यते मन्दबुद्धये॥ १३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000013.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000014", "originalText": "लोको हि द्विविधः, आत्मलोकोऽनात्मलोकश्चेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000014.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000015", "originalText": "तत्रानात्मलोकस्य त्रैविध्यं बृहदारण्यके तृतीयाध्याये श्रूयते— ``अथ त्रयो वाव लोका मनुष्यलोकः पितृलोको देवलोक इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000015.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000016", "originalText": "सोऽयं मनुष्यलोकः पुत्रेणैव जय्यो नान्येन कर्मणा, कर्मणा पितृलोको विद्यया देवलोकः'' (५.१६) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000016.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000017", "originalText": "आत्मलोकश्च तत्रैव श्रूयते— ``यो ह वा अस्माल्लोकात् स्वं लोकमदृष्ट्वा प्रैति स एनमविदितो न भुनक्ति'' (४.१५) इति, ``आत्मानमेव लोकमुपासीत स य आत्मानमेव लोकमुपास्ते न हास्य कर्म क्षीयते'' (४.१५) इति च।", "padacchedaText": "", "audioFile": "PB_hear2read_000017.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000018", "originalText": "यो मांसादिकपिण्डलक्षणात् स्वं लोकं परमात्माख्यं ``अहं ब्रह्मास्मि'' इत्यविदित्वा म्रियते स स्वो लोकः परमात्माविदितोऽविद्यया व्यवहितः सन्नेनमवेदितारं प्रेतं मृतं न भुनक्ति शोकमोहादिदोषापनयनेन न पालयति।", "padacchedaText": "", "audioFile": "PB_hear2read_000018.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000019", "originalText": "उपासकस्य ह निश्चितं कर्म न क्षीयते एकफलदानेनोपक्षीणं न भवति, कामितसर्वफलं\nमोक्षं च ददातीत्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000019.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000020", "originalText": "षष्ठाध्यायेऽपि— ``किमर्था वयमध्येष्यामहे किमर्था वयं यक्ष्यामहे'' (ऐ० आ० ३.२.६) ``किं प्रजया करिष्यामो येषां नोऽयमात्मायं लोकः'' (४.४.२२) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000020.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000021", "originalText": "``ये प्रजामिषरे(ऽधीरा) ते श्मशानानि भेजिरे।", "padacchedaText": "", "audioFile": "PB_hear2read_000021.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000022", "originalText": "ये प्रजां नेषिरे (धीरा) तेऽमृतत्वं हि भेजिरे।", "padacchedaText": "", "audioFile": "PB_hear2read_000022.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000023", "originalText": "'' एवं च ``एतमेव प्रव्राजिनो लोकमिच्छन्तः प्रव्रजन्ति'' (४.४.२२) इत्यत्रात्मलोको विवक्षित इति गम्यते, ``स वा एष महानज आत्मा'' (४.४.२२) इति प्रक्रान्तस्यात्मन एतच्छब्देन परामृष्टत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000023.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000024", "originalText": "लोक्यतेऽनुभूयत इति लोकः।", "padacchedaText": "", "audioFile": "PB_hear2read_000024.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000025", "originalText": "तथा चात्मानुभवमिच्छन्तः प्रव्रजन्तीति श्रुतेस्तात्पर्यार्थः सम्पद्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000025.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000026", "originalText": "स्मृतिश्च— ``ब्रह्मविज्ञानलाभाय परहंससमाह्वयः। शान्तिदान्त्यादिभिः सर्वैः साधनैः सहितो भवेत्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000026.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000027", "originalText": "इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000027.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000028", "originalText": "— (नारद—परि० उप०.६.२६) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000028.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000029", "originalText": "इह जन्मनि जन्मान्तरे वा सम्यगनुष्ठितैर्वेदानुवचनादिभिरुत्पन्नया विविदिषया सम्पादितत्वादयं विविदिषासन्न्यास इत्यभिधीयते।", "padacchedaText": "", "audioFile": "PB_hear2read_000029.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000030", "originalText": "अयं च वेदनहेतुः सन्न्यासो द्विविधः, जन्मापादककाम्यकर्मादित्यागमात्रात्मकः, प्रैषोच्चारणपूर्वक— दण्डधारणाद्याश्रमरूपश्चेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000030.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000031", "originalText": "``पुञ्जन्म लभते माता पत्नी च प्रैषमात्रतः। ब्रह्मनिष्ठः सुशीलश्च ज्ञानी चैतत्प्रभावतः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000031.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000032", "originalText": "'' त्यागश्च तैत्तिरीयादौ श्रूयते—``न कर्मणा न प्रजया धनेन त्यागेनैके अमृतत्वमानशुः'' (तै. आ.१०.१०.२१) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000032.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000033", "originalText": "अस्मिंश्च त्यागे स्त्रियोऽप्यधिक्रियन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000033.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000034", "originalText": "(``भिक्षुकी'' इत्यनेन स्त्रीणामपि प्राग्विवाहाद्वा वैधव्यादूर्ध्वं वा संन्यासेऽधिकारोऽस्तीति दर्शितम्, तेन भिक्षाचर्यं मोक्षशास्त्रश्रवणमेकान्त आत्मध्यानं च ताभिः कर्तव्यम्, त्रिदण्डादिकं च धार्यम्, इति मोक्षधर्मे चतुर्धरीटीकायां सुलभाजनकसंवादे.) शारीरकभाष्ये ``वाचक्नवी'' इत्यादि श्रूयते देवताधिकरणन्यायेन विधुरस्याधिकारप्रसङ्गेन तृतीयाध्याये चतुर्थपादे।", "padacchedaText": "", "audioFile": "PB_hear2read_000034.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000035", "originalText": "अत एव मैत्रेयीवाक्यमाम्नायते—``येनाहं नामृता स्यां किमहं तेन कुर्यां यदेव भगवान् वेद तदेव मे ब्रूहि'' (४.५.४) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000035.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000036", "originalText": "ब्रह्मचारिगृहस्थवानप्रस्थानां केनचिन्निमित्तेन सन्न्यासाश्रमस्वीकारे प्रतिबद्धे सति, स्वाश्रमधर्मेष्वनुष्ठीयमानेष्वपि वेदनार्थो मानसः कर्मादित्यागो न विरुध्यते, श्रुतिस्मृतीतिहासपुराणेषु लोके च तादृशां तत्त्वविदां बहूनामुपलम्भात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000036.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000037", "originalText": "यस्तु दण्डधारणादिरूपो वेदनहेतुः परमहंसाश्रमः, स पूर्वैराचार्यैर्बहुधा प्रपञ्चित इत्यस्माभिरुपरम्यते। इति विविदिषासन्न्यासः॥ १॥", "padacchedaText": "", "audioFile": "PB_hear2read_000037.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000038", "originalText": "(अथ पुराणे श्लोकावुदाहरन्ति—\nअष्टाशीतिसहस्राणि ये प्रजामिषिर ऋषयः। दक्षिणेनार्यम्णः पन्थानं ते श्मशानानि भेजिरे॥ ३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000038.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000039", "originalText": "अष्टाशीतिसहस्राणि ये प्रजां नेषिर ऋषयः। उत्तरेणार्यम्णः पन्थानं तेऽमृतत्वं हि कल्पते॥ ४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000039.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000040", "originalText": ")— आपस्तम्ब धर्मसूत्र (२.९.२३ः३,४)\nअथ विद्वत्संन्यासं निरूपयामः।", "padacchedaText": "", "audioFile": "PB_hear2read_000040.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000041", "originalText": "सम्यगनुष्ठितैः श्रवणमनननिदिध्यासनैः परं तत्त्वं विदितवद्भिः सम्पाद्यमानो विद्वत्संन्यासः।", "padacchedaText": "", "audioFile": "PB_hear2read_000041.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000042", "originalText": "तं च याज्ञवल्क्यः सम्पादयामास।", "padacchedaText": "", "audioFile": "PB_hear2read_000042.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000043", "originalText": "तथा हि——विद्वच्छिरोमणिर्भगवान् याज्ञवल्क्यो विजिगीषुकथायां बहुविधेन तत्त्वनिरूपणेनाश्वलप्रभृतीन् विप्रान् विजित्य, वीतरागकथायां सङ्क्षेपविस्तराभ्यामनेकधा जनकं बोधयित्वा, मैत्रेयीं बुबोधयिषुस्तस्यास्त्वरया तत्त्वाभिमुख्याय स्वकर्तव्यं संन्यासं प्रतिजज्ञे।", "padacchedaText": "", "audioFile": "PB_hear2read_000043.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000044", "originalText": "ततस्तां बोधयित्वा सन्न्यासं चकार।", "padacchedaText": "", "audioFile": "PB_hear2read_000044.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000045", "originalText": "तदुभयं मैत्रेयीब्राह्मणस्याद्यन्तयोराम्नायते—``अथ ह याज्ञवल्क्योऽन्यद्वृत्तमुपाकरिष्यन्मैत्रेयीति होवाच याज्ञवल्क्यः प्रव्रजिष्यन्वा अरेऽहमस्मात् स्थानादस्मि'' (४.५.१, २) इति, ``एतावदरे खल्वमृतत्वमिति होक्त्वा याज्ञवल्क्यो विजहार'' (४.५.१५) इति च।", "padacchedaText": "", "audioFile": "PB_hear2read_000045.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000046", "originalText": "कहोलब्राह्मणेऽपि विद्वत्संन्यास आम्नायते— ``एतं वै तमात्मानं विदित्वा ब्राह्मणाः पुत्रैषणायाश्च वित्तैषणायाश्च लोकैषणायाश्च व्युत्थायाथ भिक्षाचर्यं चरन्ति'' (३.५.१) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000046.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000047", "originalText": "न चैतद्वाक्यं विविदिषासन्न्यासपरमिति शङ्कनीयम्, पूर्वकालवाचिनः ``विदित्वा'' इति क्त्वाप्रत्ययस्य ब्रह्मविद्वाचिनो ब्राह्मणशब्दस्य बाधप्रसङ्गात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000047.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000048", "originalText": "न चात्र ब्राह्मणशब्दो जातिवाचकः, वाक्यशेषे पाण्डित्यबाल्यमौनशब्दाभिधेयैः श्रवणमनननिदिध्यासनैः साध्यं ब्रह्मसाक्षात्कारमभिप्रेत्य ``अथ ब्राह्मणः'' (३.५.१) इत्यभिहितत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000048.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000049", "originalText": "ननु तत्र विविदिषासंन्यासोपेतः पाण्डित्यादौ प्रवर्तमानोऽपि ब्राह्मणशब्देन परामृष्टः ``तस्माद् ब्राह्मणः पाण्डित्यं निर्विद्य बाल्येन तिष्ठासेत्'' (३.५.१) इतीति चेत्, मैवम्, भाविनीं वृत्तिमाश्रित्य तत्र ब्राह्मणशब्दस्य प्रयुक्तत्वात्, अन्यथा कथं ``अथ ब्राह्मणः'' (३.५.१) इति साधनानुष्ठानोत्तर—कालवाचिनमथशब्दं प्रयुञ्जीत?\nशारीरब्राह्मणेऽपि विद्वत्संन्यासविविदिषासन्न्यासौ स्पष्टं निर्दिष्टौ— ``एतमेव विदित्वा मुनिर्भवति एतमेव प्रव्राजिनो लोकमिच्छन्तः प्रव्रजन्ति'' (४.४.२२) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000049.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000050", "originalText": "मुनित्वं मननशीलत्वं, तच्चासति कर्तव्यान्तरे सम्भवतीत्यर्थात् संन्यास एवाभिधीयते।", "padacchedaText": "", "audioFile": "PB_hear2read_000050.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000051", "originalText": "एतच्च वाक्यशेषे स्पष्टीकृतं— ``एतद्ध स्म वैतत्पूर्वे विद्वांसः प्रजां न कामयते किं प्रजया करिष्यामो येषां नोऽयमात्मायं लोक इति, ते ह स्म पुत्रैषणायाश्च वित्तैषणायाश्च लोकैषणायाश्च व्युत्थायाथ भिक्षाचर्यं चरन्ति'' (४.४.२२) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000051.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000052", "originalText": "``अयं लोकः'' इत्यपरोक्षेणानुभूयमान इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000052.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000053", "originalText": "नन्वत्र मुनित्वेन फलेन प्रलोभ्य विविदिषासंन्यासं विधाय वाक्यशेषे स एव प्रपञ्चितः, अतो न सन्न्यासान्तरं कल्पनीयम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000053.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000054", "originalText": "मैवम्, वेदनस्यैव विविदिषासंन्यासफलत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000054.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000055", "originalText": "न च वेदनमुनित्वयोरेकत्वं शङ्कनीयम्, ``विदित्वा मुनिर्भवति'' इति पूर्वोत्तरकालीनयोस्तयोः साध्यसाधनभावप्रतीतेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000055.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000056", "originalText": "ननु वेदनस्यैव परिपाकातिशयरूपमवस्थान्तरं मुनित्वम्, अतो वेदनद्वारा पूर्वसंन्यासस्यैवैतत्फलमिति चेत्, बाढं, अत एव साधनरूपात् सन्न्यासादन्यं फलरूपमेतं सन्न्यासं ब्रूमः।", "padacchedaText": "", "audioFile": "PB_hear2read_000056.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000057", "originalText": "यथा विविदिषासंन्यासिना तत्त्वज्ञानाय श्रवणादीनि सम्पादनीयानि, तथा विद्वत्सन्न्यासिनापि जीवन्मुक्तये मनोनाशवासनाक्षयौ सम्पादनीयौ।", "padacchedaText": "", "audioFile": "PB_hear2read_000057.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000058", "originalText": "एतच्चोपरिष्टात् प्रपञ्चयिष्यामः।", "padacchedaText": "", "audioFile": "PB_hear2read_000058.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000059", "originalText": "सत्यप्यनयोः संन्यासयोरवान्तरभेदे परमहंसत्वाकारेणैकीकृत्य ``चतुर्विधा भिक्षवः'' इति स्मृतिषु चतुः सङ्ख्योक्ता।", "padacchedaText": "", "audioFile": "PB_hear2read_000059.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000060", "originalText": "पूर्वोत्तरयोरुभयोः सन्न्यासयोः परमहंसत्वं जाबालश्रुताववगम्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000060.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000061", "originalText": "तत्र हि जनकेन सन्न्यासे पृष्टे सति, याज्ञवल्क्योऽधिकारविशेषविधानेनोत्तरकालानुष्ठेयेन च सहितं विविदिषासन्न्यासमभिधाय, पश्चादत्रिणा यज्ञोपवीतरहितस्याक्षिप्ते ब्राह्मण्ये सति, पश्चादात्मज्ञानमेव यज्ञोपवीतमिति समादधौ।", "padacchedaText": "", "audioFile": "PB_hear2read_000061.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000062", "originalText": "अतो बाह्ययज्ञोपवीताभावात् परमहंसत्वं निश्चीयते।", "padacchedaText": "", "audioFile": "PB_hear2read_000062.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000063", "originalText": "तथान्यस्यां कण्डिकायां ``तत्र परमहंसा नाम'' (६) इत्युपक्रम्य संवर्तकादीन्बहून्ब्रह्मविदो जीवन्मुक्तानुदाहृत्य ``अव्यक्तलिङ्गा अव्यक्ताचारा अनुन्मत्ता उन्मत्तवदाचरन्तः'' (६) इति विद्वत्संन्यासिनो दर्शिताः।", "padacchedaText": "", "audioFile": "PB_hear2read_000063.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000064", "originalText": "तथा ``त्रिकाण्डं कमण्डलुं शिक्यं पात्रं जलपवित्रं शिखां यज्ञोपवीतं चेत्येतत्सर्वं भूः स्वाहेत्यप्सु परित्यज्यात्मानमन्विच्छेत्'' (६) इति त्रिदण्डिनः सत एकदण्डलक्षणं विविदिषासंन्यासं विधाय तत्फलरूपं विद्वत्सन्न्यासमेवमुदाजहार— ``यथाजातरूपधरो निर्द्वन्द्वो निष्परिग्रहस्तत्र ब्रह्ममार्गे सम्यक्सम्पन्नः शुद्धमानसः प्राणसन्धारणार्थं यथोक्तकाले विमुक्तो भैक्षमाचरन्नुदरपात्रेण लाभालभयोः समो भूत्वा शून्यागारदेवगृहतृणकूटवल्मीकवृक्षमूलकुलालशालाग्निहोत्रगृहनदीपुलिनगिरिकुहरकन्दर—कोटरनिर्झरस्थण्डिलेष्वनिकेतवास्यप्रयत्नो निर्ममः शुक्लध्यानपरायणोऽध्यात्मनिष्ठः शुभाशुभकर्म—निर्मूलनपरः सन्न्यासेन देहत्यागं करोति, स परमहंसो नाम'' (६) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000064.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000065", "originalText": "तस्मादनयोरुभयोः परमहंसत्वं सिद्धम।", "padacchedaText": "", "audioFile": "PB_hear2read_000065.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000066", "originalText": "समानेऽपि परमहंसत्वे सिद्धे विरुद्धधर्माक्रान्तत्वादवान्तर—भेदोऽप्यभ्युपगन्तव्यः।", "padacchedaText": "", "audioFile": "PB_hear2read_000066.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000067", "originalText": "विरुद्धधर्मत्वं चारुणिकोपनिषत्परमहंसोपनिषदोः पर्यालोचनायामवगम्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000067.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000068", "originalText": "``केन भगवन् कर्माणि अशेषतो विसृजामि'' (१) इति शिखायज्ञोपवीतस्वाध्यायगायत्रीजपाद्यशेषकर्मत्यागरूपे\nविविदिषासंन्यासे शिष्येणारुणिना पृष्टे सति, गुरुः प्रजापतिः ``शिखां यज्ञोपवीतम्'' (१) इत्यादिना सर्वत्यागमभिधाय, ``दण्डमाच्छादनं कौपीनं च परिग्रहेत्'' (१) इति दण्डादिस्वीकारं विधाय, ``त्रिसन्ध्यादौ स्नानमाचरेत्, सन्धिं समाधावात्मन्याचरेत्, सर्वेषु वेदेष्वारण्यकमावर्तयेत् उपनिषदमावर्तयेत् (२) इति\nवेदन हेतूनाश्रमधर्माननुष्ठेयतया विधत्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000068.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000069", "originalText": "अथ योगिनां परमहंसानां कोऽयं मार्गः? इति विद्वत्संन्यासे नारदेन पृष्टे सति, गुरुर्भगवान् प्रजापतिः ``स्वपुत्रमित्र—'' इत्यादिना पूर्ववत् सर्वत्यागमभिधाय, ``कौपीनं दण्डमाच्छादनं च स्वशरीरोपभोगार्थाय लोकस्योपकारार्थाय च परिग्रहेत्'' इति दण्डादिस्वीकारस्य लौकिकत्वमभिधाय ``तच्च न मुख्योऽस्ति'' इति शास्त्रीयत्वं प्रतिषिध्य, ``कोऽयं मुख्य इति चेदयं मुख्यो न दण्डं न शिखां न यज्ञोपवीतं न चाच्छादनं चरति परमहंसः'', इति दण्डादिलिङ्गराहित्यस्य शास्त्रीयतामुक्त्वा ``न शीतं न चोष्णम्'' इत्यादिवाक्येन ``आशाम्बरो निर्नमस्कारः'' इत्यादिवाक्येन च लोकव्यवहारातीतत्वमभिधाय, अन्ते, ``यत्पूर्णानन्दैकबोधस्तद्ब्रह्माहमस्मीति कृतकृत्यो भवति'' इत्यन्तेन ग्रन्थेन ब्रह्मानुभवमात्रपर्यवसानमाचष्टे।", "padacchedaText": "", "audioFile": "PB_hear2read_000069.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000070", "originalText": "अतो विरुद्धधर्मोपेतत्वादस्त्येवानयोर्महान्भेदः।", "padacchedaText": "", "audioFile": "PB_hear2read_000070.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000071", "originalText": "स्मृतिष्वप्ययं भेद उक्तदिशा द्रष्टव्यः।", "padacchedaText": "", "audioFile": "PB_hear2read_000071.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000072", "originalText": "``संसारमेव निःसारं दृष्ट्वा सारदिदृक्षया। प्रव्रजन्त्यकृतोद्वाहाः परं वैराग्यमाश्रिताः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000072.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000073", "originalText": "— (बृहस्पतिस्मृतौ ३.३६)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000073.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000074", "originalText": "``प्रवृत्तिलक्षणो योगो ज्ञानं संन्यासलक्षणम्। तस्माज्ज्ञानं पुरस्कृत्य संन्यस्येदिह बुद्धिमान्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000074.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000075", "originalText": "— (महाभारते १४.४३.३९)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000075.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000076", "originalText": "इत्यादि विविदिषासंन्यासः।", "padacchedaText": "", "audioFile": "PB_hear2read_000076.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000077", "originalText": "``यदा तु विदितं तत्स्यात् परं ब्रह्म सनातनम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000077.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000078", "originalText": "तदैकदण्डं सङ्गृह्य सोपवीतां शिखां त्यजेत्। ज्ञात्वा सम्यक् परं ब्रह्म सर्वं त्यक्त्वा परिव्रजेत्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000078.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000079", "originalText": "इत्यादि विद्वत्संन्यासः।", "padacchedaText": "", "audioFile": "PB_hear2read_000079.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000080", "originalText": "ननु कलाविद्यास्विव कदाचिदौत्सुक्यमात्रेणापि वेदितुमिच्छा सम्भवति, एवं विद्वत्ताप्यापातदर्शिनः पण्डितम्मन्यस्यात्रावलोक्यते, न च तौ प्रव्रजितौ दृष्टौ, अतो विविदिषाविद्वत्ते कीदृशे विवक्षिते इति चेत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000080.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000081", "originalText": "उच्यते— यथा तीव्रायां बुभुक्षायामुत्पन्नायां भोजनादन्यो न रोचते व्यापारः, भोजने च विलम्बोऽपि सोढुं\nन शक्यते, तथा जन्महेतुषु कर्मस्वत्यन्तमरुचिर्वेदनसाधनेषु च श्रवणादिषु त्वरा महती सम्पद्यते, तादृशी विविदिषा संन्यासहेतुः।", "padacchedaText": "", "audioFile": "PB_hear2read_000081.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000082", "originalText": "विद्वत्ताया अवधिरुपदेशसाहस्र्यामभिहितः\n``देहात्मज्ञानवज्ज्ञानं देहात्मज्ञानबाधकम्। आत्मन्येव भवेद्यस्य स नेच्छन्नपि मुच्यते''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000082.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000083", "originalText": "— (उपदेशसाहस्र्यां ४.५) इति॥।", "padacchedaText": "", "audioFile": "PB_hear2read_000083.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000084", "originalText": "श्रुतावपि—\n``भिद्यते हृदयग्रन्थिश्छिद्यन्ते सर्वसंशयाः। क्षीयन्ते चास्य कर्माणि तस्मिन्दृष्टे परावरे''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000084.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000085", "originalText": "— (मुण्डकोपनिषदि २.२.८) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000085.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000086", "originalText": "परमपि हैरण्यगर्भादिकं पदमवरं यस्मादसौ परावरः, हृदये बुद्धौ साक्षिणस्तादात्म्याध्यासोऽनाद्यविद्या—निर्मितत्वेन ग्रन्थिवद् दृढसंश्लेषरूपत्वाद् ग्रन्थिरित्युच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000086.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000087", "originalText": "आत्मा साक्षी वा कर्ता वा, साक्षित्वेऽप्यस्य ब्रह्मत्वमस्ति वा नवा, ब्रह्मत्वेऽपि तद्बुद्ध्या वेदितुं शक्यं वा न वा, शक्यत्वेऽपि तद्वेदनमात्रेण मुक्तिरस्ति वा न वा इत्यादयः संशयाः।", "padacchedaText": "", "audioFile": "PB_hear2read_000087.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000088", "originalText": "कर्माण्यनारब्धान्यागामिजन्मकारणानि।", "padacchedaText": "", "audioFile": "PB_hear2read_000088.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000089", "originalText": "तदेतद् ग्रन्थ्यादित्रयमविद्यानिर्मित—त्वादात्मदर्शनेन निवर्तते।", "padacchedaText": "", "audioFile": "PB_hear2read_000089.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000090", "originalText": "स्मृतावप्ययमर्थ उपलभ्यते—\n``यस्य नाहङ्कृतो भावो बुद्धिर्यस्य न लिप्यते। हत्वापि स इमाल्लोँकान्न हन्ति न निबध्यते''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000090.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000091", "originalText": "— (भगवद्गीतायां १८.१७) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000091.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000092", "originalText": "यस्य ब्रह्मविदो, भावः सत्ता, स्वभाव, आत्मा, नाहङ्कृतोऽहङ्कारेण तादात्म्याध्यासादन्तर्नाच्छादितः।", "padacchedaText": "", "audioFile": "PB_hear2read_000092.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000093", "originalText": "बुद्धिलेपः संशयः।", "padacchedaText": "", "audioFile": "PB_hear2read_000093.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000094", "originalText": "तदभावे त्रैलोक्यवधेनापि न बध्यते, किमुतान्येन कर्मणेत्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000094.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000095", "originalText": "नन्वेवं सति विविदिषासंन्यासफलेन तत्त्वज्ञानेनैवागामिजन्मनो वारितत्वाद्वर्तमानजन्मशेषस्य भोगमन्तरेण विनाशयितुमशक्यत्वात् किमनेन विद्वत्सन्न्यासप्रयासेनेति चेत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000095.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000096", "originalText": "मैवम्, विद्वत्सन्न्यासस्य जीवन्मुक्ति—हेतुत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000096.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000097", "originalText": "तस्माद्वेदनाय यथा विविदिषासन्न्यास एवं जीवन्मुक्तये विद्वत्सन्न्यासः सम्पादनीयः। इति विद्वत्सन्न्यासः॥ २॥", "padacchedaText": "", "audioFile": "PB_hear2read_000097.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000098", "originalText": "अथ केयं जीवन्मुक्तिः किं वा तत्र प्रमाणं कथं वा तत्सिद्धिः सिद्धौ वा किं प्रयोजनमिति चेत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000098.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000099", "originalText": "उच्यते— जीवतः पुरुषस्य कर्तृत्वभोक्तृत्वसुखदुःखादिलक्षणश्चित्तधर्मः क्लेशरूपत्वाद्बन्धोभवति, तस्य निवारणं जीवन्मुक्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000099.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000100", "originalText": "नन्वयं बन्धः किं साक्षिणो निवार्यते, किं वा चित्तात्? नाद्यः, तत्त्वज्ञानेनैव निवारितत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000100.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000101", "originalText": "न द्वितीयः, असम्भवात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000101.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000102", "originalText": "यदा तु जलाद् द्रवत्वं निवार्येत वह्नेर्वोष्णत्वं तदा चित्तात् कर्तृत्वादिनिवारणसम्भवः, स्वाभाविकत्वं तु सर्वत्र समानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000102.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000103", "originalText": "मैवम्, आत्यन्तिकनिवारणासम्भवेऽप्यभिभवस्य सम्भवात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000103.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000104", "originalText": "यथा जलगतं द्रवत्वं मृत्तिकामेलनेनाभिभूयते वह्नेरौष्ण्यं मणिमन्त्रादिना, तथा सर्वाश्चित्तवृत्तयो योगाभ्यासेनाभिभवितुं शक्यन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000104.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000105", "originalText": "ननु प्रारब्धं कर्म कृत्स्नाविद्यातत्कार्यनाशने प्रवृत्तस्य तत्त्वज्ञानस्य प्रतिबन्धं कृत्वा सफलदानाय देहेन्द्रियादिकमवस्थापयति, न च सुखदुःखादिभोगश्चित्तवृत्तिं विना सम्पादयितुं शक्यते, ततः कथमभिभवः?\nमैवम्, अभिभवसाध्याया जीवन्मुक्तेरपि सुखातिशयरूपत्वेन प्रारब्धफल एवान्तर्भावात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000105.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000106", "originalText": "तर्हि कर्मैव जीवन्मुक्तिं सम्पादयिष्यति, मा भूत्पुरुषप्रयत्न इति चेत्, कृषिवाणिज्यादावपि समानः पर्यनुयोगः।", "padacchedaText": "", "audioFile": "PB_hear2read_000106.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000107", "originalText": "कर्मणः स्वयमदृष्टरूपस्य दृष्टसाधनसम्पत्तिमन्तरेण फलजननासमर्थत्वादपेक्षितः कृष्यादौ पुरुषप्रयत्न इति चेत्,\nजीवन्मुक्तावपि समं समाधानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000107.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000108", "originalText": "सत्यपि पुरुषप्रयत्ने कृष्यादेः फलपर्यवसानं यत्र न दृश्यते तत्र प्रबलेन कर्मान्तरेण प्रतिबन्धः कल्पनीयः।", "padacchedaText": "", "audioFile": "PB_hear2read_000108.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000109", "originalText": "तच्च प्रबलं कर्म स्वानुकूलवृष्ट्यभावादिरूपां दृष्टसामग्रीं सम्पाद्यैव प्रतिबध्नाति।", "padacchedaText": "", "audioFile": "PB_hear2read_000109.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000110", "originalText": "स च प्रतिबन्धो विरोधिना प्रबलतरेणोत्तम्भकेन कारीरीष्ट्यादिरूपेण कर्मणापनीयते।", "padacchedaText": "", "audioFile": "PB_hear2read_000110.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000111", "originalText": "तच्च कर्म स्वानुकूलां वृष्टिलक्षणां दृष्टसामग्रीं सम्पाद्यैव प्रतिबन्धमपनयति।", "padacchedaText": "", "audioFile": "PB_hear2read_000111.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000112", "originalText": "किं बहुना? प्रारब्धकर्मण्येवात्यन्तभक्तेन भवता योगाभ्यासरूपस्य पुरुषप्रयत्नस्य वैयर्थ्यं मनसापि चिन्तयितुमशक्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000112.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000113", "originalText": "अथवा प्रारब्धं कर्म यथा तत्त्वज्ञानात्प्रबलं तथा तस्मादपि कर्मणो योगाभ्यासः प्रबलोऽस्तु।", "padacchedaText": "", "audioFile": "PB_hear2read_000113.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000114", "originalText": "तथा च योगिनामुद्दालकवीतहव्यादीनां स्वेच्छया देहत्याग उपपद्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000114.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000115", "originalText": "यद्यप्यल्पायुषामस्माकं तादृशो योगो न सम्भवति, तथाऽपि कामादिरूपचित्तवृत्तिनिरोधमात्रे योगे को नाम प्रयासः? यदि शास्त्रीयस्य प्रयत्नस्य प्राबल्यं नाङ्गीक्रियते तदा चिकित्सामारभ्य मोक्षशास्त्रपर्यन्तानां सर्वेषामानर्थक्यं प्रसज्येत।", "padacchedaText": "", "audioFile": "PB_hear2read_000115.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000116", "originalText": "न हि कदाचित् कर्मफलविसंवादमात्रेण दौर्बल्यमापादयितुं शक्यम्, अन्यथा कादाचित्कं पराजयं दृष्ट्वा सर्वैर्भूपैर्गजाश्वादिसेनोपेक्ष्येत।", "padacchedaText": "", "audioFile": "PB_hear2read_000116.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000117", "originalText": "अत एवानन्दबोधाचार्या आहुः— ``न ह्यजीर्णभयादाहारपरित्यागः, भिक्षुकभयाद्वा स्थाल्यनधिश्रयणम्, यूकाभयाद्वा प्रावरणपरित्यागः''** इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000117.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000118", "originalText": "(** यूकाभयाद्वा परिधानविमोकः शीतार्तस्य इति.— प्रमाणमाला प२१)\nशास्त्रीयप्रयत्नस्यप्राबल्यं वसिष्ठरामसंवादे विस्पष्टमवगम्यते ``सर्वमेवेह हि सदा'' इत्यारभ्य ``तदनु तदप्यवमुच्य साधु तिष्ठ'' इत्यन्तेन ग्रन्थेन।", "padacchedaText": "", "audioFile": "PB_hear2read_000118.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000119", "originalText": "वसिष्ठः— ``सर्वमेवेह हि सदा संसारे रघुनन्दन। सम्यक्प्रयुक्तात् सर्वेण पौरुषात् समवाप्यते''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000119.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000120", "originalText": "— (योगवासिष्ठे मुमुक्षुव्यवहारप्रकरणे ४.८)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000120.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000121", "originalText": "सर्वं पुत्रवित्तस्वर्गलोकब्रह्मलोकादिफलम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000121.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000122", "originalText": "पौरुषं पुत्रकामेष्टिकृषिवाणिज्यज्योतिष्टोमब्रह्मोपासनालक्षणः पुरुषप्रयत्नः।", "padacchedaText": "", "audioFile": "PB_hear2read_000122.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000123", "originalText": "``उच्छास्त्रं शास्त्रितं चेति पौरुषं द्विविधं स्मृतम्। तत्रोच्छास्त्रमनर्थाय परमार्थाय शास्त्रितम्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000123.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000124", "originalText": "(तत्रैव ५.५)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000124.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000125", "originalText": "``उच्छास्त्रं परद्रव्यापहारपरस्त्रीगमनादि।", "padacchedaText": "", "audioFile": "PB_hear2read_000125.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000126", "originalText": "शास्त्रितं नित्यनैमित्तिकानुष्ठानादि।", "padacchedaText": "", "audioFile": "PB_hear2read_000126.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000127", "originalText": "अनर्थो नरकः अर्थेषु स्वर्गादिषु परमो मोक्षः परमार्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000127.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000128", "originalText": "``आबाल्यादलमभ्यस्तैः शास्त्रसत्सङ्गमादिभिः। गुणैः पुरुषयत्नेन सोऽर्थ सम्पाद्यते हितः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000128.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000129", "originalText": "(तत्रैव ५.२८)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000129.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000130", "originalText": "अलं सम्पूर्णं सम्यगित्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000130.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000131", "originalText": "गुणैर्युक्तेनेत्यध्याहारः।", "padacchedaText": "", "audioFile": "PB_hear2read_000131.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000132", "originalText": "हितः श्रेयोरूपः।", "padacchedaText": "", "audioFile": "PB_hear2read_000132.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000133", "originalText": "श्रीरामः— ``प्राक्तनं वासनाजालं नियोजयति मां यथा। मुने तथैव तिष्ठामि कृपणः किं करोम्यहम्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000133.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000134", "originalText": "—— (तत्रैव ९.२३)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000134.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000135", "originalText": "इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000135.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000136", "originalText": "वासना धर्माधर्मरूपा जीवगताः संस्काराः।", "padacchedaText": "", "audioFile": "PB_hear2read_000136.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000137", "originalText": "वसिष्ठः— ``अत एव हि हे राम'' श्रेयः प्राप्नोषि शाश्वतम्। स्वप्रयत्नोपनीतेन पौरुषेणैव नान्यथा''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000137.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000138", "originalText": "— (तत्रैव ९.२४)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000138.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000139", "originalText": "यतो वासनापरतन्त्रो भवानत एव हि पारतन्त्र्यनिवारणाय स्वोत्साहसम्पादितो मनोवाक्कायजन्यः पुरुषव्यापारोऽपेक्षितः।", "padacchedaText": "", "audioFile": "PB_hear2read_000139.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000140", "originalText": "``द्विविधो वासनाव्यूहः शुभश्चैवाशुभश्च ते। प्राक्तनो विद्यते राम द्वयोरेकतरोऽथवा''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000140.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000141", "originalText": "(तत्रैव ९.२५)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000141.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000142", "originalText": "किं धर्माधर्मावुभावपि त्वां नियोजयत उतैकतर इति विकल्पः।", "padacchedaText": "", "audioFile": "PB_hear2read_000142.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000143", "originalText": "एकतरपक्षेऽपि शुभोऽशुभवेत्यर्थात्सिद्धो विकल्पः।", "padacchedaText": "", "audioFile": "PB_hear2read_000143.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000144", "originalText": "``वासनौघेन शुद्धेन तत्र चेदपनीयसे। तत्क्रमेणाशु तेनैव पदं प्राप्स्यसि शाश्वतम्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000144.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000145", "originalText": "— (तत्रैव ९.२६)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000145.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000146", "originalText": "तत्र तेषु पक्षेषु।", "padacchedaText": "", "audioFile": "PB_hear2read_000146.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000147", "originalText": "तत्तर्हि।", "padacchedaText": "", "audioFile": "PB_hear2read_000147.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000148", "originalText": "तेनैव क्रमेण शुभवासनाप्रापितेनैवाचरणेन प्रयत्नान्तरनिरपेक्षेण।", "padacchedaText": "", "audioFile": "PB_hear2read_000148.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000149", "originalText": "शाश्वतं पदं मोक्षम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000149.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000150", "originalText": "``अथ चेदशुभो भावस्त्वां योजयति सङ्कटे। प्राक्तनस्तदसौ यत्नाज्जेतव्यो भवता स्वयम्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000150.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000151", "originalText": "— (तत्रैव ९.२७)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000151.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000152", "originalText": "भावो वासना।", "padacchedaText": "", "audioFile": "PB_hear2read_000152.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000153", "originalText": "तत्तर्हि।", "padacchedaText": "", "audioFile": "PB_hear2read_000153.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000154", "originalText": "यत्नोऽशुभविरोधिशास्त्रीयधर्मानुष्ठानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000154.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000155", "originalText": "तेन स्वयं जेतव्यः, न तु युद्धे मृत्युमुखेनेव पुरुषान्तरमुखेन जेतुं शक्यः।", "padacchedaText": "", "audioFile": "PB_hear2read_000155.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000156", "originalText": "``शुमाशुभाभ्यां मार्गाभ्यां वहन्ती वासनासरित्। पौरुषेण प्रयत्नेन योजनीया शुभे पथि''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000156.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000157", "originalText": "(तत्रैव ९.३०)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000157.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000158", "originalText": "उभयपक्षे तु शुभभागस्य प्रयत्ननैरपेक्ष्येऽप्यशुभभागं शास्त्रीयप्रयत्नेन निवार्य शुभमेव तस्य स्थाने समाचरेत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000158.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000159", "originalText": "``अशुभेषु समाविष्टं शुभेष्वेवावतारय।", "padacchedaText": "", "audioFile": "PB_hear2read_000159.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000160", "originalText": "स्वमनः पुरुषार्थेन बलेन बलिनां वर''। — (तत्रैव ९.३१)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000160.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000161", "originalText": "अशुभेषु परस्त्रीद्रव्यादिषु।", "padacchedaText": "", "audioFile": "PB_hear2read_000161.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000162", "originalText": "शुभेषु शास्त्रार्थदेवताध्यानादिषु।", "padacchedaText": "", "audioFile": "PB_hear2read_000162.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000163", "originalText": "पुरुषार्थेन पुरुषप्रयत्नेन।", "padacchedaText": "", "audioFile": "PB_hear2read_000163.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000164", "originalText": "बलेन प्रबलेन।", "padacchedaText": "", "audioFile": "PB_hear2read_000164.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000165", "originalText": "``अशुभाच्चालितं याति शुभं तस्मादपीतरत्। जन्तोश्चित्तं तु शिशुवत् तस्मात् तच्चालयेद्बलात्''॥ ११॥", "padacchedaText": "", "audioFile": "PB_hear2read_000165.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000166", "originalText": "— (तत्रैव ९.३२)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000166.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000167", "originalText": "यथा शिशुर्मृद्भक्षणान्निवार्य फलभक्षणे योज्यते, मणिमुक्ताद्याकर्षणान्निवार्य कन्दुकाद्याकर्षणे योज्यते तथा चित्तमपि सत्सङ्गेन दुःसङ्गात्तद्विपरीतविषयान्निवारयितुं शक्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000167.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000168", "originalText": "``समतासान्त्वनेनाशु न द्रागिति शनैः शनैः। पौरुषेण प्रयत्नेन लालयेच्चित्तबालकम्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000168.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000169", "originalText": "— (तत्रैव ९.३३)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000169.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000170", "originalText": "चपलस्य पशोर्बन्धस्थाने प्रवेशनाय द्वावुपायौ भवतः।", "padacchedaText": "", "audioFile": "PB_hear2read_000170.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000171", "originalText": "हरिततृणप्रदर्शनं कण्डूयनादिकम्, वाक्यपारुष्यं दण्डादिभर्त्सनं चेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000171.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000172", "originalText": "तत्राद्येन सहसा प्रवेश्यते, द्वितीयेनेतस्ततो धावञ्शनैः शनैः प्रवेश्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000172.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000173", "originalText": "तथा शत्रुमित्रादिसमत्वबोधनं प्राणायामप्रत्याहारादिपुरुषप्रयत्नश्चेत्येतौ द्वौ चित्तशान्त्युपायौ।", "padacchedaText": "", "audioFile": "PB_hear2read_000173.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000174", "originalText": "तत्राद्येन मृदुयोगेन शीघ्रं लालयेत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000174.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000175", "originalText": "द्वितीयेन हठयोगेन द्रागिति न लालयेत्, किन्तु शनैः शनैः।", "padacchedaText": "", "audioFile": "PB_hear2read_000175.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000176", "originalText": "``द्राभ्यासवशाद्याति यदा ते वासनोदयम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000176.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000177", "originalText": "तदाभ्यासस्य साफल्यं विद्धि त्वमरिमर्दन। — (तत्रैव ९.३५)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000177.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000178", "originalText": "मृदुयोगाभ्यासाच्छीघ्रमेव सद्वासनोदये सति साफल्यमभ्यासस्य मन्तव्यम्, न त्वल्पकालत्वेनासम्भावना शङ्कनीया।", "padacchedaText": "", "audioFile": "PB_hear2read_000178.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000179", "originalText": "``सन्दिग्धायामपि भृशं शुभामेव समाहर। शुभ वासनावृद्धौ तात दोषो न कश्चन''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000179.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000180", "originalText": "— (तत्रैव ९.३८)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000180.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000181", "originalText": "शुभवासनाभ्यस्यमाना सम्पूर्णा वा न वेति यदा सन्देहस्तदापि शुभामभ्यस्येदेव।", "padacchedaText": "", "audioFile": "PB_hear2read_000181.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000182", "originalText": "तद्यथा सहस्रजपे प्रवृत्तस्य दशमी शतसङ्ख्या यदा सन्दिग्धा, नदा पुनरपि शतं जपेत्, असम्पूर्तौ सम्पूर्तिः फलिष्यति, सम्पूर्ती तु तद्वृद्ध्या न सहस्रजपो दुष्यति, तद्वत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000182.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000183", "originalText": "``अव्युत्पन्नमना यावद्भवानज्ञाततत्पदः। गुरुशास्त्रप्रमाणैस्तु निर्णीतं तावदाचर''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000183.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000184", "originalText": "— (तत्रैव ९.४१९)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000184.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000185", "originalText": "``ततः पक्वकषायेण नूनं विज्ञातवस्तुना। भोऽप्यसौ त्वया त्याज्यो वासनौघो निरोधिना''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000185.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000186", "originalText": "— (तत्रैव ९.४२)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000186.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000187", "originalText": "``यदतिसुभगमार्यसेवितं त—\nच्छुभमनुसृत्य मनोज्ञभावशुद्धया॥", "padacchedaText": "", "audioFile": "PB_hear2read_000187.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000188", "originalText": "अधिगमय पदं सदा विशोकं\nतदनु तदप्यवमुच्य साधु तिष्ठ''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000188.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000189", "originalText": "— (तत्रैव ९.४३) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000189.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000190", "originalText": "स्पष्टोर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000190.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000191", "originalText": "तस्माद्योगाभ्यासेन कामाद्यभिभवसम्भवाज्जीवन्मुक्तौ न विवदितव्यम्। इति जीवन्मुक्तिस्वरूपम्॥ ३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000191.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000192", "originalText": "श्रुतिस्मृतिवाक्यानि जीवन्मुक्तिसद्भावे प्रमाणानि।", "padacchedaText": "", "audioFile": "PB_hear2read_000192.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000193", "originalText": "तानि च कठवल्ल्यादिषु पठ्यन्ते— तत्र ``विमुक्तश्च विमुच्यते'' (५.१) इति कठवल्ल्याम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000193.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000194", "originalText": "जीवन्नेव दृष्टबन्धनात् कामादेर्विशेषेण मुक्तः सन् देहपाते भाविबन्धाद्विशेषेण मुच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000194.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000195", "originalText": "वेदनात् प्रागपि शमदमादिसम्पादनेन कामादिभ्यो मुच्यत एव, तथाप्युत्पन्नानां कामादीनां तत्र प्रयत्नेन निरोधः, अत्र तु धीवृत्त्यभावादनुत्पत्तिरेव, ततो विशेषेणेत्युच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000195.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000196", "originalText": "तथा प्रलये देहपाते च सति कञ्चित्कालं भाविदेहबन्धान्मुच्यते, अत्र त्वात्यन्तिको मोक्ष इत्यभिप्रेत्य विशेषेणेत्युक्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000196.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000197", "originalText": "बृहदारण्यके पठ्यते—\n``यदा सर्वे प्रमुच्यन्ते कामा येऽस्य हृदि श्रिताः। अथ मर्त्योऽमृतो भवत्यत्र ब्रह्म समश्नुते''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000197.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000198", "originalText": "— (४.४.७) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000198.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000199", "originalText": "श्रुत्यन्तरेऽपि— ``सचक्षुरचक्षुरिव सकर्णोऽकर्ण इव समना अमना इव सप्राणोऽप्राण इव'' ** इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000199.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000200", "originalText": "एवमन्यत्राप्युदाहार्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000200.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000201", "originalText": "स्मृतिषु जीवन्मुक्तः स्थितप्रज्ञभगवद्भक्तगुणातीतब्राह्मणातिवर्णाश्रम्यादिनामभि—स्तत्र तत्र व्यवह्रियते।", "padacchedaText": "", "audioFile": "PB_hear2read_000201.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000202", "originalText": "वसिष्ठरामसंवादे— ``नृणां ज्ञानैकनिष्ठानाम्'' इत्यारभ्य ``सत्किञ्चिदवशिष्यते''\nइत्यन्तेन ग्रन्थेन जीवन्मुक्तः पठ्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000202.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000203", "originalText": "वसिष्ठ— ``नृणां ज्ञानैकनिष्ठानामात्मज्ञानविचारिणाम्। सा जीवन्मुक्तोदेति विदेहोन्मुक्ततेव या''॥ ८८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000203.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000204", "originalText": "— (लघुयोगवासिष्ठे ५.८८)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000204.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000205", "originalText": "ज्ञानैकनिष्ठत्वं लौकिकवैदिककर्मत्यागः।", "padacchedaText": "", "audioFile": "PB_hear2read_000205.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000206", "originalText": "देहेन्द्रियसदसद्भावमात्रेण मुक्तिद्वयस्य विशेषो न त्वनुभवतः द्वैतप्रतीतेरुभयत्राभावात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000206.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000207", "originalText": "श्रीरामः— ``ब्रह्मन्विदेहमुक्तस्य जीवन्मुक्तस्य लक्षणम्। ब्रूहि येन तथैवाहं यते शास्त्रजया दृशा॥ ८९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000207.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000208", "originalText": "**— (तत्रैव ५.८९)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000208.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000209", "originalText": "वसिष्ठः— ``यथास्थितमिदं यस्य व्यवहारवतोऽपि च। अस्तं गतं स्थितं व्योम स जीवन्मुक्त उच्यते॥ ९०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000209.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000210", "originalText": "— (तत्रैव ५.९०)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000210.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000211", "originalText": "इदं प्रतीयमानं गिरिनदीसमुद्रादिकं जगत्प्रतिपत्तुर्देहेन्द्रियव्यवहारेण सह महाप्रलये परमेश्वरेणोपसंहृतं सत्स्वरूपोपमर्देनास्तं गतं भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_000211.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000212", "originalText": "अत्र तु न तथा, किं तु विद्यत एव देहेन्द्रियादिव्यवहारः।", "padacchedaText": "", "audioFile": "PB_hear2read_000212.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000213", "originalText": "गिरिनद्यादिकं च परमेश्वरेणानुपसंहृतत्वाद् यथापूर्वमवतिष्ठमानं सत्सर्वैरन्यैः प्राणिभिर्विस्पष्टमवलोक्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000213.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000214", "originalText": "जीवन्मुक्तस्य\nतत्प्रत्यायकधीवृत्त्यभावात् सुषुप्ताविव सर्वमस्तं गतं भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_000214.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000215", "originalText": "स्वयं प्रकाशमानं चिद्व्योम केवलमवशिष्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000215.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000216", "originalText": "बद्धस्य सुषुप्तौ तात्कालिकधीवृत्त्यभावसाम्येऽपि भाविधीवृत्तिबीजसद्भावान्न जीवन्मुक्तत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000216.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000217", "originalText": "वसिष्ठः— ``नोदेति नास्तमायाति सुखे दुःखे मुखप्रभा। यथाप्राप्ते स्थितिर्यस्य स जीवन्मुक्त उच्यते''॥ ९१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000217.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000218", "originalText": "— (तत्रैव ५.९१)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000218.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000219", "originalText": "मुखप्रभा हर्षः।", "padacchedaText": "", "audioFile": "PB_hear2read_000219.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000220", "originalText": "स्रक्चन्दनसत्कारादिसुखे प्राप्तेऽपि संसारिण इव हर्षो नोदेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000220.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000221", "originalText": "मुखप्रभास्तमयो दैन्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000221.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000222", "originalText": "धनहानिधिक्कारादिदुःखे प्राप्तेऽपि न दीनो भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_000222.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000223", "originalText": "इदानीन्तनस्वप्रयत्नविशेषमन्तरेण प्रारब्धकर्मा—पादितपूर्वप्रवाहागतभिक्षान्नादिकं यथाप्राप्तम्, तस्मिन् स्थितिर्देहरक्षा।", "padacchedaText": "", "audioFile": "PB_hear2read_000223.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000224", "originalText": "समाधिदार्ढ्येन स्रक्चन्दनादि—प्रतीत्यभावात्, कदाचिद् व्युत्थानदशायामापाततः प्रतीतावपि विवेकदार्ढ्येनैव हेयोपादेयत्वबुद्ध्य—भावाद्धर्षादिराहित्यमुपपद्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000224.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000225", "originalText": "वसिष्ठः— ``यो जागर्ति सुषुप्तिस्थो यस्य जाग्रन्न विद्यते। यस्य निर्वासनो बोधः स जीवन्मुक्त उच्यते''॥ ९२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000225.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000226", "originalText": "— (तत्रैव ५.९२)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000226.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000227", "originalText": "चक्षुरादीन्द्रियाणां स्वस्वगोलकेष्ववस्थानेनोपरत्यभावाज्जागर्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000227.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000228", "originalText": "मनोवृत्तिरहितत्वात् सुषुप्तिस्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000228.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000229", "originalText": "अत एव ``इन्द्रियैरर्थोपलब्धिः'' इत्येतस्य जागरणलक्षणस्याभावाज्जाग्रन्न विद्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000229.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000230", "originalText": "सत्यपि बोधे जायमानो\nब्रह्मवित्त्वाभिमानादिभिर्भोगार्थापादितकामादिभिश्च धीदोषो वासना, वृत्तिराहित्येन तद्दोषाभावान्निर्वा—सनत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000230.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000231", "originalText": "वसिष्ठः— ``रागद्वेषभयादीनामनुरूपं चरन्नपि। योऽन्तर्व्योमवदत्यच्छः स जीवन्मुक्त उच्यते''॥ ९३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000231.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000232", "originalText": "— (तत्रैव ५.९३)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000232.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000233", "originalText": "रागानुरूपं भोजनादिप्रवृत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000233.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000234", "originalText": "द्वेषानुरूपं बौद्धकापालिकादिभ्यो विमुखत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000234.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000235", "originalText": "भयानुरूपं सर्पव्याघ्रादिभ्योऽपसर्पणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000235.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000236", "originalText": "आदिशब्देन मात्सर्यानुरूपमितरयोगिभ्य आधिक्येन समाध्यनुष्ठानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000236.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000237", "originalText": "सत्यपि व्युत्थानदशायामीदृश आचरणे पूर्वाभ्यासेन प्रापिते विश्रान्तचित्तस्य कालुष्यरहितत्वा—दत्यच्छत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000237.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000238", "originalText": "यथा व्योम्नि धूमधूलिमेघादियुक्तेऽपि निर्लेपस्वभावत्वादतिशयेन स्वच्छत्वं तद्वत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000238.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000239", "originalText": "वसिष्ठः—\n``यस्य नाहङ्कृतो भावो बुद्धिर्यस्य न लिप्यते। कुर्वतोऽकुर्वतो वापि स जीवन्मुक्त उच्यते''॥ ९४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000239.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000240", "originalText": "— (तत्रैव ५.९४)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000240.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000241", "originalText": "पूर्वार्धं विद्वत्संन्यासप्रस्तावे व्याख्यातम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000241.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000242", "originalText": "लोके बद्धस्य पुरुषस्य शास्त्रीयं कर्म कुर्वतः ``अहं कर्ता'' इति चिदात्माहङ्कृतो भवति, ``भावि स्वर्गं प्राप्स्यामि'' इति हर्षेण बुद्धिर्लिप्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000242.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000243", "originalText": "अकुर्वतस्तु ``त्यक्तवानस्मि'' इत्यहङ्कृतत्वम्, स्वर्गालाभविषादो लेपः।", "padacchedaText": "", "audioFile": "PB_hear2read_000243.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000244", "originalText": "एवं प्रतिषिद्धकर्मणि लौकिककर्मणि च यथासम्भवं योजनीयम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000244.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000245", "originalText": "जीवन्मुक्तस्य तु तादात्म्याध्यासाभावाद्धर्षाद्यभावाच्च न दोषद्वयम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000245.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000246", "originalText": "वसिष्ठः— ``यस्मान्नोद्विजते लोको लोकान्नोद्विजते च यः। हर्षामर्षभयान्मुक्तः स जीवन्मुक्त उच्यते''॥ ९५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000246.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000247", "originalText": "— (तत्रैव ५.९५)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000247.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000248", "originalText": "अधिक्षेपताडनादावप्रवृत्तत्वादेतस्माल्लोको नोद्विजते।", "padacchedaText": "", "audioFile": "PB_hear2read_000248.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000249", "originalText": "अत एवैतस्मिल्लोँकस्याप्यधिक्षेपाद्यप्रवृत्तेः, कस्यचिद् दुष्टस्य तत्प्रवृत्तावप्येतच्चित्ते तादृशविकल्पानुदयाच्चायमपि नोद्विजते।", "padacchedaText": "", "audioFile": "PB_hear2read_000249.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000250", "originalText": "वसिष्ठः— ``शान्तसंसारकलनः कलावानपि निष्कलः। यः सचित्तोऽपि निश्चित्तः स जीवन्मुक्त उच्यते''॥ ९६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000250.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000251", "originalText": "— (तत्रैव ५.९६)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000251.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000252", "originalText": "शत्रुमित्रमानावमानादिविकल्पाः संसारकलनाः शान्ता यस्य सः।", "padacchedaText": "", "audioFile": "PB_hear2read_000252.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000253", "originalText": "चतुःषष्टिर्विद्या कलाः, तत्सद्भावेऽपि तदभिमानव्यवहारयोरभावान्निष्कलत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000253.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000254", "originalText": "चित्तस्य स्वरूपेण सद्भावेऽपि वृत्त्यनुदयान्निश्चित्तत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000254.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000255", "originalText": "``सचिन्तोऽपि निश्चिन्तः'' इति पाठे वासनावशादात्मध्यानवृत्तिसद्भावेऽपि लौकिकवृत्त्यभावा—न्निश्चिन्तत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000255.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000256", "originalText": "वसिष्ठः—\n``यः समस्तार्थजातेषु व्यवहार्यपि शीतलः। परार्थेष्विव पूर्णात्मा स जीवन्मुक्त उच्यते''॥ ९७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000256.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000257", "originalText": "— (तत्रैव ५.९७)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000257.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000258", "originalText": "परगृहे विवाहोत्सवादौ स्वयं गत्वा तत्प्रीत्यै तदीयकार्येषु व्यवहरन्नपि लाभालाभयोर्हर्षविषादरूपं बुद्धिसन्तापं न प्राप्नोति यथा, एवमयं मुक्तः स्वकार्येऽपि शीतलः।", "padacchedaText": "", "audioFile": "PB_hear2read_000258.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000259", "originalText": "न केवलं सन्तापाभावाच्छीतलत्वं किं तु पूर्णस्वरूपानुसन्धानादपि। इति जीवन्मुक्तलक्षणम्॥ ४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000259.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000260", "originalText": "अथ विदेहमुक्तलक्षणम्—\n``जीवन्मुक्तपदं त्यक्त्वा स्वदेहे कालसात्कृते। विशत्यदेहमुक्तत्वं पवनोऽस्पन्दतामिव॥ ९८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000260.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000261", "originalText": "— (तत्रैव ५.९८)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000261.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000262", "originalText": "यथा वायुः कदाचिच्चलनं त्यक्त्वा निश्चलरूपेणावतिष्ठते, तथा मुक्तात्माप्युपाधिकृतं संसारं त्यक्त्वा स्वरूपेणावतिष्ठते।", "padacchedaText": "", "audioFile": "PB_hear2read_000262.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000263", "originalText": "``विदेहमुक्तो नोदेति नास्तमेति न शाम्यति। न सन्नासन्न दूरस्थो न चाहं न च नेतरः''॥ ९९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000263.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000264", "originalText": "— (तत्रैव ५.९९)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000264.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000265", "originalText": "उदयास्तमयौ हर्षविषादौ।", "padacchedaText": "", "audioFile": "PB_hear2read_000265.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000266", "originalText": "न शाम्यति न च तत्परित्यागी, लिङ्गदेहस्यात्रैव लीनत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000266.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000267", "originalText": "सद्वाच्यो जगद्धेतुरविद्यामायोपाधिर्न प्राज्ञेश्वरः, असद्वाच्यो नापि भूतभौतिकः।", "padacchedaText": "", "audioFile": "PB_hear2read_000267.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000268", "originalText": "न दूरस्थ इत्युक्त्या न मायातीतः।", "padacchedaText": "", "audioFile": "PB_hear2read_000268.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000269", "originalText": "न चेत्युक्त्या स्थूलभुक्समीपस्थोऽपि निषिध्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000269.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000270", "originalText": "अहं न चेति न समष्टिश्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000270.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000271", "originalText": "नेतर इति न व्यष्टिश्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000271.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000272", "originalText": "व्यवहारयोग्यो विकल्पः कोऽपि नास्तीत्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000272.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000273", "originalText": "``ततः स्तिमितगम्भीरं न तेजो न तमस्ततम्। अनाख्यमनभिव्यक्तं सत्किञ्चिदवशिष्यते''॥ १००॥", "padacchedaText": "", "audioFile": "PB_hear2read_000273.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000274", "originalText": "— (तत्रैव ५.१००)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000274.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000275", "originalText": "एवंविधया विदेहमुक्त्या सादृश्योक्तेर्जीवन्मुक्तावपि यावद्यावन्निर्विकल्पातिशयस्तावत्तावदुत्तमत्वं द्रष्टव्यम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_000275.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000276", "originalText": "भगवद्गीतासु द्वितीयाध्याये स्थितप्रज्ञः पठ्यते—\nअर्जुन उवाच—\n``स्थितप्रज्ञस्य का भाषा समाधिस्थस्य केशव। स्थितधीः किं प्रभाषेत किमासीत व्रजेत किम्''॥ ५४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000276.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000277", "originalText": "प्रज्ञा तत्त्वज्ञानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000277.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000278", "originalText": "तद् द्विविधं स्थितमस्थितं चेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000278.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000279", "originalText": "यथा जारेऽनुरक्ताया नार्याः सर्वेष्वपि व्यवहारेषु बुद्धिर्जारमेव ध्यायति, प्रमाणप्रमितानि क्रियमाणान्यपि गृहकर्माण सद्य एव विस्मर्यन्ते, तथा परवैराग्योपेतस्य योगाभ्यासपाटवेनात्यन्तवशीकृतचित्तस्योत्पन्ने तत्त्वज्ञाने बुद्धिर्जारमिव नैरन्तर्येण तत्त्वं ध्यायति, तदिदं स्थितं प्रज्ञानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000279.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000280", "originalText": "उक्तगुणरहितस्य केनापि पुण्यविशेषेण कदाचिदुत्पन्नेऽपि तत्त्वज्ञाने गृहकर्मवत्तत्रैव तत्त्वं विस्मर्यते, तदिदमस्थितं प्रज्ञानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000280.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000281", "originalText": "एतदेवाभिप्रेत्य वसिष्ठ आह—\n``परव्यसनिनी नारी व्यग्रापि गृहकर्मणि। तदेवास्वादयत्यन्तः परसङ्गरसायनम्॥ ५८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000281.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000282", "originalText": "एवं तत्त्वे परे शुद्धे धीरो विश्रान्तिमागतः। तदेवास्वादयत्यन्तर्बहिर्व्यवहरन्नपि''॥ ५९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000282.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000283", "originalText": "— (लघुयोगवासिष्ठे २७.५८, ५९) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000283.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000284", "originalText": "तत्र स्थितप्रज्ञः कालभेदाद् द्विविधः, समाहितो व्युत्थितश्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000284.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000285", "originalText": "तयोरुभयोर्लक्षणं पूर्वोत्तराभ्यामर्धाभ्यां पृच्छति— समाधिस्थस्य स्थितप्रज्ञस्य का भाषा? कीदृशैर्लक्षणवाचकैः शब्दैः सर्वैरयं भाष्यते? व्युत्थितः स्थितप्रज्ञः कीदृशं वाग्व्यवहारं करोति? तस्योपवेशनगमने मन्देभ्यो विलक्षणे कीदृशे?\nश्रीभगवानुवाच—\nप्रजहाति या कामान् सर्वान् पार्थ मनोगतान्।", "padacchedaText": "", "audioFile": "PB_hear2read_000285.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000286", "originalText": "आत्मन्येवात्मना तुष्टः स्थितप्रज्ञस्तदोच्यते''॥ ५५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000286.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000287", "originalText": "— (श्रीमद्भगवद्गीतायां २.५५)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000287.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000288", "originalText": "कामास्त्रिविधाः, बाह्या आन्तरा वासनामात्ररूपाश्चेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000288.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000289", "originalText": "उपार्जितमोदकादयो बाह्याः, आशामोदकादय आन्तराः, पथिपतिततृणादिवदापाततः प्रतीता वासनारूपाश्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000289.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000290", "originalText": "समाहितोऽशेषधीवृत्तिसङ्क्षयात् सर्वान् परित्यजति।", "padacchedaText": "", "audioFile": "PB_hear2read_000290.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000291", "originalText": "अस्ति चास्य मुखप्रसादलिङ्गगम्य सन्तोषः।", "padacchedaText": "", "audioFile": "PB_hear2read_000291.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000292", "originalText": "स च न कामेषु किं त्वात्मन्येव, कामानां त्यक्तत्वात्, बुद्धेः परमानन्दरूपेणात्मतत्त्वाभिमुखत्वाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000292.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000293", "originalText": "न चात्र सम्प्रज्ञातसमाधाविवात्मानन्दो\nमनोवृत्त्योल्लिख्यते, किं तु स्वप्रकाशचिद्रूपेणात्मना।", "padacchedaText": "", "audioFile": "PB_hear2read_000293.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000294", "originalText": "सन्तोषश्च न वृत्तिरूपः, किं तु तत्संस्काररूपः।", "padacchedaText": "", "audioFile": "PB_hear2read_000294.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000295", "originalText": "एवंविधैर्लक्षणवाचकैः शब्दैः समाहितो भाष्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000295.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000296", "originalText": "``दुःखेष्वनुद्विग्नमनाः सुखेषु विगतस्पृहः। वीतरागभयक्रोधः स्थितधीर्मुनिरुच्यते''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000296.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000297", "originalText": "— (तत्रैव २.५६)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000297.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000298", "originalText": "दुःखं रागादिनिमित्तजन्या रजोगुणविकाररूपा सन्तापात्मिका प्रतिकूला चित्तवृत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000298.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000299", "originalText": "तादृशे दुःखे प्राप्ते सति ``अहं पापः, धिङ्मां दुरात्मानम्'' इत्यनुतापात्मिका तमोगुणविकारत्वेन भ्रान्तिरूपा चित्तवृत्तिरुद्वेगः।", "padacchedaText": "", "audioFile": "PB_hear2read_000299.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000300", "originalText": "यद्यप्ययं विवेक इवाभाति तथाऽपि पूर्वस्मिञ्जन्मनि चेत्तत्पापप्रवृत्तिप्रतिबन्धकत्वात् ``सप्रयोजनो भवति, इदानीं तु निष्प्रयोजन इति भ्रान्तित्वं द्रष्टव्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000300.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000301", "originalText": "सुखं राज्यपुत्रलाभादिनिमित्तजन्या सात्त्विकी प्रीतिरूपानुकूला चित्तवृत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000301.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000302", "originalText": "तस्मिन्सुखे सत्यागामिनस्तादृशस्य सुखस्य कारणं पुण्यमननुष्ठाय वृथैव तदपेक्षा तामसी चित्तवृत्तिः स्पृहा।", "padacchedaText": "", "audioFile": "PB_hear2read_000302.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000303", "originalText": "तत्र च सुखदुःखयोः प्रारब्धकर्मप्रापितत्वाद्व्युत्थितचित्तस्य\nवृत्तिसम्भवाच्च तदुभयमुपपद्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000303.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000304", "originalText": "उद्वेगस्पृहे तु न विवेकिनः सम्भवतः।", "padacchedaText": "", "audioFile": "PB_hear2read_000304.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000305", "originalText": "तथा रागभयक्रोधाश्च तामसत्वेन कर्मणा प्रापितत्वाभावान्नास्य विद्यन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000305.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000306", "originalText": "एवंलक्षणलक्षितः स्वानुभवप्रकटेन शिष्यशिक्षार्थमनुद्वेगनिःस्पृ—हत्वादिगमकं वचो भाषत इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000306.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000307", "originalText": "``यः सर्वत्रानभिस्नेहस्तत्तत्प्राप्य शुभाशुभम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000307.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000308", "originalText": "नाभिनन्दति न द्वेष्टि तस्य प्रज्ञा प्रतिष्ठिता ''। — (तत्रैव २.५७)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000308.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000309", "originalText": "यस्मिन्सत्यन्यदीये हानिवृद्धी स्वस्मिन्नारोप्येते तादृशोऽन्यविषयस्तामसवृत्तिविशेषः स्नेहः।", "padacchedaText": "", "audioFile": "PB_hear2read_000309.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000310", "originalText": "सुखहेतुः स्वकलत्रादिः शुभो विषयः।", "padacchedaText": "", "audioFile": "PB_hear2read_000310.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000311", "originalText": "तद्गुणकथनादिप्रवर्तिका धीवृत्तिरभिनन्दः।", "padacchedaText": "", "audioFile": "PB_hear2read_000311.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000312", "originalText": "अत्र गुणकथनस्य परप्ररोचनार्थत्वाभावेनव्यर्थत्वात्तद्धेतुरभिनन्दस्तामसः।", "padacchedaText": "", "audioFile": "PB_hear2read_000312.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000313", "originalText": "असूयोत्पादनेन दुःखहेतुः परकीयविद्यादिरेनं प्रत्यशुभो विषयः।", "padacchedaText": "", "audioFile": "PB_hear2read_000313.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000314", "originalText": "तन्निन्दाप्रवर्तिका धीवृत्तिद्वेषः।", "padacchedaText": "", "audioFile": "PB_hear2read_000314.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000315", "originalText": "सोऽपि तामसः, तन्निन्दाया निवारणार्थत्वाभावेन व्यर्थत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000315.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000316", "originalText": "त एते तामसा धर्माः कथं विवेकिनि सम्भवेयुः?\n``यदा संहरते चायं कूर्मोऽङ्गानीव सर्वशः। इन्द्रियाणीन्द्रियार्थेभ्यस्तस्य प्रज्ञा प्रतिष्ठिता''॥ २.५८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000316.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000317", "originalText": "— (तत्रैव २.५८)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000317.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000318", "originalText": "व्युत्थितस्य समस्ततामसवृत्त्यभावः पूर्वश्लोकाभ्यामभिहितः।", "padacchedaText": "", "audioFile": "PB_hear2read_000318.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000319", "originalText": "समाहितस्य तु वृत्तय एव न सन्ति कुतस्तामसत्वशङ्केत्यभिप्रायः।", "padacchedaText": "", "audioFile": "PB_hear2read_000319.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000320", "originalText": "``विषया विनिवर्तन्ते निराहारस्य देहिनः। रसवर्जं रसोऽप्यस्य परं दृष्ट्वा निवर्तते''॥ ५९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000320.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000321", "originalText": "— (तत्रैव २.५९)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000321.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000322", "originalText": "प्रारब्धं कर्म सुखदुःखहेतून्कांश्चिद्विषयांश्चन्द्रोदयान्धकारादिरूपान् स्वयमेव सम्पादयति, अन्यांस्तु गृहक्षेत्रादीन् पुरुषोद्योगद्वारेण।", "padacchedaText": "", "audioFile": "PB_hear2read_000322.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000323", "originalText": "तत्र चन्द्रोदयादयः पूर्णेनेन्द्रियादिसंहारलक्षणेन समाधिनैव निवर्तन्ते, नान्यथा।", "padacchedaText": "", "audioFile": "PB_hear2read_000323.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000324", "originalText": "गृहादयस्तु समाधिमन्तरेणापि निवर्तन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000324.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000325", "originalText": "आहरणमाहार उद्योगः।", "padacchedaText": "", "audioFile": "PB_hear2read_000325.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000326", "originalText": "निरुद्योगस्य गृहादिविषया निवर्तन्ते, रसस्तु न निवर्तते।", "padacchedaText": "", "audioFile": "PB_hear2read_000326.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000327", "originalText": "रसो मानसी तृष्णा।", "padacchedaText": "", "audioFile": "PB_hear2read_000327.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000328", "originalText": "सापि परमानन्दरूपस्य परस्य ब्रह्मणो दर्शने सति स्वल्पानन्दहेतुभ्यो निवर्तते, ``किं प्रजया करिष्यामो येषां नोऽयमात्माऽयं लोकः'' (बृहदारण्यके उपनिषदि ४.४.२२) इति श्रुतेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000328.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000329", "originalText": "``यततो ह्यपि कौन्तेय पुरुषस्य विपश्चितः। इन्द्रियाणि प्रमाथीनि हरन्ति प्रसभं मनः॥ ६०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000329.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000330", "originalText": "तानि सर्वाणि संयम्य युक्त आसीत मत्परः। वशे हि यस्येन्द्रियाणि तस्य प्रज्ञा प्रतिष्ठिता''॥ ६१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000330.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000331", "originalText": "— (तत्रैव २.६०, ६१)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000331.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000332", "originalText": "उद्योगत्यागब्रह्मदर्शनप्रयत्नं कुर्वतोऽपि कदाचित्कप्रमादपरिहाराय समाध्यभ्यासः।", "padacchedaText": "", "audioFile": "PB_hear2read_000332.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000333", "originalText": "तदेतत्किमासीतेतिप्रश्नोत्तरम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000333.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000334", "originalText": "``ध्यायतो विषयान्पुंसः सङ्गस्तेषूपजायते। सङ्गात्सञ्जायते कामः कामात्क्रोधोभिजायते''॥ ६२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000334.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000335", "originalText": "``क्रोधाद्भवति सम्मोहः सम्मोहात्स्मृतिविभ्रमः। स्मृतिभ्रंशाद्बुद्धिनाशो बुद्धिनाशात्प्रणश्यति''॥ ६३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000335.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000336", "originalText": "— (तत्रैव २.६२, ६३)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000336.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000337", "originalText": "असति समाध्यभ्यासे प्रमादप्रकार उपन्यस्तः।", "padacchedaText": "", "audioFile": "PB_hear2read_000337.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000338", "originalText": "सङ्गो ध्येयविषयसन्निधिः, सम्मोहो विवेकपराङ्मुखत्वम्,\nस्मृतिविभ्रमस्तत्त्वानसन्धानाभावः, बुद्धिनाशो विपरीतभावनोपचयदोषेण प्रतिबद्धस्य ज्ञानस्य मोक्षप्रदत्वसामर्थ्याभावः।", "padacchedaText": "", "audioFile": "PB_hear2read_000338.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000339", "originalText": "``रागद्वेषवियुक्तैस्तु विषयानिन्द्रियैश्चरन्। आत्मवश्यैर्विधेयात्मा प्रसादमधिगच्छति''॥ ६४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000339.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000340", "originalText": "— (तत्रैव २.६४)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000340.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000341", "originalText": "विधेयात्मत्वं वशीकृतमनस्त्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000341.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000342", "originalText": "प्रसादो नैर्मल्यं बन्धराहित्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000342.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000343", "originalText": "समाध्यभ्यासयुक्तस्तद्वासनाबलाद् व्युत्थानदशायामिन्द्रियैर्व्यवहरन्नपि प्रसादं सम्यक्प्राप्नोति।", "padacchedaText": "", "audioFile": "PB_hear2read_000343.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000344", "originalText": "तदेतत्किं व्रजेतेतिप्रश्नोत्तरम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000344.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000345", "originalText": "उपरितनेनापि बहुना ग्रन्थेन स्थितप्रज्ञः प्रपञ्चितः।", "padacchedaText": "", "audioFile": "PB_hear2read_000345.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000346", "originalText": "ननु प्रज्ञायाः स्थित्युत्पत्तिभ्यां प्रागपि साधनत्वेन रागद्वेषादिराहित्यमपेक्षितम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000346.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000347", "originalText": "बाढम्, तथाप्यस्ति विशेषः, स च श्रेयोमार्गकारैर्दर्शितः—\n``विद्यास्थितये प्राग्ये साधनभूताः प्रयत्ननिष्पाद्याः। लक्षणभूतास्तु पुनः स्वभावतस्ते स्थिताः स्थितप्रज्ञे॥", "padacchedaText": "", "audioFile": "PB_hear2read_000347.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000348", "originalText": "जीवन्मुक्तिरितीमां वदन्त्यवस्थां स्थितात्मसम्बोधाम्। बाधितभेदप्रतिभामबाधितात्मावबोधसामर्थ्यात्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000348.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000349", "originalText": "इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000349.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000350", "originalText": "भगवद्भक्तो द्वादशाध्याये भगवता वर्णितः—\n``अद्वेष्टा सर्वभूतानां मैत्रः करुण एव च। निर्ममो निरहङ्कारः समदुःखसुखः क्षमी॥ १३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000350.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000351", "originalText": "सन्तुष्टः सततं योगी यतात्मा दृढनिश्चयः। मय्यर्पितमनोबुद्धिर्यो मद्भक्तः स मे प्रियः''॥ १४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000351.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000352", "originalText": "— (श्रीमद्भगवद्गीतायां १२.१३, १४)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000352.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000353", "originalText": "ईश्वरार्पितमनस्त्वेन समाहितस्यान्यानुसन्धानाभावात्, व्युत्थितस्याप्युदासीनानुसन्धानेन हर्षविषादा—भावाच्च सुखदुःखसाम्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000353.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000354", "originalText": "एवं वक्ष्यमाणेष्वपि द्वन्द्वेषु द्रष्टव्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000354.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000355", "originalText": "``यस्मान्नोद्विजते लोको लोकान्नोद्विजते च यः। हर्षामर्षभयोद्वेगैर्मुक्तो यः स च मे प्रियः॥ १५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000355.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000356", "originalText": "``अनपेक्षः शुचिर्दक्ष उदासीनो गतव्यथः। सर्वारम्भपरित्यागी यो मद्भक्तः स मे प्रियः॥ १६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000356.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000357", "originalText": "``यो न हृष्यति न द्वेष्टि न शोचति न काङ्क्षति। शुभाशुभपरित्यागी भक्तिमान्यः स मे प्रियः॥ १७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000357.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000358", "originalText": "समः शत्रौ च मित्रे च तथा मानापमानयोः। शीतोष्णसुखदुःखेषु समः सङ्गविवर्जितः॥ १८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000358.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000359", "originalText": "तुल्यनिन्दास्तुतिर्मौनी सन्तुष्टो येन केनचित्। अनिकेतःस्थिरमतिर्भक्तिमान् मे प्रियो नरः''॥ १९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000359.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000360", "originalText": "इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000360.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000361", "originalText": "अत्रापि पूर्ववद्विशेषो वार्त्तिककारैर्दर्शितः—\n``उत्पन्नात्मप्रबोधस्य ह्यद्वेष्टृत्वादयो गुणाः। अयत्नतो भवन्त्यस्य न तु साधनरूपिणः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000361.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000362", "originalText": "— (नैष्कर्म्यसिद्धौ ४.६९) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000362.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000363", "originalText": "गुणातीतश्चतुर्दशाध्याये वर्णितः—\nअर्जुन उवाच।", "padacchedaText": "", "audioFile": "PB_hear2re
