ad_000363.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000364", "originalText": "``कैर्लिङ्गैस्त्रीन्गुणानेतानतीतो भवति प्रभो। किमाचारः कथं चैतांस्त्रीन्गुणानतिवर्तते ``॥ २१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000364.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000365", "originalText": "— (श्रीमद्भगवद्गीतायां १४.२१)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000365.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000366", "originalText": "त्रयो गुणाः सत्त्वरजस्तमांसि, तेषां परिणामविशेषात्सर्वः संसारः प्रवर्तते, अतो गुणातीतत्वमसंसारित्वम्, जीवन्मुक्त्वमिति यावत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000366.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000367", "originalText": "लिङ्गानि परेषामेतदीयगुणातीतत्वबोधकानि।", "padacchedaText": "", "audioFile": "PB_hear2read_000367.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000368", "originalText": "आचार आचरणम्, तदीयमनः सञ्चारप्रकारः।", "padacchedaText": "", "audioFile": "PB_hear2read_000368.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000369", "originalText": "कथमिति साधनप्रकारप्रश्नः।", "padacchedaText": "", "audioFile": "PB_hear2read_000369.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000370", "originalText": "श्रीभगवानुवाच।", "padacchedaText": "", "audioFile": "PB_hear2read_000370.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000371", "originalText": "``प्रकाशं च प्रवृत्तिं च मोहमेव च पाण्डव। न द्वेष्टि सम्प्रवृत्तानि न निवृत्तानि काङ्क्षति॥ २२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000371.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000372", "originalText": "उदासीनवदासीनो गुणैर्यो न विचाल्यते। गुणा वर्तन्त इत्येव योऽवतिष्ठति नेङ्गते॥ २३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000372.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000373", "originalText": "समदुःखसुखः स्वस्थः समलोष्टाश्मकाञ्चनः। तुल्यप्रियाप्रियो धीरस्तुल्यनिन्दात्मसंस्तुतिः॥ २४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000373.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000374", "originalText": "मानापमानयोस्तुल्यस्तुल्यो मित्रारिपक्षयोः। सर्वारम्भपरित्यागी गुणातीतः स उच्यते॥ २५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000374.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000375", "originalText": "मां च योऽव्यभिचारेण भक्तियोगेन सेवते। सगुणान्समतीत्यैतान्ब्रह्मभूयाय कल्पते''॥ २६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000375.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000376", "originalText": "— (तत्रैव १४.२६)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000376.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000377", "originalText": "प्रकाशप्रवृत्तिमोहाः सत्त्वरजस्तमोगुणाः।", "padacchedaText": "", "audioFile": "PB_hear2read_000377.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000378", "originalText": "ते च जाग्रत्स्वप्नयोः प्रवर्तन्ते, सुषुप्तिसमाधिशून्यचित्तवृत्ति—त्वावस्थासु निवर्तन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000378.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000379", "originalText": "प्रवृत्तिश्च द्विविधा, अनुकूला प्रतिकूला चेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000379.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000380", "originalText": "तत्र मूढो जागरणे प्रतिकूलप्रवृत्तिं द्वेष्टि, अनुकूलप्रवृत्तिमाकाङ्क्षति।", "padacchedaText": "", "audioFile": "PB_hear2read_000380.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000381", "originalText": "गुणातीतस्य त्वनुकूलप्रतिकूलाध्यासाभावाद् द्वेषाकाङ्क्षे न स्तः।", "padacchedaText": "", "audioFile": "PB_hear2read_000381.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000382", "originalText": "यथा द्वयोः कलहं कुर्वतोरवलोकयिता कश्चित्तटस्थः स्वयं केवलमुदास्ते, न तु जयपराजयाभ्यामि—तस्ततश्चाल्यते, तथा गुणातीतो विवेकी स्वयमुदास्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000382.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000383", "originalText": "गुणा गुणेषु वर्तन्ते, न त्वहमितिविवेकादौदा—सीन्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000383.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000384", "originalText": "अहमेव करोमीत्यध्यासो विचलनम्, न चास्य तदस्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000384.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000385", "originalText": "तदिदं किमाचार इत्यस्य प्रश्नस्योत्तरम्। समदुःखसुखादीनि लिङ्गान्यव्यभिचारिभक्तिसहितज्ञानध्यानाभ्यासेन परमात्मसेवा चेति गुणात्यय—साधनप्रश्नस्योत्तरम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_000385.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000386", "originalText": "ब्राह्मणो व्यासादिभिर्वर्णितः\n``अनुत्तरीयवसनमनुपस्तीर्णशायिनम्। बाहूपधायिनं शान्तं तं देवा ब्राह्मणं विदुः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000386.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000387", "originalText": "— (महाभारते शान्तिपर्वणिमोक्षधर्मे २६१.२९)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000387.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000388", "originalText": "ब्राह्मणशब्दो ब्रह्मविद्वाचीति ``अथ ब्राह्मणः'' इति श्रुत्या वर्णितम्, ब्रह्मविदश्च विद्वत्संन्यासाधिकारात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000388.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000389", "originalText": "``यथाजातरूपधरो'' (जाबालोपनिषदि ६), ``नाच्छादनं चरति परमहंसः'' (परमहंसोपनिषदि १—२) इत्यादि श्रुत्या परिग्रहराहित्यस्य मुख्यत्वाभिधानादनुत्तरीयत्वादिकं तस्य युक्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000389.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000390", "originalText": "``येन केनचिदाच्छन्नो येन केनचिदाशितः। यत्रक्वचनशायी स्यात्तं देवा ब्राह्मणं विदुः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000390.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000391", "originalText": "— (महाभारते ५.९७.१४)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000391.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000392", "originalText": "देहनिर्वाहायाशनाच्छादनशयनस्थानापेक्षायामप्यशनादिगतौ गुणदोषौ नान्विष्येते, उदरपूरणपुष्ट्यादि—रूपस्य निर्वाहस्य समत्वान्निष्प्रयोजनस्य गुणदोषविचारस्य चित्तदोषत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000392.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000393", "originalText": "अत एव भागवते पठ्यते—\n``किं वर्णितेन बहुना लक्षणं गुणदोषयोः। गुणदोषदृशिर्दोषो गुणस्तूभयवर्जितः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000393.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000394", "originalText": "इति। — (श्रीमद्भागवते ११.१९.४५)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000394.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000395", "originalText": "``कन्थाकौपीनवासास्तु दण्डधृग्ध्यानतत्परः। एकाकी रमते नित्यं तं देवा ब्राह्मणं विदुः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000395.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000396", "originalText": "— (विश्वेश्वरकृते यतिधर्मसङ्ग्रहे पृ० ३७)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000396.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000397", "originalText": "ब्रह्मोपदेशादिना प्राण्यनुजिघृक्षायामुत्तमत्त्वज्ञापनेन श्रद्धामुत्पादयितुं दण्डकौपीनादिलिङ्गं धारयेत्, ``कौपीनं दण्डमाच्छादनं च स्वशरीरोपभोगार्थाय लोकोपकारार्थाय च परिग्रहेत्'' (परम० उप०.१) इति श्रुतेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000397.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000398", "originalText": "अनुजिघृक्षयापि स्वयं तदीयां गृहकृत्यादिवार्तां न कुर्यात्, किं तु ध्यानपरो भवेत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000398.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000399", "originalText": "``तमेवैकं\nजानथ आत्मानमन्या वाचो विमुञ्चथ (मुण्डकोपनिषदि २.२.५) ``इति श्रुतेः,\n``तमेव धीरो विज्ञाय प्रज्ञां कुर्वीत ब्राह्मणः। नानुध्यायाद् बहूञ्शब्दान्वाचो विग्लापनं हि तत्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000399.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000400", "originalText": "— (बृहदारण्यके उप०.४.४.२१)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000400.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000401", "originalText": "इति श्रुतेश्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000401.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000402", "originalText": "ब्रह्मोपदेशस्त्वन्या वाङ् न भवतीति न ध्यानविरोधी।", "padacchedaText": "", "audioFile": "PB_hear2read_000402.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000403", "originalText": "तच्च ध्यानमेकाकित्वे निर्विघ्नं भवति अत एव स्मृत्यन्तरेऽभिहितं—\n``एको भिक्षुर्यथोक्तः स्याद्वावेव मिथुनं स्मृतम्। त्रयो ग्रामः समाख्यात ऊर्ध्वं तु नगरायते॥", "padacchedaText": "", "audioFile": "PB_hear2read_000403.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000404", "originalText": "नगरं हि कर्तव्यं ग्रामो वा मिथुनं तथा। राजादिवार्त्ता तेषां स्याद्भिक्षावार्त्ता परस्परम्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000404.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000405", "originalText": "इति। — (दक्षस्मृतौ ७.३५—३७)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000405.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000406", "originalText": "``निराशिषमनारम्भं निर्नमस्कारमस्तुतिम्। अक्षीणं क्षीणकर्माणं तं देवा ब्राह्मणं विदुः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000406.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000407", "originalText": "— (महाभारते मोक्षधर्मपर्वणि २३७.२४)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000407.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000408", "originalText": "विशिष्टैः संसारिभिः प्रणमतां पुरुषाणामाशीर्वादः प्रयुज्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000408.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000409", "originalText": "यस्य यदपेक्षितं तं तं प्रति तदभिवृद्धि—प्रार्थनमाशीः।", "padacchedaText": "", "audioFile": "PB_hear2read_000409.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000410", "originalText": "तथा च पुरुषाणां भिन्नरुचित्वात् तदभिमतान्वेषणे व्यग्रचित्तस्य लोकवासना वर्धते।", "padacchedaText": "", "audioFile": "PB_hear2read_000410.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000411", "originalText": "सा च ज्ञानविरोधिनी।", "padacchedaText": "", "audioFile": "PB_hear2read_000411.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000412", "originalText": "तथा च स्मृत्यन्तरं—\n``लोकवासनया जन्तोः शास्त्रवासनयापि च। देहवासनया ज्ञानं यथावन्नैव जायते''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000412.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000413", "originalText": "(मुक्तिकोपनिषदि २.२, सूतसंहितायां यज्ञवैभवखण्डे पूर्वार्धे १४.१५, विवेकचूड़ामणौ २०२)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000413.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000414", "originalText": "एतच्चारम्भनमस्कारादिष्वपि द्रष्टव्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000414.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000415", "originalText": "आरम्भः स्वार्थं परोपकारार्थं वा गृहक्षेत्रादिसम्पादनप्रयत्नः।", "padacchedaText": "", "audioFile": "PB_hear2read_000415.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000416", "originalText": "तावेतावाशीर्वादारम्भौ मुक्तेन त्याज्यौ।", "padacchedaText": "", "audioFile": "PB_hear2read_000416.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000417", "originalText": "न चाशीर्वादाभावे प्रणमतां नृणां खेदः शङ्कनीयः, लोकवासनाखेदयोरुभयोः परिहाराय निखिलाशीर्वादप्रतिनिधित्वेन नारायणशब्दप्रयोगात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000417.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000418", "originalText": "आरम्भस्तु\nसर्वोऽपि दुष्ट एव।", "padacchedaText": "", "audioFile": "PB_hear2read_000418.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000419", "originalText": "तथा च स्मृतिः—\n``सर्वारम्भा हि दोषेण धूमेनाग्निरिवावृताः''। — (श्रीमद्भगवद्गीतायां १८.४८) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000419.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000420", "originalText": "नमस्कारोऽपि विविदिषासंन्यासिनोऽभिहितः—\n``यो भवेत्पूर्वसंन्यासी तुल्यो वै धर्मतो यदि। तस्मै प्रणामः कर्तव्यो नेतराय कदाचन''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000420.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000421", "originalText": "— (याज्ञवल्क्य उप०.१) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000421.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000422", "originalText": "तत्र पूर्वत्वधर्मतुल्यत्वविचारे चित्तं विक्षिप्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000422.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000423", "originalText": "अत एव नमस्कारमात्र एव बहवः कलहायमाना उपलभ्यन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000423.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000424", "originalText": "तत्र निमित्तं वार्त्तिककारैर्दर्शितं—\n``प्रमादिनो बहिश्चित्ताः पिशुनाः कलहोत्सुकाः। संन्यासिनोऽपि दृश्यन्ते दैवसन्दूषिताशयाः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000424.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000425", "originalText": "— (बृहदारण्यकोपनिषद्वार्त्तिके १.४.१५८४) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000425.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000426", "originalText": "मुक्तस्य नमस्काराभावो भगवत्पादैर्दर्शितः—\n``नामादिभ्यः परे भूम्नि स्वाराज्ये चेत् स्थितोऽद्वये। प्रणमेत् कं तदात्मज्ञो न कार्यं कर्मणा तदा''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000426.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000427", "originalText": "— (उपदेशसाहस्यां १७.६४) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000427.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000428", "originalText": "चित्तकालुष्यहेतोर्नमस्कारस्य प्रतिषेधेऽपि सर्वसाम्यबुद्ध्या प्रसादहेतुर्नमस्कारोऽभ्युपेयते।", "padacchedaText": "", "audioFile": "PB_hear2read_000428.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000429", "originalText": "तथा च स्मृतिः—\n``ईश्वरो जीवकलया प्रविष्टो भगवानिति। प्रणमेद्दण्डवद्भूमावश्वचण्डालगोखरम्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000429.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000430", "originalText": "— (श्रीमद्भागवते ३.२९.३४—२, ११.२९.१६—२) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000430.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000431", "originalText": "स्तुतिर्मनुष्यविषया प्रतिषिध्यते, न त्वीश्वरविषया।", "padacchedaText": "", "audioFile": "PB_hear2read_000431.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000432", "originalText": "तथा च बृहस्पतिस्मृतिः—\n``आदरेण यथा स्तौति धनवन्तं धनेच्छया। तथा चेद् विश्वकर्तारं को न मुच्येत बन्धनात्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000432.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000433", "originalText": "इति। — (वराहोपनिषदि ३.१३, गरुडपुराणे २२५.५० च.)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000433.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000434", "originalText": "अक्षीणत्वमदीनत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000434.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000435", "originalText": "अत एव स्मृतिः—\n``अलब्ध्वा न विषादी स्यात्काले यद्यशनं क्वचित्। लब्ध्वा न हृष्येद्धृतिमानुभयं दैवतन्त्रितम्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000435.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000436", "originalText": "इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000436.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000437", "originalText": "क्षीणकर्मत्वं विधिनिषेधानधीनत्वं ``निस्त्रैगुण्ये पथि विचरतां को विधिः को निषेधः'' (शुकाष्टकः) इति स्मरणात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000437.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000438", "originalText": "एतदेवाभिप्रेत्य भगवताप्युक्तम्—\n``त्रैगुण्यविषया वेदा निस्त्रैगुण्यो भवार्जुन। निर्द्वन्द्वो नित्यसत्त्वस्थो निर्योगक्षेम आत्मवान्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000438.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000439", "originalText": "— (श्रीमद्भगवद्गीतायां २.४५) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000439.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000440", "originalText": "नारदः—\n``स्मर्तव्यः सततं विष्णुर्विस्मर्तव्यो न जातुचित्। सर्वे विधिनिषेधाः स्युरेतयोरेव किङ्कराः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000440.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000441", "originalText": "— (नारदपाञ्चरात्रे ४.२.२३) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000441.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000442", "originalText": "``अहेरिव गणाद्भीतः सम्मानान्मरणादिव। कुणपादिव यः स्त्रीभ्यस्तं देवा ब्राह्मणं विदुः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000442.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000443", "originalText": "— (महाभारते शान्तिपर्वणि मोक्ष० २३७.१३)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000443.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000444", "originalText": "``राजादिवार्त्ता तेषां स्यात्'' इत्युक्तत्वात् सर्पवद्गणाद्भीतिरुपपद्यते, सम्मानस्यासक्तिकारणतया पुरुषार्थविरोधित्वान्मरणवद्धेयत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000444.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000445", "originalText": "``नरकादिव'' इति वा पाठः।", "padacchedaText": "", "audioFile": "PB_hear2read_000445.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000446", "originalText": "अत एव स्मृतिः—\n``असम्मानात्तपोवृद्धिः सम्मानात्तु तपः क्षयः। अर्चितः पूजितो विप्रो दुग्धा गौरिव सीदति''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000446.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000447", "originalText": "— (पद्मपुराणे सृष्टिखण्डे १९.३४०)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000447.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000448", "originalText": "एतदेवाभिप्रेत्यावमान उपादेयतया स्मर्यते—\n``तथा चरेत वै योगी सतां धर्ममनुस्मरन्। जना यथावमन्येरन्गच्छेयुर्नैव सङ्गतिम्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000448.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000449", "originalText": "— (नारदपरिव्राजकोपनिषदि ५.३०) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000449.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000450", "originalText": "स्त्रीषु द्विविधो दोषः, प्रतिषिद्धत्वं जुगुप्सितत्वं चेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000450.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000451", "originalText": "तत्र प्रतिषिद्धत्वात्रं कदाचिद्रागात् प्रारब्धबलादुल्लङ्घ्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000451.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000452", "originalText": "तदेतदभिप्रेत्याह स्मृतिः\n``मात्रा स्वस्रा दुहित्रा वा नैकशय्यासनो भवेत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000452.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000453", "originalText": "बलवानिन्द्रियग्रामो विद्वांसमपि कर्षति''। — (मनु २.२१५)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000453.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000454", "originalText": "तथा च स्मृतिभिर्जुगुप्सा वर्णिता—\n``स्त्रीणामवाच्यदेशस्य क्लिन्ननाडीव्रणस्य च। अभेदेऽपि मनोभेदाज्जनः प्रायेण वञ्च्यते''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000454.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000455", "originalText": "— (ना. प. उप०.३.२९)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000455.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000456", "originalText": "``चर्मखण्डं द्विधा भिन्नमपानोद्गारधूपितम्। यद्रमन्ते नरास्तत्र साहसं किमतः परम्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000456.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000457", "originalText": "— (विश्वेश्वरकृते यतिधर्मसङ्ग्रहे, पृ० ९३)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000457.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000458", "originalText": "``ये रमन्ते नरास्तत्र क्रिमितुल्याः कथं न ते'' इति वा पाठः।", "padacchedaText": "", "audioFile": "PB_hear2read_000458.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000459", "originalText": "अतः प्रतिषेधजुगुप्सयोरुभयोर्विवक्षया कुणपदृष्टान्तोऽत्राभिहितः।", "padacchedaText": "", "audioFile": "PB_hear2read_000459.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000460", "originalText": "``येन पूर्णमिवाकाशं भवत्येकेन सर्वदा। शून्यं यस्य जनाकीर्णं तं देवा ब्राह्मणं विदुः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000460.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000461", "originalText": "— (महाभारते शान्तिपर्वणि मोक्षधर्मे २३७.११)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000461.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000462", "originalText": "संसारिणामेकाकित्वेनावस्थानं भयालस्यादिहेतुत्वाद्वर्ज्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000462.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000463", "originalText": "जनसमूहश्चातथाविधत्वादभ्युपेयः।", "padacchedaText": "", "audioFile": "PB_hear2read_000463.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000464", "originalText": "योगिनस्तु तद्विपरीतत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000464.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000465", "originalText": "एकाकित्वे सत्यविघ्नेन ध्यानानुवृत्तौ परिपूर्णेन परमानन्दात्मना सर्वमाकाशं पूर्णमिवावभासते।", "padacchedaText": "", "audioFile": "PB_hear2read_000465.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000466", "originalText": "अतो भयालस्यशोकमोहादयो न भवन्ति,\n``यस्मिन्सर्वाणि भूतानि आत्मैवाभूद् विजानतः।", "padacchedaText": "", "audioFile": "PB_hear2read_000466.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000467", "originalText": "तत्र को मोहः कः शोक एकत्वमनुपश्यतः''। — (ईश. उप०.७) इति श्रुतेः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000467.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000468", "originalText": "जनाकीर्णं स्थानं राजवार्त्तादिना ध्यानविरोधित्वादानन्दात्मप्रतीतिरहितं तच्छून्यमिव चित्तं क्लेशयति, जगतो मिथ्यात्वादात्मनः पूर्णत्वाच्चेत्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000468.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000469", "originalText": "अतिवर्णाश्रमी सूतसंहितायां मुक्तिखण्डे पञ्चमाध्याये विष्णु प्रति परमेश्वरेण वर्णितः—\n``ब्रह्मचारी गृहस्थश्च वानप्रस्थोऽथ भिक्षुकः। अतिवर्णाश्रमी तेऽपि क्रमाच्छ्रेष्ठा विचक्षणाः॥ ९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000469.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000470", "originalText": "``अतिवर्णाश्रमी प्रोक्तो गुरुः सर्वाधिकारिणाम्। न कस्यापि भवेच्छिष्यो यथाहं पुरुषोत्तम॥ १४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000470.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000471", "originalText": "``अतिवर्णाश्रमी साक्षाद् गुरूणां गुरुरुच्यते। तत्समो नाधिकश्चास्मिल्लोँकेऽस्त्येव न संशयः॥ १५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000471.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000472", "originalText": "``यः शरीरेन्द्रियादिभ्यो विभिन्नं सर्वसाक्षिणम्। पारमार्थिकविज्ञानं सुखात्मानं स्वयम्प्रभम्॥ १६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000472.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000473", "originalText": "परं तत्त्वं विजानाति सोऽतिवर्णाश्रमी भवेत्। ``यो वेदान्तमहावाक्यश्रवणेनैव केशव॥ १७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000473.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000474", "originalText": "आत्मानमीश्वरं वेद सोऽतिवर्णाश्रमी भवेत्। ``यो वर्णाश्रमनिर्मुक्तमवस्थात्रयसाक्षिणम्॥ १८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000474.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000475", "originalText": "महादेवं विजानाति सोऽतिवर्णाश्रमी भवेत्॥", "padacchedaText": "", "audioFile": "PB_hear2read_000475.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000476", "originalText": "``वर्णाश्रमादयो देहे मायया परिकल्पिताः॥ १९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000476.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000477", "originalText": "नात्मनो बोधरूपस्य मम ते सन्ति सर्वदा। इति यो वेद वेदान्तैः सोऽतिवर्णाश्रमी भवेत्॥ २०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000477.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000478", "originalText": "``आदित्यसन्निधौ लोकश्चेष्टते स्वयमेव तु। तथा मत्सन्निधानेन समस्तं चेष्टते जगत्॥ २१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000478.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000479", "originalText": "इति यो वेद वेदान्तैः सोऽतिवर्णाश्रमी भवेत्। ``सुवर्णे हारकेयूरकटकस्वस्तिकादयः॥ २२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000479.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000480", "originalText": "कल्पिता मायया तद्वज्जगन्मय्येव सर्वदा। इति यो वेद वेदान्तैः सोऽतिवर्णाश्रमी भवेत्॥ २३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000480.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000481", "originalText": "शुक्तिकायां यथा तारं कल्पितं मायया तथा। महदादि जगन्मायामयं मय्येव कल्पितम्॥ २४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000481.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000482", "originalText": "इति यो वेद वेदान्तैः सोऽतिवर्णाश्रमी भवेत्। ``चण्डालदेहे पश्वादिशरीरे ब्रह्मविग्रहे॥ २५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000482.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000483", "originalText": "अन्येषु तारतम्येन स्थितेषु पुरुषोत्तम। व्योमवत्सर्वदा व्याप्तः सर्वसम्बन्धवर्जितः॥ २६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000483.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000484", "originalText": "एकरूपो महादेवः स्थितः सोऽहं परामृतः। इति यो वेद वेदान्तैः सोऽतिवर्णाश्रमी भवेत्॥ २७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000484.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000485", "originalText": "``विनष्टदिग्भ्रमस्यापि यथापूर्वं विभाति दिक्। तथा विज्ञानविध्वस्तं जगन्मे भाति तन्न हि॥ २८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000485.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000486", "originalText": "इति यो वेद वेदान्तैः सोऽतिवर्णाश्रमी भवेत्। ``यथा स्वप्नप्रपञ्चोऽयं मयि मायाविजृम्भितः॥ २९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000486.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000487", "originalText": "तथा जाग्रत्प्रपञ्चोऽपि मयि मायाविजृम्भितः। इति यो वेद वेदान्तैः सोऽतिवर्णाश्रमी भवेत्॥ ३०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000487.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000488", "originalText": "``यस्य वर्णाश्रमाचारो गलितः स्वात्मदर्शनात्। स वर्णानाश्रमान्सर्वानतीत्य स्वात्मनि स्थितः॥ ३१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000488.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000489", "originalText": "``यस्त्यक्त्वा स्वाश्रमान्वर्णानात्मन्येव स्थितः पुमान्। सोऽतिवर्णाश्रमी प्रोक्तः सर्ववेदार्थवेदिभिः॥ ३२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000489.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000490", "originalText": "``न देहो नेन्द्रियं प्राणो न मनो बुद्ध्यहङ्कृती। न चित्तं नैव माया च न च व्योमादिकं जगत्॥ ३३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000490.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000491", "originalText": "न कर्ता नैव भोक्ता च न च भोजयिता तथा। केवलं चित्सदानन्दो ब्रह्मैवात्मा यथार्थतः॥ ३४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000491.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000492", "originalText": "``जलस्य चलनादेव चञ्चलत्वं यथा रवेः। तथाहङ्कारसंसर्गादेव संसार आत्मनः॥ ३५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000492.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000493", "originalText": "``तस्मादन्यगता वर्णा आश्रमा अपि केशव। आत्मन्यारोपिता एव भ्रान्त्या ते नात्मवेदिनः॥ ३६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000493.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000494", "originalText": "``न विधिर्न निषेधश्च न वर्ज्यावर्ज्यकल्पना। आत्मविज्ञानिनामस्ति तथा नान्यज्जनार्दन॥ ३७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000494.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000495", "originalText": "``स्वात्मविज्ञानिनां निष्ठामीदृशीमम्बुजेक्षण। मायया मोहिता मर्त्या नैव जानन्ति सर्वदा॥ ३८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000495.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000496", "originalText": "``न मांसचक्षुषा निष्ठा ब्रह्मविज्ञानिनामियम्। द्रष्टुं शक्या स्वतः सिद्धा विदुषां सैव केशव॥ ३९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000496.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000497", "originalText": "``यत्र सुप्ता जना नित्यं प्रबुद्धस्तत्र संयमी। प्रबुद्धा यत्र ते विद्वान्सुषुप्तस्तत्र केशव॥ ४०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000497.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000498", "originalText": "``एवमात्मानमद्वन्द्वं निराकारं निरञ्जनम्। नित्यशुद्धं निराभासं सच्चिन्मात्रं परामृतम्॥ ४१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000498.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000499", "originalText": "यो विजानाति वेदान्तैः स्वानुभूत्या च निश्चितम्। सोऽतिवर्णाश्रमी प्रोक्तः स एव गुरुरुत्तमः॥ ४२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000499.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000500", "originalText": "'' इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000500.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000501", "originalText": "तदेवं ``विमुक्तश्च विमुच्यत'' इत्यादिश्रुतयो जीवन्मुक्तस्थितप्रज्ञभगवद्भक्तगुणातीतब्राह्मणातिवर्णाश्रमि—प्रतिपादकस्मृतिवाक्यानि च जीवन्मुक्तिसद्भावे प्रमाणानीति स्थितम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000501.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000502", "originalText": "इति जीवन्मुक्तिप्रमाणानि॥ ५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000502.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000503", "originalText": "इति श्रीमद्विद्यारण्यप्रणीते जीवन्मुक्तिविवेके प्रथमं जीवन्मुक्तिप्रमाण प्रकरणम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_000503.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000504", "originalText": "२. वासनाक्षय नाम द्वितीयं प्रकरणम्\n\nअथ जीवन्मुक्तिसाधनं निरूपयामः।", "padacchedaText": "", "audioFile": "PB_hear2read_000504.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000505", "originalText": "तत्त्वज्ञानमनोनाशवासनाक्षयास्तत्साधनम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000505.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000506", "originalText": "अत एव वासिष्ठरामायण उपशमप्रकरणस्यावसाने ``जीवन्मुक्तशरीराणाम्'' (लघुयोगवासिष्ठे २८.१) इत्येतस्मिन्प्रस्तावे वसिष्ठ आह—\n``वासनाक्षयविज्ञानमनोनाशा महामते।", "padacchedaText": "", "audioFile": "PB_hear2read_000506.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000507", "originalText": "समकालं चिराभ्यस्ता भवन्ति फलदायिनः॥ ११६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000507.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000508", "originalText": "अन्वयमुक्त्वा व्यतिरेकमाह—\n``त्रय एते समं यावन्न स्वभ्यस्ता मुहुर्मुहुः। तावन्न पदसम्प्राप्तिर्भवत्यपि समाशतैः॥ ११५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000508.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000509", "originalText": "इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000509.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000510", "originalText": "समकालाभ्यासाभावे बाधकमाह—\n``एकैकशो निषेव्यन्ते यद्येते चिरयत्नतः। तन्न सिद्धिं प्रयच्छन्ति मन्त्राः सङ्कलिता इव''॥ ११७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000510.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000511", "originalText": "इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000511.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000512", "originalText": "यथा सन्ध्यावन्दनमार्जने सहविनियुक्तानां ``आपो हि ष्ठा'' (क्र. सं.१०.९.१) इत्यादीनां तिसृणामृचां मध्ये प्रतिदिनमेकैकस्या ऋचः पाठे शास्त्रीयानुष्ठानं न सिध्यति, यथा वा षडङ्गमन्त्राणामेकैकमन्त्रेण न सिद्धिः, यथा वा लोके शाकसूपौदनादीनामेकैकेन न भोजनसिद्धिः, तद्वत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000512.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000513", "originalText": "चिराभ्यासस्य प्रयोजनमाह—\n``त्रिभिरेतैश्चिराभ्यस्तैर्हृदयग्रन्थयो दृढाः। निःशङ्कमेव त्रुट्यन्ति बिच्छेदाद्गुणा इव''॥ ११८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000513.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000514", "originalText": "इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000514.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000515", "originalText": "तस्यैव व्यतिरेकमाह——\n``जन्मान्तरशताभ्यस्ता राम संसारसंस्थितिः। सा चिराभ्यासयोगेन विना न क्षीयते क्वचित् ``॥ ११९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000515.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000516", "originalText": "इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000516.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000517", "originalText": "न केवलमेकैकाभ्यासे फलाभावः, किं तु तत्स्वरूपमपि न सिध्यतीत्याह—\n``तत्त्वज्ञानं मनोनाशो वासनाक्षय एव च। मिथः कारणतां गत्वा दुःसाध्यानि स्थितानि हि''॥ ११३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000517.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000518", "originalText": "इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000518.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000519", "originalText": "त्रयाणामेतेषां मध्ये द्वयोर्द्वयोर्मेलनेन त्रीणि द्वन्द्वानि भवन्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000519.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000520", "originalText": "मनोनाशवासनाक्षयद्वन्द्वस्यान्योन्यकारणत्वं व्यतिरेकमुखेनाह—\n``यावद्विलीनं न मनो न तावद्वासनाक्षयः। न क्षीणा वासना यावत्तावच्चित्तं न शाम्यति''॥ ११०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000520.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000521", "originalText": "प्रदीपज्वालासन्तानवद्वृत्तिसन्तानरूपेण परिणममानमन्तःकरणद्रव्यं मननात्मकत्वान्मन इत्युच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000521.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000522", "originalText": "तस्य नाशो नाम वृत्तिरूपपरिणामं परित्यज्य निरुद्धत्वाकारेण परिणामः।", "padacchedaText": "", "audioFile": "PB_hear2read_000522.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000523", "originalText": "तथा च पतञ्जलिर्योगशास्त्रे सूत्रयामास—\n``व्युत्थाननिरोधसंस्कारयोरभिभवप्रादुर्भाव निरोधक्षणचित्तान्वयो निरोधपरिणामः'' (३.९) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000523.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000524", "originalText": "व्युत्थानसंस्कारा अभिभूयन्ते, निरोधसंस्काराः प्रादुर्भवन्ति, निरोधयुक्तः क्षणश्चित्तेनान्वीयते, सोऽयं मनोनाश इत्यवगन्तव्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000524.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000525", "originalText": "पूर्वापरपरामर्शमन्तरेण सहसोत्पद्यमानस्य क्रोधादिवृत्तिविशेषस्य हेतुश्चित्तगतः संस्कारो वासना, पूर्वपूर्वाभ्यासेन चित्ते वास्यमानत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000525.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000526", "originalText": "तस्याश्च वासनायाः क्षयो नाम विवेकजन्यायां शान्तिदान्त्यादिशुद्धवासनायां दृढायां सत्यपि बाह्यनिमित्ते क्रोधाद्यनुत्पत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000526.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000527", "originalText": "तत्र मनोनाशाभावे वृत्तिषूत्पद्यमानासु कदाचिद् बाह्यनिमित्तेन क्रोधाद्युत्पत्तेर्नास्ति वासनाक्षयः।", "padacchedaText": "", "audioFile": "PB_hear2read_000527.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000528", "originalText": "अक्षीणायां तु वासनायां तथैव वृत्युत्पादनान्नास्ति मनोनाशः।", "padacchedaText": "", "audioFile": "PB_hear2read_000528.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000529", "originalText": "तत्त्वज्ञानमनोनाशयोः परस्परकारणत्वं व्यतिरेकमुखेणाह—\n``यावन्न तत्त्वविज्ञानं तावच्चित्तशमः कुतः। यावन्न चित्तोपशमो न तावत् तत्त्ववेदनम्''॥ १११॥", "padacchedaText": "", "audioFile": "PB_hear2read_000529.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000530", "originalText": "इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000530.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000531", "originalText": "``इदं सर्वमात्मैव, प्रतीयमानं तु रूपरसादिकं जगन्मायामयं न त्वेतद्वस्तुतोऽस्ति'' इति निश्चयस्तत्त्वज्ञानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000531.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000532", "originalText": "तस्यानुत्पत्तौ रूपरसादिविषयाणां सद्भावे सति तद्गोचराश्चित्तवृत्तयो न निवारयितुं शक्यन्ते यथा प्रक्षिप्यमाणेष्विन्धनादिषु वह्निज्वाला न निवार्यते तद्वत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000532.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000533", "originalText": "असति चित्तोपशमे वृत्तिभिर्गृह्यमाणेषु रूपादिषु\n``नेह नानास्ति किञ्चन'' (कठ. उप०.४.११) इति श्रुतेः ``यजमानः प्रस्तरः'' (तै० ब्रा० ३.९.२.३) इत्यादेरिव प्रत्यक्षविरोधशङ्कया ``ब्रह्माद्वितीयम्'' इत्येतादृशस्तत्त्वनिश्चयो नोदियात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000533.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000534", "originalText": "वासनाक्षयतत्त्वज्ञानयोः परस्परकारणत्वं व्यतिरेकमुखेनाह—\n``यावन्न वासनानाशस्तावत्तत्त्वागमः कुतः। यावन्न तत्त्वसम्प्राप्तिर्न तावद्वासनाक्षयः''॥ ११२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000534.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000535", "originalText": "इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000535.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000536", "originalText": "क्रोधादिवासनास्वनष्टासु शमदमादिसाधनाभावान्न तत्त्वज्ञानमुदेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000536.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000537", "originalText": "अज्ञाते चाद्वितीयब्रह्मतत्त्वे क्रोधादिनिमित्तस्य सत्यत्वभ्रमानपायान्न वासना क्षीयते।", "padacchedaText": "", "audioFile": "PB_hear2read_000537.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000538", "originalText": "यथोक्तानां त्रयाणां द्वन्द्वानामन्योन्यकारणत्वमन्वयमुखेन वयमुदाहरामः।", "padacchedaText": "", "audioFile": "PB_hear2read_000538.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000539", "originalText": "मनसि नष्टे सति संस्कारोद्बोधकस्य बाह्यनिमित्तस्याप्रतीतौ वासना क्षीयते, क्षीणायां च वासनायां हेत्वभावेन क्रोधादिवृत्यनुदयान्मनो नश्यति।", "padacchedaText": "", "audioFile": "PB_hear2read_000539.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000540", "originalText": "तदिदं मनोनाशवासनाक्षयद्वन्द्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000540.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000541", "originalText": "``दृश्यते त्वग्ग्रया बुद्ध्या'' (कठोप० १.३.१२) इति श्रुतेरात्मैक्याभिमुखवृत्तेर्दर्शनहेतुत्वादितरकृत्स्नवृत्ति—नाशस्य तत्त्वज्ञानहेतुत्वमवगम्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000541.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000542", "originalText": "सति च तत्त्वज्ञाने, मिथ्याभूते जगति नरविषाणादाविव धीवृत्त्यनुदयादात्मनश्च दृष्टत्वेन पुनर्वृत्त्यनुपयोगान्निरिन्धनाग्निवन्मनो नश्यति।", "padacchedaText": "", "audioFile": "PB_hear2read_000542.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000543", "originalText": "तदिदं मनोनाशतत्त्वज्ञानयोर्द्वन्द्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000543.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000544", "originalText": "तत्त्वज्ञानस्य क्रोधादिवासनाक्षयहेतुतां वार्त्तिककार आह—\n``रिपौ बन्धौ स्वदेहे च समैकात्म्यं प्रपश्यतः। विवेकिनः कुतः कोपः स्वदेहावयवेष्विव''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000544.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000545", "originalText": "— (नैष्कर्म्यसिद्धौ २.१८) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000545.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000546", "originalText": "क्रोधादिवासनाक्षयरूपस्य शमादेर्ज्ञानहेतुत्वं प्रसिद्धम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000546.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000547", "originalText": "वसिष्ठोऽपि—\n``गुणाः शमादयो ज्ञानाच्छमादिभ्यस्तथा ज्ञता। परस्परं विवर्धेते द्वे पद्मसरसी इव''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000547.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000548", "originalText": "— (लघुयोगवासिष्ठे ४.१०७) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000548.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000549", "originalText": "तदिदं वासनाक्षयतत्त्वज्ञानयोर्द्वन्द्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000549.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000550", "originalText": "तत्त्वज्ञानादीनां त्रयाणां सम्पादने साधनमाह—\n``तस्माद्राघव यत्नेन पौरुषेण विवेकिना। भोगेच्छां दूरतस्त्यक्त्वा त्रयमेतत्समाश्रयेत्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000550.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000551", "originalText": "इति। — (लघुयोगवासिष्ठे ४.११४) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000551.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000552", "originalText": "पौरुषो यत्नः केनाप्युपायेनावश्यं सम्पादयिष्यामीत्येवंविधोत्साहरूपो निर्बन्धः।", "padacchedaText": "", "audioFile": "PB_hear2read_000552.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000553", "originalText": "विवेको नाम विभज्यनिश्चयः— तत्त्वज्ञानस्य श्रवणादिकं साधनम्, मनोनाशस्य योगः, वासनाक्षयस्य प्रतिकूलवासनोत्पादनमिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000553.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000554", "originalText": "भोगेच्छायाः स्वल्पाया अप्यभ्युपगमे ``हविषा कृष्णवर्त्मेव भूय एवाभिवर्धते'' (मनु० २.९४) इति न्यायेनातिप्रसङ्गस्यदुर्वारत्वाद्दूरत इत्युक्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000554.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000555", "originalText": "ननु पूर्वत्र विविदिषासंन्यासस्य तत्त्वज्ञानं फलं विद्वत्सन्न्यासस्य जीवन्मुक्तिरिति व्यवस्था वर्णिता, तथा च सति प्रथमतस्तत्त्वज्ञानं सम्पाद्य पश्चाद्विद्वत्सन्न्यासं कृत्वा जीवतः स्वस्य बन्धरूपयोर्वासनामनोवृत्त्योर्विनाशः सम्पादनीय इति प्रतिभाति, अत्र तु तत्त्वज्ञानादीनां सहैवाभ्यासो नियम्यते, अतः पूर्वोत्तरविरोध इति चेत्,\nनायं दोषः, प्रधानोपसर्जनभावेन व्यवस्थोपपत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000555.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000556", "originalText": "विविदिषासंन्यासिनस्तत्त्वज्ञानं प्रधानम्, मनोनाशवासनाक्षयावुपसर्जनीभूतौ, विद्वत्सन्न्यासिनस्तु तद्वैपरीत्यम्, अतः सहाभ्यास उभयत्राप्यविरुद्धः।", "padacchedaText": "", "audioFile": "PB_hear2read_000556.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000557", "originalText": "न च तत्त्वज्ञानोत्पत्तिमात्रेण कृतार्थस्य किमुत्तरकालीनेनाभ्यासप्रयासेनेति शङ्कनीयम्, जीवन्मुक्ति—प्रयोजननिरूपणेन परिहरिष्यमाणत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000557.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000558", "originalText": "ननु विद्वत्संन्यासिनो वेदनसाधनश्रवणाद्यनुष्ठानवैफल्याद्वेदनस्य च स्वरूपेण कर्तुमकर्तुमन्यथा वा कर्तुमशक्यस्याननुष्ठेयत्वादुपसर्जनत्वेऽप्युत्तरकालीनोऽभ्यासः कीदृश इति चेत्,\nकैनापि द्वारेण पुनः पुनस्तत्त्वानुस्मरणमिति ब्रूमः।", "padacchedaText": "", "audioFile": "PB_hear2read_000558.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000559", "originalText": "तादृशश्चाभ्यासो लीलोपाख्याने (लघुयोगवासिष्ठे ६) दर्शितः—\n``तच्चिन्तनं तत्कथनमन्योन्यं तत्प्रबोधनम्। एतदेकपरत्वं च ज्ञानाभ्यासं विदुर्बुधाः॥ १०८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000559.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000560", "originalText": "``सर्गादावेव नोत्पन्नं दृश्यं नास्त्येव तत्सदा। इदं जगदहं चेति बोधाभ्यासं विदुः परे''॥ १११॥", "padacchedaText": "", "audioFile": "PB_hear2read_000560.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000561", "originalText": "मनोनाशवासनाक्षयाभ्यासावपि तत्रैव दर्शितौ—\n``अत्यन्ताभावसम्पत्तौ ज्ञातुर्ज्ञेयस्य वस्तुनः। युक्त्या शास्त्रैर्यतन्ते ये ते तत्राभ्यासिनः स्थिताः''॥ ११०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000561.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000562", "originalText": "इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000562.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000563", "originalText": "ज्ञातृज्ञेययोर्मिथ्यात्वधीरभावसम्पत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000563.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000564", "originalText": "स्वरूपेणाप्यप्रतीतिरत्यन्ताभावसम्पत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000564.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000565", "originalText": "युक्तिर्योगः।", "padacchedaText": "", "audioFile": "PB_hear2read_000565.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000566", "originalText": "सोऽयं मनोनाशाभ्यासः।", "padacchedaText": "", "audioFile": "PB_hear2read_000566.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000567", "originalText": "``दृश्यासम्भवबोधेन रागद्वेषादितानवे। रतिर्नवोदिता यासौ ब्रह्माभ्यासः स उच्यते''॥ ११२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000567.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000568", "originalText": "इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000568.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000569", "originalText": "सोऽयं वासनाक्षयाभ्यासः।", "padacchedaText": "", "audioFile": "PB_hear2read_000569.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000570", "originalText": "तेष्वेतेषु त्रिष्वभ्यासेषु सामान्येन प्रतीयमानेषु प्रधानोपसर्जनभावो न विवेक्तुं शक्यत इति चेत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000570.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000571", "originalText": "मैवम्, प्रयोजनानुसारेण विवेक्तुं शक्यत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000571.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000572", "originalText": "मुमुक्षोः पुरुषस्य जीवन्मुक्तिर्विदेहमुक्तिश्चेति प्रयोजनद्वयम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000572.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000573", "originalText": "अत एव ``विमुक्तश्च विमुच्यते'' (कठ उप०.२.२.१) इति श्रूयते।", "padacchedaText": "", "audioFile": "PB_hear2read_000573.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000574", "originalText": "तत्र जीवतः पुरुषस्य दैवसम्पदा मोक्षः, आसुरसम्पदा बन्धः। एतच्च षोडशाध्याये भगवताभिहितं— ``दैवी सम्पद्विमोक्षाय निबन्धायासुरी मता''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000574.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000575", "originalText": "(श्रीमद्भगवद्गीतायां १६.५) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000575.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000576", "originalText": "तेच सम्पदौ तत्रैवाभिहिते—\n``अभयं सत्त्वसंशुद्धिर्ज्ञानयोगव्यवस्थितिः। दानं दमश्च यज्ञश्च स्वाध्यायस्तप आर्जवम्॥ १॥", "padacchedaText": "", "audioFile": "PB_hear2read_000576.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000577", "originalText": "``अहिंसा सत्यमक्रोधस्त्यागः शान्तिरपैशुनम्। दया भूतेष्वलोलुप्त्वं मार्दवं ह्रीरचापलम्॥ २॥", "padacchedaText": "", "audioFile": "PB_hear2read_000577.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000578", "originalText": "``तेजः क्षमा धृतिः शौचमद्रोहो नातिमानिता। भवन्ति सम्पदं दैवीमभिजातस्य भारत॥ ३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000578.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000579", "originalText": "``दम्भो दर्पोभिमानश्च क्रोधः पारुष्यमेव च। अज्ञानं चाभिजातस्य पार्थ सम्पदमासुरीम्''॥ ४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000579.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000580", "originalText": "इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000580.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000581", "originalText": "पुनरप्याध्यायपरिसमाप्तेरासुरसम्पत्प्रपञ्चिता।", "padacchedaText": "", "audioFile": "PB_hear2read_000581.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000582", "originalText": "तत्राशास्त्रीयायाः स्वभावसिद्धाया आसुरसम्पदो दुर्वासनायाः शास्त्रीयया पुरुषप्रयत्नसाध्यया दैवसम्पदा सद्वासनया क्षये सति जीवन्मुक्तिर्भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_000582.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000583", "originalText": "वासनाक्षयवन्मनोनाशस्यापि जीवन्मुक्तिहेतुत्वं श्रूयते।", "padacchedaText": "", "audioFile": "PB_hear2read_000583.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000584", "originalText": "``मन एव मनुष्याणां कारणं बन्धमोक्षयोः। बन्धाय विषयासक्तं मुक्त्यै निर्विषयं स्मृतम्॥ २॥", "padacchedaText": "", "audioFile": "PB_hear2read_000584.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000585", "originalText": "``यतो निर्विषयस्यास्य मनसो मुक्तिरिष्यते। अतो निर्विषयं नित्यं मनः कार्यं मुमुक्षुणा॥ ३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000585.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000586", "originalText": "``निरस्तविषयासङ्गं सन्निरुद्धं मनो हृदि। या यात्युन्मनीभावं तदा तत्परमं पदम्॥ ४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000586.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000587", "originalText": "``तावदेव निरोद्धव्यं यावद् हृदि गतं क्षयम्। एतज्ज्ञानं च मोक्षश्च शेषो ग्रन्थस्य विस्तरः''॥ ५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000587.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000588", "originalText": "इति। — (अमृतबिन्दूपनिषदि २—५)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000588.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000589", "originalText": "बन्धो द्विविधः तीव्रो मृदुश्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000589.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000590", "originalText": "तत्राऽसुरसम्पत्साक्षादेव क्लेशहेतुत्वात् तीव्रो बन्धः।", "padacchedaText": "", "audioFile": "PB_hear2read_000590.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000591", "originalText": "द्वैतमात्रप्रतीतिस्तु स्वयमक्लेशरूपत्वादासुरसम्पदुत्पादकत्वाच्च मृदुर्बन्धः।", "padacchedaText": "", "audioFile": "PB_hear2read_000591.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000592", "originalText": "तत्र वासनाक्षयेण तीव्रबन्ध एव निवर्तते (निवर्त्यते इति वा पाठः)।", "padacchedaText": "", "audioFile": "PB_hear2read_000592.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000593", "originalText": "मनोनाशेन तूभयम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000593.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000594", "originalText": "तर्हि मनोनाशेनैवालं वासनाक्षयस्तु निरर्थक इति चेन्न, भोगहेतुना प्रबलेन प्रारब्धेन व्युत्थापिते मनसि वासनाक्षयस्य तीव्रबन्धनिवारणार्थत्वात्, भोगस्य मृदुबन्धेनाप्युपपत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000594.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000595", "originalText": "तामसवृत्तयस्तीव्रबन्धः।", "padacchedaText": "", "audioFile": "PB_hear2read_000595.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000596", "originalText": "सात्त्विकराजसवृत्तिद्वयं मृदुबन्धः।", "padacchedaText": "", "audioFile": "PB_hear2read_000596.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000597", "originalText": "एतच्च ``दुःखेष्वनुद्विग्नमनाः सुखेषु विगतस्पृहः'' (श्रीमद्भगवद्गीतायां २.५६) इत्यत्र स्पष्टीकृतम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000597.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000598", "originalText": "एवं च सति मृदुबन्धस्याभ्युपेयत्वात् तीव्रबन्धस्य वासनाक्षयेणैव निवृत्तेरनर्थको मनोनाश इति चेत्,\nन, दुर्बलप्रारब्धापादितानामवश्यम्भाविभोगानां प्रतीकारार्थत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000598.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000599", "originalText": "तादृग्भोगस्य प्रतीकारनिवर्त्यत्वम—भिप्रेत्येदमाहुः—\n``अवश्यम्भाविभोगानां प्रतीकारो भवेद्यदि।", "padacchedaText": "", "audioFile": "PB_hear2read_000599.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000600", "originalText": "तदा दुःखैर्न लिप्येरन्नलरामयुधिष्ठिराः''। — (पञ्चदश्यां ७.१५६) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000600.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000601", "originalText": "तदेवं जीवन्मुक्तिं प्रति वासनाक्षयमनोनाशयोः साक्षात्साधनत्वाद् प्राधान्यम्, तत्त्वज्ञानं तूभयोत्पादनेन व्यवहितत्वादुपसर्जनम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000601.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000602", "originalText": "तत्त्वज्ञानस्य वासनाक्षयहेतुत्वं बहुशः श्रुतौ श्रूयते—\n``ज्ञात्वा देवं सर्वपाशापहानिः ``(श्वे० उप० १.१.११),\n``अध्यात्मयोगाधिगमेन देवं मत्वा धीरो हर्षशोकौ जहाति''।", "padacchedaText": "", "audioFile": "PB_hear2read_000602.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000603", "originalText": "(कठ. उप० १.२.१२)।", "padacchedaText": "", "audioFile": "PB_hear2read_000603.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000604", "originalText": "``तरति शोकमात्मवित्'' (छान्दोग्य उप०.७.१.३),\n``तत्र को मोहः कः शोक एकत्वमनुपश्यतः'' (ईश उप०.७),\n``ज्ञात्वा देवं मुच्यते सर्वपाशैः'' (श्वे. उप०.१.१.८) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000604.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000605", "originalText": "मनोनाशहेतुत्वं च तत्त्वज्ञानस्य श्रुतिसिद्धम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000605.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000606", "originalText": "विद्यादशामभिप्रेत्येदं श्रूयते— ``यत्र त्वस्य सर्वमात्मैवाभूत् तत्केन कं पश्येत् केन कं जिघ्रेत्'' (बृह. उप०.४.५.१५) इत्यादि।", "padacchedaText": "", "audioFile": "PB_hear2read_000606.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000607", "originalText": "गौडपादाचार्याश्चाहुः\n``आत्मतत्त्वानुबोधेन न सङ्कल्पयते यदा। अमनस्तां तदा याति ग्राह्याभावे तदग्रहः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000607.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000608", "originalText": "— (माण्डूक्यकारिकायां ३.३२) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000608.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000609", "originalText": "(आत्मतत्त्वानुबोधेन— आचार्यपादेन शङ्करभगवता आत्मसत्यानुबोधेन इति पाठो गृहीतः)\nजीवन्मुक्तेर्वासनाक्षयमनोनाशाविव विदेहमुक्तेः साक्षात्साधनत्वाज्ज्ञानं प्रधानम्, ``ज्ञानादेव तु कैवल्यं प्राप्यते येन मुच्यते'' इति स्मृतेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000609.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000610", "originalText": "केवलस्यात्मनो भावः कैवल्यं देहादिरहितत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000610.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000611", "originalText": "तच्च ज्ञानादेव प्राप्यते, सदेहत्वस्याज्ञानकल्पितत्वेन ज्ञानैकनिवर्त्यत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000611.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000612", "originalText": "ज्ञानादेवेत्येवकारेण कर्मव्यावृत्तिः ``न कर्मणा न प्रजया धनेन'' (कैवल्योपनिषदि २, तैत्तिरीयारण्यके १०.१०.२१) इति श्रुतेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000612.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000613", "originalText": "यस्तु ज्ञानशास्त्रमनभ्यस्य यथासम्भवं वासनाक्षयमनोनाशावभ्यस्य सगुणं ब्रह्मोपास्ते न तस्य कैवल्यमस्ति, लिङ्गदेहस्यानपायात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000613.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000614", "originalText": "अत एवकारेण तावपि व्यावर्त्येते।", "padacchedaText": "", "audioFile": "PB_hear2read_000614.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000615", "originalText": "येन मुच्यत इत्यस्यायमर्थः— येन ज्ञानप्रापितकेवलत्वेन कृत्स्नबन्धाद्विमुच्यत इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000615.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000616", "originalText": "बन्धश्चानेकविधः—अविद्याग्रन्थिः, अब्रह्मत्वम्, हृदयग्रन्थिः, संशयः, कर्माणि, असर्वकामत्वम्, मृत्युः, पुनर्जन्मेत्यादिशब्दैस्तत्र तत्र व्यवहारात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000616.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000617", "originalText": "त एते बन्धाः सर्वेऽपि ज्ञाननिवर्त्याः।", "padacchedaText": "", "audioFile": "PB_hear2read_000617.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000618", "originalText": "तथा च श्रुतयः—\n``एतद्यो वेद निहितं गुहायां सोऽविद्याग्रन्थिं विकिरतीह सोम्य'' (मुण्डक उप०.२.१.१०)।", "padacchedaText": "", "audioFile": "PB_hear2read_000618.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000619", "originalText": "``ब्रह्म वेद ब्रह्मैव भवति'' (मुण्डक उप० ३.२.९)।", "padacchedaText": "", "audioFile": "PB_hear2read_000619.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000620", "originalText": "``भिद्यते हृदयग्रन्थिश्छिद्यन्ते सर्वसंशयाः। क्षीयन्ते चास्य कर्माणि तस्मिन्दृष्टे परावरे''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000620.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000621", "originalText": "— (मुण्डक उप० २.२.८)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000621.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000622", "originalText": "``यो वेद निहितं गुहायां परमे व्योमन् सोऽश्नुते सर्वान्कामान्सह'' (तै० उप०२.१),\n``तमेव विदित्वातिमृत्युमेति'' (श्वे.उप.३.८)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000622.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000623", "originalText": "``यस्तु विज्ञानवान् भवति समनस्कः सदा शुचिः। स तु तत्पदमाप्नोति यस्माद्भूयो न जायते''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000623.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000624", "originalText": "— (कठ उप० १.३.८)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000624.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000625", "originalText": "``य एवं वेदाहं ब्रह्मास्मीति स इदं सर्वं भवति'' (बृ० उप० १.४.१०)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000625.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000626", "originalText": "इत्यादीन्यसर्वज्ञत्वादिबन्धनिवृत्तिपराणि वाक्यान्यत्रोदाहरणीयानि।", "padacchedaText": "", "audioFile": "PB_hear2read_000626.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000627", "originalText": "सेयं विदेहमुक्तिर्ज्ञानोत्पत्ति—समकालीना ज्ञेया, ब्रह्मण्यविद्यारोपितानामेतेषां बन्धानां विद्यया विनाशे सति पुनरुत्पत्त्यसम्भवादन—नुभवाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000627.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000628", "originalText": "तदेतद्विद्यासमकालीनत्वं भाष्यकारः समन्वयसूत्रे (ब्रह्मसूत्रे १.१.४) प्रपञ्चयामासः, ``तदधिगम उत्तरपूर्वाघयोरश्लेषविनाशौ तद्व्यपदेशात्'' (ब्रह्मसूत्रे ४.१.१३) इत्यत्र च।", "padacchedaText": "", "audioFile": "PB_hear2read_000628.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000629", "originalText": "ननु वर्तमानदेहपातानन्तरभाविनी विदेहमुक्तिरिति बहवो वर्णयन्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000629.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000630", "originalText": "तथा च श्रुतिः— ``तस्य तावदेव चिरं यावन्न विमोक्ष्येऽथ सम्पत्स्ये'' (छा० उप० ६.१४.२) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000630.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000631", "originalText": "वाक्यवृत्तावप्युक्तम्—\n``प्रारब्धकर्मवेगेन जीवन्मुक्तो यदा भवेत्। कञ्चित्कालमनारब्धकर्मबन्धस्य सङ्क्षये॥ ५२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000631.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000632", "originalText": "निरस्तातिशयानन्दं वैष्णवं परमं पदम्। पुनरावृत्तिरहितं कैवल्यं प्रतिपद्यते॥ ५३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000632.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000633", "originalText": "इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000633.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000634", "originalText": "सूत्रकारोऽप्याह— ``भोगेन त्वितरे क्षपयित्वा सम्पद्यते (ब्रह्मसूत्रे ४.१.१९) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000634.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000635", "originalText": "इतरे प्रारब्धपुण्यपापे।", "padacchedaText": "", "audioFile": "PB_hear2read_000635.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000636", "originalText": "वसिष्ठोऽप्याह—\n``जीवन्मुक्तपदं त्यक्त्वा स्वदेहे कालसात्कृते। विशत्यदेहमुक्तत्वं पवनोऽस्पन्दतामिव''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000636.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000637", "originalText": "— (ल० वा० ५.९८) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000637.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000638", "originalText": "नायं दोषः, विवक्षाविशेषेण मतद्वयस्याविरोधात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000638.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000639", "originalText": "विदेहमुक्तिरित्यत्रत्येन देहशब्देन कृत्स्नं देहजातं विवक्षित्वा बहुभिर्वर्णितम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000639.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000640", "originalText": "अस्माभिस्तु भाविदेहमात्रविवक्षयोच्यते, तदनारम्भायैव ज्ञानसम्पादनात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000640.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000641", "originalText": "अयं तु देहः पूर्वमेवारब्धः, अतो ज्ञानेनापि नास्यारम्भो वारयितुं शक्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000641.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000642", "originalText": "एतद्देहनिवृत्तिरपि न ज्ञानफलम्, अज्ञानिनामप्यारब्धकर्मक्षये तन्निवृत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000642.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000643", "originalText": "तर्हि वर्तमानलिङ्गदेहनिवृत्तिर्ज्ञानफलमस्तु, ज्ञानमन्तरेण तदनिवृत्तेरिति चेत्,\nन, सत्यपि ज्ञाने जीवन्मुक्तेस्तन्निवृत्त्यभावात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000643.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000644", "originalText": "ननु ज्ञानस्य कञ्चित्कालं प्रारब्धेन कर्मणा प्रतिबन्धेनानिवर्तकत्वेऽपि प्रतिबन्धक्षये लिङ्गदेह—निवर्तकत्वं भविष्यतीति चेत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000644.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000645", "originalText": "न, पञ्चपादिकाचार्येण ``यतो ज्ञानमज्ञानस्यैव निवर्तकम्'' इत्युपपादितत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000645.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000646", "originalText": "तर्हि लिङ्गदेहनिवृत्तेः किं साधनमिति चेत्, सामग्रीनिवृत्तिरिति ब्रूमः।", "padacchedaText": "", "audioFile": "PB_hear2read_000646.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000647", "originalText": "द्विविधं हि कार्यनिवर्तकम्, विरोधिसद्भावः सामग्रीनिवृत्तिश्चेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000647.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000648", "originalText": "तद्यथा विरोधिना वायुना तैलवर्त्तिसामग्रीनिवृत्त्या वा दीपो निवर्तते।", "padacchedaText": "", "audioFile": "PB_hear2read_000648.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000649", "originalText": "लिङ्गदेहस्य साक्षाद्विरोधिनं न पश्यामः।", "padacchedaText": "", "audioFile": "PB_hear2read_000649.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000650", "originalText": "सामग्री हि द्विविधा प्रारब्धमनारब्धं चेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000650.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000651", "originalText": "ताभ्यामुभाभ्यामज्ञानिनां लिङ्गदेह इहामुत्र चावतिष्ठते।", "padacchedaText": "", "audioFile": "PB_hear2read_000651.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000652", "originalText": "ज्ञानिनां त्वनारब्धस्य ज्ञानेन निवृत्तेः प्रारब्धस्य च भोगेन निवृत्तेः,\nतैलवर्तिरहितदीपवत्सामग्रीनिवृत्त्या लिङ्गदेहो निवर्तते।", "padacchedaText": "", "audioFile": "PB_hear2read_000652.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000653", "originalText": "अतो न तन्निवृत्तिर्ज्ञानफलम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000653.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000654", "originalText": "नन्वनेन न्यायेन भाविदेहानारम्भोऽपि न ज्ञानफलम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000654.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000655", "originalText": "तथा हि—किमनारम्भ एव फलम्, किं वा तत्परिपालनं? नाद्यः, तस्य प्रागभावरूपत्वेनानादिसिद्धत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000655.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000656", "originalText": "न द्वितीयः, अनारब्धकर्मरूपसामग्रीनिवृत्त्यैव भाविदेहारम्भप्रागभावपरिपालनसिद्धेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000656.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000657", "originalText": "न च तन्निवृत्तिः फलम्, अविद्यानिवृत्तेरेव विद्याफलत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000657.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000658", "originalText": "नैष दोषः, भाविजन्मानारम्भादीनां विद्याफलत्वस्य प्रामाणिकत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000658.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000659", "originalText": "``यस्माद्भूयो न जायते'' (कठ उप०.१.३.८) इत्याद्युदाहृताः श्रुतयस्तत्र प्रमाणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000659.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000660", "originalText": "न च ज्ञानमज्ञानस्यैव निवर्तकमिति न्यायेन विरोधः।", "padacchedaText": "", "audioFile": "PB_hear2read_000660.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000661", "originalText": "अज्ञानसहभावनियतानामब्रह्मत्वादीनामज्ञानशब्देन पञ्चपादिकाचार्यैर्विवक्षितत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000661.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000662", "originalText": "अन्यथानुभव—विरोधः।", "padacchedaText": "", "audioFile": "PB_hear2read_000662.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000663", "originalText": "अनुभूयते ह्यज्ञाननिवृत्तिवदब्रह्मत्वादिनिवृत्तिरपि।", "padacchedaText": "", "audioFile": "PB_hear2read_000663.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000664", "originalText": "तस्माद्भाविदेहराहित्यलक्षणा विदेह—मुक्तिर्ज्ञानसमकालीना।", "padacchedaText": "", "audioFile": "PB_hear2read_000664.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000665", "originalText": "तथा च याज्ञवल्क्यवचनं श्रूयते— ``अभयं वै जनक प्राप्तोऽसि'' (बृ० उप० ४.२.४) इति, ``एतावदरे खल्वमृतत्वम्'' (बृ० उप० ४.५.१५) इति च।", "padacchedaText": "", "audioFile": "PB_hear2read_000665.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000666", "originalText": "श्रुत्यन्तरेऽपि ``तमेवं विद्वानमृत इह भवति'' (नृ० पूर्वतापनी उप० १.६, पुरुषसूक्ते ऋ० सं० १०.९०.१२) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000666.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000667", "originalText": "यद्युत्पन्नेऽपि तत्त्वज्ञाने तत्फलभूता विदेहमुक्तिस्तदानीं न भवेत्, कालान्तरे च भवेत्, तदा ज्योतिष्टोमादाविव ज्ञानजन्यमपूर्वं किञ्चित्कल्प्येत, तथा च कर्मशास्त्र एव ज्ञानशास्त्रमन्तर्भवेत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000667.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000668", "originalText": "अथोच्यते मन्त्रादिप्रतिबद्धाग्नि—वत्प्रारब्धप्रतिबद्धं ज्ञानं कालान्तरे विदेहमुक्तिं दास्यतीति।", "padacchedaText": "", "audioFile": "PB_hear2read_000668.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000669", "originalText": "मैवम्, अविरोधात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000669.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000670", "originalText": "न ह्यस्मदभिमता भाविदेहात्यन्ताभावलक्षणा विदेहमुक्तिर्वर्तमानदेहमात्रस्थापकेन प्रारब्धेन विरुध्यते, येन प्रतिबध्येत।", "padacchedaText": "", "audioFile": "PB_hear2read_000670.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000671", "originalText": "किञ्च क्षणिकत्वेन कालान्तरे स्वयमविद्यमानं ज्ञानं कथं मुक्तिं दद्यात्? ज्ञानान्तरं चरमसाक्षात्कार—लक्षणमुत्पस्यत इति चेन्न, साधनाभावात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000671.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000672", "originalText": "प्रतिबन्धकप्रारब्धनिवृत्त्यैव सह गुरुशास्त्रदेहेन्द्रियाद्य—शेषजगत्प्रतिभासनिवृत्तेः किं तत्साधनं स्यात्? तर्हि ``भूयश्चान्ते विश्वमायानिवृत्तिः'' (श्वे० उप० १.१०) इत्यस्याः श्रुतेः कोऽर्थ इति चेत्, आरब्धान्ते निमित्ताभावाद्देहेन्द्रियाद्यशेषनैमित्तिकनिवृत्तिरित्येवार्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000672.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000673", "originalText": "ततो भवदभिमता वर्तमानदेहराहित्यलक्षणा विदेहमुक्तिः पश्चादस्तु देहपातानन्तरं अस्मदभिमता तु ज्ञानसमकालीनैव।", "padacchedaText": "", "audioFile": "PB_hear2read_000673.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000674", "originalText": "एतदेवाभिप्रेत्य भगवाञ्शेष आह—\n``तीर्थे श्वपचगृहे वा नष्टस्मृतिरपि परित्यजन्देहम्। ज्ञानसमकालमुक्तः कैवल्यं याति हतशोकः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000674.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000675", "originalText": "— (परमार्थसारे ८१) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000675.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000676", "originalText": "तस्माद्विदेहमुक्तौ साक्षात्साधनस्य तत्त्वज्ञानस्य प्रधानत्वमुपपन्नम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000676.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000677", "originalText": "वासनाक्षयमनोनाशयोर्ज्ञानसाधनत्वेन व्यवहितत्वादुपसर्जनत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000677.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000678", "originalText": "आसुरवासनाक्षयकारिण्या दैववासनाया ज्ञानसाधनत्वं श्रुतिस्मृत्योरुपलभ्यते— ``शान्तो दान्त उपरतस्तितिक्षुः समाहितो भूत्वात्मन्येवात्मानं पश्येत्'' (बृ० उप० ४.४.२३) इति श्रुतिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000678.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000679", "originalText": "स्मृतिरपि\n``अमानित्वमदम्भित्वमहिंसा क्षान्तिरार्जवम्। आचार्योपासनं शौचं स्थैर्यमात्मविनिग्रहः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000679.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000680", "originalText": "``इन्द्रियार्थेषु वैराग्यमनहङ्कार एव च। जन्ममृत्युजराव्याधिदुःखदोषानुदर्शनम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_000680.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000681", "originalText": "— (भगवद्गीतायां १३.८, ९)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000681.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000682", "originalText": "``असक्तिरनभिष्वङ्गः पुत्रदारगृहादिषु। नित्यं च समचित्तत्वमिष्टानिष्टोपपत्तिषु॥ १०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000682.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000683", "originalText": "`` मयि चानन्ययोगेन भक्तिरव्यभिचारिणी। विविक्तदेशसेवित्वमरतिर्जनसंसदि॥ ११॥", "padacchedaText": "", "audioFile": "PB_hear2read_000683.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000684", "originalText": "``अध्यात्मज्ञाननित्यत्वं तत्त्वज्ञानार्थदर्शनम्। एतज्ज्ञानमिति प्रोक्तमज्ञानं यदतोऽन्यथा''॥ १२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000684.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000685", "originalText": "— (तत्रैव १३.१२)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000685.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000686", "originalText": "अन्यस्मिन्नहम्बुद्धिरभिष्वङ्गः।", "padacchedaText": "", "audioFile": "PB_hear2read_000686.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000687", "originalText": "ज्ञायतेऽनेनेति व्युत्पत्त्या ज्ञानसाधनमित्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000687.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000688", "originalText": "मनोनाशस्यापि ज्ञानसाधनत्वं श्रुतिस्मृतिप्रसिद्धं— ``ततस्तु तं पश्यति निष्कलं ध्यायमानः'' (मु. उप०.३.१.८) इति श्रुतिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000688.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000689", "originalText": "``अध्यात्मयोगाधिगमेन देवं मत्वा धीरो हर्षशोकौ जहाति'' (कठ० उप० २.१२) इति च।", "padacchedaText": "", "audioFile": "PB_hear2read_000689.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000690", "originalText": "प्रत्यगात्मसमाधिप्राप्त्या देवं ज्ञात्वेत्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000690.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000691", "originalText": "``यं विनिद्रा जितश्वासाः सन्तुष्टाः संयतेन्द्रियाः। ज्योतिः पश्यन्ति युञ्जानास्तस्मै विद्यात्मने नमः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000691.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000692", "originalText": "— (महाभारते शान्ति० राजधर्म० ४७.३५)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000692.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000693", "originalText": "इति स्मृतिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000693.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000694", "originalText": "तदेवं तत्त्वज्ञानादीनां त्रयाणां विदेहमुक्तिजीवन्मुक्तिवशाद् गुणप्रधानभावव्यवस्था सिद्धा।", "padacchedaText": "", "audioFile": "PB_hear2read_000694.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000695", "originalText": "ननु विविदिषासंन्यासिना सम्पादितानामेतेषां किं विद्वत्सन्न्यासादूर्ध्वमनुवृत्तिमात्रम्, किं वा पुनरपि सम्पादनप्रयत्नोऽपेक्षितः।", "padacchedaText": "", "audioFile": "PB_hear2read_000695.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000696", "originalText": "नाद्यः, तत्त्वज्ञानस्येवान्ययोरप्ययत्नसिद्धत्वे प्राधान्यप्रयुक्तादराभावप्रसङ्गात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000696.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000697", "originalText": "न द्वितीयः, इतरयोरिव ज्ञानस्यापि प्रयत्नसापेक्षत्वे सत्युपसर्जनत्वप्रयुक्तौदासीन्याभावप्रसङ्गात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000697.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000698", "originalText": "नायं दोषः, ज्ञानस्यानुवृत्तिमात्रमितरयोर्यत्नसाध्यत्वमित्यङ्गीकारात्, तथा हि—विद्याधिकारी द्विविधः, कृतोपास्तिरकृतोपास्तिश्चेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000698.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000699", "originalText": "तत्रोपास्यसाक्षात्कारपर्यन्तामुपास्तिं कृत्वा यदि ज्ञा प्रवर्तेत तदा वासनाक्षयमनोनाशयोर्दृढतरत्वेन ज्ञानादूर्ध्वं विद्वत्संन्यासजीवन्मुक्ती स्वत एव सिध्यतः।", "padacchedaText": "", "audioFile": "PB_hear2read_000699.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000700", "originalText": "तादृश एव शास्त्राभिमतो मुख्यो विद्याधिकारी।", "padacchedaText": "", "audioFile": "PB_hear2read_000700.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000701", "originalText": "ततस्तं प्रति शास्त्रेषु सहोपन्यासात्, स्वरूपेण विविक्तावपि विद्वत्सन्न्यासविविदिषासन्न्यासौ सङ्कीर्णाविव प्रतिभासेते।", "padacchedaText": "", "audioFile": "PB_hear2read_000701.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000702", "originalText": "इदानीन्तनास्तु प्रायेणाकृतोपास्तय एवौत्सुक्यमात्रात्सहसा विद्यायां प्रवर्तन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000702.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000703", "originalText": "वासनाक्षयमनोनाशौ च तात्कालिकौ सम्पादयन्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000703.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000704", "originalText": "तावता श्रवणमनननिदिध्यासनानि निष्पाद्यन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000704.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000705", "originalText": "तैश्च दृढाभ्यस्तैरज्ञानसंशयविपर्ययनिरासात् तत्त्वज्ञानं सम्यगुदेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000705.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000706", "originalText": "उदितस्य ज्ञानस्य बाधकप्रमाणाभावान्निवृत्ताया अविद्यायाः पुनरुत्पत्तिकारणाभावाच्च नास्ति तस्य शैथिल्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000706.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000707", "originalText": "वासनाक्षयमनोनाशौ तु दृढाभ्यासाभावाद्भोगप्रदेन प्रारब्धेन तदा तदाबाध्यमानत्वाच्च सवातप्रदेशदीपवत्सहसा निवर्तेते।", "padacchedaText": "", "audioFile": "PB_hear2read_000707.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000708", "originalText": "तथा च वसिष्ठः—\n``पूर्वेभ्यस्तु प्रयत्नेभ्यो विषमोऽयं हि सम्मतः। दुःसाध्यो वासनात्यागः सुमेरून्मूलनादपि''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000708.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000709", "originalText": "— (लघुयोगवासिष्ठे २८.१०९) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000709.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000710", "originalText": "अर्जुनोऽपि\n``चञ्चलं हि मनः कृष्ण प्रमाथि बलवद्दृढम्। तस्याहं निग्रहं मन्ये वायोरिव सुदुष्करम्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000710.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000711", "originalText": "— (भगवद्गीतायां ६.३४) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000711.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000712", "originalText": "तस्मादिदानीन्तनानां विद्वत्संन्यासिनां ज्ञानस्यानुवृत्तिमात्रम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000712.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000713", "originalText": "वासनाक्षयमनोनाशौ तु प्रयत्न सम्पाद्याविति स्थितम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000713.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000714", "originalText": "ननु केयं वासना यस्याः क्षयाय प्रयतितव्यमिति चेत् तत्स्वरूपमाह वसिष्ठः—\n``दृढभावनया त्यक्तपूर्वापरविचारणम्। यदादानं पदार्थस्य वासना सा प्रकीर्तिता॥ ४८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000714.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000715", "originalText": "भावितं तीव्रसंवेगादात्मना यत्तदेव सः। भवत्याशु महाबाहो विगतेतरसंस्मृतिः॥ ४९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000715.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000716", "originalText": "तादृग्रूपो हि पुरुषो वासनाविवशीकृतः। सम्पश्यति यदेवैतत् सद्वस्त्विति विमुह्यति॥ ५०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000716.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000717", "originalText": "वासनावेगवैवश्यात् स्वरूपं प्रजहाति तत्। भ्रान्तं पश्यति दुर्दृष्टिः सर्वं मदवशादिव''॥ ५१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000717.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000718", "originalText": "— (लघुयोगवासिष्ठे २८.४८—५१) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000718.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000719", "originalText": "अत्र च स्वस्वदेशाचारकुलधर्मभाषाभेदतद्गतापशब्दसुशब्दादिषु प्राणिनामभिनिवेशः सामान्यत उदाहरणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000719.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000720", "originalText": "विशेषतस्तु भेदानुक्त्वा पश्चादुदाहरामः।", "padacchedaText": "", "audioFile": "PB_hear2read_000720.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000721", "originalText": "यथोक्तां वासनामभिप्रेत्य बृहदारण्यके श्रूयते— ``स यथाकामो भवति तत्क्रतुर्भवति यत्क्रतुर्भवति तत्कर्म कुरुते यत्कर्म कुरुते तदभिसम्पद्यते'' (बृ० उप० ४.४.५) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000721.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000722", "originalText": "वासनाभेदो वाल्मीकिना दर्शितः\n``वासना द्विविधा प्रोक्ता शुद्धा च मलिना तथा। मलिना जन्महेतुः स्याच्छुद्धा जन्मविनाशिनी॥", "padacchedaText": "", "audioFile": "PB_hear2read_000722.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000723", "originalText": "``अज्ञानसुघनाकारा घनाहङ्कारशालिनी। पुनर्जन्मकरी प्रोक्ता मलिना वासना बुधैः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000723.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000724", "originalText": "पुनर्जन्माङ्कुरं त्यक्त्वा स्थिता सम्भृष्टबीजवत्। देहार्थं ध्रियते ज्ञातज्ञेया शुद्धेति चोच्यते''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000724.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000725", "originalText": "— (लघुयोगवासिष्ठे १.१०—१२) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000725.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000726", "originalText": "देहादीनां पञ्चकोशानां तत्साक्षिणश्चिदात्मनश्च भेदावरकमज्ञानम्, तेन सुष्ठु घनीभूत आकारो यस्याः सेयमज्ञानसुघनाकारा।", "padacchedaText": "", "audioFile": "PB_hear2read_000726.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000727", "originalText": "यथा क्षीरं तक्रमेलनेन घनीभवति, यथा वा विलीनं घृतमत्यन्तशीतलप्रदेशे चिरमवस्थापितं सुघनीभवति तथा वासना द्रष्टव्या।", "padacchedaText": "", "audioFile": "PB_hear2read_000727.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000728", "originalText": "घनीभावश्चात्र भ्रान्तिपरम्परा।", "padacchedaText": "", "audioFile": "PB_hear2read_000728.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000729", "originalText": "तां चासुरसम्पद्विवरणे भगवानाह—\n``प्रवृत्तिं च निवृत्तिं च जना न विदुरासुराः। न शौचं नापि चाचारो न सत्यं तेषु विद्यते॥", "padacchedaText": "", "audioFile": "PB_hear2read_000729.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000730", "originalText": "असत्यमप्रतिष्ठं ते जगदाहुरनीश्वरम्। अपरस्परसम्भूतं किमन्यत् कामहैतुकम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_000730.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000731", "originalText":
