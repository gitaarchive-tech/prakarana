"एतां दृष्टिमवष्टभ्य नष्टात्मनोऽल्पबुद्धयः।", "padacchedaText": "", "audioFile": "PB_hear2read_000731.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000732", "originalText": "प्रभवन्त्युग्रकर्माणः क्षयाय जगतोऽहिताः।", "padacchedaText": "", "audioFile": "PB_hear2read_000732.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000733", "originalText": "काममाश्रित्य दुष्पूरं दम्भमानमदान्विताः। मोहाद् गृहीत्वासद्ग्राहान् प्रवर्तन्तेऽशुचिव्रताः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000733.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000734", "originalText": "चिन्तामपरिमेयां च प्रलयान्तामुपाश्रिताः। कामोपभोगपरमा एतावदिति निश्चिताः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000734.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000735", "originalText": "आशापाशशतैर्बद्धाः कामक्रोधपरायणाः। ईहन्ते कामभोगार्थमन्यायेनार्थ सञ्चयान्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000735.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000736", "originalText": "— (भगवद्गीतायां १६ः ७—१२) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000736.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000737", "originalText": "त आसुरा जगदसत्यमाहुः।", "padacchedaText": "", "audioFile": "PB_hear2read_000737.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000738", "originalText": "नास्ति सत्यं वेदपुराणादिप्रमाणं यस्मिंस्तादृशं जगदाहुः।", "padacchedaText": "", "audioFile": "PB_hear2read_000738.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000739", "originalText": "वेदानां प्रामाण्यं न मन्यन्त इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000739.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000740", "originalText": "अत एव नास्तीश्वरः कर्ता व्यवस्थापकश्च यस्मिंस्तादृशं जगदाहुः।", "padacchedaText": "", "audioFile": "PB_hear2read_000740.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000741", "originalText": "तर्हि कुतोऽस्य जगत उत्पत्तिं वदन्तीत्यत्राह— अपरस्परेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000741.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000742", "originalText": "अपरश्च परश्चेत्यपरस्परम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000742.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000743", "originalText": "अपरस्परतोऽन्योन्यतः स्त्रीपुरुषमिथुनात्\nसम्भूतं जगत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000743.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000744", "originalText": "किमन्यत्कारणमस्य? नास्त्यन्यत्किञ्चित्, किं तु कामहैतुकम्, स्त्रीपुरुषयोः काम एव प्रवाहरूपेण हेतुरस्येत्याहुरित्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000744.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000745", "originalText": "घनाहङ्कारश्च तत्रैवोदाहृतः—\n``इदमद्य मया लब्धमिमं प्राप्स्ये मनोरथम्। इदमस्तीदमपि मे भविष्यति पुनर्धनम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_000745.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000746", "originalText": "असौ मया हतः शत्रुर्हनिष्ये चापरानपि। ईश्वरोऽहमहं भोगी सिद्धोऽहं बलवान्सुखी॥", "padacchedaText": "", "audioFile": "PB_hear2read_000746.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000747", "originalText": "आढ्योऽभिजनवानस्मि कोऽन्योऽस्ति सदृशो मया। यक्ष्ये दास्यामि मोदिष्य इत्यज्ञानविमोहिताः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000747.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000748", "originalText": "अनेकचित्तविभ्रान्ता मोहजालसमावृताः।", "padacchedaText": "", "audioFile": "PB_hear2read_000748.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000749", "originalText": "प्रसक्ताः कामभोगेषु पतन्ति नरकेऽशुचौ''। — (भगवद्गीतायां १६.१३—१६) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000749.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000750", "originalText": "एतेन पुनर्जन्मकारणत्वमुदाहृतं भवति, तच्च पुनः प्रपञ्चितं—\n``आत्मसम्भाविताः स्तब्धा धनमानमदान्विताः। यजन्ते नामयज्ञैस्ते दम्भेनाविधिपूर्वकम॥ १७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000750.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000751", "originalText": "अहङ्कारं बलं दर्पं कामं क्रोधं च संश्रिताः। मामात्मपरदेहेषु प्रद्विषन्तोऽभ्यसूयकाः॥ १८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000751.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000752", "originalText": "तानहं द्विषतः क्रूरान् संसारेषु नराधमान्। क्षिपाम्यजस्रमशुभानासुरीष्वेव योनिषु॥ १९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000752.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000753", "originalText": "आसुरी योनिमापन्ना मूढा जन्मनि जन्मनि। मामप्राप्यैव कौन्तेय ततो यान्त्यधमां गतिम्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000753.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000754", "originalText": "— (भगवद्गीतायां १६.१७—२०) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000754.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000755", "originalText": "शुद्धवासना तु ज्ञातज्ञेया।", "padacchedaText": "", "audioFile": "PB_hear2read_000755.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000756", "originalText": "ज्ञेयस्वरूपं त्रयोदशाध्याये भगवानाह—\n``ज्ञेयं यत्तत्प्रवक्ष्यामि यज्ज्ञात्वामृतमश्नुते। अनादिमत्परं ब्रह्म न सत्तन्नासदुच्यते॥ १२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000756.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000757", "originalText": "सर्वतः पाणिपादं तत्सर्वतोक्षिशिरोमुखम्। सर्वतः श्रुतिमल्लोके सर्वमावृत्य तिष्ठति॥ १३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000757.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000758", "originalText": "सर्वेन्द्रियगुणाभासं सर्वेन्द्रियविवर्जितम्। असक्तं सर्वभृच्चैव निर्गुणं गुणभोक्तृ च॥ १४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000758.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000759", "originalText": "बहिरन्तश्च भूतानामचरं चरमेव च। सूक्ष्मत्वात् तदविज्ञेयं दूरस्थं चान्तिके च तत्॥ १५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000759.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000760", "originalText": "अविभक्तं च भूतेषु विभक्तमिव च स्थितम्। भूतभर्तृ च तज्ज्ञेयं ग्रसिष्णु प्रभविष्णु च॥ १६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000760.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000761", "originalText": "ज्योतिषामपि तज्ज्योतिस्तमसः परमुच्यते। ज्ञानं ज्ञेयं ज्ञानगम्यं हृदि सर्वस्य विष्ठितम्''॥ १७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000761.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000762", "originalText": "— (भगवद्गीतायां १३.१२—१७) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000762.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000763", "originalText": "अत्र तटस्थलक्षणस्वरूपलक्षणाभ्यामवगन्तुं सोपाधिकनिरुपाधिकस्वरूपद्वयमुपन्यस्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000763.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000764", "originalText": "कदाचित्सम्बन्धि सद्यल्लक्षयति तत्तटस्थलक्षणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000764.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000765", "originalText": "तत्स्वरूपलक्षणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000765.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000766", "originalText": "यथा ``काकवद्देवदत्तगृहम्'' इति तथा कालत्रयसम्बन्धि सद्यल्लक्षयति तत्स्वरूपलक्षणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000766.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000767", "originalText": "यथा ``प्रकृष्टप्रकाशश्चन्द्रः'' इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000767.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000768", "originalText": "ननु त्यक्तपूर्वापरविचारत्वं वासनालक्षणमुक्तं, ज्ञेयज्ञानं च विचारजन्यम्, अतो न शुद्धायां तल्लक्षणमस्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000768.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000769", "originalText": "मैवम्, लक्षणे दृढ़भावनयेत्युक्तत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000769.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000770", "originalText": "यथा बहुषु जन्मसु दृढ़भावितत्वेनास्मिञ्जन्मनि विनैव परोपदेशमहङ्कारममकारकामक्रोधादयो मलिनवासना उत्पद्यन्ते, तथा प्राथमिकस्य बोधस्य विचारजन्यत्वेऽपि दीर्घकालनैरन्तर्यसत्कारैर्भाविते तत्त्वे पश्चाद्वाक्ययुक्तिपरामर्शमन्तरेणैव पुरोवर्तिघटादिवत्सहसा तत्त्वं परिस्फुरति, तादृश्या बोधानुवृत्त्या सहित इन्द्रियव्यवहारः शुद्धवासना।", "padacchedaText": "", "audioFile": "PB_hear2read_000770.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000771", "originalText": "सा च देहजीवनमात्रायोपयुज्यते, न तु दम्भदर्पाद्यासुरसम्पदुत्पादनाय, नापि जन्मान्तरहेतुधर्माधर्मोत्पादनाय।", "padacchedaText": "", "audioFile": "PB_hear2read_000771.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000772", "originalText": "यथा भृष्टानि व्रीह्यादिबीजानि कुसूलपूरणमात्रायोपयुक्तानि, न तु रुचिरान्नाय नापि सस्यनिष्पत्तये, तद्वत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000772.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000773", "originalText": "मलिना च वासना त्रिविधा, लोकवासना शास्त्रवासना देहवासना चेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000773.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000774", "originalText": "सर्वे जना यथा मां न निन्दन्ति यथा वा स्तुवन्ति तथैव सर्वदाचरिष्यामीत्यभिनिवेशो लोकवासना।", "padacchedaText": "", "audioFile": "PB_hear2read_000774.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000775", "originalText": "तस्याश्च सम्पादयितुमशक्यत्वान्मलिनत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000775.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000776", "originalText": "तथा हि—\n``को न्वस्मिन्साम्प्रतं लोके गुणवान्कश्च वीर्यवान्''। — (रामायणे १.१.२)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000776.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000777", "originalText": "इत्यादिना बहुधा वाल्मीकिः पप्रच्छ।", "padacchedaText": "", "audioFile": "PB_hear2read_000777.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000778", "originalText": "``इक्ष्वाकुवंशप्रभवो रामो नाम जनैः श्रुतः''। — (रामायणे १.१.८)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000778.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000779", "originalText": "इत्यादिना प्रत्युत्तरं नारदो ददौ।", "padacchedaText": "", "audioFile": "PB_hear2read_000779.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000780", "originalText": "तादृशस्यापि रामस्य पतिव्रताशिरोमणिभूताया जगन्मातुः सीतायाश्च श्रोतुमशक्यो जनापवादः सम्प्रवृत्तः, किमु वक्तव्यमन्येषां? तथा हि देशविशेषेण परस्परं निन्दाबाहुल्यमुपलभ्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000780.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000781", "originalText": "दाक्षिण्यात्यैर्विप्रैरौत्तरा वेदविदो विप्रा मांसभक्षिणो निन्द्यन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000781.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000782", "originalText": "औत्तरैश्च मातुलसुतोद्वाहिनो यात्रासु मृद्भाण्डवाहिनो दाक्षिणात्या\nनिन्द्यन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000782.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000783", "originalText": "बह्वृचा आश्वलायनशाखां काण्वशाखायाः प्रशस्तां मन्यन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000783.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000784", "originalText": "वाजसनेयिनस्तु वैपरीत्येन।", "padacchedaText": "", "audioFile": "PB_hear2read_000784.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000785", "originalText": "एवं स्वस्वकुलगोत्रबन्धुवर्गेष्टदेवतादिप्रशंसा परकीयनिन्दाच आविद्वदङ्गनागोपालं सर्वत्र प्रसिद्धा।", "padacchedaText": "", "audioFile": "PB_hear2read_000785.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000786", "originalText": "एतदेवाभिप्रेत्योक्तं—\n``शुचिः पिशाचो विचलो विचक्षणः\nक्षमोऽप्यशक्तो बलवांश्च दुष्टः। निश्चित्तचोरः सुभगोऽपि कामी\nको लोकमाराधयितुं समर्थः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000786.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000787", "originalText": "``इति,\n``विद्यते न खलु कश्चिदुपायः\nसर्वलोकपरितोषकरो यः। सर्वथा स्वहितमाचरणीयं\nकिं करिष्यति जनो बहुजल्पः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000787.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000788", "originalText": "इति च।", "padacchedaText": "", "audioFile": "PB_hear2read_000788.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000789", "originalText": "अतो लोकवासनाया मलिनत्वमभिप्रेत्य योगीश्वरस्य तुल्यनिन्दास्तुतित्वं मोक्षशास्त्रेषु वर्णतम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000789.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000790", "originalText": "शास्त्रवासना त्रिविधा, पाठव्यसनं बहुशास्त्रव्यसनमनुष्ठानव्यसनं चेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000790.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000791", "originalText": "पाठव्यसनं भरद्वाजेऽवगम्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000791.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000792", "originalText": "स हि पुरुषायुषत्रयेण बहून्वेदानधीत्येन्द्रेण चतुर्थायुषि प्रलोभितस्तत्रापि परिशिष्टवेदाध्ययनायोद्यमं चकार।", "padacchedaText": "", "audioFile": "PB_hear2read_000792.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000793", "originalText": "तस्यापि पाठस्याशक्यत्वान्मलिनवासनात्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000793.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000794", "originalText": "तां चाशक्यतामिन्द्रः प्रतिबोध्य पाठान्निवर्त्य ततोऽप्यधिकाय पुरुषार्थाय सगुणब्रह्मविद्यामुपदिदेश।", "padacchedaText": "", "audioFile": "PB_hear2read_000794.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000795", "originalText": "तदेतत्सर्वं तैत्तिरीयब्राह्मणे द्रष्टव्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000795.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000796", "originalText": "तथैवात्यन्तिकपुरुषार्थाभावाद्बहुशास्त्रव्यसनस्य मालिन्यं कावषेयगीतायामुपलभ्यते—\n``कश्चिन्मुनिर्दुर्वासा बहुविधशास्त्रपुस्तकभारैः सह महादेवं नमस्कर्तुमागतस्तत्सभायां मुनिना नारदेन भारवाहिगर्दभसाम्यमापादितः कोपात्पुस्तकानि लवणार्णवे परित्यज्य महादेवेनात्मविद्यायां प्रवर्तितः'' इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000796.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000797", "originalText": "आत्मविद्या चानन्तर्मुखस्य गुरुकारुण्यरहितस्य न वेदशास्त्रमात्रेणोत्पद्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000797.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000798", "originalText": "तथा च श्रुतिः—\n``नायमात्मा प्रवचनेन लभ्यो न मेधया न बहुना श्रुतेन'' (कठोपनिषदि १.२.२३) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000798.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000799", "originalText": "अन्यत्राप्युक्तं—\n``बहुशास्त्रकथाकन्थारोमन्थेन वृथैव किम्। अन्वेष्टव्यं प्रयत्नेन तत्त्वज्ञैर्ज्योतिरान्तरम्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000799.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000800", "originalText": "इति,\n``अधीत्य चतुरो वेदान्धर्मशास्त्राण्यनेकश। ब्रह्मतत्त्वं न जानाति दर्वी पाकरसं यथा''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000800.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000801", "originalText": "इति च। — (मुक्तिकोपनिषदि २.६३, ६५)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000801.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000802", "originalText": "नारदश्चतुःषष्टिकलाकुशलोऽप्यनात्मवित्त्वेनानुतप्तः सनत्कुमारमुपससाद इतिच्छन्दोगा अधीयते।", "padacchedaText": "", "audioFile": "PB_hear2read_000802.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000803", "originalText": "अनुष्ठानव्यसनं विष्णुपुराणे निदाघस्योपलभ्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000803.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000804", "originalText": "वासिष्ठरामायणे दाशूरस्य।", "padacchedaText": "", "audioFile": "PB_hear2read_000804.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000805", "originalText": "निदाघो हि ऋभुणा पुनः पुनः प्रबोध्यमानोऽपि कर्मश्रद्धाजाड्यं चिरं न जहौ।", "padacchedaText": "", "audioFile": "PB_hear2read_000805.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000806", "originalText": "दाशूरश्चात्यन्तश्रद्धाजाड्येनानुष्ठानाय शुद्धप्रदेशं भूमौ न क्वाप्युपलेभे।", "padacchedaText": "", "audioFile": "PB_hear2read_000806.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000807", "originalText": "अस्याश्च कर्मवासनायाः पुनर्जन्महेतुत्वान्मलिनत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000807.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000808", "originalText": "तथा चाथर्वणिका अधीयते—\n``प्लवा ह्येते अदृढ़ा यज्ञरूपा\nअष्टादशोक्तमवरं येषु कर्म। एतच्छ्रेयो येऽभिनन्दन्ति मूढा\nजरामृत्युं ते पुनरेवापि यन्ति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000808.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000809", "originalText": "अविद्यायामन्तरे वर्तमानाः\nस्वयं धीराः पण्डितम्मन्यमानाः। जङ्घन्यमानाः परियन्ति मूढा\nअन्धेनैव नीयमाना यथान्धाः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000809.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000810", "originalText": "अविद्यायां बहुधा वर्तमाना\nवयं कृतार्था इत्यभिमन्यन्ति बालाः। यत्कर्मिणो न प्रवेदयन्ति रागात्—\nतेनातुराः क्षीणलोकाश्च्यवन्ते॥", "padacchedaText": "", "audioFile": "PB_hear2read_000810.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000811", "originalText": "इष्टापूर्तं मन्यमाना वरिष्ठं\nनान्यच्छ्रेयो वेदयन्ते प्रमूढाः। नाकस्य पृष्ठे ते सुकृतेऽनुभूत्वे—\nमं लोकं हीनतरं वा विशन्ति''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000811.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000812", "originalText": "— (मुण्डकोपनिषदि १.२.७—१०)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000812.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000813", "originalText": "भगवताप्युक्तम्—\n``यामिमां पुष्पितां वाचं प्रवदन्त्यविपश्चितः। वेदवादरताः पार्थ नान्यदस्तीति वादिनः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000813.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000814", "originalText": "कामात्मानः स्वर्गपरा जन्मकर्मफलप्रदाम्। क्रियाविशेषबहुलां भोगैश्वर्यगतिं प्रति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000814.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000815", "originalText": "भोगैश्वर्यप्रसक्तानां तयापहृतचेतसाम्। व्यवसायात्मिका बुद्धिः समाधौ न विधीयते॥", "padacchedaText": "", "audioFile": "PB_hear2read_000815.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000816", "originalText": "त्रैगुण्यविषया वेदा निस्त्रैगुण्यो भवार्जुन। निर्द्वन्द्वो नित्यसत्त्वस्थो निर्योगक्षेम आत्मवान्॥", "padacchedaText": "", "audioFile": "PB_hear2read_000816.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000817", "originalText": "यावानर्थ उदपाने सर्वतः सम्प्लुतोदके। तावान्सर्वेषु वेदेषु ब्राह्मणस्य विजानतः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000817.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000818", "originalText": "— (भगवद्गीतायां २.४२—४६) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000818.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000819", "originalText": "दर्पहेतुत्वाच्च शास्त्रवासनाया मलिनत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000819.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000820", "originalText": "श्वेतकेतुरल्पेनैव कालेन सर्वान्वेदानधीत्य दर्पेण पितुरपि पुरतो विनयं न चकारेतिच्छन्दोगाः षष्ठाध्याये पठन्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000820.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000821", "originalText": "तथा बालाकिः कानिचिदुपासनान्यवगत्य दृप्त उशीनरादिषु बहुषु देशेषु दिग्विजयेन बहून्विप्रानवज्ञाय काश्यामजातशत्रुं ब्रह्मविच्छिरोमणिमनुशासितुं धार्ष्ट्यं चकारेति कौषीतकिनो वाजसनेयिनश्चाधीयते।", "padacchedaText": "", "audioFile": "PB_hear2read_000821.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000822", "originalText": "देहवासनाप्यात्मत्वगुणाधानदोषापनयनभ्रान्तिभेदात् त्रिविधा।", "padacchedaText": "", "audioFile": "PB_hear2read_000822.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000823", "originalText": "तत्रात्मत्वं भाष्यकार उदाजहार— ``देहमात्रं चैतन्यविशिष्टमात्मेति प्राकृता जना लौकायतिकाश्च प्रतिपन्नाः'' (ब्रह्मसूत्रभाष्ये १.१.१) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000823.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000824", "originalText": "``स वा एष पुरुषोऽन्नरसमयः'' इत्यारभ्य ``तस्मादन्नं तदुच्यते'' (तै० उप० २.१.२) इत्यन्तेन ग्रन्थेन तामेव प्राकृतप्रतिपत्तिं तैत्तिरीयाः स्पष्टीकुर्वन्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000824.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000825", "originalText": "``विरोचनः प्रजापतिनानुशिष्टोऽपि स्वचित्तदोषेण देहात्मबुद्धिं दृढीकृत्यासुरान्सर्वाननुशशास'' इतिच्छन्दोगा अष्टमाध्याये समामनन्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000825.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000826", "originalText": "गुणाधानं द्विविधं लौकिकं शास्त्रीयं चेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000826.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000827", "originalText": "समीचीनशब्दादिसम्पादनं लौकिकम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000827.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000828", "originalText": "कोमलध्वनिना गातुमध्येतुं वा तैलपानमरीचभक्षणादिषु लोकाः प्रयतन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000828.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000829", "originalText": "मृदुस्पर्शाय लोकाः पुष्टिकरावौषधाहारा—वुपयुञ्जते।", "padacchedaText": "", "audioFile": "PB_hear2read_000829.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000830", "originalText": "लावण्यायाभ्यङ्गोद्वर्तनदुकूलालङ्कारानुपसेवन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000830.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000831", "originalText": "सौगन्ध्याय स्रगालेपने धारयन्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000831.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000832", "originalText": "शास्त्रीयं गुणमाधातुं गङ्गास्नानसालग्रामतीर्थादिकं सम्पादयन्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000832.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000833", "originalText": "दोषापनयनं च चिकित्सकोक्तैरोषधैर्मुखादिप्रक्षालनेन च लौकिकम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000833.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000834", "originalText": "शौचाचमनादिभिर्वैदिक—मित्युभयविधम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000834.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000835", "originalText": "अस्याश्च देहवासनाया मालिन्यं वक्ष्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000835.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000836", "originalText": "देहस्यात्मत्वं तावदप्रामाणिकत्वादशेष—दुःखहेतुत्वाच्च मलिनत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000836.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000837", "originalText": "अस्मिंश्चार्थे पूर्वाचार्यैः सर्वैरपि पराक्रान्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000837.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000838", "originalText": "गुणाधानं च प्रायेण न पश्यामः।", "padacchedaText": "", "audioFile": "PB_hear2read_000838.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000839", "originalText": "प्रसिद्धा एव गायका अध्यापकाश्च प्रयतमाना अपि बहवो ध्वनिसौष्ठवं न लभन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000839.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000840", "originalText": "मृदुस्पर्शोऽङ्गपुष्टिश्च न नियतौ।", "padacchedaText": "", "audioFile": "PB_hear2read_000840.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000841", "originalText": "लावण्यसौगन्ध्ये अपि दुकूलस्रगादिनिष्ठे न तु देहनिष्ठे।", "padacchedaText": "", "audioFile": "PB_hear2read_000841.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000842", "originalText": "अत एव विष्णुपुराणेऽभिहितम्—\n``मांसासृक्पूयविण्मूत्रस्नायुमज्जास्थिसंहतौ। देहे चेत्प्रीतिमान्मूढो भविता नरकेऽपि सः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000842.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000843", "originalText": "— (वि. पुराणे १.१७.६३)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000843.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000844", "originalText": "``स्वदेहाशुचिगन्धेन न विरज्येत यः पुमान। वैराग्यकारणं तस्य किमन्यदुपदिश्यते''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000844.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000845", "originalText": "**इति। — (मुक्तिकोपनिषदि २.६६)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000845.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000846", "originalText": "** स्वदेहस्य विगन्धेन विरज्यते न यो नरः॥ ८०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000846.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000847", "originalText": "विरागकारणं तस्य किमन्यदुपदिश्यते। सर्वमेव जगत्पूतं देहमेवाशुचिः परम्॥ ८१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000847.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000848", "originalText": "— पद्मपुराणे (गुरुमण्डलग्रन्थमालायाम्) २.६६.८०—८१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000848.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000849", "originalText": "स्वदेहाशुचिगन्धेन यो विग्ज्येत मानवः। विरागकारणं तस्य किमन्यदुपदिश्यते॥ ८०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000849.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000850", "originalText": "— तत्रैव (आनन्दाश्रमग्रन्थावल्यां १३१ ) २.६६.८०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000850.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000851", "originalText": "शास्त्रीयं च गुणाधानं प्रबलेन शास्त्रान्तरेणापोह्यते, यथा ``न हिंस्यात्सर्वा भूतानि'' (महाभारते ३.२०३.४५) इत्यस्य, ``अग्नीषोमीयं पशुमालभेत (तै० सं० ६—१—११—६) इत्यनेनापवादस्तद्वत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000851.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000852", "originalText": "प्रबलतरं शास्त्रमेतदन्यशास्त्रापेक्षया——\n``यस्यात्मबुद्धि कुणपे त्रिधातुके\nस्वधीः कलत्रादिषु भौम इज्यधीः। यस्तीर्थबुद्धिः सलिले न कर्हिचिज्—\nजनेष्वभिज्ञेषु स एवा गोखरः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000852.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000853", "originalText": "— (भागवते १०.८४.१३)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000853.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000854", "originalText": "``अत्यन्तमलिनो देहो देही चात्यन्तनिर्मलः। उभयोरन्तरं ज्ञात्वा कस्य शौचं विधीयते''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000854.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000855", "originalText": "इत्यादि। — (सूतसंहितायां २.१४.१९)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000855.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000856", "originalText": "यद्यप्यनेन शास्त्रेण दोषापनयनं प्रतिषिध्यते न तु गुणाधानम्, तथापि सति विरोधिनि प्रबलप्रदोषे गुण आधातुमशक्य इत्यर्थाद् गुणाधानस्य प्रतिषेधः।", "padacchedaText": "", "audioFile": "PB_hear2read_000856.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000857", "originalText": "अत्यन्तमालिन्यं चात्र मैत्रायणीयशाखायां श्रूयते— ``भगवन्नस्थिचर्मस्नायुमज्जामांसशुक्रशोणितादूषते विण्मूत्रवातपित्तकफसङ्घाते दुर्गन्धे निःसारेऽस्मि—ञ्शरीरे किं कामोपभौगैः'' (१.१.२) इति, शरीरमिदं मैथुनादेवोद्भूतं संविद्व्यपेतं निरय इव मूत्रद्वारेण निष्क्रान्तमस्थिभिश्चितं मांसेनानुलिप्तं चर्मणावनद्धं विण्मूत्रपित्तकफमज्जामेदोवसाभिरन्यैश्च मलैर्बहुभिः परिपूर्णं कोश इव वसुना'' इति च।", "padacchedaText": "", "audioFile": "PB_hear2read_000857.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000858", "originalText": "चिकित्सया च रोगशान्तिर्न नियता।", "padacchedaText": "", "audioFile": "PB_hear2read_000858.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000859", "originalText": "शान्तोऽपि रोगः कदाचित्पुनरुदेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000859.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000860", "originalText": "नवभिश्छिद्रैर्निरन्तरं स्रवत्सु मलेषु रोमकूपैरसङ्ख्यातेः स्विन्ने गात्रे को नाम खेदेन प्रक्षालयितुं शक्नुयात्? तदुक्तं पूर्वाचार्यैः—\n``नवच्छिद्रयुता देहाः स्रवन्ति घटिका इव।", "padacchedaText": "", "audioFile": "PB_hear2read_000860.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000861", "originalText": "बाह्यशौचैर्न शुध्यन्ति नान्तः शौचं च विद्यते''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000861.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000862", "originalText": "अतो देहवासना मलिना।", "padacchedaText": "", "audioFile": "PB_hear2read_000862.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000863", "originalText": "तदेतन्मालिन्यमभिप्रेत्य वसिष्ट आह——\n``आपादमस्तकमहं मातापितृविनिर्मितः। इत्येको निश्चयो राम बन्धायासद्विलोकनात्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000863.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000864", "originalText": "— (लघुयोगवासिष्ठे २०.४२)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000864.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000865", "originalText": "``सा कालसूत्रपदवी सा महावीचिवागुरा। सासिपत्रवनश्रेणी या देहेऽहमिति स्थितिः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000865.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000866", "originalText": "सा त्याज्या सर्वयत्नेन सर्वनाशेऽप्युपस्थिते। स्प्रष्टव्या सा न भव्येन सश्वमांसेव पुल्कसी॥", "padacchedaText": "", "audioFile": "PB_hear2read_000866.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000867", "originalText": "— (लघुयोगवासिष्ठे १८.१६—१७) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000867.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000868", "originalText": "तदेतल्लोकशास्त्रदेहवासनात्रयमविवेकिनामुपादेयत्वेन प्रतिभासमानमपि विविदिषोर्वेदनोत्पत्तिविरोधि—त्वाद्विदुषो ज्ञानप्रतिष्ठाविरोधित्वाच्च विवेकिभिर्हेयम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000868.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000869", "originalText": "अत एव स्मर्यते—\n``लोकवासनया जन्तोः शास्त्रवासनयापि च। देहवासनया ज्ञानं यथावन्नैव जायते''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000869.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000870", "originalText": "— (सूतसंहितायां ४.१४.५१) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000870.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000871", "originalText": "या तु दम्भदर्पाद्यासुरसम्पद्रूपा मानसवासना, तस्या नरकहेतुत्वान्मालिन्यमतिप्रसिद्धम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000871.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000872", "originalText": "अतः केनाप्युपायेन वासनाचतुष्टयस्य क्षयः सम्पादनीयः।", "padacchedaText": "", "audioFile": "PB_hear2read_000872.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000873", "originalText": "यथा वासनायाः क्षयः सम्पादनीयस्तथा मनसोऽपि।", "padacchedaText": "", "audioFile": "PB_hear2read_000873.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000874", "originalText": "न च तार्किकवन्नित्यद्रव्यमणुपरिमाणं मनो वैदिका अभ्युपगच्छन्ति येन मनोनाशो दुःसम्पादः स्यात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000874.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000875", "originalText": "किं तर्हि सावयवमनित्यं सर्वदा जतुसुवर्णादिवद्बहुविधपरिणामार्हं द्रव्यं मनः।", "padacchedaText": "", "audioFile": "PB_hear2read_000875.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000876", "originalText": "तस्य लक्षणं प्रमाणं च वाजसनेयिनः समामनन्ति— ``कामः सङ्कल्पो विचिकित्सा श्रद्धाश्रद्धा धृतिरधृतिर्ह्रिर्धीर्भीरित्येतत्सर्वं मन एव'' (बृहदारण्यके उप०.१.५.३) इत्येतल्लक्षणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000876.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000877", "originalText": "याः कामादिवृत्तयः क्रमेणोत्पद्यमानाश्चाक्षुषप्रत्यक्षघटादिवत्साक्षिप्रत्यक्षेणातिस्पष्टं भासन्ते, तदुपादानं मन इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000877.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000878", "originalText": "``अन्यत्रमना अभूवं नादर्शमन्यत्रमना अभूवं नाश्रौषम्'' (बृह. उप०.१.५.३) इति ``मनसा ह्येष पश्यति मनसा श‍ृणोति'' (बृह. उप०.१.५.३) इत्येतत्प्रमाणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000878.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000879", "originalText": "चक्षुःसन्निकृष्टः स्फीतालोकमध्यवर्ती घटः श्रोत्रसन्निकृष्ट उच्चैः पठितो वेदश्च यस्यानवधाने सति न प्रतीयते, सति तु प्रतीयते, अवधाने तु प्रतीयते, तादृशं सर्वविषयोपलब्धिसाधारणकरणमन्वय—व्यतिरेकाभ्यां प्रतीयत इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000879.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000880", "originalText": "``तस्मादपि पृष्ठत उपस्पृष्टो मनसा विजानाति'' (बृ. उप०.१.५.३) इत्येतदुदाहरणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000880.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000881", "originalText": "यस्माच्च लक्षणप्रमाणाभ्यां सिद्धं मनस्तस्मात्तदेवमुदाहरणीयम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000881.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000882", "originalText": "पृष्ठभागेप्यऽन्येनोपस्पृष्टो देवदत्तो विशेषेण जानाति हस्तस्पर्शोऽयमङ्गुलिस्पर्शोऽयमिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000882.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000883", "originalText": "न हि तत्र चक्षुः प्रसरति, त्वगिन्द्रियं तु मार्दवकाठिन्यमात्रग्रहण उपक्षीणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000883.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000884", "originalText": "तस्मान्मन एव विशेषज्ञानकारणं परिशिष्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000884.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000885", "originalText": "तच्च मननान्मन इति चेतनाच्चित्तमिति चाभिधीयते।", "padacchedaText": "", "audioFile": "PB_hear2read_000885.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000886", "originalText": "तच्च चित्तं सत्त्वरजस्तमोगुणात्मकं प्रकाशप्रवृत्तिमोहानां सत्त्वादिकार्याणां तत्र दर्शनात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000886.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000887", "originalText": "प्रकाशादीनां च गुणकार्यत्वं गुणातीतलक्षणेऽवगम्यते— ``प्रकाशं च प्रवृत्तिं च मोहमेव च पाण्डव'' (भगवद्गीतायां १४.२२) इत्यभिधानात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000887.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000888", "originalText": "साङ्ख्यशास्त्रेऽपि— ``प्रकाशप्रवृत्तिमोहा नियमार्थाः'' इत्युक्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000888.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000889", "originalText": "प्रकाशो नाम नात्र सितभास्वररूपं किं तु ज्ञानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000889.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000890", "originalText": "``सत्त्वात्सञ्जायते ज्ञानं रजसो लोभ एव च। प्रमादमोहौ तमसो भवतोऽज्ञानमेव च''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000890.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000891", "originalText": "— (भगवद्गीतायां १४.१७)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000891.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000892", "originalText": "इत्युक्तत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000892.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000893", "originalText": "ज्ञानवत्सुखमपि सत्त्वकार्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000893.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000894", "originalText": "तदप्युक्तम्—\n``सत्त्वं सुखे सञ्जयति रजः कर्मणि भारत। ज्ञानमावृत्य तु तमः प्रमादे सञ्जयत्युत''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000894.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000895", "originalText": "— (भगवद्गीतायां १४.९) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000895.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000896", "originalText": "समुद्रतरङ्गवन्निरन्तरं परिणममानेषु गुणेषु कदाचित्कश्चिदुद्भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_000896.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000897", "originalText": "इतरावभिभूयेते।", "padacchedaText": "", "audioFile": "PB_hear2read_000897.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000898", "originalText": "तदुक्तम्—\n``रजस्तमश्चाभिभूय सत्त्वं भवति भारत। रजः सत्त्वं तमश्चैव तमः सत्त्वं रजस्तथा''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000898.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000899", "originalText": "— (तत्रैव १४.१०) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000899.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000900", "originalText": "``बाध्यबाधकतां यान्ति कल्लोला इव सागरे''। — (विष्णुपुराणे ५.१.२०) इति च॥", "padacchedaText": "", "audioFile": "PB_hear2read_000900.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000901", "originalText": "तत्र तमस उद्भवे सत्यासुरसम्पदुदेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000901.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000902", "originalText": "रजस उद्भवे सति लोकादिवासनास्तिस्रो भवन्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000902.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000903", "originalText": "सत्त्वस्योद्भवे सति दैवी सम्पदुपजायते।", "padacchedaText": "", "audioFile": "PB_hear2read_000903.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000904", "originalText": "एतदेवाभिप्रेत्योक्तम्—\n``सर्वद्वारेषु देहेऽस्मिन् प्रकाश उपजायते। ज्ञानं यदा तदा विद्याद्विवृद्धं सत्त्वमित्युत''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000904.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000905", "originalText": "— (भगवद्गीतायां १४.११) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000905.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000906", "originalText": "यद्यप्यन्तःकरणं त्रिगुणात्मकं भासते, तथापि सत्त्वमेवास्य मुख्यमुपादानकारणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000906.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000907", "originalText": "रजस्तमसी तूपष्टम्भके।", "padacchedaText": "", "audioFile": "PB_hear2read_000907.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000908", "originalText": "उपादानसहकारिभूता अवयवा उपष्टम्भकाः।", "padacchedaText": "", "audioFile": "PB_hear2read_000908.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000909", "originalText": "अत एव ज्ञानिनो योगाभ्यासेन रजस्तमसोरपनीतयोः सत्त्वमेव स्वरूपं परिशिष्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000909.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000910", "originalText": "एतदेवाभिप्रेत्योक्तम्— ``ज्ञस्य चित्तमचित्तं स्याज्ज्ञचित्तं सत्त्वमुच्यते'' इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000910.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000911", "originalText": "तच्च सत्त्वं चाञ्चल्यहेतुरजोगुणशून्यत्वादेकाग्रम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000911.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000912", "originalText": "भ्रान्तिकल्पितानात्मस्वरूपस्थूलपदार्थाकारहेतु—तमोगुणशून्यत्वात्सूक्ष्मम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000912.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000913", "originalText": "तत आत्मदर्शनयोग्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000913.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000914", "originalText": "अत एव श्रुतिः—\n``दृश्यते त्वग्र्यया बुद्ध्या सूक्ष्मया सूक्ष्मदर्शिभिः''। — (कठ० उप० १.३.१२) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000914.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000915", "originalText": "न खलु वायुना दोधूयमानेन प्रदीपेन मणिमुक्तादिलक्षणानि निर्धारयितुं शक्यन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000915.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000916", "originalText": "नापि स्थूलेन खनित्रेण सूच्येव सूक्ष्मपटस्यूतिः सम्भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_000916.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000917", "originalText": "तदेतदीदृशं सत्त्वमेवायोगिषु तमोगुणगर्भितेन रजोगुणेनोपस्पृष्टं बहुविधद्वैतसङ्कल्पेन चेतयमानं चित्तं भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_000917.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000918", "originalText": "तच्चित्तं तमोगुणाधिक्ये सत्यासुरीं सम्पदमुपचिन्वत्पीनं भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_000918.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000919", "originalText": "तथाह वसिष्ठः—\n``अनात्मन्यात्मभावेन देहभावनया तथा। पुत्रदारैः कुटुम्बैश्च चेतो गच्छति पीनताम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_000919.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000920", "originalText": "अहङ्कारविकारेण ममतामललीलया। इदं ममेतिभावेन चेतो गच्छति पीनताम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_000920.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000921", "originalText": "आधिव्याधिविलासेन समाश्वासेन संसृतौ। हेयादेयविभागेन चेतो गच्छति पीनताम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_000921.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000922", "originalText": "स्नेहेन धनलोभेन लाभेन मणियोषिताम्। आपातरमणीयेन चेतो गच्छति पीनताम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_000922.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000923", "originalText": "दुराशाक्षीरपानेन भोगानिलबलेन च। आस्थादानेन चारेण चित्ताहिर्याति पीनताम्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000923.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000924", "originalText": "— (लघुयोगवासिष्ठे २४.१७—२१) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000924.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000925", "originalText": "आस्था नाम प्रपञ्चे सत्यत्वबुद्धिः, तस्या आदानमङ्गीकारः, स एव चारो गमनागमनक्रिया तेनेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000925.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000926", "originalText": "तदेवं विनाशनीययोर्वासनामनसोः स्वरूपं निरूपितम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000926.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000927", "originalText": "अथ वासनाक्षयमनोनाशौ क्रमेण निरूप्येते।", "padacchedaText": "", "audioFile": "PB_hear2read_000927.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000928", "originalText": "तत्र वासनाक्षयप्रकारमाह वसिष्ठः—\n``बन्धो हि वासनाबन्धो मोक्षः स्याद्वासनाक्षयः। वासनास्त्वं परित्यज्य मोक्षार्थित्वमपि त्यज॥", "padacchedaText": "", "audioFile": "PB_hear2read_000928.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000929", "originalText": "मानसीर्वासनाः पूर्वं त्यक्त्वा विषयवासनाः। मैत्र्यादिभावनानाम्नीर्गृहाणामलवासनाः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000929.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000930", "originalText": "ता अप्यन्तः परित्यज्य ताभिर्व्यवहरन्नपि। अन्तः शान्ततमस्नेहो भव चिन्मात्रवासनः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000930.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000931", "originalText": "तामप्यन्तः परित्यज्य मनोबुद्धिसमन्विताम्। शेषे स्थिरसमासीनो येन त्यजसि तत्त्यज''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000931.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000932", "originalText": "— (लघुयोगवासिष्ठे १८.२०—२३) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000932.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000933", "originalText": "अत्र मानसवासनाशब्देन पूर्वोक्तास्तिस्रो लोकशास्त्रदेहवासना विवक्षिताः।", "padacchedaText": "", "audioFile": "PB_hear2read_000933.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000934", "originalText": "विषयवासनाशब्देन दम्भदर्पाद्यासुरसम्पद्विवक्षिता।", "padacchedaText": "", "audioFile": "PB_hear2read_000934.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000935", "originalText": "मृदुतीव्रत्वे तद्विवक्षाभेदकारणे।", "padacchedaText": "", "audioFile": "PB_hear2read_000935.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000936", "originalText": "यद्वा शब्दस्पर्शरूपरसगन्धा विषयाः, तेषां काम्यमानत्वदशाजन्यः संस्कारो मानसवासना।", "padacchedaText": "", "audioFile": "PB_hear2read_000936.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000937", "originalText": "भुज्यमानत्वदशाजन्यः संस्कारो विषयवासना।", "padacchedaText": "", "audioFile": "PB_hear2read_000937.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000938", "originalText": "अस्मिन्पक्षे पूर्वोक्तानां चतसृणामनयोरेवान्तर्भावः, अन्तर्बाह्यव्यतिरेकेण वासनान्तरासम्भवात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000938.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000939", "originalText": "ननु वासनायाः परित्यागः कथं घटते? न हि तासां मूर्तिरस्ति सम्मार्जनीसमूहितधूलितृणवद्धस्तेनोद्धृत्य बहिस्त्यक्ष्यामः।", "padacchedaText": "", "audioFile": "PB_hear2read_000939.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000940", "originalText": "मैवम्, उपवासजागरणवत्तदुपपत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000940.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000941", "originalText": "स्वभावप्राप्तयोर्भुजिक्रियानिद्रयोरमूर्तत्वेऽपि तत्परित्यागरूपे उपवासजागरणे सर्वैरप्यनुष्ठीयेते, तद्वदत्राप्यस्तु।", "padacchedaText": "", "audioFile": "PB_hear2read_000941.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000942", "originalText": "``अद्य स्थित्वा निराहारं'' ** इत्यादिमन्त्रेण सङ्कल्पं कृत्वा सावधानत्वेनावस्थानं तत्र त्याग इति चेत्,\n** अद्य स्थित्वा निराहारः सर्वभोगविवर्जितः। श्वो भक्ष्ये पुण्डरीकाक्ष शरणं मे भवाच्युत॥", "padacchedaText": "", "audioFile": "PB_hear2read_000942.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000943", "originalText": "—पद्मपुराणे उत्तरखण्डे (६) ६१.२३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000943.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000944", "originalText": "अत्रापि न तद्दण्डनिवारितम्, प्रेषमन्त्रेण सङ्कल्प्याप्रमत्तत्वेनावस्थातुं शक्यत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000944.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000945", "originalText": "वैदिकमन्त्रानधिकारिणां तु भाषया सङ्कल्पोऽस्तु।", "padacchedaText": "", "audioFile": "PB_hear2read_000945.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000946", "originalText": "यदि तत्र शाकसूपौदनादिसन्निधित्यागस्तर्ह्यत्रापि स्रक्चन्दनवनितासन्निधिपरित्यागोऽस्तु।", "padacchedaText": "", "audioFile": "PB_hear2read_000946.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000947", "originalText": "अथ तत्र बुभुक्षानिद्रालस्यादिविस्मारकैः पुराणश्रवणदेवपूजा—नृत्यगीतवादित्रादिभिश्चित्तमुपलाल्येत, तर्ह्यत्रापि मैत्र्यादिभिस्तदुपलालयेत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000947.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000948", "originalText": "मैत्र्यादयश्च पतञ्जलिना सूत्रिताः— ``मैत्रीकरुणामुदितोपेक्षाणां सुखदुःखपुण्यापुण्यविषयाणां भावनातश्चित्तप्रसादनं'' (१.३३) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000948.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000949", "originalText": "चित्तं हि रागद्वेषपुण्यपापैः कलुषीक्रियते।", "padacchedaText": "", "audioFile": "PB_hear2read_000949.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000950", "originalText": "रागद्वेषौ च पतञ्जलिः सूत्रयामास— ``सुखानुशयी रागः'' (२.७), ``दुःखानुशयी द्वेषः'' (२.८) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000950.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000951", "originalText": "स्वेनानुभूयमानं सुखमनुशेते कश्चिद्धीवृत्तिविशेषः ``सुखजातीयं मे सर्वं भूयात्'' इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000951.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000952", "originalText": "तच्च दृष्टादृष्टसामग्य्रभावान्न सम्पादयितुं शक्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000952.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000953", "originalText": "अतः स रागश्चित्तं कलुषीकरोति।", "padacchedaText": "", "audioFile": "PB_hear2read_000953.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000954", "originalText": "यदा सुखष्वयं मैत्रीं भावयेत् ``सर्वेऽप्येते सुखिनो मदीयाः'' इति, तदा तत्सुखं स्वकीयमेव सम्पन्नमिति भावयतस्तत्र रागो निवर्तते, यथा स्वस्य राज्याभावेऽपि पुत्रादिराज्यमेव स्वकीयं राज्यं तद्वत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000954.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000955", "originalText": "निवृत्ते च रागे वर्षास्वतीतासु शरत्सरिदिव चित्तं प्रसीदति।", "padacchedaText": "", "audioFile": "PB_hear2read_000955.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000956", "originalText": "तथा दुःखमनुशेते कश्चित्प्रत्ययः ``ईदृशं सर्वं दुःखं सर्वदा मे मा भूत्'' इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000956.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000957", "originalText": "तच्च रोगशत्रुव्याघ्रादिषु सत्सु न निवारयितुं शक्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000957.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000958", "originalText": "न च सर्वे दुःखहेतवो हन्तुं शक्यन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000958.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000959", "originalText": "ततः स द्वेषः सदा हृदयं दहति।", "padacchedaText": "", "audioFile": "PB_hear2read_000959.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000960", "originalText": "यदा स्वस्येव परेषां सर्वेषां प्रतिकूलं दुःखं मा भूदित्यनेन प्रकारेण करुणां दुःखिषु प्राणिषु भावयेत् तदा वैर्यादिद्वेषनिवृत्तौ चित्तं प्रसीदति।", "padacchedaText": "", "audioFile": "PB_hear2read_000960.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000961", "originalText": "अत एव स्मर्यते—\n``प्राणा यथात्मनोऽभीष्टा भूतानामपि ते तथा। आत्मौपम्येन भूतानां दयां कुर्वन्ति साधवः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000961.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000962", "originalText": "— (महाभारते १३.११६.२१—२२**)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000962.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000963", "originalText": "(**आत्मौपम्येन गन्तव्यं बुद्धिमद्मिर्महात्मभिः)\nतत्प्रकारं च महान्तो दर्शयन्ति—\n``सर्वेऽत्र सुखिनः सन्तु सर्वे सन्तु निरामयाः। सर्वे भद्राणि पश्यन्तु मा कश्चिद्दुःखमाप्नुयात्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000963.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000964", "originalText": "इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000964.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000965", "originalText": "तथा हि प्राणिनः स्वभावत एव पुण्य नानुतिष्ठन्ति, पापं त्वनुतिष्ठन्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000965.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000966", "originalText": "तदाहुः—\n``पुण्यस्य फलमिच्छन्ति पुण्यं नेच्छन्ति मानवाः। न पापफलमिच्छन्ति पापं कुर्वन्ति यत्नतः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000966.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000967", "originalText": "इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000967.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000968", "originalText": "ते च पुण्यपापे पश्चात्तापं जनयतः।", "padacchedaText": "", "audioFile": "PB_hear2read_000968.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000969", "originalText": "स च तापः श्रुत्यानूद्यते— ``किमहं साधु नाकरवम्, किमहं पापमकरवम्'' (तै० उप० २.९) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000969.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000970", "originalText": "यद्यसौ पुण्यपुरुषेषु मुदितां भावयेत् तदा तद्वासनया स्वयमेवाप्रमत्तः पुण्येषु प्रवर्तेत।", "padacchedaText": "", "audioFile": "PB_hear2read_000970.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000971", "originalText": "तथा पापिषूपेक्षां भावयन् स्वयमपि पापान्निवर्तेत।", "padacchedaText": "", "audioFile": "PB_hear2read_000971.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000972", "originalText": "अतः पश्चात्तापस्याभावेन चित्तं प्रसीदति।", "padacchedaText": "", "audioFile": "PB_hear2read_000972.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000973", "originalText": "सुखिषु मैत्रीं भावयतो न केवलं रागनिवृत्तिः किं त्वसूयेर्ष्यादयोऽपि निवर्तन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000973.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000974", "originalText": "गुणेषु दोषाविष्करणमसूया, परगुणानामसहनमीर्ष्या।", "padacchedaText": "", "audioFile": "PB_hear2read_000974.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000975", "originalText": "यदा मैत्रीवशात्परकीयं सुखं स्वकीयमेव सम्पद्यते, तदा कथमसूयादिकंसम्भवेत्? एवं दोषान्तरनिवृत्तिरपि यथायोगमुन्नेया।", "padacchedaText": "", "audioFile": "PB_hear2read_000975.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000976", "originalText": "दुःखिषु करुणां भावयतः शत्रुधादिकरो द्वेषो यदा निवर्तते, तदा दुःखित्वप्रतियोगिकस्वसुखित्वप्रयुक्तो दर्पोऽपि निवर्तते।", "padacchedaText": "", "audioFile": "PB_hear2read_000976.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000977", "originalText": "स च दर्प आसुरसम्पद्यहङ्कार प्रस्तावे पूर्वं निरूपितः—\n``ईश्वरोऽहमहं भोगी सिद्धोऽहं बलवान्सुखी''।", "padacchedaText": "", "audioFile": "PB_hear2read_000977.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000978", "originalText": "``आढ्योऽभिजनवानस्मि कोऽन्योस्तिसदृशो मया''। — (भगवद्गीतायां १६.१४, १५) इत्यादि॥", "padacchedaText": "", "audioFile": "PB_hear2read_000978.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000979", "originalText": "ननु पुण्यात्मसु मुदितां भावयतः पुण्यप्रवृत्तिः फलत्वेनोक्ता, सा च योगिनो न युक्ता, मलिनायां शास्त्रवासनायां पुण्यमन्तर्भाव्य पूर्वमुदाहृतत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000979.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000980", "originalText": "मैवम्, पुनर्जन्मकारणस्य काम्येष्टापूतदिस्तत्र मलिनत्वेनोदाहरणात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000980.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000981", "originalText": "इह तु योगाभ्यासजन्यमशुक्लाकृष्णत्वेन जन्मानापादकं पुण्यं विवक्षितम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000981.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000982", "originalText": "अशुक्लाकृष्णत्वं पतञ्जलिः सूत्रयामास—\n``कर्माशुक्लकृष्णं योगिनस्त्रिविधमितरेषां'' (४.७) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000982.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000983", "originalText": "काम्यं कर्म विहितत्वाच्छुक्लम्, निषिद्धं कृष्णम्, मिश्रं शुक्लकृष्णम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000983.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000984", "originalText": "तदेतत्त्रयमितरेषामयोगिनां सम्पद्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000984.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000985", "originalText": "तच्च त्रिविधं जन्म प्रयच्छति।", "padacchedaText": "", "audioFile": "PB_hear2read_000985.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000986", "originalText": "तदाहुर्विश्वरूपाचार्याः—\n``शुभैः प्राप्नोति देवत्वं निषिद्धैर्नारकीं गतिम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000986.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000987", "originalText": "उभाभ्यां पुण्यपापाभ्यां मानुष्यं लभतेऽवशः''। — (नैष्कर्म्यसिद्धौ १.४१) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000987.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000988", "originalText": "ननु योगस्यानिषिद्धत्वादकृष्णत्वेऽपि विहितत्वाच्छुक्लत्वमिति चेत्,\nमैवम्, अकाम्यत्वाभिप्रायेणाशुक्लत्वाभिधानात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000988.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000989", "originalText": "अतोऽशुक्लकृष्णे पुण्ये प्रवृत्तिर्योगिनोऽपेक्षिता।", "padacchedaText": "", "audioFile": "PB_hear2read_000989.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000990", "originalText": "ननु योगिनोऽप्यनेन न्यायेन यथोचितं पुण्यात्मसु मुदितां भावयित्वा पुण्येष्वेव प्रवर्तेरन्निति चेत्,\nप्रवर्तन्तां नाम, ये मैत्र्यादिभिश्चित्तं प्रसादयन्ति तेषामेव योगित्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000990.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000991", "originalText": "मैत्र्यादिचतुष्टयमुपलक्षणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000991.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000992", "originalText": "तेन ``अभयं सत्त्वसंशुद्धिः'' (भगवद्गीतायां १६.१) इत्यादिदैवसम्पत् ``अमानित्वमदम्भित्वम्'' (तत्रैव १३.७) इत्यादि ज्ञानसाधनानि जीवन्मुक्तस्थितप्रज्ञादिवचनोक्ता धर्माश्चोपलक्ष्यते, सर्वेषामेतेषां शुभवासना—रूपत्वेन मलिनवासनानिवर्तकत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000992.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000993", "originalText": "ननु सन्त्यनन्ताः शुभवासनाः, न चैकेन ताः सर्वा अभ्यसितुं शक्यन्ते, निरर्थकश्च तदभ्यासप्रयास इति चेत्,\nन, तन्निवर्त्यानामनन्तानां मलिनवासनानामेकस्य मनस्यसम्भवात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000993.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000994", "originalText": "न ह्यायुर्वेदोक्तानि सर्वाण्यौषधान्येकेन सेवितुं शक्यन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000994.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000995", "originalText": "नापि तन्निवर्त्याः सर्वे रोगा एकस्य देहे सम्भवन्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000995.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000996", "originalText": "एवं तर्हि स्वचित्तं प्रथमतः परीक्ष्य तत्र यदा यावत्यो मलिनवासनास्तदा तावतीर्विरोधिनीः शुभवासना अभ्यस्येत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000996.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000997", "originalText": "यथा पुत्रमित्रकलत्रादिभिः पीड्यमानस्ततो विरक्तस्तन्निवर्तकं पारिव्राज्यं गृह्णाति, तथा विद्यामदधनमदकुलाचारमदादिमलिनवासनाभिः पीड्यमानस्तद्विरोधिनं विवेकमभ्यस्येत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000997.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000998", "originalText": "स च विवेको जनकेन दर्शितः—\n``अद्य ये महतां मूर्ध्नि ते दिनैर्निपतन्त्यधः। हन्त चित्त महत्तायाः कैषा विश्वस्तता तव''॥", "padacchedaText": "", "audioFile": "PB_hear2read_000998.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_000999", "originalText": "— (लघुयोगवासिष्ठे १९.३९)॥", "padacchedaText": "", "audioFile": "PB_hear2read_000999.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001000", "originalText": "``क्व धनानि महीपानां ब्रह्मणः क्व जगन्ति वा। प्राक्तनानि प्रयातानि केयं विश्वस्तता तव॥ १५०॥", "padacchedaText": "", "audioFile": "PB_hear2read_001000.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001001", "originalText": "कोटयो ब्रह्मणां याता गताः स्वर्गपरम्पराः।", "padacchedaText": "", "audioFile": "PB_hear2read_001001.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001002", "originalText": "प्रयाताः पांसुवद्भूपाः का धृतिर्मम जीविते''। — (तत्रैव १९.४१, ४२)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001002.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001003", "originalText": "``येषां निमेषणोन्मेषौ जगतः प्रलयोदयौ। तादृशाः पुरुषा नष्टा मादृशां गणनैव का''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001003.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001004", "originalText": "— (तत्रैव १९.४९) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001004.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001005", "originalText": "नन्वयमपि विवेकस्तत्त्वज्ञानोदयात्प्राचीनः नित्यानित्यवस्तुविवेकादिसाधनव्यतिरेकेण ब्रह्मज्ञाना—सम्भवात्, इह तूत्पन्नब्रह्मसाक्षात्कारस्य जीवन्मुक्तये वासनाक्षयादिसाधनं वक्तुमुपक्रान्तं अतः किमिदमकाण्डे ताण्डवमिति चेत्।", "padacchedaText": "", "audioFile": "PB_hear2read_001005.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001006", "originalText": "नायं दोषः।", "padacchedaText": "", "audioFile": "PB_hear2read_001006.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001007", "originalText": "साधनचतुष्टयसम्पन्नस्य पश्चाद्ब्रह्मज्ञानमित्येष सर्वपुरुषसाधारणः प्रौढो राजमार्गः।", "padacchedaText": "", "audioFile": "PB_hear2read_001007.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001008", "originalText": "जनकस्य\nतु पुर्वपुण्यपुञ्जपरिपाकेणाकाशफलपातवदकस्मात्सिद्धगीताश्रवणमात्रेण तत्त्वज्ञानमुत्पन्नम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001008.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001009", "originalText": "ततश्च चित्तविश्रान्तये विवेकोऽयं क्रियते इति काण्ड वेदमुचितं ताण्डवम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001009.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001010", "originalText": "नन्वेवमप्यस्य विवेकस्य ज्ञानसमनन्तरभावित्वेन मलिनवासनानुवृत्यभावाच्छुद्धवासनाभ्यासो नापेक्षित इति चेत्,\nन, जनकस्य तदनुवृत्त्यभावेऽपि याज्ञवल्क्यभगीरथादेस्तदनुवृत्तिदर्शनात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001010.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001011", "originalText": "अस्ति हि याज्ञवल्क्यस्य तत्प्रतिवादिनामुषस्तकहोलादीनां च भूयान्विद्यामदः, तैः सर्वैरपि विजिगीषुकथायां प्रवृत्तत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001011.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001012", "originalText": "ननु तेषां विद्यान्तरमेवास्ति न तु ब्रह्मविद्येति चेत्,\nन, कथागतयोः प्रश्नोत्तरयोर्ब्रह्मविषयत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001012.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001013", "originalText": "ननु ब्रह्मविषयत्वेऽपि तेषामापाततो ज्ञानमेव न तु सम्यग्वेदनमिति चेत्,\nन, तथा सत्यस्माकमपि तदीयवाक्यैरुत्पन्नाया ब्रह्मविद्याया असम्यक्त्वप्रसङ्गात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001013.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001014", "originalText": "ननु सम्यक्त्वेऽपि परोक्षज्ञानमेवेति चेत्,\nन, ``यत्साक्षादपरोक्षाद्ब्रह्म'' (बृ० उप० ३.४.१) इति मुख्यापरोक्षविषयतयैव विशेषतः प्रश्नोपलम्भात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001014.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001015", "originalText": "नन्वात्मज्ञानिनो विद्यामद आचार्यैर्नाभ्युपगम्यते, तथा चोपदेशसाहस्यामभिहितं\n``ब्रह्मवित्त्वं तथा मुक्त्वा स आत्मज्ञो न चेतरः''।", "padacchedaText": "", "audioFile": "PB_hear2read_001015.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001016", "originalText": "(१२.१३) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001016.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001017", "originalText": "नैष्कर्म्यसिद्धावपि—\n``न चाध्यात्माभिमानोऽपि विदुषोऽस्त्यासुरत्वतः। विदुषोऽप्यासुरश्चेत्स्यान्निष्फलं ब्रह्मदर्शनम्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001017.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001018", "originalText": "(१.७५) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001018.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001019", "originalText": "इति चेत्,\nनायं दोषः।", "padacchedaText": "", "audioFile": "PB_hear2read_001019.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001020", "originalText": "जीवन्मुक्तिपर्यन्तस्य तत्त्वज्ञानस्य तत्र विवक्षितत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001020.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001021", "originalText": "न खलु वयमपि जीवन्मुक्तानां विद्यामदमभ्युपगच्छामः।", "padacchedaText": "", "audioFile": "PB_hear2read_001021.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001022", "originalText": "ननु विजिगीषोरात्मबोध एव नास्ति,\n``रागो लिङ्गमबोधस्य चित्तव्यायामभूमिषु। कुतः शाद्वलता तस्य यस्याग्निः कोटरे तरोः॥", "padacchedaText": "", "audioFile": "PB_hear2read_001022.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001023", "originalText": "— (नैष्कर्म्य सिद्धौ ४.६७)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001023.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001024", "originalText": "इत्याचार्यैरभ्युपगमादिति चेत्,\nन।", "padacchedaText": "", "audioFile": "PB_hear2read_001024.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001025", "originalText": "``रागादयः सन्तु कामं न तद्भावोऽपराध्यति''। — (बृहदारण्योपनिषद्भाष्यवार्त्तिके १.४.१५३९)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001025.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001026", "originalText": "``उत्खातदंष्ट्ररोरगवदविद्या किं करिष्यति''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001026.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001027", "originalText": "— (तत्रैव १.४.१७४६)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001027.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001028", "originalText": "इत्यत्र तैरेव रागाद्यभ्युपगमात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001028.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001029", "originalText": "न चात्र परस्परव्याहतिः, स्थितप्रज्ञे ज्ञानिमात्रे च वचनद्वयस्य व्यवस्थापनोपयुक्तत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001029.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001030", "originalText": "ननु ज्ञानिनो रागाद्यभ्युपगमे धर्माधर्मद्वारेण जन्मान्तरप्रसङ्ग इति चेत्,\nमैवम्, अदग्धबीजवदविद्यापूर्वककामादेरेव मुख्यरागादित्वेन पुनर्जन्महेतुत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001030.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001031", "originalText": "ज्ञानिनस्तु दग्धबीजवदाभासमात्रा एव रागादयः।", "padacchedaText": "", "audioFile": "PB_hear2read_001031.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001032", "originalText": "एतदेवाभिप्रेत्योक्तं—\n``उत्पद्यमाना रागाद्या विवेकज्ञानवह्निना। तदा तदैव दह्यन्ते कुतस्तेषां प्ररोहणम्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001032.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001033", "originalText": "— (वराहोपनिषदि ३.२४.२५) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001033.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001034", "originalText": "तर्हि स्थितप्रज्ञस्यापि ते सन्त्विति चेत्,\nन, तत्काले मुख्यवदेवाभासमानानां बाधकत्वात्, रज्जुसर्पोऽपि मुख्यसर्पवदेव तदानीं भीषयन्नुपलभ्यते, तद्वत्।", "padacchedaText": "", "audioFile": "PB_hear2read_001034.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001035", "originalText": "तर्ह्याभासत्वानुसन्धानानुवृत्तौ न कोऽपि बाध इति चेत्,\nचिरं जीवतु भवान्।", "padacchedaText": "", "audioFile": "PB_hear2read_001035.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001036", "originalText": "इयमेवास्मदभिमता जीवन्मुक्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_001036.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001037", "originalText": "याज्ञवल्क्यस्तु विजिगीषुदशायां पं न हीदृशः, चित्तविश्रान्तये विद्वत्संन्यासस्य तेन करिष्यमाणत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001037.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001038", "originalText": "न केवलमस्य विजिगीषा किन्तु धनतृष्णापि महती जाता, यतो, बहूनां ब्रह्मविदां पुरतः स्थापितं सालङ्कारं गोसहस्रमपहृत्य स्वयमेवेदमाह— ``नमो वयं ब्रह्मिष्ठाय कुर्मो गोकामा एव वयं स्मः'' (बृ० उप० ३.१.२) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001038.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001039", "originalText": "इतरान् ब्रह्मविदोऽवज्ञातुमियं काचिद्वचोभङ्गीति चेत्।", "padacchedaText": "", "audioFile": "PB_hear2read_001039.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001040", "originalText": "अयमपि तर्ह्यपरो दोषः।", "padacchedaText": "", "audioFile": "PB_hear2read_001040.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001041", "originalText": "इतरे च ब्रह्मविदः स्वकीयं धनमनेनापहृतमितिमत्वा चुक्रुधः।", "padacchedaText": "", "audioFile": "PB_hear2read_001041.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001042", "originalText": "अयं च क्रोधपरवशः शाकल्यं शापेन मारयामास।", "padacchedaText": "", "audioFile": "PB_hear2read_001042.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001043", "originalText": "न चास्य ब्रह्मघ्नो मोक्षाभावः शङ्कनीयः।", "padacchedaText": "", "audioFile": "PB_hear2read_001043.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001044", "originalText": "यतः कौषीतकिनः समामनन्ति— ``नास्य केन च कर्मणा लोको मीयते न मातृवधेन न पितृवधेन न स्तेयेन न भ्रूणहत्यया'' (३.१) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001044.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001045", "originalText": "शेषोऽपि स्वकृतायामार्यापञ्चाशीत्यामिदगाह—\n``हयमेधशतसहस्राण्यथ कुरुते ब्रह्मघातलक्षाणि। परमार्थवित्र पुण्यैर्न च पापैः स्पृश्यते विमलः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001045.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001046", "originalText": "— (परमार्थसारे ७७) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001046.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001047", "originalText": "तस्मात्किं बहुना, ब्रह्मविदां याज्ञवल्क्यादीनामस्त्येव मलिनवासनानुवृत्तिः, भगीरथस्तु तत्त्वं विदित्वापि राज्यं पालयन्मलिनवासनाभिश्चित्तविश्रान्त्यभावे सति सर्वं परित्यज्य पश्चाद्विश्रान्तवानिति वसिष्ठेनोपाख्यायते।", "padacchedaText": "", "audioFile": "PB_hear2read_001047.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001048", "originalText": "अतः स्वकीयं वर्तमानं मलिनवासनादोषं परकीयदोषवत्सम्यगुत्प्रेक्ष्य तत्प्रतीकारमभ्यस्येत्।", "padacchedaText": "", "audioFile": "PB_hear2read_001048.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001049", "originalText": "अनेनैवाभिप्रायेण स्मर्यते—\n``यथा सुनिपुणः सम्यक्परदोषेक्षणे रतः। तथा चेन्निपुणः स्वेषु को न मुच्येत बन्धनात्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001049.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001050", "originalText": "— (वराहोपनिषदि ३.२५) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001050.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001051", "originalText": "नन्वादौ तावद्विद्यामदस्य कः प्रतीकार इति चेत्,\nकिं स्वनिष्ठस्य परविषयस्य मदस्य, किंवा स्वविषयस्य परनिष्ठस्य? आद्ये भङ्गोऽवश्यं क्वचिद्भविष्यतीति निरन्तरं भावयेत्।", "padacchedaText": "", "audioFile": "PB_hear2read_001051.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001052", "originalText": "तद्यथा श्वेतकेतुर्विद्यया मत्तः प्रवाहणस्य राज्ञः सभां गत्वा तेन पञ्चाग्निविद्यायां पृष्टायां स्वयमजानानो निरुत्तरो राज्ञा बहुधा भर्त्सितः पितुः समीपमागत्य स्वनिर्वेदमुदाजहार।", "padacchedaText": "", "audioFile": "PB_hear2read_001052.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001053", "originalText": "पिता तु निर्मदस्तमेव राजानमनुसृत्य तां विद्यां लेभे।", "padacchedaText": "", "audioFile": "PB_hear2read_001053.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001054", "originalText": "दृप्तबालाकिश्चाजातशत्रुणा राज्ञा भर्त्सितो दर्पं सन्त्यज्य राजानमुपससाद।", "padacchedaText": "", "audioFile": "PB_hear2read_001054.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001055", "originalText": "उषस्तकहोलादयश्च मदेन कथां कृत्वा पराजिताः।", "padacchedaText": "", "audioFile": "PB_hear2read_001055.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001056", "originalText": "यदा स्वविषयः परनिष्ठो मदः प्रवर्तेत तदा मत्तः स परो मां निन्दतु, अवमन्यतां वा सर्वथापि न मे हानिरिति भावयेत्।", "padacchedaText": "", "audioFile": "PB_hear2read_001056.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001057", "originalText": "तथा हि—\n``आत्मानं यदि निन्दन्ति निन्दन्ति स्वयमेव हि। शरीरं यदि निन्दन्ति सहायास्ते मता मम॥", "padacchedaText": "", "audioFile": "PB_hear2read_001057.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001058", "originalText": "निन्दावमानावत्यन्तं भूषणं यस्य योगिनः।", "padacchedaText": "", "audioFile": "PB_hear2read_001058.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001059", "originalText": "विक्षेपः कथं तस्य वाचाटैः क्रियतामिह''।", "padacchedaText": "", "audioFile": "PB_hear2read_001059.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001060", "originalText": "इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001060.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001061", "originalText": "नैष्कर्म्यसिद्धौ—\n``वर्चस्के सम्परित्यक्ते दोषतश्चावधारिते। यदि दोषं वदेत् तस्मै किं तत्रोच्चरितुर्भवेत्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001061.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001062", "originalText": "(२.१६)।", "padacchedaText": "", "audioFile": "PB_hear2read_001062.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001063", "originalText": "``तद्वत्स्थूले तथा सूक्ष्मे देहे त्यक्ते विवेकतः। यदि दोषं वदेत् ताभ्यां किं तत्र विदुषो भवेत्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001063.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001064", "originalText": "(२.१७)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001064.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001065", "originalText": "``शोकहर्षभयक्रोधलोभमोहस्पृहादयः। अहङ्कारस्य दृश्यन्ते जन्म मृत्युश्च नात्मनः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001065.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001066", "originalText": "— (भागवते ११.२८.१६) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001066.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001067", "originalText": "निन्दाया भूषणत्वं च ज्ञानाङ्कुशे दर्शितम्—\n``मन्निन्दया यदि जनः परितोषमेति\nनन्वप्रयत्नसुलभोऽयमनुग्रहो मे। श्रेयोर्थिनो हि पुरुषाः परतुष्टिहेतो—\nदुःखार्जितान्यपि धनानि परित्यजन्ति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001067.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001068", "originalText": "सततसुलभदैन्ये निःसुखे जीवलोके\nयदि मम परिवादात् प्रीतिमाप्नोति कश्चित्। परिवदतु यथेष्टं मत्समक्षं तिरो वा\nजगति हि बहुदुःखे दुर्लभः प्रीतियोगः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001068.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001069", "originalText": "इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001069.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001070", "originalText": "अवमानस्य भूषणत्वं स्मर्यते—\n``तथा चरेत वै योगी सतां धर्ममदूषयन्। जना यथावमन्येरन् गच्छेयुर्नैव सङ्गतिम्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001070.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001071", "originalText": "— (नारदपरि. उप०.५.३०) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001071.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001072", "originalText": "याज्ञवल्क्योषस्तादीनां यौ स्वनिष्ठपरनिष्ठौ विद्यामदौ तयोर्यथा विवेकेन प्रतीकारस्तथा धनाभिलाषक्रोधयोरप्यवगन्तव्यः।", "padacchedaText": "", "audioFile": "PB_hear2read_001072.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001073", "originalText": "``अर्थानामर्जने क्लेशस्तथैव परिपालने। नाशे दुःखं व्यये दुःखं धिगर्थान्क्लेशकारिणः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001073.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001074", "originalText": "इति धनविषये विवेकः॥", "padacchedaText": "", "audioFile": "PB_hear2read_001074.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001075", "originalText": "(अर्थानामर्जने दुःखमर्जितानां च रक्षणे। नाशे दुःखं व्यये दुःखं धिगर्थं दुःखभाजनम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_001075.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001076", "originalText": "— महाभारत)\nक्रोधोऽपि द्विविधः— स्वनिष्ठः परविषयः, परनिष्ठः स्वविषयश्चेति।", "padacchedaText": "", "audioFile": "PB_hear2read_001076.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001077", "originalText": "तत्र स्वनिष्ठं परविषयं प्रत्येवमुक्तम्—\n``अपकारिणि कोपश्चेत् कोपः कोपे कथं न ते। धर्मार्थकाममोक्षाणां प्रसह्य परिपन्थिनि''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001077.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001078", "originalText": "— (याज्ञवल्क्योपनिषदि २०)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001078.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001079", "originalText": "``फलार्थिनो धर्मयशोर्थनाशनः\nस चेदपार्थः, स्वशरीरतापनः। न चेह नामुत्र हिताय यः सतां\nमनांसि कोपः समुपाश्रयेत् कथम्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001079.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001080", "originalText": "इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001080.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001081", "originalText": "स्वविषयं परनिष्ठं प्रत्येवमीरितं—\n``न मेऽपराधः किमकारणे नृणां\nमदभ्यसूयेत्यपि नैव चिन्तयेत्। न यत्कृता प्राग्भवबन्धनिष्कृति—\nस्ततोऽपराधः परमोऽनुचिन्त्यताम्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001081.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001082", "originalText": "``नमोऽस्तु कोपदेवाय स्वाश्रयज्वालिने भृशम्। कोप्यस्य मम वैराग्यदायिने दोषबोधिने''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001082.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001083", "originalText": "इति। — (याज्ञवल्क्योपनिषदि २१)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001083.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001084", "originalText": "धनाभिलाषक्रोधवद्योषित्पुत्राभिलाषावपि विवेकेन निवर्तनीयौ।", "padacchedaText": "", "audioFile": "PB_hear2read_001084.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001085", "originalText": "तत्र योषिद्विवेको वसिष्ठेन दर्शितः—\n``मांसपाञ्चालिकायास्तु यन्त्रलोलेऽङ्गपञ्जरे। स्नाय्वस्थिग्रन्थिशालिन्याः स्त्रियाः किमिव शोभनम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_001085.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001086", "originalText": "— (लघुयोगवासिष्ठे २.९०)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001086.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001087", "originalText": "``त्वङ्मांसरक्तवाष्पाम्बु पृथक्कृत्वा विलोचने। समालोकय रम्ये चेत् किं मुधा परिमुह्यसि॥ २.९१॥", "padacchedaText": "", "audioFile": "PB_hear2read_001087.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001088", "originalText": "``मेरुश‍ृङ्गतटोल्लासिगङ्गाजलरयोपमा। दृष्टा यस्मिन्स्तने मुक्ताहारस्योल्लासशालिता॥ २.९२॥", "padacchedaText": "", "audioFile": "PB_hear2read_001088.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001089", "originalText": "श्मशानेषु दिगन्तेषु स एव ललनास्तनः। श्वभिरास्वाद्यते काले लघुपिण्ड इवान्धसः॥ २.९३॥", "padacchedaText": "", "audioFile": "PB_hear2read_001089.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001090", "originalText": "``केशकज्जलधारिण्यो दुःस्पर्शा लोचनप्रियाः। दुष्कृताग्निशिखा नार्यो दहन्ति तृणवन्नरान्॥ २.९४॥", "padacchedaText": "", "audioFile": "PB_hear2read_001090.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001091", "originalText": "``ज्वलतामतिदूरेऽपि सरसा अपि नीरसाः। स्त्रियो हि नरकाग्नीनामिन्धनं चारु दारुणम्॥ २.९५॥", "padacchedaText": "", "audioFile": "PB_hear2read_001091.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001092", "originalText": "``कामनाम्ना किरातेन विकीर्णा मुग्धचेतसाम्। नार्यो नरविहङ्गानामङ्गबन्धनवागुराः॥ २.९६॥", "padacchedaText": "", "audioFile": "PB_hear2read_001092.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001093", "originalText": "``जन्मपल्वलमत्स्यानां चित्तकर्दमचारिणाम्। पुंसां दुर्वासनारज्जौ नारी बडिशपिण्डिका॥ २.९७॥", "padacchedaText": "", "audioFile": "PB_hear2read_001093.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001094", "originalText": "``सर्वेषां दोषरत्नानां सुसमुद्गिकयानया। दुःखश‍ृङ्खलया नित्यमलमस्तु मम स्त्रिया॥ २.९८॥", "padacchedaText": "", "audioFile": "PB_hear2read_001094.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001095", "originalText": "``इतो मांसमितो रक्तमितोऽस्थीनीति वासरैः। ब्रह्मन्कतिपयैरेव याति स्त्री विशरारुताम्॥ २.९९॥", "padacchedaText": "", "audioFile": "PB_hear2read_001095.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001096", "originalText": "``यस्य स्त्री तस्य भोगेच्छा निःस्त्रीकस्य क्व भोगभूः। स्त्रियं त्वक्त्वा जगत्त्यक्तं जगत्त्यक्त्वा सुखी भवेत्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001096.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001097", "originalText": "(२.१००)\nपुत्रविवेको ब्रह्मानन्दे दर्शितः—\n``अलभ्यमानस्तनयः पितरौ क्लेशयेच्चिरम्। लब्धोऽपि गर्भपातेन प्रसवेन च बाधते॥", "padacchedaText": "", "audioFile": "PB_hear2read_001097.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001098", "originalText": "— (पञ्चदश्यां १२.६५)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001098.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001099", "originalText": "``जातस्य ग्रहरोगादिः कुमारस्य च मूर्खता। उपनीते त्वविद्यत्वमनुद्वाहश्च पण्डिते॥ १२.६६॥", "padacchedaText": "", "audioFile": "PB_hear2read_001099.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001100", "originalText": "``पुनश्च परदारादिर्दारिद्रयं च कुटुम्बिनः। पित्रोर्दुःखस्य नास्त्यन्तो धनी चेन्द्रियते तदा''॥ १२.६७॥", "padacchedaText": "", "audioFile": "PB_hear2read_001100.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001101", "originalText": "— (पञ्चदश्यां १२.६५—६७) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001101.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001102", "originalText": "यथा विद्याधनक्रोधयोषित्पुत्रविषयाणां मलिनवासनानां विवेकेन प्रतीकारस्तथान्यासामपि वासनानां यथायोगं शास्त्रैः स्वयुक्त्या च दोषं विविच्य प्रतीकारं कुर्यात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001102.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001103", "originalText": "कृते च प्रतीकारे जीवन्मुक्तिलक्षणं परमं पदं लभ्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001103.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001104", "originalText": "तदाह वसिष्ठः—\n``वासनानां परित्यागे यदि यत्नं करोष्यलम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001104.mp3", "zipFile":
