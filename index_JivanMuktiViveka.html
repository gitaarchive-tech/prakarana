id": "B_001486", "originalText": "तस्मादत्रादरः कृतः।", "padacchedaText": "", "audioFile": "PB_hear2read_001486.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001487", "originalText": "अथ पञ्चमभूमिरूपो निरोधसमाधिर्निरूप्यते। तं च निरोधं सूत्रयति—\n``व्युत्थाननिरोधसंस्कारयोरभिभवप्रादुर्भावौ निरोधक्षणचित्तान्वयो निरोधपरिणामः''— (यो० सू०.३.९) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001487.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001488", "originalText": "व्युत्थानसंस्काराः समाधिविरोधिनः।", "padacchedaText": "", "audioFile": "PB_hear2read_001488.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001489", "originalText": "ते चोद्दालकस्य समाधावुदाहृताः—\n``कदाहं त्यक्तमनने पदे परमपावने। चिरं विश्रान्तिमेष्यामि मेरुश‍ृङ्ग इवाम्बुदः॥", "padacchedaText": "", "audioFile": "PB_hear2read_001489.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001490", "originalText": "— (लघुयोगवासिष्ठे २४.२९)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001490.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001491", "originalText": "``इति चिन्तापरवशो बलादुद्दालको द्विजः। पुनः पुनस्तूपविश्य ध्यानाभ्यासं चकार ह॥", "padacchedaText": "", "audioFile": "PB_hear2read_001491.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001492", "originalText": "— (तत्रैव २४.३५)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001492.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001493", "originalText": "``विषयैर्नीयमाने तु चित्ते मर्कटचञ्चले। न स ले समाधाने प्रतिष्ठां प्रीतिदायिनीम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_001493.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001494", "originalText": "— (तत्रैव २४.३६)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001494.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001495", "originalText": "``कदाचिद्बाह्यसंस्पर्शपरित्यागादनन्तरम्। तस्यागच्छच्चित्तकपिरान्तरस्पर्शसञ्चयान्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001495.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001496", "originalText": "— (तत्रैव २४.३७)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001496.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001497", "originalText": "``कदाचिदान्तरस्पर्शाद्बाह्यं विषयमाददे। तस्योड्डीय मनो याति कदाचित् त्रस्तपक्षिवत्॥", "padacchedaText": "", "audioFile": "PB_hear2read_001497.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001498", "originalText": "— (तत्रैव २४.३८)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001498.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001499", "originalText": "``कदाचिदुदितार्काभं तेजः पश्यति विस्तृतम्। कदाचित्केवलं व्योम कदाचिन्निबिडं तमः॥", "padacchedaText": "", "audioFile": "PB_hear2read_001499.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001500", "originalText": "— (तत्रैव २४.३९)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001500.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001501", "originalText": "``आगच्छतो यथाकामं प्रतिभासान् पुनः पुनः। अच्छिनन्मनसा शूरः खड्गेनेव रणे रिपून्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001501.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001502", "originalText": "— (तत्रैव २४.१०९)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001502.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001503", "originalText": "``विकल्पौघे समालूने सोऽपश्यद्धृदयाम्बरे। तमश्छन्नविवेकार्कं लोलकज्जलमेचकम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_001503.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001504", "originalText": "— (तत्रैव २४.११०)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001504.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001505", "originalText": "तदप्युत्सादयामास सम्यग्ज्ञानविवस्वता।", "padacchedaText": "", "audioFile": "PB_hear2read_001505.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001506", "originalText": "तमस्युपरते स्वान्ते तेजःपुञ्जं ददर्श सः। तल्लुलाव स्थलाब्जानां वनं बाल इव द्विपः॥", "padacchedaText": "", "audioFile": "PB_hear2read_001506.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001507", "originalText": "— (तत्रैव २४.१११)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001507.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001508", "originalText": "``तेजस्युपरते तस्य घूर्णमानं मनो मुनेः। निशाब्जवदगान्निद्रां तामप्याशु लुलाव सः॥", "padacchedaText": "", "audioFile": "PB_hear2read_001508.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001509", "originalText": "— (तत्रैव २४.११२)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001509.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001510", "originalText": "``निद्राव्यपगमे तस्य व्योमसंवित्समुद्ययौ।", "padacchedaText": "", "audioFile": "PB_hear2read_001510.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001511", "originalText": "व्योमसंविदि नष्टायां मूढं तस्याभवन्मनः।", "padacchedaText": "", "audioFile": "PB_hear2read_001511.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001512", "originalText": "मोहमप्येष मनसस्तं ममार्ज महाशयः। — (तत्रैव २४.११३)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001512.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001513", "originalText": "ततस्तेजस्तमोनिद्रामोहादिपरिवर्जिताम्। कामप्यवस्थामासाद्य विशश्राम मनः क्षणम्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001513.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001514", "originalText": "— (तत्रैव २४.११४) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001514.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001515", "originalText": "त एते व्युत्थानसंस्कारा निरोधहेतुना योगिप्रयत्नेन प्रतिदिनं प्रतिक्षणं चाभिभूयन्ते, तद्विरोधिनश्च निरोधसंस्काराः प्रादुर्भवन्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_001515.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001516", "originalText": "तथा सति निरोध एकैकस्मिन्क्षणे चित्तमनुगच्छति।", "padacchedaText": "", "audioFile": "PB_hear2read_001516.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001517", "originalText": "सोऽयमीदृशश्चित्तस्य निरोधपरिणामो भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_001517.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001518", "originalText": "ननु ``प्रतिक्षणपरिणामिनो हि भावा ऋते चितिशक्तेः'' (साङ्ख्यकौमुद्यां (५) ) इति न्यायेन चित्तस्य सर्वदा परिणामप्रवाहो वक्तव्यः।", "padacchedaText": "", "audioFile": "PB_hear2read_001518.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001519", "originalText": "बाढम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001519.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001520", "originalText": "तत्र व्युत्थितचित्तस्य वृत्तिप्रवाहः स्फुटः निरुद्धचित्तस्य तु कथमित्याशङ्क्योत्तरं सूत्रयति—\n``ततः प्रशान्तवाहिता संस्कारात्'' (यो० सू०.३.१०) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001520.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001521", "originalText": "यथा समिदाज्याहुतिप्रक्षेपे वह्निरुत्तरोत्तरवृद्ध्या प्रज्वलति, समिदादिक्षये प्रथमक्षणे किञ्चिच्छाम्यति, उत्तरोत्तरक्षणे शान्तिर्वर्धते।", "padacchedaText": "", "audioFile": "PB_hear2read_001521.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001522", "originalText": "तथा निरुद्धचित्तस्योत्तरोत्तराधिकः प्रशमः प्रवहति।", "padacchedaText": "", "audioFile": "PB_hear2read_001522.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001523", "originalText": "तत्र पूर्वपूर्वप्रशमजनितः संस्कार एवोत्तरोत्तरप्रशमस्य कारणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001523.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001524", "originalText": "तामेतां प्रशान्तवाहितां भगवान्विस्पष्टमुदाजहार—\n``यदा विनियतं चित्तमात्मन्येवावतिष्ठते। निःस्पृहः सर्वकामेभ्यो युक्त इत्युच्यते तदा॥", "padacchedaText": "", "audioFile": "PB_hear2read_001524.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001525", "originalText": "— (भगवद्गीतायां ६.१८)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001525.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001526", "originalText": "``यथा दीपो निवातस्थो नेङ्गते सोपमा स्मृता। योगिनो यतचित्तस्य युञ्जतो योगमात्मनः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001526.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001527", "originalText": "— (तत्रैव ६.१९)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001527.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001528", "originalText": "``यत्रोपरमते चित्तं निरुद्धं योगसेवया। यत्र चैवात्मनात्मानं पश्यन्नात्मनि तुष्यति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001528.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001529", "originalText": "— (तत्रैव ६.२०)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001529.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001530", "originalText": "``सुखमात्यन्तिकं यत्तद्बुद्धिग्राह्यमतीन्द्रियम्। वेत्ति यत्र न चैवायं स्थितश्चलति तत्त्वतः॥", "padacchedaText": "", "audioFile": "PB_hear2read_001530.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001531", "originalText": "— (तत्रैव ६.२१)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001531.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001532", "originalText": "``यं लब्ध्वा चापरं लाभं मन्यते नाधिकं ततः। यस्मिन्स्थितो न दुःखेन गुरुणापि विचाल्यते॥", "padacchedaText": "", "audioFile": "PB_hear2read_001532.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001533", "originalText": "— (तत्रैव ६.२२)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001533.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001534", "originalText": "``तं विद्याद् दुःखसंयोगवियोगं योगसंज्ञितम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_001534.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001535", "originalText": "स निश्चयेन योक्तव्यो योगोऽनिर्विण्णचेतसा''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001535.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001536", "originalText": "— (तत्रैव ६.२३) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001536.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001537", "originalText": "निरोधसमाधेः साधनं सूत्रयति—\n``विरामप्रत्ययाभ्यासपूर्वकः संस्कारशेषोऽन्यः'' (यो० सू०.१.१८) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001537.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001538", "originalText": "विरामो वृत्त्युपरमः, तस्य प्रत्ययः कारणं वृत्त्युपरमार्थः पुरुषप्रयत्नः, तस्याभ्यासः पौनःपुन्येन सम्पादनम्, तत्पूर्वकस्तज्जन्यः, अनन्तरातीतसूत्रे सम्प्रज्ञातसमाधेरुक्तत्वात् तदपेक्षयान्योऽसम्प्रज्ञातः समाधि।", "padacchedaText": "", "audioFile": "PB_hear2read_001538.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001539", "originalText": "तत्र वृत्तिरहितस्य चित्तस्वरूपस्य दुर्लक्ष्यत्त्वात् संस्काररूपेण चित्तं शिष्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001539.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001540", "originalText": "विरामप्रत्ययजन्यत्वं भगवान्विस्पष्टमाह—\n``सङ्कल्पप्रभवान्कामांस्त्यक्त्वा सर्वानशेषतः। मनसैवेन्द्रियग्रामं विनियम्य समन्ततः॥", "padacchedaText": "", "audioFile": "PB_hear2read_001540.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001541", "originalText": "— (भगवद्गीतायां ६.२४)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001541.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001542", "originalText": "``शनैः शनैरुपरमेदबुद्ध्या धृतिगृहीतया। आत्मसंस्थं मनः कृत्वा न किञ्चिदपि चिन्तयेत्॥", "padacchedaText": "", "audioFile": "PB_hear2read_001542.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001543", "originalText": "— (तत्रैव ६.२५)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001543.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001544", "originalText": "``यतो यतो निश्चरति मनश्चञ्चलमस्थिरम्। ततस्ततो नियम्यैतदात्मन्येव वशं नयेत्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001544.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001545", "originalText": "— (तत्रैव ६.२६) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001545.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001546", "originalText": "काम्यमानाः स्रक्चन्दनवनितापुत्रमित्रगृहक्षेत्रादयो मोक्षशास्त्रकुशलविवेकिजनप्रसिद्धैर्बहुभिर्दोषैरुपेता अप्यनाद्यविद्यावशात् तान्दोषानाच्छाद्य तेषु विषयेषु सम्यक्त्वं मनः कल्पयति।", "padacchedaText": "", "audioFile": "PB_hear2read_001546.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001547", "originalText": "तस्माच्च सङ्कल्पादिदं मे स्यादित्येवंरूपाः कामाः प्रभवन्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_001547.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001548", "originalText": "तथा च स्मर्यते—\n``सङ्कल्पमूलः कामो वै यज्ञाः सङ्कल्पसम्भवाः। ''— (मनुसंहितायां २.३)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001548.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001549", "originalText": "``काम जानामि ते मूलं सङ्कल्पात् किल जायसे। न त्वां सङ्कल्पयिष्यामि समूलस्त्वं विनङ्क्ष्यसि''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001549.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001550", "originalText": "— (महाभारते शान्तिपर्वणि १७१.२५) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001550.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001551", "originalText": "तत्र विवेकेन विषयदोषेषु साक्षात्कृतेषु शुना वान्ते पायस इव कामास्त्यज्यन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_001551.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001552", "originalText": "स्रक्चन्दनादिष्विव ब्रह्मलोकादिष्वणिमाद्यष्टैश्वर्येषु च कामास्त्याज्या इत्यभिप्रेत्य सर्वानित्युक्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001552.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001553", "originalText": "मासोपवासव्रतिना तस्मिन्मासेऽन्ने त्यक्तेऽपि कामः पुनः पुनरुदेति, तद्वन्मा भूदित्यशेषत इत्युक्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001553.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001554", "originalText": "कामत्यागे मनःपूर्वकप्रवृत्त्यभावेऽपि चक्षुरादीनां रूपादिषु या स्वभावसिद्धा प्रवृत्तिः सापि प्रयत्नयुक्तेन मनसैव नियन्तव्या।", "padacchedaText": "", "audioFile": "PB_hear2read_001554.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001555", "originalText": "देवतादर्शनादिष्वप्यननुसरणाय समन्तत इत्युक्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001555.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001556", "originalText": "भूमिकाजयक्रमेणोपरमस्य विवक्षितत्वाच्छनैः शनैरित्युक्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001556.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001557", "originalText": "ताश्च भूमिकाश्चतस्रः कठवल्लीषु श्रूयन्ते—\n``यच्छेद्वाङ्मनसी प्राज्ञस्तद्यच्छेज्ज्ञान आत्मनि। ज्ञानमात्मनि महति नियच्छेत्तद्यच्छेच्छान्त आत्मनि''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001557.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001558", "originalText": "— (कठ. उप०.१.३.१३) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001558.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001559", "originalText": "वाग्व्यापारो द्विविधः—लौकिको वैदिकश्च।", "padacchedaText": "", "audioFile": "PB_hear2read_001559.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001560", "originalText": "जल्पादिरूपो लौकिकः, जपादिरूपो वैदिकः।", "padacchedaText": "", "audioFile": "PB_hear2read_001560.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001561", "originalText": "तत्र लौकिकस्य बहुविक्षेपकरत्वाद् व्युत्थानकालेऽपि योगी तं परित्यजेत्।", "padacchedaText": "", "audioFile": "PB_hear2read_001561.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001562", "originalText": "अत एव स्मर्यते—\n``मौनं योगासनं योगस्तितिक्षैकान्तशीलता। निःस्पृहत्वं समत्वं च सप्तैतान्येकदण्डिनः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001562.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001563", "originalText": "— (नारद परि. उप०.४.२५) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001563.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001564", "originalText": "जपादिकं निरोधसमाधौ परित्यजेत्।", "padacchedaText": "", "audioFile": "PB_hear2read_001564.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001565", "originalText": "सेयं वाग्भूमिः प्रथमा।", "padacchedaText": "", "audioFile": "PB_hear2read_001565.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001566", "originalText": "तां भूमिं प्रयत्नमात्रेण कतिपयैर्दिनैर्मासैर्वत्सरैर्वा दृढं विजित्य पश्चाद्द्वितीयायां मनोभूमौ प्रयतेत, अन्यथा बहुभूमिकाप्रासादवत्प्रथमभूमिपातेनैवोपरितनयोगभूमयः सर्वा विनश्येयुः।", "padacchedaText": "", "audioFile": "PB_hear2read_001566.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001567", "originalText": "यद्यपि चक्षुरादयो निरोद्धव्याः, तथापि तेषां वाग्भूमौ मनोभूमौ वान्तर्भावो द्रष्टव्यः।", "padacchedaText": "", "audioFile": "PB_hear2read_001567.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001568", "originalText": "ननु वाचं मनसि नियच्छेदित्यनुपपन्नं, न हीन्द्रियस्येन्द्रियान्तरे प्रवेशोऽस्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_001568.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001569", "originalText": "मैवम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001569.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001570", "originalText": "प्रवेशस्याविवक्षितत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001570.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001571", "originalText": "नानाविक्षेपकारिणोर्वाङ्मनसयोर्मध्ये प्रथमतो वाग्व्यापारनियमनेन मनोव्यापारमात्रपरिशेष इह विवक्षितः।", "padacchedaText": "", "audioFile": "PB_hear2read_001571.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001572", "originalText": "गोमहिषाश्वादीनामिव वाङ्नियमे स्वाभाविके सम्पन्ने ततो ज्ञानात्मनि मनो नियच्छेत्।", "padacchedaText": "", "audioFile": "PB_hear2read_001572.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001573", "originalText": "आत्मा त्रिविधः, ज्ञानात्मा महात्मा शान्तात्मा चेति।", "padacchedaText": "", "audioFile": "PB_hear2read_001573.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001574", "originalText": "जानात्यत्र स्थित आत्मेति ज्ञातृत्वोपाधिरहङ्कारोऽत्र ज्ञानशब्देन विवक्षितः, करणस्य मनसो नियम्यत्वेन पृथगुपात्तत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001574.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001575", "originalText": "अहङ्कारो द्विविधः— विशेषरूपः सामान्यरूपश्चेति।", "padacchedaText": "", "audioFile": "PB_hear2read_001575.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001576", "originalText": "``अयमहमेतस्य पुत्र'' इत्येवं व्यक्तमभिमन्यमानो विशेषरूपः।", "padacchedaText": "", "audioFile": "PB_hear2read_001576.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001577", "originalText": "``अस्मि'' इत्येतावन्मात्रमभिमन्यमानः सामान्यरूपः स च सर्वव्यक्तिषु व्याप्तत्वात्महानित्युच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001577.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001578", "originalText": "ताभ्यामहङ्काराभ्यां द्वाभ्यामुपहितौ द्वावात्मानौ।", "padacchedaText": "", "audioFile": "PB_hear2read_001578.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001579", "originalText": "निरुपाधिकः शान्तात्मा।", "padacchedaText": "", "audioFile": "PB_hear2read_001579.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001580", "originalText": "तदेतत्सर्वमन्तर्बहिर्भावेन वर्तते।", "padacchedaText": "", "audioFile": "PB_hear2read_001580.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001581", "originalText": "शान्त आत्मा सर्वान्तरश्चिदेकरसः।", "padacchedaText": "", "audioFile": "PB_hear2read_001581.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001582", "originalText": "तस्मिन्नाश्रितं जडशक्तिरूपमव्यक्तं मूलप्रकृतिः।", "padacchedaText": "", "audioFile": "PB_hear2read_001582.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001583", "originalText": "सा च प्रथमं सामान्याहङ्काररूपेण महत्तत्त्वनाम्ना व्यक्तीभवति।", "padacchedaText": "", "audioFile": "PB_hear2read_001583.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001584", "originalText": "ततो बहिर्विशेषाहङ्काररूपेण, ततो बहिर्मनोरूपेण ततो बहिर्वागादीन्द्रियरूपेण।", "padacchedaText": "", "audioFile": "PB_hear2read_001584.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001585", "originalText": "तदेतदभिप्रेत्योत्त—रोत्तरमान्तरत्वं विविनक्ति श्रुतिः—\n``इन्द्रियेभ्यः परा ह्यर्था अर्थेभ्यश्च परं मनः। मनसस्तु परा बुद्धिर्बुद्धेरात्मा महान्परः॥", "padacchedaText": "", "audioFile": "PB_hear2read_001585.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001586", "originalText": "महतः परमव्यक्तमव्यक्तात् पुरुषः परः। पुरुषान्न परं किञ्चित्सा काष्ठा सा परा गतिः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001586.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001587", "originalText": "— (कठ. उप०.१.३.१०, ११) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001587.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001588", "originalText": "एवं सत्यत्र नानाविधसङ्कल्पविकल्पसाधनं करणरूपं मनोऽहङ्कर्तरि नियच्छेत्।", "padacchedaText": "", "audioFile": "PB_hear2read_001588.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001589", "originalText": "मनोव्यापारान्परित्यज्याहङ्कारमात्रं शेषयेत्। न चैतदशक्यमिति वाच्यम्,\n``तस्याहं निग्रहं मन्ये वायोरिव सुदुष्करम्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001589.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001590", "originalText": "(भगवद्गीतायां ६.३४) इति वदन्तमर्जुनं प्रति भगवतोत्तराभिधानात्—\n``असंशयं महाबाहो मनो दुर्निग्रहं चलम्। अभ्यासेन तु कौन्तेय वैराग्येण च गृह्यते॥", "padacchedaText": "", "audioFile": "PB_hear2read_001590.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001591", "originalText": "असंयतात्मना योगो दुष्प्राप इति मे मतिः। वश्यात्मना तु यतता शक्योऽवाप्तुमुपायतः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001591.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001592", "originalText": "— (भगवद्गीतायां ६.३५, ३६) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001592.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001593", "originalText": "अभ्यासवैराग्ये पतञ्जलिसूत्रोदाहरणेन व्याख्यास्येते।", "padacchedaText": "", "audioFile": "PB_hear2read_001593.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001594", "originalText": "पूर्वपूर्वभूमिदाढर्यरहितोऽसंयतात्मा।", "padacchedaText": "", "audioFile": "PB_hear2read_001594.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001595", "originalText": "तत्सहितो वश्यात्मा।", "padacchedaText": "", "audioFile": "PB_hear2read_001595.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001596", "originalText": "उपायतः प्राप्तिं गौडपादाचार्याः सदृष्टान्तमाहुः—\n``उत्सेक उदधेर्यद्वत्कुशाग्रेणैकबिन्दुना। मनसो निग्रहस्तद्वद्भवेदपरिखेदतः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001596.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001597", "originalText": "— (माण्डूक्यकारिकायां ३.४१) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001597.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001598", "originalText": "``बहुभिर्न विरोद्धव्यमेकेनापि बलीयसा। स पराभवमाप्नोति समुद्र इव टिट्टिभात्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001598.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001599", "originalText": "अत्र सम्प्रदायविद आख्यायिकामाचक्षते— ``कस्यचित्किल पक्षिणोऽण्डानि तीरस्थान्युदधिरुत्से—केनापजहार।", "padacchedaText": "", "audioFile": "PB_hear2read_001599.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001600", "originalText": "तं च समुद्रं शोषयामीति प्रवृत्तः स च पक्षी स्वमुखाग्रेणैकैकं जलबिन्दुं बहिः प्रक्षिपति स्म।", "padacchedaText": "", "audioFile": "PB_hear2read_001600.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001601", "originalText": "तदा बहुभिः पक्षिभिर्बन्धुवर्गेर्वार्यमाणोऽप्यनुपरतः प्रत्युत तानपि सहकारिणो वव्रे।", "padacchedaText": "", "audioFile": "PB_hear2read_001601.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001602", "originalText": "तांश्च पतनोत्पतनाभ्यां बहुधा क्लिश्यतः सर्वानवलोक्य कृपालुर्नारदो गरुडं समीपे प्रेषयामास।", "padacchedaText": "", "audioFile": "PB_hear2read_001602.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001603", "originalText": "ततो गरुडपक्षवातेन शुष्यन्समुद्रो भीतस्तान्यण्डान्यानीय पक्षिणे ददौ''।", "padacchedaText": "", "audioFile": "PB_hear2read_001603.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001604", "originalText": "एवमखेदेन मनोनिरोधे परमधर्मे प्रवर्तमानं योगिनमीश्वरोऽनुगृह्णाति।", "padacchedaText": "", "audioFile": "PB_hear2read_001604.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001605", "originalText": "अखेदश्च मध्ये मध्ये तदनुकूलव्यापारमिश्रणेन सम्पद्यते, यथौदनं भुञ्जानस्तत्तद्ग्रासान्तरे चोष्यलेह्यादीनास्वादयति तद्वत्।", "padacchedaText": "", "audioFile": "PB_hear2read_001605.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001606", "originalText": "इदमेवाभिप्रेत्य वसिष्ठ आह—\n``चित्तस्य भोगैर्द्वौ भागौ शास्त्रेणैकं प्रपूरयेत्। गुरुशुश्रूषया भागमव्युत्पन्नस्य सत्क्रमे''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001606.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001607", "originalText": "— (लघुयोगवासिष्ठे २१.३६)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001607.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001608", "originalText": "``किञ्चिद्व्युत्पत्तियुक्तस्य भागं भोगैः प्रपूरयेत्। गुरुशुश्रूषया भाग भागं शास्त्रार्थचिन्तया''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001608.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001609", "originalText": "— (तत्रैव २१.३७)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001609.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001610", "originalText": "``व्युत्पत्तिमनुयातस्य पूरयेच्चेतसोऽन्वहम्। द्वौ भागौ शास्त्रवैराग्यैर्द्वौ ध्यानगुरुपूजया''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001610.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001611", "originalText": "— (तत्रैव २१.३८) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001611.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001612", "originalText": "भोगशब्देनात्र जीवनहेतुर्भिक्षाटनादिव्यापारो वर्णाश्रमोचितव्यापारश्चोच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001612.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001613", "originalText": "घटिकामात्रं मुहूर्तं वा यथाशक्ति योगमभ्यस्य ततो मुहूर्तं शास्त्रश्रवणेन परिचर्यया वा गुरूननुगम्य मुहूर्तं स्वदेहमनुसृत्य मुहूर्तं योगशास्त्रं पर्यालोच्य पुनर्मुहूर्तं योगमभ्यस्येत्।", "padacchedaText": "", "audioFile": "PB_hear2read_001613.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001614", "originalText": "एवं योगप्राधान्येन व्यापारान्तराणि मेलयंस्तानि द्रागभ्यस्य\nशयनकाले तद्दिनगतान् योगमुहूर्तान् गणयेत्।", "padacchedaText": "", "audioFile": "PB_hear2read_001614.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001615", "originalText": "ततः परेद्युर्वा परपक्षे वा परमासे वा योगमुहूर्तान् वर्धयेत्।", "padacchedaText": "", "audioFile": "PB_hear2read_001615.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001616", "originalText": "तथा चैकैकस्मिन्मुहूर्त एकैकक्षणयोगेऽपि संवत्सरमात्रेण भूयान्योगकालो भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_001616.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001617", "originalText": "न चैवं यौगैकशरणत्वे व्यापारान्तराणि लुप्येरन्निति शङ्कनीयम्, लुप्तेतरकृत्स्नव्यापारस्यैव योगेऽधिकारात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001617.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001618", "originalText": "अत एव विद्वत्संन्यासोऽपेक्ष्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001618.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001619", "originalText": "तस्मात्तदेकनिष्ठः पुमानध्येतृवणिगादिवत्क्रमेण योगारूढो भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_001619.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001620", "originalText": "यथाध्येता माणवकः पादांशं पादमर्धर्चमृचमृग्द्वयं वर्गं च क्रमेण पठन्दशद्वादशवर्षैरध्यापको भवति, यथा च वाणिज्यं कुर्वन्नेकनिष्कद्विनिष्कादिक्रमेण लक्षपतिः कोटिपतिर्वा भवति तथा ताभ्यां वणिगध्येतृभ्यां\nसहैवोपक्रम्य मत्सरग्रस्त इव युञ्जानस्तावता कालेन कुतो न योगमारोहेत्?\nतस्मात्पुनः पुनः प्राप्यमाणान्सङ्कल्पविकल्पानुद्दालकवत् पौरुषप्रयत्नेन परित्यज्याहङ्कर्तरि ज्ञानात्मनि मनो नियच्छेत्।", "padacchedaText": "", "audioFile": "PB_hear2read_001620.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001621", "originalText": "तामेतां द्वितीयभूमिकां विजित्य बालमूकादिवन्निर्मनस्त्वे स्वाभाविके सति ततो विशेषाहङ्काररूपं विस्पष्टं ज्ञानात्मानमस्पष्टे सामान्याहङ्कारे महत्तत्त्वे नियच्छेत्।", "padacchedaText": "", "audioFile": "PB_hear2read_001621.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001622", "originalText": "यथा स्वल्पां तन्द्रां प्राप्तवतो विशेषाहङ्कारः स्वत एव सङ्कुचति, विनैव तन्द्रां तथा विस्मरणे प्रयतमानस्याहङ्कारसङ्कोचो भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_001622.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001623", "originalText": "सेयं लोकप्रसिद्धया तन्द्रया तार्किकाभिमतनिर्विकल्पकज्ञानेन च समाना महत्तत्त्वमात्रपरिशेषावस्था तृतीया भूमिः।", "padacchedaText": "", "audioFile": "PB_hear2read_001623.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001624", "originalText": "अस्यां चाभ्यासपाटवेन वशीकृतायां तमेतं सामान्याहङ्काररूपं महान्तमात्मानं निरुपाधितया शान्ते चिदेकरसस्वभावे नियच्छेत्।", "padacchedaText": "", "audioFile": "PB_hear2read_001624.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001625", "originalText": "``महत्तत्त्वं तिरस्कृत्य चिन्मात्रं परिशेषयेत्''।", "padacchedaText": "", "audioFile": "PB_hear2read_001625.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001626", "originalText": "अत्रापि पूर्वोक्तविस्मृतिप्रयत्न एव ततोऽप्यतिशयेनोपायतामापद्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001626.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001627", "originalText": "यथा शास्त्राभ्यासप्रवृत्तस्य व्युत्पत्तेः प्राक्प्रतिग्रन्थव्याख्यानापेक्षायामपि व्युत्पन्नस्य स्वत एवोत्तरग्रन्थार्थः प्रतिभाति, तथा सम्यग्वशीकृतपूर्वभूमेर्योगिन उत्तरभूम्युपायः स्वत एव प्रतिभाति।", "padacchedaText": "", "audioFile": "PB_hear2read_001627.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001628", "originalText": "तदाह योगभाष्यकारः—\n``योगेन योगो ज्ञातव्यो योगो योगात्प्रवर्तते। योऽप्रमत्तस्तु योगेन स योगी रमते चिरम्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001628.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001629", "originalText": "— (योगसूत्रभाष्ये ३.६, सौभाग्यलक्ष्म्युपनिषदि २.७) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001629.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001630", "originalText": "ननु महत्तत्त्वशान्तात्मनोर्मध्ये महत्तत्त्वोपादानमव्यक्ताख्यं तत्त्वं श्रुत्योदाहृतम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001630.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001631", "originalText": "तत्र तो नियमनं नाभिधीयत इति चेत्—\nन, लयप्रसङ्गादिति ब्रूमः।", "padacchedaText": "", "audioFile": "PB_hear2read_001631.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001632", "originalText": "यथा घटोऽनुपादाने जले निरुध्यमानो न लीयते, उपादानभूतायां तु मृदि लीयते, तथा महत्तत्त्वमात्मनि न लीयते, अव्यक्ते तु लीयते।", "padacchedaText": "", "audioFile": "PB_hear2read_001632.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001633", "originalText": "न च स्वरूपलयः पुरुषार्थ आत्मदर्शनानुपयोगात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001633.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001634", "originalText": "``दृश्यते त्वग्र्यया बुद्ध्या सूक्ष्मया सूक्ष्मदर्शिभिः'' इति पूर्ववाक्ये आत्मदर्शनं विधाय सूक्ष्मत्वसिद्धये निरोधस्याभिधानात्, लयस्य प्रतिदिनं सुषुप्तौ स्वतः सिद्धत्वेन प्रयत्नवैयर्थ्याच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_001634.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001635", "originalText": "ननु धारणाध्यानसमाधिभिः सम्प्रज्ञातस्यैकाग्र्यवृत्तिरूपत्वेन दर्शनहेतुत्वेऽपि शान्तात्मन्यवरुद्धस्या—सम्प्रज्ञातसमाधिमापन्नस्य चित्तस्य वृत्तिरहितत्वेन सुषुप्तिवन्न दर्शनहेतुत्वमिति चेत्—\nचित्तस्य\nन, स्वतः सिद्धस्य दर्शनस्य निवारयितुमशक्यत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001635.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001636", "originalText": "अत एव श्रेयोमार्गेऽभिहितं—\n``आत्मानात्माकारं स्वभावतोऽवस्थितं सदा चित्तम्। आत्मैकाकारतया तिरस्कृतानात्मदृष्टि विदधीत''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001636.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001637", "originalText": "``इति\nयथा घट उत्पद्यमानः स्वतो वियत्पूर्ण एवोत्पद्यते, जलतण्डुलादिपूरणं तूत्पन्ने घटे पश्चात्पुरुषप्रयत्नेन भवति, यथा तत्र जलादौ निःसारितेऽपि न वियन्निःसारयितुं शक्यते, मुखपिधानेऽप्यन्तर्वियदवतिष्ठत एव, तथा चित्तमुत्पद्यमानमात्मचैतन्यपूर्णमेवोत्पद्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001637.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001638", "originalText": "उत्पन्ने चित्ते पश्चान्मूषानिषिक्तद्रुतताम्रवद्घटपट—रूपरससुखदुःखादिवृत्तिरूपत्वं भोगहेतुधर्माधर्मादिवशाद्भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_001638.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001639", "originalText": "तत्र रूपरसाद्यनात्माकारे निवारितेऽपि निर्निमित्तश्चिदाकारो न निवारयितुं शक्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001639.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001640", "originalText": "ततो निरोधसमाधिना निर्वृत्तिकेन संस्कारमात्रशेषतया सूक्ष्मेण\nचिदात्ममात्राभिमुखत्वादेकाग्रेण चित्तेन निर्विघ्नमात्माऽनुभूयते।", "padacchedaText": "", "audioFile": "PB_hear2read_001640.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001641", "originalText": "अनेनैवाभिप्रायेण वार्तिककार—सर्वानुभवयोगिनावाहतुः—\n``सुखदुःखादिरूपत्वं धियो धर्मादिहेतुतः। निर्हेतुत्वात्मसम्बोधरूपत्वं वस्तुवृत्तितः॥", "padacchedaText": "", "audioFile": "PB_hear2read_001641.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001642", "originalText": "प्रशान्तवृत्तिकं चित्तं परमानन्ददीपकम्। असम्प्रज्ञातनामायं समाधिर्योगिनां प्रियः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001642.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001643", "originalText": "इति— (मुक्तिकोपनिषदि २.५३, ५४)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001643.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001644", "originalText": "आत्मदर्शनस्य स्वतः सिद्धत्वेऽप्यनात्मदर्शनवारणाय निरोधाभ्यासः।", "padacchedaText": "", "audioFile": "PB_hear2read_001644.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001645", "originalText": "अत एवोक्तं—\n``आत्मसंस्थं मनः कृत्वा न किञ्चिदपि चिन्तयेत्''।", "padacchedaText": "", "audioFile": "PB_hear2read_001645.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001646", "originalText": "(भ. गीतायां ६.२५) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001646.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001647", "originalText": "योगशास्त्रस्य चित्तचिकित्सकसमाधिमात्रे प्रवृत्तत्वान्निरोधसमाधावात्मदर्शनं तत्र न साक्षादुक्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001647.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001648", "originalText": "भङ्ग्यन्तरेण त्वभ्युपगम्यते, ``योगश्चित्तवृत्तिनिरोधः'' (योगसूत्रेषु १.२) इति सूत्रयित्वा ``तदा द्रष्टुः स्वरूपेऽवस्थानम्'' (योगसूत्रेषु १.३) इति सूत्रणात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001648.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001649", "originalText": "यद्यपि निर्विकारो द्रष्टा सदा स्वरूप एवावतिष्ठते, तथापि वृत्तिषूत्पद्यमानासु तत्र चिच्छायायां प्रतिबिम्बितायां तदविवेकादस्वस्थ इव द्रष्टा भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_001649.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001650", "originalText": "तदप्यनन्तरसूत्रेणोक्तम्—\n``वृत्तिसारूप्यमितरत्र'' (योगसूत्रेषु १.४), इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001650.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001651", "originalText": "अन्यत्रापि सूत्रितम्—\n``सत्त्वपुरुषयोरत्यन्तासङ्कीर्णयोः प्रत्ययाविशेषो भोगः परार्थत्वात्'' (योगसूत्रेषु ३.३६) इति, ``चितेरप्रतिसङ्क्रमायास्तदाकारापत्तौ स्वबुद्धिसंवेदनं'' ``(योगसूत्रेषु ४.२२) इति च।", "padacchedaText": "", "audioFile": "PB_hear2read_001651.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001652", "originalText": "निरोधसमाधिना शोधिते त्वम्पदार्थे साक्षात्कृतेऽपि तस्य ब्रह्मत्वं गोचरयितुं महावाक्येन ब्रह्मविद्यानामकं वृत्त्यन्तरमुत्पद्यते, न च शुद्धत्वम्पदार्थसाक्षात्कारे निरोधसमाधिरेक एवोपायः, किं तु चिज्जडविवेकेनापि पृथक्कृते तत्र साक्षात्कारसम्भवात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001652.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001653", "originalText": "अत एव वसिष्ठ आह—\n``द्वौ क्रमौ चित्तनाशस्य योगो ज्ञानं च राघव। योगस्तद्वृत्तिरोधो हि ज्ञानं सम्यगवेक्षणम्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001653.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001654", "originalText": "— (लघुयोगवासिष्ठे २७.७२) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001654.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001655", "originalText": "``असाध्यः कस्यचिद्योगः कस्यचिज्ज्ञाननिश्चयः। प्रकारौ द्वौ ततो देवो जगाद परमेश्वरः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001655.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001656", "originalText": "— (तत्रैव २९.६०) इति च॥", "padacchedaText": "", "audioFile": "PB_hear2read_001656.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001657", "originalText": "ननु विवेकोऽपि योगे पर्यवस्यति, दर्शनवेलायामात्ममात्रगोचराया एकाग्रवृत्तेः क्षणिकसम्प्रज्ञातरूपत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001657.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001658", "originalText": "बाढम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001658.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001659", "originalText": "तथापि सम्प्रज्ञातासम्प्रज्ञातयोः स्वरूपतः साधनतश्चास्त्येव महद्वैलक्षण्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001659.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001660", "originalText": "स्फुटः स्वरूपभेदः।", "padacchedaText": "", "audioFile": "PB_hear2read_001660.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001661", "originalText": "साधनं तु सम्प्रज्ञातस्य सजातीयत्वाद्धारणादित्रयमन्तरङ्गम्, असम्प्रज्ञातस्य त्ववृत्तिकस्य विजातीयत्वाद्बहिरङ्गम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001661.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001662", "originalText": "तथा च सूत्रं—\n``तदपि बहिरङ्गं निर्बीजस्य'' (योगसूत्रेषु ३.८) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001662.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001663", "originalText": "विजातीयत्वेऽपि बहुविधानात्मवृत्तिनिवारणेनोपकारितया बहिरङ्गत्वमविरुद्धम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001663.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001664", "originalText": "तदेवोपकारित्वं विशदयितुं सूत्रयति—\n``श्रद्धावीर्यस्मृतिसमाधिप्रज्ञापूर्वक इतरेषाम्'' (योगसूत्रेषु १.२०) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001664.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001665", "originalText": "केषाञ्चिद्देवादीनां पूर्वसूत्रे जन्मनैव समाधिमुक्त्वा मनुष्यान्प्रत्येतदुच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001665.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001666", "originalText": "ममायं योग एव परमपुरुषार्थसाधनमिति प्रत्ययः श्रद्धा।", "padacchedaText": "", "audioFile": "PB_hear2read_001666.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001667", "originalText": "सा चोत्कर्षश्रवणेनोपजायते।", "padacchedaText": "", "audioFile": "PB_hear2read_001667.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001668", "originalText": "तदुत्कर्षश्च स्मर्यते—\n``तपस्विभ्योऽधिको योगी ज्ञानिभ्योऽपि मतोऽधिकः।", "padacchedaText": "", "audioFile": "PB_hear2read_001668.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001669", "originalText": "कर्मिभ्यश्चाधिको योगी तस्माद्योगी भवार्जुन''। — (भगवद्गीतायां ६.४६) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001669.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001670", "originalText": "उत्तमलोकसाधनत्वात् कृच्छ्रचान्द्रायणादितपसो ज्योतिष्टोमादिकर्मणश्च योगोऽधिकः।", "padacchedaText": "", "audioFile": "PB_hear2read_001670.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001671", "originalText": "ज्ञानं प्रत्यन्तरङ्गत्वाच्चित्तविश्रान्तिहेतुतया च ज्ञानादप्यधिकः।", "padacchedaText": "", "audioFile": "PB_hear2read_001671.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001672", "originalText": "एवं जानतो योगे श्रद्धा जायते।", "padacchedaText": "", "audioFile": "PB_hear2read_001672.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001673", "originalText": "तस्यां च श्रद्धायां वासितायां वीर्यमुत्साहो भवति— सर्वथा योगं सम्पादयिष्यामीति।", "padacchedaText": "", "audioFile": "PB_hear2read_001673.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001674", "originalText": "एतादृशेनोत्साहेन तदा तदानुष्ठेयानि योगाङ्गानि स्मर्यन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_001674.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001675", "originalText": "तया च स्मृत्या सम्यगनुष्ठितसमाधेरध्यात्मप्रसादे सत्यृतम्भरा प्रज्ञोदेति।", "padacchedaText": "", "audioFile": "PB_hear2read_001675.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001676", "originalText": "तत्प्रज्ञापूर्वकस्तत्प्रज्ञाकारणकोऽसम्प्रज्ञातसमाधिरितरेषां देवादिभ्योऽर्वाचीनानां मनुष्याणां सिध्यति।", "padacchedaText": "", "audioFile": "PB_hear2read_001676.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001677", "originalText": "तां च प्रज्ञां सूत्रयति—\n``ऋतम्भरा तत्र प्रज्ञा'' (योगसूत्रेषु १.४८) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001677.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001678", "originalText": "ऋतं सत्यं वस्तुयाथात्म्यं बिभर्ति प्रकाशयतीति ऋतम्भरा।", "padacchedaText": "", "audioFile": "PB_hear2read_001678.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001679", "originalText": "तत्र तस्मिन्समाध्युत्कर्षजन्येऽध्यात्मप्रसादे सतीत्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_001679.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001680", "originalText": "ऋतम्भरत्वोपपत्तिं सूत्रयति—\n``श्रुतानुमानप्रज्ञाभ्यामन्यविषया विशेषार्थत्वात्'' (योगसूत्रेषु १.४९) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001680.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001681", "originalText": "सूक्ष्मव्यवहितविप्रकृष्टवस्तुष्वयोगिप्रत्यक्षं न प्रवर्तते।", "padacchedaText": "", "audioFile": "PB_hear2read_001681.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001682", "originalText": "आगमानुमानाभ्यां तानि वस्तून्ययोगिभिर्ज्ञायन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_001682.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001683", "originalText": "ते च शास्त्रानुमानजन्ये प्रज्ञे वस्तुसामान्यमेव गोचरयतः।", "padacchedaText": "", "audioFile": "PB_hear2read_001683.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001684", "originalText": "इदं तु योगिप्रत्यक्षं वस्तुविशेषगोचरत्वादृतम्भरम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001684.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001685", "originalText": "तस्य च योगिप्रत्यक्षस्यासम्प्रज्ञातसमाधौ बहिरङ्गत्वसिद्ध्यर्थमुपकारित्वं सूत्रयति—\n``तज्जः संस्कारोऽन्यसंस्कारप्रतिबन्धी'' (योगसूत्रेषु १.५०) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001685.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001686", "originalText": "असम्प्रज्ञातसमाधेर्बहिरङ्गसाधनमुक्त्वा तन्निरोधप्रयत्नस्यान्तरङ्गसाधनतां सूत्रयति—\n``तस्यापि निरोधे सर्वनिरोधान्निर्बीजः समाधिः'' (योगसूत्रेषु १.५१) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001686.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001687", "originalText": "सोऽयं समाधिः सुषुप्तिसमानः साक्षिचैतन्येनानुभवितुं शक्यः।", "padacchedaText": "", "audioFile": "PB_hear2read_001687.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001688", "originalText": "न चासौ सर्वधीवृत्तिराहित्यात्सुषुप्तिरेवेति शङ्कनीयम्, मनः स्वरूपस्य सदसत्त्वाभ्यां विशेषात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001688.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001689", "originalText": "तदुक्तं गौडपादाचार्यैः——\n``निगृहीतस्य मनसो निर्विकल्पस्य धीमतः। प्रचारः स तु विज्ञेयः सुषुप्तेऽन्यो न तत्समः॥", "padacchedaText": "", "audioFile": "PB_hear2read_001689.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001690", "originalText": "यहि सुषुप्तौ तन्निगृहीतं न लीयते। तदेव निर्भयं ब्रह्म ज्ञानालोकं समन्ततः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001690.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001691", "originalText": "— (माण्डूक्यकारिकायां ३.३४—३५) इति,\nद्वैतस्याग्रहणं तुल्यमुभयोः प्राज्ञतुर्ययोः। बीजनिद्रायुतः प्राज्ञः सा च तुर्ये न विद्यते॥", "padacchedaText": "", "audioFile": "PB_hear2read_001691.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001692", "originalText": "स्वप्ननिद्रायुतावाद्यौ प्राज्ञस्त्वस्वप्ननिद्रया। न निद्रां नैव च स्वप्नं तुर्ये पश्यन्ति निश्चिताः॥", "padacchedaText": "", "audioFile": "PB_hear2read_001692.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001693", "originalText": "अन्यथा गृह्णतः स्वप्नो निद्रा तत्त्वमजानतः। विपर्यासे तयोः क्षीणे तुरीयं पदमश्रुते''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001693.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001694", "originalText": "— (माण्डूक्यकारिकायां १.१३—१५)। इति च॥", "padacchedaText": "", "audioFile": "PB_hear2read_001694.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001695", "originalText": "आद्यौ विश्वतैजसौ।", "padacchedaText": "", "audioFile": "PB_hear2read_001695.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001696", "originalText": "अद्वैतस्य वस्तुनोऽन्यथाग्रहणं नाम द्वैतरूपेण प्रतिभासः।", "padacchedaText": "", "audioFile": "PB_hear2read_001696.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001697", "originalText": "स च विश्वतैजसयोर्वर्तमानः स्वप्न इत्युच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001697.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001698", "originalText": "तत्त्वस्याज्ञानं निद्रा।", "padacchedaText": "", "audioFile": "PB_hear2read_001698.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001699", "originalText": "सा च विश्वतैजसप्राज्ञेषु वर्तते।", "padacchedaText": "", "audioFile": "PB_hear2read_001699.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001700", "originalText": "तयोः स्वप्ननिद्रयोः स्वरूपभूतयोर्विपर्यासो मिथ्याज्ञानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001700.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001701", "originalText": "तस्मिन् विद्यया क्षीणे सति तुरीयं पदमद्वैतं वस्त्वश्नुतेऽनुभवतीत्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_001701.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001702", "originalText": "नन्वस्त्वेवमसम्प्रज्ञातसमाधिसुषुप्त्योर्महान्भेदः, तत्र तत्त्वदिदृक्षोर्दर्शनसाधनत्वेन समाध्यपेक्षायामपि दृष्टतत्त्वस्य जीवन्मुक्तये नास्ति तदपेक्षा, रागद्वेषादिक्लेशबन्धस्य सुषुप्त्यापि निवृत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_001702.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001703", "originalText": "मैवम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001703.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001704", "originalText": "किं प्रतिदिनं स्वतः प्राप्ता कादाचित्की सुषुप्तिर्बन्धनिवर्तिका, किं वाभ्यासेन निरन्तरवर्तिनी? आद्येऽपि किं सुषुप्तिकालीनस्य क्लेशबन्धस्य निवृत्तिः, किं वा कालान्तरवर्तिनः?\nनाद्यः, अप्रसक्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_001704.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001705", "originalText": "न हि मूढानामपि सुषुप्तौ क्लेशबन्धः, अन्यथायासः प्रसज्येत।", "padacchedaText": "", "audioFile": "PB_hear2read_001705.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001706", "originalText": "नद्वितीयः, असम्भवात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001706.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001707", "originalText": "न ह्यन्यकालीनया सुषुप्त्या कालान्तरवर्तिनः क्लेशस्य क्षयः सम्भवति, अन्यथा मूढ़ानामपि जागरणस्वप्नयोः क्लेशस्य क्षयः प्रसज्येत।", "padacchedaText": "", "audioFile": "PB_hear2read_001707.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001708", "originalText": "नापि सुषुप्तौ नैरन्तर्यमभ्यसितुं शक्यम्, तस्याः कर्मक्षयनिमित्तत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001708.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001709", "originalText": "तस्मात्तत्त्वविदोऽपि क्लेशक्षयायास्त्येवासम्प्रज्ञातसमाध्यपेक्षा।", "padacchedaText": "", "audioFile": "PB_hear2read_001709.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001710", "originalText": "तस्य च समाधेर्गवाश्वादिष्विव वाङ्निरोधः प्रथमा भूमिः।", "padacchedaText": "", "audioFile": "PB_hear2read_001710.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001711", "originalText": "बालमूढादिष्विव निर्मनस्त्वं द्वितीया।", "padacchedaText": "", "audioFile": "PB_hear2read_001711.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001712", "originalText": "तन्द्रायामिवाहङ्कारराहित्यं तृतीया।", "padacchedaText": "", "audioFile": "PB_hear2read_001712.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001713", "originalText": "सुषुप्ताविव महत्तत्त्वराहित्यं चतुर्थी।", "padacchedaText": "", "audioFile": "PB_hear2read_001713.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001714", "originalText": "तदेतद्भूमिचतुष्टयमभिप्रेत्य ``शनैः शनैरुपरमेत्'' इत्युक्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001714.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001715", "originalText": "अत्र चोपरमे धृतिगृहीता बुद्धिः साधनम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001715.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001716", "originalText": "महदहङ्कारमनोवागादीनां स्वत एव तीव्रवेगेण बहिः प्रवहतां कूलङ्कषाया नद्या इव निरोधे धैर्यं महदपेक्षितम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001716.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001717", "originalText": "बुद्धिर्विवेकः।", "padacchedaText": "", "audioFile": "PB_hear2read_001717.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001718", "originalText": "पूर्वा भूमिर्जिता वा न वेति परिक्ष्य जितायामुत्तरभूम्युपक्रमः, अजितायां तु सैव पुनरभ्यसनीयेति तदा तदा विविच्यात् (विविञ्चयात् इति वा\nपाठः)।", "padacchedaText": "", "audioFile": "PB_hear2read_001718.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001719", "originalText": "``आत्मसंस्थं—'' (भगवद्गीतायां ६.२५) इत्यादिना सार्धश्लोकेन चतुर्थभूम्यभ्यासोऽपि स्मृतः।", "padacchedaText": "", "audioFile": "PB_hear2read_001719.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001720", "originalText": "गौडपादाचार्या आहुः—\n``उपायेन निगृह्णीयाद्विक्षिप्तं कामभोगयोः। सुप्रसन्नं लये चैव यथा कामो लयस्तथा॥ ४२॥", "padacchedaText": "", "audioFile": "PB_hear2read_001720.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001721", "originalText": "दुःखं सर्वमनुस्मृत्य कामभोगान्निवर्तयेत्। अजं सर्वमनुस्मृत्य जातं नैव तु पश्यति॥ ४३॥", "padacchedaText": "", "audioFile": "PB_hear2read_001721.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001722", "originalText": "लये सम्बोधयेच्चित्तं विक्षिप्तं शमयेत्पुनः। सकषायं विजानीयात्समप्राप्तं न चालयेत्''॥ ४४॥", "padacchedaText": "", "audioFile": "PB_hear2read_001722.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001723", "originalText": "— (माण्डूक्यकारिकायां ३.४२—४४)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001723.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001724", "originalText": "``नास्वादयेत्सुखं तत्र निःसङ्गः प्रज्ञया भवेत्। निश्चलं निश्चरच्चित्तमेकीकुर्यात्प्रयत्नतः॥ ४५॥", "padacchedaText": "", "audioFile": "PB_hear2read_001724.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001725", "originalText": "``यदा न लीयते चित्तं न च विक्षिप्यते पुनः। अनिङ्गनमनाभासं निष्पन्नं ब्रह्म तत्तदा''॥ ४६॥", "padacchedaText": "", "audioFile": "PB_hear2read_001725.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001726", "originalText": "— (माण्डूक्यकारिकायां ३.४५—४६) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001726.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001727", "originalText": "लयविक्षेपकषायसमप्राप्तयश्चतस्रश्चित्तस्यावस्थाः।", "padacchedaText": "", "audioFile": "PB_hear2read_001727.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001728", "originalText": "तत्र निरुध्यमानं चित्तं विषयेभ्यो व्यावृत्तं सत्पूर्वा—भ्यासवशाद्यदि लयाय सुषुप्तयेऽभिमुखं भवेत्, तदानीमुत्थापनप्रयत्नेन लयकारणनिवारणेन वा तच्चित्तं सम्यक्प्रबोधयेत्।", "padacchedaText": "", "audioFile": "PB_hear2read_001728.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001729", "originalText": "लयहेतवो निद्राशेषाजीर्णबह्नशनश्रमाः।", "padacchedaText": "", "audioFile": "PB_hear2read_001729.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001730", "originalText": "अत एवाहुः—\n``समापय्य निद्रां सुजीर्णाल्पभोजी\nश्रमत्याग्यबाधे विविक्ते प्रदेशे। सदासीत निस्तृष्ण एवाप्रयत्नो—\nऽथ वा प्राणरोधी निजाभ्यासमार्गात्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001730.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001731", "originalText": "— (सौभाग्यलक्ष्म्युपनिषदि २.२) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001731.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001732", "originalText": "लयादुत्थापितं चित्तं दैनन्दिनप्रबोधाभ्यासवशाद्यदि कामभोगयोर्विक्षिप्येत, तदा विवेकिजनप्रसिद्धभोग्यवस्तुगतसर्वदुःखानुस्मरणेन शास्त्रप्रसिद्धजन्मादिरहिताद्वितीयब्रह्मतत्त्वानुस्मरण—पूर्वकेण भोग्यवस्तुदर्शनेन च पुनः पुनर्विक्षेपाच्चित्तं शमयेत्।", "padacchedaText": "", "audioFile": "PB_hear2read_001732.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001733", "originalText": "कषायस्तीव्रश्चित्तदोषः।", "padacchedaText": "", "audioFile": "PB_hear2read_001733.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001734", "originalText": "तीव्ररागद्वेषादिवासनया ग्रस्तं चित्तं कदाचित् समाहितमिव लयविक्षेपरहितं दुःखैकाग्रमवतिष्ठते, तादृशं तच्चित्तं विजानीयात्, समाहितचित्ताद्विवेकेनावगच्छेत्।", "padacchedaText": "", "audioFile": "PB_hear2read_001734.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001735", "originalText": "असमाहितमेतदित्यवगम्य लयविक्षेपवत्कषायस्य प्रतीकारं कुर्यात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001735.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001736", "originalText": "समशब्देन ब्रह्माभिधीयते।", "padacchedaText": "", "audioFile": "PB_hear2read_001736.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001737", "originalText": "``समं सर्वेषु भूतेषु तिष्ठन्तं परमेश्वरम्''।", "padacchedaText": "", "audioFile": "PB_hear2read_001737.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001738", "originalText": "(भगवद्गीतायां १३.२८) इति स्मृतेः।", "padacchedaText": "", "audioFile": "PB_hear2read_001738.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001739", "originalText": "लयविक्षेपकषायेषु परिहृतेषु परिशेषाच्चित्तेन समं ब्रह्म प्राप्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001739.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001740", "originalText": "तच्च समप्राप्तं चित्तं लयकषायभ्रान्त्या न चालयेत्।", "padacchedaText": "", "audioFile": "PB_hear2read_001740.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001741", "originalText": "सूक्ष्मया बुद्ध्या लयकषायप्राप्ती विविच्य तस्यां समप्राप्तावतिप्रयत्नेन चिरं स्थापयेत्।", "padacchedaText": "", "audioFile": "PB_hear2read_001741.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001742", "originalText": "स्थापिते तस्मिन् ब्रह्मस्वरूपभूतः परमानन्दः सम्यगाविर्भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_001742.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001743", "originalText": "तथा चोदाहृतं—\n``सुखमात्यन्तिकं यत्तद् बुद्धिग्राह्यमतीन्द्रियम्। ''— (भगवद्गीतायां ६.२१) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001743.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001744", "originalText": "श्रुतिश्च भवति\n``समाधिनिर्धूतमलस्य चेतसो\nनिवेशितस्यात्मनि यत्सुखं भवेत्। न शक्यते वर्णयितुं गिरा तदा\nस्वयं तदन्तःकरणेन गृह्यते''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001744.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001745", "originalText": "— (मैत्रायण्युपनिषदि ४.९) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001745.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001746", "originalText": "ननु समाध्याविभूर्तस्य ब्रह्मानन्दस्य बुद्धिग्राह्यत्वं श्रुतिस्मृतिभ्यामभिहितम्, आचार्यैस्तु— ``नास्वादयेत्सुखं तत्र'' (माण्डूक्यकारिकायां ३.४५) इति बुद्धिग्राह्यत्वं प्रतिषिध्यत इति चेत्।", "padacchedaText": "", "audioFile": "PB_hear2read_001746.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001747", "originalText": "नायं दोषः।", "padacchedaText": "", "audioFile": "PB_hear2read_001747.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001748", "originalText": "तत्र निरोधसुखं बुद्धिग्राह्यं न प्रतिषिध्यते, किं तु समाधिविरोधिनो व्युत्थानरूपस्य परामर्शस्यैव प्रतिषेधात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001748.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001749", "originalText": "यथा निदाघदिवसेषु मध्याह्ने जाह्नवीहृदनिमग्नेनानुभूयमानमपि शैत्यसुखं तदा वक्तुमशक्यं पश्चादुन्मग्नेनाभिधीयते, यथा वा सुषुप्तावविद्यावृत्तिभिरति—सूक्ष्माभिरनुभूयमानमपि स्वरूपमुखं तदानीं सविकल्पकेनान्तः करणवृत्तिज्ञानेन ग्रहीतुमशक्यम्, प्रबोधकाले तु स्मृत्या विस्पष्टं परामृश्यते, तथा समाधौ वृत्तिरहितेन संस्कारमात्रशेषतया सूक्ष्मेण वा चित्तेन सुखानुभवः श्रुतिस्मृत्योर्विवक्षितः।", "padacchedaText": "", "audioFile": "PB_hear2read_001749.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001750", "originalText": "``महदिदं समाधिसुखमन्वभूवम्'' (माण्डूक्यकारिकायां ३.४५) इत्येतादृशो व्युत्थितस्य सविकल्पकः परामर्शोऽत्रास्वादनं, तदेवाचार्यैः प्रतिषिध्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001750.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001751", "originalText": "तमेव स्वाभिप्रायं प्रकटयितुं ``निःसङ्गः प्रज्ञया भवेत्'' इत्युक्तं (माण्डूक्यकारिकायां ३.४५)।", "padacchedaText": "", "audioFile": "PB_hear2read_001751.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001752", "originalText": "प्रकृष्टं सविकल्पकं ज्ञानं प्रज्ञा, तया सह सङ्गं परित्यजेत्।", "padacchedaText": "", "audioFile": "PB_hear2read_001752.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001753", "originalText": "यद्वा पूर्वोक्ता धृतिगृहीता बुद्धिः प्रज्ञा, तदात्मकेन साधनेन सुखास्वादनतद्वर्णनादिरूपामासक्तिं वर्जयेत्।", "padacchedaText": "", "audioFile": "PB_hear2read_001753.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001754", "originalText": "समाधौ ब्रह्मानन्दे निमग्नं चित्तं यदि कदाचित्सुखास्वादनाय वा शीतवातमशकाद्युपद्रवेण वा निश्चरेत् तदा निश्चरत्तच्चित्तं पुनः पुनर्निश्चलं यथा\nभवति तथा परब्रह्मणा सहैकीकुर्यात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001754.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001755", "originalText": "तत्र च निरोधप्रयत्न एव साधनम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001755.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001756", "originalText": "एकीभाव एव ``यदा न लीयते चित्तम्'' (माण्डूक्यकारिकायां ३.४६) इत्यनेन श्लोकेन स्पष्टीक्रियते।", "padacchedaText": "", "audioFile": "PB_hear2read_001756.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001757", "originalText": "``अनिङ्गनमनाभासम्'' (माण्डूक्यकारिकायां ३.४६) इत्याभ्यां पदाभ्यां कषायसुखास्वादौ द्वौ च प्रतिषिध्येते।", "padacchedaText": "", "audioFile": "PB_hear2read_001757.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001758", "originalText": "लयविक्षेपकषायसुखास्वादेभ्यो विनिर्मुक्तं चित्तमविच्छेदेन ब्रह्मण्यवस्थितं भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_001758.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001759", "originalText": "एतदेवाभिप्रेत्य कठवल्लीषु पठ्यते—\n``यदा पञ्चावतिष्ठन्ते ज्ञानानि मनसा सह। बुद्धिश्च न विचेष्टते तामाहुः परमां गतिम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_001759.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001760", "originalText": "तां योगमिति मन्यन्ते स्थिरामिन्द्रियधारणाम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001760.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001761", "originalText": "अप्रमत्तस्तदा भवति योगो हि प्रभवाप्ययौ। ''— (कठोपनिषदि २.३.१०, ११) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001761.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001762", "originalText": "उपेक्षितो योग इन्द्रियवृत्तीनां प्रभवं करोति।", "padacchedaText": "", "audioFile": "PB_hear2read_001762.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001763", "originalText": "अनुष्ठितस्तु तासां लयहेतुः।", "padacchedaText": "", "audioFile": "PB_hear2read_001763.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001764", "originalText": "अत एव योगस्य स्वरूपलक्षणं सूत्रयति—\n``योगश्चित्तवृत्तिनिरोधः'' (योगसूत्रेषु १.२) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001764.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001765", "originalText": "वृत्तीनामानन्त्यान्निरोधोऽशक्य इति शङ्कां वारयितुमियत्तां सूत्रयति—\n``वृत्तयः पञ्चतय्यः क्लिष्टा अक्लिष्टाः'' (योगसूत्रेषु १.५) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001765.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001766", "originalText": "रागद्वेषादिक्लेशरूपा आसुरवृत्तयः क्लिष्टाः।", "padacchedaText": "", "audioFile": "PB_hear2read_001766.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001767", "originalText": "रागादिरहिता दैववृत्तयोऽक्लिष्टाः।", "padacchedaText": "", "audioFile": "PB_hear2read_001767.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001768", "originalText": "यद्यपि पञ्चस्वेव क्लिष्टानामक्लिष्टानां चान्तर्भावः, तथापि क्लिष्टा एव निरोद्धव्या इति मन्दबुद्धिं वारयितुं ताभिः सहाक्लिष्टा अप्युदाहृताः।", "padacchedaText": "", "audioFile": "PB_hear2read_001768.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001769", "originalText": "नामधेयलक्षणाभ्यां ता वृत्तीर्विशदयितुं सूत्रषट्कमाह—\n``प्रमाणविपर्ययविकल्पनिद्रास्मृतयः'' (योगसूत्रेषु १.६),\n``प्रत्यक्षानुमानागमाः प्रमाणानि'' (योगसूत्रेषु १.७),\n``विपर्ययो मिथ्याज्ञानमतद्रूपप्रतिष्ठम्'' (योगसूत्रेषु १.८),\n``शब्दज्ञानानुपाती वस्तुशून्यो विकल्पः'' (योगसूत्रेषु १.९),\n``अभावप्रत्ययालम्बना वृत्तिर्निद्रा'' (योगसूत्रेषु १.१०),\n``अनूभूतविषयासम्प्रमोषः स्मृतिः'' (योगसूत्रेषु १.११) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001769.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001770", "originalText": "वस्त्वभावः प्रतीयते यस्मिंस्तमस्यावरके सति तत्तमोऽभावप्रत्ययः।", "padacchedaText": "", "audioFile": "PB_hear2read_001770.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001771", "originalText": "तमोगुणं विषयीकुर्वती वृत्तिर्निद्रेत्युच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001771.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001772", "originalText": "अनुभूतविषयस्यासम्प्रमोषस्तदनुभवजन्यमनुसन्धानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001772.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001773", "originalText": "पञ्चविधवृत्तिनिरोधसाधनं सूत्रयति—\n``अभ्यासवैराग्याभ्यां तन्निरोधः'' (योगसूत्रेषु १.१२) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001773.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001774", "originalText": "यथा तीव्रवेगोपेतं नदीप्रवाहं सेतुबन्धनेन निवार्य कुल्याप्रणयनेन क्षेत्राभिमुखं तिर्यक्प्रवाहान्तरमुत्पाद्यते, तथा वैराग्येण चित्तनद्या विषयप्रवाहं निवार्य समाध्यभ्यासेन प्रशान्तः प्रवाहः सम्पाद्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001774.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001775", "originalText": "मन्त्रजपदेवताध्यानादीनां क्रियारूपत्वेनावृत्तिलक्षणोऽभ्यासः सम्भाव्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001775.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001776", "originalText": "सर्वव्यापारोपरमरूपस्य समाधेः साधकः को नामाभ्यास इति शङ्कां वारयितुं सूत्रयति—\n``तत्र स्थितौ यत्नोऽभ्यासः'' (योगसूत्रेषु १.१३) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001776.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001777", "originalText": "स्थितिर्नैश्चल्यं निरोधः।", "padacchedaText": "", "audioFile": "PB_hear2read_001777.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001778", "originalText": "यत्नो मानस उत्साहः।", "padacchedaText": "", "audioFile": "PB_hear2read_001778.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001779", "originalText": "स्वत एव बहिष्प्रवाहशीलं चित्तं सर्वथा निरोधयिष्यामीत्येवंविध उत्साह आवर्त्यमानोऽभ्यास इत्युच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001779.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001780", "originalText": "अयमभ्यास इदानीं प्रवृत्तः स्वयमदृढः सन्ननादिप्रवृत्ता व्युत्थानवासनाः कथमभिभवेदित्याशङ्कामपवदितुं सूत्रयति—\n``स तु दीर्घकालनैरन्तर्यसत्कारासेवितो दृढभूमिः'' (योगसूत्रेषु १.१४) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001780.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001781", "originalText": "लोका हि मूढस्य वचनमुदाहरन्ति ``विद्यमानाश्चत्वार एव वेदाः, तानध्येतुं गतस्य माणवकस्य पञ्चदिवसा अतीताः, अद्याप्यसौ नागतः'' इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001781.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001782", "originalText": "तादृश एवायं योगी तदा स्याद् यदा दिवसैर्वा मासैर्वा योगसिद्धिं वाञ्छेत्।", "padacchedaText": "", "audioFile": "PB_hear2read_001782.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001783", "originalText": "तस्मात् संवत्सरैर्जन्मभिर्वा दीर्घकालं योग आसेवितव्यः। तथा च स्मर्यते—\n``अनेकजन्मसंसिद्धस्ततो याति परां गतिम्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001783.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001784", "originalText": "— (भगवद्गीतायां ६.४५) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001784.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001785", "originalText": "चिरमासेव्यमानोऽपि यदि विच्छिद्य विच्छिद्य सेव्येत, तर्ह्यत्पद्यमानानां योगसंस्काराणां समनन्तरभाविभिर्विच्छेदकारिभिर्व्युत्थानकालीनैः संस्कारैरभिभवे सति खण्डनकारोक्तन्याय आपतेत्— ``अग्रे धावन्पश्चाल्लुप्यमानो विस्मरणशीलश्रुतवत्किमालम्बेत'' इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001785.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001786", "originalText": "तस्मान्निरन्तरमासेवितव्यः।", "padacchedaText": "", "audioFile": "PB_hear2read_001786.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001787", "originalText": "सत्कार आदरः।", "padacchedaText": "", "audioFile": "PB_hear2read_001787.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001788", "originalText": "अनादरेण सेव्यमाने वसिष्ठोक्तन्याय आपतेत्—\n``अकर्तृकुर्वदप्येतच्चेतश्चेत्क्षीणवासनम्। दूरं गतमना जन्तुः कथाश्रवणे यथा''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001788.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001789", "originalText": "इति। — (लघुयोगवासिष्ठे ५.७.१३) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001789.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001790", "originalText": "अनादरो लयविक्षेपकषायसुखास्वादानामपरिहारः।", "padacchedaText": "", "audioFile": "PB_hear2read_001790.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001791", "originalText": "तस्मादादरेण सेवितव्यः।", "padacchedaText": "", "audioFile": "PB_hear2read_001791.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001792", "originalText": "दीर्घकालादित्रैविध्येन सेवितस्य समाधेर्दृढभूमित्वं नाम विषयसुखवासनया दुःखवासनया वा चालयितुमशक्यत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001792.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001793", "originalText": "तच्च भगवता दर्शितम्—\n``यं लब्ध्वा चापरं लाभं मन्यते नाधिकं ततः। यस्मिन्स्थितो न दुःखेन गुरुणापि विचाल्यते''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001793.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001794", "originalText": "— (भगवद्गीतायां ६.२२) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001794.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001795", "originalText": "अपरलाभस्यानाधिकं कचवृत्तात्तेन वसिष्ठ उदाजहार—\n``कचः कदाचिदुत्थाय समाधेः प्रीतमानसः। एकान्ते समुवाचेदमेवं गद्गदया गिरा॥ ३७॥", "padacchedaText": "", "audioFile": "PB_hear2read_001795.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001796", "originalText": "किं करोमि क्व गच्छामि किं गृह्णामि त्यजामि किम्। आत्मना पूरितं विश्वं महाकल्पाम्बुना यथा॥ ३८॥", "padacchedaText": "", "audioFile": "PB_hear2read_001796.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001797", "originalText": "सबाह्याभ्यन्तरे देहे ह्यध ऊर्ध्वं च दिक्षु च। इत आत्मा तथेहात्मा नास्त्यनात्ममयं क्वचित्॥ ३९॥", "padacchedaText": "", "audioFile": "PB_hear2read_001797.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001798", "originalText": "न तदस्ति न यत्राहं न तदस्ति न यन्मयि। किमन्यदभिवाञ्छामि सर्वं संविन्मयं ततम्॥ ४०॥", "padacchedaText": "", "audioFile": "PB_hear2read_001798.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001799", "originalText": "— (लघुयोगवासिष्ठे १८.३७—४०)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001799.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001800", "originalText": "``स्फारब्रह्मामलाम्भोधेः फेनाः सर्वे कुलाचलाः। चिदादित्यमहातेजोमृगतृष्णा जगच्छ्रियः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001800.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001801", "originalText": "— (तत्रैव १८.३५) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001801.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001802", "originalText": "गुरुदुःखेनाप्यविचाल्यत्वं शिखिध्वजस्य वत्सरत्रयसमाधिवृत्तान्तेनोदाजहार—\n``निर्विकल्पसमाधिस्थं तत्रापश्यन्महीपतिम्। राजानं तावदेतस्मात् बोधयामि परात्पदात्॥ १२२॥", "padacchedaText": "", "audioFile": "PB_hear2read_001802.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001803", "originalText": "इति सञ्चिन्त्य चूडाला सिंहनादं चकार सा। भूयो भूयः प्रभोरग्रे वनेचरभयप्रदम्॥ १२३॥", "padacchedaText": "", "audioFile": "PB_hear2read_001803.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001804", "originalText": "न चचाल तदा राम यदा नादेन तेन सः। भूयो भूयः कृतेनापि तदा सा तं व्यचालयत्॥ १२४॥", "padacchedaText": "", "audioFile": "PB_hear2read_001804.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001805", "originalText": "चालितः पातितोऽप्येष तदा नो बुबुधे बुधः''॥ १२५॥", "padacchedaText": "", "audioFile": "PB_hear2read_001805.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001806", "originalText": "इति। — (लघुयोगवासिष्ठे ३७.१२२—१२५)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001806.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001807", "originalText": "प्रह्लादवृत्तान्तेनाप्येतदेवोदाजहार—\n``इति सञ्चिन्तयन्नेव प्रह्लादः परवीरहा। निर्विकल्पपरानन्दसमाधिं समुपाययौ॥", "padacchedaText": "", "audioFile": "PB_hear2read_001807.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001808", "originalText": "(तत्रैव २२.९२)।", "padacchedaText": "", "audioFile": "PB_hear2read_001808.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001809", "originalText": "निर्विकल्पसमाधिस्थश्चित्रार्पित इवाबभौ। पञ्च वर्षसहस्राणि पीनाङ्गोऽतिष्ठदेकदृक्॥", "padacchedaText": "", "audioFile": "PB_hear2read_001809.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001810", "originalText": "(तत्रैव २२.९३)\nमहात्मन् सम्प्रबुध्यस्वेत्येवं विष्णुरुदाहरत्। पाञ्चजन्यं प्रदध्मौ च ध्वनयन् ककुभां गणम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_001810.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001811", "originalText": "(तत्रैव २२.१०६)\nमहता तेन शब्देन वैष्णवप्राणजन्मना। बभूव सम्प्रबुद्धात्मा दानवेशः शनैः शनैः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001811.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001812", "originalText": "(तत्रैव २२.१०७) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001812.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001813", "originalText": "एवं वीतहव्यादीनामपि समाधिरुदाहरणीयः।", "padacchedaText": "", "audioFile": "PB_hear2read_001813.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001814", "originalText": "वैराग्यं द्विविधम्, अपरं परं चेति।", "padacchedaText": "", "audioFile": "PB_hear2read_001814.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001815", "originalText": "यतमानव्यतिरेकै— केन्द्रियवशीकारभेदैरपरं चतुर्विधम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001815.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001816", "originalText": "तत्राद्यं त्रयमर्थात्सूत्रयन्साक्षाच्चतुर्थं सूत्रयति—\n``दृष्टानुश्रविकविषयवितृष्णस्य वशीकारसंज्ञा वैराग्यम्'' (योगसूत्रेषु १.१५) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001816.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001817", "originalText": "स्रक्चन्दनवनितापुत्रमित्रक्षेत्रधनादयो दृष्टाः।", "padacchedaText": "", "audioFile": "PB_hear2read_001817.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001818", "originalText": "वेदोक्ताः स्वर्गादय आनुश्रुविकाः।", "padacchedaText": "", "audioFile": "PB_hear2read_001818.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001819", "originalText": "तत्रोभयत्र सत्यामपि तृष्णायां विवेकतारतम्येन यतमानादिवैराग्यत्रयं भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_001819.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001820", "originalText": "अस्मिञ्जगति किं सारं किमसारमिति गुरुशास्त्राभ्यां ज्ञास्यामीत्युद्योगो यतमानत्वं (१),\nस्वचित्ते पूर्वं विद्यमानानां दोषाणां मध्येऽभ्यस्यमानेन विवेकेनैतावन्तः पक्वा एतावन्तोऽवशिष्ट इति विवेचनं व्यतिरेकः (२),\nदृष्टानुश्रविकविषयप्रवृत्तेर्दुःखात्मत्वबोधेन तां प्रवृत्तिं परित्यज्य मनसश्चौत्सुक्यमात्रेण वितृष्णावस्थान—मेकेन्द्रियत्वं (३),\nवितृष्णत्वं वशीकारः (४),\nतदिदमपरं वैराग्यमष्टाङ्गयोगप्रवर्तकत्वेन सम्प्रज्ञातस्यान्तरङ्गम्, असम्प्रज्ञातस्य तु बहिरङ्गम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001820.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001821", "originalText": "तत्रान्तरङ्गं परं वैराग्यं सूत्रयति—\n``तत्परं पुरुषख्यातेर्गुणवैतृष्ण्यम्'' (१.१६) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001821.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001822", "originalText": "सम्प्रज्ञातसमाधिपाटवेन गुणत्रयात्मकात्प्रधानाद्विरक्तस्य पुरुषस्य ख्यातिः साक्षात्कार उत्पद्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001822.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001823", "originalText": "तस्माच्च साक्षात्कारादशेषगुणत्रयव्यवहारे यद्वैतृष्ण्यं तत्परं वैराग्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001823.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001824", "originalText": "तस्य तारतम्येन समाधेः शीघ्रत्वतारतम्यं सूत्रयति— ``तीव्रसंवेगानामासन्नः'' (योगसूत्रेषु १.२०) समाधिलाभः इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001824.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001825", "originalText": "संवेगो वैराग्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001825.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001826", "originalText": "तद्भेदाद्योगिनस्त्रिविधाः— मृदुसंवेगा मध्यसंवेगास्तीव्रसंवेगाश्चेति।", "padacchedaText": "", "audioFile": "PB_hear2read_001826.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001827", "originalText": "आसन्नोऽल्पेनैव कालेन समाधिर्लभ्यत इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_001827.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001828", "originalText": "तीव्रसंवेगेष्वेव समाधितारतम्यं सूत्रयति—\n``मृदुमध्याधिमात्रत्वात्ततोऽपि विशेषः'' (योगसूत्रेषु १.२१) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001828.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001829", "originalText": "मृदुतीव्रो मध्यतीव्रोऽधिमात्रतीव्र इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001829.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001830", "originalText": "तेष्वप्युत्तरोत्तरस्य त्वरया सिद्धिर्द्रष्टव्या।", "padacchedaText": "", "audioFile": "PB_hear2read_001830.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001831", "originalText": "उत्तमोत्तमा जनकप्रह्लादादयोऽधिमात्रतीव्राः, मुहूर्तमात्रविचारेण दृढसमाधिलाभात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001831.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001832", "originalText": "अधमाधमा उद्दालकादयो मृदुसंवेगाः, चिरप्रयासेन तल्लाभात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001832.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001833", "originalText": "एवमन्येऽपि यथायोगमुन्नेयाः।", "padacchedaText": "", "audioFile": "PB_hear2read_001833.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001834", "originalText": "तदेवमधिमात्रतीव्रस्य दृढ़भूमावसम्प्रज्ञातसमाधौ लब्धे सति पुनर्व्युत्थातुमशक्तं सन्मनो नश्यति।", "padacchedaText": "", "audioFile": "PB_hear2read_001834.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001835", "originalText": "मनोनाशेन च वासनाक्षये रक्षिते सति जीवन्मुक्तिः सुप्रतिष्ठिता भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_001835.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001836", "originalText": "न च मनोनाशेन विदेहमुक्तिरेव न तु जीवन्मुक्तिरिति शङ्कनीयम्, प्रश्नोत्तराभ्यां तन्निर्णयात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001836.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001837", "originalText": "श्रीरामः—\n``विवेकाभ्युदयाच्चित्तस्वरूपेऽन्तर्हिते मुने। मैत्र्यादयो गुणाः कुत्र जायन्ते योगिनां वद''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001837.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001838", "originalText": "— (लघुयोगवासिष्ठे २८.१५)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001838.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001839", "originalText": "वसिष्ठः—\n``द्विविधश्चित्तनाशोऽस्ति सरूपोऽरूप एव च। जीवन्मुक्तौ सरूपः स्यादरूपोऽदेहमुक्तिगः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001839.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001840", "originalText": "— (तत्रैव २८.१६)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001840.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001841", "originalText": "``प्राकृतं गुणसम्भारं ममेति बहु मन्यते। सुखदुःखाद्यवष्टभ्य विद्यमानं मनो विदुः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001841.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001842", "originalText": "— (तत्रैव २८.१८)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001842.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001843", "originalText": "``चेतसः कथिता सत्ता मया रघुकुलोद्वह।", "padacchedaText": "", "audioFile": "PB_hear2read_001843.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001844", "originalText": "अस्य नाशमिदानीं त्वं श‍ृणु प्रश्नविदां वर। — (तत्रैव २८.२०)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001844.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001845", "originalText": "``सुखदुःखदशा धीरं साम्यान्न प्रोद्धरन्ति यम्। निःश्वासा इव शैलेन्द्रं तस्य चित्तं मृतं विदुः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001845.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001846", "originalText": "— (तत्रैव २८.२१)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001846.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001847", "originalText": "``आपत्कार्पण्यमुत्साहो मदो मान्द्यं महोत्सवः। यं नयन्ति न वैरूप्यं तस्य नष्टं मनो विदुः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001847.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001848", "originalText": "— (तत्रैव २८.२२)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001848.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001849", "originalText": "``चित्तमाशानिधानं हि यदा नश्यति राघव।", "padacchedaText": "", "audioFile": "PB_hear2read_001849.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001850", "originalText": "मैत्र्यादिभिर्गुणैर्युक्तं तदा सत्त्वमुदेत्यलम्। — (तत्रैव २८.२३)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001850.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001851", "originalText": "``भूयोजन्मविनिर्मुक्तं जीवन्मुक्तस्य तन्मनः। सरूपोऽसौ मनोनाशो जीवन्मुक्तस्य विद्यते॥", "padacchedaText": "", "audioFile": "PB_hear2read_001851.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001852", "originalText": "— (तत्रैव २८.२४—२५)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001852.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001853", "originalText": "``अरूपस्तु मनोनाशो यो मयोक्तो रघूद्वह। विदेहमुक्तावेवासौ विद्यते निष्कलात्मकः॥", "padacchedaText": "", "audioFile": "PB_hear2read_001853.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001854", "originalText": "— (तत्रैव २८.२६)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001854.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001855", "originalText": "``समग्राग्र्यगुणाधारमपि?? सत्त्वं प्रलीयते। विदेहमुक्तावले पदे परमपावने॥", "padacchedaText": "", "audioFile": "PB_hear2read_001855.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001856", "originalText": "— (तत्रैव २८.२७)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001856.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001857", "originalText": "``संशान्तदुःखमजडात्मकमेकरूप—\nमानन्दमन्थरमपेतरजस्तमो यत्। आकाशकोशतनवोऽतनवो महान्त—\nस्तस्मिन्पदे गलितचित्तलवा वसन्ति''॥", "padacchedaText": "", "audioFile": "PB_hear2rea
