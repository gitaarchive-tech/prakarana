d_001857.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001858", "originalText": "— (तत्रैव २८.३२) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001858.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001859", "originalText": "``जीवन्मुक्ता न मुह्यन्ति सुखदुःखरसस्थितौ।", "padacchedaText": "", "audioFile": "PB_hear2read_001859.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001860", "originalText": "प्राकृतेनार्थकारेण किञ्चित्कुर्वन्ति वा न वा''। — (तत्रैव १३.२६)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001860.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001861", "originalText": "तस्मात्सरूपो मनोनाशो जीवन्मुक्तिसाधनमिति स्थितम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_001861.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001862", "originalText": "इति श्रीमद्विद्यारण्यप्रणीते जीवन्मुक्तिविवेके मनोनाशनिरूपणं नाम तृतीयं प्रकरणम्॥ ३॥", "padacchedaText": "", "audioFile": "PB_hear2read_001862.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001863", "originalText": "४. जीवन्मुक्तिस्वरूपसिद्विप्रयोजननिरूपणं नाम चतुर्थं प्रकरणम्\n\nकेयं जीवन्मुक्तिः, किं वा तत्र प्रमाणम्, कथं वा तत्सिद्धिः, इत्येतस्य प्रश्नत्रयस्योत्तरं निरूपितम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001863.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001864", "originalText": "सिद्ध्या वा किं प्रयोजनमित्यस्य चतुर्थप्रश्नस्योत्तरमिदानीमभिधीयते— ज्ञानरक्षातपोविसंवादाभावदुःखनाश—सुखाविर्भावाः सन्ति पञ्च प्रयोजनानि।", "padacchedaText": "", "audioFile": "PB_hear2read_001864.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001865", "originalText": "ननु प्रमाणोत्पन्नस्य तत्त्वज्ञानस्य को नाम बाधप्रसङ्गो येन रक्षा अपेक्ष्यत इति चेदुच्यते—चित्तविश्रान्त्यभावे संशयविपर्ययौ प्रसज्येयाताम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001865.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001866", "originalText": "तथा हि— तत्त्वविदो राघवस्य विश्रान्तेः पूर्वं संशयं विश्वामित्र उदाजहार—\n``न राघव तवास्त्यन्यज्ज्ञेयं ज्ञानवतां वर। स्वयैव सूक्ष्मया बुद्ध्या सर्वं विज्ञातवानसि॥", "padacchedaText": "", "audioFile": "PB_hear2read_001866.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001867", "originalText": "भगवद्व्यासपुत्रस्य शुकस्येव मतिस्तव। विश्रान्तिमात्रमेवात्र ज्ञातज्ञेयाप्यपेक्षते''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001867.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001868", "originalText": "— (लघुयोगवासिष्टे ३.१७, १८)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001868.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001869", "originalText": "शुकस्तु स्वयमेवादौ तत्त्वं विदित्वा तत्र संशयानः पितरं पृष्ट्वा पित्रापि तथैवानुशिष्टस्तत्रापि संशयानो जनकमुपसद्य तेनापि तथैवानुशिष्टस्तं प्रत्येवमुवाच,\nश्रीशुकः—\n``स्वयमेव मया पूर्वमेतज्ज्ञातं विवेकतः।", "padacchedaText": "", "audioFile": "PB_hear2read_001869.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001870", "originalText": "एतदेव हि पृष्टेन पित्रा मे समुदाहृतम्॥ ४३॥", "padacchedaText": "", "audioFile": "PB_hear2read_001870.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001871", "originalText": "भवताप्येष एवार्थः कथितो वाग्विदां वर। एष एव च वाक्यार्थः शास्त्रेषु परिदृश्यते॥ ४४॥", "padacchedaText": "", "audioFile": "PB_hear2read_001871.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001872", "originalText": "यथायं स्वविकल्पोत्थः स्वविकल्पपरिक्षयात्। क्षीयते दग्धसंसारो निःसार इति निश्चयः॥ ४५॥", "padacchedaText": "", "audioFile": "PB_hear2read_001872.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001873", "originalText": "तत्किमेतन्महाबाहो सत्यं ब्रूहि ममाचलम्। त्वत्तो विश्रान्तिमाप्नोमि चेतसा भ्रामितं जगत्॥ ४६॥", "padacchedaText": "", "audioFile": "PB_hear2read_001873.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001874", "originalText": "— (तत्रैव ३.४३—४६)\nजनकः—\n``नातः परतरः कश्चिनिश्चयोऽस्त्यपरो मुने। स्वयमेव त्वया ज्ञातं गुरुतश्च पुनः श्रुतम्॥ ४७॥", "padacchedaText": "", "audioFile": "PB_hear2read_001874.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001875", "originalText": "अव्युच्छिन्नश्चिदात्मैकः पुमानस्तीह नेतरः। स्वसङ्कल्पवशाद्बद्धो निःसङ्कल्पस्तु मुच्यते॥ ४८॥", "padacchedaText": "", "audioFile": "PB_hear2read_001875.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001876", "originalText": "मुने त्वया स्फुटं ज्ञातं ज्ञेयं स्वस्य महात्मनः। भोगेभ्यो विरतिर्जाता दृश्याद्वा सकलादिह॥ ४९॥", "padacchedaText": "", "audioFile": "PB_hear2read_001876.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001877", "originalText": "प्राप्तं प्राप्तव्यमखिलं भवता पूर्णचेतसा। न दृश्ये यतसे ब्रह्मन् मुक्तस्त्वं भ्रान्तिमुत्सृज॥ ५०॥", "padacchedaText": "", "audioFile": "PB_hear2read_001877.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001878", "originalText": "अनुशिष्टः स इत्येवं जनकेन महात्मना। विशश्राम शुकस्तूष्णीं स्वस्थे परमवस्तुनि॥ ५१॥", "padacchedaText": "", "audioFile": "PB_hear2read_001878.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001879", "originalText": "वीतशोकभयायास निरीहश्छिन्नसंशयः। जगाम शिखरं मेरोः समाध्यर्थमनिन्दितम्॥ ५२॥", "padacchedaText": "", "audioFile": "PB_hear2read_001879.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001880", "originalText": "तत्र वर्षसहस्राणि निर्विकल्पसमाधिना। दश स्थित्वा शशामासावात्मन्यस्नेहदीपवत्''॥ ५३॥", "padacchedaText": "", "audioFile": "PB_hear2read_001880.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001881", "originalText": "— (तत्रैव ३.४७—५३) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001881.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001882", "originalText": "तस्माद्विदितेऽपि तत्त्वे विश्रान्तिरहितस्य शुकराघवयोरिव संशय उत्पद्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001882.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001883", "originalText": "स चाज्ञानमिव मोक्षस्य प्रतिबन्धकः।", "padacchedaText": "", "audioFile": "PB_hear2read_001883.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001884", "originalText": "अत एव भगवतोक्तम्—\n``अज्ञश्चाश्रद्दधानश्च संशयात्मा विनश्यति। नायं लोकोऽस्ति न परो न सुखं संशयात्मनः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001884.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001885", "originalText": "— (भगवद्गीतायां ४.४०) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001885.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001886", "originalText": "अश्रद्धा विपर्ययः।", "padacchedaText": "", "audioFile": "PB_hear2read_001886.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001887", "originalText": "स चोत्तरत्रोदाहरिष्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001887.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001888", "originalText": "अज्ञानविपर्ययौ मोक्षमात्रविरोधिनौ, संशयस्तु भोगमोक्षयोरुभयोरपि विरोधी, तस्य परस्परविरुद्धकोटिद्वयावलम्बित्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001888.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001889", "originalText": "यदा संसारसुखाय प्रवृत्तिस्तदा मोक्षमार्गे बुद्धिस्तां निरुणद्धि।", "padacchedaText": "", "audioFile": "PB_hear2read_001889.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001890", "originalText": "यदा च मोक्षमार्गे प्रवृत्तिस्तदा संसारबुद्धिस्तां प्रतिबध्नाति।", "padacchedaText": "", "audioFile": "PB_hear2read_001890.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001891", "originalText": "तस्मात् संशयात्मनो न किञ्चित्सुखमस्तीति मुमुक्षुणा सर्वथा संशयश्छेत्तव्यः।", "padacchedaText": "", "audioFile": "PB_hear2read_001891.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001892", "originalText": "अत एव श्रूयते— ``छिद्यन्ते सर्वसंशयाः'' (मुण्डकोपनिषदि २.२.८) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001892.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001893", "originalText": "विपर्ययस्यापि निदाघ उदाहरणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001893.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001894", "originalText": "ऋभुः परमकरुणया निदाघस्य गृहमेत्य बहुधा तं बोधयित्वा निर्जगाम।", "padacchedaText": "", "audioFile": "PB_hear2read_001894.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001895", "originalText": "बुद्धेऽपि तदुपदिष्टे वस्तुन्यश्रद्दधानो निदाघः कर्माण्येव परमपुरुषार्थहेतुरिति विपर्ययं प्राप्य कर्मानुष्ठाने यथापूर्वं प्रवृत्तः।", "padacchedaText": "", "audioFile": "PB_hear2read_001895.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001896", "originalText": "सोऽपि शिष्यस्य परमपुरुषार्थभ्रंशो मा भूदिति कृपया गुरुः पुनरागत्य बोधयामास।", "padacchedaText": "", "audioFile": "PB_hear2read_001896.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001897", "originalText": "तदापि विपर्ययं न जहौ।", "padacchedaText": "", "audioFile": "PB_hear2read_001897.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001898", "originalText": "तृतीयेन तु बोधनेन विपर्ययं परित्यज्य विश्रान्तिमलभत।", "padacchedaText": "", "audioFile": "PB_hear2read_001898.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001899", "originalText": "संशयविपर्ययाभ्याम—सम्भावनाविपरीतभावनारूपाभ्यां तत्त्वज्ञानस्य फलं प्रतिबध्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001899.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001900", "originalText": "तदुक्तं पराशरेण—\n``मणिमन्त्रौषधैर्वह्निः सुदीप्तोऽपि यथेन्धनम्। प्रदग्धुं नैव शक्तः स्यात् प्रतिबद्धस्तथैव च॥", "padacchedaText": "", "audioFile": "PB_hear2read_001900.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001901", "originalText": "ज्ञानाग्निरपि सञ्जातः प्रदीप्तः सुदृढोऽपि च। प्रदग्धुं नैव शक्तः स्यात् प्रतिबद्धस्तु कल्मषम्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001901.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001902", "originalText": "— (पराशरोपपुराणे १४.४)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001902.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001903", "originalText": "``भावना विपरीता या या चासम्भावना शुक। प्रतिबन्धं सा तत्त्वज्ञानस्य नापरम्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001903.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001904", "originalText": "— (तत्रैव १४.५) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001904.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001905", "originalText": "२८२\nतस्मादविश्रान्तचित्तस्य संशयविपर्ययप्रसङ्गेन तत्त्वज्ञानस्य फलप्रतिबन्धलक्षणाद्बाधाद्रक्षापेक्ष्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001905.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001906", "originalText": "विश्रान्तचित्तस्य तु मनोनाशेन यदा जगदेव प्रविलीयते तदा संशयविपर्यययोः कः प्रसङ्गः?\nजगत्प्रतिभासरहितस्य ब्रह्मविदो देहव्यवहारोऽपि विनैव स्वप्रयत्नं परमेश्वरप्रेरितेन प्राणवायुना निष्पाद्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001906.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001907", "originalText": "अत एव छन्दोगा आमनन्ति— ``नोपजनं स्मरन्निदं शरीरं स यथा प्रयोग्य आचरणे युक्त एवमेवायमस्मिञ्शरीरे प्राणो युक्तः'' (छान्दोग्योपनिषदि ८.१२.३) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001907.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001908", "originalText": "उपजनं जनानां समीपे वर्तमानमिदं शरीरं न स्मरन्ब्रह्मविद्वर्तते।", "padacchedaText": "", "audioFile": "PB_hear2read_001908.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001909", "originalText": "पार्श्वस्था जना एव तत्त्वविदः शरीरं पश्यन्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_001909.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001910", "originalText": "स्वयं तु निर्मनस्कत्वान्मदीयमिदं शरीरमिति न स्मरति।", "padacchedaText": "", "audioFile": "PB_hear2read_001910.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001911", "originalText": "प्रयोग्यो रथशकटादिवहने प्रयोक्तुमर्हः शिक्षितोऽश्वबलीवर्दादिः, स यथा सारथिना मार्गस्याचरणे प्रेरितः पुनः पुनः सारथिप्रयत्नमनपेक्ष्य स्वयमेव\nरथशकटादिकं पुरोवर्तिग्रामं नयति, एवमेवायं प्राणवायुः परमेश्वरेणास्मिञ्शरीरे नियुक्तः सत्यसति वा जीवप्रयत्ने व्यवहारं निर्वाहयति।", "padacchedaText": "", "audioFile": "PB_hear2read_001911.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001912", "originalText": "भागवतेऽपि स्मर्यते—\n``देहं विनश्वरमवस्थितमुत्थितं वा\nसिद्धो न पश्यति यतोऽध्यगमत्स्वरूपम्। दैवादुपेतमथ दैववशादपेतं\nवासो यथा परिकृतं मदिरामदान्धः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001912.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001913", "originalText": "— (भाग० ११.१३.३६)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001913.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001914", "originalText": "वसिष्ठोऽप्याह—\n``पार्श्वस्थबोधिताः सन्तः पूर्वाचार क्रमागतम्। आचारमाचरन्त्येव सुप्तबुद्धवदक्षताः''— (लघुयोगवासिष्ठे १३.१२७) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001914.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001915", "originalText": "सिद्धो न पश्यत्याचारमाचरतीत्युभयोः परस्परविरोध इति चेन्न।", "padacchedaText": "", "audioFile": "PB_hear2read_001915.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001916", "originalText": "विश्रान्तितारतम्येन व्यवस्थोपपत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_001916.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001917", "originalText": "तदेव तारतम्यमभिप्रेत्य श्रूयते— ``आत्मक्रीड आत्मरतिः क्रियावानेष ब्रह्मविदां वरिष्ठः'' (मुण्डकोपनिषदि ३.१.४) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001917.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001918", "originalText": "अत्र चत्वारः प्रतीयन्ते— ब्रह्मवित्प्रथमः, ब्रह्मविद्वरो द्वितीयः, ब्रह्मविद्वरीयां तृतीयो ब्रह्मविद्वरिष्ठश्चतुर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_001918.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001919", "originalText": "त एते सप्तसु योगभूमिषु चतुर्थी योगभूमिमारभ्य क्रमेण भूमिचतुष्टयं प्राप्ता इत्यवगन्तव्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001919.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001920", "originalText": "भूमयश्च वसिष्ठेन दर्शिताः—\n``ज्ञानभूमिः शुभेच्छाख्या प्रथमा समुदाहृता। विचारणा द्वितीया स्यात् तृतीया तनुमानसा॥", "padacchedaText": "", "audioFile": "PB_hear2read_001920.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001921", "originalText": "सत्त्वापत्तिश्चतुर्थी स्यात्तत्तोऽसंसक्तिनामिका। पदार्थाभाविनी षष्ठी सप्तमी तुर्यगा स्मृता''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001921.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001922", "originalText": "— (तत्रैव १३.११३, ११४) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001922.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001923", "originalText": "``स्थितः किं मूढ एवास्मि प्रेक्षेऽहं शास्त्रसज्जनैः। वैराग्यपूर्वमिच्छेति शुभेच्छेत्युच्यते बुधैः॥", "padacchedaText": "", "audioFile": "PB_hear2read_001923.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001924", "originalText": "— (तत्रैव १३.११६)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001924.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001925", "originalText": "``शास्त्रसज्जनसम्पर्कवैराग्याभ्यासपूर्वकम्। सद्विचारप्रवृत्तिर्या प्रोच्यते सा विचारणा॥", "padacchedaText": "", "audioFile": "PB_hear2read_001925.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001926", "originalText": "— (तत्रैव १३.११७)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001926.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001927", "originalText": "``विचारणाशुभेच्छाभ्यामिन्द्रियार्थेष्वसक्तता। यत्र सा तनुतामेति प्रोच्यते तनुमानसा॥", "padacchedaText": "", "audioFile": "PB_hear2read_001927.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001928", "originalText": "— (तत्रैव १३.११८)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001928.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001929", "originalText": "``भूमिकात्रितयाभ्यासाच्चित्तेऽर्थविरतेर्वशात्। सत्त्वात्मनि स्थितिः शुद्धे सत्त्वापत्तिरुदाहृता॥", "padacchedaText": "", "audioFile": "PB_hear2read_001929.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001930", "originalText": "— (तत्रैव १३.११९)\n``दशाचतुष्टयाभ्यासादसंसर्गफला तु या। रूढसत्त्वचमत्कारा प्रोक्तासंसक्तिनामिका॥", "padacchedaText": "", "audioFile": "PB_hear2read_001930.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001931", "originalText": "— (तत्रैव १३.१२०)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001931.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001932", "originalText": "``भूमिकापञ्चकाभ्यासात्स्वात्मारामतया भृशम्। आभ्यन्तराणां बाह्यानां पदार्थानामभासनात्॥", "padacchedaText": "", "audioFile": "PB_hear2read_001932.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001933", "originalText": "परप्रयुक्तेन चिरं प्रयत्नेनावबोधनम्। पदार्थाभाविनी नाम षष्ठी भवति भूमिका॥", "padacchedaText": "", "audioFile": "PB_hear2read_001933.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001934", "originalText": "— (तत्रैव १३.१२१, १२२)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001934.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001935", "originalText": "``भूमिषट्कचिराभ्यासाद् भेदस्यानुपलम्भनात्। यत्स्वभावैकनिष्ठत्वं सा ज्ञेया तुर्यगा स्थितिः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001935.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001936", "originalText": "— (तत्रैव १३.१२३) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001936.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001937", "originalText": "अत्र भूमिकात्रितयं ब्रह्मविद्यायाः साधनमेव, नतु विद्याकोटावन्तर्भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_001937.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001938", "originalText": "भूमित्रये भेदसत्यत्वबुद्धेरनिवर्तितत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001938.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001939", "originalText": "अत एवैतज्जागरणमिति व्यपदिश्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001939.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001940", "originalText": "तदुक्तं—\n``भूमिकात्रितयं त्वेतद्राम जाग्रदिति स्थितम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001940.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001941", "originalText": "यथावद्भेदबुद्ध्येदं जगज्जाग्रति दृश्यते''। — (योगवासिष्ठरामायणे निर्वाणप्रकरणे १२६.५२) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001941.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001942", "originalText": "ततो वेदान्तवाक्यान्निर्विकल्पको ब्रह्मात्मैक्यसाक्षात्कारश्चतुर्थी भूमिका फलरूपा सत्त्वापत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_001942.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001943", "originalText": "चतुर्थभूमौ सर्वजगदुपादानस्य ब्रह्मणो वास्तवमद्वितीयसत्तास्वभावं निश्चित्य ब्रह्मण्यारोपितयोर्जग—च्छब्दाभिधेययोर्नामरूपयोर्मिथ्यात्वमवगच्छति।", "padacchedaText": "", "audioFile": "PB_hear2read_001943.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001944", "originalText": "मुमुक्षोः पूर्वोक्तं जागरणमपेक्ष्य सेयं भूमिः स्वप्नः।", "padacchedaText": "", "audioFile": "PB_hear2read_001944.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001945", "originalText": "तदाह—\n``अद्वैते स्थैर्यमायाते द्वैते चोपरतिं गते। पश्यन्ति स्वप्नवल्लोकं चतुर्थीं भूमिकामिताः॥", "padacchedaText": "", "audioFile": "PB_hear2read_001945.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001946", "originalText": "चित्तं तु शरदभ्रांशविलयं प्रविलीयते। सत्तावशेष एवास्ते पञ्चमीं भूमिकामितः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001946.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001947", "originalText": "— (लघुयोगवासिष्ठे ४३.७०, ७१)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001947.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001948", "originalText": "सोऽयं चतुर्थी भूमिकां प्राप्तो योगी ब्रह्मविदित्युच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001948.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001949", "originalText": "पञ्चम्यादयस्तिस्रो भूमयो जीवन्मुक्तेरवान्तरभेदाः।", "padacchedaText": "", "audioFile": "PB_hear2read_001949.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001950", "originalText": "ते च निर्विकल्पसमाध्यभ्यासकृतेन विश्रान्तितारतम्येन सम्पद्यन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_001950.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001951", "originalText": "पञ्चमभूमौ निर्विकल्पकात् स्वयमेव व्युत्तिष्ठते।", "padacchedaText": "", "audioFile": "PB_hear2read_001951.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001952", "originalText": "सोऽयं योगी ब्रह्मविद्वरः।", "padacchedaText": "", "audioFile": "PB_hear2read_001952.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001953", "originalText": "षष्ठभूमौ पार्श्वस्थैर्बोधितो व्युत्तिष्ठते।", "padacchedaText": "", "audioFile": "PB_hear2read_001953.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001954", "originalText": "सोऽयं ब्रह्मविद्वरीयान्।", "padacchedaText": "", "audioFile": "PB_hear2read_001954.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001955", "originalText": "तदेतद्भूमिद्वयं सुषुप्तिर्गाढसुषुप्तिरिति चाभिधीयते।", "padacchedaText": "", "audioFile": "PB_hear2read_001955.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001956", "originalText": "तदाह—\n``पञ्चमीं भूमिकामेत्य सुषुप्तिपदनामिकाम्। शान्ताशेषविशेषांशस्तिष्ठत्यद्वैतमात्रके॥", "padacchedaText": "", "audioFile": "PB_hear2read_001956.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001957", "originalText": "— (तत्रैव ४३.७३)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001957.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001958", "originalText": "``अन्तर्मुखतया नित्यं बहिर्वृत्तिपरोऽपि सन्। परिश्रान्ततया नित्यं निद्रालुवि लक्ष्यते॥", "padacchedaText": "", "audioFile": "PB_hear2read_001958.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001959", "originalText": "— (तत्रैव ४३.७५)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001959.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001960", "originalText": "``कुर्वन्नभ्यासमेतस्यां भूमिकायां विवासनः। षष्ठीं गाढसुषुप्त्याख्यां क्रमात्पतति भूमिकाम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_001960.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001961", "originalText": "— (तत्रैव ४३.७६)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001961.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001962", "originalText": "``यत्र नासन्न सद्रूपो नाहं नाप्यनहङ्कृतिः।", "padacchedaText": "", "audioFile": "PB_hear2read_001962.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001963", "originalText": "केवलं क्षीणमनन आस्ते द्वैतैक्यवर्जितः''।", "padacchedaText": "", "audioFile": "PB_hear2read_001963.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001964", "originalText": "— (तत्रैव ४३.७७)\n``अन्तः शून्यो बहिः शून्यः शून्यः कुम्भ इवाम्बरे। अन्तः पूर्णो बहिः पूर्णः पूर्णः कुम्भ इवार्णवे''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001964.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001965", "originalText": "(तत्रैव ४३.७९)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001965.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001966", "originalText": "गाढं निर्विकल्पसमाधिं प्राप्तस्य संस्कारमात्रशेषस्य चित्तस्य मनोराज्यं कर्तुं बाह्यपदार्थान् ग्रहीतुं वा सामर्थ्याभावादाकाशावस्थितकुम्भवदन्तर्बहिःशून्यत्वम्, स्वयम्प्रकाशसच्चिदानन्दैकरसे ब्रह्मणि निमग्नत्वेन बहिश्च सर्वत्र ब्रह्मदृष्ट्या समुद्रमध्यस्थापितजलपूर्णकुम्भवदन्तर्बहिः पूर्णत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001966.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001967", "originalText": "तुरीयाभिधां सप्तमीं भूमिं प्राप्तस्य योगिनः स्वतः परतो वा व्युत्थानमेव नास्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_001967.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001968", "originalText": "तादृशमेवोद्दिश्य ``देहं विनश्वरमवस्थितमुत्थितं वा'' इत्यादिभागवतवाक्यं प्रवृत्तं (भागवते ११.१३.३६)।", "padacchedaText": "", "audioFile": "PB_hear2read_001968.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001969", "originalText": "असम्प्रज्ञातसमाधि—प्रतिपादकानि योगशास्त्राण्यत्रैव पर्यवसितानि।", "padacchedaText": "", "audioFile": "PB_hear2read_001969.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001970", "originalText": "सोऽयमीदृशो योगी पूर्वोदाहृतश्रुतौ ब्रह्मविद्वरिष्ठ इत्युच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001970.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001971", "originalText": "तदेवं पार्श्वस्थबोधितः सिद्धो न पश्यतीत्यनयोर्भूमिद्वये व्यवस्थितत्वान्न कोऽपि विरोधः।", "padacchedaText": "", "audioFile": "PB_hear2read_001971.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001972", "originalText": "तत्रायं सङ्ग्रहः।", "padacchedaText": "", "audioFile": "PB_hear2read_001972.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001973", "originalText": "पञ्चम्यादिभूमित्रयरूपायां जीवन्मुक्तौ सम्पाद्यमानायां द्वैतप्रतिभासाभावेन संशयविपर्यय—प्रसङ्गाभावादुत्पन्नं तत्त्वज्ञानमबाधेन रक्षितं भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_001973.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001974", "originalText": "सेयं ज्ञानरक्षा जीवन्मुक्तेः प्रथमं प्रयोजनम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001974.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001975", "originalText": "तपो द्वितीयं प्रयोजनम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001975.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001976", "originalText": "योगभूमीनां देवत्वादिप्राप्तिहेतुतया तपस्त्वं द्रष्टव्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001976.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001977", "originalText": "तद्धेतुत्वं चार्जुनभगवतोः श्रीरामवसिष्ठयोश्च प्रश्नोत्तराभ्यामवगम्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001977.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001978", "originalText": "अर्जुन उवाच—\n``अयतिः श्रद्धयोपेतो योगाच्चलितमानसः।", "padacchedaText": "", "audioFile": "PB_hear2read_001978.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001979", "originalText": "अप्राप्य योगसंसिद्धिं कां गतिं कृष्ण गच्छति।", "padacchedaText": "", "audioFile": "PB_hear2read_001979.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001980", "originalText": "कच्चिन्नोभयविभ्रष्टश्छिन्नाभ्रमिव नश्यति।", "padacchedaText": "", "audioFile": "PB_hear2read_001980.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001981", "originalText": "अप्रतिष्ठो महाबाहो विमूढो ब्रह्मणः पथि।", "padacchedaText": "", "audioFile": "PB_hear2read_001981.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001982", "originalText": "एतं मे संशयं कृष्ण छेत्तुमर्हस्यशेषतः। त्वदन्यः संशयस्यास्य छेत्ता न ह्युपपद्यते''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001982.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001983", "originalText": "— (भगवद्गीतायां ६.३७—३९)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001983.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001984", "originalText": "भगवानुवाच—\n``पार्थ नैवेह नामुत्र विनाशस्तस्य विद्यते। न हि कल्याणकृत्कश्चिदुर्गतिं तात गच्छति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001984.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001985", "originalText": "प्राप्य पुण्यकृतां लोकानुषित्वा शाश्वतीः समाः। शुचीनां श्रीमतां गेहे योगभ्रष्टोऽभिजायते॥", "padacchedaText": "", "audioFile": "PB_hear2read_001985.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001986", "originalText": "अथवा योगिनामेव कुले भवति धीमताम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001986.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001987", "originalText": "एतद्धि दुर्लभतरं लोके जन्म यदीदृशम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001987.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001988", "originalText": "तत्र तं बुद्धिसंयोगं लभते पौर्वदेहिकम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001988.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001989", "originalText": "यतते च ततो भूयः संसिद्धौ कुरुनन्दन''। — (भगवद्गीतायां ६.४०—४३) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001989.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001990", "originalText": "श्री राम उवाच—\n``आद्यामथ द्वितीयां वा तृतीयां भूमिकामुत।", "padacchedaText": "", "audioFile": "PB_hear2read_001990.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001991", "originalText": "आरूढस्य मृतस्याथ कीदृशी भगवन् गतिः। — (योगवासिष्ठे निर्वाणप्रकरणे पूर्व.१२६.४४)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001991.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001992", "originalText": "वसिष्ठ उवाच——\n``योगभूमिकयोत्क्रान्तजीवितस्य शरीरिणः। भूमिकांशानुसारेण क्षीयते पूर्वदुष्कृतम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_001992.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001993", "originalText": "ततः सुरविमानेषु लोकपालपुरेषु च। मेरूपवनकुञ्जेषु रमते रमणीसखः॥", "padacchedaText": "", "audioFile": "PB_hear2read_001993.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001994", "originalText": "ततः सुकृतसम्भारे दुष्कृते च पुरा कृते। भोगक्षयपरिक्षीणे जायन्ते योगिनो भुवि॥", "padacchedaText": "", "audioFile": "PB_hear2read_001994.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001995", "originalText": "शुचीनां श्रीमतां गेहे गुप्ते गुणवतां सताम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001995.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001996", "originalText": "तत्र प्राग्भावनाभ्यस्तं योगभूमित्रयं बुधः। स्पृष्ट्वोपरि पतत्युच्चैरुत्तरं भूमिकाक्रमम्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_001996.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001997", "originalText": "इति। — (तत्रैव १२६.४७—५१)॥", "padacchedaText": "", "audioFile": "PB_hear2read_001997.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001998", "originalText": "अस्त्वेवं योगभूमीनां देवलोकप्राप्तिहेतुत्वम्, तावता तपस्त्वं कुत इति चेत्,\nश्रुतेरिति ब्रूमः।", "padacchedaText": "", "audioFile": "PB_hear2read_001998.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_001999", "originalText": "तथा च तैत्तिरीया आमनन्ति— ``तपसा देवा देवतामग्र आयन्, तपसर्षयः स्वरन्वविन्दन्'' (तैत्तिरीय उप० ब्राह्मणे ३.१२.३) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001999.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002000", "originalText": "तत्त्वज्ञानात् प्राचीनस्य भूमिकात्रयस्य तपस्त्वे सति तत्त्वज्ञानस्योत्तरकालीनस्य निर्विकल्पसमाधिरूपस्य पञ्चम्यादिभूमिकात्रयस्य तपस्त्वं कैमुतिकन्याय—सिद्धम्।", "padacchedaText": "", "audioFile": "PB_hear2read_002000.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002001", "originalText": "अत एव स्मर्यते—\n``मनसश्चेन्द्रियाणां च ऐकाग्र्यं परमं तपः। तज्ज्यायः सर्वधर्मेभ्यः स धर्मः पर उच्यते''॥", "padacchedaText": "", "audioFile": "PB_hear2read_002001.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002002", "originalText": "— (महाभारते १२.२४२.४) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_002002.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002003", "originalText": "यद्यप्यनेन न्यायेन तपसा प्राप्यं जन्मान्तरं नास्ति, तथापि लोकसङ्ग्रहायेदं तपो युज्यते। अत एव भगवानाह—\n``लोकसङ्ग्रहमेवापि सम्पश्यन् कर्तुमर्हसि''॥", "padacchedaText": "", "audioFile": "PB_hear2read_002003.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002004", "originalText": "— (भगवद्गीतायां ३.२०) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_002004.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002005", "originalText": "सङ्ग्राह्यश्च लोकस्त्रिविधः— शिष्यो भक्तस्तटस्थश्चेति।", "padacchedaText": "", "audioFile": "PB_hear2read_002005.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002006", "originalText": "तत्र शिष्यस्यार्न्तमुखे योगिनि प्रामाणिकत्वबुद्ध्यतिशयेन तदुपदिष्टे तत्त्वे परमं विश्वासं प्राप्य चित्तं सहसा विश्राम्यति।", "padacchedaText": "", "audioFile": "PB_hear2read_002006.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002007", "originalText": "अत एव श्रूयते—\n``यस्य देवे परा भक्तिर्यथा देवे तथा गुरौ। तस्यैते कथितार्थाः प्रकाशन्ते महात्मनः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_002007.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002008", "originalText": "— (श्वेताश्वतरोपनिषदि ६.२३) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_002008.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002009", "originalText": "स्मर्यते च—\n``श्रद्धावाल्लभते ज्ञानं तत्परः संयतेन्द्रियः। ज्ञानं लब्ध्वा परां शान्तिमचिरेणाधिगच्छति''॥", "padacchedaText": "", "audioFile": "PB_hear2read_002009.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002010", "originalText": "— (भगवद्गीतायां ४.३९) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_002010.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002011", "originalText": "अन्नप्रदाननिवासस्थानकल्पनादिना योगिनं सेवमानो भक्तस्तदीयं तपः स्वयमेवादत्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_002011.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002012", "originalText": "तथा च श्रूयते—तस्य पुत्रा दायमुपयन्ति सुहृदः साधुकृत्यां द्विषन्तः पापकृत्याम्'' इति।", "padacchedaText": "", "audioFile": "PB_hear2read_002012.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002013", "originalText": "तटस्थोऽपि द्विविधः— आस्तिको नास्तिकश्चेति।", "padacchedaText": "", "audioFile": "PB_hear2read_002013.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002014", "originalText": "तत्रास्तिको योगिनः सन्मार्गाचरणं दृष्ट्वा स्वयमपि सन्मार्गे प्रवर्तते।", "padacchedaText": "", "audioFile": "PB_hear2read_002014.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002015", "originalText": "तथा च स्मृतिः—\n``यद्यदाचरति श्रेष्ठस्तत्तदेवेतरो जनः। स यत्प्रमाणं कुरुते लोकस्तदनुवर्तते''॥", "padacchedaText": "", "audioFile": "PB_hear2read_002015.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002016", "originalText": "— (भगवद्गीतायां ३.२१) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_002016.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002017", "originalText": "नास्तिकोऽपि योगिना दृष्टः पापान्मुच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_002017.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002018", "originalText": "तदुक्तम्—\n``यस्यानुभवपर्यन्ता तत्त्वे बुद्धिः प्रवर्तते। तद्दृष्टिगोचराः सर्वे मुच्यन्ते सर्वपातकैः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_002018.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002019", "originalText": "— (सूतसंहितायां २२०.४४) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_002019.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002020", "originalText": "अनेन प्रकारेण सर्वप्राण्युपकारित्वं योगिनो विवक्षित्वा पठ्यते—\n``स्नातं तेन समस्ततीर्थसलिले सर्वाऽपि दत्ताऽवनि—\nर्यज्ञानां च सहस्रमिष्टमखिला देवाश्च सम्पूजिताः।", "padacchedaText": "", "audioFile": "PB_hear2read_002020.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002021", "originalText": "संसाराच्च समुद्धृताः स्वपितरस्त्रैलोक्यपूज्योऽप्यसौ\nयस्य ब्रह्मविचारणे क्षणमपि स्थैर्यं मनः प्राप्नुयात्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_002021.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002022", "originalText": "— (लघुयोगवासिष्ठे ६.१६.३४) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_002022.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002023", "originalText": "``कुल पवित्रं जननी कृतार्था विश्वम्भरा पुण्यवती च तेन। अपारसंवित्सुखसागरेऽस्मिल्लीनं परे ब्रह्मणि यस्य चेतः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_002023.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002024", "originalText": "— (सूतसंहितायां २ २०.४५) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_002024.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002025", "originalText": "न केवलं योगिनः शास्त्रीयव्यवहारस्यैव तपस्त्वम्, किं तु सर्वस्यैव लौकिकव्यवहारस्यापि।", "padacchedaText": "", "audioFile": "PB_hear2read_002025.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002026", "originalText": "तथा च तैत्तिरीयाः स्वशाखायां नारायणस्यान्तिमेनानुवाकेन विदुषोऽपि महिमानमामनन्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_002026.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002027", "originalText": "तस्मिंश्चानुवाके पूर्वभागे योगिनोऽवयवा यज्ञाङ्गद्रव्यत्वेनाम्नाताः—\n``तस्यैवं विदुषो यज्ञस्यात्मा यजमानः श्रद्धा पत्नी शरीरमिध्ममुरो वेदिर्लोमानि बर्हिर्वेदः शिखा हृदयं यूपः काम आज्यं मन्युः पशुस्तपोऽग्निर्दमः शमयिता दक्षिणा वाग्घोता प्राण उद्गाता चक्षुरध्वर्युर्मनो ब्रह्मा श्रोत्रमग्नीत्''।", "padacchedaText": "", "audioFile": "PB_hear2read_002027.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002028", "originalText": "(नारायणोपनिषदि ८०) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_002028.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002029", "originalText": "अत्र च दानं दक्षिणेति दानपदमध्याहर्तव्यम्, ``अथ यत्तपोदानमार्जवमहिंसा सत्यवचनमिति ता अस्य दक्षिणा'' (छान्दोग्योपनिषदि ३.१७.४) इति छन्दोगैराम्नातत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_002029.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002030", "originalText": "उक्तानुवाके मध्यमभागेन योगिव्यवहारास्तज्जीवनकालाश्च ज्योतिष्टोमावयवक्रियारूपत्वेन सर्वयज्ञावयवक्रियारूपत्वेन चाम्नाताः— ``यावद्ध्रियते सा दीक्षा यदश्नाति तद्धविर्यत्पिबति तदस्य सोमपानं यद्रमते तदुपसदो यत्सञ्चरत्युपविशत्युत्तिष्ठते च स प्रवर्ग्यो यन्मुखं तदाहवनीयो या व्याहृतिराहुतिर्यदस्य विज्ञानं तज्जुहोति यत्सायं प्रातरत्ति तत्समिधं यत्प्रातर्मध्यन्दिनं सायं च तानि सवनानि ये अहोरात्रे ते दर्शपूर्णमासौ येऽर्धमासाश्च मासाश्च ते चातुर्मास्यानि य ऋतवस्ते पशुबन्धा ये संवत्सराश्च परिवत्सराश्च तेऽहर्गणाः सर्ववेदसं वा एतत्सत्रं यन्मरणं तदवभृथः'' (नारायण उप०.८०) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_002030.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002031", "originalText": "सर्ववेदसं सर्वस्वदक्षिणाकम्।", "padacchedaText": "", "audioFile": "PB_hear2read_002031.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002032", "originalText": "अत्रैतच्छब्देन प्रकृताहोरात्रादिपरिवत्सरान्तं सर्वकालसमष्ट्युपलक्षितं योगिन आयुर्विवक्ष्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_002032.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002033", "originalText": "यदायुस्तत्सर्वस्वदक्षिणोपेतं सत्त्रमित्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_002033.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002034", "originalText": "उक्तानुवाके चरमभागेन सर्वयज्ञात्मकं योगिनमुपासीनस्य क्रममुक्तिरूपं सूर्याचन्द्रमसोः कार्यकारणब्रह्मणोस्तादात्म्यलक्षणं फलमाम्नायते—\n``एतद्वै जरामर्यमग्निहोत्र सत्रं य एवं विद्वानुदगयने प्रमीयते देवानामेव महिमानं गत्वादित्यस्य सायुज्यं गच्छत्यथ यो दक्षिणे प्रमीयते पितृणामेव महिमानं गत्वा चन्द्रमसः सायुज्य सलोकतामाप्नोत्येतौ वै सूर्याचन्द्रमसोर्महिमानौ ब्राह्मणो विद्वानभिजयति तस्माद्ब्रह्मणो महिमानमाप्नोति तस्माद्ब्रह्मणो महिमान—मित्युपनिषत्'' (नारायण उप०.८०) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_002034.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002035", "originalText": "जरामरणावधिकं यद्योगिचरितमस्ति तद्वेदोक्ताग्निहोत्रादिसंवत्सरसत्रान्त—कर्मस्वरूपमित्येवमुपासीनो भावनातिशयेन सूर्याचन्द्रमसोः सायुज्यं तादात्म्यं प्राप्नोति।", "padacchedaText": "", "audioFile": "PB_hear2read_002035.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002036", "originalText": "भावनामान्द्येन समानलोकं प्राप्य तस्मिल्लोँके सूर्याचन्द्रमसोर्विभूतिमनुभूय तत ऊर्ध्वं सत्यलोके चतुर्मुखस्य ब्रह्मणो महिमानमाप्नोति।", "padacchedaText": "", "audioFile": "PB_hear2read_002036.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002037", "originalText": "तत्रोत्पन्नतत्त्वज्ञानस्तत ऊर्ध्वं सत्यज्ञानानन्दरूपस्य परब्रह्मणो महिमानं कैवल्यं प्राप्नोति।", "padacchedaText": "", "audioFile": "PB_hear2read_002037.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002038", "originalText": "इत्युपनिषदित्यनेन यथोक्तविद्यायास्तत्प्रतिपादकग्रन्थस्य चोपसंहारः क्रियते।", "padacchedaText": "", "audioFile": "PB_hear2read_002038.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002039", "originalText": "तदेवं जीवन्मुक्तेस्तपोरूपं द्वितीयं प्रयोजनं सिद्धम्।", "padacchedaText": "", "audioFile": "PB_hear2read_002039.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002040", "originalText": "विसंवादाभावस्तृतीयं प्रयोजनम्।", "padacchedaText": "", "audioFile": "PB_hear2read_002040.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002041", "originalText": "न खल्वन्तर्मुखे बाह्यव्यापारमपश्यति योगीश्वरे लौकिकस्तैर्थिको वा कश्चिद्विसंवदते।", "padacchedaText": "", "audioFile": "PB_hear2read_002041.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002042", "originalText": "लौकिक विसंवादो द्विविधः—कलहरूपो निन्दारूपश्च।", "padacchedaText": "", "audioFile": "PB_hear2read_002042.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002043", "originalText": "तत्र क्रोधादिरहितेन योगिना सह कथं नाम लौकिकः कलहायते? तद्राहित्यं च\nस्मर्यते—\n``क्रुध्यन्तं न प्रतिक्रुध्येदाकृष्टः कुशलं वदेत्''।", "padacchedaText": "", "audioFile": "PB_hear2read_002043.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002044", "originalText": "(मनुसंहितायां ६.४८)।", "padacchedaText": "", "audioFile": "PB_hear2read_002044.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002045", "originalText": "``अतिवादांस्तितिक्षेत नावमन्येत कञ्चन''।", "padacchedaText": "", "audioFile": "PB_hear2read_002045.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002046", "originalText": "(तत्रैव ६.४७)।", "padacchedaText": "", "audioFile": "PB_hear2read_002046.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002047", "originalText": "ननु जीवन्मुक्तेः प्राचीनो विद्वत्संन्यासस्ततोऽपि प्राचीनं तत्त्वज्ञानं तस्मादपि प्राचीनो विविदिषासन्न्यासः।", "padacchedaText": "", "audioFile": "PB_hear2read_002047.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002048", "originalText": "तत्रैते क्रोधादिराहित्यादयो धर्माः स्मृता इति चेत्—\nबाढम्।", "padacchedaText": "", "audioFile": "PB_hear2read_002048.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002049", "originalText": "अत एव जीवन्मुक्तस्य क्रोधादयः शङ्कितुमप्यशक्याः।", "padacchedaText": "", "audioFile": "PB_hear2read_002049.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002050", "originalText": "अत्यर्वाचीने पदे विविदिषासंन्यासेऽपि यदा क्रोधादयो न सन्ति तदोत्तमपदे तत्त्वज्ञाने कुतस्ते स्युः, कुतस्तरां च विद्वत्सन्न्यासे, कुतस्तमां च जीवन्मुक्तौ? अतो न योगिना सह लौकिकस्य कलहः सम्भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_002050.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002051", "originalText": "नापि निन्दारूपो विसंवादः शङ्कनीयः।", "padacchedaText": "", "audioFile": "PB_hear2read_002051.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002052", "originalText": "निन्द्यत्वस्यानिश्चितत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_002052.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002053", "originalText": "तथा च स्मर्यते—\n``यं न सन्तं न चासन्तं नाश्रुतं न बहुश्रुतम्। न सुवृत्तं न दुर्वृत्तं वेद कश्चित्स वै यतिः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_002053.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002054", "originalText": "— (वसिष्ठस्मृतौ ६.४०) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_002054.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002055", "originalText": "सदसत्त्वे उत्तमाधमजाती।", "padacchedaText": "", "audioFile": "PB_hear2read_002055.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002056", "originalText": "तैर्थिकोऽपि किं शास्त्रप्रमेये विसंवदते किं वा योगिचरिते।", "padacchedaText": "", "audioFile": "PB_hear2read_002056.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002057", "originalText": "आद्ये न तावद्योगी परशास्त्रप्रमेयं दूषयति— ``तमेवैकं जानथ आत्मानमन्या वाचो विमुञ्चथ'' (मुण्डकोपनिषदि २.२.५), ``नानुध्यायाद्बहूञ्शब्दान्वाचो विग्लापनं हि तत्'' (बृह. उप०.४.४.२१) इत्यादिश्रुत्यनुरोधात्।", "padacchedaText": "", "audioFile": "PB_hear2read_002057.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002058", "originalText": "नापि स्वशास्त्रप्रमेयं प्रतिवादिनोऽग्रे समर्थयते,\n``पलालमिव धान्यार्थी त्यजेद्ग्रन्थमशेषतः''।", "padacchedaText": "", "audioFile": "PB_hear2read_002058.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002059", "originalText": "(अमृतबिन्दूपनिषदि १८)।", "padacchedaText": "", "audioFile": "PB_hear2read_002059.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002060", "originalText": "``परमं ब्रह्म विज्ञाय उल्कावत्तान्यथोत्सृजेत्''।", "padacchedaText": "", "audioFile": "PB_hear2read_002060.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002061", "originalText": "(अमृतनादोपनिषदि १)\nयदा योगी प्रतिवादिनमपि स्वात्मतया वीक्षते तदा विजिगीषायाः का कथा? नापि लौकायतिकव्यतिरिक्तः सर्वोऽपि तैर्थिको मोक्षमङ्गीकुर्वन् योगिचरितेऽपि विसंवदितुमर्हति आर्हतबौद्धवैशेषिकनैयायिकशैववैष्णवशाक्तसाङ्ख्ययोगादिमोक्षशास्त्रेषु प्रतिपाद्यप्रमेयस्य नानाविध—त्वेऽपि मोक्षसाधनस्य यमनियमाद्यष्टाङ्गयोगस्यैकविधत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_002061.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002062", "originalText": "तस्मादविसंवादेन सर्वसम्मतो योगीश्वरः।", "padacchedaText": "", "audioFile": "PB_hear2read_002062.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002063", "originalText": "एतदेवाभिप्रेत्य वसिष्ठ आह—\n``यस्येदं जन्म पाश्चात्त्यं तमाश्वेव महामते। विशन्ति विद्या विमला मुक्ता वेणुमिवोत्तमम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_002063.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002064", "originalText": "— (योगवासिष्ठे उपशमप्रकरणे ६.८)॥", "padacchedaText": "", "audioFile": "PB_hear2read_002064.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002065", "originalText": "``आर्यता हृद्यता मैत्री सौम्यता मुक्तता ज्ञता। समाश्रयन्ति तं नित्यमन्तः पुरमिवाङ्गनाः॥", "padacchedaText": "", "audioFile": "PB_hear2read_002065.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002066", "originalText": "— (तत्रैव ६.९)॥", "padacchedaText": "", "audioFile": "PB_hear2read_002066.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002067", "originalText": "``पेशलाचारमधुरं सर्वे वाञ्छन्ति तं जनाः। वेणुं मधुरनिध्वानं वने वनमृगा इव॥", "padacchedaText": "", "audioFile": "PB_hear2read_002067.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002068", "originalText": "— (तत्रैव ६.१२)॥", "padacchedaText": "", "audioFile": "PB_hear2read_002068.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002069", "originalText": "``सुषुप्तवत्प्रशमितभाववृत्तिना\nस्थितः सदा जाग्रति येन चेतसा। कलान्वितो विधुरिव यः सदा बुधै—\nनिषेव्यते मुक्त इतीह स स्मृतः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_002069.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002070", "originalText": "— (लघुयोगवासिष्ठे १६.२२) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_002070.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002071", "originalText": "``मातरीव शमं यान्ति विषमाणि मृदूनि च। विश्वासमिह भूतानि सर्वाणि शमशालिनि॥", "padacchedaText": "", "audioFile": "PB_hear2read_002071.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002072", "originalText": "— (लघुयोगवासिष्ठे ४.६२) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_002072.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002073", "originalText": "``तपस्विषु बहुज्ञेषु याजकेषु नृपेषु च। बलवत्सु गुणाढ्येषु शमवानेव राजते''॥", "padacchedaText": "", "audioFile": "PB_hear2read_002073.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002074", "originalText": "— (तत्रैव ४.६६) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_002074.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002075", "originalText": "तदेवमबाधं जीवन्मुक्तेर्विसंवादाभावरूपं तृतीयं प्रयोजनं सिद्धम्।", "padacchedaText": "", "audioFile": "PB_hear2read_002075.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002076", "originalText": "दुःखनाशसुखाविर्भावरूपे चतुर्थपञ्चमप्रयोजने विद्यानन्दात्मकेन ब्रह्मानन्दगतेन चतुर्थाध्यायेन निरूपिते। तदुभयमत्र सङ्क्षिप्योच्यते—\n``आत्मानं चेद्विजानीयादयमस्मीति पूरुषः॥", "padacchedaText": "", "audioFile": "PB_hear2read_002076.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002077", "originalText": "किमिच्छन्कस्य कामाय शरीरमनुसञ्ज्वरेत्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_002077.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002078", "originalText": "— (बृह. उप०.४.४.१२)॥", "padacchedaText": "", "audioFile": "PB_hear2read_002078.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002079", "originalText": "इत्यादिश्रुत्या दुःखस्यैहिकस्य विनाश उक्तः।", "padacchedaText": "", "audioFile": "PB_hear2read_002079.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002080", "originalText": "``एतह?? वाव न तपति किमहं साधु नाकरवं किमहं पापमकरवम्'' (तै. उप०.२.९) इत्यादिश्रुतय आमुष्मिकहेतुपुण्यपापचिन्तारूपस्य दुःखस्य नाशमाहुः।", "padacchedaText": "", "audioFile": "PB_hear2read_002080.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002081", "originalText": "सुखाविर्भावस्त्रेधा—सर्व—कामावाप्तिः, कृतकृत्यत्वं, प्राप्तप्राप्तव्यत्वं चेति।", "padacchedaText": "", "audioFile": "PB_hear2read_002081.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002082", "originalText": "सर्वकामावाप्तिस्त्रेधा—सर्वसाक्षित्वं, सर्वत्राकामहतत्वं, सर्वभोक्तृरूपत्वं चेति।", "padacchedaText": "", "audioFile": "PB_hear2read_002082.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002083", "originalText": "``हिरण्यगर्भादिस्थावरान्तेषु देहेष्वनुगतं साक्षिचैतन्यरूपं यद्ब्रह्म तदेवाहमस्मि''— इति जानतः स्वदेह इव परदेहेष्वपि सर्वकामसाक्षित्वमस्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_002083.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002084", "originalText": "तदेतदभिप्रेत्य श्रूयते—``सोऽश्नुते सर्वान्कामान्सह ब्रह्मणा विपश्चिता'' (तै. उप०.२.१) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_002084.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002085", "originalText": "लोके भुक्तेषु भोगेष्वकामहतत्वं यत्तत्कामप्राप्तिरित्युच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_002085.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002086", "originalText": "तथा च सर्वभोगदोषदर्शिनस्तत्त्वविदः सर्वत्राकामहतत्वादस्ति सर्वकामावाप्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_002086.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002087", "originalText": "अत एव सार्वभौमोपक्रमेषु हिरण्यगर्भपर्यन्तेषूत्तरोत्तर—शतगुणेष्वानन्देषु ``श्रोत्रियस्य चाकामहतस्य'' (तैत्तिरीयोपनिषदि २.८.१) इति श्रुतम्।", "padacchedaText": "", "audioFile": "PB_hear2read_002087.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002088", "originalText": "सद्रूपेण चिद्रूपेणानन्दरूपेण च सर्वत्रावस्थितं स्वात्मानमनुसन्दधतः सर्वभोक्तृत्वमस्तीत्यभिप्रेत्यैवं श्रूयते—\n``अहमन्नमहमन्नमहमन्नम्।", "padacchedaText": "", "audioFile": "PB_hear2read_002088.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002089", "originalText": "अहमन्नादोऽहमन्नादोऽहमन्नादः''। — (तैत्तिरीयोपनिषदि ३.१०) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_002089.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002090", "originalText": "कृतकृत्यत्वं तु स्मर्यते—\n``ज्ञानामृतेन तृप्तस्य कृतकृत्यस्य योगिनः। नैवास्ति किञ्चित्कर्तव्यमस्ति चेन्न स तत्त्ववित्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_002090.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002091", "originalText": "— (जाबालदर्शनोपनिषदि १.२३, उत्तरगीतायां १.१३ च.)॥", "padacchedaText": "", "audioFile": "PB_hear2read_002091.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002092", "originalText": "``यस्त्वात्मरतिरेव स्यादात्मतृप्तश्च मानवः। आत्मन्येव च सन्तुष्टस्तस्य कार्यं न विद्यते''॥", "padacchedaText": "", "audioFile": "PB_hear2read_002092.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002093", "originalText": "— (भगवद्गीताया, ३.१७) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_002093.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002094", "originalText": "प्राप्तप्राप्तव्यताऽपि श्रूयते— ``अभयं वै जनक प्राप्तोऽसि'' (बृ० उप० ४.२.२) इति, ``तस्मात्तत्सर्वमभवत्'' (बृ. उ.१.४.१०) इति, ``ब्रह्मवेद ब्रह्मैव भवति'' (मुण्डकोपनिषदि ३.२.९) इति च।", "padacchedaText": "", "audioFile": "PB_hear2read_002094.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002095", "originalText": "नन्वेतौ द्वौ दुःखविनाशसुखाविर्भावौ तत्त्वज्ञानेनैव सिद्धत्वान्न जीवन्मुक्तिप्रयोजनतामहर्तः।", "padacchedaText": "", "audioFile": "PB_hear2read_002095.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002096", "originalText": "मैवम्, सुरक्षितयोस्तयोरत्र विवक्षितत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_002096.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002097", "originalText": "यथा तत्त्वज्ञानं पूर्वमेवोत्पन्नमपि जीवन्मुक्त्या सुरक्षितं भवति, एवमेतावपि सुरक्षितौ भवतः।", "padacchedaText": "", "audioFile": "PB_hear2read_002097.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002098", "originalText": "नन्वेवं जीवन्मुक्तेः पञ्चप्रयोजनत्वे सति समाहितो योगीश्वरो लोकव्यवहारं कुर्वतस्तत्त्वविदोऽपि श्रेष्ठ इति वक्तव्यम्, तच्च रामवसिष्ठयोः प्रश्नोत्तराभ्यां निराकृतम्—\nश्रीरामः—\n``भगवन्भूतभव्येश कश्चिज्जातु समाहितः।", "padacchedaText": "", "audioFile": "PB_hear2read_002098.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002099", "originalText": "प्रबुद्ध इव विश्रान्तो व्यवहारपरोऽपि सन्॥ ५॥", "padacchedaText": "", "audioFile": "PB_hear2read_002099.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002100", "originalText": "कश्चिदेकान्तमाश्रित्य समाधिनियमे स्थितः। तयोस्तुः कतरः श्रेयानिति मे भगवन्वद॥ ६॥", "padacchedaText": "", "audioFile": "PB_hear2read_002100.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002101", "originalText": "— (लघुयोगवासिष्ठे २५.५—६)॥", "padacchedaText": "", "audioFile": "PB_hear2read_002101.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002102", "originalText": "वसिष्ठः—\n``इमं गुणसमाहारमनात्मत्वेन पश्यतः। अन्तः शीतलता यासौ समाधिरिति कथ्यते॥ ७॥", "padacchedaText": "", "audioFile": "PB_hear2read_002102.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002103", "originalText": "दृश्यैर्न मम सम्बन्ध इति निश्चित्य शीतलः। कश्चित्संव्यवहारस्थः कश्चिद्ध्यानपरायणः॥ ८॥", "padacchedaText": "", "audioFile": "PB_hear2read_002103.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002104", "originalText": "द्वावतौ राम सुसमावन्तश्चेत् परिशीतलौ। अन्तः शीतलता या स्यात्तदनन्ततपः फलम्''॥ ९॥", "padacchedaText": "", "audioFile": "PB_hear2read_002104.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002105", "originalText": "— (लघुयोगवासिष्ठे २५.७—९) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_002105.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002106", "originalText": "नैष दोषः।", "padacchedaText": "", "audioFile": "PB_hear2read_002106.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002107", "originalText": "अत्र वासनाक्षयरूपमन्तः शीतलत्वमवश्यं सम्पादनीयमित्येतावदेव प्रतिपाद्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_002107.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002108", "originalText": "न तु तदनन्तरभाविनो मनोनाशस्य श्रेष्ठत्वं निवार्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_002108.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002109", "originalText": "शीतलत्वं तृष्णायाः प्रशमनमित्येतादृशीं विवक्षां स्वयमेव स्पष्टीचकार—\n``अन्तः शीतलतायां तु लब्धायां शीतलं जगत्। अन्तस्तृष्णोपतप्तानां दावदाहमयं जगत्''॥ २४॥", "padacchedaText": "", "audioFile": "PB_hear2read_002109.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002110", "originalText": "— (तत्रैव २५.२४)॥", "padacchedaText": "", "audioFile": "PB_hear2read_002110.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002111", "originalText": "ननु समाधिनिन्दा व्यवहारप्रशंसा चात्रोपलभ्येते—\n``समाधिस्थानकस्थस्य चेतश्चेद्वृत्तिचञ्चलम्। तत्तस्य तु समाधानं सममुन्मत्तताण्डवैः॥ १०॥", "padacchedaText": "", "audioFile": "PB_hear2read_002111.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002112", "originalText": "उन्मत्तताण्डवस्थस्य चेतश्चेत्क्षीणवासनम्। तदस्योन्मत्तनृत्यं तु समं ब्रह्मसमाधिना''॥ ११॥", "padacchedaText": "", "audioFile": "PB_hear2read_002112.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002113", "originalText": "— (तत्रैव २५.१०—११) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_002113.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002114", "originalText": "मैवम्।", "padacchedaText": "", "audioFile": "PB_hear2read_002114.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002115", "originalText": "अत्र हि समाधिप्राशस्त्यमेवाङ्गीकृत्य वासना निन्द्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_002115.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002116", "originalText": "इयमत्र वचनव्यक्तिः— यद्यपि व्यवहारात्समाधिः प्रशस्तः, तथाप्यसौ सवासनश्चेत्तदा निर्वासनाद्व्यवहारादधम एवेति स न समाधिः।", "padacchedaText": "", "audioFile": "PB_hear2read_002116.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002117", "originalText": "यदा समाहितव्यवहर्तारावुभावप्यतत्त्वज्ञौ सवासनौ च तदा समाधेरुत्तमलोकप्राप्तिहेतुपुण्यत्वेन प्राशस्त्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_002117.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002118", "originalText": "यदा तूभौ ज्ञाननिष्ठौ निर्वासनौ च, तदाऽपि वासनाक्षयरूपां जीवन्मुक्तिं परिपालयन्नयं मनोनाशरूपः समाधिः प्रशस्त एव।", "padacchedaText": "", "audioFile": "PB_hear2read_002118.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002119", "originalText": "तस्माद् योगीश्वरस्य श्रेष्ठत्वात् पञ्चप्रयोजनोपेताया जीवन्मुक्तेर्न कोऽपि विघ्न इति सिद्धम्। इति श्रीमद्विद्यारण्यप्रणीते जीवन्मुक्तिविवेके जीवन्मुक्तिस्वरूपसिद्धिप्रयोजननिरूपणं नाम चतुर्थं प्रकरणम्॥ ४॥", "padacchedaText": "", "audioFile": "PB_hear2read_002119.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002120", "originalText": "५. विद्वत्संन्यासनिरूपणं नाम पञ्चमं प्रकरणम्\n\nएवं स्वरूपप्रमाणसाधनप्रयोजनैर्जीवन्मुक्तिर्निरूपिता।", "padacchedaText": "", "audioFile": "PB_hear2read_002120.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002121", "originalText": "अथ तदुपकारिणं विद्वत्संन्यासं निरूपयामः।", "padacchedaText": "", "audioFile": "PB_hear2read_002121.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002122", "originalText": "विद्वत्सन्न्यासश्च परमहंसोपनिषदि प्रतिपादितः।", "padacchedaText": "", "audioFile": "PB_hear2read_002122.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002123", "originalText": "तां चोपनिषदमनूद्य व्याख्यास्यामः।", "padacchedaText": "", "audioFile": "PB_hear2read_002123.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002124", "originalText": "तत्रादौ विद्वत्संन्यासयोग्यं प्रश्नमवतारयति—\n``अथ योगिनां परमहंसानां कोऽयं मार्गस्तेषां का स्थितिरिति नारदो भगवन्तमुपगत्योवाच'' इति।", "padacchedaText": "", "audioFile": "PB_hear2read_002124.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002125", "originalText": "यद्यप्यथशब्दापेक्षित आनन्तर्यप्रतियोगी न कोप्यत्र प्रतिभाति, तथाऽपि प्रष्टव्यार्थोऽत्र विद्वत्संन्यासः।", "padacchedaText": "", "audioFile": "PB_hear2read_002125.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002126", "originalText": "तस्मिंश्च विदिततत्त्वो लोकव्यवहारैर्विक्षिप्यमाणो मनोविश्रान्तिं कामयमानोऽधिकारी।", "padacchedaText": "", "audioFile": "PB_hear2read_002126.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002127", "originalText": "ततस्तादृ—गधिकारसम्पत्त्यानन्तर्यमथशब्दार्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_002127.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002128", "originalText": "केवलयोगिनं केवलपरमहंसं च वारयितुं पदद्वयमुक्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_002128.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002129", "originalText": "केवलयोगी तत्त्वज्ञानाभावेन त्रिकालज्ञानाकाशगमनादिषु योगैश्वर्यचमत्कारव्यवहारेष्वासक्तः संयमविशेषैस्तत्र तत्रोद्युङ्क्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_002129.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002130", "originalText": "ततः परमपुरुषार्थाद्भ्रष्टो भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_002130.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002131", "originalText": "अस्मिन्नर्थे सूत्रं पूर्वमेवोदाहृतं— ``ते समाधावुपसर्गा व्युत्थाने सिद्धयः'' (योगसूत्रेषु ३.३८) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_002131.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002132", "originalText": "केवलपरमहंसस्तु तत्त्वविवेकेनैश्वर्येष्वसारतां बुद्ध्वा विरज्यति।", "padacchedaText": "", "audioFile": "PB_hear2read_002132.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002133", "originalText": "तदप्युदाहृतम्—\n``चिदात्मन इमा इत्थं प्रस्फुरन्तीह शक्तयः। इत्यस्याश्चर्यजालेषु नाभ्युदेति कुतूहलम्''॥ ६७॥", "padacchedaText": "", "audioFile": "PB_hear2read_002133.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002134", "originalText": "— (लघुयोगवासिष्ठे २७.६७) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_002134.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002135", "originalText": "विरक्तोऽप्यसौ ब्रह्मविद्याभरेण विधिनिषेधावुल्लङ्घयति।", "padacchedaText": "", "audioFile": "PB_hear2read_002135.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002136", "originalText": "तदुक्तं—``निस्त्रैगुण्ये पथि विचरतां को विधिः को निषेधः'' (शुकाष्टके) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_002136.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002137", "originalText": "तथा च श्रद्धालवः शिष्टास्तमेवं निन्दन्ति—\n``सर्वे ब्रह्म वदिष्यन्ति सम्प्राप्ते तु कलौ युगे। नानुतिष्ठन्ति मैत्रेय शिश्नोदरपरायणाः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_002137.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002138", "originalText": "— इति।", "padacchedaText": "", "audioFile": "PB_hear2read_002138.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002139", "originalText": "योगिनि तु परमहंसे यथोक्तं दोषद्वयं नास्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_002139.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002140", "originalText": "अन्योऽप्यस्यातिशयः प्रश्नोत्तराभ्यां दर्शितः—\nश्रीरामः—\n``एवं स्थितेऽपि भगवञ्जीवन्मुक्तस्य सन्मतेः। अपूर्वोऽतिशयः कोऽसौ भवत्यात्मविदां वर''॥ १॥", "padacchedaText": "", "audioFile": "PB_hear2read_002140.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002141", "originalText": "— (लघुयोगवासिष्ठे ४२.१)॥", "padacchedaText": "", "audioFile": "PB_hear2read_002141.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002142", "originalText": "वसिष्ठः—\n``ज्ञस्य कस्मिंश्चिदप्येषा भवत्यतिशये न धीः। नित्यतृप्तः प्रशान्तात्मा स आत्मन्येव तिष्ठति॥ २॥", "padacchedaText": "", "audioFile": "PB_hear2read_002142.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002143", "originalText": "मन्त्रसिद्धैस्तपःसिद्धैर्योगसिद्धैश्च भूरिशः। कृतमाकाशयानादि तत्र का स्यादपूर्वता॥ ३॥", "padacchedaText": "", "audioFile": "PB_hear2read_002143.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002144", "originalText": "एक एव विशेषोऽस्य न समो मूढबुद्धिभिः। सर्वत्राऽऽस्थापरित्यागान्नीरागममलं मनः॥ ५॥", "padacchedaText": "", "audioFile": "PB_hear2read_002144.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002145", "originalText": "एतावदेव खलु लिङ्गमलिङ्गमूर्तेः\nसंशान्तसंसृतिचिरभ्रमनिर्वृतस्य। तज्ज्ञस्य यन्मदनकोपविषादमोह—\nलोभापदामनुदिनं निपुणं तनुत्वम्''॥ ६॥", "padacchedaText": "", "audioFile": "PB_hear2read_002145.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002146", "originalText": "— (लघुयोगवासिष्ठे ४२.२—६) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_002146.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002147", "originalText": "एतेनातिशयेनोपेतानां दोषद्वयरहितानां मार्गस्थिती पृच्छ्रयेते।", "padacchedaText": "", "audioFile": "PB_hear2read_002147.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002148", "originalText": "वेषभाषादिरूपो हि व्यवहारो मार्गः।", "padacchedaText": "", "audioFile": "PB_hear2read_002148.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002149", "originalText": "चित्तोपरमरूप आन्तरो धर्मः स्थितिः।", "padacchedaText": "", "audioFile": "PB_hear2read_002149.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002150", "originalText": "भगवांश्चतुर्मुखो ब्रह्मा।", "padacchedaText": "", "audioFile": "PB_hear2read_002150.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002151", "originalText": "यथोक्तं प्रश्नोत्तरमवतारयति—\n``तं भगवानाह'' इति।", "padacchedaText": "", "audioFile": "PB_hear2read_002151.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002152", "originalText": "वक्ष्यमाणमार्गे श्रद्धातिशयमुत्पादयितुं तं मार्गं प्रशंसति—\n``सोऽयं परमहंसानां मार्गो लोके दुर्लभतरो न तु बाहुल्यः'' (परम० उप० १) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_002152.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002153", "originalText": "यः पृष्टः सोऽयमिति योजना।", "padacchedaText": "", "audioFile": "PB_hear2read_002153.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002154", "originalText": "अयमित्युत्तरग्रन्थे वक्ष्यमाण आच्छादनादिः स्वशरीरोपभोगेन लोकोपकारेण च निरपेक्षो मुख्यो मार्गःः परामृश्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_002154.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002155", "originalText": "तादृशस्य परमकाष्ठां प्राप्तस्य वैराग्यस्यादृष्ट—चरत्वात्तस्य मार्गस्य दुर्लभतरत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_002155.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002156", "originalText": "न चैतावतात्यन्ताभावः शङ्कनीय इत्यभिप्रेत्य बाहुल्यमेव प्रतिषेधति— न त्विति।", "padacchedaText": "", "audioFile": "PB_hear2read_002156.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002157", "originalText": "बाहुल्यमिति वक्तव्ये लिङ्गव्यत्ययश्छान्दसः।", "padacchedaText": "", "audioFile": "PB_hear2read_002157.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002158", "originalText": "नन्वयं मार्गों दुर्लभतरश्चेत्तर्हि तदर्थं प्रयासो न कर्तव्यः, तेन प्रयोजनाभावादित्याशङ्क्याह—\n``यद्येकोऽपि भवति स एव नित्यपूतस्थः स एव वेदपुरुष इति विदुषो मन्यन्ते'' (परमहंसोपनिषदि १) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_002158.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002159", "originalText": "``मनुष्याणां सहस्रेषु कश्चिद्यतति सिद्धये।", "padacchedaText": "", "audioFile": "PB_hear2read_002159.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002160", "originalText": "यततामपि सिद्धानां कश्चिन्मां वेत्ति तत्त्वतः''। — (भगवद्गीतायां ७.३)॥", "padacchedaText": "", "audioFile": "PB_hear2read_002160.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002161", "originalText": "इति न्यायेन यत्र क्वापि यदा कदाचिद्योगीपरमहंसो यदि कश्चिल्लभ्यते तर्हि स एव नित्यपूतस्थो भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_002161.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002162", "originalText": "नित्यपूतः परमात्मा, ``य आत्मापहतपाप्मा'' (छा० उप०.८.१) इति श्रुतेः।", "padacchedaText": "", "audioFile": "PB_hear2read_002162.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002163", "originalText": "एवकारेण केवलयोगी केवल परमहंसश्च व्यावर्त्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_002163.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002164", "originalText": "केवलयोगी नित्यपूतं न जानाति।", "padacchedaText": "", "audioFile": "PB_hear2read_002164.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002165", "originalText": "केवल परमहंसो जानन्नपि चित्तविश्रान्त्यभावाद्बहिर्मुखो ब्रह्मणि न तिष्ठति।", "padacchedaText": "", "audioFile": "PB_hear2read_002165.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002166", "originalText": "वेदप्रतिपाद्यः पुरुषो वेदपुरुषः।", "padacchedaText": "", "audioFile": "PB_hear2read_002166.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002167", "originalText": "विदुषो विद्वांसो ब्रह्मानुभवचित्तविश्रान्तिप्रतिपादकशास्त्रपारङ्गता योगिनः।", "padacchedaText": "", "audioFile": "PB_hear2read_002167.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002168", "originalText": "परमहंसस्य ब्रह्मनिष्ठत्वं सर्वे जना मन्यन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_002168.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002169", "originalText": "यथोक्ता विद्वांसस्तु तदप्यसहमाना ब्रह्मत्वमेव मन्यन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_002169.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002170", "originalText": "तथा च स्मर्यते—\n``दर्शनादर्शने हित्वा स्वयं केवलरूपतः। यस्तिष्ठति स तु ब्रह्मन्ब्रह्म न ब्रह्मवित्स्वयम्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_002170.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002171", "originalText": "इति।", "padacchedaText": "", "audioFile": "PB_hear2read_002171.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002172", "originalText": "अतो न प्रयोजनाभावः शङ्कितुमपि शक्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_002172.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002173", "originalText": "नित्यपूतस्थत्वं वेदपुरुषत्वं च मुखतो विशदयन्नर्थात् ``का स्थितिः?'' इति प्रश्नस्योत्तरं सूत्रयति—\n``महापुरुषो यच्चित्तं तत्सर्वदा मय्येवावस्थापयति, (मय्येवावतिष्ठते इति वा) तस्मादहं च तस्मिन्नेवावस्थितः (तस्मिन्नेवावस्थीयते इति वा) '' इति।", "padacchedaText": "", "audioFile": "PB_hear2read_002173.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002174", "originalText": "(परमहंसोपनिषदि १)॥", "padacchedaText": "", "audioFile": "PB_hear2read_002174.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002175", "originalText": "वैदिकज्ञानकर्माधिकारिषु पुरुषेषु मध्ये योगिनः परमहंसस्यात्यन्तमुत्तमत्वान्महापुरुषत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_002175.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002176", "originalText": "स च महापुरुषो यच्चित्तं स्वकीयं तत्सर्वदामय्येवावस्थापयति, संसारगोचराणां तदीयचित्तवृत्तीनामभ्यासवैराग्याभ्यां निरुद्धत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_002176.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002177", "originalText": "अत एव भगवान् प्रजापतिः शास्त्रसिद्धं परमात्मानं स्वानुभवेन परामृशन्मयीति व्यपदिशति।", "padacchedaText": "", "audioFile": "PB_hear2read_002177.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002178", "originalText": "यस्माद्योगी मय्येव चित्तं स्थापयति तस्मादहमपि परमात्मस्वरूपत्वेन तस्मिन्नेव योगिन्याविर्भूतोऽवस्थितोऽस्मि नेतरेष्वज्ञानिषु, तेषामविद्यावृतत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_002178.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002179", "originalText": "तत्त्ववित्स्वप्ययोगिषु बाह्यचित्तवृत्तिभिरावृतत्वान्नास्त्याविर्भावः।", "padacchedaText": "", "audioFile": "PB_hear2read_002179.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002180", "originalText": "इदानीं कोऽयं मार्ग इति पृष्टं मार्गमुपदिशति—\n``असौ स्वपुत्रमित्रकलत्रबन्ध्वादीञ्शिखायज्ञोपवीते स्वाध्यायं च सर्वकर्माणि संन्यस्यायं ब्रह्माण्डं च हित्वा कौपीनं दण्डमाच्छादनं च स्वशरीरोपभोगार्थाय लोकस्योपकारार्थाय च परिग्रहेत्'' (परम० उप० १) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_002180.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002181", "originalText": "यो गृहस्थः पूर्वजन्मसञ्चितपुण्यपुञ्जे परिपक्वे सति मातृपित्राज्ञादिना निमित्तेन विविदिषासंन्यासरूपं परमहंसाश्रममस्वीकृत्यैव श्रवणादिसाधनान्यनुष्ठाय तत्त्वं सम्यगवगच्छति, ततो गृहस्थस्य प्राप्तैर्लौकिकवैदिकव्यवहारसहस्रैश्चित्ते विक्षिप्ते सति विश्रान्तिसिद्धये विद्वत्सन्न्यासं चिकीर्षति, तं प्रति स्वपुत्रमित्रेत्याद्युपदेशः, पूर्वमेव विविदिषासन्न्यासं कृत्वा तत्त्वं विदितवतो विद्वत्सन्न्यासं चिकीर्षोः पुत्रकलत्रादिप्रसङ्गाभावात्।", "padacchedaText": "", "audioFile": "PB_hear2read_002181.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002182", "originalText": "नन्वयं विद्वत्संन्यासः किमितरसन्न्यासवत्प्रैषोच्चारणादिविध्युक्तप्रकारेण सम्पादनीयः, किं वा जीर्णवस्त्रसोपद्रवग्रामादित्यागवल्लौकिकत्यागमात्ररूपः? नाद्यः, तत्त्वविदः कर्तृत्त्वराहित्येन विधि—निषेधानधिकारात्।", "padacchedaText": "", "audioFile": "PB_hear2read_002182.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002183", "originalText": "अत एव स्मर्यते—\n``ज्ञानामृतेन तृप्तस्य कृतकृत्यस्य योगिनः। नैवास्ति किञ्चित्कर्तव्यमस्ति चेन्न स तत्त्ववित्॥", "padacchedaText": "", "audioFile": "PB_hear2read_002183.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002184", "originalText": "इति। — (जाबालदर्शनोपनिषदि १.२३) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_002184.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002185", "originalText": "न द्वितीयः।", "padacchedaText": "", "audioFile": "PB_hear2read_002185.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002186", "originalText": "कौपीनदण्डाद्याश्रमलिङ्गविधानश्रवणात्।", "padacchedaText": "", "audioFile": "PB_hear2read_002186.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002187", "originalText": "नैष दोषः, प्रतिपत्तिकर्मवदुभयरूपत्वोपपत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_002187.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002188", "originalText": "तथा हि— ज्योतिष्टोमे दीक्षितस्य दीक्षाङ्गनियमा—नुष्ठानकाले कण्डूयितुं हस्तं प्रतिषिध्य कृष्णविषाणा विहिता ``यद्धस्तेन कण्डूयेत पामानम्भावुकाः प्रजाः स्युर्यत्स्मयेत नग्नम्भावुकाः'' (तैत्तिरीयसंहितायां इति, ``कृष्णविषाणया कण्डूयते'' (तत्रैव ६.१.३) इति च।", "padacchedaText": "", "audioFile": "PB_hear2read_002188.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002189", "originalText": "तस्याश्च कृष्णविषाणायाः समाप्ते नियमे प्रयोजनाभावाद् वोढुमशक्यत्वाच्च त्यागः स्वत एव प्राप्तः।", "padacchedaText": "", "audioFile": "PB_hear2read_002189.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002190", "originalText": "तं च त्यागं सप्रकारं वेदो विदधाति— ``नीतासु दक्षिणासु चात्वाले कृष्णविषाणां प्रास्यति'' (तत्रैव ६.१.३) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_002190.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002191", "originalText": "तदिदं प्रतिपत्तिकर्म लौकिकं वैदिकं चेत्युभयरूपम्।", "padacchedaText": "", "audioFile": "PB_hear2read_002191.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002192", "originalText": "एवं विद्वत्संन्यासोऽप्युभयरूपः।", "padacchedaText": "", "audioFile": "PB_hear2read_002192.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002193", "originalText": "न च तत्त्वविदि शङ्कनीयः, चिदात्मन्यारोपितस्य कर्तृत्वस्य विद्ययाऽपोहितत्वेऽपि चिच्छायोपेतेऽन्तःकरणो—पाधौ विक्रियासहस्रयुक्ते स्वतःसिद्धस्य कर्तृत्वस्यात्यन्ताभावः यावद्द्रव्यभावितयाऽनपोहितत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_002193.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002194", "originalText": "न च ``ज्ञानामृतेन'' (जाबालदर्शनोपनिषदि १.२३) इत्यादिस्मृतिविरोधः, सत्यपि ज्ञाने विश्रान्तिरहितस्य तृप्त्यभावेन विश्रान्तिसम्पादनलक्षणकर्तव्यशेषसद्भावेन कृतकृत्यत्वाभावात्।", "padacchedaText": "", "audioFile": "PB_hear2read_002194.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002195", "originalText": "ननु तत्त्वविदोऽपि विध्यङ्गीकारे सति तेनापूर्वेण देहान्तरमारभ्येत।", "padacchedaText": "", "audioFile": "PB_hear2read_002195.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002196", "originalText": "मैवम्।", "padacchedaText": "", "audioFile": "PB_hear2read_002196.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002197", "originalText": "तस्यापूर्वस्य चित्तविश्रान्तिप्रतिबन्धनिवारणलक्षणस्य दृष्टफलस्य सम्भवे सत्यदृष्टफलकल्पनाया अन्याय्यत्वात्, अन्यथा श्रवणादिविधिष्वपि ब्रह्मज्ञानोत्पत्तिप्रतिबन्धनिवारणरूपं दृष्टफलमुपेक्ष्य जन्मान्तरहेतुत्वं कल्प्येत।", "padacchedaText": "", "audioFile": "PB_hear2read_002197.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002198", "originalText": "तस्माद्विध्यङ्गीकारे दोषाभावाद्विविदिषुरिव विद्वानपि गृहस्थो नान्दीमुखश्राद्धोपवास—जागरणादिविधिमनुसृत्यैव संन्यस्येत्।", "padacchedaText": "", "audioFile": "PB_hear2read_002198.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002199", "originalText": "यद्यप्यत्र श्राद्धादिकं नोपदिष्टं तथाप्यस्य विद्वत्सन्न्यासस्य विविदिषासन्न्यासविकृतित्वात् ``प्रकृतिवद्विकृतिः कर्तव्या'' इति न्यायेन तदीया धर्माः सर्वेऽप्यत्र प्राप्नुवन्ति, यथाग्निष्टोमस्य विकृतिष्वतिरात्रादिषु तदीयधर्मप्राप्तिस्तद्वत्।", "padacchedaText": "", "audioFile": "PB_hear2read_002199.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002200", "originalText": "तस्मादितरसन्न्यासवदत्रापि प्रैषमन्त्रेण पुत्रमित्रादित्यागं सङ्कल्पयेत्।", "padacchedaText": "", "audioFile": "PB_hear2read_002200.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002201", "originalText": "बन्ध्वादीनित्यादिशब्देन भृत्यपशुगृहक्षेत्रा—दिलौकिकपरिग्रहादिविशेषाः सङ्गृह्यन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_002201.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002202", "originalText": "स्वाध्यायं चेति चकारेण तदर्थनिर्णयोपयुक्तानि पदवाक्यप्रमाणशास्त्राणि वेदोपबृंहकाणीतिहासपुराणादीनि च समुच्चिनोति।", "padacchedaText": "", "audioFile": "PB_hear2read_002202.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002203", "originalText": "औत्सुक्यनिवृत्ति—मात्रप्रयोजनानां काव्यनाटकादीनां त्यागः कैमुतिकन्यायसिद्धः।", "padacchedaText": "", "audioFile": "PB_hear2read_002203.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002204", "originalText": "सर्वकर्माणीति सर्वशब्देन लौकिकवैदिकनित्यनैमित्तिकनिषिद्धकाम्यानि सङ्गृह्यन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_002204.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002205", "originalText": "पुत्रादित्यागेनैहिकभोगः परिहृतः।", "padacchedaText": "", "audioFile": "PB_hear2read_002205.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002206", "originalText": "सर्वकर्मत्यागेन चामुष्मिकभोगाशा चित्तविक्षेपकारिणी परिहृता।", "padacchedaText": "", "audioFile": "PB_hear2read_002206.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002207", "originalText": "अयमिति छान्दसविभक्तिलिङ्गव्यत्ययेनेदं ब्रह्माण्डमिति योजनीयम्।", "padacchedaText": "", "audioFile": "PB_hear2read_002207.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002208", "originalText": "ब्रह्माण्डत्यागो नाम तत्प्राप्तिहेतोर्विराडुपासनस्यत्यागः।", "padacchedaText": "", "audioFile": "PB_hear2read_002208.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002209", "originalText": "ब्रह्माण्डं चेति चकारेण सूत्रात्मप्राप्तिहेतोर्हिरण्यगर्भोपासनस्य तत्त्वज्ञानहेतूनां श्रवणादीनां च समुच्चयः।", "padacchedaText": "", "audioFile": "PB_hear2read_002209.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002210", "originalText": "स्वपुत्रादिहिरण्यगर्भोपासनान्तमैहिकमामुष्मिकं च सुखसाधनं सर्वं प्रैषमन्त्रोच्चारणेन परित्यज्य कौपीनादिकं परिगृह्णीयात्।", "padacchedaText": "", "audioFile": "PB_hear2read_002210.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002211", "originalText": "आच्छादनं चेति चकारेण पादुकादीनि समुच्चिनोति।", "padacchedaText": "", "audioFile": "PB_hear2read_002211.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002212", "originalText": "तथा च स्मृतिः—\n``कौपीनयुगलं वासः कन्थां शीतनिवारिणीम्। पादुके चापि गृह्णीयात्कुर्यान्नान्यस्य सङ्ग्रहम्''॥", "padacchedaText": "", "audioFile": "PB_hear2read_002212.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002213", "originalText": "— (हारीतसंहितायां ६.७२८, लघुविष्णुस्मृतौ ४.७) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_002213.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002214", "originalText": "स्वशरीरोपभोगो नाम कौपीनेन लज्जाव्यावृत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_002214.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002215", "originalText": "दण्डेन गोसर्पाद्युपद्रवपरिहारः।", "padacchedaText": "", "audioFile": "PB_hear2read_002215.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002216", "originalText": "आच्छादनेन शीतादिपरिहारः।", "padacchedaText": "", "audioFile": "PB_hear2read_002216.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002217", "originalText": "चकारात्पादुकाभ्यामुच्छिष्टदेशस्पर्शादिपरिहारं समुच्चिनोति।", "padacchedaText": "", "audioFile": "PB_hear2read_002217.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002218", "originalText": "लोकस्योपकारो नाम दण्डादिलिङ्गेनैतदीयमुत्तमाश्रमं परिज्ञाय तदुचिताभिवन्दनभिक्षाप्रदानादिप्रवृत्त्या सुकृतसिद्धिः।", "padacchedaText": "", "audioFile": "PB_hear2read_002218.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002219", "originalText": "चकारेणाश्रममर्यादायाः शिष्टाचारप्राप्तायाः पालनं समुच्चिनोति। कौपीनादिपरिग्रहस्यानुकूलत्वमभिप्रेत्य मुख्यत्वं प्रतिषेधति—\n``तच्च न मुख्योऽस्ति'' इति (परम० उप०.१)॥", "padacchedaText": "", "audioFile": "PB_hear2read_002219.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002220", "originalText": "यत्कौपीनादिपरिग्रहणमस्ति तदप्यस्य योगिनः परमहंसस्य मुख्यः कल्पो न भवति, किं त्वनुकल्प एव।", "padacchedaText": "", "audioFile": "PB_hear2read_002220.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002221", "originalText": "विविदिषासंन्यासिनस्तु दण्डग्रहणं मुख्यमिति कृत्वा दण्डवियोगस्य निषेधः स्मर्यते—\n``दण्डात्मनोस्तु संयोगः सर्वदैव विधीयते। न दण्डेन विना गच्छेदिषुक्षेपत्रयं बुधः''॥", "padacchedaText": "", "audioFile": "PB_hear2read_002221.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002222", "originalText": "— (सन्यासोपनिषदि २.११) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_002222.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002223", "originalText": "प्रायश्चित्तमपि दण्डनाशे प्राणायामशतं स्मर्यते— ``दण्डत्यागे शतं चरेत्'' इति।", "padacchedaText": "", "audioFile": "PB_hear2read_002223.mp3", "zipFile": "JivanMuktiViveka.zip"}, {"id": "B_002224", "originalText": "योगिनः परमहंसस्य मुख्यं कल्पं प्रश्नोत्तराभ्यां दर्शयति—\n``कोऽयं मुख्य इति चेदयं मुख्यः, न दण्डं न शिखं न यज्ञोपवीतं ना
