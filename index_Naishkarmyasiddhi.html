, {"id": "B_000774", "originalText": "दाह्यदाहकतैकत्र यथा स्याद्वह्निदारुणोः। ज्ञेयज्ञातृकतैवं स्यादहंज्ञात्रोः परस्परम्॥ ५९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000774.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000775", "originalText": "एवं तावदविद्योत्थस्यान्तःकरणस्य बाह्यविषयनिमित्त—\nरूपावच्छेदायाहंवृत्तिर्व्याप्रियते।", "padacchedaText": "", "audioFile": "PB_hear2read_000775.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000776", "originalText": "तयावच्छिन्नं\nसत्कूटस्थप्रत्यगात्मोपादानावबोधरूपस्याव्यवधानतया\nविषयभावं प्रतिपद्यत इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000776.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000777", "originalText": "तत्र तयोर्ज्ञात्रहंतारूपयो—\nरवभासकावभास्यसम्बन्धव्यतिरेकेण नान्यत्सम्बन्धान्तर—\nमुपपद्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000777.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000778", "originalText": "अहंतारूपं त्वात्मसात्कृत्वाऽहंकञ्चुकं\nपरिधायोपकार्यत्वोपकारकत्वक्षमः सन् बाह्यविषये—\nणोपकारिणापकारिणा वात्मात्मीयं सम्बन्धं प्रतिपद्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000778.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000779", "originalText": "तदभिधीयते।", "padacchedaText": "", "audioFile": "PB_hear2read_000779.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000780", "originalText": "इदं ज्ञानं भवेज्ज्ञातुर्ममज्ञानं तथाहमः। अज्ञानोपाधिनेदं स्याद्विक्रियातोऽहमो मम॥ ६०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000780.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000781", "originalText": "एकस्यैव ज्ञातुरन्तर्बाह्यनिमित्तभेदाद्विभिन्नेऽपि\nविषय इदं ममेति ज्ञानं द्वैरूप्यं जायत इत्युक्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000781.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000782", "originalText": "अत्रोपक्रियमाणापक्रियमाणस्यैव ज्ञातुर्विषये\nममप्रत्ययो भवति विपर्यये चेदम्प्रत्यय इति कथमवगम्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000782.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000783", "originalText": "अवगम्यतामन्वयव्यतिरेकाभ्याम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000783.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000784", "originalText": "तत्कथमित्याह।", "padacchedaText": "", "audioFile": "PB_hear2read_000784.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000785", "originalText": "अनुपक्रियमाणत्वान्न ज्ञातुः स्यादहं मम। घटादिवदिदं तु स्यान्मोहमात्रव्यपाश्रयात्॥ ६१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000785.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000786", "originalText": "मोहतत्कार्याश्रयत्वाज्ज्ञातृत्वविक्रिययोः\nपूर्वत्रेदंममज्ञान्वयः प्रदर्शितः।", "padacchedaText": "", "audioFile": "PB_hear2read_000786.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000787", "originalText": "अथाधुना तद्व्यतिरेकेण\nव्यतिरेकप्रदर्शनार्थाह।", "padacchedaText": "", "audioFile": "PB_hear2read_000787.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000788", "originalText": "विक्रियाज्ञानशून्यत्वान्नेदं न च ममात्मनः। उत्थितस्य सतोऽज्ञानं नाहमज्ञासिषं यतः॥ ६२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000788.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000789", "originalText": "आत्मानात्मविवेकस्येयत्ताप्रदर्शनार्थमाह।", "padacchedaText": "", "audioFile": "PB_hear2read_000789.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000790", "originalText": "वाक्यप्रत्यक्षमानाभ्यामियानर्थः प्रतीयते। अनर्थकृत्तमोहानिर्वाक्यादेव सदात्मनः॥ ६३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000790.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000791", "originalText": "द्वितीयाध्यायादौ श्रोतृचतुष्टयमुपन्यस्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000791.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000792", "originalText": "तत्र कृत्स्नानात्मनिवृत्तौ सत्यां यः प्रत्यगात्म—\nन्यवाक्यार्थतां प्रतिपद्यते स क्षपिताशेषान्तरायहेतुरिति\nन तं प्रति वक्तव्यं किंचिदप्यवशिष्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000792.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000793", "originalText": "योऽपि\nवाक्यश्रवणमात्रादेव प्रतिपद्यते तस्याप्यतीन्द्रिय—\nशक्तिमत्त्वान्न किंचिदप्यपेक्षितव्यमस्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000793.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000794", "originalText": "यश्च\nश्राविततत्त्वमस्यादिवाक्यः स्वयमेवान्वयव्यतिरेको कृत्वा\nतदवसान एव वाक्यार्थं प्रतिपद्यतेऽसावपि यथार्थं\nप्रतिपन्न इति पूर्ववदेवोपेक्षितव्यः।", "padacchedaText": "", "audioFile": "PB_hear2read_000794.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000795", "originalText": "यः पुनरन्वयव्यतिरेकौ कारयित्वापि पुनःपुनर्वाक्यं श्राव्यते\nयथाभूतार्थप्रतिपत्तये तस्य कृतान्वयव्यतिरेकस्य सतः\nकथं वाक्यं श्राव्यत इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000795.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000796", "originalText": "उच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000796.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000797", "originalText": "नवसंख्याहृतज्ञानो दशमो विभ्रमाद्यथा। न वेत्ति दशमोऽस्मीति वीक्षमाणोऽपि तान्नव॥ ६४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000797.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000798", "originalText": "अथ दृष्टान्तगतमर्थं दार्ष्टान्तिकार्थे\nसमर्पयिष्यन्नाह।", "padacchedaText": "", "audioFile": "PB_hear2read_000798.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000799", "originalText": "अपविद्धद्वयोऽप्येवं तत्त्वमस्यादिना विना। वेत्ति नैकलमात्मानं नान्वेष्यं चात्र कारणम्॥ ६५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000799.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000800", "originalText": "नान्वेष्यं चात्र कारणमित्युक्तं तत्कस्मादिति चोदिते\nप्रत्याहान्वेषणासहिष्णुत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000800.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000801", "originalText": "तत्कथमित्याह।", "padacchedaText": "", "audioFile": "PB_hear2read_000801.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000802", "originalText": "सेयं भ्रान्तिर्निरालम्बा सर्वन्यायविरोधिनी। सहते न विचारं सा तमो यद्वद्दिवाकरम्॥ ६६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000802.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000803", "originalText": "तस्याः खल्वस्या अविद्याया भ्रान्तेः सम्यग्ज्ञानोत्पत्तिद्वारेण\nनिवृत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000803.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000804", "originalText": "बुभुत्सोच्छेदिनी चास्य सदसीत्यादिना दृढम्। प्रतीचि प्रतिपत्तिः स्यान्नासौ मानान्तराद्भवेत्॥ ६७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000804.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000805", "originalText": "कथं पुनर्वाक्यं प्रतिपादयत्येवेति चेद् दृष्टान्तोक्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000805.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000806", "originalText": "जिज्ञासोर्दशमं यद्वन्नवातिक्रम्य ताम्यतः। त्वमेव दशमोऽसीति कुर्यादेवं प्रमां वचः॥ ६८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000806.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000807", "originalText": "सा च तत्त्वमस्यादिवाक्यश्रवणजा प्रमोत्पन्नवादेव।", "padacchedaText": "", "audioFile": "PB_hear2read_000807.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000808", "originalText": "न च नैवमिति प्रत्ययान्तर जायते।", "padacchedaText": "", "audioFile": "PB_hear2read_000808.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000809", "originalText": "तदेतद्दृष्टान्तेन\nप्रतिपादयति।", "padacchedaText": "", "audioFile": "PB_hear2read_000809.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000810", "originalText": "दशमोऽसीति वाक्योत्था न धीरस्य विहन्यते। आदिमध्यावसानेषु न नवस्वस्य संशयः॥ ६९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000810.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000811", "originalText": "एवं तत्त्वमसीत्यस्माद्द्वैतनुत्प्रत्यगात्मनि। सम्यग्ज्ञातत्वमर्थस्य जायेतैव प्रमा दृढा॥ ७०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000811.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000812", "originalText": "प्रत्यगात्मनि प्रमोपजायत इत्युक्तं तत्र चोद्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000812.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000813", "originalText": "किं यथा घटादिप्रमेयविषया प्रमा कर्त्रादि—\nकारकभेदानपह्नवेन जायते तथैवोताशेषकारक—\nग्रामोपमर्देन कर्तुः प्रत्यगात्मनीति।", "padacchedaText": "", "audioFile": "PB_hear2read_000813.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000814", "originalText": "उच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000814.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000815", "originalText": "प्रत्यक्तास्य स्वतोरूपं निष्क्रियाकारकाफलम्। अद्वितीयं तदिद्धा धीः प्रत्यगात्मेव लक्ष्यते॥ ७१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000815.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000816", "originalText": "यस्मादेवम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000816.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000817", "originalText": "विपश्चितोऽप्यतस्तस्यामात्मभावं वितन्वते। दवीयस्स्विन्द्रियार्थेषु क्षीयते ह्युत्तरोत्तरम्॥ ७२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000817.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000818", "originalText": "आह।", "padacchedaText": "", "audioFile": "PB_hear2read_000818.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000819", "originalText": "यदि वाक्यमेव यथाभूतार्थवबोधकमथ\nकस्य हेतोरविद्योत्थापितस्य कर्तृत्वादेरुपदेश इत्युक्ते\nप्रतिविधीयते।", "padacchedaText": "", "audioFile": "PB_hear2read_000819.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000820", "originalText": "भ्रान्तिप्रसिद्ध्यानूद्यार्थं तत्तत्वं भ्रान्तिबाधया। अयं नेत्युपदिश्येत तथैवं तत्त्वमित्यपि॥ ७३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000820.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000821", "originalText": "इममर्थं दृष्टान्तेन बुद्धावारोहयति।", "padacchedaText": "", "audioFile": "PB_hear2read_000821.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000822", "originalText": "स्थाणुः स्थाणुरितीवोक्तिर्न नृबुद्धिं निरस्यति। व्यनुवादात्तथैवोक्तिर्भ्रान्तिं पुंसो न बाधते॥ ७४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000822.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000823", "originalText": "यस्माच्छ्रोतृप्रसिद्धानुवाद्येव त्वमितिपदं\nतस्मादुद्दिश्यमानस्थत्वाद्दुःखित्वादेरविवक्षितत्वमेव।", "padacchedaText": "", "audioFile": "PB_hear2read_000823.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000824", "originalText": "विधीयमानत्वे हि सति विरोधप्रसङ्गो न तु विधीयमाना—\nनूद्यमानयोरिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000824.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000825", "originalText": "स्वप्रधानयोर्हि पदयोर्विरोधाशङ्का\nसामान्यलिङ्गतत्वात्तयोर्न विपर्यये।", "padacchedaText": "", "audioFile": "PB_hear2read_000825.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000826", "originalText": "अनालिङ्गितसामान्यौ न जिहासितवादिनौ। व्युत्थितौ तत्त्वमौ तस्मादन्योन्याभिसमीक्षणौ॥ ७५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000826.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000827", "originalText": "अपास्तसामान्यार्थत्वादनुवादस्थत्वाद्विधीयमानेन\nच सह विरोधाद्दुःखित्वादेरस्तु कामं जिहासितार्थयो—\nरसंसर्गो यथोपन्यस्तदोषविरहात्तत्त्वमर्थयोः संसर्गोऽस्तु\nनीलोत्पलवदिति चेन्नैवमप्युपपद्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000827.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000828", "originalText": "तस्मात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000828.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000829", "originalText": "तदर्थयोस्तु निष्ठात्मा द्वयपारोक्ष्यवर्जितः। नाद्वितीयं विनात्मानं नात्मा नित्यदृशा विना॥ ७६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000829.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000830", "originalText": "अत्राह।", "padacchedaText": "", "audioFile": "PB_hear2read_000830.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000831", "originalText": "किमिह जिहासितं किं वोपादित्सितमिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000831.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000832", "originalText": "उच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000832.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000833", "originalText": "प्रत्यगात्मार्थाभिधायिनस्त्वम्पदादुभयं प्रतीयतेऽहं\nदुःखी प्रत्यगात्मा च।", "padacchedaText": "", "audioFile": "PB_hear2read_000833.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000834", "originalText": "तत्र च प्रत्यगात्मनोऽहं\nदुःखीत्यनेनाभिसम्बन्ध आत्मयाथात्म्यानवबोधहेतुक\nएव।", "padacchedaText": "", "audioFile": "PB_hear2read_000834.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000835", "originalText": "अतोऽहमर्थोऽपसृष्टत्वादज्ञानोत्थत्वाच्च हेय इति\nप्रत्यक्षतोवसीयते।", "padacchedaText": "", "audioFile": "PB_hear2read_000835.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000836", "originalText": "तदर्थे किं हेयं किं वोपादेयमिति\nनावध्रियते।", "padacchedaText": "", "audioFile": "PB_hear2read_000836.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000837", "originalText": "तत इदमभिधीयते।", "padacchedaText": "", "audioFile": "PB_hear2read_000837.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000838", "originalText": "पारोक्ष्यं यत्तदर्थे स्यात्तद्धेयमहमर्थवत्। प्रतीचेवाहमोऽभेदः पारोक्ष्येणात्मनोऽपि मे॥ ७७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000838.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000839", "originalText": "कथं पुनस्तदर्थोऽद्वितीयलक्षणः प्रत्यगात्मोपाश्रयं\nसद्वितीयत्वं दुःखित्वं निरन्वयमपनुदतीति।", "padacchedaText": "", "audioFile": "PB_hear2read_000839.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000840", "originalText": "उच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000840.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000841", "originalText": "न\nचैतयोर्निवर्तकनिवर्त्यभावं वयं ब्रूमः।", "padacchedaText": "", "audioFile": "PB_hear2read_000841.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000842", "originalText": "कथं तर्हि।", "padacchedaText": "", "audioFile": "PB_hear2read_000842.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000843", "originalText": "त्वमर्थे प्रत्यगात्मनि प्रागनवबुद्धाद्वितीयता\nसानेनावबोध्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000843.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000844", "originalText": "अतोऽनवबोधनिरासेन तदुत्थस्य सद्वितीयत्वस्य त्वमर्थत्वस्य\nपरोक्षत्वस्य च तदर्थस्थस्य निरसनान्न वैयधिकरण्यादि—\nचोद्यस्यावसरोऽस्तीति।", "padacchedaText": "", "audioFile": "PB_hear2read_000844.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000845", "originalText": "तदिदमभिधीयते।", "padacchedaText": "", "audioFile": "PB_hear2read_000845.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000846", "originalText": "तत्त्वमर्थेन सम्पृक्तो नानात्वं विनिवर्तयेत्। नापरित्यक्तपारोक्ष्यं त्वं तदर्थं सिसृप्सति॥ ७८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000846.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000847", "originalText": "कस्मात्पुनः कारणात्तदर्थोऽद्वितीयलक्षणस्त्वमर्थेन\nप्रत्यगात्मना पृथगर्थः सन्नविद्योत्थं सद्वितीयत्वं\nनिहन्तीति।", "padacchedaText": "", "audioFile": "PB_hear2read_000847.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000848", "originalText": "उच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000848.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000849", "originalText": "विरोधात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000849.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000850", "originalText": "तदुच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000850.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000851", "originalText": "संसारिताद्वितीयेन पारोक्ष्यं चात्मना सह। प्रासङ्गिकं विरुद्धत्वात्तत्त्वम्भ्यां बाधनं तयोः॥ ७९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000851.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000852", "originalText": "तत्त्वमर्थयोस्तु बाधकत्वेऽन्यदपि कारणमुच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000852.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000853", "originalText": "अज्ञातपुरुषार्थत्वाच्छ्रौतत्वात्तत्त्वमर्थयोः। स्वमर्थमपरित्यज्य बाधकौ स्तां विरुद्धयोः॥ ८०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000853.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000854", "originalText": "एवं तावद्यथोपक्रान्तेन प्रक्रियावर्त्मना न\nप्रत्यक्षादिप्रमाणान्तरैर्विरोधगन्धोऽपि सम्भाव्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000854.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000855", "originalText": "यदा पुनः सर्वप्रकारेणापि यतमाना नैवेमं\nवाक्यार्थं सम्भावयामः प्रत्यक्षादिप्रमाणान्तरविरोधत\nएव तस्मिन्नपि पक्ष उच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000855.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000856", "originalText": "प्रत्यक्षादिविरुद्धं चेद्वाक्यमर्थं वदेत्क्वचित्। स्यात्तु तद्दृष्टिविध्यर्थं योषाग्निवदसंशयम्॥ ८१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000856.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000857", "originalText": "यदा तु तत्त्वमस्यादिवाक्यं सर्वप्रकारेणापि विचार्यमाणं\nन क्रियां कटाक्षेणापि वीक्षते तदा प्रसंख्यानादिव्यापारो\nदुस्सम्भाव्य इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000857.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000858", "originalText": "तदुच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000858.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000859", "originalText": "वस्त्वेकनिष्ठं वाक्यं चेन्न तस्य स्यात्क्रियार्थता। वस्तुनो ह्येकरूपत्वाद्विकल्पस्याप्यसम्भवः॥ ८२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000859.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000860", "originalText": "भिन्नविषयत्वाच्च न प्रमाणान्तरविरोधः।", "padacchedaText": "", "audioFile": "PB_hear2read_000860.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000861", "originalText": "कथम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000861.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000862", "originalText": "उच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000862.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000863", "originalText": "अपूर्वाधिगमं कुर्वत्प्रमाणं स्यान्न चेन्न तत्। न विरोधस्ततो युक्तो विभिन्नार्थावबोधिनोः॥ ८३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000863.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000864", "originalText": "य एवमपि भिन्नविषयाणां विरोधं वक्ति सोऽत्रापि विरोधं\nब्रूयात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000864.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000865", "originalText": "नायं शब्दः कुतो यस्माद्रूपं पश्यामि चक्षुषा। इति यद्वत्तथैवायं विरोधोऽक्षजवाक्ययोः॥ ८४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000865.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000866", "originalText": "प्रमाणानां सतां न विरोधः श्रोत्रादीनामिव\nभिन्नविषयत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000866.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000867", "originalText": "ययोश्चाभिन्नविषयत्वं तयोराखुनकुलयोरिव प्रतिनियत एव\nबाध्यबाधकभावः स्यात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000867.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000868", "originalText": "अतस्तदुच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000868.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000869", "originalText": "प्रत्यक्षं चेन्न शाब्दं स्याच्छाब्दं चेदक्षजं\nकथम्। प्रत्यक्षाभासः प्रत्यक्षे ह्यागमाभास आगमे॥ ८५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000869.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000870", "originalText": "न च प्रतिज्ञाहेतुदृष्टान्तन्याय इह सम्भवति\nशब्दादीनां प्रत्येकं प्रमाणत्वादत आह।", "padacchedaText": "", "audioFile": "PB_hear2read_000870.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000871", "originalText": "स्वमहिम्ना प्रमाणानि कुर्वन्त्यर्थावबोधनम्। इतरेतरसाचिव्ये प्रामाण्यं नेष्यते स्वतः॥ ८६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000871.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000872", "originalText": "न च सुखदुःखादिसम्बन्धोऽवगत्यात्मनः\nप्रत्यक्षादिप्रमाणैर्गृह्यते येन विरोधः\nप्रत्यक्षादिप्रमाणैरुद्धाट्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000872.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000873", "originalText": "दुःखितावगतिश्चेत्स्यान्न प्रमीयेत सात्मवत्। कर्मण्येव प्रमा न्याय्या न तु कर्तर्यपि क्वचित्॥ ८७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000873.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000874", "originalText": "अभ्युपगमेऽपि च प्रसंख्यानशतेनापि नैव त्वं\nसम्भावितदोषान्मुच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000874.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000875", "originalText": "अत आह।", "padacchedaText": "", "audioFile": "PB_hear2read_000875.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000876", "originalText": "प्रमाणबद्धमूलत्वाद्दुःखित्वं केन वार्यते। अग्न्युष्णवन्निवृत्तिश्चेन्नैरात्म्यं ह्येति सौगतम्॥ ८८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000876.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000877", "originalText": "अथ मतम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000877.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000878", "originalText": "निराकुर्यात्प्रसंख्यानं दुःखित्वं चेत्स्वनुष्ठितम्। प्रत्यक्षादिविरुद्धत्वात्कथमुत्पादयेत्प्रमाम्॥ ८९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000878.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000879", "originalText": "ननु प्रसंख्यानं नाम तत्त्वमस्यादिशब्दार्थान्वय—\nव्यतिरेकयुक्तिविषयबुद्ध्याम्रेडनमभिधीयते\nतच्चानुष्ठीयमानं प्रमितिवर्धनया परिपूर्णां\nप्रमितिं जनयति न पुनरैकाग्र्यवर्धनयेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000879.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000880", "originalText": "यथाशेषाशुचिनीडे स्त्रीकृणपे कामिनीति निर्वस्तुकः\nपुरुषायासमात्रजनितः प्रत्यय इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000880.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000881", "originalText": "तन्न।", "padacchedaText": "", "audioFile": "PB_hear2read_000881.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000882", "originalText": "यतः।", "padacchedaText": "", "audioFile": "PB_hear2read_000882.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000883", "originalText": "अभ्यासोपचयाद्बुद्धेर्यत्स्यादैकाग्र्यमेव तत्। न हि प्रमाणान्यभ्यासात्कुर्वन्त्यर्थावबोधनम्॥ ९०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000883.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000884", "originalText": "अभ्यासोपचिता कृत्स्नं भावना चेन्निवर्तयेत्। नैकान्तिकी निवृत्तिरस्स्याद्भावनाजं हि तत्फलम्॥ ९१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000884.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000885", "originalText": "अपि चाह।", "padacchedaText": "", "audioFile": "PB_hear2read_000885.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000886", "originalText": "दुःखस्मीत्यपि चेद्ध्वस्ता कल्पकोट्युपबृंहिता। स्वल्पीयोऽभ्यासजास्थास्न्वी भावनेत्यत्र का प्रमा॥ ९२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000886.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000887", "originalText": "ननु शास्त्रात्स्थास्नुत्वं भविष्यति।", "padacchedaText": "", "audioFile": "PB_hear2read_000887.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000888", "originalText": "नैवम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000888.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000889", "originalText": "यथावस्थितवस्तुयाथात्म्यावबोधमात्रकारित्वाच्छास्त्रस्य।", "padacchedaText": "", "audioFile": "PB_hear2read_000889.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000890", "originalText": "न हि पदार्थशक्त्याधानकृच्छास्त्रम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000890.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000891", "originalText": "प्रसिद्धं च\nलोके।", "padacchedaText": "", "audioFile": "PB_hear2read_000891.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000892", "originalText": "भावनाजं फलं यत्स्याद्यच्च स्यात्कर्मणः फलम्। न तत्स्थास्न्विति मन्तव्यं द्रविडेष्विव सङ्गतम्॥ ९३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000892.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000893", "originalText": "यद्यपि प्रत्यक्षादिप्रमाणोपातमात्मनो दुःखित्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000893.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000894", "originalText": "तथापि तत्त्वमस्यादिवाक्योत्थप्रत्यय एव बलीयानिति\nनिश्चयोऽव्यभिचारिप्रामाण्यवाक्योपत्तत्वात्प्रमेयस्य\nच स्वत एव निर्दुःखित्वसिद्धेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000894.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000895", "originalText": "प्रत्यक्षादेस्तु\nव्यभिचारित्वा—\nत्सम्भावनायाश्च पुरुषपरिकल्पनामात्राव—\nष्टम्भत्वाच्चेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000895.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000896", "originalText": "निर्दुःखित्वं स्वतस्सिद्धं प्रत्यक्षादेश्च दुःखिता। को ह्यात्मानमनादृत्य विश्वसेद्बाह्यमानतः॥ ९४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000896.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000897", "originalText": "सम्बन्धार्थ एव।", "padacchedaText": "", "audioFile": "PB_hear2read_000897.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000898", "originalText": "अपि प्रत्यक्षबाधेन प्रवृत्तिः प्रत्यगात्मनि। ᳚पराञ्चि खानि᳚ त्येतस्माद्वचसो गम्यते श्रुतेः॥ ९५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000898.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000899", "originalText": "अभ्युपगम्यैवमुच्यते न तु प्रमाणं सत्प्रमाणान्तरेण\nविरुध्यत इत्यसकृदवोचाम।", "padacchedaText": "", "audioFile": "PB_hear2read_000899.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000900", "originalText": "यत्रापि\nवाक्यप्रत्यक्षयोर्विरोधाशङ्का\nतत्रापि पुरुषमोहवशादेव सा जायते न तु परमार्थत इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000900.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000901", "originalText": "अत आह।", "padacchedaText": "", "audioFile": "PB_hear2read_000901.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000902", "originalText": "प्रमां चेज्जनयेद्वाक्यं प्रत्यक्षादिविरोधिनीम्। गौणीं प्रत्यक्षतां ब्रूयान्मुख्यार्थासम्भवाद्बुधः॥ ९६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000902.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000903", "originalText": "तस्यार्थस्य सुखप्रतिपत्त्यर्थमुदाहरणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000903.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000904", "originalText": "अग्निस्सम्यगधीतेऽसौ जहासोच्चैश्च मञ्चकः। यथा तद्वदहंवृत्त्या लक्ष्यतेऽनर्हयापि सः॥ ९७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000904.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000905", "originalText": "कस्मात्पुनः कारणात्साक्षादेवात्मा नाभिधीयते किमनया\nकल्पनयेति तत्राह।", "padacchedaText": "", "audioFile": "PB_hear2read_000905.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000906", "originalText": "त्वमित्यतद्विहायान्यन्न वर्तात्मावबोधते। समस्तीह त्वमर्थोऽपि गुणलेशेन वर्तते॥ ९८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000906.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000907", "originalText": "कस्मात्पुनर्हेतोर्ह्यहमित्येतदपि गुणलेशेन वर्तते न पुनः\nसाक्षादेवेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000907.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000908", "originalText": "विधूतसर्वकल्पनाकारणस्वाभाव्यादात्मनः\nअत आह।", "padacchedaText": "", "audioFile": "PB_hear2read_000908.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000909", "originalText": "व्योम्नि धूमतुषाराभ्रमलिनानीव दुर्धियः। कल्पयेयुस्तथा मूढाः संसारं प्रत्यगात्मनि॥ ९९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000909.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000910", "originalText": "ननु सर्वकल्पनानामप्यात्मन्यत्यन्तासम्भवे समानेऽहंवृत्तौ\nकः पक्षपाते हेतुर्येन वृत्त्यन्तराणि\nविधूयाहंवृत्त्यैवात्मोपलक्ष्यत इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000910.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000911", "originalText": "उच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000911.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000912", "originalText": "चिन्निभेयमहंवृत्तिः प्रतीचीवात्मनोऽन्यतः। पूर्वोक्तेभ्यश्च हेतुभ्यस्तस्मादात्मानयोच्यते॥ १००॥", "padacchedaText": "", "audioFile": "PB_hear2read_000912.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000913", "originalText": "वृत्तिभिर्युष्मदर्थाभिर्लक्ष्यते चेद्दृशिः परः। अनात्मत्वं भवेत्तस्य वितथं च वचः श्रुतेः॥ १०१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000913.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000914", "originalText": "यथोक्तेन।", "padacchedaText": "", "audioFile": "PB_hear2read_000914.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000915", "originalText": "अनेन गुणलेशेन ह्यत्यहंकर्तृकर्मया। लक्ष्यतेऽसावहंवृत्त्या नाञ्जसात्राभिधीयते॥ १०२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000915.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000916", "originalText": "नाञ्जसात्राभिधीयत इति को हेतुरिति चेत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000916.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000917", "originalText": "षष्ठीगुणक्रियाजातिरूढयः शब्दहेतवः। नात्मन्यन्यतमोऽमीषां तेनात्मा नाभिधीयते॥ १०३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000917.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000918", "originalText": "यदि शब्दोऽभिधानाभिधेयत्वसम्बन्धाङ्गीकारेण नात्मनि\nवर्तते कथं शब्दादहं ब्रह्मास्मीति सम्यग्बोधोत्पत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000918.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000919", "originalText": "उच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000919.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000920", "originalText": "असत्ये वर्त्मनि स्थित्वा निरुपायमुपेयते। आत्मत्वकारणाद्विद्मो गुणवृत्त्या विबोधिताः॥ १०४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000920.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000921", "originalText": "कथं पुनरभिधानमभिधेयेनानभिसम्बद्धं\nसदनभिधेयेऽर्थे\nप्रमां जनयतीति।", "padacchedaText": "", "audioFile": "PB_hear2read_000921.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000922", "originalText": "श‍ृणु यथानभिसम्बद्धमप्यनभिधे—\nयेऽर्थेऽविद्यानिराकरणमुखेन बोधयतीत्याह।", "padacchedaText": "", "audioFile": "PB_hear2read_000922.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000923", "originalText": "शयानाः प्रायशो लोके बोध्यमानाः स्वनामभिः। सहसैव प्रबुध्यन्ते यथैवं प्रत्यगात्मनि॥ १०५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000923.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000924", "originalText": "न हि नाम्नास्ति सम्बन्धो व्युत्थितस्य शरीरतः। तथापि बुध्यते तेन यथैवं तत्त्वमित्यतः॥ १०६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000924.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000925", "originalText": "यथा च।", "padacchedaText": "", "audioFile": "PB_hear2read_000925.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000926", "originalText": "बोधाबोधौ नभोऽस्पृष्ट्वा कृष्णधीनीडगौ यथा। बाध्येतरात्मकौ स्यातां तथेहात्मनि गम्यताम्॥ १०७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000926.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000927", "originalText": "᳚असत्ये वर्त्मनि स्थित्वा᳚ इत्युपश्रुत्यातिविस्मितो महता\nसम्भ्रमेण कश्चिच्चोदयति।", "padacchedaText": "", "audioFile": "PB_hear2read_000927.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000928", "originalText": "नासन्नुपायो लोकेऽस्ति परमार्थविनिश्चये। नासल्लिङ्गाद्धि बाष्पदेः कश्चिदग्निं प्रपद्यते॥ १०८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000928.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000929", "originalText": "इत्येवं चोदयेद्योऽपि जोषयेत्तं घटादिना। सदसद्भ्यां विभक्तोऽसौ पर्यायश्च न चानयोः॥ १०९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000929.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000930", "originalText": "एवं कुचोद्यमुन्मूल्याथेदानीं प्रकृतमभिधीयते।", "padacchedaText": "", "audioFile": "PB_hear2read_000930.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000931", "originalText": "प्रकृतं\nचानभिधेये कथमभिधाश्रुतिरविद्याध्वंस्यात्मनि ज्ञानं\nजनयतीति।", "padacchedaText": "", "audioFile": "PB_hear2read_000931.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000932", "originalText": "तत्रैव कारणान्तरमुच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000932.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000933", "originalText": "अतिदुस्स्थोऽप्रबोधोऽत्र ह्यात्मैवास्य प्रबुद्धता। निमित्तमात्राव्द्येत्येषा नासाग्रे बदरं यथा॥ ११०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000933.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000934", "originalText": "अनुदितानस्तमितकूटस्थबोधमात्रस्वाभाव्यादात्मनो\nदुस्सम्भाव्योऽविद्यासद्भाव इति चेन्न।", "padacchedaText": "", "audioFile": "PB_hear2read_000934.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000935", "originalText": "अविद्याप्रसिद्ध्यैव\nतत्सद्भावसिद्धेरुलूकनिशावदित्यत इदमुच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000935.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000936", "originalText": "अहो धार्ष्ट्यमविद्याया न कश्चिदतिवर्तते। प्रमाणं वस्त्वनादृत्य परमात्मेव तिष्ठति॥ १११॥", "padacchedaText": "", "audioFile": "PB_hear2read_000936.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000937", "originalText": "यस्मादविद्याप्रसिद्ध्यैवाविद्यासद्भावसिद्धिरत\nआत्मवस्तुवृत्तानुरोधेन न कथंचनापि तत्सम्भावनाप्यस्ति\nयत आह।", "padacchedaText": "", "audioFile": "PB_hear2read_000937.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000938", "originalText": "ज्ञानं यस्य निजं रूपं क्रियाकारकवर्जितम्। सम्भावनाप्यविद्यायास्तत्र स्यात्केन हेतुना॥ ११२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000938.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000939", "originalText": "सोऽयमेवमनुदितानस्तमितावगतिमात्रशरीर आत्मापि\nसन्नविचारितप्रसिद्धाविद्यामात्रव्यवहित एवातथैवेक्ष्यते\nयतोऽतः।", "padacchedaText": "", "audioFile": "PB_hear2read_000939.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000940", "originalText": "अनुमानादयं भावाव्द्यावृत्तोऽभावमाश्रितः। ततोऽप्यस्य निवृत्तिः स्याद्वाक्यादेव बुभुत्सतः॥ ११३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000940.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000941", "originalText": "न व्यावृत्तिर्यथा भावाद्भावेनैवाविशेषतः। अभावादप्यभावत्वाद्व्यावृत्तिर्न तथेष्यते॥ ११४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000941.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000942", "originalText": "भाववदभावादपि निवृत्तिरनुमानादेव किमिति न भवतीति\nचेच्छृणु।", "padacchedaText": "", "audioFile": "PB_hear2read_000942.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000943", "originalText": "यतो नानुमानेन व्याविद्धाशेषक्रियाकारकफलात्मनि\nस्वाराज्येऽभिषेक्तुं शक्यते तस्मात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000943.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000944", "originalText": "अविद्यानिद्रया सोऽयं प्रसुप्तो दुर्विवेकया। भावाभावव्युदासिन्या श्रुत्यैव प्रतिबोध्यते॥ ११५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000944.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000945", "originalText": "अत्राहानुदितानस्तमितविज्ञानात्ममात्रस्वरूपत्वाद्दुस्सम्भाव्या\nअविद्येति।", "padacchedaText": "", "audioFile": "PB_hear2read_000945.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000946", "originalText": "नैतदेवम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000946.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000947", "originalText": "कुतः।", "padacchedaText": "", "audioFile": "PB_hear2read_000947.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000948", "originalText": "यत आह।", "padacchedaText": "", "audioFile": "PB_hear2read_000948.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000949", "originalText": "कुतो अविद्येति चोद्यं स्यान्नैव प्राग्घेत्वसम्भवात्। कालत्रयापरिच्छित्तेर्न चोर्ध्वं चोद्यसम्भवः॥ ११६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000949.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000950", "originalText": "यस्मात्तत्त्वमस्यादिवाक्यमेवात्मनोऽशेषामविद्यां\nनिरन्वयामपनुदति तस्मात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000950.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000951", "originalText": "अद्धातममनादृत्य प्रमाणं सदसीति ये। बुभुत्सन्तेऽन्यतः कुर्युस्तेऽक्ष्णापि रसवेदनम्॥ ११७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000951.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000952", "originalText": "एवमप्रतिहतामहं ब्रह्मेति प्रमां तत्त्वमस्यादिवाक्यं\nकुर्वदपि न प्रतिपादयतीति चेदभिमतं न कुतश्चनापि\nप्रतिपत्तिः स्यादत आह।", "padacchedaText": "", "audioFile": "PB_hear2read_000952.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000953", "originalText": "इदं चेदनृतं ब्रूयात्सत्यामवगतावपि। न चान्यत्रापि विश्वासो ह्यवगत्यविशेषतः॥ ११८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000953.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000954", "originalText": "न चोपादित्सिताद्वाक्यार्थाद्वाक्यार्थान्तरं कल्पयितुं\nयुक्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000954.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000955", "originalText": "यस्मात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000955.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000956", "originalText": "न चेदनुभवोऽतः स्यात्पदार्थावगतावपि। कल्प्यं विध्यन्तरं तत्र न ह्यन्योऽर्थोऽवगम्यते॥ ११९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000956.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000957", "originalText": "न च यथाभिमतोऽर्थो यथोक्तेन न्यायेन नावसीयते।", "padacchedaText": "", "audioFile": "PB_hear2read_000957.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000958", "originalText": "कोऽसौ न्याय इत्याह।", "padacchedaText": "", "audioFile": "PB_hear2read_000958.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000959", "originalText": "नामादिभ्यो निराकृत्य त्वमर्थं निष्परिग्रहः। निस्स्पृहो युष्मदर्थेभ्यः शमादिविधिचोदितः॥ १२०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000959.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000960", "originalText": "भङ्क्त्वा चान्नमयादींस्तान्पञ्चानात्मतयार्गलान्। अहं ब्रह्मेति वाक्यार्थं वेत्ति चेन्नार्थ ईहया॥ १२१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000960.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000961", "originalText": "न चेदेवमुपगम्यते वाक्यस्य प्रमाणस्य सतोऽप्रामाण्यं\nप्राप्नोति।", "padacchedaText": "", "audioFile": "PB_hear2read_000961.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000962", "originalText": "तदाह।", "padacchedaText": "", "audioFile": "PB_hear2read_000962.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000963", "originalText": "यदर्थं च प्रवृत्तं यद्वाक्यं तत्र न चेच्छ्रुतम्। प्रमामुत्पादयेत्तस्य प्रामाण्यं केन हेतुना॥ १२२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000963.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000964", "originalText": "अथ मन्यसे।", "padacchedaText": "", "audioFile": "PB_hear2read_000964.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000965", "originalText": "जानीयाच्चेत्प्रसंख्यानाच्छब्दस्सत्यवचाः कथम्। पारोक्ष्यं शब्दो नः प्राह प्रसंख्यानात्त्वसंशयम्॥ १२३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000965.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000966", "originalText": "न च युक्तिशब्दावृत्तिलक्षणात्प्रसंख्यानाद्यथाव—\nत्प्रतिपत्तिर्भविष्यतीति सम्भावयामः।", "padacchedaText": "", "audioFile": "PB_hear2read_000966.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000967", "originalText": "यस्मात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000967.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000968", "originalText": "युक्तिशब्दौ पुराप्यस्य न चेदकुरुतां प्रमाम्। साक्षादावर्तनात्ताभ्यां किमपूर्वं फलिष्यति॥ १२४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000968.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000969", "originalText": "अथैवमपि प्रसंख्यानमन्तरेण प्राणान्धारयितुं न\nशक्नोषीति चेच्छ्रवणादावेव सम्पादयिष्यामः।", "padacchedaText": "", "audioFile": "PB_hear2read_000969.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000970", "originalText": "कथम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000970.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000971", "originalText": "प्रसंख्याने श्रुतावस्य न्यायोऽस्त्वाम्रेडनात्मकः। ईषच्छ्रुतं सामिश्रुतं सम्यक्श्रुत्वावगच्छति॥ १२५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000971.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000972", "originalText": "ननु प्रसंख्यानविधिमनभ्युपगच्छतः पारमहंसी चर्या\nबौद्धादिचर्यावदशास्त्रपूर्विका प्राप्नोति\nततश्चारूढपतितत्वं\nन स्यादशेषकर्मणां च निवृत्तिर्न प्राप्नोतीति।", "padacchedaText": "", "audioFile": "PB_hear2read_000972.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000973", "originalText": "उच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000973.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000974", "originalText": "त्वमर्थस्यावबोधाय विधिरप्याश्रितो यतः। तमन्तरेण ये दोषास्तेऽपि नायान्त्यहेतवः॥ १२६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000974.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000975", "originalText": "इति तृतीयोऽध्यायः॥ ३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000975.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000976", "originalText": "अथ चतुर्थोऽध्यायः।", "padacchedaText": "", "audioFile": "PB_hear2read_000976.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000977", "originalText": "पूर्वाध्यायेषु यद्वस्तु विस्तरेणोदितं स्फुटम्। संक्षेपतोऽधुना वक्ष्ये तदेव सुखवित्तये॥ १॥", "padacchedaText": "", "audioFile": "PB_hear2read_000977.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000978", "originalText": "संक्षेपविस्तराभ्यां हि मन्दोत्तमधियां नृणाम्। वस्तूच्यमानमेत्यन्तःकरणं तेन भण्यते॥ २॥", "padacchedaText": "", "audioFile": "PB_hear2read_000978.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000979", "originalText": "आत्मानात्मा च लोकेऽस्मिन्प्रत्यक्षादिप्रमाणतः। सिद्धस्तयोरनात्मा तु सर्वत्रैवात्मपूर्वकः॥ ३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000979.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000980", "originalText": "अनात्मत्वं स्वतस्सिद्धं देहाद्भिन्नस्य वस्तुनः। ज्ञातुरप्यात्मता तद्वन्मध्ये संशयदर्शनम्॥ ४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000980.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000981", "originalText": "असाधारणांस्तयोर्धर्मान् ज्ञात्वा धूमाग्निवद्बुधः। अनात्मनोऽथ बुद्ध्यन्तान् जानीयादनुमानतः॥ ५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000981.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000982", "originalText": "इदमित्येव बाह्येऽर्थे ह्यहमित्येव बोद्धरि। द्वयं दृष्टं यतो देहे तेनायं मुह्यते जनः॥ ६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000982.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000983", "originalText": "केन पुनर्न्यायेनात्मानात्मनोरश्वमहिषयोरिव विभागः\nक्रियत इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000983.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000984", "originalText": "उच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000984.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000985", "originalText": "न्यायः पुरोदितोऽस्माभिरात्मानात्मविभागकृत्। तेनेदमर्थमुत्सार्य ह्यहमित्यत्र यो भवेत्॥ ७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000985.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000986", "originalText": "विद्यात्तत्त्वमसीत्यस्माद्भावाभावदृशं सदा। अनन्तरमबाह्यार्थं प्रत्यक्स्थं मुनिरञ्जसा॥ ८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000986.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000987", "originalText": "उच्यतां तर्हि कया तु परिपाय्या वाक्यार्थं वेत्तीति।", "padacchedaText": "", "audioFile": "PB_hear2read_000987.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000988", "originalText": "उच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000988.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000989", "originalText": "अन्वयव्यतिरेकाभ्याम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000989.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000990", "originalText": "त्यक्तकृत्स्नेदमर्थत्वात्त्यक्तोऽहमिति मन्यते। नावगच्छाम्यहं यस्मान्निजात्मानमनात्मनः॥ ९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000990.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000991", "originalText": "अथ शरीरादिबुद्धिपर्यन्तः स सर्वोऽनात्मैवेति\nप्रमाणाद्विनिश्चित्य\nकिमिति बुभुत्सातो नोपरमते।", "padacchedaText": "", "audioFile": "PB_hear2read_000991.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000992", "originalText": "श‍ृणु।", "padacchedaText": "", "audioFile": "PB_hear2read_000992.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000993", "originalText": "अनुच्छिन्नबुभुत्सश्च प्रत्यग्घेतोरनात्मनः। दोलायमानचित्तोऽयं मुह्यते भौतवन्नरः॥ १०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000993.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000994", "originalText": "अविलुप्तविज्ञानात्मन आत्मत्वादेव नित्यसान्निध्याद्बुभुत्सुः\nकिमिति न प्रतिपद्यत इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000994.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000995", "originalText": "यस्मात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000995.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000996", "originalText": "यैरद्राक्षीत्पुरात्मानं यमनात्मेति वीक्षते। दृष्टेर्द्रष्टारमात्मानं तैः प्रसिद्धैः प्रमित्सति॥ ११॥", "padacchedaText": "", "audioFile": "PB_hear2read_000996.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000997", "originalText": "कस्मात्पुनर्हेतोः पराचीनाभिः शब्दाद्यवलेहिनीभिर्बुद्धिभि—\nरात्मानमनात्मवन्न वीक्षत इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000997.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000998", "originalText": "उच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000998.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000999", "originalText": "चक्षुर्न वीक्षते शब्दमतदात्मत्वकारणात्। यथैवं भौतिकी दृष्टिर्नात्मानं परिपश्यति॥ १२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000999.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001000", "originalText": "प्रत्यक्षादिप्रमाणस्वाभाव्यानुरोधेन\nतावत्तददर्शनकारणमुक्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001000.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001001", "originalText": "अथ प्रमेयस्वाभाव्यानुरोधेन प्रतिषेध उच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001001.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001002", "originalText": "धीविक्रियासहस्राणां हानोपादानधर्मिणाम्। सदा साक्षिणमात्मानं प्रत्यक्त्वान्नाहमीक्षते॥ १३॥", "padacchedaText": "", "audioFile": "PB_hear2read_001002.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001003", "originalText": "क्व पुनरियं विवेकबुद्धिः किमात्मन्युतानात्मनीति।", "padacchedaText": "", "audioFile": "PB_hear2read_001003.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001004", "originalText": "किंचातः।", "padacchedaText": "", "audioFile": "PB_hear2read_001004.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001005", "originalText": "यद्यात्मनि कूटस्थत्वव्याघातोऽनात्मदर्शित्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001005.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001006", "originalText": "अथानात्मनि तस्याप्यचैतन्यान्न विवेकसम्बन्ध इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001006.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001007", "originalText": "उच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001007.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001008", "originalText": "᳚दाह्यदाहकतैकत्र᳚ इत्युक्तपरिहारात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001008.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001009", "originalText": "बुद्धावेव विवेकोऽयं यदनात्मतया भिदा। बुद्धिमेवोपमृद्नाति कदलीं तत्फलं यथा॥ १४॥", "padacchedaText": "", "audioFile": "PB_hear2read_001009.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001010", "originalText": "सोऽयमतत्त्वे तत्त्वदृक्।", "padacchedaText": "", "audioFile": "PB_hear2read_001010.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001011", "originalText": "अनुमानप्रदीपेन हित्वा सर्वाननात्मनः। संसारैकावलम्बिन्या तदभावं धियेप्सति॥ १५॥", "padacchedaText": "", "audioFile": "PB_hear2read_001011.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001012", "originalText": "योऽयमन्वयव्यतिरेकजो विवेक आत्मानात्मविभाग\nलक्षणोऽनात्मस्थः स्थाणौ संशयावबोधवत्—\nप्रतिपत्तव्योऽन्यथावस्तुस्वाभाव्यान्मृगतृष्णिकोदक—\nप्रबोधववदित्यत आह।", "padacchedaText": "", "audioFile": "PB_hear2read_001012.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001013", "originalText": "संसारबीजसंस्थोऽयं तद्धिया मुक्तिमिच्छति। शशो निमीलनेनेव मृत्युं परिजिहीर्षति॥ १६॥", "padacchedaText": "", "audioFile": "PB_hear2read_001013.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001014", "originalText": "अस्यार्थस्य द्रढिम्ने श्रुत्युदाहरणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001014.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001015", "originalText": "इममर्थं पुरस्कृत्य श्रुत्या सम्यगुदाहृतम्। ᳚यच्चक्षुषे᳚ति विस्रब्धं ᳚न दृष्टे ᳚रिति\nच स्फुटम्॥ १७॥", "padacchedaText": "", "audioFile": "PB_hear2read_001015.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001016", "originalText": "बुद्ध्यन्तमपविद्ध्यैवं को न्वहं स्यामितीइक्षितुः। श्रुतिस्तत्त्वमसीत्याह सर्वमानातिगामिनी॥ १८॥", "padacchedaText": "", "audioFile": "PB_hear2read_001016.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001017", "originalText": "एष संक्षेपतः पूर्वाध्यायत्रयस्यार्थ उक्तः।", "padacchedaText": "", "audioFile": "PB_hear2read_001017.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001018", "originalText": "सोऽयं न्याय्योऽपि वेदान्तार्थः शास्त्राचार्यप्रसाद—\nलभ्योऽप्यनपेक्षितशास्त्राचार्यप्रसादोऽनन्यापेक्ष—\nसिद्धस्वभावत्वात्कैश्चिच्छ्रद्धधानैर्न प्रतीयते।", "padacchedaText": "", "audioFile": "PB_hear2read_001018.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001019", "originalText": "तेषां संग्रहार्थमभिमतप्रामाण्योदाहरणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001019.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001020", "originalText": "भगवत्पूज्यपादैश्च उदाहार्येवमेव तु। सुविस्पष्टोऽस्मदुक्तोऽर्थः सर्वभूतहितैषिभिः॥ १९॥", "padacchedaText": "", "audioFile": "PB_hear2read_001020.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001021", "originalText": "किं परमात्मन उपदेश उतापरमात्मन इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001021.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001022", "originalText": "किं चातः।", "padacchedaText": "", "audioFile": "PB_hear2read_001022.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001023", "originalText": "यदि परमात्मनस्तस्योपदेशमन्तरेणैव मुक्तत्वान्निरर्थक\nउपदेशः।", "padacchedaText": "", "audioFile": "PB_hear2read_001023.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001024", "originalText": "अथापरमात्मनस्तस्यापि स्वत एव संसार—\nस्वभावत्वान्निष्फल उपदेशः।", "padacchedaText": "", "audioFile": "PB_hear2read_001024.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001025", "originalText": "एवमुभयत्रापि\nदोषवत्त्वादत आह।", "padacchedaText": "", "audioFile": "PB_hear2read_001025.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001026", "originalText": "᳚अविविच्योभयं वक्ति श्रुतिश्चेत्स्याद्ग्रहस्तथा ᳚। इति पक्षमुपादाय पूर्वपक्षं निशात्य च॥ २०॥", "padacchedaText": "", "audioFile": "PB_hear2read_001026.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001027", "originalText": "तच्चेदमविवेकात्स्वतो विविक्तात्मने तत्त्वमसीत्युपदिष्टम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001027.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001028", "originalText": "युष्मदस्मद्विभागज्ञे स्यादर्थवदिदं वचः। यतोऽनभिज्ञे वाक्यं स्याद्बधिरेष्विव गायनम्॥ २१॥", "padacchedaText": "", "audioFile": "PB_hear2read_001028.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001029", "originalText": "तस्य च युष्मदस्मद्विभागविज्ञानस्य का युक्तिरुपायभावं\nप्रतिपद्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001029.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001030", "originalText": "श‍ृणु।", "padacchedaText": "", "audioFile": "PB_hear2read_001030.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001031", "originalText": "᳚अन्वयव्यतिरेकौ हि पदार्थस्य पदस्य च। स्यादेतदहमित्यत्र युक्तिरेवावधारणम् ᳚॥ २२॥", "padacchedaText": "", "audioFile": "PB_hear2read_001031.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001032", "originalText": "कथं तौ युक्तिरित्यत्राह।", "padacchedaText": "", "audioFile": "PB_hear2read_001032.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001033", "originalText": "᳚नाद्राक्षमहमित्यस्मिन् सुषुप्तेऽन्यन्मनागपि। न वारयति दृष्टिं स्वां प्रत्ययं तु निषेधति ᳚॥ २३॥", "padacchedaText": "", "audioFile": "PB_hear2read_001033.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001034", "originalText": "᳚एवं विज्ञातवाच्यार्थे श्रुतिलोकप्रसिद्धितः। श्रुतिस्तत्त्वमसीत्याह श्रोतुर्मोहापनुत्तये ᳚॥ २४॥", "padacchedaText": "", "audioFile": "PB_hear2read_001034.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001035", "originalText": "तत्र त्वमिति पदं यत्र लक्षणया वर्तते सोऽर्थ उच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001035.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001036", "originalText": "᳚अहं शब्दस्य या निष्ठा ज्योतिषि प्रत्यगात्मनि। सैवोक्ता सदसीत्येवं फलं तत्र विमुक्तता ᳚॥ २५॥", "padacchedaText": "", "audioFile": "PB_hear2read_001036.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001037", "originalText": "अन्यच्चान्वयव्यतिरेकोदाहरणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001037.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001038", "originalText": "तथा।", "padacchedaText": "", "audioFile": "PB_hear2read_001038.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001039", "originalText": "᳚छित्त्वा त्यक्तेन हस्तेन स्वयं नात्मा विशेष्यते। तथा शिष्टेन सर्वेण येनयेन विशेष्यते॥ २६॥", "padacchedaText": "", "audioFile": "PB_hear2read_001039.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001040", "originalText": "विशेषणमिदं सर्वं साध्वलंकरणं यथा। अविद्याध्यस्तमतः सर्वं ज्ञात आत्मन्यसद्भवेत्॥ २७॥", "padacchedaText": "", "audioFile": "PB_hear2read_001040.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001041", "originalText": "तस्मात्त्यक्तेन हस्तेन तुल्यं सर्वं विशेषणम्। अनात्मत्वेन तस्माज्ज्ञो मुक्तः सर्वविशेषणैः॥ २८॥", "padacchedaText": "", "audioFile": "PB_hear2read_001041.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001042", "originalText": "ज्ञातैवात्मा सदा ग्राह्यो ज्ञेयमुत्सृज्य केवलः। अहमित्यपि यद्ग्राह्यं व्यपेताङ्गसमं हि तत् ᳚॥ २९॥", "padacchedaText": "", "audioFile": "PB_hear2read_001042.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001043", "originalText": "᳚दृश्यत्वादहमित्येष नात्मधर्मो घटादिवत्। तथान्ये प्रत्यया ज्ञेया दोषाश्चात्मामलो ह्यतः ᳚॥ ३०॥", "padacchedaText": "", "audioFile": "PB_hear2read_001043.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001044", "originalText": "सर्वन्यायोपसंग्रहः।", "padacchedaText": "", "audioFile": "PB_hear2read_001044.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001045", "originalText": "᳚नित्यमुक्तत्वविज्ञानं वाक्याद्भवति नान्यतः। वाक्यार्थस्यापि विज्ञानं पदार्थस्मृतिपूर्वकम्॥ ३१॥", "padacchedaText": "", "audioFile": "PB_hear2read_001045.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001046", "originalText": "अन्वयव्यतिरेकाभ्यां पदार्थस्स्मर्यते ध्रुवम्। एवं निर्दुःखमात्मानमक्रियं प्रतिपद्यते॥ ३२॥", "padacchedaText": "", "audioFile": "PB_hear2read_001046.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001047", "originalText": "सदेवेत्यादिवाक्येभ्यः प्रमा स्फुटतरा भवेत्। दशमस्त्वमसीत्यस्माद्यथैवं प्रत्यगात्मनि ᳚॥ ३३॥", "padacchedaText": "", "audioFile": "PB_hear2read_001047.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001048", "originalText": "वीक्षापन्नस्योदाहरणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001048.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001049", "originalText": "᳚नवबुद्ध्यपहाराद्धि स्वात्मानं दशपूरणम्। अपश्यन् ज्ञातुमेवेच्छेत्स्वमात्मानं जनस्तथा॥ ३४॥", "padacchedaText": "", "audioFile": "PB_hear2read_001049.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001050", "originalText": "अविद्याबद्धचक्षुष्ट्वात्कामापहृतधीः सदा। विविक्तं दृशिमात्मानं नेक्षते दशमं यथा ᳚॥ ३५॥", "padacchedaText": "", "audioFile": "PB_hear2read_001050.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001051", "originalText": "सोऽयमेवमविद्यापटलावगुण्ठितदृष्टिः सन्\nकथमुत्थाप्यत इत्याह।", "padacchedaText": "", "audioFile": "PB_hear2read_001051.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001052", "originalText": "यथा स्वापनिमित्तेन स्वप्नदृक्प्रतिबोधितः। करणं कर्म कर्तारं स्वाप्नं नैवेक्षते स्वतः॥ ३६॥", "padacchedaText": "", "audioFile": "PB_hear2read_001052.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001053", "originalText": "अनात्मज्ञस्तथैवायं सम्यक् श्रुत्यावबोधितः। गुरुं शास्त्रं तथा मूढं स्वात्मनोऽन्यं न पश्यति॥ ३७॥", "padacchedaText": "", "audioFile": "PB_hear2read_001053.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001054", "originalText": "स किं सकलसंसारप्रविविक्तमात्मानं वाक्यात्प्रतिपद्यत\nउत नेतीति।", "padacchedaText": "", "audioFile": "PB_hear2read_001054.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001055", "originalText": "अत्र ब्रूमः।", "padacchedaText": "", "audioFile": "PB_hear2read_001055.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001056", "originalText": "कूटस्थावगतिशेषमात्रत्वा—\nत्प्रतिपत्तेरत आह।", "padacchedaText": "", "audioFile": "PB_hear2read_001056.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001057", "originalText": "दण्डावसाननिष्ठस्स्याद्दण्डसर्पो यथा तथा। नित्यावगतिनिष्ठं स्याद्वाक्याज्जगदसंशयम्॥ ३८॥", "padacchedaText": "", "audioFile": "PB_hear2read_001057.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001058", "originalText": "कुत एतत्।", "padacchedaText": "", "audioFile": "PB_hear2read_001058.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001059", "originalText": "यस्मात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001059.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001060", "originalText": "पश्यन्निति यदाहोच्चैः प्रत्यक्त्वमजमव्ययम्। अपूर्वानपरानन्तं त्वमा तदुपलक्ष्यते॥ ३९॥", "padacchedaText": "", "audioFile": "PB_hear2read_001060.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001061", "originalText": "तत्त्वमस्यादिवाक्योत्थविज्ञानैव बाध्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001061.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001062", "originalText": "यस्मात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001062.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001063", "originalText": "अस्माद्यदपरं रूपं नास्तीत्येव निरूप्यते। अन्यथाग्रहणाभावाद्बीजं तत्स्वप्नबोधयोः॥ ४०॥", "padacchedaText": "", "audioFile": "PB_hear2read_001063.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001064", "originalText": "अस्यार्थस्य द्रढिम्न उदाहरणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001064.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001065", "originalText": "᳚कार्यकारणबद्धौ ताविष्येते विश्वतैजसौ। प्राज्ञः कारणबद्धस्तु द्वौ तौ तुर्ये न सिध्यतः ᳚॥ ४१॥", "padacchedaText": "", "audioFile": "PB_hear2read_001065.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001066", "originalText": "᳚अन्यथागृहणतः स्वप्नो निद्रा तत्त्वमजानतः। विपर्यासे तयोः क्षीणे तुरीयं पदमश्नुते ᳚॥ ४२॥", "padacchedaText": "", "audioFile": "PB_hear2read_001066.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001067", "originalText": "तथा भगवत्पादीयमुदाहरणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001067.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001068", "originalText": "᳚सुषुप्ताख्यं तमोऽज्ञानं बीजं स्वप्नप्रबोधयोः। आत्मबोधप्रदग्धं स्याद्बीजं दग्धं यथाभवम् ᳚॥ ४३॥", "padacchedaText": "", "audioFile": "PB_hear2read_001068.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001069", "originalText": "एवं गौडैर्द्राविडैर्नः पूज्यैरयमर्थः प्रभाषितः। अज्ञानमात्रोपाधिस्सन्नहमादिदृगीश्वरः॥ ४४॥", "padacchedaText": "", "audioFile": "PB_hear2read_001069.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001070", "originalText": "तत्रान्यथाग्रहणवदन्यथाग्रहणबीजमग्रहणमनात्मधर्म\nएवेत्याह।", "padacchedaText": "", "audioFile": "PB_hear2read_001070.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001071", "originalText": "इदं ज्ञानमहं ज्ञाता ज्ञेयमेतदिति त्रयम्। योऽविकारो विजानाति परागेवास्य तत्तमः॥ ४५॥", "padacchedaText": "", "audioFile": "PB_hear2read_001071.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001072", "originalText": "यत एतदेवमतस्तस्यैव\nबीजात्मनस्तमसश्चित्तधर्मविशिष्टस्य\nस्वकार्यद्वितीयाभिसम्बन्धो न त्वविकारिण आत्मन इत्याह\nदृष्टान्तेन।", "padacchedaText": "", "audioFile": "PB_hear2read_001072.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001073", "originalText": "रूपप्रकाशयोर्यद्वत्संगतिर्विक्रियावतः। सुखदुःखादिसम्बन्धश्चित्तस्यैवं विकारिणः॥ ४६॥", "padacchedaText": "", "audioFile": "PB_hear2read_001073.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001074", "originalText": "तदेतदन्वयव्यतिरेकाभ्यां दर्शयिष्यन्नाह।", "padacchedaText": "", "audioFile": "PB_hear2read_001074.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001075", "originalText": "सम्प्रसादेऽविकारित्वादस्तं याते विकारिणि। पश्यतो नात्मनः किंचिद्द्वितीयं स्पृशतेऽण्वपि॥ ४७॥", "padacchedaText": "", "audioFile": "PB_hear2read_001075.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001076", "originalText": "सोऽयं कूटस्थज्ञानमूर्तिरात्मा।", "padacchedaText": "", "audioFile": "PB_hear2read_001076.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001077", "originalText": "यथा प्राज्ञे तथैवायं स्वप्नजागरितान्तयोः। पश्यन्नप्यविकारित्वाद्द्वितीयं न पश्यति॥ ४८॥", "padacchedaText": "", "audioFile": "PB_hear2read_001077.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001078", "originalText": "एवं ज्ञानवतो नास्ति ममाहंमतिसंश्रयः। भास्वत्प्रदीपहस्तस्य ह्यन्धकार इवाग्रतः॥ ४९॥", "padacchedaText": "", "audioFile": "PB_hear2read_001078.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001079", "originalText": "तत्र दृष्टान्तः।", "padacchedaText": "", "audioFile": "PB_hear2read_001079.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001080", "originalText": "आ प्रबोधाद्यथासिद्धिर्द्वैतादन्यस्य वस्तुनः। बोधादेवमसिद्धत्वं बुद्ध्यादेः प्रत्यगात्मनः॥ ५०॥", "padacchedaText": "", "audioFile": "PB_hear2read_001080.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001081", "originalText": "स एष विद्वान्हानोपादानशून्यमात्मानमात्मनि पश्यन्।", "padacchedaText": "", "audioFile": "PB_hear2read_001081.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001082", "originalText": "सर्वमेवानुजानाति सर्वमेव निषेधति। भेदात्मलाभोऽनुज्ञा स्यान्निषेधोऽतत्स्वभावतः॥ ५१॥", "padacchedaText": "", "audioFile": "PB_hear2read_001082.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001083", "originalText": "सर्वस्योक्तत्वादुपसंहारः।", "padacchedaText": "", "audioFile": "PB_hear2read_001083.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001084", "originalText": "परमाथार्थनिष्ठं यत्सर्ववेदान्तनिश्चितम्। तमोपनुद्धियां ज्ञानं तदेतत्कथितं मया॥ ५२॥", "padacchedaText": "", "audioFile": "PB_hear2read_001084.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001085", "originalText": "एतावदिहोक्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001085.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001086", "originalText": "नेहात्मविन्मदन्योऽस्ति न मत्तोऽज्ञोऽस्ति कश्चन। इत्यजानन्विजानाति यस्स ब्रह्मविदुत्तमः॥ ५३॥", "padacchedaText": "", "audioFile": "PB_hear2read_001086.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001087", "originalText": "एवमात्मानं ज्ञात्वा किं प्रवर्तितव्यमुत निवर्तितव्यमाहोस्वि—\nन्मुक्तप्रग्रहतेति।", "padacchedaText": "", "audioFile": "PB_hear2read_001087.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001088", "originalText": "उच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001088.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001089", "originalText": "ज्ञेयाभिन्नमिदं यस्माज्ज्ञेयवस्त्वनुसार्यतः। न प्रवृत्तिं निवृत्तिं वा कटाक्षेणापि वीक्षते॥ ५४॥", "padacchedaText": "", "audioFile": "PB_hear2read_001089.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001090", "originalText": "कुत एतज्ज्ञेयाभिन्नमिति।", "padacchedaText": "", "audioFile": "PB_hear2read_001090.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001091", "originalText": "यतः।", "padacchedaText": "", "audioFile": "PB_hear2read_001091.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001092", "originalText": "प्रागात्मबोधाद्बोधोऽयं बाह्यवस्तूपसर्जनः। प्रध्वस्ताखिलसंसार आत्मैकालम्बनः श्रुतेः॥ ५५॥", "padacchedaText": "", "audioFile": "PB_hear2read_001092.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001093", "originalText": "एवमवगतपरमार्थतत्त्वस्य न शेषशेषिभाव—\nस्तत्कारणस्योत्सारितत्वादित्याह।", "padacchedaText": "", "audioFile": "PB_hear2read_001093.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001094", "originalText": "वास्तवेनैव वृत्तेन निरुणद्धि यतो भवम्। निवृत्तिमपि मृद्नाति सम्यग्बोधः प्रवृत्तिवत्॥ ५६॥", "padacchedaText": "", "audioFile": "PB_hear2read_001094.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001095", "originalText": "सकृदात्मप्रसूत्यैव निरुणद्ध्यखिलं भवम्। ध्वान्तमात्रनिरासेन न ततोऽन्यान्यथामतिः॥ ५७॥", "padacchedaText": "", "audioFile": "PB_hear2read_001095.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001096", "originalText": "देशकालाद्यसम्बद्धाद्देशादेर्मोहकार्यतः। नानुत्पन्नमदग्धं वा ज्ञानमज्ञानमस्त्यतः॥ ५८॥", "padacchedaText": "", "audioFile": "PB_hear2read_001096.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001097", "originalText": "सम्यग्ज्ञानशिखिप्लुष्टमोहतत्कार्यरूपिणः। सकृन्निवृत्तेर्बाध्यस्य किं कार्यमवशिष्यते॥ ५९॥", "padacchedaText": "", "audioFile": "PB_hear2read_001097.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001098", "originalText": "वास्तवेनैव वृत्तेनाविद्यायाः प्रध्वस्तत्वान्न\nकिंचिदवशिष्यत इत्युक्तः परिहारः।", "padacchedaText": "", "audioFile": "PB_hear2read_001098.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001099", "originalText": "अथापरस्साम्प्रदायिकः\nपरिहारः।", "padacchedaText": "", "audioFile": "PB_hear2read_001099.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001100", "originalText": "निवृत्तसर्पस्सर्पोत्थं यथा कम्पं न मुञ्चति। विध्वस्ताखिलमोहोऽपि मोहकार्यं तथात्मवित्॥ ६०॥", "padacchedaText": "", "audioFile": "PB_hear2read_001100.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001101", "originalText": "यतः प्रवृत्तिबीजमुच्छिन्नं तस्मात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001101.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001102", "originalText": "तरोरुत्खातमूलस्य शोषेणैव यथा क्षयः। तथा बुद्धात्मतत्त्वस्य निवृत्त्यैव तनुक्षयः॥ ६१॥", "padacchedaText": "", "audioFile": "PB_hear2read_001102.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001103", "originalText": "अथालेपकपक्षनिरासार्थमाह।", "padacchedaText": "", "audioFile": "PB_hear2read_001103.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001104", "originalText": "बुद्धद्वैतसत्त्वस्य यथेष्टाचरणं यदि। शुनां तत्त्वदृशां चैव को भेदोऽशुचिभक्षणे॥ ६२॥", "padacchedaText": "", "audioFile": "PB_hear2read_001104.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001105", "originalText": "कस्मान्न भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_001105.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001106", "originalText": "यस्मात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001106.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001107", "originalText": "अधर्माज्जायतेऽज्ञानं यथेष्टाचरणं ततः। धर्मकार्ये कथं तत्स्याद्यत्र धर्मोऽपि नेष्यते॥ ६३॥", "padacchedaText": "", "audioFile": "PB_hear2read_001107.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001108", "originalText": "प्रत्याचक्षाण आहातो यथेष्टाचरणं हरिः। ᳚यस्य सर्वे समारम्भाः ᳚ ᳚प्रकाशं चे ᳚ति\nसर्वदृक्॥ ६४॥", "padacchedaText": "", "audioFile": "PB_hear2read_001108.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001109", "originalText": "तिष्ठतु तावत्सर्वप्रवृत्तिबीजघस्मरं ज्ञानं\nमुमुक्ष्ववस्थायामपि न सम्भवति यथेष्टाचरणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001109.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001110", "originalText": "तदाह।", "padacchedaText": "", "audioFile": "PB_hear2read_001110.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001111", "originalText": "᳚ यो हि यत्र विरक्तः स्यान्नासौ तस्मै प्रवर्तते। लोकत्रयविरक्तत्वान्मुमुक्षुः किमितीहते ᳚॥ ६५॥", "padacchedaText": "", "audioFile": "PB_hear2read_001111.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001112", "originalText": "तत्र दृष्टान्तः।", "padacchedaText": "", "audioFile": "PB_hear2read_001112.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001113", "originalText": "᳚क्षुधया पीड्यमानोऽपि न विषं ह्यत्तुमिच्छति। मिष्टान्नध्वस्ततृड् जानन्नामूढस्तज्जिघत्सति ᳚॥ ६६॥", "padacchedaText": "", "audioFile": "PB_hear2read_001113.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001114", "originalText": "यतोऽवगतपरमार्थतत्त्वस्य यथेष्टाचरणं न मनागपि\nघटते मुमुक्षुत्वेऽपि च तस्मात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001114.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001115", "originalText": "रागो लिङ्गमबोधस्य चित्तव्यायामभूमिषु। कुतः शाड्वलता तस्य यस्याग्निः कोटरे तरोः॥ ६७॥", "padacchedaText": "", "audioFile": "PB_hear2read_001115.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001116", "originalText": "सकलपुरुषार्थसमाप्तिकारिणोऽस्यात्मावबोधस्य कुतः\nप्रसूतिरिति।", "padacchedaText": "", "audioFile": "PB_hear2read_001116.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001117", "originalText": "उच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001117.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001118", "originalText": "अमानित्वादिनिष्ठो यो यश्चाद्वेष्ट्रादिसाधनः। ज्ञानमुत्पद्यते तस्य न बहिर्मुखचेतसः॥ ६८॥", "padacchedaText": "", "audioFile": "PB_hear2read_001118.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001119", "originalText": "उत्पन्न आत्मविज्ञाने किमविद्याकार्यत्वात्प्रवृत्तिवन्निवृत्त्या—\nत्मकामानित्वदयो निवर्तन्त उत नेति।", "padacchedaText": "", "audioFile": "PB_hear2read_001119.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001120", "originalText": "नेति ब्रूमः।", "padacchedaText": "", "audioFile": "PB_hear2read_001120.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001121", "originalText": "किं\nकारणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001121.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001122", "originalText": "निवृत्तिशास्त्राविरुद्धस्वाभाव्यात्परमात्मनो\nन तु नियोगवशात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001122.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001123", "originalText": "कथं तर्हि।", "padacchedaText": "", "audioFile": "PB_hear2read_001123.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001124", "originalText": "श‍ृणु।", "padacchedaText": "", "audioFile": "PB_hear2read_001124.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001125", "originalText": "उत्पन्नात्मप्रबोधस्य त्वद्वेष्टृत्वादयो गुणाः। अयत्नतो भवन्त्यस्य न तु साधनरूपिणः॥ ६९॥", "padacchedaText": "", "audioFile": "PB_hear2read_001125.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001126", "originalText": "यत एतदेवमतः।", "padacchedaText": "", "audioFile": "PB_hear2read_001126.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001127", "originalText": "इमां ग्रन्थमुपादित्सुरमानित्वादिसाधनः। यत्नतः स्यान्न दुर्वृत्तः प्रत्यग्धर्मानुगो ह्ययम्॥ ७०॥", "padacchedaText": "", "audioFile": "PB_hear2read_001127.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001128", "originalText": "न दातव्यश्चायं ग्रन्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_001128.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001129", "originalText": "नाविरक्ताय संसारान्नानिरस्तैषणाय च। न चायमवते देयं वेदान्तार्थप्रवेशनम्॥ ७१॥", "padacchedaText": "", "audioFile": "PB_hear2read_001129.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001130", "originalText": "ज्ञात्वा यथोदितं सम्यग्ज्ञातव्यं नावशिष्यते। न चानिरस्तकर्मेदं जानीयादञ्जसा ततः॥ ७२॥", "padacchedaText": "", "audioFile": "PB_hear2read_001130.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001131", "originalText": "निरस्तसर्वकर्माणः प्रत्यक्प्रवणबुद्धयः। निष्कामा यतयः शान्ता जानन्तीदं यथोदितम्॥ ७३॥", "padacchedaText": "", "audioFile": "PB_hear2read_001131.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001132", "originalText": "श्रीमच्छङ्करपादपद्मयुगलं संसेव्य लब्ध्वोचिवान्\n ज्ञानं पारमहंस्यमेतदमलं स्वान्तान्धकारापनुत्। मा भूदत्र विरोधिनी मतिरतः सद्भिः परीक्ष्यं बुधैः\n सर्वत्रैव विशुद्धये मतमिदं सन्तः परं कारणम्॥ ७४॥", "padacchedaText": "", "audioFile": "PB_hear2read_001132.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001133", "originalText": "सुभाषितं चार्वपि नामहात्मनां\n दिवाकरो नक्तदृशामिवामलः। प्रभाति भात्येव विशुद्धचेतसां\n निधिर्यथापास्ततृषां महाधनः॥ ७५॥", "padacchedaText": "", "audioFile": "PB_hear2read_001133.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001134", "originalText": "विष्णोः पादानुगां यां निखिलभवनुदं शंकरोऽवाप\nयोगात्\nसर्वज्ञं ब्रह्मसंस्थं मुनिगणसहितं सम्यगभ्यर्च्य\nभक्तया। विद्यां गङ्गामिवाहं प्रवरगुणनिधेः प्राप्य वेदान्तदीप्तां\nकारुण्यात्तामवोचं जनिमृतिनिवहध्वस्तये दुःखितेभ्यः॥ ७६॥", "padacchedaText": "", "audioFile": "PB_hear2read_001134.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001135", "originalText": "वेदान्तोदरवर्ति भास्वदमलं ध्वान्तच्छिदस्मद्धियो\n दिव्यं ज्ञानमतीद्रियेऽपिविषये व्याहन्यते न क्वचित्। यो नो न्यायशलाकयैव निखिलं संसारबीजं तमः\n प्रोत्सार्याविरकार्षीद्गुरुगुरुः पूज्याय तस्मै नमः॥ ७७॥", "padacchedaText": "", "audioFile": "PB_hear2read_001135.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001136", "originalText": "सम्बन्धोक्तिरियं साध्वी प्रतिश्लोकमुदाहृता। नैष्कर्म्यसिद्धेर्ज्ञात्वेमां व्याख्यातासौ भवेद्ध्रुवम्॥ ७८॥", "padacchedaText": "", "audioFile": "PB_hear2read_001136.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_001137", "originalText": "इति चतुर्थोऽध्यायः॥ ४॥", "padacchedaText": "", "audioFile": "PB_hear2read_001137.mp3", "zipFile": "Naishkarmyasiddhi.zip"}];
        const contentDiv = document.getElementById('content');
        
        let currentIndex = -1;
        let isPlaying = false;
        
        // Use standard HTML5 audio to preserve pitch on speed changes
        const audioEl = new Audio();
        audioEl.preservesPitch = true;
        
        const speedSlider = document.getElementById('speed-slider');
        const speedDisplay = document.getElementById('speed-display');
        speedSlider.oninput = function() {
            audioEl.playbackRate = this.value;
            speedDisplay.innerText = parseFloat(this.value).toFixed(1);
        };
        
        let currentScript = 'devanagari';
        const scriptSelect = document.getElementById('script-select');
        scriptSelect.onchange = function() {
            currentScript = this.value;
            document.querySelectorAll('.sentence-text').forEach((span, index) => {
                let origText = manifest[index].originalText;
                if (currentScript === 'devanagari') {
                    span.innerText = origText;
                } else {
                    span.innerText = Sanscript.t(origText, 'devanagari', currentScript);
                }
            });
        };
        
        const playPauseBtn = document.getElementById('play-pause-btn');
        playPauseBtn.onclick = () => {
            if (isPlaying) {
                audioEl.pause();
                isPlaying = false;
                playPauseBtn.innerText = "Resume";
            } else {
                playAudio(Math.max(0, currentIndex));
                playPauseBtn.innerText = "Stop";
            }
        };
        
        manifest.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'sentence';
            div.id = 'sentence-' + index;
            
            const idSpan = document.createElement('span');
            idSpan.className = 'sentence-id';
            idSpan.innerText = '[' + item.id + ']';
            
            const textSpan = document.createElement('span');
            textSpan.className = 'sentence-text';
            textSpan.innerText = item.originalText;
            
            div.appendChild(idSpan);
            div.appendChild(textSpan);
            
            div.onclick = () => {
                playPauseBtn.innerText = "Stop";
                playAudio(index);
            };
            contentDiv.appendChild(div);
        });
        
        // --- HTML5 Audio Prefetching Logic (via Blob URLs) ---
        const PREFETCH_BUFFER_SIZE = 3;
        let prefetchQueue = new Map(); // index -> Blob URL

        function getAudioUrl(index) {
            if (index < 0 || index >= manifest.length) return null;
            const item = manifest[index];
            const zipToUse = item.zipFile || ZIP_NAME;
            return WORKER_URL + '/' + BUCKET_NAME + '/' + zipToUse + '/' + item.audioFile;
        }

        async function fetchBlobUrl(url) {
            const response = await fetch(url);
            if (!response.ok) throw new Error("HTTP " + response.status);
            const blob = await response.blob();
            return URL.createObjectURL(blob);
        }

        async function prefetchNext(fromIndex) {
            for (let i = fromIndex + 1; i <= fromIndex + PREFETCH_BUFFER_SIZE; i++) {
                if (i >= manifest.length) break;
                if (!prefetchQueue.has(i)) {
                    prefetchQueue.set(i, 'fetching');
                    const url = getAudioUrl(i);
                    try {
                        const blobUrl = await fetchBlobUrl(url);
                        if (prefetchQueue.get(i) === 'fetching') {
                            prefetchQueue.set(i, blobUrl);
                        } else {
                            URL.revokeObjectURL(blobUrl);
                        }
                    } catch (err) {
                        console.error("Prefetch failed for index", i, err);
                        prefetchQueue.delete(i);
                    }
                }
            }
            // Cleanup old blobs to free memory
            for (let [key, val] of prefetchQueue.entries()) {
                if (key < fromIndex) {
                    if (typeof val === 'string' && val.startsWith('blob:')) {
                        URL.revokeObjectURL(val);
                    }
                    prefetchQueue.delete(key);
                }
            }
        }
        // ------------------------

        async function playAudio(index) {
            if (index < 0 || index >= manifest.length) {
                isPlaying = false;
                playPauseBtn.innerText = "Start Reading";
                return;
            }
            
            if (currentIndex >= 0) {
                const prevDiv = document.getElementById('sentence-' + currentIndex);
                if (prevDiv) prevDiv.classList.remove('active');
            }
            
            currentIndex = index;
            
            const currentDiv = document.getElementById('sentence-' + currentIndex);
            if (currentDiv) {
                currentDiv.classList.add('active');
                currentDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            
            audioEl.pause();
            
            try {
                let audioUrl;
                if (prefetchQueue.has(index) && prefetchQueue.get(index) !== 'fetching') {
                    audioUrl = prefetchQueue.get(index);
                } else {
                    const sourceUrl = getAudioUrl(index);
                    audioUrl = await fetchBlobUrl(sourceUrl);
                }
                
                audioEl.src = audioUrl;
                audioEl.playbackRate = speedSlider.value;
                audioEl.onended = () => { playAudio(currentIndex + 1); };
                
                await audioEl.play();
                isPlaying = true;
                
            } catch (e) {
                console.error("Audio play error:", e);
                // Fallback to next track if error
                setTimeout(() => playAudio(currentIndex + 1), 500);
            }
            
            // Trigger prefetch for upcoming sentences
            prefetchNext(index);
        }
    </script>
</body>
