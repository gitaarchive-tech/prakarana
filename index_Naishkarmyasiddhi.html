d_000393.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000394", "originalText": "सदाविलुप्तसाक्षित्वं स्वतस्सिद्धं न पार्यते। अपह्नोतुं घटस्येव कुशाग्रीयधियात्मनः॥ ३६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000394.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000395", "originalText": "एतस्माच्च हेतोरहंकारस्यानात्मधर्मत्वमवसीयताम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000395.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000396", "originalText": "प्रमाणैश्चावगम्यत्वाद्घटादिवदहंदृशेः। यतो राधिः प्रमाणानां स कथं तैः प्रसिध्यति॥ ३७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000396.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000397", "originalText": "धर्मधर्मिणोश्चेतरेतरविरुद्धात्मकत्वादसङ्गतिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000397.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000398", "originalText": "धर्मिणश्च विरुद्धत्वान्न दृश्यगुणसङ्गतिः। मारुतान्दोलितज्वालं शैत्यं नाग्निं सिसृप्सति॥ ३८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000398.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000399", "originalText": "तस्माद्विस्रब्धमुपगम्यताम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000399.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000400", "originalText": "द्रष्टृत्वं दृश्यता चैव नैकस्मिन्नेकदा क्वचित्। दृश्यदृश्यो न च द्रष्टा द्रष्टुर्दर्शी दृशिर्न च॥ ३९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000400.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000401", "originalText": "सर्वसंव्यवहारलोपश्च प्राप्नोति।", "padacchedaText": "", "audioFile": "PB_hear2read_000401.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000402", "originalText": "यस्मात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000402.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000403", "originalText": "द्रष्टापि यदि दृश्याया आत्मेयात्कर्मतां धियः। यौगपद्यमदृश्यत्वं वैयर्थ्यं चाप्नुयाच्छृतिः॥ ४०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000403.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000404", "originalText": "कुतः।", "padacchedaText": "", "audioFile": "PB_hear2read_000404.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000405", "originalText": "यस्मात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000405.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000406", "originalText": "नालुप्तदृष्टेर्दृश्यत्वं दृश्यत्वे द्रष्टृता कुतः। स्याच्चेद्दृगेकं निर्दृश्यं जगद्वा स्यादसाक्षिकम्॥ ४१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000406.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000407", "originalText": "उक्तयुक्तिं दृढीकर्तुमागमोदाहरणोपन्यासः।", "padacchedaText": "", "audioFile": "PB_hear2read_000407.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000408", "originalText": "आर्तमन्यद्दृशेः सर्वं ᳚नेति नेती᳚ति चासकृत्। वदन्ती निर्गुणं ब्रह्म कथं श्रुतिरुपेक्ष्यते॥ ४२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000408.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000409", "originalText": "᳚महाभूतान्यहंकार᳚ इत्येतत्क्षेत्रमुच्यते। न दृशेर्द्वैतयोगोऽस्ति विश्वेश्वरमतादपि॥ ४३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000409.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000410", "originalText": "अधुना प्रकृतार्थोऽपसंहारः।", "padacchedaText": "", "audioFile": "PB_hear2read_000410.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000411", "originalText": "एवमेतद्धिरुग्ज्ञेयं मिथ्यासिद्धमनात्मकम्। मोहमूलं सुदुर्बोधं द्वैतं युक्तिभिरात्मनः॥ ४४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000411.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000412", "originalText": "कुतो मिथ्यासिद्धत्वं द्वैतस्येति चेत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000412.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000413", "originalText": "न पृथङ्नात्मना सिद्धिरात्मनोऽन्यस्य वस्तुनः। आत्मवत्कल्पितस्तस्मादहंकारादिरात्मनि॥ ४५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000413.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000414", "originalText": "तस्मादज्ञानविजृम्भितमेतत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000414.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000415", "originalText": "दृश्याः शब्दादयः क्लृप्ता द्रष्टृ च ब्रह्म निर्गुणम्। अहं तदुभयं बिभ्रद्भ्रान्तिमात्मनि यच्छति॥ ४६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000415.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000416", "originalText": "तत एवेयमभिन्नस्यात्मनो भेदबुद्धिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000416.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000417", "originalText": "दृगेका सर्वभूतेषु भाति दृश्यैरनेकवत्। जलभाजनभेदेन मयूखस्रग्विभेदवत्॥ ४७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000417.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000418", "originalText": "यथोक्तार्थस्य प्रतिपत्तये दृष्टान्तः।", "padacchedaText": "", "audioFile": "PB_hear2read_000418.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000419", "originalText": "मित्रोदासीनशत्रुत्वं यथैकस्यान्यकल्पनात्। अभिन्नस्य चित्तेस्तद्वद्भेदोऽन्तःकरणाश्रयः॥ ४८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000419.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000420", "originalText": "अपहारो यथा भानोः सर्वतो जलपात्रकैः। तत्क्रियाकृतिदेशाप्तिस्तथा बुद्धिभिरात्मनः॥ ४९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000420.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000421", "originalText": "न च विरुद्धधर्मणामेकत्रानुपपत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000421.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000422", "originalText": "कल्पितानामवस्तुत्वात्स्यादेकत्रापि सम्भवः। कमनीयाशुचिः स्वाद्वीत्येकस्यामिव योषिति॥ ५०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000422.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000423", "originalText": "न चायं क्रियाकारकफलात्मक आभास ईषदपि\nपरमार्थवस्तु स्पृशति तस्य मोहमात्रोपादानत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000423.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000424", "originalText": "अभूताभिनिवेशेन स्वात्मानं वञ्चयत्ययम्। असत्यपि द्वितीयेऽर्थे सोमशर्मपिता यथा॥ ५१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000424.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000425", "originalText": "वस्तुयाथात्म्यानवबोधपटलावनद्धाक्षः सन्।", "padacchedaText": "", "audioFile": "PB_hear2read_000425.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000426", "originalText": "सुभ्रूः सुनासा सुमुखी सुनेत्रा चारुहासिनी। कल्पनामात्रसंमोहाद्रामेत्यालिङ्गतेऽशुचिम्॥ ५२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000426.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000427", "originalText": "सर्वस्यानर्थजातस्य जिहासितस्य मूलमहंकार एव\nतस्यात्मनात्मोपरागात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000427.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000428", "originalText": "न तु परमार्थत आत्मनोऽविद्यया\nतत्कार्येण वा सम्बधोऽभूदस्ति भविष्यति वा\nतस्यापरिलिप्तदृष्टिस्वाभाव्यात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000428.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000429", "originalText": "दृश्यानुरक्तं तद्द्रष्टृ दृश्यं द्रष्ट्रनुरञ्जितम्। अहंवृत्त्योहयं रक्तं तन्नाशेऽद्वैततात्मनः॥ ५३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000429.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000430", "originalText": "इह केचिच्चोदयन्ति योऽयमन्वयव्यतिरेकाभ्यामनात्मत—\nयोत्सारितोऽहंकारो वाक्यार्थप्रतिपत्तये सोऽयं विपरीतार्थः\nसंवृत्तो यस्मादहं ब्रह्मास्मीति ब्रह्माहम्पदार्थयोः\nसामानाधिकरण्यश्रवणादनात्मार्थेन सामानाधिकरण्यं\nप्राप्नोति।", "padacchedaText": "", "audioFile": "PB_hear2read_000430.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000431", "originalText": "वक्तव्या च प्रत्यगात्मनि तस्य वृत्तिरिति सोच्यते\nप्रसिद्धलक्षणागुणवृत्तिभिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000431.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000432", "originalText": "नाज्ञासिषमिति प्राह सुषुप्तादुत्थितोऽपि हि। अयोदाहादिवत्तेन लक्षणं परमात्मनः॥ ५४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000432.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000433", "originalText": "प्रत्यक्त्वादतिसूक्ष्मत्वादात्मदृष्ट्यनुशीलनात्। अतो वृत्तीर्विहायान्या ह्यहंवृत्त्योपलक्षते॥ ५५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000433.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000434", "originalText": "आत्मना चाविनाभावमथवा विलयं व्रजेत्। न तु पक्षान्तरं यायादतश्चाहंधियोच्यते॥ ५६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000434.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000435", "originalText": "कीदृक्पुनर्वस्तु लक्ष्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000435.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000436", "originalText": "नामादिभ्यः परो भूमा निष्कलोऽकारकोऽक्रियः। स एवात्मवतामात्मा स्वतस्सिद्धः स एव नः॥ ५७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000436.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000437", "originalText": "अज्ञानोत्थबुद्ध्यादिकर्तृत्वोपाधिमात्मानं\nपरिगृह्यैवान्वयव्यतिरेकाभ्यामहं सुखी दुःखी\nचेत्यहंकारादेरनात्मधर्मत्वमुक्तं\nकेवलात्माभ्युपगमेऽशक्यत्वात्फलाभावाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000437.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000438", "originalText": "अथेदानीमविद्यापरिकल्पितं साक्षित्वमाश्रित्य\nकर्तृत्वाद्यशेषपरिणामप्रतिषेधायाह।", "padacchedaText": "", "audioFile": "PB_hear2read_000438.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000439", "originalText": "एष सर्वधियां नृत्तमविलुप्तैकदर्शनः। वीक्षतेऽवीक्षमाणोऽपि निमिषत्तद्ध्रुवोऽध्रुवम्॥ ५८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000439.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000440", "originalText": "ननु सर्वसिद्धान्तानामपि स्वस्वदृष्ट्यपेक्षयोपपन्नत्वा—\nदितरेतरदृष्ट्यपेक्षया दुस्स्थितसिद्धिकत्वान्नैकत्रापि\nविश्वासं पश्यामो न च सर्वतार्किकैरदूषितं समर्थितं\nसर्वतार्किकोपद्रवापसर्पणाय वर्त्म सम्भावयामः।", "padacchedaText": "", "audioFile": "PB_hear2read_000440.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000441", "originalText": "उच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000441.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000442", "originalText": "विस्रब्धैः सम्भाव्यतामनुभवमात्रशरणत्वात्—\nसर्वतार्किकप्रस्थानानाम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000442.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000443", "originalText": "तदभिधीयते।", "padacchedaText": "", "audioFile": "PB_hear2read_000443.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000444", "originalText": "इमं प्राशिकमुद्दिश्य तर्कज्वरभृशातुराः। त्वाच्छिरस्कवचोजालैर्मोहयन्तीतरेतरम्॥ ५९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000444.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000445", "originalText": "अत्रापि चोदयन्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000445.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000446", "originalText": "अनुभवात्मनोऽपि विक्रियाभ्युपगमेऽन—\nभ्युपगमेऽपि दोष एव।", "padacchedaText": "", "audioFile": "PB_hear2read_000446.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000447", "originalText": "यस्मादाह।", "padacchedaText": "", "audioFile": "PB_hear2read_000447.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000448", "originalText": "᳚वर्षातपाभ्यां किं व्योम्नश्चर्मण्येव तयोः फलम्। चर्मोपमश्चेत्सोऽनित्यः खतुल्यश्चेदसत्समः ᳚॥ ६०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000448.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000449", "originalText": "बुद्धिजन्मनि पुंसश्च विकृतिर्यद्यनित्यता। अथाविकृतिरेवायं प्रमातेति न युज्यते॥ ६१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000449.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000450", "originalText": "अस्य परिहारः।", "padacchedaText": "", "audioFile": "PB_hear2read_000450.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000451", "originalText": "ऊर्ध्वं गच्छति धूमे खं भिद्यते स्विन्न भिद्यते। न भिद्यते चेत्स्थास्नुत्वं भिद्यते चेद्भिदास्य का॥ ६२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000451.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000452", "originalText": "इत्येतत्प्रतिपत्त्यर्थमाह।", "padacchedaText": "", "audioFile": "PB_hear2read_000452.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000453", "originalText": "अविक्रियस्य भोक्तृत्वं स्यादहम्बुद्धिविभ्रमात्। नौयानविभ्रमाद्यद्वन्नगेषु गतिकल्पनम्॥ ६३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000453.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000454", "originalText": "यथोक्तार्थाविष्करणाय दृष्टान्तान्तरोपादानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000454.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000455", "originalText": "यथा जात्यमणेः शुभ्रा ज्वलन्ती निश्चला शिखा। संनिध्यसंनिधानेषु घटादीनामविक्रिया॥ ६४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000455.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000456", "originalText": "अयमत्रांशो विवक्षित इति ज्ञापनायाह।", "padacchedaText": "", "audioFile": "PB_hear2read_000456.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000457", "originalText": "यदवस्था व्यनक्तीति तदवस्थैव सा पुनः। भण्यते न व्यनक्तीति घटादीनामसंनिधौ॥ ६५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000457.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000458", "originalText": "तत्र च।", "padacchedaText": "", "audioFile": "PB_hear2read_000458.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000459", "originalText": "सर्वधीव्यञ्जकस्तद्वत्परमात्मा प्रदीपकः। संनिध्यसंनिधानेषु धीवृत्तिनामविक्रियः॥ ६६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000459.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000460", "originalText": "न प्रकाशक्रिया काचिदस्य स्वात्मनि विद्यते। उपचारात्क्रिया सास्य यः प्रकाशस्य संनिधिः॥ ६७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000460.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000461", "originalText": "मैवं शङ्किष्ठाः सांख्यराध्यान्तोऽयमिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000461.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000462", "originalText": "यतः।", "padacchedaText": "", "audioFile": "PB_hear2read_000462.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000463", "originalText": "यथा विशुद्ध आकाशे सहसैवाभ्रमण्डलम्। भूत्वा विलीयते तद्वदात्मनीहाखिलं जगत्॥ ६८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000463.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000464", "originalText": "तस्मादेष कूटस्थो न द्वैतं मनागपि स्पृशति।", "padacchedaText": "", "audioFile": "PB_hear2read_000464.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000465", "originalText": "यतः।", "padacchedaText": "", "audioFile": "PB_hear2read_000465.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000466", "originalText": "शब्दाद्याकारनिर्भासाः क्षणप्रध्वंसिनीर्दृशा। नित्योऽक्रमदृगात्मैको व्याप्नोतीव धियोऽनिशम्॥ ६९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000466.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000467", "originalText": "एवं च सति बुद्धेः परिणामित्वं युक्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000467.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000468", "originalText": "अतीतानागतेहत्यान्युगपत्सर्वगोचरान्। वेत्त्यात्मवन्न धीर्यस्मात्तेनेयं परिणामिनी॥ ७०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000468.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000469", "originalText": "ततश्चैतत्सिद्धम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000469.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000470", "originalText": "अपश्यन्पश्यतीं बुद्धिमश‍ृण्वन् श‍ृण्वतीं तथा। निर्यत्नोऽविक्रियोऽनिच्छन्निच्छन्तीं चाप्यलुप्तदृक्॥ ७१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000470.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000471", "originalText": "द्विषन्तीमद्विषन्नात्मा कुप्यन्तीं चाप्यकोपनः। निर्दुःखो दुःखिनीं चैव निस्सुखः सुखिनीमपि॥ ७२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000471.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000472", "originalText": "अमुह्यमानो मुह्यन्तीं कल्पयन्तीमकल्पयन्। स्मरन्तीमस्मरंश्चैव शयानामस्वपन्मुहुः॥ ७३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000472.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000473", "originalText": "सर्वाकारां निराकारः स्वार्थोऽस्वार्थां निरिङ्गनः। निस्त्रिकालस्त्रिकालस्थां कूटस्थः क्षणभङ्गुराम्॥ ७४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000473.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000474", "originalText": "निरपेक्षश्च सापेक्षां पराचीं प्रत्यगद्वयः। सावधिं निर्गतेयत्तः सर्वदेहेषु पश्यति॥ ७५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000474.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000475", "originalText": "एतस्माच्च कारणादयमर्थो व्यवसीयताम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000475.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000476", "originalText": "दुःखी यदि भवेदात्मा कस्साक्षी दुःखिनो भवेत्। दुःखिनः साक्षितायुक्ता साक्षिणो दुःखिता तथा॥ ७६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000476.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000477", "originalText": "पूर्वस्यैव व्याख्यानार्थमाह।", "padacchedaText": "", "audioFile": "PB_hear2read_000477.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000478", "originalText": "नर्ते स्याद्विक्रियां दुःखी साक्षिता का विकारिणः। धीविक्रियासहस्राणां साक्ष्यतोऽहमविक्रियः॥ ७७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000478.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000479", "originalText": "एवं सर्वस्मिन् व्यभिचारिण्यात्मवस्त्वेवाव्यभिचारीत्यनुभवतो\nव्यवस्थापनायाह।", "padacchedaText": "", "audioFile": "PB_hear2read_000479.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000480", "originalText": "प्रमाणतन्निभेष्वस्या नोच्छित्तिर्मम संविदः। मत्तोऽन्यद्रूपमाभाति यत्तत्स्यात्क्षणभङ्गि हि॥ ७८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000480.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000481", "originalText": "उत्पत्तिस्थितिभङ्गेषु कुम्भस्य वियतो यथा। नोत्पत्तिस्थितिनाशास्स्युर्बुद्धेरेवं ममापि च॥ ७९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000481.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000482", "originalText": "सुखदुःखसम्बन्धानां च प्रत्यक्षत्वान्न\nश्रद्धामात्रग्राह्यमेतत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000482.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000483", "originalText": "सुखदुःखादिसम्बन्धां यथा दण्डेन दण्डिनम्। राधको वीक्षते बुद्धिं साक्षी तद्वदसंहतः॥ ८०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000483.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000484", "originalText": "एतस्माच्च हेतोर्धियः परिणामित्वं युक्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000484.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000485", "originalText": "येनैवास्या भवेद्योगः सुखकुम्भादिना धियः। तं विदन्ती तदैवान्यं वेत्ति नातो विकारिणी॥ ८१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000485.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000486", "originalText": "अस्याश्च क्षणभङ्गरत्वे स्वयमेवात्मा साक्षी।", "padacchedaText": "", "audioFile": "PB_hear2read_000486.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000487", "originalText": "न हि\nकूटस्थावबोधमन्तरेण बुद्धेरेवाविर्भावतिरोभावादि—\nसिद्धिरस्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000487.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000488", "originalText": "परिणामिधियां वृत्तं नित्याक्रमदृगात्मना। षड्भावविक्रियामेति व्याप्तं खेनाङ्करो यथा॥ ८२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000488.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000489", "originalText": "सत आत्मनश्चाविकारित्वे युक्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000489.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000490", "originalText": "स्मृतिस्वप्नप्रबोधेषु न कश्चित्प्रत्ययो धियः। दृशाव्याप्तोऽस्त्यतो नित्यमविकारी स्वयंदृशिः॥ ८३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000490.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000491", "originalText": "एवं तावत्पराभ्युपगतप्रक्रियाप्रस्थानेन\nनिरस्ताशेषविकारैकात्म्यं\nप्रतिपादितमुपपत्तिभिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000491.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000492", "originalText": "अथाधुना श्रौतीं\nप्रक्रियामवलम्ब्योच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000492.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000493", "originalText": "अस्तु वा परिणामोऽस्य दृशेः कूटस्थरूपतः। कल्पितोऽपि मृषैवासौ दण्डस्येवाप्सु वक्रता॥ ८४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000493.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000494", "originalText": "षट्सु भावविकारेषु निषिद्धेश्वेवमात्मनि। दोषः कश्चिदिहासक्तुं न शक्यस्तार्किकश्वभिः॥ ८५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000494.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000495", "originalText": "प्रकृतमेवोपादाय बुद्धेः परिणामित्वमात्मनश्च\nकूटस्थत्वं युक्तिभिरुच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000495.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000496", "originalText": "प्रत्यर्थं तु विभिद्यन्ते बुद्धयो विषयोन्मुखाः। न भिदावगतेस्तद्वत्सर्वास्ताश्चिन्निभा यतः॥ ८६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000496.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000497", "originalText": "स्वसम्बद्धार्थ एव।", "padacchedaText": "", "audioFile": "PB_hear2read_000497.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000498", "originalText": "सावशेषपरिच्छेदिन्यत एव न कृत्स्नवित्। नो चेत्परिणमेद्बुद्धिः सर्वज्ञा स्वात्मवद्भवेत्॥ ८७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000498.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000499", "originalText": "अतोऽवगतेरेकत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000499.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000500", "originalText": "चण्डालबुद्धेर्यर्दृष्टृ तदेव ब्रह्मबुद्धिदृक्। एकं तदुभयोर्ज्योतिर्भास्यभेदादनेकवत्॥ ८८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000500.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000501", "originalText": "कस्मात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000501.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000502", "originalText": "अवस्थादेशकालादिभेदो नास्त्यनयोर्यतः। तस्माज्जगद्धियां वृत्तं ज्योतिरेकं सदेक्षते॥ ८९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000502.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000503", "originalText": "सर्वदेहेष्वात्मैकत्वे प्रतिबुद्धपरमार्थतत्त्वस्या—\nप्यप्रतिबुद्धदेहसम्बद्धादशेषदुःखसम्बन्ध इति चेत्तन्न।", "padacchedaText": "", "audioFile": "PB_hear2read_000503.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000504", "originalText": "बोधात्प्रागपि दुःखित्वं नान्यदेहोत्थमस्ति नः। बोधादूर्ध्वं कुतस्तत्स्याद्यत्र स्वगतमप्यसत्॥ ९०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000504.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000505", "originalText": "न चेयं स्वमनीषिकेति ग्राह्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000505.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000506", "originalText": "कुतः।", "padacchedaText": "", "audioFile": "PB_hear2read_000506.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000507", "originalText": "श्रुत्यवष्टम्भात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000507.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000508", "originalText": "शब्दाद्याकारनिर्भासा हानोपादानधर्मिणी। भास्येत्याह श्रुतिर्दृष्टिरात्मनोऽपरिणामिनः॥ ९१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000508.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000509", "originalText": "का त्वसौ श्रुतिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000509.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000510", "originalText": "दृष्टेर्द्रष्टारमात्मानं न पश्येर्दृश्यमानया। विज्ञातारमरे केन विजानीयाद्धियां पतिम्॥ ९२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000510.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000511", "originalText": "यस्मात्सर्वप्रमाणोपपन्नोऽयमर्थस्तस्मादतोऽन्यथावादिनो\nजात्यन्धा इवानुकम्पनीया इत्याह।", "padacchedaText": "", "audioFile": "PB_hear2read_000511.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000512", "originalText": "तदेतदद्वयं ब्रह्म निर्विकारं कुबुद्धिभिः। जात्यन्धगजदृष्ट्येव कोटिशः परिकल्प्यते॥ ९३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000512.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000513", "originalText": "प्रमाणोपपनस्यार्थस्यासम्भावनात्तदनुकम्पनीयत्वसिद्धिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000513.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000514", "originalText": "तदेतदाह।", "padacchedaText": "", "audioFile": "PB_hear2read_000514.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000515", "originalText": "यद्यद्विशेषणं दृष्टं नात्मनस्तदनन्वयात्। खस्य कुम्भादिवत्तस्मादात्मा स्यान्निर्विशेषणः॥ ९४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000515.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000516", "originalText": "अतश्चात्मनो भेदासंस्पर्शो भेदस्य मिथ्यास्वाभाव्यादत\nआह।", "padacchedaText": "", "audioFile": "PB_hear2read_000516.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000517", "originalText": "अवगत्यात्मनो यस्मादागमापायि कुम्भवत्। साहंकारमिदं विश्वं तस्मात्तत्स्यात्कचादिवत्॥ ९५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000517.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000518", "originalText": "सर्वस्यैवानुमानव्यापारस्य फलमियदेव यद्विवेकग्रहणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000518.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000519", "originalText": "तदुच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000519.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000520", "originalText": "बुद्धेरनात्मधर्मत्वमनुमानात्प्रसिद्ध्यति। आत्मनोऽप्यद्वितीयत्वमात्मत्वादेव सिद्ध्यति॥ ९६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000520.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000521", "originalText": "यद्यप्ययं ग्रहीतृग्रहणग्राह्यगृहीतितत्फलात्मक\nआब्रह्मस्तम्बपर्यन्तः संसारोऽन्वयव्यतिरेकाभ्यामनात्मतया\nनिर्माल्यवदपविद्धः।", "padacchedaText": "", "audioFile": "PB_hear2read_000521.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000522", "originalText": "तथापि तु नैवासौ स्वतस्सिद्धात्म—\nव्यतिरिक्तानात्मप्रकृतिपदार्थव्यपाश्रयः सांख्यानामिव।", "padacchedaText": "", "audioFile": "PB_hear2read_000522.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000523", "originalText": "किं तर्हि।", "padacchedaText": "", "audioFile": "PB_hear2read_000523.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000524", "originalText": "स्वतस्सिद्धानुदितानस्तमितकूटस्थात्मप्रज्ञानमात्र—\nशरीरप्रतिबिम्बिताविचारितसिद्धात्मानवबोधाश्रय एव\nतदुपादानत्वात्तस्येतीममर्थं निर्वक्तुकाम आह।", "padacchedaText": "", "audioFile": "PB_hear2read_000524.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000525", "originalText": "ऋते ज्ञानं न सन्त्यर्था अस्ति ज्ञानमृतेऽपि तान्। एवं धियो हिरुग्ज्योतिर्विविच्यादनुमानतः॥ ९७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000525.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000526", "originalText": "यस्मात्प्रमाणप्रमेयव्यवहार आत्मानवबोधाश्रय\nएव तस्मात्सिद्धमात्मनोऽप्रमेयत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000526.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000527", "originalText": "नैव हि कार्यं\nस्वकारणमतिलङ्घ्यान्यत्राकारक आस्पदमुपनिबध्नाति।", "padacchedaText": "", "audioFile": "PB_hear2read_000527.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000528", "originalText": "अत आह।", "padacchedaText": "", "audioFile": "PB_hear2read_000528.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000529", "originalText": "व्यवधीयन्त एवामी बुद्धिदेहघटादयः। आत्मत्वादात्मनः केन व्यवधानं मनागपि॥ ९८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000529.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000530", "originalText": "स्वयमनवगमात्मकत्वादनवगमात्कत्वं च\nमोहमात्रोपादानत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000530.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000531", "originalText": "प्रमाणमन्तरेणैषां बुद्ध्यादीनामसिद्धता। अनुभूतिफलार्थित्वादात्मा ज्ञः किमपेक्षते॥ ९९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000531.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000532", "originalText": "वक्ष्यमाणेतरेतराध्याससिद्ध्यर्थमुक्तव्यतिरेकानुवादः।", "padacchedaText": "", "audioFile": "PB_hear2read_000532.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000533", "originalText": "घटबुद्धेर्घटाच्चर्थाद्द्रष्टुर्यद्वद्विभिन्नता। अहम्बुद्धेरहङ्गम्याद्दुःखिनश्च तथा दृशेः॥ १००॥", "padacchedaText": "", "audioFile": "PB_hear2read_000533.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000534", "originalText": "एवमेतयोरात्मानात्मनोः स्वतः परतः सिद्धयोर्लौकिकरज्जु—\nसर्पाध्यारोपवदविद्योपाश्रय एवेतरेतराध्यारोप इत्येतदाह।", "padacchedaText": "", "audioFile": "PB_hear2read_000534.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000535", "originalText": "अभ्रयानं यथा मोहाच्छशभृत्यध्यवस्यति। सुखित्वादीन्धियो धर्मांस्तद्वदात्मनि मन्यते॥ १०१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000535.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000536", "originalText": "दग्धृत्वं च यथा वह्नेरयसो मन्यते कुधीः। चैतन्यं तद्वदात्मीयं मोहात्कर्तरि मन्यते॥ १०२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000536.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000537", "originalText": "सर्व एवायमात्मानात्मविभागः प्रत्यक्षादिप्रमाणवर्त्म—\nन्युनपतितोऽविद्योत्सङ्गवर्त्येव न परमात्मव्यपाश्रयः।", "padacchedaText": "", "audioFile": "PB_hear2read_000537.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000538", "originalText": "अस्याश्चाविद्यायाः सर्वानर्थहेतोः कुतो निवृत्तिरिति\nचेत्तदाह।", "padacchedaText": "", "audioFile": "PB_hear2read_000538.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000539", "originalText": "दुःखराशेर्विचित्रस्य सेयं भ्रान्तिश्चिरन्तनी। मूलं संसारवृक्षस्य तद्बाधस्तत्त्वदर्शनात्॥ १०३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000539.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000540", "originalText": "तद्बाधस्तत्त्वदर्शनादिति कुतः सम्भाव्यत इति चेदत\nआहागोपालाविपालपण्डितमियमेव प्रसिद्धिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000540.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000541", "originalText": "अप्रमोत्थं प्रमोत्थेन ज्ञानं ज्ञानेन बाध्यते। अहिरज्ज्वादिवद्बाधो देहाद्यात्ममतेस्तथा॥ १०४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000541.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000542", "originalText": "लौकिकप्रमेयवैलक्षण्यादात्मनो नेहानधिगताधिगमः\nप्रमाणफलम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000542.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000543", "originalText": "अविद्यानाशमात्रं तु फलमित्युपचर्यते। नाज्ञातज्ञापनं न्याय्यमवगत्येकरूपतः॥ १०५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000543.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000544", "originalText": "यस्मादात्मानवबोधमात्रोपादानाः प्रमात्रादयस्तस्मात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000544.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000545", "originalText": "न विदन्त्यात्मनः सत्तां द्रष्टृदर्शनगोचराः। न चान्योन्यमतोऽमीषां ज्ञेयत्वं भिन्नसाधनम्॥ १०६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000545.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000546", "originalText": "द्रष्ट्रादेरसाधारणरूपज्ञापनायाह।", "padacchedaText": "", "audioFile": "PB_hear2read_000546.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000547", "originalText": "बाह्य आकारवान् ग्राह्यो ग्रहणं निश्चयादिमत्। अन्वय्यहमिति ज्ञेयः साक्षी त्वात्मा ध्रुवः सदा॥ १०७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000547.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000548", "originalText": "सर्वकारकक्रियाफलविभागात्त्मकसंसारशून्य आत्मेति\nकारकक्रियाफलविभागसाक्षित्वादात्मनस्तदाह।", "padacchedaText": "", "audioFile": "PB_hear2read_000548.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000549", "originalText": "ग्राहकग्रहणग्राह्यविभागे योऽविभागवान्। हानोपादानयोस्साक्षी हानोपादानवर्जितः॥ १०८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000549.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000550", "originalText": "ग्राहकादिनिष्ठैव ग्राहकादिभावाभावविभागसिद्धिः\nकस्मान्नेति चेत्तदाह।", "padacchedaText": "", "audioFile": "PB_hear2read_000550.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000551", "originalText": "स्वसाधन स्वयं नष्टो न नाशं वेत्त्यभावतः। अत एव न चान्येषामतोऽसौ भिन्नसाक्षिकः॥ १०९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000551.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000552", "originalText": "ग्राहकादेरन्यसाक्षिपूर्वकत्वसिद्धेः\nस्वसाक्षिणोऽप्यन्यसाक्षिपूर्वकत्वा—\nदनवस्थेति चेत्तन्न साक्षिणो व्यतिरिक्तहेत्वनपेक्षत्वादत\nआह।", "padacchedaText": "", "audioFile": "PB_hear2read_000552.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000553", "originalText": "धीवन्नापेक्षते सिद्धिमात्मान्यस्मादविक्रियः। निरपेक्षमपेक्ष्यैव सिद्धन्त्यन्ये न तु स्वयम्॥ ११०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000553.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000554", "originalText": "यतो ग्राहकादिष्वात्मभावोऽविद्यानिबन्धन एव\nतस्मादन्वयव्यतिरेकाभ्यां विभज्यानात्मनः स्वयम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000554.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000555", "originalText": "उत्पत्तिस्थितिनाशेषु योऽवगत्यैव वर्तते। जगतोऽविकारयावेहि तमस्मीति न नश्वरम्॥ १११॥", "padacchedaText": "", "audioFile": "PB_hear2read_000555.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000556", "originalText": "स्वतस्सिद्धात्मचैतन्यप्रतिबिम्बिताविचारितसिद्धिकात्मानव—\nबोधोत्थेतरेतरस्वभावापेक्षसिद्धत्वात्स्वतश्चासिद्धे—\nरनात्मनो द्वैतेन्द्रजालस्य।", "padacchedaText": "", "audioFile": "PB_hear2read_000556.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000557", "originalText": "न स्वयं स्वस्य नानात्वं नावगत्यात्मना यतः। नोभाभ्यामप्यतस्सिद्धमद्वैतं द्वैतबाधया॥ ११२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000557.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000558", "originalText": "यथोक्तार्थप्रतिपत्तिद्रढिम्ने श्रुत्युदाहरणोपन्यासः।", "padacchedaText": "", "audioFile": "PB_hear2read_000558.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000559", "originalText": "नित्यावगतिरूपत्वात्कारकादिर्न चात्मनः। अस्थूलं नेतिनेतीति न जायत इति श्रुतिः॥ ११३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000559.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000560", "originalText": "सर्वस्यास्य ग्राहकादेर्द्वैतप्रपञ्चस्यात्मानवबोध—\nमात्रोपादानस्य स्वयं सेद्धुमशक्यत्वादात्मसिद्धेश्चा—\nनुपादेयत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000560.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000561", "originalText": "आत्मनश्चेन्निवार्यन्ते बुद्धिदेहघटादयः। षष्ठगोचरकल्पास्ते विज्ञेयाः परमार्थतः॥ ११४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000561.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000562", "originalText": "कुतो न्यायबलादेवं निश्चितं प्रतीयते।", "padacchedaText": "", "audioFile": "PB_hear2read_000562.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000563", "originalText": "यस्मात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000563.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000564", "originalText": "नित्यां संविदमाश्रित्य स्वतस्सिद्धामविक्रियाम्। सिद्धायन्ते धियो बोधास्तांश्चाश्रित्य घटादयः॥ ११५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000564.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000565", "originalText": "यस्मान्न कयाचिदपि युक्त्यात्मनः कारकत्वं क्रियात्वं\nफलत्वं चोपपद्यते तस्मादात्मवस्तुयाथात्म्यानवबोध—\nमात्रोपादानत्वान्नभसीव रजोधूमतुषार नीहारनील—\nत्वाद्यध्यासो यथोक्तात्मनि सर्वोऽयं क्रियाकारकफलात्मक—\nसंसारोऽहंममत्वयत्नेच्छादिमिथ्याध्यास एवेति\nसिद्धमिममर्थमाह।", "padacchedaText": "", "audioFile": "PB_hear2read_000565.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000566", "originalText": "अहंमिथ्याभिशापेन दुःख्यात्मा तद्बुभुत्सया। इतः श्रुतिं तया नेतीत्युक्तः कैवल्यमास्थितः॥ ११६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000566.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000567", "originalText": "तस्यास्य मुमुक्षोः श्रौताद्वचसः\nस्वप्ननिमित्तोत्सारितनिद्रस्येवेयं\nनिश्चितार्था प्रमा जायते।", "padacchedaText": "", "audioFile": "PB_hear2read_000567.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000568", "originalText": "नाहं न च ममात्मत्वात्सर्वदानात्मवर्जितः। भानाविव तमोध्यासोऽपह्नवश्च तथा मयि॥ ११७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000568.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000569", "originalText": "सोऽयमेवम्प्रतिपान्नस्वभावमात्मानं प्रतिपन्नोऽनुक्रोशति।", "padacchedaText": "", "audioFile": "PB_hear2read_000569.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000570", "originalText": "यत्र त्वस्येति साटोपं कृत्स्नद्वैतनिषेधिनीम्। प्रोत्सारयन्तीं संसारमप्यश्रौषं न किं श्रुतिम्॥ ११८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000570.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000571", "originalText": "इत्योमित्यवबुद्धात्मा निष्कलोऽकारकोऽक्रियः। विरक्त इव बुद्ध्यादेरेकाकित्वमुपेयिवान्॥ ११९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000571.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000572", "originalText": "इति द्वितीयोऽध्यायः॥ २॥", "padacchedaText": "", "audioFile": "PB_hear2read_000572.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000573", "originalText": "अथ तृतीयोऽध्यायः।", "padacchedaText": "", "audioFile": "PB_hear2read_000573.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000574", "originalText": "सर्वोऽयं प्रमितिप्रमाणप्रमेयप्रमातृलक्षण\nआब्रह्मस्तम्बपर्यन्तो मिथ्याध्यास एवेति बहुश\nउपपत्तिभिरतिष्ठिपम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000574.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000575", "originalText": "आत्मा च\nजन्मादिषड्भावविकारवर्जितः\nकूटस्थबोध एवेति स्फुटीकृतम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000575.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000576", "originalText": "तयोश्च\nमिथ्याध्यासकूटस्थात्मनोर्नान्तरेणाज्ञानं\nसम्बन्धोऽन्यत्र चोदनापरिप्रापितात् यथा\n᳚इयमेवर्गग्निः साम᳚ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000576.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000577", "originalText": "तच्चाज्ञानं\nस्वात्ममात्र निमित्तं न सम्भवतीति\nकस्यचित्कस्मिंश्चिद्विषये\nभवतीत्यभ्युपगन्तव्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000577.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000578", "originalText": "इह च पदार्थद्वयं\nनिर्द्धारितमात्मानात्मा च।", "padacchedaText": "", "audioFile": "PB_hear2read_000578.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000579", "originalText": "तत्रानात्मनस्तावन्नाज्ञानेनाभिसम्बन्धः।", "padacchedaText": "", "audioFile": "PB_hear2read_000579.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000580", "originalText": "तस्य हि\nस्वरूपमेवाज्ञानं न हि स्वतोऽज्ञानस्याज्ञानं घटते।", "padacchedaText": "", "audioFile": "PB_hear2read_000580.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000581", "originalText": "सम्भवदप्यज्ञानस्वभावेऽज्ञानं कमतिशयं जनयेत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000581.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000582", "originalText": "न च तत्र ज्ञानप्राप्तिरस्ति येन तत्प्रतिषेधात्मकमज्ञानं\nस्यात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000582.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000583", "originalText": "अनात्मनश्चाज्ञानप्रसूतत्त्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000583.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000584", "originalText": "न हि पूर्वसिद्धं सत्ततोलब्धात्मलाभस्य सेत्स्यत\nआश्रयस्याश्रयि सम्भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_000584.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000585", "originalText": "तदनपेक्षस्य च तस्य\nनिस्स्वभावत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000585.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000586", "originalText": "एतेभ्य एव हेतुभ्यो\nनानात्मविषयमज्ञानं\nसम्भवतीति ग्राह्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000586.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000587", "originalText": "एवं तावन्नानात्मनोऽज्ञानित्वं\nनापि\nतद्विषयमज्ञानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000587.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000588", "originalText": "पारिशेष्यादात्मन एवास्त्वज्ञानं\nतस्याज्ञोऽस्मीत्यनुभवदर्शनात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000588.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000589", "originalText": "᳚सोऽहं भगवो\nमन्त्रविदेवास्मि नात्मवित् ᳚इति श्रुतेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000589.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000590", "originalText": "न चात्मनोऽज्ञानस्वरूपता तस्य चैतन्यमात्रस्वाभाव्या—\nदतिशयश्च सम्भवति ज्ञानविपरिलोपो ज्ञानप्राप्तेश्च\nसम्भवस्तस्य ज्ञानकारित्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000590.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000591", "originalText": "न च अज्ञानकार्यत्वं\nकूटस्थात्मस्वाभाव्यादज्ञानानपेक्षस्य चात्मनः स्वत एव\nस्वरूपसिद्धेर्युक्तमात्मन एवाज्ञत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000591.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000592", "originalText": "किंविषयं\nपुनस्तदात्मनोऽज्ञानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000592.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000593", "originalText": "आत्मविषयमिति ब्रूमः।", "padacchedaText": "", "audioFile": "PB_hear2read_000593.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000594", "originalText": "नन्वात्मनोऽपि ज्ञानस्वरूपत्वादनन्यत्वाच्च\nज्ञानप्रकृतित्वादिभ्यश्च हेतुभ्यो नैवाज्ञानं घटते।", "padacchedaText": "", "audioFile": "PB_hear2read_000594.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000595", "originalText": "घटत एव।", "padacchedaText": "", "audioFile": "PB_hear2read_000595.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000596", "originalText": "कथम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000596.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000597", "originalText": "अज्ञानमात्रनिमित्तत्वात्तद्विभागस्य सर्पात्मतेव रज्ज्वाः।", "padacchedaText": "", "audioFile": "PB_hear2read_000597.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000598", "originalText": "तस्मात्तदपनुत्तौ द्वैतानर्थाभावः।", "padacchedaText": "", "audioFile": "PB_hear2read_000598.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000599", "originalText": "तदपनोदश्च\nवाक्यादेव तत्पदपदार्थाभिज्ञस्य।", "padacchedaText": "", "audioFile": "PB_hear2read_000599.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000600", "originalText": "अतो वाक्यव्याख्यानायाध्याय आरभ्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000600.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000601", "originalText": "तत्र यथोक्तेन\nप्रकारेण तत्त्वमस्यादिवाक्योपनिविष्टपदपदार्थयोः\nकृतान्वयव्यतिरेकः।", "padacchedaText": "", "audioFile": "PB_hear2read_000601.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000602", "originalText": "यदा ना तत्त्वमस्यादेर्ब्रह्मास्मीत्यवगच्छति। प्रध्वस्ताहंममो नैति तदा गीर्मनसोः सृतिम्॥ १॥", "padacchedaText": "", "audioFile": "PB_hear2read_000602.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000603", "originalText": "यदैव तदर्थं त्वमर्थेऽवैति तदैवावाक्यार्थतां\nप्रतिपद्यते गीर्मनसोः सृतिं न प्रतिपद्यत इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000603.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000604", "originalText": "कुत\nएतद्ध्यवसीयते।", "padacchedaText": "", "audioFile": "PB_hear2read_000604.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000605", "originalText": "यस्मात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000605.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000606", "originalText": "तत्पदं प्रकृतार्थं स्यात्त्वम्पदं प्रत्यगात्मनि। नीलोत्पलवदेताभ्यां दुःख्यनात्मत्ववारणे॥ २॥", "padacchedaText": "", "audioFile": "PB_hear2read_000606.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000607", "originalText": "एवं कृतान्वयव्यतिरेको वाक्यादेवावाक्यार्थं प्रतिपद्यत\nइत्युक्तमतस्तद्व्याख्यानाय सूत्रोपन्यासः।", "padacchedaText": "", "audioFile": "PB_hear2read_000607.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000608", "originalText": "सामानाधिकरण्यं च विशेषणविशेष्यता। लक्ष्यलक्षणसम्बन्धः पदार्थप्रत्यगात्मनाम्॥ ३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000608.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000609", "originalText": "अस्मिन् सूत्र उपन्यस्ते कश्चिच्चोदयति योऽयं\nवाक्यार्थप्रतिपत्तौ पूर्वाध्यायेनान्वयव्यतिरेकलक्षणो\nन्यायः सर्वकर्मसंन्यासपूर्वकोऽभिहितः किमयं\nविधिपरिप्रापितः किं वा स्वरसत एवात्र\nपुमान्प्रवर्तत इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000609.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000610", "originalText": "किंचातः।", "padacchedaText": "", "audioFile": "PB_hear2read_000610.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000611", "originalText": "श‍ृणु।", "padacchedaText": "", "audioFile": "PB_hear2read_000611.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000612", "originalText": "यद्यात्मवस्तुसाक्षात्करणाय विधिपरिप्रापितोऽयं\nन्यायस्तदावश्यमात्मवस्तुसाक्षात्करणाय\nव्यावृत्तशुभाशुभकर्मराशिरेकाग्रमना\nअन्वयव्यतिरेकाभ्यां यथोक्ताभ्यामात्मदर्शनं करोति।", "padacchedaText": "", "audioFile": "PB_hear2read_000612.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000613", "originalText": "अपरिसमाप्यात्मदर्शनं ततः प्रच्यवमान आरूढपतितो\nभवति।", "padacchedaText": "", "audioFile": "PB_hear2read_000613.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000614", "originalText": "यदि पुनर्यदृच्छातः प्रवर्तते तदा न\nकश्चिद्दोष इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000614.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000615", "originalText": "विधिपरिप्रापित इति ब्रूमो यत आह।", "padacchedaText": "", "audioFile": "PB_hear2read_000615.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000616", "originalText": "शमादिसाधनः पश्येदात्मन्यात्मानमञ्जसा। अन्वयव्यतिरेकाभ्यां त्यक्त्वा युष्मदशेषतः॥ ४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000616.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000617", "originalText": "युष्मदर्थे परित्यक्ते पूर्वोक्तैर्हेतुभिः श्रुतिः। वीक्षापन्नस्य कोऽस्मीति तत्त्वमित्याह सौहृदात्॥ ५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000617.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000618", "originalText": "अत्रापि चोदयन्ति सांख्याः।", "padacchedaText": "", "audioFile": "PB_hear2read_000618.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000619", "originalText": "शरीरेन्द्रियमनोबुद्धि—\nष्वनात्मस्वात्मेति निस्सन्धिबन्धनं मिथ्याज्ञानमज्ञानं\nतन्निबन्धनो ह्यात्मनोऽनेकानर्थसम्बन्धस्तस्य\nचान्वयव्यतिरेकाभ्यामेव निरस्तत्त्वान्निर्विषयं\nतत्त्वमस्यादिवाक्यं प्राप्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000619.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000620", "originalText": "तस्माद्वाक्यस्य चैष\nमहिमा योऽयमात्मानात्मनोर्विभाग इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000620.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000621", "originalText": "तन्निराकरणायेदमुच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000621.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000622", "originalText": "भेदसंविदिदं ज्ञानं भेदाभावश्च साक्षिणि। कार्यमेतदविद्याया ज्ञात्मना त्याजयेद्वचः॥ ६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000622.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000623", "originalText": "ज्ञात्मना त्याजयेद्वच इत्युपश्रुत्याह कश्चित्।", "padacchedaText": "", "audioFile": "PB_hear2read_000623.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000624", "originalText": "मिथ्याज्ञानव्यतिरेकेणात्मानवबोधस्याभावात्किं\nवाक्येन निवर्तते।", "padacchedaText": "", "audioFile": "PB_hear2read_000624.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000625", "originalText": "अज्ञानं हि नाम ज्ञानाभावस्तस्य\nचावस्तुस्वाभाव्यात्कुतः संसारकारणत्वं न ह्यसतः\nसज्जन्मेष्यते ᳚कुतस्तु खलु सोम्यैवं स्यात् ᳚ इति\n᳚कथमसतः सज्जायेत ᳚ इति श्रुतेरिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000625.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000626", "originalText": "अत्रोच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000626.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000627", "originalText": "अज्ञात एव सर्वोऽर्थः प्राग्यतो बुद्धिजन्मनः। एकेनैव सता संश्च सन्नज्ञातो भवेत्ततः॥ ७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000627.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000628", "originalText": "सन्नज्ञातो भवेत्तत इत्युक्तमधस्ततेन श्लोकेन।", "padacchedaText": "", "audioFile": "PB_hear2read_000628.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000629", "originalText": "कोऽसौ सन्नज्ञात इत्यपेक्षायां तत्स्वरूपप्रतिपादनायाह।", "padacchedaText": "", "audioFile": "PB_hear2read_000629.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000630", "originalText": "प्रमित्सायां य आभाति स्वयं मातृप्रमाणयोः। स्वमहिम्ना च यस्सिद्धः सोऽज्ञातार्थोऽवसीयताम्॥ ८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000630.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000631", "originalText": "अत्र केचिदाहुः।", "padacchedaText": "", "audioFile": "PB_hear2read_000631.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000632", "originalText": "यत्किंचिदिह वाक्यं लौकिकं वैदिकं वा\nतत्सर्वं संसर्गात्मकमेव वाक्यार्थं गमयति।", "padacchedaText": "", "audioFile": "PB_hear2read_000632.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000633", "originalText": "अतस्तत्त्वमस्यादिवाक्येभ्यः संसर्गात्मकमहं ब्रह्मेति\nविज्ञाय तावन्निदिध्यासीत यावदवाक्यार्थात्मकः\nप्रत्यगात्मविषयोऽवबोधोऽहं ब्रह्मेति समभिजायते।", "padacchedaText": "", "audioFile": "PB_hear2read_000633.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000634", "originalText": "तस्मादेव विज्ञानात्कैवल्यमाप्नोतीति\nतन्निराकरणायेदमुच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000634.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000635", "originalText": "सामानाधिकरण्यादेर्घटेतरखयोरिव। व्यावृत्तेः स्यादवाक्यार्थः साक्षान्नस्तत्त्वमर्थयोः॥ ९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000635.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000636", "originalText": "कुतोऽवाक्यार्थोऽवसीयत इति चेत्तत्प्रतिपत्त्यर्थं\nविशेषणविशेष्ययोः सामर्थ्योक्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000636.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000637", "originalText": "निर्दुःखित्वं त्वमर्थस्य तदर्थेन विशेषणात्। प्रत्यक्ता च तदर्थस्य त्वम्पदेनास्य संनिधेः॥ १०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000637.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000638", "originalText": "उक्तं सामानाधिकरण्यं विशेषणविशेष्यभावश्च\nसंक्षेपतोऽथ लक्ष्यलक्षणव्याख्यानायाह।", "padacchedaText": "", "audioFile": "PB_hear2read_000638.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000639", "originalText": "कूटस्थबोधप्रत्यक्त्वमनिमित्तं सदात्मनः। बोद्धृताहन्तयोर्हेतुस्ताभ्यां तेनोपलक्ष्यते॥ ११॥", "padacchedaText": "", "audioFile": "PB_hear2read_000639.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000640", "originalText": "बुद्धेः कूटस्थबोधप्रत्यक्त्वनिमित्ते बोद्धृताप्रत्यक्त्वे\nये त्वसाधारणे तयोर्विशेषवचनम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000640.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000641", "originalText": "बोद्धृता कर्तृता बुद्धेः कर्मता स्यादहन्तया। तयोरैक्यं यथा बुद्धौ पूर्वयोरेवमात्मनि॥ १२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000641.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000642", "originalText": "यथा बुद्धौ पूर्वयोरेवमात्मनीत्यतिदेशेन बुद्धिसाधर्म्य—\nविधानान्नानात्वप्रसक्तौ तदपवादार्थमाह।", "padacchedaText": "", "audioFile": "PB_hear2read_000642.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000643", "originalText": "धर्मधर्मित्वभेदोऽस्याः सोऽपि नैवात्मनो यतः। प्रत्यग्ज्योतिरतोऽभिन्नं भेदहेतोरसम्भवात्॥ १३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000643.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000644", "originalText": "भेदहेतसम्भवं दर्शयन्नाह।", "padacchedaText": "", "audioFile": "PB_hear2read_000644.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000645", "originalText": "न कस्यांचिदवस्थायां बोधप्रत्यक्त्वयोर्भिदा। व्यभिचारोऽथवा दृष्टो यथाहन्तद्विदोस्सदा॥ १४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000645.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000646", "originalText": "यस्मादज्ञानोपादानाया एव बुद्धेर्भेदो\nनात्मनस्तस्मादेतत्सिद्धम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000646.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000647", "originalText": "कूटस्थबोधतोऽद्वैतं साक्षात्त्वं प्रत्यगात्मनः। कूटस्थबोधाद्बोद्ध्री धीः स्वतो हीयं विनश्वरी॥ १५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000647.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000648", "originalText": "अथाधुना प्रकृतस्यैव परिणामिनः कूटस्थस्य च\nलक्षणमुच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000648.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000649", "originalText": "विशेषं कंचिदाश्रित्य यत्स्वरूपं प्रतीयते। प्रत्यभिज्ञाप्रमाणेन परिणामी स देहवत्॥ १६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000649.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000650", "originalText": "सामान्याच्च विशेषाच्च स्वमहिम्नैव यो भवेत्। व्युथ्यायाप्यविकारी स्यात्कुम्भाकाशादिवत्तु सः॥ १७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000650.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000651", "originalText": "आत्मनो बुद्धेश्च बोधप्रत्यगात्मत्वमभिहितं\nतयोरसाधारणलक्षणाभिधानार्थमाह।", "padacchedaText": "", "audioFile": "PB_hear2read_000651.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000652", "originalText": "बुद्धेर्यत्प्रत्यगात्मत्वं तत्स्याद्देहाद्युपाश्रयात्। आत्मनस्तु स्वरूपं तन्नभसः सुषिता यथा॥ १८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000652.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000653", "originalText": "बोद्धृत्वं तद्वदेवास्याः प्रत्ययोत्पत्तिहेतुतः। आत्मनस्तु स्वरूपं तत्तिष्ठन्तीव महीभृतः॥ १९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000653.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000654", "originalText": "तयोः कूटस्थपरिणामिनोरात्मानवबोध एव सम्बन्धहेतुर्न\nपुनर्वास्तवः कश्चिदपि सम्बन्ध उपपद्यत इत्याह।", "padacchedaText": "", "audioFile": "PB_hear2read_000654.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000655", "originalText": "सम्यक्संशयमिथ्यात्वैर्धीरेवेयं विभज्यते। हानोपादानतामीषां मोहादध्यस्यते दृशौ॥ २०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000655.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000656", "originalText": "कुतः कूटस्थात्मसिद्धिरिति चेद्यतः।", "padacchedaText": "", "audioFile": "PB_hear2read_000656.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000657", "originalText": "न हानं हानमात्रेण नोदयोऽपीयता यतः। तत्सिद्धिः स्यात्तु तद्धीने हानादानविधर्मके॥ २१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000657.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000658", "originalText": "एवम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000658.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000659", "originalText": "आगमापायिहेतुभ्यां धूत्वा सर्वाननात्मनः। ततस्तत्त्वमसीत्येतद्धन्त्यस्मदि निजं तमः॥ २२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000659.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000660", "originalText": "इत्यादि पुनःपुनरुच्यते ग्रन्थलाघवाद्बुद्धिलाघवं\nप्रयोजकमिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000660.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000661", "originalText": "तत्र यद्यपि तत्त्वमस्यादिवाक्यादुपादि—\nत्सिताद्वितीयात्मार्थवत्पारोक्ष्यसद्वितीयार्थः प्रतीयते।", "padacchedaText": "", "audioFile": "PB_hear2read_000661.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000662", "originalText": "तथापि तु नैवासावर्थः श्रुत्या तात्पर्येण\nप्रतिपिपादयिषितः प्रागपेतस्य प्रतीतत्वादितीममर्थमाह।", "padacchedaText": "", "audioFile": "PB_hear2read_000662.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000663", "originalText": "तदित्येतत्पदं लोके बह्वर्थप्रतिपादकम्। अपरित्यज्य पारोक्ष्यमभिधानोत्थमेव तत्॥ २३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000663.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000664", "originalText": "त्वमित्यपि पदं तद्वत्साक्षान्मात्रार्थवाचि तु। संसारितामसंत्यज्य सापि स्यादभिधानजा॥ २४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000664.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000665", "originalText": "विरुद्धोद्देशनत्वाच्च\nपारोक्ष्यदुःखित्वयोरविवक्षितत्वमित्याह।", "padacchedaText": "", "audioFile": "PB_hear2read_000665.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000666", "originalText": "उद्दिश्यमानं वाक्यस्थं नोद्देशनगुणात्वितम्। आकाङ्क्षितपदार्थेन संसर्गं प्रतिपद्यते॥ २५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000666.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000667", "originalText": "यत एतदेवमतोऽनुपादित्सितयोरपि\nतत्त्वमर्थयोर्विशेषणविशेष्यभावो\nभेदसंसर्गरहितवाक्यार्थलक्षणायैवेत्युपसंहारः।", "padacchedaText": "", "audioFile": "PB_hear2read_000667.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000668", "originalText": "तदो विशेषणार्थत्वं विशेष्यत्वं त्वमस्तथा। लक्ष्यलक्षणसम्बन्धस्तयोः स्यात्प्रत्यगात्मना॥ २६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000668.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000669", "originalText": "कथं पुनरविवक्षितविरुद्धनिरस्यमानस्य लक्षणार्थत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000669.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000670", "originalText": "लक्षणं सर्पवद्रज्ज्वाः प्रतीचः स्यादहं तथा। तद्बाधेनैव वाक्यार्थं वेत्ति सोऽपि तदाश्रयात्॥ २७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000670.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000671", "originalText": "इयं चावाक्यार्थप्रतिपत्तिरन्वयव्यतिरेकाभिज्ञस्यैव।", "padacchedaText": "", "audioFile": "PB_hear2read_000671.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000672", "originalText": "यस्मात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000672.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000673", "originalText": "यावद्यावन्निरस्यायं देहादीन्प्रत्यगञ्चति। तावत्तावत्तदर्थोऽपि त्वमर्थं प्रविविक्षति॥ २८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000673.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000674", "originalText": "कस्मात्पुनः कारणाद्देहाद्यनात्मत्वप्रतिपत्तावेवात्मा\nतदर्थमात्मत्वेनाभिलिङ्गते न विपर्यय इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000674.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000675", "originalText": "उच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000675.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000676", "originalText": "प्रत्यगात्मानवबोधस्यनात्मस्वाभाव्यात्तदभिनिर्वृत्तश्चायं\nबुद्ध्यादिदेहान्तस्तस्मिन्नात्मत्वमविद्याकृतमेवात्मत्वमिवाना—\nत्मत्वमपि साविद्यस्यैव।", "padacchedaText": "", "audioFile": "PB_hear2read_000676.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000677", "originalText": "यतो निरविद्यो विद्वानवाक्यार्थरूप\nएव केवलोऽवशिष्यते तस्मादुच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000677.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000678", "originalText": "देहादिव्यवधानत्वात्तदर्थं स्वयमप्यतः। पारोक्ष्येणैव जानाति साक्षात्त्वं तदनात्मनः॥ २९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000678.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000679", "originalText": "यथोक्तार्थप्रतिपत्तिसौकर्याय दृष्टान्तोपादानाम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000679.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000680", "originalText": "प्रत्यगुद्भुतपित्तस्य यथा बाह्यार्थपीतता। चैतन्यं प्रत्यगात्मीयं बहिर्वद्दृश्यते तथा॥ ३०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000680.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000681", "originalText": "यस्मादेवमतो विशुद्धमवसीयताम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000681.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000682", "originalText": "पदान्युद्धृत्य वाक्येभ्यो ह्यन्वयव्यतिरेकतः। पदार्थाँल्लोकतो बुद्ध्वा वेत्ति वाक्यार्थमञ्जसा॥ ३१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000682.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000683", "originalText": "कुतः पुनः सामान्यमात्रवृत्तेः पदस्य\nवाक्यार्थप्रतिपत्तिहेतुत्वमिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000683.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000684", "originalText": "बाढम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000684.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000685", "originalText": "सामान्यं हि पदं ब्रूते विशेषो वाक्यकर्तृकः। श्रुत्यादिप्रतिबद्धं सद्विशेषार्थं भवेत्पदम्॥ ३२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000685.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000686", "originalText": "अन्वयव्यतिरेकपुरस्सरं वाक्यमेव\nसामानाधिकरण्यादिनाविद्या—\nपटलप्रध्वंसद्वारेण मुमुक्षुं स्वाराज्येऽभिषेचयति न\nत्वन्वयव्यतिरेकमात्रसाध्योऽयमर्थ इत्याह।", "padacchedaText": "", "audioFile": "PB_hear2read_000686.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000687", "originalText": "बुद्ध्यादीनामनात्मत्वं लिङ्गादपि च सिध्यति। निवृत्तिस्तावता नेतीत्यतो वाक्यं समाश्रयेत्॥ ३३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000687.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000688", "originalText": "न केवलमनुमानमात्रशरणोऽभिलषितमर्थं न\nप्राप्नोतीत्यनर्थं चाप्नोतीत्याह।", "padacchedaText": "", "audioFile": "PB_hear2read_000688.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000689", "originalText": "अनादृत्य श्रुतिं मोहादतो बौद्धास्तमस्विनः। आपेदिरे निरात्मत्वमनुमानैकचक्षुषः॥ ३४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000689.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000690", "originalText": "न चानादरे कारणमस्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000690.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000691", "originalText": "यस्मात्सर्वत्रैवानादरनिमित्तं\nप्रमाणस्य प्रमाणान्तरप्रतिपन्नप्रतिपादनं वा\nविपरीतप्रतिपादनं वा संशयितप्रतिपादनं वा न वा\nप्रतिपादनमिति—— न चैतेषामन्यतमदपि कारणमस्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000691.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000692", "originalText": "यत आह।", "padacchedaText": "", "audioFile": "PB_hear2read_000692.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000693", "originalText": "मानान्तरानवष्टब्धं निर्दुःख्यात्मानमञ्जसा। बोधयन्ती श्रुतिः केन न प्रमाणमितीर्यते॥ ३५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000693.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000694", "originalText": "न च संशयितव्यमवगमयति।", "padacchedaText": "", "audioFile": "PB_hear2read_000694.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000695", "originalText": "यतः।", "padacchedaText": "", "audioFile": "PB_hear2read_000695.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000696", "originalText": "सर्वसंशयहेतौ हि निरस्ते कथमात्मनि। जायेत संशयो वाक्यादनुमानेन युष्मदि॥ ३६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000696.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000697", "originalText": "अपि च।", "padacchedaText": "", "audioFile": "PB_hear2read_000697.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000698", "originalText": "यत्र स्यात्संशयो नासौ ज्ञेय आत्मेति पण्डितैः। न यतः संशयप्राप्तिरात्मनोऽवगतित्वतः॥ ३७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000698.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000699", "originalText": "अनवबोधकत्वं तु दूरोत्सारितमेव।", "padacchedaText": "", "audioFile": "PB_hear2read_000699.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000700", "originalText": "यत आह।", "padacchedaText": "", "audioFile": "PB_hear2read_000700.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000701", "originalText": "बोधेऽप्यनुभवो यस्य न कथंचन जायते। तं कथं बोधयेच्छास्त्रं लोष्टं नरसमाकृतिम्॥ ३८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000701.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000702", "originalText": "अन्वयव्यतिरेकपुरस्सरं वाक्यमेवावाक्यार्थरूपमात्मानं\nप्रतिपादयतीत्यस्य पक्षस्य द्रढिम्न\nश्रुत्युदाहरणमुपन्यस्यति।", "padacchedaText": "", "audioFile": "PB_hear2read_000702.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000703", "originalText": "जिघ्राणीममहं गन्धमिति यो वेत्त्यविक्रियः। स आत्मा तत्परं ज्योतिः शिरसीदं वचः श्रुतेः॥ ३९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000703.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000704", "originalText": "यथा ᳚तत्सत्यं स आत्मा तत्त्वमसि ᳚ इत्यस्य\nशेषत्वेनान्वयव्यतिरेकश्रुतिर्यथा ᳚य एषोऽक्षिणि\nपुरुषो\nदृश्यते ᳚ इत्याद्या ᳚अथ यो वेदेदं जिघ्राणि ᳚\nइत्यन्ता तथा ᳚अहं ब्रह्मास्मि ᳚ इत्यस्य शेषः।", "padacchedaText": "", "audioFile": "PB_hear2read_000704.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000705", "originalText": "अहमः प्रत्यगात्मार्थो निरस्ताशेषयुष्मदः। बम्भणीति श्रुतिर्न्याय्या योऽयमित्यादिनाऽसकृत्॥ ४०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000705.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000706", "originalText": "कथं पुनरयमर्थोऽवसीयते अहंव्याजेनात्रात्मार्थो\nबुबोधयिषित इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000706.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000707", "originalText": "यतः।", "padacchedaText": "", "audioFile": "PB_hear2read_000707.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000708", "originalText": "एष आत्मा स्वयंज्योती रविसोमाग्निवाक्षु सः। इतेष्वस्तं दृगेवास्ते भासयंचित्तचेष्टितम्॥ ४१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000708.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000709", "originalText": "निर्णेनेक्ति च पृष्टो मुनिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000709.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000710", "originalText": "आत्मनैवेत्युपश्रुत्य कोऽयमात्मेत्युदीरिते। बुद्धेः परं स्वतोमुक्तमात्मानं मुनिरभ्यधात्॥ ४२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000710.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000711", "originalText": "यस्माच्चात्मात्राहंव्याजेन प्रत्यङ्मात्रो\nजिग्राहयिषितस्तस्मादहंवृत्तिः स्वरूपस्य विलयेनैव\nवाक्यार्थावगमाय कारणत्वं प्रतिपद्यत इतीममर्थमाह।", "padacchedaText": "", "audioFile": "PB_hear2read_000711.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000712", "originalText": "अहंवृत्त्यैव तद्ब्रह्म यस्मादेषोऽवगच्छति। तत्स्वरूपलयेनातः कारणं स्यादहंकृतिः॥ ४३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000712.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000713", "originalText": "अत एव च यः प्रतिज्ञातोऽर्थो ᳚नाहंग्राह्ये न\nतद्धीने ᳚इत्यादिः स युक्तिभिरुपपादित इति\nकृत्वोपसंह्रियते।", "padacchedaText": "", "audioFile": "PB_hear2read_000713.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000714", "originalText": "गृहीताहम्पदार्थश्चेत्कस्माज्ज्ञो न प्रपद्यते। प्रत्यक्षादिविरोधाच्चेत्प्रतीच्युक्तिर्न युष्मदि॥ ४४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000714.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000715", "originalText": "पूर्वस्यैव श्लोकार्थस्य विस्पष्टार्थमाह।", "padacchedaText": "", "audioFile": "PB_hear2read_000715.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000716", "originalText": "पराञ्च्येव तु सर्वाणि प्रत्यक्षादीनि नात्मनि। प्रतीच्येव प्रवृत्तं तत्सदसीति वचोऽञ्जसा॥ ४५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000716.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000717", "originalText": "तस्मात्प्रमातृप्रमाणप्रमेयेभ्यो\nहीयमानोपादीयमानेभ्योऽन्वयव्यतिरेकाभ्यां\nमुञ्जेषीकावदशेषबुद्धिविक्रियासाक्षितयात्मानं\nनिष्कृष्य तत्त्वमस्यादिवाक्येभ्योऽपूर्वादिलक्षणमात्मानं\nविजानीयात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000717.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000718", "originalText": "तदेतदाह।", "padacchedaText": "", "audioFile": "PB_hear2read_000718.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000719", "originalText": "अहं दुःखी सुखी चेति येनायं प्रत्ययोऽध्रुवः। अवगत्यन्त आभाति स म आत्मेति वाक्यधीः॥ ४६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000719.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000720", "originalText": "प्रमाणान्तरानवष्टब्धं निरस्ताशेषकार्य—\nकारणात्मकद्वैतप्रपञ्चं सत्यज्ञानानन्द—\nलक्षणमात्मानं तत्त्वमस्यहम्ब्रह्मास्मीत्यादिवाक्यं\nसंशयितमिथ्याज्ञानाज्ञानप्रध्वंसमुखेन\nसाक्षादपरोक्षात्करतलन्यस्तामलकवत्प्रतिपादयत्येवे—\nत्यसकृदभिहितम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000720.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000721", "originalText": "तत्र केचिदाहुः——तत्त्वमस्यादिवाक्यै—\nर्यथावस्थितवस्तुयाथात्म्यान्वाख्याननिष्ठैर्न\nयथोक्तोऽर्थः प्रतिपत्तुं शक्यतेऽभिधाश्रुतित्वात्तेषाम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000721.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000722", "originalText": "न हि लोकेऽभिधाश्रुतेः प्रमाणान्तरनिरपेक्षाया\nनद्यास्तीरे फलानि सन्तीत्यादिकायाः प्रामाण्यमभ्युपगतम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000722.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000723", "originalText": "अतो नियोगमुखेनैवाभिधाश्रुतेः प्रामाण्यं युक्तं\nप्रमाणान्तरनिरपेक्षत्वान्नियोगस्य।", "padacchedaText": "", "audioFile": "PB_hear2read_000723.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000724", "originalText": "अस्य परिहारार्थ—\nमशेषप्रत्यक्षादिप्रमेयत्वनिराकरणद्वारेणातीन्द्रियार्थ—\nविषयत्वादभिधाश्रुतेः प्रामाण्यं सुप्तपुरुषप्रबोधक—\nवाक्यस्येव वक्तव्यमित्ययमारम्भः।", "padacchedaText": "", "audioFile": "PB_hear2read_000724.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000725", "originalText": "नित्यावगतिरूपत्वादन्यमानानपेक्षणात्। शब्दादिगुणहीनत्वात्संशयानवतारतः॥ ४७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000725.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000726", "originalText": "तृष्णानिष्ठीवनैर्नात्मा प्रत्यक्षाद्यः प्रमीयते। प्रत्यगात्मत्वहेतोश्च स्वार्थत्वादप्रमेयतः॥ ४८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000726.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000727", "originalText": "श्रुतिरपीममर्थं निर्वदति।", "padacchedaText": "", "audioFile": "PB_hear2read_000727.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000728", "originalText": "दिद्दक्षितपरिछिन्नपराग्रूपादिसंश्रयात्। विपरीतमतो दृष्ट्या स्वतोबुद्धं न पश्यति॥ ४९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000728.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000729", "originalText": "न्यायसिद्धमतो वक्ति दृष्टेर्द्रष्टारमात्मनः। न पश्येत्प्रत्यगात्मानं प्रमाणं श्रुतिरादरात्॥ ५०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000729.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000730", "originalText": "अनुमानाविषयत्वेऽन्यदपि कारणमुच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000730.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000731", "originalText": "प्रत्यक्षस्य पराक्त्वान्न सम्बन्धग्रहणं यतः। आत्मनोऽतोऽनुमित्यास्यानुभवो न कथंचन॥ ५१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000731.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000732", "originalText": "एवमयं प्रमातृप्रमाणप्रमेयव्यवहारः सर्व एव\nपराचीनविषय एव न प्रतीचिनमात्मानमवगाहयितुमलम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000732.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000733", "originalText": "एवं च सत्यनेनैव यथोक्तोऽर्थोऽवसातुं शक्यत इत्याह।", "padacchedaText": "", "audioFile": "PB_hear2read_000733.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000734", "originalText": "प्रमाणव्यवहारोऽयं सर्व एव पराग्यतः। सुविचार्याप्यतोऽनेन युष्मद्येव दिदृक्षते॥ ५२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000734.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000735", "originalText": "यस्माल्लौकिकप्रत्यक्षादिप्रमाणानधिगम्योऽहम्ब्रह्मास्मीति\nवाक्यार्थस्तस्मात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000735.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000736", "originalText": "अन्वयव्यतिरेकाभ्यां निरस्याप्राणतो यतेः। वीक्षापन्नस्य कोऽस्मीति तदसीति श्रुतिर्जगौ॥ ५३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000736.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000737", "originalText": "सोऽयमन्वयव्यतिरेकन्याय एतावानेव यदवसानो वाक्यार्थस्त—\nदभिज्ञस्याहम्ब्रह्मास्मीत्याविर्भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_000737.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000738", "originalText": "द्रष्टृदृश्यविभागेनागमापायि—\nसाक्षिविभागेन च श्रुत्यभ्युपगमतः संक्षिप्योच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000738.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000739", "originalText": "दृश्यत्वाद्घटवद्देहो देहवच्चेन्द्रियाण्यपि। मनश्चेन्द्रियवज्ज्ञेयं मनोवन्निश्चयादिमत्॥ ५४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000739.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000740", "originalText": "तथा सकलकार्यकारणागमापायि विभागसाक्षित्वेनापि।", "padacchedaText": "", "audioFile": "PB_hear2read_000740.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000741", "originalText": "प्रागसद्याति पश्चात्सत्सच्च यायादसत्तथा। अनात्माभिजनं तत्स्याद्विपरीतः स्वयं दृशिः॥ ५५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000741.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000742", "originalText": "तत्र घटादीनां दृश्यानामनात्मत्वं द्रष्ट्रात्मपूर्वकं\nप्रत्यक्षेणैव प्रमाणेनोपलभ्यानात्मनश्चासाधारणान्—\nधर्मानवधार्य तैर्दृश्यत्वागमापायादिभिर्धर्मैः\nशरीरेन्द्रियमनोनिश्चयादिवृत्तीरनात्मतया\nव्युदस्याहंवृत्तिमतोऽपि दृश्यत्वाविशेषाद्द्रष्टृ—\nपूर्वकत्वमवसीयते।", "padacchedaText": "", "audioFile": "PB_hear2read_000742.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000743", "originalText": "तदेतदाह।", "padacchedaText": "", "audioFile": "PB_hear2read_000743.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000744", "originalText": "घटादयो यथा लिङ्गं स्युः परम्परयाहमः। दृश्यत्वादहमप्येवं लिङ्गं स्याद्द्रष्टुरात्मनः॥ ५६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000744.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000745", "originalText": "ननु द्रष्टृदर्शनदृश्यानां जाग्रत्स्वप्नसुषुप्ते—\nष्वागमापायदर्शनाद्यसाक्षिकौ तेषामागमापायौ स\nआगमापायविभागरहित आत्मा यथा यन्निबन्धनौ जगतः\nप्रकाशाप्रकाशौ स प्रकाशाप्रकाशविभागरहितः सूर्य\nइति।", "padacchedaText": "", "audioFile": "PB_hear2read_000745.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000746", "originalText": "यदा चैवं तदा वाक्यावगम्यस्यार्थस्यानुदितानस्तमित—\nविज्ञानमात्रस्वभावस्यानुमानेनैव प्रतिपन्नत्वात्पुनरपि\nवाक्यस्य निर्विषयत्वप्रसङ्गः।", "padacchedaText": "", "audioFile": "PB_hear2read_000746.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000747", "originalText": "नैष दोषः।", "padacchedaText": "", "audioFile": "PB_hear2read_000747.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000748", "originalText": "लिङ्गव्यवधानेन तत्प्रतिपत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000748.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000749", "originalText": "ननु साक्षादपरोक्षा—\nदात्मस्वभावेनानात्मनो हानोपादानयोः\nसम्बन्धग्रहणात्कमतिशयं\nवाक्यं कुर्यात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000749.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000750", "originalText": "मैवं वोचः।", "padacchedaText": "", "audioFile": "PB_hear2read_000750.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000751", "originalText": "लिङ्गाधीनत्वात्तत्प्रतिपत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000751.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000752", "originalText": "न हि लिङ्गव्यवधानेनात्मप्रतिपत्तिः साक्षात्प्रतिपत्तिर्भवति\n᳚यमेवैष वृणुते तेन लभ्यः ᳚ इति श्रुतेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000752.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000753", "originalText": "अत आह।", "padacchedaText": "", "audioFile": "PB_hear2read_000753.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000754", "originalText": "लिङ्गमस्तित्वनिष्ठत्वान्न स्याद्वाक्यार्थबोधकम्। सदसद्व्युत्थितात्माऽयमतो वाक्यात्प्रतीयते॥ ५७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000754.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000755", "originalText": "ननु यदि व्यावृत्तसदसद्विकल्पजालं वस्त्वभीष्टं\nवाक्याद्भवतस्तथापि तूत्सार्यते वाक्यविषया\nतृष्णा——यस्मादन्तरेणापि वाक्यश्रवणं\nनिरस्ताशेषविकल्पमागोपालाविपालपण्डितं सुषुप्ते\nवस्तु सिद्धमतो नार्थो वाक्यश्रवणेन।", "padacchedaText": "", "audioFile": "PB_hear2read_000755.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000756", "originalText": "नैतदेवम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000756.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000757", "originalText": "किं कारणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000757.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000758", "originalText": "सर्वानर्थबीजस्यात्मानवबोधस्य\nसुषुप्ते सम्भवात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000758.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000759", "originalText": "यदि हि सुषुप्तेऽज्ञानं\nनाभविष्यदन्तरेणापि वेदान्तवाक्यश्रवणमनन—\nनिदिध्यासनान्यहं ब्रह्मास्मीत्यध्यवसायात्सर्वप्राण—\nभूतामपि स्वरसत एव सुषुप्तप्रतिपत्तेः सकलसंसारो—\nच्छित्तिप्रसङ्गः।", "padacchedaText": "", "audioFile": "PB_hear2read_000759.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000760", "originalText": "न च कैवल्यात्पुनरुत्थानं न्याय्य—\nमनिर्मोक्षप्रसङ्गात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000760.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000761", "originalText": "न चान्य एव सुषुप्तोऽन्य\nएवोत्थित इति शक्यं वक्तुं नाद्राक्षमहं सुषुप्तेऽन्यत्—\nकिंचिदपीत्युत्तितस्य प्रत्यभिज्ञादर्शनात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000761.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000762", "originalText": "तस्मादवश्यं\nसुषुप्तेऽज्ञानमभ्युपगन्तव्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000762.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000763", "originalText": "ननु यदि तत्राज्ञान—\nमभविष्यद्रागद्वेषघटाज्ञानादिवत्प्रत्यक्षमभविष्य—\nद्यथेह लोके घटं न जानामीत्यज्ञानमव्यवहितं\nप्रत्यक्षम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000763.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000764", "originalText": "अत्रोच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000764.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000765", "originalText": "न।", "padacchedaText": "", "audioFile": "PB_hear2read_000765.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000766", "originalText": "अभिव्यञ्जकाभावात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000766.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000767", "originalText": "कथमभिव्यञ्जकाभाव इति चेच्छृणु।", "padacchedaText": "", "audioFile": "PB_hear2read_000767.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000768", "originalText": "बाह्यां वृत्तिमनुत्पाद्य व्यक्तिः स्यान्नाहमो यथा। नर्तेऽन्तःकरणं तद्वद्ध्वान्तस्य व्यक्तिराञ्जसी॥ ५८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000768.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000769", "originalText": "कश्चिदतिक्रान्तं प्रतिस्मृत्य ᳚दृश्यत्वादहमप्येवं\nलिङ्गं स्याद्द्रष्टुरात्मनः ᳚ इति\nनिर्युक्तिकमभिहितमित्याह।", "padacchedaText": "", "audioFile": "PB_hear2read_000769.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000770", "originalText": "किं कारणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000770.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000771", "originalText": "अहंतज्ज्ञात्रोर्विवेकाप्रसिद्धेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000771.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000772", "originalText": "यथेह\nघटदेवदत्तयोर्ग्राह्यग्राहकत्वेन स्फुटतरो विभागः प्रसिद्धो\nलोके न तथेहाहंकारतज्ज्ञात्रोर्विभागोऽस्तीति\nतस्मादसाध्वेतदभिहितमिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000772.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000773", "originalText": "अत्रोच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000773.mp3", "zipFile": "Naishkarmyasiddhi.zip"}
