तेश्च सम्यग्ज्ञानस्वरूपलाभ—\nमात्रहेतुत्वात्तदुपादानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000009.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000010", "originalText": "अशेषानर्थहेत्वात्मानवबोध—\nविषयस्य चानागमिकप्रत्यक्षादिलौकिकप्रमाणाविषयत्वा—\nद्वेदान्तागमवाक्यादेव सम्यग्ज्ञानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000010.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000011", "originalText": "अतोऽशेषवेदान्तसारसंग्रहप्रकरणमिदमारभ्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000011.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000012", "originalText": "तत्राभिलषितार्थप्रचयाय प्रकरणार्थसंसूत्रणाय\nचायमाद्यः श्लोकः।", "padacchedaText": "", "audioFile": "PB_hear2read_000012.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000013", "originalText": "खानिलाग्न्यब्धरित्र्यन्तं स्रक्फणीवोद्गतं यतः। ध्वान्तच्छिदे नमस्तस्मै हरये बुद्धिसाक्षिणे॥ १॥", "padacchedaText": "", "audioFile": "PB_hear2read_000013.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000014", "originalText": "स्वसम्प्रदायस्य चोदितप्रमाणपूर्वकत्वज्ञापनाय\nविशिष्टगुणसम्बन्धसंकीर्तनपूर्विका गुरोर्नमस्कारक्रिया।", "padacchedaText": "", "audioFile": "PB_hear2read_000014.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000015", "originalText": "अलब्ध्वातिशयं यस्माद्व्यावृत्तास्तमबादयः। गरीयसे नमस्तस्मा अविद्याग्रन्थिभेदिने॥ २॥", "padacchedaText": "", "audioFile": "PB_hear2read_000015.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000016", "originalText": "नमस्कारनिमित्तस्वाशयाविष्करणार्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000016.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000017", "originalText": "वेदान्तोदरसंगूढं संसारोत्सारि वस्तुगम्। ज्ञानं व्याकृतमप्यन्यैर्वक्ष्ये गुर्वनुशिक्षया॥ ३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000017.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000018", "originalText": "किंविशयं प्रकरणमिति चेत्तदुपन्यासः।", "padacchedaText": "", "audioFile": "PB_hear2read_000018.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000019", "originalText": "यत्सिद्धाविदमः सिद्धिर्यदसिद्धौ न किंचन। प्रत्यग्धर्मैकनिष्ठस्य याथात्म्यं वक्ष्यते स्फुटम्॥ ४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000019.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000020", "originalText": "विवक्षितप्रकरणार्थप्ररोचनायानुक्तदुरुक्ताप्रामाण्यकारण—\nशङ्काव्युदासेनस्वगुरोः प्रामाण्योपवर्णनम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000020.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000021", "originalText": "गुरूक्तो वेदराद्धान्तस्तत्र नो वच्म्यशक्तितः। सहस्रकिरणव्याप्ते खद्योतः किं प्रकाशयेत्॥ ५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000021.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000022", "originalText": "गुरुणैव वेदार्थस्य परिसमापितत्वात्प्रकरणोक्तौ\nख्यात्याद्यप्रामाण्य—\nकारणाशङ्केति चेत्तद्व्युदासार्थमाह।", "padacchedaText": "", "audioFile": "PB_hear2read_000022.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000023", "originalText": "न ख्यातिलाभपूजार्थं ग्रन्थोऽस्माभिरुदीर्यते। स्वबोधपरिशुद्ध्यर्थं ब्रह्मविन्निकषाश्मसु॥ ६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000023.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000024", "originalText": "अनर्थानर्थहेतुपुरुषार्थतद्धेतुप्रकरणार्थसंग्रहज्ञाप—\nनायोपन्यासः।", "padacchedaText": "", "audioFile": "PB_hear2read_000024.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000025", "originalText": "ऐकात्म्याप्रतिपत्तिर्या स्वात्मानिभवसंश्रया। साऽविद्या संसृतेर्बीजं तन्नाशो मुक्तिरात्मनः॥ ७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000025.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000026", "originalText": "पुरुषार्थहेतोरवशिष्टत्वात्तदभिव्याहारः।", "padacchedaText": "", "audioFile": "PB_hear2read_000026.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000027", "originalText": "वेदावसानवाक्योत्थसम्यग्ज्ञानाशुशुक्षणिः। दन्दहीत्यात्मनो मोहं न कर्माप्रतिकूलतः॥ ८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000027.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000028", "originalText": "प्रतिज्ञातार्थसंशुद्ध्यर्थं पूर्वपक्षोक्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000028.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000029", "originalText": "तत्र ज्ञानमभ्युपगम्य तावदुपन्यासः।", "padacchedaText": "", "audioFile": "PB_hear2read_000029.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000030", "originalText": "मुक्तेः क्रियाभिः सिद्धत्वाज्ज्ञानं तत्र करोति किम्। कथं चेच्छृणु तत्सर्वं प्रणिधाय मनो यथा॥ ९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000030.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000031", "originalText": "अकुर्वतः क्रियाः काम्या निषिद्धास्त्यजतस्तथा। नित्यनैमित्तिकं कर्म विधिवच्चानुतिष्ठतः॥ १०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000031.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000032", "originalText": "किमतो भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_000032.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000033", "originalText": "काम्यकर्मफलं तस्माद्देवादीमं न ढौकते। निषिद्धस्य निरस्तत्वान्नारकीं नैत्यधोजनिम्॥ ११॥", "padacchedaText": "", "audioFile": "PB_hear2read_000033.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000034", "originalText": "देहारम्भकयोश्च धर्माधर्मयोर्ज्ञानिना सह कर्मिणः\nसमानौ चोद्यपरिहारौ।", "padacchedaText": "", "audioFile": "PB_hear2read_000034.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000035", "originalText": "वर्तमानमिदं याभ्यां शरीरं सुखदुःखदम्। आरब्धं पुण्यपापाभ्यां भोगादेव तयोः क्षयः॥ १२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000035.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000036", "originalText": "काम्यप्रतिषिद्धकर्मफलत्वात्संसारस्य\nतन्निरासेनैवाशेषानर्थनिरासस्य सिद्धत्वात्किं\nनित्यानुष्ठानेनेति चेत्तन्न।", "padacchedaText": "", "audioFile": "PB_hear2read_000036.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000037", "originalText": "तदकरणादप्यनर्थप्रसक्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000037.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000038", "originalText": "नित्यानुष्ठानतश्चैनं प्रत्यवायो न संस्पृशेत्। अनादृत्यात्मविज्ञानमतः कर्माणि संश्रयेत्॥ १३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000038.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000039", "originalText": "अभ्युपेत्यैवमुच्यते न तु यथावस्थितात्मवस्तुविषयं\nज्ञानमस्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000039.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000040", "originalText": "तत्प्रतिपादकप्रमाणाभावात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000040.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000041", "originalText": "यावन्त्यश्चेह विद्यन्ते श्रुतयस्स्मृतिभिस्सह। विदधत्युरुयत्नेन कर्मातो भूरिसाधनम्॥ १४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000041.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000042", "originalText": "स्यात्प्रमाणसम्भवो भवदपराधादिति चेत्तन्न।", "padacchedaText": "", "audioFile": "PB_hear2read_000042.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000043", "originalText": "यतः।", "padacchedaText": "", "audioFile": "PB_hear2read_000043.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000044", "originalText": "यत्नतो वीक्षमाणोऽपि विधिं ज्ञानस्य न क्वचित्। श्रुतौ स्मृतौ वा पश्यामि विश्वासो नान्यतोऽस्ति नः॥ १५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000044.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000045", "originalText": "स्यात्प्रवृत्तिरन्तरेणापि विधिं लोकवदिति चेत्तन्न।", "padacchedaText": "", "audioFile": "PB_hear2read_000045.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000046", "originalText": "यतः।", "padacchedaText": "", "audioFile": "PB_hear2read_000046.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000047", "originalText": "अन्तरेण विधिं मोहाद्यः कुर्यात्साम्परायिकम्। न तत्स्यादुपकाराय भस्मनीव हुतं हविः॥ १६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000047.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000048", "originalText": "अभ्युपगतप्रामाण्यवेदार्थविज्जैमिन्यनुशासनाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000048.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000049", "originalText": "᳚आम्नायस्य क्रियार्थत्वादानर्थक्यम् ᳚ इतोऽन्यथा। इति साटोपमाहोच्चैर्वेदविज्जैमिनिः स्वयम्॥ १७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000049.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000050", "originalText": "मन्त्रवर्णाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000050.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000051", "originalText": "᳚कुर्वन्नेवेह कर्माणि जिजीविषेच्छतं समाः ᳚। इति मन्त्रोऽपि निश्शेषं कर्मण्यायुरवासृजत्॥ १८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000051.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000052", "originalText": "ज्ञानिनश्च वस्तुनि वाक्यप्रामाण्याभ्युपगमाद्वाक्यस्य च\nक्रियापदप्रधानत्वात्ततश्चाभिप्रेतज्ञानाभावः।", "padacchedaText": "", "audioFile": "PB_hear2read_000052.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000053", "originalText": "विरहय्य क्रियां नैव संहन्यन्ते पदान्यपि। न समस्त्यपदं वाक्यं यत्स्याज्ज्ञानविधायकम्॥ १९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000053.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000054", "originalText": "ज्ञानाभ्युपगमेऽपि न दोषः।", "padacchedaText": "", "audioFile": "PB_hear2read_000054.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000055", "originalText": "यतः।", "padacchedaText": "", "audioFile": "PB_hear2read_000055.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000056", "originalText": "कर्मणोऽङ्गाङ्गिभावेन स्वप्रधानतयाऽथवा। सम्बन्धस्येह संसिद्धेर्ज्ञाने सत्यप्यदोषतः॥ २०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000056.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000057", "originalText": "यस्माज्ज्ञानाभ्युपगमानभ्युपगमेऽपि न ज्ञानान्मुक्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000057.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000058", "originalText": "अतः सर्वाश्रमाणां हि वाङ्मनःकायकर्मभिः। स्वनुष्ठितैर्यथाशक्ति मुक्तिः स्यान्नान्यसाधनात्॥ २१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000058.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000059", "originalText": "असदर्थप्रलापोऽयमिति दूषणसम्भावनायाह।", "padacchedaText": "", "audioFile": "PB_hear2read_000059.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000060", "originalText": "इति हृष्टधियां वाचः स्वप्रज्ञाऽऽध्मातचेतसाम्। घुष्यन्ते यज्ञशालासु धूमानद्धधियां किल॥ २२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000060.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000061", "originalText": "दूषणोपक्रमावधिज्ञापनायाह।", "padacchedaText": "", "audioFile": "PB_hear2read_000061.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000062", "originalText": "अत्राभिदध्महे दोषान् क्रमशो न्यायबृंहितैः। वचोभिः पूर्वपक्षोक्तिघातिभिर्नातिसम्भ्रमात्॥ २३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000062.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000063", "originalText": "चतुर्विधस्यापि कर्मकार्यस्य मुक्तावसम्भवान्न मुक्तेः\nकर्मकार्यत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000063.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000064", "originalText": "अज्ञानहानमात्रत्वान्मुक्तेः कर्म न साधनम्। कर्मापमार्ष्टि नाज्ञानं तमसीवोत्थितं तमः॥ २४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000064.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000065", "originalText": "कर्मकार्यत्वाभ्युपगमेऽपि दोष एव।", "padacchedaText": "", "audioFile": "PB_hear2read_000065.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000066", "originalText": "एकेन वा भवेन्मुक्तिर्यदि वा सर्वकर्मभिः। प्रत्येकं चेद्वृथान्यानि सर्वेभ्योऽप्येककर्मता॥ २५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000066.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000067", "originalText": "सर्वप्रकारस्यापि कर्मण उत्पत्तित एव विशिष्टसाध्याभि—\nसम्बन्धान्न परिशेष्यन्यायसिद्धिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000067.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000068", "originalText": "दुरितक्षपणार्थत्वान्न नित्यं स्याद्विमुक्तये। स्वर्गादिफलसम्बन्धात्काम्यं कर्म तथैव न॥ २६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000068.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000069", "originalText": "प्रमाणासम्भवाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000069.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000070", "originalText": "साध्यसाधनभावोऽयं वचनात्पारलौकिकः। नाश्रौषं मोक्षदं कर्म श्रुतेर्वक्त्रात्कथंचन॥ २७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000070.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000071", "originalText": "अभ्युपगताभ्युपगमाच्च श्वश्रूनिर्गच्छोक्तिवद्भवतो\nनिष्प्रयोजनः प्रलापः।", "padacchedaText": "", "audioFile": "PB_hear2read_000071.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000072", "originalText": "निषिद्धकाम्ययोस्त्यागस्त्वयापीष्टो यथा मया। नित्यस्याफलवत्त्वाच्च न मोक्षः कर्मसाधनः॥ २८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000072.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000073", "originalText": "एवं तावत् ᳚मुक्तेः क्रियाभिः सिद्धत्वात् ᳚ इति\nनिरस्तोऽयं\nपक्षः।", "padacchedaText": "", "audioFile": "PB_hear2read_000073.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000074", "originalText": "अथाधुना सर्वकर्मप्रवृत्तिहेतुनिरूपणेन\nयथावस्थितात्मवस्तुविषयकेवलज्ञानमात्रादेव\nसकलसंसारानर्थनिवृत्तिरितीमं पक्षं द्रढयितुकाम\nआह।", "padacchedaText": "", "audioFile": "PB_hear2read_000074.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000075", "originalText": "इह चेदं परीक्ष्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000075.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000076", "originalText": "किं यथा प्रतिषिद्धेषु\nयादृच्छिकेषु च कर्मसु\nस्वाभाविकस्वाशयोत्थनिमित्तवशादेवेदं\nहितमिदमहितमिति विशेषान् परिकल्प्य\nमृगतृष्णिकोदकपिपासुरिव\nलौकिकप्रमाणप्रसिद्धान्येव साधनान्युपादाय\nहितप्राप्तयेऽहितनिरासाय च स्वयमेव प्रवर्तते निवर्तते च\nतथैवादृष्टार्थेषु काम्येषु नित्येषु च कर्मसु किं\nवान्यदेव तत्र प्रवृत्तिनिवृत्तिनिमित्तमिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000076.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000077", "originalText": "किंचातः।", "padacchedaText": "", "audioFile": "PB_hear2read_000077.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000078", "originalText": "यद्येवं श्रुणु।", "padacchedaText": "", "audioFile": "PB_hear2read_000078.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000079", "originalText": "यदि तावद्यथावस्थितवस्तुसम्यग्ज्ञानं\nप्रमाणभूतं लौकिकमागमिकं वा प्रवृत्तिनिमित्तमिति\nनिश्चीयते निवृत्तिशास्त्रं च नाभ्युपगम्यते तदा\nहताः कर्मत्यागिनो भ्रान्तिविज्ञानमात्रावष्टम्भादलौकिक—\nप्रमाणोपात्तकर्मानुष्ठानत्यागित्वाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000079.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000080", "originalText": "अथ\nमृगतृष्णिकोदकपिपासुप्रवृत्तिनिमित्तवदयथावस्तुभ्रान्ति—\nविज्ञानमेव सर्वप्रवृत्तिनिमित्तं तदा वर्द्धामहे वयं\nहताः स्थ यूयमिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000080.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000081", "originalText": "हितं सम्प्रेप्सतां मोहादहितं च जिहासताम्। उपायान्प्राप्तिहनार्थान् शास्त्रं भासयतेऽर्कवत्॥ २९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000081.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000082", "originalText": "एवं तावत्प्रत्यक्षानुमानागमप्रमाणावष्टम्भादात्मनो\nनिरतिशयसुखहिताव्यतिरेकसिद्धेरहितस्य च\nषष्ठगोचरवत्स्वत एवानभिसम्बन्धादेवंस्वाभाव्या—\nत्मानवबोधमात्रादेव हितं मे स्यादहितं मे मा भूदिति\nमिथ्याज्ञानं तूषरशुक्तिकानवबोधोत्थमिथ्याज्ञानवत्—\nप्रवृत्तिनिमित्तमिति निर्धारितम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000082.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000083", "originalText": "शास्त्रं च न\nपदार्थशक्त्याधानकृदिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000083.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000084", "originalText": "अथैतस्यैवोत्तरत्र प्रपञ्च\nआरभ्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000084.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000085", "originalText": "न परीप्सां जिहासां वा पुंसः शास्त्रं करोति हि। निजे एव तु ते यस्मात्पश्वादावपि दर्शनात्॥ ३०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000085.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000086", "originalText": "उक्तं तावदनवबुद्धवस्तुयाथात्म्य एव\nविधिप्रतिषेशशास्त्रेष्वधिक्रियत इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000086.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000087", "originalText": "लिप्सतेऽज्ञानतोऽलब्धं कण्ठे चामीकरं यथा। वर्जितं च स्वतो भ्रान्त्या छायायामात्मनो यथा॥ ३१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000087.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000088", "originalText": "भयान्मोहावनद्धात्मा रक्षः परिजिहीर्षति। पच्चापरिहृतं वस्तु तथालब्धं च लिप्सते॥ ३२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000088.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000089", "originalText": "तत्रैतेषु चतुर्षु विषयेषु प्राप्तये परीहाराय\nच विभज्य न्यायः प्रदर्श्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000089.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000090", "originalText": "प्राप्तव्यपरिहार्येषु ज्ञात्वोपायाञ्छृतेः पृथक्। कृत्वाथ प्राप्नुयात्प्राप्यं तथानिष्टं जहात्यपि॥ ३३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000090.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000091", "originalText": "अथावशिष्टयोः स्वभावत एव।", "padacchedaText": "", "audioFile": "PB_hear2read_000091.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000092", "originalText": "परिहृतावाप्तयोर्बोधाद्धानप्राप्ती न कर्मणा। मोहमात्रान्तरायत्वात्क्रियया ते न सिध्यतः॥ ३४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000092.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000093", "originalText": "कस्मात्पुनरात्मवस्तुयाथात्म्यावबोधमात्रादेवाभिलषित—\nनिरतिशयसुखावाप्तिनिश्शेषदुःखनिवृत्ती भवतो न तु\nकर्मणेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000093.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000094", "originalText": "उच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000094.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000095", "originalText": "कर्माज्ञानसमुत्थत्वान्नालं मोहापनुत्तये। सम्यग्ज्ञानं विरोध्यस्य तामिस्रस्यांशुमानिव॥ ३५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000095.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000096", "originalText": "नन्वात्मज्ञानमप्यविद्योपादानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000096.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000097", "originalText": "न हि\nशास्त्रशिष्याचार्याद्यनुपादायात्मज्ञानमात्मानं\nलभतः इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000097.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000098", "originalText": "नैष दोषः।", "padacchedaText": "", "audioFile": "PB_hear2read_000098.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000099", "originalText": "यत आत्मज्ञानं हि\nस्वतस्सिद्धपरमार्थात्मवस्तुस्वरूपमात्राशयादेवाविद्यातदुत्\nपन्न\nकारकग्रामप्रध्वंसि स्वात्मोपतावेव शास्त्रादपेक्ष्यते\nनोत्पन्नमविद्यानिवृत्तौ।", "padacchedaText": "", "audioFile": "PB_hear2read_000099.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000100", "originalText": "कर्म पुनः स्वात्मोत्पत्तावुत्पन्नं\nच।", "padacchedaText": "", "audioFile": "PB_hear2read_000100.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000101", "originalText": "न हिक्रिया कारकनिस्स्पृहा कल्पकोटिव्यवहितफलदानाय\nस्वात्मानं बिभर्ति साध्यमानमात्ररूपत्वात्तस्याः।", "padacchedaText": "", "audioFile": "PB_hear2read_000101.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000102", "originalText": "न च\nक्रियात्मज्ञानवत्स्वात्मप्रतिलम्भकाल एव स्वर्गादिफलेन\nकर्तारं सम्बध्नाति।", "padacchedaText": "", "audioFile": "PB_hear2read_000102.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000103", "originalText": "आत्मज्ञानं पुनः पुरुषार्थसिद्धौ\nनोत्पद्यमानस्वरूपव्यतिरेकेणान्यद्रूपान्तरं साधनान्तरं\nवापेक्षते।", "padacchedaText": "", "audioFile": "PB_hear2read_000103.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000104", "originalText": "कुत एतत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000104.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000105", "originalText": "यतः।", "padacchedaText": "", "audioFile": "PB_hear2read_000105.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000106", "originalText": "बलवद्धि प्रमाणोत्थं सम्यग्ज्ञानं न बाध्यते। आकाङ्क्षते न चाप्यान्यद्बाधनं प्रति साधनम्॥ ३६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000106.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000107", "originalText": "स्वपक्षस्य हेत्ववष्टम्भेन समर्थितत्वानिराशङ्क—\nमुपसंह्रियते।", "padacchedaText": "", "audioFile": "PB_hear2read_000107.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000108", "originalText": "तस्माद्दुःखोदधेर्हेतोरज्ञानस्यापनुत्तये। सम्यग्ज्ञानं सुपर्याप्तं क्रिया चेन्नोक्तहेतुतः॥ ३७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000108.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000109", "originalText": "ननु बलवदपि सम्यग्ज्ञानं सदप्रमाणोत्थेन\nबाध्यमानमुपलभामहे यत उत्पन्नपरमार्थबोधस्यापि\nकर्तृत्वभोक्तृत्वरागद्वेषाद्यनवबोधोत्थप्रत्यया\nआविर्भवन्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000109.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000110", "originalText": "न ह्यबाधिते सम्यग्ज्ञाने तद्विरुद्धानां\nप्रत्ययानां सम्भवोऽस्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000110.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000111", "originalText": "नैतदेवम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000111.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000112", "originalText": "कुतः।", "padacchedaText": "", "audioFile": "PB_hear2read_000112.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000113", "originalText": "बाधितत्वादविद्याया विद्यां सा नैव बाधते। तद्वासना निमित्तत्वं यान्ति विद्यास्मृतेर्ध्रुवन्॥ ३८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000113.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000114", "originalText": "᳚कर्माज्ञानसमुत्थत्वात् ᳚ इत्युक्तो हेतुस्तस्य च\nसमर्थनं पूर्वमेवाभिहितं ᳚हितं सम्प्रेप्सताम् ᳚\nइत्यादिना।", "padacchedaText": "", "audioFile": "PB_hear2read_000114.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000115", "originalText": "तदभ्युच्चयार्थमविद्यान्वयेन च\nसंसारान्वयित्वं प्रदर्शयिष्यामीत्यत आह।", "padacchedaText": "", "audioFile": "PB_hear2read_000115.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000116", "originalText": "ब्राह्मण्याद्यात्मके देहे लात्वा नात्मेति भावनाम्। श्रुतेः किङ्करतामेति वाङ्मनःकायकर्मसु॥ ३९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000116.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000117", "originalText": "यस्मात्कर्माज्ञानसमुत्थमेव तस्मात्तद्व्यावृत्तौ निवर्तत\nइत्युच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000117.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000118", "originalText": "दग्धाखिलाधिकारश्चेद्ब्रह्मज्ञानाग्निना मुनिः। वर्तमानः श्रुतेर्मूर्ध्नि नैव स्याद्वेदकिङ्करः॥ ४०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000118.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000119", "originalText": "अथेतरो घनतराविद्या पटलसंवीतान्तःकरणोऽङ्गीकृत—\nकर्तृत्वाद्यशेषकर्माधिकारकारणो\nविधिप्रतिषेधचोदनासंदंशोपदष्टः\nकर्मसु प्रवर्तमानः।", "padacchedaText": "", "audioFile": "PB_hear2read_000119.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000120", "originalText": "शुभैः प्राप्नोति देवत्वं निषिद्धैर्नारकीं गतिम्। उभाभ्यां पुण्यपापाभ्यां मानुष्यं लभतेऽवशः॥ ४१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000120.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000121", "originalText": "आब्रह्मस्तम्बपर्यन्ते घोरे दुःखोदधौ\nघटीयन्त्रवदारोहावरोहन्यायेनाधममध्यमोत्तमसुखदुःख—\nमोहविद्युच्चपलसम्पातदायिनीर्विचित्रयोनीश्चण्डोत्पिञ्जल—\nकश्वसनवेगाभिहताम्भोधिमध्यवर्तिशुष्कालाबुवच्छुभा—\nशुभव्यामिश्रकर्मवायुसमीरितः।", "padacchedaText": "", "audioFile": "PB_hear2read_000121.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000122", "originalText": "एवं चङ्क्रम्यमाणोऽयमविद्याकामकर्मभिः। पाशितो जायते कामी म्रियते चासुखावृतः॥ ४२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000122.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000123", "originalText": "यथोक्तेऽर्थ आदरविधानाय प्रमाणोपन्यासः।", "padacchedaText": "", "audioFile": "PB_hear2read_000123.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000124", "originalText": "श्रुतिश्चेमं जगादार्थं कामस्य विनिवृत्तये। तन्मूला संसृतिर्यस्मात्तन्नाशोऽज्ञानहानतः॥ ४३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000124.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000125", "originalText": "का त्वसौ श्रुतिरिति चेत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000125.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000126", "originalText": "᳚यदा सर्वे प्रमुच्यन्त ᳚ ᳚इति नु ᳚ इति च\nवाजिनः। कामबन्धनमेवेदं व्यासोऽप्याह पदेपदे॥ ४४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000126.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000127", "originalText": "एष संसारपन्था व्याख्यातः।", "padacchedaText": "", "audioFile": "PB_hear2read_000127.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000128", "originalText": "अथेदानीं तद्व्यावृत्तये\nकर्माण्यारादुपकारकत्वेन यथा मोक्षहेतुतां प्रतिपद्यन्ते\nतथाभिधीयते।", "padacchedaText": "", "audioFile": "PB_hear2read_000128.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000129", "originalText": "तस्यैवं दुःखतप्तस्य कथंचित्पुण्यशीलनात्। नित्येहाक्षालितधियो वैराग्यं जायते हृदि॥ ४५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000129.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000130", "originalText": "कीदृग्वैराग्यमुत्पद्यत इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000130.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000131", "originalText": "उच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000131.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000132", "originalText": "नरकाद्भीर्यथास्याभूत्तथा काम्यफलादपि। यथार्थदर्शनात्तस्मान्नित्यं कर्म चिकीर्षति॥ ४६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000132.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000133", "originalText": "एवं नित्यनैमित्तिककर्मानुष्ठानेन।", "padacchedaText": "", "audioFile": "PB_hear2read_000133.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000134", "originalText": "शुध्यमानं तु तच्चित्तमीश्वरार्पितकर्मभिः। वैराग्यं ब्रह्मलोकादौ व्यनक्त्यथ सुनिर्मलम्॥ ४७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000134.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000135", "originalText": "यस्माद्रजस्तमोमलोपसंसृष्टमेव चित्तं\nकामबडिशेनाकृष्य विषयदुरन्तसूनास्थानेष निक्षिप्यते\nतस्मान्नित्यनैमित्तिककर्मानुष्ठानपरिमार्जनेनापविद्ध—\nरजस्तमोमलं प्रसन्नमनाकृलं संमार्जितस्फटिकशिलाकल्पं\nबाह्यविषयहेतुकेन च रागद्वेषात्मकेनातिग्रहबडिशेना—\nनाकृष्यमाणं विधूताशेषकल्मषं प्रत्यङ्मात्रप्रवणं\nचित्तदर्पणमवतिष्टते।", "padacchedaText": "", "audioFile": "PB_hear2read_000135.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000136", "originalText": "अत इदमभिधीयते।", "padacchedaText": "", "audioFile": "PB_hear2read_000136.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000137", "originalText": "व्युत्थिताशेषकामेभ्यो यदा धीरवतिष्ठते। तदैव प्रत्यगात्मानं स्वयमेवाविविक्षति॥ ४८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000137.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000138", "originalText": "अतःपरमवसिताधिकाराणि कर्माणि प्रत्यक्प्रवणवत्वसूनौ\nकृतसम्प्रत्तिकानि चरितार्थानि सन्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000138.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000139", "originalText": "प्रत्यक्प्रवणतां बुद्धेः कर्माण्युत्पाद्य शुद्धितः। कृतार्थान्यस्तमायान्ति प्रावृडन्ते घना इव॥ ४९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000139.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000140", "originalText": "यतो नित्यकर्मानुष्ठानस्यैष महिमा।", "padacchedaText": "", "audioFile": "PB_hear2read_000140.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000141", "originalText": "तस्मान्मुमुक्षुभिः कार्यमात्मज्ञानाभिलाषिभिः। नित्यं नैमित्तिकं कर्म सदैवात्मविशुद्धये॥ ५०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000141.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000142", "originalText": "यथोक्तेऽर्थे सर्वज्ञवचनं प्रमाणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000142.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000143", "originalText": "᳚आरुरुक्षोर्मुनेर्योगं कर्म कारणमुच्यते। योगारूढस्य तस्यैव शम᳚ एवेति च स्मृतिः॥ ५१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000143.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000144", "originalText": "नित्यकर्मानुष्ठानाद्धर्मोत्पत्तिर्धर्मोत्पत्तेः\nपापहानिस्ततश्चित्तशुद्धिस्ततः\nसंसारयाथात्म्यावबोधस्ततो वैराग्यं ततो मुमुक्षुत्वं\nततस्तदुपायपर्येषणं\nततः सर्वकर्मतत्साधनसंन्यासस्ततो\nयोगाभ्यासस्ततश्चित्तस्य प्रत्यक्प्रवणता\nततस्तत्त्वमस्यादिवाक्यार्थपरिज्ञानं\nततोऽविद्योच्छेदस्ततश्च स्वात्मन्ये—\nवावस्थानं ᳚ब्रह्मैव सन् ब्रह्माप्येति ᳚\n᳚विमुक्तश्च विमुच्यते ᳚ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000144.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000145", "originalText": "पारम्पर्येण कर्मैवं स्यादविद्यानिवृत्तये। ज्ञानवन्नाविरोधित्वात्कर्माविद्यां निरस्यति॥ ५२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000145.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000146", "originalText": "न च कर्मणः कार्यमण्वपि मुक्तौ सम्भाव्यते नापि मुक्तौ\nयत्सम्भवति तत्कर्मापेक्षते।", "padacchedaText": "", "audioFile": "PB_hear2read_000146.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000147", "originalText": "तदुच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000147.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000148", "originalText": "उत्पाद्यमाप्यं संस्कार्यं विकार्यं च क्रियाफलम्। नैवं मुक्तिर्यतस्तस्मात्कर्म तस्या न साधनम्॥ ५३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000148.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000149", "originalText": "एवं तावत्केवलं कर्म साक्षादविद्यापनुत्तये न\nपर्याप्तमिति प्रपञ्चितम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000149.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000150", "originalText": "मुक्तौ च मुमुक्षुज्ञानत—\nद्विषयस्वाभाव्यानुरोधेन सर्वप्रकारस्यापि कर्मणोऽसम्भव\nउक्तो ᳚हितं सम्प्रेप्सताम् ᳚ इत्यादिना।", "padacchedaText": "", "audioFile": "PB_hear2read_000150.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000151", "originalText": "यादृशश्चारादुपकारकत्वेन ज्ञानोत्पत्तौ कर्मणां\nसमुच्चयः सम्भवति तथा प्रतिपादितम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000151.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000152", "originalText": "अविद्योच्छित्तौ तु\nलब्धात्मस्वभावस्यात्मज्ञानस्यैवासाधारणं\nसाधकतमत्वं\nनान्यस्य प्रधानभूतस्य गुणभूतस्य चेत्येतदधुनोच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000152.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000153", "originalText": "तत्र ज्ञानं गुणभूतं तावदहेतुरित्येतदाह।", "padacchedaText": "", "audioFile": "PB_hear2read_000153.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000154", "originalText": "संनिपत्य न च ज्ञानं कर्माज्ञानं निरस्यति। साध्यसाधनभावत्वादेककालानवस्थितेः॥ ५४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000154.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000155", "originalText": "समप्रधानयोरप्यसम्भव एव।", "padacchedaText": "", "audioFile": "PB_hear2read_000155.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000156", "originalText": "बाध्यबाधकभावाच्च पञ्चास्योरणयोरिव। एकदेशानवस्थानान्न समुच्चयता तयोः॥ ५५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000156.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000157", "originalText": "कुतो बाध्यबाधकभावः।", "padacchedaText": "", "audioFile": "PB_hear2read_000157.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000158", "originalText": "यस्मात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000158.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000159", "originalText": "अयथावस्त्वविद्या स्याद्विद्या तस्या विरोधिनी। समुच्चयस्तयोरेवं रविशार्वरयोरिव॥ ५६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000159.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000160", "originalText": "तस्मादकारकब्रह्मात्मनि परिसमाप्तावबोधस्याशेषकर्म—\nचोदनानामचोद्यस्वाभाव्यात्कुण्ठता।", "padacchedaText": "", "audioFile": "PB_hear2read_000160.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000161", "originalText": "कथं तत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000161.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000162", "originalText": "अभिधीयते।", "padacchedaText": "", "audioFile": "PB_hear2read_000162.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000163", "originalText": "बृहस्पतिसवे यद्वत्क्षत्रियो न प्रवर्तते। ब्राह्मणत्वाद्यहंमानी विप्री वा क्षत्रकर्मणि॥ ५७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000163.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000164", "originalText": "यथायं दृष्टान्त एवं दार्ष्टान्तिकोऽपीत्येतदाह।", "padacchedaText": "", "audioFile": "PB_hear2read_000164.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000165", "originalText": "विदेहो वीतसन्देहो नेतिनेत्यवशेषितः। देहाद्यनात्मदृक्तद्वत्क्रियां वीक्षतेऽपि न॥ ५८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000165.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000166", "originalText": "तस्यार्थस्याविष्करणार्थमुदाहरणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000166.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000167", "originalText": "मृत्स्नेभके यथेभत्वं शिशुरध्यस्य वल्गति। अध्यस्यात्मानि देहादीन्मूढस्तद्वत्विचेष्टते॥ ५९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000167.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000168", "originalText": "न च वयं ज्ञानकर्मणोः सर्वत्रैव प्रत्याचक्ष्महे।", "padacchedaText": "", "audioFile": "PB_hear2read_000168.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000169", "originalText": "यत्र\nप्रयोज्यप्रयोजकभावो ज्ञानकर्मणोस्तत्र नास्मत्पित्रापि शक्यते\nनिवारयितुम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000169.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000170", "originalText": "तत्र विभागप्रदर्शनायोदाहरणं प्रदर्श्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000170.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000171", "originalText": "स्थाणुं चोरधियालाय भीतो यद्वत्पलायते। बुद्ध्यादिभिस्तथात्मानं भ्रान्तोऽध्यारीप्य चेष्टते॥ ६०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000171.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000172", "originalText": "एवं यत्रयत्र ज्ञानकर्मणोः प्रयोज्यप्रयोजकभावस्तत्र\nसर्वत्रायं न्यायः।", "padacchedaText": "", "audioFile": "PB_hear2read_000172.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000173", "originalText": "यत्र तु न समकालं नापि\nक्रमेणोपपद्यते\nसमुच्चयः सविषय उच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000173.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000174", "originalText": "स्थाणोः सतत्त्वविज्ञानं यथा नाङ्गं पलायते। आत्मनस्तत्त्वविज्ञानं तद्वन्नाङ्गं क्रियाविधौ॥ ६१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000174.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000175", "originalText": "यस्माद्गुणस्यैतत्स्वाभाव्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000175.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000176", "originalText": "यद्धि यस्यानुरोधेन स्वभावमनुवर्तते। तत्तस्य गुणभूतं स्यान्न प्रधानाद्गुणो यतः॥ ६२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000176.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000177", "originalText": "यस्मात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000177.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000178", "originalText": "कर्मप्रकरणाकाङ्क्षिज्ञानं कर्मगुणो भवेत्। यद्धि प्रकरणे यस्य तत्तदङ्गं प्रचक्षते॥ ६३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000178.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000179", "originalText": "स्वरूपलाभमात्रेण यत्त्वविद्यां निहन्ति नः। न तदङ्गं प्रधानं वा ज्ञानं स्यात्कर्मणः क्वचित्॥ ६४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000179.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000180", "originalText": "समुच्चयपक्षवादिनाप्यवश्यमेतदभ्युपगन्तव्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000180.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000181", "originalText": "यस्मात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000181.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000182", "originalText": "अज्ञानमनिराकुर्वज्ज्ञानमेव न सिध्यति। विपन्नकारकग्रामं ज्ञानं कर्म न ढौकते॥ ६५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000182.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000183", "originalText": "इदं चापरं कारणं ज्ञानकर्मणोः समुच्चयनिबर्हि।", "padacchedaText": "", "audioFile": "PB_hear2read_000183.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000184", "originalText": "हेतुस्वरूपकार्याणि प्रकाशतमसोरिव। विरोधीनि ततो नास्ति साङ्गत्यं ज्ञानकर्मणोः॥ ६६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000184.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000185", "originalText": "एवमुपसंहृते केचित्स्वसम्प्रदायबलावष्टम्भादाहुर्यदे—\nतद्वेदान्तवाक्यादहं ब्रह्मेति विज्ञानं समुत्पद्यते तन्नैव\nस्वोत्पत्तिमात्रेणाज्ञानं निरस्यति।", "padacchedaText": "", "audioFile": "PB_hear2read_000185.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000186", "originalText": "किं तर्हि।", "padacchedaText": "", "audioFile": "PB_hear2read_000186.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000187", "originalText": "अहन्यहनि\nद्राघीयसा कालेनोपासीनस्य सतो भावनोपचयान्निश्शेषम्\nअज्ञानमपगच्छति ᳚देवो भूत्वा देवानप्येति ᳚ इति\nश्रुतेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000187.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000188", "originalText": "अपरे तु ब्रुवते वेदान्तवाक्यजनितमहं ब्रह्मेति\nविज्ञानं संसर्गात्मकत्वादात्मवस्तुयाथात्म्यावगाह्येव न\nभवति।", "padacchedaText": "", "audioFile": "PB_hear2read_000188.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000189", "originalText": "किं तर्हि।", "padacchedaText": "", "audioFile": "PB_hear2read_000189.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000190", "originalText": "एतदेव गङ्गास्रोतोवत्सततमभ्यस्यतोऽन्यदेवावाक्यार्थात्मकं\nविज्ञानान्तरमुत्पद्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000190.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000191", "originalText": "अस्य पक्षद्वयस्य निवृत्तय\nइदमभिधीयते।", "padacchedaText": "", "audioFile": "PB_hear2read_000191.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000192", "originalText": "सकृत्प्रवृत्त्या मृद्नाति क्रियाकारकरूपभृत्। अज्ञानमागमज्ञानं साङ्गत्यं नास्त्यतोऽनयोः॥ ६७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000192.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000193", "originalText": "एवं तावदनानात्वे ब्रह्मणि ज्ञानकर्मणोः समुच्चयो\nनिराकृतः।", "padacchedaText": "", "audioFile": "PB_hear2read_000193.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000194", "originalText": "अथाधुना पक्षान्तराभ्युपगमेनापि\nप्रत्यवस्थाने पूर्ववदनाश्वासो यथा तथाभिधीयते।", "padacchedaText": "", "audioFile": "PB_hear2read_000194.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000195", "originalText": "अनुत्सारितनानात्वं ब्रह्म यस्यापि वादिनः। तन्मतेनापि दुस्साध्यो ज्ञानकर्मसमुच्चयः॥ ६८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000195.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000196", "originalText": "तस्य विभागोक्तिर्दूषणविभागप्रज्ञप्तये।", "padacchedaText": "", "audioFile": "PB_hear2read_000196.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000197", "originalText": "ब्रह्मात्मा वा भवेत्तस्य यदि वानात्मरूपकम्। आत्मानाप्तिर्भवेन्मोहादितरस्याप्यनात्मनः॥ ६९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000197.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000198", "originalText": "तत्र यदि तावद्वास्तवेनैव वृत्तेन ब्रह्म\nप्राप्तमात्मस्वाभाव्यात्केवलमासुरमोहापिधानमात्र—\nमेवानाप्तिनिमित्तं तस्मिन्पक्षे।", "padacchedaText": "", "audioFile": "PB_hear2read_000198.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000199", "originalText": "मोहापिधानभङ्गाय नैव कर्माणि कारणम्। ज्ञानेनैव फलावाप्तेस्तत्र कर्म निरर्थकम्॥ ७०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000199.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000200", "originalText": "अनात्मरूपके तु ब्रह्मणि न कर्म साधनभावं प्रतिपद्यते\nनापि ज्ञानं कर्मसमुच्चितमसमुच्चितं वा यस्मादन्यस्य\nस्वत एव साधकस्य ब्रह्मणोऽप्यन्यत्वं स्वत एव सिद्धम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000200.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000201", "originalText": "तत्रैवम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000201.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000202", "originalText": "अन्यस्यान्यात्मताप्राप्तौ न क्वचिद्धेतुसम्भवः। तस्मिन् सत्यपि नो नष्टः परात्मानं प्रपद्यते॥ ७१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000202.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000203", "originalText": "अपरस्मिंस्तु पक्षे विधिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000203.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000204", "originalText": "परमात्मानुकूलेन ज्ञानाभ्यासेन दुःखिनः। द्वैतिनोऽपि प्रमुच्येरन्न परात्मविरोधिना॥ ७२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000204.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000205", "originalText": "इतरस्मिंस्तु पक्षे विधेरेवानवकाशत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000205.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000206", "originalText": "कथम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000206.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000207", "originalText": "समस्तव्यस्तभूतस्य ब्रह्मण्येवावतिष्ठतः। ब्रूत कर्मणि को हेतुः सर्वानन्यत्वदर्शिनः॥ ७३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000207.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000208", "originalText": "सर्वकर्मनिमित्तसम्भवासम्भवाभ्यां सर्वकर्मसङ्करश्च\nप्राप्नोति।", "padacchedaText": "", "audioFile": "PB_hear2read_000208.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000209", "originalText": "यस्मात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000209.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000210", "originalText": "सर्वजात्यादिमत्त्वेऽस्य नितरां हेतसम्भवः। विशेषं ह्यनुपादाय कर्म नैव प्रवर्तते॥ ७४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000210.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000211", "originalText": "स्याद्विधिरध्यात्मभिमानादिति चेन्नैवम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000211.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000212", "originalText": "यस्मात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000212.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000213", "originalText": "न चाध्यात्माभिमानोऽपि विदुषोऽस्त्यासुरत्वतः। विदुषोऽप्यासुरश्चेत्स्यान्निष्फलं ब्रह्मदर्शनम्॥ ७५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000213.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000214", "originalText": "अज्ञानकार्यत्वान्न समकालं नापि क्रमेण\nज्ञानकर्मणोर्वस्त्ववस्तु—\nतन्त्रत्वात्सङ्गतिरस्तीत्येवं निराकृतोऽपि काशं कुशं\nवावलम्ब्याह॥", "padacchedaText": "", "audioFile": "PB_hear2read_000214.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000215", "originalText": "अथाध्यात्मं पुनर्यायादाश्रितो मूढतां भवेत्। स करोत्येव कर्माणि को ह्यज्ञं विनिवारयेत्॥ ७६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000215.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000216", "originalText": "सिद्धत्वाच्च न साध्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000216.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000217", "originalText": "यतः।", "padacchedaText": "", "audioFile": "PB_hear2read_000217.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000218", "originalText": "सामान्येतररूपाभ्यां कर्मात्मैवास्य योगिनः। निश्श्वासोच्छ्वासवत्तस्मान्न नियोगमपेक्षते।॥ ७७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000218.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000219", "originalText": "अस्तु तर्हि भिन्नाभिन्नात्मकं ब्रह्म।", "padacchedaText": "", "audioFile": "PB_hear2read_000219.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000220", "originalText": "तथा च सति\nज्ञानकर्मणो सम्भवतो भेदाभेदविषयत्वात्तयोः।", "padacchedaText": "", "audioFile": "PB_hear2read_000220.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000221", "originalText": "तत्र\nतावदयं पक्ष एव न सम्भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_000221.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000222", "originalText": "किं कारणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000222.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000223", "originalText": "न हि\nभिन्नोऽयमित्यभेदबुद्धिमनिराकृत्य भेदबुद्धिः\nपदार्थमालिङ्गते।", "padacchedaText": "", "audioFile": "PB_hear2read_000223.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000224", "originalText": "एवं ह्यनभ्युपगमे भिन्नाभिन्न—\nपदार्थयोरलौकिकत्वं प्रसज्येत।", "padacchedaText": "", "audioFile": "PB_hear2read_000224.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000225", "originalText": "अथ निष्प्रमाणकम—\nप्याश्रीयते तदप्युभयपक्षाभ्युपगमादभेदपक्षे दुःखि\nब्रह्म स्यादत आह।", "padacchedaText": "", "audioFile": "PB_hear2read_000225.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000226", "originalText": "भिन्नाभिन्नं विशेषैश्चेद्दुःखि स्याद्ब्रह्म ते ध्रुवम्। अशेषदुःखिता च स्यादहो प्रज्ञात्मवादिनाम्॥ ७८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000226.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000227", "originalText": "तस्मात्सम्यगेवाभिहितं न ज्ञानकर्मणोः समुच्चय\nइत्युपसंह्रियते।", "padacchedaText": "", "audioFile": "PB_hear2read_000227.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000228", "originalText": "तमोऽङ्गत्वं यथा भानोरग्नेश्शीताङ्गता यथा। वारिणश्चोष्णता यद्वज्ज्ञानस्यैवं क्रियाङ्गता॥ ७९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000228.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000229", "originalText": "यथोक्तोपपत्तिबलेनैव पूर्वपक्षस्योत्सारितत्वाद्वक्तव्यं\nनावशेषितमित्यतः प्रतिपत्तिकर्मवत्पूर्वपक्षपरिहाराय\nयत्किञ्चिद्वक्तव्यमित्यत इदमभिधीयते।", "padacchedaText": "", "audioFile": "PB_hear2read_000229.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000230", "originalText": "᳚मुक्तेः क्रियाभिः सिद्धत्वात् ᳚ इत्याद्यनुचितं बहु। यदभाणि तदन्याय्यं यथा तदधुनोच्यते॥ ८०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000230.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000231", "originalText": "योऽयं काम्यानां प्रतिषिद्धानां च त्यागः प्रतिज्ञायते\nसा प्रतिज्ञा तावन्न शक्यतेऽनुष्ठातुम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000231.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000232", "originalText": "किं कारणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000232.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000233", "originalText": "कर्मणो हि निर्वृत्तात्मनो द्वाभ्यां प्रकाराभ्यां निवृत्तिः\nसम्भवत्यारब्धफलस्योपभोगेनानारब्धफलस्याशुभस्य\nप्रायश्चित्तैरिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000233.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000234", "originalText": "तृतीयोऽपि त्यागप्रकारोऽकर्त्रा—\nत्मावबोधात् स त्वात्मज्ञानानभ्युपगमाद्भवता\nनाभ्युपगम्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000234.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000235", "originalText": "तत्र यान्यनुपभुक्तफलान्यनारब्धफलानि\nतानीश्वरेणापि केनचिदपि न शक्यन्ते परित्यक्तुम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000235.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000236", "originalText": "अथारब्धफलानि त्यज्यन्ते तान्यपि न शक्यन्ते त्यक्तुम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000236.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000237", "originalText": "किं कारणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000237.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000238", "originalText": "अनिवृत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000238.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000239", "originalText": "अनिर्वृत्तं हि चिकीर्षितं\nकर्म शक्यते त्यक्तुं प्रवृत्तिनिवृत्ती प्रति कर्तुः\nस्वातन्त्र्यात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000239.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000240", "originalText": "निर्वृत्ते तु कर्मणि तदसम्भवाद्दुरनुष्ठेयः\nप्रतिज्ञानार्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000240.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000241", "originalText": "अशक्यप्रतिज्ञानाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000241.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000242", "originalText": "न च शक्यते प्रतिज्ञातुं यावज्जीवं काम्यानि\nप्रतिषिद्धानि च कर्माणि न करिष्यामीति सुनिपुणानामपि\nसूक्ष्मापराधदर्शनात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000242.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000243", "originalText": "प्रमाणाभावाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000243.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000244", "originalText": "न च प्रमाणमस्ति मोक्षकामो नित्यनैमित्तिके कर्मणी\nकुर्यात्काम्यप्रतिषिद्धे च वर्जयेदारब्धफले चोपभोगेन\nक्षपयेदिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000244.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000245", "originalText": "आनन्त्याच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000245.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000246", "originalText": "न चोपचितानां\nकर्मणामियत्तास्ति संसारस्यानादित्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000246.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000247", "originalText": "न च काम्यैः\nप्रतिषिधैर्वा तेषां निवृत्तिरस्ति शुद्ध्यशुद्धिसाम्ये\nसत्यविरोधादित्याह।", "padacchedaText": "", "audioFile": "PB_hear2read_000247.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000248", "originalText": "न कृत्स्नकाम्यसंत्यागोऽनन्तत्वात्कर्तुमिष्यते। निषिद्धकर्मणश्चेत्तु व्यतीतानन्तजन्मसु॥ ८१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000248.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000249", "originalText": "स्यान्मतं व्यतीताननन्तजन्मोपात्तानां कर्मणाम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000249.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000250", "originalText": "क्षयो नित्येन तेषां चेत्प्रायश्चित्तैर्यथैनसः। निष्फलत्वान्न नित्येन काम्यादेर्विनिवारणाम्॥ ८२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000250.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000251", "originalText": "प्रमाणाभावाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000251.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000252", "originalText": "कथम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000252.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000253", "originalText": "पापापनुत्तये वाक्यात्प्रायश्चित्तं यथा तथा। गभ्यते काम्यहानार्थं नित्यं कर्म न वाक्यतः॥ ८३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000253.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000254", "originalText": "अथापि स्यात्काम्यैरेव काम्यानां पूर्वजन्मोपचितानां क्षयो\nभविष्यतीति।", "padacchedaText": "", "audioFile": "PB_hear2read_000254.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000255", "originalText": "तन्न।", "padacchedaText": "", "audioFile": "PB_hear2read_000255.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000256", "originalText": "यतः।", "padacchedaText": "", "audioFile": "PB_hear2read_000256.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000257", "originalText": "पाप्मनां पाप्मभिर्नास्ति यथैवेह निराक्रिया। काम्यैरपि तथैवास्तु काम्यानामविरोधतः॥ ८४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000257.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000258", "originalText": "एवं तावत् ᳚मुक्तेः क्रियाभिः सिद्धत्वात् ᳚ इति\nनिराकृतम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_000258.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000259", "originalText": "अथात्मज्ञानस्य सद्भावे प्रमाणासम्भव\nउक्तस्तत्परिहारायाह।", "padacchedaText": "", "audioFile": "PB_hear2read_000259.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000260", "originalText": "श्रुतयस्स्मृतिभिस्सामानन्त्यात्कामिनामिह। विदधत्युरुयत्नेन कर्मातो बहुकामदम्॥ ८५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000260.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000261", "originalText": "न च बाहुल्यं प्रामाण्ये कारणभावं प्रतिपद्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000261.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000262", "originalText": "अत आह।", "padacchedaText": "", "audioFile": "PB_hear2read_000262.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000263", "originalText": "प्रामाण्याय न बाहुल्यं न ह्येकत्र प्रमाणताम्। वस्तुन्यटन्ति मानानि त्वेकत्रैकस्य मानता॥ ८६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000263.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000264", "originalText": "यत्तूक्तं ᳚यत्नतो वीक्षमाणोऽपि ᳚ इति—— तत्रापि\nभवत एवापराधः।", "padacchedaText": "", "audioFile": "PB_hear2read_000264.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000265", "originalText": "कस्मात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000265.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000266", "originalText": "यतः।", "padacchedaText": "", "audioFile": "PB_hear2read_000266.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000267", "originalText": "᳚परीक्ष्य लोकान् ᳚ इत्याद्या आत्मज्ञानविधायिनीः। नैष्कर्म्यप्रवणास्साध्वीः श्रुतीः किं न श‍ृणोषि ताः॥ ८७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000267.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000268", "originalText": "ननु ᳚ आत्मेत्येवोपासीत ᳚ ᳚आत्मा वा अरे\nद्रष्टव्यः᳚ इत्यपूर्वविधिश्रुतेः\nपुरुषस्यात्मदर्शनक्रियायां नियोगोऽवसीयत इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000268.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000269", "originalText": "नैवम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000269.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000270", "originalText": "अपुरुषतन्त्रत्वाद्वस्तुयाथात्म्यज्ञानस्य\nसकलानर्थबीजात्मानवबोधोत्सारिणो मुक्तिहेतोरिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000270.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000271", "originalText": "विध्यभ्युपगमेऽपि नापूर्वविधिरयम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000271.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000272", "originalText": "अत आह।", "padacchedaText": "", "audioFile": "PB_hear2read_000272.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000273", "originalText": "नियमः परिसंख्या वा विध्यर्थोऽपि भवेद्यतः। अनात्मादर्शनेनैव परात्मानमुपास्महे॥ ८८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000273.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000274", "originalText": "यच्चोक्तं ᳚विश्वासो नान्यतोऽस्ति नः᳚ इति—— तदपि\nनिद्रातुरचेतसा त्वया स्वप्नायमानेन प्रलपितम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000274.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000275", "originalText": "किं\nकारणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000275.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000276", "originalText": "न हि वयं प्रमाणबलेनैकात्म्यं प्रतिपद्यामह\nऐकात्म्यस्य स्वत एवानुभवमात्रात्मकत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000276.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000277", "originalText": "अत एव\nसर्वप्रमाणावतारासम्भवं वक्ष्यति।", "padacchedaText": "", "audioFile": "PB_hear2read_000277.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000278", "originalText": "प्रमाणव्यवस्थायाश्चनुभवमात्राश्रयत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000278.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000279", "originalText": "अत आह।", "padacchedaText": "", "audioFile": "PB_hear2read_000279.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000280", "originalText": "वाक्यैकगम्यं यद्वस्तु नान्यस्मात्तत्र विश्वसेत्। नाऽप्रमेये स्वतस्सिद्धेऽविश्वासः कथमात्मनि॥ ८९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000280.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000281", "originalText": "यदप्युक्तं ᳚अन्तरेण विधिम् ᳚ इति——\nतदप्यबुद्धिपूर्वकमिव नः प्रतिभाति।", "padacchedaText": "", "audioFile": "PB_hear2read_000281.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000282", "originalText": "यस्मात्कालान्तरफलदायिषु कर्मस्वेतद्घटते।", "padacchedaText": "", "audioFile": "PB_hear2read_000282.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000283", "originalText": "आत्मलाभकाल एव फलदायिनि त्वात्मज्ञाने\nनैतत्समञ्जसमित्याह।", "padacchedaText": "", "audioFile": "PB_hear2read_000283.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000284", "originalText": "ज्ञानात्फले ह्यवाप्तेऽस्मिन्प्रत्यक्षे भवघातिनि। उपकाराय तन्नेति न न्याय्यं भाति नो वचः॥ ९०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000284.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000285", "originalText": "यदपि जैमिनीयं वचनमुद्घाटयसि—— तदपि\nतद्विवक्षापरिज्ञानादेवोद्भाव्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000285.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000286", "originalText": "किं कारणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000286.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000287", "originalText": "यतो न\nजैमिनेरयमभिप्राय आम्नायः।", "padacchedaText": "", "audioFile": "PB_hear2read_000287.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000288", "originalText": "सर्व एव क्रियार्थ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000288.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000289", "originalText": "यदि ह्ययमभिप्रायोऽभविष्यत् ᳚ अथातो ब्रह्मजिज्ञासा।", "padacchedaText": "", "audioFile": "PB_hear2read_000289.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000290", "originalText": "जन्माद्यस्य यतः ᳚\nइत्येवमादिब्रह्मवस्तुस्वरूपमात्रयाथात्म्यप्रकाशनपरं\nगम्भीरन्यायसंदृब्धं सर्ववेदान्तार्थमीमांसनं\nश्रीमच्छारीरकं नासूत्रयिष्यत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000290.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000291", "originalText": "असूत्रयच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000291.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000292", "originalText": "तस्माज्जैमिनेरेवायमभिप्रायो यथैव विधिवाक्यानां\nस्वार्थमात्रे प्रामाण्यमेवमैकात्म्यवाक्यानामप्यनधिगत—\nवस्तुपरिच्छेदसाम्यादिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000292.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000293", "originalText": "अत इदमभिधीयते।", "padacchedaText": "", "audioFile": "PB_hear2read_000293.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000294", "originalText": "अधिचोदनं य आम्नायस्तस्यैव स्यात्क्रियार्थता। तत्त्वमस्यादिवाक्यानां ब्रूत कर्मार्थता कथम्॥ ९१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000294.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000295", "originalText": "अपि च।", "padacchedaText": "", "audioFile": "PB_hear2read_000295.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000296", "originalText": "ऐकात्म्यपक्ष इवादृष्टार्थकर्मसु भवत्पक्षेऽपि\nप्रवृत्तिर्दुर्लक्ष्या।", "padacchedaText": "", "audioFile": "PB_hear2read_000296.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000297", "originalText": "यतः।", "padacchedaText": "", "audioFile": "PB_hear2read_000297.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000298", "originalText": "स्वर्गं यियासुर्जुहुयादग्निहोत्रं यथाविधि। देहाद्व्युत्थापितस्यैवं कर्तृत्वं जैमिनेः कथम्॥ ९२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000298.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000299", "originalText": "न च प्रत्याख्याताशेषशरीरादिकर्मसाधनस्वभाव—\nस्यात्ममात्रस्य कर्मस्वधिकारः।", "padacchedaText": "", "audioFile": "PB_hear2read_000299.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000300", "originalText": "यस्मात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000300.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000301", "originalText": "सर्वप्रमाणासम्भाव्यो ह्यहंवृत्त्यैकसाधनः। युष्मदर्थमनादित्सुर्जैमिनिः प्रेर्यते कथम्॥ ९३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000301.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000302", "originalText": "प्रवृत्तिकारणाभावाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000302.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000303", "originalText": "यस्मात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000303.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000304", "originalText": "सुखदुःखादिभिर्योग आत्मनो नाहमेक्ष्यते। पराक्त्वात्प्रत्यगात्मत्वाज्जैमिनिः प्रेर्यते कथम्॥ ९४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000304.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000305", "originalText": "किंच।", "padacchedaText": "", "audioFile": "PB_hear2read_000305.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000306", "originalText": "न तावद्योग एवास्ति शरीरेणात्मनः सदा। विषयैर्दूरतो नास्ति स्वर्गादौ स्यात्कथं सुखम्॥ ९५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000306.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000307", "originalText": "यस्मादन्यथा नोपपद्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000307.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000308", "originalText": "नराभिमानिनं तस्मात्कारकाद्यात्मदर्शिनम्। मन्त्र आहोररीकृत्य ᳚कुर्वन्᳚ इति न निर्द्वयम्॥ ९६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000308.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000309", "originalText": "यच्चोक्तं ᳚विरहय्य ᳚ इति तदपि न सम्यगेव।", "padacchedaText": "", "audioFile": "PB_hear2read_000309.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000310", "originalText": "तथापि\nतु न या काचित्क्रिया यत्र क्व चाध्याहरणीया किं तु या\nयत्राभिप्रेतसम्बन्धं घटयितुं शक्नोत्याकाङ्क्षां च\nवाक्यस्य पूरयति सैवाध्याहरणीया।", "padacchedaText": "", "audioFile": "PB_hear2read_000310.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000311", "originalText": "एवंविशिष्टा च\nक्रियास्माभिरभ्युपगतैव।", "padacchedaText": "", "audioFile": "PB_hear2read_000311.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000312", "originalText": "सा तूपादित्सितवाक्यार्था—\nविरोधिन्येव नाभूतार्थप्रादुर्भावफलेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000312.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000313", "originalText": "षड्भावविकाररहितात्मवस्तुनो निर्धूताशेष—\nद्वैतानर्थस्यापराधीनप्रकाशस्य\nविजिज्ञापयिषितत्वादस्यस्मीत्यादिक्रियापदं\nस्वमहिमसिद्धार्थप्रतिपादनसमर्थमभ्युपगन्तव्यं न\nविपरीतार्थप्रतिपादनपरमिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000313.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000314", "originalText": "धावेदिति न दानार्थे पदं यद्वत्प्रयुज्यते। एधीत्यादि तथा नेच्छेत्स्वतः सिद्धार्थवाचिनि॥ ९७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000314.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000315", "originalText": "न च यथोक्तवस्तुवृत्तप्रतिपादनव्यतिरेकेण\nतत्त्वमस्यादिवाक्यं वाक्यार्थान्तरं वक्तीति\nशक्यमध्यवसातुमित्याह।", "padacchedaText": "", "audioFile": "PB_hear2read_000315.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000316", "originalText": "तत्त्वमस्यादिवाक्यानां स्वतस्सिद्धार्थबोधनात्। अर्थान्तरं न संद्रष्टुं शक्यते त्रिदशैरपि॥ ९८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000316.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000317", "originalText": "यस्मादेवम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000317.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000318", "originalText": "अतः सर्वाश्रमाणां तु वाङ्मनःकायकर्मभिः। स्वनुष्ठितैर्न मुक्तिः स्याज्ज्ञानादेव हि सा यतः॥ ९९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000318.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000319", "originalText": "तस्माच्च कारणादेतदप्युपपन्नम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000319.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000320", "originalText": "स्वमनोरथसंक्लृप्तप्रज्ञाध्मातधियामतः। श्रोत्रियेष्वेव वाचस्ताः शोभन्ते नात्मवेदिषु॥", "padacchedaText": "", "audioFile": "PB_hear2read_000320.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000321", "originalText": "१००। इति प्रथमोऽध्यायः॥ १॥", "padacchedaText": "", "audioFile": "PB_hear2read_000321.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000322", "originalText": "अथ द्वितीयोऽध्यायः।", "padacchedaText": "", "audioFile": "PB_hear2read_000322.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000323", "originalText": "प्रत्यक्षादीनामनेवंविषयत्वात्तेषां स्वारम्भक—\nविषयोपनिपातित्वादात्मनश्चाशेषप्रमेयवैलक्षण्या—\nत्सर्वानर्थैकहेत्वज्ञानापनोदिज्ञानदिवाकरोदयहेतुत्वं\nवस्तुमात्रयाथात्म्यप्रकाशनपटीयसस्तत्त्वमस्यादेर्वचस\nएवेति बह्वीभिरुपपत्तिभिः प्रदर्शितम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000323.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000324", "originalText": "अतस्तदर्थारतिपत्तौ यत्कारणं तदपनयनाय\nद्वितीयोऽध्याय आरभ्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000324.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000325", "originalText": "श्रावितो वेत्ति वाक्यार्थं नचेत्तत्त्वमसीत्यतः। त्वम्पदार्थानभिज्ञत्वादतस्तत्प्रक्रियोच्यते॥ १॥", "padacchedaText": "", "audioFile": "PB_hear2read_000325.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000326", "originalText": "योऽयमहम्ब्रह्मेति वाक्यार्थस्तत्प्रतिपत्तिर्वाक्यादेवेति\nप्रत्यक्षादीनामनेवंविषयत्वादित्यवादिषं तस्य\nविशुद्ध्यर्थमनैकात्त्रिकत्वं पूर्वपक्षत्वेनोपस्थाप्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000326.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000327", "originalText": "कृत्स्नानात्मनिवृत्तौ च कश्चिदाप्नोति निर्वृतिम्। श्रुतवाक्यस्मृतेश्चान्यः स्मार्यते च वचोऽपरः॥ २॥", "padacchedaText": "", "audioFile": "PB_hear2read_000327.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000328", "originalText": "एतत्प्रसङ्गेन श्रोत्रन्तरोपन्यासमुभयत्रापि सम्भावनायाह।", "padacchedaText": "", "audioFile": "PB_hear2read_000328.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000329", "originalText": "वाक्यश्रवणमात्राच्च पिशाचकवदाप्नुयात्। त्रिषु यादृच्छिकी सिद्धिः स्मार्यमाणे तु निश्चिता॥ ३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000329.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000330", "originalText": "नायमनैकान्तिको हेतुः।", "padacchedaText": "", "audioFile": "PB_hear2read_000330.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000331", "originalText": "यतः।", "padacchedaText": "", "audioFile": "PB_hear2read_000331.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000332", "originalText": "सर्वोऽयं महिमा ज्ञेयो वाक्यस्यैव यथोदितः। वाक्यार्थं न ह्यृते वाक्यात्कश्चिज्जानाति तत्त्वतः॥ ४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000332.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000333", "originalText": "वाक्यं च प्रतिपादनाय प्रवृत्तं सत्प्रतिपादयत्येव\nसर्वप्रमाणानामप्येवंवृत्तत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000333.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000334", "originalText": "नाहंग्राह्ये न तद्धीने न प्रत्यङ्नापि दुःखिनि। विरोधः सदसीत्यस्माद्वाक्याभिज्ञस्य जायते॥ ५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000334.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000335", "originalText": "नाविरक्तस्य संसारान्निविवृत्सा ततो भवेत्। न चानिवृत्ततृष्णस्य पुरुषस्य मुमुक्षुता॥ ६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000335.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000336", "originalText": "न चामुमुक्षोरस्तीह गुरुपादोपसर्पणम्। न विना गुरुसम्बन्धं वाक्यस्य श्रवणं भवेत्॥ ७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000336.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000337", "originalText": "तथा पदपदाथौ च न स्तो वाक्यमृते क्वचित्। अन्वयव्यतिरेकौ च तावृते स्तां कैमाश्रयौ॥ ८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000337.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000338", "originalText": "अन्वयव्यतिरेकाभ्यां विना वाक्यार्थबोधनम्। न स्यात्तेन विनाज्ञानप्रहाणं नोपपद्यते॥ ९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000338.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000339", "originalText": "विनाज्ञानप्रहाणेन पुरुषार्थः सुदुर्लभः। तस्माद्यथोक्तसिद्ध्यर्थं परो ग्रन्थोऽवतार्यते॥ १०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000339.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000340", "originalText": "वर्चस्कं त्वन्नकार्यत्वाद्यथा नात्मेति गम्यते। तद्भागः सेन्द्रियो देहस्तद्वत्किमिति नेक्ष्यते॥ ११॥", "padacchedaText": "", "audioFile": "PB_hear2read_000340.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000341", "originalText": "आद्यन्तयोरनात्मत्वे प्रसिद्धे मध्येऽपि कः प्रतिबन्धः।", "padacchedaText": "", "audioFile": "PB_hear2read_000341.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000342", "originalText": "प्रागनात्मैव जग्धं सदात्मतामेत्यविद्यया। स्रगालेपनवद्देहं तस्मात्पश्येद्विविक्तधीः॥ १२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000342.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000343", "originalText": "अथैवमपि मद्वचनं नाद्रियसे स्वयमेवैतस्माच्छरीराद्—\nअशुचिराशेर्निराशो भविष्यसि।", "padacchedaText": "", "audioFile": "PB_hear2read_000343.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000344", "originalText": "मन्यसे तावदस्मीति यावदस्मान्न नीयसे। श्वभिः क्रोडीकृते देहे नैवं त्वमभिमंस्यसे॥ १३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000344.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000345", "originalText": "शिर आक्रम्य पादेन भर्त्सयत्यपरान् शुनः। दृष्ट्वा साधारणं देहं कस्मात्सक्तोऽसि तत्र भोः॥ १४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000345.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000346", "originalText": "श्रुतिपरिप्रापितोऽयमर्थोऽनात्मा बुद्ध्यादिदेहान्त इतीदमाह।", "padacchedaText": "", "audioFile": "PB_hear2read_000346.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000347", "originalText": "बुसव्रीहिपलालांशैर्बीजमेकं त्रिधा यथा। बुद्धिमांसपुरीषांशैरन्नं तद्वदवस्थितम्॥ १५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000347.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000348", "originalText": "यथोक्तार्थप्रतिपत्तौ सत्यां न रागद्वेषाभ्यां विक्रियते\nविपश्चिदित्यस्यार्थस्य प्रतिपत्तये दृष्टान्तः।", "padacchedaText": "", "audioFile": "PB_hear2read_000348.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000349", "originalText": "वर्चस्के सम्परित्यक्ते दोषतश्चावधारिते। यदि दोषं वदेत्तस्मै किं तत्रोच्चरितुर्भवेत्॥ १६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000349.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000350", "originalText": "तद्वत्सूक्ष्मे तथा स्थूले देहे त्यक्ते विवेकतः। यदि दोषं वदेत्ताभ्यां किं तत्र विदुषो भवेत्॥ १७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000350.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000351", "originalText": "एतावदेव ह्यहं ब्रह्मास्मीति वाक्यार्थाप्रतिपत्तौ कारणं\nयदुत बुद्ध्यादौ देहान्ते ह्यहंममेति निस्सन्धिबन्धनो ग्रहः।", "padacchedaText": "", "audioFile": "PB_hear2read_000351.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000352", "originalText": "तद्व्यतिरेके हि न कुतश्चिद्विभज्यत एकल एव प्रत्यगात्म—\nन्यवतिष्ठत इत्याह।", "padacchedaText": "", "audioFile": "PB_hear2read_000352.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000353", "originalText": "रिपौ बन्धौ स्वदेहे च समैकात्म्यं प्रपश्यतः। विवेकिनः कुतः कोपः स्वदेहावयवेश्विव॥ १८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000353.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000354", "originalText": "इतश्चानात्मा देहादिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000354.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000355", "originalText": "घटादिवच्च दृश्यत्वात्तैरेव करणैर्दृशेः। स्वप्ने चानन्वयाज्ज्ञयो देहोऽनात्मेति सूरिभिः॥ १९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000355.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000356", "originalText": "देहादिकार्यकरणसंघातव्यतिरेकाव्यतिरेकदर्शिनः\nप्रत्यक्षत एव विरुद्धं कार्यमुपलभ्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000356.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000357", "originalText": "चतुर्भिरुह्यते यत्तत्सर्वशक्त्या शरीरकम्। तूलायते तदेवाहंधियाघ्रातमचेतसाम्॥ २०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000357.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000358", "originalText": "प्रसिद्धत्वाप्रकरणार्थोपसंहारायाह।", "padacchedaText": "", "audioFile": "PB_hear2read_000358.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000359", "originalText": "स्थूलं युक्त्या निरस्यैवं नभसो नीलतामिव। देहं सूक्ष्मं निराकुर्यादतो युक्तिभिरात्मनः॥ २१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000359.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000360", "originalText": "कथं देहं सूक्ष्मं निराकृर्यादिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000360.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000361", "originalText": "उच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000361.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000362", "originalText": "अहंममत्वयत्नेच्छा नात्मधर्माः कृशत्ववत्। कर्मत्वेनोपलभ्यत्वादपायित्वाच्च वस्त्रवत्॥ २२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000362.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000363", "originalText": "वैधर्म्ये दृष्टान्तः।", "padacchedaText": "", "audioFile": "PB_hear2read_000363.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000364", "originalText": "नोष्णिमानं दहत्यग्निः स्वरूपत्वाद्यथा ज्वलन्। तथैवात्मात्मनो विद्यादहं नैवाविशेषतः॥ २३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000364.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000365", "originalText": "एकस्यात्मनः कर्मकर्तृभावः सर्वथा नोपपद्यत इति श्रुत्वा\nमीमांसकः प्रत्यवतिष्ठते।", "padacchedaText": "", "audioFile": "PB_hear2read_000365.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000366", "originalText": "अहम्प्रत्ययग्राह्यत्वाद्ग्राहक\nआत्मेति तन्निवृत्त्यर्थमाह।", "padacchedaText": "", "audioFile": "PB_hear2read_000366.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000367", "originalText": "यत्कर्मको हि यो भावो नासौ तत्कर्तृको यतः। घटप्रत्ययवत्तस्मान्नाहं स्याद्द्रष्टृकर्मकः॥ २४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000367.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000368", "originalText": "अत्राह प्रत्यक्षेणात्मनः कर्मकर्तृत्वाभ्युपगमे\nतत्पादोपजीविनानुमानेन प्रत्यक्षोत्सारणमयुक्तमिति\nचोद्यं तन्निराकरणाय प्रत्यक्षोपन्यासः।", "padacchedaText": "", "audioFile": "PB_hear2read_000368.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000369", "originalText": "यत्र यो दृश्यते द्रष्ट्रा तस्यैवासौ गुणो न तु। द्रष्टृस्थं दृश्यतां यस्मान्नैवेयाद्द्रष्टृबोधवत्॥ २५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000369.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000370", "originalText": "प्रत्यक्षेणैव भवदभिमतस्य प्रत्यक्षस्याभासीकृतत्वात्—\nसुस्थमेवानुमानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000370.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000371", "originalText": "अतस्तदेव प्रक्रियते तत्र च\nविकल्पदूषणाभिधानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000371.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000372", "originalText": "नात्मना न तदंशेन गुणः स्वस्थोऽवगम्यते। अभिन्नत्वात्समत्वाच्च निरंशत्वादकर्मतः॥ २६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000372.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000373", "originalText": "न युगपन्नपि क्रमेणोभयथा चैकस्य धर्मिणो\nग्राह्यग्राहकत्वमुपपद्यत इति प्रतिपादनायाह।", "padacchedaText": "", "audioFile": "PB_hear2read_000373.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000374", "originalText": "द्रष्टृत्वेनोपयुक्तत्वात्तदैव स्यान्न दृश्यता। कालान्तरे चेद्दृश्यत्वं न ह्यद्रष्टृकमिष्यते॥ २७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000374.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000375", "originalText": "सन्तु काममनात्मधर्मा ममत्वादयो\nयथोक्तन्यायबलादनात्मतयैव\nच तेषु व्यवहारादहंरूपस्य तु प्रत्यगात्मसम्बन्धितयैव\nप्रसिद्धेरहम्ब्रह्मास्मीति श्रुतेश्चानात्मधर्मत्वमयुक्तमिति\nचेत्तन्न।", "padacchedaText": "", "audioFile": "PB_hear2read_000375.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000376", "originalText": "अहन्धर्मस्त्वभिन्नश्चेदहम्ब्रह्मेति वाक्यतः। गौरोऽहमित्यनैकान्तो वाक्यं तद्व्यपनेतृ तत्॥ २८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000376.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000377", "originalText": "कथं वाक्यं तद्व्यपनेतृ तदिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000377.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000378", "originalText": "उच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000378.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000379", "originalText": "योऽयं स्थाणुः पुमानेष पुन्धिया स्थाणुधीरिव। ब्रह्मास्मीतिधियाशेषा ह्यहम्बुद्धिर्निवर्त्यते॥ २९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000379.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000380", "originalText": "अहम्परिच्छेदव्यावृत्तौ न किंचिदव्यावृत्तं\nद्वैतजातमवशिष्यते\nद्वितीयसम्बन्धस्य तन्मूलत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000380.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000381", "originalText": "अत आह।", "padacchedaText": "", "audioFile": "PB_hear2read_000381.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000382", "originalText": "निवृत्तायामहम्बुद्धौ ममधीः प्रविलीयते। अहम्बीजा हि सा सिद्ध्येत्तमोऽभावे कुतः फणी॥ ३०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000382.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000383", "originalText": "विवक्षितदृष्टान्तांशज्ञापनाय दृष्टान्तव्याख्या।", "padacchedaText": "", "audioFile": "PB_hear2read_000383.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000384", "originalText": "तमोऽभिभूतचित्तो हि रज्ज्वां पश्यति रोषणम्। भ्रान्त्या भ्रान्त्या विना तस्मान्नोरगं स्रजि वीक्षते॥ ३१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000384.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000385", "originalText": "अनन्वयाच्च नात्मधर्मोऽहङ्कारः।", "padacchedaText": "", "audioFile": "PB_hear2read_000385.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000386", "originalText": "आत्मनश्चेदहन्धर्मो यायान्मुक्तिसुषुप्तयोः। यतो नान्वेति तेनायमन्यदीयो भवेदहम्॥ ३२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000386.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000387", "originalText": "आत्मधर्मत्वाभ्युपगमेऽपरिहार्यदोषप्रसक्तिश्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000387.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000388", "originalText": "यद्यात्मधर्मोऽहङ्कारो नित्यत्वं तस्य बोधवत्। नित्यत्वे मोक्षशास्त्राणां वैयर्थं प्राप्नुयाद्ध्रुवम्॥ ३३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000388.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000389", "originalText": "स्यात्परिहारः\nस्वाभाविकधर्मत्वाभ्युपगमेऽप्याम्रादिफलवदिति\nचेत्तन्न।", "padacchedaText": "", "audioFile": "PB_hear2read_000389.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000390", "originalText": "आम्रादेः परिणामित्वाद्गुणहानिर्गुणान्तरैः। अविकारि तु तद्ब्रह्म ᳚न हि द्रष्टुरि᳚तिश्रुतेः॥ ३४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000390.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000391", "originalText": "अहङ्कारस्य चागमापायित्वात्तद्धर्मिणश्चानित्यत्वं\nप्राप्नोति।", "padacchedaText": "", "audioFile": "PB_hear2read_000391.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000392", "originalText": "आगमापायिनिष्ठत्वादनित्यत्वमियाद्दृशिः। उपयन्नपयन्धर्मो विकरोति हि धर्मिणम्॥ ३५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000392.mp3", "zipFile": "Naishkarmyasiddhi.zip"}, {"id": "B_000393", "originalText": "अस्त्वनित्यत्वं कमुपालभेमहि प्रमाणोपपन्नत्वादिति चेत्तन्न।", "padacchedaText": "", "audioFile": "PB_hear2rea
