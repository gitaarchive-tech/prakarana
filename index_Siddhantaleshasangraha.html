adacchedaText": "", "audioFile": "PB_hear2read_001500.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001501", "originalText": "नित्यसिद्धमोक्षमुद्दिश्य साधनानुष्ठाने प्रवृत्त्युपपादनम्\nनन्वनवच्छिन्नानन्दः प्रत्यग्रूपतया नित्यमेव प्राप्तः।", "padacchedaText": "", "audioFile": "PB_hear2read_001501.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001502", "originalText": "सत्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001502.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001503", "originalText": "नित्यप्राप्तोऽपि अनवच्छिन्नानन्दः तमावृत्य तद्विपरीतमनर्थं प्रदर्शयन्त्या अविद्यया संसारदशायामसत्कल्पत्वं नीत इति अकृतार्थताऽभूत्।", "padacchedaText": "", "audioFile": "PB_hear2read_001503.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001504", "originalText": "निवर्तितायां च तस्यां निरस्ते निखिलानर्थविक्षेपे स्वकण्ठगतविस्मृतकनकाभरणवत् प्राप्यत इवेति औपचरिकी तस्य प्राप्तव्यतेति केचित्।", "padacchedaText": "", "audioFile": "PB_hear2read_001504.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001505", "originalText": "अन्ये तु— संसारदशयां ‘नास्ति, न प्रकाशते’ इति व्यवहारयोग्यत्वरूपाज्ञानावरणप्रयुक्तस्य ‘मम निरतिशयानन्दो नास्ति’ इति प्रत्ययस्य सर्वसिद्धत्वात् तदालम्बनभूतः कश्चत् ब्रह्मानन्दस्याभावः काल्पनिको यावदविद्यमनुवर्तते,अविद्यानिवृत्तौ च तन्मूलत्वान्निवर्तत इति, ‘यस्मिन् सत्यग्रिमक्षणे’ इत्यादिलक्षणानुरोधेन मुख्यमेव तस्य प्राप्यत्वम् इत्याहुः।", "padacchedaText": "", "audioFile": "PB_hear2read_001505.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001506", "originalText": "अपरे तु— अवेद्यस्यापुरुषार्थत्वात् संसारदशायां सदप्यनवच्छिन्नसुखम् आपरोक्ष्याभावात् न पुरुषार्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_001506.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001507", "originalText": "न च− स्वरूपज्ञानेनापरोक्ष्यं तदाप्यस्ति, तस्य सर्वदा स्वरूपसुखाभिन्नत्वात्, वृत्तिज्ञानेनापरोक्ष्यं तु न मुक्तावपीति−वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001507.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001508", "originalText": "न हि स्वव्यवहारानुकूलचैतन्याभेदमात्रमापरोक्ष्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001508.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001509", "originalText": "घटावच्छिन्नचैतन्याभिव्यक्तौ तदभिन्नस्य घटगन्धस्यापि आपरोक्ष्यापत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_001509.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001510", "originalText": "किन्तु अनावृतार्थस्य तदभेदः।", "padacchedaText": "", "audioFile": "PB_hear2read_001510.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001511", "originalText": "तथा च अनावृतत्वांशः तत्त्वसाक्षात्कारे सत्येवेति निरतिशयसुखापरोक्ष्यस्य पुरुषार्थस्य विद्याप्राप्यत्वं युक्तम् इत्याहुः।", "padacchedaText": "", "audioFile": "PB_hear2read_001511.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001512", "originalText": "इतरे तु−अस्तु व्यवहारानुकूलचैतन्याभेदमात्रमापरोक्ष्यम्, तथाऽपि अज्ञानमहिम्ना जीवभेदवत् चिदानन्दभेदोऽपि अध्यस्त इति संसारदशायां पुरुषान्तरस्य पुरुषान्तरचैतन्यापरोक्ष्यवत् अनवच्छिन्नसुखापरोक्ष्यमपि नास्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_001512.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001513", "originalText": "अज्ञाननिवृत्तौ तु चिदानन्दभेदप्रविलयात्तदापरोक्ष्यमिति तस्य विद्यासाध्यत्वम् इत्याहुः।", "padacchedaText": "", "audioFile": "PB_hear2read_001513.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001514", "originalText": "मुक्तस्वरूपविचारः\nअथ विद्योदये सति उपाधिविलयादपेतजीवभावस्य किमीश्वरभावापत्तिर्भवति, उत शुद्धचैतन्यमात्ररूपेणावस्थानम्? इति विवेचनीयम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001514.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001515", "originalText": "उच्यते−एकजीववादे तदेकाज्ञानकल्पितस्य जीवेश्वरविभागादिकृत्स्रभेदप्रपञ्चस्य तद्विद्योदये विलयात् निर्विशेषचैतन्यरूपेणैवावस्थानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001515.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001516", "originalText": "अनेकजीववादमभ्युपगम्य बद्धमुक्तव्यवस्थाङ्गीकारेऽपि यद्यपि कस्यचित् विद्योदये तदविद्याकृतप्रपञ्चविलयेऽपि बद्धपुरुषान्तराविद्याकृतः जीवेश्वरविभागादिप्रपञ्चोऽनुवर्तते, तथापि ‘जीव इवेश्वरोऽपि प्रतिबिम्बविशेषः’ इति पक्षे मुक्तस्य बिम्बभूतशुद्धचैतन्यरूपेणैवावस्थानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001516.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001517", "originalText": "अनेकोपाधिषु एकस्य प्रतिबिम्बे सति एकोपाधिविलये तत्प्रतिबिम्बस्य बिम्बभावेनैवावस्थानौचित्येन प्रतिबिम्बान्तरत्वापत्त्यसम्भवात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001517.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001518", "originalText": "तत्सम्भवे कदाचिज्जीवरूपप्रतिबिम्बान्तरत्वापत्तेरपि दुर्वारत्वेन अवच्छेदपक्ष इव मुक्तस्य पुनर्बन्धापत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_001518.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001519", "originalText": "अत एव अनेकजीववादे अवच्छेदपक्षो नाद्रियते।", "padacchedaText": "", "audioFile": "PB_hear2read_001519.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001520", "originalText": "यदवच्छेदेन मुक्तिः तदवच्छेदेनान्तःकरणान्तरसंसर्गे पुनरपि बन्धापत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_001520.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001521", "originalText": "“प्रतिबिम्बो जीवः विम्बस्थानीय ईश्वरः उभयानुस्यूतं शुद्धचैतन्यम्”, इति पक्षे तु मुक्तस्य यावत्सर्वमुक्तिसर्वज्ञत्वसर्वकर्तृत्वसर्वेश्वरत्वसत्यकामत्वादिगुणपरमेश्वरभावापत्तिरिष्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001521.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001522", "originalText": "यथा−अनेकेषु दर्पणेषु एकस्य मुखस्यप्रतिबिम्बे सति एकदर्पणापनये तत्प्रतिबिम्बो बिम्बभावेनावतिष्ठते, न तु मुखमात्ररूपेण, तदानीमपि दर्पणान्तरसन्निधानप्रयुक्तस्य मुखे बिम्बत्वस्यानपायात्, तथा एकस्य ब्रह्मचैतन्यस्य अनेकेषूपाधिषु प्रतिबिम्बे सति एकस्मिन् प्रतिबिम्बे विद्योदये तेन तदुपाधिविलये तत्प्रतिबिम्बस्य बिम्बभावेनावस्थानावश्यम्भावात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001522.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001523", "originalText": "न च मुक्तस्य अविद्याऽभावात् सत्यकामत्वादिगुणविशिष्टसर्वेश्वरत्वानुपपत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_001523.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001524", "originalText": "तदविद्याऽभावेऽपि तदानीं बद्धपुरुषान्तराविद्यासत्त्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001524.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001525", "originalText": "न हि ईश्वरस्येश्वरत्वं सत्यकामादिगुणवैशिष्ट्यं च स्वाविद्याकृतम्, तस्य निरञ्जनत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001525.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001526", "originalText": "किं तु बद्धपुरुषाविद्याकृतमेव तत्सर्वमेष्टव्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001526.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001527", "originalText": "न च ‘यथाक्रतुरस्मिन् लोके पुरुषो भवति, तथेतः प्रेत्य भवति’ (छा.उ. ३. १४. १) ‘तं यथायथोपासते’ (मुद्गलोपनिषत्. ३) इत्यादिश्रुतिषु सगुणोपासकानामपि ईश्वरसायुज्यश्रवणान्मुक्तेः सगुणविद्याफलाविशेषापत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_001527.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001528", "originalText": "सगुणोपासकानामखण्डसाक्षात्काराभावात् नाविद्यानिवृत्तिः, न वा तन्मूलाहङ्कारादेर्विलयः।", "padacchedaText": "", "audioFile": "PB_hear2read_001528.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001529", "originalText": "आवरणानिवृत्तेर्नाखण्डानन्दस्फुरणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001529.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001530", "originalText": "‘जगद्व्यापारवर्जं प्रकरणादसन्निहितत्वाच्च’ (ब्र.सू. ४. ४. १७) ‘भोगमात्रसाम्यलिङ्गाच्च’ (ब्र.सू. ४. ४. २१) इत्यादिसूत्रोक्तन्यायेन तेषां परमेश्वरेण भोगसाम्येऽपि सङ्कल्पमात्रात् स्वभोगोपयुक्तदिव्यदेहेन्द्रियवनितादिसृष्टिसामर्थ्येऽपि सकलजगत्सृष्टिसंहारादिस्वातन्त्र्यलक्षणं न निरवग्रहमैश्वर्यम्, मुक्तानां तु निस्सन्धिबन्धमीश्वरभावं प्राप्तानां तत्सर्वमिति महतो विशेषस्य सद्भावात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001530.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001531", "originalText": "न च परमेश्वरस्य रघुनाथाद्यवतारे तमस्वित्वदुःखसंसर्गादिश्रवणात् मुक्तानामीश्वरभावे पुनर्बन्धापत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_001531.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001532", "originalText": "तस्य विप्रशापामोघत्वादिस्वकृतमर्यादापरिपालनाय कथञ्चित् भृगुशापादि सत्यत्वं प्रत्याययितुं नटवदीश्वरस्य तदभिनयमात्रपरत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001532.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001533", "originalText": "अन्यथा तस्य नित्यमुक्तत्वनिरवग्रहस्वातन्त्र्यसमाभ्यधिकराहित्यादिश्रुतिविरोधात्। तस्माद्यावत्सर्वमुक्ति परमेश्वरभावो मुक्तस्येति बिम्बेश्वर (पक्षे) (वादे) न कश्चिद्दोषः॥", "padacchedaText": "", "audioFile": "PB_hear2read_001533.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001534", "originalText": "अयमेव पक्षः श्रुतिसूत्रभाष्याद्यनुगुणः।", "padacchedaText": "", "audioFile": "PB_hear2read_001534.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001535", "originalText": "तथा हि− समन्वयाध्याये तावत् ‘दहर उत्तरेभ्यः’ (ब्र.सू. १. ३. १४) इत्यधिकरणे ‘अथयदिदमस्मिन् ब्रह्मपुरे दहरं पुण्डरीकं वेश्म दहरोऽस्मिन् अन्तराकाशः’ (छा.उ. ८. १. १) इत्यादिश्रुतिनिर्दिष्टो दहराकाशो न भूताकाशः, नापि जीवः, किं तु परमेश्वरः, उत्तरेभ्यो— वाक्यशेषेभ्यः।", "padacchedaText": "", "audioFile": "PB_hear2read_001535.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001536", "originalText": "‘उभे अस्मिन् द्यावापृथिवी अन्तरेव समाहिते’ ‘यावान्वा अयमाकाशस्तावानेषोऽन्तर्हृदय आकाशः’ (छा.उ. ८. १. ३) ‘एष आत्मापहतपाप्मा विजरो विमृत्युर्विशोको विजिघत्सेऽपिपासः सत्यकामः सत्यसङ्कल्पः’ (छा.उ. ८. १. ५) इत्यादिना प्रतिपाद्यमानेभ्यो द्यावापृथिव्याद्याधारत्वलक्षणगुणेभ्यो हेतुभ्य’ इति निर्णीय ‘उत्तराच्चेदाविर्भूतस्वरूपस्तु’ (ब्र.सू. १. ३. १९) इति सूत्रान्तरेण दहरविद्यानन्तरमिन्द्रप्रजापतिसंवादे ‘य आत्मापहतपाप्मा’ (छा.उ. ८. ७. ३) इत्यादिना अपहतपाप्मत्वादिगुणाष्टकयुक्तमात्मानमुपदेश्यमुपक्षिप्य ‘य एषोऽक्षिणि पुरुषो दृश्यते एष आत्मा’ (छा.उ. ८. ७. ४) इति जाग्रदवस्थायां द्रष्टृत्वेनाक्षिसन्निहितस्य ‘य एष स्वप्ने महीयमानश्चरति एष आत्मा’ (छा.उ. ८. १०. १) स्वप्नावस्थापन्नस्य तद्यत्रैतत्सुप्तस्समस्तस्सम्प्रसन्नः स्वप्नं न विजानाति एष आत्मा’ (छा.उ. ८. ११. १) इति सुषुप्त्यवस्थापन्नस्य ‘एषसम्प्रसादोऽस्माच्छरीरात् समुत्थाय परं ज्योतिरुपसम्पद्य स्वेन रूपेणाभिनिष्पद्यते स उत्तमः पुरुषः’ (छा.उ. ८. १२. ३) इत्यवस्थात्रयोत्तीर्णस्य च जीवस्योपदेशात् जीवेऽप्यस्ति अपहतपाप्मत्वादिगुणाष्टकमिति न तद्दहराकाशस्य परमेश्वरत्वनिर्णायकम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001536.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001537", "originalText": "‘य एष स्वप्ने’ इत्यादिपर्यायेषु प्रतिपर्यायं ‘एतं त्वेव ते भूयोऽनुव्याख्यास्यामि’ (छा.उ. ८. १०. ४) इति श्रवणेन ‘स्फुटस्वप्नादिजीवलिङ्गानां द्वितीयादिपर्यायाणामेव जीवविषयत्वं प्रथमपर्यायस्य च ब्रह्मविषयत्वं’ इति चोद्यानवकाशात्−इत्याशङ्क्य तत्र चतुर्थपर्याये निरूप्यमाणः सकलबन्धविनिर्मुक्तत्वेनाविर्भूतस्वरूपो जीवः प्रतिपाद्यः, न तु सांसारिकावस्थाभेदकलुषितः, तत्र सत्यसङ्कल्पत्वादिगुणबाधात् अवस्थात्रयोपन्यासस्य तत्तदवस्थादोषाभिधानेन चतुर्थपर्यायोपदेशशेषत्वप्रतिपत्तेः’ इति समादधानः सूत्रकारः चतुर्थपर्याये प्रतिपाद्यस्य मुक्तस्येश्वरभावापत्तिं स्पष्टमाह।", "padacchedaText": "", "audioFile": "PB_hear2read_001537.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001538", "originalText": "तदभावे मुक्तेऽपि सत्यसङ्कल्पत्वाद्ययोगात् अनुक्रान्तस्य गुणाष्टकस्य ईश्वरादन्यत्रापि भावे कृतशङ्कापरिहारालाभाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_001538.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001539", "originalText": "तस्मिन् सूत्रे ‘तस्मात् यदविद्याप्रत्युपस्थापितमपारमार्थिकं जैवं रूपं कर्तृत्वभोक्तृत्वरागद्वेषादिदोषकलुषितमनेकानर्थयोगि तद्विलयनेन तद्विपरीतमपहतपाप्मत्वादिगुणकं पारमेश्वरं रूपं विद्यया प्रतिपद्यते’ इति भाष्यकारोऽप्यतिस्पष्टं मुक्तस्य सगुणेश्वरभावापत्तिमाह।", "padacchedaText": "", "audioFile": "PB_hear2read_001539.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001540", "originalText": "अविरोधाध्यायेऽपि ‘एष ह्येव साधु कर्म कारयति तं यमेभ्यो लोकेभ्य उन्निनीषते एष उ एवासाधु कर्म कारयति तं यमधो निनीषते’ (कौ.उ. ३. ८) इत्यादिश्रुतेः तत्तत्कर्मकर्तृत्वेन तत्तत्कर्मकारयितृत्वेन च उपकार्योपकारकभावेनावगतयोः जीवेश्वरयोः अंशांशिभावरूपसम्बन्ध निरूपणार्थत्वेनावतारिते ‘अंशो नानाव्यपदेशात्’ (ब्र.सू. २. ३. ४३) इत्यधिकरणे ‘जीवस्येश्वरांशत्वाभ्युपगमे तदीयेन संसारदुःखभोगेन ईश्वरस्यापि दुःखित्वं स्यात्, यथा लोके हस्तपादाद्यन्यतमांशगतेन दुःखेनांशिनो देवदत्तस्यापि दुःखित्वम्, तद्वत्, ततश्च तत्प्राप्तानां महत्तरं दुःखं प्राप्नुयात्, ततो वरं पूर्वावस्था संसार एवास्तु इति सम्यग्ज्ञानानर्थक्यप्रसङ्गः’ इति शङ्काग्रन्थेन, भामत्यादिषु स्पष्टीकृतं बिम्बप्रतिबिम्बभावकृतासङ्करमुपादाय समाहितेन भाष्यकारो मुक्तस्य ईश्वरभावापत्तिं स्पष्टीचकार।", "padacchedaText": "", "audioFile": "PB_hear2read_001540.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001541", "originalText": "साधनाध्यायेऽपि ‘सन्ध्ये सृष्टिराह हि’ (ब्र.सू. ३. २. १) इत्यधिकरणे स्वप्नप्रपञ्चस्य मिथ्यात्वे व्यवस्थापिते तत्र मिथ्याभूते स्वप्नप्रपञ्चे जीवस्य कर्तृत्वमाशङ्क्य ‘पराभिध्यानात्तु तिरोहितं ततो ह्यस्य बन्धविपर्ययौ’ (ब्र.सू. ३. २. ५) इति सूत्रेण ‘जीवस्येश्वराभिन्नत्वात् सदपि सत्यसङ्कल्पत्वादिकमविद्यादोषात्तिरोहितमिति न तस्य स्वप्नप्रपञ्चे स्रष्टृत्वं सम्भवति’ इति वदन् सूत्रकारः ‘तत्पुनस्तिरोहितं सत् परमभिध्यायतो यतमानस्य जन्तोर्विधूतध्वान्तस्य तिमिरतिरस्कृतेव दृक्छक्तिः औषधवीर्यात् ईश्वरप्रसादात्संसिद्धस्य कस्यचिदेवाविर्भवति, न स्वभावत एव सर्वेषां जन्तूनाम्’ इति तत्सूत्राभिप्रायं वर्णयन् भाष्यकारश्च मुक्तस्य स्वप्नसृष्ट्याद्युपयोगिसत्यसङ्कल्पत्वाद्यभिव्यक्त्यङ्गीकरेण परमेश्वरभावापत्तिं स्पष्टीचकार।", "padacchedaText": "", "audioFile": "PB_hear2read_001541.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001542", "originalText": "फलाध्यायेऽपि ‘स्वेन रूपेणाभिनिष्पद्यते’ (छा.उ. ८. ३. ४) इति मुच्यमानविषयायां श्रुतौ केन रूपेणाभिनिष्पत्तिर्विवक्षिता इति बुभुत्सायां ‘ब्राह्मेण जैमिनिरुपन्यासादिभ्यः’ (ब्र.सू. ४. ४. ५) इति सूत्रेण यत् ब्राह्मं रूपमपहतपाप्मत्वादि सत्यसङ्कल्पत्वाद्यवसानं सर्वज्ञत्वसर्वेश्वरत्वादि च तेनाभिनिष्पत्तिः ‘य आत्मापहतपाप्मा’ (छा.उ. ८. ७. १) इत्याद्युपन्यासेन ‘स तत्र पर्येति जक्षत् क्रीडन् रममाणः स्त्रीभिर्वा यानैर्वा’ (छा.उ. ८. १२. ३) इत्याद्यैश्वर्यावेदनेन च इति जैमिनिमतम्, ‘चितितन्मात्रेण तदात्मकत्वादित्यौडुलोमिः’ (ब्र.सू. ४. ४. ६) इत्यनन्तरेण सूत्रेण ‘एवं वा अरेऽयमात्माऽनन्तरोऽबाह्यः कृत्स्नः प्रज्ञानघन एव’ (बृ.उ. ४. ५. १३) इत्यादिश्रुत्या चैतन्यमात्रमात्मस्वरूपमित्यवगतेः तन्मात्रेणाभिनिष्पत्तिः−इति मतान्तरं चोपन्यस्य ‘एवमप्युपन्यासात्पूर्वभावादविरोधं बादरायणः’ (ब्र.सू. ४. ४. ७) इति सिद्धान्तसूत्रेण ‘वस्तुदृष्ट्या चैतन्यमात्रत्वेऽपि पूर्वेक्तगुणकलापस्य उपन्यासाद्यवगतस्य मायामयस्य बद्धपुरुषव्यवहारदृष्ट्या सम्भवात् न श्रुतिद्वयविरोधः’ इति अविरोधं वदन् सूत्रकारः, सूत्रत्रयमिदमुक्तार्थपरत्वेन व्याकुर्वन् भाष्यकारश्च, मुक्तस्येश्वरभावापत्तिं स्पष्टमनुमेने।", "padacchedaText": "", "audioFile": "PB_hear2read_001542.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001543", "originalText": "भामतीनिबन्धृप्रभृतयश्च श्रुत्युपबृंहितमिदं सूत्रजातं भगवतो भाष्यकारस्य उदाहृतं वचनजातं च तथैवान्ववर्तन्त।", "padacchedaText": "", "audioFile": "PB_hear2read_001543.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001544", "originalText": "न च श्रुत्युपबृंहितस्य एतावतः सूत्रभाष्यवचनजातस्य ‘ऐश्वर्यमज्ञानतिरोहितं सत् ध्यानादभिव्यज्यत इत्यवोचत्।", "padacchedaText": "", "audioFile": "PB_hear2read_001544.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001545", "originalText": "शरीरिणः सूत्रकृदस्य यत्तु तदभ्युपेत्योदितमुक्तहेतोः।", "padacchedaText": "", "audioFile": "PB_hear2read_001545.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001546", "originalText": "’ (सं.शा. ३. १७५) इति सङ्क्षेपशारीरकोक्तरीत्या अभ्युपेत्यवादत्वं युक्तं वक्तुम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001546.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001547", "originalText": "तस्मान्मुक्तानामीश्वरभावापत्तेरवश्याभ्युपेयत्वात् एतदसम्भव एव प्रतिबिम्बेश्वरवादे दोषः।", "padacchedaText": "", "audioFile": "PB_hear2read_001547.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001548", "originalText": "तदाहुः कल्पतरुकाराः − ‘न मायाप्रतिबिम्बस्य विमुक्तैरुपसृप्यता’ (कल्पतरुः १. ४. ३) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001548.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001549", "originalText": "एतदसम्भवश्च एकजीववादपारमार्थिकजीवभेदवादयोरपि दोषः।", "padacchedaText": "", "audioFile": "PB_hear2read_001549.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001550", "originalText": "यत्तु कैश्चित् द्वैतिभिरुच्यते−भेदस्य पारमार्थिकत्वेन मुक्तौ जीवस्येश्वरभावाभावेऽपि तत्रापीश्वर इव पृथगपहतपाप्मत्वादिगुणसम्भवादविरोध इति, तत्तुच्छम्— तथा सति जीवस्यापहतपाप्मत्वादिकमस्तीति न तस्य ब्रह्मलिङ्गत्वमिति शङ्कापरिहारालाभेन ‘उत्तराच्चेदाविर्भूतस्वरूपस्तु’ (ब्र.सू. १. ३. १९) इति सूत्रविरोधात् ‘ब्राह्मेण जैमिनिः’ (ब्र.सू. ४. ४. ५) इति सूत्रे जीवगतस्यापहतपाप्मत्वादेः ‘उपन्यासादिभ्यः’ (ब्र.सू. ४. ४. ५) इत्यत्रादिशब्दार्थत्वेन परेषामप्यभिमतस्य ‘जक्षत् क्रीडन् रममाणः’ (छा.उ. ८. १२. ३) इत्यादिश्रुत्युदितस्य जक्षणादेश्च ब्राह्मत्वनिर्देशविरोधाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_001550.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001551", "originalText": "भेदे तेषां गुणानां सत्यत्वेन ‘चितितन्मात्रेण’ (ब्र.सू. ४. ४. ६) इति सूत्रोक्तस्य मुक्तजीवानां चैतन्यमात्रत्वस्य ‘एवमपि’ (ब्र.सू. ४. ४. ७) इतिसिद्धान्तसूत्रेऽङ्गीकारविरोधाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_001551.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001552", "originalText": "‘सम्पद्याविर्भावः’ (ब्र.सू. ४. ४. १) इत्यधिकारणविरोधाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_001552.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001553", "originalText": "तत्र हि ’स्वेन रूपेणाभिनिष्पद्यते’ (छा.उ. ८. ३. ४) इति श्रुतौ आगन्तुना केनचिद्रूपेणाभिनिष्पत्तिर्नोच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001553.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001554", "originalText": "स्वेनशब्दवैयर्थ्यापत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_001554.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001555", "originalText": "येन रूपेण आगन्तुना स्वयमभिनिष्पद्यते तस्यात्मीयत्वस्यावक्तव्यत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001555.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001556", "originalText": "तस्मादात्मवाचिस्वशब्दोपादानात् नित्यसिद्धेन स्वस्वरूपेणैव अभिनिष्पत्तिर्विवक्षिता न तु केनचिद्धर्मेणेति व्यवस्थापितम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001556.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001557", "originalText": "किञ्चेदमपहतपाप्मत्वादि जीवस्य मुक्तावागन्तुकं चेत्, ‘सम्पद्याविर्भावः’ (ब्र.सू. ४. ४. १) इति मुक्तावागन्तुकरूपनिषेधेन ‘पराभिध्यानात्तु तिरोहितम्’ (ब्र.सू. ३. २. ५) ‘उत्तराच्चेदाविर्भूतस्वरूपस्तु’ (ब्र.सू. १. ३. १९) इति अपहतपाप्मत्वादेर्बन्धमुक्त्योस्तिरोभावाविर्भावप्रतिपादनेन च विरोधः स्यादिति नित्यसिद्धं वाच्यमिति बन्धस्य मिथ्यात्वं दुर्वारम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001557.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001558", "originalText": "नित्यसिद्धमपहतपाप्मत्वं हि सर्वदा पाप्मरहितत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001558.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001559", "originalText": "न च वस्तुतः सर्वदा पाप्मरहिते पाप्मसम्बन्धः तन्मूलककर्तृत्वभोक्तृत्वसम्बन्धो वा पारमार्थिकः सम्भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_001559.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001560", "originalText": "एवं च जीवस्येश्वराभेदोऽपि दुर्वारः।", "padacchedaText": "", "audioFile": "PB_hear2read_001560.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001561", "originalText": "श्रुतिबोध्यतदभेदविरोधिबन्धस्य सत्यत्वाभावात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001561.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001562", "originalText": "अन्यथा संसारिणि नित्यसिद्धसत्यसङ्कल्पतिरोधानोक्त्ययोगाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_001562.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001563", "originalText": "न हि जीवस्य संसारदशायामनुवर्तमानो यत्किञ्चिदर्थगोचरः कश्चिदस्त्यवितथसङ्कल्पः तिरोहित इति परैरपीष्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001563.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001564", "originalText": "किं त्वीश्वरस्य यन्नित्यसिद्धं निरवग्रहं सत्यसङ्कल्पत्वं तदेव जीवस्य संसारदशायामीश्वराभेदानभिव्यक्त्या स्वकीयत्वेनानवभासमानं तं प्रति तिरोहितमित्येव समर्थनीयमिति घट्टकुटीप्रभातवृत्तान्तः।", "padacchedaText": "", "audioFile": "PB_hear2read_001564.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001565", "originalText": "ननु अपहतपाप्मत्वं न पाप्मविरहः, किं तु पाप्महेतुकर्माचरणेऽपि पापोत्पत्तिप्रतिबन्धकशक्तियोगित्वमिति, न तस्य नित्यसिद्धत्वेन बन्धस्य मिथ्यात्वप्रसङ्गः।", "padacchedaText": "", "audioFile": "PB_hear2read_001565.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001566", "originalText": "एवं सत्यसङ्कल्पत्वमपि शक्तिरूपेण निर्वाच्यमिति नेश्वराभेदप्रसङ्गः− इति चेत्, मैवम्— एवं शब्दार्थकल्पने प्रमाणाभावात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001566.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001567", "originalText": "न हि पापजननप्रतिबन्धिका शक्तिः संसाररूपपरिभ्रमणदशायां पापानुत्पत्त्यर्थं कल्पनीया।", "padacchedaText": "", "audioFile": "PB_hear2read_001567.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001568", "originalText": "तदानीं तदुत्पत्तेरिष्टत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001568.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001569", "originalText": "विद्योदयप्रभृति तु विद्यामाहात्म्यादेवाश्लेषः ‘तदधिगम उत्तरपूर्वाघयोरश्लेषविनाशौ तद्व्यपदेशात्’ (ब्र.सू. ४. १. १३) इति सूत्रेण दर्शितः।", "padacchedaText": "", "audioFile": "PB_hear2read_001569.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001570", "originalText": "तत एव मुक्तावप्यश्लेष उपपद्यत इति व्यर्था शक्तिकल्पना।", "padacchedaText": "", "audioFile": "PB_hear2read_001570.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001571", "originalText": "तस्मादुदाहृतश्रुतिसूत्रानुसारिभिः मुक्तजीवानां यावत्सर्वमुक्तिवस्तुसच्चैतन्यमात्रत्वाविरोधिबद्धपुरुषाविद्याकृतनिरवग्रहैश्वर्यतदनुगुणगुणकलापविशिष्टनिरतिशयानन्दस्फुरणसमृद्धनिस्सन्धिबन्धपरमेश्वरभावापत्तिरादर्तव्येति सिद्धम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_001571.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001572", "originalText": "मङ्गलश्लोकः\nविद्वद्गुरोर्विहितविश्वजिदध्वरस्य\nश्रीसर्वतोमुखमहाव्रतयाजिसूनोः। श्रीरङ्गराजमखिनः श्रितचन्द्रमौलेः\nअस्त्यप्पदीक्षित इति प्रथितस्तनूजः॥", "padacchedaText": "", "audioFile": "PB_hear2read_001572.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001573", "originalText": "तन्त्राण्यधीत्य सकलानि सदाऽवदात—\nव्याख्यानकौशलकलाविशदीकृतानि। आम्नायमूलमनुरुद्ध्य च सम्प्रदायं\nसिद्धान्तभेदलवसङ्‌ग्रहमित्यकार्षीत्॥", "padacchedaText": "", "audioFile": "PB_hear2read_001573.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001574", "originalText": "सिद्धान्तरीतिषु मया भ्रमदूषितेन\nस्यादन्यथापि लिखितं यदि किञ्चिदस्य। संशोधने सहृदयास्सदया भवन्तु\nसत्सम्प्रदायपरिशीलननिर्विशङ्काः॥॥", "padacchedaText": "", "audioFile": "PB_hear2read_001574.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001575", "originalText": "इति शास्त्रसिद्धान्तलेशसङ्ग्रहे चतुर्थः परिच्छेदः।॥॥", "padacchedaText": "", "audioFile": "PB_hear2read_001575.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001576", "originalText": "समाप्तोऽयं ग्रन्थः॥॥", "padacchedaText": "", "audioFile": "PB_hear2read_001576.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001577", "originalText": "शिवाभ्यां नमः॥", "padacchedaText": "", "audioFile": "PB_hear2read_001577.mp3", "zipFile": "Siddhantaleshasangraha.zip"}];
        const contentDiv = document.getElementById('content');
        
        let currentIndex = -1;
        let isPlaying = false;
        
        // Use standard HTML5 audio to preserve pitch on speed changes
        const audioEl = new Audio();
        audioEl.preservesPitch = true;
        
        const speedSlider = document.getElementById('speed-slider');
        const speedDisplay = document.getElementById('speed-display');
        speedSlider.oninput = function() {
            audioEl.playbackRate = this.value;
            speedDisplay.innerText = parseFloat(this.value).toFixed(1);
        };
        
        const playPauseBtn = document.getElementById('play-pause-btn');
        playPauseBtn.onclick = () => {
            if (isPlaying) {
                audioEl.pause();
                isPlaying = false;
                playPauseBtn.innerText = "Resume";
            } else {
                playAudio(Math.max(0, currentIndex));
                playPauseBtn.innerText = "Stop";
            }
        };
        
        manifest.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'sentence';
            div.id = 'sentence-' + index;
            
            const idSpan = document.createElement('span');
            idSpan.className = 'sentence-id';
            idSpan.innerText = '[' + item.id + ']';
            
            const textSpan = document.createElement('span');
            textSpan.innerText = item.originalText;
            
            div.appendChild(idSpan);
            div.appendChild(textSpan);
            
            div.onclick = () => {
                playPauseBtn.innerText = "Stop";
                playAudio(index);
            };
            contentDiv.appendChild(div);
        });
        
        // --- HTML5 Audio Prefetching Logic (via Blob URLs) ---
        const PREFETCH_BUFFER_SIZE = 3;
        let prefetchQueue = new Map(); // index -> Blob URL

        function getAudioUrl(index) {
            if (index < 0 || index >= manifest.length) return null;
            const item = manifest[index];
            const zipToUse = item.zipFile || ZIP_NAME;
            return WORKER_URL + '/' + BUCKET_NAME + '/' + zipToUse + '/' + item.audioFile;
        }

        async function fetchBlobUrl(url) {
            const response = await fetch(url);
            if (!response.ok) throw new Error("HTTP " + response.status);
            const blob = await response.blob();
            return URL.createObjectURL(blob);
        }

        async function prefetchNext(fromIndex) {
            for (let i = fromIndex + 1; i <= fromIndex + PREFETCH_BUFFER_SIZE; i++) {
                if (i >= manifest.length) break;
                if (!prefetchQueue.has(i)) {
                    prefetchQueue.set(i, 'fetching');
                    const url = getAudioUrl(i);
                    try {
                        const blobUrl = await fetchBlobUrl(url);
                        if (prefetchQueue.get(i) === 'fetching') {
                            prefetchQueue.set(i, blobUrl);
                        } else {
                            URL.revokeObjectURL(blobUrl);
                        }
                    } catch (err) {
                        console.error("Prefetch failed for index", i, err);
                        prefetchQueue.delete(i);
                    }
                }
            }
            // Cleanup old blobs to free memory
            for (let [key, val] of prefetchQueue.entries()) {
                if (key < fromIndex) {
                    if (typeof val === 'string' && val.startsWith('blob:')) {
                        URL.revokeObjectURL(val);
                    }
                    prefetchQueue.delete(key);
                }
            }
        }
        // ------------------------

        async function playAudio(index) {
            if (index < 0 || index >= manifest.length) {
                isPlaying = false;
                playPauseBtn.innerText = "Start Reading";
                return;
            }
            
            if (currentIndex >= 0) {
                const prevDiv = document.getElementById('sentence-' + currentIndex);
                if (prevDiv) prevDiv.classList.remove('active');
            }
            
            currentIndex = index;
            
            const currentDiv = document.getElementById('sentence-' + currentIndex);
            if (currentDiv) {
                currentDiv.classList.add('active');
                currentDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            
            audioEl.pause();
            
            try {
                let audioUrl;
                if (prefetchQueue.has(index) && prefetchQueue.get(index) !== 'fetching') {
                    audioUrl = prefetchQueue.get(index);
                } else {
                    const sourceUrl = getAudioUrl(index);
                    audioUrl = await fetchBlobUrl(sourceUrl);
                }
                
                audioEl.src = audioUrl;
                audioEl.playbackRate = speedSlider.value;
                audioEl.onended = () => { playAudio(currentIndex + 1); };
                
                await audioEl.play();
                isPlaying = true;
                
            } catch (e) {
                console.error("Audio play error:", e);
                // Fallback to next track if error
                setTimeout(() => playAudio(currentIndex + 1), 500);
            }
            
            // Trigger prefetch for upcoming sentences
            prefetchNext(index);
        }
    </script>
</body>
