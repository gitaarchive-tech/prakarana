B_hear2read_001205.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001206", "originalText": "’ (४. ४. १०२९) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001206.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001207", "originalText": "न हि ‘विद्याकामो यज्ञादीननुतिष्ठेत्’ इति विपरिणमिते विद्याकामाधिकारविधौ ब्राह्मणपदस्याधिकारिविशेषसमर्पकत्वं युज्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001207.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001208", "originalText": "उद्देश्ये विशेषणायोगात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001208.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001209", "originalText": "नापि—‘राजा स्वाराज्यकामो राजसूयेन यजेत’ इति स्वाराज्यकामाधिकारे राजसूयविधौ ‘स्वाराज्यकामो राजकर्तृकेण राजसूयेन यजेत’ इति कर्तृतया यागविशेषणत्वेन विधेयस्य राज्ञः, राजकर्तृकराजसूयस्य अराज्ञा सम्पादयितुमशक्यत्वात् अर्थादधिकारिकोटिनिवेशवत्, इह यज्ञादिकर्तृतया विधेयस्य ब्राह्मणस्य अर्थादधिकारिकोटिनिवेश इति युज्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001209.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001210", "originalText": "‘सर्वथापि त एवोभयलिङ्गात्’ (ब्र.सू. ३. ४. ३४) इति सूत्रे, अन्यत्र विहितानामेव यज्ञादीनां विविदिषावाक्ये फलविशेषसम्बन्धविधिः नापूर्वयज्ञादिविधिरिति व्यवस्थापितत्वेन, प्राप्तयज्ञाद्यनुवादेन एकस्मिन् वाक्ये कर्तृरूपगुणविधिः फलसम्बन्धविधिश्च इत्युभयविधानाद्वाक्यभेदापत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_001210.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001211", "originalText": "नापि—राजसूयवाक्ये राज्ञः कर्तृतया विधेयत्वाभावपक्षे राजपदसमभिव्याहारमात्राद्विशिष्टकर्तृकत्वलाभवत्, इह वाक्याभेदाय कर्तृतया ब्राह्मणाविधानेऽपि ब्राह्मणपदसमभिव्याहारमात्रेण ब्राह्मणकर्तृकत्वलाभात्, तदधिकारपर्यवसानमित्युपपद्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001211.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001212", "originalText": "अन्यत्र त्रैवर्णिकाधिकारिकत्वेन क्लृप्तानाम् इहापि त्रैवर्णिकाधिकारात्मविद्यार्थत्वेन विधीयमानानां यज्ञादीनां त्रैवर्णिकाधिकारत्वस्य युक्ततया विधिसंसर्गहीनब्राह्मणपदसमभिव्याहारमात्रादधिकारसङ्कोचासम्भवेन ब्राह्मणपदस्य यथाप्राप्तविद्याधिकारिमात्रोपलक्षणत्वौचित्यात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001212.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001213", "originalText": "ननु विद्याधिकारिमात्रोपलक्षणत्वे शूद्रस्यापि विद्यायामर्थित्वादिसम्भवेन तस्यापि विद्यार्थकर्माधिकारप्रसङ्ग इति चेत्, न— ‘अध्ययनगृहीतस्वाध्यायजन्यतदर्थज्ञानवत एव वैदिकेष्वधिकारः’ (ब्र.सू. १. ३. ३४) इत्यपशूद्राधिकरणे अध्ययनवेदवाक्यश्रवणादिविधुरस्य शूद्रस्य विद्याधिकारनिषेधात्, ‘न शूद्राय मतिं दद्यात्’ (म.नु. ४. ८०) इति स्मृतेः आपाततोऽपि तस्य विद्यामहिमावगत्युपायासम्भवेन तदर्थित्वानुपपत्तेश्च, तस्य विद्यायामनधिकारादिति केचित्।", "padacchedaText": "", "audioFile": "PB_hear2read_001213.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001214", "originalText": "अन्ये त्वाहुः— शूद्रस्याप्यस्त्येव विद्यार्थकर्माधिकारः, तस्य वेदानुवचनाग्निहोत्राद्यसम्भवेऽपि कण्ठोक्तसर्ववर्णाधिकारश्रीपञ्चाक्षरमन्त्रराजविद्यादिजपपापक्षयहेतुतपोदानपाकयज्ञादिसम्भवात् ‘वेदानुवचनेन यज्ञेन दानेन’ (बृ.उ. ४. ४. २२) इत्यादिपृथक्कारकविभक्तिश्रुतेः विधुरादीनां विद्यार्थजपदानादिमात्रानुष्ठानानुमतेश्च वेदानुवचनादिसमुच्चयापेक्षणात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001214.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001215", "originalText": "न च शूद्रस्य विद्यायामर्थित्वासम्भवः।", "padacchedaText": "", "audioFile": "PB_hear2read_001215.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001216", "originalText": "‘श्रावयेच्चतुरो वर्णान् कृत्वा ब्राह्मणमग्रतः।", "padacchedaText": "", "audioFile": "PB_hear2read_001216.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001217", "originalText": "’ इति इतिहासपुराणश्रवणे चातुर्वर्ण्याधिकारस्मरणेन पुराणाद्यवगतविद्यामाहात्म्यस्य तस्यापि तदर्थित्वसम्भवात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001217.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001218", "originalText": "‘न शूद्राय मतिं दद्यात्’ इति स्मृतेश्च तदनुष्ठानानुपयोग्यग्निहोत्रादिकर्मज्ञानदाननिषेधपरत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001218.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001219", "originalText": "अन्यथा तस्य स्ववर्णधर्मस्याप्यवगत्युपायासम्भवेन ‘शूद्रश्चतुर्थो वर्ण एकजातिः’ ‘तस्यापि सत्यमक्रोधश्शौचम्’ ‘आचमनार्थे पाणिपादप्रक्षालनमेवैके’ ‘श्राद्धकर्म’ ‘भृत्यभरणम्’ ‘स्वदारतुष्टिः’ ‘परिचर्या चोत्तरेषाम्’ (गौ.ध.सू. २. १. ५१—५७) इत्यादितद्धर्मविभाजकवचनानामननुष्ठानलक्षणाप्रामाण्यापत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_001219.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001220", "originalText": "न चैवं सति अपशूद्राधिकरणस्य निर्विषयत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001220.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001221", "originalText": "तस्य ‘न शूद्रे पातकं किञ्चित् न च संस्कारमर्हति’ (मनु. १०. १२६) इत्यादि स्मृतेः गुरूपसदनाख्यविद्याङ्गोपनयनसंस्कारविधुरस्य शूद्रस्य सगुणविद्यासु निर्गुणविद्यासाधनवेदान्तश्रवणादिषु च अधिकारनिषेधपरत्वात्, निर्गुणविद्यायां शूद्रस्यापि विषयसौन्दर्यप्रयुक्तार्थित्वस्य निषेद्धुमशक्यत्वात्, अविधेयायां च तस्यां तदतिरिक्ताधिकाराप्रसक्त्या तन्निषेधायोगाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_001221.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001222", "originalText": "न च तस्य वेदान्तश्रवणासम्भवे विद्यार्थकर्मानुष्ठानसम्भवेऽपि विद्यानुत्पत्तेः तस्य तदर्थकर्मानुष्ठानं व्यर्थमिति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001222.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001223", "originalText": "तस्य वेदान्तश्रवणाधिकाराभावेऽपि भगवत्पादैः—‘श्रावयेच्चतुरो वर्णान्’ इति चेतिहासपुराणाधिगमे चातुर्वर्ण्याधिकारस्मरणात् वेदपूर्वस्तु नास्त्यधिकारः शूद्राणामिति स्थितम्— इति अपशूद्राधिकरणोपसंहारभष्ये ब्रह्मात्मैक्यपरपुराणादिश्रवणे विद्यासाधनेऽधिकारस्य दर्शितत्वात्, विद्योत्पत्तियोग्यविमलदेवशरीरनिष्पादनद्वारा मुक्त्यर्थं भविष्यतीति त्रैवर्णिकानां क्रममुक्तिफलकसगुणविद्यार्थकर्मानुष्ठानवत् वेदान्तश्रवणयोग्यत्रैवर्णिकशरीरनिष्पादनद्वारा विद्योत्पत्त्यर्थत्वं भविष्यतीति शूद्रस्य विद्यार्थकर्मानुष्ठानाविरोधाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_001223.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001224", "originalText": "तस्मात् विविदिषावाक्ये ब्राह्मणपदस्य यथाप्राप्तविद्याधिकारिमात्रविषयत्वेन शूद्रस्यापि विद्यार्थकर्माधिकारः सिद्ध्यत्येवेति।", "padacchedaText": "", "audioFile": "PB_hear2read_001224.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001225", "originalText": "संन्यासस्य विद्योपयोगित्वनिरूपणम्\nनन्वस्तु कर्मणां चित्तशुद्धिद्वारा विद्योपयोगः, सन्न्यासस्य किंद्वारा तदुपयोगः?\nकेचिदाहुः−विद्योत्पत्तिप्रतिबन्धकदुरितानामनन्तत्वात् किञ्चित् यज्ञाद्यनुष्ठाननिवर्त्यं किञ्चित् सन्न्यासापूर्वनिवर्त्यमिति कर्मवत् चित्तशुद्धिद्वारैव सन्न्यासस्यापि तदुपयोगः।", "padacchedaText": "", "audioFile": "PB_hear2read_001225.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001226", "originalText": "तथा च गृहस्थादीनां कर्मच्छिद्रेषु श्रवणाद्यनुतिष्ठतां न तस्मिन् जन्मनि विद्यावाप्तिः, किं तु जन्मान्तरे सन्न्यासं लब्ध्वैव।", "padacchedaText": "", "audioFile": "PB_hear2read_001226.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001227", "originalText": "येषां तु गृहस्थानामेव सतां जनकादीनां विद्या विद्यते, तेषां पूर्वजन्मनि सन्न्यासात् विद्यावाप्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_001227.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001228", "originalText": "अतो न विद्यायां सन्न्यासापूर्वव्यभिचारशङ्काऽपीति।", "padacchedaText": "", "audioFile": "PB_hear2read_001228.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001229", "originalText": "अन्ये तु— ‘शान्तो दान्त उपरतः’ (बृ.उ. ४. ४. २३) इत्यादिश्रुतौ उपरतशब्दगृहीततया सन्न्यासस्य साधनचतुष्टयान्तर्गतत्वात्, ‘सहकार्यन्तरविधिः’ (ब्र.सू. ३. ४. ४७) इति सूत्रभष्ये तद्वतः—विद्यावतः सन्न्यासिनः, बाल्यपाण्डित्यापेक्षया तृतीयमिदं मौनं विधीयते।", "padacchedaText": "", "audioFile": "PB_hear2read_001229.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001230", "originalText": "“तस्मात् ब्राह्मणः पाण्डित्यम्” इत्यादिश्रुतौ (तेः) ततः प्राक् “भिक्षाचर्यं चरन्ति” इति सन्न्यासाधिकारात्’ इति प्रतिपादनात्, ‘त्यक्ताशेषक्रियस्यैव संसारं प्रजिहासतः।", "padacchedaText": "", "audioFile": "PB_hear2read_001230.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001231", "originalText": "जिज्ञासोरेव चैकात्म्यं त्रय्यन्तेष्वधिकारिता।", "padacchedaText": "", "audioFile": "PB_hear2read_001231.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001232", "originalText": "’ (सं.वा. १२) इति वार्तिकोक्तेश्च सन्न्यासापूर्वस्य ज्ञानसाधनवेदान्तश्रवणाद्यधिकारिविशेषणत्वमिति तस्य विद्योपयोगमाहुः।", "padacchedaText": "", "audioFile": "PB_hear2read_001232.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001233", "originalText": "अपरे तु— ‘श्रवणाद्यङ्गतया आत्मज्ञानफलता सन्न्यासस्य सिद्धा’ इति विवरणोक्तेः अनन्यव्यापारतया श्रवणादिनिष्पादनं कुर्वतः तस्य विद्यायामुपयोगः।", "padacchedaText": "", "audioFile": "PB_hear2read_001233.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001234", "originalText": "दृष्टद्वारे सम्भवति अदृष्टकल्पनायोगात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001234.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001235", "originalText": "यदि त्वनलसस्य धीमतः पुरुषधौरेयस्य आश्रमान्तरस्थस्यापि कर्मच्छिद्रेषु श्रवणादिसम्पद्यते, तदा चतुर्ष्वाश्रमेषु सन्न्यासाश्रमपरिग्रहेणैव श्रवणादि निर्वर्तनीयमिति नियमोऽभ्युपेयः— इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001235.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001236", "originalText": "ननु अस्मिन् पक्षद्वये क्षत्रियवैश्ययोः कथं वेदान्तश्रवणाद्यनुष्ठानम्? सन्न्यासस्य ब्राह्मणाधिकारिकत्वात्, ‘ब्राह्मणो निर्वेदमायात्’ ‘ब्राह्मणो व्युत्थाय’ ‘ब्राह्मणः प्रव्रजेत्’ इति सन्न्यासविधिषु ब्राह्मणग्रहणात्, ‘अधिकारिविशेषस्य ज्ञानाय ब्राह्मणग्रहः।", "padacchedaText": "", "audioFile": "PB_hear2read_001236.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001237", "originalText": "न सन्न्यासविधिर्यस्माच्छ्रुतौ क्षत्रियवैश्ययो:।", "padacchedaText": "", "audioFile": "PB_hear2read_001237.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001238", "originalText": "’ (बृ.वा. ३. ५. ८८) इति वार्तिकोक्तेश्च−इति चेत्।", "padacchedaText": "", "audioFile": "PB_hear2read_001238.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001239", "originalText": "अत्र केचित्— ‘यदि वेतरथा ब्रह्मचर्यादेव प्रव्रजेत् गृहाद्वा वनाद्वा’ (जा.उ. ४) इत्यविशेषश्रुत्या ‘ब्राह्मणः क्षत्रियो वापि वैश्यो वा प्रव्रजेत् गृहात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001239.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001240", "originalText": "त्रयाणामपि वर्णानाममी चत्वार आश्रमाः।", "padacchedaText": "", "audioFile": "PB_hear2read_001240.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001241", "originalText": "’ इति स्मृत्यनुगृहीतया क्षत्रियवैश्ययोरपि सन्न्यासाधिकारसिद्धेः श्रुत्यन्तरेषु ब्राह्मणग्रहणं त्रयाणामुपलक्षणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001241.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001242", "originalText": "अत एव वार्तिकेऽपि ‘अधिकारिविशेषस्य’ इति श्लोकेन भाष्याभिप्रायमुक्त्वा ‘त्रयाणामविशेषेण सन्न्यासः श्रूयते श्रुतौ।", "padacchedaText": "", "audioFile": "PB_hear2read_001242.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001243", "originalText": "यदोपलक्षणार्थं स्यात् ब्राह्मणग्रहणं तदा।", "padacchedaText": "", "audioFile": "PB_hear2read_001243.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001244", "originalText": "’ (बृ.वा. ३. ५. ८९) इत्यनन्तरश्लोकेन स्वमते क्षत्रियवैश्ययोरपि सन्न्यासाधिकारो दर्शित इति— तयोः श्रवणाद्यनुष्ठानसिद्धिं समर्थयन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_001244.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001245", "originalText": "अन्ये तु—अनेकेषु सन्न्यासविधिवाक्येषु ब्राह्मणग्रहणात्, उदाहृतजाबालश्रुतौ सन्न्यासविधिवाक्ये ब्राह्मणग्रहणाभावेऽपि श्रुत्यन्तरसिद्धं ब्राह्मणाधिकारमेव सिद्धं कृत्वा सन्न्यासावस्थायाम् ‘अयज्ञोपवीती कथं ब्रह्मणः’ इति ब्राह्मणपरामर्शाच्च ब्राह्मणस्यैव सन्न्यासाधिकारः।", "padacchedaText": "", "audioFile": "PB_hear2read_001245.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001246", "originalText": "विरोधाधिकरणन्यायेन श्रुत्यविरुद्धस्यैव स्मृत्यर्थस्य सङ्ग्राह्यत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001246.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001247", "originalText": "यत्तु सन्न्यासस्य सर्वाधिकारत्वेन वार्तिकवचनं तत् विद्वत्सन्न्यासविषयम्, न तु आतुरविविदिषासन्न्यासे‌ भाष्याभिप्रायविरुद्धसर्वाधिकारप्रतिपादनपरम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001247.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001248", "originalText": "‘सर्वा(कर्मा)धिकारविच्छेदि विज्ञानं चेदुपेयते। कुतोऽधिकारनियमो व्युत्थाने क्रियते बलात्॥", "padacchedaText": "", "audioFile": "PB_hear2read_001248.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001249", "originalText": "’ (बृ.वा. ३. ५. ९०) इत्यनन्तरश्लोकेन ब्रह्मज्ञानोदयानन्तरं जीवन्मुक्तिकाले विद्वत्सन्न्यास एव अधिकारनियमनिराकरणात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001249.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001250", "originalText": "एवं च − ब्राह्मणानामेव श्रवणाद्यनुष्ठाने सन्न्यासोऽङ्गम्, क्षत्रियवैश्ययोः तन्निरपेक्षः श्रवणाद्यधिकार इति, तयोः श्रवणाद्यनुष्ठाननिर्वाहः।", "padacchedaText": "", "audioFile": "PB_hear2read_001250.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001251", "originalText": "न हि सन्न्यासस्य श्रवणापेक्षितत्वपक्षे श्रवणमात्रस्य तदपेक्षा नियन्तुं शक्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001251.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001252", "originalText": "क्रममुक्तिफलकसगुणोपासनया देवभागं प्राप्तस्य श्रवणादौ सन्न्यासनैरपेक्ष्यस्य अवश्यं वक्तव्यत्वात्, देवानां कर्मानुष्ठानाप्रसक्त्या तत्त्यागरूपस्य सन्न्यासस्य तेष्वसम्भवात्— इत्याहुः।", "padacchedaText": "", "audioFile": "PB_hear2read_001252.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001253", "originalText": "अपरे तु ‘ब्रह्मसंस्थोऽमृतत्वमेति’ (छा.उ. २. २३. १) इति श्रुत्युदिता यस्य ब्रह्मणि संस्थासमाप्तिः— अनन्यव्यापारत्वरूपं तन्निष्ठत्वं तस्य श्रवणादिषु मुख्याधिकारः।", "padacchedaText": "", "audioFile": "PB_hear2read_001253.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001254", "originalText": "‘गच्छतस्तिष्ठतो वापि जाग्रतः स्वपतोऽपि वा।", "padacchedaText": "", "audioFile": "PB_hear2read_001254.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001255", "originalText": "न विचारपरं चेतो यस्यासौ मृत उच्यते। आसुप्तेरामृतेः कालं नयेद्वेदान्तचिन्तया॥", "padacchedaText": "", "audioFile": "PB_hear2read_001255.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001256", "originalText": "’ इत्यादिस्मृतिषु सर्वदा विचारविधानात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001256.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001257", "originalText": "सा च ब्रह्मणि संस्था विना सन्न्यासम् आश्रमान्तरस्थस्य न सम्भवति स्वस्वाश्रमविहितकर्मानुष्ठानवैयग्र्यात्, इति सन्न्यासरहितयोः क्षत्रियवैश्ययोः न मुख्य: श्रवणाद्यधिकारः।", "padacchedaText": "", "audioFile": "PB_hear2read_001257.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001258", "originalText": "किं तु ‘दृष्टार्था च विद्या प्रतिषेधाभावमात्रेणाप्यर्थिनमधिकरोति श्रवणादिषु’ इति ‘अन्तरा चापि तु तद्दृष्टेः’ (ब्र.सू. ३. ४. ३६) इत्यधिकरणभाष्योक्तन्यायेन शूद्रवदप्रतिषिद्धयोस्तयोः विधुरादीनामिव देहान्तरे विद्याप्रापकेण अमुख्याधिकारमात्रेण श्रवणाद्यनुमतिः।", "padacchedaText": "", "audioFile": "PB_hear2read_001258.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001259", "originalText": "न हि ‘अन्तरा चापि तु तद्दृष्टेः’ (ब्र.सू. ३. ४. ३६) इत्यधिकरणे विधुरादीनामङ्गीकृतः श्रवणाद्यधिकारो मुख्य इति वक्तुं शक्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001259.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001260", "originalText": "‘अतस्त्वितरज्ज्यायो लिङ्गाच्च’ (ब्र.सू. ३. ४. ३९) इति सूत्रकारेणैव तेषाममुख्याधिकारस्फुटीकरणात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001260.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001261", "originalText": "न च−तत्र तेषां श्रवणाद्यधिकार एव नोक्तः, किं तु तदीयकर्मणां विद्यानुग्राहकत्वमिति शङ्क्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001261.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001262", "originalText": "‘दृष्टार्था च विद्या’ इत्युदाहृततदधिकरणभाष्यविरोधात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001262.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001263", "originalText": "न च − क्षत्रियवैश्ययोः सन्न्यासाभावात् अमुख्याधिकारे तत एव देवानामपि श्रवणादिष्वमुख्य एवाधिकारः स्यात्, तथा च क्रममुक्तिफलकसगुणविद्यया देवदेहं प्राप्य श्रवणाद्यनुतिष्ठतां विद्याप्राप्त्यर्थं सन्न्यासार्हं पुनर्ब्राह्मणजन्म वक्तव्यमिति ‘ब्रह्मलोकमभिसम्पद्यते, न च पुनरावर्तते’ (छा.उ. ८. १५. १) ‘अनावृत्तिः शब्दात्’ (ब्र.सू. ४. ४. २२) इत्यादिश्रुतिसूत्रविरोधः इति— वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001263.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001264", "originalText": "देवानामनुष्ठेयकर्मवैयग्र्याभावात् स्वत एव अनन्यव्यापारत्वं सम्भवतीति क्रममुक्तिफलकसगुणविद्याभिधायिशास्त्रप्रामाण्यात् विनाऽपि सन्न्यासं तेषां मुख्याधिकाराभ्युपगमात् इत्याहुः।", "padacchedaText": "", "audioFile": "PB_hear2read_001264.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001265", "originalText": "ननु— अमुख्याधिकारिणा दृष्टफलभूतवाक्यार्थावगत्यर्थम् अविहितशास्त्रान्तरविचारवत् क्रियमाणो वेदान्तविचारः कथं जन्मान्तरविद्यावाप्तावुपयुज्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001265.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001266", "originalText": "न खल्वद्यतनविचारस्य दिनान्तरीयविचार्यावगतिहेतुत्वमपि युज्यते, दूरे जन्मान्तरीयतद्धेतुत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001266.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001267", "originalText": "न च वाच्यं— मुख्याधिकारिणा परिव्राजकेन क्रियमाणमपि श्रवणं दृष्टार्थमेव, अवगतेर्दृष्टार्थत्वात्, तस्य यथा प्रारब्धकर्मविशेषरूपप्रतिबन्धात् इह जन्मनि फलमजनयतो जन्मान्तरे प्रतिबन्धकापगमेन फलजनकत्वम् ‘ऐहिकमप्यप्रस्तुतप्रतिबन्धे तद्दर्शनात्’ (ब्र.सू. ३. ४. ५१) इत्यधिकरणे तथा निर्णयात्, एवममुख्याधिकारिकृतस्यापि स्यात् इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001267.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001268", "originalText": "यतः शास्त्रीयाङ्गयुक्तं श्रवणम् अपूर्वविधित्वपक्षे फलपर्यन्तमपूर्वं नियमविधित्वपक्षे नियमादृष्टं वा जनयति, तच्च जातिस्मरत्वप्रापकादृष्टवत् प्राग्भवीयसंस्कारमुद्बोध्य तन्मूलभूतस्य विचारस्य जन्मान्तरीयविद्योपयोगितां घटयतीति युज्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001268.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001269", "originalText": "शास्त्रीयाङ्गविधुरं श्रवणं नादृष्टोत्पादकमिति कुतस्तस्य जन्मान्तरीयविद्योपयोगित्वमुपपद्यते, घटकादृष्टं विना जन्मान्तरीयप्रमाणव्यापारस्य जन्मान्तरीयावगतिहेतुत्वोपगमे अतिप्रसङ्गात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001269.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001270", "originalText": "उच्यते−अमुख्याधिकारिणाऽपि उत्पान्नविविदिषेण क्रियमाणं श्रवणं द्वारभूतविविदिषोत्पादकप्राचीनविद्यार्थयज्ञाद्यनुष्ठानजन्यापूर्वप्रयुक्तमिति तदेवापूर्वं विद्यारूपफलपर्यन्तं व्याप्रियमाणं जन्मान्तरीयायामपि विद्यायां स्वकारितश्रवणस्य उपकारितां घटयतीति नानुपपत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_001270.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001271", "originalText": "श्रवणादौ विध्यभावपक्षे तु सन्न्यासपूर्वकं कृतस्यापि श्रवणस्य अदृष्टानुत्पादकत्वात् प्रतिबन्धके सति तस्य जन्मान्तरीयविद्याहेतुत्वम् इत्थमेव निर्वाह्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001271.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001272", "originalText": "आचार्यास्तु−नियमविधिपक्षेऽपि अयमेव निर्वाहः।", "padacchedaText": "", "audioFile": "PB_hear2read_001272.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001273", "originalText": "श्रवणमभ्यस्यतः फलप्राप्तेरर्वाक् प्रायेण तन्नियमादृष्टानुत्पत्तेः, तस्य फलपर्यन्तावृत्तिगुणकश्रवणानुष्ठाननियमसाध्यत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001273.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001274", "originalText": "न हि नियमादृष्टजनकश्रवणनियमः फलपर्यन्तमावर्तनीयस्य श्रवणस्य उपक्रममात्रेण निर्वर्तितो भवति, येन तज्जन्यनियमादृष्टस्यापि फलपर्यन्तश्रवणावृत्तेः प्रागेवोत्पत्तिः सम्भाव्येत।", "padacchedaText": "", "audioFile": "PB_hear2read_001274.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001275", "originalText": "अवघातवत् आवृत्तिगुणकस्यैव श्रवणस्य फलसाधनत्वेन फलसाधनपदार्थनिष्पत्तेः प्राक् तन्नियममनिर्वर्तिवचनस्य निरालम्बनत्वात्, श्रवणावघाताद्युपक्रममात्रेण नियमनिष्पत्तौ तावतैव नियमशास्त्रानुष्ठानं सिद्धमिति तदनावृत्तावप्यवैकल्यप्रसङ्गाच्च—इत्याहुः।", "padacchedaText": "", "audioFile": "PB_hear2read_001275.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001276", "originalText": "केचित्तु—दृष्टार्थस्यैव वेदान्तश्रवणस्य ‘दिने दिने तु वेदान्तश्रवणात् भक्तिसंयुतात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001276.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001277", "originalText": "गुरुशुश्रूषया लब्धात् कृच्छ्राशीतिफलं लभेत्’ इत्यादिवचनप्रामाण्यात् स्वतन्त्रादृष्टोत्पादकत्वमप्यस्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_001277.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001278", "originalText": "यथा अग्निसंस्कारार्थस्याधानस्य पुरुषसंस्कारेषु परिगणनात् तदर्थत्वमपि, एवं वचनबलादुभयार्थत्वोपपत्ते:।", "padacchedaText": "", "audioFile": "PB_hear2read_001278.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001279", "originalText": "तथा च प्रतिदिनश्रवणजनितादृष्टमहिम्नैव आमुष्मिकविद्योपयोगित्वं श्रवणमननादिसाधनानाम्— इत्याहुः।", "padacchedaText": "", "audioFile": "PB_hear2read_001279.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001280", "originalText": "निर्गुणोपासनात्मकयोगस्य ब्रह्मसाक्षात्कारसाधनत्वनिरूपणम्\nएवं श्रवणमननादिसाधनानुष्ठानात् (प्रणाल्या) (प्रवणस्य) विद्यावाप्तिः इत्यस्मिन्नर्थे सर्वसम्प्रतिपन्ने स्थिते भारतीतीर्थाः ध्यानदीपे विद्यावाप्तौ उपायान्तरमप्याहुः—\n‘तत् कारणं साङ्ख्ययोगाभिपन्नम्’ (श्वे.उ. ६. १३) ‘यत्साङ्ख्यैः प्राप्यते स्थानं तद्योगैरपि गम्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001280.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001281", "originalText": "’ (भ.गी. ५. ५) इति श्रुतिस्मृतिदर्शनात् यथा सङ्ख्यं नाम वेदान्तविचारः श्रवणशब्दितो मननादिसहकृतो विद्यावाप्त्युपायः, एवं योगशब्दितं निर्गुणब्रह्मोपासनमपि।", "padacchedaText": "", "audioFile": "PB_hear2read_001281.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001282", "originalText": "न च निर्गुणस्योपासनमेव नास्तीति शङ्क्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001282.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001283", "originalText": "प्रश्नोपनिषदि शैब्यप्रश्ने ‘यः पुनरेतं त्रिमात्रेणोमित्येतेनैवाक्षरेण परं पुरुषमभिध्यायीत’ (प्र.उ. ५. ५) इति निर्गुणस्यैवोपासनप्रतिपादनात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001283.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001284", "originalText": "तदनन्तरं ‘स एतस्माज्जीवघनात् परात् परं पुरिशयं पुरुषमीक्षते’ इति उपासनाफलवाक्ये ईक्षतिकर्मत्वेन निर्दिष्टं यन्निर्गुणं ब्रह्म, तदेवोपासनावाक्येऽपि ध्यायतिकर्म, नान्यत्।", "padacchedaText": "", "audioFile": "PB_hear2read_001284.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001285", "originalText": "ईक्षतिध्यानयोः कार्यकारणभूतयोरेकविषयत्वनियमात्— इत्यस्यार्थस्य ईक्षतिकर्माधिकरणे भाष्यकारादिभिरङ्गीकृतत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001285.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001286", "originalText": "अन्यत्रापि तापनीयकठवल्ल्यादिश्रुत्यन्तरे निर्गुणोपास्तेः प्रपञ्चितत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001286.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001287", "originalText": "सूत्रकृताऽपि उपास्यगुणपरिच्छेदार्थमारब्धे गुणोपसंहारपादे निर्गुणेऽपि ‘आनन्दादयः प्रधानस्य’ (ब्र.सू. ३. ३. ११) इति सूत्रेण भावरूपाणां ज्ञानानन्दादिगुणानाम् ‘अक्षरधियां त्ववरोधः’ (ब्र.सू. ३. ३. ३३) इत्यादिसूत्रेण अभावरूपाणामस्थूलत्वादिगुणानां चोपसंहारस्य दर्शितत्वाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_001287.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001288", "originalText": "ननु आनन्दादिगुणोपसंहारे उपास्यं निर्गुणमेव न स्यादिति चेत्, न—आनन्दादिभिरस्थूलत्वादिभिश्चोपलक्षितमखण्डैकरसं ब्रह्मास्मीति निर्गुणत्वानुपमर्दनेन उपासनासम्भवात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001288.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001289", "originalText": "ननु ‘तदेव ब्रह्म त्वं विद्धि नेदं यदिदमुपासते’ (के.उ. १. ५) इति श्रुतेः न परं ब्रह्मोपास्यमिति चेत्, ‘अन्यदेव तद्विदितात्’ (के.उ. १. ४) इति श्रुतेः तस्य वेद्यत्वस्याप्यसिद्ध्यापातात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001289.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001290", "originalText": "श्रुत्यन्तरेषु ब्रह्मवेदनप्रसिद्धेः अवेद्यत्वश्रुतिर्वास्तवावेद्यत्वपरा चेत्, आथर्वणादौ तदुपासनप्रसिद्धेः तदनुपास्यत्वश्रुतिरपि वस्तुवृत्तपराऽस्तु।", "padacchedaText": "", "audioFile": "PB_hear2read_001290.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001291", "originalText": "एवं च ‘श्रवणायापि बहुभिर्यो न लभ्यः’ (क.उ. १. २. ७) इति श्रवणात् येषां बुद्धिमान्द्यात् न्यायव्युत्पादनकुशलविशिष्टगुर्वलाभाद्वा श्रवणादि न सम्भवति, तेषामध्ययनगृहीतैर्वेदान्तैरापाततोऽधिगमितब्रह्मात्मभावानां तद्विचारं विनैव प्रश्नोपनिषदाद्युक्तम् आर्षग्रन्थेषु ब्राह्मवासिष्ठादिकल्पेषु पञ्चीकरणादिषु च अनेकशाखाविप्रकीर्णसर्वार्थोपसंहारेण कल्पसूत्रेष्वग्निहोत्रादिवत् निर्धारितानुष्ठानप्रकारं निर्गुणोपासनं सम्प्रदायमात्रविद्भ्यो गुरुभ्योऽवधार्य तदनुष्ठानात् क्रमेण उपास्यभूतनिर्गुणब्रह्मसाक्षात्कारः सम्पद्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001291.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001292", "originalText": "अविसंवादिभ्रमन्यायेन उपास्तेरपि क्वचित् फलकाले प्रमापर्यवसानसम्भवात्, पाणौ पञ्च वराटकाः पिधाय केनचित् ‘करे कति वराटकाः’ इति पृष्टे ‘पञ्च वराटकाः’ इति तदुत्तरवक्तुः वाक्यप्रयोगमूलभूतसङ्ख्याविशेषज्ञानस्य मूलप्रमाणशून्यस्याहार्यारोपरूपस्यापि यथार्थत्ववत् निर्गुणब्रह्मोपासनस्य अर्थतथात्वविवेचकनिर्विचिकित्समूलप्रमाणनिरपेक्षस्य दहराद्युपासनवत् उपासनाशास्त्रमात्रमवलम्ब्य क्रियमाणस्यापि वस्तुतो यथार्थत्वेन दहराद्युपासनेनेव निर्गुणोपासनेन जन्यस्य स्वविषयसाक्षात्कारस्य श्रवणादिप्रणालीजन्यसाक्षात्कारवदेव तत्त्वार्थविषयत्वावश्यम्भावाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_001292.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001293", "originalText": "इयांस्तु विशेषः— प्रतिबन्धरहितस्य पुंसः श्रवणादिप्रणाड्या ब्रह्मसाक्षात्कारो झटिति सिध्यतीति साङ्ख्यमार्गो मुख्यः कल्पः, उपास्या तु विलम्बेनेति योगमार्गोऽनुकल्पः इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001293.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001294", "originalText": "ब्रह्मसाक्षात्कारकरणविचारः\nनन्वस्मिन् पक्षद्वयेऽपि ब्रह्मसाक्षात्कारे किं करणम्?\nकेचिदाहुः−प्रत्ययाभ्यासरूपं प्रसङ्ख्यानमेव।", "padacchedaText": "", "audioFile": "PB_hear2read_001294.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001295", "originalText": "योगमार्गे आदित आरभ्य उपासनरूपस्य साङ्ख्यमार्गे मननान्तरनिदिध्यासनरूपस्य च तस्य सत्त्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001295.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001296", "originalText": "न च तस्य ब्रह्मसाक्षात्कारकरणत्वे मानाभावः।", "padacchedaText": "", "audioFile": "PB_hear2read_001296.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001297", "originalText": "‘ततस्तु तं पश्यते निष्कलं ध्यायमानः’ (मु.उ. ३. १. ८) इति श्रवणात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001297.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001298", "originalText": "कामातुरस्य व्यवहितकामिनीसाक्षात्कारे प्रसङ्ख्यानस्य करणत्वक्लृप्तेश्च, ‘आ प्रायणात्तत्रापि हि दृष्टम्’ (ब्र.सू. ४. १. १२) इत्यधिकरणे ‘विकल्पोऽविशिष्टफलत्वात्’ (ब्र.सू. ३. ३. ५९) इत्यधिकरणे च दहराद्यहङ्ग्रहोपासकानां प्रसङ्ख्यानादुपास्यसगुणब्रह्मसाक्षात्काराङ्गीकाराच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_001298.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001299", "originalText": "ननु च−प्रसङ्ख्यानस्य प्रमाणपरिगणनेष्वपरिगणनात् तज्जन्यो ब्रह्मसाक्षात्कारः प्रमा न स्यात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001299.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001300", "originalText": "न च काकतालीयसंवादिवराटकसङ्ख्याविशेषाहार्यज्ञानवत् अर्थाबाधेन प्रमात्वोपपत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_001300.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001301", "originalText": "प्रमाणामूलकस्य प्रमात्वायोगात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001301.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001302", "originalText": "आहार्यवृत्तेश्च उपासनावृत्तिवत् ज्ञानभिन्नमानसक्रियारूपतया इच्छादिवदबाधितार्थविषयत्वेऽपि प्रमात्वानभ्युपगमात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001302.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001303", "originalText": "मैवम्, क्लृप्तप्रमाकरणामूलकत्वेऽपि ईश्वरमायावृत्तिवत् प्रमात्वोपपत्तेः, विषयाबाधतौल्यात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001303.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001304", "originalText": "मार्गद्वयेऽपि प्रसङ्ख्यानस्य विचारितादविचारिताद्वा वेदान्तात् ब्रह्मावगतिमूलकतया प्रसङ्ख्यानजन्यस्य ब्रह्मसाक्षात्कारस्य प्रमाणमूलकत्वाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_001304.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001305", "originalText": "उक्तं च कल्पतरुकारैः— “वेदान्तवाक्यजज्ञानभावनाजापरोक्षधीः। मूलप्रमाणदार्ढ्येन न भ्रमत्वं प्रपद्यते॥", "padacchedaText": "", "audioFile": "PB_hear2read_001305.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001306", "originalText": "” न च प्रामाण्यपरतस्त्वापत्तिस्तु प्रसज्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001306.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001307", "originalText": "अपवादनिरासाय मूलशुद्ध्यनुरोधात्” (ब्र.सू. १. १. १) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001307.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001308", "originalText": "अन्ये तु−‘एषोऽणुरात्मा चेतसा वेदितव्यः’ (मु.उ. ३. १. ९) ‘दृश्यते त्वग्र्यया बुद्ध्या’ (क.उ. १. ३. १२) इत्यादिश्रुतेः मन एव ब्रह्मसाक्षात्कारे करणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001308.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001309", "originalText": "तस्य सोपाधिकात्मनि अहंवृत्तिरूपप्रमाकरणत्वकॢप्तेः, ‘स्वप्नप्रपञ्चविपरीतप्रमात्रादिज्ञानसाधनस्यान्तःकरणस्य’ इत्यादिपञ्चपादिकाविवरणग्रन्थैरपि तथा प्रतिपादनात् ‘अहमेवेदं सर्वोऽस्मीति मन्यते सोऽस्य परमो लोकः’ (बृ.उ. ४. ३. २०) इति श्रुत्युक्ते स्वाप्ने ब्रह्मसाक्षात्कार एव मनसः करणत्वसम्प्रतिपत्तेश्च, तदा करणान्तराभावात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001309.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001310", "originalText": "प्रसङ्ख्यानं तु मनस्सहकारिभावेनापि उपयुज्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001310.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001311", "originalText": "‘वाक्यार्थभावनापरिपाकसहितमन्तःकरणं त्वंपदार्थस्यापरोक्षस्य तत्तदुपाध्याकारनिषेधेन तत्पदार्थताम् आविर्भावयति’ (ब्र.सू. १. १. १) इति भामतीवचनात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001311.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001312", "originalText": "‘ज्ञानप्रसादेन विशुद्धसत्त्वस्ततस्तु तं पश्यते निष्कलं ध्यायमानः’ (मु.उ. ३. १. ८) इति श्रुतावपि ज्ञानप्रसादशब्दितचित्तैकाग्र्यहेतुतयैव ध्यानोपादानात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001312.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001313", "originalText": "न तु प्रसङ्ख्यानं स्वयं करणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001313.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001314", "originalText": "तस्य क्कचिदपि ज्ञानकरणत्वाक्लृप्तेः, कामातुरकामिनीसाक्षात्कारादावपि प्रसङ्ख्यानसहकृतस्य मनस एव करणत्वोपपत्त्या अक्लृप्तज्ञानकरणान्तरकल्पनायोगात्— इत्याहुः।", "padacchedaText": "", "audioFile": "PB_hear2read_001314.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001315", "originalText": "अपरे तु−‘तद्धास्य विजज्ञौ’ (छा.उ. ६. १६. ३) ‘तमसः पारं दर्शयति’ (छा.उ. ७. २६. २) ‘आचार्यवान् पुरुषो वेद तस्य तावदेव चिरम्’ (छा.उ. ६. १४. २) इत्यादिश्रुतिषु आचार्योपदेशानन्तरमेव ब्रह्मसाक्षात्कारोदये जीवन्मुक्तिश्रवणात् ‘वेदान्तविज्ञानसुनिश्चितार्थाः’ (मु.उ. ३. २. ६) इति ज्ञानान्तरनैराकाङ्क्ष्यश्रवणात् ‘तं त्वौपनिषदं पुरुषम्’ (बृ.उ. ३. ९. २६) इति ब्रह्मण उपनिषदेकगम्यत्वश्रवणाच्च, औपनिषदं महावाक्यमेव ब्रह्मसाक्षात्कारे करणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001315.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001316", "originalText": "न मनः।", "padacchedaText": "", "audioFile": "PB_hear2read_001316.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001317", "originalText": "‘यन्मनसा न मनुते’ (के.उ. १. ६) इति तस्य ब्रह्मसाक्षात्कारकरणत्वनिषेधात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001317.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001318", "originalText": "न चापक्वमनोविषयमिदम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001318.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001319", "originalText": "‘येनाहुर्मनो मतम्’ (के.उ. १. ६) इति वाक्यशेषे मनोमात्रग्रहणात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001319.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001320", "originalText": "न चैवं ‘यद्वाचाऽनभ्युदितम्’ (के.उ. १. ५) इति शब्दस्यापि तत्करणत्वं निषिध्यत इति शङ्क्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001320.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001321", "originalText": "मनःकरणत्ववादिनामपि शब्दस्य निर्विशेषे परोक्षज्ञानकरणत्वस्याभ्युपगतत्वेन तस्य ‘यतो वाचो निवर्तन्ते अप्राप्य मनसा सह’ (तै.उ. २. ४. १) इति श्रुत्यनुरोधेन शब्दार्थप्राप्तिरूपशक्तिमुखेन शब्दस्य तत्करणत्वनिषेधे तात्पर्यस्य वक्तव्यतया शक्यसम्बन्धरूपलक्षणामुखेन तस्य तत्करणत्वाविरोधात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001321.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001322", "originalText": "न च ‘मनसैवानुद्रष्टव्यम्’ (बृ.उ. ४. ४. १९) इति श्रुतिसिद्धं मनसोऽपि तत्करणत्वं न पराकर्तुं शक्यमिति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001322.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001323", "originalText": "शाब्दसाक्षात्कारजननेऽपि तदैकाग्र्यस्यापेक्षितत्वेन हेतुत्वमात्रेण तृतीयोपपत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_001323.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001324", "originalText": "‘मनसा ह्येव पश्यति मनसा शृणोति’ (बृ.उ. १. ५. ३) इत्यादौ तथा दर्शनात्, गीताविवरणे भाष्यकारीयमनःकरणत्ववचनस्य मतान्तराभिप्रायेण प्रवृत्तेः— इत्याहुः।", "padacchedaText": "", "audioFile": "PB_hear2read_001324.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001325", "originalText": "शाब्दापरोक्षसमर्थनम्\nननु तथाऽपि शब्दस्य परोक्षज्ञानजनकत्वस्वभावस्यापरोक्षज्ञानजनकत्वं न सङ्गच्छते इति चेत् अत्र केचित्— स्वतोऽसमर्थोऽपि शब्दः शास्त्रश्रवणमननपूर्वकप्रत्ययाभ्यासजनितसंस्कारप्रचयलब्धब्रह्मैकाग्र्यवच्चित्तदर्पणानुगृहीतः अपरोक्षज्ञानमुत्पादयति, शास्रीयसंस्कारसहकृताग्न्यधिकरणक इव होमोऽपूर्वम्— इति कल्प्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001325.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001326", "originalText": "‘तरति शोकमात्मवित्’ (छा.उ. ७. १. ३) इति शास्त्रप्रामाण्यात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001326.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001327", "originalText": "अपरोक्षस्य कर्तृत्वाद्यध्यासस्य अपरोक्षाधिष्ठानज्ञानं विना निवृत्त्ययोगात्, औपनिषदे च ब्रह्मणि मानान्तराप्रवृत्तेः, शब्दादप्यपरोक्षज्ञानानुत्पत्तौ अनिर्मोक्षप्रसङ्गात् −इत्याहुः।", "padacchedaText": "", "audioFile": "PB_hear2read_001327.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001328", "originalText": "अन्ये तु−भावनाप्रचयसाहित्ये सति बहिरसमर्थस्यापि मनसो नष्टवनितासाक्षात्कारजनकत्वदर्शनात् निदिध्यासनसाहित्येन शब्दस्याप्यपरोक्षज्ञानजनकत्वं युक्तमिति दृष्टानुरोधेन समर्थयन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_001328.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001329", "originalText": "अपरे तु−अपरोक्षार्थविषयत्वं ज्ञानस्यापरोक्षत्वं नाम।", "padacchedaText": "", "audioFile": "PB_hear2read_001329.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001330", "originalText": "अन्यानिरुक्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_001330.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001331", "originalText": "अर्थापरोक्षत्वं तु नापरोक्षज्ञानविषयत्वम्, येनान्योन्याश्रयः स्यात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001331.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001332", "originalText": "किं तु तत्तत्पुरुषीयचैतन्याभेदः।", "padacchedaText": "", "audioFile": "PB_hear2read_001332.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001333", "originalText": "अन्तःकरणतद्धर्माणां साक्षिणि कल्पिततया तदभेदसत्त्वात्, बाह्यचैतन्ये कल्पितानां घटादीनां बाह्यचैतन्ये वृत्तिकृततत्तत्पुरुषीयचैतन्याभेदाभिव्यक्त्या तदभेदसत्त्वाच्च न क्वाप्यव्याप्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_001333.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001334", "originalText": "न च अन्तःकरणतद्धर्माणां ज्ञानादीनामिव धर्माधर्मसंस्काराणामपि साक्षिणि कल्पितत्वाविशेषात् आपरोक्ष्यापत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_001334.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001335", "originalText": "तेषामनुद्भूतत्वात्, उद्भूतस्यैव जडस्य चैतन्याभेदे आपरोक्ष्यम् इत्यभ्युपगमात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001335.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001336", "originalText": "एवं च सर्वदा सर्वपुरुषचैतन्याभिन्नत्वात् ‘यत्साक्षादपरोक्षाद्ब्रह्म’ (बृ.उ. ३. ४. १) इति श्रुत्या स्वत एवापरोक्षं ब्रह्मेति अपरोक्षार्थविषयत्वात् शाब्दस्यापि ब्रह्मज्ञानस्य अपरोक्षत्ववाचोयुक्तिर्युक्ता−इत्याहुः।", "padacchedaText": "", "audioFile": "PB_hear2read_001336.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001337", "originalText": "अद्वैतविद्याचार्यास्तु − नापरोक्षार्थविषयत्वं ज्ञानस्यापरोक्ष्यम्, स्वरूपसुखापरोक्षरूपस्वरूपज्ञानाव्यापनात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001337.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001338", "originalText": "स्वविषयत्वलक्षणस्वप्रकाशत्वनिषेधात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001338.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001339", "originalText": "किं तु यथा तत्तदर्थस्य स्वव्यवहारानुकूलचैतन्याभेदोऽर्थापरोक्ष्यम्, एवं तत्तद्व्यवहारानुकूलचैतन्यस्य तत्तदर्थाभेदो ज्ञानापरोक्ष्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001339.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001340", "originalText": "तथा च चैतन्यधर्म एवापरोक्ष्यम्, न त्वनुमितित्वादिवत् अन्तःकरणवृत्तिधर्मः।", "padacchedaText": "", "audioFile": "PB_hear2read_001340.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001341", "originalText": "अत एव सुखादिप्रकाशरूपे साक्षिणि स्वरूपसुखप्रकाशरूपे चैतन्ये च आपरोक्ष्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001341.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001342", "originalText": "न च घटाद्यैन्द्रियकवृत्तौ तदनुभवविरोधः।", "padacchedaText": "", "audioFile": "PB_hear2read_001342.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001343", "originalText": "अनुभवस्य वृत्त्यवच्छिन्नचैतन्यगतापरोक्ष्यविषयत्वोपपत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_001343.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001344", "originalText": "ननु उक्तं ज्ञानार्थयोरापरोक्ष्यं हृदयादिगोचरशाब्दवृत्तिशाब्दविषययोरतिप्रसक्तम्, तत्र दैवात् कदाचित् वृत्तिविषयसंसर्गे सति वृत्त्यवच्छिन्नचैतन्यस्य विषयावच्छिन्नचैतन्यस्य चाभेदाभिव्यक्तेः अवर्जनीयत्वात् इति चेत्, न−परोक्षवृत्तेः विषयावच्छिन्नचैतन्यगताज्ञाननिवर्तनाक्षमतया तत्र अज्ञानेनावृतस्य विषयचैतन्यस्य अनावृतेन वृत्त्यवच्छिन्नसाक्षिचैतन्येन अभेदाभिव्यक्तेरभावात् आपरोक्ष्याप्रसक्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_001344.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001345", "originalText": "अत एव जीवस्य संसारदशायां वस्तुतस्सत्यपि ब्रह्माभेदे न तदापरोक्ष्यम्, अज्ञानावरणकृतभेदसत्त्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001345.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001346", "originalText": "न चैवं ब्रह्मणो जीवापरोक्ष्यासम्भवात् असर्वज्ञत्वापत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_001346.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001347", "originalText": "अज्ञानस्य ईश्वरं प्रत्यनावारकतया तं प्रति जीवभेदानापादनात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001347.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001348", "originalText": "यं प्रति यदज्ञानमावारकं तस्य तं प्रत्येव स्वाश्रयभेदापादकत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001348.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001349", "originalText": "अत एव चैत्रज्ञानेन तस्य घटाज्ञाने निवृत्ते अनिवृत्तं मैत्राज्ञानं मैत्रं प्रत्येव विषयचैतन्यस्य भेदापादकमिति न चैत्रस्य घटापरोक्ष्यानुभवानुपपत्तिरपि।", "padacchedaText": "", "audioFile": "PB_hear2read_001349.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001350", "originalText": "ननु−एवं वृत्तिविषयचैतन्याभेदाभिव्यक्तिलक्षणस्यापरोक्ष्यस्य स्वविषयचैतन्यगताज्ञाननिवृत्तिप्रयोज्यत्वे तस्य अज्ञाननिवृत्तिप्रयोजकत्वायोगात् ज्ञानमात्रमज्ञाननिवर्तकं भवेदिति चेत्, न−यत् ज्ञानम् उत्पद्यमानं स्वकारणमहिम्ना विषयसंसृष्टमेवोत्पद्यते तदेवाज्ञाननिवर्तकमिति विशेषणात्, ऐन्द्रियकज्ञानानां तथात्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001350.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001351", "originalText": "एवं च शब्दादुत्पद्यमानमपि ब्रह्मज्ञानं सर्वोपादानभूतस्वविषयब्रह्मसंसृष्टमेव उत्पद्यत इति तस्याज्ञाननिवर्तकत्वम् अज्ञाननिवृत्तौ तन्मूलभेदप्रविलयादापरोक्ष्यं चेत्युपपद्यतेतराम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001351.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001352", "originalText": "नन्वेवम् अध्ययनगृहीतवेदान्तजन्येनापि तज्ज्ञानेन मूलाज्ञाननिवृत्त्या आपरोक्ष्यं किं न स्यात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001352.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001353", "originalText": "न च तत् सत्तानिश्चयरूपत्वाभावात् नाज्ञाननिवर्तकमिति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001353.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001354", "originalText": "तथापि कृतश्रवणस्य निर्विचिकित्सशाब्दज्ञानेन तन्निवृत्त्या मननादिवैयर्थ्यापत्तिरिति चेत्, न— सत्यपि श्रवणात् निर्विचिकित्सज्ञाने चित्तविक्षेपदोषेण प्रतिबन्धात् अज्ञाननानिवृत्त्या तन्निराकरणे मनननिदिध्यासननियमविध्यर्थानुष्ठानस्यार्थवत्त्वात्, भवान्तरीयमननाद्यनुष्ठाननिरस्तचित्तविक्षेपस्य उपदेशमात्रात् ब्रह्मापरोक्ष्यस्य इष्यमाणत्वाच्च इत्याहुः।", "padacchedaText": "", "audioFile": "PB_hear2read_001354.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001355", "originalText": "अथैवमपि−कृतनिदिध्यासनस्य वेदान्तजन्यब्रह्मज्ञानेनेव घटादिज्ञानेनापि ब्रह्मज्ञाननिवृत्तिः किं न स्यात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001355.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001356", "originalText": "न च तस्य ब्रह्माविषयत्वात् न ततो ब्रह्माज्ञाननिवृत्तिरिति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001356.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001357", "originalText": "‘घटस्सन्’ इत्यादिबुद्धिवृत्तेः सद्रूपब्रह्मविषयत्वोपगमात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001357.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001358", "originalText": "न च तत्र घटाद्याकारवृत्त्या तदज्ञाननिवृत्तौ स्वतःस्फुरणादेव तदवच्छिन्नं चैतन्यं सदिति प्रकाशते, न तस्य घटाद्याकारवृत्तिविषयत्वमिति— वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001358.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001359", "originalText": "तदभावे घटविषयं ज्ञानं तदवच्छिन्नचैतन्यविषयमज्ञानमिति भिन्नविषयेण ज्ञानेन तदज्ञाननिवृत्तेरयोगात्, जडे आवरणकृत्याभावेन घटस्याज्ञानाविषयत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001359.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001360", "originalText": "न च घटादिवृत्तेः तदवच्छिन्नचैतन्यविषयत्वेऽपि अखण्डानन्दाकारत्वाभावात् न ततो मूलाज्ञाननिवृत्तिरिति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001360.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001361", "originalText": "वेदान्तजन्यसाक्षात्कारेऽपि तदभावात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001361.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001362", "originalText": "न हि तत्र अखण्डत्वमानन्दत्वं वा कश्चिदस्ति प्रकारः।", "padacchedaText": "", "audioFile": "PB_hear2read_001362.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001363", "originalText": "वेदान्तानां संसर्गागोचरप्रमाजनकत्वलक्षणाखण्डार्थत्वहानापत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_001363.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001364", "originalText": "न च वेदान्तजन्यज्ञानादेव तन्निवृत्तिनियम इति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001364.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001365", "originalText": "क्लृप्ताज्ञाननिवर्तकत्वप्रयोजकस्य रूपस्य ज्ञानान्तरेऽपि सद्भावे तथानियन्तुमशक्यत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001365.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001366", "originalText": "न च घटाद्याकारवृत्तिविषयस्यावच्छिन्नचैतन्यस्यापि कल्पितत्वेन यत् मूलाज्ञानविषयभूतं सत्यमनवच्छिन्नचैतन्यं तद्विषयत्वाभावात् घटादिवृत्तीनां निवर्त्यत्वाभिमताज्ञानसमानविषयत्वलक्षणं कॢप्तप्रयोजकमेव नास्तीति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001366.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001367", "originalText": "तत्र अवच्छेदकांशस्य कल्पितत्वेऽपि अवच्छेद्यांशस्य अकल्पितमूलाज्ञानविषयचैतन्यरूपत्वात्, तस्य कल्पितत्वे घटवज्जडतया अवस्थाज्ञानं प्रत्यपि विषयत्वायोगेन अवस्थाज्ञानस्य मूलाज्ञानविषयाकल्पितचैतन्यविषयत्वस्य वक्तव्यतया तन्निवर्तकघटादिज्ञानस्यापि तद्विषयत्वावश्यम्भावेन तत्पक्षेऽपि ततो मूलाज्ञाननिवृत्तिप्रसङ्गस्य अपरिहारात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001367.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001368", "originalText": "घटादिज्ञानानां मूलाज्ञानानिवर्तकत्वसमर्थनम्\nअत्राहुः आचार्याः − न चैतन्यं चक्षुरादिजन्यवृत्तिविषयः।", "padacchedaText": "", "audioFile": "PB_hear2read_001368.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001369", "originalText": "‘न सन्दृशे तिष्ठति रूपमस्य न चक्षुषा पश्यति कश्चनैनम्’ (क.उ. २. ३. ९) ‘पराञ्चि खानि व्यतृणत्स्वयम्भूस्तस्मात्पराङ् पश्यति नान्तरात्मन्’ (क.उ. २. १. १) इत्यादिश्रुत्या तस्य परमाण्वादिवत् चक्षुराद्ययोग्यत्वोपदेशात् ‘औपनिषदम्’ इति विशेषणाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_001369.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001370", "originalText": "न च ‘सर्वप्रत्ययवेद्ये (वा) (च) ब्रह्मरूपे व्यवस्थिते।", "padacchedaText": "", "audioFile": "PB_hear2read_001370.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001371", "originalText": "’ इत्यादिवार्तिकविरोधः।", "padacchedaText": "", "audioFile": "PB_hear2read_001371.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001372", "originalText": "तस्य घटाद्याकारवृत्त्युदये सति आवरणाभिभवात् स्वप्रभं सद्रूपं ब्रह्म ‘घटस्सन्’ इति घटवद्व्यवहार्यं भवतीति औपचारिकघटादिवृत्तिवेद्यत्वपरत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001372.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001373", "originalText": "आवरणाभिभावकत्वं च घटादिज्ञानस्य घटादिविषयत्वादेव उपपन्नम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001373.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001374", "originalText": "घटादेरप्यज्ञानविषयत्वात् ‘घटं न जानामि’ ‘घटज्ञानेन घटाज्ञानं नष्टम्’ इति अवस्थाज्ञानस्य घटादिविषयत्वानुभवात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001374.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001375", "originalText": "न च— तत्र आवरणकृत्याभावादज्ञानाङ्गीकारो न युक्तः, तद्भासकस्य तदवच्छिन्नचैतन्यस्य आवरणादेव तदप्रकाशोपपत्तेरिति−वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001375.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001376", "originalText": "उक्तभङ्ग्या जडस्य साक्षादज्ञानविषयत्वस्य प्रतिक्षेपेऽपि जडावच्छिन्नचैतन्यप्रकाशस्याज्ञानेनावरणम्, ततो नित्यचैतन्यप्रकाशसंसर्गेऽपि जडस्य ‘नास्ति न प्रकाशते’ इत्यादिव्यवहारयोग्यत्वमिति परम्परया अज्ञानविषयत्वाभ्युपगमात् साक्षात्परम्परया वा यदज्ञानावरणीयं तद्विषयत्वस्यैव ज्ञानस्य तदज्ञाननिवर्तकत्वप्रयोजकशरीरे निवेशात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001376.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001377", "originalText": "न चैवं घटादीनामुक्तरीत्या मूलाज्ञानविषयत्वमपीति घटादिसाक्षात्कारादेव मूलाज्ञाननिवृत्त्यापातः।", "padacchedaText": "", "audioFile": "PB_hear2read_001377.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001378", "originalText": "फलबलात् तदज्ञानकार्यातिरिक्ततद्विषयविषयकत्वस्यैव तन्निवर्तकत्वे तन्त्रत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001378.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001379", "originalText": "अथवा, मूलाज्ञानस्यैव जडं न विषयः।", "padacchedaText": "", "audioFile": "PB_hear2read_001379.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001380", "originalText": "अवस्थाज्ञानानां तु अवच्छिन्नचैतन्याश्रितानां तत्तज्जडमेव विषयः।", "padacchedaText": "", "audioFile": "PB_hear2read_001380.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001381", "originalText": "अन्यथा चाक्षुषवृत्त्या चन्दनखण्डचैतन्याभिव्यक्तौ तत्संसर्गिणो गन्धस्याप्यापरोक्ष्यापत्तेः, तदनभिव्यक्तौ चन्दनतद्रूपयोरप्यप्रकाशापत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_001381.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001382", "originalText": "न च— चाक्षुषवृत्त्या चन्दनतद्रूपावच्छिन्नचैतन्ययोरभिव्यक्त्या तयोः प्रकाशः, गन्धाकारवृत्त्यभावेन गन्धावच्छिन्नचैतन्यस्यानभिव्यक्त्या तस्याप्रकाशश्चेति— वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001382.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001383", "originalText": "चैतन्यस्य द्विगुणीकृत्य वृत्त्ययोगेन एकद्रव्यगुणानां स्वाश्रये सर्वत्र व्याप्य वर्तमानानां पृथक्पृथग्गगनावच्छेदकत्वस्येव चैतन्यावच्छेदकत्वस्याप्यसम्भवात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001383.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001384", "originalText": "तेषां स्वाश्रयद्रव्यावच्छिन्नचैतन्येनैव शुक्तीदमंशावच्छिन्नचैतन्येन शुक्तिरजतवत् प्रकाश्यतया तस्याभिव्यक्तौ गन्धस्यापि (आपरोक्ष्यापत्तेः) प्रकाशस्य अनभिव्यक्तौ रजतादेरप्यप्रकाशस्य चापत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_001384.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001385", "originalText": "न च गन्धाकारवृत्त्युपरक्त एव चैतन्ये गन्धः प्रकाशत इति नियमः।", "padacchedaText": "", "audioFile": "PB_hear2read_001385.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001386", "originalText": "प्रकाशसंसर्गस्यैव प्रकाशमानशब्दार्थत्वेन असत्यामपि तदाकारवृत्तौ अनावृतप्रकाशसंसर्गे अप्रकाशमानत्वकल्पनस्य विरुद्धत्वात्, अभिव्यक्तस्य च गन्धोपादानचैतन्यस्य गन्धासंसर्गोक्त्यसम्भवात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001386.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001387", "originalText": "तस्मात् यथा चैत्रस्य घटवृत्तौ तं प्रत्यावरकस्यैवाज्ञानस्य निवृत्तिरिति तस्यैव विषयप्रकाशो नान्यस्य, तथा तत्तद्विषयाकारवृत्त्या तत्तदावारकाज्ञानस्यैव निवृत्तेः न विषयान्तरस्यापरोक्ष्यम्, ‘अनावृतार्थस्यैव संविदभेदात् आपरोक्ष्यम् ‘इत्यभ्युपगमादिति प्रमातृभेदेनेव विषयभेदेनाप्येकत्र चैतन्ये अवस्थाज्ञानभेदस्य वक्तव्यतया अवस्थाज्ञानानां तत्तज्जडविषयकत्वमिति घटादिवृत्तीनां नावस्थाज्ञाननिवर्तकत्वे काचिदनुपपत्तिः, न वा मूलाज्ञाननिवर्तकत्वापत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_001387.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001388", "originalText": "न चैवमपि जीवविषयाया अहमाकारावृत्तेर्मूलाज्ञाननिवर्तकत्वापत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_001388.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001389", "originalText": "तस्याः स्वयम्प्रकाशमानचित्संवलिताचिदंशमात्रविषयत्वात्, ‘सोऽहम्’ इति प्रत्यभिज्ञाया अपि स्वयम्प्रकाशे चैतन्ये अन्तःकरणवैशिष्ट्येन सह पूर्वापरकालवैशिष्ट्यमात्रविषयत्वेन चैतन्यविषयत्वाभावात् − इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001389.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001390", "originalText": "केचित्तु— घटादिवृत्तीनां तत्तदवच्छिन्नचैतन्यविषयत्वमभ्युपगम्य ‘सर्वमानप्रसक्तौ च सर्वमानफलाश्रयात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001390.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001391", "originalText": "श्रोतव्येतिवचः प्राह वेदान्तावरुरुत्सया’ (बृ.वा. २. ४. २१२) इति वार्तिकोक्तश्रोतव्यवाक्यार्थवेदान्तनियमविध्यनुसारेण वेदान्तजन्यमेव नियमादृष्टसहितं ब्रह्मज्ञानमप्रतिबद्धं ब्रह्माज्ञाननिवर्तकमिति घटादिज्ञानान्न तन्निवृत्तिप्रसङ्गः−इत्याहुः।", "padacchedaText": "", "audioFile": "PB_hear2read_001391.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001392", "originalText": "अन्ये तु−तत्त्वमस्यादिवाक्यजन्यं जीवब्रह्माभेदगोचरमेव ज्ञानं मूलाज्ञाननिवर्तकम्, मूलाज्ञानस्य तदभेदगोचरत्वात्, इति न चैतन्यस्वरूपमात्रगोचरात् घटादिज्ञानात्तन्निवृत्तिप्रसङ्गः।", "padacchedaText": "", "audioFile": "PB_hear2read_001392.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001393", "originalText": "न च अभेदस्य तत्त्वावेदकप्रमाणबोध्यस्य चैतन्यातिरेके द्वैतापत्तेः चैतन्यमात्रमभेदः इति तद्गोचरं घटादिज्ञानमप्यभेदगोचरमिति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001393.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001394", "originalText": "नह्यभेदज्ञानमिति विषयतो विशेषं ब्रूमः, किं तु तत्त्वम्पदवाच्यार्थधर्मिद्वयपरामर्शादिरूपकारणविशेषाधीनेन स्वरूपसम्बन्धविशेषेण चैतन्यविषयत्वमेव तदभेदज्ञानत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001394.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001395", "originalText": "यथा हि विशेषणविशेष्यतत्सम्बन्धगोचरत्वाविशेषेऽपि विशिष्टज्ञानस्य विशेषणज्ञानादिकारणविशेषाधीनस्वरूपसम्बन्धविशेषेण तत्त्रितयगोचरत्वमेव समूहालम्बनव्यावृत्तं विशिष्टज्ञानत्वम्, यथा वा ‘स्थाणुत्वपुरुषत्ववान्’ इत्याहार्यवृत्तिव्यावृत्तं संशयत्वम्, विषयतो विशेषानिरूपणात्, तथा घटादावपि ‘सोऽयं घटः’ इत्यादिज्ञानस्य स्वरूपसम्बन्धविशेषेण घटादिविषयत्वमेव केवलघटशब्दादिजन्यज्ञानव्यावृत्तं तदभेदज्ञानत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001395.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001396", "originalText": "अतिरिक्ताभेदानिरूपणात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001396.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001397", "originalText": "अभावसादृश्यादीनामधिकरणप्रतियोग्यादिभिः स्वरूपसम्बन्धयुक्तानाम् अधिकरणेन आधाराधेयभावरूपः स्वरूपसम्बन्धविशेषः प्रतियोगिना प्रतियोग्यनुयोगिभावरूपः, इत्यादिप्रकारेण स्वरूपसम्बन्धे अवान्तरविशेषकल्पनावत् वृत्तीनां विषयेऽपि संयोगतादात्म्ययोरतिप्रसक्त्या विषयैः विषयविषयिभावरूपस्वरूपसम्बन्धवतीनां विषयविशेषनिरूपणासम्भवे क्लृप्त एव स्वरूपसम्बन्धे अवान्तरविशेषकल्पनेन अभेदज्ञानत्वादिपरस्परवैलक्षण्यनिर्वाहाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_001397.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001398", "originalText": "एवं च ब्रह्मज्ञानस्य अभेदाख्यकिञ्चित्संसर्गगोचरत्वानभ्युपगमात् न वेदान्तानामखण्डार्थत्वहानिरपि−इत्याहुः।", "padacchedaText": "", "audioFile": "PB_hear2read_001398.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001399", "originalText": "ब्रह्मज्ञानस्य मूलाज्ञाननिवर्तकत्वसमर्थनम्\nननु − घटादिज्ञानवत् ब्रह्मज्ञानस्यापि न मूलाज्ञाननिवर्तकत्वं युक्तम्, निवर्तकत्वे तदवस्थानासहिष्णुत्वरूपस्य विरोधस्य तन्त्रत्वात्, कार्यस्य चोपादानेन सह तादृशविरोधाभावात् इति चेत् − न— कार्यकारणयोः अन्यत्र तादृशविरोधादर्शनेऽपि एकविषयज्ञानाज्ञानभावप्रयुक्तस्य तादृग्विरोधस्य अत्र सत्त्वात्, कार्यकारणयोरप्यग्निसंयोगपटयोः तादृशविरोधस्य दृष्टेश्च।", "padacchedaText": "", "audioFile": "PB_hear2read_001399.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001400", "originalText": "न च अग्निसंयोगात् अवयवविभागप्रक्रियया असमवायिकारणसंयोगनाशादेव पटनाशः नाग्निसंयोगादितिवाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001400.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001401", "originalText": "दग्धपटेऽपि पूर्वसंस्थानानुवृत्तिदर्शनेन मुद्गरचूर्णीकृतघटवदवयवविभागादर्शनात् तत्र अवयवविभागादिकल्पनाया अप्रामाणिकत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001401.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001402", "originalText": "नापि तत्र तन्तूनामपि दाहेन समवायिकारणनाशात् पटनाश इति युक्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001402.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001403", "originalText": "अंशुतन्त्वादिभिस्सह युगपदेव पटस्य दाहदर्शनेन क्रमकल्पनायोगात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001403.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001404", "originalText": "यतोऽधस्तात् नावयवनाशः तत्रावयवे अग्निसंयोगादेव नाशस्य वाच्यत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001404.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001405", "originalText": "ब्रह्मज्ञाननिवर्तकनिरूपणम्\nननु−अस्त्वेतदेवम्, तथापि सविलासाज्ञाननाशकमिदं ब्रह्मज्ञानं कथं नश्येत्, नाशकान्तरस्याभावात् − इति चेत्, न−यथा कतकरजः सलिलेन संयुज्य पूर्वयुक्तरजोऽन्तरविश्लेषं जनयत् स्वविश्लेषमपि जनयति, तथा आत्मन्यध्यस्यमानं ब्रह्मज्ञानं पूर्वाध्यस्तसर्वप्रपञ्चं निवर्तयत् स्वात्मानमपि निवर्तयतीति केचित्।", "padacchedaText": "", "audioFile": "PB_hear2read_001405.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001406", "originalText": "अन्ये तु अन्यन्निवर्त्य स्वयमपि निवृत्तौ दग्धलोहपीताम्बुन्यायमुदाहरन्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_001406.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001407", "originalText": "अपरे तु अत्र दग्धतृणकूटदहनोदाहरणमाहुः।", "padacchedaText": "", "audioFile": "PB_hear2read_001407.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001408", "originalText": "न च ध्वंसस्य प्रतियोग्यतिरिक्तजन्यत्वनियमः।", "padacchedaText": "", "audioFile": "PB_hear2read_001408.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001409", "originalText": "अप्रयोजकत्वात्, निरिन्धनदहनादि ध्वंसे व्यभिचाराच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_001409.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001410", "originalText": "न च— ध्वंसस्य प्रतियोगिमात्रजन्यत्वेऽतिप्रसङ्गात् कारणान्तरमवश्यं वाच्यम्, निरिन्धनदहनादिध्वंसेऽपि कालादृष्टेश्वरेच्छादिकारणान्तरमस्ति इति— वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001410.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001411", "originalText": "अतिप्रसङ्गापरिज्ञानात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001411.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001412", "originalText": "न च ‘घटादिध्वंसस्यापि कारणान्तरनिरपेक्षत्वं स्यात्’ इत्यतिप्रसङ्गः।", "padacchedaText": "", "audioFile": "PB_hear2read_001412.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001413", "originalText": "ध्वंसमात्रे कारणान्तरनैरपेक्ष्यानभिधानात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001413.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001414", "originalText": "न च घटध्वंसदृष्टान्तेन ब्रह्मज्ञानध्वंसस्य कारणान्तरापेक्षासाधनम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001414.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001415", "originalText": "तद्दृष्टान्तेन मुद्गरपतनापेक्षाया अपि साधनापत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_001415.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001416", "originalText": "नापि ज्ञानध्वंसत्वसाम्यात् घटज्ञानादिध्वंसस्यापि कारणान्तरनैरपेक्ष्यं स्यादित्यतिप्रसङ्गः।", "padacchedaText": "", "audioFile": "PB_hear2read_001416.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001417", "originalText": "सेन्धनानलध्वंसस्य जलसेकादिदृष्टकारणापेक्षत्वेऽपि निरिन्धनानलध्वंसस्य तदनपेक्षत्ववत्, जाग्रज्ज्ञानध्वंसस्य विरोधिविशेषगुणान्तरापेक्षत्वेऽपि सुषुप्तिपूर्वज्ञानध्वंसस्य तदनपेक्षत्ववच्च, मूलाज्ञाननिवर्तकज्ञानध्वंसस्य कारणान्तरसापेक्षत्वेऽपि तन्निवर्तकज्ञानध्वंसस्य तदनपेक्षत्वोपपत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_001417.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001418", "originalText": "नापि कारणान्तरनैरपेक्ष्ये स्वोत्पत्त्युत्तरक्षण एव नाशः स्यादित्यतिप्रसङ्गः।", "padacchedaText": "", "audioFile": "PB_hear2read_001418.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001419", "originalText": "इष्टापत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_001419.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001420", "originalText": "तदुत्पत्त्युत्तरक्षण एव ब्रह्माध्यस्तनिखिलप्रपञ्चदाहेन तदन्तर्गतस्य तस्यापि तदैव दाहाभ्युपगमात्, निरिन्धनदहनध्वंसन्यायेन ब्रह्मज्ञानध्वंसस्यापि कालादृष्टेश्वरेच्छादिकारणान्तरजन्यत्वेऽप्यविरोधाच्च, ‘सर्वप्रपञ्चनिवृत्त्यनन्तरम् एकशेषस्य ब्रह्मज्ञानस्य निवृत्तिः’ इत्यनभ्युपगमेन युगपत् सर्वदाहे पूर्वक्षणे चिदविद्यासम्बन्धरूपस्य द्रव्यान्तररूपस्य वा कालस्य ईश्वरप्रसादरूपस्यान्तःकरणगुणविशेषस्य वा अदृष्टस्य अन्येषां च सत्त्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001420.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001421", "originalText": "न च − तत्र ज्ञानातिरिक्तकारणापेक्षणे ब्रह्मज्ञानस्य अमिथ्यात्वप्रसङ्गः, ज्ञानैकनिवर्त्यत्वं मिथ्यात्वमित्यभ्युपगमात् इति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001421.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001422", "originalText": "ज्ञानाघटितसामग्र्यनिवर्त्यत्वे सति ज्ञाननिवर्त्यत्वस्य तदर्थत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001422.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001423", "originalText": "‘नान्यः पन्था’ (श्वे.उ. ३. ८) इति श्रुतेरपि तत्रैव ताप्तर्यात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001423.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001424", "originalText": "अतो युक्त एव दग्धदाह्यदहनादिन्यायः।", "padacchedaText": "", "audioFile": "PB_hear2read_001424.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001425", "originalText": "केचित्तु— वृत्तिरूपं ब्रह्मज्ञनं नाज्ञानतन्मूलप्रपञ्चनिबर्हकम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001425.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001426", "originalText": "अज्ञानस्य प्रकाशनिवर्त्यत्वनियमेन जडरूपवृत्तिनिवर्त्यत्वायोगात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001426.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001427", "originalText": "किं तु तदारूढचैतन्यप्रकाशः तन्निवर्तकः।", "padacchedaText": "", "audioFile": "PB_hear2read_001427.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001428", "originalText": "स्वरूपेण तस्य अज्ञानादिसाक्षितया तदनिवर्तकत्वेऽपि अखण्डाकारवृत्त्युपारूढस्य तस्य तन्निवर्तकत्वोपपत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_001428.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001429", "originalText": "‘तृणादेर्भासिकाऽप्येषा सूर्यदीप्तिस्तृणं दहेत्। सूर्यकान्तमुपारुह्य तन्न्यायं तत्र योजयेत्॥", "padacchedaText": "", "audioFile": "PB_hear2read_001429.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001430", "originalText": "’ इत्यभियुक्तोक्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_001430.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001431", "originalText": "एवं च, यथा (किञ्चित्) काष्ठमुपारुह्य ग्रामनगरादिकं दहन् वह्निः दहत्येव तदपि काष्ठम्, तथा चरमवृत्तिमुपारुह्य निखिलप्रपञ्चमुन्मूलयन् अखण्डचैतन्यप्रकाशः तन्निवर्तनेऽपि प्रगल्भत इति तन्नाशे न काचिदनुपपत्तिः − इत्यहुः।", "padacchedaText": "", "audioFile": "PB_hear2read_001431.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001432", "originalText": "अन्ये तु— ब्रह्मज्ञानमज्ञानस्यैव निवर्तकम्, ज्ञानाज्ञानयोरेव साक्षाद्विरोधात्, प्रपञ्चस्य तु उपादाननाशान्नाश इति प्रपञ्चान्तर्गतब्रह्मज्ञानस्यापि तत एव नाशः।", "padacchedaText": "", "audioFile": "PB_hear2read_001432.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001433", "originalText": "न च प्रपञ्चस्य ज्ञानानिवर्त्यत्वे मिथ्यात्वानुपपत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_001433.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001434", "originalText": "प्रपञ्चनिवृत्तेः साक्षात् ज्ञानजन्यत्वाभावेऽपि ज्ञानजन्याज्ञाननाशजन्यत्वात्, साक्षात् परम्परया वा ज्ञानैकनिवर्त्यत्वं मिथ्यात्वमित्यङ्गीकारात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001434.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001435", "originalText": "एवं च तत्त्वसाक्षात्कारोदयेऽपि जीवन्मुक्तस्य देहादिप्रतिभास उपपद्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001435.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001436", "originalText": "प्रारब्धकर्मणा प्रतिबन्धेन, तत्त्वसाक्षात्कारोदयेऽपि प्रारब्धकर्मतत्कार्यदेहादिप्रतिभासानुवृत्त्या, उपादानाविद्यालेशानुवृत्त्युपपत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_001436.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001437", "originalText": "अज्ञानवत् प्रपञ्चस्यापि साक्षात् ब्रह्मसाक्षात्कारनिवर्त्यत्वे नायमुपपद्यते। विरोधिनि ब्रह्मसाक्षात्कारे सति प्रारब्धकर्मणः स्वयमेवावस्थानासम्भवेन अविद्यालेशनिवृत्तिप्रतिबन्धकत्वायोगात्— इत्याहुः॥॥", "padacchedaText": "", "audioFile": "PB_hear2read_001437.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001438", "originalText": "इति शास्त्रसिद्धान्तलेशसङ्ग्रहे तृतीयः परिच्छेदः।॥", "padacchedaText": "", "audioFile": "PB_hear2read_001438.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001439", "originalText": "चतुर्थपरिच्छेदः।", "padacchedaText": "", "audioFile": "PB_hear2read_001439.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001440", "originalText": "जीवन्मुक्तिसदसद्भावोपपादनम्\nअथ कोऽयमविद्यालेशः, यदनुवृत्त्या जीवन्मुक्तिः?\nआवरणविक्षेपशक्तिमत्या मूलाविद्यायाः प्रारब्धकर्मवर्तमानदेहाद्यनुवृत्तिप्रयोजको विक्षेपशक्त्यंश इति केचित्।", "padacchedaText": "", "audioFile": "PB_hear2read_001440.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001441", "originalText": "क्षालितलशुनभाण्डानुवृत्तलशुनवासनाकल्पोऽविद्यासंस्कार इति − अन्ये।", "padacchedaText": "", "audioFile": "PB_hear2read_001441.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001442", "originalText": "दग्धपटन्यायेनानुवृत्ता मूलाविद्यैवेति − अपरे।", "padacchedaText": "", "audioFile": "PB_hear2read_001442.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001443", "originalText": "सर्वज्ञात्मगुरवस्तु − विरोधिसाक्षात्कारोदये लेशतोऽप्यविद्यानुवृत्त्यसम्भवात् जीवन्मुक्तिशास्त्रं श्रवणादिविध्यर्थवादमात्रम्, शास्त्रस्य जीवन्मुक्तिप्रतिपादने प्रयोजनाभावात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001443.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001444", "originalText": "अतः कृतनिदिध्यासनस्य ब्रह्मसाक्षात्कारोदयमात्रेण सविलासवासनाविद्यानिवृत्तिः— इत्यपि कञ्चित् पक्षमाहुः।", "padacchedaText": "", "audioFile": "PB_hear2read_001444.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001445", "originalText": "अविद्यानिवृत्तिस्वरूपविचारः\nअथ केयमविद्यानिवृत्ति:?\nआत्मैवेति ब्रह्मसिद्धिकाराः।", "padacchedaText": "", "audioFile": "PB_hear2read_001445.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001446", "originalText": "न च तस्य नित्य(त्वेन)सिद्धत्वात् ज्ञानवैयर्थ्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001446.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001447", "originalText": "असति ज्ञाने अनर्थहेत्वविद्याया विद्यमानतया अनर्थमपि तिष्ठेदिति तदन्वेषणात्, ‘यस्मिन् सति अग्रिमक्षणे यस्य सत्त्वं यद्व्यतिरेके च अभावः तत् तत्साध्यम्’ इति लक्षणानुरोधेन आत्मरूपाया अप्यविद्यानिवृत्तेः ज्ञानसाध्यत्वाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_001447.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001448", "originalText": "ज्ञाने सति अग्रिमक्षणे आत्मरूपाविद्यानिवृत्तिसत्त्वं तद्व्यतिरेके तत्प्रतियोग्यविद्यारूपः तदभाव इति उक्तलक्षणसत्त्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001448.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001449", "originalText": "आत्मन्यैव अविद्यानिवृत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_001449.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001450", "originalText": "सा च न सती।", "padacchedaText": "", "audioFile": "PB_hear2read_001450.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001451", "originalText": "अद्वैतहानेः।", "padacchedaText": "", "audioFile": "PB_hear2read_001451.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001452", "originalText": "नाप्यसती।", "padacchedaText": "", "audioFile": "PB_hear2read_001452.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001453", "originalText": "ज्ञानसाध्यत्वायोगात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001453.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001454", "originalText": "नापि सदसद्रूपा।", "padacchedaText": "", "audioFile": "PB_hear2read_001454.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001455", "originalText": "विरोधात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001455.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001456", "originalText": "नाप्यनिर्वाच्या, अनिर्वाच्यस्य सादेः अज्ञानोपादानकत्वनियमेन मुक्तावपि तदुपादानाज्ञानानुवृत्त्यापत्तेः, ज्ञाननिवर्त्यत्वापत्तेश्च।", "padacchedaText": "", "audioFile": "PB_hear2read_001456.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001457", "originalText": "किन्तु उक्तप्रकारचतुष्टयोत्तीर्णा पञ्चमप्रकारा इति आनन्दबोधाचार्याः।", "padacchedaText": "", "audioFile": "PB_hear2read_001457.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001458", "originalText": "अविद्यावत् तन्निवृत्तिरप्यनिर्वाच्यैव।", "padacchedaText": "", "audioFile": "PB_hear2read_001458.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001459", "originalText": "न च तदनुवृत्तौ तदुपादानाज्ञानस्याप्यनुवृत्तिनियमात् अनिर्मोक्षप्रसङ्गः।", "padacchedaText": "", "audioFile": "PB_hear2read_001459.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001460", "originalText": "तदनुवृत्तौ प्रमाणाभावात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001460.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001461", "originalText": "उत्पत्तेः प्रथमसमयमात्रसंसर्गिभावविकारत्ववत् निवृत्तेरपि चरमसमयमात्रसंसर्गिभावविकारत्वोपपत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_001461.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001462", "originalText": "अत एव, यथा पूर्वं पश्चाच्च ‘उत्पत्स्यते’ ‘उत्पन्नः’ इति भाविभूतभावेन व्यवह्रियमाणाया उत्पत्तेः प्रथमसमयमात्रे ‘उत्पद्यते’ इति वर्तमानत्वव्यवहारः, तथा पूर्वं पश्चाच्च ‘निवर्तिष्यते’ ‘निवृत्तः’ इति भाविभूतभावेन व्यवह्रियमाणाया निवृत्तेः चरमसमयमात्रे ‘निवर्तते’ ‘नश्यति’ ‘ध्वंसते’ इति वर्तमानत्वव्यपदेशः।", "padacchedaText": "", "audioFile": "PB_hear2read_001462.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001463", "originalText": "निवृत्तेरनुवृत्तौ तु चिरशकलितेऽपि घटे ‘इदानीं निवर्तते’ इत्यादिव्यवहारः स्यात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001463.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001464", "originalText": "आख्यातानां प्रकृत्यर्थगतवर्तमानत्वाद्यर्थाभिधायित्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001464.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001465", "originalText": "ननु च तेषां स्वाभिहितसङ्ख्याश्रयप्रकृत्यर्थकर्तृकर्मगतवर्तमानत्वाद्यर्थाभिधायकत्वं स्वाभिहितप्रकृत्यर्थानुकूलव्यापारगतवर्तमानत्वाद्यर्थाभिधायकत्वं वा अस्तु।", "padacchedaText": "", "audioFile": "PB_hear2read_001465.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001466", "originalText": "तथा च निवृत्तिक्रियाकर्तुश्चिरचूर्णितस्य घटस्य तद्गतनिवृत्त्यनुकूलव्यापारस्य च अवर्तमानत्वात् नोक्तातिप्रसङ्ग−इति चेत्, न − आद्ये उत्पन्नेऽपि घटे उत्पद्यत इति व्यवहारापत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_001466.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001467", "originalText": "उत्पत्तिक्रियाकर्तुर्घटस्य वर्तमानत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001467.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001468", "originalText": "द्वितीये आमवातजडीकृतकलेवरे उत्थानानुकूलयत्नवति उत्थानानुदयेऽपि ‘उत्तिष्ठति’ इति व्यवहारापत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_001468.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001469", "originalText": "आख्यातार्थस्य प्रकृत्यर्थभूतोत्थानानुकूलस्य यत्नरूपव्यापारस्य वर्तमानत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001469.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001470", "originalText": "तस्मात् प्रकृत्यर्थगतमेव वर्तमानत्वादि आख्यातार्थ इति, ध्वंसस्य स्थायित्वे चिरनिवृत्तेऽपि घटे ‘निवर्तते’ इति व्यवहारो दुर्वारः।", "padacchedaText": "", "audioFile": "PB_hear2read_001470.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001471", "originalText": "यदि च मुद्गरादिशकलिते घटे ध्वंसो नाम कश्चिदभावः तत्प्रतियोगिकः स्थायी भूतलाद्याश्रितः उपेयेत, तदा कपालमालापसरणे तदनपसरणेऽपि मणिकशरवादिकपालव्यावृत्तकपालसंस्थानविशेषादर्शने च किमिति स प्रत्यक्षो न स्यात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001471.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001472", "originalText": "कपालसंस्थानविशेषादिना अनुमेयो घटादिध्वंसो न प्रत्यक्ष इति चेत् तर्हि तेन मुद्गरनिपातकालीनस्य उत्पत्तिवद्भावविकाररूपतया प्रतियोग्याश्रितध्वंसस्य अनुमानं सम्भवतीति न ततः पश्चादनुवर्तमानप्रतियोग्यधिकरणाश्रिताभावरूपध्वंससिद्धिः।", "padacchedaText": "", "audioFile": "PB_hear2read_001472.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001473", "originalText": "‘इह भूतले घटो ध्वस्तः’ इति भूतले ध्वंसाधिकरणत्वव्यवहारस्य ‘इह भूतले घट उत्पन्नः’ इतिवत् भावविकारयुक्तप्रतियोग्यधिकरणत्वविषयत्वोपपत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_001473.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001474", "originalText": "घटध्वंसानन्तरं भूतले घटाभावव्यवहारस्य घटापसरणानन्तरं तदभावव्यवहारवत् समयविशेषसंसर्ग्यत्यन्ताभावावलम्बनतोपपत्त्या ध्वंसविषयत्वस्याकल्पनीयत्वाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_001474.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001475", "originalText": "एवं सति घटोत्पत्तेः पूर्वं तदभावव्यवहारोऽपि अत्यन्ताभावेन चरितार्थ इति प्रागभावोऽपि न स्यादिति चेत्, सोऽपि माभूत्।", "padacchedaText": "", "audioFile": "PB_hear2read_001475.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001476", "originalText": "नन्वेवं ‘प्रागभावाधारकालः पूर्वकालः’ ‘ध्वंसाधारः उत्तरकालः’ इति निर्वचनासम्भवात् काले पूर्वोत्तरादिव्यवहारः किमालम्बनः स्यात्? घटादिषु प्रतियोगित्वादिव्यवहारवत् अखण्डकिञ्चिद्धर्मगोचरोऽस्तु।", "padacchedaText": "", "audioFile": "PB_hear2read_001476.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001477", "originalText": "अभावस्वरूपस्थायिध्वंसाभ्युपगमेऽपि तेषु ध्वंसत्वादेरखण्डस्यैव वक्तव्यत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001477.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001478", "originalText": "न च जन्याभावत्वरूपं सखण्डमेव ध्वंसत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001478.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001479", "originalText": "ध्वंसप्रागभावरूपस्य घटस्य तद्ध्वंसत्वापत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_001479.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001480", "originalText": "न च सप्तमपदार्थरूपाभावत्वं विवक्षितम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001480.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001481", "originalText": "घटस्य प्रागभावं प्रत्यपि ध्वंसत्वाभावप्रसङ्गेन घटकाले प्रगभावोत्तरकालत्वव्यवहारस्य निरालम्बनत्वापत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_001481.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001482", "originalText": "न च प्रतियोग्यतिरिक्तः प्रागभावध्वंसः।", "padacchedaText": "", "audioFile": "PB_hear2read_001482.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001483", "originalText": "तथा सति, तुल्यन्यायतया ध्वंसप्रागभावोऽपि प्रतियोग्यतिरिक्तः स्यादिति, प्रागभावध्वंसस्यापि प्रागभावोऽन्यः, तस्यापि कश्चित् ध्वंसः, तस्यापि प्रागभावोऽन्यः, इत्यप्रामाणिकानवधिकध्वंसप्रागभावकल्पनापत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_001483.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001484", "originalText": "न चान्यत् ध्वंसत्वम् आत्माश्रयादिशून्यं निर्वक्तुं शक्यम्, एवं प्रागभावत्वमपि, इत्यन्यत्र विस्तरः।", "padacchedaText": "", "audioFile": "PB_hear2read_001484.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001485", "originalText": "तस्मान्न पूर्वं प्रागभावः, न च पश्चात् ध्वंसाभावः, मध्ये परं किञ्चित्कालम् अनिर्वचनीयोत्पत्तिस्थितिध्वंसरूपभावविकारवान् घटाद्यध्यासः।", "padacchedaText": "", "audioFile": "PB_hear2read_001485.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001486", "originalText": "एवं च अविद्यानिवृत्तिरपि ब्रह्मसाक्षात्कारोदयानन्तरक्षणवर्ती कश्चिद्भावविकार इति तस्या मुक्तावनुवृत्त्यभावात् न तदनिर्वाच्यत्वे कश्चिद्दोष इति− अद्वैतविद्याचार्याः।", "padacchedaText": "", "audioFile": "PB_hear2read_001486.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001487", "originalText": "मोक्षस्य स्थिरपुरुषार्थत्वोपपादनम्\nनन्वेवमविद्यानिवृत्तेः क्षणिकत्वे मोक्षः स्थिरपुरुषार्थो न स्यादिति चेत्, भ्रान्तोऽसि।", "padacchedaText": "", "audioFile": "PB_hear2read_001487.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001488", "originalText": "न ह्यविद्यानिवृत्तिः स्वयमेव पुरुषार्थ इति तस्या ज्ञानसाध्यत्वमुपेयते।", "padacchedaText": "", "audioFile": "PB_hear2read_001488.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001489", "originalText": "तस्याः सुखदुःखाभावेतरत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001489.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001490", "originalText": "किं तु अखण्डानन्दावारकसंसारदुःखहेत्वविद्योच्छेदे अखण्डानन्दस्फुरणं संसारदुःखोच्छेदश्च भवतीति तदुपयोगितया तस्यास्तत्त्वज्ञानसाध्यत्वमुपेयते।", "padacchedaText": "", "audioFile": "PB_hear2read_001490.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001491", "originalText": "चित्सुखाचार्यास्तु − दुःखाभावोऽपि मुक्तौ न स्वतः पुरुषार्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_001491.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001492", "originalText": "सर्वत्र दुःखाभावस्य स्वरूपसुखाभिव्यक्तिप्रतिबन्धकाभावतया सुखशेषत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001492.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001493", "originalText": "सुखस्यैव स्वतः पुरुषार्थत्वम् अन्येषां सर्वेषामपि तच्छेषत्वमिति सुखसाधनताज्ञानस्यैव प्रवर्तकत्वे सम्भवति, दुःखाभावस्यापि स्वतः पुरुषार्थत्वं परिकल्प्य तत्साधनप्रवर्तकसङ्ग्रहाय इष्टसाधनताज्ञानस्य इच्छाविषयत्वप्रवेशेन गुरुघटितस्य प्रवर्तकत्वकल्पनायोगात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001493.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001494", "originalText": "न च दुःखाभाव एव स्वतःपुरुषार्थः तच्छेषतया सुखं काम्यमिति वैपरीत्यापत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_001494.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001495", "originalText": "बहुकालदुःखसाध्येऽपि क्षणिकसुखजनके निन्दितग्राम्यधर्मादौ प्रवृत्तिदर्शनात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001495.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001496", "originalText": "तत्र क्षणिकसुखकालीनदुःखाभावस्य पुरुषार्थत्वे तदर्थं बहुकालदुःखानुभवायोगात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001496.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001497", "originalText": "न च तत्र क्षणिकसुखस्य पुरुषार्थत्वेऽपि दोषतौल्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001497.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001498", "originalText": "भावरूपे सुखे उत्कर्षापकर्षयोरनुभवसिद्धत्वेन क्षणमप्यत्युत्कृष्टसुखार्थं बहुकालदुःखानुभवोपपत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_001498.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001499", "originalText": "दुःखाभावे चोत्कर्षा(द्य)(पकर्षा)सम्भवात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001499.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001500", "originalText": "तस्मात् मुक्तौ संसारदुःखनिवृत्तिरप्यविद्यानिवृत्तिवत् सुखशेष इति अनवच्छिन्नानन्दप्राप्तिरेव स्वतःपुरुषार्थ इत्याहुः।", "p
