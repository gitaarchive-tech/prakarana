eshasangraha.zip"}, {"id": "B_000609", "originalText": "ज्ञानद्वयपक्षे इदमित्येका वृत्तिरध्यासकारणभूता, इदंरजतमिति द्वितीया वृत्तिरध्यस्तरजतविषया, न त्विदमंशं विना अध्यस्तमात्रगोचरा सा।", "padacchedaText": "", "audioFile": "PB_hear2read_000609.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000610", "originalText": "‘इदं रजतं जनामि’ इति तस्या इदमर्थतादात्म्यापन्नरजतविषयत्वानुभवादिति केचित्।", "padacchedaText": "", "audioFile": "PB_hear2read_000610.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000611", "originalText": "अन्ये तु— यथा इदमंशावच्छिन्नचैतन्यस्थाविद्या रजताकारेण विवर्तते, एवमिदमंशविषयवृत्तिज्ञानावच्छिन्नचैतन्यस्थाविद्या रजतज्ञानाभासाकारेण विवर्तते, न त्विदमंशवृत्तिवदनध्यस्तं रजतज्ञानमस्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000611.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000612", "originalText": "तथा च रजतस्य अधिष्ठानगतेदन्त्वसंसर्गभानवत् तज्ज्ञानस्यापि अधिष्ठानगतेदंत्वविषयत्वसंसर्गभानोपपत्तेः,न तस्यापि इदंविषयत्वमभ्युपगन्तव्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000612.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000613", "originalText": "न च रजतवत् अध्यस्तस्य रजतेदन्त्वसंसर्गस्य रजतज्ञानगोचरत्वात् तत्प्रतियोगिन इदन्त्वस्यापि तद्विषयत्वं वक्तव्यमिति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000613.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000614", "originalText": "स्वतादात्म्याश्रयस्य इदन्त्वविषयत्वादेव तस्य तत्संसर्गविषयत्वे अतिप्रसड्गाभावात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000614.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000615", "originalText": "न चाधिष्ठानाध्यस्यमानयोः एकस्मिन् ज्ञाने प्रकाशनियमस्य सम्भावनाभाष्यविवरणे प्रतिपादनात् एकवृत्तिविषयत्वं वक्तव्यमिति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000615.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000616", "originalText": "वृत्तिभेदेऽपि इदमाकारवृत्त्यभिव्यक्ते एकस्मिन् साक्षिणि तयोः प्रकाशोपगमात्—इत्याहुः।", "padacchedaText": "", "audioFile": "PB_hear2read_000616.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000617", "originalText": "ननु सर्वपदार्थानां साक्षिप्रसादादेव प्रकाशोपपत्तेः किं वृत्त्या? घटादिविषयकसंस्काराधानाद्युपपत्तये तदपेक्षणेऽपि तन्निर्गमाभ्युपगमो व्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000617.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000618", "originalText": "परोक्षस्थल इव अनिर्गतवृत्त्यवच्छिन्नसाक्षिणैव घटादेरपि प्रकाशोपपत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000618.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000619", "originalText": "न च तथा सति परोक्षापरोक्षवैलक्षण्यानुपपत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000619.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000620", "originalText": "शाब्दानुमित्योरिव करणविशेषप्रयुक्तवृत्तिवैजात्यादेव तदुपपत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000620.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000621", "originalText": "अत्र केचित् आहुः − प्रत्यक्षस्थले विषयाधिष्ठानतया तदवच्छिन्नमेव चैतन्यं विषयप्रकाशः, साक्षात्तादात्म्यरूपसम्बन्धसम्भवे स्वरूपसम्बन्धस्य वा अन्यस्य वा कल्पनायोगादिति तदभिव्यक्त्यर्थं युक्तो वृत्तिनिर्गमाभ्युपगमः।", "padacchedaText": "", "audioFile": "PB_hear2read_000621.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000622", "originalText": "परोक्षस्थले व्यवहिते वह्न्यादौ वृत्तिसंसर्गायोगात् इन्द्रियवदन्वयव्यतिरेकशालिनो वृत्तिनिर्गमद्वारस्य अनुपलम्भाच्च अनिर्गतवृत्त्यवच्छिन्नचैतन्यमेव स्वरूपसम्बन्धेन विषयगोचरम् अगत्या अर्थादभ्युपगम्यते− इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000622.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000623", "originalText": "अन्ये तु— अहङ्कारसुखदुःखादिष्वापरोक्ष्यं साक्षाच्चैतन्यसंसर्गिषु क्लृप्तमिति घटादावपि विषयसंसृष्टमेव चैतन्यमापरोक्ष्यहेतुरिति तदभिव्यक्तये वृत्तिनिर्गमं समर्थयन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000623.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000624", "originalText": "इतरे तु − शब्दानुमानावगतेभ्यः प्रत्यक्षावगते स्पष्टता तावदनुभूयते।", "padacchedaText": "", "audioFile": "PB_hear2read_000624.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000625", "originalText": "न हि रसालपरिमलादिविशेषे शतवारमाप्तोपदिष्टेऽपि प्रत्यक्षावगत इव स्पष्टताऽस्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000625.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000626", "originalText": "तदनन्तरमपि ‘कथं तत्’ इति जिज्ञासानुवृत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000626.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000627", "originalText": "न च शब्दान्माधुर्यमात्रावगमेऽपि रसालमाधुर्यादिवृत्त्यवान्तरजातिविशेषवाचिशब्दाभावात् तत्सत्त्वेऽपि श्रोत्रात्तस्य अगृहीतसङ्गतिकत्वात् शब्दादसाधारणजातिविशेषावच्छिन्नमाधुर्यावगमो नास्तीति जिज्ञासानुवृत्तिर्युक्तेति शङ्क्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000627.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000628", "originalText": "‘रसाले सर्वातिशायी माधुर्यविशेषोऽस्ति’ इत्यस्माच्छब्दात् तद्गतावान्तरजातिविशेषस्याप्यवगमात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000628.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000629", "originalText": "न ह्ययं शब्दः तद्गतं विशेषं विहाय अन्यगतं विशेषं तत्र बोधयति, अप्रामाण्यापत्ते:।", "padacchedaText": "", "audioFile": "PB_hear2read_000629.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000630", "originalText": "न च तद्गतमेव विशेषं विशेषत्वेन सामान्येन रूपेण बोधयति न विशिष्येति जिज्ञासेति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000630.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000631", "originalText": "प्रत्यक्षेणापि मधुररसविशेषणस्य जातिविशेषस्य स्वरूपत एव विषयीकरणेन जातिविशेषगतविशेषान्तराविषयीकरणात् जिज्ञासानुवृत्तिप्रसङ्गात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000631.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000632", "originalText": "तस्मात् प्रत्यक्षग्राह्येऽभिव्यक्तापरोक्षैकरसचैतन्यावकुण्ठनात् स्पष्टता जिज्ञासानिवर्तनक्षमा, शब्दादिगम्ये तु तदभावादस्पष्टता— इति व्यवस्था अभ्युपगन्तव्या।", "padacchedaText": "", "audioFile": "PB_hear2read_000632.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000633", "originalText": "अत एव साक्षिवेद्यस्य सुखादेः स्पष्टता।", "padacchedaText": "", "audioFile": "PB_hear2read_000633.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000634", "originalText": "शाब्दवृत्तिवेद्यस्यापि ब्रह्मणो मननादेः प्राक् अज्ञानानिवृत्तावस्पष्टता, तदनन्तरं तन्निवृत्तौ स्पष्टता— इति वृत्तिनिर्गममुपपादयन्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000634.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000635", "originalText": "ननु−एतावतापि विषयावारकाज्ञाननिवृत्त्यर्थं वृत्तिनिर्गम इत्युक्तम्, तदयुक्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000635.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000636", "originalText": "विषयावच्छिन्नचैतन्यगतस्य तदावारकाज्ञानस्य अनिर्गतवृत्त्या निवृत्त्यभ्युपगमेऽपि अनतिप्रसङ्गात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000636.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000637", "originalText": "न च— तथा सति देवदत्तीयघटज्ञानेन यज्ञदत्तीयघटाज्ञानस्यापि निवृत्तिप्रसङ्गः, समानविषयकत्वस्य सत्त्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000637.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000638", "originalText": "अहमर्थविषयचैतन्यनिष्ठयोर्ज्ञानाज्ञानयोर्भिन्नाश्रयत्वेन तयोर्विरोधे समानाश्रयत्वस्यातन्त्रत्वात्— इति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000638.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000639", "originalText": "समानाश्रयविषयत्वं ज्ञानाज्ञानयोर्विरोधप्रयोजकमङ्गीकृत्य वृत्तिनिर्गमनाभ्युपगमेऽपि देवदत्तीयघटवृत्तेः यज्ञदत्तीयघटाज्ञानस्य च घटावच्छिन्नचैतन्यैकाश्रयत्वप्राप्त्या अतिप्रसङ्गतादवस्थ्येन यदज्ञानं यं पुरुषं प्रति यद्विषयावारकं तत् तदीयतद्विषयकज्ञाननिवर्त्यमिति पृथगेव विरोधप्रयोजकस्य वक्तव्यतया समानाश्रयत्वस्यानपेक्षणात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000639.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000640", "originalText": "अत्राहुः − वृत्तिनिर्गमनानभ्युपगमे ज्ञानाज्ञानयोर्विरोधप्रयोजकमेव दुर्निरूपम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000640.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000641", "originalText": "यदज्ञानं यं पुरुषं प्रति इत्याद्युक्तमिति चेत्, न − परोक्षज्ञानेनापि विषयगताज्ञाननिवृत्तिप्रसङ्गात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000641.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000642", "originalText": "अपरोक्षत्वमपि निवर्तकज्ञानविशेषणमिति चेत्, किं तदपरोक्षत्वम्? न तावज्जातिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000642.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000643", "originalText": "‘दण्ड्ययमासीत्’ इति संस्कारोपनीतदण्डविशिष्टपुरुषविषयकस्य चाक्षुषज्ञानस्य दण्डांशेऽपि तत्सत्त्वे तत्रापि विषयगताज्ञाननिवृत्त्यापातात्, ‘दण्डं साक्षात्करोमि’ इति तदंशेऽप्यापरोक्ष्यानुभवापत्तेश्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000643.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000644", "originalText": "अननुभवेऽपि संस्कारं सन्निकर्षं परिकल्प्य इन्द्रियसन्निकर्षजन्यतया तत्र काल्पनिकापरोक्ष्याभ्युपमे अनुमित्यादावपि लिङ्गज्ञानादिकं सन्निकर्षं परिकल्प्य तदङ्गीकारापत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000644.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000645", "originalText": "दण्डांशे आपरोक्ष्यासत्त्वे तु तस्य जातित्वायोगात्, जातेर्व्याप्यवृत्तित्वनियमात्, तदनियमेऽपि अवच्छेदकोपाधिभेदानिरूपणेन तस्याव्याप्यवृत्तिजातित्वायोगाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000645.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000646", "originalText": "नाप्युपाधिः−तदनिर्वचनात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000646.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000647", "originalText": "इन्द्रियजन्यत्वमिति चेत्, न— साक्षिप्रत्यक्षाव्यापनात्, अनुमितिशाब्दज्ञानोपनीतगुरुत्वादिविशिष्टघटप्रत्यक्षे विशेषणांशातिव्यापनाच्च, करणान्तराभावेन तदंशे परोक्षेऽपि उपनयसहकारिसामर्थ्यादिन्द्रियस्यैव जनकत्वात्, अनुगतजन्यतावच्छेदकाग्रहेण अनेकेष्विन्द्रियजन्यत्वस्य दुर्ग्रहत्वाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000647.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000648", "originalText": "तद्ग्रहे च तस्यैव प्रथमप्रतीतस्यापरोक्षत्वरूपत्वोपपत्तौ प्रत्यक्षानुभवायोग्यस्य इन्द्रियजन्यत्वस्य तद्योग्यापरोक्ष्यरूपत्वकल्पनायोगात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000648.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000649", "originalText": "एतेन— इन्द्रियसन्निकर्षजन्यत्वमापरोक्ष्यम्, उपनयसहकृतेन्द्रियजन्यपरोक्षांशे च न सन्निकर्षजन्यत्वम्, अनुमितावप्युपनीतभानसत्त्वेन प्रमाणान्तरसाधारणस्योपनयस्य असन्निकर्षत्वात् इत्यपि शङ्का निरस्ता।", "padacchedaText": "", "audioFile": "PB_hear2read_000649.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000650", "originalText": "संयोगादिसन्निकर्षाणामननुगमेनाननुगमाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000650.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000651", "originalText": "यत्तवाभिमतमापरोक्ष्यं तदेव ममाप्यस्त्विति चेत्, न— तस्य शाब्दापरोक्षनिरूपणप्रस्तावे प्रतिपादनीयस्य तत्रैव दर्शनीयया रीत्या अज्ञाननिवृत्तिप्रयोज्यत्वेन तन्निवृत्तिप्रयोजकविशेषणभावायोगात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000651.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000652", "originalText": "तस्मात् ‘तरति शोकमात्मवित्’ इति श्रुतस्य ब्रह्मज्ञानस्य मूलाज्ञानाश्रयभूतसर्वोपादानब्रह्मसंसर्गनियतस्य मूलाज्ञाननिवर्तकत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000652.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000653", "originalText": "‘ऐन्द्रियकवृत्तयः तत्तदिन्द्रियसन्निकर्षसामर्थ्यात्तत्तद्विषयावच्छिन्नचैतन्यसंसृष्टा एव उत्पद्यन्ते’ इति नियममुपेत्य अज्ञानाश्रयचैतन्यसंसर्गनियतत्वं निवर्तकज्ञानविशेषणं वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000653.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000654", "originalText": "तथा च सति यदज्ञानं यं पुरुषं प्रति यद्विषयावारकं तत् तदीयतद्विषयतदज्ञानाश्रयचैतन्यसंसर्गनियतात्मलाभज्ञाननिवर्त्यमिति ज्ञानाज्ञनयोर्विरोधप्रयोजकं निरूपितं भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_000654.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000655", "originalText": "न चैवं सति नाडीहृदयस्वरूपगोचरशाब्दज्ञानस्याप्यज्ञाननिवर्तकत्वप्रसङ्गः।", "padacchedaText": "", "audioFile": "PB_hear2read_000655.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000656", "originalText": "तस्य कदाचिदर्थवशसम्पन्ननाडीहृदयान्यतरवस्तुसंसर्गसम्भवेऽपि विषयसंसर्गं विनापि शाब्दज्ञानसम्भवेन तत्संसर्गनियतात्मलाभत्वाभावात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000656.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000657", "originalText": "तस्मात् ज्ञानाज्ञानविरोधनिर्वाहाय वृत्तिनिर्गमो वक्तव्य इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000657.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000658", "originalText": "अन्ये तु विषयगताज्ञानस्य लाघवात् समानाधिकरणज्ञाननिवर्त्यत्वसिद्धौ वृत्तिनिर्गमः फलतीत्याहुः।", "padacchedaText": "", "audioFile": "PB_hear2read_000658.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000659", "originalText": "अपरे तु बाह्यप्रकाशस्य बाह्यतमोनिवर्तकत्वं सामानाधिकरण्ये सत्येव दृष्टमिति दृष्टान्तानुरोधात् वृत्तिनिर्गमः सिद्ध्यतीत्याहुः।", "padacchedaText": "", "audioFile": "PB_hear2read_000659.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000660", "originalText": "केचित्तु आवणाभिभवार्थं वृत्तिनिर्गमानपेक्षायामपि चिदुपरागार्थं प्रमातृचैतन्यस्य विषयप्रकाशकब्रह्मचैतन्याभेदाभिव्यक्त्यर्थं वा तदपेक्षेत्याहुः।", "padacchedaText": "", "audioFile": "PB_hear2read_000660.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000661", "originalText": "अथ किम्प्रमाणकोऽयं जीवब्रह्मणोरभेदः, यो वृत्त्याऽभिव्यज्येत? ‘वेदान्तप्रमाणक’ इति घण्टाघोषः।", "padacchedaText": "", "audioFile": "PB_hear2read_000661.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000662", "originalText": "सर्वेऽपि वेदान्ताः उपक्रमोपसंहारैकरूप्यादितात्पर्यलिङ्गैर्विमृश्यमानाः प्रत्यगभिन्ने ब्रह्मण्यद्वितीये समन्वयन्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000662.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000663", "originalText": "यथा चायमर्थः तथा शास्त्र एव समन्वयाध्याये प्रपञ्चितः। विस्तरभयान्नेह प्रतन्यत इति॥॥", "padacchedaText": "", "audioFile": "PB_hear2read_000663.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000664", "originalText": "इति सिद्धान्तलेशसङ्ग्रहे प्रथमः परिच्छेदः।॥॥", "padacchedaText": "", "audioFile": "PB_hear2read_000664.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000665", "originalText": "इति शास्त्रसिद्धान्तलेशसङ्ग्रहे प्रथमः परिच्छेदः।॥", "padacchedaText": "", "audioFile": "PB_hear2read_000665.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000666", "originalText": "द्वितीयपरिच्छेदः।", "padacchedaText": "", "audioFile": "PB_hear2read_000666.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000667", "originalText": "द्वितीयपरिच्छेदस्य अविरोधाध्यायेन प्रथमपरिच्छेदेन च सङ्गतिसूचनपूर्वकं मिथ्यात्वश्रुतीनां प्रत्यक्षबाधनिरूपणम्\nअथ कथमद्वितीये ब्रह्मणि वेदान्तानां समन्वयः, प्रत्यक्षादिविरोधात् इति चेत्,\nन आरम्भणाधिकरणोदाहृतश्रुतियुक्तिभिः प्रत्यक्षाद्यधिगम्यप्रपञ्चस्य ब्रह्मविवर्ततया मिथ्यात्वावगमात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000667.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000668", "originalText": "ननु— न श्रुतियुक्तिभिः प्रपञ्चस्य मिथ्यात्वं प्रत्याययितुं शक्यते, “घटः सन्” इत्यादिघटादिसत्त्वग्राहिप्रत्यक्षादिविरोधात्−\nअत्राहुः तत्त्वशुद्धिकाराः− न प्रत्यक्षं घटपटादि तत्सत्त्वं वा गृह्णाति, किं तु अधिष्ठानत्वेन घटाद्यनुगतं सन्मात्रम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000668.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000669", "originalText": "तथा च प्रत्यक्षमपि सद्रूपब्रह्माद्वैतसिद्ध्यनुकूलमेव।", "padacchedaText": "", "audioFile": "PB_hear2read_000669.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000670", "originalText": "तथा सति ‘सत्’ ‘सत्’ इत्येव प्रत्यक्षं स्यात्, न तु ‘घटः सन्’ इत्यादिप्रत्यक्षमिन्द्रियान्वयव्यतिरेकानुविधायि इति चेत्, न— यथा भ्रमेषु इदमंशस्याधिष्ठानस्य प्रत्यक्षेण ग्रहणम्, इन्द्रियान्वयव्यतिरेकयोः तत्रैवोपक्षयः, रजतांशस्य त्वारोपितस्य भ्रान्त्या प्रतिभासः, तथा सर्वत्र सन्मात्रस्य प्रत्यक्षेण ग्रहणम्, तत्रैवेन्द्रियव्यापारः, घटादिभेदवस्तुप्रतिभासो भ्रान्त्या, इत्यभ्युपगमात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000670.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000671", "originalText": "ननु तद्वदिह बाधादर्शनात् तथाभ्युपगम एव निर्मूल इति चेत्, न— बाधादर्शनेऽपि देशकालव्यवहितवस्तुवत् घटादिभेदवस्तुनः प्रत्यक्षायोग्यत्वस्यैव तत्र मूलत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000671.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000672", "originalText": "तथाहि − इन्द्रियव्यापारानन्तरं प्रतीयमानो घटादिः सर्वतो भिन्न एव प्रतीयते, तदा तत्र घटादिभेदे संशयविपर्ययादिदर्शनात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000672.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000673", "originalText": "यत्रापि स्थाण्वादौ पुरुषत्वादिसंशयः तत्रापि तद्व्यतिरिक्तेभ्यो भेदोऽसन्दिग्धाविपर्यस्तत्वात् प्रकाशत एव।", "padacchedaText": "", "audioFile": "PB_hear2read_000673.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000674", "originalText": "भेदस्य च प्रतियोगिसहोपलम्भनियमवतो न प्रत्यक्षेण ग्रहणं सम्भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_000674.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000675", "originalText": "देशकालव्यवधानेन असन्निकृष्टानामपि प्रतियोगिनां सम्भवात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000675.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000676", "originalText": "भेदज्ञानं प्रतियोग्यंशे संस्कारापेक्षणात् स्मृतिरूपमस्तु प्रत्यभिज्ञानमिव तत्तांशे इति चेत्, न तथापि भेदगतप्रतियोगिवैशिष्ट्यांशे तदभावात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000676.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000677", "originalText": "न च कनकाचलो भेदप्रतियोगी वस्तुत्वात् इति भेदे प्रतियोगिवैशिष्ट्यगोचरानुमित्या तत्संस्कारसम्भवः।", "padacchedaText": "", "audioFile": "PB_hear2read_000677.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000678", "originalText": "भेदज्ञानं विना अनुमित्यभावेन (अनुमानप्रवृत्त्ययोगेन)आत्माश्रयापत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000678.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000679", "originalText": "पक्षसाध्यहेतुसपक्षाद्यभेदभ्रमे सति सिद्धसाधनादिना अनुमानाप्रवृत्त्या तदभेदज्ञानविघटनाय तद्भेदज्ञानस्यापेक्षितत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000679.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000680", "originalText": "अस्तु तर्हि भेदांश इव प्रतियोगिवैशिष्ट्यांशेऽपि प्रत्यक्षमिति चेत्, न— प्रतियोगिनोऽप्रत्यक्षत्वे तद्वैशिष्ट्यप्रत्यक्षायोगात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000680.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000681", "originalText": "सम्बन्धिद्वयप्रत्यक्षं विना सम्बन्धप्रत्यक्षासम्भवात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000681.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000682", "originalText": "तस्मात् प्रत्यक्षायोग्यस्य प्रतियोगिनो भ्रान्तिरूप एव प्रतिभास इति तदेकवित्तिवेद्यत्वनियतस्य भेदस्य भेदैकवित्तिवेद्यत्वनियतस्य घटादेश्च भ्रमैकविषयत्वात् प्रत्यक्षं निर्विशेषसन्मात्रग्राहि अद्वैतसिद्ध्यनुकूलमिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000682.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000683", "originalText": "न्यायसुधाकृतस्त्वाहुः− घटादेरैन्द्रियकत्वेऽपि ‘सन् घटः’ इत्यादिरधिष्ठानसत्तानुवेध इति न विरोधः।", "padacchedaText": "", "audioFile": "PB_hear2read_000683.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000684", "originalText": "एवं नीलो घट इत्यादिरधिष्ठाननैल्यानुवेधः किं न स्यादिति चेत्, न श्रुत्या सद्रूपस्य वस्तुनो जगदुपादानत्वमुक्तम् अविरोधात् सर्वसम्मतमिति तदनुवेधेनैव ‘सन् घटः’ इत्यादिप्रतिभासोपपत्तौ घटादावपि सत्ताकल्पने गौरवम्, तस्य रूपादिहीनत्वान्नैल्यादिकं घटादावेव कल्पनीयमिति वैषम्यादिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000684.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000685", "originalText": "संक्षेपशारीरकाचार्यास्त्वाहुः− प्रत्यक्षस्य घटादिसत्त्वग्राहित्वेऽपि पराग्विषयस्य प्रत्यक्षादेस्तत्त्वावेदकत्वलक्षणप्रामाण्याभावान्न तद्विरोधेनाद्वैतश्रुत्यादिबाधशङ्का।", "padacchedaText": "", "audioFile": "PB_hear2read_000685.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000686", "originalText": "अज्ञातबोधकं हि प्रमाणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000686.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000687", "originalText": "न च प्रत्यक्षादि विषयस्य घटादेरज्ञातत्वमस्ति, जडे आवरणकृत्याभावेन अज्ञानविषयत्वानुपगमात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000687.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000688", "originalText": "स्वप्रकाशतया प्रसक्तप्रकाशं ब्रह्मैव अज्ञानविषय इति तद्बोधकमेव तत्त्वावेदकं प्रमाणम्, तदेव प्रमितिविषयः।", "padacchedaText": "", "audioFile": "PB_hear2read_000688.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000689", "originalText": "अत एव श्रुतिरपि ‘आत्मा वा अरे द्रष्टव्यः’ इत्यात्मन एव प्रमेयत्वमिति नियच्छति।", "padacchedaText": "", "audioFile": "PB_hear2read_000689.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000690", "originalText": "न हि द्रष्टव्य इत्यनेन दर्शनं विधीयते, प्रमाणपरतन्त्रस्य तस्य विध्यगोचरत्वात्, किं तु ‘आत्मा दर्शनार्हः’ इति अज्ञातत्वादात्मन एव प्रमेयत्वमुचितं,नान्यस्येति नियम्यते − इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000690.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000691", "originalText": "केचित्तु— घटादिसत्त्वग्राहिणः प्रत्यक्षस्य प्रामाण्ये ब्रह्मप्रमाणन्यूनतानवगमेऽपि तद्ग्राह्यं सत्त्वमनुगतप्रत्ययात् सत्ताजातिरूपं वा, इहेदानीं घटोऽस्तीति देशकालसम्बन्धप्रतीतेः तत्तद्देशकालसम्बन्धरूपं वा, ‘नास्ति घट’ इति स्वरूपनिषेधप्रतीतेर्घटादिस्वरूपं वा पर्यवस्यति।", "padacchedaText": "", "audioFile": "PB_hear2read_000691.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000692", "originalText": "तच्च स्वमिथ्यात्वेन न विरुध्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000692.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000693", "originalText": "न हि मिथ्यात्ववादिनापि घटादेः स्वरूपं वा तस्य देशकालसम्बन्धो वा तत्र जात्यादिकं वा नाभ्युपगम्यते, किं तु तेषामबाध्यत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000693.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000694", "originalText": "न चाबाध्यत्वमेव सत्त्वं प्रत्यक्षग्राह्यमस्त्विति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000694.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000695", "originalText": "‘कालत्रयेऽपि नास्य बाधः’ इति वर्तमानमात्रग्राहिणा प्रत्यक्षेण ग्रहीतुमशक्यत्वात्— इत्याहुः।", "padacchedaText": "", "audioFile": "PB_hear2read_000695.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000696", "originalText": "अन्ये तु— अबाध्यत्वरूपसत्त्वस्य प्रत्यक्षग्राह्यत्वेऽपि ‘प्राणा वै सत्यं तेषामेष सत्यं’ इति श्रुत्या प्रधानभूतप्राणग्रहणोपलक्षितस्य कृत्स्नस्य प्रपञ्चस्य ब्रह्मणश्च सत्यत्वोत्कर्षापकर्षप्रतीतेः, सत्यत्वे चाबाध्यत्वरूपे सर्वदैवाबाध्यत्वं किञ्चित्कालमबाध्यत्वम् इत्येवंविधोत्कर्षापकर्षं विना राजराजो मन्मथमन्मथ इत्यादि शब्दतात्पर्यगोचरनियन्तृत्वसौन्दर्यादीनामिव भूयोविषयत्वाल्पविषयत्वादिरूपोत्कर्षापकर्षासम्भवात्, विधान्तरेण तत्सम्भवेऽपि प्रपञ्चस्य ब्रह्मज्ञानबाध्यत्वश्रुत्यन्तरैकार्थ्यात् उक्तोत्कर्षापकर्ष एव पर्यवसानाच्च, प्रत्यक्षग्राह्यं घटादिसत्त्वं यावद्ब्रह्मज्ञानमबाध्यत्वरूपमिति न मिथ्यात्वश्रुतिविरोधः− इत्याहुः।", "padacchedaText": "", "audioFile": "PB_hear2read_000696.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000697", "originalText": "श्रुतेः प्रत्यक्षात्प्राबल्यप्रयोजकविचारः\nअपरे तु— प्रपञ्चस्य मिथ्यात्वसत्यत्वग्राहिणोः श्रुतिप्रत्यक्षयोः विरोधेऽपि दोषशङ्काकलङ्कितात् प्रथमप्रवृत्तात् प्रत्यक्षात् निर्दोषत्वात् अपच्छेदन्यायेन परत्वाच्च श्रुतिरेव बलियसी।", "padacchedaText": "", "audioFile": "PB_hear2read_000697.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000698", "originalText": "‘प्राबल्यमागमस्यैव जात्या तेषु त्रिषु स्मृतम्’ इति स्मरणाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000698.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000699", "originalText": "न च वेदैकगम्यार्थविषयमिदं स्मरणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000699.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000700", "originalText": "तत्र प्रत्यक्षविरोधशङ्काया अभावेन शङ्कितप्रत्यक्षविरोध एव वेदार्थे वेदस्य प्राबल्योक्त्यौचित्यात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000700.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000701", "originalText": "‘तलवद्दृश्यते व्योम खद्योतो हव्यवाडिव। न तलं विद्यते व्योम न खद्योतो हुताशनः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000701.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000702", "originalText": "तस्मात् प्रत्यक्षदृष्टेऽपि युक्तमर्थे परीक्षितुम्। परीक्ष्य ज्ञापयन्नर्थान् न धर्मात् परिहीयते’॥", "padacchedaText": "", "audioFile": "PB_hear2read_000702.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000703", "originalText": "इति नारदस्मृतौ साक्षिप्रकरणे प्रत्यक्षदृष्टस्यापि प्रत्यक्षमविश्वस्य प्रमाणोपदेशादिभिः परीक्षणीयत्वप्रतिपादनाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000703.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000704", "originalText": "न हि नभोनैल्यप्रत्यक्षं नभसः शब्दादिषु पञ्चसु शब्दैकगुणत्वप्रतिपादकागमोपदेशमन्तरेण प्रत्यक्षादिना शक्यमपवदितुम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000704.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000705", "originalText": "न च ‘नभसि समीपे नैल्यानुपलम्भात् दूरे तद्धीर्दूरत्वदोषजन्ये’ति निश्चयेन तद्बाधः।", "padacchedaText": "", "audioFile": "PB_hear2read_000705.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000706", "originalText": "दूरे नैल्यादर्शनात् समीपे तदनुपलम्भस्तुहिनावकुण्ठनानुपलम्भवत्सामीप्यदोषजन्यः इत्यपि सम्भवात्, अनुभवबलात् नभोनैल्यमव्याप्यवृत्तीत्युपपत्तेश्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000706.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000707", "originalText": "नापि दूरस्थस्य पुंसो यत्र भूसन्निहिते नभःप्रदेशे नैल्यधीः, तत्रैव समीपं गतस्य नैल्यबुद्धेरभावप्रत्यक्षेण बाधः।", "padacchedaText": "", "audioFile": "PB_hear2read_000707.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000708", "originalText": "उपरिस्थितस्यैव नैल्यस्याभ्रनक्षत्रादेरिव दूरत्वदोषात् भूसन्निधानावभास इत्युपपत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000708.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000709", "originalText": "पृथिव्यादिषु सङ्कीर्णतया प्रतीयमानानां गन्धादीनाम् ‘उपलभ्याप्सु चेद्गन्धं केचिद्ब्रूयुरनैपुणाः। पृथिव्यामेव तं विद्यात् अपो वायुं च संश्रितम्’॥", "padacchedaText": "", "audioFile": "PB_hear2read_000709.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000710", "originalText": "(म.भा.शा. २३८. ७८) इत्यादिभिरागमैरेव व्यवस्थाया वक्तव्यत्वेन प्रत्यक्षादागमप्राबल्यस्य निर्विशङ्कत्वाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000710.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000711", "originalText": "न हि आजानसिद्धजलोपष्टम्भादिगतं गन्धादि ‘पृथिवीगुण एव गन्धः, न जलादिगुणः’ इत्यादिरूपेण अस्मदादिभिः प्रत्यक्षेण शक्यं विवेचयितुम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000711.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000712", "originalText": "पृथव्यादीनां प्रायः परस्परसंसृष्टतया अन्यधर्मस्यान्यत्रावभासः सम्भाव्यत इति शङ्कितदोषं प्रत्यक्षम्, अतस्त(त्रा) (दा)गमेन शिक्ष्यते— इति चेत्, तर्हीहापि ब्रह्मप्रपञ्चयोः उपादानोपादेयभावेन परस्परसंसृष्टतया अन्यधर्मस्यान्यत्रावभासः सम्भव्यत इति शङ्कितदोषं प्रत्यक्षं ‘अस्ति भाति प्रियं रूपं नाम चेत्यंशपञ्चकम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000712.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000713", "originalText": "आद्यं त्रयं ब्रह्मरूपं जगद्रूपं ततो द्वयम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_000713.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000714", "originalText": "’ (दृग्दृश्यविवेकः—२०) इति वृद्धोक्तप्रकारेणागमेन व्यवस्थाप्यतामिति तुल्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000714.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000715", "originalText": "न चैवमुपजीव्यविरोधः।", "padacchedaText": "", "audioFile": "PB_hear2read_000715.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000716", "originalText": "आगमप्रमाणेन वर्णपदवाक्यादिस्वरूपांशप्रत्यक्षमुपजीव्य अनुपजीव्यतत्सत्यत्वांशोपमर्दनात्— इत्याहुः।", "padacchedaText": "", "audioFile": "PB_hear2read_000716.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000717", "originalText": "ननु— आगमस्य प्रत्यक्षात् बलीयस्त्वे ‘यजमानः प्रस्तरः’ इत्यत्र प्रत्यक्षाविरोधाय यजमानशब्दस्य प्रस्तरे गौणी वृत्तिर्न कल्पनीया।", "padacchedaText": "", "audioFile": "PB_hear2read_000717.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000718", "originalText": "तथा ‘सोमेन यजेत’ इत्यत्र, वैयधिकरण्येनान्वये यागे इष्टसाधनत्वं सोमलतायां यागसाधनत्वं च बोधनीयमिति व्यापारभेदेन वाक्यभेदापत्तेः सामानाधिकरण्येनान्वये वक्तव्ये, प्रत्यक्षाविरोधाय सोमवता यागेनेति मत्वर्थलक्षणा न कल्पनीया।", "padacchedaText": "", "audioFile": "PB_hear2read_000718.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000719", "originalText": "उभयत्रापि सत्यपि प्रत्यक्षविरोधे तदनादृत्य आगमेन बलीयसा प्रस्तरे यजमानाभेदस्य यागे सोमाभेदस्य च सिद्धिसम्भवात् इति चेत्—\nअत्रोक्तं भामतीनिबन्धे— तात्पर्यवती श्रुतिः प्रत्यक्षात् बलवती, न श्रुतिमात्रम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000719.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000720", "originalText": "मन्त्रार्थवादानां तु स्तुतिद्वारभूतेऽर्थे वाक्यार्थद्वारभूते पदार्थ इव न तात्पर्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000720.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000721", "originalText": "तात्पर्याभावे मानान्तराविरुद्धदेवताविग्रहादिकं न तेभ्यः सिद्ध्येत् तात्पर्यवत्येव शब्दस्य प्रामाण्यनियमात् इति चेत्, न− ‘एतस्यैव रेवतीषु वारवन्तीयमग्निष्टोमसाम कृत्वा पशुकामो ह्येतेन यजेत’ (ता.ब्रा. १७— ७— १) इति विशिष्टविधेः तात्पर्यागोचरेऽपि विशेषणस्वरूपे प्रामाण्यदर्शनेन उक्तनियमासिद्धेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000721.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000722", "originalText": "अत्र हि रेवतीऋगाधारं वारवन्तीयं साम विशेषणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000722.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000723", "originalText": "न चैतत् सोमादिविशेषणवल्लेकसिद्धम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000723.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000724", "originalText": "येन तद्विशिष्टयागविधिमात्रे प्रामाण्यं वाक्यस्य स्यात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000724.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000725", "originalText": "नापि विशिष्टविधिना विशेषणाक्षेपः।", "padacchedaText": "", "audioFile": "PB_hear2read_000725.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000726", "originalText": "आक्षेपाद्विशेषणप्रतिपत्तौ विशिष्टगोचरो विधिः, तस्मिंश्च सति तेन विशेषणाक्षेपः, इति परस्पराश्रयापत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000726.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000727", "originalText": "अतो विशिष्टविधिपरस्यैव वाक्यस्य विशेषणस्वरूपेऽपि प्रामाण्यं वक्तव्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000727.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000728", "originalText": "अथ च न तत्र तात्पर्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000728.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000729", "originalText": "उभयत्र तात्पर्ये वाक्यभेदापत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000729.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000730", "originalText": "एवमर्थवादानामपि विधेयस्तुतिपराणां स्तुतिद्वारभूतेऽर्थे न तात्पर्यमिति तेभ्यः प्रत्यक्षस्यैव बलवत्त्वात् तदविरोधाय तेषु वृत्त्यन्तरकल्पनम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000730.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000731", "originalText": "‘सोमेन यजेत’ इत्यत्र विशष्टविधिपरे वाक्ये सोमद्रव्याभिन्नयागरूपं विशिष्टं विधेयमित्युपगमे तस्य विधेयस्य ‘दध्ना जुहोति’ इत्यादौ विधेयस्य दध्यादेरिव लोकसिद्धत्वाभावेन विधिपराद्वाक्यादेव रेवत्याधारवारवन्तीयविशेषणस्येव विना तात्पर्यं सिद्धिरेष्टव्या।", "padacchedaText": "", "audioFile": "PB_hear2read_000731.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000732", "originalText": "न हि तात्पर्यविरहितादागमाद्यागसोमलताभेदग्राहिप्रत्यक्षविरुद्धार्थः सिद्ध्यतीति तत्रापि तदविरोधाय मत्वर्थलक्षणाश्रयणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000732.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000733", "originalText": "अद्वैतश्रुतिस्तु उपक्रमोपसंहारैकरूप्यादिषड्विधलिङ्गावगमिताद्वैततात्पर्या प्रत्यक्षाद्बलवतीति ततः प्रत्यक्षस्यैव बाधः, न तदविरोधाय श्रुतेरन्यथानयनमिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000733.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000734", "originalText": "विवरणवार्तिके तु प्रतिपादितं−\nन तात्पर्यवत्त्वेन श्रुतेः प्रत्यक्षात् प्राबल्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000734.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000735", "originalText": "‘कृष्णलं श्रपयेत्’ इति विधेः श्रपणस्य कृष्णलार्थत्वप्रतिपादने तात्पर्येऽपि कृष्णले रूपरसपरावृत्तिप्रादुर्भावपर्यन्तमुख्यश्रपणसम्बन्धः प्रत्यक्षविरुद्ध इति तदविरोधाय श्रपणशब्दस्य उष्णीकरणमात्रे लक्षणाभ्युपगमात्, ‘तत्त्वमसी’तिवाक्यस्य जीवब्रह्माभेदप्रतिपादने तात्पर्येऽपि त्वम्पदवाच्यस्य तत्पदवाच्याभेदः प्रत्यक्षविरुद्ध इति तदविरोधाय निष्कृष्टचैतन्ये लक्षणाभ्युपगमाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000735.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000736", "originalText": "अर्थवादानामपि प्रयाजाद्यङ्गविधिवाक्यानामिव स्वार्थप्रमितावनन्यार्थता, प्रमितानामेवार्थानां प्रयोजनवशादन्यार्थता, इति प्रयाजादिवाक्यवत्तेषामप्यवान्तरसंसर्गे तात्पर्यमस्त्येव, वाक्यैकवाक्यत्वात्, पदैकवाक्यतायामेव परम् अवान्तरतात्पर्यानभ्युपगमः− इति विवरणाचार्यैर्न्यायनिर्णये व्यवस्थापनेन ‘यजमानः प्रस्तरः’ इत्यादीनामपि मुख्यार्थतात्पर्यप्रसक्तौ प्रत्यक्षाविरोधायैव लक्षणाभ्युपगमाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000736.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000737", "originalText": "कथं तर्हि श्रुतेः प्राबल्यम्? उच्यते− निर्दोषत्वात् परत्वाच्च श्रुतिमात्रस्य प्रत्यक्षात् प्राबल्यम् इत्युत्सर्गः।", "padacchedaText": "", "audioFile": "PB_hear2read_000737.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000738", "originalText": "किं तु श्रुतिबाधितमपि प्रत्यक्षं कथञ्चित् स्वोचितविषयोपहारेण सम्भावनीयम्, निर्विषयज्ञानायोगात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000738.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000739", "originalText": "अत एव अद्वैतश्रुतिविरोधेन तत्त्वावेदनात् प्रच्यावितं प्रत्यक्षम् अर्थक्रियासमर्थव्यावहारिकविषयसमर्पणेनोपपाद्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000739.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000740", "originalText": "किं बहुना−’नेदं रजतं’ इति सर्वसिद्धप्रत्यक्षबाधितमपि शुक्तिरजतप्रत्यक्षम् अनुभवानुरोधात् पुरोदेशे शुक्तिसम्भिन्नरजतोपगमेन समर्थ्यते, न तु तद्विरोधेन व्यवहितमान्तरमसदेव वा रजतं विषय इति परिकल्प्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000740.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000741", "originalText": "एवं च प्रस्तरे यजमानभेदग्राहिणो यावद्ब्रह्मज्ञानमनुवर्तमानस्य प्रत्यक्षस्य अर्थक्रियासंवादेन प्रातिभासिकविषयत्वाभ्युपगमेनोपपादनायोगात् ‘यजमानः प्रस्तरः’ इति श्रुतिबाध्यत्वे सर्वथा निर्विषयत्वं स्यादिति तत्परिहाराय उत्सर्गमपोद्य श्रुतिरेव तत्सिद्ध्यधिकरणादि प्रतिपादितप्रकारेण अन्यथा नीयते।", "padacchedaText": "", "audioFile": "PB_hear2read_000741.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000742", "originalText": "न च अद्वैतश्रुतिप्रत्यक्षयोरिव इह श्रुतिप्रत्यक्षयोस्तात्त्विकव्यावहारिकविषयत्वोपगमेन प्रत्यक्षोपपादनं कर्तुं शक्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000742.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000743", "originalText": "ब्रह्मातिरिक्तसकलमिथ्यात्वप्रतिपादकषड्विधतात्पर्यलिङ्गोपपन्नानेकश्रुतिविरुद्धेन एकेनार्थवादेन प्रस्तरे यजमानतादात्म्यस्य तात्त्विकस्य प्रतिपादनासम्भवात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000743.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000744", "originalText": "एवं तत्त्वमसिवाक्येन त्वम्पदवाच्यस्य सर्वज्ञत्वाभोक्तृत्वाकर्तृत्वादिविशिष्टब्रह्मस्वरूपत्वबोधने तत्र असर्वज्ञत्वभोक्तृत्वादिप्रत्यक्षमत्यन्तं निरालम्बनं स्यादिति, तत्परिहाराय अहङ्कारशबलितस्य भोक्तृत्वादि ततो निष्कृष्टस्य शुद्धस्य उदासीनब्रह्मस्वरूपत्वमिति व्यवस्थामाश्रित्य भागत्यागलक्षणा आश्रीयते।", "padacchedaText": "", "audioFile": "PB_hear2read_000744.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000745", "originalText": "एवं ‘कृष्णलं श्रपयेत्’ इत्यादावपि प्रत्यक्षस्यात्यन्तनिर्विषयत्वप्रसक्तौ तत्परिहाराय श्रुतौ लक्षणा।", "padacchedaText": "", "audioFile": "PB_hear2read_000745.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000746", "originalText": "कथञ्चिद्विषयोपपादनसम्भवे तु न प्रबलायाः श्रुतेरन्यथानयनमिति न कश्चिदप्यव्यवस्थाप्रसङ्गः।", "padacchedaText": "", "audioFile": "PB_hear2read_000746.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000747", "originalText": "अथवा ‘कृष्णलं श्रपयेत्’, ‘सोमेन यजेत’ इत्यादौ न प्रत्यक्षानुरोधेन लक्षणाश्रयणम्, किं त्वनुष्ठानाशक्त्या।", "padacchedaText": "", "audioFile": "PB_hear2read_000747.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000748", "originalText": "न हि कृष्णले उष्णीकरणमिव मुख्यः पाकोऽनुष्ठातुं शक्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000748.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000749", "originalText": "न वा सोमद्रव्यकरणको याग इव तदभिन्नो यागः केनचिदनुष्ठातुं शक्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000749.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000750", "originalText": "न चानुष्ठेयत्वाभिमतस्य प्रत्यक्षविरोध एव अनुष्ठानाशक्तिरिति शब्दान्तरेण व्यवह्रियत इति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000750.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000751", "originalText": "‘शशिमण्डलं कान्तिमत् कुर्यात्’ इति विधौ अनुष्ठेयत्वाभिमतस्य शशिमण्डले कान्तिमत्त्वस्य प्रत्यक्षाविरोधेऽप्यनुष्ठानाशक्तिदर्शनेन तस्यास्ततो भिन्नत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000751.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000752", "originalText": "तथा च तत्र तत एव लक्षणाश्रयणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000752.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000753", "originalText": "तस्मात् अपच्छेदन्यायादिसिद्धस्य श्रुतिबलीयस्त्वस्य न कश्चित् बाध इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000753.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000754", "originalText": "अथ कथमत्रापच्छेदन्यायप्रवृत्तिः? उच्यते − यथा ज्योतिष्टोमे बहिष्पवमानार्थं प्रसर्पताम् उद्गातुरपच्छेदे सति ‘यद्युद्गाताऽपच्छिद्येत अदक्षिणं तं यज्ञम् इष्ट्वा तेन पुनर्यजेत’ इति श्रुतिनिरीक्षणेन जाता उद्गात्रपच्छेदनिमित्त(प्रायश्चित्त)कर्तव्यताबुद्धिः पश्चात् प्रतिहर्त्रपच्छेदे सति ‘यदि प्रतिहर्तापच्छिद्येत सर्ववेदसं दद्यात्’ इति श्रुतिनिरीक्षणेन जातया तद्विरुद्धप्रतिहर्त्रपच्छेदनिमित्त(प्रायश्चित्त)कर्तव्यताबुद्ध्या बाध्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000754.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000755", "originalText": "एवं पूर्वं घटादिसत्यत्वप्रत्यक्षं परया तन्मिथ्यात्वश्रुतिजन्यबुद्ध्या बाध्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000755.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000756", "originalText": "न चोदाहृतस्थले पूर्वनैमित्तिककर्तव्यताबुद्धेः परनैमित्तिककर्तव्यताबुद्ध्या बाधेऽपि पूर्वनैमित्तिककर्तव्यताबुद्धिजनकं शास्त्रं यत्रोद्गातृमात्रापच्छेदः उभयोरपि युगपदपच्छेदो वा उद्गात्रपच्छेदस्य परत्वं वा, तत्र सावकाशम्, प्रत्यक्षं तु अद्वैतश्रुत्या बाधे विषयान्तराभावान्निरालम्बनं स्यादिति वैषम्यं − शङ्कनीयम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000756.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000757", "originalText": "यत्र घटादौ श्रुत्या बाध्यं प्रत्यक्षं प्रवर्तते तत्रैव व्यावहारिकं विषयं लब्ध्वा कृतार्थस्य तस्य परापच्छेदस्थले सर्वथा बाधितस्य पूर्वापच्छेदशास्त्रस्येव विषयान्तरान्वेषणाभावात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000757.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000758", "originalText": "इहापि सर्वप्रत्ययवेद्यब्रह्मसत्तायां सावकाशं प्रत्यक्षमिति वक्तुं शक्यत्वाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000758.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000759", "originalText": "यत्तु— एकस्मिन्नपि प्रयोगे क्रमिकाभ्यां निमित्ताभ्यां क्रतौ तत्तन्नैमित्तिककर्तव्यतयोर्बदरफले श्यामरक्तरूपयोरिव क्रमेणोत्पादात् रूपज्ञानद्वयवत् कर्तव्यताज्ञानद्वयमपि प्रमाणमेवेति न परेण पूर्वज्ञानबाधे अपच्क्षेदन्याय उदाहरणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000759.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000760", "originalText": "अत एवापच्छेदाधिकरणे (पू.मी. ६. ५. १९)‘नैमित्तिक(शस्त्राणां)(शास्त्रस्य) ह्ययमर्थः निमित्तोपजननात् प्रागन्यथाकर्तव्योऽपि क्रतुः निमित्ते सत्यन्यथाकर्तव्यः’ इति शास्त्रदीपिकावचानमिति, तन्न, अङ्गस्य सतः कर्तव्यत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000760.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000761", "originalText": "न च पश्चाद्भाविप्रतिहर्त्रपच्छेदवति क्रतौ पूर्ववृत्तोद्गात्रपच्छेदनिमित्तकस्य प्रायश्चित्तस्याङ्गत्वमस्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000761.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000762", "originalText": "आहवनीयशास्त्रस्य पदहोमातिरिक्तहोमविषयत्ववद्‘यद्युद्गातावऽपच्छेद्येत’ इति शास्त्रस्य पश्चाद्भाविप्रतिहर्त्रपच्छेदरहितक्रतुविषयत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000762.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000763", "originalText": "उक्तं हि न्यायरत्नमालायाम्— ‘साधारणस्य शास्त्रस्य विशेषविषयादिना। सङ्कोचः क्लृप्तरूपस्य प्राप्तबाधोऽभिधीयते॥", "padacchedaText": "", "audioFile": "PB_hear2read_000763.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000764", "originalText": "’ इत्युक्तलक्षणप्राप्तबाधविवेचने, \"तत्रैवं सति शास्त्रार्थो भवति, पश्चाद्भाव्युद्गात्रपच्छेदविधुरप्रतिहर्त्रपच्छेदवतः क्रतोस्सर्ववेदसदानमङ्गम्, एवमुद्गात्रपच्छेदेऽपि द्रष्टव्यम्’ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000764.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000765", "originalText": "यत्तु शास्त्रदीपिकावचनमुदाहृतम्, तदपि ‘तेनोत्पन्नमपि पूर्वप्रायश्चित्तज्ञानं मिथ्या भवति, बाधितत्वात्, उत्तरस्य तु न किञ्चिद्बाधकमस्ति’ इति पूर्वकर्तव्यताबाध्यत्वप्रतिपादकग्रन्थोपसंहारपठितत्वात् ‘निमित्तोपजननात्प्राक् निमित्तोपजननं विना निमित्तोपजननाभावे सति अन्यथा कर्तर्व्योऽपि’ इति कृत्वाचिन्तामात्रपरम्, न तु ‘उत्तरनिमित्तोपजननात्प्राक्पूर्वनैमित्तिककर्तव्यता वस्तुत आसीत्’ इत्येवंपरम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000765.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000766", "originalText": "पूर्वग्रन्थसन्दर्भविरोधापत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000766.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000767", "originalText": "आस्तां मीमांसकमर्यादा।", "padacchedaText": "", "audioFile": "PB_hear2read_000767.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000768", "originalText": "श्यामतदुत्तररक्तरूपन्यायेन क्रमिककर्तव्यताद्वयोत्पत्त्युपगमे को विरोधः।", "padacchedaText": "", "audioFile": "PB_hear2read_000768.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000769", "originalText": "उच्यते − तथा हि − किं तत्कर्तव्यत्वम्, यत् परनैमित्तिककर्तव्यतोत्पत्त्या निवर्तेत।", "padacchedaText": "", "audioFile": "PB_hear2read_000769.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000770", "originalText": "न तावत् पूर्वनैमित्तिकस्य कृतिसाध्यत्वयोग्यत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000770.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000771", "originalText": "तस्य पश्चादप्यनपायात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000771.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000772", "originalText": "नापि फलमुखं कृतिसाध्यत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000772.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000773", "originalText": "तस्य पूर्वमप्यजननात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000773.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000774", "originalText": "नापि यदननुष्ठाने क्रतोर्वैकल्यं तत्त्वम्, अङ्गत्वं वा।", "padacchedaText": "", "audioFile": "PB_hear2read_000774.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000775", "originalText": "अननुष्ठाने क्रतुवैकल्यप्रयोजकत्वस्य नियमविशेषरूपत्वेन, कर्माङ्गत्वस्य फलोपकारितया सन्निपातितया वा कारणत्वविशेषरूपत्वेन च, तयोः कादाचित्कत्वायोगेन स्वाभाविकत्वनिर्वाहाय ‘पश्चाद्भाविविरुद्धापच्छेदाभाववतः क्रतोः पूर्वापच्छेदनैमित्तिकमङ्गं तत्रैव तदननुष्ठानं क्रतुवैकल्यप्रयोजकं’ इति विशेषणीयतया पाश्चात्त्यापच्छेदान्तरवति क्रतौ पूर्वापच्छेदनैमित्तिके क्रत्वङ्गत्वस्य तदनुष्ठाने क्रतुवैकल्यप्रयोजकत्वस्य वा पाश्चात्त्यापच्छेदोत्पत्तेः पूर्वमसम्भवात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000775.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000776", "originalText": "न हि − वस्तु किञ्चिद्वस्त्वन्तरं प्रति कञ्चित्कालं व्यप्यं पश्चान्नेति वा, कञ्चित्कालं कारणं पश्चान्नेति वा, क्वचिद्दृष्टं युक्तं वा।", "padacchedaText": "", "audioFile": "PB_hear2read_000776.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000777", "originalText": "नापि कर्तव्यत्वं नाम धर्मान्तरमेव आगमापाययोग्यं कल्प्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000777.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000778", "originalText": "मानाभावात्, विरुद्धापच्छेदशास्त्रयोः पदाहवनीयशास्त्रवद्व्यवस्थोपपत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000778.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000779", "originalText": "तस्मात् निरालम्बनं क्रमिककर्तव्यताद्वयोत्पत्तिवचः।", "padacchedaText": "", "audioFile": "PB_hear2read_000779.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000780", "originalText": "ननु चोपक्रमाधिकरणन्यायेन असञ्जातविरोधित्वात् प्रत्यक्षमेव आगमात् बलीयः किं न स्यात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000780.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000781", "originalText": "उच्यते − यत्रैकवाक्यता प्रतीयते तत्रैकस्मिन्नेवार्थे पर्यवसानेन भाव्यम्, अर्थभेदे प्रतितैकवाक्यताभङ्गप्रसङ्गात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000781.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000782", "originalText": "अतस्तत्र प्रथमसञ्जातप्रतिपक्षेण ‘प्रजापतिर्वरुणायाश्वमनयत्’ (तै.सं. २. ३. १२) इत्याद्युपक्रमेण परकृतिसरूपार्थवादेन दातुरिष्टौ बुद्धिमधिरोपितायां तद्विरुद्धार्थं ‘यावतोऽश्वान् प्रतिगृह्णीयात्तावतो वारुणान् चतुष्कपालान्निर्वपेत्’ इत्युपसंहारगतपदजातम् उपजातप्रतिपक्षत्वात् यथाश्रुतार्थसमर्पणेन तदेकवाक्यतामप्रतिपद्यमानम् एकवाक्यतानिर्वाहाय णिजर्थमन्तर्भाव्य तदानुगुण्येनैवात्मानं लभत इति उपक्रमस्य प्राबल्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000782.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000783", "originalText": "यत्र तु परस्परमेकवाक्यता न प्रतीयते तत्र पूर्ववृत्तमविगणय्य लब्धात्मकं विरुद्धार्थकं वाक्यं स्वार्थं बोधयत्येवेति न तत्र पूर्ववृत्तस्य प्राबल्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000783.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000784", "originalText": "अत एव षोडशिग्रहणवाक्यं पूर्ववृत्तमविगणय्य तदग्रहणवाक्यस्यापि स्वार्थबोधकत्वमुपेयते।", "padacchedaText": "", "audioFile": "PB_hear2read_000784.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000785", "originalText": "किन्तु उभयोर्विषयान्तराभावात् अगत्या तत्रैव विकल्पानुष्ठानमिष्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000785.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000786", "originalText": "एवं च अद्वैतागमस्य प्रत्यक्षेणैकवाक्यत्वशङ्काभावात् पूर्ववृत्तमपि तदविगणय्य स्वार्थबोधकत्वमप्रतिहतम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000786.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000787", "originalText": "तदर्थबोधजनने च ‘पूर्वं परमजातत्वादबाधित्वैव जायते। परस्यानन्यथोत्पादात् नाद्याबाधेन सम्भवः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000787.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000788", "originalText": "’ (तन्त्रवा ३. ३. १४) इत्यपच्छेदन्यायस्यैव प्रवृत्तिः, नोपक्रमन्यायस्य।", "padacchedaText": "", "audioFile": "PB_hear2read_000788.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000789", "originalText": "अत एव लोकेऽपि प्रथमप्रवृत्तं शुक्तिरूप्यप्रत्यक्षम् आप्तोपदेशेन बाध्यते इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000789.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000790", "originalText": "प्रपञ्चमिथ्यात्वश्रुतेः उपजीव्यप्रत्यक्षविरोध परिहारः\nननु−तथाप्युपजीव्यत्वेन प्रत्यक्षस्यैव प्राबल्यं दुर्वारम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000790.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000791", "originalText": "अपच्छेदशास्त्रयोर्हि न पूर्वं परस्योपजीव्यमिति युक्तः परेण पूर्वस्य बाधः।", "padacchedaText": "", "audioFile": "PB_hear2read_000791.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000792", "originalText": "इह तु वर्णपदादिस्वरूपग्राहकतया मिथ्यात्वबोधकागमं प्रति प्रत्यक्षस्योपजीव्यत्वात् आगमस्यैव तद्विरुद्धमिथ्यात्वाबोधकत्वरूपो बाधो युज्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000792.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000793", "originalText": "न च मिथ्यात्वश्रुत्या वर्णपदादिसत्यत्वांशोपमर्देऽपि उपजीव्यस्वरूपांशोपमर्दाभावात् नोपजीव्यविरोध इति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000793.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000794", "originalText": "‘नेह नानास्ति किञ्चन’ (क.उ. २. ४. ११) इत्यादिश्रुतिभिः स्वरूपेणैव प्रपञ्चाभावबोधनात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000794.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000795", "originalText": "अत्र केचिदाहुः − वृषमानयेत्यादिवाक्यं श्रवणदोषात् वृषभमानयेत्यादिरूपेण शृण्वतोऽपि शाब्दप्रमितिदर्शनेन शाब्दप्रमितौ वर्णपदादिप्रत्यक्षं प्रमाभ्रमसाधारणमेवापेक्षितमिति अद्वैतागमेन वर्णपदादिप्रत्यक्षमात्रमुपजीव्यं न तत्प्रमा।", "padacchedaText": "", "audioFile": "PB_hear2read_000795.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000796", "originalText": "तथा च वर्णपदादिस्वरूपोपमर्देऽपि नोपजीव्यविरोध इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000796.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000797", "originalText": "अन्ये त्वाहु: − शाब्दप्रमितौ वर्णपदादिस्वरूपसिद्ध्यनपेक्षायामपि अयोग्यशब्दात् प्रमित्यनुदयात् योग्यतास्वरूपसिद्ध्यपेक्षाऽस्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000797.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000798", "originalText": "तदपेक्षायामपि नोपजीव्यविरोधः।", "padacchedaText": "", "audioFile": "PB_hear2read_000798.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000799", "originalText": "‘नेह नानास्ति’ इति श्रुत्या निषेधेऽपि यावद्ब्रह्मज्ञानमनुवर्तमानस्यार्थक्रियासंवादिनोऽसद्विलक्षणप्रपञ्चस्वरूपस्याङ्गीकारात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000799.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000800", "originalText": "अन्यथा प्रत्यक्षादीनां व्यावहारिकप्रमाणानां निर्विषयत्वप्रसङ्गात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000800.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000801", "originalText": "न च −स्वरूपेण निषेधेऽपि कथं प्रपञ्चस्वरूपस्यात्मलाभः, निषेधस्य प्रतियोग्यप्रतिक्षेपरूपत्वे व्याघातात्— इति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000801.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000802", "originalText": "शुक्तौ ‘इदं रजतं’ ‘नेदं रजतं’ इति प्रतीतिद्वयानुरोधेन अधिष्ठानगताध्यस्ताभावस्य बाधपर्यन्तानुवृत्तिकासद्विलक्षणप्रतियोगिस्वरूपसहिष्णुत्वाभ्युपगमात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000802.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000803", "originalText": "एतेन प्रपञ्चस्य स्वरूपेण निषेधे शशशृङ्गवदसत्त्वमेव स्यादिति निरस्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000803.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000804", "originalText": "ब्रह्मज्ञाननिवर्त्यस्वरूपाङ्गीकारेण वैषम्यात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000804.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000805", "originalText": "न च अस्याध्यस्तस्य अधिष्ठाने स्परूपेण निषेधे अन्यत्र तस्य स्वरूपेण निषेधः स्वतस्सिद्ध इति तस्य सर्वदेशकालसम्बन्धिनिषेधप्रतियोगित्वापत्त्या असत्त्वं दुर्वारम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000805.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000806", "originalText": "‘सर्वदेशकालसम्बन्धिनिषेधप्रतियोगित्वमसत्त्वं’ इत्येवासत्त्वनिर्वचनात्, विधान्तरेण तन्निर्वचनायोगादिति−वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000806.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000807", "originalText": "असतः सर्वदेशकालसम्बन्धिनिषेधप्रतियोगित्वमुपगच्छता तस्य तथात्वे, प्रत्यक्षस्य सर्वदेशकालयोः प्रत्यक्षीकरणायोगेन आगमस्य तादृशागमानुपलम्भेन च प्रमाणयितुमशक्यतया, अनुमानमेव प्रमाणयितव्यमिति तदनुमाने यत् सद्व्यावृत्तं लिङ्गं वाच्यं तस्यैव प्रथमप्रतीतस्य असत्त्वनिर्वचनत्वोपपत्ते: − इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000807.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000808", "originalText": "अपरे तु−नेह नानास्तीति श्रुतेः सत्यत्वेन प्रपञ्चनिषेध एव तात्पर्यं न स्वरूपेण।", "padacchedaText": "", "audioFile": "PB_hear2read_000808.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000809", "originalText": "स्वरूपेण निषेधस्य स्वरूपाप्रतिक्षेपकत्वे तस्य तन्निषेधत्वायोगात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000809.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000810", "originalText": "तत्प्रतिक्षेपकत्वे प्रत्यक्षविरोधात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000810.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000811", "originalText": "न च सत्यत्वस्यापि ‘सन् घटः’ इत्यादिप्रत्यक्षसिद्धत्वात् न तेनापि रूपेण निषेधो युक्त इति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000811.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000812", "originalText": "प्रत्यक्षस्य श्रुत्यविरोधाय सत्यत्वाभासरूपव्यावहारिकसत्यत्वविषयत्वोपपत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000812.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000813", "originalText": "न चैवं सति पारमार्थिकसत्यत्वस्य ब्रह्मगतस्य प्रपञ्चे प्रसक्त्यभावात् तेन रूपेण प्रपञ्चनिषेधानुपपत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000813.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000814", "originalText": "यथा शुक्तौ रजताभासप्रतीतिरेव सत्यरजतप्रसक्तिरिति तन्निषेधः, अत एव ‘नेदं रजतं किं तु तत्’ ‘नेयं मदीया गौः किं तु सैव’ ‘नात्र वर्तमानश्चैत्रः किं त्वपवरके’ इति निषिध्यमानस्यान्यत्र सत्त्वमवगम्यते, एवं सत्यत्वाभासप्रतीतिरेव सत्यत्वप्रसक्तिरिति तन्निषेधोपपत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000814.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000815", "originalText": "अतो वर्णपदयोग्यतादिस्वरूपोपमर्दशङ्काभावान्नोपजीव्यविरोध इत्याहु:।", "padacchedaText": "", "audioFile": "PB_hear2read_000815.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000816", "originalText": "अन्ये तु— ब्रह्मणि पारमार्थिकसत्यत्वम्, प्रपञ्चे व्यावहारिकसत्यत्वं सत्यत्वाभासरूपम्, शुक्तिरजतादौ प्रातिभासिकसत्यत्वं ततोऽपि निकृष्टम्, इति सत्तात्रैविध्यं नोपेयते।", "padacchedaText": "", "audioFile": "PB_hear2read_000816.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000817", "originalText": "अधिष्ठानब्रह्मगतपारमार्थिकसत्तानुवेधादेव घटादौ शुक्तिरजतादौ च सत्त्वाभिमानोपपत्त्या सत्यत्वाभासकल्पनस्य निष्प्रमाणकत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000817.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000818", "originalText": "एवं च प्रपञ्चे सत्यत्वप्रतीत्यभावात् तत्तादात्म्यापन्ने ब्रह्मणि तत्प्रतीतेरेव अविवेकेन प्रपञ्चे तत्प्रसक्तित्वोपपत्तेश्च सत्यत्वेन प्रपञ्चनिषेधे नोपजीव्यविरोधः, न वा अप्रसक्तनेषेधनम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000818.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000819", "originalText": "न च ब्रह्मगतपारमार्थिकसत्तातिरेकेण प्रपञ्चे सत्त्वाभासानुपगमे व्यवहितसत्यरजतातिरेकेण शुक्तौ रजताभासोत्पत्तिः किमर्थमुपेयत इति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000819.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000820", "originalText": "व्यवहितस्यासन्निकृष्टस्यापरोक्ष्यासम्भवात् तन्निर्वाहाय तदुपगमात् इत्याहुः।", "padacchedaText": "", "audioFile": "PB_hear2read_000820.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000821", "originalText": "प्रतिबिम्बस्य बिम्बभेदाभेदाभ्यां मिथ्यात्वसत्यत्वविचारः\nनन्वेवं प्रतिबिम्बभ्रमस्थलेऽपि ग्रीवास्थमुखातिरेकेण दर्पणे मुखाभासोत्पत्तिरुपेया स्यात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000821.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000822", "originalText": "स्वकीये ग्रीवास्थमुखे नासाद्यवच्छिन्नप्रदेशापरोक्ष्यसम्भवेऽपि नयनगोलकललाटादिप्रदेशापरोक्ष्ययोगात्, प्रतिबिम्बभ्रमे नयनगोलकादिप्रदेशापरोक्ष्यदर्शनाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000822.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000823", "originalText": "न च बिम्बातिरिक्तप्रतिबम्बाभ्युपगमे इष्टापत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000823.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000824", "originalText": "ब्रह्मप्रतिबिम्बजीवस्यापि ततो भेदेन मिथ्यात्वापत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000824.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000825", "originalText": "अत्र विवरणानुसारिणः प्राहुः− ग्रीवास्थ एव मुखे दर्पणोपाधिसन्निधानदोषात् दर्पणस्थत्वप्रत्यङ्मुखत्वबिम्बभेदानामध्याससम्भवेन न दर्पणे मुखस्याप्यध्यासः कल्पनीयः, गौरवात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000825.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000826", "originalText": "‘दर्पणे मुखं नास्ति’ इति संसर्गमात्रबाधात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000826.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000827", "originalText": "मिथ्यावस्त्वन्तरत्वे ‘नेदं मुखं’ इति स्वरूपबाधापत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000827.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000828", "originalText": "‘दर्पणे मम मुखं भाति’ इति स्वमुखाभेदप्रत्यभिज्ञानाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000828.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000829", "originalText": "न च ग्रीवास्थमुखस्याधिष्ठानस्यापरोक्ष्यासम्भवः।", "padacchedaText": "", "audioFile": "PB_hear2read_000829.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000830", "originalText": "उपाधिप्रतिहतनयनरश्मीनां परावृत्य बिम्बग्राहित्वनियमाभ्युपगमात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000830.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000831", "originalText": "तन्नियमानभ्युपगमे परमाणोः कुड्यादिव्यवहितस्थूलस्यापि चाक्षुषप्रतिबिम्बभ्रमप्रसङ्गात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000831.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000832", "originalText": "न चाव्यवहितस्थूलोद्भूतरूपवत एव चाक्षुषप्रतिबिम्बभ्रमः नान्यस्येति नियम इति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000832.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000833", "originalText": "बिम्बस्थौल्योद्भूतरूपयोः क्लृप्तेन चाक्षुषज्ञानजननेन उपयोगसम्भवे विधान्तरेणोपयोगकल्पनानुपपत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000833.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000834", "originalText": "कुड्यादिव्यवधानस्य प्रतिहतनयनरश्मिसम्बन्धविघटनं विनैव इह प्रतिबन्धकत्वे तथैव घटप्रत्यक्षादिस्थलेऽपि तस्य प्रतिबन्धकत्वसम्भवेन चक्षुःसन्निकर्षमात्रस्य कारणत्वविलोपप्रसङ्गाच्च, दर्पणे मिथ्यामुखाध्यासवादिनापि कारणत्रयान्तर्गतसंस्कारसिद्ध्यर्थं नयनरश्मीनां कदाचित् परावृत्त्य स्वमुखग्राहकत्वकल्पनयैव पूर्वानुभवस्य समर्थनीयत्वाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000834.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000835", "originalText": "न च नासादिप्रदेशावच्छिन्नपूर्वानुभवादेव संस्कारोपपत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000835.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000836", "originalText": "तावता नयनगोलकादिप्रतिबिम्बाध्यासानुपपत्तेः, तटाकसलिले तटविटपिसमारूढादृष्टचरपुरुषप्रतिबिम्बाध्यासस्थले कथमपि पूर्वानुभवस्य दुर्वचत्वाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000836.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000837", "originalText": "एवं च उपाधिप्रतिहतनयनरश्मीनां बिम्बं प्राप्य तद्ग्राहकत्वेऽवश्यं वक्तव्ये फलबलात्— दर्पणाद्यभिहतानामेव बिम्बं प्राप्यतद्ग्राहकत्वम्, न शिलादिप्रतिहतानाम्, अनतिस्वच्छताम्रादिप्रतिहतानां मलिनोपाधिसम्बन्धदोषात् मुखादिसंस्थानविशेषाग्राहकत्वम्, साक्षात्सूर्यं प्रेप्सूनामिव उपाधिं प्राप्य निवृत्तानां न तथा सौरतेजसा प्रतिहतिरिति न प्रतिबिम्बसूर्यावलोकने साक्षात्तदवलोकन इव अशक्यत्वम्, जलाद्युपाधिसन्निकर्षे केषाञ्चित् उपाधिप्रतिहतानां बिम्बप्राप्तावपि केषाञ्चित् तदन्तर्गमनेनान्तरसिकतादिग्रहणं— इत्यादिकल्पनान्न कश्चिद्दोष इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000837.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000838", "originalText": "अद्वैतविद्याकृतस्तु प्रतिबिम्बस्य मिथ्यात्वमभ्युपगच्छतां त्रिविधजीववादिनां विद्यारण्यगुरुप्रभृतीनामभिप्रायमेवमाहु: − चैत्रमुखात् भेदेन तत्सदृशत्वेन च पार्श्वस्थैः स्पष्टं निरीक्ष्यमाणं दर्पणे तत्प्रतिबिम्बं ततो भिन्नं स्वरूपतो मिथ्यैव, स्वकरगतादिव रजतात् शुक्तिरजतम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000838.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000839", "originalText": "न च ‘दर्पणे मम मुखं भाति’ इति बिम्बाभेदज्ञानविरोधः।", "padacchedaText": "", "audioFile": "PB_hear2read_000839.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000840", "originalText": "स्पष्टभेदद्वित्वप्रत्यङ्मुखत्वादिज्ञानविरोधेन अभेदज्ञानासम्भवात्, ‘दर्पणे मम मुखं’ इति व्यपदेशस्य स्वच्छायां मुखे स्वमुखव्यपदेशवत् गौणत्वाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000840.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000841", "originalText": "न च अभेदज्ञानविरोधात् भेदव्यपदेश एव गौणः किं न स्यादिति शङ्क्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000841.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000842", "originalText": "बालानां प्रतिबिम्बे पुरुषान्तरभ्रमस्य हानोपादित्साद्यर्थक्रियापर्यन्तस्य अपलपितुमशक्यत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000842.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000843", "originalText": "न च प्रेक्षावतामपि स्वमुखविशेषपरिज्ञानाय दर्पणाद्युपादानदर्शनात् अभेदज्ञानमप्यर्थक्रियापर्यन्तमिति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000843.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000844", "originalText": "भेदेऽपि प्रतिबिम्बस्य बिम्बसमानाकारत्वनियमविशेषपरिज्ञानादेव तदुपादानोपपत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000844.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000845", "originalText": "यत्तु— नात्र मुखमिति दर्पणे मुखसंसर्गमात्रस्य बाधः, न मुखस्येति, तन्न— ‘नेदं रजतमि’त्यत्रापि इदमर्थे रजततादात्म्यमात्रस्य बाधो न रजतस्येत्यापत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000845.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000846", "originalText": "यदि च इदमंशे रजतस्य तादात्म्येनाध्यासात् नेदं रजतमिति तादात्म्येन रजतस्यैव बाधः न तादात्म्यमात्रस्य, तदा दर्पणे मुखस्य संसर्गितयाऽध्यासात् नात्रमुखमिति संसर्गितया मुखस्यैव बाधः न संसर्गमात्रस्येति तुल्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000846.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000847", "originalText": "यत्तु धर्मिणोऽप्यध्यासकल्पने गौरवमिति, तद्रजताभासकल्पनागौरववत् प्रामाणिकत्वान्न दोषः।", "padacchedaText": "", "audioFile": "PB_hear2read_000847.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000848", "originalText": "स्वनेत्रगोलकादिप्रतिबिम्बभ्रमस्थले बिम्बापरोक्ष्यकल्पनोपायाभावात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000848.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000849", "originalText": "नयनरश्मीनामुपाधिप्रतिहतानां बिम्बप्राप्तिकल्पने हि दृष्टविरुद्धं बह्वापद्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000849.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000850", "originalText": "कथं जलसन्निकर्षे केषुचिन्नयनरश्मिषु अप्रतिहतमन्तर्गच्छत्सु अन्ये जलसम्बन्धेनापि प्रतिहन्यमाना नितान्तमृदवः सकलनयनरश्मिप्रतिघातिनं किरणसमूहं निर्जित्य तन्मध्यगतं सूर्यमण्डलं प्रविशेयुः।", "padacchedaText": "", "audioFile": "PB_hear2read_000850.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000851", "originalText": "कथं च चन्द्रावलोकन इव तत्प्रतिबिम्बावलोकनेऽपि अमृतशीतलतद्बिम्बसन्निकर्षाविशेषे लोचनयोः शैत्याभिव्यक्त्या आप्यायनं न स्यात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000851.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000852", "originalText": "कथं च जलसम्बन्धेनापि प्रतिहन्यमानाः शिलादिसम्बन्धेन न प्रतिहन्येरन्, तत्प्रतिहत्या परावृत्तौ वा नयनगोलकादिभिर्न संसृज्येरन्, तत्संसर्गे वा संसृष्टं न साक्षात्कारयेयुः।", "padacchedaText": "", "audioFile": "PB_hear2read_000852.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000853", "originalText": "दोषेणापि हि विशेषांशग्रहणमात्रं प्रतिबध्यमानं दृश्यते, न तु सन्निकृष्टधर्मिस्वरूपग्रहणमपि।", "padacchedaText": "", "audioFile": "PB_hear2read_000853.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000854", "originalText": "प्रतिमुखाध्यासपक्षे तु न किञ्चिद्दृष्टविरुद्धं कल्पनीयम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000854.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000855", "originalText": "तथा हि— अव्यवहितस्थूलोद्भूतरूपस्यैव चाक्षुषाध्यासदर्शनात् बिम्बगतस्थौल्योद्भूतरूपयोः स्वाश्रयसाक्षात्कारकारणत्वेन क्लृप्तयोः स्वाश्रयप्रतिबिम्बाध्यासेऽपि कारणत्वम्, कुड्याद्यावरणद्रव्यस्य त्वगिन्द्रियन्यायेन प्राप्यकारितयावगतनयनसन्निकर्षविघटनद्वारा व्यवहितवस्तुसाक्षात्कारप्रतिबन्धकत्वेन क्लृप्तस्य व्यवहितप्रतिबिम्बाध्यासेऽपि विनैव द्वारान्तरं प्रतिबन्धकत्वं च कल्पनीयम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000855.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000856", "originalText": "तत्र को विरोधः क्वचित्कारणत्वादिना क्लृप्तस्य फलबलादन्यत्रापि कारणत्वादिकल्पने।", "padacchedaText": "", "audioFile": "PB_hear2read_000856.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000857", "originalText": "एतेन− उपाधिप्रतिहतनयनरश्मीनां बिम्बप्राप्त्यनुगमने व्यवहितस्योद्भूतरूपादिरहितस्य च चाक्षुषप्रतिबिम्बभ्रमप्रसङ्ग इति−निरस्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000857.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000858", "originalText": "किं च तदुपगम एव उक्तदूषणप्रसङ्गः।", "padacchedaText": "", "audioFile": "PB_hear2read_000858.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000859", "originalText": "कथम्? साक्षात् सूर्यावलोकन इव विनापि चक्षुर्विक्षेपम् अवनतमौलिना निरीक्ष्यमाणे सलिले तत्प्रतिहतानां नयनरश्मीनामूर्ध्वमुत्प्लुत्य बिम्बसूर्यग्राहकत्ववत् तिर्यक्चक्षुर्विक्षेपं विना ऋजुचक्षुषा दर्पणे विलोक्यमाने तत्प्रतिहतानां पर्श्वस्थमुखग्राहकत्ववच्च वदनसाचीकरणाभावेऽप्युपाधिप्रतिहतानां पृष्ठभागव्यवहितग्राहकत्वं तावत् दुर्वारम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000859.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000860", "originalText": "उपाधिप्रतिहतनयनरश्मीनां प्रतिनिवृत्तिनियमं विहाय यत्र बिम्बं तत्रैव गमनोपगमात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000860.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000861", "originalText": "तथा मलिनदर्पणे श्यामतया गौरमुखप्रतिबिम्बस्थले विद्यमानस्यापि बिम्बगतगौररूपस्य चाक्षुषज्ञानेऽनुपयोगितया पीतशङ्खभ्रमन्यायेनारोप्यरूपवैशिष्ट्येनैव बिम्बमुखस्य चाक्षुषत्वं निर्वाह्यमिति तथैव नीरूपस्यापि दर्पणोपाधिश्यामत्ववैशिष्ट्येन चाक्षुषप्रतिबिम्बभ्रमविषयत्वमपि दुर्वारम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000861.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000862", "originalText": "स्वतो नीरूपस्यापि नभसोऽध्यस्तनैल्यवैशिष्ट्येन चाक्षुषत्वसंप्रतिपत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000862.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000863", "originalText": "तस्मात् स्वरूपतः प्रतिमुखाध्यासपक्ष एव श्रेयन्।", "padacchedaText": "", "audioFile": "PB_hear2read_000863.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000864", "originalText": "न च तत्रापि पूर्वानुभवसंस्कारदौर्घट्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000864.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000865", "originalText": "पुरुषसामान्यानुभवसंस्कारमात्रेण स्वप्नेष्वदृष्टचरपुरुषाध्यासवत् मुखसामान्यानुभवसंस्कारमात्रेण दर्पणेषु मुखविशेषाध्यासोपपत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000865.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000866", "originalText": "इयांस्तु भेदः− स्वप्नेषु शुभाशुभहेत्वदृष्टानुरोधेन पुरुषाकृतिविशेषाध्यासः, इह तु बिम्बसन्निधानानुरोधेन मुखाकृतिविशेषाध्यास इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000866.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000867", "originalText": "न च प्रतिबिम्बस्य स्वरूपतो मिथ्यात्वे ब्रह्मप्रतिबिम्बजीवस्यापि मिथ्यात्वापत्तिर्दोषः।", "padacchedaText": "", "audioFile": "PB_hear2read_000867.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000868", "originalText": "प्रतिबिम्बजीवस्य तथात्वेऽपि अवच्छिन्नजीवस्य सत्यतया मुक्तिभाक्त्वोपपत्तेरिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000868.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000869", "originalText": "यत्तु प्रतिबिम्बं दर्पणादिषु मुखच्छायाविशेषरूपतया सत्यमेवेति कस्यचिन्मतं, तन्न।", "padacchedaText": "", "audioFile": "PB_hear2read_000869.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000870", "originalText": "छाया हि नाम शरीरादेः शरीरतदवयवैः आलोके कियद्देशव्यापिनि निरुद्धे तत्र देशे लब्धात्मकं तम एव।", "padacchedaText": "", "audioFile": "PB_hear2read_000870.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000871", "originalText": "न च मौक्तिकमाणिक्यादिप्रतिबिम्बस्य तमोविरुद्धसितलोहितादिरूपवतः तमोरूपच्छायात्वं यक्तम्, न वा तमोरूपच्छायारहिततपनादिप्रतिबिम्बस्य तथात्वमुपपन्नम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000871.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000872", "originalText": "ननु— तर्हि प्रतिबिम्बरूपच्छायायाः तमोरूपत्वासम्भवे द्रव्यान्तरत्वमस्तु, क्लृप्तद्रव्यानन्तर्भावे तमोवत् द्रव्यान्तरत्वकल्पनोपपत्तेरिति चेत्, तत् किं द्रव्यान्तरं प्रतीयमानरूपपरिमाणसंस्थानविशेषप्रत्यङ्मुखत्वादिधर्मयुक्तं तद्रहितं वा स्यात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000872.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000873", "originalText": "अन्त्ये न तेन द्रव्यान्तरेण रूपविशेषादिघटितप्रतिबिम्बोपलम्भनिर्वाह इति व्यर्थं तत्कल्पनम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000873.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000874", "originalText": "प्रथमे तु कथम् एकस्मिन्नल्पपरिमाणे युगपदसङ्कीर्णतया प्रतीयमानानां महापरिमाणानामनेकमुखप्रतिबिम्बानां सत्यतानिर्वाहः।", "padacchedaText": "", "audioFile": "PB_hear2read_000874.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000875", "originalText": "कथं च निबिडावयवानुस्यूते दर्पणे तथैवावतिष्ठमाने तदन्तः हनुनासिकाद्यनेकनिम्नोन्नतप्रदेशवतो द्रव्यान्तरस्योत्पत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000875.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000876", "originalText": "किं च सितपीतरक्ताद्यनेकवर्णादिमतः प्रतिबिम्बस्योत्पत्तौ दर्पणमध्ये स्थितं तत्सन्निहितं न तादृशं कारणमस्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000876.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000877", "originalText": "यद्युच्येत − ‘उपाधिमध्यविश्रान्तियोग्यपरिमाणानामेव प्रतिबिम्बानां महापरिमाणज्ञानं तादृशनिम्नोन्नतादिज्ञानं च भ्रम एव।", "padacchedaText": "", "audioFile": "PB_hear2read_000877.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000878", "originalText": "यथापूर्वं दर्पणतदवयवावस्थानाविरोधेन तादृक्प्रतिबिम्बोत्पादनसमर्थं च किञ्चित् कारणं कल्प्यमि’ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000878.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000879", "originalText": "तर्हि शुक्तिरजतमपि सत्यमस्तु।", "padacchedaText": "", "audioFile": "PB_hear2read_000879.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000880", "originalText": "तत्रापि शुक्तौ यथापूर्वं स्थितायामेव तत्तादात्म्यापन्नरजतोत्पादनसमर्थं किञ्चित्कारणं परिकल्प्य तस्य रजतस्य दोषत्वाभिमतकारणसहकृतेन्द्रियग्राह्यत्वनियमवर्णनोपपत्तेः किं शुक्तिरजतमसत्यं प्रतिबिम्बः सत्य इत्यर्धजरतीयन्यायेन।", "padacchedaText": "", "audioFile": "PB_hear2read_000880.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000881", "originalText": "न च तथासति रजतमितिदृश्यमानायाः शुक्तेः अग्नौ प्रक्षेपे रजतवत् द्रवीभावापत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000881.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000882", "originalText": "अनलकस्तूरिकादिप्रतिबिम्बस्यौष्ण्यसौरभ्यादिराहित्यवत् शुक्तिरजतस्य द्रवीभावयोग्यताराहित्योपपत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000882.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000883", "originalText": "अथोच्येत— ‘नेदं रजतं’ ‘मिथ्यैव रजतमभात्’ इति सर्वसम्प्रतिपन्नबाधात् न शुक्तिरजतं सत्यमिति, तर्हि ‘दर्पणे मुखं नास्ति मिथ्यैवात्र दर्पणे मुखमभात्’ इत्यादि सर्वसिद्धबाधात् प्रतिबिम्बमप्यसत्यमित्येव युक्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000883.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000884", "originalText": "तस्मादसङ्गतः प्रतिबिम्बसत्यत्ववादः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000884.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000885", "originalText": "ननु तन्मिथ्यात्ववादोऽप्ययुक्तः।", "padacchedaText": "", "audioFile": "PB_hear2read_000885.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000886", "originalText": "शुक्तिरजत इव कस्यचिदन्वयव्यतिरेकशालिनः कारणस्याज्ञानस्य निवर्तकस्य ज्ञानस्य चानिरूपणात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000886.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000887", "originalText": "अत्र केचित्— यद्यपि सर्वात्मनाऽधिष्ठानज्ञानानन्तरमपि जायमाने प्रतिबिम्बाध्यासे नाधिष्ठानावरणमज्ञानमुपादानं न वाऽधिष्ठानविशेषांशज्ञानं निवर्तकम्, तथाऽपि अधिष्ठानाज्ञानस्य आवरणशक्त्यंशेन निवृत्तावपि विक्षेपशक्त्यंशेनानुवृत्तिसम्भवात् तदेवोपादानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000887.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000888", "originalText": "बिम्बोपाधिसन्निधिनिवृत्तिसचिवं चाधिष्ठानज्ञानं सोपादानस्य तस्य निवर्तकम् इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000888.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000889", "originalText": "अन्ये तु−ज्ञानस्य विक्षेपशक्त्यंशं विहाय आवरणशक्त्यंशमात्रनिवर्तकत्वं न स्वाभाविकम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000889.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000890", "originalText": "ब्रह्मज्ञानेन मूलाज्ञानस्य शुक्त्यादिज्ञानेनावस्थाज्ञानस्य च आवरणशक्त्यंशमात्रनिवृत्तौ तस्य विक्षेपशक्त्या सर्वदा अनुवृत्तिप्रसङ्गात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000890.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000891", "originalText": "न च विम्बोपाधिसन्निधिरूपविक्षेपशक्त्यंशनिवृत्तिप्रतिबन्धकप्रयुक्तं तत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000891.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000892", "originalText": "बिम्बोपाधिसन्निधानात् प्रागेव बिम्बे चैत्रमुखे दर्पणसंसर्गाद्यभावे दर्पणे चैत्रमुखाभावे वा प्रत्यक्षतोऽवगम्यमाने विक्षेपशक्त्यंशस्यापि निवृत्त्यवश्यम्भावेन तत्काले तयोस्सन्निधाने सति उपादानाभावेन प्रतिबिम्बभ्रमाभावप्रसङ्गात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000892.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000893", "originalText": "अतो मूलाज्ञानमेव प्रतिबिम्बाध्यासस्योपादानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000893.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000894", "originalText": "न चात्राप्युक्तदोषतौल्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000894.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000895", "originalText": "पराग्विषयवृत्तिपरिणामानां स्वस्वविषयावच्छिन्नचैतन्यप्रदेशे मूलाज्ञानावरणशक्त्यंशाभिभावकत्वेऽपि तदीयविक्षेपशक्त्यंशानिवर्तकत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000895.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000896", "originalText": "अन्यथा तत्प्रदेशस्थितव्यावहारिकविक्षेपाणामपि विलयापत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000896.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000897", "originalText": "न च प्रतिबिम्बस्य मूलाज्ञानकार्यत्वे व्यावहारिकत्वापत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000897.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000898", "originalText": "अविद्यातिरिक्तदोषाजन्यत्वस्य व्यवहारिकत्वप्रयोजकत्वात्‌, प्रकृते च तदतिरिक्तबिम्बोपाधिसन्निधानदोषसद्भावेन प्रातिभासिकत्वोपपत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000898.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000899", "originalText": "न च −एवं सति बिम्बोपाधिसन्निधिनिवृत्तिसहकृतस्याप्यधिष्ठानज्ञानस्य प्रतिबिम्बाध्यासानिवर्तकत्वप्रसङ्गः, तन्मूलाज्ञाननिवर्तकत्वाभावात् − इति वाच्यम्, विरोधाभावात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000899.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000900", "originalText": "ब्रह्माज्ञाननिवर्तकत्वेपि तदुपादानकप्रतिबिम्बाध्यासविरोधिविषयकतया अधिष्ठानयाथात्म्यज्ञानस्य प्रतिबन्धकविरहसचिवस्य तन्निवर्तकत्वोपपत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000900.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000901", "originalText": "अवस्थाज्ञानोपादानत्वपक्षेऽपि तस्य प्राचीनाधिष्ठानज्ञाननिवर्तितावरणशक्तिकस्य समानविषयत्वभङ्गेन प्रतिबन्धकाभावकालीनाधिष्ठानज्ञानेन निवर्तयितुमशक्यतया प्रतिबिम्बाध्यासमात्रस्यैव तन्निवर्त्यत्वस्योपेयत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000901.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000902", "originalText": "अथवा स्वोपादानाज्ञाननिवर्तकब्रह्मज्ञाननिवर्त्य एवायमध्यासोऽस्तु।", "padacchedaText": "", "audioFile": "PB_hear2read_000902.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000903", "originalText": "व्यावहारिकत्वापत्तिस्तु अविद्यातिरिक्तदोषजन्यत्वेन प्रत्युक्ता— इत्याहुः।", "padacchedaText": "", "audioFile": "PB_hear2read_000903.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000904", "originalText": "स्वप्नाध्यासाधिष्ठानसत्तादिविचारः\nएवं स्वप्नाध्यासस्यापि अनवच्छिन्नचैतन्ये अहङ्कारोपहितचैतन्ये वा अवस्थारूपाज्ञानशून्येऽध्यासात् ‘सुषुप्त्याख्यं तमोऽज्ञानं बीजं स्वप्नप्रबोधयोः’ (उ.सा. १७. २६) इति आचार्याणां स्वप्नजाग्रत्प्रपञ्चयोरेकाज्ञानकार्यत्वोक्तेश्च मूलाज्ञानकार्यतया स्वोपादाननिवर्तकब्रह्मज्ञानैकबाध्यस्य अविद्यातिरिक्तनिद्रादिदोषजन्यतयैव प्रातिभासिकत्वम् इति केचिदाहुः।", "padacchedaText": "", "audioFile": "PB_hear2read_000904.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000905", "originalText": "अन्ये तु— ‘बाध्यन्ते चैते रथादयः स्वप्नदृष्टाः प्रबोधे’ इति भाष्योक्तेः ‘अविद्यात्मकबन्धप्रत्यनीकत्वात् जाग्रद्बोधवत्’ इति विवरणदर्शनात् उत्थितस्य स्वप्नमिथ्यात्वानुभवाच्च जाग्रद्बोधः स्वप्नाध्यासनिवर्तक इति ब्रह्मज्ञानेतरज्ञानबाध्यतयैव तस्य प्रातिभासिकत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000905.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000906", "originalText": "न चाधिष्ठानयाथात्म्यागोचरं स्वोपादानाज्ञानानिवर्तकं ज्ञानं कथमध्यासनिवर्तकं स्यादिति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000906.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000907", "originalText": "रज्जुसर्पाध्यासस्य स्वोपादानाज्ञाननिवर्तकाधिष्ठानयाथात्म्यज्ञानेनेव तत्रैव स्वानन्तरोत्पन्नदण्डभ्रमेणापि निवृत्तिदर्शनात्— इत्याहु
