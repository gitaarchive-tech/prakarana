ः।", "padacchedaText": "", "audioFile": "PB_hear2read_000907.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000908", "originalText": "अपरे तु जाग्रद्भोगप्रदकर्मोपरमे सति जाग्रत्प्रपञ्चद्रष्टारं प्रतिबिम्बरूपं व्यावहारिकजीवं तद्दृश्यं जाग्रत्प्रपञ्चमप्यावृत्य जायमानो निद्रारूपो मूलाज्ञानस्यावस्थाभेदः स्वाप्नप्रपञ्चाध्यासोपादानम्, न मूलाज्ञानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000908.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000909", "originalText": "न च निद्राया अवस्थाज्ञानरूपत्वे मानाभावः।", "padacchedaText": "", "audioFile": "PB_hear2read_000909.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000910", "originalText": "मूलाज्ञानेनानावृतस्य जाग्रत्प्रपञ्चद्रष्टुः व्यावहारिकजीवस्य ‘मनुष्योऽहम्, ब्राह्मणोऽहम्, देवदत्तपुत्रोऽहं’ इत्यादिना स्वात्मानमसन्दिग्धविपर्यस्तमभिमन्यमानस्य तदीयचिरपरिचयेन तं प्रति सर्वदा अनावृतैकरूपस्य अनुभूतस्वपितामहात्ययादिजाग्रत्प्रपञ्चवृत्तान्तस्य च स्वप्नसमये केनचिदावरणाभावे जागरण इव स्वप्नेऽपि ‘व्याघ्रोऽहम्, शूद्रोऽहम्, यज्ञदत्तपुत्रोऽहं’ इत्यादिभ्रमस्य स्वपितामहजीवद्दशादिभ्रमस्य च अभावप्रसङ्गेन निद्राया एव तत्कालोत्पन्नव्यावहारिकजगज्जीवावारकाज्ञानावस्थाभेदरूपत्वसिद्धेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000910.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000911", "originalText": "न चैवं जीवस्याप्यावृतत्वात् स्वप्नप्रपञ्चस्य द्रष्ट्रभावप्रसङ्गः।", "padacchedaText": "", "audioFile": "PB_hear2read_000911.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000912", "originalText": "स्वप्नप्रपञ्चेन सह द्रष्टुर्जीवस्यापि प्रातिभासिकस्य अध्यासात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000912.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000913", "originalText": "एवं च पुनर्जाग्रद्भोगप्रदकर्मोद्भूते बोधे व्यावहारिकजीवस्वरूपज्ञानात् स्वोपादाननिद्रारूपाज्ञाननिवर्तकादेव स्वाप्नप्रपञ्चबाधः।", "padacchedaText": "", "audioFile": "PB_hear2read_000913.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000914", "originalText": "न चैवं तद्द्रष्टुः प्रातिभासिकजीवस्यापि ततो बाधे ‘स्वप्ने करिणमन्वभूवं’ इत्यनुसन्धानं न स्यादिति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000914.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000915", "originalText": "व्यावहारिकजीवे प्रातिभासिकजीवस्याध्यस्ततया तदनुभवात् व्यावहारिकजीवस्यानुसन्धानोपगमेऽप्यतिप्रसङ्गाभावात् −इत्याहुः।", "padacchedaText": "", "audioFile": "PB_hear2read_000915.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000916", "originalText": "स्वप्नाध्यासाधिष्ठानविचारः\nनन्वनवच्छिन्नचैतन्ये अहङ्कारोपहितचैतन्ये वा स्वाप्नप्रपञ्चाध्यास इति प्रागुक्तं पक्षद्वयमप्ययुक्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000916.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000917", "originalText": "आद्ये— स्वाप्नगजादेः अहङ्कारोपहितसाक्षिणो विच्छिन्नदेशत्वेन सुखादिवदन्तःकरणवृत्तिसंसर्गमनपेक्ष्य तेन प्रकाशस्य चक्षुरादीनामुपरततया वृत्त्युदयासम्भवेन तत्संसर्गमपेक्ष्य तेन प्रकाशस्य च, अयोगात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000917.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000918", "originalText": "द्वितीये ‘इदं रजतमि’तिवत् ‘अहं गजः’ इति वा, ‘अहं सुखी’तिवद् ‘अहं गजवान्’ इति वा अध्यासप्रसङ्गात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000918.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000919", "originalText": "अत्र केचित् आद्यपक्षं समर्थयन्ते−अहङ्कारानवच्छिन्नचैतन्यं न देहाद्बहिः स्वाप्नप्रपञ्चस्याधिष्ठानमुपेयते, किं तु तदन्तरेव।", "padacchedaText": "", "audioFile": "PB_hear2read_000919.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000920", "originalText": "अत एव दृश्यमानपरिमाणोचितदेशसम्पत्त्यभावात् स्वाप्नगजादीनां मायामयत्वमुच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000920.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000921", "originalText": "एवं च अन्तःकरणस्य देहाद्बहिरस्वातन्त्र्यात् जागरणे बाह्यशुक्तीदमंशादिगोचरवृत्त्युत्पादाय चक्षुराद्यपेक्षायामपि देहान्तरन्तःकरणस्य स्वतन्त्रस्य स्वयमेव वृत्तिसम्भवात् देहान्तरन्तःकरणवृत्त्यभिव्यक्तस्यानवच्छिन्नचैतन्यस्याधिष्ठानत्वे न काचिदनुपपत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000921.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000922", "originalText": "अत एव— यथा जागरणे सम्प्रयोगजन्यवृत्त्यभिव्यक्तशुक्तीदमंशावच्छिन्नचैतन्यस्थिताऽविद्या रूप्याकारेण विवर्तते, तथा स्वप्नेऽपि देहस्यान्तरन्तःकरणवृत्तौ निद्रादिदोषोपप्लुतायाम् अभिव्यक्तचैतन्यस्थाविद्या अदृष्टोद्बोधितनानाविषयसंस्कारसहिता प्रपञ्चाकारेण विवर्ततामिति ववरणोपन्यासे भारतीतीर्थवचनमिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000922.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000923", "originalText": "अन्ये तु अनवच्छिन्नचैतन्यं न वृत्त्यभिव्यक्तं सत् स्वाप्नप्रपञ्चस्याधिष्ठानम्, अशब्दमूलकानवच्छिन्नचैतन्यगोचरवृत्त्युदयासम्भवात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000923.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000924", "originalText": "अहङ्काराद्यवच्छिन्नचैतन्य एव अहमाकारवृत्त्युदयदर्शनात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000924.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000925", "originalText": "तस्मात् स्वतोऽपरोक्षमहङ्काराद्यनवच्छिन्नचैतन्यं तदधिष्ठानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000925.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000926", "originalText": "अत एव सङ्क्षेपशारीरके−\n‘अपरोक्षरूपविषयभ्रमधीरपरोक्षमास्पदमपेक्ष्य भवेत्। मनसा स्वतो नयनतो यदि वा स्वपनभ्रमादिषु तथाप्रथितेः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000926.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000927", "originalText": "’ (१. ४१) इति श्लोकेन अपरोक्षाध्यासापेक्षितमधिष्ठानापरोक्ष्यं क्वचित्स्वतः क्वचिन्मानसवृत्त्या क्वचिद्बहिरिन्द्रियवृत्त्या इत्यभिधाय\n‘स्वतोऽपरोक्षा चितिरत्र विभ्रमस्तथापि रूपाकृतिरेव जायते।", "padacchedaText": "", "audioFile": "PB_hear2read_000927.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000928", "originalText": "मनोनिमित्तं स्वपतो मुहुर्मुहुर्विनापि चक्षुर्विषयं स्वमास्पदम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000928.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000929", "originalText": "मनोऽवगम्येऽप्यपरोक्षताबलात् तथाऽम्बरे रूपमुपोल्लिखन् भ्रमः। सितादिभेदैर्बहुधा समीक्ष्यते यथाऽक्षिगम्ये रजतादिविभ्रमः’॥", "padacchedaText": "", "audioFile": "PB_hear2read_000929.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000930", "originalText": "(१. ४२,४३) इत्याद्यनन्तरश्लोकेन स्वप्नाध्यासे स्वतोऽधिष्ठानापरोक्ष्यमुदाहृतम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000930.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000931", "originalText": "न चाहङ्कारानवच्छिन्नचैतन्यमात्रमावृतमिति वृत्तिमन्तरेण न तदभिव्यक्तिरिति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000931.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000932", "originalText": "ब्रह्मचैतन्यमेवावृतम् अविद्याप्रतिबिम्बजीवचैतन्यमहङ्कारानवच्छिन्नमप्यनावृतम् इत्युपगमात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000932.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000933", "originalText": "एवं च अहङ्कारानवच्छिन्नचैतन्येऽध्यस्यमाने स्वाप्नगजादौ तत्समयनियताधिष्ठानगोचरान्तःकरण(णादि) वृत्तिकृताभेदाभिव्यक्त्या प्रमातृचैतन्यस्यापि इदं पश्यामीति व्यवहारः − इत्याहुः।", "padacchedaText": "", "audioFile": "PB_hear2read_000933.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000934", "originalText": "अपरे तु द्वितीयं पक्षं समर्थयन्ते−\nअहङ्कारावच्छिन्नचैतन्यमधिष्ठानमिति अहङ्कारस्य विशेषणभावेनाधिष्ठानकोटिप्रवेशो नोपेयते, किं तु अहङ्कारोपहितं तत्प्रतिबिम्बरूपचैतन्यमात्रमधिष्ठानमिति, अतो ‘नाहं गजः’ इत्याद्यनुभवप्रसङ्ग इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000934.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000935", "originalText": "एवं शुक्तिरजतमपि शुक्तीदमंशावच्छिन्नचैतन्यप्रतिबिम्बे वृत्तिमदन्तःकरणगतेऽध्यस्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000935.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000936", "originalText": "शुक्तीदमंशावच्छिन्नबिम्बचैतन्ये सर्वसाधारणे तस्याध्यासे सुखादिवदनन्यवेद्यत्वाभावप्रसङ्गात् इति केचित्।", "padacchedaText": "", "audioFile": "PB_hear2read_000936.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000937", "originalText": "केचित्तु बिम्बचैतन्य एव तदध्यासमुपेत्य यदीयाज्ञानोपादानकं यत् तत् तस्यैव प्रत्यक्षं न जीवान्तरस्य इत्यनन्यवेद्यत्वमुपपादयन्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000937.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000938", "originalText": "स्वाप्नपदार्थानुभवस्य अनैन्द्रियकत्वनिरूपणम्\nननु शुक्तिरजताध्यासे चाक्षुषत्वानुभवः साक्षाद्वा अधिष्ठानज्ञानद्वारा तदपेक्षणाद्वा समर्थ्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000938.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000939", "originalText": "स्वाप्नगजादिचाक्षुषत्वानुभवः कथं समर्थनीयः?\nउच्यते −\nन तावत् तत्समर्थनाय स्वाप्नदेहवद्विषयवच्च इन्द्रियाणामपि प्रातिभासिको विवर्तः शक्यतेवक्तुम्, प्रातिभासिकस्याज्ञातसत्त्वाभावात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000939.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000940", "originalText": "इन्द्रियाणां चातीन्द्रियाणां सत्त्वेऽज्ञातसत्त्वस्य वाच्यत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000940.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000941", "originalText": "नापि व्यावकारिकाणामेवेन्द्रियाणां स्वस्वगोलकेभ्यो निष्क्रम्य स्वाप्नदेहमाश्रित्य स्वस्वविषयग्राहकत्वं वक्तुं शक्यते, स्वप्नसमये तेषां व्यापारराहित्यरूपोपरतिश्रवणात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000941.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000942", "originalText": "व्यावहारिकस्य स्पर्शनेन्द्रियस्य स्वोचितव्यावहारिकदेशसम्पत्तिविधुरान्तःशरीरे स्वाधिकपरिमाणकृत्स्नस्वाप्नशरीरव्यापित्वायोगाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000942.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000943", "originalText": "तदेकदेशाश्रयत्वे च तस्य स्वाप्नजलावगाहनजन्यसर्वाङ्गीणशीतस्पर्शानिर्वाहात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000943.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000944", "originalText": "अत एव−स्वप्ने जाग्रदिन्द्रियाणामुपरतावपि तैजसव्यवहारोपयुक्तानि सूक्ष्मशरीरावयवभूतानि सूक्ष्मेन्द्रियाणि सन्तीति तैः स्वाप्नपदार्थानामैन्द्रियकत्वम् इत्युपपादनशङ्कापि−निरस्ता।", "padacchedaText": "", "audioFile": "PB_hear2read_000944.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000945", "originalText": "जाग्रदिन्द्रियव्यतिरिक्तसूक्ष्मेन्द्रियाप्रसिद्धेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000945.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000946", "originalText": "किञ्च ‘अत्रायं पुरुषः स्वयञ्ज्योतिः’ (बृ.उ. ४. ३. ९) इति जागरे आदित्यादिज्योतिर्व्यतिकराच्चक्षुरादिवृत्तिसञ्चाराच्च दुर्विवेकम् आत्मनः स्वयञ्ज्योतिष्ट्वमिति स्वप्नावस्थामधिकृत्य तत्रात्मनः स्वयञ्ज्योतिष्ट्वं प्रतिपादयति।", "padacchedaText": "", "audioFile": "PB_hear2read_000946.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000947", "originalText": "अन्यथा तस्य सर्वदा स्वयञ्ज्योतिष्ट्वेन अत्रेति वैयर्थ्यात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000947.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000948", "originalText": "तत्र यदि स्वप्नेऽपि चक्षुरादिवृत्तिसञ्चारः कल्प्येत, तदा तत्रापि जागर इव तस्य स्वयञ्ज्योतिष्ट्वं दुर्विवेकं स्यादिति उदाहृता श्रुतिः पीड्येत।", "padacchedaText": "", "audioFile": "PB_hear2read_000948.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000949", "originalText": "ननु स्वप्ने चक्षुराद्युपरमकल्पनेऽपि अन्तःकरणमनुपरतमास्त इति परिशेषासिद्धेः न स्वयञ्ज्योतिष्ट्वविवेकः।", "padacchedaText": "", "audioFile": "PB_hear2read_000949.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000950", "originalText": "मैवम्— ‘कर्ता शास्त्रार्थवत्त्वात्’ (ब्र.सू. २. ३. ३३) इत्यधिकरणे न्यायनिर्णयोक्तरीत्या अन्तःकरणस्य चक्षुरादिकरणान्तरनिरपेक्षस्य ज्ञानसाधनत्वाभावाद्वा तत्त्वप्रदीपिकोक्तरीत्या स्वप्ने तस्यैव गजाद्याकारेण परिणामेन ज्ञानकर्मतयाऽवस्थितत्वेन तदानीं ज्ञानसाधनत्वायोगाद्वा परिशेषोपपत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000950.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000951", "originalText": "न च स्वप्नेऽन्तःकरणवृत्त्यभावे उत्थितस्य स्वप्नदृष्टगजाद्यनुसन्धानानुपपत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000951.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000952", "originalText": "सुषुप्तिक्लृप्तया अविद्यावृत्त्या तदुपपत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000952.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000953", "originalText": "‘सुषुप्तौ तदवस्थोपहितमेव स्वरूपचैतन्यम् अज्ञानसुखादिप्रकाशः, उत्थितस्यानुसन्धानमुपाधिभूतावस्थाविनाशजन्यसंस्कारेण’ इति वेदान्तकौमुद्यभिमते सुषुप्तावविद्यावृत्त्यभावपक्षे इहापि स्वाप्नगजादिभासकचैतन्योपाधिभूतस्वप्नावस्थाविनाशजन्यसंस्कारादनुसन्धानोपपत्तेश्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000953.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000954", "originalText": "अथवा ‘तदेतत् सत्त्वं येन स्वप्नं पश्यति’ (पै.र.ब्रा.उ) इत्यादिश्रुतेः अस्तु स्वप्नेऽपि कल्पतरूक्तरीत्या स्वाप्नगजादिगोचरान्तःकरणवृत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000954.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000955", "originalText": "न च तावता परिशेषासिद्धिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000955.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000956", "originalText": "अन्तःकरणस्य अहमितिगृह्यमाणस्य सर्वात्मना जीवैक्येनाध्यस्ततया लोकदृष्ट्या तस्य तद्व्यतिरेकाप्रसिद्धेः परिशेषार्थं चक्षुरादिव्यापाराभावमात्रस्यैवापेक्षितत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000956.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000957", "originalText": "प्रसिद्धदृश्यमात्रं दृगवभासयोग्यमिति निश्चयसत्त्वेनपरिशेषार्थमन्यानपेक्षणात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000957.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000958", "originalText": "तस्मात् सर्वथाऽपि स्वप्ने चक्षुरादिव्यापारासम्भवात् स्वाप्नगजादौ चाक्षुषत्वाद्यनुभवो भ्रम एव।", "padacchedaText": "", "audioFile": "PB_hear2read_000958.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000959", "originalText": "ननु स्वप्नेऽपि ‘चक्षुरुन्मीलने गजाद्यनुभवः, तन्निमीलने न’ इति जागर इव गजाद्यनुभवस्य चक्षुरुन्मीलनाद्यनुविधानं प्रतीयत इति चेत्, ‘चक्षुषा गजादिकं पश्यामी’त्यनुभववत् अयमपि कश्चित् स्वप्नभ्रमो भविष्यति— यत् केवलसाक्षिरूपे स्वाप्नगजाद्यनुभवे चक्षुराद्यनुविधानं तदनुविधायिनी वृत्तिर्वा अध्यस्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000959.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000960", "originalText": "किमिव हि दुर्घटमपि भ्रमं माया न करोति, विशेषतो निद्रारूपेण परिणता।", "padacchedaText": "", "audioFile": "PB_hear2read_000960.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000961", "originalText": "यस्याः माहात्म्यात् स्वप्ने रथः प्रतीतः क्षणेन मनुष्य प्रतीयते, स च क्षणेन मार्जारः।", "padacchedaText": "", "audioFile": "PB_hear2read_000961.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000962", "originalText": "स्वप्नद्रष्टुश्च न पूर्वापरविरोधानुसन्धानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000962.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000963", "originalText": "तस्मादन्वयाद्यनुविधानप्रतीतितौल्येऽपि जाग्रद्गजाद्यनुभव एव चक्षुरादिजन्यः, न स्वाप्नगजाद्यनुभवः।", "padacchedaText": "", "audioFile": "PB_hear2read_000963.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000964", "originalText": "दृष्टिसृष्टिवादनिरूपणम्\nदृष्टिसृष्टिवादिनस्तु कल्पितस्याज्ञातसत्त्वमनुपपन्नमिति कृत्स्नस्य जाग्रत्प्रपञ्चस्य दृष्टिसमसमयां सृष्टिमुपेत्य घटादिदृष्टेश्चक्षुःसन्निकर्षानुविधानप्रतीतिं दृष्टेः पूर्वं घटाद्यभावेनासङ्गच्छमानां स्वप्नवदेव समर्थयमानाः जाग्रद्गजाद्यनुभवोऽपि न चाक्षुष इत्याहुः।", "padacchedaText": "", "audioFile": "PB_hear2read_000964.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000965", "originalText": "ननु— दृष्टिसृष्टिमवलम्ब्य कृत्स्नस्य जाग्रत्प्रपञ्चस्य कल्पितत्वोपगमे कस्तस्य कल्पकः।", "padacchedaText": "", "audioFile": "PB_hear2read_000965.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000966", "originalText": "निरुपाधिरात्मा वा, अविद्योपहितो वा।", "padacchedaText": "", "audioFile": "PB_hear2read_000966.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000967", "originalText": "नाद्यः−मोक्षेऽपि साधनान्तरनिरपेक्षस्य कल्पकस्य सत्त्वेन प्रपञ्चानुवृत्त्या संसाराविशेषप्रसङ्गात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000967.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000968", "originalText": "न द्वितीयः − आविद्याया अपि कल्पनीयत्वेन तत्कल्पनात्प्रागेव कल्पकसिद्धेर्वक्तव्यत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000968.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000969", "originalText": "अत्र केचिदाहुः − पूर्वपूर्वकल्पिताविद्योपहितोत्तरोत्तराविद्याकल्पकः।", "padacchedaText": "", "audioFile": "PB_hear2read_000969.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000970", "originalText": "अनिदम्प्रथमत्वाच्च कल्पककल्पनाप्रवाहस्य नानवस्था दोषः।", "padacchedaText": "", "audioFile": "PB_hear2read_000970.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000971", "originalText": "न च— अविद्याया अनादित्वोपगमाच्छुक्तिरजतवत् कल्पितत्वं न युज्यते, अन्यथा साद्यनादिविभागानुपपत्तेरिति— वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000971.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000972", "originalText": "यथा स्वप्ने कल्प्यमानं गोपुरादि किञ्चित् पूर्वसिद्धत्वेन कल्प्यते किञ्चित्तदानीमुत्पाद्यमानत्वेन, एवं जागरेऽपि किञ्चित् कल्प्यमानं सादित्वेन कल्प्यते किञ्चिदन्यथेति तावता साद्यनादिविभागोपपत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000972.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000973", "originalText": "एतेन कार्यकारणविभागोऽपि व्याख्यात इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000973.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000974", "originalText": "अन्ये तु−वस्तुतोऽनाद्येवाविद्यादि, तत्र दृष्टिसृष्टिर्नोपेयते, किं तु (ततः) अन्यत्र प्रपञ्चमात्रे − इत्याहुः।", "padacchedaText": "", "audioFile": "PB_hear2read_000974.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000975", "originalText": "नन्वेवमपि श्रुतिमात्रप्रतीतस्य वियदादिसर्गतत्क्रमादेः कः कल्पकः।", "padacchedaText": "", "audioFile": "PB_hear2read_000975.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000976", "originalText": "न कोऽपि।", "padacchedaText": "", "audioFile": "PB_hear2read_000976.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000977", "originalText": "किमालम्बना तर्हि ‘आत्मन आकाशः सम्भूतः’ (तै.उ. २. १) इत्यादिश्रुतिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000977.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000978", "originalText": "निष्प्रपञ्चब्रह्मात्मैक्यावलम्बनेत्यवेहि।", "padacchedaText": "", "audioFile": "PB_hear2read_000978.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000979", "originalText": "अध्यारोपापवादाभ्यां निष्प्रपञ्चब्रह्मप्रतिपत्तिर्भवतीति तत्प्रतिपत्त्युपायतया श्रुतिषु सृष्टिप्रलयोपन्यासः, न तात्पर्येण इति भाष्याद्युद्घोषः।", "padacchedaText": "", "audioFile": "PB_hear2read_000979.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000980", "originalText": "व्यर्थस्तर्हि तात्पर्याभावे वियत्प्राणपादयोर्वियदादिसर्गतत्क्रमादिविषयश्रुतीनां परस्परविरोधपरिहाराय यत्नः।", "padacchedaText": "", "audioFile": "PB_hear2read_000980.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000981", "originalText": "न व्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000981.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000982", "originalText": "न्यायव्युत्पत्त्यर्थम् अभ्युपेत्यतात्पर्यं तत्प्रवृत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000982.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000983", "originalText": "उक्तं हि शास्त्रदर्पणे−\n‘श्रुतीनां सृष्टितात्पर्यं स्वीकृत्येदमिहेरितम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000983.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000984", "originalText": "ब्रह्मात्मैक्यपरत्वात्तु तासां तन्नैव विद्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000984.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000985", "originalText": "’ (१. ४. ४) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000985.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000986", "originalText": "ज्योतिष्टोमादिश्रुतिबोधितानुष्ठानात् फलसिद्धिः स्वाप्नश्रुतिबोधितानुष्ठानप्रयुक्तफलसंवादतुल्या, ज्योतिष्टोमादिश्रुतीनां च सत्त्वशुद्धिद्वारा ब्रह्मणि तात्पर्यान्नाप्रामाण्यम्, इत्यादिदृष्टिसृष्टिव्युत्पादनप्रक्रियाप्रपञ्चस्तु आकरग्रन्थेषु द्रष्टव्यः।", "padacchedaText": "", "audioFile": "PB_hear2read_000986.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000987", "originalText": "अयमेको दृष्टिसमसमया विश्वसृष्टिरिति दृष्टिसृष्टिवादः।", "padacchedaText": "", "audioFile": "PB_hear2read_000987.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000988", "originalText": "अन्यस्तु− दृष्टिरेव विश्वसृष्टिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000988.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000989", "originalText": "दृश्यस्य दृष्टिभेदे प्रमाणाभावात्,\n‘ज्ञानस्वरूपमेवाहुर्जगदेतद्विचक्षणाः।", "padacchedaText": "", "audioFile": "PB_hear2read_000989.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000990", "originalText": "अर्थस्वरूपं भ्राम्यन्तः पश्यन्त्यन्ये कुदृष्टयः।", "padacchedaText": "", "audioFile": "PB_hear2read_000990.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000991", "originalText": "’ (वि.पु. १. ४. ४०) इति स्मृतेश्च इति— सिद्धान्तमुक्तावल्यादिदर्शितो दृष्टिसृष्टिवादः।", "padacchedaText": "", "audioFile": "PB_hear2read_000991.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000992", "originalText": "द्विविधदृष्टिसृष्टिवादाद्विलक्षणसृष्टदृष्टिवादनिरूपणम्\nद्विविधेऽपि दृष्टिसृष्टिवादे मनःप्रत्ययमलभमानाः केचिदाचार्याः सृष्टदृष्टिवादं रोचयन्ते— श्रुतिदर्शितेन क्रमेण परमेश्वरसृष्टम् अज्ञातसत्तायुक्तमेव विश्वम्, तत्तद्विषयप्रमाणावतरणे तस्य तस्य दृष्टिसिद्धिरिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000992.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000993", "originalText": "न चैवं प्रपञ्चस्य कल्पितत्वाभावे श्रुत्यादिप्रतिपन्नस्य सृष्टिप्रलयादिमतः प्रत्यक्षादिप्रतिपन्नार्थक्रियाकारिणश्च तस्य सत्यत्वमेवाभ्युपगतं स्यादिति वाच्यम्, शुक्तिरजतादिवत् सम्प्रयोगसंस्कारदोषरूपेण अधिष्ठानज्ञानसंस्कारदोषरूपेण वा कारणत्रयेण अजन्यतया कल्पनासमसमयत्वाभावेऽपि ज्ञानैकनिवर्त्यत्वरूपस्य सदसद्विलक्षणत्वरूपस्य प्रतिपन्नोपाधिगतत्रैकालिकनिषेधप्रतियोगित्वरूपस्य वा मिथ्यात्वस्याभ्युपगमात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000993.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000994", "originalText": "सत्यत्वपक्षे प्रपञ्चे उक्तरूपमिथ्यात्वाभावेन ततो भेदात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000994.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000995", "originalText": "नन्वेवं— अहङ्कारतद्धर्माणामपि उक्तरूपमिथ्यात्वं वियदादिवत् कल्पितत्वाभावेऽपि सिद्ध्यतीति, भाष्यटीकाविवरणेषु तदध्यासे कारणत्रितयसम्पादनादियत्नो व्यर्थः, इति चेत्−अहङ्कारादीनामपि केवलसाक्षिवेद्यतया शुक्तिरजतवत् प्रातिभासिकत्वमभिमतमिति चित्सुखाचार्याः।", "padacchedaText": "", "audioFile": "PB_hear2read_000995.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000996", "originalText": "अभ्युपेत्यवादमात्रं तत्, ‘अद्वितीयाधिष्ठानब्रह्मात्मप्रमाणस्य चैतन्यस्य’ इत्यादितत्रत्यकारणत्रितयसम्पादनग्रन्थस्य, चैतन्यस्य प्रमाकरणत्वे वेदान्तकरणत्वादिकल्पनाभङ्गप्रसङ्गेन प्रौढिवादत्वस्य स्फुटत्वादिति रामाद्वयाचार्याः।", "padacchedaText": "", "audioFile": "PB_hear2read_000996.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000997", "originalText": "मिथ्याभूतस्यार्थक्रियाकारित्वविचारः\nननु दृष्टिसृष्टिवादे सृष्टदृष्टिवादे च मिथ्यात्वसंप्रतिपत्तेः कथं मिथ्याभूतस्यार्थक्रियाकारित्वम्?\nस्वप्नवदिति ब्रूमः।", "padacchedaText": "", "audioFile": "PB_hear2read_000997.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000998", "originalText": "ननु स्वाप्नजलादिसाध्यावगाहनादिरूपार्थक्रिया असत्यैव।", "padacchedaText": "", "audioFile": "PB_hear2read_000998.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000999", "originalText": "किं तु जाग्रज्जलादिसाध्या सा सत्या।", "padacchedaText": "", "audioFile": "PB_hear2read_000999.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001000", "originalText": "अविशिष्टमुभयत्रापि स्वसमानसत्ताकार्थक्रियाकारित्वमिति केचित्‌।", "padacchedaText": "", "audioFile": "PB_hear2read_001000.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001001", "originalText": "अद्वैतविद्याचार्यास्त्वाहुः− स्वाप्नपदार्थानां न केवलं प्रबोधबाध्यार्थक्रियामात्रकारित्वम्‌, स्वाप्नाङ्गनाभुजङ्गमादीनां तदबाध्यसुखभयादिजनकत्वस्यापि दर्शनात्‌।", "padacchedaText": "", "audioFile": "PB_hear2read_001001.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001002", "originalText": "स्वाप्नविषयजन्यस्यापि हि सुखभयादेः प्रबोधानन्तरं न बाधोऽनुभूयते, प्रत्युत प्रबोधानन्तरमपि मनःप्रसादशरीरकम्पनादिना सह तदनुवृत्तिदर्शनात् प्रागपि सत्त्वमेवावसीयते।", "padacchedaText": "", "audioFile": "PB_hear2read_001002.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001003", "originalText": "अत एव प्राणिनां पुनरपि सुखजनकविषयगोचरस्वप्ने वाञ्छा, अतादृशे च स्वप्ने प्रद्वेषः।", "padacchedaText": "", "audioFile": "PB_hear2read_001003.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001004", "originalText": "सम्भवति च स्वप्नेऽपि ज्ञानवदन्तःकरणवृत्तिरूपस्य सुखभयादेरुदयः।", "padacchedaText": "", "audioFile": "PB_hear2read_001004.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001005", "originalText": "न च— स्वाप्नाङ्गनादिज्ञानमेव सुखादिजनकम्, तच्च सदेवेति वाच्यम्, तस्यापि दर्शनस्पर्शनादिवृत्तिरूपस्य स्वप्नप्रपञ्चसाक्षिण्यध्यस्तस्य कल्पनामात्रसिद्धत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001005.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001006", "originalText": "न ह्युपरतेन्द्रियस्य चक्षुरादिवृत्तयः सत्याः सम्भवन्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_001006.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001007", "originalText": "न च— तद्विषयापरोक्षमात्रं सुखजनकम्, तच्च साक्षिरूपं सदेवेति−वाच्यम्, दर्शनात् स्पर्शने कामिन्याः पदा स्पर्शनात् पाणिना स्पर्शने भुजङ्गमस्यामर्मस्थले स्पर्शनात् मर्मस्थले स्पर्शने सुखविशेषस्य भयविशेषस्य चानुभवसिद्धत्वेन स्वप्नेऽपि तत्तत्सुखभयादिविशेषस्य कल्पितदर्शनस्पर्शनादिवृत्तिविशेषजन्यत्वस्य वक्तव्यत्वादिति।", "padacchedaText": "", "audioFile": "PB_hear2read_001007.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001008", "originalText": "तथा जागरे घटादिप्रकाशनक्षमतत्रत्यपुरुषान्तरनिरीक्ष्यमाणालोकवत्यपवरके सद्यः प्रविष्टेन पुंसा कल्पितस्य सन्तमसस्य प्रसिद्धसन्तमसोचितार्थक्रियाकारित्वं दृष्टम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001008.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001009", "originalText": "तेन तं प्रति घटाद्यावरणं दीपाद्यानयने तदपसरणं तन्नयने पुनरावरणम् इत्यादेर्दर्शनात् इत्यपि— केचित्।", "padacchedaText": "", "audioFile": "PB_hear2read_001009.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001010", "originalText": "अन्ये तु पानावगाहनाद्यर्थक्रियायां जलादिस्वरूपमात्रमुपयोगि, न तद्गतं सत्यत्वम्, तस्य कारणत्वतदवच्छेदकत्वयोरभावादिति किं तेन।", "padacchedaText": "", "audioFile": "PB_hear2read_001010.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001011", "originalText": "न चैवं सति मरुमरीचिकोदकशुक्तिरजतादेरपि प्रसिद्धोदकाद्युचितार्थक्रियाकारित्वप्रसङ्गः।", "padacchedaText": "", "audioFile": "PB_hear2read_001011.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001012", "originalText": "‘मरीचिकोदकादावुदकत्वादिजातिर्नास्तीति तद्विषयकभ्रमस्य उदकशब्दोल्लेखित्वं तदुल्लेखिपूर्वानुभवसंस्कारजन्यत्वप्रयुक्तं’ इति तत्त्वशुद्धिकारादि मते तत्तदर्थक्रियाप्रयोजकोदकत्वादिजात्यभावादेव तदप्रसङ्गात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001012.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001013", "originalText": "‘तत्राप्युदकत्वादिजातिरस्ति, अन्यथा तद्वैशिष्ट्योल्लेखिभ्रमविरोधात् उदकाद्यर्थिनस्तत्र प्रवृत्त्यभावप्रसङ्गाच्च’ इति प्रातिभासिके पूर्वदृष्टसजातीयत्वव्यवहारानुरोधिनां मते क्वचिदधिष्ठानविशेषज्ञाने समूहाध्यासनाशात् क्वचिदधिष्ठानसामान्यज्ञानोपरमेण केवलाध्यासनाशात् क्वचित् गुञ्जापुञ्जादौ चक्षुषा वह्न्याद्यध्यासस्थले दाहपाकादिप्रयोजकस्योष्णस्पर्शादेरनध्यासाच्च तत्रतत्रार्थक्रियाऽभावोपपत्तेः, क्वचित् कासाञ्चिदर्थक्रियाणामिष्यमाणत्वाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_001013.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001014", "originalText": "मरीचिकोदकादिव्यावर्तकस्यार्थक्रियोपयोगिरूपस्य वक्तव्यत्वे च श्रुतिविरुद्धं प्रत्यक्षादिना दुर्ग्रहं त्रिकालाबाध्यत्वं विहाय दोषविशेषाजन्यरजतत्वादेरेव रजताद्युचितार्थक्रियोपयोगिरूपस्य वक्तुं शक्यत्वाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_001014.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001015", "originalText": "तस्मात् मिथ्यात्वेऽप्यर्थक्रियाकारित्वसम्भवात् मिथ्यैव प्रपञ्चः,न सत्यः— इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001015.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001016", "originalText": "प्रपञ्चमिथ्यात्वस्य मिथ्यात्वनिरूपणम्\nननु— मिथ्यात्वस्य प्रपञ्चधर्मस्य सत्यत्वे ब्रह्माद्वैतक्षतेः तदपि मिथ्यैव वक्तव्यमिति कुतः प्रपञ्चस्य सत्यत्वक्षतिः।", "padacchedaText": "", "audioFile": "PB_hear2read_001016.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001017", "originalText": "‘मिथ्याभूतं ब्रह्मणः सप्रपञ्चत्वं न निष्प्रपञ्चत्वविरोधि’ इति त्वदुक्तरीत्या मिथ्याभूतमिथ्यात्वस्य सत्यत्वाविरोधात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001017.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001018", "originalText": "अत्रोक्तमद्वैतदीपिकायां−\nवियदादिप्रपञ्चसमानस्वभावं मिथ्यात्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001018.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001019", "originalText": "तच्च धर्मिणः सत्यत्वप्रतिक्षेपकम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001019.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001020", "originalText": "धर्मस्य स्वविरुद्धधर्मप्रतिक्षेपकत्वे हि उभयवादिसिद्धं धर्मिसमसत्त्वं तन्त्रम्, न पारमार्थिकत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001020.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001021", "originalText": "घटत्वादिप्रतिक्षेपके पटत्वादौ अस्माकं पारमार्थिकत्वासम्प्रतिपत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_001021.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001022", "originalText": "ब्रह्मणः सप्रपञ्चत्वं न धर्मिसमसत्ताकमिति न निष्प्रपञ्चत्वप्रतिक्षेपकम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001022.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001023", "originalText": "अत एव−मिथ्यात्वस्य व्यावहारिकत्वे तद्विरोधिनोऽप्रातिभासिकस्य प्रपञ्चसत्यत्वस्य पारमार्थिकत्वं स्यादिति—निरस्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001023.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001024", "originalText": "धर्मिसमसत्ताकस्य मिथ्यात्वस्य व्यावहारिकत्वे धर्मिणोऽपि व्यावहारिकत्वनियमात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001024.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001025", "originalText": "अथवा यो यस्य स्वविषयसाक्षात्कारानिवर्त्यो धर्मः स तत्र स्वविरुद्धधर्मप्रतिक्षेपकः।", "padacchedaText": "", "audioFile": "PB_hear2read_001025.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001026", "originalText": "शुक्तौ शुक्तितादात्म्यं तद्विषयसाक्षात्कारानिवर्त्यम् अशुक्तित्वविरोधि, तत्रैव रजततादात्म्यं तन्निवर्त्यम् अरजतत्वाविरोधि इति व्यवस्थादर्शनात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001026.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001027", "originalText": "एवं च प्रपञ्चमिथ्यात्वं कल्पितमपि प्रपञ्चसाक्षात्कारानिवर्त्यमिति सत्यत्वप्रतिक्षेपकमेव।", "padacchedaText": "", "audioFile": "PB_hear2read_001027.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001028", "originalText": "ब्रह्मणः सप्रपञ्चत्वं तु ब्रह्मसाक्षात्कारनिवर्त्यमिति न निष्प्रपञ्चत्वप्रतिक्षेपकमिति।", "padacchedaText": "", "audioFile": "PB_hear2read_001028.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001029", "originalText": "एतेन— शब्दगम्यस्य ब्रह्मणः सत्यत्वे शब्दयोग्यतायाः शाब्दधीप्रामाण्यस्य च सत्यत्वं वक्तव्यम्‌।", "padacchedaText": "", "audioFile": "PB_hear2read_001029.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001030", "originalText": "प्रातिभासिकयोग्यतावता अनाप्तवाक्येन व्यावहारिकार्थस्य व्यावहारिकयोग्यतावता अग्निहोत्रादिवाक्येन तात्त्विकार्थस्य वा सिद्ध्यभावेन योग्यतासमानसत्ताकस्यैव शब्दार्थस्य सिद्धिनियमात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001030.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001031", "originalText": "अर्थबाधरूपप्रामाण्यस्यासत्यत्वे अर्थस्य सत्यत्वायोगाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_001031.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001032", "originalText": "तथा च ब्रह्मातिरिक्तसत्यवस्तुसत्त्वेन द्वैतावश्यम्भावे सति वियदादिप्रपञ्चोऽपि सत्योऽस्त्विति—निरस्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001032.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001033", "originalText": "व्यावहारिकस्यार्थक्रियाकारित्वस्य व्यवस्थापितत्वेन व्यावहारिकयोग्यताया अपि सत्यब्रह्मसिद्धिसम्भवात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001033.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001034", "originalText": "ब्रह्मपरे वेदान्ते सत्यादिपदसत्त्वात् ब्रह्मसत्यत्वसिद्धेः।", "padacchedaText": "", "audioFile": "PB_hear2read_001034.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001035", "originalText": "अग्निहोत्रादिवाक्ये तादृशपदाभावात् तत्सत्त्वेऽपि प्रबलब्रह्माद्वैतश्रुतिविरोधात् तदसिद्धिः इत्येव वैषम्योपपत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_001035.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001036", "originalText": "शब्दार्थयोग्यतयोः समानसत्ताकत्वनियमस्य निष्प्रमाणकत्वात्, घटज्ञानप्रामाण्यस्य अघटघटितत्ववत् सत्यभूतब्रह्मज्ञानप्रामाण्यस्यापि तदतिरिक्तघटितत्वेन मिथ्यात्वोपपत्तेश्च।", "padacchedaText": "", "audioFile": "PB_hear2read_001036.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001037", "originalText": "जीवब्रह्मभेदनिरसनम्\nतस्मात् आरम्भणाधिकरणोक्तन्यायेन कृत्स्नस्य वियदादिप्रपञ्चस्य मिथ्यात्वं वज्रलेपायते।", "padacchedaText": "", "audioFile": "PB_hear2read_001037.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001038", "originalText": "ऐकात्म्यवादे सुखदुःखादिव्यवस्थोपपादनम्\nननु— आरम्भणशब्दादिभिरचेतनस्य वियदादिप्रपञ्चस्य मिथ्यात्वसिद्धावपि चेतनानामपवर्गभाजां मिथ्यात्वायोगात् अद्वितीये ब्रह्मणि समन्वयो न युक्तः।", "padacchedaText": "", "audioFile": "PB_hear2read_001038.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001039", "originalText": "न च तेषां ब्रह्माभेदः प्रागुक्तो युक्तः।", "padacchedaText": "", "audioFile": "PB_hear2read_001039.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001040", "originalText": "परस्परभिन्नानां तेषाम् एकेन ब्रह्मणाऽभेदासम्भवात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001040.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001041", "originalText": "न च तद्भेदासिद्धिः।", "padacchedaText": "", "audioFile": "PB_hear2read_001041.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001042", "originalText": "सुखदुःखादिव्यवस्थया तत्सिद्धेः−इति चेत्,\nन−तेषामभेदेऽपि उपाधिभेदादेव तद्व्यवस्थोपपत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_001042.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001043", "originalText": "ननु उपाधिभेदेऽपि तदभेदानपायात् कथं व्यवस्था।", "padacchedaText": "", "audioFile": "PB_hear2read_001043.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001044", "originalText": "न ह्याश्रयभेदेनोपपादनीयः विरुद्धधर्मासङ्करः तदतिरिक्तस्य कस्यचित् भेदोपगमेन सिद्ध्यति।", "padacchedaText": "", "audioFile": "PB_hear2read_001044.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001045", "originalText": "अत्र केचिदाहुः−सिध्यत्येवान्तःकरणोपाधिभेदेन सुखदुःखादिव्यवस्था।", "padacchedaText": "", "audioFile": "PB_hear2read_001045.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001046", "originalText": "‘कामस्सङ्कल्पो विचिकित्सा श्रद्धाऽश्रद्धाधृतिरधृतिर्ह्रीर्घीर्भीरित्येतत्सर्वं मन एव’ (बृ.उ. १. ५. ३) ‘विज्ञानं यज्ञं तनुते’ (तै.उ. २. ५. १) इत्यादिश्रुतिभिस्तस्यैव निखिलानर्थाश्रयत्वप्रतिपादनात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001046.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001047", "originalText": "‘असङ्गो ह्ययं पुरुषः’ (बृ.उ. ४. ३. १५), ‘असङ्गो न हि सज्जते’ (बृ.उ. ४. २. ४) इत्यादिश्रुतिभिः चेतनस्य सर्वात्मना औदासीन्यप्रतिपादनाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_001047.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001048", "originalText": "न चैवंसति कर्तृत्वादिबन्धस्य चैतन्यसामानाधिकरण्यानुभवविरोधः।", "padacchedaText": "", "audioFile": "PB_hear2read_001048.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001049", "originalText": "अन्तःकरणस्य चेतनतादात्म्येनाध्यस्ततया तद्धर्माणां चैतन्यसामानाधिकरण्यानुभवोपपत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_001049.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001050", "originalText": "न चान्तःकरणस्य कर्तृत्वादिबन्धाश्रयत्वे चेतनः संसारी न स्यादिति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001050.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001051", "originalText": "कर्तृत्वादिबन्धाश्रयाहङ्कारग्रन्थितादात्म्याध्यासाधिष्ठानभाव एव तस्य संसार इत्युपगमात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001051.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001052", "originalText": "तावतैव भीषणत्वाश्रयसर्पतादात्म्याध्यासाधिष्ठाने रज्वादौ ‘अयं भीषणः’ इत्यभिमानवत् आत्मनोऽनर्थाश्रयत्वाभिमानोपपत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_001052.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001053", "originalText": "एतदभिप्रायेणैव ‘ध्यायतीव लेलायतीव’ (बृ.उ. ४. ३. ७) ‘अहङ्कारविमूढात्मा कर्ताहमिति मन्यते’ (भ.गी. ३. २७) इत्यादिश्रुतिस्मृतिदर्शनाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_001053.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001054", "originalText": "न च एकस्मिन्नेवात्मनि विचित्रसुखदुःखाश्रयतत्तदन्तःकरणानामध्यासात् आत्मन्याभिमानिकसुखदुःखादिव्यवस्था एवमपि न सिध्यतीति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001054.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001055", "originalText": "आध्यासिकतादात्म्यापन्नान्तःकरणगतानर्थजातस्येव तद्गतपरस्परभेदस्यापि अभिमानत आत्मीयतया आत्मनो यादृशमनर्थभाक्त्वं तदृशेन भेदेन तद्व्यवस्थोपपत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_001055.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001056", "originalText": "एतेन सुखदुःखादीनामन्तःकरणधर्मत्वेऽपि तदनुभवः साक्षिरूप इति तस्यैकत्वात् सुखदुःखानुभवरूपभोगव्यवस्था न सिध्यतीति— निरस्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001056.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001057", "originalText": "तत्तदन्तःकरणतादात्म्यापत्त्या तत्तदन्तःकरणभेदेन भेदवत एव साक्षिणः तत्तदन्तःकरणसुखदुःखाद्यनुभवरूपत्वेन तद्व्यवस्थाया अप्युपपत्तेरिति।", "padacchedaText": "", "audioFile": "PB_hear2read_001057.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001058", "originalText": "अन्ये तु−जडस्य कर्तृत्वादिबन्धाश्रयत्वानुपपत्तेः ‘कर्ता शास्त्रार्थवत्त्वात्’ (ब्र.सू. २. ३. ३३) इति चेतनस्यैव तदाश्रयत्वप्रतिपादकसूत्रेण च अन्तःकरणे चिदाभासो बन्धाश्रयः, तस्य चासत्यस्य बिम्बाद्भिन्नस्य प्रत्यन्तःकरणं भेदात् विद्वदविद्वत्सुखिदुःखिकर्त्रकर्त्रादिव्यवस्था।", "padacchedaText": "", "audioFile": "PB_hear2read_001058.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001059", "originalText": "न चैवमध्यस्तस्य बन्धाश्रयत्वे बन्धमोक्षयोर्वैयधिकरण्यापत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_001059.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001060", "originalText": "अस्य चिदाभासस्य अन्तःकरणावच्छिन्ने स्वरूपतस्सत्यतया मुक्त्यन्वयिनि परमार्थजीवेऽध्यस्ततया कर्तृत्वाश्रयचिदाभासतादात्म्याध्यासाधिष्ठानभावः तस्य बन्ध इत्यभ्युपगमात्—इत्याहुः।", "padacchedaText": "", "audioFile": "PB_hear2read_001060.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001061", "originalText": "अपरे तु ‘आत्मेन्द्रियमनोयुक्तं भोक्तेत्याहुर्मनीषिणः’ (क.उ. १. ३. ४) इति सहकारित्वेन देहेन्द्रियैः तादात्म्ये मनसा च युक्तस्य चेतनस्य भोक्तृत्वश्रवणात् अन्तःकरणभेदेन तद्विशिष्टभेदात् व्यवस्था।", "padacchedaText": "", "audioFile": "PB_hear2read_001061.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001062", "originalText": "न चैवं विशिष्टस्य बन्धः शुद्धस्य मोक्ष इति वैयधिकरण्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001062.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001063", "originalText": "विशिष्टगतस्य बन्धस्य विशेष्येऽनन्वयाभावात्, विशिष्टस्यानतिरेकात्— इत्याहुः।", "padacchedaText": "", "audioFile": "PB_hear2read_001063.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001064", "originalText": "इतरे तु−अस्तु केवलश्चेतनः कर्तृत्वादिबन्धाश्रयः।", "padacchedaText": "", "audioFile": "PB_hear2read_001064.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001065", "originalText": "स्फाटिकलौहित्यन्यायेन अन्तःकरणस्य तद्विशिष्टस्य वा कर्तृत्वाद्याश्रयस्य सन्निधानात् चेतनेऽपि कर्तृत्वाद्यन्तरस्याध्यासोपगमात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001065.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001066", "originalText": "न च तस्यैकत्वाद्व्यवस्थानुपपत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_001066.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001067", "originalText": "उपाधिभेदादेव तदुपपत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_001067.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001068", "originalText": "न चान्यभेदादन्यत्र विरुद्धधर्माणां व्यवस्था न युज्यत इति वाच्यम् मूलाग्ररूपोपाधिभेदमात्रेण वृक्षे संयोगतदभावव्यवस्थादर्शनात्, तत्तत्पुरुषकर्णपुटोपाधिभेदेन श्रोत्रभावमुपगतस्याकाशस्य तत्र तत्र शब्दोपलम्भकत्वानुपलम्भकत्वतारमन्द्रेष्टानिष्टशब्दोपलम्भकत्वादिवैचित्र्यदर्शनाच्च−इत्याहुः।", "padacchedaText": "", "audioFile": "PB_hear2read_001068.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001069", "originalText": "एके तु— यद्याश्रयभेदादेव विरुद्धधर्मव्यवस्थोपपादननियमः, तदा चेतने निष्कृष्ट एव उपाधिवशात् भेदकल्पना अस्तु।", "padacchedaText": "", "audioFile": "PB_hear2read_001069.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001070", "originalText": "अकल्पिताश्रयभेद एव व्यवस्थाप्रयोजक इति क्वाप्यसम्प्रतिपत्तेः, मणिमुकुरकृपाणाद्युपाधिकल्पितेन भेदेन मुखे श्यामावदातवर्तुलदीर्घभावादिधर्माणाम् अङ्गुल्युपष्टम्भोपाधिकल्पितेन भेदेन दीपे पाश्चात्यपौरस्त्यादिधर्माणां च व्यवस्थासम्प्रतिपत्तेः− इत्याहुः।", "padacchedaText": "", "audioFile": "PB_hear2read_001070.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001071", "originalText": "उक्तव्यवस्थोपपादकोपाधिभेदविचारः\nएवमुपाधिवशाद्व्यवस्थोपपादने सम्भाविते जीवानां परस्परसुखाद्यननुसन्धानप्रयोजक उपाधिः क इति निरूपणीयम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001071.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001072", "originalText": "अत्र केचिदाहुः− भोगायतनाभेदतद्भेदौ अनुसन्धानाननुसन्धानप्रयोजकोपाधी।", "padacchedaText": "", "audioFile": "PB_hear2read_001072.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001073", "originalText": "शरीरावच्छिन्नवेदनायाः तदवच्छिन्नेनानुसन्धानात्, चरणावच्छिन्नवेदनायाः हस्तावच्छिन्नेनाननुसन्धानाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_001073.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001074", "originalText": "‘हस्तावच्छिन्नोऽहं पादावच्छिन्नवेदनामनुभवामि’ इत्यप्रत्ययात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001074.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001075", "originalText": "कथं तर्हि चरणलग्नकण्टकोद्धाराय हस्तव्यापारः।", "padacchedaText": "", "audioFile": "PB_hear2read_001075.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001076", "originalText": "नायं हस्तव्यापारः हस्तावच्छिन्नानुसन्धानात्, किन्तु अवयवावयविनोश्चरणशरीरयोर्भेदासत्त्वेन चरणावच्छिन्नवेदना शरीरावाच्छिन्नेन ‘अहं चरणे वेदनावान्’ इत्यनुसन्धीयत इति तदनुसन्धानात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001076.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001077", "originalText": "एवं च चैत्रमैत्रशरीरयोरभेदाभावात् चैत्रशरीरावच्छिन्नवेदना न मैत्रशरीरावच्छिन्नेनानुसन्धीयते, नाप्युभयशरीरानुस्यूतावयवान्तरावच्छिन्ने नानुसन्धीयते, उभयानुस्यूतस्यावविनो भोगायतनस्यैवाभावात् इति न चैत्रशरीरलग्नकण्टकोद्धाराय मैत्रशरीरव्यापारप्रसङ्ग इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001077.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001078", "originalText": "अन्ये तु— विश्लिष्टोपाधिभेदोऽननुसन्धानप्रयोजकः।", "padacchedaText": "", "audioFile": "PB_hear2read_001078.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001079", "originalText": "तथ च हस्तावच्छिन्नस्य चरणावच्छिन्नवेदनानुसन्धानाभ्युपगमेऽपि न दोषः।", "padacchedaText": "", "audioFile": "PB_hear2read_001079.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001080", "originalText": "न चैवंसति गर्भस्थस्य मातृसुखानुसन्धानप्रसङ्गः।", "padacchedaText": "", "audioFile": "PB_hear2read_001080.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001081", "originalText": "एकस्मिन्नवयविन्यवयवभावेनाननुप्रविष्टयोः विश्लिष्टशब्देन विवक्षितत्वात्, मातृगर्भशरीरयोस्तथात्वात्− इत्याहुः।", "padacchedaText": "", "audioFile": "PB_hear2read_001081.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001082", "originalText": "न च ‘उद्यतायुधदोर्दण्डाः पतितस्वशिरोऽक्षिभिः। पश्यन्तः पातयन्ति स्म कबन्धा अप्यरीनिह॥", "padacchedaText": "", "audioFile": "PB_hear2read_001082.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001083", "originalText": "’ इति भारतोक्त्याविश्लेषेऽप्यनुसन्धानमवगतमिति—वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001083.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001084", "originalText": "तत्रापि शिरःकबन्धयोरेकस्मिन्नवयविन्यवयवभावेनानुप्रविष्टचरत्वात्, शिरच्छेदानन्तरं मूर्छामरणयोरन्यतरावश्यम्भावेन दृष्टविरुद्धार्थस्य तादृशवचनस्य कैमुत्यन्यायेन योधोत्साहातिशयप्रशंसापरत्वात्, तदृक्प्रभावयुक्तपुरुषविशेषविषयत्वेन भूतार्थवादत्वेऽपि निरुक्तस्य उत्सर्गतोऽननुसन्धानतन्त्रत्वाविघाताच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_001084.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001085", "originalText": "अत एव उक्तवक्ष्यमाणपक्षेषु योगिनां जातिस्मराणां च शरीरान्तरवृत्तान्तानुसन्धाने न दोषप्रसक्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_001085.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001086", "originalText": "अपरे तु— शरीरैक्यभेदौ अनुसन्धानतदभावप्रयोजकोपाधी।", "padacchedaText": "", "audioFile": "PB_hear2read_001086.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001087", "originalText": "बाल्यभवान्तरानुभूतयोरनुसन्धानतदभावदृष्टेः।", "padacchedaText": "", "audioFile": "PB_hear2read_001087.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001088", "originalText": "न च बाल्ययौवनयोरपि शरीरभेदः शङ्कनीयः।", "padacchedaText": "", "audioFile": "PB_hear2read_001088.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001089", "originalText": "प्रत्यभिज्ञानात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001089.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001090", "originalText": "न च परिमाणभेदेन तद्भेदावगमः।", "padacchedaText": "", "audioFile": "PB_hear2read_001090.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001091", "originalText": "एकस्मिन् वृक्षे मूलाग्रभेदेनेव कालभेदेनैकस्मिन्ननेकपरिमाणान्वयोपपत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_001091.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001092", "originalText": "ननु अवयवोपचयमन्तरेण न परिमाणभेदः, अवयवाश्च पश्चादापतन्तो न पूर्वसिद्धं शरीरं परियुज्यन्ते इति परिमाणभेदे शरीरभेद आवश्यकः − इति चेत्, न−प्रदीपारोपणसमसमयसौधोदरव्यापिप्रभामण्डलविकासतत्पिधानसमसमयतत्सङ्कोचाद्यननुरोधिनः परमाणुप्रक्रियारम्भवादस्य अनभ्युपगमात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001092.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001093", "originalText": "विवर्तवादे च ऐन्द्रजालिकदर्शितशरीरवत् विनैवावयवोपाचयं मायया शरीरस्य वृद्ध्युपपत्तेः− इत्याहुः।", "padacchedaText": "", "audioFile": "PB_hear2read_001093.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001094", "originalText": "इतरे तु— अन्तःकरणाभेदतद्भेदाभ्यामनुसन्धानाननुसन्धानव्यवस्थामाहुः।", "padacchedaText": "", "audioFile": "PB_hear2read_001094.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001095", "originalText": "अयं च पक्षः प्रागुपपादितः।", "padacchedaText": "", "audioFile": "PB_hear2read_001095.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001096", "originalText": "केचित्तु अज्ञानानि जीवभेदोपाधिभूतानि नानेति स्वीकृत्य तद्भेदाभेदाभ्याम् अनुसन्धानाननुसन्धानव्यवस्थामाहुः।", "padacchedaText": "", "audioFile": "PB_hear2read_001096.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001097", "originalText": "अत्र केचित् ‘अंशो नानाव्यपदेशात्’ (ब्र.सू. २. ३. ४३) इत्यधिकरणे ‘अदृष्टानियमात्’ (ब्र.सू. २. ३. ५१) ‘अभिसन्ध्यादिष्वपि चैवम्’ (ब्र.सू. २. ३. ५२) ‘प्रदेशादिति चेन्नान्तर्भावात्’ (ब्र.सू. २. ३. ५३) इति सूत्रतद्गतभाष्यरीतिमनुसृत्य एकस्मिन्नात्मनि उपाधिभेदेन व्यवस्थानुपगमे कणभुगादिरीत्याऽऽत्मभेदवादेऽपि व्यवस्थानुपपत्तितौल्यमाहुः।", "padacchedaText": "", "audioFile": "PB_hear2read_001097.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001098", "originalText": "तथा हि−चैत्रचरणलग्नकण्टकेन चैत्रस्य वेदनोत्पादनसमये अन्येषामप्यात्मनां कुतो वेदना न जायते।", "padacchedaText": "", "audioFile": "PB_hear2read_001098.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001099", "originalText": "सर्वात्मनां सर्वगतत्वेन चैत्रशरीरान्तर्भावाविशेषात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001099.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001100", "originalText": "न च − यस्य शरीरे कण्टकवेधादि तस्यैव वेदना, नान्येषामिति—व्यवस्था।", "padacchedaText": "", "audioFile": "PB_hear2read_001100.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001101", "originalText": "सर्वात्मसन्निधावुत्पद्यमानं शरीरं कस्यचिदेव नान्येषामिति नियन्तुमशक्यत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001101.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001102", "originalText": "न च यददृष्टोत्पादितं यच्छरीरं तत्तदीयमिति नियमः।", "padacchedaText": "", "audioFile": "PB_hear2read_001102.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001103", "originalText": "अदृष्टस्यापि नियमासिद्धेः।", "padacchedaText": "", "audioFile": "PB_hear2read_001103.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001104", "originalText": "यदा हि तददृष्टोत्पादनाय केनचिदात्मना संयुज्यते मनः, संयुज्यत एव तदा अन्यैरपि।", "padacchedaText": "", "audioFile": "PB_hear2read_001104.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001105", "originalText": "कथं कारणसाधारण्ये क्वचिदेव तददृष्टमुत्पद्येत।", "padacchedaText": "", "audioFile": "PB_hear2read_001105.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001106", "originalText": "ननु— मनस्संयोगमात्रसाधारण्येऽपि ‘अहमिदं फलं प्राप्नवानि’ इति अभिसन्धिः अदृष्टोत्पादककर्मानुकूलकृतिः इत्येवमादि व्यवस्थितमिति तत एवादृष्टनियमो भविष्यति इति चेत्, न−अभिसन्ध्यादीनामपि साधारणमनस्संयोगादिनिष्पाद्यतया व्यवस्थित्यसिद्धेः।", "padacchedaText": "", "audioFile": "PB_hear2read_001106.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001107", "originalText": "ननु स्वकीयमनस्संयोगोऽभिसन्ध्यादिकारणमिति मनस्संयोग एवासाधारणो भविष्यतीति, न—नित्यं सर्वात्मसंयुक्तं मनः कस्यचिदेव स्वम् इति नियन्तुमशक्यत्वात्‌।", "padacchedaText": "", "audioFile": "PB_hear2read_001107.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001108", "originalText": "न च अदृष्टविशेषात् आत्मविशेषाणां मनसः स्वस्वामिभावसिद्धिः।", "padacchedaText": "", "audioFile": "PB_hear2read_001108.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001109", "originalText": "तस्याप्यदृष्टस्य पूर्ववद्व्यवस्थित्यसिद्धेः।", "padacchedaText": "", "audioFile": "PB_hear2read_001109.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001110", "originalText": "नन्वात्मनां विभुत्वेऽपि तेषां प्रदेशविशेषा एव बन्धभाज इति आत्मान्तराणां चैत्रशरीरे तत्प्रदेशविशेषाभावात् सुखदुःखादिव्यवस्था भविष्यतीति, न−यस्मिन् प्रदेशे चैत्रः सुखाद्यनुभूय तस्मात्प्रदेशादपक्रान्तः तस्मिन्नेव मैत्रे समागते तस्यापि तत्र सुखदुःखादिदर्शनेन शरीरान्तरे आत्मान्तरप्रदेशविशेषस्याप्यन्तर्भावात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001110.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001111", "originalText": "तस्मात् आत्मभेदेऽपि व्यवस्था दुरुपपादैव।", "padacchedaText": "", "audioFile": "PB_hear2read_001111.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001112", "originalText": "कथञ्चित्तदुपपादने च श्रुत्यनुरोधाल्लाघवाच्च आत्मैक्यमङ्गीकृत्य तत्रैव तदुपपादनं कर्तुं युक्तमिति।", "padacchedaText": "", "audioFile": "PB_hear2read_001112.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001113", "originalText": "सन्तु तर्ह्यणव एवात्मानः, यदि विभुत्वे व्यवस्था न सुवचा।", "padacchedaText": "", "audioFile": "PB_hear2read_001113.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001114", "originalText": "मैवम्− आत्मनामणुत्वे कदाचित् सर्वाङ्गीणसुखोदयस्य करशिरश्चरणाधिष्ठानस्य चानुपपत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_001114.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001115", "originalText": "यदत्रार्वाचीनकल्पनम्—उत्क्रान्तिगत्यागतिश्रवणान्यथानुपपत्त्या ‘अणुर्ह्येवैष आत्मा यं वा एते सिनीतः पुण्यं च पापं च’ ‘वालाग्रशतभागस्य’ (श्वे.उ. ५. ९) इत्यादिश्रुतिषु साक्षादणुत्वश्रवणेन च अणव एव जीवाः।", "padacchedaText": "", "audioFile": "PB_hear2read_001115.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001116", "originalText": "तेषामणुत्वेऽपि ज्ञानसुखादीनां प्रदीपप्रभान्यायेन आश्रयातिरिक्तप्रदेशविशेषव्यापिगुणतया न सर्वाङ्गीणसुखानुपलब्धिः, ‘द्रोणं बृहस्पतेर्भागम्’ इत्यादिस्मृत्यनुरोधेन जीवानामंशसत्त्वात् करशिरश्चरणाद्यनुगतेषु सुखदुःखादियौगपद्यं कायव्यूहगतेषु योगिनां भोगवैचित्र्यं चेति न काचिदनुपपत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_001116.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001117", "originalText": "एवं च जीवानामणुत्वेनासङ्करात् सुखदुःखादिव्यवस्था विभोरीश्वरात् भेदश्च − इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001117.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001118", "originalText": "अत्रोक्तमद्वैतदीपिकायाम्— एवमपि कथं व्यवस्थासिद्धिः।", "padacchedaText": "", "audioFile": "PB_hear2read_001118.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001119", "originalText": "चैत्रस्य ‘पादे वेदना शिरसि सुखम्’ इति स्वांशभेदगतसुखदुःखानुसन्धानवत् मैत्रगतसुखदुःखानुसन्धानस्यापि दुर्वारत्वात् अविशेषो हि चैत्रजीवात् तदंशयोः मैत्रस्य च भेदः।", "padacchedaText": "", "audioFile": "PB_hear2read_001119.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001120", "originalText": "कायव्यूहस्थले वियुज्यान्यत्रप्रसरणसमर्थानामंशानां जीवाद्भेदावश्यम्भावात्, अंशांशिनोस्त्वया भेदाभेदाभ्युपगमाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_001120.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001121", "originalText": "न च शुद्धभेदोऽननुसन्धानप्रयोजक इति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001121.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001122", "originalText": "शुद्धत्वं हि भेदस्य अंशांशिभावासहचरितत्वं वा अभेदासहचरितत्वं वा स्यात्? नाद्यः (‘अंशो ह्येष परमस्य‘) ‘ममैवांशो जीवलोके’ (भ.गी. १५. ७) ‘अंशो नानाव्यपदेशात्’ (ब्र.सू. २. ३. ४३) इति श्रुतिस्मृतिसूत्रैर्जीवस्य ब्रह्मांशत्वप्रतिपादनेन ब्रह्मजीवयोर्भोगसाङ्कर्यप्रसङ्गात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001122.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001123", "originalText": "ननु— जीवांशानां जीवं प्रतीव जीवस्य ब्रह्म प्रति नांशत्वम्, किं तु ‘चन्द्रबिम्बस्य गुरुबिम्बः शतांशः’ इतिवत् सदृशत्वे सति ततो न्यूनत्वमात्रमौपचारिकांशत्वमिति— चेत्, किं तदतिरेकेण मुख्यमंशत्वं जीवांशानां जीवं प्रति, यदत्राननुसन्धानप्रयोजकशरीरे निवेश्यते? न तावत् पटं प्रति तन्तूनामिवारम्भकत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001123.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001124", "originalText": "जीवस्यानादित्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001124.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001125", "originalText": "नापि महाकाशं प्रति घटाकाशादीनामिव प्रदेशत्वम्, टङ्कच्छिन्नपाषाणशकलादीनामिव खण्डत्वं वा।", "padacchedaText": "", "audioFile": "PB_hear2read_001125.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001126", "originalText": "अणुत्वेन निष्प्रदेशत्वादच्छेद्यत्वाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_001126.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001127", "originalText": "भिन्नाभिन्नद्रव्यत्वमंशत्वमभिमतमिति चेत्, न−तथा सति जीवेश्वरयोर्जीवानां च भोगसाङ्कर्यप्रसङ्गात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001127.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001128", "originalText": "स्वतो भिन्नानां तेषां चेतनत्वादिना अभेदस्यापि त्वयाऽङ्गीकारात्, समूहसमूहिनोर्भेदाभेदवादिनस्तव मते एकसमूहान्तर्गतजीवानां परस्परमप्यभेदसत्त्वाच्च स्वाभिन्नसमूहाभिन्नेन स्वस्याप्यभेदस्य दुर्वारत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001128.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001129", "originalText": "‘यदि संयोगादीनां जातेश्च अनेकाश्रितत्वं स्यात्, तदा गुणगुण्यादेरभेदात् घटाभिन्नसंयोगाभिन्नपटादेरपि घटाभेदः प्रसज्येत’ इत्यादि वदता त्वया तदभिन्नाभिन्नस्य तदभेदनियमाभ्युपगमात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001129.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001130", "originalText": "न च जीवान्तरसाधारणचेतनत्वादिधर्मैकरूप्यैकसमूहान्तर्गतत्वादिप्रयुक्ताभेदविलक्षणमभेदान्तरमंशांशिनोरस्ति भेदेऽप्यनुसन्धानप्रयोजकम्, यदत्रानतिप्रसङ्गाय विवक्ष्येत।", "padacchedaText": "", "audioFile": "PB_hear2read_001130.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001131", "originalText": "तथा सति तस्यैव विशिष्य निर्वक्तव्यत्वापत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_001131.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001132", "originalText": "धर्मैकरूप्याद्यप्रयुक्तत्वमंशांशिनोरभेदे विशेष इति चेत्, न— जीवतदंशयोश्चेतनत्वादिधर्मैकरूप्यसत्त्वेन एकशरीरावच्छेदे कायव्यूहमेलने च समूहत्वेन च तयोरभेदे धर्मैकरूप्यादिप्रयुक्तत्वस्यापि सद्भावात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001132.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001133", "originalText": "धर्मैकरूप्यादिप्रयुक्ताभेदान्तरसत्त्वेऽपि जीवतदंशयोरंशांशिभावप्रयोजकाभेदो न तत्प्रयुक्त इति चेत्, न−तयोरभेदद्वयाभावात्, त्वन्मतेऽधिकरणैक्ये सति भेदस्याभेदस्य वा प्रतियोगिभेदेन तदाकारभेदेन वा अनेकत्वानभ्युपगमात्, तस्मादाद्यपक्षे सुस्थोऽतिप्रसङ्गः।", "padacchedaText": "", "audioFile": "PB_hear2read_001133.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001134", "originalText": "एतेनैव द्वितीयपक्षोऽपि निरस्तः।", "padacchedaText": "", "audioFile": "PB_hear2read_001134.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001135", "originalText": "अभेदासहचरितभेदस्याननुसन्धानप्रयोजकत्वे उक्तरीत्या त्वन्मते जीवब्रह्मणोर्जीवानां चाभेदस्यापि सत्त्वेनातिप्रसङ्गस्य दुर्वारत्त्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001135.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001136", "originalText": "ननु— अभेदप्रत्यक्षमनुसन्धाने तन्त्रमिति तदभावेऽननुसन्धानम्, स्वस्य स्वाभेदः स्वांशाभेदश्च प्रत्यक्ष इति तद्द्रष्टुर्दुःखाद्यनुसन्धानम्, जीवान्तरेणाभेदसत्त्वेऽपि तस्याप्रत्यक्षत्वात् न तद्दुःखाद्यनुसन्धानम्, जातिस्मरस्य प्राग्भावीयात्मनापि अभेदस्य प्रत्यक्षसत्त्वात् तद्वृत्तान्तानुसन्धानम्, अन्येषां तदभावात् न, इत्यादि सर्वं सङ्गच्छते−इति चेत्, तर्ह्यैकात्म्यवादेऽपि सर्वात्मतावारकाज्ञानावरणात् चैत्रस्य न मैत्रात्माद्यभेदप्रत्यक्षमिति तत एव सर्वव्यवस्थोपपत्तेः व्यर्थः श्रुतिविरुद्ध आत्मभेदाभ्युपगमः।", "padacchedaText": "", "audioFile": "PB_hear2read_001136.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001137", "originalText": "न चेत्थमपि प्रपञ्चतत्त्ववादिनस्तव व्यवस्थानिर्वाहः।", "padacchedaText": "", "audioFile": "PB_hear2read_001137.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001138", "originalText": "सर्वज्ञस्येश्वरस्य वस्तुसज्जीवान्तराभेदप्रत्यक्षावश्यम्भावेन जीवेषु दुःखिषु ‘अहं दुःखी’ इत्यनुभवापत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_001138.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001139", "originalText": "अस्मन्मते तु ईश्वरः स्वाभिन्ने जीवे संसारं प्रतिबिम्बमुखे मालिन्यमिव पश्यन्नपि मिथ्यात्वनिश्चयात् न शोचतीति नैष प्रसङ्गः।", "padacchedaText": "", "audioFile": "PB_hear2read_001139.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001140", "originalText": "स्यादेतत्— माभूदंशभेदः।", "padacchedaText": "", "audioFile": "PB_hear2read_001140.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001141", "originalText": "करशिरश्चरणादीनां कायव्यूहस्य च अधिष्ठानम्, आत्मदीपस्यानपायिनी ज्ञानप्रभाऽस्ति व्यापिनीति सैव सर्वाधिष्ठानं भविष्यतीति चेत्, न−ज्ञानवदात्मधर्मस्य सुखदुःखभोगस्य ज्ञानमाश्रित्य उत्पत्त्यसम्भवेन करचरणाद्यवयवभेदेन अवयविनः, कायव्यूहवतः कायभेदेन च भोगवैचित्र्याभावप्रसङ्गात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001141.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001142", "originalText": "‘सुखदुःखभोगादि ज्ञानधर्म एव नात्मधर्मः’ इत्यभ्युपगमे तद्वैचित्र्येण आत्मगुणस्य ज्ञानस्य भेदसिद्धावपि आत्मनो भेदासिद्ध्या भोगवैचित्र्यादिना आत्माभेदप्रतिक्षेपायोगात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001142.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001143", "originalText": "‘भोगाद्याश्रयस्यात्मनोऽणुत्वेन प्रतिशरीरं विच्छिन्नतया तद्व्यापित्ववाद इव तदभेदवाद इव च न सर्वधर्मसङ्करापत्तिः’ इति मतहानेश्च।", "padacchedaText": "", "audioFile": "PB_hear2read_001143.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001144", "originalText": "तस्माज्जीवस्याणुत्वोपगमेन व्यवस्थोपपादनं न युक्तमिति।", "padacchedaText": "", "audioFile": "PB_hear2read_001144.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001145", "originalText": "नापि तेन तस्य ईश्वरात् भेदसाधनं युक्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001145.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001146", "originalText": "‘उत्क्रान्त्यादिश्रवणात् साक्षादणुत्वश्रवणाच्च अणुर्जीवः’ इति वदतः तव मते ‘तत्सृष्ट्वा।", "padacchedaText": "", "audioFile": "PB_hear2read_001146.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001147", "originalText": "तदेवानुप्राविशत्।", "padacchedaText": "", "audioFile": "PB_hear2read_001147.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001148", "originalText": "’ (तै.उ. २. ६. १) ‘अन्तःप्रविष्टश्शास्ता जनानाम्’ (तै.आ. ३. ११) ‘गुहां प्रविष्टौ परमे परार्धे’ (क.उ. १. ३. १) इत्यादिश्रुतिषु प्रवेशादिश्रवणात् ‘स य एषोऽणिमा’ (छा.उ. ६. ८. ७) ‘एष म आत्माऽन्तर्हृदयेऽणीयान्व्रीहेर्वा यवाद्वा’ (छा.उ. ३. १४. ३) इति श्रुतौ साक्षादणुत्वश्रवणाच्च परोऽप्यणुरेव सिध्येदिति कुतः परजीवयोर्विभुत्वाणुत्वाभ्यां भेदसिद्धिः।", "padacchedaText": "", "audioFile": "PB_hear2read_001148.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001149", "originalText": "ननु − ‘आकाशवत् सर्वगतश्च नित्यः’ (शत.ब्रा. १०. ६. ३. २) ‘ज्यायानन्तरिक्षात् ज्यायान्दिवः’ (छा.उ. ३. १४. ३) इत्यादिश्रवणात् सर्वप्रपञ्चोपादानत्वाच्च परस्य सर्वगतत्वसिद्धेः तदणुत्वश्रुतयः उपासनार्था दुर्ग्रहत्वाभिप्राया वा उन्नेयाः।", "padacchedaText": "", "audioFile": "PB_hear2read_001149.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001150", "originalText": "प्रवेशश्रुतयश्च शरीराद्युपाधिना निर्वाह्याः न च जीवोत्क्रान्त्यादिश्रुतयोऽपि बुद्ध्याद्युपाधिना निर्वोढुं शक्या इति शङ्क्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001150.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001151", "originalText": "‘तमुत्क्रामन्तं प्राणोऽनूत्क्रामति’ (बृ.उ. ४. ४. २) इति प्राणाख्यबुद्ध्युत्क्रान्तेः प्रागेव जीवोत्क्रान्तिवचनात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001151.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001152", "originalText": "‘तथा विद्वान्नामरूपाद्विमुक्तः परात्परं पुरुषमुपैति दिव्यम्’ (मु.उ. ३. २. ८) इति नामरूपविमोक्षानन्तरमपि गतिश्रवणाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_001152.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001153", "originalText": "‘तद्याथाऽनस्सुसमाहितमुत्सर्जन्यायादेवमेवायं शारीर आत्मा प्राज्ञेनात्मनाऽन्वारूढ उत्सर्जन् याति’ (बृ.उ. ४. ३. ३५) इति स्वाभाविकगत्याश्रयशकटदृष्टान्तोक्तेश्च— इति चेत्, नैतत्सारम्− ‘स वा एष महानज आत्मा योऽयं विज्ञानमयः’ (बृ.उ. ४. ४. २२) ‘घटसंवृतमाकाशं नीयमाने घटे यथा।", "padacchedaText": "", "audioFile": "PB_hear2read_001153.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001154", "originalText": "घटो नीयेत नाकाशं तद्वज्जीवो नभोपमः’।", "padacchedaText": "", "audioFile": "PB_hear2read_001154.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001155", "originalText": "(अमृतबि—१३) इत्यादिश्रुतिषु जीवस्यापि विभुत्वश्रवणात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001155.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001156", "originalText": "त्वन्मते प्रकृतेरेव जगदुपादानत्वेन ब्रह्मणो जगदुपादानत्वाभावात् जीवस्य कायव्यूहगतविचित्रसुखदुःखोपादानत्ववत् अणुत्वेऽपि जगदुपादानत्वसम्भवाच्च, ततस्तस्य सर्वगतत्वासिद्धेः।", "padacchedaText": "", "audioFile": "PB_hear2read_001156.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001157", "originalText": "तत्प्रवेशश्रुतीनां शरीरोपाधिकत्वकल्पने जीवोत्क्रान्त्यादिश्रुतीनामपि बुद्ध्युपाधिकत्वोपगमसम्भवात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001157.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001158", "originalText": "‘पञ्चवृत्तिर्मनोवद्व्यपदिश्यते’ (ब्र.सू. २. ४. १२) इति सूत्रभाष्ये बुद्धिप्राणयोः कार्यभेदाद्भेदस्य प्रतिपादितत्वेन बुद्ध्युपाधिके जीवे प्रथममुत्क्रामति प्राणस्यानूत्क्रमणोपपत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_001158.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001159", "originalText": "नामरूपविमोक्षानन्तरं ब्रह्मप्राप्तिश्रवणस्य प्राप्तरि जीव इव प्राप्तव्ये ब्रह्मण्यपि विभुत्वविरोधित्वात्, प्राकृतनामरूपविमोक्षानन्तरमपि अप्राकृतलोकविग्रहाद्युपधानेन ब्रह्मणः प्राप्तव्यत्ववादिमते प्राप्तुर्जीवस्यापि अप्राकृतदेहेन्द्रियादिसत्त्वेन तदुपधानेन ब्रह्मप्राप्तिश्रवणाविरोधात्, स्वाभाविकगत्याश्रयशकटदृष्टान्तश्रवणमात्रात् जीवस्य स्वाभाविकगतिसिद्धौ ‘गुहां प्रविष्टौ’ इति स्वाभाविकप्रवेशाश्रयजीवसमभिव्याहारेण ब्रह्मणोऽपि स्वाभाविकप्रवेशसिद्ध्यवश्यम्भावात्, ब्रह्मजीवोभयान्वयिन एकस्य प्रविष्टपदस्य एकरूपप्रवेशपरत्वस्य वक्तव्यत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001159.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001160", "originalText": "तस्मात् परमते ब्रह्मजीवयोर्विभुत्वाणुत्वव्यवस्थित्यसिद्धेः ततो भेदसिद्धिप्रत्याशा दूरादपनेया।", "padacchedaText": "", "audioFile": "PB_hear2read_001160.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001161", "originalText": "अस्मन्मते ब्रह्मात्मैक्यपरमहावाक्यानुरोधेन अवान्तरवाक्यानां नेयत्वात् ‘स्वरूपेण जीवस्य विभुत्वम् औपाधिकरूपेण परिच्छेदः।", "padacchedaText": "", "audioFile": "PB_hear2read_001161.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001162", "originalText": "’ इत्यादिप्रकारेण जीवब्रह्मभेदप्रापकश्रुतीनामुपपादनं भाष्यादिषु व्यक्तम्। तस्मात् अचेतनस्य प्रपञ्चस्य मिथ्यात्वात् चेतनप्रपञ्चस्य ब्रह्माभेदाच्च न वेदान्तानाम् अद्वितीये ब्रह्मणि विद्यैकप्राप्ये समन्वयस्य कश्चिद्विरोध इति॥॥", "padacchedaText": "", "audioFile": "PB_hear2read_001162.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001163", "originalText": "इति शास्त्रसिद्धान्तलेशसङ्ग्रहे द्वितीयः परिच्छेदः।॥", "padacchedaText": "", "audioFile": "PB_hear2read_001163.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001164", "originalText": "तृतीयपरिच्छेदः।", "padacchedaText": "", "audioFile": "PB_hear2read_001164.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001165", "originalText": "मुक्तिसाधननिरूपणम्\nननु— कथं विद्ययैव ब्रह्मप्राप्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_001165.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001166", "originalText": "यावता कर्मणामपि तत्प्राप्तिहेतुत्वं स्मर्यते− ‘तत्प्राप्तिहेतुर्विज्ञानं कर्म चोक्तं माहामुने’ (वि.पु. ६. ५. ६०) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001166.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001167", "originalText": "सत्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001167.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001168", "originalText": "‘नान्यः पन्था विद्यतेऽयनाय’ (श्वे.उ. ३. ८) इति श्रुतेः नित्यसिद्धब्रह्मावाप्तौ कण्ठगतविस्मृतकनकमालावाप्तितुल्यायां विद्यातिरिक्तस्य साधनत्वासम्भवाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_001168.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001169", "originalText": "ब्रह्मावाप्तौ परम्परया कर्मापेक्षामात्रपरा तादृशी स्मृतिः।", "padacchedaText": "", "audioFile": "PB_hear2read_001169.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001170", "originalText": "कर्मणां विविदिषाविद्याफलकत्वविचारः\nक्व तर्हि कर्मणामुपयोगः।", "padacchedaText": "", "audioFile": "PB_hear2read_001170.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001171", "originalText": "अत्र भामतीमतानुवर्तिन आहुः— ‘तमेतं वेदानुवचनेन ब्राह्मणा विविदिषन्ति यज्ञेन दानेन तपसानाशकेन’ (बृ.उ. ४. ४. २२) इति श्रुतेः विद्यासम्पादनद्वारा ब्रह्मावाप्त्युपायभूतायां विविदिषायामुपयोगः।", "padacchedaText": "", "audioFile": "PB_hear2read_001171.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001172", "originalText": "नन्विष्यमाणायां विद्यायामेवोपयोगः किं न स्यात्? न स्यात्— प्रत्ययार्थस्य प्राधान्यात्, ‘विद्यासंयोगात् प्रत्यासन्नानि विद्यासाधनानि शमदमादीनि, विविदिषासंयोगात्तु बाह्यतराणि यज्ञादीनि’ इति सर्वापेक्षाधिकरणभाष्याच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_001172.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001173", "originalText": "ननु— विविदिषार्थं यज्ञाद्यनुष्ठातुर्वेदनगोचरेच्छावत्त्वे विविदिषायाः सिद्धत्वेन तदभावे वेदनोपायविविदिषायां कामनाऽसम्भवेन च विविदिषार्थं यज्ञाद्यनुष्ठानायोगात् न यज्ञादीनां विविदिषायां विनियोगो युक्त इति चेत्, न— अन्नद्वेषेण कार्श्यं प्राप्तस्य तत्परिहारायान्नविषयौन्मुख्यलक्षणायामिच्छायां सत्यामपि उत्कटाजीर्णादिप्रयुक्तधातुवैषम्यदोषात् तत्र प्रवृत्तिपर्यन्ता रुचिर्न जायत इति तद्रोचकौषधविधिवत् ‘निरतिशयानन्दरूपं ब्रह्म, तत्प्राप्तौ विद्या साधनम्’ इत्यर्थे प्राचीनबहुजन्मानुष्ठितानभिसंहितफलकनित्यनैमित्तिककर्मोपसञ्जातचित्तप्रसादमहिम्नासम्पन्नविश्वासस्य पुरुषस्य ब्रह्मावाप्तौ विद्यायां च तदौन्मुख्यलक्षणायामिच्छायां सत्यामपि अनादिभवसञ्चितानेकदुरितदोषेण आस्तिककामुकस्य हेयकर्मणीव विषयभोगे प्रावण्यं सम्पादयता प्रतिबन्धात् विद्यासाधने श्रवणादौ प्रवृत्तिपर्यन्ता रुचिर्न जायत इति प्रतिबन्धनिरासपूर्वकं तत्सम्पादकयज्ञादिविधानोपपत्तेः— इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001173.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001174", "originalText": "विवरणानुसारिणस्त्वाहुः— ‘प्रकृतिप्रत्ययार्थयोः प्रत्ययार्थस्य प्राधान्यम्’ इति सामान्यन्यायात् ‘इच्छाविषयतया शब्दबोध्य एव शाब्दसाधनताऽन्वयः’ इति स्वर्गकामादिवाक्ये क्लृप्तविशेषन्यायस्य बलवत्त्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001174.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001175", "originalText": "‘अश्वेन जिगमिषति’ ‘असिना जिघांसति’ इत्यादिलौकिकप्रयोगे अश्वादिरूपसाधनस्य ‘तदन्वेष्टव्यं तद्वाव विजिज्ञासितव्यम्’ (छा.उ. ८. १. १) ‘मन्तव्यो निदिध्यासितव्यः’ (बृ.उ. २. ४. ५) इत्यादिवैदिकप्रयोगे तव्यार्थभूतविधेश्च सन्प्रत्ययाभिहितेच्छाविषय एव गमनादौ अन्वयस्य व्युत्पन्नत्वाच्च प्रकृत्यभिहितायां विद्यायां यज्ञादीनां विनियोगः।", "padacchedaText": "", "audioFile": "PB_hear2read_001175.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001176", "originalText": "ननु तथा सति यावद्विद्योदयं कर्मानुष्ठानापत्त्या ‘त्यजतैव हि तज्ज्ञेयं त्यक्तुः प्रत्यक् परं पदम्’ इत्यादिश्रुतिसिद्धा कर्मत्यागरूपस्य सन्न्यासस्य विद्यार्थता पीड्येतेति चेत्, न— प्राग् बीजावापात् कर्षणं तदनन्तरमकर्षणमिति कर्षणाकर्षणाभ्यां व्रीह्यादिनिष्पत्तिवत् ‘आरुरुक्षोर्मुनेर्योगं कर्म कारणमुच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001176.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001177", "originalText": "योगारूढस्य तस्यैव शमः कारणमुच्यते॥", "padacchedaText": "", "audioFile": "PB_hear2read_001177.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001178", "originalText": "’ (भ.गी. ६. ३) इत्यादिवचनानुसारेण चेतसश्शुद्धौ विविदिषादिरूपप्रत्यक्प्रावण्योदयपर्यन्तं कर्मानुष्ठानं ततः सन्न्यासः इति कर्मतत्सन्न्यासाभ्यां विद्यानिष्पत्त्यभ्युपगमात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001178.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001179", "originalText": "उक्तं हि नैष्कर्म्यसिद्धौ— ‘प्रत्यक्प्रवणतां बुद्धेः कर्माण्युत्पाद्य शुद्धितः। कृतार्थान्यस्तमायान्ति प्रावृडन्ते घना इव॥", "padacchedaText": "", "audioFile": "PB_hear2read_001179.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001180", "originalText": "’ (१. ४९) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001180.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001181", "originalText": "कर्मणां विद्यार्थत्वपक्षेऽपि विविदिषापर्यन्तमेव कर्मानुष्ठाने विविदिषार्थत्वपक्षात् को भेद इति चेत्, अयं भेदः— कर्मणां विद्यार्थत्वपक्षे द्वारभूतविविदिषासिद्ध्यनन्तरमुपरतावपि फलपर्यन्तानि विशिष्टगुरुलाभान्निर्विघ्नश्रवणमननादिसाधनानि निवृत्तिप्रमुखानि सम्पाद्य विद्योत्पादकत्वनियमोऽस्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_001181.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001182", "originalText": "विविदिषार्थत्वपक्षे तु श्रवणादिप्रवृत्तिजननसमर्थोत्कटेच्छासम्पादनमात्रेण कृतार्थतेति नावश्यं विद्योत्पादकत्वनियमः। ‘यस्यैते चत्वारिंशत् संस्काराः’ (गौ.ध.सू. १. ८. २५) इति स्मृतिमूले कर्मणामात्मज्ञानयोग्यतापादकमलापकर्षणगुणाधानलक्षणसंस्कारार्थत्वपक्ष इव— इति वदन्ति॥", "padacchedaText": "", "audioFile": "PB_hear2read_001182.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001183", "originalText": "ननु केषां कर्मणाम् उदाहृतश्रुत्या विनियोगो बोध्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_001183.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001184", "originalText": "अत्र कैश्चत् उक्तं−’वेदानुवचतेन’ इति ब्रह्मचारिधर्माणां ‘यज्ञेन दानेन’ इति गृहस्थधर्माणां च ‘तपसाऽनाशकेन’ इति वानप्रस्थधर्माणां च उपलक्षणम् इत्याश्रमधर्माणामेव विद्योपयोगः।", "padacchedaText": "", "audioFile": "PB_hear2read_001184.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001185", "originalText": "अत एव ‘विहितत्वाच्चाश्रमकर्मापि’ (ब्र.सू. ३. ४. ३२) इति शारीरकसूत्रे विद्यार्थकर्मस्वाश्रमकर्मपदप्रयोगः— इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001185.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001186", "originalText": "कल्पतरौ तु − नाश्रमधर्माणामेव विद्योपयोगः, ‘अन्तरा चापि तु तद्दृष्टेः’ (ब्र.सू. ३. ४. ३६) इत्यधिकरणे अनाश्रमिविधुराद्यनुष्ठितकर्मणामपि विद्योपयोगनिरूपणात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001186.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001187", "originalText": "न च −विधुरादीनामनाश्रमिणां प्राग्जन्मानुष्ठितयज्ञाद्युत्पादितविविदिषाणां विद्यासाधनश्रवणादावधिकारनिरूपणमात्रपरं तदधिकरणम्, न तु तदनुष्ठितकर्मणां विद्योपयोगनिरूपणपरमिति−शङ्क्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001187.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001188", "originalText": "‘विशेषानुग्रहश्च’ (ब्र.सू. ३. ४. ३८) इति तदधिकरणसूत्रतद्भाष्ययोः तदनुष्ठितानां जपादिरूपवर्णमात्रधर्माणामपि विद्योपयोगस्य कण्ठत उक्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_001188.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001189", "originalText": "‘विहितत्वाच्चाश्रमकर्मापि’ इति सूत्रे आश्रमकर्मपदस्य वर्णधर्माणामप्युपलक्षणत्वात् इत्यभिप्रायेण−उक्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001189.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001190", "originalText": "आश्रमधर्मव्यतिरिक्तानामप्यस्ति विद्योपयोगः, किं तु नित्यानामेव।", "padacchedaText": "", "audioFile": "PB_hear2read_001190.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001191", "originalText": "तेषां हि फलं दुरितक्षयं विद्या अपेक्षते, न काम्यानां फलं स्वर्गादि।", "padacchedaText": "", "audioFile": "PB_hear2read_001191.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001192", "originalText": "तत्र यथा प्रकृतौ क्लृप्तोपकाराणामङ्गानामतिदेशे सति न प्राकृतोपकारातिरिक्तोपकारकल्पनम्, एवं ज्ञाने विनियुक्तानां यज्ञादीनां नित्यक्लृप्तफलपापक्षयातिरेकेण न नित्यकाम्यसाधारणविद्योपयोग्युपकारकल्पनमिति।", "padacchedaText": "", "audioFile": "PB_hear2read_001192.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001193", "originalText": "सङ्क्षेपशरीरके तु नित्यानां काम्यानां च कर्मणां विनियोग उक्तः।", "padacchedaText": "", "audioFile": "PB_hear2read_001193.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001194", "originalText": "यज्ञादिशब्दाविशेषात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001194.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001195", "originalText": "प्रकृतौ क्लृप्तोपकाराणां पदार्थानां क्लृप्तप्राकृतोपकारातिदेशमुखेनैव विकृतिष्वतिदेशेन सम्बन्धः, न तु पदार्थानामतिदेशानन्तरमुपकारकल्पना, इति न तत्र प्राकृतोपकारातिरिक्तोपकारकल्पनाप्रसक्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_001195.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001196", "originalText": "इह तु प्रत्यक्षश्रुत्या प्रथममेव विनियुक्तानां यज्ञादीनाम् उपदिष्टानामङ्गानामिव पश्चात्कल्पनीय उपकारः प्रथमावगतविनियोगनिर्वाहाय अक्लृप्तोऽपि सामान्यशब्दोपात्तसकलनित्यकाम्यसाधारणः कथं न कल्प्यः।", "padacchedaText": "", "audioFile": "PB_hear2read_001196.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001197", "originalText": "अध्वरमीमांसकैरपि हि ‘उपकारमुखेन पदार्थान्वय एव क्लृप्तोपकारनियमः, पदार्थान्वयानन्तरम् उपकारकल्पने तु अक्लृप्तोऽपि विनियुक्तपदार्थानुगुण्येन उपकारः कल्पनीयः’ इति सम्प्रतिपद्यैव बाधलक्षणारम्भसिद्ध्यर्थम् उपकारमुखेन विकृतिषु प्राकृतान्वयो दशमाद्ये समर्थितः।", "padacchedaText": "", "audioFile": "PB_hear2read_001197.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001198", "originalText": "किं च कॢप्तोपकारालाभात् नित्यानामेवायं विनियोग इत्यभ्युपगमे नित्येभ्यो दुरितक्षयस्य तस्माच्च ज्ञानोत्पत्तेः अन्यतः सिद्धौ व्यर्थोऽयं विनियोगः, अन्यतस्तदसिद्धौ ज्ञानापेक्षितोपकारजनकत्वं तेष्वकॢप्तमिति अविशेषात् नित्यकाम्यसाधारणो विनियोगो दुर्वारः।", "padacchedaText": "", "audioFile": "PB_hear2read_001198.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001199", "originalText": "ननु— नित्यानां दुरितक्षयमात्रहेतुत्वस्य अन्यतः सिद्धावपि विशिष्य ज्ञानोत्पत्तिप्रतिबन्धकदुरितनिबर्हकत्वं न सिद्धम्, किन्तु अस्मिन् विनियोगे सति ज्ञानोद्देशेन नित्यानुष्ठानात् अवश्यं ज्ञानं भावति, इतरथा शुद्धिमात्रं न नियता ज्ञानोत्पत्तिः, इति सार्थकोऽयं विनियोग इति चेत्, तर्हि नित्यानामपि अक्लृप्तमेव ज्ञानोत्पत्तिप्रतिबन्धकदुरितनिबर्हणत्वं, ज्ञानसाधनविशिष्टगुरुलाभश्रवणमननादिसम्पादकापूर्वं च द्वारं कल्पनीयमिति अक्लृप्तोपकारकल्पनाविशेषात् न सामान्यश्रुत्यापादितो नित्यकाम्यसाधारणो विनियोगो भञ्जनीय इति।", "padacchedaText": "", "audioFile": "PB_hear2read_001199.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001200", "originalText": "विद्यार्थकर्मसु अधिकारिविचारः\nननु—एवमपि कथं ‘कर्मणैव हि संसिद्धिमास्थिता जनकादयः।", "padacchedaText": "", "audioFile": "PB_hear2read_001200.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001201", "originalText": "’ (भ.गी. ३. २०) इत्यादिस्मरणनिर्वाहः।", "padacchedaText": "", "audioFile": "PB_hear2read_001201.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001202", "originalText": "न च तस्य विद्यार्थकर्मानुष्ठानपरत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_001202.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001203", "originalText": "विविदिषावाक्ये ब्राह्मणग्रहणेन ब्राह्मणानामेव विद्यार्थकर्मण्यधिकारप्रतीतेः।", "padacchedaText": "", "audioFile": "PB_hear2read_001203.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001204", "originalText": "अतो जनकाद्यनुष्ठितकर्मणां साक्षादेव मुक्त्युपयोगो वक्तव्यः, मैवम्— विविदिषावाक्ये ब्राह्मणग्रहणस्य त्रैवर्णिकोपलक्षणत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_001204.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_001205", "originalText": "यथाहुः अत्रभवन्तो वार्तिककाराः ‘ब्राह्मणग्रहणं चात्र द्विजानामुपलक्षणम्। अविशिष्टाधिकारत्वात् सर्वेषामात्मबोधने॥", "padacchedaText": "", "audioFile": "P
