        const manifest = [{"id": "B_000000", "originalText": "श्रीमदप्पय्यदीक्षितविरचितः शास्त्रसिद्धान्तलेशसङ्ग्रहः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000000.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000001", "originalText": "प्रथमपरिच्छेदः।।", "padacchedaText": "", "audioFile": "PB_hear2read_000001.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000002", "originalText": "अधिगतभिदा पूर्वाचार्यानुपेत्य सहस्रधा\nसरिदिव महीभेदान् सम्प्राप्य शौरिपदोद्गता। जयति भगवत्पादश्रीमन्मुखाम्बुजनिर्गता\nजननहरणी सूक्तिर्ब्रह्माद्वयैकपरायणा॥ १॥", "padacchedaText": "", "audioFile": "PB_hear2read_000002.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000003", "originalText": "प्राचीनैर्व्यवहारसिद्धविषयेष्वात्मैक्यसिद्धौ परं\nसन्नह्यद्भिरनादरात् सरणयो नानाविधा दर्शिताः। तन्मूलानिह सङ्ग्रहेण कतिचित् सिद्धान्तभेदान् धिय—\nश्शुद्ध्यै सङ्कलयामि तातचरणव्याख्यावचःख्यापितान्॥ २॥", "padacchedaText": "", "audioFile": "PB_hear2read_000003.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000004", "originalText": "तेषूपपादनापेक्षान् पक्षान् प्रायो यथामति। युक्त्योपपादयन्नेव लिखाम्यनतिविस्तरम्॥ ३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000004.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000005", "originalText": "श्रवणविधिविचारः\nतत्र तावत् ‘आत्मा वा अरे द्रष्टव्यः श्रोतव्यो (मन्तव्यः)’ (बृ.उ. २. ४. ५) इति अधीतसाङ्गस्वाध्यायस्य वेदान्तैरापातप्रतिपन्ने ब्रह्मात्मनि समुदितजिज्ञासस्य तज्ज्ञानाय वेदान्तश्रवणे विधिः प्रतीयमानः किंविध इति चिन्त्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000005.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000006", "originalText": "तिस्रः खलु विधेर्विधाः— अपूर्वविधिः नियमविधिः परिसङ्ख्याविधिश्च इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000006.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000007", "originalText": "तत्र कालत्रयेऽपि कथमप्यप्राप्तस्य प्राप्तिफलको विधिराद्यः।", "padacchedaText": "", "audioFile": "PB_hear2read_000007.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000008", "originalText": "यथा ‘व्रीहीन् प्रोक्षति’ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000008.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000009", "originalText": "नात्र व्रीहीणां प्रोक्षणस्य संस्कारकर्मणो विना विनियोगं मानान्तरेण कथमपि प्राप्तिरस्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000009.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000010", "originalText": "पक्षप्राप्तस्य अप्राप्तांशपरिपूरणफलको विधिर्द्वितीयः।", "padacchedaText": "", "audioFile": "PB_hear2read_000010.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000011", "originalText": "यथा ‘व्रीहीनवहन्ति’ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000011.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000012", "originalText": "अत्र विध्यभावेऽपि पुरोडाशप्रकृतिद्रव्याणां व्रीहीणां तण्डुलनिष्पत्त्याक्षेपादेव अवहननप्राप्तिः भविष्यति इति न तत्प्राप्त्यर्थोऽयं विधिः, किन्तु आक्षेपादवहननप्राप्तौ तद्वदेव लोकावगतकारणत्वाविशेषात् नखविदलनादिरपि पक्षे प्राप्नुयात् इति अवहननाप्राप्तांशसद्भावात् तदंशपरिपूरणफलकः।", "padacchedaText": "", "audioFile": "PB_hear2read_000012.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000013", "originalText": "द्वयोः शेषिणोः एकस्य शेषस्य वा एकस्मिन् शेषिणि द्वयोः शेषयोर्वा नित्यप्राप्तौ शेष्यन्तरस्य शेषान्तरस्य वा निवृत्तिफलको विधिः तृतीयः।", "padacchedaText": "", "audioFile": "PB_hear2read_000013.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000014", "originalText": "यथा अग्रिचयने ‘इमामगृभ्णन्रशनामृतस्येत्यश्वाभिधानीमादत्ते’ इति, यथा वा चातुर्मास्यान्तर्गतेष्टिविशेषे गृहमेधीये ‘आज्यभागौ यजति’ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000014.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000015", "originalText": "अग्निचयने अश्वरशनाग्रहणं गर्दभरशनाग्रहणं च इति द्वयमनुष्ठेयम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000015.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000016", "originalText": "तत्र अश्वरशनाग्रहणे ‘इमामगृभ्णन्’ इति मन्त्रो लिङ्गादेव रशनाग्रहणप्रकाशनसामर्थ्यरूपात् नित्यं प्राप्नोति इति न तत्प्राप्त्यर्थः तदप्राप्तांशपरिपूरणार्थो वा विधिः, किं तु लिङ्गाविशेषात् गर्दभरशनाग्रहणेऽपि मन्त्रः प्राप्नुयात् इति तन्निवृत्त्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000016.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000017", "originalText": "तथा गृहमेधीयस्य दर्शपूर्णमासप्रकृतिकत्वात् अतिदेशादेव आज्यभागौ नित्यं प्राप्नुतः इति न तत्र विधिः तत्प्राप्त्यर्थः तन्नियमार्थो वा, किं तु अतिदेशात् प्रयाजादिकमपि प्राप्नुयात् इति तन्निवृत्त्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000017.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000018", "originalText": "गृहमेधीयाधिकरणपूर्वपक्षरीत्या इदमुदाहरणं यत्र क्कचिदुदाहर्तव्यमित्युदाहृतम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000018.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000019", "originalText": "न च नियमविधावपि पक्षप्राप्तावहननस्य अप्राप्तांशपरिपूरणे कृते तदवरुद्धत्वात् पाक्षिकसाधनान्तरस्य नखविदलनादेः निवृत्तिरपि लभ्यत इति इतरनिवृत्तिफलकत्वाविशेषात् नियमपरिसङ्ख्ययोः फलतो विवेको न यक्त इति शङ्क्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000019.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000020", "originalText": "विधितोऽवहनननियमं विना आक्षेपलभ्यस्य नखविदलनादेर्निवर्तयितुमशक्यतया अप्राप्तांशपरिपूरणरूपस्य नियमस्य प्राथम्यात् विधेयावहननगतत्वेन प्रत्यासन्नत्वाच्च तस्यैव नियमविधिफलत्वोपगमात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000020.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000021", "originalText": "तदनुनिष्पादिन्या अविधेयगतत्वेन विप्रकृष्टाया इतरनिवृत्तेः सन्निकृष्टफलसम्भवे फलत्वानौचित्यात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000021.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000022", "originalText": "एवं विविक्तासु तिसृषु विधासु किंविधः श्रवणविधिराश्रीयते।", "padacchedaText": "", "audioFile": "PB_hear2read_000022.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000023", "originalText": "प्रकटार्थकारादयः केचिदाहुः− अपूर्वविधिरयम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000023.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000024", "originalText": "अप्राप्तत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000024.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000025", "originalText": "न हि ‘वेदान्तश्रवणं ब्रह्मसाक्षात्कारहेतुः’ इति अन्वयव्यतिरेकप्रमाणमस्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000025.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000026", "originalText": "लोके कृतश्रवणस्यापि बहुशस्तदनुत्पत्तेः अकृतश्रवणस्यापि गर्भगतस्य वामदेवस्य तदुत्पत्तेः उभयतो व्यभिचारात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000026.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000027", "originalText": "न वा श्रवणमात्रं श्रोतव्यार्थसाक्षात्कारहेतुः इति शस्त्रान्तरश्रवणे गृहीतः सामान्यनियमोऽस्ति, येनात्र विशिष्य हेतुत्वग्राहकाभवेऽपि सामान्यमुखेनैव हेतुत्वं प्राप्यत इत्याशङ्क्येत।", "padacchedaText": "", "audioFile": "PB_hear2read_000027.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000028", "originalText": "गान्धर्वादिशास्त्रश्रवणस्य षड्जादिसाक्षात्कारहेतुत्वाभ्युपगमेऽपि कर्मकाण्डादिश्रवणात् तदर्थधर्मादिसाक्षात्कारादर्शनेन व्यभिचारात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000028.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000029", "originalText": "तस्मादपूर्वविधिरेवायम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000029.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000030", "originalText": "भाष्येऽपि ‘सहकार्यन्तरविधिः पक्षेण तृतीयं तद्वतो विध्यादिवत्’ (ब्र.सू. ३. ४. ४७) इत्यधिकरणे ‘विद्यासहकारिणो मौनस्य बाल्यपाण्डित्यवत् विधिरेवाश्रयितव्यः अपूर्वत्वात्’ इति पाण्डित्यशब्दशब्दिते श्रवणे अपूर्वविधिरेवाङ्गीकृतः − इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000030.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000031", "originalText": "वेदान्तश्रवणस्य नित्यापरोक्षब्रह्मसाक्षात्कारहेतुत्वं न अप्राप्तम्, अपरोक्षवस्तुविषयकप्रमाणत्वावच्छेदेन साक्षात्कारहेतुत्वस्य प्राप्तेः शाब्दापरोक्षवादे व्यवस्थापनात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000031.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000032", "originalText": "तदर्थमेव हि तत्प्रस्तावः।", "padacchedaText": "", "audioFile": "PB_hear2read_000032.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000033", "originalText": "न च— तावता ब्रह्मप्रमाणत्वेन आपातदर्शनसाधारणब्रह्मसाक्षात्कारहेतुत्वप्राप्तावपि अविद्यानिवृत्त्यर्थमिष्यमाणसत्तानिश्चयरूपतत्साक्षात्कारहेतुत्वं श्रवणस्य न प्राप्तम् इति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000033.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000034", "originalText": "विचारमात्रस्य विचार्यनिर्णयहेतुत्वस्य ब्रह्मप्रमाणस्य तत्साक्षात्कारहेतुत्वस्य च प्राप्तौ विचारितवेदान्तशब्दज्ञानरूपस्य श्रवणस्य तद्धेतुत्वप्राप्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000034.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000035", "originalText": "न च उक्तोभयतो व्यभिचारः।", "padacchedaText": "", "audioFile": "PB_hear2read_000035.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000036", "originalText": "सहकारिवैकल्येनान्वयव्यभिचारस्यादोषत्वात्, जातिस्मरस्य जन्मान्तरश्रवणात्, फलसम्भवेन व्यतिरेकव्यभिचाराभावात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000036.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000037", "originalText": "अन्यथा व्यभिचारेणैव हेतुत्वबाधे श्रुत्यापि तत्साधनताज्ञानासम्भवात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000037.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000038", "originalText": "घटसाक्षात्कारे चक्षुरतिरेकेण त्वगिन्द्रियमिव ब्रह्मसाक्षात्कारे श्रवणातिरेकेण उपायान्तरमस्तीति शङ्कायां व्यतिरेकव्यभिचारस्यापि अदोषत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000038.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000039", "originalText": "तथा च प्राप्तत्वान्नापूर्वविधिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000039.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000040", "originalText": "अत एव ‘आवृत्तिरसकृदुपदेशात्’ (ब्र.सू. ४. १. १) इत्यधिकरणभाष्ये ‘दर्शनपर्यवसानानि हि श्रवणादीन्यावर्त्यमनानि दृष्टार्थानि भवन्ति, यथा अवघातादीनि तण्डुलनिष्पत्तिपर्यवसानानि’ इति श्रवणस्य ब्रह्मदर्शनार्थस्य दृष्टार्थतया दार्शपूर्णमासिकावघातन्यायप्राप्तावृत्त्युपदेशः।", "padacchedaText": "", "audioFile": "PB_hear2read_000040.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000041", "originalText": "अपूर्वविधित्वे तु स न सङ्गच्छते सर्वौषधावघातवत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000041.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000042", "originalText": "अग्निचयने ‘सर्वौषधस्य पूरयित्वाऽवहन्ति अथैतदुपदधाति।", "padacchedaText": "", "audioFile": "PB_hear2read_000042.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000043", "originalText": "’ इति उपधेयोलूखलसंस्कारार्थत्वेन विहितस्यावघातस्य दृष्टार्थत्वाभावान्नावृत्तिरिति हि तन्त्रलक्षणे स्थितम् (जै.सू. ११. १. ६)।", "padacchedaText": "", "audioFile": "PB_hear2read_000043.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000044", "originalText": "अतो नियमविधिरेवायम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000044.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000045", "originalText": "तदभावे हि यथा वस्तु किञ्चिच्चक्षुषा वीक्षमाणस्तत्र स्वागृहीते सूक्ष्मे विशेषान्तरे केनचित् कथिते तदवगमाय तस्यैव चक्षुषः पुनरपि सप्रणिधानं व्यापारे प्रवर्तते।", "padacchedaText": "", "audioFile": "PB_hear2read_000045.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000046", "originalText": "एवं मनसा ‘अहं’ इति गृह्यमाणे जीवे वेदान्तैरध्ययनगृहीतैरुपदिष्टं निर्विशेषब्रह्मचैतन्यरूपत्वमाकर्ण्य तदवगमाय तत्र सावधानं मनस एव प्रणिधने कदाचित् पुरुषः प्रवर्तेतेति वेदान्तश्रवणे प्रवृत्तिः पाक्षिकी स्यत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000046.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000047", "originalText": "‘यतो वाचो निवर्तन्ते (अप्राप्य मनसा सह)’ (तै.उ. २. ९. १) इतिश्रुतिः ’मनसैवानुद्रष्टव्यम्’ (बृ.उ. ४. ४. १९) ‘द्दश्यते त्वग्र्यया बुद्ध्या’ (क.उ. ३. १२) इत्यपि श्रवणेन अनवहितमनोविषया इतिशङ्कासम्भवात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000047.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000048", "originalText": "अथवा ‘जुष्टं यदा पश्यत्यन्यमीशमस्य महिमानमिति वीतशोकः’ (मु.उ. ३. १. २) इत्यादिश्रवणात् भिन्नात्मज्ञानान्मुक्तिरितिभ्रमसम्भवेन मुक्तिसाधनज्ञानाय भिन्नात्मविचाररूपे शास्त्रान्तरश्रवणेऽपि पक्षे प्रवृत्तिस्स्यादिति अद्वैतात्मपरवेदान्तश्रवणानियमविधिरयमस्तु।", "padacchedaText": "", "audioFile": "PB_hear2read_000048.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000049", "originalText": "इह आत्मशब्दस्य ‘इदं सर्वं यदयमात्मा’ (बृ.उ. २. ४. ६) इत्यादिप्रकरणपर्यालोचनया अद्वितीयात्मपरत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000049.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000050", "originalText": "न हि वस्तुसत्साधनान्तरप्राप्तावेव नियमविधिरिति कुलधर्मः, येन वेदान्तश्रवणनियमार्थवत्त्वाय नियमादृष्टजन्यस्वप्रतिबन्धककल्मषनिवृत्तिद्वारा सत्तानिश्चयरूपब्रह्मसाक्षात्कारस्य वेदान्तश्रवणैकसाध्यत्वस्याभ्युपगन्तव्यत्वेन तत्र वस्तुत: साधनान्तराभावान्न नियमविधिर्युज्यत इति शङ्क्येत।", "padacchedaText": "", "audioFile": "PB_hear2read_000050.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000051", "originalText": "किं तु यत्र साधनान्तरतया सम्भाव्यमानस्य पक्षे प्राप्त्या विधित्सितसाधनस्य पाक्षिक्यप्रप्तिर्निवारयितुं न शक्यते तत्र नियमविधिः, तावतैव अप्राप्तांशपरिपूरणस्य तत्फलस्य सिद्धेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000051.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000052", "originalText": "अथवा— गुरुमुखाधीनादिव निपुणस्य स्वप्रयत्नमात्रसाध्यादपि वेदान्तविचारात् सम्भवति सत्तानिश्चयरूपं ब्रह्मापरोक्षज्ञानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000052.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000053", "originalText": "किं तु गुरुमुखाधीतवेदान्तवाक्यश्रवणनियमादृष्टम् अविद्यानिवृत्तिं प्रति कल्मषनिरासेनोपयुज्यत इति तदभावेन प्रतिबद्धम् अविद्यामनिवर्तयत् परोक्षज्ञानकल्पमवतिष्ठते।", "padacchedaText": "", "audioFile": "PB_hear2read_000053.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000054", "originalText": "न च ज्ञानोदये अज्ञानानिवृत्त्यनुपपत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000054.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000055", "originalText": "प्रतिबन्धकाभावस्य सर्वत्रापेक्षितत्वेन सत्यपि प्रत्यक्षविशेषदर्शने उपाधिना प्रतिबन्धात् प्रतिबिम्बभ्रमानिवृत्तिवत् तदनिवृत्त्युपपत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000055.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000056", "originalText": "एवं च लिखितपाठादिनापि स्वाध्यायग्रहणप्रसक्तौ गुरुमुखाधीनाध्ययननियमविधिवत् स्वप्रयत्नमात्रपूर्वकस्यापि वेदन्तविचारस्य सत्तानिश्चयरूपब्रह्मसाक्षात्कारार्थत्वेन पक्षे प्राप्तौ गुरुमुखाधीनश्रवणनियमविधिरस्तु।", "padacchedaText": "", "audioFile": "PB_hear2read_000056.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000057", "originalText": "न च ‘तद्विज्ञानार्थं स गुरुमेवाभिगच्छेत्’ (मु.उ. १. २. १२) इति गुरूपसदनविधिनैव गुरुरहितविचारव्यावृत्तिसिद्धेर्विफलो नियमविधिरिति शङ्क्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000057.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000058", "originalText": "गुरूपसदनस्य श्रवणाङ्गतया श्रवणविध्यभावे तद्विधिरेव नास्तीति तेन तस्य वैफल्याप्रसक्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000058.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000059", "originalText": "अन्यथा अध्ययनाङ्गभूतोपगमनविधिनैव लिखितपाठादिव्यावृत्तिरिति अध्ययननियमोऽपि विफलः स्यात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000059.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000060", "originalText": "अथवा अद्वैतात्मपरभाषाप्रबन्धश्रवणस्य पक्षे प्राप्त्या वेदान्तश्रवणे नियमविधिरस्तु।", "padacchedaText": "", "audioFile": "PB_hear2read_000060.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000061", "originalText": "न च ‘नम्लेच्छितवै’ इत्यादिनिषेधादेव तदप्राप्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000061.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000062", "originalText": "शास्त्रव्युत्पत्तिमान्द्यात् वेदान्तश्रवणमशक्यमिति पुरुषार्थनिषेधमुल्लङ्घ्यापि भाषाप्रबन्धेनाद्वैतं जिज्ञासमानस्य तत्र प्रवृत्तिसम्भवेन नियमविधेरर्थवत्त्वोपपत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000062.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000063", "originalText": "’अभ्युपगम्यते हि कत्रधिकरणे’ (जै.सू. ३. ४. १२) व्युत्पादितं पुरुषार्थे अनृतवदननिषेधे सत्यपि दर्शपूर्णमासमध्ये कुतश्चिद्धेतोरङ्गीकृतनिषेधोल्लङ्घनस्य अविकलां क्रतुसिद्धिं कामयमानस्य अनृतवदने प्रवृत्ति: स्यदिति पुनः क्रत्वर्थतया दर्शपूर्णमासप्रकरणे ‘नानृतं वदेत्’ इति निषेधः इति क्रत्वर्थतया निषेधस्यार्थवत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000063.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000064", "originalText": "यद्वा— यथा ‘मन्त्रैरेव मन्त्रार्थस्मृतिः साध्या’ इति नियमः, तन्मूलककल्पसूत्रात्मीयग्रहणकवाक्यादीनामपि पक्षे प्राप्तेः, तथा वेदान्तमूलकेतिहासपुराणपौरुषेयप्रबन्धानामपि पक्षे प्राप्तिसम्भवान्नियमोऽयमस्तु।", "padacchedaText": "", "audioFile": "PB_hear2read_000064.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000065", "originalText": "सर्वथा नियमविधिरेवायम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000065.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000066", "originalText": "‘सहकार्यन्तरविधिः’ इत्यधिकरणभाष्ये अपूर्वत्वोक्तिस्तु नियमविधित्वेऽपि पाक्षिकाप्राप्तिसद्भावात् तदभिप्राया इति तत्रैव पक्षेणेति पाक्षिकाप्राप्तिकथनपरसूत्रपदयोजनेन स्पष्टीकृतम्— इति विवरणानुसारिणः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000066.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000067", "originalText": "कृतश्रवणस्य प्रथमं शब्दात् निर्विचिकित्सं परोक्षज्ञानमेवोत्पद्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000067.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000068", "originalText": "शब्दस्य परोक्षज्ञानजननस्वाभाव्येन क्लृप्तसामर्थ्यानतिलङ्घनात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000068.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000069", "originalText": "पश्चात् कृतमनननिदिध्यासनस्य सहकारिविशेषसम्पन्नात् तत एव अपरोक्षज्ञानं जायते।", "padacchedaText": "", "audioFile": "PB_hear2read_000069.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000070", "originalText": "तत्तांशगोचरज्ञानजननासमर्थस्यापीन्द्रियस्य सत्समर्थसंस्कारसाहित्यात् प्रत्यभिज्ञानजनकत्ववत् स्वतोऽपरोक्षज्ञानजननासमर्थस्यापि शब्दस्य विधुरपरिभावितकामिनीसाक्षात्कारस्थले तत्समर्थत्वेनक्लृप्तभावनाप्रचयसाहित्यादपरोक्षज्ञानजनकत्वं युक्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000070.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000071", "originalText": "ततश्च शब्दस्य स्वतस्स्वविषये परोक्षज्ञानजनकत्वस्य भावनाप्रचयसहकृतज्ञानकरणत्वावच्छेदेन विधुरान्त:करणवदपरोक्षज्ञानजनकत्वस्य च प्राप्तत्वात् पूर्ववन्नियमविधिरिति तदेकदेशिनः।", "padacchedaText": "", "audioFile": "PB_hear2read_000071.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000072", "originalText": "वेदान्तश्रवणेन न ब्रह्मसाक्षात्कारः, किन्तु मनसैव, ‘मनसैवानुद्रष्टव्यम्’ (बृ.उ. ४. ४. १९) इति श्रुतेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000072.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000073", "originalText": "‘शास्त्राचार्योपदेशशमदमादिसंस्कृतं मन आत्मदर्शने करणम्’ इति गीताभाष्यवचनाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000073.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000074", "originalText": "श्रवणं तु निर्विचिकित्सपरोक्षज्ञानार्थमिति तादर्थ्येनैव नियमविधिः इति केचित्।", "padacchedaText": "", "audioFile": "PB_hear2read_000074.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000075", "originalText": "अपरोक्षज्ञानार्थत्वेनैव श्रवणे नियमविधिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000075.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000076", "originalText": "‘द्रष्टव्य’ इति फलकीर्तनात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000076.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000077", "originalText": "तादर्थ्यञ्च तस्य करणभूतमनःसहकारितयैव न साक्षात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000077.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000078", "originalText": "शाब्दापरोक्षज्ञानानङ्गीकरणात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000078.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000079", "originalText": "न च तस्य तेन रुपेण तादर्थ्यं न प्राप्तमित्यपूर्वविधित्वप्रसङ्गः।", "padacchedaText": "", "audioFile": "PB_hear2read_000079.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000080", "originalText": "श्रावणेषु षड्जादिषु समारोपितपरस्पराविवेकनिवृत्त्यर्थगान्धर्वशास्त्रश्रवणसहकृतश्रोत्रेण परस्परासङ्कीर्णतद्याथार्थ्यापरोक्ष्यदर्शनेन, प्रकाशमाने वस्तुनि आरोपिताविवेकनिवृत्त्यर्थशास्त्रसद्भावे तच्छ्रवणं तत्साक्षात्कारजनकेन्द्रियसहकारिभावेनोपयुज्यत इत्यस्य क्लृप्तत्वात् इति अपरे।", "padacchedaText": "", "audioFile": "PB_hear2read_000080.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000081", "originalText": "वेदान्तवाक्यानाम् अद्वितीये ब्रह्मणि तात्पर्यनिर्णयानुकूलन्यायविचारात्मकचेतोवृत्तिविशेषरूपस्य श्रवणस्य न ब्रह्मणि परोक्षमपरोक्षं वा ज्ञानं फलम्, तस्य शब्दादिप्रमाणफलत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000081.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000082", "originalText": "न च उक्तरूपविचारावधारिततात्पर्यविशिष्टशब्दज्ञानमेव श्रवणमस्तु तस्य ब्रह्मज्ञानं फलम् युज्यते इति वाच्यम्, ज्ञाने विध्यनुपपत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000082.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000083", "originalText": "श्रवणविधेर्विचारकर्तव्यताविधायकजिज्ञासासूत्रमूलत्वोपगमाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000083.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000084", "originalText": "ऊहापोहात्मकमानसक्रियारूपविचारस्यैव श्रवणत्वौचित्यात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000084.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000085", "originalText": "न च विचारस्यैव तात्पर्यनिर्णयद्वारा तज्जन्यतात्पर्यभ्रमादिपुरुषापराधरूपप्रतिबन्धकविगमद्वारा वा ब्रह्मज्ञानं फलमस्त्विति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000085.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000086", "originalText": "तात्पर्यज्ञानस्य शाब्दज्ञाने कारणत्वानुपगमात् कार्ये क्कचिदपि प्रतिबन्धकाभावस्य कारणत्वानुपगमाच्च तयोर्द्वारत्वानुपपत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000086.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000087", "originalText": "ब्रह्मज्ञानस्य विचाररूपातिरिक्तकारणकत्वे तत्प्रामाण्यस्य परतस्त्वापत्तेश्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000087.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000088", "originalText": "तस्मात् तात्पर्यनिर्णयद्वरा परुषापराधनिरासार्थत्वेनैव विचाररूपे श्रवणे नियमविधिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000088.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000089", "originalText": "‘द्रष्टव्यः’ इति तु दर्शनार्हत्वेन स्तुतिमात्रं न श्रवणफलसङ्कीर्तनम् इति सङ्क्षेपशारीरकानुसारिणः।", "padacchedaText": "", "audioFile": "PB_hear2read_000089.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000090", "originalText": "ब्रह्मज्ञानार्थं वेदान्तश्रवणे प्रवृत्तस्य चिकित्साज्ञानार्थं चरकसुश्रुतादिश्रवणे प्रवृत्तस्येव मध्ये व्यापारान्तरेऽपि प्रवृत्तिः प्रसज्येत इति तन्निवृत्तिफलकः ‘श्रोतव्यः’ इति परिसङ्ख्याविधिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000090.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000091", "originalText": "‘ब्रह्मसंस्थोऽमृतत्वमेति’ (छा.उ. २. २३. १) इति छान्दोग्ये अनन्यव्यापारत्वस्य मुक्त्युपायत्वावधारणात्, सम्पूर्वस्य तिष्ठतेः समाप्तिवाचितया ब्रह्मसंस्थाशब्दशब्दिताया ब्रह्मणि समाप्तेः अनन्यव्यापाररूपत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000091.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000092", "originalText": "‘तमेवैकं जानथ आत्मानमन्या वाचो विमुञ्चथ’ (मु.उ. २. २. ५) इत्याथर्वणे कण्ठत एव व्यापारान्तरप्रतिषेधाच्च, ‘आसुप्तेरामृतेः कालं नयेद्वेदान्तचिन्तया’ इत्यादिस्मृतेश्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000092.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000093", "originalText": "न च ब्रह्मज्ञानानुपयोगिनो व्यापारान्तरस्य एकस्मिन् साध्ये श्रवणेन सह समुच्चित्य प्राप्त्यभावात् न तन्निवृत्त्यर्थः परिसङ्ख्याविधिर्युज्यत इति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000093.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000094", "originalText": "’सहकार्यन्तरविधिः’ (ब्र.सू. ३. ४. ४७) इत्यादिसूत्रे ‘यस्मात् पक्षे भेददर्शनप्राबल्यान्न प्राप्नोति तस्मान्नियमविधिः’ इति तद्भाष्ये च कृतश्रवणस्य शाब्दज्ञानमात्रात् कृतकृत्यतां मन्वानस्य अविद्यानिवर्तकसाक्षात्कारोपयोगिनि निदिध्यासने प्रवृत्तिर्न स्यादिति अतत्साधनपक्षप्रप्तिमात्रेण निदिध्यासने नियमविधेरभ्युपगततया तन्न्यायेन असाधनस्य समुच्चित्य प्राप्तावपि तन्निवृत्तिफलकस्य परिसङ्ख्याविधेः सम्भवादिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000094.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000095", "originalText": "‘नियमः परिसङ्ख्या वा विध्यर्थोऽत्र भवेत्, यतः। अनात्मादर्शनेनैव परात्मानमुपास्महे॥", "padacchedaText": "", "audioFile": "PB_hear2read_000095.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000096", "originalText": "’ (नै.सि. १. ८८) इति वर्तिकवचनानुसारिणः किचित् आहुः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000096.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000097", "originalText": "‘आत्मा श्रोतव्यः’ इति मननादिवत् आत्मविषयकत्वेन निबध्यमानं श्रवणम् आगमाचार्योपदेशजन्यमात्मविषयं ज्ञानमेव न तात्पर्यविचाररूपम् इति न तत्र कोऽपि विधिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000097.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000098", "originalText": "अत एव समन्वयसूत्रे (ब्र.सू. १. १. ४) आत्मज्ञानविधिनिराकरणानन्तरं भाष्यं \"किमर्थानि तर्हि ‘आत्मा वा अरे द्रष्टव्यः’ इत्यादीनि वचनानि विधिच्छायानि? स्वभाविकप्रवृत्तिविषयविमुखीकरणार्थनीति ब्रूमः\" इत्यादि।", "padacchedaText": "", "audioFile": "PB_hear2read_000098.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000099", "originalText": "यदि च वेदान्ततात्पर्यविचारः श्रवणं तदा तस्य तात्पर्यनिर्णयद्वारा वेदान्ततात्पर्यभ्रमसंशयरूपप्रतिबन्धकनिरास एव फलं न प्रतिबन्धकान्तरनिरासो ब्रह्मावगमो वा।", "padacchedaText": "", "audioFile": "PB_hear2read_000099.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000100", "originalText": "तत्फलकत्वं च तस्य लोकत एव प्राप्तम्, साधनान्तरं च किञ्चिद्विकल्प्य समुच्चित्य वा न प्राप्तम्, इति न तत्र विधित्रयस्याप्यवकाशः।", "padacchedaText": "", "audioFile": "PB_hear2read_000100.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000101", "originalText": "विचारविध्यभावेऽपि विज्ञानार्थतया विधीयमानं गुरूपसदनं दृष्टद्वारसम्भवे अदृष्टकल्पनायोगात् गुरुमुखाधीनवेदान्तविचारद्वारैव विज्ञानार्थं पर्यवस्यतीति।", "padacchedaText": "", "audioFile": "PB_hear2read_000101.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000102", "originalText": "अत एव स्वप्रयत्नसाध्यविचारव्यावृत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000102.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000103", "originalText": "अध्ययनविध्यभावे तु उपगमनं विधीयमानम् अक्षरावाप्त्यर्थत्वेनाविधीयमानत्वात् न तदर्थं गुरुमुखोच्चारणानुच्चारणमध्ययनं द्वारीकरोतीति लिखितपाठादिव्यावृत्त्यसिद्धेः सफलोऽध्ययननियमविधिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000103.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000104", "originalText": "न च तात्पर्यभ्रमादिनिरासाय वेदान्तविचारार्थिनः कदाचित् द्वैतशास्त्रेऽपि प्रवृत्तिः स्यात्, तत्रापि तदभिमतयोजनया वेदान्तविचारसत्त्वात्, इत्यद्वैतात्मपरवेदान्तविचारनियमविधिरर्थवानिति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000104.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000105", "originalText": "स्वयमेव तात्पर्यभ्रमहेतोस्तस्य तन्निरासकत्वाभावेन साधनान्तरप्राप्त्यभावात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000105.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000106", "originalText": "तन्निरासकत्वभ्रमेण तत्रापि कस्यचित् प्रवृत्तिः स्यात् इत्येतावता श्रोतव्य इति नियमविधेरभ्युपगमः इत्यपि न।", "padacchedaText": "", "audioFile": "PB_hear2read_000106.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000107", "originalText": "ईश्वरानुग्रहलब्धाद्वैतश्रद्धारहितस्य श्रोतव्यवाक्येऽपि पराभिमतयोजनया सद्वितीयात्मविचारविधिपरत्वभ्रमसम्भवेन भ्रमप्रयुक्ताया अन्यत्र प्रवृत्तेः विधिशतेनाप्यपरिहार्यत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000107.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000108", "originalText": "न च व्यापारान्तरनिवृत्त्यर्था परिसङ्ख्येति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000108.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000109", "originalText": "असन्न्यासिनो व्यापारान्तरनिवृत्तेरशक्यत्वात्, सन्न्यासिनस्तन्निवृत्तः ब्रह्मसंस्थया सह सन्न्यासविधायकेन ‘ब्रह्मसंस्थोऽमृतत्वमेति’ इति श्रुत्यन्तरेण सिद्धतया, सन्न्यासविधायकश्रुत्यन्तरमपेक्ष्य श्रोतव्यवाक्येन तस्य व्यापारान्तरनिवृत्त्युपदेशस्य व्यर्थत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000109.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000110", "originalText": "न च विचारविध्यसम्भवेऽपि विचारविषयवेदान्तनियमविधिः सम्भवति भाषाप्रबन्धादिव्यावर्त्यसत्त्वात् इति शङ्क्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000110.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000111", "originalText": "सन्निधानादेव वेदान्तनियमस्य लब्धत्वेन विधिविषयत्वायोगात्, ‘स्वाध्यायोऽध्येतव्यः’ इत्यर्थावबोधार्थनियमविधिबलादेव अध्ययनगृहीतवेदोत्पादितं वेदार्थज्ञानं फलपर्यवसायि न कारणान्तरोत्पादितम् इत्यस्यार्थस्य लब्धत्वेन वेदार्थे ब्रह्मणि मोक्षाय ज्ञातव्ये भाषाप्रबन्धादीनामप्राप्तेश्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000111.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000112", "originalText": "न च ‘सहकार्यन्तरविधिः’ इत्यधिकरणे पाण्डित्यबाल्यमौनशब्दितेषु श्रवणमनननिदिध्यासनेषु विधिरभ्युपगत इति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000112.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000113", "originalText": "विचारे विचार्यतात्पर्यनिर्णयहेतुत्वस्य वस्तुसिद्ध्यनुकूलयुक्त्यनुसन्धानरूपे मनने तत्प्रत्ययाभ्यासरूपे निदिध्यासने च वस्त्ववगमवैशद्यहेतुत्वस्य च लोकसिद्धत्वेन तेषु विध्यनपेक्षणात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000113.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000114", "originalText": "विधिच्छायार्थवादस्येव प्रशंसाद्वारा प्रवृत्त्यतिशयकरत्वमात्रेण तत्र विधित्वव्यवहारात्। एवं च श्रवणविध्यभावात् कर्मकाण्डविचारवत् ब्रह्मकाण्डविचारोऽप्यध्ययनविधि मूलः इति आचार्यवाचस्पतिपक्षानुसारिणः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000114.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000115", "originalText": "ब्रह्मलक्षणविचारः\nविचार्यस्य च ब्रह्मणः जगज्जन्मस्थितिलयकारणत्वं लक्षणमुक्तं ‘यतो वा इमानि भूतानि जायन्ते’ (तै.उ. ३. १. १) इत्यादिश्रुत्या।", "padacchedaText": "", "audioFile": "PB_hear2read_000115.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000116", "originalText": "जगज्जन्मस्थितिलयेषु एकैककारणत्वमप्यनन्यगामित्वाल्लक्षणं भवितुमर्हतीति चेत्, सत्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000116.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000117", "originalText": "लक्षणत्रयमेवेदं परस्परनिपरपेक्षम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000117.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000118", "originalText": "अत एव ‘अत्ताचराचरग्रहणात्’ (ब्र.सू. १. १. ९) इत्याद्यधिकरणेषु सर्वसंहर्तृत्वादिकं प्रत्येकं ब्रह्मलिङ्गतया उपन्यस्तम् इति कौमुदीकाराः।", "padacchedaText": "", "audioFile": "PB_hear2read_000118.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000119", "originalText": "अन्ये तु जन्मकारणत्वस्य स्थितिकारणत्वस्य च निमित्तसाधारण्यात् उपादानत्वप्रत्यायनाय प्रपञ्चस्य ब्रह्मणि लयो दर्शितः।", "padacchedaText": "", "audioFile": "PB_hear2read_000119.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000120", "originalText": "अस्तु ब्रह्म जगदुपादानम्, तज्जन्मनि घटजन्मनि कुलालवत् तत्स्थितौ राज्यस्थेमनि राजवत् उपदानादन्यदेव निमित्तं भविष्यतीति शङ्काव्यवच्छेदाय तस्यैव जगज्जननजीवननियामकत्वमुक्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000120.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000121", "originalText": "तथा चैकमेवेदं लक्षणम् अभिन्ननिमित्तोपादानतया अद्वितीयं ब्रह्म उपलक्षयतीत्याहुः।", "padacchedaText": "", "audioFile": "PB_hear2read_000121.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000122", "originalText": "ब्रह्मणश्च उपादानत्वम् अद्वितीयकूटस्थचैतन्यरूपस्य न परमाणूनामिवारम्भकत्वरूपम्, न वा प्रकृतेरिव परिणामित्वरूपम्, किं तु अविद्यया वियदादिप्रपञ्चरूपेण विवर्तमानत्वलक्षणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000122.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000123", "originalText": "वस्तुनः तत्समसत्ताकोऽन्यथाभावः परिणामः तदसमसत्ताको विवर्तः इति वा, कारणसलक्षणोऽन्यथाभावः परिणामः तद्विलक्षणो विवर्तः इति वा, कारणाभिन्नं कार्यं परिणामः तदभेदं विनैव तद्व्यतिरेकेण दुर्वचं कार्यं विवर्तः इति वा, विवर्तपरिणामयोर्विवेकः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000123.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000124", "originalText": "शुद्धब्रह्मजीवेश्वराणां मतभेदेन जगदुपादानत्वनिरूपणम्\nअथ शुद्धं ब्रह्म उपादानमिष्यते, ईश्वररूपम्, जीवरूपं वा।", "padacchedaText": "", "audioFile": "PB_hear2read_000124.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000125", "originalText": "अत्र संक्षेपशारीरकानुसारिणः केचिदाहुः − शुद्धमेवोपादानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000125.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000126", "originalText": "जन्मादिसूत्रतद्भाष्ययोः उपादानत्वस्य ज्ञेयब्रह्मलक्षणत्वोक्तेः। तथा च ‘आत्मन आकाशस्सम्भूतः’ (तै.उ. २. १. १) इत्यादिकारणवाक्येषु शबलवाचिनामात्मादिशब्दानां शुद्धे लक्षणैवेति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000126.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000127", "originalText": "विवरणानुसारिणस्तु ‘यस्सर्वज्ञस्सर्ववित् यस्य ज्ञानमयं तपः।", "padacchedaText": "", "audioFile": "PB_hear2read_000127.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000128", "originalText": "तस्मादेतत् ब्रह्म नाम रूपमन्नं च जायाते’ (मु.उ. १. १. ९) इति श्रुतेः सर्वज्ञत्वादिविशष्टं मायाशबलमीश्वररूपमेव ब्रह्म उपादानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000128.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000129", "originalText": "अत एव भाष्ये ‘अन्तस्तद्धर्मोपदेशात्’ (ब्र.सू. १. १. २०) ‘सर्वत्र प्रसिद्धोपदेशात्’ (ब्र.सू. १. २. १) इत्याद्यधिकारणेषु ‘सैव ऋक्तत्साम तदुक्थं तद्यजुस्तद्ब्रह्म’ (छा.उ. १. ७. ५) ‘सर्वकर्मा सर्वकामः सर्वगन्धः सर्वरसः’ (छा.उ. ३. १४. ४) इत्यादिश्रुत्युक्तं सर्वोपादानत्वप्रयुक्तं सर्वात्मकत्वं जीवव्यावृत्तमीश्वरलिङ्गमित्युपवर्णितम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000129.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000130", "originalText": "जीवेश्वरानुस्यूतचैतन्यमात्रस्य सर्वोपादानत्वे तु न तत् जीवव्यावृत्तमीश्वरलिङ्गं स्यत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000130.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000131", "originalText": "सङ्क्षेपशारीरके शबलोपादानत्वनिराकरणमपि मायाविशिष्टोपादानत्वनिराकरणाभिप्रायम्, न तु निष्कृष्टेश्वररूपचैतन्योपादानत्वनिराकरणपरम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000131.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000132", "originalText": "तत्रैव प्रथमाध्यायान्ते जगदुपादानत्वस्य तत्पदार्थवृत्तित्वोक्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000132.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000133", "originalText": "एवञ्च ईश्वरगतमपि कारणत्वं तदनुगतमखण्डचैतन्यं शाखाचन्द्रमसमिव तटस्थतयोपलक्षयितुं शक्नोतीति तस्य ज्ञेयब्रह्मलक्षणत्वोक्तिरिति मन्यन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000133.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000134", "originalText": "वियदादिप्रपञ्च ईश्वराश्रितमायापरिणाम इति तत्रेश्वर उपादानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000134.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000135", "originalText": "अन्तःकरणादिकं तु ईश्वराश्रितमायापरिणाममहाभूतोपसृष्टजीवाविद्याकृतभूतसूक्ष्मकार्यमिति तत्रोभयोरुपादानत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000135.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000136", "originalText": "अत एव ‘एवमेवास्य परिद्रष्टुरिमाः षोडश कलाः पुरुषायणाः पुरुषं प्राप्यास्तं गच्छन्ति’ (प्र.उ. ६. ५) इति श्रुतौ कलाशब्दवाच्यानां प्राणमनःप्रभृतीनां विदुषो विदेहकैवल्यसमये विद्यानिवर्त्यविद्याकार्यांशाभिप्रायेण विद्ययोच्छेदो दर्शितः।", "padacchedaText": "", "audioFile": "PB_hear2read_000136.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000137", "originalText": "‘गताः कलाः पञ्चदश प्रतिष्ठाः’ ( मु.उ. ३. २. ७) इति श्रुत्यन्तरे तदनिवर्त्यमायापरिणाममहाभूतरूपोपष्ठम्भककार्यांशाभिप्रयेण तेषां स्वस्वप्रकृतिषु लयो दर्शित इति मायाऽविद्याभेदवादिनः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000137.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000138", "originalText": "यथा वियदादिप्रपञ्च ईश्वराश्रितमायापरिणाम इति तत्र ईश्वर उपादानम्, तथा अन्तःकरणादि जीवाश्रिताविद्यामात्रपरिणाम इति तत्र जीव एव उपादानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000138.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000139", "originalText": "न च अन्तःकरणादौ मायाकार्यमहाभूतानामप्यननुप्रवेशे उदाहृतश्रुतिद्वयव्यवस्थानुपपत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000139.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000140", "originalText": "कलानां विद्ययोच्छेदश्रुतिस्तत्त्वविद्दृष्टिविषया।", "padacchedaText": "", "audioFile": "PB_hear2read_000140.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000141", "originalText": "‘गताः कलाः’ इति श्रुतिस्तु तत्त्वविदि म्रियमाणे समीपवर्तिनः पुरुषाः नश्यद्धटवत्तदीयशरीरादीनामपि भूम्यादिषु लयं मन्यन्ते इति तटस्थपुरुषप्रतीतिविषया, इति व्यवस्थायाः कलाप्रलयाधिकरणभाष्ये स्पष्टत्वादिति मायाऽविद्याभेदवादिष्वेकदेशिनः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000141.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000142", "originalText": "तदभेदवादिष्वपि केचित्— यद्यपि वियदादिप्रपञ्चस्य ईश्वर उपादानम्, तथाप्यन्तःकरणादीनां जीवतादात्म्यप्रतितेः जीव एवोपादानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000142.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000143", "originalText": "अत एव अध्यासभाष्ये अन्तःकरणादीनां जीव एवाध्यासो दर्शितः, विवरणे च प्रतिकर्मव्यवस्थायां ब्रह्मचैतन्यस्योपादानतया घटादिसङ्गित्वं जीवचैतन्यस्य तदसङ्गित्वेऽप्यन्तःकरणादिसङ्गित्वं च वर्णितम्— इत्याहुः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000143.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000144", "originalText": "‘एतस्माज्जायते प्राणो मनस्सर्वेन्द्रियाणि च।", "padacchedaText": "", "audioFile": "PB_hear2read_000144.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000145", "originalText": "खं वायुर्ज्योतिरापः पृथिवी विश्वस्य धारिणी’ (मु.उ. २. १. ३) इत्यादिश्रुतेः कृत्स्नव्यावहारिकप्रपञ्चस्य ब्रह्मैव उपादानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000145.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000146", "originalText": "जीवस्तु प्रातिभासिकस्य स्वाप्नप्रपञ्चस्य।", "padacchedaText": "", "audioFile": "PB_hear2read_000146.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000147", "originalText": "’कृत्स्नप्रसक्तिर्निरवयवत्वशब्दकोपो वा’ (ब्र.सू. २. १. २६) इत्यधिकरणे— ब्रह्मणो जगदुपादानत्वे तस्य कार्त्स्न्येन जगदाकारेण परिणामे विकारातिरेकेण ब्रह्माभावो वा एकदेशेन परिणामे निरवयवत्वश्रुतिविरोधो वा प्रसज्यत इति पूर्वपक्षे ‘आत्मनि चैवं विचित्राश्च हि’ (ब्र.सू. २. १. २८) इति सूत्रेण विवर्तवादाभिप्रायेण स्वप्नदृशि जीवात्मनि स्वरूपानुपमर्देनानेकाकारस्वाप्नप्रपञ्चसृष्टिवत् ब्रह्मणि वियदादिसृष्टिरुपपद्यत इति—सिद्धान्तितत्वादिति अन्ये।", "padacchedaText": "", "audioFile": "PB_hear2read_000147.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000148", "originalText": "जीव एव स्वप्नद्रष्टृवत् स्वस्मिन्नीश्वरत्वादिसर्वकल्पकत्वेन सर्वकारणम् इत्यपि केचित्।", "padacchedaText": "", "audioFile": "PB_hear2read_000148.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000149", "originalText": "मायायाः जगत्कारणत्वविचारः\nअथ ‘मायां तु प्रकृतिं विद्यात्’ इति श्रुतेः, मायाजाड्यस्य घटादिष्वनुगमाच्च माया जगदुपादानं प्रतीयते।", "padacchedaText": "", "audioFile": "PB_hear2read_000149.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000150", "originalText": "कथं ब्रह्मोपादानम्?\nअत्राहुः पदार्थतत्त्वनिर्णयकाराः −ब्रह्म माया चेत्युभयमुपादानमित्युभयश्रुत्युपपत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000150.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000151", "originalText": "सत्ताजाड्यरूपोभयधर्मानुगत्युपपत्तिश्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000151.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000152", "originalText": "तत्र ब्रह्म विवर्तमानतया उपादानम्, अविद्या परिणममानतया।", "padacchedaText": "", "audioFile": "PB_hear2read_000152.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000153", "originalText": "न च विवर्ताधिष्ठाने पारिभाषिकमुपादानत्वम्। स्वात्मनि कार्यजनिहेतुत्वस्योपादानलक्षणस्य तत्राप्यविशेषादिति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000153.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000154", "originalText": "केचित् उक्तामेव प्रक्रियामाश्रित्य विवर्तपरिणामोपादानद्वयसाधारणमन्यल्लक्षणमाहुः− स्वाभिन्नकार्यजनकत्वमुपादानत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000154.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000155", "originalText": "अस्ति च प्रपञ्चस्य सद्रूपेण ब्रह्मणा विवर्तमानेन, जडेनाज्ञानेन परिणामिना च, अभेदः।", "padacchedaText": "", "audioFile": "PB_hear2read_000155.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000156", "originalText": "‘सन् घटः, जडो घटः’ इति सामानाधिकरण्यानुभवात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000156.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000157", "originalText": "न च ‘तदनन्यत्वमारम्भणशब्दादिभ्यः’ (ब्र.सू. २. १. १४) इति सूत्रे ‘अनन्यत्वं व्यतिरेकेणाभावः’ ‘न खल्वनन्यत्वमित्यभेदं ब्रूमः किं तु भेदं व्यासेधामः’ इति भाष्यभामतीनिबन्धनाभ्यां प्रपञ्चस्य ब्रह्माभेदनिषेधात् अभेदाभ्युपगमे अपसिद्धान्त इति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000157.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000158", "originalText": "तयोर्ब्रह्मरूपधर्मिसमानसत्ताकाभेदनिषेधे तात्पर्येण शुक्तिरजतयोरिव प्रातीतिकाभेदाभ्युपगमेऽपि विरोधाभावादिति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000158.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000159", "originalText": "सङ्क्षेपशारीरककृतस्तु— ब्रह्मैवोपादानम्, कूटस्थस्य स्वतः कारणत्वानुपपत्तेः माया ‘द्वारकारणम्, अकारणमपि द्वारं कार्येऽनुगच्छति, मृद इव तद्गतश्लक्ष्णत्वादेरपि घटे अनुगमदर्शनात्’, इत्याहुः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000159.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000160", "originalText": "वाचस्पतिमिश्रास्तु— जीवाश्रितमायाविषयीकृतं ब्रह्म स्वत एव जाड्याश्रयप्रपञ्चाकारेण विवर्तमानतया उपादानमिति माया सहकारिमात्रम्, न कार्यानुगतद्वारकारणम् इत्याहुः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000160.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000161", "originalText": "सिद्धान्तमुक्तावलीकृतस्तु— मायाशक्तिरेवोपादानम्, न ब्रह्म।", "padacchedaText": "", "audioFile": "PB_hear2read_000161.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000162", "originalText": "‘तदेतत् ब्रह्मापूर्वमनपरमबाह्यम्’ (बृ.उ. २. ५. १९) ‘न तस्य कार्यं करणं च विद्यते’ (श्वे.उ. ६. ८) इत्यादिश्रुतेः। जगुदुपादानमायाधिष्ठानत्वेन तु उपचारात् उपादानम्, तादृशमेवोपादानत्वं लक्षणे विवक्षितम् इत्याहुः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000162.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000163", "originalText": "जीवेश्वरयोः मतभेदेन स्वरूपनिरूपणम्\nअथ क ईश्वरः कश्च जीवः।", "padacchedaText": "", "audioFile": "PB_hear2read_000163.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000164", "originalText": "अत्रोक्तम् प्रकटार्थविवरणे − अनादिरनिर्वाच्या भूतप्रकृतिः चिन्मात्रसम्बन्धिनी माया। तस्यां चित्प्रतिबिम्ब ईश्वरः, तस्या एव परिच्छिन्नानन्तप्रदेशेषु आवरणविक्षेपशक्तिमत्सु अविद्याभिधानेषु चित्प्रतिबिम्बो जीव इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000164.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000165", "originalText": "तत्त्वविवेके तु— त्रिगुणात्मिकाया मूलप्रकृतेः ‘जीवेशावाभासेन करोति माया चाविद्या च स्वयमेव भवति’ (नृ.उ. ९. ३) इति श्रुतिसिद्धौ द्वौ रूपभेदौ।", "padacchedaText": "", "audioFile": "PB_hear2read_000165.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000166", "originalText": "रजस्तमोऽनभिभूतशुद्धसत्वप्रधाना माया, तदभिभूतमलिनसत्वप्रधाना अविद्या, इति मायाविद्याभेदं परिकल्प्य, मायाप्रतिबिम्ब ईश्वरः अविद्याप्रतिबिम्बो जीवः − इत्युक्तम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_000166.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000167", "originalText": "एकैव मूलप्रकृतिः विक्षेपप्राधान्येन मायाशब्दिता ईश्वरोपाधिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000167.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000168", "originalText": "आवरणप्राधान्येन अविद्याऽज्ञानशब्दिता जीवोपाधिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000168.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000169", "originalText": "अत एव तस्या जीवेश्वरसाधारणचिन्मात्रसम्बन्धित्वेऽपि जीवस्यैव ‘अज्ञोऽस्मि’इत्यज्ञानसम्बन्धानुभवः नेश्वरस्य— इति जीवेश्वरविभागः क्वचित् उपपादितः।", "padacchedaText": "", "audioFile": "PB_hear2read_000169.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000170", "originalText": "संक्षेपशारीरके तु— ‘कार्योपाधिरयं जीवः कारणोपाधिरीश्वरः’ इति श्रुतिमनुसृत्य अविद्यायां चित्प्रतिबिम्ब ईश्वरः।", "padacchedaText": "", "audioFile": "PB_hear2read_000170.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000171", "originalText": "अन्तःकरणे चित्प्रतिबिम्बो जीवः।", "padacchedaText": "", "audioFile": "PB_hear2read_000171.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000172", "originalText": "न च − अन्तःकरणरूपेण द्रव्येण घटेनाकाशस्येव चैतन्यस्यावच्छेदसम्भवात् तदवच्छिन्नमेव चैतन्यं जीवोऽस्तु − इति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000172.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000173", "originalText": "इह परत्र च जीवभावेनावच्छेद्यचैतन्यप्रदेशस्य भेदेन कृतहानाकृताभ्यागमप्रसङ्गात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000173.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000174", "originalText": "प्रतिबिम्बस्तु उपाधेर्गतागतयोरवच्छेद्यवत् न भिद्यत इति प्रतिबिम्बपक्षेनायं दोषः −इत्युक्तम्। एवमुक्तेष्वेतेषु जीवेश्वरयोः प्रतिबिम्बविशेषत्वपक्षेषु, यत् बिम्बस्थानीयं ब्रह्म तत् मुक्तप्राप्यं शुद्धचैतन्यम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_000174.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000175", "originalText": "चित्रदीपे— ‘जीव ईशो विशुद्धाचित्’ इति चित्त्रैविध्यप्रक्रियां विहाय यथा घटावच्छिन्नाकाशो घटाकाशः, तदाश्रिते जले प्रतिबिम्बितः साभ्रनक्षत्रो जलाकाशः, अनवच्छिन्नो महाकाशः, माहाकाशमध्यवर्तिनि मेघमण्डले वृष्टिलक्षणकार्यानुमेयेषु जलरूपतदवयवेषु तुषाराकारेषु प्रतिबिम्बतो मेघाकाशः, इति वस्तुत एकस्याप्याकाशस्य चातुर्विध्यम्, तथा स्थूलसूक्ष्मदेहद्वयस्य अधिष्ठानतया वर्तमानं तदवच्छिन्नं चैतन्यं कूटवन्निर्विकारत्वेन स्थितं कूटस्थम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000175.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000176", "originalText": "तत्र कल्पितेऽन्तःकरणे प्रतिबिम्बितं चैतन्यं संसारयोगी जीवः, अनवच्छिन्नं चैतन्यं ब्रह्म, तदाश्रिते मायातमसि स्थितासु सर्वप्राणिनां धीवासनासु प्रतिबिम्बितं चैतन्यम् ईश्वरः, इति चैतन्यस्य चातुर्विध्यं परिकल्प्य अन्तःकरणधीवासनोपरक्ताज्ञानोपाधिभेदेन जीवेश्वरविभागो दर्शितः।", "padacchedaText": "", "audioFile": "PB_hear2read_000176.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000177", "originalText": "अयं चापरस्तदभिहितो विशेषः− चतुर्विधेषु चैतन्येषु जीवः ‘अहम्’ इति प्रकाशमानः कूटस्थे अविद्यातिरोहिताङ्गानन्दरूपविशेषांशे शुक्तौ रूप्यवदध्यस्तः।", "padacchedaText": "", "audioFile": "PB_hear2read_000177.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000178", "originalText": "अत एव इदन्त्वरजतत्वयोरिव अधिष्ठानसामान्यांशाध्यस्तविशेषांशरूपयोः स्वयन्त्वाहन्त्वयोः सह प्रकाशः ‘स्वयमहं करोमि’ इत्यादौ।", "padacchedaText": "", "audioFile": "PB_hear2read_000178.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000179", "originalText": "अहन्त्वं हि अध्यस्तविशेषांशरूपम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000179.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000180", "originalText": "पुरुषान्तरस्य पुरुषान्तरे ‘अहम्’ इति व्यवहाराभावेन व्यावृत्तत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000180.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000181", "originalText": "स्वयन्त्वं च अन्यत्वप्रतियोग्यधिष्ठानसामान्यांशरूपम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000181.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000182", "originalText": "‘स्वयं देवदत्तो गच्छति’ इति पुरुषान्तरेऽपि व्यवहारेण अनुवृत्तत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000182.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000183", "originalText": "एवं परस्पराध्यासादेव कूटस्थजीवयोरविवेको लौकिकानाम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000183.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000184", "originalText": "विवेकस्तु तयोः बृहदारण्यके ‘प्रज्ञानघन एवैतेभ्यो भूतेभ्यः समुत्थाय तान्येवानुविनश्यति’ (बृ.उ. ४. ५. १३) इति जीवाभिप्रायेण उपाधिविनाशप्रतिपादनेन ‘अविनाशी वा अरेऽयमात्मा’ (बृ.उ. ४. ५. १४) इति कूटस्थाभिप्रायेणाविनाशप्रतिपादनेन च स्पष्टः।", "padacchedaText": "", "audioFile": "PB_hear2read_000184.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000185", "originalText": "अहमर्थजीवस्य विनाशित्वे कथमविनाशिब्रह्मभेदः।", "padacchedaText": "", "audioFile": "PB_hear2read_000185.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000186", "originalText": "नेदमभेदे सामानाधिकरण्यम्, किन्तु बाधायाम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000186.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000187", "originalText": "यथा ‘यः स्थाणुरेष पुमान्’ इति पुरुषत्वबोधेन स्थाणुत्वबुद्धिर्निवर्त्यते, एवं ‘अहं ब्रह्मास्मि’ इति कूटस्थब्रह्मस्वरूपत्वबोधेन अध्यस्ताहमर्थरूपत्वं निवर्त्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000187.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000188", "originalText": "‘योऽयं स्थाणुः पुमानेष पुंधिया स्थणुधीरिव। ब्रह्मास्मीति धियाऽशेषा ह्यहंबुद्धिर्निवर्तते॥", "padacchedaText": "", "audioFile": "PB_hear2read_000188.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000189", "originalText": "’ (नै.सि. २. २९) इति नैष्कर्म्यसिद्धिवचनात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000189.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000190", "originalText": "यदि च विवरणाद्युक्तरीत्या इदमभेदे सामानाधिकरण्यम्, तदा जीववाचिनोऽहंशब्दस्य लक्षणया कूटस्थपरत्वम् अस्तु।", "padacchedaText": "", "audioFile": "PB_hear2read_000190.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000191", "originalText": "तस्यानध्यस्तस्य ब्रह्माभेदयोग्यत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000191.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000192", "originalText": "यस्तु मेघाकाशतुल्यो धीवासनाप्रतिबिम्ब ईश्वर उक्तः सोऽयं ‘सुषुप्तस्थान एकीभूतः प्रज्ञानघन एवानन्दमयो ह्यानन्दभुक्’ (मा.उ. १. ५) इति माण्डूक्यश्रुतिसिद्धसौषुप्तानन्दमयः।", "padacchedaText": "", "audioFile": "PB_hear2read_000192.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000193", "originalText": "तत्रैव तदनन्तरम् ‘एष सर्वेश्वर एष सर्वज्ञ एषोऽन्तर्याम्येष योनिः सर्वस्य प्रभवाप्ययौ हि भूतानाम्’ (मा.उ. १. ६) इति श्रुतेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000193.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000194", "originalText": "सर्ववस्तुविषयकसकलप्राणिधीवासनोपाधिकस्य तस्य सर्वज्ञत्वस्य तत एव सर्वकर्तृत्वादेरपि उपपत्तेश्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000194.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000195", "originalText": "न चास्मद्बुद्धिवासनोपहितस्य कस्यचित् सार्वज्ञ्यं नानुभूयत इति वाच्यम्। वासनानां परोक्षत्वेन तदुपहितस्यापि परोक्षत्वात् इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000195.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000196", "originalText": "ब्रह्मानन्दे तु— सुषुप्तिसंयोगात् माण्डूक्योक्त आनान्दमयो जीव इत्युक्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000196.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000197", "originalText": "यदा हि जाग्रदादिषु भोगप्रदस्य कर्मणः क्षये निद्रारूपेण विलीनमन्तःकरणं पुनर्भोगप्रदकर्मवशात् प्रबोधे घनीभवति, तदा तदुपाधिको जीवः विज्ञानमय इत्युच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000197.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000198", "originalText": "स एव पूर्वं सुषुप्तिसमये विलीनावस्थोपाधिकः सन् अनन्दमय इत्युच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000198.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000199", "originalText": "स एव माण्डूक्ये ‘सुषुप्तस्थानः’ इत्यादिना दर्शित इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000199.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000200", "originalText": "एवं सति तस्य सर्वेश्वरत्वादिवचनं कथं सङ्गच्छताम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000200.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000201", "originalText": "इत्थं— सन्त्यधिदैवतमध्यात्मं च परमात्मनः सविशेषाणि त्रीणि त्रीणिरूपाणि।", "padacchedaText": "", "audioFile": "PB_hear2read_000201.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000202", "originalText": "तत्र अधिदैवतं त्रीणि शुद्धं चैतन्यं च इति चत्वारि रूपाणि चित्रपटदृष्टान्तेन चित्रदीपे समर्थितानि।", "padacchedaText": "", "audioFile": "PB_hear2read_000202.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000203", "originalText": "यथा— स्वतश्शुभ्रः पटो धौतः, अन्नविलिप्तो घट्टितः, मष्याकारयुक्तो लाञ्छितः, वर्णपूरितो रञ्जितः, इत्यवस्थाचतुष्टयम् एकस्यैव चित्रपटस्य, तथा परमात्मा मायातत्कार्योपाधिरहितः शुद्धः मायोपहित ईश्वरः, अपञ्चीकृतभूतकार्यसमष्टिसूक्ष्मशरीरोपहितो हिरण्यगर्भः, पञ्चीकृतभूतकार्यसमष्टिस्थूलशरीरोपहितो विराट्पुरुषः, इत्यवस्थाचतुष्टयम् एकस्यैव परमात्मनः।", "padacchedaText": "", "audioFile": "PB_hear2read_000203.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000204", "originalText": "अस्मिन् चित्रपटस्थानीये परमात्मनि चित्रस्थनीयः स्थावरजङ्गमात्मको निखिलप्रपञ्चः।", "padacchedaText": "", "audioFile": "PB_hear2read_000204.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000205", "originalText": "यथा चित्रगतमनुष्याणां चित्राधारवस्त्रसदृशा वस्त्राभासा लिख्यन्ते, तथा परमात्माध्यस्तदेहिनाम् अधिष्ठानचैतन्यसदृशाश्चिदाभासाः कल्प्यन्ते, ते च जीवनामानः संसरन्ति − इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000205.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000206", "originalText": "अध्यात्मं तु विश्वतैजसप्राज्ञभेदेन त्रिणि रूपाणि।", "padacchedaText": "", "audioFile": "PB_hear2read_000206.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000207", "originalText": "तत्र सुषुप्तौ विलीनेऽन्तःकारणे अज्ञानमात्रसाक्षी प्राज्ञः, योऽयमिहानन्दमय उक्तः।", "padacchedaText": "", "audioFile": "PB_hear2read_000207.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000208", "originalText": "स्वप्ने व्यष्टिसूक्ष्मशरीराभिमानी तैजसः।", "padacchedaText": "", "audioFile": "PB_hear2read_000208.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000209", "originalText": "जागरे व्यष्टिस्थूलशरीराभिमानी विश्वः।", "padacchedaText": "", "audioFile": "PB_hear2read_000209.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000210", "originalText": "तत्र माण्डूक्यश्रुतिः अहमनुभावे प्रकाशमानस्यात्मनो विश्वतैजसप्राज्ञतुर्यावस्थाभेदरूपं पादचतुष्टयं ‘सोऽयमात्माचतुष्पात्’ (मा.उ. १. २) इत्युपक्षिप्य पूर्वपूर्वपादप्रविलापनेन निष्प्रपञ्चब्रह्मात्मकतुर्यपादप्रतिपत्तिसौकर्याय स्थूलसूक्ष्मतरोपाधिसाम्यात् विराडादीन् विश्वादिष्वन्तर्भाव्य ‘जागरितस्थानो बहिः प्रज्ञः’ (मा.उ. १. ३) इत्यादिना विश्वादिपादान्न्यरूपयत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000210.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000211", "originalText": "अतः प्राज्ञशब्दिते आनन्दमये आव्याकृतस्येश्वरस्यान्तर्भावं विवक्षित्वा तस्य सर्वेश्वरत्वादितद्धर्मवचनमिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000211.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000212", "originalText": "इत्थमेव भगवत्पादैर्गौडपादीयविवरणे व्याख्यातम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000212.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000213", "originalText": "दृग्दृश्यविवेके तु— चित्रदीपव्युत्पादितं कूटस्थं जीवकोटावन्तर्भाव्य चित्त्रैविध्यप्रक्रियैवावलम्बिता इति विशेषः।", "padacchedaText": "", "audioFile": "PB_hear2read_000213.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000214", "originalText": "तत्र ह्युक्तम्— जलाशयतरङ्गबुद्बुदन्यायेन उपर्युपरिकल्पनात् जीवः त्रिविधः— पारमार्थिको व्यावहारिकः प्रातिभासिकश्चेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000214.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000215", "originalText": "तत्र अविच्छिन्नः पारमार्थिको जीवः।", "padacchedaText": "", "audioFile": "PB_hear2read_000215.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000216", "originalText": "तस्मिन्नवच्छेदकस्य कल्पितत्वेऽपि अवच्छेद्यस्य तस्य अकल्पितत्वेन ब्रह्मणोऽभिन्नत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000216.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000217", "originalText": "तमावृत्यस्थितायां मायायां कल्पितेऽन्तःकरणे चिदाभासः अन्तःकरणतादात्म्यापत्त्या ‘अहं’ इत्यभिमन्यमानो व्यावहारिकः।", "padacchedaText": "", "audioFile": "PB_hear2read_000217.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000218", "originalText": "तस्य मायिकत्वेऽपि यावद्व्यवहारमनुवृत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000218.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000219", "originalText": "स्वप्ने तमप्यावृत्त्य स्थितया मायावस्थाभेदरूपया निद्रया कल्पिते स्वप्नदेहादौ अहमभिमानी प्रातिभासिकः।", "padacchedaText": "", "audioFile": "PB_hear2read_000219.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000220", "originalText": "स्वप्नप्रपञ्चेन सह तद्द्रष्टुर्जीवस्यापि प्रबोधे निवृत्तेः इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000220.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000221", "originalText": "एवम् एते प्रतिबिम्बेश्वरवादिनां पक्षभेदाः दर्शिताः।", "padacchedaText": "", "audioFile": "PB_hear2read_000221.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000222", "originalText": "विवरणानुसारिणस्तु आहुः— ’विभेदजनकेऽज्ञाने नाशमात्यन्तिकं गते’ (वि.पु. ६. ७. ९६) इति स्मृत्या एकस्यैवाज्ञानस्य जीवेश्वरविभागोपाधित्वप्रतिपादनात् बिम्बप्रतिबिम्बभावेन जीवेश्वरयोर्विभागः, न उभयोरपि प्रतिबिम्बभावेन।", "padacchedaText": "", "audioFile": "PB_hear2read_000222.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000223", "originalText": "उपाधिद्वयमन्तरेण उभयोः प्रतिबिम्बत्वायोगात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000223.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000224", "originalText": "तत्रापि प्रतिबिम्बो जीवः बिम्बस्थनीय ईश्वरः।", "padacchedaText": "", "audioFile": "PB_hear2read_000224.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000225", "originalText": "तथा सत्येव लौकिकबिम्बप्रतिबम्बदृष्टान्तेन स्वातन्त्र्यमीश्वरस्य तत्पारतन्त्र्यं च जीवस्य युज्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000225.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000226", "originalText": "‘प्रतिबिम्बगताः पश्यन् ऋजुवक्रादिविक्रियाः। पुमान् क्रीडेद्यथा ब्रह्म तथा जीवस्थविक्रियाः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000226.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000227", "originalText": "’\nइति कल्पतरूक्तरीत्या ‘लोकवत्तु लीलाकैवल्यम्’ (ब्र.सू. २. १. ३३) इति सूत्रमपि सङ्गच्छते।", "padacchedaText": "", "audioFile": "PB_hear2read_000227.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000228", "originalText": "अज्ञानप्रतिबिम्बितस्य जीवस्य अन्तःकरणरूपोऽज्ञानपरिणामभेदः विशेषाभिव्यक्तिस्थानं सर्वतः प्रसृतस्य सवितृप्रकाशस्य दर्पण इव।", "padacchedaText": "", "audioFile": "PB_hear2read_000228.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000229", "originalText": "अतः तस्य तदुपाधिकत्वव्यवहारोऽपि।", "padacchedaText": "", "audioFile": "PB_hear2read_000229.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000230", "originalText": "न एतावता अज्ञानोपाधिपरित्यागः।", "padacchedaText": "", "audioFile": "PB_hear2read_000230.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000231", "originalText": "अन्तःकरणोपाधिपरिच्छिन्नस्यैव चैतन्यस्य जीवत्वे योगिनः कायव्यूहाधिष्ठानानुपपत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000231.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000232", "originalText": "न च— योगप्रभावात् योगिनोऽन्तःकरणं कायव्यूहाभिव्यक्तियोग्यं वैपुल्यं प्राप्नोतीति तदवच्छिन्नस्य कायव्यूहाधिष्ठानं युज्यते—इति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000232.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000233", "originalText": "‘प्रदीपवदावेशस्तथा हि दर्शयति’ (ब्र.सू. ४. ४. १५) इति शास्त्रोपान्त्यधिकरणभाष्यादिषु कायव्यूहे प्रतिदेहमन्तःकरणस्य चक्षुरादिवत् भिन्नस्यैव योगप्रभावात् सृष्टेरुपवर्णनात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000233.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000234", "originalText": "प्रतिबिम्बे बिम्बात् भेदमात्रस्य अध्यस्तत्वेन स्वरूपेण तस्य सत्यत्वात् न प्रतिबिम्बरूपजीवस्य मुक्त्यन्वयासम्भवः इति न तदतिरेकेण मुक्त्यन्वयाय अवच्छिन्नरूपजीवान्तरं वा (प्रतिबिम्बजीवातिरिक्तं) जिवेश्वरविलक्षणं कृटस्थशब्दितं चैतन्यान्तरं वा कल्पनीयम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000234.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000235", "originalText": "‘अविनाशी वा अरेऽयमात्मा’ इति श्रवणं जीवस्य तदुपाधिनिवृत्तौ प्रतिबिम्बभावापगमेऽपि स्वरूपं न विनश्यतीत्येतत्परम्, न तदतिरिक्तकूटस्थनामकचैतन्यान्तरपरम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000235.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000236", "originalText": "जीवोपाधिना अन्तःकरणादिना अवच्छिन्नं चैतन्यं बिम्बभूत ईश्वर एव।", "padacchedaText": "", "audioFile": "PB_hear2read_000236.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000237", "originalText": "‘यो विज्ञाने तिष्ठन्’ (बृ.उ. ३. ७. २२) इत्यादिश्रुत्या ईश्वरस्यैव जीवसन्निधानेन तदन्तर्यामिभावेन विकारान्तरवस्थानश्रवणात् इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000237.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000238", "originalText": "अन्ये तु— रूपानुपहितप्रतिबिम्बो न युक्तः, सुतरां नीरूपे।", "padacchedaText": "", "audioFile": "PB_hear2read_000238.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000239", "originalText": "गगनप्रतिबिम्बोदाहरणमप्ययुक्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000239.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000240", "originalText": "गगनाभोगव्यापिनि सवितृकिरणमण्डले सलिलप्रतिबिम्बिते गगनप्रतिबिम्बत्वव्यवहारस्य भ्रममात्रमूलकत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000240.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000241", "originalText": "ध्वनौ वर्णप्रतिबिम्बवादोऽप्ययुक्तः।", "padacchedaText": "", "audioFile": "PB_hear2read_000241.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000242", "originalText": "व्यञ्जकतयासन्निधानमात्रेण ध्वनिधर्मणामुदात्तादिस्वराणां वर्णेष्वारोपोपपत्तेः ध्वनेर्वर्णप्रतिबिम्बग्राहित्वकल्पनाया निष्प्रमाणकत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000242.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000243", "originalText": "प्रतिध्वनिरपि न पूर्वशब्दप्रतिबिम्बः।", "padacchedaText": "", "audioFile": "PB_hear2read_000243.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000244", "originalText": "पञ्चीकरणप्रक्रियया पटहपयोनिधिप्रभृतिशब्दानां क्षितिसलिलादिशब्दत्वेन प्रतिध्वनेरेवाकाशशब्दत्वेन तस्य अन्यशब्दप्रतिबिम्बत्वायोगात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000244.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000245", "originalText": "वर्णरूपप्रतिशब्दोऽपि न पूर्ववर्णप्रतिबिम्बः।", "padacchedaText": "", "audioFile": "PB_hear2read_000245.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000246", "originalText": "वर्णाभिव्यञ्जकध्वनिनिमित्तकप्रतिध्वनेः मूलध्वनिवदेव वर्णाभिव्यञ्जकत्वेनोपपत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000246.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000247", "originalText": "तस्मात् घटाकाशवत् अन्तःकरणावच्छिन्नं चैतन्यं जीवः, तदनवच्छिन्नम् ईश्वरः।", "padacchedaText": "", "audioFile": "PB_hear2read_000247.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000248", "originalText": "न चैवम्— अण्डान्तर्वर्तिनश्चैतन्यस्य तत्तदन्तःकरणोपाधिभिः सर्वात्मना जीवभावेनावच्छेदात् तदवच्छेदरहितचैतन्यरूपस्य ईश्वरस्य अण्डात् बहिरेव सत्त्वं स्यात् इति ‘यो विज्ञाने तिष्ठन्’ इत्यादौ अन्तर्यामिभावेन विकारान्तरवस्थानश्रवणं विरुध्येत।", "padacchedaText": "", "audioFile": "PB_hear2read_000248.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000249", "originalText": "प्रतिबिम्बपक्षे तु जलगतस्वाभाविकाकाशे सत्येव प्रतिबिम्बाकाशदर्शनात् एकत्र द्विगुणीकृत्य वृत्तिरुपपद्यते— इति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000249.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000250", "originalText": "यतः प्रतिबिम्बपक्षेऽपि उपाधौ अनन्तर्गतस्यैव चैतन्यस्य तत्र प्रतिबिम्बो वाच्यः, न तु जलचन्द्रन्यायेन कृत्स्नप्रतिबिम्बः।", "padacchedaText": "", "audioFile": "PB_hear2read_000250.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000251", "originalText": "तदन्तर्गतभागस्य तत्र प्रतिबिम्बासम्भवात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000251.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000252", "originalText": "न हि मेघावच्छिन्नस्य आकाशस्यालोकस्य वा जले प्रतिबिम्बवत् जलान्तर्गतस्यापि तत्र प्रतिबिम्बो दृश्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000252.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000253", "originalText": "न वा मुखादीनां बहिःस्थितिसमय इव जलान्तर्निमज्जनेऽपि प्रतिबिम्बोऽस्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000253.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000254", "originalText": "अतो जलप्रतिबिम्बं प्रतिमेघाकाशादेरिव अन्तःकरणाद्युपाधिप्रतिबिम्बं प्रति तदनन्तर्गतस्यैव बिम्बत्वं स्यात् इति बिम्बभूतस्य विकारान्तरवस्थानायोगात् ईश्वरे अन्तर्यामिब्रह्मणसामञ्जस्याभावस्तुल्यः।", "padacchedaText": "", "audioFile": "PB_hear2read_000254.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000255", "originalText": "एतेन— अवच्छिन्नस्य जीवत्वे कर्तृभोक्तृसमययोः तत्रतत्रान्तःकरणावच्छेद्यचैतन्यप्रदेशस्य भिन्नत्वात् कृतहानाकृताभ्यागमप्रसङ्ग इति— निरस्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000255.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000256", "originalText": "प्रतिबिम्बपक्षेऽपि स्वानन्तर्गतस्य स्वसन्निहितस्य चैतन्यप्रदेशस्य अन्तःकरणे प्रतिबिम्बस्य वक्तव्यतया तत्र तत्र अन्तःकरणस्य गमने बिम्बभेदात् तत्प्रतिबिम्बस्यापि भेदावश्यम्भावेन दोषतौल्यात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000256.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000257", "originalText": "न च अन्तःकरणप्रतिबिम्बो जीव इति पक्षे दोषतौल्येऽपि ‘अविद्याप्रतिबिम्बो जीवः, तस्य च तत्र तत्र गत्वरमन्तःकरणं जलाशयव्यापिनो महामेघमण्डलप्रतिबिम्बस्य तदुपरि विसृत्वरस्फीतालोक इव तत्र तत्र विशेषाभिव्यक्तिहेतुः’ इति पक्षे नायं दोषः, अन्तःकरणवत् अविद्यायाः गत्यभावेन प्रतिबिम्बभेदानापत्तेः इति— वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000257.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000258", "originalText": "तथैव अवच्छेदपक्षेऽप्यविद्यावच्छिन्नो जीव इति उपगमसम्भवात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000258.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000259", "originalText": "तत्राप्येकस्य जीवस्य क्कचित् प्रदेशे कर्तृत्वं प्रदेशान्तरे भोक्तृत्वम् इत्येवं कृतहानादिदोषापनुत्तये वस्तुतो जीवैक्यस्य आदरणीयत्वेन तन्न्यायात् अन्तःकरणोपाधिपक्षेऽपि वस्तुतश्चैतन्यैक्यस्य तदवच्छेदकोपाध्यैक्यस्य च तन्त्रत्वाभ्युपगमेन तद्दोषनिराकरणसम्भवाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000259.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000260", "originalText": "न च अवच्छेदपक्षे ‘यथा ह्ययं ज्योतिरात्मा विवस्वानपो भिन्ना बहुधैकोऽनुगच्छन्।", "padacchedaText": "", "audioFile": "PB_hear2read_000260.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000261", "originalText": "उपाधिना क्रियते भेदरूपो देवः क्षेत्रेष्वेवमजोऽयमात्मा’ ‘अत एव चोपमा सूर्यकादिवत्’ (ब्र.सू. ३. २. १८) इति श्रुतिसूत्राभ्यां विरोधः।", "padacchedaText": "", "audioFile": "PB_hear2read_000261.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000262", "originalText": "’अम्बुवदग्रहणात्तु न तथात्वम्’ (ब्र.सू. ३. २. १९) इति उदाहृतसूत्रानन्तरसूत्रेण यथा सूर्यस्य रूपवतः प्रतिबिम्बोदययोग्यं ततो विप्रकृष्टदेशं रूपवज्जलं गृह्यते, नैवं सर्वगतस्यात्मनः प्रतिबिम्बोदययोग्यं किञ्चिदस्ति ततो विप्रकृष्टम् इति प्रतिबिम्बासम्भवमुक्त्वा ‘वृद्धिह्रासभाक्त्वमन्तर्भावादुभयसामञ्जस्यादेवम्’ (ब्र.सू. ३. २. २०) इति तदनन्तरसूत्रेण ‘यथा जलप्रतिबिम्बितसूर्यो जलवृद्धौ वर्धत इव जलह्रासे ह्रसतीव जलचलने चलतीव इति तस्याध्यासिकं जलानुरोधिवृद्धिह्रासादिभाक्त्वम्, तथा आत्मनोऽन्तःकरणादिनाऽवच्छेदेन उपाध्यन्तर्भावात् आध्यासिकं तदनुरोधिवृद्धिह्रासादिभाक्त्वम् इत्येवं दृष्टान्तदार्ष्टान्तिकयोः सामञ्जस्यात् अविरोधः’ इति स्वयं सूत्रकृतैव अवच्छेदपक्षे तयोः तात्पर्यकथनात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000262.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000263", "originalText": "‘घटसंवृतमाकाशं नीयमाने घटे यथा। घटो नीयेत नाकाशं तद्वज्जीवो नभोपमः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000263.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000264", "originalText": "’ ’अंशो नानाव्यपदेशात्……..’ (ब्र.सू. २. ३. ४३) इति श्रुतिसूत्राभ्याम् अवच्छेदपक्षस्यैव परिग्रहाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000264.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000265", "originalText": "तस्मात् सर्वगतस्य चैतन्यस्य अन्तःकरणादिनाऽवच्छेदोऽवश्यम्भावी इति आवश्यकत्वात् अविच्छिन्नो जीवः— इति पक्षं रोचयन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000265.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000266", "originalText": "अपरे तु— न प्रतिबिम्बः नाप्यवच्छिन्नो जीवः।", "padacchedaText": "", "audioFile": "PB_hear2read_000266.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000267", "originalText": "किं तु कौन्तेयस्यैव राधेयत्ववत् अविकृतस्यैव ब्रह्मणः अविद्यया जीवभावः।", "padacchedaText": "", "audioFile": "PB_hear2read_000267.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000268", "originalText": "व्याधकुलसंवर्धितराजकुमारदृष्टान्तेन ‘ब्रह्मैव स्वाविद्यया संसरति, स्वविद्यया मृच्यते’ इति बृहदारण्यकभाष्ये प्रतिपादनात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000268.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000269", "originalText": "’राजसूनोः स्मृतिप्राप्तौ व्याधभावो निवर्तते।", "padacchedaText": "", "audioFile": "PB_hear2read_000269.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000270", "originalText": "यथैवमात्मनोऽज्ञस्य तत्त्वमस्यादिवाक्यतः।", "padacchedaText": "", "audioFile": "PB_hear2read_000270.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000271", "originalText": "’ (सं.वा. २३३— २३४) इति वार्तिकोक्तेश्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000271.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000272", "originalText": "एवं च स्वाविद्यया जीवभावमापन्नस्यैव ब्रह्मणः सर्वप्रपञ्चकल्पकत्वात् ईश्वरोऽपि सह सर्वज्ञत्वादिधर्मैः स्वप्नोपलब्धदेवतादिवत् जीवकल्पितः इत्याचक्षते।", "padacchedaText": "", "audioFile": "PB_hear2read_000272.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000273", "originalText": "जीवैकत्वनानात्वविचारः\nआथायं जीव एकः, उतानेकः।", "padacchedaText": "", "audioFile": "PB_hear2read_000273.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000274", "originalText": "अनुपदोक्तपक्षावलम्बिनः केचिदाहुः— एको जीवः।", "padacchedaText": "", "audioFile": "PB_hear2read_000274.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000275", "originalText": "तेन चैकमेव शरीरं सजीवम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000275.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000276", "originalText": "अन्यानि स्वप्नदृष्टशरीराणीव निर्जीवानि।", "padacchedaText": "", "audioFile": "PB_hear2read_000276.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000277", "originalText": "तदज्ञानकल्पितं सर्वं जगत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000277.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000278", "originalText": "तस्य स्वप्नदर्शनवद्यावदविद्यं सर्वो व्यवहारः।", "padacchedaText": "", "audioFile": "PB_hear2read_000278.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000279", "originalText": "बद्धमुक्तव्यवस्थापि नास्ति जीवस्यैकत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000279.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000280", "originalText": "शुकमुक्त्यादिकमपि स्वाप्नपुरुषान्तरमुक्त्यादिकमिव कल्पितम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000280.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000281", "originalText": "अत्र च सम्भावितसकलशङ्कापङ्कप्रक्षालनं स्वप्नदृष्टान्तसलिलधारयैव कर्तव्यम् − इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000281.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000282", "originalText": "अन्ये तु— अस्मिन्नेकशरीरैकजीववादे मनःप्रत्ययमलभमानाः ‘अधिकं तु भेदनिर्देशात्’ (ब्र.सू. २. १. २२) ‘लोकवत्तु लीलाकैवल्यम्’ (ब्र.सू. २. १. ३३) इत्यादिसूत्रैः ‘जीवाधिक ईश्वर एव जगतः स्रष्टा, न जीवः, तस्य आप्तकामत्वेन प्रयोजनाभावेऽपि केवलं लीलाजगतः सृष्टिः’ इत्यादि प्रतिपादयद्भिः विरोधं च मन्यमानाः— हिरण्यगर्भ एको ब्रह्मप्रतिबिम्बो मुख्यो जीवः, अन्ये तु तत्प्रतिबिम्बभूताः चित्रपटलिखितमनुष्यदेहार्पितपटाभासकल्पाः जीवाभासाः संसारादिभाजः— इति सविशोषानेकशरीरैकजीववादमातिष्ठन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000282.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000283", "originalText": "अपरे तु— हिरण्यगर्भस्य प्रतिकल्पं भेदेन कस्य हिरण्यगर्भस्य मुख्यजीवत्वमित्यत्र नियामकं नास्तीतिमन्यमानाः − एक एव जीवोऽविशेषेण सर्वं शरीरमधितिष्ठति।", "padacchedaText": "", "audioFile": "PB_hear2read_000283.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000284", "originalText": "नचैवं शरीरावयवभेद इव शरीरभेदेऽपि परस्परसुखाद्यनुसन्धानप्रसङ्गः।", "padacchedaText": "", "audioFile": "PB_hear2read_000284.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000285", "originalText": "जन्मान्तरीयसुखाद्यनुसन्धानादर्शनेन शरीरभेदस्य तदननुसन्धानप्रयोजकत्वक्लृप्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000285.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000286", "originalText": "योगिनस्तु कायव्यूहसुखाद्यनुसन्धानं व्यवहितार्थग्रहणवत् योगप्रभावनिबन्धनमिति न तत् उदाहरणम् − इति अविशेषानेकशरीरैकजीववादं रोचयन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000286.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000287", "originalText": "इतरे तु अत्रापि बन्धमुक्तिव्यवस्थाभावस्य तुल्यत्वेन ‘तद्यो यो देवानां प्रत्यबुध्यत स एव तदभवत्’ (बृ.उ. १. ४. १०) इत्यादिश्रुतेः ‘प्रतिषेधादिति चेन्न शारीरात्’ (ब्र.सू. ४. २. १२) इत्यधिकरणे शुकमुक्तत्वप्रतिपादकभाष्यस्य चानाञ्जस्यमित्यपरितुष्यन्तः अन्तःकरणादीनां जीवोपाधित्वाभ्युपगमेन अनेकजीववादमाश्रित्य बन्धमुक्तिव्यवस्थां प्रतिपद्यन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000287.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000288", "originalText": "तेषु केचिदेवमाहुः— यद्यपि शुद्धब्रह्माश्रयविषयमेकमेवाज्ञानम्, तन्नाश एव च मोक्षः तथापि जीवन्मुक्तावज्ञानलेशानुवृत्त्यभ्युपगमेन अज्ञानस्य सांशत्वात् तदेव क्वचिदुपाधौ ब्रह्मावगमोत्पत्तौ अंशेन निवर्तते, उपाध्यन्तरेषु यथापूर्वमंशान्तरैरनुवर्तते − इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000288.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000289", "originalText": "अन्ये तु— यथा न्यायैकदेशिमते भूतले घटात्यन्ताभावस्य वृत्तौ घटसंयोगाभावो नियामक इत्यनेकेषु प्रदेशेषु तद्वत्सु संसृज्य वर्तमानघटात्यन्ताभावः क्वचित्प्रदेशे घटसंयोगोत्पत्त्या तदभावनिवृत्तौ न संसृज्यते, एवमज्ञानस्य चैतन्ये वृत्तौ मनोनियामकमिति तदुपाधिना तत्प्रदेशेषु संसृज्य वर्तमानमज्ञानं क्वचिद्ब्रह्मदर्शनोत्पत्त्या ‘भिद्यते हृदयग्रन्थिः’ इति श्रुत्युक्तरीत्या मनसो निवृत्तौ न संसृज्यते, अन्यत्र यथापूर्वमवतिष्ठते।", "padacchedaText": "", "audioFile": "PB_hear2read_000289.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000290", "originalText": "अज्ञानसंसर्गासंसर्गादेव च बन्धमोक्षौ— इत्याहुः।", "padacchedaText": "", "audioFile": "PB_hear2read_000290.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000291", "originalText": "अपरे तु— नाज्ञानं शुद्धचैतन्याश्रयम्, किं तु जीवाश्रयं ब्रह्मविषयम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000291.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000292", "originalText": "अतश्च अन्तःकरणप्रतिबिम्बरूपेषु सर्वेषु जीवेषु व्यक्तिषु जातिवत् प्रत्येकपर्यवसिततया वर्तमानम् उत्पन्नविद्यं कञ्चिज्जहाति नष्टां व्यक्तिमिव जातिः स एव मोक्षः।", "padacchedaText": "", "audioFile": "PB_hear2read_000292.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000293", "originalText": "अन्यं यथापूर्वमाश्रयति, इति व्यवस्था इत्याहुः।", "padacchedaText": "", "audioFile": "PB_hear2read_000293.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000294", "originalText": "इतरे तु प्रतिजीवमविद्याभेदमभ्युपगम्यैव तदनुवृत्तिनिवृत्तिभ्यां बन्धमुक्तिव्यवस्थां समर्थयन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000294.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000295", "originalText": "नानाविद्यावादे प्रपञ्चैकत्वनानात्वविचारः\nअस्मिन पक्षे कस्याविद्यया प्रपञ्चः कृतोऽस्त्विति चेत् −\nविनिगमकाभावात् सर्वाविद्याकृतोऽनेकतन्त्वारब्धपटतुल्यः, एकस्य मुक्तौ तदविद्यानाशे एकतन्तुनाशे पटस्येव तत्साधारणप्रपञ्चस्य नाशः, तदैव विद्यमातन्त्वन्तरैः पटान्तरस्येव इतराविद्याभिः सकलेतरसाधारणप्रपञ्जान्तरस्योत्पादनम् इत्येके।", "padacchedaText": "", "audioFile": "PB_hear2read_000295.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000296", "originalText": "तत्तदज्ञानकृतप्रातिभासिकरजतवत् न्यायमते तत्तदपेक्षाबुद्धिजन्यद्वित्त्ववच्च तत्तदविद्याकृतो वियदादिप्रपञ्च प्रतिपुरुषं भिन्नः।", "padacchedaText": "", "audioFile": "PB_hear2read_000296.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000297", "originalText": "शुक्तिरजते ‘त्वया यद्दृष्टं रजतं तदेव मयापि’ इतिवत् ऐक्यभ्रममात्रम् − इत्यन्ये।", "padacchedaText": "", "audioFile": "PB_hear2read_000297.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000298", "originalText": "जिवाश्रिताविद्यानिवहाद्भिन्ना मायैव ईश्वराश्रिता प्रपञ्चकारणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000298.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000299", "originalText": "जीवानामविद्यास्तु आवरणमात्रे प्रातिभासिकशुक्तिरजतादिविक्षेपेऽपि वा उपयुज्यन्ते − इत्यपरे।", "padacchedaText": "", "audioFile": "PB_hear2read_000299.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000300", "originalText": "ब्रह्मणः कर्तृत्ववादः\nअवसितम् उपादानत्वम्, तत्प्रसक्तानुप्रसक्तं च।", "padacchedaText": "", "audioFile": "PB_hear2read_000300.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000301", "originalText": "अथ किदृशं कत्वर्तृम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000301.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000302", "originalText": "केचिदाहुः— ‘तदैक्षत’ (छा.उ. ६. २. ३) ‘सोऽकामयत’ (तै.उ. २. ६. ४) ‘तदात्मानं स्वयमकुरुत’ (तै.उ. २. ७. १) इति श्रवणात् न्यायमत इव कार्यानुकूलज्ञानचिकीर्षाकृतिमत्त्वरूपमिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000302.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000303", "originalText": "0\nअन्ये तु— चिकीर्षाकृति
