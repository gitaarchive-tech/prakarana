कर्तृत्वनिर्वाहाय चिकीर्षाकृत्यन्तरापेक्षायाम् अनवस्थाप्रसङ्गात् कार्यानुकूलज्ञानवत्त्वमेव ब्रह्मणः कर्तृत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000303.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000304", "originalText": "न च ज्ञानेऽप्येष प्रसङ्गः।", "padacchedaText": "", "audioFile": "PB_hear2read_000304.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000305", "originalText": "तस्य ब्रह्मस्वरूपत्वेनाकार्यत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000305.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000306", "originalText": "एवं च − विवरणे जीवस्य सुखादिकर्तृत्वोक्तिः, वीक्षणमात्रसाध्यत्वात् वियदादि वीक्षितं हिरण्यगर्भद्वारा साध्यं वीक्षणाधिकयत्नसाध्यत्वात् भौतिकं स्मितम् इति कल्पतरूक्तिश्च सङ्गच्छते− इति वदन्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000306.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000307", "originalText": "अपरे तु कार्यानुकूलस्रष्टव्यालोचनरूपज्ञानवत्त्वं कर्तृत्वम्, न कार्यानुकूलज्ञानवत्त्वमात्रम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000307.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000308", "originalText": "शुक्तिरजतस्वाप्नभ्रमादिषु अध्यासानुकूलाधिष्ठानज्ञानवत्त्वेन जीवस्य कर्तृत्वप्रसङ्गात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000308.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000309", "originalText": "न च इष्टापत्तिः— ‘अथ रथान् रथयोगान् पथः सृजते...स हि कर्ता’ (बृ.उ. ४. ३. १०) इत्यादिश्रुत्यैव जीवस्य स्वप्नप्रपञ्चकर्तृत्वोक्तेः— इति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000309.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000310", "originalText": "भाष्यकारैः ‘लाङ्गलं गवादीनुद्वहतीतिवत् कर्तृत्वोपचारमात्रं रथादिप्रतिभाननिमित्तत्वेन’ इति व्याख्यातत्वात् इत्याहुः।", "padacchedaText": "", "audioFile": "PB_hear2read_000310.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000311", "originalText": "अनेनैव निखिलप्रपञ्चरचनाकर्तृभावेनार्थसिद्धिं सर्वज्ञत्वं ब्रह्मणः ‘शास्त्रयोनित्वात्’ (ब्र.सू. १. १. ३) इत्यधिकरणे वेदकर्तृत्वेनापि समर्थितम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000311.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000312", "originalText": "ईश्वरसर्वज्ञत्ववादः\nअथ कथं ब्रह्मणःसर्वज्ञत्वं सङ्गच्छते, जीववत् अन्तःकरणाभावेन ज्ञातृत्वस्यैवायोगात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000312.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000313", "originalText": "अत्र सर्ववस्तुविषयसकलप्राणिधीवासनोपरक्ताज्ञानोपाधिक ईश्वरः, अतस्तस्य सर्वविषयवासनासाक्षितया सर्वज्ञत्वम् इति भारतीतीर्थादि पक्षः प्रगेव दर्शतः।", "padacchedaText": "", "audioFile": "PB_hear2read_000313.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000314", "originalText": "प्रकटार्थकारास्त्वाहुः— यथा जीवस्य स्वोपाध्यन्तःकरणपरिणामाश्चैतन्यप्रतिबिम्बग्राहिणः (सन्ति) इति तद्योगात् ज्ञातृत्वम्, एवं ब्रह्मणः स्वोपाधिमायापरिणामश्चित्प्रतिबिम्बग्राहिणस्सन्तीति तत्प्रतिबिम्बितैः स्फुरणैः कालत्रयवर्तिनोऽपि प्रपञ्चस्यापरोक्ष्येणाकलनात् सर्वज्ञत्वमिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000314.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000315", "originalText": "तत्त्वशुद्धिकारास्तु— उक्तरीत्या ब्रह्मणो विद्यमाननिखिलप्रपञ्चसाक्षात्कारसम्भवः, तज्जनिततत्संस्कारवृत्तया च स्मरणोपपत्तेरतीतसकलवस्त्ववभाससिद्धिः, सृष्टेः प्राक् मायायाः सृज्यमाननिखिलपादार्थस्फुरणरूपेण जीवादृष्टानुरोधेन विवर्तमानत्वात् तत्साक्षितया तदुपाधिकस्य ब्रह्मणोऽपि तत्साधकत्वसिद्धेः अनागतवस्तुविज्ञानोपपत्तिः, इति सर्वज्ञत्वं समर्थयन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000315.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000316", "originalText": "कौमुदीकृतस्तु वदन्ति— स्वरूपज्ञानेनैव ब्रह्मणः स्वसंसृष्टसर्वावभासकत्वात् सर्वज्ञत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000316.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000317", "originalText": "अतीतानागतयोरपि अविद्याचित्रभित्तौ विमृष्टानुन्मीलितचित्रवत् संस्कारात्मना सत्त्वेन तत्संसर्गस्याप्युपपत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000317.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000318", "originalText": "न तु वृत्तिज्ञानैः तस्य सर्वज्ञत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000318.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000319", "originalText": "‘तमेव भान्तमनुभाति सर्वम्’ (क.उ. २. २. १५) इति सावधारणश्रुतिविरोधात्, सृष्टेः प्राक् ‘एकमेवाद्वितीयम्’ (छा.उ. ६. २. १) इत्यवधारणानुरोधेन महाभूतानामिव वृत्तिज्ञानानामपि प्रलयस्य वक्तव्यतया ब्रह्मणः तदा सर्वज्ञत्वाभावापत्त्या प्राथमिकमायाविवर्तरूपे ईक्षणे तत्पूर्वके महाभूतादौ च स्रष्टृत्वाभावप्रसङ्गाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000319.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000320", "originalText": "एवं सति ब्रह्मणस्सर्वविषयज्ञानात्मकत्वमेव स्यात्, न तु सर्वज्ञानकर्तृत्वरूपम् सर्वज्ञत्वम्, इति चेत्— सत्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000320.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000321", "originalText": "सर्वविषयज्ञानात्मकमेव ब्रह्म, न तु सर्वज्ञानकर्तृत्वरूपं ज्ञातृत्वमस्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000321.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000322", "originalText": "अत एव ‘वाक्यान्वयात्’ (ब्र.सू. १. ४. १९) इत्यधिकरणे विज्ञातृत्वं जीवलिङ्गमित्युक्तं भाष्यकारैः।", "padacchedaText": "", "audioFile": "PB_hear2read_000322.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000323", "originalText": "‘यस्सर्वज्ञः’ इत्यादिश्रुतिरपि तस्य ज्ञानरूपत्वाभिप्रायेणैव योजनीया इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000323.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000324", "originalText": "यद्यपि ब्रह्म स्वरूपचैतन्येनैव स्वसंसृष्टसर्वावभासकम्, तथापि तस्य स्वरूपेणाकार्यत्वेऽपि दृश्यावच्छिन्नरूपेण ब्रह्मकार्यत्वात् ‘यस्सर्वज्ञः’ इत्यादिज्ञानजनिकर्तृत्वश्रुतेरपि न कश्चिद्विरोधः इति वाचस्पतिमिश्राः।", "padacchedaText": "", "audioFile": "PB_hear2read_000324.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000325", "originalText": "जीवाल्पत्वनिरूपणम् (प्रतिकर्म व्यवस्थावर्णनम्)\nननु ईश्वरवज्जीवोऽपि वृत्तिमनपेक्ष्य स्वरूपचैतन्येनैव किमिति विषयान्नावभासयति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000325.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000326", "originalText": "अत्रोक्तं विवरणे − ‘ब्रह्मचैतन्यं सर्वोपादानतया सर्वतादात्म्यापन्नं यत्स्वसंसृष्टं सर्वमवभासयति न जीवचैतन्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000326.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000327", "originalText": "तस्य अविद्योपाधिकतया सर्वगतत्वेऽपि अनुपादानत्वेन असङ्गित्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000327.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000328", "originalText": "यथा सर्वगतं गोत्वसामान्यं स्वभावादश्वादिव्यक्तिसङ्गित्वाभावेऽपि सास्नादिमद्व्यक्तौ संसृज्यते, एवं विषयान्तरासङ्ग्यपि जीवः स्वभावादन्तःकरणेन संसृज्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000328.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000329", "originalText": "तथा च यदा अन्तःकरणस्य परिणामो वृत्तिरूपो नयनादिद्वारेण निर्गत्य विषयपर्यन्तं चक्षुरश्मिरिव झटिति दीर्घप्रभाकारेण परिणम्य विषयं व्याप्नोति, तदा तमुपारुह्य तं विषयं गोचरयति।", "padacchedaText": "", "audioFile": "PB_hear2read_000329.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000330", "originalText": "केवलाग्न्यदाह्यस्यापि तृणादेः अयःपिण्डसमारूढाग्निदाह्यत्ववत् केवलजीवचैतन्यप्रकाश्यस्यापि घटादेः अन्तःकरणवृत्त्युपारूढतत्प्रकाश्यत्वं युक्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000330.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000331", "originalText": "यद्वा अन्तःकरणोपाधिकत्वेन जीवः परिच्छिन्नः।", "padacchedaText": "", "audioFile": "PB_hear2read_000331.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000332", "originalText": "अतः संसर्गाभावात् न घटादिकमवभासयति।", "padacchedaText": "", "audioFile": "PB_hear2read_000332.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000333", "originalText": "वृत्तिद्वारा तत्संसृष्टविषयावच्छिन्नब्रह्मचैतन्याभेदाभिव्यक्तौ तु तं विषयं प्रकाशयति।", "padacchedaText": "", "audioFile": "PB_hear2read_000333.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000334", "originalText": "अथवा जीवः सर्वगतोऽप्यविद्यावृत्तित्वात् स्वयमप्यप्रकाशमानतया विषयान्नावभासयति।", "padacchedaText": "", "audioFile": "PB_hear2read_000334.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000335", "originalText": "विषयविशेषे वृत्त्युपरागादौ आवरणतिरोधानेन तत्रैवाभिव्यक्तः तमेव विषयं प्रकाशयति।", "padacchedaText": "", "audioFile": "PB_hear2read_000335.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000336", "originalText": "एवं च चिदुपरागार्थत्वेन, विषयचैतन्याभेदाभिव्यक्त्यर्थत्वेन, आवारणाभिभवार्थत्वेन वा वृत्तिनिर्गममपेक्ष्य तत्संसृष्टविषयमात्रावभासकत्वात् जीवस्य किञ्चिज्ज्ञत्वमप्युपपद्यते— इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000336.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000337", "originalText": "सम्बन्धवादः\nअत्र प्रथमे पक्षे सर्वगतस्य जीवस्य वृत्त्यधीनः को विषयोपरागः।", "padacchedaText": "", "audioFile": "PB_hear2read_000337.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000338", "originalText": "वृत्त्यापि पूर्वसिद्धयोर्निष्क्रिययोर्विषयजीवचैतन्ययोस्तादात्म्यस्य संयोगस्य वा न सम्भवत्याधानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000338.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000339", "originalText": "अत्र केचिदाहुः − विषयविषयिभावसम्बन्ध एवेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000339.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000340", "originalText": "अन्ये तु − विषयविषयिभावमात्रे नियामिका वृत्तिश्चेत् अनिर्गताया अपि ऐन्द्रियकवृत्तेः तन्नियामकत्वं नातिप्रसङ्गावहमिति तन्निर्गमाभ्युपगमवैयर्थ्यापत्तेः स नाभिसंहितः, किं तु विषयसन्निहितजीवचैतन्यतादात्म्यापन्नाया वृत्तेर्विषयसंयोगे तस्यापि तद्द्वारकः परम्परासम्बन्धो लभ्यत इति स एव चिदुपरागोऽभिसंहितः— इत्याहुः।", "padacchedaText": "", "audioFile": "PB_hear2read_000340.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000341", "originalText": "अपरे तु— साक्षादपरोक्षचैतन्यसंसर्गेणैव सुखादेरपरोक्ष्यदर्शनात् अपरोक्षविषये साक्षात्संसर्ग एष्टव्यः।", "padacchedaText": "", "audioFile": "PB_hear2read_000341.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000342", "originalText": "तस्माद्वृत्तेर्विषयसंयोगे वृत्तिरूपावच्छेदकलाभात् तदवच्छेदेन तदुपादानस्य जीवस्यापि संयोगजसंयोगः सम्भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_000342.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000343", "originalText": "कारणाकारणसंयोगात् कार्याकार्यसंयोगवत् कार्याकार्यसंयोगात् कारणाकारणसंयोगस्यापि युक्तितौल्येनाभ्युपगन्तुं युक्तत्वात्— इत्याहुः।", "padacchedaText": "", "audioFile": "PB_hear2read_000343.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000344", "originalText": "एकदेशिनस्तु— अन्तःकरणोपहितस्य विषयावभासकचैतन्यस्य विषयतादात्म्यापन्नब्रह्मचैतन्याभेदाभिव्यक्तिद्वारा विषयतादात्म्यसम्पादनमेव चिदुपरागोऽभिसंहितः।", "padacchedaText": "", "audioFile": "PB_hear2read_000344.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000345", "originalText": "सर्वगततया सर्वविषयसन्निहितस्यापि जीवस्य तेन रूपेण विषयावभासकत्वे तस्य साधारणतया पुरुषविशेषापरोक्षव्यवस्थित्ययोगेन तस्य अन्तःकरणोपहितत्वरूपेणैव विषयावभासकत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000345.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000346", "originalText": "एवं च विषयापरोक्ष्ये आध्यासिकसम्बन्धो नियामक इति सिद्धान्तोऽपि सङ्गच्छ्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000346.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000347", "originalText": "न चैवं द्वितीयपक्षसाङ्कर्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000347.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000348", "originalText": "जीवस्य सर्वगतत्वे प्रथमःपक्षः, परिच्छिन्नत्वे द्वितीयः, इत्येव तयोर्भेदात्— इत्याहुः।", "padacchedaText": "", "audioFile": "PB_hear2read_000348.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000349", "originalText": "अभेदाभिव्यक्तिवादः\nअथ द्वितीयपक्षे केयमभेदाभिव्यक्तिः?\nकेचिदाहुः− कुल्याद्वारा तटाककेदारसलिलयोरिव विषयान्तःकरणावच्छिन्नचैतन्ययोः वृत्तिद्वारा एकीभावोऽभेदाभिव्यक्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000349.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000350", "originalText": "एवं च यद्यपि विषयावच्छिन्नं ब्रह्मचैतन्यमेव विषयप्रकाशकम्, तथाऽपि तस्य वृत्तिद्वारा एकीभावेन जीवत्वं सम्पन्नमिति जीवस्य विषयप्रकाशोपपत्तिरिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000350.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000351", "originalText": "अन्येत्वाहुः— बिम्बस्थानीयस्य विषयावच्छिन्नस्य ब्रह्मणः प्रतिबिम्बभूतेन जीवेन एकीभावो नाभेदाभिव्यक्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000351.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000352", "originalText": "व्यावर्तकोपाधौ दर्पण इव जाग्रति तयोरेकीभावायोगात्, वृत्तिकृताभेदाभिव्यक्त्या विषयावच्छिन्नस्य ब्रह्मणो जीवत्वप्राप्तौ ब्रह्मणस्तदा तद्विषयसंसर्गाभावेन तद्द्रष्टृत्वासम्भवे सति तस्य सर्वज्ञत्वाभावापत्तेश्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000352.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000353", "originalText": "किं तु विषयावच्छिन्नं ब्रह्मचैतन्यं विषयसंसृष्टाया वृत्तेः अग्रभागे विषयप्रकाशकं प्रतिबिम्बं समर्पयतीति तस्य प्रतिबिम्बस्य जीवेनैकीभावः।", "padacchedaText": "", "audioFile": "PB_hear2read_000353.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000354", "originalText": "एवं च अन्तःकरणतद्वृत्तिविषयावच्छिन्नचैतन्यानां प्रमातृप्रमाणप्रमेयभावेन असङ्करोऽप्युपपद्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000354.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000355", "originalText": "न च वृत्त्युपहितचैतन्यस्य विषयप्रमात्वे तस्य विषयाधिष्ठानचैतन्यस्येव विषयेणाध्यासिकसम्बन्धाभावात् विषयापरोक्ष्ये आध्यासिकसम्बन्धस्तन्त्रं न स्यादिति वाच्यम्, विषयाधिष्ठानचैतन्यस्यैव विषयेणावच्छिन्नस्य वृत्तौ प्रतिबिम्बिततया तदभेदेन तत्सम्बन्धस्यैव तत्सम्बन्धत्वादिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000355.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000356", "originalText": "अपरे त्वाहुः— बिम्बभूतविषयाधिष्ठानचैतन्यमेव साक्षादाध्यासिकसम्बन्धलाभात् विषयप्रकाशकमिति तस्यैव बिम्बत्वविशिष्टरूपेण भेदसद्भावेऽपि तदुपलक्षितचैतन्यात्मना एकीभावोऽभेदाभिव्यक्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000356.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000357", "originalText": "न चैवं सति जीवब्रह्मसाङ्कर्यम्, न वा ब्रह्मणः सर्वज्ञत्वविरोधः।", "padacchedaText": "", "audioFile": "PB_hear2read_000357.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000358", "originalText": "बिम्बात्मना तस्य यथापूर्वमवस्थानादिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000358.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000359", "originalText": "आवरणाभिभववादः\nअथ तृतीयपक्षे को नामावरणाभिभवः? अज्ञाननाशश्चेत्, घटज्ञानेनैवाज्ञानमूलः प्रपञ्चो निर्वर्तेत— इति चेत्\nअत्र केचिदाहुः − चैतन्यमात्रावारकस्याज्ञानस्य विषयावच्छिन्नप्रदेशे खद्योतादिप्रकाशेन महान्धकारस्येव ज्ञानेन एकदेशेन नाशो वा, कटवत् संवेष्टनं वा, भीतभटवदपसरणं वाऽभिभव इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000359.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000360", "originalText": "अन्ये तु— अज्ञानस्य एकदेशेन नाशे उपादानाभावात् पुनस्तत्र कन्दलनायोगेन सकृदवगते समयान्तरेऽप्यावरणाभावप्रसङ्गात्, निष्क्रियस्यापसरणसंवेष्टनयोरसम्भवाच्च न यथोक्तरूपोऽभिभवः सम्भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_000360.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000361", "originalText": "अतः चैतन्यमात्रावारकस्याप्यज्ञानस्य तत्तदाकारवृत्तिसंसृष्टावस्थविषयावच्छिन्नचैतन्यानावरकत्वस्वाभाव्यमेव अभिभवः।", "padacchedaText": "", "audioFile": "PB_hear2read_000361.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000362", "originalText": "न च विषयावगुण्ठनपटवत् विषयचैतन्यमाश्रित्यस्थितस्याज्ञानस्य कथं तदनावारकत्वं युज्यत इति शङ्क्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000362.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000363", "originalText": "‘अहमज्ञः’ इति प्रतीत्या अहमनुभवे प्रकाशमानचैतन्यमाश्रयत एव तस्य तदनावारकत्वसम्प्रतिपत्तेः− इत्याहुः।", "padacchedaText": "", "audioFile": "PB_hear2read_000363.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000364", "originalText": "अपरे तु − ‘घटं न जानामि’— इति घटज्ञानविरोधित्वेन, घटज्ञाने सति ‘घटाज्ञानं निवृत्तम्’ इति तन्निवर्त्यत्वेन च अनुभूयमानं न मूलाज्ञानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000364.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000365", "originalText": "शुद्धचैतन्यविषयस्य तज्ज्ञाननिवर्त्यस्य च तस्य तथात्वायोगात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000365.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000366", "originalText": "किन्तु घटावच्छिन्नचैतन्यविषयं मूलाज्ञानस्यावस्थाभेदरूपमज्ञानान्तरमिति तन्नाश एवाभिभवः।", "padacchedaText": "", "audioFile": "PB_hear2read_000366.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000367", "originalText": "न चैवमेकेन ज्ञानेन तन्नाशे तत्समानविषयाणां ज्ञानान्तराणाम् आवरणानाम् आवरणानभिभावकत्वापत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000367.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000368", "originalText": "यावन्ति ज्ञानानि, तावन्ति तन्निवर्त्यानि अज्ञानानि इत्यभ्युपगमात् − इत्याहुः।", "padacchedaText": "", "audioFile": "PB_hear2read_000368.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000369", "originalText": "अवस्थाज्ञानसादित्वानादित्ववादः\nइमानि च अवस्थारूपाणि अज्ञानानि मूलाज्ञानवदज्ञानत्वात् अनादीनीति केचित्।", "padacchedaText": "", "audioFile": "PB_hear2read_000369.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000370", "originalText": "व्यावहारिकौ जगज्जीवावावृत्य स्वाप्नौ जगज्जीवौ विक्षिपन्ती निद्रा तावत् आवरणविक्षेपशक्तियोगात्, अज्ञानावस्थाभेदरूपा।", "padacchedaText": "", "audioFile": "PB_hear2read_000370.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000371", "originalText": "तथा निद्रासुषुत्यवस्थाऽपि अन्तःकरणादौ विलीने ‘सुखमहमस्वाप्सं न किञ्जिदवेदिषम्’ इति परामर्शदर्शनात् मूलाज्ञानवत् सुषुप्तिकालेऽनुभूयमाना अज्ञानावस्था भेदरूपैव।", "padacchedaText": "", "audioFile": "PB_hear2read_000371.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000372", "originalText": "तयोश्च जाग्रद्भोगप्रदकर्मोपरमे सत्येवोद्भवात् सादित्वमिति, तद्वत् अन्यदप्यज्ञानमवस्थारूपं सादि इति अन्ये।", "padacchedaText": "", "audioFile": "PB_hear2read_000372.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000373", "originalText": "अवस्थाज्ञानानादित्वपक्षपरिष्कारः\nननु— अनादित्वपक्षे घटे प्रथममुत्पन्नेनैव ज्ञानेन सर्वतदज्ञाननाशो भवेत्, विनिगमनाविरहात्, तदवच्छिन्नचैतन्यावरकसर्वाज्ञानानाशे विषयप्रकाशायोगाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000373.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000374", "originalText": "अतः पाश्चात्यज्ञानानाम् आवरणानभिभावकत्वं तदवस्थमेवेति चेत् −\nअत्र केचित् आहुः− यथा ज्ञानप्रागभावानामनेकेषां सत्त्वेऽप्येकज्ञानोदये ‘एक एव प्रागभावो निवर्तते, संशयादिजननशक्ततया तदावरणरूपेषु प्रागभावान्तरेषु सत्स्वपि विषयावभासः, तथा एकज्ञानोदये एकमेवाज्ञानं निवर्तते, अज्ञानान्तरेषु सत्स्वपि विषयावभासः— इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000374.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000375", "originalText": "अन्येतु − आवृतस्यापरोक्षज्ञानं विरुद्धम्, एकज्ञानोदये च प्रागभावान्तरसत्त्वेऽपि यावद्विशेषदर्शनाभावकूटरूपमावरणं विशेषदर्शनान्नास्तीति मन्यमाना वदन्ति − यदा यदज्ञानमावृणोति तदा तेन ज्ञानेन तस्यैव नाशः।", "padacchedaText": "", "audioFile": "PB_hear2read_000375.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000376", "originalText": "सर्वं च सर्वदा नावृणोति, वैयर्थ्यात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000376.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000377", "originalText": "किं तु आवरकाज्ञाने वृत्त्या नाशिते तद्वृत्त्युपरमे अज्ञानान्तरमावृणोति।", "padacchedaText": "", "audioFile": "PB_hear2read_000377.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000378", "originalText": "न चैवं सति ब्रह्मावगमोत्पत्तिकालेऽनावारकत्वेन स्थितानामज्ञानानां ततोऽप्यनिवृत्तिप्रसङ्गः।", "padacchedaText": "", "audioFile": "PB_hear2read_000378.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000379", "originalText": "तेषां साक्षात्तद्विरोधित्वाभावेऽपि तन्निवर्त्यमूलाज्ञानपरतन्त्रतया अज्ञानसम्बन्धादिवत् तन्निवृत्त्यैव निवृत्त्युपपत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000379.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000380", "originalText": "एतदर्थमेव तेषां तदवस्थाभेदरूपतया तत्पारतन्त्र्यमिष्यते − इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000380.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000381", "originalText": "अपरे तु ‘अज्ञानस्य सविषयस्वभावत्वात् उत्सर्गतः सर्वं सर्वदा आवृणोत्येव।", "padacchedaText": "", "audioFile": "PB_hear2read_000381.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000382", "originalText": "न च विषयोत्पत्तेः प्रागावरणीयाभावेन आवारकत्वं न युज्यत इति वाच्यम्, तदापि सूक्ष्मरूपेण तत्सत्त्वात्’ इति मन्यमानाः कल्पयन्ति− यथा बहुजनसमाकुले प्रदेशे कस्यचित् शिरसि निपतन्नशनिः इतरानप्यपसारयति, यथा वा सन्निपातहरमौषधम् एकं दोषं निवर्तयद्दोषान्तरमपि दूरीकरोति, एवमेकमज्ञानं नाशयत् ज्ञानम् अज्ञानान्तराण्यपि तिरस्करोति।", "padacchedaText": "", "audioFile": "PB_hear2read_000382.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000383", "originalText": "तिरस्कारश्च यावत् ज्ञानस्थितिः तावत् आवरणशक्तिप्रतिबन्धः − इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000383.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000384", "originalText": "‘ज्ञानसामान्यम् अज्ञाननिवर्तकम्’ इति नियमपरीक्षा\nनन्वेवं सति धारावाहिकस्थले द्वितीयादिवृत्तीनामावरणानभिभावकत्वेन वैफल्यं स्यात्, प्रथमज्ञानेनैव निवर्तनतिरस्काराभ्यामावरणमात्रस्याभिभावादिति −\nअत्राहुः− वृत्तितिरस्कृतमज्ञानं तदुपरमे पुनरावृणोति प्रदीपतिरस्कृतं तम इव प्रदीपोपरमे।", "padacchedaText": "", "audioFile": "PB_hear2read_000384.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000385", "originalText": "वृत्त्युपरमसमये वृत्त्यन्तरोदये तु तिरस्कृतमज्ञानं तथैवावतिष्ठते प्रदीपोपरमसमये प्रदीपान्तरोदये तम इव।", "padacchedaText": "", "audioFile": "PB_hear2read_000385.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000386", "originalText": "तथा च ‘यस्मिन् सति अग्रिमक्षणे यस्य सत्त्वं, यद्व्यतिरेके चासत्त्वं, तत्तज्जन्यम्’ इति प्रागभावपरिपालनसाधारणलक्षणानुरोधेन अनावरणस्य द्वितीयादिवृत्तिकार्यत्वस्यापि लाभात् न तद्वैफल्यमिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000386.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000387", "originalText": "न्यायचन्द्रिकाकृतस्तु आहुः − केनचिज्ज्ञानेन कस्यचिदज्ञानस्य नाश एव, न तु आवारकाणामप्यज्ञानान्तराणां तिरस्कारः।", "padacchedaText": "", "audioFile": "PB_hear2read_000387.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000388", "originalText": "तथा च धारावाहिकद्वितीयादिवृत्तीनामपि एकैकाज्ञाननाशकत्वेन साफल्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000388.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000389", "originalText": "न चैवं ज्ञानोदयेऽप्यावरणसम्भवाद्विषयानवभासप्रसङ्गः।", "padacchedaText": "", "audioFile": "PB_hear2read_000389.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000390", "originalText": "अवस्थारूपाण्यज्ञानानि हि तत्तत्कालोपलक्षितस्वरूपावारकाणि, ज्ञानानि च यावत्स्वकालोपलक्षितविषयावारकाज्ञाननाशकानि।", "padacchedaText": "", "audioFile": "PB_hear2read_000390.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000391", "originalText": "तथा च किञ्चज्ज्ञानोदये तत्कलीनविषयावाराकाज्ञानस्य नाशात् विद्यमानानामज्ञानान्तराणामन्यकालीनविषयावारकत्वाच्च न तत्कालीनविषयावभासे काचिदनुपपत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000391.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000392", "originalText": "कारीरीफले वृष्टौ आसन्नसमयस्येव अज्ञानविषये घटादौ तत्तत्कालस्य उपलक्षणतया विषयकोटावननुप्रवेशेन सूक्ष्मतत्तत्कालभेदाविषयैर्धारावाहिकद्वितीयादिज्ञानैरज्ञानानां निवृत्तावपि न काचिदनुपपत्तिरिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000392.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000393", "originalText": "केचित्तु − प्रथमज्ञाननिवर्त्यमेवाज्ञानं स्वरूपावारकम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000393.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000394", "originalText": "द्वितीयादिज्ञाननिवर्त्यानि तु देशकालादिविशेषणान्तरविशिष्टविषयाणि।", "padacchedaText": "", "audioFile": "PB_hear2read_000394.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000395", "originalText": "अत एव सत्तानिश्चयरूपे अज्ञाननीवर्तके चैत्रदर्शने सकृज्जाते ‘चैत्रं न जानामि’ इति स्वरूपावरणं नानुभूयते, किं तु ‘इदनीं स कुत्रेति न जानामि’ इत्यादिरूपेण विशिष्टावरणमेव।", "padacchedaText": "", "audioFile": "PB_hear2read_000395.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000396", "originalText": "विस्मरणशालिनः क्कचित् सकृत् दृष्टेऽपि ‘न जानामि’ इति स्वरूपावरणं दृश्यते चेत्,तत्र तथाऽस्तु।", "padacchedaText": "", "audioFile": "PB_hear2read_000396.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000397", "originalText": "अन्यत्र सकृद्दृष्टे विशिष्टविषयान्येवाज्ञानानि ज्ञानानि च।", "padacchedaText": "", "audioFile": "PB_hear2read_000397.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000398", "originalText": "न च— एवं सति धारावाहिकद्वितीयादिज्ञानानामज्ञाननिवर्तकत्वं न स्यात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000398.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000399", "originalText": "स्थूलकालविशिष्टाज्ञानस्य प्रथमज्ञानेनैव निवृत्तेः, पूर्वापरज्ञानव्यावृत्तसूक्ष्मकालविशिष्टाज्ञानस्य तदविषयैर्द्वितीयादिज्ञानैर्निवृत्त्ययोगात् − इति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000399.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000400", "originalText": "धारावहनस्थले प्रथमोत्पन्नाया एव वृत्तेस्तावत्कालावस्थायित्वसम्भवेन वृत्तिभेदानभ्युपगमात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000400.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000401", "originalText": "तदभ्युपगमेऽपि बहुकालावस्थायिपञ्चषवृत्तिरूपत्वसम्भवेन परस्परव्यावृत्तस्थूलकालादिविशेषणभेदविषयत्वोपपत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000401.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000402", "originalText": "प्रतिक्षणोद्यदनेकवृत्तिसन्तानरूपत्वाभ्युपगमेऽपि द्वितीयादिवृत्तीनामधिगतार्थमात्रविषयतया प्रामाण्याभावेन आवरणानिवर्तकत्वेऽप्यहानेश्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000402.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000403", "originalText": "न हि विषयाबाधमात्रं प्रामाण्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000403.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000404", "originalText": "प्रागवगतानवगतयोः पर्वतत्तद्वृत्तिपावकयोरनुमितिविषययोरबाधस्याविशेषेण उभयत्राप्यनुमितेः प्रामाण्यप्रसङ्गात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000404.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000405", "originalText": "न चेष्टापत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000405.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000406", "originalText": "‘वह्नावनुमितिः प्रमाणण्’ इतिवत् ‘पर्वतेऽप्यनुमितिः प्रमाणम्’ इतिव्यवहारादर्शनात्, विवरणे साक्षिसिद्धस्याज्ञानस्य अभावव्यावृत्तिप्रत्यायनार्थानुमानादिविषयत्वेऽपि प्रमाणावेद्यत्वोक्तेश्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000406.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000407", "originalText": "तस्मात् द्वितीयादिवृत्तीनां प्रामाण्याभावात् उपासनादिवृत्तीनामिव अज्ञानानिवर्तकत्वेऽपि न हानिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000407.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000408", "originalText": "प्रमाणवृत्तीनामेव तन्निवर्तकत्वाभ्युपगमात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000408.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000409", "originalText": "‘प्रमासामान्यम् अज्ञाननिवर्तकम्’ इति नियमपरीक्षा\nननु— नायमपि नियमः, परोक्षवृत्तेरनिर्गमेनाज्ञानानिवर्तकत्वादिति चेत्—\nअत्र केचिदाहुः— द्विविधं विषयावारकमज्ञानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000409.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000410", "originalText": "एकं विषयाश्रितं रज्वादिविक्षेपोपादानभूतं कार्यकल्प्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000410.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000411", "originalText": "अन्यत् पुरुषाश्रितं ‘इदमहं न जनामि’ इत्यनुभूयमानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000411.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000412", "originalText": "पुरुषाश्रितस्य विषयसम्भिन्नविक्षेपोपादानत्वासम्भवेन विषयाश्रितस्य ‘इदमहं न जानामि’ इति साक्षिरूपप्रकाशसंसर्गायोगेन द्विविधस्याप्यावश्यकत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000412.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000413", "originalText": "एवं च परोक्षस्थले वृत्तेर्निर्गमनाभावात् दूरस्थवृक्षे आप्तवाक्यात् परिमाणविशेषावगमेऽपि तद्विपरीतपरिमाणविक्षेपविशेषदर्शनाच्च विषयगताज्ञानानिवृत्तावपि पुरुषगताज्ञाननिवृत्तिरस्त्येव।", "padacchedaText": "", "audioFile": "PB_hear2read_000413.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000414", "originalText": "“शास्त्रार्थं न जानामि” इत्यनुभूताज्ञानस्य तदुपदेशानन्तरं निवृत्त्यनुभवात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000414.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000415", "originalText": "अत एव ‘अनुमेयादौ सुषुप्तिव्यावृत्तिः’ इति विवरणस्य ‘तद्विषयाज्ञाननिवृत्तिरर्थः’ इत्युक्तं तत्त्वदीपने इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000415.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000416", "originalText": "अन्ये तु— नयनपटलवत् पुरुषाश्रितमेवाज्ञानं विषयावारकम्, न तदतिरेकेण विषयगताज्ञाने प्रमाणमस्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000416.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000417", "originalText": "न च— पुरुषाश्रितस्य विषयगतविक्षेपपरिणामित्वं न सम्भवति, तत्सम्भवे वा दूरस्थवृक्षपरिमाणे परोक्षज्ञानादज्ञाननिवृत्तौ विपरीतपरिमाणविक्षेपो न सम्भवतीति— वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000417.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000418", "originalText": "वाचस्पतिमते सर्वस्य प्रपञ्चस्य जीवाश्रिताज्ञानविषयीकृतब्रह्मविवर्तत्वेन तद्वत् शुक्तिरजतादेः पुरुषाश्रिताज्ञानविषयीकृतब्रह्मविवर्तत्वोपपत्तेः, परोक्षवृत्त्या एकावस्थानिवृत्तावपि अवस्थान्तरेण विपरीतपरिमाणविक्षेपोपपत्तेश्च— इत्याहुः।", "padacchedaText": "", "audioFile": "PB_hear2read_000418.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000419", "originalText": "अपरे तु— शुत्तिरजतादिपरिणामोपपत्त्याञ्जस्यात् विषयावकुण्ठनपटवत् विषयगतमेवाज्ञानं तदावारकम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000419.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000420", "originalText": "न च तथासति अज्ञानस्य अन्तःकरणोपहितसाक्ष्यसंसर्गेण ततः प्रकाशानुपपत्तिः परोक्षवृत्तिनिवर्त्यत्वासम्भवश्च दोष इति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000420.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000421", "originalText": "अवस्थारूपाज्ञानस्य साक्ष्यसंसर्गेऽपि तत्संसृष्टमूलाज्ञानस्यैव ‘शुक्तिमहं न जानामि’ इति प्रकाशोपपत्तेः, शुक्त्यादेरपि मूलाज्ञानविषयचैतन्याभिन्नतया तद्विषयत्वानुभवाविरोधात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000421.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000422", "originalText": "विवरणादिषु मूलाज्ञानसाधनप्रसङ्ग एव ‘इदमहं न जानामि’ इति प्रत्यक्षप्रमाणोपदर्शनाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000422.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000423", "originalText": "‘अहमज्ञः’ इति सामान्यतोऽज्ञानानुभव एव मूलाज्ञानविषयकः, ‘शुक्तिमहं न जानामि’ इत्यादिविषयविशेषालिङ्गिताज्ञानानुभवस्त्ववस्थाऽज्ञानविषयकः’ इति विशेषाभ्युपगमेऽपि अवस्थाऽवस्थावतोरभेदेन मूलाज्ञानस्य साक्षिसंसर्गाद्वा साक्षिविषयचैतन्ययोः वास्तवैक्याद्वा विषयगतस्याप्यवस्थाऽज्ञानस्य साक्षिविषयत्वोपपत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000423.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000424", "originalText": "परोक्षज्ञानस्याज्ञानानिवर्तकत्वेऽपि ततस्तन्निवृत्त्यनुभवस्य सत्तानिश्चयरूपपरोक्षवृत्तिप्रतिबन्धकप्रयुक्ताननुभवनिबन्धनभ्रान्तित्वोपपत्तेः, अपरोक्षज्ञानस्यैवाज्ञाननिवर्तकत्वनियमाभ्युपगमात्— इत्याहुः।", "padacchedaText": "", "audioFile": "PB_hear2read_000424.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000425", "originalText": "ननु नायमपि नियमः।", "padacchedaText": "", "audioFile": "PB_hear2read_000425.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000426", "originalText": "अविद्याऽहङ्कारसुखदुःखादितद्धर्मप्रत्यक्षस्याज्ञाननिवर्तकत्वानभ्युपगमादिति चेत्— न— अविद्यादिप्रत्यक्षस्य साक्षिरूपत्वेन वृत्तिरूपापरोक्षज्ञानस्यावरणनिवर्तकत्वनियमानपायात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000426.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000427", "originalText": "साक्षिस्वरूपनिर्णयवादः\nअथ कोऽयं साक्षी जीवातिरेकेण व्यवह्रियते।", "padacchedaText": "", "audioFile": "PB_hear2read_000427.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000428", "originalText": "अत्रोक्तं कूटस्थदीपे— देहद्वयाधिष्ठानभूतं कूटस्थचैतन्यं स्वावच्छेदकस्य देहद्वयस्य साक्षादीक्षणात् निर्विकारत्वाच्च साक्षीत्युच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000428.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000429", "originalText": "लोकेऽपि हि औदासीन्यबोधाभ्यामेव साक्षित्वं प्रसिद्धम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000429.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000430", "originalText": "यद्यपि जीवस्य वृत्तयः सन्ति देहद्वयभासिकाः, तथापि सर्वतः प्रसृतेन स्वावच्छिन्नेन कूटस्थचैतन्येन ईषत् सदा भास्यमानमेव देहद्वयं जीवचैतन्यरूपप्रतिबिम्बगर्भादन्तःकरणाद्विच्छिद्यविच्छिद्योद्गच्छद्भिर्वृत्तिज्ञानैः स्फुटम् अवभास्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000430.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000431", "originalText": "अन्तरालकालेषु तु सह वृत्त्यभावैः कूटस्थचैतन्येनैव अवभास्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000431.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000432", "originalText": "अत एव अहङ्कारादीनां [सदा](सर्वदा) प्रकाशसंसर्गात् संशयाद्यगोचरत्वम् अन्यज्ञानधाराकालीनाहङ्कारस्य ‘एतावन्तं कालमिदमहं पश्यन्नेवासम्’ इत्यनुसन्धानं च।", "padacchedaText": "", "audioFile": "PB_hear2read_000432.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000433", "originalText": "न च कूटस्थप्रकाशिते कथं जीवस्य व्यवहारस्मृत्यादिकमिति शङ्क्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000433.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000434", "originalText": "अन्योन्याध्यासेन जीवैकत्वापत्त्या कूटस्थस्य जीवान्तरङ्गत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000434.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000435", "originalText": "न च जीवचैतन्यमेव साक्षी भवतु किं कूटस्थेनेति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000435.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000436", "originalText": "लौकिकवैदिकव्यवहारकर्तुस्तस्य उदासीनद्रष्टृत्वासम्भवेन ‘साक्षी चेता केवलो निर्गुणश्च’ (श्वे.उ. ६. ११) इति श्रुत्युक्तसाक्षित्वायोगात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000436.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000437", "originalText": "’तयोरन्यः पिप्पलं स्वाद्वत्ति अनश्नन्नन्यो अभिचाकशीति’ (श्वे.उ. ४. ६) इति कर्मफलभोक्तुर्जीवात् उदासीनप्रकाशरूपस्य साक्षिणः पृथगाम्नानाच्च इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000437.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000438", "originalText": "नाटकदीपेऽपि नृत्यशालास्थदीपदृष्टान्तेन साक्षी जीवाद्विविच्य दर्शितः।", "padacchedaText": "", "audioFile": "PB_hear2read_000438.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000439", "originalText": "तथाहि − ‘नृत्यशालास्थितो दीपः प्रभुं सभ्यांश्च नर्तकीम्। दीपयेदविशेषेण तदभावेऽपि दीप्यते॥", "padacchedaText": "", "audioFile": "PB_hear2read_000439.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000440", "originalText": "’ (पं.द. १०. ११)।", "padacchedaText": "", "audioFile": "PB_hear2read_000440.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000441", "originalText": "तथा चिदाभासविशिष्टाहङ्काररूपं जीवं विषयभोगसाकल्यवैकल्याभिमानप्रयुक्तहर्षविषादवत्त्वात् नृत्याभिमानिप्रभुतुल्यं तत्परिसरवर्तित्वेऽपि तद्राहित्यात् सभ्यपुरुषतुल्यान् विषयान् नानाविधविकारवत्त्वात् नर्तकीतुल्यां धियं च दीपयन् सुषुप्त्यादावहङ्काराद्यभावेऽपि दीप्यमानः चिदाभासविशिष्टाहङ्काररूपजीवभ्रमाधिष्ठानकूटस्थचैतन्यात्मा साक्षीति।", "padacchedaText": "", "audioFile": "PB_hear2read_000441.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000442", "originalText": "एवं जीवाद्विवेचितोऽयं साक्षी न ब्रह्मकोटिरपि, किं त्वस्पृष्टजीवेश्वरविभागं चैतन्यम्, इत्युक्तं कूटस्थदीपे।", "padacchedaText": "", "audioFile": "PB_hear2read_000442.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000443", "originalText": "तत्त्वप्रदीपिकायामपि मायाशबलिते सगुणे परमेश्वरे ‘केवलो निर्गुणः’ इति विशेषणानुपपत्तेः सर्वप्रत्यग्भूतं विशुद्धं ब्रह्म जीवाभेदेन साक्षीति प्रतिपद्यते इत्युदितम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000443.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000444", "originalText": "कौमुद्यां तु ‘एको देवः सर्वभूतेषु गूढःसर्वव्यापी सर्वभूतान्तरात्मा। कर्माध्यक्षः सर्वभूताधिवासः साक्षी चेता केवलो निर्गुणश्च॥", "padacchedaText": "", "audioFile": "PB_hear2read_000444.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000445", "originalText": "’ (श्वे.उ. ६. ११) इति देवत्वादिश्रुतेः परमेश्वरस्यैव रूपभेदः कश्चित् जीवप्रवृत्तिनिवृत्त्योरनुमन्ता स्वयमुदासीनः साक्षी नाम।", "padacchedaText": "", "audioFile": "PB_hear2read_000445.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000446", "originalText": "स च कारणत्वादिधर्मानास्पदत्वात् अपरोक्षो जीवगतमज्ञानाद्यवभासयंश्च जीवस्यान्तरङ्गः।", "padacchedaText": "", "audioFile": "PB_hear2read_000446.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000447", "originalText": "सुषुप्त्यादौ च कार्यकरणोपरमे जीवगताज्ञानमात्रस्य व्यञ्जकः प्राज्ञशब्दितः।", "padacchedaText": "", "audioFile": "PB_hear2read_000447.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000448", "originalText": "’तद्यथा प्रियया स्त्रिया सम्परिष्वक्तो न बाह्यं किञ्चन वेद नान्तरमेवमेवायं पुरुषः प्राज्ञेनात्मना सम्परिष्वक्तो न बाह्यं किञ्चन वेद नान्तरम्’ (बृ.उ. ४. ३. २१) ’प्राज्ञेनात्मनाऽन्वारूढ उत्सर्जन् याति’ (बृ.उ. ४. ३. ३५) इति श्रुतिवाक्याभ्यां सुषुप्त्युत्क्रान्त्यवस्थयोर्जीवाद्भेदेन प्रतिपादितः परमेश्वर इति सुषुप्त्युत्क्रान्त्यधिकरणे निर्णयोऽपि साक्षिपरः इत्युपवर्णितम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000448.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000449", "originalText": "तत्त्वशुद्धावपि ‘यथा इदं रजतमिति भ्रमस्थले वस्तुतः शुक्तिकोट्यन्तर्गतोऽपीदमंशः प्रतिभासतो रजतकोटिः तथा ब्रह्मकोटिरेव साक्षी प्रतिभासतो जीवकोटिरिति जीवस्य सुखादिव्यवहारे तस्योपयोगः’ इत्युक्त्या अयमेव पक्षः समर्थितः।", "padacchedaText": "", "audioFile": "PB_hear2read_000449.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000450", "originalText": "केचित्तु— अविद्योपाधिको जीव एव साक्षाद्द्रष्टृत्वात्साक्षी।", "padacchedaText": "", "audioFile": "PB_hear2read_000450.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000451", "originalText": "लोकेऽपि ह्यकर्तृत्वे सति द्रष्टृत्वं साक्षित्वं प्रसिद्धम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000451.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000452", "originalText": "तच्चासङ्गोदासीनप्रकाशरूपे जीवे एव साक्षात्सम्भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_000452.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000453", "originalText": "जीवस्यान्तःकरणतादात्म्यापत्त्या कर्तृत्वाद्यारोपभाक्त्वेऽपि स्वयमुदासीनत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000453.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000454", "originalText": "‘एको देवः’ इति मन्त्रस्तु ब्रह्मणो जीवभावाभिप्रयेण साक्षित्वप्रतिपादकः।", "padacchedaText": "", "audioFile": "PB_hear2read_000454.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000455", "originalText": "‘द्वा सुपर्णा’ इति (मु.उ. ३. १. १) मन्त्रः गुहाधिकरणन्यायेन जीवेश्वरोभयपरः गुहाधिकरणभाष्योदाहृतपैङ्गिरहस्यब्राह्मणव्याख्यातेन प्रकारेण जीवान्तःकरणोभयपरो वा, इति न कश्चिद्विरोधः इत्याहुः।", "padacchedaText": "", "audioFile": "PB_hear2read_000455.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000456", "originalText": "अन्ये तु— सत्यं जीव एव साक्षी, न तु सर्वगतेन अविद्योपहितेन रूपेण।", "padacchedaText": "", "audioFile": "PB_hear2read_000456.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000457", "originalText": "पुरुषान्तरान्तःकरणादीनामपि पुरुषान्तरं प्रति स्वान्तःकरणभासकसाक्षिसंसर्गाविशेषेण प्रत्यक्षत्वापत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000457.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000458", "originalText": "न चान्तःकरणभेदेन प्रमातृभेदात्तदनापत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000458.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000459", "originalText": "साक्षिभास्येऽन्तःकरणादौ सर्वत्र साक्ष्यभेदे सति प्रमातृभेदस्याप्रयोजकत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000459.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000460", "originalText": "तस्मादन्तःकरणोपधानेन जीवः साक्षी।", "padacchedaText": "", "audioFile": "PB_hear2read_000460.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000461", "originalText": "तथा च प्रतिपुरुषं साक्षिभेदात् पुरुषान्तरान्तःकरणादेः पुरुषान्तरसाक्ष्यसंसर्गाद्वा तदयोग्यत्वाद्वा अप्रकाश उपपद्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000461.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000462", "originalText": "सुषुप्तावपि सूक्ष्मरूपेणान्तःकरणसद्भावात् तदुपहितः साक्षी तदाप्यस्त्येव।", "padacchedaText": "", "audioFile": "PB_hear2read_000462.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000463", "originalText": "न च— अन्तःकरणोपहितस्य प्रमातृत्वेन न तस्य साक्षित्वम्, सुषुप्तौ प्रमात्रभावेऽपि साक्षिसत्त्वेन तयोर्भेदश्च अवश्यं वक्तव्यः— इति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000463.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000464", "originalText": "विशेषणोपाध्योर्भेदस्य सिद्धान्तसम्मतत्वेन अन्तःकरणविशिष्टः प्रमाता तदुपहितः साक्षी इति भेदोपपत्तेः इत्याहुः।", "padacchedaText": "", "audioFile": "PB_hear2read_000464.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000465", "originalText": "साक्षिचैतन्यस्य आवृतत्वानावृतत्वविचारः\nननु—उक्तरूपस्य साक्षिणःचैतन्यमात्रावारकेणाज्ञानेनावरणमवर्जनीयमिति कथमावृतेनाविद्याहङ्कारादिभानं— इति चेत् −\nराहुवदविद्या स्वावृतप्रकाशप्रकाश्येति केचित्।", "padacchedaText": "", "audioFile": "PB_hear2read_000465.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000466", "originalText": "वस्तुतः अविद्यान्तःकरणतद्धर्मावभासकं साक्षिचैतन्यं विहायैव अज्ञानं चैतन्यमावृणोतीति अनुभवानुसारेण कल्पनात् न कश्चिद्दोषः।", "padacchedaText": "", "audioFile": "PB_hear2read_000466.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000467", "originalText": "अत एव सर्वदा तेषाम् अनावृतप्रकाशसंसर्गात् अज्ञानविपरीतज्ञानसंशयागोचरत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000467.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000468", "originalText": "साक्ष्यानन्दस्यानावृतत्वविचारः\nसाक्षिचैतन्यस्यानावृतत्वे तत्स्वरूपभूतस्यानन्दस्यापि प्रकाशापत्तिरिति चेत्, न − इष्टापत्तेः, आनन्दरूपप्रकाशप्रयुक्तस्य आत्मनि निरुपाधिकप्रेम्णो दर्शनात्, ‘भासत एव परमप्रेमास्पदत्वलक्षणं सुखम्’ इति विवराणाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000468.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000469", "originalText": "स्यादेतत् − इदानीमप्यानन्दप्रकाशे मुक्तिसंसारयोरविशेषप्रसङ्गः।", "padacchedaText": "", "audioFile": "PB_hear2read_000469.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000470", "originalText": "ननु कल्पितभेदस्य साक्ष्यानन्दस्य प्रकाशेऽपि अनवच्छिन्नस्य ब्रह्मानन्दस्यावृतस्य संसारदशायामप्रकाशेन विशेषोऽस्तीति चेत्, न−आनन्देऽनवच्छेदांशस्यापुरुषार्थत्वात्, आनन्दपरोक्षमात्रस्य च इदानीमपि सत्त्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000470.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000471", "originalText": "ननु−अवच्छिन्नः साक्ष्यानान्दः सातिशयः, सुषुप्तिसाधारणादनतिस्पष्टात्ततो वैषयिकानन्देष्वतिशयानुभावात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000471.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000472", "originalText": "अनवच्छिन्नो ब्रह्मानन्दस्तु निरतिशयः।", "padacchedaText": "", "audioFile": "PB_hear2read_000472.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000473", "originalText": "आनन्दवल्ल्यां मानुषानन्दाद्युत्तरोत्तरशतगुणोत्कर्षोपवर्णनस्य ब्रह्मानन्दे समापनात्− इति चेत्, न−सिद्धान्ते साक्ष्यानन्दविषयानन्दब्रह्मानन्दानां वस्तुत एकत्वेन उत्कर्षापकर्षासम्भवात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000473.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000474", "originalText": "मानुषानन्दादीनामुत्तरोत्तरमुत्कर्षं श्रुतिर्वदतीति चेत्, को वा ब्रूते श्रुतिर्न वदतीति, किं तु अद्वैतवादे तदुपपादनमशक्यमित्युच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000474.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000475", "originalText": "नन्वेकस्यैव सौरालोकस्य करतलस्फटिकदर्पणाद्यभिव्यञ्जकविशेषोपधानेनाभिव्यक्तितारतम्यदर्शनात् एकत्वेऽप्यानन्दस्य अभिव्यञ्जकसुखवृत्तिभेदोपधानेनाभिव्यक्तितारतम्यरूपमुत्कर्षापकर्षवत्त्वं युक्तमिति चेत्, न— दृष्टान्तासम्प्रतिपत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000475.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000476", "originalText": "सर्वतः प्रसृमरस्य सौरालोकस्य गगने विना करतलादिसम्बन्धम् अस्पष्टं प्रकाशमानस्य निम्नतले प्रसृमरस्य जलस्येव करतलसम्बन्धेन गतिप्रतिहतौ बहुलीभावादधिकप्रकाशः, भास्वरदर्पणादिसम्बन्धेन गतिप्रतिहतौ बहुलीभावात्तदीयदीप्तिसंवलनाच्च ततोऽप्यधिकप्रकाशः, इति तत्राभिव्यञ्जकोपाधिकाभिव्यक्तितारतम्यानभ्युपगमात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000476.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000477", "originalText": "दृष्टान्तसम्प्रतिपत्तौ च गगनप्रसृतसौरालोकवत् अनवच्छिन्नानन्दस्यास्पष्टता, करतलाद्यवच्छिन्नसौरालोकवत् सुखवृत्त्यवच्छिन्नानन्दस्याधिकाभिव्यक्तिरिति मुक्तितः संसारस्यैव अभ्यर्हितत्वोपत्तेश्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000477.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000478", "originalText": "एतेन संसारदशायां प्रकाशमानोऽप्यानन्दो मिथ्याज्ञानतत्संस्कारविक्षिप्ततया तीव्रवायुविक्षिप्तप्रदीपप्रभावदस्पष्टं प्रकाशते, मुक्तौ तदभावात् यथावदवभासते इत्यपि − निरस्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000478.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000479", "originalText": "निर्विशेषस्वरूपानन्दे प्रकाशमाने तत्र विक्षेपदोषादप्रकाशमानस्य मुक्त्यन्वयिनोऽतिशयस्य असम्भवात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000479.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000480", "originalText": "तस्मात् साक्ष्यानन्दस्यानावृतत्वकल्पनमयुक्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000480.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000481", "originalText": "अत्राहुः अद्वैतविद्याचार्याः— यथा अत्युत्कृष्टस्य एकस्यैव धवलरूपस्य मालिन्यतारतम्ययुक्तेषु अनेकेषु दर्पणेषु प्रतिबिम्बे सति उपाधिमालिन्यतारतम्यात् तत्र तत्र प्रतिबिम्बे धावल्यापकर्षः तारतम्येनाध्यस्यते, एवं वस्तुतो निरतिशयस्य एकस्यैव स्वरूपानन्दस्य अन्तःकरणप्रतिबिम्बिततया साक्ष्यानन्दभावे प्राक्तनसुकृतसम्पत्त्यधीनविषयविशेषसम्पर्कप्रयुक्तसत्वोत्कर्षापकर्षरूपशुद्धितारतम्ययुक्तसुखरूपान्तःकरणवृत्तिप्रतिबिम्बिततया विषयानन्दभावे च तमोगुणरूपोपाधिमालिन्यतारतम्यदोषात् अपकर्षः तारतम्येनाध्यस्यते इति संसारदशायां प्रकाशमानेऽप्यानन्दे अध्यस्तापकर्षतारतम्येन सातिशयत्वादतृप्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000481.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000482", "originalText": "विद्योदये निखिलापकर्षाध्यासनिवृत्तेः अरोपितसातिशयत्वापायात् कृतकृत्यता, इति विशेषोपपत्तेः निरुपाधिकप्रेमगोचरतया प्रकाशमानः साक्ष्यानन्दोऽनावृत एवेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000482.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000483", "originalText": "अन्ये तु—प्रकाशमानोऽप्यानान्दः ‘मयि नास्ति न प्रकाशते’ इत्यावरणानुभवात् आवृत एव।", "padacchedaText": "", "audioFile": "PB_hear2read_000483.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000484", "originalText": "एकस्मिन्नपि साक्षिणि अविद्याकल्पितरूपभेदसम्भवेन चैतन्यरूपेणानावरणस्य आनन्दरूपेणावरणस्य चाविरोधात्, स्वरूप्रकाशस्यावरणानिवर्तकतया प्रकाशमाने आवरणस्याविरोधाच्च, ‘त्वदुक्तमर्थं न जानामि’ इति प्रकाशमान एवावरणदर्शनाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000484.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000485", "originalText": "न च तत्र अनावृतसामान्याकारावच्छेदेन विशेषावरणमेवानुभूयत इति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000485.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000486", "originalText": "अन्यावरणस्यान्यावच्छेदेन भानेऽतिप्रसङ्गात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000486.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000487", "originalText": "न च सामान्यविशेषभावो नियामक इति नातिप्रसङ्ग इति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000487.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000488", "originalText": "व्याप्यव्यापकभावातिरिक्तसामान्यविशेषभावाभावेन ‘वह्निं न जानामि’ इति धूमावारकाज्ञानानुभव प्रसङ्गात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000488.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000489", "originalText": "तस्मात् यदवच्छिन्नमज्ञानं प्रकाशते तदेवावृतमिति प्रकाशमानेऽप्यज्ञानं युज्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000489.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000490", "originalText": "अज्ञानं च यथा साक्ष्यंशं विहाय चैतन्यमावृणोति, एवमानन्दमपि तत्तत्सुखरूपवृत्तिकबलीकृतं विहायैवावृणोति।", "padacchedaText": "", "audioFile": "PB_hear2read_000490.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000491", "originalText": "स एव वैषयिकानन्दस्यावरणाभवः।", "padacchedaText": "", "audioFile": "PB_hear2read_000491.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000492", "originalText": "स चावरणाभिभवः प्रत्यूषसमये बाह्यावरणाभिभववत् कारणविशेषप्रयुक्तवृत्तिविशेषवशात् तरतमभावेन भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_000492.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000493", "originalText": "अतः स्वरूपानन्दविषयानन्दयोः विषयानन्दानां च परस्परं भेदसिद्धिः − इति वदन्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000493.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000494", "originalText": "सर्वथाऽपि साक्षिचैतन्यस्यानावृतत्वेन आवरणाभिभवार्थं वृत्तिमनपेक्ष्यैव तेन अहङ्कारादिप्रकाशनमिति तुल्यमेव।", "padacchedaText": "", "audioFile": "PB_hear2read_000494.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000495", "originalText": "केवलसाक्षिभास्यानां स्मरणोपपत्तिनिरूपणम्\nनन्वेवं कथमहङ्कारादीनामनुसन्धानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000495.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000496", "originalText": "ज्ञानसूक्ष्मावस्थारूपस्य संस्कारस्य ज्ञाने सत्ययोगेन नित्येन साक्षिणा तदाधानासम्भवात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000496.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000497", "originalText": "अत्र केचिदाहुः— स्वसंसृष्टेन साक्षिणा सदा भास्यमानोऽहङ्कारः तत्तद्घटादिविषयवृत्त्याकारपरिणतस्वावच्छिन्नेनापि साक्षिणा भास्यत इति तस्यानित्यत्वात् सम्भवति संस्काराधानं घटादौ विषय इव।", "padacchedaText": "", "audioFile": "PB_hear2read_000497.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000498", "originalText": "न हि स्वाकारवृत्त्यवच्छिन्नसाक्षिणैव स्वगोचरसंस्काराधानमिति नियमोऽस्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000498.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000499", "originalText": "तथा सति वृत्तिगोचरसंस्कारासम्भवेन वृत्तेरस्मरणप्रसङ्गात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000499.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000500", "originalText": "अनवस्थापत्त्या वृत्तिगोचरवृत्त्यन्तरस्य अनुव्यवसायनिरसनेन निरस्तत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000500.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000501", "originalText": "किं तु यद्वृत्त्यवच्छिन्नचैतन्ये यत् प्रकाशते तद्वृत्त्या तद्गोचरसंस्काराधानम् इत्येव नियमः।", "padacchedaText": "", "audioFile": "PB_hear2read_000501.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000502", "originalText": "एवं च ज्ञानसुखादयोऽपि अन्तःकरणवृत्तयः तप्तायःपिण्डाद्व्युच्चरन्तो विस्फुलिङ्गाः स्वावच्छिन्नेन वह्निनेव स्वस्वावच्छिन्नेन अनित्येन साक्षिणा भास्यन्त इति युक्तं तेष्वपि संस्काराधानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000502.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000503", "originalText": "यस्तु ‘घटैकाकारधीस्था चित् घटमेवावभासयेत्। घटस्य ज्ञातता ब्रह्मचैतन्येनावभास्यते॥", "padacchedaText": "", "audioFile": "PB_hear2read_000503.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000504", "originalText": "(पं.द. ८. ४) इति कूटस्थदीपोक्तः विषयविशेषणस्य ज्ञानस्य विषयावच्छिन्नब्रह्मचैतन्यावभास्यत्वपक्षः,यश्च तत्त्वप्रदीपिकोक्तो ज्ञानेच्छादीनामनवच्छिन्नशुद्धचैतन्यरूपनित्यसाक्षिभास्यत्वपक्षः, तयोरपि चैतन्यस्य स्वसंसृष्टापरोक्षरूपत्वात् वृत्तिसंसर्गोऽवश्यं वाच्य इति तत्संसृष्टानित्यरूपसद्भावात् न तेषु संस्काराधाने काचिदनुपपत्तिरिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000504.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000505", "originalText": "अन्ये तु— सुषुप्तावपि अविद्याद्यनुसन्धान सिद्धये कल्पिताम् अविद्यावृत्तिम् अहमाकारामङ्गीकृत्य अहमर्थे संस्कारमुपपादयन्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000505.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000506", "originalText": "न चास्मिन् पक्षे ‘एतावन्तं कालमिदमहं पश्यन्नेवासम्’ इति अन्यज्ञानधाराकालीनाहमर्थानुसन्धानानुपपत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000506.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000507", "originalText": "अवच्छेदकभेदेन सुखदुःखयौगपद्यवद्वृत्तिद्वययौगपद्यस्याप्यविरोधेन अन्यज्ञानधाराकालेऽपि अहमाकाराविद्यावृत्तिसन्तानसम्भवादिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000507.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000508", "originalText": "अपरे तु— अहमाकारा वृत्तिरन्तःकरणवृत्तिरेव।", "padacchedaText": "", "audioFile": "PB_hear2read_000508.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000509", "originalText": "किं तु उपासनादिवृत्तिवत् न ज्ञानम्, क्लृप्ततत्करणाजन्यत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000509.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000510", "originalText": "न हि तत्र चक्षुरादिप्रत्यक्षप्रमाणं सम्भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_000510.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000511", "originalText": "न वा लिङ्गादिकम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000511.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000512", "originalText": "लिङ्गादिप्रतिसन्धानशून्यस्याप्यहङ्कारानुसन्धानदर्शनात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000512.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000513", "originalText": "नापि मनः करणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000513.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000514", "originalText": "तस्योपादानभूतस्य क्वचिदपि करणत्वाक्लृप्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000514.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000515", "originalText": "तर्हि अहमर्थप्रत्यभिज्ञाऽपि ज्ञानं न स्यादिति चेत्, न— तस्या अहमंशे ज्ञनत्वाभावेऽपि तत्तांशे स्मृतिकरणत्वेन क्लृप्तसंस्कारजन्यतया ज्ञानत्वात्, अंशभेदेन ज्ञाने परोक्षत्वापरोक्षत्ववत् प्रमात्वाप्रमात्ववच्च ज्ञानत्वाज्ञानत्वयोरपि अविरोधात्— इत्याहुः।", "padacchedaText": "", "audioFile": "PB_hear2read_000515.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000516", "originalText": "इतरे तु— अहमाकाराऽपि वृत्तिर्ज्ञानमेव।", "padacchedaText": "", "audioFile": "PB_hear2read_000516.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000517", "originalText": "‘मामहं जानामि’ इत्यनुभवात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000517.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000518", "originalText": "न च करणासम्भवः।", "padacchedaText": "", "audioFile": "PB_hear2read_000518.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000519", "originalText": "अनुभवानुसारेण मनस एवान्तरिन्द्रियत्वस्येव करणत्वस्यापि कल्पनात्— इत्याहुः।", "padacchedaText": "", "audioFile": "PB_hear2read_000519.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000520", "originalText": "एवं सति बाह्यगोचरापरोक्षवृत्तीनामेव आवरणाभिभावकत्वनियमः पर्यवसन्नः।", "padacchedaText": "", "audioFile": "PB_hear2read_000520.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000521", "originalText": "भ्रमकारणीभूतेदमाकारवृत्तेरावरणाभिभावकत्वनिरूपणम्\nननु—नायमपि नियमः, शुक्तिरजतस्थले इदमाकारवृत्तेरज्ञानानभिभावकत्वात्, अन्यथा उपादानाभावेन रजतोत्पत्त्ययोगात् इति चेत्—\nअत्राहु:− इदमाकारवृत्त्या इदमंशाज्ञाननिवृत्तावपि शुक्तित्वादिविशेषांशाज्ञानानिवृत्तेः तदेव रजतोपादानम्, शुक्तित्वाद्यज्ञाने रजताध्यासस्य तज्ज्ञाने तदभावस्य अनुभूयमानत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000521.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000522", "originalText": "अध्यासभाष्यटीकाविवरणे अनुभूयमानान्वयव्यतिरेकस्यैवाज्ञानस्य रजताद्यध्यासोपादानत्वोक्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000522.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000523", "originalText": "अत एव शुक्त्यंशोऽधिष्ठानम्, इदमंश आधारः, सविलासाज्ञानविषयोऽधिष्ठानम्, अतद्रूपोऽपि तद्रूपेणारोप्यबुद्धौ स्फुरन् आधारः, इति सङ्क्षेपशारीरकेऽपि विवेचनादिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000523.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000524", "originalText": "अपरे तु इदं रजतमिति इदमंश सम्भिन्नत्वेन प्रतीयमानस्य रजतस्य इदमंशाज्ञानमेवोपादानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000524.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000525", "originalText": "तस्य च इदमाकारवृत्त्या आवरणशक्तिमात्रनिवृत्तावपि विक्षेपशक्त्या सह तदनुवृत्तेः नोपादानत्वासम्भवः।", "padacchedaText": "", "audioFile": "PB_hear2read_000525.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000526", "originalText": "जलप्रतिबिम्बितवृक्षाधोऽग्रत्वाध्यासे जीवन्मुक्त्यनुवृत्ते प्रपञ्चाध्यासे च सर्वात्मना अधिष्ठानसाक्षात्कारानन्तरभाविन्यामावरणनिवृत्तावपि विक्षेपशक्तिसहिताज्ञानमात्रस्योपादानत्वसम्प्रतिपत्तेः इत्याहुः।", "padacchedaText": "", "audioFile": "PB_hear2read_000526.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000527", "originalText": "कवितार्किकचक्रवर्तिनृसिंहभट्टोपाध्यायास्तु ‘इदं रजतम्’ इति भ्रमरूपवृत्तिव्यतिरेकेण रजतोत्पत्तेः प्राक् इदमाकारा वृत्तिरेव नास्तीति तस्याः अज्ञाननिवर्तकत्वसदसद्भावविचारं निरालम्बनं मन्यन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000527.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000528", "originalText": "तथा हि— न तावत् भ्रमरूपवृत्तिव्यतिरेकेण इदमाकारा वृत्तिः अनुभवसिद्धा।", "padacchedaText": "", "audioFile": "PB_hear2read_000528.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000529", "originalText": "ज्ञानद्वित्वाननुभवात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000529.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000530", "originalText": "नापि अधिष्ठानसामान्यज्ञानमध्यासकारणम् इति कार्यकल्प्या।", "padacchedaText": "", "audioFile": "PB_hear2read_000530.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000531", "originalText": "तस्याः तत्कारणत्वे मानाभावात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000531.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000532", "originalText": "न चाधिष्ठानसम्प्रयोगाभावे रजताद्यनुत्पत्तिस्तत्र मानम्, ततो दुष्टेन्द्रियसम्प्रयोगस्यैवाध्यासकारणत्वप्राप्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000532.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000533", "originalText": "न च − सम्प्रयोगो न सर्वभ्रमव्यापी, अधिष्ठानस्फुरणं तु स्वतः प्रकाशमाने प्रत्यगात्मनि अहङ्कारद्यध्यासमपि व्याप्नोतीति − वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000533.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000534", "originalText": "तस्यापि घटाद्यध्यासाव्यापित्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000534.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000535", "originalText": "घटादिप्रत्यक्षात् प्राक् तदधिष्ठानभूतनीरूपब्रह्ममात्रगोचरचाक्षुषवृत्तेरसम्भवात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000535.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000536", "originalText": "स्वरूपप्रकाशस्यावृतत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000536.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000537", "originalText": "आवृतानावृतसाधारण्येनाधिष्ठानप्रकाशमात्रस्याध्यासकारणत्वे शुक्तीदमंशसम्प्रयोगात् प्रागपि तदवच्छिन्नचैतन्यरूपप्रकाशस्यावृतस्य सद्भावेन तदाप्यध्यासापत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000537.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000538", "originalText": "न च − अध्याससामान्ये अधिष्ठानप्रकाशसामान्यं हेतुः, प्रातिभासिकाध्यासेऽभिव्यक्ताधिष्ठानप्रकाशः इति नातिप्रसङ्गः, सामान्ये सामान्यस्य विशेषे विशेषस्य हेतुत्वौचित्यादिति—वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000538.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000539", "originalText": "एवमपि प्रातिभासिकशङ्खपीतिमकूपजलनैल्याद्यध्यासाव्यापनात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000539.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000540", "originalText": "रूपानुपहितचाक्षुषप्रत्ययायोगेन तदानीं शङ्खादिगतशौक्ल्योपलम्भाभावेन च अध्यासात् प्राक् शङ्खादिनीरूपाधिष्ठानगोचरवृत्त्यसम्भवात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000540.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000541", "originalText": "न च प्रातिभासिकेष्वपि रजताद्यध्यासमात्रे निरिक्तो विशेषहेतुरास्तामिति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000541.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000542", "originalText": "तथा सति सम्प्रयोगात् प्राक् पीतशङ्खाद्यध्यासाप्रसङ्गाय तदध्यासे दुष्टेन्द्रियसम्प्रयोगः कारणमित्यवश्यं वक्तव्यतया तस्यैव सामान्यतः प्रातिभासिकाध्यासमात्रे लाघवात् कारणत्वसिद्धौ तत एव रजताद्यध्यासकादाचित्कत्वस्यापि निर्वाहात् अधिष्ठानप्रकाशस्य सामान्यतो विशेषतो वाऽध्यासकारणत्वस्यासिद्धेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000542.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000543", "originalText": "ननु − सादृश्यनिरपेक्षे अध्यासान्तरे अकारणत्वेऽपि तत्सापेक्षे रजताद्यध्यासे रजतादिसादृश्यभूतरूपविशेषादिविशिष्टधर्मिज्ञानरूपमधिष्ठानसामान्यज्ञानं कारणमवश्यं वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000543.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000544", "originalText": "दुष्टेन्द्रियसम्प्रयोगमात्रस्य कारणत्वे शुक्तिवत् इङ्गालेऽपि रजताध्यासप्रसङ्गात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000544.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000545", "originalText": "न च सादृश्यमपि विषयदोषत्वेन कारणमिति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000545.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000546", "originalText": "विसदृशेऽपि सादृश्यभ्रमे सति अध्याससद्भावात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000546.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000547", "originalText": "जलधिसलिलपूरे दूरे नीलशिलातलत्वा(ध्या)रोपदर्शनात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000547.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000548", "originalText": "न च ‘तद्धेतोरेवे’ति न्यायात् सादृश्यज्ञानसामग्र्येवाध्यासकारणमस्त्विति युक्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000548.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000549", "originalText": "ज्ञानसामग्र्या अर्थकारणत्वस्य क्वचिदप्यदृष्टेः, ततः सादृश्यज्ञानस्यैव लघुत्वाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000549.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000550", "originalText": "न च— स्वतश्शुभ्रेऽपि शुभ्रकलधौतभृङ्गारगतेऽपि स्वच्छे जल एव नैल्याध्यासः, न मुक्ताफले इति व्यवस्थावत् वस्तुस्वभावादेव शुक्तौ रजताध्यासः नेङ्गालादौ इति व्यवस्था, न तु सादृश्यज्ञानापेक्षणात्— इति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000550.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000551", "originalText": "स्वतः पटखण्डे पुण्डरीकमुकलत्वानध्यासेऽपि तत्रैव कर्तनादिघटिततदाकारे तदध्यासदर्शनेन तदध्यासस्य वस्तुस्वभावमननुरुध्य सादृश्यज्ञानभावाभावानुरोधित्वनिश्चयात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000551.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000552", "originalText": "अन्यथा अन्यदापि तत्र तदध्यासप्रसङ्गात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000552.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000553", "originalText": "उच्यते−सादृश्यज्ञानस्याध्यासकारणत्ववादेऽपि विशेषदर्शनप्रतिबध्येषु रजताद्यध्यासेष्वेव तस्य कारणत्वं वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000553.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000554", "originalText": "न तु तदप्रतिबध्येषु पीतशङ्खाद्यध्यासेषु, असम्भवात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000554.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000555", "originalText": "विशेषदर्शनप्रतिबध्येषु च प्रतिबन्धकज्ञानसामग्र्याः प्रतिबन्धकत्वनियमेन विशेषदर्शनसामग्र्यप्यवश्यं प्रतिबन्धिका वाच्येति तत एव सर्वव्यवस्थोपपत्तेः किं सादृश्यज्ञानस्य कारणत्वकल्पनया? तथा हि इङ्गालादौ चक्षुःसम्प्रयुक्ते तदीयनैल्यादिरूपविशेषदर्शनसामग्रीसत्त्वात् न रजताध्यासः।", "padacchedaText": "", "audioFile": "PB_hear2read_000555.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000556", "originalText": "शुक्त्यादावपि नीलभागादिव्यापिचक्षुःसम्प्रयोगे तत्सत्त्वात् न तदध्यासः।", "padacchedaText": "", "audioFile": "PB_hear2read_000556.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000557", "originalText": "सदृशभागमात्रसम्प्रयोगे तदभावादध्यासः।", "padacchedaText": "", "audioFile": "PB_hear2read_000557.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000558", "originalText": "तदापि शुक्तित्वरूपविशेषदर्शनसामग्रीसत्त्वादनध्यासप्रसङ्ग इति चेत्, न— अध्याससमये शुक्तित्वदर्शनाभावेन तत्पूर्वं तत्सामग्र्यभावस्य त्वयाऽपि वाच्यत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000558.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000559", "originalText": "मम सादृश्यज्ञानरूपाध्यासकारणदोषेण प्रतिबन्धात् तदा शुक्तित्वदर्शनसामग्र्यभावाभ्युपगमः, तव तथाभ्युपगमे तु घट्टकुटीप्रभातवृत्तान्त इति चेत्, न— समीपोपसर्पणानन्तरं रजतसादृश्यरूपे चाकचक्ये दृश्यमान एव शुक्तित्वोपलम्भेन तस्य तत्सामग्रीप्रतिबन्धकत्वासिद्धौ दूरत्वादिदोषेण प्रतिबन्धाद्वा व्यञ्जकनीलपृष्ठत्वादिग्राहकासमवधानाद्वा तत्सामग्र्यभावस्य वक्तव्यत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000559.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000560", "originalText": "एवं जलधिजले नियतनीलरूपाध्यासप्रयोजकदोषेण प्रतिबन्धात् दूरे नीरत्वव्यञ्जकतरङ्गादिग्राहकासमवधानेन च शौक्ल्यजलराशित्वादिरूपविशेषदर्शनसामग्र्यभावात् नीलशिलातलत्वाध्यासः।", "padacchedaText": "", "audioFile": "PB_hear2read_000560.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000561", "originalText": "विस्तृते पटे परिणाहरूपविशेषदर्शनसामग्रीसत्त्वात् न पुण्डरीकमुकुलत्वाध्यासः, कर्तनादि घटिततदाकारे तदभावात्तदध्यास इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000561.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000562", "originalText": "नन्वेवं करस्पृष्टे लोहशकले तदीयनीलरूपविशेषदर्शनसामग्र्यभावात् रजताध्यासः किं न भवेत्, सादृश्यज्ञानानपेक्षणात्− इति चेत्, भवत्येव।", "padacchedaText": "", "audioFile": "PB_hear2read_000562.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000563", "originalText": "किं तु ताम्रादिव्यावर्तकविशेषदर्शनसामग्र्या अप्यभावात् तदध्यासेनापि भाव्यमिति क्वचिदनेकाध्यासे संशयगोचरो भवति, क्वचित्तु रजतप्राये कोशगृहादौ रजताध्यास एव भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_000563.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000564", "originalText": "क्वचित् सत्यपि सादृश्यज्ञाने शुक्तिकादौ कदाचित् करणदोषाद्यभावेनाध्यासानुदयवत् अध्यासानुदयेऽपि न हानिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000564.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000565", "originalText": "तस्मात् न कार्यकल्प्या इदमाकारा वृत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000565.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000566", "originalText": "नाप्यप्रतिबद्धेदमर्थसम्प्रयोगकारणकल्प्या, ततो भवन्त्या एवेदंवृत्ते: दुष्टेन्द्रियसम्प्रयोगक्षुभिताविद्यापरिणामभूतस्वसमकालरजतविषयत्वस्यापि अस्माभिरुच्यमानत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000566.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000567", "originalText": "तत्र च ज्ञानसमकालोत्पत्तिके प्रतिभासमात्रविपरिवर्तिनि रजते तत्प्राचीनसम्प्रयोगाभावेऽपि तत्तादात्म्याश्रयेदमर्थसम्प्रयोगादेव तस्यापि चक्षुर्ग्राह्यत्वोपपत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000567.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000568", "originalText": "‘चक्षुषा रजतं पश्यामि’ इति प्रातिभासिकरजतस्य स्वसम्प्रयोगाभावेऽपि चाक्षुषत्वानुभवात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000568.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000569", "originalText": "न च − स्वसम्प्रयोगाभावादेव बाधकात् न तत् चाक्षुषम्, नापि दुष्टेन्द्रियसम्प्रयोगजन्यम् इदंवृत्तिसमकालं, ज्ञानकारणस्येन्द्रियसम्प्रयोगस्यार्थकारणत्वाक्लृप्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000569.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000570", "originalText": "किं तु इदंवृत्त्यनन्तरभावि तज्जन्यं तदभिव्यक्ते साक्षिण्यध्यासात् तद्भास्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000570.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000571", "originalText": "चाक्षुषत्वानुभवस्तु स्वभासकचैतन्याभिव्यञ्जकेदंवृत्तिजनकत्वेन परम्परया चक्षुरपेक्षामात्रेणेति−वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000571.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000572", "originalText": "तथा सति पीतशङ्खभ्रमे चक्षुरनपेक्षाप्रसङ्गात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000572.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000573", "originalText": "न हि तत्र शङ्खग्रहणे चक्षुरपेक्षा।", "padacchedaText": "", "audioFile": "PB_hear2read_000573.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000574", "originalText": "रूपं विना केवलशङ्खस्य चक्षुर्ग्राह्यत्वायोगात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000574.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000575", "originalText": "नापि पीतिमग्रहणे।", "padacchedaText": "", "audioFile": "PB_hear2read_000575.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000576", "originalText": "आरोप्यस्य ऐन्द्रियकत्वानभ्युपगमात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000576.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000577", "originalText": "न च— पीतिमा स्वरूपतो नाध्यस्यते किं तु नयनगतपित्तपीतिम्नोऽनुभूयमानस्य शङ्खे संसर्गमात्रमध्यस्यते इति पीतिमानुभवार्थमेव चक्षरपेक्षेति − वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000577.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000578", "originalText": "तथा सति शङ्खतत्संसर्गयोरप्रत्यक्षत्वप्रसङ्गात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000578.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000579", "originalText": "नयनप्रदेशगतपित्तपीतिमाकारवृत्त्यभिव्यक्तसाक्ष्यसंसर्गेण तयोस्तद्भास्यत्वासम्भवात्, पीतिमसंसृष्टशङ्खगोचरैकवृत्त्यनभ्युपगमाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000579.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000580", "originalText": "न च नयनप्रदेशस्थितस्य पित्तपीतिम्नो दोषात् शङ्खे संसर्गाध्यासो नोपेयते, किं तु नयनरश्मिभिः सह निर्गतस्य विषयव्यापिनस्तस्य तत्र संसर्गाध्यासः।", "padacchedaText": "", "audioFile": "PB_hear2read_000580.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000581", "originalText": "कुसुम्भारुणिम्न इव कौसुम्भे इति, सम्भवति तदाकारवृत्त्यभिव्यक्तसाक्षिसंसर्गः— इति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000581.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000582", "originalText": "तथा सति सुवर्णलिप्त इव पित्तोपहतनयनेन वीक्ष्यमाणे शङ्खे तदितरेषामपि पीतिमधीप्रसङ्गात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000582.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000583", "originalText": "न च— स पीतिमा समीपे गृहीत एव दूरे ग्रहीतुं शक्यः विहायसि उपर्युत्पतन् विहङ्गम इव, इतरेषां च समीपे न ग्रहणमिति—वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000583.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000584", "originalText": "इतरेषामपि तच्चक्षुर्निकटन्यस्तचक्षुषां पीतिमसामीप्यसत्त्वेन तद्ग्रहणस्य दुर्वारत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000584.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000585", "originalText": "एवमप्यतिधवलसिकतामयतलप्रवहदच्छनदीजले नैल्याध्यासे च गगननैल्याध्यासे रक्तवस्त्रेषु निशि चन्द्रिकायां नैल्याध्यासे च अनुभूयमानारोपस्य वक्तुमशक्यत्वेन तत्र नैल्यसंसृष्टाधिष्ठानगोचरचाक्षुषवृत्त्यनभ्युपगमे चक्षुरनुपयोगस्य दुष्परिहरत्वाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000585.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000586", "originalText": "अनास्वादिततिक्तरसस्य बालस्य मधुरे तिक्ततावभासो जन्मान्तरानुभवजन्यसंस्कारहेतुकः— इति प्रतिपादयता पञ्चपादिकाग्रन्थेन स्वरूपतोऽध्यस्यमानस्यैव तिक्तरसस्य ऐन्द्रियकत्वस्फुटीकरणाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000586.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000587", "originalText": "अन्यथा तत्र रसनाव्यापारापेक्षानुपपत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000587.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000588", "originalText": "तस्मात् उदाहृतनैल्याध्यासस्थलेष्वधिष्ठानसम्प्रयोगादेव तद्गोचरचाक्षुषवृत्तिसमकालोदयोऽध्यासः तस्या वृत्तेर्विषय इति तस्य चाक्षुषत्वमभ्युपगन्तव्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000588.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000589", "originalText": "रूपं विना केवलाधिष्ठानगोचरवृत्त्यभावे च विषयचैतन्याभिव्यक्त्यभावेन जलतदध्यस्तनैल्यादीनां तद्भास्यत्वायोगात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000589.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000590", "originalText": "तिक्तरसाध्यासस्थले तु अधिष्ठानाध्यासयोरेकेन्द्रियग्राह्यत्वाभावात् त्वगिन्द्रियजन्याधिष्ठानगोचरवृत्त्या तदवच्छिन्नचैतन्याभिव्यक्तौ पित्तोपहतरसनसम्प्रयोगादेव तत्र तिक्तरसाध्यासः तन्मात्रविषयरासनवृत्तिश्च समकालमुदेतीति तिक्तरसस्य रासनत्वमभ्युपगन्तव्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000590.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000591", "originalText": "त्वग्निन्द्रियजन्याधिष्ठानगोचरवृत्त्यभिव्यक्तचैतन्यभास्ये तिक्तरसे परम्परयापि रसनोपयोगाभावेन तत्र कथमपि प्रकारान्तरेण रासनत्वानुभवसमर्थनासम्भवात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000591.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000592", "originalText": "तथैव रजतस्यापि चाक्षुषत्वोपपत्तेः ‘पश्यामि’ इत्यनुभवो न बाधनीयः।", "padacchedaText": "", "audioFile": "PB_hear2read_000592.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000593", "originalText": "न च— असम्प्रयुक्तस्य रजतस्य चाक्षुषत्वे ‘प्रत्यक्षमात्रे विषयेन्द्रियसन्निकर्षः करणं’ ‘द्रव्यप्रत्यक्षे तत्संयोगः करणं’ ‘रजतप्रत्यक्षे रजतसंयोगः करणम्’ इति गृहीतानेककार्यकारणभावनियमभङ्गः स्यादिति— वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000593.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000594", "originalText": "सन्निकर्षत्वस्य संयोगाद्यनुगतस्यैकस्याभावेन आद्यनियमासिद्धेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000594.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000595", "originalText": "द्वितीयनियमस्य, नैयायिकरीत्या तमसीव संयोगायोग्ये क्वचिदद्रव्येऽपि द्रव्यत्वाध्याससम्भवत् व्यवहारदृष्ट्या यत् द्रव्यत्वाधिकरणं तद्विषयत्वेन, प्रातिभासिकरजते द्रव्यत्वस्य अधिष्ठानगतस्यैव इदन्त्ववत् अध्यासात् प्रतीत्यभ्युपगमेन च, द्वितीयनियमाविरोधात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000595.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000596", "originalText": "द्वितीयनियमरूपसामान्यकार्यकारणभावातिरेकेण विशिष्यापि कार्यकारणभावकल्पनाया गौरवपराहतत्वेन तृतीयनियमासिद्धेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000596.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000597", "originalText": "‘यत्सामान्ये यत्सामान्यं हेतुः तद्विशेषे तद्विशेषो हेतुः’ इति न्यायस्यापि, यत्र बीजाङ्कुरादौ सामान्यकार्यकारणभावमात्राभ्युपगमे बीजान्तरादङ्कुरान्तरोत्पत्त्यादिप्रसङ्गः तद्विषयत्वेन, ततोऽजागलस्तनायमानविशेषकार्यकारणभावासिद्धेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000597.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000598", "originalText": "न चात्रापि द्रव्यप्रत्यक्षे द्रव्यसंयोगः कारणमिति सामान्यनियममात्रोपगमे अन्यसंयोगादन्यद्रव्यप्रत्यक्षापत्तिरिति अतिप्रसङ्गोऽस्तीति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000598.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000599", "originalText": "तत्तद्द्रव्यप्रत्यक्षे तत्तद्द्रव्यसंयोगः कारणमिति नियमाभ्युपगमात्, अन्यथा तृतीयनियमेऽप्यतिप्रसङ्गस्य दुर्वारत्वात्, तस्मान्नास्ति क्लृप्तनियमभङ्गप्रसङ्गः।", "padacchedaText": "", "audioFile": "PB_hear2read_000599.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000600", "originalText": "किं चात्र क्लृप्तनियमभङ्गेऽपि न दोषः, ‘इदं रजतं पश्यामि, नीलं जलं पश्यामि’ इत्यादेरनन्यथासिद्धस्यानुभवस्य, प्रथमगृहीतानामपि प्रत्यक्षमात्रे विषयसन्निकर्षः कारणम् इत्यादिनियमानां व्यावहारिकविषये सङ्कोचकल्पनमन्तरेणोपपादनासम्भवात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000600.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000601", "originalText": "न चैवं सति ‘प्रमायां सन्निकर्षः कारणं न भ्रमे’ इत्यापि सङ्कोचकल्पनासम्भवात्, असन्निकृष्टस्यैव देशान्तरस्थस्य रजतस्य इहारोपापत्तिरिति अन्यथाख्यातिवादप्रसारिका।", "padacchedaText": "", "audioFile": "PB_hear2read_000601.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000602", "originalText": "अभिव्यक्तचैतन्यावकुण्ठनशून्यस्य देशान्तरस्थस्य रजतस्य आपरोक्ष्यानुपपत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000602.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000603", "originalText": "ख्यातिबाधानुपपत्त्यादिभिर्भ्रमविषयस्यानिर्वचनीयत्वसिद्धेश्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000603.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000604", "originalText": "न चाधिष्ठानसम्प्रयोगमात्रात् प्रातिभासिकस्यैन्द्रियकत्वोपगमे शुक्तिरजताध्याससमये तत्रैव कालान्तरे अध्यसनीयस्य रङ्गस्यापि चाक्षुषत्वं कुतो न स्यादिति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000604.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000605", "originalText": "रजताध्याससमये रङ्गरजतसाधारणचाकचक्यदर्शनाविशेषेऽपि यतो रागादिरूपपुरुषदोषाभावादितस्तत्र तदा न रङ्गाध्यासः तत एव मया तद्विषयवृत्त्यनुदयस्याभ्युपगमात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000605.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000606", "originalText": "तस्मात् इदमंशसम्भिन्नरजतगोचरा एकैव वृत्तिः इन्द्रियजन्या।", "padacchedaText": "", "audioFile": "PB_hear2read_000606.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000607", "originalText": "न ततः प्रागिदमाकारा वृत्तिरिति नात्र इयमज्ञाननिवर्तकत्वसदसद्भावचिन्ता कार्येति।", "padacchedaText": "", "audioFile": "PB_hear2read_000607.mp3", "zipFile": "Siddhantaleshasangraha.zip"}, {"id": "B_000608", "originalText": "वृत्तिनिर्गमनप्रयोजनविचारः\nअन्ये तु— ‘अधिष्ठानज्ञानमध्यासकारणमि’ति इदमाकारां वृत्तिमुपेत्य तदभिव्यक्तेनैव साक्षिणा तदध्यस्तस्य रजतस्य अवभाससम्भवात् तद्भासकसाक्ष्यभिव्यञ्जिकया तयैवेदंवृत्त्या रजतविषयसंस्काराधानोपपत्तेश्च रजताकारवृत्तिर्व्यर्थेति—मन्यन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000608.mp3", "zipFile": "Siddhantal
