    <script>
        const WORKER_URL = "https://bhashya-audio-worker.anantachaitanya108.workers.dev";
        const BUCKET_NAME = "prakarana";

        const manifest = [{"id": "B_000000", "originalText": "श्रीधरस्वामिविरचितं\nस्वात्मबोधामृतम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_000000.mp3", "zipFile": "Svatmabodhamrita.zip"}, {"id": "B_000001", "originalText": "अहं भासकं बोधरूपं स्वनिष्ठं\n स्वतो भास यद्गाति चिद्रूपमेकम्। निजानन्दमक्षुब्धरूपं प्रशान्तं\n न भिन्नं न तस्मात्परं नावरञ्च॥ १॥", "padacchedaText": "", "audioFile": "PB_hear2read_000001.mp3", "zipFile": "Svatmabodhamrita.zip"}, {"id": "B_000002", "originalText": "न दृश्यं तथोदृश्यमस्माद्विभिन्नं\n यदा भात्यहं मानरूपेण नित्यम्। स्वदिप्त्या स्वयं शान्तमद्वैतमात्रं\n विभिन्नं कथं तत्प्रपश्ये स्वयं यत्॥ २॥", "padacchedaText": "", "audioFile": "PB_hear2read_000002.mp3", "zipFile": "Svatmabodhamrita.zip"}, {"id": "B_000003", "originalText": "यदा नेति नेतीति सर्वं निरस्तं\n किमाभाति तस्याद्विभिन्न च तस्मिन्। अहं सम्म्फुरेत्तस्यं तस्मिंस्तदात्म्यं\n चिदानन्दरूपस्ततोऽहं ततोऽहम्॥ ३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000003.mp3", "zipFile": "Svatmabodhamrita.zip"}, {"id": "B_000004", "originalText": "यदा भान्ति दृश्यं स्वतो नैव यस्मात्\n स्वतःसिध्द मद्वैतदृङ्मात्रमेकम्। अहं वेदनं तस्य कस्माद्विभाति\n ततोऽहं परं ब्रह्म सच्चितसुखं यत्॥ ४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000004.mp3", "zipFile": "Svatmabodhamrita.zip"}, {"id": "B_000005", "originalText": "निरस्ताखिलं ज्ञेयमस्मापितःस्यात\n यदा किं तदा ज्ञानमात्राद्विभिन्नम्। अहं संस्फुरेत्कस्य तस्मिमन्स्तदानीं\n परब्रह्म चिन्मात्ररूपं ततोऽहम्॥ ५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000005.mp3", "zipFile": "Svatmabodhamrita.zip"}, {"id": "B_000006", "originalText": "अवश्यं यदा दृश्यमेवं च वेत्तुं\n अहं यत्तदाद्यन्त सिध्दं न दृश्यम्। यदाद्यन्त सिध्दं हि मध्येऽपि तावत्\n त्रिकालाद्वयं दृश्यभिन्नं ततोऽहम्॥ ६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000006.mp3", "zipFile": "Svatmabodhamrita.zip"}, {"id": "B_000007", "originalText": "अहं यस्फुटं तन्नशून्यं कथं चित्\n त्रिकालस्थितेः क्वाप्यभावो न तस्य। त्रिकालस्थितं किं भजेद्गिन्नरूपं\n अहं यत्सदैकस्वरूपं चिदेव॥ ७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000007.mp3", "zipFile": "Svatmabodhamrita.zip"}, {"id": "B_000008", "originalText": "जडं यन्न तत्कारणं कस्यचित्स्यात्\n ततः सर्वकार्यस्य हेतुश्चिदेव। यदाद्यन्तमध्येऽस्ति तस्मिन्स्वनिष्ठं\n ह्ययं यस्फुरेत्तत्कथं स्याज्जडं यत्॥ ८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000008.mp3", "zipFile": "Svatmabodhamrita.zip"}, {"id": "B_000009", "originalText": "यदा कारणं ज्ञानरूपं स्वसिध्दं\n जडं नो भवेत्तत्तदा किं जडं स्यात्। जडं तत्स्वतो नैव यद्गाति यस्मात्\n अहंयच्चिदेव स्वदिप्त्या जडं किम्॥ ९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000009.mp3", "zipFile": "Svatmabodhamrita.zip"}, {"id": "B_000010", "originalText": "विकल्पाज्जडं कार्यमाभाति चेत्तत्\n भवेन्नैव सत्यं न भातं स्वतश्च। स्वभातं हि यत्स्याद्विकल्पो न तज्जः\n अहं तिद्गभानं विकल्पो न कार्यम्॥ १०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000010.mp3", "zipFile": "Svatmabodhamrita.zip"}, {"id": "B_000011", "originalText": "यदा गाभ्यपायि स्वयं कार्यमत्र\n स्वतःसिध्दिमत्कारणं नो तथास्यात्। यदुत्पत्तिनाशाद्विमुक्तञ्च तस्मिन्\n यदुप्तत्तिनाशात्मकं तत्कथं स्यात्॥ ११॥", "padacchedaText": "", "audioFile": "PB_hear2read_000011.mp3", "zipFile": "Svatmabodhamrita.zip"}, {"id": "B_000012", "originalText": "त्रिपुट्यात्मकं भाति भानं च यास्मिन\n सुखप्राप्तये कार्यमेतद्वदन्ति। सुखेनैव भिन्नं यतःस्यात्स्वसिध्दे\n त्रिपुट्यात्मकं कार्यमस्ति निरर्थम्॥ १२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000012.mp3", "zipFile": "Svatmabodhamrita.zip"}, {"id": "B_000013", "originalText": "यदेकं सुखं स्वप्रभं स्वात्ममात्रं\n न भोक्ता न भोग्यं च तन्नैव भोगः। भ्रमाच्चेदिदं तन्नसत्यं यदा स्यात्\n सत्यीस्यसत्यं भ्रमो वौद्वयं सत्॥ १३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000013.mp3", "zipFile": "Svatmabodhamrita.zip"}, {"id": "B_000014", "originalText": "द्वयं यान्निरस्य स्वयं यद्विशिष्येत्\n द्वयं नैव तस्मिंस्तदेवाद्वयं हि। तदेवाद्वयं यत्स्फुरेत्स्वेन भासा\n ह्यहङ्कारतस्तन्न भिन्नात्मकं स्यात॥ १४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000014.mp3", "zipFile": "Svatmabodhamrita.zip"}, {"id": "B_000015", "originalText": "कथं सत्यमिथ्यात्मकं कार्यमेकं\n यदा सर्वकार्यं जडं तन्मृषैवम्। स्वतः सिध्दिमत्कारणे सर्वकार्यं\n निरर्थं यतःकृत्स्न भेदो वृथा स्यात॥ १५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000015.mp3", "zipFile": "Svatmabodhamrita.zip"}, {"id": "B_000016", "originalText": "न कायर्ं तथा स्थूलसूक्ष्मात्मकं यत्\n परस्मिंश्च तत्कारणे क्वापि भिन्नम्। यतो नित्यमेकं परब्रह्मशान्तं\n न भिन्नं ततःक्वाप्यभिन्नं न कार्यम्॥ १६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000016.mp3", "zipFile": "Svatmabodhamrita.zip"}, {"id": "B_000017", "originalText": "भवेत्तत्कृतं कारणान्तं च विश्वं\n अहं यत्तयोर्भाति मध्ये च कस्मात्। अहं चिद्यदा संस्फुरेत्तन्न कार्यात्\n ततश्चित्स्वतोऽहं बहुत्वं न भिन्नम्॥ १७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000017.mp3", "zipFile": "Svatmabodhamrita.zip"}, {"id": "B_000018", "originalText": "यदा भाति किञ्चिध्द्यहं भानतम्तत्\n अहं दृक्च दृश्यं न मन्ये कथं चित्। विरुध्दं न चैकास्पदं स्या तस्तत्\n अहं यत्स्बतो भानतस्तद्वयं न॥ १८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000018.mp3", "zipFile": "Svatmabodhamrita.zip"}, {"id": "B_000019", "originalText": "अनन्तं स्वतो भातमद्वैतमात्रं\n कथं चिन्न तद्यद्वणोतीह यस्मात्। जगज्जीवविश्वेशभानं वृथा हि\n यदा भाव्यते मायिङ्क कथ्यते तत्॥ १९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000019.mp3", "zipFile": "Svatmabodhamrita.zip"}, {"id": "B_000020", "originalText": "न यस्योपलब्धिः प्रमाणप्रसिध्दा\n न यद्गाति शक्यं न यस्मात्सुतृप्तिः। विभानं च तत्स्यान्मृषा मायिकंवा\n न सत्यात्मके साधने तन्नियोज्यम्॥ २०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000020.mp3", "zipFile": "Svatmabodhamrita.zip"}, {"id": "B_000021", "originalText": "सुखं यन्न तत्स्याज्जडं कार्यतोऽपि\n जडं कार्यमस्मान्न तद्वा कदाचित। स्वतः पूर्णवत्कारणस्य स्वदृष्टया\n कथं चिन्न भिन्नं किमाप्तव्यमन्यत्॥ २१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000021.mp3", "zipFile": "Svatmabodhamrita.zip"}, {"id": "B_000022", "originalText": "चिदानन्दमात्रैकरूपे स्वसिध्दे\n कथं तस्य तद्गिन्नरूपप्रसक्तिः। न माया न मायाकृतं भिन्नकार्यं\n विवेकादविद्या च चाविद्यकं वा॥ २२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000022.mp3", "zipFile": "Svatmabodhamrita.zip"}, {"id": "B_000023", "originalText": "विशिष्येतभिन्न सुखं चानवाप्तं\n न तृप्तिं भजेत्साति लोके मनुष्यः। सुखं सर्वङ्गं स्वात्मसर्वातिभूतं\n प्रपश्यन्भजेत्कोऽपि तृप्तिं च मुक्तिम्॥ २३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000023.mp3", "zipFile": "Svatmabodhamrita.zip"}, {"id": "B_000024", "originalText": "न शोको न मोहो न दुःखं सुखस्य\n ह्यहं तत्सुखं निश्चयान्नित्यतृप्तीः। न शोको न मोहो न दुःखन्न जन्म\n विकारो न मृत्युर्भवेत्क्वापि तस्य॥ २४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000024.mp3", "zipFile": "Svatmabodhamrita.zip"}, {"id": "B_000025", "originalText": "यदा भिन्नतस्तत्सुखं भोग्यरूपं\n सुखाद्गिन्नतोयं भवेद्दुःखरूपम्। वितृष्णः सुखी पूर्णकामोन तृप्तः\n भवेस्मिन्नसौ चक्रवद्गामितः स्यात्॥ २५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000025.mp3", "zipFile": "Svatmabodhamrita.zip"}, {"id": "B_000026", "originalText": "स्वभिन्नं सुखं तज्जडं दृश्यरूपं\n भवेद्देहलाभश्च भोगाय तस्य। स्वदुःखोपशान्त्यै भवेद्गोगतृष्णा\n ततः कर्म तज्जं फलं जन्म तस्मात्॥ २६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000026.mp3", "zipFile": "Svatmabodhamrita.zip"}, {"id": "B_000027", "originalText": "जडश्चाशुची रुग्णदेहःक्षयिष्णुः\n न भोगेषु तृप्तिः सुदुष्टेन्द्रियाणि। धनेच्छासु रागादिकात्स्याद्विकर्म\n ह्यहो पापकं जन्मदुःखप्रदं हि॥ २७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000027.mp3", "zipFile": "Svatmabodhamrita.zip"}, {"id": "B_000028", "originalText": "सुखं देहजं प्राप्तये जन्मयोग्यं\n यदागामि नश्यत्सुखं जन्मना तत्। स्वभासाक्षरं दिव्यसौख्यस्वरूपं\n स्वयं तद्यतस्तत्कृते जन्म न स्यात्॥ २८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000028.mp3", "zipFile": "Svatmabodhamrita.zip"}, {"id": "B_000029", "originalText": "सदा मृत्युभीतिर्ह्यहो जीवनाशा\n ज्वलत्कामपीडा सुदुर्वृत्तचित्तम्। सदैवातिचिन्ता भवेज्जीविकायाः\n अहो कष्टमेतद्गवेज्जन्मना यत्॥ २९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000029.mp3", "zipFile": "Svatmabodhamrita.zip"}, {"id": "B_000030", "originalText": "इहद्वारभूतं त्रयं विश्रुतं च\n प्रवेष्टुं बलान्मृत्युसंसारभीतेंः। धनेच्छा च जिव्हा च कान्ताच तद्यों\n रुणाद्गिस्वयं भौर्न तस्यास्ति काचित्॥ ३०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000030.mp3", "zipFile": "Svatmabodhamrita.zip"}, {"id": "B_000031", "originalText": "विहीनश्च कामादिकेभ्यः पुमान्यः\n स युक्तः सुखीत्यब्रवीद्वासुदेव। त्यजेत्कामलोभौ च कोपस्तृतीयः\n त्रिधाद्वारमेतत्स्फुटं दुर्गतेस्तत्॥ ३१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000031.mp3", "zipFile": "Svatmabodhamrita.zip"}, {"id": "B_000032", "originalText": "प्रवृत्या निवृत्या यथा शुक्यमेतत्\n त्यजेदेव यब्दाधिकं ब्रह्ममार्गे। सदा वासनात्याग एव प्रशस्तः\n न सत्यस्थितावस्ति सौख्यं विभिन्नम्॥ ३२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000032.mp3", "zipFile": "Svatmabodhamrita.zip"}, {"id": "B_000033", "originalText": "सदा वासनात्याग एव प्रशस्तः\n न सत्यस्थितावस्ति सौख्यं विभिन्नम्। त्यजेद्ग्राम्यसौख्यं विवेकाच्च दोषात्\n यदेकं परं तत्सुखं चिन्तितव्यम्॥ ३३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000033.mp3", "zipFile": "Svatmabodhamrita.zip"}, {"id": "B_000034", "originalText": "विमुक्तं यदा भोग्यभावात्सुवृत्तं\n चिदेवं स्वयं चित्तमेतत्तदानीम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000034.mp3", "zipFile": "Svatmabodhamrita.zip"}, {"id": "B_000035", "originalText": "क्षणध्वंसि यत्तद्विवेकान्निवार्यं\n यदा चित्तनेतच्चिदेव स्वयं स्यात्। स्वतःपूर्णचित्सौख्यर्सिधौ नभिन्नं\n किमस्तीह कर्तव्यतास्य स्वबोधात्॥ ३४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000035.mp3", "zipFile": "Svatmabodhamrita.zip"}, {"id": "B_000036", "originalText": "यदा भाविन्त तीव्रवेगेन किञ्चित्\n सतन्निश्चयात्तद्गवेच्छिघ्रमेव। अहं ब्रह्मवृत्याहि भूमाहमेव\n ह्यहं देहहवृत्या हि देहोहमेव॥ ३५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000036.mp3", "zipFile": "Svatmabodhamrita.zip"}, {"id": "B_000037", "originalText": "श्रुतिस्तत्त्वमस्यादिवाक्यैश्च नित्यं\n निराकृत्य जीवेश्वरौ नेति वक्ति। परं शुध्द मद्वैतसच्चित्सुखं यत्\n त्वमेवासि तद्ब्रह्मबोधं ददाति॥ ३६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000037.mp3", "zipFile": "Svatmabodhamrita.zip"}, {"id": "B_000038", "originalText": "स्वतोऽहं ततं सर्ववेदेषु यत्स्यात्\n विशोध्यं तदौपाधिकाब्दन्धमोक्षात्। अहम्ब्रह्ममात्रं हि वेदा वदन्ति\n ह्यविद्या न विद्या न जीवेश्वरौ तत्॥ ३७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000038.mp3", "zipFile": "Svatmabodhamrita.zip"}, {"id": "B_000039", "originalText": "जडं यन्न तस्यास्ति भानं हि यस्मात्\n स्वभानं ततो ब्रह्मणःस्यादहं यत्। न सर्वादिहेतुर्भवेद्ब्रह्मकार्यं\n तोऽहं जडं तन्न चिद्रूपमेव॥ ३८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000039.mp3", "zipFile": "Svatmabodhamrita.zip"}, {"id": "B_000040", "originalText": "अहंवृत्तितः सर्वमेवं विभाति\n स्वभासा स्ववृत्तेरहं पूर्वमस्याः। अहंवृत्यभावे न विश्वं स्वनिष्ठं\n क्वचिन्नाप्यभावेहमस्तस्य वृत्तिः॥ ३९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000040.mp3", "zipFile": "Svatmabodhamrita.zip"}, {"id": "B_000041", "originalText": "जडा वृत्तिरस्याश्च यत्तज्जडं स्या—\n तहं यत्स्वतो भासकं यश्चिदेव। अवस्थात्रयातीतमेकं विशुद्वं\n स्वतःशाश्वतं ब्रह्म नश्येश्च कस्मात्॥ ४०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000041.mp3", "zipFile": "Svatmabodhamrita.zip"}, {"id": "B_000042", "originalText": "तरङ्गेषु नीरं यथा व्यापकं स्यात्\n तथा सर्वकार्येष्वहं नित्यमेकम्। तरङ्गस्य रूपादिबाधे जलं तत्\n अहं विश्वरूपादिबाधे चिदेव॥ ४१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000042.mp3", "zipFile": "Svatmabodhamrita.zip"}, {"id": "B_000043", "originalText": "यदा कार्यसिद्विर्हि कस्मादपि स्यात्\n जडं तत्स्वयङ्कारणात्काशितं हि। स्वभासा स्वयं चित्स्वतः केवलं यत्\n अहं भानतस्तस्य भावाद्विभाति॥ ४२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000043.mp3", "zipFile": "Svatmabodhamrita.zip"}, {"id": "B_000044", "originalText": "चिदं च त्यतोऽहं स्वरूपेण सर्वं\n भवेदात्मरूपं हि कार्यस्य तस्मात्। अहं यो विभासेऽस्ति सर्वस्य देहे—\n यमात्मा परब्रह्म वेदस्य वाणी॥ ४३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000044.mp3", "zipFile": "Svatmabodhamrita.zip"}, {"id": "B_000045", "originalText": "यदेकं च वेदादिभिः स्तूयमानं\n चिदानन्दसद्रूपमेवाहमत्र। किमाभाति मायाकृतङ्कार्यमस्मिन्\n न भोग्यं ततो नैव भेक्ता न भोगः॥ ४४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000045.mp3", "zipFile": "Svatmabodhamrita.zip"}, {"id": "B_000046", "originalText": "अमारूपविश्वस्य भानं चिदेतत्\n अभारूपभोग्यस्य भानं चिदेतत्। अमारूपदेहस्य भानं चिदेतत्\n चिदेवस्यं भोग्य भोक्ता न भोगः॥ ४५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000046.mp3", "zipFile": "Svatmabodhamrita.zip"}, {"id": "B_000047", "originalText": "यदाभाति यस्मान्न भिन्नं ततस्तत्\n चिदेवस्वयं कार्यतो यद्विभाति। अहं नैव भिन्नं भवेत्तस्य तस्मात्\n अहं भानतो भानमेतच्चिदेव॥ ४६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000047.mp3", "zipFile": "Svatmabodhamrita.zip"}, {"id": "B_000048", "originalText": "चिदेवं च जीवश्चिदेवेश्वरो हि\n चिदेव तथा देहतो विच्वतोऽपि। चिदेवस्वयं सर्वभावे विभाति\n स्वतः पूर्णतस्तत्स्वयं स्वेन भासा॥ ४७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000048.mp3", "zipFile": "Svatmabodhamrita.zip"}, {"id": "B_000049", "originalText": "यथा नैव भिन्नो घटो मृत्तिकायाः\n तथैवात्र मन्तव्यमेतश्चिदेव। न मृत्साभवन्नामरूपं घटस्य\n चिदेवं तथाहं न कार्यात्मकं स्यात्॥ ४८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000049.mp3", "zipFile": "Svatmabodhamrita.zip"}, {"id": "B_000050", "originalText": "यथा रज्जुरेका विदोशस्य भिन्ना\n फणी रज्जुतो भीरभीतेश्च हेतुः। तथा ज्ञस्य विज्ञस्य विश्वं द्विधा हि\n भयं चाभयं भोग्यभूमास्वरूपम्॥ ४९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000050.mp3", "zipFile": "Svatmabodhamrita.zip"}, {"id": "B_000051", "originalText": "निजाज्ञानतोज्ञस्य विश्वं सुदुःखं\n जडो भोग्यबुध्या हि दुःखं प्रयाति। निजज्ञानतो ज्ञस्य भूमा स्वरूपं\n सुविज्ञः सुखी भोगबुध्द्याविहीनः॥ ५०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000051.mp3", "zipFile": "Svatmabodhamrita.zip"}, {"id": "B_000052", "originalText": "जगत्सत्यकार्यात्मदृष्टयेक्षतेज्ञः\n असत्यं जगत्कार्यमेवेक्षते ज्ञः। कृतीज्ञः मुखं कारणाद्वीक्ष्य धन्यः\n ह्यतृप्तः सुखं कार्यतोवीक्ष्य चाज्ञः॥ ५१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000052.mp3", "zipFile": "Svatmabodhamrita.zip"}, {"id": "B_000053", "originalText": "वितृष्णो ह्यपूर्णः स्वदेहात्मवेदी\n वितृष्णश्च पूर्णः स्वभूमात्मवेदी। न देशान्न कालात्तथा वस्तुतोऽपि\n परिच्छेद एवं न तज्ज्ञानतोस्य॥ ५२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000053.mp3", "zipFile": "Svatmabodhamrita.zip"}, {"id": "B_000054", "originalText": "अविद्यां न मायां न जीवेश्वरो वा\n न भोग्यं न भोगं नरं नैव नारीम्। न बन्धं न मोक्षं जनुर्नैव मृत्युं\n न विश्वं न पिण्डं समीक्षेत विद्वान॥ ५३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000054.mp3", "zipFile": "Svatmabodhamrita.zip"}, {"id": "B_000055", "originalText": "स्वभानात्मकं वीक्ष्य संर्व यदेतत्\n स्वचिद्रूपमेकं विमृग्य स्वनिष्ठः। अहं ब्रह्म जीवो न तस्यास्ति किञ्चित्\n सदा निर्विकल्पः स्वमात्रोऽस्ति विद्वान्॥ ५४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000055.mp3", "zipFile": "Svatmabodhamrita.zip"}, {"id": "B_000056", "originalText": "स्वरूपं सदा सर्वतः पूर्णमेकं\n समीक्ष्य स्वभिन्नं न पश्येन्निजेऽस्मिन्। न माया न मायाकृतं कार्यमस्मिन्\n स तत्सश्चिदानन्दमद्वैतमात्रः॥ ५५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000056.mp3", "zipFile": "Svatmabodhamrita.zip"}, {"id": "B_000057", "originalText": "प्रकाशेत सर्वं च यत्पूर्णरूपं\n चितोऽहं स्वसंवेदनं स्याद्यदातु। किमाभाति तस्माद्विभिन्नं च तस्मिन्\n चिदेवाद्वयं स्वेन भासा चकास्ति॥ ५६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000057.mp3", "zipFile": "Svatmabodhamrita.zip"}, {"id": "B_000058", "originalText": "पुमान्स्वात्मबोधामृतं प्राप्य तृप्तो\n न मुह्येत्कदा माययाविद्यया वा। वितन्वन्स्वसौख्यं प्रकाशोत्र लोके\n स्वमात्रः सदा गाजते विश्वपूज्यः॥ ५७॥॥", "padacchedaText": "", "audioFile": "PB_hear2read_000058.mp3", "zipFile": "Svatmabodhamrita.zip"}, {"id": "B_000059", "originalText": "इति श्रीमत्परमहंसपरिव्राजकाचार्य सद्गुरु भगवता॥", "padacchedaText": "", "audioFile": "PB_hear2read_000059.mp3", "zipFile": "Svatmabodhamrita.zip"}, {"id": "B_000060", "originalText": "श्री श्रीधरस्वामिविरचितं स्वात्मबोधामृतं सम्पूर्णम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_000060.mp3", "zipFile": "Svatmabodhamrita.zip"}];
        const contentDiv = document.getElementById('content');
        
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let currentSource = null;
        let isPlaying = false;
        
        const speedSlider = document.getElementById('speed-slider');
        const speedDisplay = document.getElementById('speed-display');
        speedSlider.oninput = function() {
            if (currentSource) {
                currentSource.playbackRate.value = this.value;
            }
            speedDisplay.innerText = parseFloat(this.value).toFixed(1);
        };
        
        const playPauseBtn = document.getElementById('play-pause-btn');
        playPauseBtn.onclick = async () => {
            if (isPlaying) {
                if (currentSource) {
                    currentSource.onended = null;
                    currentSource.stop();
                    currentSource = null;
                }
                isPlaying = false;
                playPauseBtn.innerText = "Resume";
            } else {
                if (currentIndex >= 0) {
                    playAudio(currentIndex);
                } else {
                    playAudio(0);
                }
                playPauseBtn.innerText = "Stop";
            }
        };
        
        let currentIndex = -1;

        manifest.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'sentence';
            div.id = 'sentence-' + index;
            
            const idSpan = document.createElement('span');
            idSpan.className = 'sentence-id';
            idSpan.innerText = '[' + item.id + ']';
            
            const textSpan = document.createElement('span');
            textSpan.innerText = item.originalText;
            
            div.appendChild(idSpan);
            div.appendChild(textSpan);
            
            div.onclick = () => {
                playPauseBtn.innerText = "Stop";
                playAudio(index);
            };
            contentDiv.appendChild(div);
        });
        
        // --- Web Audio API Prefetching Logic ---
        const PREFETCH_BUFFER_SIZE = 3;
        let prefetchQueue = new Map(); // index -> AudioBuffer

        function getAudioUrl(index) {
            if (index < 0 || index >= manifest.length) return null;
            const item = manifest[index];
            const zipToUse = item.zipFile || ZIP_NAME;
            return WORKER_URL + '/' + BUCKET_NAME + '/' + zipToUse + '/' + item.audioFile;
        }

        async function fetchAndDecode(url) {
            const response = await fetch(url);
            if (!response.ok) throw new Error("HTTP " + response.status);
            const arrayBuffer = await response.arrayBuffer();
            return await audioCtx.decodeAudioData(arrayBuffer);
        }

        async function prefetchNext(fromIndex) {
            for (let i = fromIndex + 1; i <= fromIndex + PREFETCH_BUFFER_SIZE; i++) {
                if (i >= manifest.length) break;
                if (!prefetchQueue.has(i)) {
                    prefetchQueue.set(i, 'fetching');
                    const url = getAudioUrl(i);
                    try {
                        const audioBuffer = await fetchAndDecode(url);
                        if (prefetchQueue.get(i) === 'fetching') {
                            prefetchQueue.set(i, audioBuffer);
                        }
                    } catch (err) {
                        console.error("Prefetch failed for index", i, err);
                        prefetchQueue.delete(i);
                    }
                }
            }
            // Cleanup old buffers to free memory
            for (let [key, val] of prefetchQueue.entries()) {
                if (key < fromIndex) {
                    prefetchQueue.delete(key);
                }
            }
        }
        // ------------------------

        async function playAudio(index) {
            if (index < 0 || index >= manifest.length) {
                isPlaying = false;
                playPauseBtn.innerText = "Start Reading";
                return;
            }
            
            if (currentSource) {
                currentSource.onended = null;
                currentSource.stop();
                currentSource = null;
            }
            
            if (currentIndex >= 0) {
                const prevDiv = document.getElementById('sentence-' + currentIndex);
                if (prevDiv) prevDiv.classList.remove('active');
            }
            
            currentIndex = index;
            const item = manifest[currentIndex];
            
            const currentDiv = document.getElementById('sentence-' + currentIndex);
            if (currentDiv) {
                currentDiv.classList.add('active');
                currentDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            
            // Resume AudioContext if it was suspended (browser autoplay policy)
            if (audioCtx.state === 'suspended') {
                await audioCtx.resume();
            }
            
            try {
                let audioBuffer;
                if (prefetchQueue.has(index) && prefetchQueue.get(index) !== 'fetching') {
                    audioBuffer = prefetchQueue.get(index);
                } else {
                    const sourceUrl = getAudioUrl(index);
                    audioBuffer = await fetchAndDecode(sourceUrl);
                }
                
                currentSource = audioCtx.createBufferSource();
                currentSource.buffer = audioBuffer;
                currentSource.playbackRate.value = document.getElementById('speed-slider').value;
                currentSource.connect(audioCtx.destination);
                
                currentSource.onended = () => { playAudio(currentIndex + 1); };
                currentSource.start(0);
                isPlaying = true;
                
            } catch (e) {
                console.error("Audio play error:", e);
                // Fallback to next track if error
                setTimeout(() => playAudio(currentIndex + 1), 500);
            }
            
            // Trigger prefetch for upcoming sentences
            prefetchNext(index);
        }
    </script>
