 {"id": "B_000033", "originalText": "चक्षुषो विषयः रूपग्रहणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000033.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000034", "originalText": "रसनाया विषयः रसग्रहणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000034.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000035", "originalText": "घ्राणस्य विषयः गन्धग्रहणम् इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000035.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000036", "originalText": "वाक्पाणिपादपायूपस्थानीति पञ्चकर्मेन्द्रियाणि।", "padacchedaText": "", "audioFile": "PB_hear2read_000036.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000037", "originalText": "वाचो देवता वह्निः।", "padacchedaText": "", "audioFile": "PB_hear2read_000037.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000038", "originalText": "हस्तयोरिन्द्रः।", "padacchedaText": "", "audioFile": "PB_hear2read_000038.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000039", "originalText": "पादयोर्विष्णुः।", "padacchedaText": "", "audioFile": "PB_hear2read_000039.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000040", "originalText": "पायोर्मृत्युः।", "padacchedaText": "", "audioFile": "PB_hear2read_000040.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000041", "originalText": "उपस्थस्य प्रजापतिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000041.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000042", "originalText": "इति कर्मेन्द्रियदेवताः।", "padacchedaText": "", "audioFile": "PB_hear2read_000042.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000043", "originalText": "वाचो विषयः भाषणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000043.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000044", "originalText": "पाण्योर्विषयः वस्तुग्रहणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000044.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000045", "originalText": "पादयोर्विषयः गमनम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000045.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000046", "originalText": "पायोर्विषयः मलत्यागः।", "padacchedaText": "", "audioFile": "PB_hear2read_000046.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000047", "originalText": "उपस्थस्य विषयः आनन्द इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000047.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000048", "originalText": "कारणशरीरं किम्?\nअनिर्वाच्यानाद्यविद्यारूपं शरीरद्वयस्य कारणमात्रं\nसत्स्वरूपाऽज्ञानं निर्विकल्पकरूपं यदस्ति तत्कारणशरीरम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000048.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000049", "originalText": "अवस्थात्रयं किम्?\nजाग्रत्स्वप्नसुषुप्त्यवस्थाः।", "padacchedaText": "", "audioFile": "PB_hear2read_000049.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000050", "originalText": "जाग्रदवस्था का?\nश्रोत्रादिज्ञानेन्द्रियैः शब्दादिविषयैश्च ज्ञायते इति यत् \nसा जाग्रदावस्था।", "padacchedaText": "", "audioFile": "PB_hear2read_000050.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000051", "originalText": "स्थूल शरीराभिमानी आत्मा विश्व इत्युच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000051.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000052", "originalText": "स्वप्नावस्था केति चेत्?\nजाग्रदवस्थायां यद्दृष्टं यद् श्रुतम्\nतज्जनितवासनया निद्रासमये यः प्रपञ्चः प्रतीयते सा \nस्वप्नावस्था।", "padacchedaText": "", "audioFile": "PB_hear2read_000052.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000053", "originalText": "सूक्ष्मशरीराभिमानी आत्मा तैजस इत्युच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000053.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000054", "originalText": "अतः सुषुप्त्यवस्था का?\nअहं किमपि न जानामि सुखेन मया निद्राऽनुभूयत इति \nसुषुप्त्यवस्था।", "padacchedaText": "", "audioFile": "PB_hear2read_000054.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000055", "originalText": "कारणशरीराभिमानी आत्मा प्राज्ञ इत्युच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000055.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000056", "originalText": "पञ्च कोशाः के?\nअन्नमयः प्राणमयः मनोमयः विज्ञानमयः आनन्दमयश्चेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000056.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000057", "originalText": "अन्नमयः कः?\nअन्नरसेनैव भूत्वा अन्नरसेनैव वृद्धिं प्राप्य अन्नरूपपृथिव्यां\nयद्विलीयते तदन्नमयः कोशः स्थूलशरीरम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000057.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000058", "originalText": "प्राणमयः कः?\nप्राणाद्याः पञ्चवायवः वागादीन्द्रियपञ्चकं प्राणमयः कोशः।", "padacchedaText": "", "audioFile": "PB_hear2read_000058.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000059", "originalText": "मनोमयः कोशः कः?\nमनश्च ज्ञानेन्द्रियपञ्चकं मिलित्वा यो भवति स मनोमयः कोशः।", "padacchedaText": "", "audioFile": "PB_hear2read_000059.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000060", "originalText": "विज्ञानमयः कः?\nबुद्धिज्ञानेन्द्रियपञ्चकं मिलित्वा यो भवति स विज्ञानमयः कोशः।", "padacchedaText": "", "audioFile": "PB_hear2read_000060.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000061", "originalText": "आनन्दमयः कः?\nएवमेव कारणशरीरभूताविद्यास्थमलिनसत्त्वं \nप्रियादिवृत्तिसहितं सत् आनन्दमयः कोशः।", "padacchedaText": "", "audioFile": "PB_hear2read_000061.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000062", "originalText": "एतत्कोशपञ्चकम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000062.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000063", "originalText": "मदीयं शरीरं मदीयाः प्राणाः मदीयं मनश्च \nमदीया बुद्धिर्मदीयं अज्ञानमिति स्वेनैव ज्ञायते \nतद्यथा मदीयत्वेन ज्ञातं कटककुण्डल गृहादिकं \nस्वस्माद्भिन्नं तथा पञ्चकोशादिकं स्वस्माद्भिन्नम्\nमदीयत्वेन ज्ञातमात्मा न भवति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000063.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000064", "originalText": "आत्मा तर्हि कः?\nसच्चिदानन्दस्वरूपः।", "padacchedaText": "", "audioFile": "PB_hear2read_000064.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000065", "originalText": "सत्किम्?\nकालत्रयेऽपि तिष्ठतीति सत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000065.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000066", "originalText": "चित्किम्?\nज्ञानस्वरूपः।", "padacchedaText": "", "audioFile": "PB_hear2read_000066.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000067", "originalText": "आनन्दः कः?\nसुखस्वरूपः।", "padacchedaText": "", "audioFile": "PB_hear2read_000067.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000068", "originalText": "एवं सच्चिदानन्दस्वरूपं स्वात्मानं विजानीयात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000068.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000069", "originalText": "अथ चतुर्विंशतितत्त्वोत्पत्तिप्रकारं वक्ष्यामः।", "padacchedaText": "", "audioFile": "PB_hear2read_000069.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000070", "originalText": "ब्रह्माश्रया सत्त्वरजस्तमोगुणात्मिका माया अस्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000070.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000071", "originalText": "ततः आकाशः सम्भूतः।", "padacchedaText": "", "audioFile": "PB_hear2read_000071.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000072", "originalText": "आकाशाद् वायुः।", "padacchedaText": "", "audioFile": "PB_hear2read_000072.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000073", "originalText": "वायोस्तेजः।", "padacchedaText": "", "audioFile": "PB_hear2read_000073.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000074", "originalText": "तेजस आपः।", "padacchedaText": "", "audioFile": "PB_hear2read_000074.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000075", "originalText": "अभ्धयः पृथिवी।", "padacchedaText": "", "audioFile": "PB_hear2read_000075.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000076", "originalText": "एतेषां पञ्चतत्त्वानां मध्ये \nआकाशस्य सात्विकांशात् श्रोत्रेन्द्रियं सम्भूतम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000076.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000077", "originalText": "वायोः सात्विकांशात् त्वगिन्द्रियं सम्भूतम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000077.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000078", "originalText": "अग्नेः सात्विकांशात् चक्षुरिन्द्रियं सम्भूतम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000078.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000079", "originalText": "जलस्य सात्विकांशात् रसनेन्द्रियं सम्भूतम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000079.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000080", "originalText": "पृथिव्याः सात्विकांशात् घ्राणेन्द्रियं सम्भूतम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000080.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000081", "originalText": "एतेषां पञ्चतत्त्वानां समष्टिसात्विकांशात् \nमनोबुद्ध्यहङ्कार चित्तान्तःकरणानि सम्भूतानि।", "padacchedaText": "", "audioFile": "PB_hear2read_000081.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000082", "originalText": "सङ्कल्पविकल्पात्मकं मनः।", "padacchedaText": "", "audioFile": "PB_hear2read_000082.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000083", "originalText": "निश्चयात्मिका बुद्धिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000083.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000084", "originalText": "अहंकर्ता अहंकारः।", "padacchedaText": "", "audioFile": "PB_hear2read_000084.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000085", "originalText": "चिन्तनकर्तृ चित्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000085.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000086", "originalText": "मनसो देवता चन्द्रमाः।", "padacchedaText": "", "audioFile": "PB_hear2read_000086.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000087", "originalText": "बुद्धे ब्रह्मा।", "padacchedaText": "", "audioFile": "PB_hear2read_000087.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000088", "originalText": "अहंकारस्य रुद्रः।", "padacchedaText": "", "audioFile": "PB_hear2read_000088.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000089", "originalText": "चित्तस्य वासुदेवः।", "padacchedaText": "", "audioFile": "PB_hear2read_000089.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000090", "originalText": "एतेषां पञ्चतत्त्वानां मध्ये \nआकाशस्य राजसांशात् वागिन्द्रियं सम्भूतम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000090.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000091", "originalText": "वायोः राजसांशात् पाणीन्द्रियं सम्भूतम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000091.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000092", "originalText": "वन्हेः राजसांशात् पादेन्द्रियं सम्भूतम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000092.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000093", "originalText": "जलस्य राजसांशात् उपस्थेन्द्रियं सम्भूतम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000093.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000094", "originalText": "पृथिव्या राजसांशात् गुदेन्द्रियं सम्भूतम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000094.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000095", "originalText": "एतेषां समष्टिराजसांशात् पञ्चप्राणाः सम्भूताः।", "padacchedaText": "", "audioFile": "PB_hear2read_000095.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000096", "originalText": "एतेषां पञ्चतत्त्वानां तामसांशात्\nपञ्चीकृतपञ्चतत्त्वानि भवन्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000096.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000097", "originalText": "पञ्चीकरणं कथम् इति चेत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000097.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000098", "originalText": "एतेषां पञ्चमहाभूतानां तामसांशस्वरूपम्\nएकमेकं भूतं द्विधा विभज्य एकमेकमर्धं पृथक्\nतूष्णीं व्यवस्थाप्य अपरमपरमर्धं चतुर्धां विभज्य\nस्वार्धमन्येषु अर्धेषु स्वभागचतुष्टयसंयोजनं कार्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000098.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000099", "originalText": "तदा पञ्चीकरणं भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_000099.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000100", "originalText": "एतेभ्यः पञ्चीकृतपञ्चमहाभूतेभ्यः स्थूलशरीरं भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_000100.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000101", "originalText": "एवं पिण्डब्रह्माण्डयोरैक्यं सम्भूतम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000101.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000102", "originalText": "स्थूलशरीराभिमानि जीवनामकं ब्रह्मप्रतिबिम्बं भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_000102.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000103", "originalText": "स एव जीवः प्रकृत्या स्वस्मात् ईश्वरं भिन्नत्वेन जानाति।", "padacchedaText": "", "audioFile": "PB_hear2read_000103.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000104", "originalText": "अविद्योपाधिः सन् आत्मा जीव इत्युच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000104.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000105", "originalText": "मायोपाधिः सन् ईश्वर इत्युच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000105.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000106", "originalText": "एवं उपाधिभेदात् जीवेश्वरभेददृष्टिः यावत्पर्यन्तं तिष्ठति\nतावत्पर्यन्तं जन्ममरणादिरूपसंसारो न निवर्तते।", "padacchedaText": "", "audioFile": "PB_hear2read_000106.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000107", "originalText": "तस्मात्कारणान्न जीवेश्वरयोर्भेदबुद्धिः स्वीकार्या।", "padacchedaText": "", "audioFile": "PB_hear2read_000107.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000108", "originalText": "ननु साहंकारस्य किंचिज्ज्ञस्य जीवस्य निरहंकारस्य सर्वज्ञस्य\nईश्वरस्य तत्त्वमसीति महावाक्यात् कथमभेदबुद्धिः स्यादुभयोः \nविरुद्धधर्माक्रान्तत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000108.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000109", "originalText": "इति चेन्न।", "padacchedaText": "", "audioFile": "PB_hear2read_000109.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000110", "originalText": "स्थूलसूक्ष्मशरीराभिमानी त्वंपदवाच्यार्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000110.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000111", "originalText": "उपाधिविनिर्मुक्तं समाधिदशासम्पन्नं शुद्धं चैतन्यं \nत्वंपदलक्ष्यार्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000111.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000112", "originalText": "एवं सर्वज्ञत्वादिविशिष्ट ईश्वरः तत्पदवाच्यार्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000112.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000113", "originalText": "उपाधिशून्यं शुद्धचैतन्यं तत्पदलक्ष्यार्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000113.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000114", "originalText": "एवं च जीवेश्वरयो चैतन्यरूपेणाऽभेदे बाधकाभावः।", "padacchedaText": "", "audioFile": "PB_hear2read_000114.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000115", "originalText": "एवं च वेदान्तवाक्यैः सद्गुरूपदेशेन च सर्वेष्वपि \nभूतेषु येषां\nब्रह्मबुद्धिरुत्पन्ना ते जीवन्मुक्ताः इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000115.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000116", "originalText": "ननु जीवन्मुक्तः कः?\nयथा देहोऽहं पुरुषोऽहं ब्राह्मणोऽहं शूद्रोऽहमस्मीति \nदृढनिश्चयस्तथा नाहं ब्राह्मणः न शूद्रः न पुरुषः \nकिन्तु असंगः सच्चिदानन्द स्वरूपः प्रकाशरूपः सर्वान्तर्यामी\nचिदाकाशरूपोऽस्मीति दृढनिश्चय \nरूपोऽपरोक्षज्ञानवान् जीवन्मुक्तः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000116.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000117", "originalText": "ब्रह्मैवाहमस्मीत्यपरोक्षज्ञानेन निखिलकर्मबन्धविनिर्मुक्तः \nस्यात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000117.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000118", "originalText": "कर्माणि कतिविधानि सन्तीति चेत् \nआगामिसञ्चितप्रारब्धभेदेन त्रिविधानि सन्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000118.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000119", "originalText": "ज्ञानोत्पत्त्यनन्तरं ज्ञानिदेहकृतं पुण्यपापरूपं कर्म \nयदस्ति तदागामीत्यभिधीयते।", "padacchedaText": "", "audioFile": "PB_hear2read_000119.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000120", "originalText": "सञ्चितं कर्म किम्?\nअनन्तकोटिजन्मनां बीजभूतं सत् यत्कर्मजातं पूर्वार्जितं \nतिष्ठति तत् सञ्चितं ज्ञेयम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000120.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000121", "originalText": "प्रारब्धं कर्म किमिति चेत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000121.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000122", "originalText": "इदं शरीरमुत्पाद्य इह लोके एवं सुखदुःखादिप्रदं यत्कर्म \nतत्प्रारब्धं\nभोगेन नष्टं भवति प्रारब्धकर्मणां भोगादेव क्षय इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000122.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000123", "originalText": "सञ्चितं कर्म ब्रह्मैवाहमिति निश्चयात्मकज्ञानेन नश्यति।", "padacchedaText": "", "audioFile": "PB_hear2read_000123.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000124", "originalText": "आगामि कर्म अपि ज्ञानेन नश्यति किंच आगामि कर्मणां\nनलिनीदलगतजलवत् ज्ञानिनां सम्बन्धो नास्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000124.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000125", "originalText": "किंच ये ज्ञानिनं स्तुवन्ति भजन्ति अर्चयन्ति तान्प्रति \nज्ञानिकृतं आगामि पुण्यं गच्छति।", "padacchedaText": "", "audioFile": "PB_hear2read_000125.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000126", "originalText": "ये ज्ञानिनं निन्दन्ति द्विषन्ति दुःखप्रदानं कुर्वन्ति तान्प्रति\nज्ञानिकृतं सर्वमागामि क्रियमाणं यदवाच्यं कर्म\nपापात्मकं तद्गच्छति।", "padacchedaText": "", "audioFile": "PB_hear2read_000126.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000127", "originalText": "सुहृदः पुण्यकृतं दुर्हृदः पापकृत्यं गृह्णन्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000127.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000128", "originalText": "तथा चात्मवित्संसारं तीर्त्वा ब्रह्मानन्दमिहैव प्राप्नोति।", "padacchedaText": "", "audioFile": "PB_hear2read_000128.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000129", "originalText": "तरति शोकमात्मवित् इति श्रुतेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000129.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000130", "originalText": "तनुं त्यजतु वा काश्यां श्वपचस्य गृहेऽथ वा।", "padacchedaText": "", "audioFile": "PB_hear2read_000130.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000131", "originalText": "ज्ञानसम्प्राप्तिसमये मुक्ताऽसौ विगताशयः।", "padacchedaText": "", "audioFile": "PB_hear2read_000131.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000132", "originalText": "इति स्मृतेश्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000132.mp3", "zipFile": "Tattvabodha.zip"}, {"id": "B_000133", "originalText": "इति श्रीशङ्करभगवत्पादाचार्यप्रणीतः तत्त्वबोधप्रकरणं समाप्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000133.mp3", "zipFile": "Tattvabodha.zip"}];
        const contentDiv = document.getElementById('content');
        
        let currentIndex = -1;
        let isPlaying = false;
        
        // Use standard HTML5 audio to preserve pitch on speed changes
        const audioEl = new Audio();
        audioEl.preservesPitch = true;
        
        const speedSlider = document.getElementById('speed-slider');
        const speedDisplay = document.getElementById('speed-display');
        speedSlider.oninput = function() {
            audioEl.playbackRate = this.value;
            speedDisplay.innerText = parseFloat(this.value).toFixed(1);
        };
        
        let currentScript = 'devanagari';
        const scriptSelect = document.getElementById('script-select');
        scriptSelect.onchange = function() {
            currentScript = this.value;
            document.querySelectorAll('.sentence-text').forEach((span, index) => {
                let origText = manifest[index].originalText;
                if (currentScript === 'devanagari') {
                    span.innerText = origText;
                } else {
                    span.innerText = Sanscript.t(origText, 'devanagari', currentScript);
                }
            });
        };
        
        const playPauseBtn = document.getElementById('play-pause-btn');
        playPauseBtn.onclick = () => {
            if (isPlaying) {
                audioEl.pause();
                isPlaying = false;
                playPauseBtn.innerText = "Resume";
            } else {
                playAudio(Math.max(0, currentIndex));
                playPauseBtn.innerText = "Stop";
            }
        };
        
        manifest.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'sentence';
            div.id = 'sentence-' + index;
            
            const idSpan = document.createElement('span');
            idSpan.className = 'sentence-id';
            idSpan.innerText = '[' + item.id + ']';
            
            const textSpan = document.createElement('span');
            textSpan.className = 'sentence-text';
            textSpan.innerText = item.originalText;
            
            div.appendChild(idSpan);
            div.appendChild(textSpan);
            
            div.onclick = () => {
                playPauseBtn.innerText = "Stop";
                playAudio(index);
            };
            contentDiv.appendChild(div);
        });
        
        // --- HTML5 Audio Prefetching Logic (via Blob URLs) ---
        const PREFETCH_BUFFER_SIZE = 3;
        let prefetchQueue = new Map(); // index -> Blob URL

        function getAudioUrl(index) {
            if (index < 0 || index >= manifest.length) return null;
            const item = manifest[index];
            const zipToUse = item.zipFile || ZIP_NAME;
            return WORKER_URL + '/' + BUCKET_NAME + '/' + zipToUse + '/' + item.audioFile;
        }

        async function fetchBlobUrl(url) {
            const response = await fetch(url);
            if (!response.ok) throw new Error("HTTP " + response.status);
            const blob = await response.blob();
            return URL.createObjectURL(blob);
        }

        async function prefetchNext(fromIndex) {
            for (let i = fromIndex + 1; i <= fromIndex + PREFETCH_BUFFER_SIZE; i++) {
                if (i >= manifest.length) break;
                if (!prefetchQueue.has(i)) {
                    prefetchQueue.set(i, 'fetching');
                    const url = getAudioUrl(i);
                    try {
                        const blobUrl = await fetchBlobUrl(url);
                        if (prefetchQueue.get(i) === 'fetching') {
                            prefetchQueue.set(i, blobUrl);
                        } else {
                            URL.revokeObjectURL(blobUrl);
                        }
                    } catch (err) {
                        console.error("Prefetch failed for index", i, err);
                        prefetchQueue.delete(i);
                    }
                }
            }
            // Cleanup old blobs to free memory
            for (let [key, val] of prefetchQueue.entries()) {
                if (key < fromIndex) {
                    if (typeof val === 'string' && val.startsWith('blob:')) {
                        URL.revokeObjectURL(val);
                    }
                    prefetchQueue.delete(key);
                }
            }
        }
        // ------------------------

        async function playAudio(index) {
            if (index < 0 || index >= manifest.length) {
                isPlaying = false;
                playPauseBtn.innerText = "Start Reading";
                return;
            }
            
            if (currentIndex >= 0) {
                const prevDiv = document.getElementById('sentence-' + currentIndex);
                if (prevDiv) prevDiv.classList.remove('active');
            }
            
            currentIndex = index;
            
            const currentDiv = document.getElementById('sentence-' + currentIndex);
            if (currentDiv) {
                currentDiv.classList.add('active');
                currentDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            
            audioEl.pause();
            
            try {
                let audioUrl;
                if (prefetchQueue.has(index) && prefetchQueue.get(index) !== 'fetching') {
                    audioUrl = prefetchQueue.get(index);
                } else {
                    const sourceUrl = getAudioUrl(index);
                    audioUrl = await fetchBlobUrl(sourceUrl);
                }
                
                audioEl.src = audioUrl;
                audioEl.playbackRate = speedSlider.value;
                audioEl.onended = () => { playAudio(currentIndex + 1); };
                
                await audioEl.play();
                isPlaying = true;
                
            } catch (e) {
                console.error("Audio play error:", e);
                // Fallback to next track if error
                setTimeout(() => playAudio(currentIndex + 1), 500);
            }
            
            // Trigger prefetch for upcoming sentences
            prefetchNext(index);
        }
    </script>
</body>
