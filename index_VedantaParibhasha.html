करणदोषस्यासम्भावितदोषवेदजन्यज्ञानेन बाध्यमानत्वात्।", "padacchedaText": "", "audioFile": "PB_000773.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000774", "originalText": "अन्यथा चन्द्रगताधिकपरिमाणग्राहि—ज्योतिःशास्त्रस्य चन्द्रप्रादेशग्राहिप्रत्यक्षेण बाधापत्तेः।", "padacchedaText": "", "audioFile": "PB_000774.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000775", "originalText": "पाकरक्ते घटे \"रक्तोऽयम्।", "padacchedaText": "", "audioFile": "PB_000775.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000776", "originalText": "न श्यामः\" इतिवत् \" सविशेषणे हि\" इति न्यायेन जीवपरभेदग्राहिप्रत्यक्षस्य विशेषणीभूतधर्मभेदविषयत्वाच्च।", "padacchedaText": "", "audioFile": "PB_000776.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000777", "originalText": "अत एव नानुमानमपि प्रमाणम्, आगमविरोधात्, मेरुपाषाणमयत्वानुमानवत्।", "padacchedaText": "", "audioFile": "PB_000777.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000778", "originalText": "नाप्यागमान्तरविरोधः।", "padacchedaText": "", "audioFile": "PB_000778.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000779", "originalText": "तत्परातत्परवाक्ययोस्तत्परवाक्यस्य बलवत्वेन लोकसिद्धभेदानुवादि— \" द्वा सुपर्णा\"— इत्यादिवाक्यापेक्षया उपक्रमोपसंहाराद्यवगताद्वैततात्पर्यविशिष्टस्य तत्त्वमस्यादिवाक्यस्य प्रबलत्वात्।", "padacchedaText": "", "audioFile": "PB_000779.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000780", "originalText": "न च जीवपरैक्ये विरुद्धधर्माश्रयत्वानुपपत्तिः।", "padacchedaText": "", "audioFile": "PB_000780.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000781", "originalText": "शीतस्यैव जलस्यौपाधिकौष्ण्याश्रयत्ववत् स्वभावतो निर्गुणस्यैव जीवस्यान्तःकरणाद्युपाधिककर्तृत्वाद्याश्रयत्वप्रतिभासोपपत्तेः।", "padacchedaText": "", "audioFile": "PB_000781.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000782", "originalText": "यदि च जलादावौष्ण्यमारोपितम्, तदा प्रकृतेऽपि तुल्यम्।", "padacchedaText": "", "audioFile": "PB_000782.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000783", "originalText": "न च सिद्धान्ते कर्तृत्वस्य क्वचिदप्यभावादारोप्यप्रमाहितसंस्काराभावे कथमारोपः इति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_000783.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000784", "originalText": "लाघवेनारोप्यविषयकसंस्कारत्वेनैव तस्य हेतुत्वात्।", "padacchedaText": "", "audioFile": "PB_000784.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000785", "originalText": "न च प्राथमिकारोपे का गतिः, कर्तृत्वाद्यध्यासप्रवाहस्यानादित्वात्।", "padacchedaText": "", "audioFile": "PB_000785.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000786", "originalText": "तत्र तत्त्वम्—पदवाच्ययोर्विशिष्टयोरैक्यायोगेऽपि लक्ष्यस्वरूपयोरैक्यमुपपादितमेव।", "padacchedaText": "", "audioFile": "PB_000786.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000787", "originalText": "अत एव तत्प्रतिपादक—तत्त्वमस्यादिवाक्यानामखण्डार्थत्वम्, \"सोऽयम्\" इत्यादिवाक्यवत्।", "padacchedaText": "", "audioFile": "PB_000787.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000788", "originalText": "न च कार्यपराणामेव प्रामाण्यम्।", "padacchedaText": "", "audioFile": "PB_000788.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000789", "originalText": "\"चैत्र, पुत्रस्ते जातः\" इत्यादौ सिद्धेऽपि सङ्गतिग्रहात्।", "padacchedaText": "", "audioFile": "PB_000789.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000790", "originalText": "एवं सर्वप्रमाणाविरुद्धं श्रुतिस्मृतीतिहासपुराणप्रतिपाद्यं जीवपरैक्यं वेदान्तशास्त्रस्य विषय इति सिद्धम्।", "padacchedaText": "", "audioFile": "PB_000790.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000791", "originalText": "इति वेदान्तपरिभाषायां विषयपरिच्छेदः।", "padacchedaText": "", "audioFile": "PB_000791.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000792", "originalText": "प्रयोजनम्\nइदानीं प्रयोजनं निरूप्यते।", "padacchedaText": "", "audioFile": "PB_000792.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000793", "originalText": "यदवगतं सत् स्ववृत्तितया इष्यते तत्प्रयोजनम्।", "padacchedaText": "", "audioFile": "PB_000793.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000794", "originalText": "तच्च द्विविधम् मुख्यं गौणं चेति।", "padacchedaText": "", "audioFile": "PB_000794.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000795", "originalText": "तत्र सुखदुःखाभावौ मुख्ये प्रयोजने।", "padacchedaText": "", "audioFile": "PB_000795.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000796", "originalText": "तदन्यतरसाधनं गौणं प्रयोजनम्।", "padacchedaText": "", "audioFile": "PB_000796.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000797", "originalText": "सुखं च द्विविधम् सातिशयं निरतिशयं च।", "padacchedaText": "", "audioFile": "PB_000797.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000798", "originalText": "तत्र सातिशयं सुखं विषयानुषङ्गजनितान्तःकरणवृत्तितारतम्यकृतानन्दलेशाविर्भावविशेषः, \" एतस्यैवानन्दस्यान्यानि भूतानि मात्रामुपजीवन्ति\" इत्यादिश्रुतेः।", "padacchedaText": "", "audioFile": "PB_000798.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000799", "originalText": "निरतिशयं सुखं च ब्रह्मैव, \" आनन्दो ब्रह्मेति व्यजानात्।", "padacchedaText": "", "audioFile": "PB_000799.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000800", "originalText": "\", \" विज्ञानमानन्दं ब्रह्म\" इत्यादिश्रुतेः।", "padacchedaText": "", "audioFile": "PB_000800.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000801", "originalText": "आनन्दात्मकब्रह्मावाप्तिश्च मोक्षः, शोकनिवृत्तिश्च, \" ब्रह्म वेद ब्रह्मैव भवति।", "padacchedaText": "", "audioFile": "PB_000801.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000802", "originalText": "\", \" तरति शोकमात्मवित्\" इत्यादिश्रुतेः।", "padacchedaText": "", "audioFile": "PB_000802.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000803", "originalText": "न तु लोकान्तरावाप्तिः, तज्जन्यवैषयिकानन्दो वा मोक्षः।", "padacchedaText": "", "audioFile": "PB_000803.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000804", "originalText": "तस्य कृतकत्वेनानित्यत्वे मुक्तस्य पुनरावृत्त्यापत्तेः।", "padacchedaText": "", "audioFile": "PB_000804.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000805", "originalText": "ननु त्वन्मतेऽप्यानन्दावाप्तेरनर्थनिवृत्तेश्च सादित्वे तुल्यो दोषः, अनादित्वे मोक्षमुद्दिश्य श्रवणादौ प्रवृत्त्यनुपपत्तिरिति चेत् न।", "padacchedaText": "", "audioFile": "PB_000805.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000806", "originalText": "सिद्धस्यैव ब्रह्मस्वरूपस्य मोक्षस्यासिद्धत्वभ्रमेण तत्साधने प्रवृत्त्युपपत्तेः।", "padacchedaText": "", "audioFile": "PB_000806.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000807", "originalText": "अनर्थनिवृत्तिरप्यधिष्ठानभूतब्रह्मस्वरूपतया सिद्धैव।", "padacchedaText": "", "audioFile": "PB_000807.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000808", "originalText": "लोकेऽपि प्राप्तप्राप्ति—परिहृतपरिहारयोः प्रयोजनत्वं दृष्टमेव।", "padacchedaText": "", "audioFile": "PB_000808.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000809", "originalText": "यथा हस्तगतविस्मृतसुवर्णादौ \"तव हस्ते सुवर्णम्\" इत्याप्तोपदेशादप्राप्तमिव प्राप्नोति।", "padacchedaText": "", "audioFile": "PB_000809.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000810", "originalText": "यथा वा वलयितचरणायां स्रजि सर्पत्वभ्रमवतः \"नायं सर्पः\" इत्याप्तवाक्यात् परिहृतस्यैव सर्पस्य परिहारः।", "padacchedaText": "", "audioFile": "PB_000810.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000811", "originalText": "एवं प्राप्तस्याप्यानन्दस्य प्राप्तिः, परिहृतस्याप्यनर्थस्य निवृत्तिर्मोक्षः प्रयोजनं च।", "padacchedaText": "", "audioFile": "PB_000811.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000812", "originalText": "स च ज्ञानैकसाध्यः, \" तमेव विदित्वाऽतिमृत्युमेति।", "padacchedaText": "", "audioFile": "PB_000812.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000813", "originalText": "नान्यः पन्था विद्यतेऽयनाय\" इतिश्रुतेः, अज्ञाननिवृत्तेः ज्ञानैकसाध्यत्वनियमाच्च।", "padacchedaText": "", "audioFile": "PB_000813.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000814", "originalText": "तच्च ज्ञानं ब्रह्मात्मैक्यगोचरम्, \" अभयं वै जनक प्राप्तोऽसि।", "padacchedaText": "", "audioFile": "PB_000814.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000815", "originalText": "\", \" तदात्मानमेवावेत् अहं ब्रह्मास्मि\" इत्यादिश्रुतेः।", "padacchedaText": "", "audioFile": "PB_000815.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000816", "originalText": "\" तत्त्वमस्यादिवाक्योत्थं ज्ञानं मोक्षस्य साधनम्\" इति नारदीयवचनाच्च।", "padacchedaText": "", "audioFile": "PB_000816.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000817", "originalText": "तच्च ज्ञानमपरोक्षरूपम्।", "padacchedaText": "", "audioFile": "PB_000817.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000818", "originalText": "परोक्षत्वेऽपरोक्षभ्रमनिवर्तकत्वानुपपत्तेः।", "padacchedaText": "", "audioFile": "PB_000818.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000819", "originalText": "तच्चापरोक्षज्ञानं तत्त्वमस्यादिवाक्यादिति केचित्।", "padacchedaText": "", "audioFile": "PB_000819.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000820", "originalText": "मनननिदिध्यासनसंस्कृतान्तःकरणादेवेत्यपरे।", "padacchedaText": "", "audioFile": "PB_000820.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000821", "originalText": "तत्र पूर्वाचार्याणामाशयः संविदापरोक्ष्यं न करणविशषोत्पत्तिनिबन्धनम्।", "padacchedaText": "", "audioFile": "PB_000821.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000822", "originalText": "किन्तु प्रमेयविशेषनिबन्धनम् इत्युपपादितम्।", "padacchedaText": "", "audioFile": "PB_000822.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000823", "originalText": "तथा च ब्रह्मणः प्रमातृजीवाभिन्नतया तद्गोचरं शब्दजन्यमपि ज्ञानमपरोक्षम्।", "padacchedaText": "", "audioFile": "PB_000823.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000824", "originalText": "अत एव प्रतर्दनाधिकरणे प्रतर्दनं प्रति \" प्राणोऽस्मि प्रज्ञात्मा।", "padacchedaText": "", "audioFile": "PB_000824.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000825", "originalText": "तं मामायुरमृतमुपास्व\" इति इन्द्रप्रोक्तवाक्ये प्राणशब्दस्य ब्रह्मपरत्वे निश्चिते सति \" मामुपास्व\" इत्यस्मच्छब्दानुपपत्तिमाशङ्क्य तदुत्तरत्वेन प्रवृत्ते \" शास्त्रदृष्ट्या तूपदेशो वामदेववत्\" इत्यत्र सूत्रे— शास्त्रात् दृष्टिः शास्त्रदृष्टिः— तत्त्वमस्यादिवाक्यजन्यम् \" अहं ब्रह्म\" इति ज्ञानं 'शास्त्रदृष्टि'—शब्देनोक्तमिति।", "padacchedaText": "", "audioFile": "PB_000825.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000826", "originalText": "अन्येषां त्वेवमाशयः करणविशेषनिबन्धनमेव ज्ञानानां प्रत्यक्षत्वम्, न विषयविशेषनिबन्धनम्।", "padacchedaText": "", "audioFile": "PB_000826.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000827", "originalText": "एकस्मिन्नेव सूक्ष्मवस्तुनि पटुकरणापटुकरणयोः प्रत्यक्षत्वाप्रत्यक्षत्वव्यवहारदर्शनात्।", "padacchedaText": "", "audioFile": "PB_000827.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000828", "originalText": "तथा च संवित्साक्षात्वे इन्द्रियजन्यत्वस्यैव प्रयोजकतया न शब्दजन्यज्ञानस्यापरोक्षत्वम्।", "padacchedaText": "", "audioFile": "PB_000828.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000829", "originalText": "ब्रह्मसाक्षात्कारेऽपि मनननिदिध्यासनसंस्कृतं मन एव करणम्, \" मनसैवानुद्रष्टव्यम्\" इत्यादिश्रुतेः।", "padacchedaText": "", "audioFile": "PB_000829.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000830", "originalText": "मनोऽगम्यत्वश्रुतिश्चासंस्कृतमनोविषया।", "padacchedaText": "", "audioFile": "PB_000830.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000831", "originalText": "न चैवं ब्रह्मण औपनिषदत्वानुपपत्तिः।", "padacchedaText": "", "audioFile": "PB_000831.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000832", "originalText": "अस्मदुक्तमनसो वेदजन्यज्ञानानन्तरमेव प्रवृत्ततया वेदोपजीवित्वात्, वेदानुपजीविमानान्तरगम्यत्वस्यैव विरोधित्वात्।", "padacchedaText": "", "audioFile": "PB_000832.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000833", "originalText": "'शास्त्रदृष्टि'—सूत्रमपि ब्रह्मविषयकमानसप्रत्यक्षस्य शास्त्रप्रयोज्यत्वादुपपद्यते।", "padacchedaText": "", "audioFile": "PB_000833.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000834", "originalText": "तदुक्तम् \" 'अपि संराधने' सूत्रात् शास्त्रार्थध्यानजा प्रमा। शास्त्रदृष्टिर्मता, तान्तु वेत्ति वाचस्पतिः परम्॥", "padacchedaText": "", "audioFile": "PB_000834.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000835", "originalText": "\"\nतच्च ज्ञानं पापक्षयात्।", "padacchedaText": "", "audioFile": "PB_000835.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000836", "originalText": "स च कर्मानुष्ठानादिति परम्परया कर्मणां विनियोगः।", "padacchedaText": "", "audioFile": "PB_000836.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000837", "originalText": "अत एव \" तमेतं वेदानुवचनेन ब्राह्मणा विविदिषन्ति यज्ञेन दानेन तपसाऽनाशकेन\" इत्यादि श्रुतिः, \" कषाये कर्मभिः पक्वे ततो ज्ञानं प्रवर्तते\" इत्यादिस्मृतिश्च सङ्गच्छते।", "padacchedaText": "", "audioFile": "PB_000837.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000838", "originalText": "एवं श्रवणमनननिदिध्यासनान्यपि ज्ञानसाधनानि, मैत्रेयीब्राह्मणे \" आत्मा वा अरे द्रष्टव्यः\" इति दर्शनमनूद्य तत्साधनत्वेन \" श्रोतव्यो मन्तव्यो निदिध्यासितव्यः\" इति श्रवणमनननिदिध्यासनानां विधानात्।", "padacchedaText": "", "audioFile": "PB_000838.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000839", "originalText": "श्रवणं नाम वेदान्तानामद्वितीये ब्रह्मणि तात्पर्यावधारणानुकूला मानसी क्रिया।", "padacchedaText": "", "audioFile": "PB_000839.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000840", "originalText": "मननं नाम शब्दावधारितेऽर्थे मानान्तरविरोधशङ्कायां, तन्निराकरणानुकूलतर्कात्मकज्ञानजनको मानसो व्यापारः।", "padacchedaText": "", "audioFile": "PB_000840.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000841", "originalText": "निदिध्यासनं नाम अनादिदुर्वासनया विषयेष्वाकृष्यमाणस्य चित्तस्य विषयेभ्योऽपकृष्य आत्मविषयकस्थैर्यानुकूलो मानसो व्यापारः।", "padacchedaText": "", "audioFile": "PB_000841.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000842", "originalText": "तत्र निदिध्यासनं ब्रह्मसाक्षात्कारे साक्षात् कारणम्, \" ते ध्यानयोगानुगता अपश्यन्, देवात्मशक्तिं स्वगुणैर्निगूढाम्\" इत्यादिश्रुतेः।", "padacchedaText": "", "audioFile": "PB_000842.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000843", "originalText": "निदिध्यासने च मननं हेतुः।", "padacchedaText": "", "audioFile": "PB_000843.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000844", "originalText": "अकृतमननस्यार्थदार्ढ्याभावेन तद्विषयकनिदिध्यासनायोगात्।", "padacchedaText": "", "audioFile": "PB_000844.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000845", "originalText": "मनने च श्रवणं हेतुः, श्रवणाभावे तात्पर्यानिश्चयेन शाब्दज्ञानाभावेन श्रुतार्थविषयकयुक्तत्वनिश्चयानुकूलमननायोगात्।", "padacchedaText": "", "audioFile": "PB_000845.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000846", "originalText": "एतानि त्रीण्यपि ज्ञानोत्पत्तौ कारणानीति केचिदाचार्या ऊचिरे।", "padacchedaText": "", "audioFile": "PB_000846.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000847", "originalText": "अपरे तु श्रवणं प्रधानम्।", "padacchedaText": "", "audioFile": "PB_000847.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000848", "originalText": "मनननिदिध्यासनयोस्तु श्रवणात् पराचीनयोरपि श्रवणफलब्रह्मदर्शननिर्वर्तकतया आरादुपकारकतयाऽङ्गत्वमित्याहुः।", "padacchedaText": "", "audioFile": "PB_000848.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000849", "originalText": "तदप्यङ्गत्वं न तार्तीयशेषत्वरूपम्, तस्य श्रुत्याद्यन्यतमप्रमाणगम्यस्य प्रकृते श्रुत्याद्यभावेऽसम्भवात्।", "padacchedaText": "", "audioFile": "PB_000849.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000850", "originalText": "तथा हि \" व्रीहिभिर्यजेत।", "padacchedaText": "", "audioFile": "PB_000850.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000851", "originalText": "\", \" दध्ना जुहोति\" इत्यादाविव मनननिदिध्यासनयोरङ्गत्वे न काचित् तृतीयाश्रुतिरस्ति।", "padacchedaText": "", "audioFile": "PB_000851.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000852", "originalText": "नापि \" बर्हिर्देवसदनं दामि\" इत्यादि मन्त्राणां बर्हिःखण्डन—प्रकाशनसामर्थ्यवत् किञ्चिल्लिङ्गमस्ति।", "padacchedaText": "", "audioFile": "PB_000852.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000853", "originalText": "नापि प्रदेशान्तरपठितस्य प्रवर्गस्य \" अग्निष्टोमे प्रवृणक्ति\" इति वाक्यवत् श्रवणानुवादेन मनननिदिध्यासनविनियोजकं किञ्चिद्वाक्यमस्ति।", "padacchedaText": "", "audioFile": "PB_000853.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000854", "originalText": "नापि \" दर्शपूर्णमासाभ्यां स्वर्गकामो यजेत\" इति वाक्यावगतफलसाधनताक—दर्शपूर्णमासप्रकरणे प्रयाजादीनामिव फलसाधनत्वेनावगतस्य श्रवणस्य प्रकरणे मनननिदिध्यासनयोराम्नानम्।", "padacchedaText": "", "audioFile": "PB_000854.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000855", "originalText": "ननु 'द्रष्टव्यः' इति दर्शनानुवादेन श्रवणे विहिते सति फलवत्तया श्रवणप्रकरणे तत्सन्निधावाम्नातयोर्मनननिदिध्यासनयोः प्रयाजन्यायेन प्रकरणादेवाङ्गतेति चेत् न।", "padacchedaText": "", "audioFile": "PB_000855.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000856", "originalText": "\" ते ध्यानयोगानुगता अपश्यन्\" इत्यादिश्रुत्यन्ते ध्यानस्य दर्शनसाधनत्वेनावगतस्य अङ्गाकाङ्क्षायां प्रयाजन्ययेन श्रवणमननयोरेवाङ्गत्वापत्तेः।", "padacchedaText": "", "audioFile": "PB_000856.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000857", "originalText": "क्रमसमाख्ये च दूरनिरस्ते।", "padacchedaText": "", "audioFile": "PB_000857.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000858", "originalText": "किञ्च प्रयाजादिष्वङ्गत्वविचारः सप्रयोजनः।", "padacchedaText": "", "audioFile": "PB_000858.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000859", "originalText": "पूर्वपक्षे विकृतिषु न प्रयाजाद्यनुष्ठानम्, सिद्धान्ते तु तत्रापि तदनुष्ठानमिति।", "padacchedaText": "", "audioFile": "PB_000859.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000860", "originalText": "प्रकृते तु श्रवणं न कस्यचित् प्रकृतिः, येन मनननिदिध्यासनयोस्तत्राप्यनुष्ठानमङ्गत्वविचारफलं भवेत्।", "padacchedaText": "", "audioFile": "PB_000860.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000861", "originalText": "तस्मान्न तार्तीयशेषत्वं मनननिदिध्यासनयोः।", "padacchedaText": "", "audioFile": "PB_000861.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000862", "originalText": "किन्तु यथा घटादिकार्ये मृत्पिण्डादीनां प्रधानकारणता, चक्रादीनां सहकारिकारणतेति प्राधान्याप्राधान्यव्यपदेशः, तथा श्रवणमनननिदिध्यासनानामपीति मन्तव्यम्।", "padacchedaText": "", "audioFile": "PB_000862.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000863", "originalText": "सूचितं चैतद्विवरणाचार्यैः— \" शक्तितात्पर्यविशिष्टशब्दावधारणं प्रमेयावगमं प्रत्यव्यवधानेन कारणं भवति, प्रमाणस्य प्रमेयावगमं प्रत्यव्यवधानात्।", "padacchedaText": "", "audioFile": "PB_000863.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000864", "originalText": "मनननिदिध्यासने तु चित्तस्य प्रत्यगात्मप्रवणतासंस्कारपरिनिष्पन्न—तदेकाग्रवृत्तिकार्यद्वारेण ब्रह्मानुभवहेतुतां प्रतिपद्येते इति फलं प्रत्यव्यवहितकारणस्य शक्तितात्पर्यविशिष्टशब्दावधारणस्य व्यवहिते मनननिदिध्यासने तदङ्गे अङ्गीक्रियेतेेेे\" इति।", "padacchedaText": "", "audioFile": "PB_000864.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000865", "originalText": "श्रवणादिषु च मुमुक्षूणामधिकारः।", "padacchedaText": "", "audioFile": "PB_000865.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000866", "originalText": "काम्ये कर्मणि फलकामस्याधिकारित्वात्।", "padacchedaText": "", "audioFile": "PB_000866.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000867", "originalText": "मुमुक्षायां च नित्यानित्यवस्तुविवेकस्येहामुत्रार्थफलभोगविरागस्य शमदमोपरतितितिक्षासमाधानश्रद्धानां च विनियोगः।", "padacchedaText": "", "audioFile": "PB_000867.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000868", "originalText": "अन्तरिन्द्रियनिग्रहः शमः।", "padacchedaText": "", "audioFile": "PB_000868.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000869", "originalText": "बहिरिन्द्रियनिग्रहो दमः।", "padacchedaText": "", "audioFile": "PB_000869.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000870", "originalText": "विक्षेपाभाव उपरतिः।", "padacchedaText": "", "audioFile": "PB_000870.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000871", "originalText": "शीतोष्णादिद्वन्द्वसहनं तितिक्षा।", "padacchedaText": "", "audioFile": "PB_000871.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000872", "originalText": "चित्तैकाग्र्यं समाधानम्।", "padacchedaText": "", "audioFile": "PB_000872.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000873", "originalText": "गुरुवेदान्तवाक्येषु विश्वासः श्रद्धा।", "padacchedaText": "", "audioFile": "PB_000873.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000874", "originalText": "अत्र उपरमशब्देन संन्यासोऽभिधीयते।", "padacchedaText": "", "audioFile": "PB_000874.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000875", "originalText": "तथा च संन्यासिनामेव श्रवणादावधिकारः इति केचित्।", "padacchedaText": "", "audioFile": "PB_000875.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000876", "originalText": "अपरे तु, उपरमशब्दस्य संन्यासवाचकत्वाभावात्, विक्षेपाभावमात्रस्य गृहस्थेष्वपि सम्भवात्, जनकादेरपि ब्रह्मविचारस्य श्रूयमाणत्वात्, सर्वाश्रमसाधारणं श्रवणादिविधानमित्याहुः।", "padacchedaText": "", "audioFile": "PB_000876.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000877", "originalText": "सगुणोपासनमपि चित्तैकाग्र्यद्वारा निर्विशेषब्रह्मसाक्षात्कारहेतुः।", "padacchedaText": "", "audioFile": "PB_000877.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000878", "originalText": "तदुक्तम् \" निर्विशेषं परं ब्रह्म साक्षात्कर्तुमनीश्वराः। ये मन्दास्तेऽनुकम्प्यन्ते सविशेषनिरूपणैः॥", "padacchedaText": "", "audioFile": "PB_000878.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000879", "originalText": "वशीकृते मनस्येषां सगुणब्रह्मशीलनात्। तदेवाविर्भवेत् साक्षादपेतोपाधिकल्पनम्॥", "padacchedaText": "", "audioFile": "PB_000879.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000880", "originalText": "\" इति।", "padacchedaText": "", "audioFile": "PB_000880.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000881", "originalText": "सगुणोपासकानां च अर्चिरादिमार्गेण ब्रह्मलोकगतानां तत्रैव श्रवणाद्युत्पन्नतत्त्वसाक्षात्काराणां ब्रह्मणा सह मोक्षः।", "padacchedaText": "", "audioFile": "PB_000881.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000882", "originalText": "कर्मिणान्तु धूमादिमार्गेण पितृलोकं गतानामुपभोगेन कर्मक्षये सति पूर्वकृतसुकृतदुष्कृतानुसारेण ब्रह्मादिस्थावरान्तेषु पुनरुत्पत्तिः।", "padacchedaText": "", "audioFile": "PB_000882.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000883", "originalText": "तथा च श्रुतिः— \" रमणीयचरणा रमणीयां योनिमापद्यन्ते।", "padacchedaText": "", "audioFile": "PB_000883.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000884", "originalText": "कपूयचरणाः कपूयां योनिमापद्यन्ते\" इति।", "padacchedaText": "", "audioFile": "PB_000884.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000885", "originalText": "प्रतिषिद्धानुष्ठायिनां तु रौरवादिनरकविशेषेषु तत्तत्पापोचित—तीव्रदुःखमनुभूय श्वशूकरादितिर्यग्योनिषु स्थावरादिषु चोत्पत्तिः इत्यलं प्रसङ्गागतप्रपञ्चेन।", "padacchedaText": "", "audioFile": "PB_000885.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000886", "originalText": "निर्गुणब्रह्मसाक्षात्कारवतस्तु न लोकान्तरगमनम्।", "padacchedaText": "", "audioFile": "PB_000886.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000887", "originalText": "\" न तस्य प्राणा उत्क्रामन्ति\" इतिश्रुतेः।", "padacchedaText": "", "audioFile": "PB_000887.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000888", "originalText": "किन्तु यावत्प्रारब्धकर्मक्षयं सुखदुःखे अनुभूय पश्चादपवृज्यते।", "padacchedaText": "", "audioFile": "PB_000888.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000889", "originalText": "ननु \" क्षीयन्ते चास्य कर्माणि तस्मिन् दृष्टे परावरे\" इत्यादिश्रुत्या, \" ज्ञानाग्निः सर्वकर्माणि भस्मसात् कुरुते तथा\" इत्यादिस्मृत्या च ज्ञानस्य सकलकर्मक्षयहेतुत्वनिश्चये सति प्रारब्धकर्मावस्थानमनुपपन्नमिति चेत् न।", "padacchedaText": "", "audioFile": "PB_000889.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000890", "originalText": "\" तस्य तावदेव चिरं यावन्न विमोक्ष्ये।", "padacchedaText": "", "audioFile": "PB_000890.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000891", "originalText": "अथ सम्पत्स्ये\" इत्यादिश्रुत्या, \" नाभुक्तं क्षीयते कर्म\" इत्यादिस्मृत्या चोत्पादितकार्यकर्मव्यतिरिक्तानां सञ्चितकर्मणामेव ज्ञानविनाश्यत्वावगमात्।", "padacchedaText": "", "audioFile": "PB_000891.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000892", "originalText": "सञ्चितं द्विविधम् सुकृतं दुष्कृतं च।", "padacchedaText": "", "audioFile": "PB_000892.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000893", "originalText": "तथा च श्रुतिः \" तस्य पुत्रा दायमुपयन्ति।", "padacchedaText": "", "audioFile": "PB_000893.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000894", "originalText": "सुहृदः साधुकृत्याम्।", "padacchedaText": "", "audioFile": "PB_000894.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000895", "originalText": "द्विषन्तः पापकृत्याम्\" इति।", "padacchedaText": "", "audioFile": "PB_000895.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000896", "originalText": "ननु ब्रह्मज्ञानान्मूलाज्ञाननिवृत्तौ तत्कार्यप्रारब्धकर्मणोऽपि निवृत्तेः कथं ज्ञानिनां देहधारणमुपपद्यते? इति चेत् न।", "padacchedaText": "", "audioFile": "PB_000896.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000897", "originalText": "अप्रतिबद्धज्ञानस्यैवाज्ञाननिवर्तकतया प्रारब्धकर्मरूपप्रतिबन्धकदशायामज्ञाननिवृत्तेरनङ्गीकारात्।", "padacchedaText": "", "audioFile": "PB_000897.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000898", "originalText": "नन्वेवमपि तत्त्वज्ञानादेकस्य मुक्तौ सर्वमुक्तिः स्यात्।", "padacchedaText": "", "audioFile": "PB_000898.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000899", "originalText": "अविद्याया एकत्वेन तन्निवृत्तौ क्वचिदपि संसारायोगादिति चेत् न।", "padacchedaText": "", "audioFile": "PB_000899.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000900", "originalText": "इष्टापत्तेरित्येके।", "padacchedaText": "", "audioFile": "PB_000900.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000901", "originalText": "अपरे तु एतद्दोषपरिहारायैव \" इन्द्रो मायाभिः\" इति बहुवचनश्रुत्यनुगृहीतमविद्यानानात्वमङ्गीकर्तव्यमित्याहुः।", "padacchedaText": "", "audioFile": "PB_000901.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000902", "originalText": "अन्ये तु एकैवाविद्या।", "padacchedaText": "", "audioFile": "PB_000902.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000903", "originalText": "तस्याश्चाविद्याया जीवभेदेन ब्रह्मस्वरूपावरणशक्तयो नाना।", "padacchedaText": "", "audioFile": "PB_000903.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000904", "originalText": "तथा च यस्य ब्रह्मज्ञानं तस्य ब्रह्मस्वरूपावरणशक्तिविशिष्टाविद्यानाशः, न त्वन्यं प्रति, इत्युपगमात् नैकमुक्तौ सर्वमुक्तिः।", "padacchedaText": "", "audioFile": "PB_000904.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000905", "originalText": "अत एव \" यावदधिकारमवस्थितिराधिकारिकाणाम्\" इत्यस्मिन्नधिकरणे अाधिकारिकपुरुषाणामुत्पन्नतत्त्वज्ञानानामिन्द्रादीनां देहधारणानुपपत्तिमाशङ्क्य, अधिकारापादकप्रारब्धकर्मसमाप्त्यनन्तरं विदेहकैवल्यमिति सिद्धान्तितम्।", "padacchedaText": "", "audioFile": "PB_000905.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000906", "originalText": "तदुक्तमाचार्यवाचस्पतिमिश्रैः— \" उपसनादिसंसिद्धितोषितेश्वरचोदिताः। अधिकारं समाप्यैते प्रविशन्ति परं पदम्॥", "padacchedaText": "", "audioFile": "PB_000906.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000907", "originalText": "\" इति।", "padacchedaText": "", "audioFile": "PB_000907.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000908", "originalText": "एतच्चैकमुक्तौ सर्वमुक्तिरिति पक्षे नोपपद्यते।", "padacchedaText": "", "audioFile": "PB_000908.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000909", "originalText": "तस्मादेकाविद्यापक्षेऽपि प्रतिजीवमावरणभेदोपगमेन व्यवस्थोपपादनीया।", "padacchedaText": "", "audioFile": "PB_000909.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000910", "originalText": "तदेवं ब्रह्मज्ञानान्मोक्षः।", "padacchedaText": "", "audioFile": "PB_000910.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000911", "originalText": "स चानर्थनिवृत्तिर्निरतिशयब्रह्मानन्दावाप्तिश्चेति सिद्धं प्रयोजनम्।", "padacchedaText": "", "audioFile": "PB_000911.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000912", "originalText": "इति वेदान्तपरिभाषायां प्रयोजनपरिच्छेदः। इति धर्मराजाध्वरीन्द्रविरचिता वेदान्तपरिभाषा समाप्ता॥", "padacchedaText": "", "audioFile": "PB_000912.wav", "zipFile": "VedantaParibhasha.zip"}];
        const contentDiv = document.getElementById('content');
        
        let currentIndex = -1;
        let isPlaying = false;
        
        // Use standard HTML5 audio to preserve pitch on speed changes
        const audioEl = new Audio();
        audioEl.preservesPitch = true;
        
        const speedSlider = document.getElementById('speed-slider');
        const speedDisplay = document.getElementById('speed-display');
        speedSlider.oninput = function() {
            audioEl.playbackRate = this.value;
            speedDisplay.innerText = parseFloat(this.value).toFixed(1);
        };
        
        let currentScript = 'devanagari';
        const scriptSelect = document.getElementById('script-select');
        scriptSelect.onchange = function() {
            currentScript = this.value;
            document.querySelectorAll('.sentence-text').forEach((span, index) => {
                let origText = manifest[index].originalText;
                if (currentScript === 'devanagari') {
                    span.innerText = origText;
                } else {
                    span.innerText = Sanscript.t(origText, 'devanagari', currentScript);
                }
            });
        };
        
        const playPauseBtn = document.getElementById('play-pause-btn');
        playPauseBtn.onclick = () => {
            if (isPlaying) {
                audioEl.pause();
                isPlaying = false;
                playPauseBtn.innerText = "Resume";
            } else {
                playAudio(Math.max(0, currentIndex));
                playPauseBtn.innerText = "Stop";
            }
        };
        
        manifest.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'sentence';
            div.id = 'sentence-' + index;
            
            const idSpan = document.createElement('span');
            idSpan.className = 'sentence-id';
            idSpan.innerText = '[' + item.id + ']';
            
            const textSpan = document.createElement('span');
            textSpan.className = 'sentence-text';
            textSpan.innerText = item.originalText;
            
            div.appendChild(idSpan);
            div.appendChild(textSpan);
            
            div.onclick = () => {
                playPauseBtn.innerText = "Stop";
                playAudio(index);
            };
            contentDiv.appendChild(div);
        });
        
        // --- HTML5 Audio Prefetching Logic (via Blob URLs) ---
        const PREFETCH_BUFFER_SIZE = 3;
        let prefetchQueue = new Map(); // index -> Blob URL

        function getAudioUrl(index) {
            if (index < 0 || index >= manifest.length) return null;
            const item = manifest[index];
            const zipToUse = item.zipFile || ZIP_NAME;
            return WORKER_URL + '/' + BUCKET_NAME + '/' + zipToUse + '/' + item.audioFile;
        }

        async function fetchBlobUrl(url) {
            const response = await fetch(url);
            if (!response.ok) throw new Error("HTTP " + response.status);
            const blob = await response.blob();
            return URL.createObjectURL(blob);
        }

        async function prefetchNext(fromIndex) {
            for (let i = fromIndex + 1; i <= fromIndex + PREFETCH_BUFFER_SIZE; i++) {
                if (i >= manifest.length) break;
                if (!prefetchQueue.has(i)) {
                    prefetchQueue.set(i, 'fetching');
                    const url = getAudioUrl(i);
                    try {
                        const blobUrl = await fetchBlobUrl(url);
                        if (prefetchQueue.get(i) === 'fetching') {
                            prefetchQueue.set(i, blobUrl);
                        } else {
                            URL.revokeObjectURL(blobUrl);
                        }
                    } catch (err) {
                        console.error("Prefetch failed for index", i, err);
                        prefetchQueue.delete(i);
                    }
                }
            }
            // Cleanup old blobs to free memory
            for (let [key, val] of prefetchQueue.entries()) {
                if (key < fromIndex) {
                    if (typeof val === 'string' && val.startsWith('blob:')) {
                        URL.revokeObjectURL(val);
                    }
                    prefetchQueue.delete(key);
                }
            }
        }
        // ------------------------

        async function playAudio(index) {
            if (index < 0 || index >= manifest.length) {
                isPlaying = false;
                playPauseBtn.innerText = "Start Reading";
                return;
            }
            
            if (currentIndex >= 0) {
                const prevDiv = document.getElementById('sentence-' + currentIndex);
                if (prevDiv) prevDiv.classList.remove('active');
            }
            
            currentIndex = index;
            
            const currentDiv = document.getElementById('sentence-' + currentIndex);
            if (currentDiv) {
                currentDiv.classList.add('active');
                currentDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            
            audioEl.pause();
            
            try {
                let audioUrl;
                if (prefetchQueue.has(index) && prefetchQueue.get(index) !== 'fetching') {
                    audioUrl = prefetchQueue.get(index);
                } else {
                    const sourceUrl = getAudioUrl(index);
                    audioUrl = await fetchBlobUrl(sourceUrl);
                }
                
                audioEl.src = audioUrl;
                audioEl.playbackRate = speedSlider.value;
                audioEl.onended = () => { playAudio(currentIndex + 1); };
                
                await audioEl.play();
                isPlaying = true;
                
            } catch (e) {
                console.error("Audio play error:", e);
                // Fallback to next track if error
                setTimeout(() => playAudio(currentIndex + 1), 500);
            }
            
            // Trigger prefetch for upcoming sentences
            prefetchNext(index);
        }
    </script>
