        const manifest = [{"id": "B_000000", "originalText": "श्रीधर्मराजाध्वरीन्द्रविरचिता\n\nवेदान्तपरिभाषा॥", "padacchedaText": "", "audioFile": "PB_000000.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000001", "originalText": "प्रत्यक्षप्रमाणम्\nयदविद्याविलासेन भूतभौतिकसृष्टयः। तं नौमि परमात्मानं सच्चिदानन्दविग्रहम्॥ १॥", "padacchedaText": "", "audioFile": "PB_000001.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000002", "originalText": "यदन्तेवासिपञ्चास्यैर्निरस्ता भेदिवारणाः। तं प्रणौमि नृसिंहाख्यं यतीन्द्रं परमं गुरुम्॥ २॥", "padacchedaText": "", "audioFile": "PB_000002.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000003", "originalText": "श्रीमद्वेङ्कटनाथाख्यान् वेलाङ्गुडिनिवासिनः। जगद्गुरूनहं वन्दे सर्वतन्त्रप्रवर्तकान्॥ ३॥", "padacchedaText": "", "audioFile": "PB_000003.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000004", "originalText": "येन चिन्तामणौ टीका दशटीकाविभञ्जिनी। तर्कचूडामणिर्नाम कृता विद्वन्मनोरमा॥ ४॥", "padacchedaText": "", "audioFile": "PB_000004.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000005", "originalText": "तेन बोधाय मन्दानां वेदान्तार्थावलम्बिनी। धर्मराजाध्वरीन्द्रेण परिभाषा वितन्यते॥ ५॥", "padacchedaText": "", "audioFile": "PB_000005.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000006", "originalText": "इह खलु धर्मार्थकाममोक्षाख्येषु चतुर्विधपुरुषार्थेषु मोक्ष एव परमपुरुषार्थः।", "padacchedaText": "", "audioFile": "PB_000006.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000007", "originalText": "\" न स पुनरावर्तते\" (शरभोपनिषत्) इत्यादिश्रुत्या तस्यैव नित्यत्वावगमात्।", "padacchedaText": "", "audioFile": "PB_000007.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000008", "originalText": "इतरेषां त्रयाणां प्रत्यक्षेण, \" तद्यथेह कर्मचितो लोकः क्षीयते, एवमेवामुत्र पुण्यचितो लोकः क्षीयते\"(छा.उ. ८.१.६) इत्यादिश्रुत्या च अनित्यत्वावगमाच्च।", "padacchedaText": "", "audioFile": "PB_000008.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000009", "originalText": "स च ब्रह्मज्ञानादिति, ब्रह्म, तज्ज्ञानं, तत्प्रमाणञ्च सप्रपञ्चं निरूप्यते।", "padacchedaText": "", "audioFile": "PB_000009.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000010", "originalText": "तत्र प्रमाकरणं प्रमाणम्।", "padacchedaText": "", "audioFile": "PB_000010.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000011", "originalText": "तत्र स्मृतिव्यावृत्तं प्रमात्वमनधिगताबाधितार्थविषयकज्ञानत्वम्।", "padacchedaText": "", "audioFile": "PB_000011.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000012", "originalText": "स्मृतिसाधारणन्तु अबाधितार्थविषयकज्ञानत्वम्।", "padacchedaText": "", "audioFile": "PB_000012.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000013", "originalText": "नीरूपस्यापि कालस्येन्द्रियवेद्यत्वाभ्युपगमेन, धारावाहिकबुद्धेरपि पूर्वपूर्वज्ञानाविषयतत्तत्क्षणविशेषविषयकत्वेन न तत्राव्याप्तिः।", "padacchedaText": "", "audioFile": "PB_000013.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000014", "originalText": "किञ्च सिद्धान्ते धारावाहिकबुद्धिस्थले न ज्ञानभेदः।", "padacchedaText": "", "audioFile": "PB_000014.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000015", "originalText": "किन्तु यावद्घटस्फुरणं तावद्घटाकारान्तःकरणवृत्तिरेकैव, न तु नाना।", "padacchedaText": "", "audioFile": "PB_000015.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000016", "originalText": "वृत्तेः स्वविरोधिवृत्युत्पत्तिपर्यन्तं स्थायित्वाभ्युपगमात्।", "padacchedaText": "", "audioFile": "PB_000016.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000017", "originalText": "तथा च तत्प्रतिफलितचैतन्यरूपं घटादिज्ञानमपि तत्र तावत्कालीनमेकमेव इति नाव्याप्तिशङ्कापि।", "padacchedaText": "", "audioFile": "PB_000017.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000018", "originalText": "ननु सिद्धान्ते घटादेर्मिथ्यात्वेन बाधितत्वात् कथं तज्ज्ञानं प्रमाणम्? उच्यते।", "padacchedaText": "", "audioFile": "PB_000018.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000019", "originalText": "ब्रह्मसाक्षात्कारानन्तरं हि घटादीनां बाधः, \"यत्र त्वस्य सर्वमात्मैवाभूत् तत् केन कं पश्येत्\"(बृ.उ. २. ४. १४) इति श्रुतेः।", "padacchedaText": "", "audioFile": "PB_000019.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000020", "originalText": "न तु संसारदशायां बाधः, \" यत्र हि द्वैतमिव भवति तदितर इतरं पश्यति\"(बृ.उ. २.४.१४) इति श्रुतेः।", "padacchedaText": "", "audioFile": "PB_000020.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000021", "originalText": "तथा च अबाधितपदेन संसारदशायामबाधितत्वं विवक्षितम्।", "padacchedaText": "", "audioFile": "PB_000021.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000022", "originalText": "इति न घटादिप्रमायमव्याप्तिः।", "padacchedaText": "", "audioFile": "PB_000022.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000023", "originalText": "तदुक्तम्— \" देहात्मप्रत्ययो यद्वत् प्रमाणत्वेन कल्पितः। लौकिकं तद्वदेवेदं प्रमाणन्त्वाऽऽत्मनिश्चयात्॥", "padacchedaText": "", "audioFile": "PB_000023.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000024", "originalText": "\" इति।", "padacchedaText": "", "audioFile": "PB_000024.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000025", "originalText": "'आ आत्मनिश्चयात्'— ब्रह्मसाक्षात्कारपर्यन्तमित्यर्थः।", "padacchedaText": "", "audioFile": "PB_000025.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000026", "originalText": "'लौकिकम्' इति घटादिज्ञानमित्यर्थः।", "padacchedaText": "", "audioFile": "PB_000026.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000027", "originalText": "तानि च प्रमाणानि षट् प्रत्यक्षानुमानोपमानागमार्थापत्त्यनुपलब्धिभेदात्।", "padacchedaText": "", "audioFile": "PB_000027.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000028", "originalText": "तत्र प्रत्यक्षप्रमायाः करणं प्रत्यक्षप्रमाणम्।", "padacchedaText": "", "audioFile": "PB_000028.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000029", "originalText": "प्रत्यक्षप्रमा चात्र चैतन्यमेव, \" यत् साक्षादपरोक्षाद् ब्रह्म\"(बृ.उ. ३.४.१) इति श्रुतेः।", "padacchedaText": "", "audioFile": "PB_000029.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000030", "originalText": "अपरोक्षादित्यस्य अपरोक्षमित्यर्थः।", "padacchedaText": "", "audioFile": "PB_000030.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000031", "originalText": "ननु चैतन्यमनादि।", "padacchedaText": "", "audioFile": "PB_000031.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000032", "originalText": "तत्कथं चक्षुरादेस्तत्करणत्वेन प्रमाणत्वमिति।", "padacchedaText": "", "audioFile": "PB_000032.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000033", "originalText": "उच्यते।", "padacchedaText": "", "audioFile": "PB_000033.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000034", "originalText": "चैतन्यस्यानादित्वेऽपि तदभिव्यञ्जकान्तःकरणवृत्तिरिन्द्रियसन्निकर्षादिना जायते इति वृत्तिविशिष्टं चैतन्यमादिमदित्युच्यते।", "padacchedaText": "", "audioFile": "PB_000034.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000035", "originalText": "ज्ञानावच्छेदकत्वाच्च वृत्तौ ज्ञानत्वोपचारः।", "padacchedaText": "", "audioFile": "PB_000035.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000036", "originalText": "तदुक्तं विवरणे \" अन्तःकरणवृत्तौ ज्ञानत्वोपचारात्\"।", "padacchedaText": "", "audioFile": "PB_000036.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000037", "originalText": "ननु निरवयवस्यान्तःकरणस्य परिणामात्मिका वृत्तिः कथम्? इत्थम्।", "padacchedaText": "", "audioFile": "PB_000037.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000038", "originalText": "न तावदन्तःकरणं निरवयवम्।", "padacchedaText": "", "audioFile": "PB_000038.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000039", "originalText": "सादिद्रव्यत्वेन सावयवत्वात्।", "padacchedaText": "", "audioFile": "PB_000039.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000040", "originalText": "सादित्वञ्च \" तन्मनोऽसृजत\" इत्यादिश्रुतेः।", "padacchedaText": "", "audioFile": "PB_000040.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000041", "originalText": "वृत्तिरूपज्ञानस्य मनोधर्मत्वे च \" कामः सङ्कल्पो विचिकित्सा श्रद्धाऽश्रद्धा धृतिरधृतिर्ह्रीर्धीर्भीरित्येतत् सर्वं मन एव\"(बृ.उ. १.५.३) इति श्रुतिर्मानम्, धीशब्देन वृत्तिरूपज्ञानाभिधानात्।", "padacchedaText": "", "audioFile": "PB_000041.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000042", "originalText": "अत एव कामादेरपि मनोधर्मत्वम्॥", "padacchedaText": "", "audioFile": "PB_000042.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000043", "originalText": "ननु कामादेरन्तःकरणधर्मत्वे \"अहमिच्छामि, अहं जानामि, अहं बिभेमि\" इत्याद्यनुभव आत्मधर्मत्वमवगाहमानः कथमुपपद्यते? उच्यते।", "padacchedaText": "", "audioFile": "PB_000043.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000044", "originalText": "अयःपिण्डस्य दग्धृत्वाभावेऽपि दग्धृत्वाश्रयवह्नितादात्म्याध्यासाद् यथा \"अयो दहति\" इति व्यवहारः, तथा सुखाद्याकारपरिणाम्यन्तःकरणैक्याध्यासात् \"अहं सुखी, अहं दुःखी\" इत्यादिव्यवहारः।", "padacchedaText": "", "audioFile": "PB_000044.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000045", "originalText": "ननु अन्तःकरणस्येन्द्रियतयाऽतीन्द्रियत्वात् कथं प्रत्यक्षविषयतेति।", "padacchedaText": "", "audioFile": "PB_000045.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000046", "originalText": "उच्यते।", "padacchedaText": "", "audioFile": "PB_000046.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000047", "originalText": "न तावदन्तःकरणमिन्द्रियमित्यत्र मानमस्ति।", "padacchedaText": "", "audioFile": "PB_000047.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000048", "originalText": "\" मनःषष्ठानीन्द्रियाणि\"(भ.गी. १५.७) इति भगवद्गीतावचनं प्रमाणमिति चेत् न।", "padacchedaText": "", "audioFile": "PB_000048.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000049", "originalText": "अनिन्द्रियेणापि मनसा षट्त्वसंख्यापूरणाविरोधात्।", "padacchedaText": "", "audioFile": "PB_000049.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000050", "originalText": "नहीन्द्रियगतसंख्यापूरणमिन्द्रियेणैवेति नियमः।", "padacchedaText": "", "audioFile": "PB_000050.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000051", "originalText": "\" यजमानपञ्चमा इडां भक्षयन्ति\" इत्यत्र ऋत्विग्गतपञ्चत्वसंख्याया अनृत्विजाऽपि यजमानेन, \" वेदानध्यापयामास महाभारतपञ्चमान्\" इत्यादौ च वेदगतपञ्चत्वसंख्याया अवेदेनापि भारतेन पूरणदर्शनात्, \"इन्द्रियेभ्यः परा ह्यर्था अर्थेभ्यश्च परं मनः\"(क.उ. १.३.१०) इत्यादिश्रुत्या मनसोऽनिन्द्रियत्वावगमाच्च।", "padacchedaText": "", "audioFile": "PB_000051.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000052", "originalText": "न चैवं मनसोऽनिन्द्रियत्वे सुखादिप्रत्यक्षस्य साक्षात्त्वं न स्यात्, इन्द्रियाजन्यत्वादिति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_000052.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000053", "originalText": "न हीन्द्रियजन्यत्वेन ज्ञानस्य साक्षात्त्वम् अनुमित्यादेरपि मनोजन्यतया साक्षात्त्वापत्तेः ईश्वरज्ञानस्यानिन्द्रियजन्यस्य साक्षात्त्वानापत्तेश्च।", "padacchedaText": "", "audioFile": "PB_000053.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000054", "originalText": "सिद्धान्ते प्रत्यक्षत्वप्रयोजकं किमिति चेत्, किं ज्ञानगतस्य प्रत्यक्षत्वस्य प्रयोजकं पृच्छसि? किंवा विषयगतस्य? आद्ये प्रमाणचैतन्यस्य विषयावच्छिन्नचैतन्याभेद इति ब्रूमः।", "padacchedaText": "", "audioFile": "PB_000054.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000055", "originalText": "तथाहि त्रिविधं चैतन्यम्— विषयचैतन्यं, प्रमाणचैतन्यं, प्रमातृचैतन्यं चेति।", "padacchedaText": "", "audioFile": "PB_000055.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000056", "originalText": "तत्र घटाद्यवच्छिन्नं चैतन्यं विषयचैतन्यम्, अन्तःकरणवृत्त्यवच्छिन्नं चैतन्यं प्रमाणचैतन्यम्, अन्तःकरणावच्छिन्नं चैतन्यं प्रमातृचैतन्यम्।", "padacchedaText": "", "audioFile": "PB_000056.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000057", "originalText": "तत्र यथा तडागोदकं छिद्रान्निर्गत्य कुल्यात्मना केदारान् प्रविश्य तद्वदेव चतुष्कोणाद्याकारं भवति, तथा तैजसमन्तःकरणमपि चक्षुरादिद्वारा निर्गत्य घटादिविषयदेशं गत्वा घटादिविषयाकारेण परिणमते।", "padacchedaText": "", "audioFile": "PB_000057.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000058", "originalText": "स एव परिणामो वृत्तिरित्युच्यते।", "padacchedaText": "", "audioFile": "PB_000058.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000059", "originalText": "अनुमित्यादिस्थले तु अन्तःकरणस्य न वह्न्यादिदेशगमनम्, वह्न्यादेश्चक्षुराद्यसन्निकर्षात्।", "padacchedaText": "", "audioFile": "PB_000059.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000060", "originalText": "तथा च \"अयं घटः\" इत्यादिप्रत्यक्षस्थले घटादेस्तदाकारवृत्तेश्च बहिरेकत्र देशे समवधानात् तदुभयावच्छिन्नं चैतन्यमेकमेव, विभाजकयोरप्यन्तःकरणवृत्तिघटादिविषययोः एकदेशस्थत्वेन भेदाजनकत्वात्।", "padacchedaText": "", "audioFile": "PB_000060.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000061", "originalText": "अत एव मठान्तर्वर्तिघटावच्छिन्नाकाशो न मठावच्छिन्नाकाशाद्भिद्यते।", "padacchedaText": "", "audioFile": "PB_000061.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000062", "originalText": "तथा च \"अयं घटः\" इति घटप्रत्यक्षस्थले घटाकारवृत्तेर्घटसंयोगितया घटावच्छिन्नचैतन्यस्य तद्वृत्त्यवच्छिन्नचैतन्यस्य चाभिन्नतया तत्र घटज्ञानस्य घटांंशे प्रत्यक्षत्वम्।", "padacchedaText": "", "audioFile": "PB_000062.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000063", "originalText": "सुखाद्यवच्छिन्नचैतन्यस्य तद्वृत्त्यवच्छिन्नचैतन्यस्य च नियमेनैकदेशस्थितोपाधिद्वयावच्छिन्नत्वात् नियमेन \"अहं सुखी\" इत्यादिज्ञानस्य प्रत्यक्षत्वम्।", "padacchedaText": "", "audioFile": "PB_000063.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000064", "originalText": "नन्वेवं स्ववृत्तिसुखादिस्मरणस्यापि सुखाद्यंशे प्रत्यक्षत्वापत्तिरिति चेत् न।", "padacchedaText": "", "audioFile": "PB_000064.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000065", "originalText": "तत्र स्मर्यमाणसुखस्यातीतत्वेन स्मृतिरूपान्तःकरणवृत्तेर्वर्तमानत्वेन तत्रोपाध्योर्भिन्नकालीनतया तत्तदवच्छिन्नचैतन्ययोर्भेदात्।", "padacchedaText": "", "audioFile": "PB_000065.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000066", "originalText": "उपाध्योरेकदेशस्थत्वे सति एककालीनत्वस्यैवोपधेयाभेदप्रयोजकत्वात्।", "padacchedaText": "", "audioFile": "PB_000066.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000067", "originalText": "यदि चैकदेशस्थत्वमात्रमुपधेयाभेदप्रयोजकम्, तदा \"अहं पूर्वं सुखी\" इत्यादिस्मृतावतिव्याप्तिवारणाय वर्तमानत्वं विषयविशेषणं देयम्।", "padacchedaText": "", "audioFile": "PB_000067.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000068", "originalText": "नन्वेवमपि स्वकीयधर्माधर्मौ वर्तमानौ यदा शब्दादिना ज्ञायेते तदा तादृशशाब्दज्ञानादावतिव्याप्तिः, तत्र धर्माद्यवच्छिन्नतद्वृत्त्यवच्छिन्नचैतन्ययोरेकत्वादिति चेत् न।", "padacchedaText": "", "audioFile": "PB_000068.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000069", "originalText": "योग्यत्वस्यापि विषयविशेषणत्वात्।", "padacchedaText": "", "audioFile": "PB_000069.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000070", "originalText": "अन्तःकरणधर्मत्वाविशेषेऽपि किञ्चिद्योग्यं किञ्चिदयोग्यमित्यत्र फलबलकल्प्यः स्वभाव एव शरणम्।", "padacchedaText": "", "audioFile": "PB_000070.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000071", "originalText": "अन्यथा न्यायमतेऽप्यात्मधर्मत्वाविशेषात् सुखादिवत् धर्मादेरपि प्रत्यक्षत्वापत्तिर्दुर्वारा।", "padacchedaText": "", "audioFile": "PB_000071.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000072", "originalText": "न चैवमपि सुखस्य वर्तमानतादशायां \"त्वं सुखी\" इत्यादिवाक्यजन्यज्ञानस्य प्रत्यक्षता स्यादिति वाच्यम् इष्टत्वात्।", "padacchedaText": "", "audioFile": "PB_000072.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000073", "originalText": "\"दशमस्त्वमसि\" इत्यादौ सन्निकृष्टविषये शब्दादप्यपरोक्षज्ञानाभ्युपगमात्।", "padacchedaText": "", "audioFile": "PB_000073.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000074", "originalText": "अत एव \"पर्वतो वह्निमान्\" इत्यादिज्ञानमपि वह्न्यंशे परोक्षम्, पर्वतांशेऽपरोक्षम्, पर्वताद्यवच्छिन्नचैतन्यस्य बहिर्निःसृतान्तःकरणवृत्त्यवच्छिन्नचैतन्याभेदात्।", "padacchedaText": "", "audioFile": "PB_000074.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000075", "originalText": "वह्न्यंशे तु अन्तःकरणवृत्तिनिर्गमनाभावेन वह्न्यवच्छिन्नचैतन्यस्य प्रमाणचैतन्यस्य च परस्परं भेदात्।", "padacchedaText": "", "audioFile": "PB_000075.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000076", "originalText": "तथा चानुभवः \"पर्वतं पश्यामि, वह्निमनुमिनोमि\" इति।", "padacchedaText": "", "audioFile": "PB_000076.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000077", "originalText": "न्यायमते तु \"पर्वतमनुमिनोमि\" इत्यनुव्यवसायापत्तिः।", "padacchedaText": "", "audioFile": "PB_000077.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000078", "originalText": "असन्निकृष्टपक्षकानुमितौ तु सर्वांशेऽपि ज्ञानं परोक्षम्।", "padacchedaText": "", "audioFile": "PB_000078.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000079", "originalText": "\"सुरभि चन्दनम्\" इत्यादिज्ञानमपि चन्दनखण्डांशेऽपरोक्षम् सौरभांशे च परोक्षम् सौरभस्य चक्षुरिन्द्रियायोग्यतया योग्यत्वघटितस्य निरुक्तलक्षणस्याभावात्।", "padacchedaText": "", "audioFile": "PB_000079.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000080", "originalText": "न चैवमेकत्र ज्ञाने परोक्षत्वापरोक्षत्वयोरभ्युपगमे तयोर्जातित्वं न स्यादिति वाच्यम्, इष्टत्वात्।", "padacchedaText": "", "audioFile": "PB_000080.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000081", "originalText": "जातित्वोपाधित्वपरिभाषायाः सकलप्रमाणागोचरतयाऽप्रामाणिकत्वात्।", "padacchedaText": "", "audioFile": "PB_000081.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000082", "originalText": "\"घटोऽयम्\" इत्यादिप्रत्यक्षं हि घटत्वादिसद्भावे मानम्, न तु तस्य जातित्वेऽपि।", "padacchedaText": "", "audioFile": "PB_000082.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000083", "originalText": "जातित्वरूपसाध्याप्रसिद्धौ तत्साधकानुमानस्याप्यनवकाशात्।", "padacchedaText": "", "audioFile": "PB_000083.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000084", "originalText": "समवायासिद्ध्या ब्रह्मभिन्ननिखिलप्रपञ्चस्यानित्यतया च नित्यत्वसमवेतत्वघटितजातित्वस्य घटत्वादावसिद्धेश्च।", "padacchedaText": "", "audioFile": "PB_000084.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000085", "originalText": "एवमेवोपाधित्वं निरसनीयम्।", "padacchedaText": "", "audioFile": "PB_000085.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000086", "originalText": "\"पर्वतो वह्निमान्\" इत्यादौ च पर्वतांशे वह्न्यंशे चान्तःकरणवृत्तिभेदाङ्गीकारेण तत्तद्वृत्त्यवच्छेदकभेदेन परोक्षत्वापरोक्षत्वयोरेकत्र चैतन्ये वृत्तौ न कश्चित् विरोधः।", "padacchedaText": "", "audioFile": "PB_000086.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000087", "originalText": "तथा च \" तत्तदिन्द्रिययोग्यवर्तमानविषयावच्छिन्नचैतन्याभिन्नत्वं तत्तदाकारवृत्त्यवच्छिन्नज्ञानस्य तत्तदंशे प्रत्यक्षत्वम्\"।", "padacchedaText": "", "audioFile": "PB_000087.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000088", "originalText": "घटादेर्विषयस्य प्रत्यक्षत्वन्तु प्रमात्रभिन्नत्वम्।", "padacchedaText": "", "audioFile": "PB_000088.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000089", "originalText": "ननु कथं घटादेरन्तःकरणावच्छिन्नचैतन्याभेदः \"अहमिदं पश्यामि\" इति भेदानुभवविरोधादिति चेत् उच्यते।", "padacchedaText": "", "audioFile": "PB_000089.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000090", "originalText": "प्रमात्रभेदो नाम न तावदैक्यम् किन्तु प्रमातृसत्तातिरिक्तसत्ताकत्वाभावः।", "padacchedaText": "", "audioFile": "PB_000090.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000091", "originalText": "तथा च घटादेः स्वावच्छिन्नचैतन्येऽध्यस्ततया विषयचैतन्यसत्तैव घटादिसत्ता, अधिष्ठानसत्तातिरिक्ताया आरोपितसत्ताया अनङ्गीकारात्।", "padacchedaText": "", "audioFile": "PB_000091.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000092", "originalText": "विषयचैतन्यं च पूर्वोक्तप्रकारेण प्रमातृचैतन्यमेवेति प्रमातृचैतन्यस्यैव घटाद्यधिष्ठानतया प्रमातृसत्तैव घटादिसत्ता नान्येति सिद्धं घटादेरपरोक्षत्वम्।", "padacchedaText": "", "audioFile": "PB_000092.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000093", "originalText": "अनुमित्यादिस्थले त्वन्तःकरणस्य वह्न्यादिदेशनिर्गमनाभावेन वह्न्यवच्छिन्नचैतन्यस्य प्रमातृचैतन्यानात्मकतया वह्न्यादिसत्ता प्रमातृसत्तातो भिन्ना इति नातिव्याप्तिः।", "padacchedaText": "", "audioFile": "PB_000093.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000094", "originalText": "नन्वेवमपि धर्माधर्मादिगोचरानुमित्यादिस्थले धर्माधर्मयोः प्रत्यक्षत्वापत्तिः।", "padacchedaText": "", "audioFile": "PB_000094.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000095", "originalText": "धर्माद्यवच्छिन्नचैतन्यस्य प्रमातृचैतन्याभिन्नतया, धर्मादिसत्तायाः प्रमातृसत्तानतिरेकादिति चेत् न, योग्यत्वस्यापि विषयविशेषणत्वात्।", "padacchedaText": "", "audioFile": "PB_000095.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000096", "originalText": "नन्वेवमपि \"रूपी घटः\" इति प्रत्यक्षस्थले घटगतपरिमाणादेः प्रत्यक्षत्वापत्तिः, रूपावच्छिन्नचैतन्यस्य परिमाणाद्यवच्छिन्नचैतन्यस्य चैकतया, रूपावच्छिन्नचैतन्यस्य प्रमातृचैतन्याभेदे परिमाणाद्यवच्छिन्नचैतन्यस्यापि प्रमात्रभिन्नतया परिमाणादिसत्तायाः प्रमातृसत्तातिरिक्त्तत्वाभावात् इति चेत् न।", "padacchedaText": "", "audioFile": "PB_000096.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000097", "originalText": "तत्तदाकारवृत्त्युपहितत्वस्यापि प्रमातृविशेषणत्वात्।", "padacchedaText": "", "audioFile": "PB_000097.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000098", "originalText": "रूपाकारवृत्तिदशायां परिमाणाद्याकारवृत्त्यभावेन अतिव्याप्त्यभावात्।", "padacchedaText": "", "audioFile": "PB_000098.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000099", "originalText": "नन्वेवं वृत्तावव्याप्तिः।", "padacchedaText": "", "audioFile": "PB_000099.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000100", "originalText": "अनवस्थाभिया वृत्तिगोचरवृत्त्यनङ्गीकारेण, तत्र स्वाकारवृत्त्युपहितत्वघटितोक्तलक्षणाभावात् इति चेत् न।", "padacchedaText": "", "audioFile": "PB_000100.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000101", "originalText": "अनवस्थाभिया वृत्तेर्वृत्त्यन्तराविषयत्वेऽपि स्वविषयत्वाभ्युपगमेन स्वविषयवृत्त्युपहितप्रमातृचैतन्याभिन्नसत्ताकत्वस्य तत्रापि भावात्।", "padacchedaText": "", "audioFile": "PB_000101.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000102", "originalText": "एवाञ्चान्तःकरणतद्धर्मादीनां केवलसाक्षिविषयत्वेऽपि तत्तदाकारवृत्त्यभ्युपगमेन उक्तलक्षणस्य तत्रापि सत्त्वान्नाव्याप्तिः।", "padacchedaText": "", "audioFile": "PB_000102.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000103", "originalText": "न चान्तःकरणतद्धर्मादीनां वृत्तिविषयत्वाभ्युपगमे केवलसाक्षिवेद्यत्वाभ्युपगमविरोध इति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_000103.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000104", "originalText": "न हि वृत्तिं विना साक्षिविषयत्वं केवलसाक्षिवेद्यत्वम्, किन्त्विन्द्रियानुमानादिप्रमाणव्यापारमन्तरेण साक्षिविषयत्वम्।", "padacchedaText": "", "audioFile": "PB_000104.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000105", "originalText": "अत एवाहङ्कारटीकायामाचार्यैरहमाकारान्तःकरणवृत्तिरङ्गीकृता।", "padacchedaText": "", "audioFile": "PB_000105.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000106", "originalText": "अत एव च प्रातिभासिकरजतस्थले रजताकाराविद्यावृत्तिः साम्प्रदायिकैरङ्गीकृता।", "padacchedaText": "", "audioFile": "PB_000106.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000107", "originalText": "तथा चान्तःकरणतद्धर्मादिषु केवलसाक्षिवेद्येषु वृत्त्युपहितत्वघटितलक्षणस्य सत्त्वान्नाव्याप्तिः।", "padacchedaText": "", "audioFile": "PB_000107.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000108", "originalText": "तदयं निर्गलितार्थः \" स्वाकारवृत्त्युपहितप्रमातृचैतन्यसत्तातिरिक्तसत्ताकत्वशून्यत्वे सति योग्यत्वं विषयस्य प्रत्यक्षत्वम्।", "padacchedaText": "", "audioFile": "PB_000108.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000109", "originalText": "\" तत्र संयोगसंयुक्ततादात्म्यादीनां सन्निकार्षाणां चैतन्याभिव्यञ्जकवृत्तिजनने विनियोगः।", "padacchedaText": "", "audioFile": "PB_000109.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000110", "originalText": "सा च वृत्तिश्चतुर्विधा संशयो, निश्चयो, गर्वः, स्मरणमिति।", "padacchedaText": "", "audioFile": "PB_000110.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000111", "originalText": "एवंविधवृत्तिभेदेन एकमप्यन्तःकरणं मन इति, बुद्धिरिति, अहङ्कार इति, चित्तमिति चाख्यायते।", "padacchedaText": "", "audioFile": "PB_000111.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000112", "originalText": "तदुक्तम्— \" मनोबुद्धिरहङ्कारश्चित्तं करणमान्तरम्। संशयो निश्चयो गर्वः स्मरणं विषया इमे॥", "padacchedaText": "", "audioFile": "PB_000112.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000113", "originalText": "\"\nतच्च प्रत्यक्षं द्विविधम् सविकल्पकनिर्विकल्पकभेदात्।", "padacchedaText": "", "audioFile": "PB_000113.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000114", "originalText": "तत्र सविकल्पकं वैशिष्ट्यावगाहि ज्ञानम्।", "padacchedaText": "", "audioFile": "PB_000114.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000115", "originalText": "यथा \"घटमहं जानामि\" इत्यादिज्ञानम्।", "padacchedaText": "", "audioFile": "PB_000115.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000116", "originalText": "निर्विकल्पकन्तु संसर्गानवगाहि ज्ञानम्।", "padacchedaText": "", "audioFile": "PB_000116.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000117", "originalText": "यथा \"सोऽयं देवदत्तः\", \" तत्त्वमसि\" इत्यादिवाक्यजन्यं ज्ञानम्।", "padacchedaText": "", "audioFile": "PB_000117.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000118", "originalText": "ननु शाब्दमिदं ज्ञानम् न प्रत्यक्षम् इन्द्रियाजन्यत्वात् इति चेत् न।", "padacchedaText": "", "audioFile": "PB_000118.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000119", "originalText": "नहि इन्द्रियजन्यत्वं प्रत्यक्षत्वे तन्त्रम्, दूषितत्वात्।", "padacchedaText": "", "audioFile": "PB_000119.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000120", "originalText": "किन्तु योग्यवर्तमानविषयकत्वे सति प्रमाणचैतन्यस्य विषयचैतन्याभिन्नत्वमित्युक्तम्।", "padacchedaText": "", "audioFile": "PB_000120.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000121", "originalText": "तथाच \"सोऽयं देवदत्तः\" इति वाक्यजन्यज्ञानस्य सन्निकृष्टविषयतया बहिर्निःसृतान्तःकरणवृत्त्यभ्युपगमेन देवदत्तावच्छिन्नचैतन्यस्य वृत्त्यवच्छिन्नचैतन्याभिन्नतया \"सोऽयं देवदत्तः\" इति वाक्यजन्यज्ञानस्य प्रत्यक्षत्वम्।", "padacchedaText": "", "audioFile": "PB_000121.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000122", "originalText": "एवं \" तत्त्वमसि\" इत्यादिवाक्यजन्यज्ञानस्यापि।", "padacchedaText": "", "audioFile": "PB_000122.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000123", "originalText": "तत्र प्रमातुरेव विषयतया तदुभयाभेदस्य सत्त्वात्।", "padacchedaText": "", "audioFile": "PB_000123.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000124", "originalText": "ननु वाक्यजन्यज्ञानस्य पदार्थसंसर्गावगाहितया कथं निर्विकल्पकत्वम्? उच्यते।", "padacchedaText": "", "audioFile": "PB_000124.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000125", "originalText": "वाक्यजन्यज्ञानविषयत्वे हि न पदार्थसंसर्गत्वं तन्त्रम्, अनभिमतसंसर्गस्यापि वाक्यजन्यज्ञानविषयत्वापत्तेः।", "padacchedaText": "", "audioFile": "PB_000125.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000126", "originalText": "किन्तु तात्पर्यविषयत्वम्।", "padacchedaText": "", "audioFile": "PB_000126.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000127", "originalText": "प्रकृते च \" सदेव सोम्येदमग्र आसीत्\"(छा.उ. ६.२.१) इत्युपक्रम्य \"तत् सत्यम्, स आत्मा, तत्त्वमसि श्वेतकेतो\"(छा.उ. ६.१४.३) इत्युपसंहारेण विशुद्धे ब्रह्मणि वेदान्तानां तात्पर्यमवसितम् इति कथं तात्पर्याविषयं संसर्गमवबोधयेत्? इदमेव \" तत्त्वमसि\"(छा.उ. ६.८.७) इत्यादिवाक्यानामखण्डार्थत्वं यत् संसर्गानवगाहियथार्थज्ञानजनकत्वमिति।", "padacchedaText": "", "audioFile": "PB_000127.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000128", "originalText": "तदुक्तम्— \" संसर्गासङ्गिसम्यग्धीहेतुता या गिरामियम्। उक्ताखण्डार्थता यद्वा तत्प्रातिपदिकार्थता॥", "padacchedaText": "", "audioFile": "PB_000128.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000129", "originalText": "\" प्रातिपदिकार्थमात्रपरत्वं वाऽखण्डार्थत्वम् इति चतुर्थपादार्थः।", "padacchedaText": "", "audioFile": "PB_000129.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000130", "originalText": "तच्च प्रत्यक्षं पुनर्द्विविधम्, जीवसाक्षि ईश्वरसाक्षि चेति।", "padacchedaText": "", "audioFile": "PB_000130.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000131", "originalText": "तत्र जीवो नाम अन्तःकरणावच्छिन्नं चैतन्यम् तत्साक्षी तु अन्तःकरणोपहितं चैतन्यम्।", "padacchedaText": "", "audioFile": "PB_000131.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000132", "originalText": "अन्तःकरणस्य विशेषणत्वोपाधित्वाभ्यामनयोर्भेदः।", "padacchedaText": "", "audioFile": "PB_000132.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000133", "originalText": "विशेषणञ्च कार्यान्वयि वर्तमानं व्यावर्तकम्।", "padacchedaText": "", "audioFile": "PB_000133.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000134", "originalText": "उपाधिश्च कार्यानन्वयी व्यावर्तको वर्तमानश्च।", "padacchedaText": "", "audioFile": "PB_000134.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000135", "originalText": "\"रूपविशिष्टो घटोऽनित्यः\" इत्यत्र रूपं विशेषणम्, \"कर्णशष्कुल्यवच्छिन्नं नभः श्रोत्रम्\" इत्यत्र कर्णशष्कुल्युपाधिः।", "padacchedaText": "", "audioFile": "PB_000135.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000136", "originalText": "अयमेवोपाधिर्नैयायिकैः परिचायक इत्युच्यते।", "padacchedaText": "", "audioFile": "PB_000136.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000137", "originalText": "प्रकृते चान्तःकरणस्य जडतया विषयभासकत्वायोगेन विषयभासकचैतन्योपाधित्वम्।", "padacchedaText": "", "audioFile": "PB_000137.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000138", "originalText": "अयञ्च जीवसाक्षी प्रत्यात्मं नाना एकत्वे चैत्रावगते मैत्रस्याप्यनुसन्धानप्रसङ्गः।", "padacchedaText": "", "audioFile": "PB_000138.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000139", "originalText": "ईश्वरसाक्षी तु मायोपहितं चैतन्यम्।", "padacchedaText": "", "audioFile": "PB_000139.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000140", "originalText": "तच्चैकम् तदुपाधिभूतमायाया एकत्वात्।", "padacchedaText": "", "audioFile": "PB_000140.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000141", "originalText": "\" इन्द्रो मायाभिः पुरुरूप ईयते\"(बृ.उ. २.५.१९) इत्यादिश्रुतौ मायाभिरिति बहुवचनस्य मायागतशक्तिविशेषाभिप्रायतया, मायागतसत्त्वरजस्तमोरूपगुणाभिप्रायतया वोपपत्तिः।", "padacchedaText": "", "audioFile": "PB_000141.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000142", "originalText": "\"मायान्तु प्रकृतिं विद्यान्मायिनं तु महेश्वरम्।", "padacchedaText": "", "audioFile": "PB_000142.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000143", "originalText": "(श्वे.उ. ४.१०.) तरत्यविद्यां विततां हृदि यस्मिन्निवेशिते। योगी मायाममेयाय तस्मै विद्यात्मने नमः॥", "padacchedaText": "", "audioFile": "PB_000143.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000144", "originalText": "अजामेकां लोहितशुक्लकृष्णां बह्वीः प्रजाः सृजमानां सरूपाः। अजो ह्येको जुषमाणोऽनुशेते जहात्येनां भुक्तभोगामजोऽन्यः॥", "padacchedaText": "", "audioFile": "PB_000144.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000145", "originalText": "\"(श्वे.उ. ४.५.) इत्यादि श्रुतिस्मृतिषु एकवचनेन लाघवानुगृहीतेन मायाया एकत्वं निश्चीयते।", "padacchedaText": "", "audioFile": "PB_000145.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000146", "originalText": "ततश्च तदुपहितं चैतन्यम् ईश्वरसाक्षी।", "padacchedaText": "", "audioFile": "PB_000146.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000147", "originalText": "तच्चानादि, तदुपाधेर्मायाया अनादित्वात्।", "padacchedaText": "", "audioFile": "PB_000147.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000148", "originalText": "मायावच्छिन्नं चैतन्यं च परमेश्वरः।", "padacchedaText": "", "audioFile": "PB_000148.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000149", "originalText": "मायाया विशेषणत्वे ईश्वरत्वम्, उपाधित्वे साक्षित्वं इतीश्वरत्वसाक्षित्वयोर्भेदः, न तु धर्मिणोरीश्वरतत्साक्षिणोः।", "padacchedaText": "", "audioFile": "PB_000149.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000150", "originalText": "स च परमेश्वर एकोऽपि स्वोपाधिभूतमायानिष्ठसत्त्वरजस्तमोगुणभेदेन ब्रह्मविष्णुमहेश्वरादिशब्दवाच्यतां भजते।", "padacchedaText": "", "audioFile": "PB_000150.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000151", "originalText": "ननु ईश्वरसाक्षिणोऽनादित्वे \" तदैक्षत, बहुस्यां प्रजायेय\"(छा.उ. ६.२.३) इत्यादौ सृष्टिपूर्वसमये परमेश्वरस्यागन्तुकमीक्षणमुच्यमानं कथमुपपद्यते? उच्यते।", "padacchedaText": "", "audioFile": "PB_000151.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000152", "originalText": "यथा विषयेन्द्रियसन्निकर्षादिकारणवशेन जीवोपाध्यन्तःकरणस्य वृत्तिभेदा जायन्ते, तथा सृज्यमानप्राणिकर्मवशेन परमेश्वरोपाधिभूतमायाया वृत्तिविशेषाः \"इदमिदानीं स्रष्टव्यम्\", \"इदमिदानीं पालयितव्यम्\", \"इदमिदानीं संहर्तव्यम्\" इत्याद्याकारा जायन्ते।", "padacchedaText": "", "audioFile": "PB_000152.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000153", "originalText": "तासां च वृत्तीनां सादित्वात्तत्प्रतिबिम्बितचैतन्यमपि सादीत्युच्यते।", "padacchedaText": "", "audioFile": "PB_000153.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000154", "originalText": "एवं साक्षिद्वैविध्येन प्रत्यक्षज्ञानद्वैविध्यम्।", "padacchedaText": "", "audioFile": "PB_000154.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000155", "originalText": "प्रत्यक्षत्वं च ज्ञेयगतं, ज्ञप्तिगतं च निरूपितम्।", "padacchedaText": "", "audioFile": "PB_000155.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000156", "originalText": "तत्र ज्ञप्तिगतप्रत्यक्षत्वस्य सामान्यलक्षणं चित्त्वमेव।", "padacchedaText": "", "audioFile": "PB_000156.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000157", "originalText": "\"पर्वतो वह्निमान्\" इत्यादावपि वह्न्याद्याकारवृत्त्युपहितचैतन्यस्य स्वात्मांशे स्वप्रकाशतया प्रत्यक्षत्वात्।", "padacchedaText": "", "audioFile": "PB_000157.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000158", "originalText": "तत्तद्विषयांशे प्रत्यक्षत्वन्तु पूर्वोक्तमेव।", "padacchedaText": "", "audioFile": "PB_000158.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000159", "originalText": "तस्य च भ्रान्तिरूपप्रत्यक्षे नातिव्याप्तिः, भ्रमप्रमासाधारणप्रत्यक्षत्वसामान्यनिर्वचनेन तस्यापि लक्ष्यत्वात्।", "padacchedaText": "", "audioFile": "PB_000159.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000160", "originalText": "यदा तु प्रत्यक्षप्रमाया एव लक्षणं वक्तव्यं तदा पूर्वोक्तलक्षणेऽबाधितत्वं विषयविशेषणं देयम्।", "padacchedaText": "", "audioFile": "PB_000160.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000161", "originalText": "शुक्तिरूप्यादिभ्रमस्य संसारकालीनबाधविषयप्रातिभासिकरजतादिविषयकत्वेनोक्तलक्षणाभावात् नातिव्याप्तिः।", "padacchedaText": "", "audioFile": "PB_000161.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000162", "originalText": "ननु विसंवादिप्रवृत्त्या भ्रान्तिज्ञानसिद्धावपि तस्य प्रातिभासिकतत्कालोत्पन्नरजतादिविषयकत्वे न प्रमाणम्, देशान्तरीयरजतस्य क्लृप्तस्यैव तद्विषयत्वसम्भवादिति चेन्न।", "padacchedaText": "", "audioFile": "PB_000162.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000163", "originalText": "तस्यासन्निकृष्टतया प्रत्यक्षविषयत्वायोगात्।", "padacchedaText": "", "audioFile": "PB_000163.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000164", "originalText": "न च ज्ञानं तत्र प्रत्यासत्तिः, ज्ञानस्य प्रत्यासत्तित्वे, तत एव वह्न्यादेः प्रत्यक्षत्वापत्तौ अनुमानाद्युच्छेदापत्तेः।", "padacchedaText": "", "audioFile": "PB_000164.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000165", "originalText": "ननु रजतोत्पादकानां रजतावयवादीनामभावे शुक्तौ कथं तवापि रजतमुत्पद्यते इति चेत् उच्यते।", "padacchedaText": "", "audioFile": "PB_000165.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000166", "originalText": "न हि लोकसिद्धसामग्री प्रातिभासिकरजतोत्पादिका किन्तु विलक्षणैव।", "padacchedaText": "", "audioFile": "PB_000166.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000167", "originalText": "तथा हि— काचादिदोषदूषितलोचनस्य पुरोवर्तिद्रव्यसंयोगादिदमाकारा, चाकचिक्याकारा च काचिदन्तःकरणवृत्तिरुदेति।", "padacchedaText": "", "audioFile": "PB_000167.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000168", "originalText": "तस्यां च वृत्तौ इदमवच्छिन्नचैतन्यं प्रतिबिम्बते।", "padacchedaText": "", "audioFile": "PB_000168.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000169", "originalText": "तत्र पूर्वोक्तरीत्या वृत्तेर्निर्गमनेन इदमवच्छिन्नचैतन्यं, वृत्त्यवच्छिन्नचैतन्यं, प्रमातृचैतन्यं चाभिन्नं भवति।", "padacchedaText": "", "audioFile": "PB_000169.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000170", "originalText": "ततश्च प्रमातृचैतन्याभिन्नविषयचैतन्यनिष्ठा शुक्तित्वप्रकारिकाऽविद्या, चाकचिक्यादिसादृश्यसन्दर्शनसमुद्बोधितरजतसंस्कारसध्रीचीना, काचादिदोषसमवहिता रजतरूपार्थाकारेण रजतज्ञानाभासाकारेण च परिणमते।", "padacchedaText": "", "audioFile": "PB_000170.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000171", "originalText": "परिणामो नाम उपादानसमसत्ताककार्यापत्तिः।", "padacchedaText": "", "audioFile": "PB_000171.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000172", "originalText": "विवर्तो नाम उपादानविषमसत्ताककार्यापत्तिः।", "padacchedaText": "", "audioFile": "PB_000172.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000173", "originalText": "प्रातिभासिकरजतञ्चाविद्यापेक्षया परिणाम इति चैतन्यापेक्षया विवर्त इति चोच्यते।", "padacchedaText": "", "audioFile": "PB_000173.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000174", "originalText": "अविद्यापरिणामरूपञ्च तद्रजतमविद्याधिष्ठाने इदमवच्छिन्नचैतन्ये वर्तते।", "padacchedaText": "", "audioFile": "PB_000174.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000175", "originalText": "अस्मन्मते सर्वस्यापि कार्यस्य स्वोपादानाविद्याधिष्ठानाश्रितत्वनियमात्।", "padacchedaText": "", "audioFile": "PB_000175.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000176", "originalText": "ननु चैतन्यनिष्ठरजतस्य कथमिदं रजतमितिपुरोवर्तिना तादात्म्यम्।", "padacchedaText": "", "audioFile": "PB_000176.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000177", "originalText": "उच्यते यथा न्यायमते आत्मनिष्ठस्य सुखादेः शरीरनिष्ठत्वेनोपलम्भः, शरीरस्य सुखाद्यधिकरणतावच्छेदकत्वात्, तथा चैतन्यमात्रस्य रजतं प्रत्यनधिष्ठानतया इदमवच्छिन्नचैतन्यस्य तदधिष्ठानत्वेन इदमोऽवच्छेदकतया रजतस्य पुरोवर्तिसंसर्गप्रत्यय उपपद्यते।", "padacchedaText": "", "audioFile": "PB_000177.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000178", "originalText": "तस्य च विषयचैतन्यस्य तदन्तःकरणोपहितचैतन्याभिन्नतया विषयचैतन्येऽध्यस्तमपि रजतं साक्षिण्यध्यस्तं केवलसाक्षिवेद्यं सुखादिवदनन्यवेद्यमिति चोच्यते।", "padacchedaText": "", "audioFile": "PB_000178.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000179", "originalText": "ननु साक्षिण्यध्यस्तत्वे \"अहं रजतम्\" इति \"तद्वान्\" इति वा प्रत्ययः स्यात्, \"अहं सुखी\" इतिवत् इति चेत् उच्यते।", "padacchedaText": "", "audioFile": "PB_000179.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000180", "originalText": "न हि सुखादीनामन्तःकरणावच्छिन्नचैतन्यनिष्ठाविद्याकार्यत्वप्रयुक्तम् \"अहं सुखी\" इति ज्ञानम्, सुखादीनां घटादिवच्छुद्धचैतन्य एवाध्यासात्।", "padacchedaText": "", "audioFile": "PB_000180.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000181", "originalText": "किन्तु यस्य यदाकारानुभवाहितसंस्कारसहकृताविद्याकार्यत्वं तस्य तदाकारानुभवविषयत्वम् इत्येवानुगतं नियामकम्।", "padacchedaText": "", "audioFile": "PB_000181.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000182", "originalText": "तथा च इदमाकारानुभवाहितसंस्कारसहिताविद्याकार्यत्वाद् घटादेरिदमाकारानुभवविषयत्वम्, अहमाकारानुभवाहितसंस्कारसहकृताविद्याकार्यत्वादन्तःकरणादेरहमाकारानुभवविषयत्वम्, शरीरेन्द्रियादेरुभयविधानुभवसंस्कारसहिताविद्याकार्यत्वादुभयविधानुभवविषयत्वम्।", "padacchedaText": "", "audioFile": "PB_000182.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000183", "originalText": "तथा चोभयविधानुभवः इदं शरीरम्, अहं मनुष्यः, अहं ब्राह्मणः, इदं चक्षुः, अहं काणः, इदं श्रोत्रम्, अहं बधिर, इति।", "padacchedaText": "", "audioFile": "PB_000183.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000184", "originalText": "प्रकृते प्रातिभासिकरजतस्य प्रमातृचैतन्याभिन्नेदमवच्छिन्नचैतन्यनिष्ठाविद्याकार्यत्वेऽपि इदं रजतमिति सत्यस्थलीयेदमाकारानुभवाहितसंस्कारजन्यत्वादिदमाकारानुभवविषयता न तु \"अहं रजतम्\" इत्यहमाकारानुभवविषयता इत्यनुसन्धेयम्।", "padacchedaText": "", "audioFile": "PB_000184.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000185", "originalText": "नन्वेवमपि मिथ्यारजतस्य साक्षात् साक्षिसम्बन्धितया भानसम्भवे रजतगोचरज्ञानाभासरूपाया अविद्यावृत्तेरभ्युपगमः किमर्थमिति चेत् उच्यते।", "padacchedaText": "", "audioFile": "PB_000185.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000186", "originalText": "स्वगोचरवृत्त्युपहितप्रमातृचैतन्यभिन्नसत्ताकत्वाभावस्य विषयापरोक्षत्वरूपतया रजतस्यापरोक्षत्वसिद्धये तदभ्युपगमात्।", "padacchedaText": "", "audioFile": "PB_000186.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000187", "originalText": "नन्विदंवृत्ते रजताकारवृत्तेश्च प्रत्येकमेकैकविषयत्वे गुरुमतवद्विशिष्टज्ञानानभ्युपगमे कुतो भ्रमज्ञानसिद्धिरिति चेत् न।", "padacchedaText": "", "audioFile": "PB_000187.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000188", "originalText": "वृत्तिद्वयप्रतिबिम्बितचैतन्यस्यैकस्य सत्यमिथ्यावस्तुतादात्म्यावगाहित्वेन भ्रमत्वस्वीकारात्।", "padacchedaText": "", "audioFile": "PB_000188.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000189", "originalText": "अत एव साक्षिज्ञानस्य सत्यासत्यविषयतया प्रामाण्यानियमादप्रामाण्योक्तिः साम्प्रदायिकानाम्।", "padacchedaText": "", "audioFile": "PB_000189.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000190", "originalText": "ननु सिद्धान्ते देशान्तरीयरजतमप्यविद्याकार्यमध्यस्तञ्चेति कथं शुक्तिरूप्यस्य ततो वैलक्षण्यम् इति चेत् न।", "padacchedaText": "", "audioFile": "PB_000190.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000191", "originalText": "त्वन्मते सत्यत्वाविशेषेऽपि केषाञ्चित् क्षणिकत्वं केषाञ्चित् स्थायित्वम् इत्यत्र यदेव नियामकं तदेव स्वभावविशेषादिकं ममापि।", "padacchedaText": "", "audioFile": "PB_000191.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000192", "originalText": "यद्वा घटाद्यध्यासे अविद्यैव दोषत्वेन हेतुः।", "padacchedaText": "", "audioFile": "PB_000192.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000193", "originalText": "शुक्तिरूप्याद्यध्यासे तु काचादयोऽपि दोषाः।", "padacchedaText": "", "audioFile": "PB_000193.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000194", "originalText": "तथा चागन्तुकदोषजन्यत्वं प्रातिभासिकत्वे प्रयोजकम्।", "padacchedaText": "", "audioFile": "PB_000194.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000195", "originalText": "अत एव स्वप्नोपलब्धरथादीनामागन्तुकनिद्रादोषजन्यत्वात् प्रातिभासिकत्वम्।", "padacchedaText": "", "audioFile": "PB_000195.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000196", "originalText": "ननु स्वप्नस्थले पूर्वानुभूतरथादेः स्मरणमात्रेणैव व्यवहारोपपत्तौ न रथादिसृष्टिकल्पनम्, गौरवात् इति चेत् न।", "padacchedaText": "", "audioFile": "PB_000196.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000197", "originalText": "रथादेः स्मृतिमात्राभ्युपगमे \"रथं पश्यामि\", \"स्वप्ने रथमद्राक्षम्\" इत्याद्यनुभवविरोधापत्तेः।", "padacchedaText": "", "audioFile": "PB_000197.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000198", "originalText": "\" अथ रथान् रथयोगान् पथः सृजते\"(बृ.उ. ४.३.१०) इति रथादिसृष्टिप्रतिपादकश्रुतिविरोधापत्तेश्च।", "padacchedaText": "", "audioFile": "PB_000198.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000199", "originalText": "तस्मात् शुक्तिरूप्यवत् स्वप्नोपलब्धरथादयोऽपि प्रातिभासिका यावत्प्रतिभासमवतिष्ठन्ते।", "padacchedaText": "", "audioFile": "PB_000199.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000200", "originalText": "ननु स्वप्ने रथाद्यधिष्ठानतयोपलभ्यमानदेशविशेषस्यापि तदाऽसन्निकृष्टतया अनिर्वचनीयप्रातिभासिकदेशोऽभ्युपगन्यव्यः।", "padacchedaText": "", "audioFile": "PB_000200.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000201", "originalText": "तथा च रथाद्यध्यासः कुत्र इति चेत् न।", "padacchedaText": "", "audioFile": "PB_000201.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000202", "originalText": "चैतन्यस्य स्वयंप्रकाशस्य रथाद्यधिष्ठानत्वात्।", "padacchedaText": "", "audioFile": "PB_000202.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000203", "originalText": "प्रतीयमानं रथाद्यस्तीत्येव प्रतीयते इति सद्रूपेण प्रकाशमानं चैतन्यमेवाधिष्ठानम्।", "padacchedaText": "", "audioFile": "PB_000203.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000204", "originalText": "देशविशेषोऽपि चिदध्यस्तः प्रातिभासिकः, रथादाविन्द्रियग्राह्यत्वमपि प्रातिभासिकम्, तदा सर्वेन्द्रियाणामुपरमात्।", "padacchedaText": "", "audioFile": "PB_000204.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000205", "originalText": "\"अहं रथः\" इत्यादिप्रतीत्यापादनन्तु पूर्ववन्निरसनीयम्।", "padacchedaText": "", "audioFile": "PB_000205.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000206", "originalText": "स्वप्नरथादयः साक्षान्मायापरिणामा इति केचित्।", "padacchedaText": "", "audioFile": "PB_000206.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000207", "originalText": "अन्तःकरणद्वारा तत्परिणामा इत्यन्ये।", "padacchedaText": "", "audioFile": "PB_000207.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000208", "originalText": "ननु रथादेः शुद्धचैतन्याध्यस्तत्वे इदानीं तत्साक्षात्काराभावेन जागरणेऽपि स्वप्नोपलब्धरथादयोऽनुवर्तेरन्।", "padacchedaText": "", "audioFile": "PB_000208.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000209", "originalText": "उच्यते।", "padacchedaText": "", "audioFile": "PB_000209.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000210", "originalText": "कार्यविनाशो हि द्विविधः।", "padacchedaText": "", "audioFile": "PB_000210.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000211", "originalText": "कश्चिदुपादानेन सह, कश्चित्तु विद्यमान एवोपादाने।", "padacchedaText": "", "audioFile": "PB_000211.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000212", "originalText": "आद्यो बाधः, द्वितीयस्तु निवृत्तिः।", "padacchedaText": "", "audioFile": "PB_000212.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000213", "originalText": "आद्यस्य कारणमधिष्ठानतत्त्वसाक्षात्कारः।", "padacchedaText": "", "audioFile": "PB_000213.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000214", "originalText": "तेन विनोपादानभूताया अविद्याया अनिवृत्तेः।", "padacchedaText": "", "audioFile": "PB_000214.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000215", "originalText": "द्वितीयस्य कारणं विरोधिवृत्त्युत्पत्तिर्दोषनिवृत्तिर्वा।", "padacchedaText": "", "audioFile": "PB_000215.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000216", "originalText": "तदिह ब्रह्मसाक्षात्काराभावात् स्वप्नप्रपञ्चो मा बाधिष्ट, मुसलप्रहारेण घटादेरिव विरोधिप्रत्ययान्तरोदयेन स्वजनकीभूतनिद्रादिदोषनाशेन वा रथादिनिवृत्तौ को विरोधः?\nएवं च शुक्तिरूप्यस्य शुक्त्यवच्छिन्नचैतन्यनिष्ठतूलाविद्याकार्यत्वपक्षे शुक्तिरितिज्ञानेन तदज्ञानेन सह रजतस्य बाधः।", "padacchedaText": "", "audioFile": "PB_000216.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000217", "originalText": "मूलाविद्याकार्यत्वपक्षे तु मूलाविद्याया ब्रह्मसाक्षात्कारमात्रनिवर्त्यतया शुक्तितत्त्वज्ञानेनानिवर्त्यतया तत्र शुक्तिज्ञानान्निवृत्तिमात्रम् मुसलप्रहारेण घटस्येव।", "padacchedaText": "", "audioFile": "PB_000217.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000218", "originalText": "ननु शुक्तौ रजतस्य प्रतिभाससमये सत्ताभ्युपगमे \"नेदं रजतम्\" इति त्रैकालिकनिषेधज्ञानं न स्यात्।", "padacchedaText": "", "audioFile": "PB_000218.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000219", "originalText": "किन्तु \"इदानीमिदं न रजतम्\" इति स्यात्, \"इदानीं घटः श्यामो न\" इतिवत् इति चेत् न।", "padacchedaText": "", "audioFile": "PB_000219.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000220", "originalText": "नहि तत्र रजतत्वावच्छिन्नप्रतियोगिताकाभावो निषेधधीविषयः।", "padacchedaText": "", "audioFile": "PB_000220.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000221", "originalText": "किन्तु लौकिकपारमार्थिकत्वावच्छिन्नप्रातिभासिकरजतप्रतियोगिताकः व्यधिकरणधर्मावच्छिन्नप्रतियोगिताकाभावाभ्युपगमात्।", "padacchedaText": "", "audioFile": "PB_000221.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000222", "originalText": "ननु प्रातिभासिके रजते पारमार्थिकत्वमवगतं न वा।", "padacchedaText": "", "audioFile": "PB_000222.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000223", "originalText": "अनवगमे प्रतियोगितावच्छेदकावच्छिन्नरजतसत्त्वज्ञानाभावादभावप्रत्यक्षानुपपत्तिः।", "padacchedaText": "", "audioFile": "PB_000223.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000224", "originalText": "अवगमेऽपरोक्षावभासस्य तत्कालीनविषयसत्तानियतत्वाद् रजते पारमार्थिकत्वमप्यनिर्वचनीयं रजतवदेवोत्पन्नमिति तदवच्छिन्नरजतसत्त्वे तदवच्छिन्नाभावस्तत्र कथं वर्तत इति चेत् न।", "padacchedaText": "", "audioFile": "PB_000224.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000225", "originalText": "पारमार्थिकत्वस्याधिष्ठाननिष्ठस्य रजते प्रतिभाससम्भवेन रजतनिष्ठपारमार्थिकत्वोत्पत्त्यनभ्युपगमात्।", "padacchedaText": "", "audioFile": "PB_000225.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000226", "originalText": "यत्रारोप्यमसन्निकृष्टं तत्रैव प्रातिभासिकवस्तूत्पत्तेरङ्गीकारात्।", "padacchedaText": "", "audioFile": "PB_000226.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000227", "originalText": "अत एव इन्द्रियसन्निकृष्टतया जपाकुसुमगतलौहित्यस्य स्फटिके भानसम्भवात् न स्फटिकेऽनिर्वचनीयलौहित्योत्पत्तिः।", "padacchedaText": "", "audioFile": "PB_000227.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000228", "originalText": "नन्वेवं यत्र जपाकुसुमं द्रव्यान्तरव्यवधानादसन्निकृष्टं तत्र लौहित्यप्रतीत्या प्रातिभासिकं लौहित्यं स्वीक्रियतामिति चेत् न, इष्टत्वात्।", "padacchedaText": "", "audioFile": "PB_000228.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000229", "originalText": "एवं प्रत्यक्षभ्रमान्तरेष्वपि प्रत्यक्षसामान्यलक्षणानुगमो यथार्थप्रत्यक्षलक्षणासद्भावश्च दर्शनीयः।", "padacchedaText": "", "audioFile": "PB_000229.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000230", "originalText": "उक्तं प्रत्यक्षं प्रकारान्तरेण द्विविधम् इन्द्रियजन्यं तदजन्यं चेति।", "padacchedaText": "", "audioFile": "PB_000230.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000231", "originalText": "तत्रेन्द्रियाजन्यं सुखादिप्रत्यक्षम्, मनस इन्द्रियत्वनिराकरणात्।", "padacchedaText": "", "audioFile": "PB_000231.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000232", "originalText": "इन्द्रियाणि पञ्च घ्राणरसनचक्षुःश्रोत्रत्वगात्मकानि।", "padacchedaText": "", "audioFile": "PB_000232.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000233", "originalText": "सर्वाणि चेन्द्रियाणि स्वस्वविषयसंयुक्तान्येव प्रत्यक्षज्ञानं जनयन्ति।", "padacchedaText": "", "audioFile": "PB_000233.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000234", "originalText": "तत्र घ्राणरसनत्वगिन्द्रियाणि स्वस्थानस्थितान्येव गन्धरसस्पर्शोपलम्भान् जनयन्ति।", "padacchedaText": "", "audioFile": "PB_000234.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000235", "originalText": "चक्षुःश्रोत्रे तु स्वत एव विषयदेशं गत्वा स्वस्वविषयं गृह्णीतः, श्रोत्रस्यापि चक्षुरादिवत् परिच्छिन्नतया भेर्यादिदेशगमनसम्भवात्।", "padacchedaText": "", "audioFile": "PB_000235.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000236", "originalText": "अत एवानुभवो \"भेरीशब्दो मया श्रुतः\" इति।", "padacchedaText": "", "audioFile": "PB_000236.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000237", "originalText": "वीचितरङ्गादिन्यायेन कर्णशष्कुलीप्रदेशेऽनन्तशब्दोत्पत्तिकल्पनायां गौरवम्।", "padacchedaText": "", "audioFile": "PB_000237.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000238", "originalText": "\"भेरीशब्दो मया श्रुतः\" इति प्रत्यक्षस्य भ्रमत्वकल्पनायां गौरवं च स्यात्।", "padacchedaText": "", "audioFile": "PB_000238.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000239", "originalText": "तदेवं व्याख्यातं प्रत्यक्षम्।", "padacchedaText": "", "audioFile": "PB_000239.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000240", "originalText": "इति वेदान्तपरिभषायां प्रत्यक्षपरिच्छेदः।", "padacchedaText": "", "audioFile": "PB_000240.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000241", "originalText": "अनुमानप्रमाणम्\nअथानुमानं निरूप्यते।", "padacchedaText": "", "audioFile": "PB_000241.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000242", "originalText": "अनुमितिकरणमनुमानम्।", "padacchedaText": "", "audioFile": "PB_000242.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000243", "originalText": "अनुमितिश्च व्याप्तिज्ञानत्वेन व्याप्तिज्ञानजन्या।", "padacchedaText": "", "audioFile": "PB_000243.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000244", "originalText": "व्याप्तिज्ञानानुव्यवसायादेस्तत्त्वेन तज्जन्यत्वाभावान्नानुमितित्वम्।", "padacchedaText": "", "audioFile": "PB_000244.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000245", "originalText": "अनुमितिकरणं च व्याप्तिज्ञानम्।", "padacchedaText": "", "audioFile": "PB_000245.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000246", "originalText": "तत्संस्कारोऽवान्तरव्यापारः।", "padacchedaText": "", "audioFile": "PB_000246.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000247", "originalText": "न तु तृतीयलिङ्गपरामर्शोऽनुमितौ करणम्, तस्यानुमितिहेतुत्वासिद्ध्या तत्करणत्वस्य दूरनिरस्तत्वात्।", "padacchedaText": "", "audioFile": "PB_000247.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000248", "originalText": "न च संस्कारजन्यत्वेनानुमितेः स्मृतित्वापत्तिः।", "padacchedaText": "", "audioFile": "PB_000248.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000249", "originalText": "स्मृतिप्रागभावजन्यत्वस्य संस्कारमात्रजन्यत्वस्य वा स्मृतित्वप्रयोजकतया संस्कारध्वंससाधारणसंस्कारजन्यत्वस्य तदप्रयोजकत्वात्।", "padacchedaText": "", "audioFile": "PB_000249.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000250", "originalText": "न च यत्र व्याप्तिस्मरणादनुमितिस्तत्र कथं संस्कारो हेतुरिति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_000250.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000251", "originalText": "व्याप्तिस्मृतिस्थलेऽपि तत्संस्कारस्यैवानुमितिहेतुत्वात्।", "padacchedaText": "", "audioFile": "PB_000251.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000252", "originalText": "नहि स्मृतेः संस्कारनाशकत्वनियमः स्मृतिधारादर्शनात्।", "padacchedaText": "", "audioFile": "PB_000252.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000253", "originalText": "न चानुद्बुद्धसंस्कारादप्यनुमित्यापत्तिः, तदुद्बोधस्यापि सहकारित्वात्।", "padacchedaText": "", "audioFile": "PB_000253.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000254", "originalText": "एवं च \"अयं धूमवान्\" इति पक्षधर्मताज्ञानेन \"धूमो वह्निव्याप्यः\" इत्यनुभवाहितसंस्कारोद्बोधे च सति \"वह्निमान्\" इत्यनुमितिर्भवति।", "padacchedaText": "", "audioFile": "PB_000254.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000255", "originalText": "न तु मध्ये व्याप्तिस्मरणं, तज्जन्यं \"वह्निव्याप्यधूमवानयम्\" इत्यादिविशिष्टज्ञानं वा हेतुत्वेन कल्पनीयम् गौरवान्मानाभावाच्च।", "padacchedaText": "", "audioFile": "PB_000255.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000256", "originalText": "तच्च व्याप्तिज्ञानं वह्निविषयकज्ञानांश एव करणम्, न तु पर्वतविषयकज्ञानांश इति \"पर्वतो वह्निमान्\" इति ज्ञानस्य वह्न्यंश एव अनुमितित्वम् न पर्वतांशे, तदंशे प्रत्यक्षत्वस्योपपादितत्वात्।", "padacchedaText": "", "audioFile": "PB_000256.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000257", "originalText": "व्याप्तिश्चाशेषसाधनाश्रयाश्रितसाध्यसामानाधिकरण्यरूपा।", "padacchedaText": "", "audioFile": "PB_000257.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000258", "originalText": "सा च व्यभिचारादर्शने सति सहचारदर्शनेन गृह्यते।", "padacchedaText": "", "audioFile": "PB_000258.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000259", "originalText": "तच्च सहचारदर्शनं भूयोदर्शनं सकृद्दर्शनं वेति विशेषो नादरणीयः, सहचारदर्शनस्यैव प्रयोजकत्वात्।", "padacchedaText": "", "audioFile": "PB_000259.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000260", "originalText": "तच्चानुमानमन्वयिरूपमेकमेव।", "padacchedaText": "", "audioFile": "PB_000260.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000261", "originalText": "न तु केवलान्वयि, सर्वस्यापि धर्मस्यास्मन्मते ब्रह्मनिष्ठात्यन्ताभावप्रतियोगित्वेन अत्यन्ताभावाप्रतियोगिसाध्यकत्वरूपकेवलान्वयित्वस्यासिद्धेः।", "padacchedaText": "", "audioFile": "PB_000261.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000262", "originalText": "नाप्यनुमानस्य व्यतिरेकिरूपत्वम् साध्याभावे साधनाभावनिरूपितव्याप्तिज्ञानस्य साधनेन साध्यानुमितावनुपयोगात्।", "padacchedaText": "", "audioFile": "PB_000262.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000263", "originalText": "कथं तर्हि धूमादावन्वयव्याप्तिमविदुषोऽपि व्यतिरेकव्याप्तिज्ञानादनुमितिः।", "padacchedaText": "", "audioFile": "PB_000263.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000264", "originalText": "अर्थापत्तिप्रमाणादिति वक्ष्यामः।", "padacchedaText": "", "audioFile": "PB_000264.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000265", "originalText": "अत एवानुमानस्य नान्वयव्यतिरेकिरूपत्वम्, व्यतिरेकव्याप्तिज्ञानस्य अनुमित्यहेतुत्वात्।", "padacchedaText": "", "audioFile": "PB_000265.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000266", "originalText": "तच्चानुमानं स्वार्थपरार्थभेदेन द्विविधम्।", "padacchedaText": "", "audioFile": "PB_000266.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000267", "originalText": "तत्र स्वार्थन्तूक्तमेव।", "padacchedaText": "", "audioFile": "PB_000267.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000268", "originalText": "परार्थन्तु न्यायसाध्यम्।", "padacchedaText": "", "audioFile": "PB_000268.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000269", "originalText": "न्यायो नामावयवसमुदायः।", "padacchedaText": "", "audioFile": "PB_000269.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000270", "originalText": "अवयवाश्च त्रय एव प्रतिज्ञाहेतूदाहरणरूपाः उदाहरणोपनयनिगमनरूपा वा।", "padacchedaText": "", "audioFile": "PB_000270.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000271", "originalText": "न तु पञ्च अवयवत्रयेणैव व्याप्तिपक्षधर्मतयोरुपदर्शनसम्भवेनाधिकावयवद्वयस्य व्यर्थत्वात्।", "padacchedaText": "", "audioFile": "PB_000271.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000272", "originalText": "एवमनुमाने निरूपिते तस्माद् ब्रह्मभिन्ननिखिलप्रपञ्चस्य मिथ्यात्वसिद्धिः।", "padacchedaText": "", "audioFile": "PB_000272.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000273", "originalText": "तथाहि— ब्रह्मभिन्नं सर्वं मिथ्या, ब्रह्मभिन्नत्वात्, यदेवं तदेवम्, यथा शुक्तिरूप्यम्।", "padacchedaText": "", "audioFile": "PB_000273.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000274", "originalText": "न च दृष्टान्तासिद्धिः तस्य साधितत्वात्।", "padacchedaText": "", "audioFile": "PB_000274.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000275", "originalText": "न चाप्रयोजकत्वम् शुक्तिरूप्यरज्जुसर्पादीनां मिथ्यात्वे ब्रह्मभिन्नत्वस्यैव लाघवेन प्रयोजकत्वात्।", "padacchedaText": "", "audioFile": "PB_000275.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000276", "originalText": "मिथ्यात्वं च स्वाश्रयत्वेनाभिमतयावन्निष्ठात्यन्ताभावप्रतियोगित्वम्।", "padacchedaText": "", "audioFile": "PB_000276.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000277", "originalText": "'अभिमत'पदं वस्तुतः स्वाश्रयाप्रसिद्ध्याऽसम्भववारणाय, 'यावत्'—पदमर्थान्तरवारणाय।", "padacchedaText": "", "audioFile": "PB_000277.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000278", "originalText": "तदुक्तम्— \" सर्वेषामपि भावानां स्वाश्रयत्वेन सम्मते। प्रतियोगित्वमत्यन्ताभावं प्रति मृषात्मता॥", "padacchedaText": "", "audioFile": "PB_000278.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000279", "originalText": "\" इति।", "padacchedaText": "", "audioFile": "PB_000279.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000280", "originalText": "यद्वा अयं पट एतत्तन्तुनिष्ठात्यन्ताभावप्रतियोगी पटत्वात्, पटान्तरवत् इत्याद्यनुमानं मिथ्यात्वे प्रमाणम्।", "padacchedaText": "", "audioFile": "PB_000280.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000281", "originalText": "तदुक्तम्— \" अंशिनः स्वांशगात्यन्ताभावस्य प्रतियोगिनः। अंशित्वादितरांशीव दिगेषैव गुणादिषु॥", "padacchedaText": "", "audioFile": "PB_000281.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000282", "originalText": "\" इति।", "padacchedaText": "", "audioFile": "PB_000282.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000283", "originalText": "न च घटादेर्मिथ्यात्वे \"सन् घटः\" इति प्रत्यक्षेण बाधः, अधिष्ठानब्रह्मसत्तायास्तत्र विषयतया, घटादेः सत्यत्वासिद्धेः।", "padacchedaText": "", "audioFile": "PB_000283.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000284", "originalText": "न च नीरूपस्य ब्रह्मणः कथं चाक्षुषादिज्ञानविषयतेति वाच्यम्, नीरूपस्यापि रूपादेः प्रत्यक्षविषयत्वात्।", "padacchedaText": "", "audioFile": "PB_000284.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000285", "originalText": "न च नीरूपस्य द्रव्यस्य चक्षुराद्ययोग्यत्वमिति नियमः मन्मते ब्रह्मणो द्रव्यत्वासिद्धेः।", "padacchedaText": "", "audioFile": "PB_000285.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000286", "originalText": "गुणाश्रयत्वं समवायिकारणत्वं वा द्रव्यत्वम् इति तेऽभिमतम्।", "padacchedaText": "", "audioFile": "PB_000286.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000287", "originalText": "न हि निर्गुणस्य ब्रह्मणो गुणाश्रयता नापि समवायिकारणता, समवायासिद्धेः।", "padacchedaText": "", "audioFile": "PB_000287.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000288", "originalText": "अस्तु वा द्रव्यत्वं ब्रह्मणः, तथापि नीरूपस्य कालस्येव चाक्षुषादिज्ञानविषयत्वे न विरोधः।", "padacchedaText": "", "audioFile": "PB_000288.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000289", "originalText": "यद्वा त्रिविधं सत्त्वम् पारमार्थिकं व्यावहारिकं प्रातिभासिकं चेति।", "padacchedaText": "", "audioFile": "PB_000289.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000290", "originalText": "पारमार्थिकं सत्त्वं ब्रह्मणः, व्यावहारिकं सत्त्वमाकाशादेः, प्रातिभासिकं सत्त्वं शुक्तिरजतादेः।", "padacchedaText": "", "audioFile": "PB_000290.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000291", "originalText": "तथा च \"घटः सन्\" इति प्रत्यक्षस्य व्यावहारिकसत्त्वविषयत्वेन प्रामाण्यम्।", "padacchedaText": "", "audioFile": "PB_000291.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000292", "originalText": "अस्मिन् पक्षे घटादेर्ब्रह्मणि निषेधो न स्वरूपेण, किन्तु पारमार्थिकत्वेनैवेति न विरोधः।", "padacchedaText": "", "audioFile": "PB_000292.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000293", "originalText": "अस्मिन् पक्षे च मिथ्यात्वलक्षणे पारमार्थिकत्वावच्छिन्नप्रतियोगिताकत्वमत्यन्ताभावविशेषणं द्रष्टव्यम्।", "padacchedaText": "", "audioFile": "PB_000293.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000294", "originalText": "तस्मादुपपन्नं मिथ्यात्वानुमानमिति।", "padacchedaText": "", "audioFile": "PB_000294.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000295", "originalText": "इति वेदान्तपरिभाषायामनुमानपरिच्छेदः।", "padacchedaText": "", "audioFile": "PB_000295.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000296", "originalText": "उपमानप्रमाणम्\nअथोपमानं निरूप्यते।", "padacchedaText": "", "audioFile": "PB_000296.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000297", "originalText": "तत्र सादृश्यप्रमाकरणमुपमानम्।", "padacchedaText": "", "audioFile": "PB_000297.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000298", "originalText": "तथा हि नगरेषु दृष्टगोपिण्डस्य पुरुषस्य वनं गतस्य गवयेन्द्रियसन्निकर्षे सति भवति प्रतीतिः \"अयं पिण्डो गोसदृशः\" इति।", "padacchedaText": "", "audioFile": "PB_000298.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000299", "originalText": "तदनन्तरं च भवति निश्चयः \"अनेन सदृशी मदीया गौः\" इति।", "padacchedaText": "", "audioFile": "PB_000299.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000300", "originalText": "तत्रान्वयव्यतिरेकाभ्यां गवयनिष्ठगोसादृश्यज्ञानं करणम्, गोनिष्ठगवयसादृश्यज्ञानं फलम्।", "padacchedaText": "", "audioFile": "PB_000300.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000301", "originalText": "न चेदं प्रत्यक्षेण सम्भवति गोपिण्डस्य तदेन्द्रियासन्निकर्षात्।", "padacchedaText": "", "audioFile": "PB_000301.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000302", "originalText": "नाप्यनुमानेन गवयनिष्ठगोसादृश्यस्य अतल्लिङ्गत्वात्।", "padacchedaText": "", "audioFile": "PB_000302.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000303", "originalText": "नापि मदीया गौरेतद्गवयसदृशी, एतन्निष्ठसादृश्यप्रतियोगित्वात्, यो यद्गतसादृश्यप्रतियोगी स तत्सदृशः, यथा मैत्रनिष्ठसादृश्यप्रतियोगी चैत्रो मैत्रसदृशः इत्यनुमानात् तत्सम्भव इति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_000303.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000304", "originalText": "एवंविधानुमानानवतारेऽपि \"अनेन सदृशी मदीया गौः\" इति प्रतीतेरनुभवसिद्धत्वात् \"उपमिनोमि\" इत्यनुव्यवसायाच्च।", "padacchedaText": "", "audioFile": "PB_000304.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000305", "originalText": "तस्मादुपमानं मानान्तरम्।", "padacchedaText": "", "audioFile": "PB_000305.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000306", "originalText": "इति वेदान्तपरिभाषायामुपमानपरिच्छेदः।", "padacchedaText": "", "audioFile": "PB_000306.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000307", "originalText": "आगमप्रमाणम्\nअथागमो निरूप्यते।", "padacchedaText": "", "audioFile": "PB_000307.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000308", "originalText": "यस्य वाक्यस्य तात्पर्यविषयीभूतसंसर्गो मानान्तरेण न बाध्यते तद्वाक्यं प्रमाणम्।", "padacchedaText": "", "audioFile": "PB_000308.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000309", "originalText": "वाक्यजन्यज्ञाने च आकांक्षायोग्यताऽऽसत्तयस्तात्पर्यज्ञानं च इति चत्वारि कारणानि।", "padacchedaText": "", "audioFile": "PB_000309.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000310", "originalText": "तत्र पदार्थानां परस्परजिज्ञासाविषयत्वयोग्यत्वमाकांक्षा।", "padacchedaText": "", "audioFile": "PB_000310.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000311", "originalText": "क्रियाश्रवणे कारकस्य, कारकश्रवणे क्रियायाः, करणश्रवणे इतिकर्तव्यतायाश्च जिज्ञासाविषयत्वात्।", "padacchedaText": "", "audioFile": "PB_000311.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000312", "originalText": "अजिज्ञासोरपि वाक्यार्थबोधात् योग्यत्वमुपात्तम्।", "padacchedaText": "", "audioFile": "PB_000312.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000313", "originalText": "तदवच्छेदकं च क्रियात्वकारकत्वादिकम् (इति नातिव्याप्तिः गौरश्व इत्यादौ)।", "padacchedaText": "", "audioFile": "PB_000313.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000314", "originalText": "अभेदान्वये च समानविभक्तिकपदप्रतिपाद्यत्वं तदवच्छेदकमिति तत्त्वमस्यादिवाक्येषु नाव्याप्तिः।", "padacchedaText": "", "audioFile": "PB_000314.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000315", "originalText": "एतादृशाकांक्षाभिप्रायेणैव बलाबलाधिकरणे \" सा वैश्वदेव्यामिक्षा वाजिभ्यो वाजिनम्\" इत्यत्र वैश्वदेवयागस्यामिक्षान्वितत्वेन न वाजिनाकांक्षा इत्यादिव्यवहारः।", "padacchedaText": "", "audioFile": "PB_000315.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000316", "originalText": "ननु तत्रापि वाजिनस्य जिज्ञासाऽविषयत्वेऽपि तद्योग्यत्वमस्त्येव, प्रदेयद्रव्यत्वस्य यागनिरूपितजिज्ञासाविषयतायोग्यतावच्छेदकत्वादिति चेत् न।", "padacchedaText": "", "audioFile": "PB_000316.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000317", "originalText": "स्वसमानजातीयपदार्थान्वयबोधविरहसहकृतप्रदेयद्रव्यत्वस्यैव तदवच्छेदकत्वेन, वाजिनद्रव्यस्य स्वसमानजातीयामिक्षाद्रव्यान्वयबोधसहकृतत्वेन, तादृशावच्छेदकवत्वाभावात्।", "padacchedaText": "", "audioFile": "PB_000317.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000318", "originalText": "आमिक्षायान्तु नैवम् वाजिनान्वयस्य तदानुपस्थितत्वात्।", "padacchedaText": "", "audioFile": "PB_000318.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000319", "originalText": "उदाहरणान्तरेष्वपि दुर्बलत्वप्रयोजक आकांक्षाविरह एव द्रष्टव्यः।", "padacchedaText": "", "audioFile": "PB_000319.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000320", "originalText": "योग्यता तात्पर्यविषयसंसर्गाबाधः।", "padacchedaText": "", "audioFile": "PB_000320.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000321", "originalText": "\"वह्निना सिञ्चति\" इत्यादौ तादृशसंसर्गबाधान्न योग्यता।", "padacchedaText": "", "audioFile": "PB_000321.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000322", "originalText": "\" स प्रजापतिरात्मनो वपामुदखिदत्\"(तै.सं. २.१.१.४) इत्यादावपि तात्पर्यविषयीभूतपशुप्राशस्त्याबाधात् योग्यता।", "padacchedaText": "", "audioFile": "PB_000322.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000323", "originalText": "तत्त्वमस्यादिवाक्येष्वपि वाच्याभेदबाधेऽपि लक्ष्यस्वरूपाभेदे बाधाभावात् योग्यता।", "padacchedaText": "", "audioFile": "PB_000323.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000324", "originalText": "आसत्तिश्चाव्यवधानेन पदजन्यपदार्थोपस्थितिः।", "padacchedaText": "", "audioFile": "PB_000324.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000325", "originalText": "मानान्तरोपस्थापितपदार्थस्यान्वयबोधाभावात् पदजन्येति।", "padacchedaText": "", "audioFile": "PB_000325.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000326", "originalText": "अत एवाश्रुतस्थले तत्तत्पदाध्याहारः, 'द्वारम्' इत्यादौ 'पिधेहि' इति।", "padacchedaText": "", "audioFile": "PB_000326.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000327", "originalText": "अत एव 'इषे त्वा' इत्यादिमन्त्रे 'छिनद्मि' इति पदाध्याहारः।", "padacchedaText": "", "audioFile": "PB_000327.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000328", "originalText": "अत एव विकृतिषु 'सूर्याय जुष्टं निर्वपामि' इति पदप्रयोगः।", "padacchedaText": "", "audioFile": "PB_000328.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000329", "originalText": "पदार्थश्च द्विविधः शक्यो लक्ष्यश्चेति।", "padacchedaText": "", "audioFile": "PB_000329.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000330", "originalText": "तत्र शक्तिर्नाम पदानामर्थेषु मुख्या वृत्तिः।", "padacchedaText": "", "audioFile": "PB_000330.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000331", "originalText": "यथा घटपदस्य पृथुबुध्नोदराद्याकृतिविशिष्टे वस्तुविशेषे वृत्तिः।", "padacchedaText": "", "audioFile": "PB_000331.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000332", "originalText": "सा च शक्तिः पदार्थान्तरम्, सिद्धान्ते कारणेषु कार्यानुकूलशक्तिमात्रस्य पदार्थान्तरत्वात्।", "padacchedaText": "", "audioFile": "PB_000332.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000333", "originalText": "सा च तत्तत्पदजन्यपदार्थज्ञानरूपकार्यानुमेया।", "padacchedaText": "", "audioFile": "PB_000333.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000334", "originalText": "तादृशशक्तिविषयत्वं शक्यत्वम्।", "padacchedaText": "", "audioFile": "PB_000334.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000335", "originalText": "तच्च जातेरेव, न व्यक्तेः व्यक्तीनामानन्त्येन गुरुत्वात्।", "padacchedaText": "", "audioFile": "PB_000335.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000336", "originalText": "कथं तर्हि गवादिपदाद्व्यक्तिभानमिति चेत्, जातेर्व्यक्तिसमानसंवित्संवेद्यत्वादिति ब्रूमः।", "padacchedaText": "", "audioFile": "PB_000336.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000337", "originalText": "यद्वा गवादिपदानां व्यक्तौ शक्तिः स्वरूपसती, न तु ज्ञाता, हेतुः।", "padacchedaText": "", "audioFile": "PB_000337.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000338", "originalText": "जातौ तु सा ज्ञाता हेतुः।", "padacchedaText": "", "audioFile": "PB_000338.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000339", "originalText": "न च व्यक्त्यंशे शक्तिज्ञानमपि कारणं गौरवात्।", "padacchedaText": "", "audioFile": "PB_000339.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000340", "originalText": "जातिशक्तिमत्त्वज्ञाने सति, व्यक्तिशक्तिमत्त्वज्ञानं विना व्यक्तिधीविलम्बाभावाच्च।", "padacchedaText": "", "audioFile": "PB_000340.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000341", "originalText": "अत एव न्यायमतेऽप्यन्वये शक्तिः स्वरूपसतीति सिद्धान्तः।", "padacchedaText": "", "audioFile": "PB_000341.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000342", "originalText": "ज्ञायमानशक्तिविषयत्वमेव वाच्यत्वमिति जातिरेव वाच्या।", "padacchedaText": "", "audioFile": "PB_000342.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000343", "originalText": "अथवा व्यक्तेर्लक्षणयाऽवगमः।", "padacchedaText": "", "audioFile": "PB_000343.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000344", "originalText": "यथा \"नीलो घटः\" इत्यत्र नीलशब्दस्य नीलगुणविशिष्टे लक्षणा, तथा जातिवाचकस्य तद्विशिष्टे लक्षणा।", "padacchedaText": "", "audioFile": "PB_000344.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000345", "originalText": "तदुक्तम् \" अनन्यलभ्यः शब्दार्थः\" इति।", "padacchedaText": "", "audioFile": "PB_000345.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000346", "originalText": "एवं शक्यो निरूपितः।", "padacchedaText": "", "audioFile": "PB_000346.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000347", "originalText": "अथ लक्ष्यपदार्थो निरूप्यते।", "padacchedaText": "", "audioFile": "PB_000347.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000348", "originalText": "तत्र लक्षणाविषयो लक्ष्यः।", "padacchedaText": "", "audioFile": "PB_000348.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000349", "originalText": "लक्षणा च द्विविधा केवललक्षणा लक्षितलक्षणा चेति।", "padacchedaText": "", "audioFile": "PB_000349.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000350", "originalText": "तत्र शक्यसाक्षात्सम्बन्धः केवललक्षणा।", "padacchedaText": "", "audioFile": "PB_000350.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000351", "originalText": "यथा \"गङ्गायां घोषः\" इत्यत्र प्रवाहसाक्षात्सम्बन्धिनि तीरे गङ्गापदस्य केवललक्षणा।", "padacchedaText": "", "audioFile": "PB_000351.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000352", "originalText": "यत्र शक्यपरम्परासम्बन्धेनार्थान्तरप्रतीतिस्तत्र लक्षितलक्षणा।", "padacchedaText": "", "audioFile": "PB_000352.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000353", "originalText": "यथा द्विरेफपदस्य रेफद्वये शक्तस्य भ्रमरपदघटितपरम्परासम्बन्धेन मधुकरे वृत्तिः।", "padacchedaText": "", "audioFile": "PB_000353.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000354", "originalText": "गौण्यपि लक्षितलक्षणैव।", "padacchedaText": "", "audioFile": "PB_000354.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000355", "originalText": "यथा \"सिंहो माणवकः\" इत्यत्र सिंहशब्दवाच्यसम्बन्धिक्रौर्यादिसम्बन्धेन माणवकस्य प्रतीतिः।", "padacchedaText": "", "audioFile": "PB_000355.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000356", "originalText": "प्रकारान्तरेण लक्षणा त्रिविधा जहल्लक्षणा, अजहल्लक्षणा, जहदजहल्लक्षणा।", "padacchedaText": "", "audioFile": "PB_000356.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000357", "originalText": "तत्र शक्यमनन्तर्भाव्य यत्रार्थान्तरप्रतीतिस्तत्र जहल्लक्षणा।", "padacchedaText": "", "audioFile": "PB_000357.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000358", "originalText": "यथा \"विषं भुंक्ष्व\" इत्यत्र स्वार्थं विहाय शत्रुगृहे भोजननिवृत्तिर्लक्ष्यते।", "padacchedaText": "", "audioFile": "PB_000358.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000359", "originalText": "यत्र शक्यार्थमन्तर्भाव्यैवार्थान्तरप्रतीतिः तत्राजहल्लक्षणा यथा \"शुक्लो घटः\" इति।", "padacchedaText": "", "audioFile": "PB_000359.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000360", "originalText": "अत्र हि शुक्लशब्दः स्वार्थं शुक्लगुणमन्तर्भाव्यैव तद्वति द्रव्ये लक्षणया वर्तते।", "padacchedaText": "", "audioFile": "PB_000360.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000361", "originalText": "यत्र हि विशिष्टवाचकः शब्द एकदेशं विहाय एकदेशे वर्तते तत्र जहदजहल्लक्षणा।", "padacchedaText": "", "audioFile": "PB_000361.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000362", "originalText": "यथा \"सोऽयम् देवदत्तः\" इति।", "padacchedaText": "", "audioFile": "PB_000362.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000363", "originalText": "अत्र हि पदद्वयवाच्ययोर्विशिष्टयोरैक्यानुपपत्या पदद्वयस्य विशेष्यमात्रपरत्वम्।", "padacchedaText": "", "audioFile": "PB_000363.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000364", "originalText": "यथा वा \" तत्त्वमसि\" इत्यादौ तत्पद्वाच्यस्य सर्वज्ञत्वादिविशिष्टस्य त्वम्पदवाच्येनान्तःकरणविशिष्टेनैक्यायोगात् ऐक्यसिद्ध्यर्थं स्वरूपे लक्षणेति साम्प्रदायिकाः।", "padacchedaText": "", "audioFile": "PB_000364.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000365", "originalText": "वयन्तु ब्रूमः \"सोऽयं देवदत्तः, तत्त्वमसि\" इत्यादौ विशिष्टवाचकपदानामेकदेशपरत्वेऽपि न लक्षणा, शक्त्युपस्थितविशिष्टयोः अभेदान्वयानुपपत्तौ विशेष्ययोः शक्त्युपस्थितयोरेव अभेदान्वयाविरोधात्।", "padacchedaText": "", "audioFile": "PB_000365.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000366", "originalText": "यथा \"घटोऽनित्यः\" इत्यत्र घटपदवाच्यैकदेशघटत्वस्य अयोग्यत्वेऽपि योग्यघटव्यक्त्या सहानित्यत्वान्वयः।", "padacchedaText": "", "audioFile": "PB_000366.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000367", "originalText": "यत्र पदार्थैकदेशस्य विशेषणतयोपस्थितिः तत्रैव स्वातन्त्र्येणोपस्थितये लक्षणाभ्युपगमः।", "padacchedaText": "", "audioFile": "PB_000367.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000368", "originalText": "यथा \"नित्यो घटः\" इत्यत्र घटपदात् घटत्वस्य शक्त्या स्वातन्त्र्येणानुपस्थित्या तादृशोपस्थित्यर्थं घटपदस्य घटत्वे लक्षणा।", "padacchedaText": "", "audioFile": "PB_000368.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000369", "originalText": "एवमेव \" तत्त्वमसि\" इत्यादिवाक्येऽपि न लक्षणा, शक्त्या स्वातन्त्र्येणोपस्थितयोः तत्त्वम्पदार्थयोरभेदान्वये बाधकाभावात्।", "padacchedaText": "", "audioFile": "PB_000369.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000370", "originalText": "अन्यथा \"गेहे घटः, घटे रूपम्, घटमानय\" इत्यादौ घटत्वगेहत्वादेरभिमतान्वयबोधायोग्यतया तत्रापि घटादिपदानां विशेष्यमात्रपरत्वं लक्षणयैव स्यात्।", "padacchedaText": "", "audioFile": "PB_000370.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000371", "originalText": "तस्मात् \" तत्त्वमसि\" इत्यादिवाक्येषु आचार्याणां लक्षणोक्तिरभ्युपगमवादेन बोध्या।", "padacchedaText": "", "audioFile": "PB_000371.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000372", "originalText": "जहदजहल्लक्षणोदाहरणन्तु \"काकेभ्यो दधि रक्ष्यताम्\" इत्याद्येव तत्र शक्यकाकत्वपरित्यागेन अशक्यदध्युपघातकत्वपुरस्कारेणाकाकेऽपि काकशब्दप्रवृत्तेः।", "padacchedaText": "", "audioFile": "PB_000372.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000373", "originalText": "लक्षणाबीजन्तु तात्पर्यानुपपत्तिरेव न तु अन्वयानुपपत्तिः।", "padacchedaText": "", "audioFile": "PB_000373.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000374", "originalText": "\"काकेभ्यो दधि रक्ष्यताम्\" इत्यत्र अन्वयानुपपत्त्यभावात्।", "padacchedaText": "", "audioFile": "PB_000374.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000375", "originalText": "\"गङ्गायां घोषः\" इत्यादौ तात्पर्यानुपपत्तेरपि सम्भवात्।", "padacchedaText": "", "audioFile": "PB_000375.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000376", "originalText": "लक्षणा च न पदमात्रवृत्तिः, किन्तु वाक्यवृत्तिरपि।", "padacchedaText": "", "audioFile": "PB_000376.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000377", "originalText": "यथा \"गम्भीरायां नद्यां घोषः\" इत्यत्र \"गम्भीरायां नद्याम्\" इति पदद्वयसमुदायस्य तीरे लक्षणा।", "padacchedaText": "", "audioFile": "PB_000377.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000378", "originalText": "ननु वाक्यस्याशक्ततया कथं शक्यसम्बन्धरूपा लक्षणा? उच्यते।", "padacchedaText": "", "audioFile": "PB_000378.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000379", "originalText": "शक्त्या यत् पदेन ज्ञाप्यते तत्सम्बन्धो लक्षणा।", "padacchedaText": "", "audioFile": "PB_000379.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000380", "originalText": "शक्तिज्ञाप्यश्च यथा पदार्थस्तथा वाक्यार्थोऽपीति न काचिदनुपपत्तिः।", "padacchedaText": "", "audioFile": "PB_000380.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000381", "originalText": "एवमर्थवादवाक्यानां प्रशंसारूपाणां प्राशस्त्ये लक्षणा \" सोऽरोदीत्\" इत्यादिनिन्दार्थवादवाक्यानां निन्दितत्वे लक्षणा।", "padacchedaText": "", "audioFile": "PB_000381.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000382", "originalText": "अर्थवादगतपदानां प्राशस्त्यादिलक्षणाभ्युपगमे एकेन पदेन लक्षणया तदुपस्थितिसम्भवे पदान्तरवैयर्थ्यं स्यात्।", "padacchedaText": "", "audioFile": "PB_000382.wav", "zipFile": "VedantaParibhasha.zip"}, {"i
