d": "B_000383", "originalText": "एवं च विध्यपेक्षितप्राशस्त्यरूपपदार्थप्रत्यायकतया अर्थवादपदसमुदायस्य पदस्थानीयतया, पदं सत् अर्थवादवाक्यं विधिवाक्येनैकवाक्यं भवति, इत्यर्थवादवाक्यानां पदैकवाक्यता।", "padacchedaText": "", "audioFile": "PB_000383.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000384", "originalText": "क्व तर्हि वाक्यैकवाक्यता? यत्र प्रत्येकं भिन्नभिन्नसंसर्गप्रतिपादकयोर्वाक्ययोराकांक्षावशेन महावाक्यार्थबोधकत्वं, तत्र वाक्यैकवाक्यता।", "padacchedaText": "", "audioFile": "PB_000384.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000385", "originalText": "यथा \" दर्शपूर्णमासाभ्यां स्वर्गकामो यजेत\" इत्यादिवाक्यानां \" समिधो यजति\" इत्यादिवाक्यानां च परस्परापेक्षिताङ्गाङ्गिभावबोधकतया एकवाक्यता।", "padacchedaText": "", "audioFile": "PB_000385.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000386", "originalText": "तदुक्तं भट्टपादैः— \" स्वार्थबोधे समाप्तानामङ्गाङ्गित्वाद्यपेक्षया। वाक्यानामेकवाक्यत्वं पुनः संहत्य जायते॥", "padacchedaText": "", "audioFile": "PB_000386.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000387", "originalText": "\" इति।", "padacchedaText": "", "audioFile": "PB_000387.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000388", "originalText": "एवं द्विविधोऽपि पदार्थो निरूपितः।", "padacchedaText": "", "audioFile": "PB_000388.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000389", "originalText": "तदुपस्थितिश्चासत्तिः।", "padacchedaText": "", "audioFile": "PB_000389.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000390", "originalText": "सा च शाब्दबोधे हेतुः तथैवान्वयव्यतिरेकदर्शनात्।", "padacchedaText": "", "audioFile": "PB_000390.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000391", "originalText": "एवं महावाक्यार्थबोधेऽवान्तरवाक्यार्थबोधो हेतुः तथैवान्वयाद्यवधारणात्।", "padacchedaText": "", "audioFile": "PB_000391.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000392", "originalText": "क्रमप्राप्तं तात्पर्यं निरूप्यते।", "padacchedaText": "", "audioFile": "PB_000392.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000393", "originalText": "तत्र तत्प्रतीतीच्छयोच्चरितत्वं न तात्पर्यम्, अर्थज्ञानशून्येन पुरुषेणोच्चरिताद्वेदादर्थप्रत्ययाभावप्रसङ्गात्।", "padacchedaText": "", "audioFile": "PB_000393.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000394", "originalText": "\"अयमध्यापकोऽव्युत्पन्नः\" इति विशेषदर्शनेन तात्पर्यभ्रमस्याप्यभावात्।", "padacchedaText": "", "audioFile": "PB_000394.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000395", "originalText": "न चेश्वरीयतात्पर्यज्ञानात् तत्र शाब्दबोध इति वाच्यम्, ईश्वरानङ्गीकर्तुरपि तद्वाक्यार्थप्रतिपत्तिदर्शनात्।", "padacchedaText": "", "audioFile": "PB_000395.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000396", "originalText": "उच्यते।", "padacchedaText": "", "audioFile": "PB_000396.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000397", "originalText": "तत्प्रतीतिजननयोग्यत्वं तात्पर्यम्।", "padacchedaText": "", "audioFile": "PB_000397.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000398", "originalText": "\"गेहे घटः\" इति वाक्यं गेहे घटसंसर्गप्रतीतिजननयोग्यम्, न तु पटसंसर्गप्रतीतिजननयोग्यमिति तद्वाक्यं घटसंसर्गपरम्, न तु पटसंसर्गपरमित्युच्यते।", "padacchedaText": "", "audioFile": "PB_000398.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000399", "originalText": "ननु \"सैन्धवमानय\" इत्यादिवाक्यं यदा लवणानयनप्रतीतीच्छया प्रयुक्तं, तदापि अश्वसंसर्गप्रतीतिजनने स्वरूपयोग्यतासत्त्वात् लवणपरत्वज्ञानदशायामश्वादिसंसर्गज्ञानापत्तिरिति चेत् न।", "padacchedaText": "", "audioFile": "PB_000399.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000400", "originalText": "तदितरप्रतीतीच्छयानुच्चरितत्वस्यापि तात्पर्यं प्रति विशेषणत्वात्।", "padacchedaText": "", "audioFile": "PB_000400.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000401", "originalText": "तथा च यद्वाक्यं यत्प्रतीतिजननस्वरूपयोग्यत्वे सति, यदन्यप्रतीतीच्छया नोच्चरितं तद्वाक्यं तत्संसर्गपरमित्युच्यते।", "padacchedaText": "", "audioFile": "PB_000401.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000402", "originalText": "शुकादिवाक्ये, अव्युत्पन्नोच्चरितवेदवाक्यादौ च प्रतीतीच्छाया एवाभावेन तदन्यप्रतीतीच्छयोच्चरितत्वाभावेन लक्षणसत्त्वान्नाव्याप्तिः।", "padacchedaText": "", "audioFile": "PB_000402.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000403", "originalText": "न चोभयप्रतीतीच्छयोच्चरितेऽव्याप्तिः तदन्यमात्रप्रतीतीच्छयाऽनुच्चरितत्वस्य विवक्षितत्वात्।", "padacchedaText": "", "audioFile": "PB_000403.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000404", "originalText": "उक्तप्रतीतिमात्रजननयोग्यतायाश्चावच्छेदिका शक्तिः।", "padacchedaText": "", "audioFile": "PB_000404.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000405", "originalText": "अस्माकं मते सर्वत्र कारणतायाः शक्तेरेवावच्छेदकत्वान्न कोऽपि दोषः।", "padacchedaText": "", "audioFile": "PB_000405.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000406", "originalText": "एवं तात्पर्यस्य तत्प्रतीतिजनकत्वरूपस्य शाब्दज्ञानजनकत्वे सिद्धे, चतुर्थवर्णके तात्पर्यस्य शाब्दज्ञानहेतुत्वनिराकरणवाक्यं तत्प्रतीतीच्छयोच्चरितत्वरूपतात्पर्यनिराकरणपरम्, अन्यथा तात्पर्यनिश्चयफलकवेदान्तविचारवैयर्थ्यप्रसङ्गात्।", "padacchedaText": "", "audioFile": "PB_000406.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000407", "originalText": "केचित्तु शाब्दज्ञानत्वावच्छेदेन न तात्पर्यज्ञानं हेतुरित्येवंपरं चतुर्थवर्णकवाक्यम्।", "padacchedaText": "", "audioFile": "PB_000407.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000408", "originalText": "तात्पर्यसंशयविपर्ययोत्तरशाब्दज्ञानविशेषे च तात्पर्यज्ञानं हेतुरेव।", "padacchedaText": "", "audioFile": "PB_000408.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000409", "originalText": "इदं वाक्यमेतत्परमुतान्यपरमिति संशये तद्विपर्यये च, तदुत्तरवाक्यार्थविशेषनिश्चयस्य तात्पर्यनिश्चयं विनाऽनुपपत्तेरित्याहुः।", "padacchedaText": "", "audioFile": "PB_000409.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000410", "originalText": "तच्च तात्पर्यं वेदे मीमांसापरिशोधितन्यायादेवावधर्यते, लोके तु प्रकरणादिना।", "padacchedaText": "", "audioFile": "PB_000410.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000411", "originalText": "तत्र लौकिकवाक्यानां मानान्तरावगतार्थतयाऽनुवादकत्वम्।", "padacchedaText": "", "audioFile": "PB_000411.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000412", "originalText": "वेदे तु वाक्यार्थस्यापूर्वतया नानुवादकत्वम्।", "padacchedaText": "", "audioFile": "PB_000412.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000413", "originalText": "तत्र लोके वेदे च कार्यपराणामिव सिद्धर्थानामपि प्रामाण्यम्, \"पुत्रस्ते जातः\" इत्यादिषु सिद्धार्थेऽपि पदानां सामर्थ्यावधारणात्।", "padacchedaText": "", "audioFile": "PB_000413.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000414", "originalText": "अत एव वेदान्तवाक्यानां ब्रह्मणि प्रामाण्यम्।", "padacchedaText": "", "audioFile": "PB_000414.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000415", "originalText": "यथा चैतत् तथा विषयपरिच्छेदे वक्ष्यते।", "padacchedaText": "", "audioFile": "PB_000415.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000416", "originalText": "तत्र वेदानां नित्यसर्वज्ञपरमेश्वरप्रणीतत्वेन प्रामाण्यमिति नैयायिकाः।", "padacchedaText": "", "audioFile": "PB_000416.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000417", "originalText": "वेदानां नित्यत्वेन निरस्तसमस्तपुंदूषणतया प्रामाण्यमित्यध्वरमीमांसकाः।", "padacchedaText": "", "audioFile": "PB_000417.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000418", "originalText": "अस्माकं तु मते वेदो न नित्यः, उत्पत्तिमत्त्वात्।", "padacchedaText": "", "audioFile": "PB_000418.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000419", "originalText": "उत्पत्तिमत्त्वं च \" अस्य महतो भूतस्य निःश्वसितमेतद्यदृग्वेदो यजुर्वेदः सामवेदोऽथर्ववेदः\" इत्यादिश्रुतेः।", "padacchedaText": "", "audioFile": "PB_000419.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000420", "originalText": "नापि वेदानां द्विक्षणावस्थायित्वम्, \"य एव वेदो देवदत्तेनाधीतः, स एव मयापि\" इत्यादिप्रत्यभिज्ञाविरोधात्।", "padacchedaText": "", "audioFile": "PB_000420.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000421", "originalText": "अत एव गकारादिवर्णानामपि न क्षणिकत्वम्, \"सोऽयं गकारः\" इत्यादिप्रत्यभिज्ञाविरोधात्।", "padacchedaText": "", "audioFile": "PB_000421.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000422", "originalText": "तथा च वर्णपदवाक्यसमुदायस्य वेदस्य वियदादिवत् सृष्टिकालीनोत्पत्तिकत्वं, प्रलयकालीनध्वंसप्रतियोगित्वं च।", "padacchedaText": "", "audioFile": "PB_000422.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000423", "originalText": "न तु मध्ये वर्णानामुत्पत्तिविनाशौ, अनन्तगकारादिकल्पनायां गौरवात्।", "padacchedaText": "", "audioFile": "PB_000423.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000424", "originalText": "अनुच्चारणदशायां वर्णानामनभिव्यक्तिस्तदुच्चारणरूपव्यञ्जकाभावात् न विरुध्यते, अन्धकारस्थघटानुपलम्भवत्।", "padacchedaText": "", "audioFile": "PB_000424.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000425", "originalText": "\"उत्पन्नो गकारः\" इत्यादिप्रत्ययस्तु \"सोऽयं गकारः\" इत्यादिप्रत्यभिज्ञाविरोधादप्रमाणम्।", "padacchedaText": "", "audioFile": "PB_000425.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000426", "originalText": "वर्णाभिव्यञ्जकध्वनिगतोत्पत्तिनिरूपितपरम्परासम्बन्धविषयत्वेन प्रमाणं वा।", "padacchedaText": "", "audioFile": "PB_000426.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000427", "originalText": "तस्मान्न वेदानां क्षणिकत्वम्।", "padacchedaText": "", "audioFile": "PB_000427.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000428", "originalText": "ननु क्षणिकत्वाभावेऽपि वियदादिप्रपञ्चवदुत्पत्तिमत्वेन परमेश्वरकर्तृकतया पौरुषेयत्वादपौरुषेयत्वं वेदानामिति तव सिद्धान्तो भज्येत इति चेत् न।", "padacchedaText": "", "audioFile": "PB_000428.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000429", "originalText": "न हि तावत् पुरुषेण उच्चार्यमाणत्वं पौरुषेयत्वम्, गुरुमतेऽप्यध्यापकपरम्परया पौरुषेयत्वापत्तेः।", "padacchedaText": "", "audioFile": "PB_000429.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000430", "originalText": "नापि पुरुषाधीनोत्पत्तिकत्वं पौरुषेयत्वम्, नैयायिकाभिमतपौरुषेयत्वानुमानेऽस्मदादिना सिद्धसाधनापत्तेः।", "padacchedaText": "", "audioFile": "PB_000430.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000431", "originalText": "किन्तु सजातीयोच्चारणानपेक्षोच्चारणविषयत्वम्।", "padacchedaText": "", "audioFile": "PB_000431.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000432", "originalText": "तथा च सर्गाद्यकाले परमेश्वरः पूर्वसर्गसिद्धवेदानुपूर्वीसमानानुपूर्वीकं वेदं विरचितवान्, न तु तद्विजातीयं वेदमिति न सजातीयोच्चारणानपेक्षोच्चारणविषयत्वं पौरुषेयत्वं वेदस्य।", "padacchedaText": "", "audioFile": "PB_000432.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000433", "originalText": "भारतादीनान्तु सजातीयोच्चारणमनपेक्ष्यैवोच्चारणमिति तेषां पौरुषेयत्वम्।", "padacchedaText": "", "audioFile": "PB_000433.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000434", "originalText": "एवं पौरुषेयापौरुषेयभेदेन द्विविध आगमो निरूपितः।", "padacchedaText": "", "audioFile": "PB_000434.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000435", "originalText": "इति वेदान्तपरिभाषायामागमपरिच्छेदः।", "padacchedaText": "", "audioFile": "PB_000435.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000436", "originalText": "अर्थापत्तिप्रमाणम्\nइदानीमर्थापत्तिर्निरूप्यते।", "padacchedaText": "", "audioFile": "PB_000436.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000437", "originalText": "तत्रोपपाद्यज्ञानेनोपपादककल्पनमर्थापत्तिः।", "padacchedaText": "", "audioFile": "PB_000437.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000438", "originalText": "तत्रोपपाद्यज्ञानं करणम्, उपपादकज्ञानं फलम्।", "padacchedaText": "", "audioFile": "PB_000438.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000439", "originalText": "येन विना यदनुपपन्नं तत् तत्रोपपाद्यम्।", "padacchedaText": "", "audioFile": "PB_000439.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000440", "originalText": "यस्याभावे यस्यानुपपत्तिः तत् तत्रोपपादकम्।", "padacchedaText": "", "audioFile": "PB_000440.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000441", "originalText": "यथा रात्रिभोजनेन विना दिवाऽभुञ्जानस्य पीनत्वमनुपपन्नम् इति तादृशं पीनत्वमुपपाद्यम्।", "padacchedaText": "", "audioFile": "PB_000441.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000442", "originalText": "यथा वा रात्रिभोजनस्याभावे तादृशपीनत्वस्यानुपपत्तिः इति रात्रिभोजनमुपपादकम्।", "padacchedaText": "", "audioFile": "PB_000442.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000443", "originalText": "रात्रिभोजनकल्पनारूपायां प्रमितौ \"अर्थस्य आपत्तिः— कल्पना\" इति षष्ठीसमासेन अर्थापत्तिशब्दो वर्तते।", "padacchedaText": "", "audioFile": "PB_000443.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000444", "originalText": "कल्पनाकरणे पीनत्वादिज्ञाने तु \"अर्थस्य आपत्तिः— कल्पना यस्मात्\" इति बहुव्रीहिसमासेन वर्तते, इति फलकरणयोरुभयोस्तत्पदप्रयोगः।", "padacchedaText": "", "audioFile": "PB_000444.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000445", "originalText": "सा चार्थापत्तिर्द्विविधा, दृष्टार्थापत्तिः श्रुतार्थापत्तिश्चेति।", "padacchedaText": "", "audioFile": "PB_000445.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000446", "originalText": "तत्र दृष्टार्थापत्तिर्यथा \"इदं रजतम्\" इति पुरोवर्तिनि प्रतिपन्नस्य रजतस्य \"नेदं रजतम्\" इति तत्रैव निषिध्यमानत्वं सत्यत्वेऽनुपपन्नम् इति रजतस्य सद्भिन्नत्वं सत्यत्वात्यन्ताभाववत्त्वं वा मिथ्यात्वं कल्पयति।", "padacchedaText": "", "audioFile": "PB_000446.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000447", "originalText": "श्रुतार्थापत्तिर्यथा यत्र श्रूयमाणवाक्यस्य स्वार्थानुपपत्तिमुखेन अर्थान्तरकल्पनम्।", "padacchedaText": "", "audioFile": "PB_000447.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000448", "originalText": "यथा \" तरति शोकमात्मवित्\"(छा.उ. ७.१.३) इत्यत्र श्रुतस्य शोकशब्दवाच्यबन्धजातस्य ज्ञाननिवर्त्यत्वस्यान्यथानुपपत्या बन्धस्य मिथ्यात्वं कल्प्यते।", "padacchedaText": "", "audioFile": "PB_000448.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000449", "originalText": "यथा वा \"जीवी देवदत्तो गृहे न\" इति वाक्यश्रवणानन्तरं जीविनो गृहासत्त्वं बहिःसत्त्वं कल्पयति।", "padacchedaText": "", "audioFile": "PB_000449.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000450", "originalText": "श्रुतार्थापत्तिश्च द्विविधा, अभिधानानुपपत्तिः अभिहितानुपपत्तिश्च।", "padacchedaText": "", "audioFile": "PB_000450.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000451", "originalText": "तत्र, यत्र वाक्यैकदेशश्रवणेऽन्वयाभिधानानुपपत्त्या अन्वयाभिधानोपयोगि पदान्तरं कल्प्यते तत्राभिधानानुपपत्तिः।", "padacchedaText": "", "audioFile": "PB_000451.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000452", "originalText": "यथा 'द्वारम्' इत्यत्र 'पिधेहि' इति पदाध्याहारः यथा वा \" विश्वजिता यजेत\" इत्यत्र स्वर्गकामपदाध्याहारः।", "padacchedaText": "", "audioFile": "PB_000452.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000453", "originalText": "ननु 'द्वारम्' इत्यादावन्वयाभिधानात्पूर्वम् इदमन्वयाभिधानं पिधानोपस्थापकपदं विनाऽनुपपन्नमिति कथं ज्ञानमिति चेत् न।", "padacchedaText": "", "audioFile": "PB_000453.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000454", "originalText": "अभिधानपदेन करणव्युत्पत्या तात्पर्यस्य विवक्षितत्वात्।", "padacchedaText": "", "audioFile": "PB_000454.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000455", "originalText": "तथा च द्वारकर्मकपिधानक्रियासंसर्गपरत्वं पिधानोपस्थापकपदं विनाऽनुपपन्नमिति ज्ञानं तत्रापि सम्भाव्यते।", "padacchedaText": "", "audioFile": "PB_000455.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000456", "originalText": "अभिहितानुपपत्तिस्तु यत्र वाक्यावगतोऽर्थोऽनुपपन्नत्वेन ज्ञातः सन्नर्थान्तरं कल्पयति तत्र द्रष्टव्या।", "padacchedaText": "", "audioFile": "PB_000456.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000457", "originalText": "तथा \" स्वर्गकामो ज्योतिष्टोमेन यजेत\" इत्यत्र स्वर्गसाधनत्वस्य क्षणिकयागगततयाऽवगतस्यानुपपत्त्या मध्यवर्त्यपूर्वं कल्प्यते।", "padacchedaText": "", "audioFile": "PB_000457.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000458", "originalText": "न चेयमर्थापत्तिरनुमानेऽन्तर्भवितुमर्हति अन्वयव्याप्त्यज्ञानेनान्वयिन्यनन्तर्भावात्।", "padacchedaText": "", "audioFile": "PB_000458.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000459", "originalText": "व्यतिरेकिणश्चानुमानत्वं प्रागेव निरस्तम्।", "padacchedaText": "", "audioFile": "PB_000459.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000460", "originalText": "अत एवार्थापत्तिस्थले 'अनुमिनोमि' इति नानुव्यवसायः।", "padacchedaText": "", "audioFile": "PB_000460.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000461", "originalText": "किन्तु \"अनेन इदं कल्पयामि\" इति।", "padacchedaText": "", "audioFile": "PB_000461.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000462", "originalText": "ननु अर्थापत्तिस्थले \"इदमनेन विनाऽनुपपन्नमिति ज्ञानं करणम्\" इत्युक्तम्।", "padacchedaText": "", "audioFile": "PB_000462.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000463", "originalText": "तत्र किमिदं \"तेन विनाऽनुपपन्नत्वम्\"? तदभावव्यपकाभावप्रतियोगित्वमिति ब्रूमः।", "padacchedaText": "", "audioFile": "PB_000463.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000464", "originalText": "एवमर्थापत्तेर्मानान्तरत्वसिद्धौ व्यतिरेकि नानुमानान्तरम्, \"पृथिवीतरेभ्यो भिद्यते\" इत्यादौ गन्धवत्त्वमितरभेदं विनाऽनुपपन्नमित्यादिज्ञानस्य करणत्वात्।", "padacchedaText": "", "audioFile": "PB_000464.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000465", "originalText": "अत एवानुव्यवसायः \"पृथिव्यामितरभेदं कल्पयामि\" इति।", "padacchedaText": "", "audioFile": "PB_000465.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000466", "originalText": "इति वेदान्तपरिभाषायामर्थापत्तिपरिच्छेदः।", "padacchedaText": "", "audioFile": "PB_000466.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000467", "originalText": "अनुपलब्धिप्रमाणम्\nइदानीं षष्ठं प्रमाणं निरूप्यते।", "padacchedaText": "", "audioFile": "PB_000467.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000468", "originalText": "ज्ञानकरणाजन्य—अभावानुभव—असाधारणकारणम् अनुपलब्धिरूपं प्रमाणम्।", "padacchedaText": "", "audioFile": "PB_000468.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000469", "originalText": "अनुमानादिजन्य—अतीन्द्रियाभावानुभवहेतौ अनुमानादावतिव्याप्तिवारणाय अजन्यान्तं पदम्।", "padacchedaText": "", "audioFile": "PB_000469.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000470", "originalText": "अदृष्टादौ साधारणकारणेऽतिव्याप्तिवारणायासाधारणेति।", "padacchedaText": "", "audioFile": "PB_000470.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000471", "originalText": "अभावस्मृत्यसाधारणहेतुसंस्कारेऽतिव्याप्तिवारणायानुभवेति विशेषणम्।", "padacchedaText": "", "audioFile": "PB_000471.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000472", "originalText": "न चातीन्द्रियाभावानुमितिस्थलेऽप्यनुपलब्ध्यैवाभावो गृह्यताम्, विशेषाभावादिति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_000472.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000473", "originalText": "धर्माधर्माद्यनुपलब्धिसत्त्वेऽपि तदभावानिश्चयेन योग्यानुपलब्धेरेवाभावग्राहकत्वात्।", "padacchedaText": "", "audioFile": "PB_000473.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000474", "originalText": "ननु केयं योग्यानुपलब्धिः? किं योग्यस्य प्रतियोगिनोऽनुपलब्धिः? उत योग्येऽधिकरणे प्रतियोगिनोऽनुपलब्धिः? नाद्यः, स्तम्भे पिशाचादिभेदस्याप्रत्यक्षत्वापत्तेः।", "padacchedaText": "", "audioFile": "PB_000474.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000475", "originalText": "नान्त्यः, आत्मनि धर्माद्यभावस्यापि प्रत्यक्षत्वापत्तेरिति चेत् न।", "padacchedaText": "", "audioFile": "PB_000475.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000476", "originalText": "\"योग्या चासावनुपलब्धिश्चेति\" कर्मधारयाश्रयणात्।", "padacchedaText": "", "audioFile": "PB_000476.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000477", "originalText": "अनुपलब्धेर्योग्यता च तर्कितप्रतियोगिसत्त्वप्रसञ्जितप्रतियोगिकत्वम्।", "padacchedaText": "", "audioFile": "PB_000477.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000478", "originalText": "यस्याभावो गृह्यते, तस्य यः प्रतियोगी, तस्य सत्त्वेन— अधिकरणे तर्कितेन, प्रसञ्जनयोग्यम्— अापादनयोग्यं प्रतियोग्युपलब्धिस्वरूपं यस्य अनुपलम्भस्य तत्त्वं— तदनुपलब्धेर्योग्यत्वमित्यर्थः।", "padacchedaText": "", "audioFile": "PB_000478.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000479", "originalText": "तथाहि— स्फीतालोकवति भूतले यदि घटः स्यात्, तदा घटोपलम्भः स्यादित्यापादनसम्भवात्, तादृशभूतले घटाभावोऽनुपलब्धिगम्यः।", "padacchedaText": "", "audioFile": "PB_000479.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000480", "originalText": "अन्धकारे तु तादृशापादनासम्भवान्नानुपलब्धिगम्यता।", "padacchedaText": "", "audioFile": "PB_000480.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000481", "originalText": "अत एव स्तम्भे तादात्म्येन पिशाचसत्त्वे स्तम्भवत् प्रत्यक्षत्वापत्त्या तदभावोऽनुपलब्धिगम्यः।", "padacchedaText": "", "audioFile": "PB_000481.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000482", "originalText": "आत्मनि धर्मादिसत्त्वेऽप्यस्यातीन्द्रियतया निरुक्तोपलम्भापादनासम्भवात् न धर्माद्यभावस्यानुपलब्धिगम्यत्वम्।", "padacchedaText": "", "audioFile": "PB_000482.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000483", "originalText": "ननूक्तरीत्याऽधिकरणेन्द्रियसन्निकर्षस्थले अभावस्यानुपलब्धिगम्यत्वं त्वदनुमतम्।", "padacchedaText": "", "audioFile": "PB_000483.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000484", "originalText": "तत्र क्लृप्तेन्द्रियमेवाभावाकारवृत्तावपि करणम्, इन्द्रियान्वयव्यतिरेकानुविधानादिति चेत् न।", "padacchedaText": "", "audioFile": "PB_000484.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000485", "originalText": "तत्प्रतियोग्यनुपलब्धेरप्यभावग्रहे हेतुत्वेन क्लृप्तत्वेन करणत्वमात्रस्य कल्पनात्।", "padacchedaText": "", "audioFile": "PB_000485.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000486", "originalText": "इन्द्रियस्य चाभावेन समं सन्निकर्षाभावेनाभावग्रहाहेतुत्वात् इन्द्रियान्वयव्यतिरेकयोः अधिकरणज्ञानाद्युपक्षीणत्वेन अन्यथासिद्धेः।", "padacchedaText": "", "audioFile": "PB_000486.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000487", "originalText": "ननु \"भूतले घटो न\" इत्याद्यभावानुभवस्थले भूतलांशे प्रत्यक्षत्वमुभयसिद्धमिति तत्र वृत्तिनिर्गमनस्यावश्यकत्वेन भूतलावच्छिन्नचैतन्यवत् तन्निष्ठघटाभावावच्छिन्नचैतन्यस्यापि प्रमात्रभिन्नतया घटाभावस्य प्रत्यक्षतैव सिद्धान्तेऽपि इति चेत्, सत्यम्।", "padacchedaText": "", "audioFile": "PB_000487.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000488", "originalText": "अभावप्रतीतेः प्रत्यक्षत्वेऽपि तत्कारणस्यानुपलब्धेर्मानान्तरत्वात्।", "padacchedaText": "", "audioFile": "PB_000488.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000489", "originalText": "न हि फलीभूतज्ञानस्य प्रत्यक्षत्वे तत्करणस्य प्रत्यक्षप्रमाणतानियतत्वमस्ति।", "padacchedaText": "", "audioFile": "PB_000489.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000490", "originalText": "\" दशमस्त्वमसि\" इत्यादिवाक्यजन्यज्ञानस्य प्रत्यक्षत्वेऽपि तत्करणस्य वाक्यस्य प्रत्यक्षप्रमाणभिन्नप्रमाणत्वाभ्युपगमात्।", "padacchedaText": "", "audioFile": "PB_000490.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000491", "originalText": "फलवैजात्यं विना कथं प्रमाणभेद इति चेत् न।", "padacchedaText": "", "audioFile": "PB_000491.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000492", "originalText": "वृत्तिवैजात्यमात्रेण प्रमाणवैजात्योपपत्तेः।", "padacchedaText": "", "audioFile": "PB_000492.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000493", "originalText": "तथा च घटाद्यभावाकारवृत्तिर्नेन्द्रियजन्या, इन्द्रियस्य विषयेणासन्निकर्षात्, किन्तु घटाद्यनुपलब्धिरूपमानान्तरजन्येति भवत्यनुपलब्धेर्मानान्तरत्वम्।", "padacchedaText": "", "audioFile": "PB_000493.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000494", "originalText": "ननु अनुपलब्धिरूपमानान्तरपक्षेऽभावप्रतीतेः प्रत्यक्षत्वे घटवति घटाभावभ्रमस्यापि प्रत्यक्षत्वापत्तौ तत्राप्यनिर्वचनीयघटाभावोऽभ्युपगम्येत।", "padacchedaText": "", "audioFile": "PB_000494.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000495", "originalText": "न चेष्टापत्तिः, तस्य मायोपादानकत्वेऽभावत्वानुपपत्तेः।", "padacchedaText": "", "audioFile": "PB_000495.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000496", "originalText": "मायोपादानकत्वाभावे मायायाः सफलकार्योपादानत्वानुपपत्तिरिति चेत् न।", "padacchedaText": "", "audioFile": "PB_000496.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000497", "originalText": "घटवति घटाभावभ्रमो न तत्कालोत्पन्नघटाभावविषयकः, किन्तु भूतलरूपादौ विद्यमानो लौकिको घटाभावो भूतले आरोप्यते इत्यन्यथाख्यातिरेव, आरोप्यसन्निकर्षस्थले सर्वत्रान्यथाख्यातेरेव व्यवस्थापनात्।", "padacchedaText": "", "audioFile": "PB_000497.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000498", "originalText": "अस्तु वा प्रतियोगिमति तदभावभ्रमस्थले तदभावस्यानिर्वचनीयत्वम्, तथापि तदुपादानं मायैव।", "padacchedaText": "", "audioFile": "PB_000498.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000499", "originalText": "न ह्युपादानोपादेययोरत्यन्तसाजात्यम्, तन्तुपटयोरपि तन्तुत्वपटत्वादिना वैजात्यात्।", "padacchedaText": "", "audioFile": "PB_000499.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000500", "originalText": "यत्किञ्चित्साजात्यस्य मायाया अनिर्वचनीयघटाभावस्य च मिथ्यात्वधर्मस्य विद्यमानत्वात्।", "padacchedaText": "", "audioFile": "PB_000500.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000501", "originalText": "अन्यथा व्यावहारिकं घटाभावं प्रति कथं मायोपादानमिति कुतो नाशङ्केथाः।", "padacchedaText": "", "audioFile": "PB_000501.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000502", "originalText": "न च विजातीययोरप्युपादानोपादेयभावे ब्रह्मैव जगदुपादानं स्यादिति वाच्यम् प्रपञ्चविभ्रमाधिष्ठानत्वरूपस्य तस्येष्टत्वात् परिणामित्वरूपस्योपादानत्वस्य निरवयवे ब्रह्मण्यनुपपत्तेः।", "padacchedaText": "", "audioFile": "PB_000502.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000503", "originalText": "तथा च प्रपञ्चस्य परिणाम्युपादानं माया, न ब्रह्म इति सिद्धान्त इत्यलमतिप्रसङ्गेन।", "padacchedaText": "", "audioFile": "PB_000503.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000504", "originalText": "स चाभावश्चतुर्विधः प्रागभावः प्रध्वंसाभावोऽत्यन्ताभावोऽन्योन्याभावश्चेति।", "padacchedaText": "", "audioFile": "PB_000504.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000505", "originalText": "तत्र मृत्पिण्डादौ कारणे कार्यस्य घटादेरुत्पत्तेः पूर्वं योऽभावः स प्रागभावः।", "padacchedaText": "", "audioFile": "PB_000505.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000506", "originalText": "स च भविष्यतीति प्रतीतिविषयः।", "padacchedaText": "", "audioFile": "PB_000506.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000507", "originalText": "तत्रैव घटस्य मुद्गरपातानन्तरं योऽभावः स प्रध्वंसाभावः।", "padacchedaText": "", "audioFile": "PB_000507.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000508", "originalText": "ध्वंसस्यापि स्वाधिकरणकपालनाशे नाश एव।", "padacchedaText": "", "audioFile": "PB_000508.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000509", "originalText": "न च घटोन्मज्जनापत्तिः, घटध्वंसध्वंसस्यापि घटप्रतियोगिकध्वंसत्वात्।", "padacchedaText": "", "audioFile": "PB_000509.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000510", "originalText": "अन्यथा प्रागभावध्वंसात्मकघटस्य विनाशे प्रागभावोन्मज्जनापत्तिः।", "padacchedaText": "", "audioFile": "PB_000510.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000511", "originalText": "न चैवमपि यत्र ध्वंसाधिकरणं नित्यं तत्र कथं ध्वंसनाश इति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_000511.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000512", "originalText": "तादृशमधिकरणं यदि चैतन्यव्यतिरिक्तं तदा तस्य नित्यत्वमसिद्धम्, ब्रह्मव्यतिरिक्तस्य सर्वस्य ब्रह्मज्ञाननिवर्त्यताया वक्ष्यमाणत्वात्।", "padacchedaText": "", "audioFile": "PB_000512.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000513", "originalText": "यदि च ध्वंसाधिकरणं चैतन्यं, तदाऽसिद्धिः आरोपितप्रतियोगिकध्वंसस्याधिष्ठाने प्रतीयमानस्याधिष्ठानमात्रत्वात्।", "padacchedaText": "", "audioFile": "PB_000513.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000514", "originalText": "तदुक्तम् \" अधिष्ठानावशेषो हि नाशः कल्पितवस्तुनः\" इति।", "padacchedaText": "", "audioFile": "PB_000514.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000515", "originalText": "एवं शुक्तिरूप्यविनाशोऽपीदमवच्छिन्नचैतन्यमेव।", "padacchedaText": "", "audioFile": "PB_000515.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000516", "originalText": "यत्राधिकरणे यस्य कालत्रयेऽप्यभावः सोऽत्यन्ताभावः।", "padacchedaText": "", "audioFile": "PB_000516.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000517", "originalText": "यथा वायौ रूपात्यन्ताभावः।", "padacchedaText": "", "audioFile": "PB_000517.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000518", "originalText": "सोऽपि वियदादिवत् ध्वंसप्रतियोग्येव।", "padacchedaText": "", "audioFile": "PB_000518.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000519", "originalText": "'इदमिदं न' इति प्रतीतिविषयोऽन्योन्याभावः।", "padacchedaText": "", "audioFile": "PB_000519.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000520", "originalText": "अयमेव विभागो, भेदः, पृथक्त्वं चेति व्यवह्रियते, भेदातिरिक्तपृथक्त्वादौ प्रमाणाभावात्।", "padacchedaText": "", "audioFile": "PB_000520.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000521", "originalText": "अयं चान्योन्याभावोऽधिकरणस्य सादित्वे सादिः, यथा घटे पटभेदः।", "padacchedaText": "", "audioFile": "PB_000521.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000522", "originalText": "अधिकरणस्यानादित्वेऽनादिरेव, यथा जीवे ब्रह्मभेदः, ब्रह्मणि वा जीवभेदः।", "padacchedaText": "", "audioFile": "PB_000522.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000523", "originalText": "द्विविधोऽपि भेदो ध्वंसप्रतियोग्येव अविद्यानिवृत्तौ तत्परतन्त्राणां निवृत्त्यवश्यम्भावात्।", "padacchedaText": "", "audioFile": "PB_000523.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000524", "originalText": "पुनरपि भेदो द्विविधः सोपाधिको निरुपाधिकश्चेति।", "padacchedaText": "", "audioFile": "PB_000524.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000525", "originalText": "तत्रोपाधिसत्ताव्याप्यसत्ताकत्वं सोपाधिकत्वम्।", "padacchedaText": "", "audioFile": "PB_000525.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000526", "originalText": "तच्छून्यत्वं निरुपाधिकत्वम्।", "padacchedaText": "", "audioFile": "PB_000526.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000527", "originalText": "तत्राद्यो यथा एकस्यैवाकाशस्य घटाद्युपाधिभेदेन भेदः।", "padacchedaText": "", "audioFile": "PB_000527.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000528", "originalText": "यथा वा एकस्य सूर्यस्य जलभाजनभेदेन भेदः।", "padacchedaText": "", "audioFile": "PB_000528.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000529", "originalText": "तथा च ब्रह्मणोऽन्तःकरणभेदाद्भेदः।", "padacchedaText": "", "audioFile": "PB_000529.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000530", "originalText": "निरुपाधिकभेदो यथा घटे पटभेदः।", "padacchedaText": "", "audioFile": "PB_000530.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000531", "originalText": "न च ब्रह्मण्यपि प्रपञ्चभेदाभ्युपगमेऽद्वैतविरोधः, तात्त्विकभेदानभ्युपगमेन वियदादिवदद्वैताव्याघातकत्वात्।", "padacchedaText": "", "audioFile": "PB_000531.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000532", "originalText": "प्रपञ्चस्याद्वैते ब्रह्मणि कल्पितत्वाङ्गीकारात्।", "padacchedaText": "", "audioFile": "PB_000532.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000533", "originalText": "तदुक्तं सुरेश्वराचार्यैः— \" अक्षमा भवतः केयं साधकत्वप्रकल्पने। किं न पश्यसि संसारं तत्रैवाज्ञानकल्पितम्॥", "padacchedaText": "", "audioFile": "PB_000533.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000534", "originalText": "\" इति।", "padacchedaText": "", "audioFile": "PB_000534.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000535", "originalText": "अत एव विवरणेऽविद्यानुमाने प्रागभावव्यतिरिक्तत्वविशेषणम्, तत्त्वप्रदीपिकायामविद्यालक्षणे भावत्वविशेषणं च सङ्गच्छते।", "padacchedaText": "", "audioFile": "PB_000535.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000536", "originalText": "एवं चतुर्विधानामभावानां योग्यानुपलब्ध्या प्रतीतिः।", "padacchedaText": "", "audioFile": "PB_000536.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000537", "originalText": "तत्रानुपलब्धिर्मानान्तरम्।", "padacchedaText": "", "audioFile": "PB_000537.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000538", "originalText": "एवमुक्तानां प्रमाणानां प्रामाण्यं स्वत एवोत्पद्यते ज्ञायते च।", "padacchedaText": "", "audioFile": "PB_000538.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000539", "originalText": "तथा हि स्मृत्यनुभवसाधारणं संवादिप्रवृत्त्यनुकूलं तद्वति तत्प्रकारकज्ञानत्वं प्रामाण्यम्।", "padacchedaText": "", "audioFile": "PB_000539.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000540", "originalText": "तच्च ज्ञानसामान्यसामग्रीप्रयोज्यं, न त्वधिकं गुणमपेक्षते प्रमामात्रेऽनुगतगुणाभावात्।", "padacchedaText": "", "audioFile": "PB_000540.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000541", "originalText": "नापि प्रत्यक्षप्रमायां भूयोऽवयवेन्द्रियसन्निकर्षः, रूपादिप्रत्यक्षे आत्मप्रत्यक्षे च तदभावात्।", "padacchedaText": "", "audioFile": "PB_000541.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000542", "originalText": "सत्यपि तस्मिन् \"पीतः शङ्खः\" इति प्रत्यक्षस्य भ्रमत्वाच्च।", "padacchedaText": "", "audioFile": "PB_000542.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000543", "originalText": "अत एव न सल्लिङ्गपरामर्शादिकमप्यनुमित्यादिप्रमायां गुणः, असल्लिङ्गपरामर्शादिस्थलेऽपि विषयाबाधेनानुमित्यादेः प्रमात्वात्।", "padacchedaText": "", "audioFile": "PB_000543.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000544", "originalText": "न चैवमप्रमापि प्रमा स्यात्, ज्ञानसामान्यसामग्र्या अविशेषादिति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_000544.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000545", "originalText": "दोषाभावस्यापि हेतुत्वाङ्गीकारात्।", "padacchedaText": "", "audioFile": "PB_000545.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000546", "originalText": "न चैवं परतस्त्वम्, आगन्तुकभावकारणापेक्षायामेव परतस्त्वात्।", "padacchedaText": "", "audioFile": "PB_000546.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000547", "originalText": "ज्ञायते च प्रामाण्यं स्वतः।", "padacchedaText": "", "audioFile": "PB_000547.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000548", "originalText": "स्वतो ग्राह्यत्वं च दोषाभावे सति यावत्स्वाश्रयग्राहकसामग्रीग्राह्यत्वम्।", "padacchedaText": "", "audioFile": "PB_000548.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000549", "originalText": "स्वाश्रयो वृत्तिज्ञानम्, तद्ग्राहकं साक्षिज्ञानम्।", "padacchedaText": "", "audioFile": "PB_000549.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000550", "originalText": "तेनापि वृत्तिज्ञाने गृह्यमाणे तद्गतं प्रामाण्यमपि गृह्यते।", "padacchedaText": "", "audioFile": "PB_000550.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000551", "originalText": "न चैवं प्रामाण्यसंशयानुपपत्तिः तत्र संशयानुरोधेन दोषस्यापि सत्त्वेन दोषाभावघटितस्वाश्रयग्राहकाभावेन तत्र प्रामाण्यस्यैवाग्रहात्।", "padacchedaText": "", "audioFile": "PB_000551.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000552", "originalText": "यद्वा, यावत्स्वाश्रयग्राहकग्राह्यत्वयोग्यत्वं स्वतस्त्वम्।", "padacchedaText": "", "audioFile": "PB_000552.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000553", "originalText": "संशयस्थले प्रामाण्यस्योक्तयोग्यतासत्त्वेऽपि दोषवशेनाग्रहात् न संशयानुपपत्तिः।", "padacchedaText": "", "audioFile": "PB_000553.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000554", "originalText": "अप्रामाण्यन्तु न ज्ञानसामान्यसामग्रीप्रयोज्यम् प्रमायामप्यप्रामाण्यापत्तेः, किन्तु दोषप्रयोज्यम्।", "padacchedaText": "", "audioFile": "PB_000554.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000555", "originalText": "नाप्यप्रामाण्यं यावत्स्वाश्रयग्राहकग्राह्यम्, अप्रामाण्यघटकतदभाववत्त्वादेर्वृत्तिज्ञानानुपनीतत्वेन साक्षिणा ग्रहीतुमशक्यत्वात्।", "padacchedaText": "", "audioFile": "PB_000555.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000556", "originalText": "किन्तु विसंवादिप्रवृत्त्यादिलिङ्गकानुमित्यादिविषय इति परत एवाप्रामाण्यमुत्पद्यते ज्ञायते च।", "padacchedaText": "", "audioFile": "PB_000556.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000557", "originalText": "इति वेदान्तपरिभाषायामनुपलब्धिपरिच्छेदः।", "padacchedaText": "", "audioFile": "PB_000557.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000558", "originalText": "विषयः\nएवं निरूपितानां प्रमाणानां प्रामाण्यं द्विविधम्— व्यावहारिकतत्त्वावेदकत्वं पारमार्थिकतत्त्वावेदकत्वं चेति।", "padacchedaText": "", "audioFile": "PB_000558.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000559", "originalText": "तत्र ब्रह्मस्वरूपावगाहिप्रमाणव्यतिरिक्तानां सर्वप्रमाणानामाद्यं प्रामाण्यम्, तद्विषयाणां व्यवहारदशायां बाधाभावात्।", "padacchedaText": "", "audioFile": "PB_000559.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000560", "originalText": "द्वितीयन्तु जीवब्रह्मैक्यपराणां \" सदेव सोम्येदमग्र आसीत्\"(छा.उ. ६.२.१.) इत्यादीनां \" तत्त्वमसि\"(छा.उ. ६.८.७.) इत्यन्तानाम्, तद्विषयस्य जीवपरैक्यस्य कालत्रयाबाध्यत्वात्।", "padacchedaText": "", "audioFile": "PB_000560.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000561", "originalText": "तच्चैक्यं तत्त्वम्पदार्थज्ञानाधीनज्ञानमिति प्रथमं तत्—पदार्थो लक्षणप्रमाणाभ्यां निरूप्यते।", "padacchedaText": "", "audioFile": "PB_000561.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000562", "originalText": "तत्र लक्षणं द्विविधम्, स्वरूपलक्षणं तटस्थलक्षणं चेति।", "padacchedaText": "", "audioFile": "PB_000562.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000563", "originalText": "तत्र स्वरूपमेव लक्षणं स्वरूपलक्षणम्।", "padacchedaText": "", "audioFile": "PB_000563.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000564", "originalText": "यथा सत्यादिकं ब्रह्मस्वरूपलक्षणम्, \" सत्यं ज्ञानमनन्तं ब्रह्म\" (तै.उ. २.१.१.), आनन्दो ब्रह्मेति व्यजानात् (तै.उ. ३.६.१.) इत्यादिश्रुतेः।", "padacchedaText": "", "audioFile": "PB_000564.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000565", "originalText": "ननु स्वस्य स्ववृत्तित्वाभावे कथं लक्षणत्वमिति चेत् न।", "padacchedaText": "", "audioFile": "PB_000565.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000566", "originalText": "स्वस्यैव स्वापेक्षया धर्मिधर्मभावकल्पनया लक्ष्यलक्षणत्वसम्भवात्।", "padacchedaText": "", "audioFile": "PB_000566.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000567", "originalText": "तदुक्तम्— \" आनन्दो विषयानुभवो नित्यत्वं चेति सन्ति धर्माः, अपृथक्त्वेऽपि चैतन्यात् पृथगिवावभासन्ते\" इति।", "padacchedaText": "", "audioFile": "PB_000567.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000568", "originalText": "तटस्थलक्षणं नाम यावल्लक्ष्यकालमनवस्थितत्वे सति यद्व्यावर्तकं तदेव।", "padacchedaText": "", "audioFile": "PB_000568.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000569", "originalText": "यथा गन्धवत्वं पृथिवीलक्षणम्।", "padacchedaText": "", "audioFile": "PB_000569.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000570", "originalText": "महाप्रलये परमाणुषु, उत्पत्तिकाले घटादिषु च गन्धाभावात्।", "padacchedaText": "", "audioFile": "PB_000570.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000571", "originalText": "प्रकृते च जगज्जन्मादिकारणत्वम्।", "padacchedaText": "", "audioFile": "PB_000571.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000572", "originalText": "अत्र जगत्पदेन कार्यजातं विवक्षितम्।", "padacchedaText": "", "audioFile": "PB_000572.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000573", "originalText": "कारणत्वं च कर्तृत्वम्, अतोऽविद्यादौ नातिव्याप्तिः।", "padacchedaText": "", "audioFile": "PB_000573.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000574", "originalText": "कर्तृत्वं च तत्तदुपादानगोचरापरोक्षज्ञानचिकिर्षाकृतिमत्वम्।", "padacchedaText": "", "audioFile": "PB_000574.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000575", "originalText": "ईश्वरस्य तावदुपादानगोचरापरोक्षज्ञानसद्भावे— \" यः सर्वज्ञः सर्ववित् यस्य ज्ञानमयं तपः। तस्मादेतद्ब्रह्म नाम रूपमन्नं च जायते॥", "padacchedaText": "", "audioFile": "PB_000575.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000576", "originalText": "\"(मु.उ. १.१.९.) इत्यादिश्रुतिर्मानम्।", "padacchedaText": "", "audioFile": "PB_000576.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000577", "originalText": "तादृशचिकीर्षासद्भावे च \" सोऽकामयत, बहु स्यां प्रजायेय\"(तै.उ. २.६.१.) इत्यादिश्रुतिर्मानम्।", "padacchedaText": "", "audioFile": "PB_000577.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000578", "originalText": "तादृशकृतौ च \" तन्मनोऽकुरुत\"(बृ.उ. १.२.१.) इत्यादिवाक्यम्।", "padacchedaText": "", "audioFile": "PB_000578.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000579", "originalText": "ज्ञानेच्छाद्यन्यतमगर्भं लक्षणत्रितयं विवक्षितम्, अन्यथा व्यर्थविशेषणापत्तेः।", "padacchedaText": "", "audioFile": "PB_000579.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000580", "originalText": "अत एव जन्मस्थितिध्वंसानामन्यतमस्यैव लक्षणे प्रवेशः।", "padacchedaText": "", "audioFile": "PB_000580.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000581", "originalText": "एवं च लक्षणानि नव सम्पद्यन्ते।", "padacchedaText": "", "audioFile": "PB_000581.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000582", "originalText": "ब्रह्मणो जगज्जन्मादिकरणत्वे च \" यतो वा इमानि भूतानि जायन्ते, येन जातानि जीवन्ति, यत् प्रयन्त्यभिसंविशन्ति\"(तै.उ. ३.१.१.) इत्यादिश्रुतिर्मानम्।", "padacchedaText": "", "audioFile": "PB_000582.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000583", "originalText": "यद्वा निखिलजगदुपादानत्वं ब्रह्मणो लक्षणम्।", "padacchedaText": "", "audioFile": "PB_000583.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000584", "originalText": "उपादानत्वं च जगदध्यासाधिष्ठानत्वम्, जगदाकारेण परिणममानमायाधिष्ठानत्वं वा।", "padacchedaText": "", "audioFile": "PB_000584.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000585", "originalText": "एतादृशमेवोपादानत्वमभिप्रेत्य \" इदं सर्वं यदयमात्मा\"(बृ.उ. २.४.६.), सच्च त्यच्चाभवत्(तै.उ. २.६.१.), बहु स्यां प्रजायेय(तै.उ. २.६.१.) इत्यादिश्रुतिषु ब्रह्मप्रपञ्चयोस्तादात्म्यव्यपदेशः।", "padacchedaText": "", "audioFile": "PB_000585.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000586", "originalText": "\"घटः सन्\", \"घटो भाति\", \"घट इष्टः\" इत्यादिलौकिकव्यपदेशोऽपि सच्चिदानन्दरूपब्रह्मैक्याध्यासात्।", "padacchedaText": "", "audioFile": "PB_000586.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000587", "originalText": "नन्वानन्दात्मकचिदध्यासाद्घटादेरिष्टत्वव्यवहारे, दुःखस्यापि तत्राध्यासात् तस्यापीष्टत्वव्यवहारापत्तिरिति चेत् न।", "padacchedaText": "", "audioFile": "PB_000587.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000588", "originalText": "\"आरोपे सति निमित्तानुसरणम्, न तु निमित्तमस्तीत्यारोपः\" इत्यभ्युपगमेन, दुःखादौ सच्चिदंशाध्यासेऽपि आनन्दांशाध्यासाभावात्।", "padacchedaText": "", "audioFile": "PB_000588.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000589", "originalText": "जगति नामरूपांशद्वयव्यवहारस्तु अविद्यापरिणामात्मकनामरूपसम्बन्धात्।", "padacchedaText": "", "audioFile": "PB_000589.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000590", "originalText": "तदुक्तम्— \" अस्ति भाति प्रियं रूपं नाम चेत्यंशपञ्चकम्। आद्यं त्रयं ब्रह्मरूपं जगद्रूपं ततो द्वयम्॥", "padacchedaText": "", "audioFile": "PB_000590.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000591", "originalText": "\" इति॥", "padacchedaText": "", "audioFile": "PB_000591.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000592", "originalText": "अथ जगतो जन्मक्रमो निरूप्यते।", "padacchedaText": "", "audioFile": "PB_000592.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000593", "originalText": "तत्र सर्गाद्यकाले परमेश्वरः सृज्यमानप्रपञ्चवैचित्र्यहेतुप्राणिकर्मसहकृतोऽपरिमितानिरूपितशक्तिविशेषविशिष्टमायासहितः सन् नामरूपात्मकनिखिलप्रपञ्चं प्रथमं बुद्धावाकलय्य, \"इदं करिष्यामि\" इति सङ्कल्पयति, \" तदैक्षत बहु स्यां प्रजायेय\"(छा.उ. ६.२.३.), \" सोऽकामयत बहु स्यां प्रजायेय\"(तै.उ. २.६.१.) इत्यादिश्रुतेः।", "padacchedaText": "", "audioFile": "PB_000593.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000594", "originalText": "तत आकाशादीनि पञ्चभूतान्यपञ्चीकृतानि तन्मात्रपदप्रतिपाद्यान्युत्पद्यन्ते।", "padacchedaText": "", "audioFile": "PB_000594.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000595", "originalText": "तत्राकाशस्य शब्दो गुणः, वायोस्तु शब्दस्पर्शौ, तेजसस्तु शब्दस्पर्शरूपाणि, अपां तु शब्दस्पर्शरूपरसाः, पृथिव्यास्तु शब्दस्पर्शरूपरसगन्धाः।", "padacchedaText": "", "audioFile": "PB_000595.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000596", "originalText": "न तु शब्दस्याकाशमात्रगुणत्वम्, वाय्वादावपि तदुपलम्भात्।", "padacchedaText": "", "audioFile": "PB_000596.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000597", "originalText": "न चासौ भ्रमः बाधकाभावात्।", "padacchedaText": "", "audioFile": "PB_000597.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000598", "originalText": "इमानि भूतानि त्रिगुणमायाकार्याणि त्रिगुणानि।", "padacchedaText": "", "audioFile": "PB_000598.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000599", "originalText": "गुणाः सत्त्वरजस्तमांसि।", "padacchedaText": "", "audioFile": "PB_000599.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000600", "originalText": "एतैश्च सत्त्वगुणोपेतैः पञ्चभूतैर्व्यस्तैर्यथाक्रमं श्रोत्रत्वक्चक्षूरसनघ्राणानि पञ्च ज्ञानेन्द्रियाणि जायन्ते।", "padacchedaText": "", "audioFile": "PB_000600.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000601", "originalText": "एतैरेव सत्त्वगुणोपेतैः पञ्चभूतैर्मिलितैर्मनोबुद्ध्यहङ्कारचित्तनि जायन्ते।", "padacchedaText": "", "audioFile": "PB_000601.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000602", "originalText": "श्रोत्रादीनां पञ्चानां क्रमेण दिग्वातार्कवरुणाश्विनोऽधिष्ठातृदेवताः।", "padacchedaText": "", "audioFile": "PB_000602.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000603", "originalText": "मन आदीनां चतुर्णां क्रमेण चन्द्रचतुर्मुखशङ्कराच्युता अधिष्ठातृदेवताः।", "padacchedaText": "", "audioFile": "PB_000603.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000604", "originalText": "एतैरेव रजोगुणोपेतैः पञ्चभूतैर्यथाक्रमं वाक्पाणिपादपायूपस्थाख्यानि कर्मेन्द्रियाणि जायन्ते।", "padacchedaText": "", "audioFile": "PB_000604.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000605", "originalText": "तेषां च क्रमेण वह्नीन्द्रोपेन्द्रमृत्युप्रजापतयोऽधिष्ठातृदेवताः।", "padacchedaText": "", "audioFile": "PB_000605.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000606", "originalText": "रजोगुणोपेतैः पञ्चभूतैरेव मिलितैः पञ्च वायवः प्राणापनव्यानोदानसमानाख्या जायन्ते।", "padacchedaText": "", "audioFile": "PB_000606.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000607", "originalText": "तत्र प्राग्गमनवान् वायुः प्राणो नासादिस्थानवर्ती।", "padacchedaText": "", "audioFile": "PB_000607.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000608", "originalText": "अर्वाग्गमनवानपानः पाय्वादिस्थानवर्ती।", "padacchedaText": "", "audioFile": "PB_000608.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000609", "originalText": "विष्वगमनवान् व्यानः अखिलशरीरवर्ती।", "padacchedaText": "", "audioFile": "PB_000609.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000610", "originalText": "ऊर्ध्वगमनवानुत्क्रमणवायुरुदानः कण्ठस्थानवर्ती।", "padacchedaText": "", "audioFile": "PB_000610.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000611", "originalText": "अशितपीतान्नादिसमीकरणकरः समानः नाभिस्थानवर्ती।", "padacchedaText": "", "audioFile": "PB_000611.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000612", "originalText": "तैरेव तमोगुणोपेतैरपञ्चीकृतभूतैः पञ्चीकृतभूतानि जायन्ते।", "padacchedaText": "", "audioFile": "PB_000612.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000613", "originalText": "\" तासां त्रिवृतं त्रिवृतमेकैकामकरोत्\"(छा.उ. ६.३.३.) इति श्रुतेः पञ्चीकरणोपलक्षणार्थत्वात्।", "padacchedaText": "", "audioFile": "PB_000613.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000614", "originalText": "पञ्चीकरणप्रकारश्चेत्थम् आकाशमादौ द्विधा विभज्य तयोरेकं भागं पुनश्चतुर्धा विभज्य तेषां चतुर्णामंशानां वाय्वादिषु चतुर्षु भूतेषु संयोजनम्।", "padacchedaText": "", "audioFile": "PB_000614.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000615", "originalText": "एवं वायुं द्विधा विभज्य तयोरेकं भागं पुनश्चतुर्धा विभज्य तेषां चतुर्णामांशानामाकाशादिषु संयोजनम्।", "padacchedaText": "", "audioFile": "PB_000615.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000616", "originalText": "एवं तेजआदीनामपि।", "padacchedaText": "", "audioFile": "PB_000616.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000617", "originalText": "तदेवमेकैकभूतस्यार्धं स्वांशात्मकम् अर्धान्तरं चतुर्विधभूतमयमिति पृथिव्यादिषु स्वांशाधिक्यात् पृथिव्यादिव्यवहारः।", "padacchedaText": "", "audioFile": "PB_000617.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000618", "originalText": "तदुक्तम्— \" वैशेष्यात्तु तद्वादस्तद्वादः\"(ब्र.सू. २.४.२२.) इति।", "padacchedaText": "", "audioFile": "PB_000618.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000619", "originalText": "पूर्वोक्तैरपञ्चीकृतभूतैर्लिङ्गशरीरं परलोकयात्रानिर्वाहकं मोक्षपर्यन्तस्थायि मनोबुद्धिभ्यामुपेतं ज्ञानेन्द्रियपञ्चक—कर्मेन्द्रियपञ्चक—प्राणदिपञ्चकसंयुक्तं जायते।", "padacchedaText": "", "audioFile": "PB_000619.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000620", "originalText": "तदुक्तम्— \" पञ्चप्राणमनोबुद्धिदशेन्द्रियसमन्वितम्। अपञ्चीकृतभूतोत्थं सूक्ष्माङ्गं भोगसाधनम्॥", "padacchedaText": "", "audioFile": "PB_000620.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000621", "originalText": "\" इति।", "padacchedaText": "", "audioFile": "PB_000621.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000622", "originalText": "तच्च द्विविधम् परमपरं च।", "padacchedaText": "", "audioFile": "PB_000622.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000623", "originalText": "परं हिरण्यगर्भलिङ्गशरीरम्,अपरमस्मदादिलिङ्गशरीरम्।", "padacchedaText": "", "audioFile": "PB_000623.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000624", "originalText": "तत्र हिरण्यगर्भलिङ्गशरीरम् महत्तत्त्वम्,अस्मदादिलिङ्गशरीरं चाहङ्कार इत्याख्यायते।", "padacchedaText": "", "audioFile": "PB_000624.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000625", "originalText": "एवं तमोगुणयुक्तेभ्यः पञ्चीकृतभूतेभ्यो भूम्यन्तरिक्षस्वर्महर्जनतपःसत्यात्मकस्योर्ध्वलोकसप्तकस्य अतलवितलसुतलतलातलरसातलमहातलपातालाख्यस्य अधोलोकसप्तकस्य ब्रह्माण्डस्य जरायुजाण्डजस्वेदजोद्भिज्जाख्यचतुर्विधस्थूलशरीराणां चोत्पत्तिः।", "padacchedaText": "", "audioFile": "PB_000625.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000626", "originalText": "तत्र जरायुजानि जरायुभ्यो जातानि मनुष्यपश्वादिशरीराणि।", "padacchedaText": "", "audioFile": "PB_000626.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000627", "originalText": "अण्डजान्यण्डेभ्यो जातानि पक्षिपन्नगादिशरीराणि।", "padacchedaText": "", "audioFile": "PB_000627.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000628", "originalText": "स्वेदजानि स्वेदाज्जातानि यूकमशकादिशरीराणि।", "padacchedaText": "", "audioFile": "PB_000628.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000629", "originalText": "उद्भिज्जानि भूमिमुद्भिद्य जातानि वृक्षादीनि।", "padacchedaText": "", "audioFile": "PB_000629.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000630", "originalText": "वृक्षादीनामपि पापफलभोगायतनत्वेन शरीरत्वम्।", "padacchedaText": "", "audioFile": "PB_000630.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000631", "originalText": "तत्र परमेश्वरस्य पञ्चतन्मात्राद्युत्पत्तौ सप्तदशावयवोपेतलिङ्गशरीरोत्पत्तौ हिरण्यगर्भस्थूलशरीरोत्पत्तौ च साक्षात् कर्तृत्वम् इतरनिखिलप्रपञ्चोत्पत्तौ च हिरण्यगर्भादिद्वारा, \" हन्ताहमिमास्तिस्रो देवता अनेन जीवेनात्मनानुप्रविश्य नामरूपे व्याकरवाणि\"(छा.उ. ६.३.२.) इति श्रुतेः।", "padacchedaText": "", "audioFile": "PB_000631.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000632", "originalText": "हिरण्यगर्भो नाम मूर्तित्रयादन्यः प्रथमो जीवः।", "padacchedaText": "", "audioFile": "PB_000632.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000633", "originalText": "\" स वै शरीरी प्रथमः स वै पुरुष उच्यते। आदिकर्ता स भूतानां ब्रह्माग्रे समवर्तत॥", "padacchedaText": "", "audioFile": "PB_000633.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000634", "originalText": "\", \" हिरण्यगर्भः समवर्तताग्रे\"(ऋ.सं. १०.१२१.१.) इत्यादिश्रुतेः।", "padacchedaText": "", "audioFile": "PB_000634.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000635", "originalText": "एवं भूतभौतिकसृष्टिर्निरूपिता।", "padacchedaText": "", "audioFile": "PB_000635.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000636", "originalText": "इदानीं प्रलयो निरूप्यते।", "padacchedaText": "", "audioFile": "PB_000636.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000637", "originalText": "प्रलयो नाम त्रैलोक्यविनाशः।", "padacchedaText": "", "audioFile": "PB_000637.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000638", "originalText": "स च चतुर्विधः नित्यः प्राकृतो नैमित्तिक आत्यन्तिकश्चेति।", "padacchedaText": "", "audioFile": "PB_000638.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000639", "originalText": "तत्र नित्यः प्रलयः सुषुप्तिः, तस्याः सकलकार्यप्रलयरूपत्वात्।", "padacchedaText": "", "audioFile": "PB_000639.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000640", "originalText": "धर्माधर्मपूर्वसंस्काराणां च तदा कारणात्मनाऽवस्थानम्।", "padacchedaText": "", "audioFile": "PB_000640.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000641", "originalText": "तेन सुप्तोत्थितस्य न सुखदुःखाद्यनुपपत्तिः, न वा स्मरणानुपपत्तिः।", "padacchedaText": "", "audioFile": "PB_000641.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000642", "originalText": "न च सुषुप्तौ अन्तःकरणस्य विनाशे तदधीनप्राणादिक्रियानुपपत्तिः, वस्तुतः श्वासाद्यभावेऽपि तदुपलब्धेः पुरुषान्तरविभ्रममात्रत्वात्, सुप्तशरीरोपलम्भवत्।", "padacchedaText": "", "audioFile": "PB_000642.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000643", "originalText": "न च एवं सुप्तस्य परेतादविशेषः, सुप्तस्य हि लिङ्गशरीरं संस्कारात्मनाऽत्रैव वर्तते परेतस्य तु लोकान्तरे इति वैलक्षण्यात्।", "padacchedaText": "", "audioFile": "PB_000643.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000644", "originalText": "यद्वा अन्तःकरणस्य द्वे शक्ती ज्ञानशक्तिः क्रियाशक्तिश्चेति।", "padacchedaText": "", "audioFile": "PB_000644.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000645", "originalText": "तत्र ज्ञानशक्तिविशिष्टान्तःकरणस्य सुषुप्तौ विनाशः, न तु क्रियाशक्तिविशिष्टस्य इति प्राणद्यवस्थानमविरुद्धम्।", "padacchedaText": "", "audioFile": "PB_000645.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000646", "originalText": "\" यदा सुप्तः स्वप्नं न कञ्चन पश्यति अथास्मिन् प्राण एवैकधा भवति अथैनं वाक् सर्वैर्नामभिः सहाप्येति\"(कौ.उ. ३.३.), \" सता सोम्य तदा सम्पन्नो भवति स्वमपीतो भवति\"(छा.उ. ६.८.१.) इत्यादिश्रुतिरुक्तसुषुप्तौ मानम्।", "padacchedaText": "", "audioFile": "PB_000646.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000647", "originalText": "प्राकृतप्रलयस्तु कार्यब्रह्मविनाशनिमित्तकः सकलकार्यविनाशः।", "padacchedaText": "", "audioFile": "PB_000647.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000648", "originalText": "यदा तु प्रागेवोत्पन्नब्रह्मसाक्षात्कारस्य कार्यब्रह्मणो ब्रह्माण्डाधिकारलक्षणप्रारब्धकर्मसमाप्तौ विदेहकैवल्यात्मिका परा मुक्तिः, तदा तल्लोकवासिनामप्युत्पन्नब्रह्मसाक्षात्काराणां ब्रह्मणा सह विदेहकैवल्यम्।", "padacchedaText": "", "audioFile": "PB_000648.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000649", "originalText": "\" ब्रह्मणा सह ते सर्वे सम्प्राप्ते प्रतिसञ्चरे। परस्यान्ते कृतात्मानः प्रविशन्ति परं पदम्॥", "padacchedaText": "", "audioFile": "PB_000649.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000650", "originalText": "\" इति स्मृतेः।", "padacchedaText": "", "audioFile": "PB_000650.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000651", "originalText": "एवं तल्लोकवासिभिः सह कार्यब्रह्मणि मुच्यमाने, तदधिष्ठितब्रह्माण्ड—तदन्तर्वर्तिनिखिललोक—तदन्तर्वर्तिस्थावरादीनां भौतिकानां भूतानां च प्रकृतौ मायायां लयः, न तु ब्रह्मणि, बाधरूपविनाशस्यैव ब्रह्मनिष्ठत्वात्।", "padacchedaText": "", "audioFile": "PB_000651.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000652", "originalText": "अतः प्राकृत इत्युच्यते।", "padacchedaText": "", "audioFile": "PB_000652.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000653", "originalText": "कार्यब्रह्मणो दिवसावसाननिमित्तकः त्रैलोक्यमात्रप्रलयः नैमित्तिकप्रलयः।", "padacchedaText": "", "audioFile": "PB_000653.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000654", "originalText": "ब्रह्मदिवसश्चतुर्युगसहस्रपरिमितकालः, \" चतुर्युगसहस्राणि ब्रह्मणो दिनमुच्यते\" इत्यादिवचनात्।", "padacchedaText": "", "audioFile": "PB_000654.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000655", "originalText": "प्रलयकालोऽपि दिवसकालपरिमितः, रात्रिकालस्य दिवसकालतुल्यत्वात्।", "padacchedaText": "", "audioFile": "PB_000655.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000656", "originalText": "प्राकृतप्रलये नैमित्तिकप्रलये च पुराणवचनानि प्रमाणानि।", "padacchedaText": "", "audioFile": "PB_000656.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000657", "originalText": "\" द्विपरार्धे त्वतिक्रान्ते ब्रह्मणः परमेष्ठिनः। तदा प्रकृतयः सप्त कल्प्यन्ते प्रलयाय हि॥", "padacchedaText": "", "audioFile": "PB_000657.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000658", "originalText": "एष प्राकृतिको राजन् प्रलयो यत्र लीयते।", "padacchedaText": "", "audioFile": "PB_000658.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000659", "originalText": "\" इति वचनं प्राकृतप्रलये मानम्।", "padacchedaText": "", "audioFile": "PB_000659.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000660", "originalText": "\" एष नैमित्तिकः प्रोक्तः प्रलयो यत्र विश्वसृक्।", "padacchedaText": "", "audioFile": "PB_000660.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000661", "originalText": "शेतेऽनन्तासने नित्यमात्मसात्कृत्य चाखिलम्।", "padacchedaText": "", "audioFile": "PB_000661.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000662", "originalText": "\" इति वचनं नैमित्तिके प्रलये मानम्।", "padacchedaText": "", "audioFile": "PB_000662.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000663", "originalText": "तुरीयप्रलयस्तु ब्रह्मसाक्षात्कारनिमित्तकः सर्वमोक्षः।", "padacchedaText": "", "audioFile": "PB_000663.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000664", "originalText": "स चैकजीववादे युगपदेव, नानाजीववादे तु क्रमेण।", "padacchedaText": "", "audioFile": "PB_000664.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000665", "originalText": "\" सर्व एकीभवन्ति\"(मु.उ. ३.२.७.) इत्यादिश्रुतेः।", "padacchedaText": "", "audioFile": "PB_000665.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000666", "originalText": "तत्राद्यास्त्रयोऽपि लयाः कर्मोपरमनिमित्ताः तुरीयस्तु ज्ञानोदयनिमित्तो लयोऽज्ञानेन सहैवेति विशेषः।", "padacchedaText": "", "audioFile": "PB_000666.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000667", "originalText": "एवं चतुर्विधप्रलयो निरूपितः।", "padacchedaText": "", "audioFile": "PB_000667.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000668", "originalText": "तस्येदानीं क्रमो निरूप्यते।", "padacchedaText": "", "audioFile": "PB_000668.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000669", "originalText": "भूतानां भौतिकानां च न कारणलयक्रमेण लयः कारणलयसमये कार्याणामाश्रयमन्तरेणावस्थानानुपपत्तेः, किन्तु सृष्टिक्रमविपरीतक्रमेण।", "padacchedaText": "", "audioFile": "PB_000669.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000670", "originalText": "तत्तत्कार्यनाशे तत्तज्जनकादृष्टनाशस्यैव प्रयोजकतया उपादाननाशस्याप्रयोजकत्वात्।", "padacchedaText": "", "audioFile": "PB_000670.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000671", "originalText": "अन्यथा न्यायमतेऽपि महाप्रलये पृथिवीपरमाणुगतरूपरसादेरविनाशापत्तेः।", "padacchedaText": "", "audioFile": "PB_000671.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000672", "originalText": "तथा च पृथिव्या अप्सु, अपां तेजसि, तेजसो वायौ, वायोराकाशे, आकाशस्य जीवाहङ्कारे, तस्य हिरण्यगर्भाहङ्कारे, तस्य चाविद्यायाम् इत्येवंरूप एव प्रलयः।", "padacchedaText": "", "audioFile": "PB_000672.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000673", "originalText": "तदुक्तं विष्णुपुराणे \" जगत्प्रतिष्ठा देवर्षे पृथिव्यप्सु प्रलीयते। तेजस्यापः प्रलीयन्ते तेजो वायौ प्रलीयते॥", "padacchedaText": "", "audioFile": "PB_000673.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000674", "originalText": "वायुश्च लीयते व्योम्नि तच्चाव्यक्ते प्रलीयते।", "padacchedaText": "", "audioFile": "PB_000674.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000675", "originalText": "अव्यक्तं पुरुषे ब्रह्मन्निष्कले सम्प्रलीयते\" इति।", "padacchedaText": "", "audioFile": "PB_000675.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000676", "originalText": "एवंविधप्रलयकारणत्वं तत्—पदार्थस्य ब्रह्मणस्तटस्थलक्षणम्।", "padacchedaText": "", "audioFile": "PB_000676.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000677", "originalText": "ननु वेदान्तैर्ब्रह्मणि जगत्कारणत्वेन प्रतिपाद्यमाने सति सप्रपञ्चं स्यात्, अन्यथा सृष्टिवाक्यानामप्रामाण्यापत्तिरिति चेत् न।", "padacchedaText": "", "audioFile": "PB_000677.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000678", "originalText": "न हि सृष्टिवाक्यानां सृष्टौ तात्पर्यम्।", "padacchedaText": "", "audioFile": "PB_000678.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000679", "originalText": "किन्तु अद्वये ब्रह्मण्येव।", "padacchedaText": "", "audioFile": "PB_000679.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000680", "originalText": "तत्प्रतिपत्तौ कथं सृष्टेरुपयोगः? इत्थम्— यदि सृष्टिमनुपन्यस्य प्रपञ्चस्य निषेधो ब्रह्मणि प्रतिपाद्येत, तदा ब्रह्मणि प्रतिषिद्धस्य प्रपञ्चस्य वायौ प्रतिषिद्धस्य रूपस्येव ब्रह्मणोऽन्यत्रावस्थानशङ्कायां न निर्विचिकित्समद्वितीयत्वं प्रतिपादितं स्यात्।", "padacchedaText": "", "audioFile": "PB_000680.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000681", "originalText": "ततः सृष्टिवाक्याद्ब्रह्मोपादेयत्वज्ञाने सति, उपादानं विना कार्यस्यान्यत्र सद्भावशङ्कायां निरस्तायां, \" नेति नेति\"(बृ.उ. २.३.६.) इत्यादिना ब्रह्मण्यपि तस्यासत्त्वोपपादनेन प्रपञ्चस्य तुच्छत्वावगमे, निरस्तनिखिलद्वैतविभ्रममखण्डं सच्चिदानन्दैकरसं ब्रह्म सिद्ध्यतीति परम्परया सृष्टिवाक्यानामपि अद्वितीये ब्रह्मण्येव तात्पर्यम्।", "padacchedaText": "", "audioFile": "PB_000681.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000682", "originalText": "उपासनाप्रकरणपठितसगुणब्रह्मवाक्यानां च उपासनाविध्यपेक्षितगुणारोपमात्रपरत्वम्, न गुणपरत्वम्।", "padacchedaText": "", "audioFile": "PB_000682.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000683", "originalText": "निर्गुणप्रकरणपठितानां सगुणवाक्यानान्तु निषेधवाक्यापेक्षितनिषेध्यसमर्पकत्वेन विनियोग इति न किञ्चिदपि वाक्यमद्वितीयब्रह्मप्रतिपादनेन विरुध्यते।", "padacchedaText": "", "audioFile": "PB_000683.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000684", "originalText": "तदेवं स्वरूपतटस्थलक्षणलक्षितं।", "padacchedaText": "", "audioFile": "PB_000684.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000685", "originalText": "तत्—पदवाच्यमीश्वरचैतन्यं मायाप्रतिबिम्बरूपमिति केचित्।", "padacchedaText": "", "audioFile": "PB_000685.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000686", "originalText": "तेषामयमाशयः— जीवपरमेश्वरसाधारणं चैतन्यमात्रं बिम्बम्, तस्यैव बिम्बस्याविद्यात्मिकायां मायायां प्रतिबिम्बमीश्वरचैतन्यम्, अन्तःकरणेषु प्रतिबिम्बं जीवचैतन्यम् \" कार्योपाधिरयं जीवः कारणोपधिरीश्वरः\" इति श्रुतेः।", "padacchedaText": "", "audioFile": "PB_000686.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000687", "originalText": "एतन्मते जलाशयगतशरावजलगतसूर्यप्रतिबिम्बयोरिव जीवपरमेश्वरयोर्भेदः।", "padacchedaText": "", "audioFile": "PB_000687.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000688", "originalText": "अविद्यात्मकोपाधेर्व्यापकतया तदुपाधिकेश्वरस्यापि व्यापकत्वम्।", "padacchedaText": "", "audioFile": "PB_000688.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000689", "originalText": "अन्तःकरणस्य परिच्छिन्नतया तदुपाधिकजीवस्यापि परिच्छिन्नत्वम्।", "padacchedaText": "", "audioFile": "PB_000689.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000690", "originalText": "एतन्मतेऽविद्याकृतदोषा जीव इव परमेश्वरेऽपि स्युः, उपाधेः प्रतिबिम्बपक्षपातित्वात्, इत्यस्वरसात् बिम्बात्मकमीश्वरचैतन्यमित्यपरे।", "padacchedaText": "", "audioFile": "PB_000690.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000691", "originalText": "तेषामयमाशयः— एकमेव चैतन्यं बिम्बत्वाक्रान्तमीश्वरचैतन्यम्।", "padacchedaText": "", "audioFile": "PB_000691.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000692", "originalText": "प्रतिबिम्बत्वाक्रान्तं जीवचैतन्यम्।", "padacchedaText": "", "audioFile": "PB_000692.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000693", "originalText": "बिम्बप्रतिबिम्बकल्पनोपाधिश्चैकजीववादे अविद्या, अनेकजीववादे तु अन्तःकरणान्येव।", "padacchedaText": "", "audioFile": "PB_000693.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000694", "originalText": "अविद्यान्तःकरणरूपोपाधिप्रयुक्तो जीवपरभेदः।", "padacchedaText": "", "audioFile": "PB_000694.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000695", "originalText": "उपाधिकृतदोषाश्च प्रतिबिम्बे जीव एव वर्तन्ते, न तु बिम्बे परमेश्वरे, उपाधेः प्रतिबिम्बपक्षपातित्वात्।", "padacchedaText": "", "audioFile": "PB_000695.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000696", "originalText": "एतन्मते च गगनसूर्यस्य जलादौ भासमानप्रतिबिम्बसूर्यस्येव जीवपरयोर्भेदः।", "padacchedaText": "", "audioFile": "PB_000696.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000697", "originalText": "ननु ग्रीवास्थमुखस्य दर्पणप्रदेश इव बिम्बचैतन्यस्य परमेश्वरस्य जीवप्रदेशेऽभावात् तस्य सर्वान्तर्यामित्वं न स्यादिति चेत् न।", "padacchedaText": "", "audioFile": "PB_000697.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000698", "originalText": "साभ्रनक्षत्रस्याकाशस्य जलादौ प्रतिबिम्बितत्वे बिम्बभूतमहाकाशस्यापि जलादिप्रदेशसम्बन्धदर्शनेन परिच्छिन्नबिम्बस्य प्रतिबिम्बदेशासम्बन्धित्वेऽप्यपरिच्छिन्नब्रह्मबिम्बस्य प्रतिबिम्बदेशसम्बन्धाविरोधात्।", "padacchedaText": "", "audioFile": "PB_000698.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000699", "originalText": "न च रूपहीनस्य ब्रह्मणो न प्रतिबिम्बसम्भवः, रूपवत एव तथात्वदर्शनात् इति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_000699.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000700", "originalText": "नीरूपस्यापि रूपस्य प्रतिबिम्बदर्शनात्।", "padacchedaText": "", "audioFile": "PB_000700.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000701", "originalText": "न च नीरूपस्य द्रव्यस्य प्रतिबिम्बाभावनियमः।", "padacchedaText": "", "audioFile": "PB_000701.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000702", "originalText": "आत्मनो द्रव्यत्वाभावस्य उक्तत्वात्।", "padacchedaText": "", "audioFile": "PB_000702.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000703", "originalText": "\" एकधा बहुधा चैव दृश्यते जलचन्द्रवत्।", "padacchedaText": "", "audioFile": "PB_000703.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000704", "originalText": "\", \" यथा ह्ययं ज्योतिरात्मा विवस्वानपो भिन्ना बहुधैकोऽनुगच्छन्।", "padacchedaText": "", "audioFile": "PB_000704.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000705", "originalText": "\" इत्यादिवाक्येन ब्रह्मप्रतिबिम्बाभावानुमानस्य बाधितत्वाच्च।", "padacchedaText": "", "audioFile": "PB_000705.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000706", "originalText": "तदेवं तत्—पदार्थो निरूपितः।", "padacchedaText": "", "audioFile": "PB_000706.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000707", "originalText": "इदानीं त्वम्—पदार्थो निरूप्यते।", "padacchedaText": "", "audioFile": "PB_000707.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000708", "originalText": "एकजीववादेऽविद्याप्रतिबिम्बो जीवः।", "padacchedaText": "", "audioFile": "PB_000708.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000709", "originalText": "अनेकजीववादे तु अन्तःकरणप्रतिबिम्बः।", "padacchedaText": "", "audioFile": "PB_000709.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000710", "originalText": "स च जाग्रत्स्वप्नसुषुप्तिरूपावस्थात्रयवान्।", "padacchedaText": "", "audioFile": "PB_000710.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000711", "originalText": "तत्र जाग्रद्दशा नाम इन्द्रियजन्यज्ञानावस्था।", "padacchedaText": "", "audioFile": "PB_000711.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000712", "originalText": "अवस्थान्तरे इन्द्रियाभावात् नातिव्याप्तिः।", "padacchedaText": "", "audioFile": "PB_000712.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000713", "originalText": "इन्द्रियजन्यज्ञानं च अन्तःकरणवृत्तिः, स्वरूपज्ञानस्यानादित्वात्।", "padacchedaText": "", "audioFile": "PB_000713.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000714", "originalText": "सा चान्तःकरणवृत्तिरावरणाभिभवार्था इत्येकं मतम्।", "padacchedaText": "", "audioFile": "PB_000714.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000715", "originalText": "तथा हि— अविद्योपहितचैतन्यस्य जीवत्वपक्षे घटाद्यधिष्ठानचैतन्यस्य जीवरूपतया, जीवस्य सर्वदा घटादिभानप्रसक्तौ घटाद्यवच्छिन्नचैतन्यावरकमज्ञानं मूलाविद्यापरतन्त्रमवस्थापदवाच्यमभ्युपगन्तव्यम्।", "padacchedaText": "", "audioFile": "PB_000715.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000716", "originalText": "एवं सति न सर्वदा घटादेर्भानप्रसङ्गः।", "padacchedaText": "", "audioFile": "PB_000716.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000717", "originalText": "अनावृतचैतन्यसम्बन्धस्यैव भानप्रयोजकत्वात्।", "padacchedaText": "", "audioFile": "PB_000717.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000718", "originalText": "तस्य चावरणस्य सदातनत्वे कदाचिदपि घटभानं न स्यादिति तद्भङ्गे वक्तव्ये, तद्भङ्गजनकं न चैतन्यमात्रम्।", "padacchedaText": "", "audioFile": "PB_000718.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000719", "originalText": "तद्भासकस्य तदनिवर्तकत्वात्।", "padacchedaText": "", "audioFile": "PB_000719.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000720", "originalText": "नापि वृत्त्युपहितं चैतन्यम्।", "padacchedaText": "", "audioFile": "PB_000720.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000721", "originalText": "परोक्षस्थलेऽपि तन्निवृत्त्यापत्तेरिति परोक्षव्यावृत्तवृत्तिविशेषस्य, तदुपहितचैतन्यस्य वा आवरणभञ्जकत्वम्— इति आवरणाभिभवार्था वृत्तिरुच्यते।", "padacchedaText": "", "audioFile": "PB_000721.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000722", "originalText": "सम्बन्धार्था वृत्तिरित्यपरं मतम्।", "padacchedaText": "", "audioFile": "PB_000722.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000723", "originalText": "तत्राविद्योपाधिकोऽपरिच्छिन्नो जीवः।", "padacchedaText": "", "audioFile": "PB_000723.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000724", "originalText": "स च घटादिप्रदेशे विद्यमानोऽपि घटाद्याकारापरोक्षवृत्तिविरहदशायां न घटादिकमवभासयति, घटादिना समं सम्बन्धाभावात्।", "padacchedaText": "", "audioFile": "PB_000724.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000725", "originalText": "तत्तदाकारवृत्तिदशायां तु भासयति, तदा सम्बन्धसत्त्वात्।", "padacchedaText": "", "audioFile": "PB_000725.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000726", "originalText": "ननु अविद्योपाधिकस्यापरिच्छिन्नस्य जीवस्य स्वत एव समस्तवस्तुसम्बद्धस्य वृत्तिविरहदशायां सम्बन्धाभावाभिधानमसङ्गतम्।", "padacchedaText": "", "audioFile": "PB_000726.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000727", "originalText": "असङ्गत्वदृष्ट्या सम्बन्धाभावाभिधाने च वृत्त्यनन्तरमपि सम्बन्धो न स्यात्, इति चेत्।", "padacchedaText": "", "audioFile": "PB_000727.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000728", "originalText": "उच्यते— न हि वृत्तिविरहदशायां जीवस्य घटादिना सह सम्बन्धसामान्यं निषेधामः।", "padacchedaText": "", "audioFile": "PB_000728.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000729", "originalText": "किन्तर्हि? घटादिभानप्रयोजकं सम्बन्धविशेषम्।", "padacchedaText": "", "audioFile": "PB_000729.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000730", "originalText": "स च सम्बन्धविशेषो विषयस्य जीवचैतन्यस्य च व्यङ्ग्य—व्यञ्जकतालक्षणः कादाचित्कस्तत्तदाकारवृत्तिनिबन्धनः।", "padacchedaText": "", "audioFile": "PB_000730.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000731", "originalText": "तथा हि तैजसमन्तःकरणं स्वच्छद्रव्यत्वात् स्वत एव जीवचैतन्याभिव्यञ्जनसमर्थम्।", "padacchedaText": "", "audioFile": "PB_000731.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000732", "originalText": "घटादिकस्तु न तथा, अस्वच्छद्रव्यत्वात्।", "padacchedaText": "", "audioFile": "PB_000732.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000733", "originalText": "स्वाकारवृत्तिसंयोगदशायान्तु वृत्त्यभिभूतजाड्यधर्मकतया वृत्त्युत्पादितचैतन्याभिव्यञ्जनयोग्यताश्रयतया च वृत्त्युदयानन्तरं चैतन्यमभिव्यनक्ति।", "padacchedaText": "", "audioFile": "PB_000733.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000734", "originalText": "तदुक्तं विवरणे \" अन्तःकरणं हि स्वस्मिन्निव स्वसंसर्गिण्यपि घटादौ चैतन्याभिव्यक्तियोग्यतामापादयति\" इति।", "padacchedaText": "", "audioFile": "PB_000734.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000735", "originalText": "दृष्टं चास्वच्छद्रव्यस्यापि स्वच्छद्रव्यसम्बन्धदशायां प्रतिबिम्बग्राहित्वम्।", "padacchedaText": "", "audioFile": "PB_000735.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000736", "originalText": "तथा कुड्यादेर्जलादिसंयोगदशायां मुखादिप्रतिबिम्बग्राहिता।", "padacchedaText": "", "audioFile": "PB_000736.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000737", "originalText": "घटादेरभिव्यञ्जकत्वं च तत्प्रतिबिम्बग्राहित्वम्, चैतन्यस्याभिव्यक्तत्वं च तत्र प्रतिबिम्बितत्वम्।", "padacchedaText": "", "audioFile": "PB_000737.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000738", "originalText": "एवंविधाभिव्यञ्जकत्वसिद्ध्यर्थमेव वृत्तेरपरोक्षस्थले बहिर्निर्गमनाङ्गीकारः।", "padacchedaText": "", "audioFile": "PB_000738.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000739", "originalText": "परोक्षस्थले तु वह्न्यादेर्वृत्तिसंसर्गाभावेन चैतन्यानभिव्यञ्जकतया नापरोक्षत्वम्।", "padacchedaText": "", "audioFile": "PB_000739.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000740", "originalText": "एतन्मते च विषयाणामपरोक्षत्वं चैतन्याभिव्यञ्जकत्वमिति द्रष्टव्यम्।", "padacchedaText": "", "audioFile": "PB_000740.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000741", "originalText": "एवं जीवस्यापरिच्छिन्नत्वेऽपि वृत्तेः सम्बन्धार्थत्वं निरूपितम्।", "padacchedaText": "", "audioFile": "PB_000741.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000742", "originalText": "इदानीं परिच्छिन्नत्वपक्षे सम्बधार्थत्वं निरूप्यते।", "padacchedaText": "", "audioFile": "PB_000742.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000743", "originalText": "तथा हि अन्तःकरणोपाधिको जीवः।", "padacchedaText": "", "audioFile": "PB_000743.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000744", "originalText": "तस्य न घटाद्युपादानता, घटादिदेशासम्बन्धात्।", "padacchedaText": "", "audioFile": "PB_000744.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000745", "originalText": "किन्तु ब्रह्मैव घटाद्युपादानम्, तस्य मायोपहितस्य सकलघटाद्यन्वयित्वात्।", "padacchedaText": "", "audioFile": "PB_000745.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000746", "originalText": "अत एव ब्रह्मणः सर्वज्ञता।", "padacchedaText": "", "audioFile": "PB_000746.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000747", "originalText": "तथा च जीवस्य घटाद्यधिष्ठानब्रह्मचैतन्याभेदमन्तरेण घटाद्यवभासासम्भवे प्राप्ते, तदवभासाय घटाद्यधिष्ठानब्रह्मचैतन्याभेदसिद्ध्यर्थं घटाद्याकारवृत्तिरिष्यते।", "padacchedaText": "", "audioFile": "PB_000747.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000748", "originalText": "ननु वृत्त्यापि कथं प्रमातृचैतन्यविषयचैतन्ययोरभेदः सम्पाद्यते, घटान्तःकरणरूपोपाधिभेदेन तदवच्छिन्नचैतन्ययोरभेदासम्भवात् इति चेत् न।", "padacchedaText": "", "audioFile": "PB_000748.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000749", "originalText": "वृत्तेर्बहिर्देशनिर्गमनाङ्गीकारेण वृत्त्यन्तःकरणविषयाणामेकदेशस्थत्वेन तदुपधेयभेदाभावस्य उक्तत्वात्।", "padacchedaText": "", "audioFile": "PB_000749.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000750", "originalText": "एवमपरोक्षस्थले वृत्तेर्मतभेदेन विनियोग उपपादितः।", "padacchedaText": "", "audioFile": "PB_000750.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000751", "originalText": "इन्द्रियाजन्यविषयगोचरापरोक्षान्तःकरणवृत्त्यवस्था स्वप्नावस्था।", "padacchedaText": "", "audioFile": "PB_000751.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000752", "originalText": "जाग्रदवस्थाव्यावृत्त्यर्थम् इन्द्रियाजन्येति।", "padacchedaText": "", "audioFile": "PB_000752.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000753", "originalText": "अविद्यावृत्तिमत्यां सुषुप्तावतिव्याप्तिवारणाय अन्तःकरणेति।", "padacchedaText": "", "audioFile": "PB_000753.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000754", "originalText": "सुषुप्तिर्नाम अविद्यागोचराविद्यावृत्त्यवस्था।", "padacchedaText": "", "audioFile": "PB_000754.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000755", "originalText": "जाग्रत्स्वप्नयोरविद्याकारवृत्तेरन्तःकरणवृत्तित्वान्न तत्रातिव्याप्तिः।", "padacchedaText": "", "audioFile": "PB_000755.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000756", "originalText": "अत्र केचिन्मरणमूर्च्छयोरवस्थान्तरत्वमाहुः।", "padacchedaText": "", "audioFile": "PB_000756.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000757", "originalText": "अपरे तु सुषुप्तावेव तयोरन्तर्भावमाहुः।", "padacchedaText": "", "audioFile": "PB_000757.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000758", "originalText": "तत्र तयोरवस्थात्रयान्तर्भावबहिर्भावयोः त्वं—पदार्थनिरूपणे उपयोगाभावात् न तत्र प्रयत्यते।", "padacchedaText": "", "audioFile": "PB_000758.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000759", "originalText": "तस्य मायोपाध्यपेक्षया एकत्वम्, अन्तःकरणोपाध्यपेक्षया च नानात्वं व्यवह्रियते।", "padacchedaText": "", "audioFile": "PB_000759.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000760", "originalText": "एतेन जीवस्याणुत्वं प्रत्युक्तम्।", "padacchedaText": "", "audioFile": "PB_000760.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000761", "originalText": "\" बुद्धेर्गुणेनात्मगुणेन चैवं ह्याराग्रमात्रो ह्यवरोऽपि दृष्टः।", "padacchedaText": "", "audioFile": "PB_000761.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000762", "originalText": "\" इत्यादौ जीवस्य बुद्धिशब्दवाच्यान्तःकरणपरिमाणोपाधिकस्य परिमाणत्वश्रवणात्।", "padacchedaText": "", "audioFile": "PB_000762.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000763", "originalText": "स च जीवः स्वयंप्रकाशः।", "padacchedaText": "", "audioFile": "PB_000763.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000764", "originalText": "स्वप्नावस्थामधिकृत्य \" अत्रायं पुरुषः स्वयं ज्योतिः\" इति श्रुतेः।", "padacchedaText": "", "audioFile": "PB_000764.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000765", "originalText": "अनुभवरूपश्च, \" प्रज्ञानघन एव\" इत्यादिश्रुतेः।", "padacchedaText": "", "audioFile": "PB_000765.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000766", "originalText": "\"अनुभवामि\" इति व्यवहारस्तु वृत्तिप्रतिबिम्बितचैतन्यमादाय उपपद्यते।", "padacchedaText": "", "audioFile": "PB_000766.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000767", "originalText": "एवं त्वं—पदार्थो निरूपितः।", "padacchedaText": "", "audioFile": "PB_000767.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000768", "originalText": "अधुना तत्—त्वम्—पदार्थयोरैक्यं महावाक्यप्रतिपाद्यमभिधीयते।", "padacchedaText": "", "audioFile": "PB_000768.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000769", "originalText": "ननु \"नाहमीश्वरः\" इत्यादिप्रत्यक्षेण, किञ्चिज्ज्ञत्वसर्वज्ञत्वादिविरुद्धधर्माश्रयत्वादिलिङ्गेन, \" द्वा सुपर्णा\" इत्यादिश्रुत्या, \" द्वाविमौ पुरुषौ लोके क्षरश्चाक्षर एव च।", "padacchedaText": "", "audioFile": "PB_000769.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000770", "originalText": "क्षरः सर्वाणि भूतानि कूटस्थोऽक्षर उच्यते॥", "padacchedaText": "", "audioFile": "PB_000770.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000771", "originalText": "\" इत्यादिस्मृत्या च जीवपरभेदस्यावगतत्वेन तत्त्वमस्यादिवाक्यम् \" आदित्यो यूपः।", "padacchedaText": "", "audioFile": "PB_000771.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000772", "originalText": "\", \" यजमानः प्रस्तरः\" इत्यादिवाक्यवदुपचरितार्थमेव, इति चेत् न।", "padacchedaText": "", "audioFile": "PB_000772.wav", "zipFile": "VedantaParibhasha.zip"}, {"id": "B_000773", "originalText": "भेदप्रत्यक्षस्य सम्भावित
