        const manifest = [{"id": "B_000000", "originalText": "श्रीसदानन्दयोगीन्द्रसरस्वतीविरचितः\n\nवेदान्तसारः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000000.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000001", "originalText": "अखण्डं सच्चिदानन्दमवाङ्मनसगोचरम्। आत्मानमखिलाधारमाश्रयेऽभीष्टसिद्धये॥ १॥", "padacchedaText": "", "audioFile": "PB_hear2read_000001.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000002", "originalText": "अर्थतोऽप्यद्वयानन्दानतीतद्वैतभानतः। गुरूनाराध्य वेदान्तसारं वक्ष्ये यथामति॥ २॥", "padacchedaText": "", "audioFile": "PB_hear2read_000002.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000003", "originalText": "वेदान्तो नामोपनिषत्प्रमाणं तदुपकारीणि शारीरकसूत्रादीनि च।", "padacchedaText": "", "audioFile": "PB_hear2read_000003.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000004", "originalText": "अस्य वेदान्तप्रकरणत्वात् तदीयैः एव अनुबन्धैः तद्वत्तासिद्धेः न ते पृथगालोचनीयाः। तत्र अनुबन्धो नाम अधिकारिविषयसम्बन्धप्रयोजनानि॥ ३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000004.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000005", "originalText": "अधिकारी तु विधिवदधीतवेदवेदाङ्गत्वेनापाततोऽधिगताखिलवेदार्थोऽस्मिन् जन्मनि जन्मान्तरे वा काम्यनिषिद्धवर्जनपुरःसरं नित्यनैमित्तिकप्रायश्चित्तोपासनानुष्ठानेन निर्गतनिखिलकल्मषतया नितान्तनिर्मलस्वान्तः साधनचतुष्टयसम्पन्नः प्रमाता।", "padacchedaText": "", "audioFile": "PB_hear2read_000005.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000006", "originalText": "काम्यानि— स्वर्गादीष्टसाधनानि ज्योतिष्टोमादीनि।", "padacchedaText": "", "audioFile": "PB_hear2read_000006.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000007", "originalText": "निषिद्धानि— नरकाद्यनिष्टसाधनानि ब्राह्मणहननादीनि।", "padacchedaText": "", "audioFile": "PB_hear2read_000007.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000008", "originalText": "नित्यानि— अकरणे प्रत्यवायसाधनानि सन्ध्यावन्दनादीनि।", "padacchedaText": "", "audioFile": "PB_hear2read_000008.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000009", "originalText": "नैमित्तिकानि— पुत्रजन्माद्यनुबन्धीनि जातेष्ट्यादीनि।", "padacchedaText": "", "audioFile": "PB_hear2read_000009.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000010", "originalText": "प्रायश्चित्तानि— पापक्षयसाधनानि चान्द्रायणादीनि।", "padacchedaText": "", "audioFile": "PB_hear2read_000010.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000011", "originalText": "उपासनानि— सगुणब्रह्मविषयमानसव्यापाररूपाणि शाण्डिल्यविद्यादीनि।", "padacchedaText": "", "audioFile": "PB_hear2read_000011.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000012", "originalText": "एतेषां नित्यादीनां बुद्धिशुद्धिः परं प्रयोजनम्, उपासनानां तु चित्तैकाग्र्यं ‘तमेतमात्मानं वेदानुवचनेन ब्राह्मणा विविदिषन्ति यज्ञेन’ (बृ.उ. ४. ४. २२) इत्यादिश्रुतेः ‘तपसा कल्मषं हन्ति’ (मनु. १२. १०४) इत्यादिस्मृतेश्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000012.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000013", "originalText": "नित्यनैमित्तिकयोः उपासनानां त्ववान्तरफलं पितृलोकसत्यलोकप्राप्तिः ‘कर्मणा पितृलोकः विद्यया देवलोकः’ (बृ. उ. १. ५. १६) इत्यादिश्रुतेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000013.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000014", "originalText": "साधनानि— नित्यानित्यवस्तुविवेकेहामुत्रार्थफलभोगविरागशमादिषट्कसम्पत्तिमुमुक्षुत्वानि।", "padacchedaText": "", "audioFile": "PB_hear2read_000014.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000015", "originalText": "नित्यानित्यवस्तुविवेकस्तावद् ब्रह्मैव नित्यं वस्तु ततोऽन्यदखिलमनित्यमिति विवेचनम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000015.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000016", "originalText": "ऐहिकानां स्रक्चन्दनवनितादिविषयभोगानां कर्मजन्यतयानित्यत्ववदामुष्मिकाणामप्यमृतादिविषयभोगानामनित्यतया तेभ्यो नितरां विरतिः— इहामुत्रार्थफलभोगविरागः।", "padacchedaText": "", "audioFile": "PB_hear2read_000016.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000017", "originalText": "शमादयस्तु— शमदमोपरतितितिक्षासमाधानश्रद्धाख्याः।", "padacchedaText": "", "audioFile": "PB_hear2read_000017.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000018", "originalText": "शमस्तावत्— श्रवणादिव्यतिरिक्तविषयेभ्यो मनसो निग्रहः।", "padacchedaText": "", "audioFile": "PB_hear2read_000018.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000019", "originalText": "दमः— बाह्येन्द्रियाणां तद्व्यतिरिक्तविषयेभ्यो निवर्तनम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000019.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000020", "originalText": "निवर्तितानामेतेषां तद्व्यतिरिक्तविषयेभ्य उपरमणमुपरतिरथवा विहितानां कर्मणां विधिना परित्यागः।", "padacchedaText": "", "audioFile": "PB_hear2read_000020.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000021", "originalText": "तितिक्षा— शीतोष्णादिद्वन्द्वसहिष्णुता।", "padacchedaText": "", "audioFile": "PB_hear2read_000021.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000022", "originalText": "निगृहीतस्य मनसः श्रवणादौ तदनुगुणविषये च समाधिः— समाधानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000022.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000023", "originalText": "गुरूपदिष्टवेदान्तवाक्येषु विश्वासः— श्रद्धा।", "padacchedaText": "", "audioFile": "PB_hear2read_000023.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000024", "originalText": "मुमुक्षुत्वम्— मोक्षेच्छा।", "padacchedaText": "", "audioFile": "PB_hear2read_000024.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000025", "originalText": "एवम्भूतः प्रमाताधिकारी ‘शान्तो दान्तः’ (बृ. उ. ४. ४. २३) इत्यादिश्रुतेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000025.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000026", "originalText": "उक्तञ्च—\n‘प्रशान्तचित्ताय जितेन्द्रियाय च प्रहीणदोषाय यथोक्तकारिणे। गुणान्वितायानुगताय सर्वदा प्रदेयमेतत् सततं मुमुक्षवे’ (उपदेशसाहस्री ३२४. १६. ७२) इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000026.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000027", "originalText": "विषयः— जीवब्रह्मैक्यम्, शुद्धचैतन्यं प्रमेयम्, तत्र एव वेदान्तानां तात्पर्यात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000027.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000028", "originalText": "सम्बन्धस्तु— तदैक्यप्रमेयस्य तत्प्रतिपादकोपनिषत्प्रमाणस्य च बोध्यबोधकभावः।", "padacchedaText": "", "audioFile": "PB_hear2read_000028.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000029", "originalText": "प्रयोजनं तु— तदैक्यप्रमेयगताज्ञाननिवृत्तिः स्वस्वरूपानन्दावाप्तिश्च ‘तरति शोकम् आत्मवित्’ (छां. उ. ७. १. ३) इत्यादिश्रुतेः, ‘ब्रह्मविद् ब्रह्मैव भवति’ (मुं. उ. ३. २. ९) इत्यादिश्रुतेश्च॥ ४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000029.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000030", "originalText": "अयमधिकारी जननमरणादिसंसारानलसन्तप्तो दीप्तशिरा जलराशिमिवोपहारपाणिः श्रोत्रियं ब्रह्मनिष्ठं गुरुमुपसृत्य तमनुसरति ‘तद्विज्ञानार्थं स गुरुमेवाभिगच्छेत् समित्पाणिः श्रोत्रियं ब्रह्मनिष्ठम्’ (मुं. उ. १. २. १२) इत्यादिश्रुतेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000030.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000031", "originalText": "स गुरुः परमकृपयाध्यारोपापवादन्यायेनैनमुपदिशति—\n‘तस्मै स विद्वानुपसन्नया सम्यक् प्रशान्तचित्ताय शमान्विताय। येनाक्षरं पुरुषं वेद सत्यं प्रोवाच तां तत्त्वतो ब्रह्मविद्याम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_000031.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000032", "originalText": "’ (मुं. उ. १. २. १३) इत्यादिश्रुतेः॥ ५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000032.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000033", "originalText": "असर्पभूतायां रज्जौ सर्पारोपवत् वस्तुनि अवस्त्वारोपः— अध्यारोपः।", "padacchedaText": "", "audioFile": "PB_hear2read_000033.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000034", "originalText": "वस्तु— सच्चिदानन्दमद्वयं ब्रह्म अज्ञानादिसकलजडसमूहोऽवस्तु।", "padacchedaText": "", "audioFile": "PB_hear2read_000034.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000035", "originalText": "अज्ञानं तु— सदसद्भ्यामनिर्वचनीयं त्रिगुणात्मकं ज्ञानविरोधि भावरूपं यत्किञ्चिदिति वदन्त्यहमज्ञ इत्याद्यनुभवात् ‘देवात्मशक्तिं स्वगुणैर्निगूढाम्’ (श्वे. उ. १. ३) इत्यादिश्रुतेश्च॥ ६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000035.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000036", "originalText": "इदमज्ञानं समष्टिव्यष्ट्यभिप्रायेणैकमनेकमिति च व्यवह्रियते।", "padacchedaText": "", "audioFile": "PB_hear2read_000036.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000037", "originalText": "तथाहि यथा वृक्षाणां समष्ट्यभिप्रायेण वनमित्येकत्वव्यपदेशो यथा वा जलानां समष्ट्यभिप्रायेण जलाशय इति तथा नानात्वेन प्रतिभासमानानां जीवगताज्ञानानां समष्ट्यभिप्रायेण तदेकत्वव्यपदेशः, ‘अजामेकाम्’ (श्वे. उ. ४. ५) इत्यादिश्रुतेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000037.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000038", "originalText": "इयं समष्टिरुत्कृष्टोपाधितया विशुद्धसत्त्वप्रधाना।", "padacchedaText": "", "audioFile": "PB_hear2read_000038.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000039", "originalText": "एतदुपहितं चैतन्यं सर्वज्ञत्वसर्वेश्वरत्वसर्वनियन्तृत्वादिगुणकमव्यक्तमन्तर्यामी जगत्कारणमीश्वर इति च व्यपदिश्यते सकलाज्ञानावभासकत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000039.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000040", "originalText": "‘यः सर्वज्ञः सर्ववित्’ (मुं. उ. १. १. ९) इति श्रुतेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000040.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000041", "originalText": "ईश्वरस्येयं समष्टिरखिलकारणत्वात्कारणशरीरमानन्दप्रचुरत्वात्कोशवदाच्छादकत्वाच्चानन्दमयकोशः सर्वोपरमत्वात्सुषुप्तिरत एव स्थूलसूक्ष्मप्रपञ्चलयस्थानमिति च उच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000041.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000042", "originalText": "यथा वनस्य व्यष्ट्यभिप्रायेण वृक्षा इत्यनेकत्वव्यपदेशो यथा वा जलाशयस्य व्यष्ट्यभिप्रायेण जलानीति तथाज्ञानस्य व्यष्ट्यभिप्रायेण तदनेकत्वव्यपदेशः ‘इन्द्रो मायाभिः पुरुरूप ईयते’ (ऋग्वेद ६. ४७. १८) इत्यादिश्रुतेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000042.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000043", "originalText": "अत्र व्यस्तसमस्तव्यापित्वेन व्यष्टिसमष्टिताव्यपदेशः।", "padacchedaText": "", "audioFile": "PB_hear2read_000043.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000044", "originalText": "इयं व्यष्टिर्निकृष्टोपाधितया मलिनसत्त्वप्रधाना।", "padacchedaText": "", "audioFile": "PB_hear2read_000044.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000045", "originalText": "एतदुपहितं चैतन्यमल्पज्ञत्वानीश्वरत्वादिगुणकं प्राज्ञ इत्युच्यत एकाज्ञानावभासकत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000045.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000046", "originalText": "अस्य प्राज्ञत्वमस्पष्टोपाधितयाऽनतिप्रकाशकत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000046.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000047", "originalText": "अस्यापीयमहङ्कारादिकारणत्वात्कारणशरीरमानन्दप्रचुरत्वात्कोशवदाच्छादकत्वाच्चानन्दमयकोशः सर्वोपरमत्वात्सुषुप्तिरत एव स्थूलसूक्ष्मशरीरप्रपञ्चलयस्थानमिति च उच्यते॥ ७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000047.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000048", "originalText": "एतेषां स्थूलसूक्ष्मकारणप्रपञ्चानामपि समष्टिरेको महान् प्रपञ्चो भवति यथा अवान्तरवनानां समष्टिरेकं महद्वनं भवति यथा वावान्तरजलाशयानां समष्टिरेको महान् जलाशयः।", "padacchedaText": "", "audioFile": "PB_hear2read_000048.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000049", "originalText": "एतदुपहितं वैश्वानरादीश्वरपर्यन्तं चैतन्यमपि अवान्तरवनावच्छिन्नाकाशवदवान्तरजलाशयगतप्रतिबिम्बाकाशवच्च एकमेव।", "padacchedaText": "", "audioFile": "PB_hear2read_000049.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000050", "originalText": "आभ्यां महाप्रपञ्चतदुपहितचैतन्याभ्यां तप्तायःपिण्डवदविविक्तं सदनुपहितं चैतन्यं ‘सर्वं खल्विदं ब्रह्म’ (छा. उ. ३. १४. १) इति (महा)वाक्यस्य वाच्यं भवति विविक्तं सल्लक्ष्यमपि भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_000050.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000051", "originalText": "एवं वस्तुन्यवस्त्वारोपोऽध्यारोपः सामान्येन प्रदर्शितः॥ १८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000051.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000052", "originalText": "तदानीमेतावीश्वरप्राज्ञौ चैतन्यप्रदीप्ताभिरतिसूक्ष्माभिरज्ञानवृत्तिभिरानन्दमनुभवतः ‘आनन्दभुक् चेतोमुखः प्राज्ञः’ (मां. उ. ५) इति श्रुतेः सुखमहमवाप्सम् न किञ्चिदवेदिषमित्युत्थितस्य परामर्शोपपत्तेश्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000052.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000053", "originalText": "अनयोः समष्टिव्यष्ट्योर्वनवृक्षयोरिव जलाशयजलयोरिव वा भेदः। एतदुपहितयोरीश्वरप्राज्ञयोरपि वनवृक्षावच्छिन्नाकाशयोरिव जलाशयजलगतप्रतिबिम्बाकाशयोरिव वा भेदः ‘एष सर्वेश्वर’ (मां. उ. ६) इत्यादिश्रुतेः॥ ८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000053.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000054", "originalText": "वनवृक्षतदवच्छिन्नाकाशयोर्जलाशयजलतद्गतप्रतिबिम्बाकाशयोर्वाऽऽधारभूताऽऽनुपहिताऽऽकाशवदनयोरज्ञानतदुपहितचैतन्ययोराऽऽधारभूतं यदनुपहितं चैतन्यं तत्तुरीयमित्युच्यते ‘शान्तं शिवमद्वैतं चतुर्थं मन्यन्ते’ (मां. उ. ७) इत्यादिश्रुतेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000054.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000055", "originalText": "इदमेव तुरीयं शुद्धचैतन्यमज्ञानादितदुपहितचैतन्याभ्यां तप्तायःपिण्डवदविविक्तं सन्महावाक्यस्य वाच्यं विविक्तं सल्लक्ष्यमिति चोच्यते॥ ९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000055.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000056", "originalText": "अस्याज्ञानस्यावरणविक्षेपनामकमस्ति शक्तिद्वयम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000056.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000057", "originalText": "आवरणशक्तिस्तावदल्पोऽपि मेघोऽनेकयोजनायतमादित्यमण्डलमवलोकयितृनयनपथपिधायकतया यथाऽऽच्छादयतीव तथाऽज्ञानं परिच्छिन्नमप्यात्मानमपरिच्छिन्नमसंसारिणमवलोकयितृबुद्धिपिधायकतयाऽऽच्छादयतीव तादृशं सामर्थ्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000057.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000058", "originalText": "तदुक्तं—\n‘घनच्छन्नदृष्टिर्घनच्छन्नमर्कं यथा मन्यते निष्प्रभं चातिमूढः। तथा बद्धवद्भाति यो मूढदृष्टेः स नित्योपलब्धिस्वरूपोऽहमात्मा॥", "padacchedaText": "", "audioFile": "PB_hear2read_000058.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000059", "originalText": "’ (हस्तामलकम् १०) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000059.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000060", "originalText": "अनया आवृतस्यात्मनः कर्तृत्वभोक्तृत्वसुखित्वदुःखित्वादिसंसारसम्भावनापि भवति यथा स्वाऽज्ञानेनावृतायां रज्ज्वां सर्पत्वसम्भावना।", "padacchedaText": "", "audioFile": "PB_hear2read_000060.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000061", "originalText": "विक्षेपशक्तिस्तु यथा रज्ज्वज्ञानं स्वावृतरज्जौ स्वशक्त्या सर्पादिकमुद्भावयत्येवमज्ञानमपि स्वावृतात्मनि स्वशक्त्याऽऽकाशादिप्रपञ्चमुद्भावयति तादृशं सामर्थ्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000061.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000062", "originalText": "तदुक्तम्— ‘विक्षेपशक्तिर्लिङ्गादि ब्रह्माण्डान्तं जगत् सृजेत्’ (वाक्यसुधा १३) इति॥ १०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000062.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000063", "originalText": "शक्तिद्वयवदज्ञानोपहितं चैतन्यं स्वप्रधानतया निमित्तं स्वोपाधिप्रधानतयोपादानं च भवति। यथा लूता तन्तुकार्यं प्रति स्वप्रधानतया निमित्तं स्वशरीरप्रधानतयोपादानञ्च भवति॥ ११॥", "padacchedaText": "", "audioFile": "PB_hear2read_000063.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000064", "originalText": "तमःप्रधानविक्षेपशक्तिमदज्ञानोपहितचैतन्यादाकाश आकाशाद्वायुर्वायोरग्निरग्नेरापोऽद्भ्यः पृथिवी चोत्पद्यते ‘एतस्मादात्मन आकाशः सम्भूतः’ (तै. उ. २. १. १) इत्यादिश्रुतेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000064.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000065", "originalText": "तेषु जाड्याधिक्यदर्शनात्तमःप्राधान्यं तत्कारणस्य।", "padacchedaText": "", "audioFile": "PB_hear2read_000065.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000066", "originalText": "तदानीं सत्त्वरजस्तमांसि कारणगुणप्रक्रमेण तेष्वाकाशादिषूत्पद्यन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000066.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000067", "originalText": "एतान्येव सूक्ष्मभूतानि तन्मात्राण्यपञ्चीकृतानि चोच्यन्ते। एतेभ्यः सूक्ष्मशरीराणि स्थूलभूतानि चोत्पद्यन्ते॥ १२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000067.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000068", "originalText": "सूक्ष्मशरीराणि सप्तदशावयवानि लिङ्गशरीराणि।", "padacchedaText": "", "audioFile": "PB_hear2read_000068.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000069", "originalText": "अवयवास्तु ज्ञानेन्द्रियपञ्चकं बुद्धिमनसी कर्मेन्द्रियपञ्चकं वायुपञ्चकं चेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000069.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000070", "originalText": "ज्ञानेन्द्रियाणि श्रोत्रत्वक्चक्षुर्जिह्वाघ्राणाख्यानि।", "padacchedaText": "", "audioFile": "PB_hear2read_000070.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000071", "originalText": "एतान्याकाशादीनां सात्त्विकांशेभ्यो व्यस्तेभ्यः पृथक् पृथक् क्रमेणोत्पद्यन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000071.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000072", "originalText": "बुद्धिर्नाम निश्चयात्मिकाऽन्तःकरणवृत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000072.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000073", "originalText": "मनो नाम सङ्कल्पविकल्पात्मिकान्तःकरणवृत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000073.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000074", "originalText": "अनयोरेव चित्ताहङ्कारयोरन्तर्भावः।", "padacchedaText": "", "audioFile": "PB_hear2read_000074.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000075", "originalText": "अनुसन्धानात्मिकान्तःकरणवृत्तिः चित्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000075.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000076", "originalText": "अभिमानात्मिकान्तःकरणवृत्तिः अहङ्कारः।", "padacchedaText": "", "audioFile": "PB_hear2read_000076.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000077", "originalText": "एते पुनराकाशादिगतसात्त्विकांशेभ्यो मिलितेभ्य उत्पद्यन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000077.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000078", "originalText": "एतेषां प्रकाशात्मकत् ip"}, {"id": "B_000110", "originalText": "एतौ सूत्रात्मतैजसौ तदानीं मनोवृत्तिभिः सूक्ष्मविषयाननुभवतः ‘प्रविविक्तभुक्तैजसः’ (मां. उ. ४) इत्यदिश्रुतेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000110.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000111", "originalText": "अत्रापि समष्टिव्यष्ट्योः तदुपहितसूत्रात्मतैजसयोः वनवृक्षवत्तदवच्छिन्नाकाशवच्च जलाशयजलवत्तद्गतप्रतिबिम्बाकाशवच्च अभेदः। एवं सूक्ष्मशरीरोत्पत्तिः॥ १४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000111.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000112", "originalText": "स्थूलभूतानि तु पञ्चीकृतानि।", "padacchedaText": "", "audioFile": "PB_hear2read_000112.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000113", "originalText": "पञ्चीकरणं त्वाकाशादिपञ्चस्वेकैकं द्विधा समं विभज्य तेषु दशसु भागेषु प्राथमिकान्पञ्चभागान्प्रत्येकं चतुर्धा समं विभज्य तेषां चतुर्णां भागानां स्वस्वद्वितीयार्धभागपरित्यागेन भागान्तरेषु योजनम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000113.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000114", "originalText": "तदुक्तम्—\n‘द्विधा विधाय चैकैकं चतुर्धा प्रथमं पुनः। स्वस्वेतरद्वितीयांशैर्योजनात्पञ्च पञ्चते॥", "padacchedaText": "", "audioFile": "PB_hear2read_000114.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000115", "originalText": "’ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000115.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000116", "originalText": "अस्याप्रामाण्यं नाशङ्कनीयं त्रिवृत्करणश्रुतेः पञ्चीकरणस्याप्युपलक्षणत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000116.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000117", "originalText": "पञ्चानां पञ्चात्मकत्वे समानेऽपि तेषु च ‘वैशेष्यात्तु तद्वादस्तद्वादः’ (ब्र. सू. २. ४. २२) इति न्यायेनाकाशादिव्यपदेशः सम्भवति। तदानीमाकाशे शब्दोऽभिव्यज्यते वायौ शब्दस्पर्शावग्नौ शब्दस्पर्शरूपाण्यप्सु शब्दस्पर्शरूपरसाः पृथिव्यां शब्दस्पर्शरूपरसगन्धाश्च॥ १५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000117.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000118", "originalText": ", "zipFile": "Vedantasara.zip"}, {"id": "B_000127", "originalText": "अस्याप्येषा व्यष्टिः स्थूलशरीरमन्नविकारत्वादेव हेतोरन्नमयकोशो जाग्रदिति चोच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000127.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000128", "originalText": "तदानीमेतौ विश्ववैश्वानरौ दिग्वातार्कवरुणाश्विभिः क्रमान्नियन्त्रितेन श्रोत्रादीन्द्रियपञ्चकेन क्रमाच्छब्दस्पर्शरूपरसगन्धानग्नीन्द्रोपेन्द्रयमप्रजापतिभिः क्रमान्नियन्त्रितेन वागादीन्द्रियपञ्चकेन क्रमाद्वचनादानगमनविसर्गानन्दान् चन्द्रचतुर्मुखशङ्कराच्युतैः क्रमान्नियन्त्रितेन मनोबुद्ध्यहङ्कारचित्ताख्येनान्तरेन्द्रियचतुष्केण क्रमात्सङ्कल्पनिश्चयाहङ्कार्यचैत्तांश्च सर्वानेतान् स्थूलविषयाननुभवतः ‘जागरितस्थानो बहिःप्रज्ञः’ (मां. उ. ३) इत्यादिश्रुतेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000128.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000129", "originalText": "अत्राप्यनयोः स्थूलव्यष्टिसमष्ट्योस्तदुपहितविश्ववैश्वानरयोश्च वनवृक्षवत्तदवच्छिन्नाकाशवच्च जलाशयजलवत्तद्गतप्रतिबिम्बाकाशवच्च पूर्ववदभेदः। एवं पञ्चीकृतपञ्चभूतेभ्यः स्थूलप्रपञ्चोत्पत्तिः॥ १७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000129.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000130", "originalText": "इदानीं प्रत्यगात्मनि इदमिदमयमयमारोपयतीति विशेषत उच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000130.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000131", "originalText": "अतिप्राकृतस्तु ‘आत्मा वै जायते पुत्रः’ इत्यादिश्रुतेः स्वस्मिन्निव पुत्रेऽपि प्रेमदर्शनात्पुत्रे पुष्टे नष्टे चाहमेव पुष्टो नष्टश्चेत्याद्यनुभवाच्च पुत्र आत्मेति वदति।", "padacchedaText": "", "audioFile": "PB_hear2read_000131.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000132", "originalText": "चार्वाकस्तु ‘स वा एष पुरुषोऽन्नरसमयः’ (तै. उ. २. १. १) इत्यादिश्रुतेः प्रदीप्तगृहात्स्वपुत्रं परित्यज्यापि स्वस्य निर्गमदर्शनात्स्थूलोऽहं कृशोऽहमित्याद्यनुभवाच्च स्थूलशरीरमात्मेति वदति।", "padacchedaText": "", "audioFile": "PB_hear2read_000132.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000133", "originalText": "अपरश्चार्वाकः ‘त }, {"id": "B_000140", "originalText": "एतेषां पुत्रादीनाम् अनात्मत्वमुच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000140.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000141", "originalText": "एतैः अतिप्राकृतादिवादिभिरुक्तेषु श्रुतियुक्त्यनुभवाभासेषु पूर्वपूर्वोक्तश्रुतियुक्त्यनुभवाभासानामुत्तरोत्ततरश्रुतियुक्त्यनुभवाभासैः अात्मत्वबाधदर्शनात्पुत्रादीनामनात्मत्वं स्पष्टमेव।", "padacchedaText": "", "audioFile": "PB_hear2read_000141.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000142", "originalText": "किञ्च ‘प्रत्यगस्थूलोऽचक्षुरप्राणोऽमना अकर्ता चैतन्यं चिन्मात्रं सत्’ इत्यादिप्रबलश्रुतिविरोधादस्य पुत्रादिशून्यपर्यन्तस्य जडस्य चैतन्यभास्यत्वेन घटादिवदनित्यत्वादहं ब्रह्मेति विद्वदनुभवप्राबल्याच्च तत्तच्छ्रुतियुक्त्यनुभवाभासानां बाधितत्वादपि पुत्रादिशून्यपर्यन्तमखिलमनात्मैव।", "padacchedaText": "", "audioFile": "PB_hear2read_000142.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000143", "originalText": "अतस्तत्तद्भासकं नित्यशुद्धबुद्धमुक्तसत्यस्वभावं प्रत्यक्चैतन्यमेवात्मवस्त्विति वेदान्तविद्वदनुभवः। एवमध्यारोपः॥ २०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000143.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000144", "originalText": "अपवादो नाम रज्जुविवर्तस्य सर्पस्य रज्जुमात्रत्ववत् वस्तुविवर्तस्यावस्तुनोऽज्ञानादेः प्रपञ्चस्य वस्तुमात्रत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000144.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000145", "originalText": "तदुक्तम्—\n‘सतत्त्वतोऽन्यथाप्रथा विकार इत्युदीरितः। अतत्त्वतोऽन्यथाप्रथा विवर्त इत्युदीरितः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000145.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000146", "originalText": "’ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000146.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000147", "originalText": "तथाहि एतद्भोगायतनं चतुर्विधसकलस्थूलशरीरजातं भोग्यरूपान्नपानादिकम् एतदायतनभूतभूरादिचतुर्दशभुवनानि एतदायतनभूतं ब्रह्माण्डं चैतत्सर्वमेतेषां कारणरूपं पञ्चीकृतभूतमात्रं भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_000147.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000148", "originalText": "एतानि शब्दादिविषयसहितानि पञ्चीकृतानि भूतानि सूक्ष्मशरीरजातं चैतत्सर्वमेतेषां कारणरूपापञ्चीकृतभूतमात्रं भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_000148.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000149", "originalText": "एतानि सत्त्वादिगुणसहितान्यपञ्चीकृतान्युत्पत्तिव्युत्क्रमेणैतत्कारणभूताज्ञानोपहितचैतन्यमात्रं भवति। एतदज्ञानमज्ञानोपहितं चैतन्यं चेश्वरादिकमेतदाधारभूतानुपहितचैतन्यरूपं तुरीयं ब्रह्ममात्रं भवति॥ २१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000149.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000150", "originalText": "आभ्यामध्यारोपापवादाभ्यां तत्त्वम्पदार्थशोधनमपि सिद्धं भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_000150.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000151", "originalText": "तथाहि— अज्ञानादिसमष्टिरेतदुपहितं सर्वज्ञत्वादिविशिष्टं चैतन्यम् एतदनुपहितं चैतत्त्रयं तप्तायःपिण्डवदेकत्वेनावभासमानं तत्पदवाच्यार्थो भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_000151.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000152", "originalText": "एतदुपाध्युपहिताधारभूतमनुपहितं चैतन्यं तत्पदलक्ष्यार्थो भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_000152.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000153", "originalText": "अज्ञानादिव्यष्टिः एतदुपहिताल्पज्ञत्वादिविशिष्टचैतन्यम् एतदनुपहितं चैतत्त्रयं तप्तायःपिण्डवदेकत्वेनावभासमानं त्वम्पदवाच्यार्थो भवति। एतदुपाध्युपहिताधारभूतमनुपहितं प्रत्यगानन्दं तुरीयं चैतन्यं त्वम्पदलक्ष्यार्थो भवति॥ २२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000153.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000154", "originalText": "अथ महावाक्यार्थो वर्ण्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000154.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000155", "originalText": "इदं तत्त्वमसिवाक्यं सम्बन्धत्रयेणाखण्डार्थबोधकं भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_000155.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000156", "originalText": "सम्बन्धत्रयं नाम पदयोः सामानाधिकरण्यं पदार्थयोर्विशेषणविशेष्यभावः प्रत्यगात्मलक्षणयोर्लक्ष्यलक्षणभावश्चेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000156.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000157", "originalText": "तदुक्तम्—\n‘सामानाधिकरण्यं च विशेषणविशेष्यता। लक्ष्यलक्षणसम्बन्धः पदार्थप्रत्यगात्मनाम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_000157.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000158", "originalText": "’ इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000158.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000159", "originalText": "सामानाधिकरण्यसम्बन्धस्तावद्यथा सोऽयं देवदत्त इत्यस्मिन्वाक्ये तत्कालविशिष्टदेवदत्तवाचकसशब्दस्य एतत्कालविशिष्टदेवदत्तवाचकायंशब्दस्य चैकस्मिन्पिण्डे तात्पर्यसम्बन्धः।", "padacchedaText": "", "audioFile": "PB_hear2read_000159.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000160", "originalText": "तथा च तत्त्वमसीति वाक्येऽपि परोक्षत्वादिविशिष्टचैतन्यवाचकतत्पदस्य अपरोक्षत्वादिविशिष्टचैतन्यवाचकत्वम्पदस्य चैकस्मिंश्चैतन्ये तात्पर्यसम्बन्धः।", "padacchedaText": "", "audioFile": "PB_hear2read_000160.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000161", "originalText": "विशेषणविशेष्यभावसम्बन्धस्तु यथा तत्रैव वाक्ये सशब्दार्थतत्कालविशिष्टदेवदत्तस्य अयंशब्दार्थैतत्कालविशिष्टदेवदत्तस्य चान्योन्यभेदव्यावर्तकतया विशेषणविशेष्यभावः।", "padacchedaText": "", "audioFile": "PB_hear2read_000161.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000162", "originalText": "तथात्रापि वाक्ये तत्पदार्थपरोक्षत्वादिविशिष्टचैतन्यस्य त्वम्पदार्थापरोक्षत्वादिविशिष्टचैतन्यस्य चान्योन्यभेदव्यावर्तकतया विशेषणविशेष्यभावः।", "padacchedaText": "", "audioFile": "PB_hear2read_000162.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000163", "originalText": "लक्ष्यलक्षणसम्बन्धस्तु यथा तत्रैव सशब्दायंशब्दयोस्तदर्थयोर्वा विरुद्धतत्कालैतत्कालविशिष्टत्वपरित्यागेनाविरुद्धदेवदत्तेन सह लक्ष्यलक्षणभावः।", "padacchedaText": "", "audioFile": "PB_hear2read_000163.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000164", "originalText": "तथात्रापि वाक्ये तत्त्वम्पदयोस्तदर्थयोर्वा विरुद्धपरोक्षत्वापरोक्षत्वादिविशिष्टत्वपरित्यागेनाविरुद्धचैतन्येन सह लक्ष्यलक्षणभावः। इयमेव भागलक्षणेत्युच्यते॥ २३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000164.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000165", "originalText": "अस्मिन्वाक्ये नीलमुत्पलमिति वाक्यवद्वाक्यार्थो न सङ्गच्छते।", "padacchedaText": "", "audioFile": "PB_hear2read_000165.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000166", "originalText": "तत्र तु नीलपदार्थनीलगुणस्योत्पलपदार्थोत्पलद्रव्यस्य च शौक्ल्यपटादिभेदव्यावर्तकतय अन्योन्यविशेषणविशेष्यरूपसंसर्गस्य अन्यतरविशिष्टस्यान्यतरस्य तदैक्यस्य वा वाक्यार्थत्वाङ्गीकारे प्रमाणान्तरविरोधाभावात्तद्वाक्यार्थः सङ्गच्छते।", "padacchedaText": "", "audioFile": "PB_hear2read_000166.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000167", "originalText": "अत्र तु तत्पदार्थपरोक्षत्वादिविशिष्टचैतन्यस्य त्वम्पदार्थापरोक्षत्वादिविशिष्टचैतन्यस्य चान्योन्यभेदव्यावर्तकतया विशेषणविशेष्यभावसंसर्गस्यान्यतरविशिष्टस्यान्यतरस्य तदैक्यस्य वा वाक्यार्थत्वाङ्गीकारे प्रत्यक्षादिप्रमाणविरोधाद्वाक्यार्थो न सङ्गच्छते।", "padacchedaText": "", "audioFile": "PB_hear2read_000167.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000168", "originalText": "तदुक्तम्—\n‘संसर्गो वा विशिष्टो वा वाक्यार्थो नात्र सम्मतः। अखण्डैकरसत्वेन वाक्यार्थो विदुषां मतः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000168.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000169", "originalText": "’ इति (पञ्चदशी ७. ७५)॥ २४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000169.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000170", "originalText": "अत्र गङ्गायां घोषः प्रतिवसति इतिवाक्यवज्जहल्लक्षणापि न सङ्गच्छते।", "padacchedaText": "", "audioFile": "PB_hear2read_000170.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000171", "originalText": "तत्र तु गङ्गाघोषयोराधाराधेयभावलक्षणस्य वाक्यार्थस्याशेषतो विरुद्धत्वाद्वाक्यार्थमशेषतः परित्यज्य तत्सम्बन्धितीरलक्षणाया युक्तत्वाज्जहल्लक्षणा सङ्गच्छते।", "padacchedaText": "", "audioFile": "PB_hear2read_000171.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000172", "originalText": "अत्र तु परोक्षापरोक्षचैतन्यैकत्वलक्षणस्य वाक्यार्थस्य भागमात्रे विरोधाद्भागान्तरमपि परित्यज्यान्यलक्षणाया अयुक्तत्वाज्जहल्लक्षणा न सङ्गच्छते।", "padacchedaText": "", "audioFile": "PB_hear2read_000172.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000173", "originalText": "न च गङ्गापदं स्वार्थपरित्यागेन तीरपदार्थं यथा लक्षयति तथा तत्पदं त्वम्पदं वा स्वार्थपरित्यागेन त्वम्पदार्थं तत्पदार्थं वा लक्षयत्वतः कुतो जहल्लक्षणा न सङ्गच्छत इति वाच्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000173.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000174", "originalText": "तत्र तीरपदाश्रवणेन तदर्थाप्रतीतौ लक्षणया तत्प्रतीत्यपेक्षायामपि तत्त्वम्पदयोः श्रूयमाणत्वेन तदर्थप्रतीतौ लक्षणया पुनरन्यतरपदेनान्यतरपदार्थप्रतीत्यपेक्षाभावात्॥ २५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000174.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000175", "originalText": "अत्र शोणो धावतीति वाक्यवदजहल्लक्षणापि न सम्भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_000175.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000176", "originalText": "तत्र शोणगुणगमनलक्षणस्य वाक्यार्थस्य विरुद्धत्वात्तदपरित्यागेन तदाश्रयाश्वादिलक्षणया तद्विरोधपरिहारसम्भवादजहल्लक्षणा सम्भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_000176.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000177", "originalText": "अत्र तु परोक्षत्वापरोक्षत्वादिविशिष्टचैतन्यैकत्वस्य वाक्यार्थस्य विरुद्धत्वात्तदपरित्यागेन तत्सम्बन्धिनो यस्य कस्यचिदर्थस्य लक्षितत्वेऽपि तद्विरोधपरिहारासम्भवादजहल्लक्षणा न सम्भवत्येव।", "padacchedaText": "", "audioFile": "PB_hear2read_000177.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000178", "originalText": "न च तत्पदं त्वम्पदं वा स्वार्थविरुद्धांशपरित्यागेनांशान्तरसहितं त्वम्पदार्थं तत्पदार्थं वा लक्षयत्वतः कथं प्रकारान्तरेण भागलक्षणाङ्गीकरणमिति वाच्यम्। एकेन पदेन स्वार्थांशपदार्थान्तरोभयलक्षणाया असम्भवात्पदान्तरेण तदर्थप्रतीतौ लक्षणया पुनस्तत्प्रतीत्यपेक्षाभावाच्च॥ २६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000178.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000179", "originalText": "तस्माद्यथा सोऽयं देवदत्त इति वाक्यं तदर्थो वा तत्कालैतत्कालविशिष्टदेवदत्तलक्षणस्य वाक्यार्थस्यांशे विरोधाद्विरुद्धतत्कालैतत्कालविशिष्टांशं परित्यज्याविरुद्धं देवदत्तांशमात्रं लक्षयति तथा तत्त्वमसीति वाक्यं तदर्थो वा परोक्षत्वापरोक्षत्वादिविशिष्टचैतन्यैकत्वलक्षणस्य वाक्यार्थस्यांशे विरोधाद्विरुद्धपरोक्षत्वापरोक्षत्वविशिष्टांशं परित्यज्याविरुद्धमखण्डचैतन्यमात्रं लक्षयतीति॥ २७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000179.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000180", "originalText": "अथाधुना ‘अहं ब्रह्मास्मि’ (बृ. उ. १. ४. १०) इत्यनुभववाक्यार्थो वर्ण्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000180.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000181", "originalText": "एवमाचार्येणाध्यारोपापवादपुरःसरं तत्त्वम्पदार्थौ शोधयित्वा वाक्येनाखण्डार्थेऽवबोधितेऽधिकारिणोऽहं नित्यशुद्धबुद्धमुक्तसत्यस्वभावपरमानन्दानन्ताद्वयं ब्रह्मास्मीत्यखण्डाकाराकारिता चित्तवृत्तिरुदेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000181.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000182", "originalText": "सा तु चित्प्रतिबिम्बसहिता सती प्रत्यगभिन्नमज्ञातं परम्ब्रह्म विषयीकृत्य तद्गताज्ञानमेव बाधते तदा पटकारणतन्तुदाहे पटदाहवदखिलकारणेऽज्ञाने बाधिते सति तत्कार्यस्याखिलस्य बाधितत्वात्तदन्तर्भूताखण्डाकाराकारिता चित्तवृत्तिरपि बाधिता भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_000182.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000183", "originalText": "तत्र प्रतिबिम्बितं चैतन्यमपि यथा दीपप्रभाऽऽदित्यप्रभाऽवभासनाऽसमर्था सती तयाऽभिभूता भवति तथा स्वयम्प्रकाशमानप्रत्यगभिन्नपरब्रह्माऽवभासनाऽनर्हतया तेनाभिभूतं सत् स्वोपाधिभूताखण्डवृत्तेर्बाधितत्वाद्दर्पणाभावे मुखप्रतिबिम्बस्य मुखमात्रत्ववत्प्रत्यगभिन्नपरब्रह्ममात्रं भवति॥ २८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000183.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000184", "originalText": "एवं च सति ‘मनसैवानुद्रष्टव्यम्’ (बृ. उ. ४. ४. १९) ‘यन्मनसा न मनुते’ (के. उ. १. ६) इत्यनयोः श्रुत्योरविरोधो वृत्तिव्याप्यत्वाङ्गीकारेण फलव्याप्यत्वप्रतिषेधप्रतिपादनात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000184.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000185", "originalText": "तदुक्तम्—\n‘फलव्याप्यत्वमेवास्य शास्त्रकृद्भिर्निवारितम्। ब्रह्मण्यज्ञाननाशाय वृत्तिव्याप्तिरपेक्षिता॥", "padacchedaText": "", "audioFile": "PB_hear2read_000185.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000186", "originalText": "’ इति (पञ्चदशी ६. ९०)।", "padacchedaText": "", "audioFile": "PB_hear2read_000186.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000187", "originalText": "‘स्वयम्प्रकाशमानत्वान्नाभास उपयुज्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000187.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000188", "originalText": "’ इति च (पञ्चदशी ६. ९२)।", "padacchedaText": "", "audioFile": "PB_hear2read_000188.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000189", "originalText": "जडपदार्थाकाराकारितचित्तवृत्तेर्विशेषोऽस्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000189.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000190", "originalText": "यथा दीपप्रभामण्डलमन्धकारगतं घटपटादिकं विषयीकृत्य तद्गतान्धकारनिरसनपुरःसरं स्वप्रभया तदपि भासयतीति।", "padacchedaText": "", "audioFile": "PB_hear2read_000190.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000191", "originalText": "तथाहि— अयं घट इति घटाकाराकारितचित्तवृत्तिरज्ञातं घटं विषयीकृत्य तद्गताज्ञाननिरसनपुरःसरं स्वगतचिदाभासेन जडं घटमपि भासयति।", "padacchedaText": "", "audioFile": "PB_hear2read_000191.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000192", "originalText": "तदुक्तम्—\n‘बुद्धितत्स्थचिदाभासौ द्वावपि व्याप्नुतो घटम्। तत्राज्ञानं धिया नश्येदाभासेन घटः स्फुरेत्॥", "padacchedaText": "", "audioFile": "PB_hear2read_000192.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000193", "originalText": "’ इति। (पञ्चदशी ७. ९१)॥ २९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000193.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000194", "originalText": "एवं भूतस्वस्वरूपचैतन्यसाक्षात्कारपर्यन्तं श्रवणमनननिदिध्यासनसमाध्यनुष्ठानस्यापेक्षितत्वात् तेऽपि प्रदर्श्यन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000194.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000195", "originalText": "श्रवणं नाम षड्विधलिङ्गैरशेषवेदान्तानामद्वितीयवस्तुनि तात्पर्यावधारणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000195.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000196", "originalText": "लिङ्गानि तूपक्रमोपसंहाराभ्यासापूर्वताफलार्थवादोपपत्त्याख्यानि।", "padacchedaText": "", "audioFile": "PB_hear2read_000196.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000197", "originalText": "तदुक्तम्—\n‘उपक्रमोपसंहारावभ्यासोऽपूर्वता फलम्। अर्थवादोपपत्ती च लिङ्गं तात्पर्यनिर्णये॥", "padacchedaText": "", "audioFile": "PB_hear2read_000197.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000198", "originalText": "’ प्रकरणप्रतिपाद्यस्यार्थस्य तदाद्यन्तयोरुपपादनमुपक्रमोपसंहारौ।", "padacchedaText": "", "audioFile": "PB_hear2read_000198.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000199", "originalText": "यथा छान्दोग्ये षष्ठाध्याये प्रकरणप्रतिपाद्यस्याद्वितीयवस्तुन ‘एकमेवाद्वितीयम्’ (छा. उ. ६. २. १) इत्यादौ ‘ऐतदात्म्यमिदं सर्वम्’ (छा. उ. ६. ८. ७) इत्यन्ते च प्रतिपादनम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000199.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000200", "originalText": "प्रकरणप्रतिपाद्यस्य वस्तुनस्तन्मध्ये पौनःपुन्येन प्रतिपादनमभ्यासः।", "padacchedaText": "", "audioFile": "PB_hear2read_000200.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000201", "originalText": "यथा तत्रैवाद्वितीयवस्तुनि मध्ये तत्त्वमसीति नवकृत्वः प्रतिपादनम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000201.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000202", "originalText": "प्रकरणप्रतिपाद्यस्याद्वितीयवस्तुनः प्रमाणान्तराविषयीकरणमपूर्वता।", "padacchedaText": "", "audioFile": "PB_hear2read_000202.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000203", "originalText": "यथा तत्रैवाद्वितीयवस्तुनो मानान्तराविषयीकरणम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000203.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000204", "originalText": "फलं तु प्रकरणप्रतिपाद्यस्यात्मज्ञानस्य तदनुष्ठानस्य वा तत्र तत्र श्रूयमाणं प्रयोजनम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000204.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000205", "originalText": "यथा तत्र ‘आचार्यवान्पुरुषो वेद तस्य तावदेव चिरं यावन्न विमोक्ष्येऽथ सम्पत्स्ये’ (छा. उ. ६. १४. २) इत्यद्वितीयवस्तुज्ञानस्य तत्प्राप्तिः प्रयोजनं श्रूयते।", "padacchedaText": "", "audioFile": "PB_hear2read_000205.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000206", "originalText": "प्रकरणप्रतिपाद्यस्य तत्र तत्र प्रशंसनमर्थवादः।", "padacchedaText": "", "audioFile": "PB_hear2read_000206.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000207", "originalText": "यथा तत्रैव ‘उत तमादेशमप्राक्ष्यो येनाश्रुतं श्रुतं भवत्यमतं मतमविज्ञातं विज्ञातम्’ (छा. उ. ६. १. ३) इत्यद्वितीयवस्तुप्रशंसनम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000207.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000208", "originalText": "प्रकरणप्रतिपाद्यार्थसाधने तत्र तत्र श्रूयमाणा युक्तिरुपपत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000208.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000209", "originalText": "यथा तत्र ‘यथा सौम्यैकेन मृत्पिण्डेन सर्वं मृन्मयं विज्ञातं स्याद्वाचारम्भणं विकारो नामधेयं मृत्तिकेत्येव सत्यम्’ (छा. उ. ६. १. ४) इत्यादावद्वितीयवस्तुसाधने विकारस्य वाचारम्भणमात्रत्वे युक्तिः श्रूयते।", "padacchedaText": "", "audioFile": "PB_hear2read_000209.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000210", "originalText": "मननं तु श्रुतस्याद्वितीयवस्तुनो वेदान्तानुगुणयुक्तिभिरनवरतमनुचिन्तनम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000210.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000211", "originalText": "विजातीयदेहादिप्रत्ययरहिताद्वितीयवस्तुसजातीयप्रत्ययप्रवाहो निदिध्यासनम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000211.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000212", "originalText": "समाधिर्द्विविधः सविकल्पको निर्विकल्पश्चेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000212.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000213", "originalText": "तत्र सविकल्पको नाम ज्ञातृज्ञानादिविकल्पलयानपेक्षया अद्वितीयवस्तुनि तदाकाराकारितायाश्चित्तवृत्तेरवस्थानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000213.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000214", "originalText": "तदा मृन्मयगजादिभानेऽपि मृद्भानवद्द्वैतभानेऽप्यद्वैतं वस्तु भासते।", "padacchedaText": "", "audioFile": "PB_hear2read_000214.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000215", "originalText": "तदुक्तम्—\n‘दृशिस्वरूपं गगनोपमं परम् सकृद्विभातं त्वजमेकमक्षरम्। अलेपकं सर्वगतं यदद्वयम् तदेव चाहं सततं विमुक्तमोम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_000215.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000216", "originalText": "’ इति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000216.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000217", "originalText": "(उपदेशसाहस्री ७३. १०. १)।", "padacchedaText": "", "audioFile": "PB_hear2read_000217.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000218", "originalText": "निर्विकल्पकस्तु ज्ञातृज्ञानादिविकल्पलयापेक्षया अद्वितीयवस्तुनि तदाकाराकारितायाश्चित्तवृत्तेः अतितरामेकीभावेनावस्थानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000218.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000219", "originalText": "तदा तु जलाकाराकारितलवणानवभासेन जलमात्रावभासवदद्वितीयवस्त्वाकाराकारितचित्तवृत्त्यनवभासेनाद्वितीयवस्तुमात्रम् अवभासते।", "padacchedaText": "", "audioFile": "PB_hear2read_000219.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000220", "originalText": "ततश्चास्य सुषुप्तेश्चाभेदशङ्का न भवति। उभयत्र वृत्त्यभाने समानेऽपि तत्सद्भावासद्भावमात्रेणानयोर्भेदोपपत्तेः॥ ३०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000220.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000221", "originalText": "अस्याङ्गानि यमनियमासनप्राणायामप्रत्याहारधारणाध्यानसमाधयः।", "padacchedaText": "", "audioFile": "PB_hear2read_000221.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000222", "originalText": "तत्र ‘अहिंसासत्यास्तेयब्रह्मचर्यापरिग्रहा यमाः’।", "padacchedaText": "", "audioFile": "PB_hear2read_000222.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000223", "originalText": "‘शौचसन्तोषतपःस्वाध्यायेश्वरप्रणिधानानि नियमाः’।", "padacchedaText": "", "audioFile": "PB_hear2read_000223.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000224", "originalText": "‘करचरणादिसंस्थानविशेषलक्षणानि पद्मस्वस्तिकादीन्यासनानि’।", "padacchedaText": "", "audioFile": "PB_hear2read_000224.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000225", "originalText": "‘रेचकपूरककुम्भकलक्षणाः प्राणनिग्रहोपायाः प्राणायामाः’।", "padacchedaText": "", "audioFile": "PB_hear2read_000225.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000226", "originalText": "‘इन्द्रियाणां स्वस्वविषयेभ्यः प्रत्याहरणं प्रत्याहारः’।", "padacchedaText": "", "audioFile": "PB_hear2read_000226.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000227", "originalText": "‘अद्वितीयवस्तुनि अन्तरिन्द्रियधारणं धारणा’।", "padacchedaText": "", "audioFile": "PB_hear2read_000227.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000228", "originalText": "‘तत्राद्वितीयवस्तुनि विच्छिद्य विच्छिद्यान्तरिन्द्रियवृत्तिप्रवाहो ध्यानम्’। समाधिस्तूक्तः सविकल्पक एव॥ ३१॥", "padacchedaText": "", "audioFile": "PB_hear2read_000228.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000229", "originalText": "एवमस्याङ्गिनो निर्विकल्पकस्य लयविक्षेपकषायरसास्वादलक्षणाश्चत्वारो विघ्नाः सम्भवन्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000229.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000230", "originalText": "लयस्तावदखण्डवस्त्वनवलम्बनेन चित्तवृत्तेर्निद्रा।", "padacchedaText": "", "audioFile": "PB_hear2read_000230.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000231", "originalText": "अखण्डवस्त्वनवलम्बनेन चित्तवृत्तेरन्यावलम्बनं विक्षेपः।", "padacchedaText": "", "audioFile": "PB_hear2read_000231.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000232", "originalText": "लयविक्षेपाभावेऽपि चित्तवृत्तेः रागादिवासनया स्तब्धीभावादखण्डवस्त्वनवलम्बनं कषायः।", "padacchedaText": "", "audioFile": "PB_hear2read_000232.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000233", "originalText": "अखण्डवस्त्वनवलम्बनेनापि चित्तवृत्तेः सविकल्पकानन्दास्वादनं रसास्वादः। समाध्यारम्भसमये सविकल्पकानन्दास्वादनं वा॥ ३२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000233.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000234", "originalText": "अनेन विघ्नचतुष्टयेन विरहितं चित्तं निर्वातदीपवदचलं सदखण्डचैतन्यमात्रमवतिष्ठते यदा तदा निर्विकल्पकः समाधिरित्युच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000234.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000235", "originalText": "यदुक्तम्—\n‘लये सम्बोधयेच्चितं विक्षिप्तं शमयेत्पुनः। सकषायं विजानीयात्समप्राप्तं न चालयेत्॥", "padacchedaText": "", "audioFile": "PB_hear2read_000235.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000236", "originalText": "नास्वादयेद्रसं तत्र निःसङ्गः प्रज्ञया भवेत्’ (गौडपादकारिका ३. ४४—४५) इति च, ‘यथा दीपो निवातस्थो नेङ्गते सोपमा स्मृता’ (भ. गी. ६. १९) इति च॥ ३३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000236.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000237", "originalText": "अथ जीवन्मुक्तलक्षणमुच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000237.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000238", "originalText": "जीवन्मुक्तो नाम स्वस्वरूपाखण्डब्रह्मज्ञानेन तदज्ञानबाधनद्वारा स्वस्वरूपाखण्डब्रह्मणि साक्षात्कृतेऽज्ञानतत्कार्यसञ्चितकर्मसंशयविपर्ययादीनामपि बाधितत्वादखिलबन्धरहितो ब्रह्मनिष्ठः।", "padacchedaText": "", "audioFile": "PB_hear2read_000238.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000239", "originalText": "‘भिद्यते हृदयग्रन्थिश्छिद्यन्ते सर्वसंशयाः। क्षीयन्ते चास्य कर्माणि तस्मिन्दृष्टे परावरे॥", "padacchedaText": "", "audioFile": "PB_hear2read_000239.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000240", "originalText": "’ (मुं. उ. २. २. ९) इत्यादिश्रुतेः॥ ३४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000240.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000241", "originalText": "अयं तु व्युत्थानसमये मांसशोणितमूत्रपुरीषादिभाजनेन शरीरेणान्ध्यमान्द्यापटुत्वादिभाजनेन इन्द्रियग्रामेणाशनापिपासाशोकमोहादिभाजनेनान्तःकरणेन च पूर्वपूर्ववासनया क्रियमाणानि कर्माणि भुज्यमानानि ज्ञानाविरुद्धारब्धफलानि च पश्यन्नपि बाधितत्वात्परमार्थतो न पश्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000241.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000242", "originalText": "यथेन्द्रजालमिति ज्ञानवांस्तदिन्द्रजालं पश्यन्नपि परमार्थमिदमिति न पश्यति।", "padacchedaText": "", "audioFile": "PB_hear2read_000242.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000243", "originalText": "‘सचक्षुरचक्षुरिव सकर्णोऽकर्ण इव’ इत्यादिश्रुतेः। उक्तञ्च—\n‘सुषुप्तवज्जाग्रति यो न पश्यति द्वयं च पश्यन्नपि चाद्वयत्वतः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000243.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000244", "originalText": "तथा च कुर्वन्नपि निष्क्रियश्च यः स आत्मविन्नान्य इतीह निश्चयः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000244.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000245", "originalText": "’ इति (उपदेशसाहस्री ५)॥ ३५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000245.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000246", "originalText": "अस्य ज्ञानात्पूर्वं विद्यमानानामेवाहारविहारादीनामनुवृत्तिवच्छुभवासनानामेवानुवृत्तिर्भवति शुभाशुभयोरौदासीन्यं वा।", "padacchedaText": "", "audioFile": "PB_hear2read_000246.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000247", "originalText": "तदुक्तम्—\n‘बुद्धाद्वैतसतत्त्वस्य यथेष्टाचराणं यदि। शुनां तत्त्वदृशाञ्चैव को भेदोऽशुचिभक्षणे॥", "padacchedaText": "", "audioFile": "PB_hear2read_000247.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000248", "originalText": "’ इति (नैष्कर्म्यसिद्धिः ४. ६२), ‘ब्रह्मवित्तं तथा मुक्त्वा स आत्मज्ञो न चेतरः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000248.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000249", "originalText": "’ इति च (उपदेशसाहस्री ११५)॥ ३६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000249.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000250", "originalText": "तदानीममानित्वादीनि ज्ञानसाधनान्यद्वेष्ट्टत्वादयः सद्गुणाश्चालङ्कारवदनुवर्तन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000250.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000251", "originalText": "तदुक्तम्—\n‘उत्पन्नात्मावबोधस्य ह्यद्वेष्ट्टत्वादयो गुणाः। अयत्नतो भवन्त्यस्य न तु साधनरूपिणः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000251.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000252", "originalText": "’ इति (नैष्कर्म्यसिद्धिः ४. ६९)॥ ३७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000252.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000253", "originalText": "किं बहुनायं देहयात्रामात्रार्थमिच्छानिच्छापरेच्छाप्रापितानि सुखदुःखलक्षणान्यारब्धफलान्यनुभवन्नन्तःकरणाभासादीनाम् अवभासकः संस्तदवसाने प्रत्यगानन्दपरब्रह्मणि प्राणे लीने सत्यज्ञानतत्कार्यसंस्काराणामपि विनाशात्परमकैवल्यमानन्दैकरसमखिलभेदप्रतिभासरहितम् अखण्डब्रह्मावतिष्ठते।", "padacchedaText": "", "audioFile": "PB_hear2read_000253.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000254", "originalText": "‘न तस्य प्राणा उत्क्रामन्ति’ (बृ. उ. ४. ४. ६), ‘अत्रैव समवनीयन्ते’ (बृ. उ. ३. २. ११), ‘विमुक्तश्च विमुच्यते’ (क. उ. ५. १) इत्यादिश्रुतेः॥ ३८॥॥", "padacchedaText": "", "audioFile": "PB_hear2read_000254.mp3", "zipFile": "Vedantasara.zip"}, {"id": "B_000255", "originalText": "इति श्रीमत्परमहंसपरिव्राजकाचार्य—सदानन्दयोगीन्द्र—विरचितो वेदान्तसारनामको ग्रन्थः समाप्तः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000255.mp3", "zipFile": "Vedantasara.zip"}];

        };
        
        const playPauseBtn = document.getElementById('play-pause-btn');
        playPauseBtn.onclick = () => {
            if (isPlaying) {
                audioEl.pause();
                isPlaying = false;
                playPauseBtn.innerText = "Resume";
            } else {
                playAudio(Math.max(0, currentIndex));
                playPauseBtn.innerText = "Stop";
            }
        };
        
        manifest.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'sentence';
            div.id = 'sentence-' + index;
            
            const idSpan = document.createElement('span');
            idSpan.className = 'sentence-id';
            idSpan.innerText = '[' + item.id + ']';
            
            const textSpan = document.createElement('span');
            textSpan.innerText = item.originalText;
            
            div.appendChild(idSpan);
            div.appendChild(textSpan);
            
            div.onclick = () => {
                playPauseBtn.innerText = "Stop";
                playAudio(index);
            };
            contentDiv.appendChild(div);
        });
        
        // --- HTML5 Audio Prefetching Logic (via Blob URLs) ---
        const PREFETCH_BUFFER_SIZE = 3;
        let prefetchQueue = new Map(); // index -> Blob URL

        function getAudioUrl(index) {
            if (index < 0 || index >= manifest.length) return null;
            const item = manifest[index];
            const zipToUse = item.zipFile || ZIP_NAME;
            return WORKER_URL + '/' + BUCKET_NAME + '/' + zipToUse + '/' + item.audioFile;
        }

        async function fetchBlobUrl(url) {
            const response = await fetch(url);
            if (!response.ok) throw new Error("HTTP " + response.status);
            const blob = await response.blob();
            return URL.createObjectURL(blob);
        }

        async function prefetchNext(fromIndex) {
            for (let i = fromIndex + 1; i <= fromIndex + PREFETCH_BUFFER_SIZE; i++) {
                if (i >= manifest.length) break;
                if (!prefetchQueue.has(i)) {
                    prefetchQueue.set(i, 'fetching');
                    const url = getAudioUrl(i);
                    try {
                        const blobUrl = await fetchBlobUrl(url);
                        if (prefetchQueue.get(i) === 'fetching') {
                            prefetchQueue.set(i, blobUrl);
                        } else {
                            URL.revokeObjectURL(blobUrl);
                        }
                    } catch (err) {
                        console.error("Prefetch failed for index", i, err);
                        prefetchQueue.delete(i);
                    }
                }
            }
            // Cleanup old blobs to free memory
            for (let [key, val] of prefetchQueue.entries()) {
                if (key < fromIndex) {
                    if (typeof val === 'string' && val.startsWith('blob:')) {
                        URL.revokeObjectURL(val);
                    }
                    prefetchQueue.delete(key);
                }
            }
        }
        // ------------------------

        async function playAudio(index) {
            if (index < 0 || index >= manifest.length) {
                isPlaying = false;
                playPauseBtn.innerText = "Start Reading";
                return;
            }
            
            if (currentIndex >= 0) {
                const prevDiv = document.getElementById('sentence-' + currentIndex);
                if (prevDiv) prevDiv.classList.remove('active');
            }
            
            currentIndex = index;
            
            const currentDiv = document.getElementById('sentence-' + currentIndex);
            if (currentDiv) {
                currentDiv.classList.add('active');
                currentDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            
            audioEl.pause();
            
            try {
                let audioUrl;
                if (prefetchQueue.has(index) && prefetchQueue.get(index) !== 'fetching') {
                    audioUrl = prefetchQueue.get(index);
                } else {
                    const sourceUrl = getAudioUrl(index);
                    audioUrl = await fetchBlobUrl(sourceUrl);
                }
                
                audioEl.src = audioUrl;
                audioEl.playbackRate = speedSlider.value;
                audioEl.onended = () => { playAudio(currentIndex + 1); };
                
                await audioEl.play();
                isPlaying = true;
                
            } catch (e) {
                console.error("Audio play error:", e);
                // Fallback to next track if error
                setTimeout(() => playAudio(currentIndex + 1), 500);
            }
            
            // Trigger prefetch for upcoming sentences
            prefetchNext(index);
        }
    </script>
</body>
</html>
